[workspace]
members = [
    "crates/action-catalog",
    "crates/action-provider",
    "crates/action-store",
    "crates/agent-context",
    "crates/cerebro-platform",
    "crates/control-kernel",
    "crates/organizational-graph",
    "crates/organizational-model",
    "crates/organizational-store",
    "crates/platform-engine",
    "crates/platform-sdk",
    "crates/policy-catalog",
    "crates/security-lifecycle",
    "crates/slack-authority",
    "crates/source-catalog",
    "crates/security-path-kernel",
    "crates/source-runtime-next",
    "internal/graphagent/staticvalidator",
    "internal/mitre/evaluator",
    "internal/sourcecoverage/evaluator",
    "internal/sourceprojection/panopticonresources",
    "internal/sourceruntime/eventadmission",
    "internal/sourceruntime/recordkernel",
    "internal/wasmguest",
    "tools/graphactiongen",
    "tools/policycataloggen",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93.1"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8.9"
async-nats = "0.50.0"
async-trait = "0.1.91"
aws-config = { version = "=1.8.18", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-lc-rs = "1.17.3"
aws-credential-types = "=1.2.14"
aws-sdk-secretsmanager = { version = "=1.108.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sigv4 = { version = "=1.4.5", default-features = false, features = ["http1", "sign-http"] }
aws-smithy-async = "=1.2.14"
aws-smithy-runtime-api = { version = "=1.12.3", features = ["client"] }
aws-smithy-runtime-api-macros = "=1.0.0"
aws-smithy-types = "=1.5.0"
base64 = "0.22.1"
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
cerebro-agent-context = { version = "0.1.0", path = "crates/agent-context" }
cerebro-action-catalog = { version = "0.1.0", path = "crates/action-catalog" }
cerebro-action-provider = { version = "0.1.0", path = "crates/action-provider" }
cerebro-action-store = { version = "0.1.0", path = "crates/action-store" }
cerebro-control-kernel = { version = "0.1.0", path = "crates/control-kernel" }
cerebro-organizational-graph = { version = "0.1.0", path = "crates/organizational-graph" }
cerebro-organizational-model = { version = "0.1.0", path = "crates/organizational-model" }
cerebro-organizational-store = { version = "0.1.0", path = "crates/organizational-store" }
cerebro-platform-engine = { version = "0.1.0", path = "crates/platform-engine" }
cerebro-platform-sdk = { version = "0.1.0", path = "crates/platform-sdk" }
cerebro-policy-catalog = { version = "0.1.0", path = "crates/policy-catalog" }
cerebro-security-lifecycle = { version = "0.1.0", path = "crates/security-lifecycle" }
cerebro-slack-authority = { version = "0.1.0", path = "crates/slack-authority" }
cerebro-source-catalog = { version = "0.1.0", path = "crates/source-catalog" }
cerebro-source-runtime-next = { version = "0.1.0", path = "crates/source-runtime-next" }
cerebro-wasm-guest = { version = "0.1.0", path = "internal/wasmguest" }
ciborium = "0.2.2"
connectrpc = { git = "https://github.com/connectrpc/connect-rust.git", rev = "8b3c3b05d3b54af547477a9e3b3a77d62f68e229", version = "=0.8.1", features = ["axum"] }
libc = "0.2.180"
futures-util = "0.3.31"
hmac = "0.13.0"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
prost = "0.14.4"
prost-types = "0.14.4"
regex = { version = "1.12.3", default-features = false, features = ["perf", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
stats_alloc = "0.1.10"
neo4rs = "0.8.0"
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.42", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tower = "0.5.3"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# The workspace's release artifacts include embedded WebAssembly modules.
# Favor small, deterministic binaries over incremental release build speed.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.cerebro-sourceruntime-eventadmission]
opt-level = 3
