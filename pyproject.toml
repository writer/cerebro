[project]
name = "cerebro"
version = "0.1.0"
description = "Security System of Record with Append-Only History & CEL Rule Support"
authors = [{name = "Developer", email = "developer@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "asyncpg>=0.29.0",
    "snowflake-connector-python>=3.6.0",
    "snowflake-sqlalchemy>=1.5.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "cel-python>=0.4.0",
    "httpx>=0.25.2,<0.28",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "boto3>=1.34.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-compute>=1.15.0",
    "google-cloud-iam>=2.12.2",
    "google-cloud-resource-manager>=1.10.4",
    "google-auth>=2.23.4",
    "google-api-python-client>=2.154.0",
    "pygithub>=2.1.1",
    "structlog>=23.2.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "redis>=5.0.1",
    "celery>=5.3.4",
    "flower>=2.0.1",
    "cryptography>=41.0.0",
    "cachetools>=5.3.0",
    "google-cloud-kms>=2.21.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-keys>=4.9.0",
    "azure-mgmt-storage>=21.1.0",
    "azure-storage-blob>=12.18.0",
    "hvac>=2.1.0",
    "msal>=1.24.0",
    "aiofiles>=23.2.0",
    "aiosqlite>=0.19.0",
    "annoy>=1.17.3",
    "sqlparse>=0.4.4",
    "networkx>=3.1",
    "python-dateutil>=2.8.2",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    # Claude Code SDK integration
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.40.0",
    "openai-agents>=0.2.0",
    "openai>=1.52.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "sse-starlette>=1.8.2",
    "greenlet>=3.0.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1.2",
    "slack-sdk>=3.37.0",
    "aiohttp>=3.10.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "moto>=5.0.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.1",
    "flake8>=6.1.0",
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
    "fakeredis>=2.21.0",
]

[project.scripts]
cerebro = "cerebro.cli.main:app"

[project.urls]
Homepage = "https://github.com/WriterInternal/cerebro"
Repository = "https://github.com/WriterInternal/cerebro"
Issues = "https://github.com/WriterInternal/cerebro/issues"
Documentation = "https://github.com/WriterInternal/cerebro/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Relaxed settings - these cause many errors but don't catch real bugs
# TODO: Gradually enable these as type coverage improves
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true
no_implicit_reexport = false
show_error_codes = true

# Ignore missing imports for third-party packages without stubs
[[tool.mypy.overrides]]
module = [
    "celpy.*",
    "boto3.*",
    "botocore.*",
    "google.cloud.*",
    "googleapiclient.*",
    "azure.*",
    "hvac.*",
    "msal.*",
    "pygithub.*",
    "aiofiles.*",
    "yaml.*",
    "snowflake.*",
    "pandas.*",
    "cachetools.*",
    "celery.*",
    "kombu.*",
    "slowapi.*",
    "anthropic.*",
    "openai.*",
    "sqlparse.*",
    "passlib.*",
    "jose.*",
    "sklearn.*",
    "psutil.*",
    "networkx.*",
    "dateutil.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "S",  # flake8-bandit (security)
    "T20", # flake8-print
    "UP", # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101", # Use of assert
    "S104", # Binding to all interfaces
    "T201", # Print statements (allow in scripts)
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]  # Allow asserts and hardcoded passwords in tests
"scripts/**/*.py" = ["T201"]  # Allow print statements in scripts

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/cerebro",
    "src/claude_agent_sdk",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/cerebro",
    "src/claude_agent_sdk",
    "README.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests (in-process ASGI)",
    "e2e_slow: marks tests as slow end-to-end tests",
    "e2e_agent: marks tests as agent-focused end-to-end tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["src/cerebro"]
omit = [
    "*/tests/*",
    "*/migrations/*", 
    "*/scripts/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
