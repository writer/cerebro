[project]
name = "cerebro"
version = "0.1.0"
description = "Security System of Record with Append-Only History & CEL Rule Support"
authors = [{name = "Developer", email = "developer@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "asyncpg>=0.29.0",
    "snowflake-connector-python>=3.6.0",
    "snowflake-sqlalchemy>=1.5.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "cel-python>=0.4.0",
    "httpx>=0.25.2,<0.28",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "boto3>=1.34.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-compute>=1.15.0",
    "google-cloud-iam>=2.12.2",
    "google-cloud-resource-manager>=1.10.4",
    "google-auth>=2.23.4",
    "google-api-python-client>=2.154.0",
    "pygithub>=2.1.1",
    "structlog>=23.2.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "redis>=5.0.1",
    "celery>=5.3.4",
    "flower>=2.0.1",
    "cryptography>=41.0.0",
    "cachetools>=5.3.0",
    "google-cloud-kms>=2.21.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-keys>=4.9.0",
    "azure-mgmt-storage>=21.1.0",
    "azure-storage-blob>=12.18.0",
    "hvac>=2.1.0",
    "msal>=1.24.0",
    "aiofiles>=23.2.0",
    "aiosqlite>=0.19.0",
    "annoy>=1.17.3",
    "sqlparse>=0.4.4",
    "networkx>=3.1",
    "python-dateutil>=2.8.2",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    # Claude Code SDK integration
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.40.0",
    "openai-agents>=0.2.0",
    "openai>=1.52.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "sse-starlette>=1.8.2",
    "greenlet>=3.0.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1.2",
    "slack-sdk>=3.37.0",
    "aiohttp>=3.10.5",
    "starlette==0.49.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "moto>=5.0.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.1",
    "flake8>=6.1.0",
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
    "fakeredis>=2.21.0",
]

[project.scripts]
cerebro = "cerebro.cli.main:app"

[project.urls]
Homepage = "https://github.com/WriterInternal/cerebro"
Repository = "https://github.com/WriterInternal/cerebro"
Issues = "https://github.com/WriterInternal/cerebro/issues"
Documentation = "https://github.com/WriterInternal/cerebro/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Stricter settings enabled for better type safety
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
disallow_untyped_calls = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
no_implicit_reexport = true
show_error_codes = true

# Ignore missing imports for third-party packages without stubs
[[tool.mypy.overrides]]
module = [
    "celpy.*",
    "boto3.*",
    "botocore.*",
    "google.cloud.*",
    "google.iam.*",
    "googleapiclient.*",
    "azure.*",
    "hvac.*",
    "msal.*",
    "pygithub.*",
    "aiofiles.*",
    "yaml.*",
    "snowflake.*",
    "pandas.*",
    "pyarrow.*",
    "cachetools.*",
    "celery.*",
    "kombu.*",
    "slowapi.*",
    "anthropic.*",
    "openai.*",
    "sqlparse.*",
    "passlib.*",
    "jose.*",
    "sklearn.*",
    "psutil.*",
    "networkx.*",
    "dateutil.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "S",  # flake8-bandit (security)
    "T20", # flake8-print
    "UP", # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101", # Use of assert
    "S104", # Binding to all interfaces
    "T201", # Print statements (allow in scripts)
    "B008", # Function call in default argument (FastAPI Depends pattern)
    "S311", # Standard pseudo-random generators (fine for non-crypto)
    "S608", # SQL injection (false positives - we use parameterized queries)
    "E402", # Module level import not at top (intentional for lazy loading)
    "RUF012", # Mutable class attributes (Pydantic models handle this)
]

[tool.ruff.lint.per-file-ignores]
# Test files
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "B017", "E501"]
"scripts/**/*.py" = ["T201"]

# Security false positives (enum values, config names, masking)
"src/cerebro/auditability/timestamping.py" = ["S324"]  # SHA1 for RFC 3161
"src/cerebro/agents/memory_utils.py" = ["S324"]  # SHA1 for content hashing
"src/cerebro/core/config.py" = ["S105"]
"src/cerebro/analysis/secrets/catalog.py" = ["S105"]  # Enum values
"src/cerebro/api/routers/auth.py" = ["S105", "S106"]
"src/cerebro/api/routers/email.py" = ["S105"]
"src/cerebro/api/routers/webhooks.py" = ["S105"]
"src/cerebro/integrations/kandji.py" = ["S105", "S106"]
"src/cerebro/integrations/sentinelone.py" = ["S105", "S106"]
"src/cerebro/ocsf/models.py" = ["S105"]
"src/cerebro/core/security/jwt.py" = ["S107"]
"src/cerebro_sdk/auth.py" = ["S106", "S107"]
"src/cerebro/compliance/control_tests.py" = ["S105", "S108"]

# Intentional exception handling patterns
"src/cerebro/analytics/sql_dialect.py" = ["S110"]
"src/cerebro/analysis/identity_anomaly.py" = ["S112"]
"src/cerebro/compliance/evidence_store.py" = ["S112"]
"src/cerebro/api/routers/compliance_unified.py" = ["S108"]
"src/cerebro/agents/self_service.py" = ["UP031"]  # SQL parameter placeholders

# Type alias definitions using Union/Optional (can't be auto-converted)
"src/cerebro/compliance/common/schemas.py" = ["UP045"]  # Optional in dict values
"src/cerebro/findings/producers/base.py" = ["UP007"]  # Union type alias
"src/cerebro_sdk/streaming.py" = ["UP007"]  # Union type alias

# Long string literals (compliance definitions, SQL examples, email templates)
"src/cerebro/compliance/frameworks.py" = ["E501"]
"src/cerebro/compliance/frameworks/iso27001_provider.py" = ["E501"]
"src/cerebro/compliance/frameworks/soc2_provider.py" = ["E501"]
"src/cerebro/compliance/requirement_mapper.py" = ["E501"]
"src/cerebro/compliance/reporting_analytics.py" = ["E501"]  # HTML template strings
"src/cerebro/rules/library.py" = ["E501"]
"src/cerebro/notifications/email.py" = ["E501", "RUF001"]  # ℹ️ emoji is intentional
"src/cerebro/notifications/slack.py" = ["S105", "E501"]
"src/cerebro/notifications/webhooks.py" = ["S105"]
"src/cerebro/query/schema.py" = ["E501"]
"src/cerebro/cli/commands/query.py" = ["E501"]
"src/cerebro/agents/tools/nl_query.py" = ["E501"]
"src/cerebro/agents/tools/query.py" = ["E501"]
"src/cerebro/agents/tools/smart_summarizer.py" = ["E501"]
"src/cerebro/agents/tools/identity_anomaly_hunter.py" = ["E501"]
"src/cerebro/analytics/identity_analytics.py" = ["E501"]
"src/cerebro/api/routers/query.py" = ["E501"]
"src/cerebro/attack_path/service_identity.py" = ["S105", "E501"]
"src/cerebro/testing/advanced_tests.py" = ["E501"]
"src/cerebro/testing/test_registry.py" = ["S106", "E501"]
"src/cerebro/providers/tables/m365_tables.py" = ["E501"]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/cerebro",
    "src/claude_agent_sdk",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/cerebro",
    "src/claude_agent_sdk",
    "README.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests (in-process ASGI)",
    "e2e_slow: marks tests as slow end-to-end tests",
    "e2e_agent: marks tests as agent-focused end-to-end tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["src/cerebro"]
omit = [
    "*/tests/*",
    "*/migrations/*", 
    "*/scripts/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
