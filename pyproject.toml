[project]
name = "cerebro"
version = "0.1.0"
description = "Security System of Record with Append-Only History & CEL Rule Support"
authors = [{name = "Developer", email = "developer@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "cel-python>=0.4.0",
    "httpx>=0.25.2",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "boto3>=1.34.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-compute>=1.15.0",
    "google-cloud-iam>=2.12.2",
    "google-cloud-resource-manager>=1.10.4",
    "google-auth>=2.23.4",
    "pygithub>=2.1.1",
    "structlog>=23.2.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "redis>=5.0.1",
    "celery>=5.3.4",
    "flower>=2.0.1",
    "cryptography>=41.0.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.1",
    "flake8>=6.1.0",
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
cerebro = "cerebro.cli.main:app"

[project.urls]
Homepage = "https://github.com/haasonsaas/cerebro"
Repository = "https://github.com/haasonsaas/cerebro"
Issues = "https://github.com/haasonsaas/cerebro/issues"
Documentation = "https://github.com/haasonsaas/cerebro/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
