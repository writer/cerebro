# CloudQuery Configuration
# Docs: https://www.cloudquery.io/docs
#
# This config syncs cloud assets to Snowflake for analysis.
# Run: cloudquery sync config/cloudquery.yml

kind: source
spec:
  name: aws
  path: cloudquery/aws
  registry: cloudquery
  version: "v27.0.0"
  tables: ["*"]
  destinations: ["snowflake"]
  spec:
    # Uses AWS_PROFILE or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from env
    regions:
      - us-east-1
      - us-west-2

---
kind: source
spec:
  name: gcp
  path: cloudquery/gcp
  registry: cloudquery
  version: "v16.0.0"
  tables: ["*"]
  destinations: ["snowflake"]
  spec:
    # Uses GOOGLE_APPLICATION_CREDENTIALS from env
    project_ids: []  # Empty = all projects the service account can access

---
kind: source
spec:
  name: azure
  path: cloudquery/azure
  registry: cloudquery
  version: "v15.0.0"
  tables: ["*"]
  destinations: ["snowflake"]
  spec:
    # Uses AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET from env
    subscriptions: []  # Empty = all subscriptions

---
kind: source
spec:
  name: k8s
  path: cloudquery/k8s
  registry: cloudquery
  version: "v12.0.0"
  tables:
    - k8s_core_pods
    - k8s_core_namespaces
    - k8s_core_services
    - k8s_core_secrets
    - k8s_core_configmaps
    - k8s_core_service_accounts
    - k8s_networking_ingresses
    - k8s_networking_network_policies
    - k8s_rbac_cluster_roles
    - k8s_rbac_cluster_role_bindings
    - k8s_rbac_roles
    - k8s_rbac_role_bindings
    - k8s_apps_deployments
    - k8s_apps_daemonsets
    - k8s_apps_statefulsets
    - k8s_apps_replicasets
    - k8s_batch_jobs
    - k8s_batch_cron_jobs
  destinations: ["snowflake"]
  spec:
    # Uses KUBECONFIG or in-cluster config
    # For multiple clusters, specify contexts:
    # contexts:
    #   - name: "production"
    #   - name: "staging"

---
# GitHub - DevSecOps scanning
kind: source
spec:
  name: github
  path: cloudquery/github
  registry: cloudquery
  version: "v11.0.0"
  tables:
    - github_repositories
    - github_repository_branches
    - github_repository_dependabot_alerts
    - github_repository_dependabot_secrets
    - github_code_scanning_alerts
    - github_secret_scanning_alerts
    - github_actions_workflows
    - github_actions_workflow_runs
    - github_organizations
    - github_organization_members
    - github_teams
    - github_team_members
  destinations: ["snowflake"]
  spec:
    # Uses GITHUB_TOKEN from env
    orgs:
      - "${GITHUB_ORG}"

---
# AWS SageMaker/Bedrock - AI Security
kind: source
spec:
  name: aws-ai
  path: cloudquery/aws
  registry: cloudquery
  version: "v27.0.0"
  tables:
    - aws_sagemaker_endpoints
    - aws_sagemaker_endpoint_configurations
    - aws_sagemaker_notebook_instances
    - aws_sagemaker_models
    - aws_sagemaker_training_jobs
    - aws_bedrock_custom_models
    - aws_bedrock_model_customization_jobs
    - aws_bedrock_provisioned_model_throughputs
  destinations: ["snowflake"]
  spec:
    regions:
      - us-east-1
      - us-west-2

---
# Okta - Identity Provider
kind: source
spec:
  name: okta
  path: cloudquery/okta
  registry: cloudquery
  version: "v5.0.0"
  tables:
    - okta_users
    - okta_groups
    - okta_group_members
    - okta_applications
    - okta_application_users
    - okta_policies
    - okta_trusted_origins
  destinations: ["snowflake"]
  spec:
    # Uses OKTA_API_TOKEN and OKTA_DOMAIN from env
    domain: "${OKTA_DOMAIN}"

---
kind: destination
spec:
  name: snowflake
  path: cloudquery/snowflake
  registry: cloudquery
  version: "v7.0.0"
  spec:
    connection_string: "${SNOWFLAKE_CONNECTION_STRING}"
    database: CEREBRO
    schema: RAW
