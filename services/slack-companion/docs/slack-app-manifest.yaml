display_information:
  name: Cerebro
  description: Nothing is beyond our reach
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Cerebro
    always_online: false
  slash_commands:
    - command: /cerebro
      description: Work with Cerebro findings and runtime state
      usage_hint: "findings | health | ask <question> | evidence <runtime-id> <finding-id>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - files:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - pins:read
      - reactions:read
      - reactions:write
      - search:read.files
      - search:read.public
      - search:read.users
      - usergroups:read
      - users:read
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
