# AI provider governance connector definitions.
# Entries are sorted by source_id for deterministic review.
entries:
  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-cerebras
      tenant_id: builtin_catalog
      source_id: cerebras
      display_name: Cerebras
      description: "Cerebras connector definition for projects, API keys, usage reports, and model deployments."
      categories:
        - ai
        - governance
      auth:
        model: bearer_token
        credential_fields:
          - key: token
            secret: true
            reference_only: true
      transport:
        base_url: "https://api.cerebras.ai"
        verification:
          method: GET
          path: /v1/models
          expect_status: [200]
      resource_families:
        - id: projects
          label: Projects
          path: /v1/projects
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          name_field: name
          event:
            kind: cerebras.projects
            schema_ref: cerebras/projects/v1
          projection:
            template: asset
          coverage:
            - id: projects
              type: entity_family
              title: Projects
              families: [projects]
              support: partial
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [asset_inventory]
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: api_keys
          label: API keys
          path: /v1/api-keys
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          name_field: name
          event:
            kind: cerebras.api_keys
            schema_ref: cerebras/api_keys/v1
          projection:
            template: secret
          coverage:
            - id: api_keys
              type: app_entitlement
              title: API keys
              families: [api_keys]
              support: partial
              high_value: true
              evidence_types: [identity_configuration]
              control_domains: [identity_access]
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: usage_reports
          label: Usage reports
          path: /v1/usage
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: cerebras.usage_reports
            schema_ref: cerebras/usage_reports/v1
          projection:
            template: asset
          coverage:
            - id: usage_reports
              type: entity_family
              title: Usage reports
              families: [usage_reports]
              support: partial
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [asset_inventory]
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: model_deployments
          label: Model deployments
          path: /v1/deployments
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          name_field: name
          event:
            kind: cerebras.model_deployments
            schema_ref: cerebras/model_deployments/v1
          projection:
            template: deployment
          coverage:
            - id: model_deployments
              type: deployment_state
              title: Model deployments
              families: [model_deployments]
              support: partial
              high_value: true
              evidence_types: [change_management]
              control_domains: [secure_delivery]
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100

