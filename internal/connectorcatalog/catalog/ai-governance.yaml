# AI provider governance sources.
# Entries are sorted by source_id for deterministic review.
entries:
  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-anthropic
      tenant_id: builtin_catalog
      source_id: anthropic
      display_name: Anthropic
      description: "Anthropic connector definition for models, organization members, API keys, workspaces, and organization invites."
      categories:
        - ai
        - governance
      auth:
        model: api_key
        token_header: x-api-key
        credential_fields:
          - key: api_key
            label: API key
            secret: true
            reference_only: true
      transport:
        base_url: "https://api.anthropic.com"
        headers:
          anthropic-version: "2023-06-01"
        verification:
          method: GET
          path: /v1/models
          expect_status: [200]
      resource_families:
        - id: model_catalog
          label: Model catalog
          path: /v1/models
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          name_field: display_name
          event:
            kind: anthropic.model_catalog
            schema_ref: anthropic/model_catalog/v1
          projection:
            template: asset
          coverage:
            - id: model_catalog
              type: entity_family
              title: Model catalog
              families: [model_catalog]
              support: partial
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [asset_inventory]
          pagination:
            type: none
            disable_page_size: true
        - id: organization_members
          label: Organization members
          path: /v1/organizations/users
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          name_field: email
          event:
            kind: anthropic.organization_members
            schema_ref: anthropic/organization_members/v1
          projection:
            template: identity_user
          coverage:
            - id: organization_members
              type: entity_family
              title: Organization members
              families: [organization_members]
              support: partial
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [asset_inventory, identity_access]
          pagination:
            type: cursor
            cursor_param: after_id
            cursor_json_path: "$.last_id"
            page_size_param: limit
            page_size: 100
        - id: api_keys
          label: API keys
          path: /v1/organizations/api_keys
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          name_field: name
          event:
            kind: anthropic.api_keys
            schema_ref: anthropic/api_keys/v1
          projection:
            template: secret
          coverage:
            - id: api_keys
              type: app_entitlement
              title: API keys
              families: [api_keys]
              support: partial
              high_value: true
              evidence_types: [identity_configuration]
              control_domains: [identity_access]
          pagination:
            type: cursor
            cursor_param: after_id
            cursor_json_path: "$.last_id"
            page_size_param: limit
            page_size: 100
        - id: workspaces
          label: Workspaces
          path: /v1/organizations/workspaces
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          name_field: name
          event:
            kind: anthropic.workspaces
            schema_ref: anthropic/workspaces/v1
          projection:
            template: asset
          coverage:
            - id: workspaces
              type: entity_family
              title: Workspaces
              families: [workspaces]
              support: partial
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [asset_inventory]
          pagination:
            type: cursor
            cursor_param: after_id
            cursor_json_path: "$.last_id"
            page_size_param: limit
            page_size: 100
        - id: organization_invites
          label: Organization invites
          path: /v1/organizations/invites
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          name_field: email
          event:
            kind: anthropic.organization_invites
            schema_ref: anthropic/organization_invites/v1
          projection:
            template: identity_user
          coverage:
            - id: organization_invites
              type: app_entitlement
              title: Organization invites
              families: [organization_invites]
              support: partial
              high_value: true
              evidence_types: [identity_configuration]
              control_domains: [identity_access]
          pagination:
            type: cursor
            cursor_param: after_id
            cursor_json_path: "$.last_id"
            page_size_param: limit
            page_size: 100

  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-aws-bedrock
      tenant_id: builtin_catalog
      source_id: aws_bedrock
      display_name: AWS Bedrock
      description: "AWS Bedrock connector definition for foundation models, custom models, provisioned throughput, customization jobs, and guardrails."
      categories:
        - ai
        - governance
      config_fields:
        - key: region
          label: AWS region
          required: true
          placeholder: us-east-1
        - key: service
          label: AWS signing service
          required: true
          help: "Use bedrock for AWS Bedrock control-plane APIs."
          placeholder: bedrock
      auth:
        model: aws_sigv4
        credential_fields:
          - key: access_key
            label: Access key ID
            secret: true
            reference_only: true
          - key: secret_key
            label: Secret access key
            secret: true
            reference_only: true
      transport:
        base_url: "https://bedrock.${config.region}.amazonaws.com"
        verification:
          method: GET
          path: /foundation-models
          expect_status: [200]
      resource_families:
        - id: foundation_models
          label: Foundation models
          path: /foundation-models
          method: GET
          record_selector: "$.modelSummaries[*]"
          id_field: modelId
          name_field: modelName
          event:
            kind: aws_bedrock.foundation_models
            schema_ref: aws_bedrock/foundation_models/v1
          projection:
            template: asset
          coverage:
            - id: foundation_models
              type: entity_family
              title: Foundation models
              families: [foundation_models]
              support: partial
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [asset_inventory]
          pagination:
            type: none
            disable_page_size: true
        - id: custom_models
          label: Custom models
          path: /custom-models
          method: GET
          record_selector: "$.modelSummaries[*]"
          id_field: modelArn
          name_field: modelName
          event:
            kind: aws_bedrock.custom_models
            schema_ref: aws_bedrock/custom_models/v1
          projection:
            template: asset
          coverage:
            - id: custom_models
              type: entity_family
              title: Custom models
              families: [custom_models]
              support: partial
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [asset_inventory]
          pagination:
            type: cursor
            cursor_param: nextToken
            cursor_json_path: "$.nextToken"
            page_size_param: maxResults
            page_size: 100
        - id: provisioned_model_throughputs
          label: Provisioned model throughputs
          path: /provisioned-model-throughputs
          method: GET
          record_selector: "$.provisionedModelSummaries[*]"
          id_field: provisionedModelArn
          name_field: provisionedModelName
          event:
