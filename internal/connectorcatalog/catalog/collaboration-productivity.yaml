# Collaboration, productivity, project, and design connector definitions.
# Entries are sorted by source_id for deterministic review.
entries:
  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-airtable
      tenant_id: builtin_catalog
      source_id: airtable
      display_name: Airtable
      description: "Airtable connector definition catalog entry for high-value security and operations resources."
      categories:
        - saas
        - collaboration
      auth:
        model: bearer_token
        credential_fields:
          - key: token
            secret: true
            reference_only: true
      transport:
        base_url: "https://api.airtable.com"
        verification:
          method: GET
          path: /v0/meta/bases
          expect_status: [200]
      resource_families:
        - id: users
          label: Users
          path: /v1/users
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: airtable.users
            schema_ref: airtable/users/v1
          projection:
            template: identity_user
          coverage:
            - id: users
              type: entity_family
              title: Users
              families: [users]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: projects
          label: Projects
          path: /v1/projects
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: airtable.projects
            schema_ref: airtable/projects/v1
          projection:
            template: asset
          coverage:
            - id: projects
              type: entity_family
              title: Projects
              families: [projects]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: audit_events
          label: "Audit events"
          path: /v1/audit/events
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: airtable.audit_events
            schema_ref: airtable/audit_events/v1
          projection:
            template: audit_event
          coverage:
            - id: audit_events
              type: audit_event
              title: "Audit events"
              families: [audit_events]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
