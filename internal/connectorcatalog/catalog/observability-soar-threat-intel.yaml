# SIEM, observability, SOAR, endpoint detection, and threat-intelligence connector definitions.
# Entries are sorted by source_id for deterministic review.
entries:
  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-abuseipdb
      tenant_id: builtin_catalog
      source_id: abuseipdb
      display_name: "AbuseIPDB"
      description: "AbuseIPDB connector definition catalog entry for high-value security and operations resources."
      categories:
        - threat_intel
        - security
      auth:
        model: api_key
        credential_fields:
          - key: api_key
            secret: true
            reference_only: true
      transport:
        base_url: "https://api.abuseipdb.com/api/v2"
        verification:
          method: GET
          path: /blacklist
          expect_status: [200]
      resource_families:
        - id: reports
          label: Reports
          path: /reports
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: abuseipdb.reports
            schema_ref: abuseipdb/reports/v1
          projection:
            template: finding
          coverage:
            - id: reports
              type: remediation_state
              title: "Reports"
              families: [reports]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: ip_addresses
          label: IP addresses
          path: /ip-addresses
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: abuseipdb.ip_addresses
            schema_ref: abuseipdb/ip_addresses/v1
          projection:
            template: asset
          coverage:
            - id: ip_addresses
              type: entity_family
              title: "IP addresses"
              families: [ip_addresses]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: audit_events
          label: Audit events
          path: /audit-events
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: abuseipdb.audit_events
            schema_ref: abuseipdb/audit_events/v1
          projection:
            template: audit_event
          coverage:
            - id: audit_events
              type: audit_event
              title: "Audit events"
              families: [audit_events]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100

