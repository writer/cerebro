        id: secrets
        support: partial
        title: Apikey
        type: entity_family
      default_enabled: true
      event:
        kind: n_auth.apikey
        required_payload_fields:
        - apikey
        schema_ref: n_auth/apikey/v1
        urn_kind: n_apikey
      event_kind: apikey
      id: apikey
      id_field: apikey
      label: Apikey
      list_key: apikeys
      method: GET
      name_field: description
      pagination:
        type: none
      path: "/apikeys/"
      permissions_needed:
      - api_key
      - role_id
      projection:
        fields:
          id: apikey
          name: description
          secret_id: apikey
          secret_name: description
          secret_type: apikey
        template: secret
      record_selector: "$.apikeys[*]"
