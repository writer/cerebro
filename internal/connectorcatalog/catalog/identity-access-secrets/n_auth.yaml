      key: serverid
      label: Serverid
      required: true
    description: API for the nextAuth server
    display_name: nextAuth
    id: builtin_catalog-n_auth
    resource_families:
    - coverage:
      - families:
        - apikey
        high_value: true
        evidence_types:
