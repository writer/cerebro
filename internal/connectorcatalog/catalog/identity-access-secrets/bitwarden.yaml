entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - identity_access_secrets
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects members, groups, collections, policies, and event logs from the Bitwarden Public API and projects them into the Cerebro graph as users, groups, policies, assets, and audit events for identity, access, and secret-management context.
      display_name: Bitwarden
      id: builtin-bitwarden
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: bitwarden.users
            required_payload_fields:
              - id
            schema_ref: bitwarden/users/v1
            urn_kind: bitwarden_users
          id: users
          id_field: id
          label: Members
          method: GET
          name_field: email
          pagination:
            cursor_json_path: $.continuationToken
            cursor_param: continuationToken
            type: cursor
          path: /public/members
          projection:
            fields:
              display_name: name
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          default_enabled: true
          event:
            kind: bitwarden.groups
            required_payload_fields:
              - id
            schema_ref: bitwarden/groups/v1
            urn_kind: bitwarden_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.continuationToken
            cursor_param: continuationToken
            type: cursor
          path: /public/groups
          projection:
            fields:
              group_id: id
              group_name: name
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - security_operations
              evidence_types:
                - configuration_state
              families:
                - policies
              high_value: true
              id: policies
              support: partial
              title: Policies
              type: lifecycle_state
          default_enabled: true
          event:
            kind: bitwarden.policies
            required_payload_fields:
              - id
              - type
            schema_ref: bitwarden/policies/v1
            urn_kind: bitwarden_policies
          id: policies
          id_field: id
          label: Policies
          method: GET
          name_field: type
          pagination:
            cursor_json_path: $.continuationToken
            cursor_param: continuationToken
            type: cursor
          path: /public/policies
          projection:
            fields:
              policy_id: id
              policy_name: type
              policy_status: enabled
              policy_type: type
            template: policy
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - collections
              high_value: true
              id: collections
              support: partial
              title: Collections
              type: entity_family
          default_enabled: true
          event:
            kind: bitwarden.collections
            required_payload_fields:
              - id
            schema_ref: bitwarden/collections/v1
            urn_kind: bitwarden_collections
          id: collections
          id_field: id
          label: Collections
          method: GET
          name_field: externalId
          pagination:
            cursor_json_path: $.continuationToken
            cursor_param: continuationToken
            type: cursor
          path: /public/collections
          projection:
            fields:
              id: id
              name: externalId
              resource_id: id
              resource_name: externalId
              resource_type: collection
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: bitwarden.audit_events
            required_payload_fields:
              - type
              - date
            schema_ref: bitwarden/audit_events/v1
            urn_kind: bitwarden_audit_events
          id: audit_events
          id_field: date
          label: Audit events
          method: GET
          name_field: type
          pagination:
            cursor_json_path: $.continuationToken
            cursor_param: continuationToken
            type: cursor
          path: /public/events
          projection:
            fields:
              actor_id: actingUserId
              event_type: type
              id: date
              resource_id: itemId
              resource_type: object
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: bitwarden
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /public/organization/subscription
