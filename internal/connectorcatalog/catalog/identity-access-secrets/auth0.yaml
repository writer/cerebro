entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            reference_only: true
            secret: true
        model: oauth_client_credentials
        scopes:
          - read:users
          - read:roles
          - read:logs
        token_params:
          audience: https://${config.domain}/api/v2/
        token_url: https://${config.domain}/oauth/token
      categories:
        - identity
        - access
      config_fields:
        - help: Auth0 tenant domain used for Management API requests.
          key: domain
          label: Tenant domain
          placeholder: example.us.auth0.com
          required: true
      description: Collects users, roles, and audit events from Auth0 and projects them into the Cerebro graph as users, groups, and audit events for identity, access, device, and secret context.
      display_name: Auth0
      id: builtin-auth0
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Identity users
              type: entity_family
          event:
            kind: auth0.users
            required_payload_fields:
              - user_id
            schema_ref: auth0/users/v1
            urn_kind: auth0_users
          id: users
          id_field: user_id
          label: Users
          method: GET
          name_field: name
          pagination:
            page_param: page
            page_size: 100
            page_size_param: per_page
            type: page
          path: /users
          projection:
            fields:
              display_name: name
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: user_id
            template: identity_user
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - roles
              high_value: true
              id: roles
              support: partial
              title: Identity roles
              type: entity_family
          event:
            kind: auth0.roles
            required_payload_fields:
              - id
            schema_ref: auth0/roles/v1
            urn_kind: auth0_roles
          id: roles
          id_field: id
          label: Roles
          method: GET
          name_field: name
          pagination:
            page_param: page
            page_size: 100
            page_size_param: per_page
            type: page
          path: /roles
          projection:
            fields:
              description: description|summary
              group_email: group_email|email
              group_id: id
              group_name: name
            template: identity_group
          record_selector: $[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: auth0.audit_events
            required_payload_fields:
              - log_id
            schema_ref: auth0/audit_events/v1
            urn_kind: auth0_audit_events
          id: audit_events
          id_field: log_id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $[-1].log_id
            cursor_param: from
            page_size: 100
            page_size_param: take
            type: cursor
          path: /logs
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: log_id
            template: audit_event
          record_selector: $[*]
      schema_version: cerebro.integration/v1
      source_id: auth0
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.domain}/api/v2
        verification:
          expect_status:
            - 200
          method: GET
          path: /users
