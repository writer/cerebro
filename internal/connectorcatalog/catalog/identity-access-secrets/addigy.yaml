entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            label: API key
            reference_only: true
            required: true
            secret: true
        model: api_key
        requires_references: true
      categories:
        - saas
        - identity_access_secrets
      config_fields:
        - help: Addigy API v2 base URL.
          key: base_url
          label: API base URL
          required: false
        - help: Addigy organization id for organization users and end-user groups.
          key: organization_id
          label: Organization ID
          required: false
      description: Collects devices, organization users, end-user groups, policies, and system events from the Addigy API v2 and projects them into the Cerebro graph as assets, users, groups, policies, and audit events for Apple device management context.
      display_name: Addigy
      id: builtin-addigy
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
                - endpoint_security
              evidence_types:
                - source_snapshot
              families:
                - devices
              high_value: true
              id: devices
              support: partial
              title: Devices
              type: entity_family
          default_enabled: true
          event:
            kind: addigy.devices
            required_payload_fields:
              - agentid
            schema_ref: addigy/devices/v1
            urn_kind: addigy_devices
          id: devices
          id_field: agentid
          label: Devices
          method: POST
          name_field: facts.device_name.value|facts.host_name.value|facts.serial_number.value|agentid
          pagination:
            cursor_json_path: $.metadata.page
            cursor_param: page
            page_size: 100
            page_size_param: per_page
            type: page
          path: /devices
          projection:
            fields:
              id: agentid
              name: facts.device_name.value|facts.host_name.value|facts.serial_number.value|agentid
              resource_id: agentid
              resource_name: facts.device_name.value|facts.host_name.value|facts.serial_number.value|agentid
              resource_type: device
              serial_number: facts.serial_number.value
            template: asset
          record_selector: $.items[*]
        - coverage:
            - control_domains:
                - identity_access
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Organization users
              type: entity_family
          default_enabled: true
          event:
            kind: addigy.users
            required_payload_fields:
              - email
            schema_ref: addigy/users/v1
            urn_kind: addigy_users
          id: users
          id_field: email
          label: Organization users
          method: POST
          name_field: name|email
          pagination:
            cursor_json_path: $.metadata.page
            cursor_param: page
            page_size: 100
            page_size_param: per_page
            type: page
          path: /o/{organization_id}/users/query
          projection:
            fields:
              addigy_role: addigy_role
              display_name: name
              email: email
              user_id: email
            template: identity_user
          read:
            path_params:
              - organization_id
          record_selector: $.items[*]
        - coverage:
            - control_domains:
                - identity_access
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: End-user groups
              type: entity_family
          default_enabled: true
          event:
            kind: addigy.groups
            required_payload_fields:
              - id
            schema_ref: addigy/groups/v1
            urn_kind: addigy_groups
          id: groups
          id_field: id
          label: End-user groups
          method: POST
          name_field: display_name|external_id|id
          pagination:
            cursor_json_path: $.metadata.page
            cursor_param: page
            page_size: 100
            page_size_param: per_page
            type: page
          path: /o/{organization_id}/end-users/groups/query
          projection:
            fields:
              group_id: id
              group_name: display_name|external_id|id
            template: identity_group
          read:
            path_params:
              - organization_id
          record_selector: $.items[*]
        - coverage:
            - control_domains:
                - endpoint_security
                - security_operations
              evidence_types:
                - configuration_state
              families:
                - policies
              high_value: true
              id: policies
              support: partial
              title: Policies
              type: lifecycle_state
          default_enabled: true
          event:
            kind: addigy.policies
            required_payload_fields:
              - policyId
            schema_ref: addigy/policies/v1
            urn_kind: addigy_policies
          id: policies
          id_field: policyId
          label: Policies
          method: POST
          name_field: name|policyId
          path: /oa/policies/query
          projection:
            fields:
              policy_id: policyId
              policy_name: name|policyId
              policy_status: configured
              policy_type: device_policy
            template: policy
          record_selector: $[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: System events
              type: audit_event
          default_enabled: true
          event:
            kind: addigy.audit_events
            required_payload_fields:
              - event_id
            schema_ref: addigy/audit_events/v1
            urn_kind: addigy_audit_events
          id: audit_events
          id_field: event_id
          label: System events
          method: POST
          name_field: action.name|source|event_id
          pagination:
            cursor_json_path: $.metadata.page
            cursor_param: page
            page_size: 100
            page_size_param: per_page
            type: page
          path: /system-events/search
          projection:
            fields:
              actor_id: action_sender.identifier|action_sender.name
              actor_name: action_sender.name
              event_type: action.name|source|level
              id: event_id
              resource_id: action.entity.identifier|action_receiver.identifier|event_id
              resource_name: action.entity.name|action_receiver.name
              resource_type: action.entity.type|action_receiver.type
              source_event_id: event_id
            template: audit_event
          record_selector: $.items[*]
      schema_version: cerebro.integration/v1
      source_id: addigy
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.addigy.com/api/v2
        verification:
          expect_status:
            - 200
          method: POST
          path: /devices
