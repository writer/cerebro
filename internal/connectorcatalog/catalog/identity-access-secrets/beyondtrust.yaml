entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-beyondtrust
    tenant_id: builtin_catalog
    source_id: beyondtrust
    display_name: BeyondTrust
    description: "Collects users, secrets, and audit events from BeyondTrust and projects them into the Cerebro graph as users, secrets, and audit events for identity, access, device, and secret context."
    categories:
    - identity
    - secrets
    auth:
      model: oauth_client_credentials
      token_url: https://${config.tenant_url}/oauth/token
      credential_fields:
      - key: client_id
        reference_only: true
      - key: client_secret
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.tenant_url}
      verification:
        method: GET
        path: "/BeyondTrust/api/public/v3/Auth/Verify"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: beyondtrust.users
        schema_ref: beyondtrust/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Identity users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: secrets
      label: Secrets
      path: "/v1/secrets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: beyondtrust.secrets
        schema_ref: beyondtrust/secrets/v1
      projection:
        template: secret
      coverage:
      - id: secrets
        type: entity_family
        title: Secrets
        families:
        - secrets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: beyondtrust.audit_events
        schema_ref: beyondtrust/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
