entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - identity_access_secrets
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, groups, roles, applications, and audit events from Okta and projects them into the Cerebro graph as users, groups, policies, assets, and audit events for identity, access, device, and secret context.
      display_name: Okta
      id: builtin-okta
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
            - control_domains:
                - identity_access
              evidence_types:
                - access_review
                - identity_configuration
              families:
                - active_account
                - deprovisioned
                - dormant_user
                - last_login
                - never_logged_in
                - stale_login
                - suspended
                - user
              high_value: true
              id: user_lifecycle
              known_unsupported_fields:
                - authoritative HR termination status
              support: partial
              title: User lifecycle and activity state
              type: lifecycle_state
            - control_domains:
                - identity_access
              evidence_types:
                - access_review
                - identity_configuration
              families:
                - factor
                - mfa
                - mfa_factor
                - no_mfa
              high_value: true
              id: mfa_posture
              support: partial
              title: MFA posture
              type: app_entitlement
            - control_domains:
                - identity_access
              evidence_types:
                - access_review
                - identity_configuration
              families:
                - external_user
                - personal_email
                - user
              high_value: true
              id: external_accounts
              known_unsupported_fields:
                - authoritative contractor approval or vendor-of-record state
              support: partial
              title: External account signals
              type: entity_family
          default_enabled: true
          event:
            kind: okta.users
            required_payload_fields:
              - id
            schema_ref: okta/users/v1
            urn_kind: okta_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              display_name: name
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
            - control_domains:
                - identity_access
              evidence_types:
                - access_review
                - identity_configuration
              families:
                - group
                - group_membership
              high_value: true
              id: group_memberships
              notes:
                - Generic group collection lists group records; full Okta source projection supports membership edges through dedicated group membership events.
              support: partial
              title: Group memberships
              type: relationship
          default_enabled: true
          event:
            kind: okta.groups
            required_payload_fields:
              - id
            schema_ref: okta/groups/v1
            urn_kind: okta_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/groups
          projection:
            fields:
              group_id: id
              group_name: name
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - access_review
              evidence_types:
                - source_snapshot
              families:
                - roles
              high_value: true
              id: roles
              support: partial
              title: Roles
              type: entity_family
            - control_domains:
                - identity_access
              evidence_types:
                - access_review
                - identity_configuration
              families:
                - admin_role
                - privileged_role
                - role_assignment
              high_value: true
              id: admin_membership
              known_unsupported_fields:
                - full custom admin permission expansion
              support: partial
              title: Admin membership and privileged roles
              type: relationship
          default_enabled: true
          event:
            kind: okta.roles
            required_payload_fields:
              - id
            schema_ref: okta/roles/v1
            urn_kind: okta_roles
          id: roles
          id_field: id
          label: Roles
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/roles
          projection:
            fields:
              policy_id: id
              policy_name: name
              policy_status: status
              policy_type: role
            template: policy
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - applications
              high_value: true
              id: applications
              support: partial
              title: Applications
              type: entity_family
            - control_domains:
                - identity_access
              evidence_types:
                - access_review
                - identity_configuration
              families:
                - app_assignment
                - app_access
                - application
              high_value: true
              id: app_access
              known_unsupported_fields:
                - app-specific fine-grained entitlement payloads
              support: partial
              title: App access and assignments
              type: app_entitlement
          default_enabled: true
          event:
            kind: okta.applications
            required_payload_fields:
              - id
            schema_ref: okta/applications/v1
            urn_kind: okta_applications
          id: applications
          id_field: id
          label: Applications
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/applications
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: application
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
            - control_domains:
                - identity_access
                - logging_monitoring
              evidence_types:
                - access_review
                - identity_configuration
                - logging_configuration
              families:
                - audit
                - factor_reset
                - mfa
                - password_reset
                - session
                - support_session
                - user_lifecycle
              high_value: true
              id: identity_audit_events
              support: partial
              title: Identity lifecycle, MFA, and session events
              type: audit_event
          default_enabled: true
          event:
            kind: okta.audit_events
            required_payload_fields:
              - id
            schema_ref: okta/audit_events/v1
            urn_kind: okta_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit_events
          projection:
            fields:
              actor_email: actor_email
              actor_id: actor_id
              event_type: event_type
              id: id
              resource_id: resource_id
              resource_type: resource_type
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: okta
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/me
