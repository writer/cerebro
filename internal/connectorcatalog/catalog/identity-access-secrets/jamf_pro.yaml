---
entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-jamf_pro
    tenant_id: builtin_catalog
    source_id: jamf_pro
    display_name: Jamf Pro
    description: Jamf Pro connector definition for high-value enterprise SaaS records.
    categories:
    - saas
    - identity_access_secrets
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        label: Bearer token
        secret: true
        reference_only: true
        required: true
      requires_references: true
    config_fields:
    - key: base_url
      label: API base URL
      required: true
      help: Tenant or regional API base URL.
    transport:
      base_url: "${config.base_url}"
      verification:
        method: GET
        path: "/v1/me"
        expect_status:
        - 200
    ingest:
      mode: pull
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: jamf_pro.users
        schema_ref: jamf_pro/users/v1
        required_payload_fields:
        - id
      projection:
        template: identity_user
        fields:
          user_id: id
          display_name: name
          email: email
          status: status
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: groups
      label: Groups
      path: "/v1/groups"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: jamf_pro.groups
        schema_ref: jamf_pro/groups/v1
        required_payload_fields:
        - id
      projection:
        template: identity_group
        fields:
          group_id: id
          group_name: name
      coverage:
      - id: groups
        type: entity_family
        title: Groups
        families:
        - groups
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: roles
      label: Roles
      path: "/v1/roles"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: jamf_pro.roles
        schema_ref: jamf_pro/roles/v1
        required_payload_fields:
        - id
      projection:
        template: policy
        fields:
          policy_id: id
          policy_name: name
          policy_type: role
          policy_status: status
      coverage:
      - id: roles
        type: entity_family
        title: Roles
        families:
        - roles
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - access_review
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: applications
      label: Applications
      path: "/v1/applications"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: jamf_pro.applications
        schema_ref: jamf_pro/applications/v1
        required_payload_fields:
        - id
      projection:
        template: asset
        fields:
          id: id
          name: name
          resource_id: id
          resource_name: name
          resource_type: application
      coverage:
      - id: applications
        type: entity_family
        title: Applications
        families:
        - applications
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: audit_events
      label: Audit events
      path: "/v1/audit_events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: jamf_pro.audit_events
        schema_ref: jamf_pro/audit_events/v1
        required_payload_fields:
        - id
      projection:
        template: audit_event
        fields:
          id: id
          event_type: event_type
          actor_id: actor_id
          actor_email: actor_email
          resource_id: resource_id
          resource_type: resource_type
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
