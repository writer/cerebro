entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            reference_only: true
            secret: true
        model: oauth_client_credentials
        token_url: https://graph.microsoft.com/oauth/token
      categories:
        - identity
        - access
      description: Collects users, groups, and audit events from Microsoft Entra ID and projects them into the Cerebro graph as users, groups, and audit events for identity, access, device, and secret context.
      display_name: Microsoft Entra ID
      id: builtin-microsoft_entra_id
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Identity users
              type: entity_family
          event:
            kind: microsoft_entra_id.users
            required_payload_fields:
              - id
            schema_ref: microsoft_entra_id/users/v1
            urn_kind: microsoft_entra_id_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Identity groups
              type: entity_family
          event:
            kind: microsoft_entra_id.groups
            required_payload_fields:
              - id
            schema_ref: microsoft_entra_id/groups/v1
            urn_kind: microsoft_entra_id_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/groups
          projection:
            fields:
              description: description|summary
              group_email: group_email|email
              group_id: id
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: microsoft_entra_id.audit_events
            required_payload_fields:
              - id
            schema_ref: microsoft_entra_id/audit_events/v1
            urn_kind: microsoft_entra_id_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: microsoft_entra_id
      tenant_id: builtin_catalog
      transport:
        base_url: https://graph.microsoft.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1.0/organization
