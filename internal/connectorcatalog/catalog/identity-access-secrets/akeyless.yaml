entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_token
            reference_only: true
            secret: true
        model: api_key
      categories:
        - identity
        - secrets
      description: Collects items, auth methods, roles, and analytics from Akeyless and projects them into the Cerebro graph as secrets, assets, groups, and runtime analytics for identity, access, and secret context.
      display_name: Akeyless
      id: builtin-akeyless
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - items
              high_value: true
              id: items
              support: partial
              title: Items
              type: entity_family
          event:
            kind: akeyless.items
            required_payload_fields:
              - item_id
            schema_ref: akeyless/items/v1
            urn_kind: akeyless_items
          id: items
          id_field: item_id
          label: Items
          method: POST
          pagination:
            cursor_json_path: $.next_page
            cursor_param: pagination-token
            page_size: 100
            type: cursor
          path: /list-items
          projection:
            fields:
              secret_id: item_id
              secret_status: secret_status|status|state
              secret_type: secret_type|type|kind
            template: secret
          record_selector: $.items[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - auth_methods
              high_value: true
              id: auth_methods
              support: partial
              title: Auth methods
              type: entity_family
          event:
            kind: akeyless.auth_methods
            required_payload_fields:
              - auth_method_id
            schema_ref: akeyless/auth_methods/v1
            urn_kind: akeyless_auth_methods
          id: auth_methods
          id_field: auth_method_id
          label: Auth methods
          method: POST
          pagination:
            cursor_json_path: $.next_page
            cursor_param: pagination-token
            page_size: 100
            type: cursor
          path: /list-auth-methods
          projection:
            fields:
              resource_id: auth_method_id|auth_method_access_id
              resource_type: auth_method_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.auth_methods[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - roles
              high_value: true
              id: roles
              support: partial
              title: Roles
              type: entity_family
          event:
            kind: akeyless.roles
            required_payload_fields:
              - role_id
            schema_ref: akeyless/roles/v1
            urn_kind: akeyless_roles
          id: roles
          id_field: role_id
          label: Roles
          method: POST
          pagination:
            cursor_json_path: $.next_page
            cursor_param: pagination-token
            page_size: 100
            type: cursor
          path: /list-roles
          projection:
            fields:
              description: comment|description|summary
              group_email: group_email|email
              group_id: role_id|id
            template: identity_group
          record_selector: $.roles[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - source_snapshot
              families:
                - analytics
              high_value: true
              id: analytics
              support: partial
              title: Analytics
              type: entity_family
          event:
            kind: akeyless.analytics
            required_payload_fields:
              - date_updated
            schema_ref: akeyless/analytics/v1
            urn_kind: akeyless_analytics
          id: analytics
          id_field: date_updated
          label: Analytics
          method: POST
          path: /get-analytics-data
          projection:
            fields:
              resource_id: date_updated|id
              resource_type: resource_type|type
            template: asset
          record_selector: $
      schema_version: cerebro.integration/v1
      source_id: akeyless
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.akeyless.io
        verification:
          expect_status:
            - 200
          method: POST
          path: /list-items
