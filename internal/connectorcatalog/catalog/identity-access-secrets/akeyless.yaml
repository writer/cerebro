entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-akeyless
    tenant_id: builtin_catalog
    source_id: akeyless
    display_name: Akeyless
    description: Akeyless connector definition catalog entry for high-value security and operations resources.
    categories:
    - identity
    - secrets
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.akeyless.io
      verification:
        method: GET
        path: "/v2/item"
        expect_status:
        - 200
    resource_families:
    - id: items
      label: Items
      path: "/v2/items"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: akeyless.items
        schema_ref: akeyless/items/v1
      projection:
        template: secret
      coverage:
      - id: items
        type: entity_family
        title: Items
        families:
        - items
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: auth_methods
      label: Auth methods
      path: "/v2/auth-methods"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: akeyless.auth_methods
        schema_ref: akeyless/auth_methods/v1
      projection:
        template: asset
      coverage:
      - id: auth_methods
        type: entity_family
        title: Auth methods
        families:
        - auth_methods
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: roles
      label: Roles
      path: "/v2/roles"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: akeyless.roles
        schema_ref: akeyless/roles/v1
      projection:
        template: identity_group
      coverage:
      - id: roles
        type: entity_family
        title: Roles
        families:
        - roles
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v2/audit"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: akeyless.audit_events
        schema_ref: akeyless/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
