entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - identity_access_secrets
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, groups, roles, applications, and audit events from Authentik Cloud and projects them into the Cerebro graph as users, groups, policies, assets, and audit events for identity, access, device, and secret context.
      display_name: Authentik Cloud
      id: builtin-authentik_cloud
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: authentik_cloud.users
            required_payload_fields:
              - pk
            schema_ref: authentik_cloud/users/v1
            urn_kind: authentik_cloud_users
          id: users
          id_field: pk
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.pagination.next
            cursor_param: page
            page_size: 100
            page_size_param: page_size
            type: page
          path: /api/v3/core/users/
          projection:
            fields:
              display_name: name
              email: email
              status: is_active
              user_id: pk
            template: identity_user
          record_selector: $.results[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          default_enabled: true
          event:
            kind: authentik_cloud.groups
            required_payload_fields:
              - pk
            schema_ref: authentik_cloud/groups/v1
            urn_kind: authentik_cloud_groups
          id: groups
          id_field: pk
          label: Groups
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.pagination.next
            cursor_param: page
            page_size: 100
            page_size_param: page_size
            type: page
          path: /api/v3/core/groups/
          projection:
            fields:
              group_id: pk
              group_name: name
            template: identity_group
          record_selector: $.results[*]
        - coverage:
            - control_domains:
                - access_review
              evidence_types:
                - source_snapshot
              families:
                - roles
              high_value: true
              id: roles
              support: partial
              title: Roles
              type: entity_family
          default_enabled: true
          event:
            kind: authentik_cloud.roles
            required_payload_fields:
              - pk
            schema_ref: authentik_cloud/roles/v1
            urn_kind: authentik_cloud_roles
          id: roles
          id_field: pk
          label: Roles
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.pagination.next
            cursor_param: page
            page_size: 100
            page_size_param: page_size
            type: page
          path: /api/v3/rbac/roles/
          projection:
            fields:
              policy_id: pk
              policy_name: name
              policy_status: status
              policy_type: role
            template: policy
          record_selector: $.results[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - applications
              high_value: true
              id: applications
              support: partial
              title: Applications
              type: entity_family
          default_enabled: true
          event:
            kind: authentik_cloud.applications
            required_payload_fields:
              - pk
            schema_ref: authentik_cloud/applications/v1
            urn_kind: authentik_cloud_applications
          id: applications
          id_field: pk
          label: Applications
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.pagination.next
            cursor_param: page
            page_size: 100
            page_size_param: page_size
            type: page
          path: /api/v3/core/applications/
          projection:
            fields:
              id: pk
              name: name
              resource_id: pk
              resource_name: name
              resource_type: application
            template: asset
          record_selector: $.results[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: authentik_cloud.audit_events
            required_payload_fields:
              - pk
            schema_ref: authentik_cloud/audit_events/v1
            urn_kind: authentik_cloud_audit_events
          id: audit_events
          id_field: pk
          label: Audit events
          method: GET
          name_field: action
          pagination:
            cursor_json_path: $.pagination.next
            cursor_param: page
            page_size: 100
            page_size_param: page_size
            type: page
          path: /api/v3/events/events/
          projection:
            fields:
              actor_email: user.email
              actor_id: user.pk
              event_type: action
              id: pk
              resource_id: context.model.pk
              resource_type: context.model_name
            template: audit_event
          record_selector: $.results[*]
      schema_version: cerebro.integration/v1
      source_id: authentik_cloud
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/v3/core/users/me/
