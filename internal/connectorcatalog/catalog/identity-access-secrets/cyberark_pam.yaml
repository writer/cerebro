entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            reference_only: true
            secret: true
        model: oauth_client_credentials
        token_url: https://${config.tenant_url}/oauth/token
      categories:
        - identity
        - secrets
      description: Collects users, secrets, and audit events from CyberArk PAM and projects them into the Cerebro graph as users, secrets, and audit events for identity, access, device, and secret context.
      display_name: CyberArk PAM
      id: builtin-cyberark_pam
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Identity users
              type: entity_family
          event:
            kind: cyberark_pam.users
            required_payload_fields:
              - id
            schema_ref: cyberark_pam/users/v1
            urn_kind: cyberark_pam_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - secrets
              high_value: true
              id: secrets
              support: partial
              title: Secrets
              type: entity_family
          event:
            kind: cyberark_pam.secrets
            required_payload_fields:
              - id
            schema_ref: cyberark_pam/secrets/v1
            urn_kind: cyberark_pam_secrets
          id: secrets
          id_field: id
          label: Secrets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/secrets
          projection:
            fields:
              secret_id: id
              secret_status: secret_status|status|state
              secret_type: secret_type|type|kind
            template: secret
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: cyberark_pam.audit_events
            required_payload_fields:
              - id
            schema_ref: cyberark_pam/audit_events/v1
            urn_kind: cyberark_pam_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: cyberark_pam
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.tenant_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /PasswordVault/api/Accounts
