entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: bearer_token
            label: Microsoft Graph bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - identity_access_secrets
      config_fields:
        - help: Microsoft Graph API origin.
          key: base_url
          label: Microsoft Graph base URL
          required: true
      description: Collects the Microsoft Graph authorization policy and projects its tenant-wide access defaults into the Cerebro graph.
      display_name: Azure
      id: builtin-azure
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - identity_access
              evidence_types:
                - identity_configuration
              families:
                - authorization_policy
              high_value: true
              id: ad_authorization_policy
              support: partial
              title: Azure authorization policy
              type: entity_family
          default_enabled: true
          event:
            kind: azure.authorization_policy
            required_attributes:
              - resource_id
              - resource_name
              - resource_provider
              - resource_type
            schema_ref: azure/authorization_policy/v1
            urn_kind: azure_authorization_policy
          id: authorization_policy
          id_field: id
          label: Authorization policy
          method: GET
          provider_kernel: azure.authorization_policy
          pagination:
            type: none
          path: /v1.0/policies/authorizationPolicy
          projection:
            fields:
              allow_email_verified_users_to_join: allowEmailVerifiedUsersToJoinOrganization
              allow_invites_from: allowInvitesFrom
              allowed_to_create_apps: defaultUserRolePermissions.allowedToCreateApps
              allowed_to_create_security_groups: defaultUserRolePermissions.allowedToCreateSecurityGroups
              allowed_to_read_bitlocker_keys_for_owned_device: defaultUserRolePermissions.allowedToReadBitlockerKeysForOwnedDevice
              allowed_to_sign_up_email_based_subscriptions: allowedToSignUpEmailBasedSubscriptions
              allowed_to_use_sspr: allowedToUseSSPR
              block_msol_power_shell: blockMsolPowerShell
              guest_user_role_id: guestUserRoleId
              policy_id: id
            static_fields:
              resource_name: authorizationPolicy
              resource_provider: azure
              resource_type: authorization_policy
            template: policy
          record_selector: $
          singleton: true
          singleton_fallback_id: authorizationPolicy
      schema_version: cerebro.integration/v1
      source_id: azure
      tenant_id: builtin_catalog
      transport:
        base_url: https://graph.microsoft.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1.0/policies/authorizationPolicy
