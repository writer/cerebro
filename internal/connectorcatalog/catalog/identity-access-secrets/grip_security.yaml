entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - identity_access_secrets
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, groups, roles, applications, and audit events from Grip Security and projects them into the Cerebro graph as users, groups, policies, assets, and audit events for identity, access, device, and secret context.
      display_name: Grip Security
      id: builtin-grip_security
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: grip_security.users
            required_payload_fields:
              - id
            schema_ref: grip_security/users/v1
            urn_kind: grip_security_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              display_name: name
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          default_enabled: true
          event:
            kind: grip_security.groups
            required_payload_fields:
              - id
            schema_ref: grip_security/groups/v1
            urn_kind: grip_security_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/groups
          projection:
            fields:
              group_id: id
              group_name: name
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - access_review
              evidence_types:
                - source_snapshot
              families:
                - roles
              high_value: true
              id: roles
              support: partial
              title: Roles
              type: entity_family
          default_enabled: true
          event:
            kind: grip_security.roles
            required_payload_fields:
              - id
            schema_ref: grip_security/roles/v1
            urn_kind: grip_security_roles
          id: roles
          id_field: id
          label: Roles
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/roles
          projection:
            fields:
              policy_id: id
              policy_name: name
              policy_status: status
              policy_type: role
            template: policy
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - applications
              high_value: true
              id: applications
              support: partial
              title: Applications
              type: entity_family
          default_enabled: true
          event:
            kind: grip_security.applications
            required_payload_fields:
              - id
            schema_ref: grip_security/applications/v1
            urn_kind: grip_security_applications
          id: applications
          id_field: id
          label: Applications
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/applications
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: application
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: grip_security.audit_events
            required_payload_fields:
              - id
            schema_ref: grip_security/audit_events/v1
            urn_kind: grip_security_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit_events
          projection:
            fields:
              actor_email: actor_email
              actor_id: actor_id
              event_type: event_type
              id: id
              resource_id: resource_id
              resource_type: resource_type
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: grip_security
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/me
