entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-doppler
    tenant_id: builtin_catalog
    source_id: doppler
    display_name: Doppler
    description: Doppler connector definition catalog entry for high-value security and operations resources.
    categories:
    - secrets
    - identity
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://api.doppler.com
      verification:
        method: GET
        path: "/v3/workplace"
        expect_status:
        - 200
    resource_families:
    - id: secrets
      label: Secrets
      path: "/v3/workplace/secrets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: doppler.secrets
        schema_ref: doppler/secrets/v1
      projection:
        template: secret
        entity:
          entity_type: secret
          urn_kind: secret
          id_attributes:
          - secret_id
          label_attribute: secret_name
        fields:
          project_id: project.id|project_id|project
        relationships:
        - relation: belongs_to
          to:
            entity_type: doppler.project
            urn_kind: doppler_project
            id_attributes:
            - project_id
          required_attributes:
          - project_id
          match_type: secret_project
      coverage:
      - id: secrets
        type: entity_family
        title: Secrets
        families:
        - secrets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: projects
      label: Projects
      path: "/v3/workplace/projects"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: doppler.projects
        schema_ref: doppler/projects/v1
      projection:
        template: asset
        entity:
          entity_type: doppler.project
          urn_kind: doppler_project
          id_attributes:
          - resource_id
          label_attribute: resource_name
      coverage:
      - id: projects
        type: entity_family
        title: Projects
        families:
        - projects
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v3/workplace/logs"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: doppler.audit_events
        schema_ref: doppler/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
