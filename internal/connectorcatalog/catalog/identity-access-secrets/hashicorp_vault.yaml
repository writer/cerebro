entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - identity
        - secrets
      description: Collects users, secrets, and audit events from HashiCorp Vault and projects them into the Cerebro graph as users, secrets, and audit events for identity, access, device, and secret context.
      display_name: HashiCorp Vault
      id: builtin-hashicorp_vault
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Identity users
              type: entity_family
          event:
            kind: hashicorp_vault.users
            required_payload_fields:
              - id
            schema_ref: hashicorp_vault/users/v1
            urn_kind: hashicorp_vault_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - secrets
              high_value: true
              id: secrets
              support: partial
              title: Secrets
              type: entity_family
          event:
            kind: hashicorp_vault.secrets
            required_payload_fields:
              - id
            schema_ref: hashicorp_vault/secrets/v1
            urn_kind: hashicorp_vault_secrets
          id: secrets
          id_field: id
          label: Secrets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/secrets
          projection:
            entity:
              entity_type: secret
              id_attributes:
                - secret_id
              label_attribute: secret_name
              urn_kind: secret
            fields:
              owner_user_id: owner_id|created_by.id|created_by|user_id
            relationships:
              - match_type: secret_owner
                relation: owned_by
                required_attributes:
                  - owner_user_id
                to:
                  entity_type: hashicorp_vault.user
                  id_attributes:
                    - owner_user_id
                  urn_kind: hashicorp_vault_user
            template: secret
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: hashicorp_vault.audit_events
            required_payload_fields:
              - id
            schema_ref: hashicorp_vault/audit_events/v1
            urn_kind: hashicorp_vault_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: hashicorp_vault
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.vault_addr}
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/sys/health
