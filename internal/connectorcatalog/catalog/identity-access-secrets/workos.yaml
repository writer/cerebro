entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - identity
        - access
      description: Collects users, groups, and audit events from WorkOS and projects them into the Cerebro graph as users, groups, and audit events for identity, access, device, and secret context.
      display_name: WorkOS
      id: builtin-workos
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          event:
            kind: workos.users
            required_payload_fields:
              - id
            schema_ref: workos/users/v1
            urn_kind: workos_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          event:
            kind: workos.groups
            required_payload_fields:
              - id
            schema_ref: workos/groups/v1
            urn_kind: workos_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /groups
          projection:
            fields:
              description: description|summary
              group_email: group_email|email
              group_id: id
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: workos.audit_events
            required_payload_fields:
              - id
            schema_ref: workos/audit_events/v1
            urn_kind: workos_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: workos
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.workos.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /users
