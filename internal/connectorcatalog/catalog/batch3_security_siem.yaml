# Generated seed definitions for the built-in connector definition catalog.
# Keep these declarative; executable source runtimes are generated separately.
entries:
  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-orca
      tenant_id: builtin_catalog
      source_id: orca
      display_name: Orca
      description: "Orca connector definition catalog entry for high-value security and operations resources."
      categories:
        - security
        - cloud
      auth:
        model: api_key
        credential_fields:
          - key: api_key
            secret: true
            reference_only: true
      transport:
        base_url: "https://api.orcasecurity.io/api"
        verification:
          method: GET
          path: /status
          expect_status: [200]
      resource_families:
        - id: assets
          label: Assets
          path: /v1/assets
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: orca.assets
            schema_ref: orca/assets/v1
          projection:
            template: asset
          coverage:
            - id: assets
              type: entity_family
              title: Assets
              families: [assets]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: findings
          label: Findings
          path: /v1/findings
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: orca.findings
            schema_ref: orca/findings/v1
          projection:
            template: finding
          coverage:
            - id: findings
              type: remediation_state
              title: Findings
              families: [findings]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: vulnerabilities
          label: Vulnerabilities
          path: /v1/vulnerabilities
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: orca.vulnerabilities
            schema_ref: orca/vulnerabilities/v1
          projection:
            template: vulnerability
          coverage:
            - id: vulnerabilities
              type: remediation_state
              title: Vulnerabilities
              families: [vulnerabilities]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
