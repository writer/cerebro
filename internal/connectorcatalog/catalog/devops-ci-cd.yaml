# Developer platform, source control, CI/CD, artifact, and release connector definitions.
# Entries are sorted by source_id for deterministic review.
entries:
  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-argo_cd
      tenant_id: builtin_catalog
      source_id: argo_cd
      display_name: "Argo CD"
      description: "Argo CD connector definition catalog entry for high-value security and operations resources."
      categories:
        - dev
        - ci
      auth:
        model: bearer_token
        credential_fields:
          - key: token
            secret: true
            reference_only: true
      transport:
        base_url: "https://${config.server_url}"
        verification:
          method: GET
          path: /api/v1/session/userinfo
          expect_status: [200]
      resource_families:
        - id: pipelines
          label: Pipelines
          path: /v1/pipelines
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: argo_cd.pipelines
            schema_ref: argo_cd/pipelines/v1
          projection:
            template: asset
          coverage:
            - id: pipelines
              type: entity_family
              title: Pipelines
              families: [pipelines]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: findings
          label: Findings
          path: /v1/findings
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: argo_cd.findings
            schema_ref: argo_cd/findings/v1
          projection:
            template: finding
          coverage:
            - id: findings
              type: remediation_state
              title: "Build findings"
              families: [findings]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: audit_events
          label: "Audit events"
          path: /v1/audit/events
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: argo_cd.audit_events
            schema_ref: argo_cd/audit_events/v1
          projection:
            template: audit_event
          coverage:
            - id: audit_events
              type: audit_event
              title: "Audit events"
              families: [audit_events]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
