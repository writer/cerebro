entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - ai
        - governance
      description: Collects projects, API keys, usage reports, and fine tuning jobs from Together AI and projects them into the Cerebro graph as assets and secrets for model access, API key, usage, and workspace governance context.
      display_name: Together AI
      id: builtin-together-ai
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - projects
              high_value: true
              id: projects
              support: partial
              title: Projects
              type: entity_family
          event:
            kind: together_ai.projects
            required_payload_fields:
              - id
            schema_ref: together_ai/projects/v1
            urn_kind: together_ai_projects
          id: projects
          id_field: id
          label: Projects
          method: GET
          name_field: name
          pagination:
            disable_page_size: true
            type: none
          path: /v1/projects
          projection:
            fields:
              resource_id: id
              resource_name: name
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - identity_access
              evidence_types:
                - identity_configuration
              families:
                - api_keys
              high_value: true
              id: api_keys
              support: partial
              title: API keys
              type: app_entitlement
          event:
            kind: together_ai.api_keys
            required_payload_fields:
              - id
            schema_ref: together_ai/api_keys/v1
            urn_kind: together_ai_api_keys
          id: api_keys
          id_field: id
          label: API keys
          method: GET
          name_field: name
          pagination:
            disable_page_size: true
            type: none
          path: /v1/api-keys
          projection:
            fields:
              secret_id: id
              secret_name: name
              secret_status: secret_status|status|state
              secret_type: secret_type|type|kind
            template: secret
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - usage_reports
              high_value: true
              id: usage_reports
              support: partial
              title: Usage reports
              type: entity_family
          event:
            kind: together_ai.usage_reports
            required_payload_fields:
              - id
            schema_ref: together_ai/usage_reports/v1
            urn_kind: together_ai_usage_reports
          id: usage_reports
          id_field: id
          label: Usage reports
          method: GET
          pagination:
            disable_page_size: true
            type: none
          path: /v1/usage
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - fine_tuning_jobs
              high_value: true
              id: fine_tuning_jobs
              support: partial
              title: Fine-tuning jobs
              type: entity_family
          event:
            kind: together_ai.fine_tuning_jobs
            required_payload_fields:
              - id
            schema_ref: together_ai/fine_tuning_jobs/v1
            urn_kind: together_ai_fine_tuning_jobs
          id: fine_tuning_jobs
          id_field: id
          label: Fine-tuning jobs
          method: GET
          name_field: name
          pagination:
            disable_page_size: true
            type: none
          path: /v1/fine-tunes
          projection:
            fields:
              resource_id: id
              resource_name: name
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: together_ai
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.together.xyz
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/models
