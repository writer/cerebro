      source_id: microsoft_foundry
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.endpoint}/api/projects/${config.project_name}
        verification:
          expect_status:
            - 200
          method: GET
          path: /agents?api-version=v1
