entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - ai
        - governance
      config_fields:
        - key: project_id
          label: Project ID
          required: true
        - key: location
          label: Location
          placeholder: us-central1
          required: true
      description: Collects models, endpoints, custom jobs, batch prediction jobs, indexes, and reasoning engines from Google Vertex AI and projects them into the Cerebro graph as assets and deployments for inventory, access review, audit, risk, and operational context.
      display_name: Google Vertex AI
      id: builtin-google-vertex-ai
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - models
              high_value: true
              id: models
              support: partial
              title: Models
              type: entity_family
          event:
            kind: google_vertex_ai.models
            required_payload_fields:
              - name
            schema_ref: google_vertex_ai/models/v1
            urn_kind: google_vertex_ai_models
          id: models
          id_field: name
          label: Models
          method: GET
          name_field: displayName
          pagination:
            cursor_json_path: $.nextPageToken
            cursor_param: pageToken
            page_size: 100
            page_size_param: pageSize
            type: cursor
          path: /v1/projects/${config.project_id}/locations/${config.location}/models
          projection:
            fields:
              resource_id: name
              resource_name: displayName
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.models[*]
        - coverage:
            - control_domains:
                - secure_delivery
              evidence_types:
                - change_management
              families:
                - endpoints
              high_value: true
              id: endpoints
              support: partial
              title: Endpoints
              type: deployment_state
          event:
            kind: google_vertex_ai.endpoints
            required_payload_fields:
              - name
            schema_ref: google_vertex_ai/endpoints/v1
            urn_kind: google_vertex_ai_endpoints
          id: endpoints
          id_field: name
          label: Endpoints
          method: GET
          name_field: displayName
          pagination:
            cursor_json_path: $.nextPageToken
            cursor_param: pageToken
            page_size: 100
            page_size_param: pageSize
            type: cursor
          path: /v1/projects/${config.project_id}/locations/${config.location}/endpoints
          projection:
            fields:
              deployment_environment: environment|env|stage|target
              deployment_id: name
              deployment_name: displayName
              deployment_status: status|state|ready
              deployment_url: url|deployment_url|endpoint|domain
            template: deployment
          record_selector: $.endpoints[*]
        - coverage:
            - control_domains:
                - secure_delivery
              evidence_types:
                - change_management
              families:
                - custom_jobs
              high_value: true
              id: custom_jobs
