              id: training_jobs
              support: partial
              title: Training jobs
              type: deployment_state
          event:
            kind: ibm_watsonx_ai.training_jobs
            required_payload_fields:
              - metadata.id
            schema_ref: ibm_watsonx_ai/training_jobs/v1
            urn_kind: ibm_watsonx_ai_training_jobs
          id: training_jobs
          id_field: metadata.id
          label: Training jobs
          method: GET
          name_field: entity.name
          pagination:
            disable_page_size: true
            type: none
          path: /ml/v4/trainings
          projection:
            fields:
              deployment_environment: environment|env|stage|target
              deployment_id: metadata.id
              deployment_name: entity.name
              deployment_status: status|state|ready
              deployment_url: url|deployment_url|endpoint|domain
            template: deployment
          record_selector: $.resources[*]
          static_query:
            version: "2024-03-14"
      schema_version: cerebro.integration/v1
      source_id: ibm_watsonx_ai
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.region}.ml.cloud.ibm.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /ml/v1/foundation_model_specs?version=2024-03-14
