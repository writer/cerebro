entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Azure access token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - ai
        - governance
      config_fields:
        - key: subscription_id
          label: Subscription ID
          required: true
        - key: resource_group
          label: Resource group
          required: true
        - key: account_name
          label: Azure AI account name
          required: true
        - key: location
          label: Azure region
          placeholder: eastus
          required: true
      description: Collects deployments, model catalog, rai policies, rai blocklists, and private endpoint connections from Azure OpenAI and projects them into the Cerebro graph as assets, deployments, and policies for inventory, access review, audit, risk, and operational context.
      display_name: Azure OpenAI
      id: builtin-azure-openai
      resource_families:
        - coverage:
            - control_domains:
                - secure_delivery
              evidence_types:
                - change_management
              families:
                - deployments
              high_value: true
              id: deployments
              support: partial
              title: Deployments
              type: deployment_state
          event:
            kind: azure_openai.deployments
            required_payload_fields:
              - name
            schema_ref: azure_openai/deployments/v1
            urn_kind: azure_openai_deployments
          id: deployments
          id_field: name
          label: Deployments
          method: GET
          name_field: name
          pagination:
            disable_page_size: true
            next_url_json_path: $.nextLink
            type: next_url
          path: /subscriptions/${config.subscription_id}/resourceGroups/${config.resource_group}/providers/Microsoft.CognitiveServices/accounts/${config.account_name}/deployments
          projection:
            fields:
              deployment_environment: environment|env|stage|target
              deployment_id: name
              deployment_name: name
              deployment_status: status|state|ready
              deployment_url: url|deployment_url|endpoint|domain
            template: deployment
          record_selector: $.value[*]
          static_query:
            api-version: "2024-10-01"
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - model_catalog
              high_value: true
              id: model_catalog
              support: partial
              title: Model catalog
              type: entity_family
          event:
            kind: azure_openai.model_catalog
            required_payload_fields:
              - name
            schema_ref: azure_openai/model_catalog/v1
            urn_kind: azure_openai_model_catalog
          id: model_catalog
          id_field: name
          label: Model catalog
          method: GET
          name_field: name
          pagination:
            disable_page_size: true
            next_url_json_path: $.nextLink
            type: next_url
          path: /subscriptions/${config.subscription_id}/providers/Microsoft.CognitiveServices/locations/${config.location}/models
          projection:
            fields:
              resource_id: name
              resource_name: name
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.value[*]
          static_query:
            api-version: "2024-10-01"
        - coverage:
            - control_domains:
                - security_operations
              evidence_types:
                - configuration_state
              families:
                - rai_policies
              high_value: true
              id: rai_policies
              support: partial
              title: RAI policies
              type: lifecycle_state
          event:
            kind: azure_openai.rai_policies
            required_payload_fields:
              - name
            schema_ref: azure_openai/rai_policies/v1
            urn_kind: azure_openai_rai_policies
          id: rai_policies
          id_field: name
          label: RAI policies
          method: GET
          name_field: name
          pagination:
            disable_page_size: true
            next_url_json_path: $.nextLink
            type: next_url
          path: /subscriptions/${config.subscription_id}/resourceGroups/${config.resource_group}/providers/Microsoft.CognitiveServices/accounts/${config.account_name}/raiPolicies
          projection:
            fields:
              policy_id: name
              policy_name: name
              policy_status: policy_status|status|state|enabled
              policy_type: policy_type|type|kind|category
            template: policy
          record_selector: $.value[*]
          static_query:
            api-version: "2024-10-01"
        - coverage:
            - control_domains:
                - security_operations
              evidence_types:
                - configuration_state
              families:
                - rai_blocklists
              high_value: true
              id: rai_blocklists
              support: partial
              title: RAI blocklists
              type: lifecycle_state
          event:
            kind: azure_openai.rai_blocklists
            required_payload_fields:
              - name
            schema_ref: azure_openai/rai_blocklists/v1
            urn_kind: azure_openai_rai_blocklists
          id: rai_blocklists
          id_field: name
          label: RAI blocklists
          method: GET
          name_field: name
          pagination:
            disable_page_size: true
            next_url_json_path: $.nextLink
            type: next_url
          path: /subscriptions/${config.subscription_id}/resourceGroups/${config.resource_group}/providers/Microsoft.CognitiveServices/accounts/${config.account_name}/raiBlocklists
          projection:
            fields:
              policy_id: name
              policy_name: name
              policy_status: policy_status|status|state|enabled
              policy_type: policy_type|type|kind|category
            template: policy
          record_selector: $.value[*]
          static_query:
            api-version: "2024-10-01"
        - coverage:
            - control_domains:
                - network_security
              evidence_types:
                - configuration_state
              families:
                - private_endpoint_connections
              high_value: true
              id: private_endpoint_connections
              support: partial
              title: Private endpoint connections
              type: network_exposure
          event:
            kind: azure_openai.private_endpoint_connections
            required_payload_fields:
              - name
            schema_ref: azure_openai/private_endpoint_connections/v1
            urn_kind: azure_openai_private_endpoint_connections
          id: private_endpoint_connections
          id_field: name
          label: Private endpoint connections
          method: GET
          name_field: name
          pagination:
            disable_page_size: true
            next_url_json_path: $.nextLink
            type: next_url
          path: /subscriptions/${config.subscription_id}/resourceGroups/${config.resource_group}/providers/Microsoft.CognitiveServices/accounts/${config.account_name}/privateEndpointConnections
          projection:
            fields:
              resource_id: name
              resource_name: name
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.value[*]
          static_query:
            api-version: "2024-10-01"
      schema_version: cerebro.integration/v1
      source_id: azure_openai
      tenant_id: builtin_catalog
      transport:
        base_url: https://management.azure.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /subscriptions/${config.subscription_id}/resourceGroups/${config.resource_group}/providers/Microsoft.CognitiveServices/accounts/${config.account_name}/deployments?api-version=2024-10-01
