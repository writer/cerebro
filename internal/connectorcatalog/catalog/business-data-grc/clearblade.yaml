entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: token
        label: Bearer token
        reference_only: true
        required: true
        secret: true
      model: bearer_token
      requires_references: true
    categories:
    - saas
    config_fields:
    - help: Path parameter inferred from the OpenAPI operation.
      key: systemkey
      label: Systemkey
      required: true
    - help: Path parameter inferred from the OpenAPI operation.
      key: collectionname
      label: Collectionname
      required: true
    description: Collects system, user, deployment, connection, platform system, and audit from ClearBlade and projects them into the Cerebro graph as assets, audit events, deployments, and users for inventory, access review, audit, risk, and operational context.
    display_name: ClearBlade
    id: builtin_catalog-clearblade
    ingest:
      mode: pull
    resource_families:
    - coverage:
      - control_domains:
        - logging_monitoring
        evidence_types:
        - logging_configuration
        families:
        - system
        high_value: true
        id: audit_events
        support: partial
        title: System
        type: audit_event
      default_enabled: true
      event:
        kind: clearblade.system
        required_payload_fields:
        - name
        schema_ref: clearblade/system/v1
        urn_kind: clearblade_system
      event_kind: system
      id: system
      id_field: name
      label: System
      method: GET
      name_field: name
      pagination:
        type: none
      path: "/admin/platform/systems"
      projection:
        fields:
          id: name
          name: name
          provider_id: name
        template: audit_event
      record_selector: "$[*]"
