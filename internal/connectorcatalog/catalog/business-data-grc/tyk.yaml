entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: token
        label: Bearer token
        reference_only: true
        required: true
        secret: true
      model: bearer_token
      requires_references: true
    categories:
    - saas
    config_fields:
    - help: Path parameter inferred from the OpenAPI operation.
      key: apiid
      label: Apiid
      required: true
    description: Collects key, api, and client from Tyk and projects them into the Cerebro graph as assets for inventory, access review, audit, risk, and operational context.
    display_name: Tyk
    id: builtin_catalog-tyk
    ingest:
      mode: pull
    resource_families:
    - coverage:
      - control_domains:
        - asset_inventory
        evidence_types:
        - source_snapshot
        families:
        - key
        high_value: true
        id: key
        support: partial
        title: Key
        type: entity_family
      default_enabled: true
      event:
        kind: tyk.key
        required_payload_fields:
        - id
        schema_ref: tyk/key/v1
        urn_kind: tyk_key
      event_kind: key
      id: key
      id_field: id
      label: Key
      list_key: keys
      method: GET
      pagination:
        type: none
      path: "/tyk/keys/"
      projection:
        fields:
          id: id
          resource_id: id
          resource_name: id
          resource_type: key
        template: asset
      record_selector: "$.keys[*]"
    - coverage:
      - control_domains:
        - asset_inventory
        evidence_types:
        - source_snapshot
        families:
        - api
        id: api
        support: partial
        title: Api
        type: entity_family
      event:
        kind: tyk.api
        required_payload_fields:
        - id
        schema_ref: tyk/api/v1
        urn_kind: tyk_api
      event_kind: api
      id: api
      id_field: id
      label: Api
      method: GET
      name_field: name
      pagination:
        type: none
      path: "/tyk/apis/"
      projection:
        fields:
          id: id
          name: name
          resource_id: id
          resource_name: name
          resource_type: api
        template: asset
      record_selector: "$[*]"
    - coverage:
      - control_domains:
        - asset_inventory
        evidence_types:
        - source_snapshot
        families:
        - client
        high_value: true
        id: client
        support: partial
        title: Client
        type: entity_family
      default_enabled: true
      event:
        kind: tyk.client
        required_payload_fields:
        - client_id
        schema_ref: tyk/client/v1
        urn_kind: tyk_client
      event_kind: client
      id: client
      id_field: client_id
      label: Client
      method: GET
      name_field: client_id
      pagination:
        type: none
      path: "/tyk/oauth/clients/${config.apiid}"
      projection:
        fields:
          id: client_id
          name: client_id
          resource_id: client_id
          resource_name: client_id
          resource_type: client
        template: asset
      record_selector: "$[*]"
      sensitive_payload_paths:
      - secret
    schema_version: cerebro.integration/v1
    scope_options:
    - default_enabled: true
      families:
      - key
      id: key
      label: Key
    - families:
      - api
      id: api
      label: Api
    - default_enabled: true
      families:
      - client
      id: client
      label: Client
    source_id: tyk
    tenant_id: builtin_catalog
    transport:
      base_url: https://tyk.local
      retry:
        backoff: exponential
        max_attempts: 3
        retry_after_header: Retry-After
        statuses:
        - 429
        - 500
        - 502
        - 503
        - 504
      verification:
        expect_status:
        - 200
        method: GET
        path: "/tyk/keys/"
