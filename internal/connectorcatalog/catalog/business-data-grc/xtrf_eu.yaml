entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: api_key
        label: API key
        reference_only: true
        required: true
        secret: true
      model: api_key
      requires_references: true
    categories:
    - saas
    description: "Collects user, active, all, customer, ID, and invoices ID from XTRF Home Portal API and projects them into the Cerebro graph as users and assets for owner, account, evidence, and compliance context."
    display_name: XTRF Home Portal API
    id: builtin_catalog-xtrf_eu
    ingest:
      mode: pull
    resource_families:
    - coverage:
      - control_domains:
        - asset_inventory
        evidence_types:
        - source_snapshot
        families:
        - user
        high_value: true
        id: user
        support: partial
        title: User
        type: entity_family
      default_enabled: true
      event:
        kind: xtrf_eu.user
        required_payload_fields:
        - id
        schema_ref: xtrf_eu/user/v1
        urn_kind: xtrf_user
      event_kind: user
      id: user
      id_field: id
      label: User
      method: GET
      name_field: name
      pagination:
        type: none
      path: "/users"
      permissions_needed:
      - X-AUTH-ACCESS-TOKEN
      projection:
        fields:
          id: id
          name: name
          provider_id: id
        template: identity_user
      record_selector: "$[*]"
    - coverage:
