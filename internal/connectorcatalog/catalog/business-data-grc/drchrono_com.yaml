        label: OAuth client reference
        reference_only: true
        required: true
        secret: true
      model: oauth_authorization_code
      requires_references: true
      scopes:
      - billing:patient-payment:read
      - billing:read
      - calendar:read
      - clinical:read
      - labs:read
      - messages:read
      - patients:read
