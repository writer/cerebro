      - user:read
      token_expiration_buffer_seconds: 300
      token_request_auth_method: client_secret_basic
      token_url: https://drchrono.com/o/token/
    categories:
    - saas
    description: "Collects patient risk assessment, comm log, care team member, user, implantable device, and patient payment log from Drchrono Com and projects them into the Cerebro graph as findings, audit events, group memberships, users, and assets for owner, account, evidence, and compliance context."
