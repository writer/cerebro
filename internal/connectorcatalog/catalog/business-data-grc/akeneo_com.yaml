        evidence_types:
        - source_snapshot
        families:
        - attribute
        high_value: true
        id: attribute
        support: partial
        title: Attribute
        type: entity_family
      default_enabled: true
      event:
        kind: akeneo_com.attribute
        required_payload_fields:
        - allowed_extensions
        schema_ref: akeneo_com/attribute/v1
        urn_kind: akeneo_attribute
      event_kind: attribute
      id: attribute
      id_field: allowed_extensions
      label: Attribute
      method: GET
      name_field: allowed_extensions
      pagination:
        type: none
      path: "/api/rest/v1/asset-families/${config.asset_family_code}/attributes"
      projection:
        fields:
          id: allowed_extensions
