        label: Bearer token
        reference_only: true
        required: true
        secret: true
      model: bearer_token
      requires_references: true
    categories:
    - saas
    config_fields:
    - help: Path parameter inferred from the OpenAPI operation.
      key: asset_family_code
      label: Asset Family Code
      required: true
    - help: Path parameter inferred from the OpenAPI operation.
      key: code
      label: Code
      required: true
