entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-stripe
    tenant_id: builtin_catalog
    source_id: stripe
    display_name: Stripe
    description: "Collects users, business records, and audit events from Stripe and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context."
    categories:
    - business
    - finance
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://api.stripe.com
      verification:
        method: GET
        path: "/v1/account"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: stripe.users
        schema_ref: stripe/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: assets
      label: Business records
      path: "/v1/records"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: stripe.assets
        schema_ref: stripe/assets/v1
      projection:
        template: asset
      coverage:
      - id: assets
        type: entity_family
        title: Business records
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: stripe.audit_events
        schema_ref: stripe/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
