entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            label: API key
            reference_only: true
            required: true
            secret: true
        model: api_key
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: ActivTrak API base URL. Defaults to the global production endpoint.
          key: base_url
          label: API base URL
          required: false
      description: Collects ActivTrak SCIM users and groups, administration clients and consumers, and activity-log events from the documented public API, then projects them into the Cerebro graph for identity, asset, access, and audit context.
      display_name: ActivTrak
      id: builtin-activtrak
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: SCIM Users
              type: entity_family
          default_enabled: true
          event:
            kind: activtrak.users
            required_payload_fields:
              - id
            schema_ref: activtrak/users/v1
            urn_kind: activtrak_users
          id: users
          id_field: id
          label: SCIM Users
          method: GET
          name_field: displayName
          pagination:
            cursor_json_path: $.startIndex
            cursor_param: startIndex
            page_size: 100
            page_size_param: count
            type: offset
          path: /scim/v1/users
          projection:
            fields:
              display_name: displayName
              email: emails.0.value
              status: active
              user_id: id
            template: identity_user
          record_selector: $.resources[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: SCIM Groups
              type: entity_family
          default_enabled: true
          event:
            kind: activtrak.groups
            required_payload_fields:
              - id
            schema_ref: activtrak/groups/v1
            urn_kind: activtrak_groups
          id: groups
          id_field: id
          label: SCIM Groups
          method: GET
          name_field: displayName
          pagination:
            cursor_json_path: $.startIndex
            cursor_param: startIndex
            page_size: 100
            page_size_param: count
            type: offset
          path: /scim/v1/groups
          projection:
            fields:
              id: id
              name: displayName
              resource_id: id
              resource_name: displayName
              resource_type: activtrak_group
            template: asset
          record_selector: $.resources[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - clients
              high_value: true
              id: clients
              support: partial
              title: Clients
              type: entity_family
          default_enabled: true
          event:
            kind: activtrak.clients
            required_payload_fields:
              - id
            schema_ref: activtrak/clients/v1
            urn_kind: activtrak_clients
          id: clients
          id_field: id
          label: Clients
          method: GET
          name_field: alias
          path: /admin/v1/clients
          projection:
            fields:
              id: id
              name: alias
              resource_id: id
              resource_name: alias
              resource_type: activtrak_client
            template: asset
          record_selector: $.clients[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - consumers
              high_value: true
              id: consumers
              support: partial
              title: Consumers
              type: entity_family
          default_enabled: true
          event:
            kind: activtrak.consumers
            required_payload_fields:
              - id
            schema_ref: activtrak/consumers/v1
            urn_kind: activtrak_consumers
          id: consumers
          id_field: id
          label: Consumers
          method: GET
          name_field: username
          path: /admin/v1/consumers
          projection:
            fields:
              display_name: username
              email: email
              user_id: id
            template: identity_user
          record_selector: $.consumers[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - activity_log
              high_value: true
              id: activity_log
              support: partial
              title: Activity Log
              type: audit_event
          default_enabled: true
          event:
            kind: activtrak.activity_log
            required_payload_fields:
              - logId
            schema_ref: activtrak/activity_log/v1
            urn_kind: activtrak_activity_log
          id: activity_log
          id_field: logId
          label: Activity Log
          method: GET
          name_field: description
          pagination:
            cursor_json_path: $.cursor
            cursor_param: cursor
            page_size: 150
            page_size_param: pageSize
            type: cursor
          path: /reports/v2/activitylog
          projection:
            fields:
              actor_id: user
              event_type: description
              id: logId
              resource_id: computerId
              resource_type: activity_log
            template: audit_event
          record_selector: $.activity[*]
      schema_version: cerebro.integration/v1
      source_id: activtrak
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.activtrak.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /scim/v1/ping
