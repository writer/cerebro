entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, accounts, records, policies, and audit events from Dixa and projects them into the Cerebro graph as users, assets, policies, and audit events for owner, account, evidence, and compliance context.
      display_name: Dixa
      id: builtin-dixa
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: dixa.users
            required_payload_fields:
              - id
            schema_ref: dixa/users/v1
            urn_kind: dixa_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              display_name: name
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - accounts
              high_value: true
              id: accounts
              support: partial
              title: Accounts
              type: entity_family
          default_enabled: true
          event:
            kind: dixa.accounts
            required_payload_fields:
              - id
            schema_ref: dixa/accounts/v1
            urn_kind: dixa_accounts
          id: accounts
          id_field: id
          label: Accounts
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/accounts
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: account
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - records
              high_value: true
              id: records
              support: partial
              title: Records
              type: entity_family
          default_enabled: true
          event:
            kind: dixa.records
            required_payload_fields:
              - id
            schema_ref: dixa/records/v1
            urn_kind: dixa_records
          id: records
          id_field: id
          label: Records
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/records
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: record
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - configuration_management
              evidence_types:
                - source_snapshot
              families:
                - policies
              high_value: true
              id: policies
              support: partial
              title: Policies
              type: entity_family
          default_enabled: true
          event:
            kind: dixa.policies
            required_payload_fields:
              - id
            schema_ref: dixa/policies/v1
            urn_kind: dixa_policies
          id: policies
          id_field: id
          label: Policies
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/policies
          projection:
            fields:
              policy_id: id
              policy_name: name
              policy_status: status
              policy_type: policy
            template: policy
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: dixa.audit_events
            required_payload_fields:
              - id
            schema_ref: dixa/audit_events/v1
            urn_kind: dixa_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit_events
          projection:
            fields:
              actor_email: actor_email
              actor_id: actor_id
              event_type: event_type
              id: id
              resource_id: resource_id
              resource_type: resource_type
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: dixa
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/me
