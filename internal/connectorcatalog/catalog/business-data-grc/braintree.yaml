entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-braintree
    tenant_id: builtin_catalog
    source_id: braintree
    display_name: Braintree
    description: Braintree connector definition catalog entry for high-value security and operations resources.
    categories:
    - business
    - billing
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.braintreegateway.com/merchants/${config.merchant_id}
      verification:
        method: GET
        path: "/transactions"
        expect_status:
        - 200
    resource_families:
    - id: transactions
      label: Transactions
      path: "/transactions"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: braintree.transactions
        schema_ref: braintree/transactions/v1
      projection:
        template: audit_event
      coverage:
      - id: transactions
        type: audit_event
        title: Transactions
        families:
        - transactions
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: customers
      label: Customers
      path: "/customers"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: braintree.customers
        schema_ref: braintree/customers/v1
      projection:
        template: identity_user
      coverage:
      - id: customers
        type: entity_family
        title: Customers
        families:
        - customers
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit-events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: braintree.audit_events
        schema_ref: braintree/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
