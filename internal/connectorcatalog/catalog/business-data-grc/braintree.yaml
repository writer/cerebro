entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - business
        - billing
      description: Collects transactions, customers, and audit events from Braintree and projects them into the Cerebro graph as audit events and users for owner, account, evidence, and compliance context.
      display_name: Braintree
      id: builtin-braintree
      resource_families:
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - transactions
              high_value: true
              id: transactions
              support: partial
              title: Transactions
              type: audit_event
          event:
            kind: braintree.transactions
            required_payload_fields:
              - id
            schema_ref: braintree/transactions/v1
            urn_kind: braintree_transactions
          id: transactions
          id_field: id
          label: Transactions
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /transactions
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - customers
              high_value: true
              id: customers
              support: partial
              title: Customers
              type: entity_family
          event:
            kind: braintree.customers
            required_payload_fields:
              - id
            schema_ref: braintree/customers/v1
            urn_kind: braintree_customers
          id: customers
          id_field: id
          label: Customers
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /customers
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: braintree.audit_events
            required_payload_fields:
              - id
            schema_ref: braintree/audit_events/v1
            urn_kind: braintree_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /audit-events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: braintree
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.braintreegateway.com/merchants/${config.merchant_id}
        verification:
          expect_status:
            - 200
          method: GET
          path: /transactions
