entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            reference_only: true
            secret: true
        model: oauth_client_credentials
        token_url: https://${config.tenant_url}/oauth/token
      categories:
        - grc
        - privacy
      description: Collects users, controls, and findings from OneTrust and projects them into the Cerebro graph as users, assets, and findings for owner, account, evidence, and compliance context.
      display_name: OneTrust
      id: builtin-onetrust
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          event:
            kind: onetrust.users
            required_payload_fields:
              - id
            schema_ref: onetrust/users/v1
            urn_kind: onetrust_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - controls
              high_value: true
              id: controls
              support: partial
              title: Controls
              type: entity_family
          event:
            kind: onetrust.controls
            required_payload_fields:
              - id
            schema_ref: onetrust/controls/v1
            urn_kind: onetrust_controls
          id: controls
          id_field: id
          label: Controls
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/controls
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - findings
              high_value: true
              id: findings
              support: partial
              title: Findings
              type: remediation_state
          event:
            kind: onetrust.findings
            required_payload_fields:
              - id
            schema_ref: onetrust/findings/v1
            urn_kind: onetrust_findings
          id: findings
          id_field: id
          label: Findings
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/findings
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: finding
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: onetrust
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.tenant_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/access/v1/users
