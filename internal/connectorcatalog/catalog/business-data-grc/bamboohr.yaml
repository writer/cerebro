entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-bamboohr
    tenant_id: builtin_catalog
    source_id: bamboohr
    display_name: BambooHR
    description: BambooHR connector definition catalog entry for high-value security and operations resources.
    categories:
    - hr
    - identity
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.bamboohr.com/api/gateway.php/${config.company}
      verification:
        method: GET
        path: "/v1/employees/directory"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Workers
      path: "/v1/workers"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: bamboohr.users
        schema_ref: bamboohr/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Workers
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: groups
      label: Organizations
      path: "/v1/organizations"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: bamboohr.groups
        schema_ref: bamboohr/groups/v1
      projection:
        template: identity_group
      coverage:
      - id: groups
        type: entity_family
        title: Organizations
        families:
        - groups
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: bamboohr.audit_events
        schema_ref: bamboohr/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
