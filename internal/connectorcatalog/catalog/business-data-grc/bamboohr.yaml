entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - hr
        - identity
      description: Collects workers, organizations, and audit events from BambooHR and projects them into the Cerebro graph as users, groups, and audit events for owner, account, evidence, and compliance context.
      display_name: BambooHR
      id: builtin-bamboohr
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Workers
              type: entity_family
          event:
            kind: bamboohr.users
            required_payload_fields:
              - id
            schema_ref: bamboohr/users/v1
            urn_kind: bamboohr_users
          id: users
          id_field: id
          label: Workers
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/workers
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Organizations
              type: entity_family
          event:
            kind: bamboohr.groups
            required_payload_fields:
              - id
            schema_ref: bamboohr/groups/v1
            urn_kind: bamboohr_groups
          id: groups
          id_field: id
          label: Organizations
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/organizations
          projection:
            fields:
              description: description|summary
              group_email: group_email|email
              group_id: id
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: bamboohr.audit_events
            required_payload_fields:
              - id
            schema_ref: bamboohr/audit_events/v1
            urn_kind: bamboohr_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: bamboohr
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.bamboohr.com/api/gateway.php/${config.company}
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/employees/directory
