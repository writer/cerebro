        kind: increase.event
        required_payload_fields:
        - id
        schema_ref: increase/event/v1
        urn_kind: increase_event
      event_kind: event
      id: event
      id_field: id
      label: Event
      list_key: data
      method: GET
      name_field: associated_object_id
      pagination:
        cursor_param: cursor
        page_size: 100
        page_size_param: limit
        type: cursor
      path: "/events"
      permissions_needed:
