entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: api_key
        label: API key
        reference_only: true
        required: true
        secret: true
      model: api_key
      requires_references: true
    categories:
    - saas
    description: "Collects aggregate log, user, agent rule, notification, smart list, and log from redirection.io and projects them into the Cerebro graph as audit events, users, policies, alerts, and assets for owner, account, evidence, and compliance context."
    display_name: redirection.io
    id: builtin_catalog-redirection_io
    ingest:
      mode: pull
    resource_families:
    - coverage:
      - control_domains:
        - logging_monitoring
        evidence_types:
        - logging_configuration
        families:
        - aggregate_log
        high_value: true
        id: audit_events
        support: partial
        title: Aggregate Log
        type: audit_event
      default_enabled: true
      event:
        kind: redirection_io.aggregate_log
        required_payload_fields:
        - id
        schema_ref: redirection_io/aggregate_log/v1
        urn_kind: redirection_aggregate_log
      event_kind: aggregate_log
      id: aggregate_log
      id_field: id
      label: Aggregate Log
      method: GET
      name_field: fixed
      pagination:
        inject_first_page: true
        page_param: page
        page_size: 100
        start_page: 1
        type: page
      path: "/aggregate-logs"
      permissions_needed:
      - apiKey
      projection:
        fields:
          id: id
          name: fixed
          provider_id: id
        template: audit_event
      record_selector: "$[*]"
    - coverage:
      - control_domains:
        - asset_inventory
        evidence_types:
