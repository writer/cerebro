entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: client_id
        label: Client ID
        reference_only: true
        required: true
        secret: true
      - key: client_secret
        label: Client secret
        reference_only: true
        required: true
        secret: true
      model: oauth_client_credentials
      requires_references: true
      token_expiration_buffer_seconds: 300
      token_request_auth_method: client_secret_basic
      token_url: https://accounts.salesloft.com/oauth/token
    categories:
    - saas
    description: "Collects crm activity fields json, account stages json, cadence memberships json, and groups json from Salesloft and projects them into the Cerebro graph as audit events, users, group memberships, and groups for owner, account, evidence, and compliance context."
    display_name: Salesloft
    id: builtin_catalog-salesloft
    resource_families:
    - coverage:
      - families:
        - crm_activity_fields_json
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
        id: audit_events
        support: partial
        title: Crm Activity Fields Json
        type: audit_event
      default_enabled: true
      event:
        kind: salesloft.crm_activity_fields_json
        required_payload_fields:
        - id
        schema_ref: salesloft/crm_activity_fields_json/v1
        urn_kind: salesloft_crm_activity_fields_json
      event_kind: crm_activity_fields_json
      id: crm_activity_fields_json
      id_field: id
      label: Crm Activity Fields Json
      method: GET
      name_field: title
      pagination:
        inject_first_page: true
        page_param: page
        page_size: 100
        page_size_param: per_page
        start_page: 1
        type: page
      path: "/v2/crm_activity_fields.json"
      projection:
        fields:
          id: id
          name: title
          provider_id: id
        template: audit_event
      record_selector: "$[*]"
    - coverage:
      - families:
        - account_stages_json
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: account_stages_json
        support: partial
        title: Account Stages Json
        type: entity_family
      default_enabled: true
      event:
        kind: salesloft.account_stages_json
        required_payload_fields:
        - id
        schema_ref: salesloft/account_stages_json/v1
        urn_kind: salesloft_account_stages_json
      event_kind: account_stages_json
      id: account_stages_json
      id_field: id
      label: Account Stages Json
      method: GET
      name_field: name
      pagination:
        inject_first_page: true
        page_param: page
        page_size: 100
        page_size_param: per_page
        start_page: 1
        type: page
      path: "/v2/account_stages.json"
      projection:
        fields:
          id: id
          name: name
          provider_id: id
        template: identity_user
      record_selector: "$[*]"
    - coverage:
      - families:
        - cadence_memberships_json
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: cadence_memberships_json
        support: partial
        title: Cadence Memberships Json
        type: entity_family
      default_enabled: true
      event:
        kind: salesloft.cadence_memberships_json
        required_payload_fields:
        - id
        schema_ref: salesloft/cadence_memberships_json/v1
        urn_kind: salesloft_cadence_memberships_json
      event_kind: cadence_memberships_json
      id: cadence_memberships_json
      id_field: id
      label: Cadence Memberships Json
      method: GET
      name_field: added_at
      pagination:
        inject_first_page: true
        page_param: page
        page_size: 100
        page_size_param: per_page
        start_page: 1
        type: page
      path: "/v2/cadence_memberships.json"
      projection:
        fields:
          id: id
          name: added_at
          provider_id: id
        template: group_membership
      record_selector: "$[*]"
    - coverage:
      - families:
        - groups_json
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: groups_json
        support: partial
        title: Groups Json
        type: entity_family
      default_enabled: true
      event:
        kind: salesloft.groups_json
        required_payload_fields:
        - id
        schema_ref: salesloft/groups_json/v1
        urn_kind: salesloft_groups_json
      event_kind: groups_json
      id: groups_json
      id_field: id
      label: Groups Json
      method: GET
      name_field: name
      pagination:
        type: none
      path: "/v2/groups.json"
      projection:
        fields:
          id: id
          name: name
          provider_id: id
        template: identity_group
      record_selector: "$[*]"
    schema_version: cerebro.integration/v1
    scope_options:
    - default_enabled: true
      families:
      - crm_activity_fields_json
      id: crm_activity_fields_json
      label: Crm Activity Fields Json
    - default_enabled: true
      families:
      - account_stages_json
      id: account_stages_json
      label: Account Stages Json
    - default_enabled: true
      families:
      - cadence_memberships_json
      id: cadence_memberships_json
      label: Cadence Memberships Json
    - default_enabled: true
      families:
      - groups_json
      id: groups_json
      label: Groups Json
    source_id: salesloft
    tenant_id: builtin_catalog
    transport:
      base_url: https://api.salesloft.com
      retry:
        backoff: exponential
        max_attempts: 3
        retry_after_header: Retry-After
        statuses:
        - 429
        - 500
        - 502
        - 503
        - 504
      verification:
        expect_status:
        - 200
        method: GET
        path: "/v2/crm_activity_fields.json"
