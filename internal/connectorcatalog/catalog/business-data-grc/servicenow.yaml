entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-servicenow
    tenant_id: builtin_catalog
    source_id: servicenow
    display_name: ServiceNow
    description: "Collects users, tickets, and audit events from ServiceNow and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context."
    categories:
    - itsm
    - grc
    auth:
      model: oauth_authorization_code
      authorization_url: https://${config.instance}.service-now.com/oauth/authorize
      token_url: https://${config.instance}.service-now.com/oauth/token
      credential_fields:
      - key: client_id
        reference_only: true
      - key: client_secret
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.instance}.service-now.com
      verification:
        method: GET
        path: "/api/now/table/sys_user"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: servicenow.users
        schema_ref: servicenow/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: tickets
      label: Tickets
      path: "/v1/tickets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: servicenow.tickets
        schema_ref: servicenow/tickets/v1
      projection:
        template: asset
      coverage:
      - id: tickets
        type: entity_family
        title: Tickets
        families:
        - tickets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: servicenow.audit_events
        schema_ref: servicenow/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
