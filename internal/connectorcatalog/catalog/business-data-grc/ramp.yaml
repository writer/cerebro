entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            reference_only: true
            secret: true
        model: oauth_client_credentials
        scopes:
          - users:read
          - cards:read
          - transactions:read
        token_url: https://api.ramp.com/developer/v1/token
      categories:
        - finance
        - business
      description: Collects users, cards, and transactions from Ramp and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context.
      display_name: Ramp
      id: builtin-ramp
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          event:
            kind: ramp.users
            required_payload_fields:
              - id
            schema_ref: ramp/users/v1
            urn_kind: ramp_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - assets
              high_value: true
              id: cards
              support: partial
              title: Cards
              type: entity_family
          event:
            kind: ramp.cards
            required_payload_fields:
              - id
            schema_ref: ramp/cards/v1
            urn_kind: ramp_cards
          id: cards
          id_field: id
          label: Cards
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /cards
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: transactions
              support: partial
              title: Transactions
              type: audit_event
          event:
            kind: ramp.transactions
            required_payload_fields:
              - id
            schema_ref: ramp/transactions/v1
            urn_kind: ramp_transactions
          id: transactions
          id_field: id
          label: Transactions
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /transactions
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: ramp
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.ramp.com/developer/v1
        verification:
          expect_status:
            - 200
          method: GET
          path: /users
