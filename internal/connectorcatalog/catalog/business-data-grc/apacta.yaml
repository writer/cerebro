entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: api_token
        label: Bearer token
        reference_only: true
        required: true
        secret: true
      model: bearer_token
      requires_references: true
    categories:
    - saas
    config_fields:
    - help: Contact ID used for the documented contact people endpoint.
      key: contact_id
      label: Contact Id
      required: true
    - help: Project ID used for the documented project users endpoint.
      key: project_id
      label: Project Id
      required: true
    description: Collects documented Apacta Partner API activities, cities, contact people, project users, and users into the Cerebro graph for inventory, access review, and operational context.
    display_name: Apacta
    id: builtin_catalog-apacta
    ingest:
      mode: pull
    resource_families:
    - coverage:
      - control_domains:
        - asset_inventory
        evidence_types:
        - source_snapshot
        families:
        - activity
        high_value: true
        id: activity
        support: partial
        title: Activities
        type: entity_family
      default_enabled: true
      event:
        kind: apacta.activity
        required_payload_fields:
        - id
        schema_ref: apacta/activity/v1
        urn_kind: apacta_activity
      event_kind: activity
      id: activity
      id_field: id
      label: Activities
      list_key: data
      method: GET
      name_field: name
      pagination:
        type: none
      path: "/activities"
      projection:
        fields:
          id: id
          name: name
          provider_id: id
        template: asset
      record_selector: "$.data[*]"
    - coverage:
      - control_domains:
        - asset_inventory
        evidence_types:
        - source_snapshot
        families:
        - city
        high_value: true
        id: city
        support: partial
        title: Cities
        type: entity_family
      default_enabled: true
      event:
        kind: apacta.city
        required_payload_fields:
        - id
        schema_ref: apacta/city/v1
        urn_kind: apacta_city
      event_kind: city
      id: city
      id_field: id
      label: Cities
      list_key: data
      method: GET
      name_field: name
      pagination:
        type: none
      path: "/cities"
      projection:
        fields:
          id: id
          name: name
          resource_id: id
          resource_name: name
          resource_type: city
        template: asset
      record_selector: "$.data[*]"
    - coverage:
      - control_domains:
        - asset_inventory
        evidence_types:
        - source_snapshot
        families:
        - contact_person
        high_value: true
        id: contact_person
        support: partial
        title: Contact People
        type: entity_family
      default_enabled: true
      event:
        kind: apacta.contact_person
        required_payload_fields:
        - id
        schema_ref: apacta/contact_person/v1
        urn_kind: apacta_contact_person
      event_kind: contact_person
      id: contact_person
      id_field: id
      label: Contact People
      list_key: data
      method: GET
      name_field: name
      pagination:
        type: none
      path: "/contacts/${config.contact_id}/contact_persons"
      permissions_needed:
      - Bearer token
      projection:
        fields:
          id: id
          name: name
          provider_id: id
        template: identity_user
      record_selector: "$.data[*]"
    - coverage:
      - control_domains:
        - asset_inventory
        - access_review
        evidence_types:
        - source_snapshot
        families:
        - projects_user
        high_value: true
        id: projects_user
        support: partial
        title: Project Users
        type: entity_family
      default_enabled: true
      event:
        kind: apacta.projects_user
        required_payload_fields:
        - id
        schema_ref: apacta/projects_user/v1
        urn_kind: apacta_projects_user
      event_kind: projects_user
      id: projects_user
      id_field: id
      label: Project Users
      list_key: data
      method: GET
      name_field: email
      pagination:
        type: none
      path: "/projects/${config.project_id}/users"
      permissions_needed:
      - Bearer token
      projection:
        fields:
          id: id
          name: email
          provider_id: id
        template: identity_user
      record_selector: "$.data[*]"
      sensitive_payload_paths:
      - password
    - coverage:
      - control_domains:
        - asset_inventory
        - access_review
        evidence_types:
        - source_snapshot
        families:
        - user
        high_value: true
        id: user
        support: partial
        title: Users
        type: entity_family
      default_enabled: true
      event:
        kind: apacta.user
        required_payload_fields:
        - id
        schema_ref: apacta/user/v1
        urn_kind: apacta_user
      event_kind: user
      id: user
      id_field: id
      label: Users
      list_key: data
      method: GET
      name_field: email
      pagination:
        type: none
      path: "/users"
      permissions_needed:
      - Bearer token
      projection:
        fields:
          id: id
          name: email
          provider_id: id
        template: identity_user
      record_selector: "$.data[*]"
      sensitive_payload_paths:
      - password
    schema_version: cerebro.integration/v1
    scope_options:
    - default_enabled: true
      families:
      - activity
      id: activity
      label: Activities
    - default_enabled: true
      families:
      - city
      id: city
      label: Cities
    - default_enabled: true
      families:
      - contact_person
      id: contact_person
      label: Contact People
    - default_enabled: true
      families:
      - projects_user
      id: projects_user
      label: Project Users
    - default_enabled: true
      families:
      - user
      id: user
      label: Users
    source_id: apacta
    tenant_id: builtin_catalog
    transport:
      base_url: https://app.apacta.com/api/v1
      retry:
        backoff: exponential
        max_attempts: 3
        retry_after_header: Retry-After
        statuses:
        - 429
        - 500
        - 502
        - 503
        - 504
      verification:
        expect_status:
        - 200
        method: GET
        path: "/activities"
