entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: api_key
        label: API key
        reference_only: true
        required: true
        secret: true
      model: api_key
      requires_references: true
    categories:
    - saas
    config_fields:
    - key: api_base_url
      label: API base URL
      placeholder: api.example.com
      required: true
    description: Collects task event, account, client role, formrule, notification, and device from GSMTasks and projects them into the Cerebro graph as alerts, assets, audit events, groups, policies, and users for inventory, access review, audit, risk, and operational context.
    display_name: GSMTasks
    id: builtin_catalog-gsmtasks
    ingest:
      mode: pull
    resource_families:
    - coverage:
      - control_domains:
        - logging_monitoring
        evidence_types:
        - logging_configuration
        families:
        - task_event
        high_value: true
        id: audit_events
        support: partial
        title: Task Event
        type: audit_event
      default_enabled: true
      event:
        kind: gsmtasks.task_event
        required_payload_fields:
        - id
        schema_ref: gsmtasks/task_event/v1
        urn_kind: gsmtasks_task_event
      event_kind: task_event
      id: task_event
      id_field: id
      label: Task Event
      method: GET
      name_field: url
      pagination:
        cursor_param: cursor
        page_size: 100
        page_size_param: page_size
        type: cursor
      path: "/task_events/"
      permissions_needed:
      - tokenAuth
      projection:
        fields:
          id: id
          name: url
          provider_id: id
        template: audit_event
      record_selector: "$[*]"
