entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-zendesk
    tenant_id: builtin_catalog
    source_id: zendesk
    display_name: Zendesk
    description: Zendesk connector definition catalog entry for high-value security and operations resources.
    categories:
    - itsm
    - support
    auth:
      model: basic
      credential_fields:
      - key: username
        reference_only: true
      - key: password
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.subdomain}.zendesk.com/api
      verification:
        method: GET
        path: "/v2/users/me"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: zendesk.users
        schema_ref: zendesk/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: tickets
      label: Tickets
      path: "/v1/tickets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: zendesk.tickets
        schema_ref: zendesk/tickets/v1
      projection:
        template: asset
      coverage:
      - id: tickets
        type: entity_family
        title: Tickets
        families:
        - tickets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: zendesk.audit_events
        schema_ref: zendesk/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
