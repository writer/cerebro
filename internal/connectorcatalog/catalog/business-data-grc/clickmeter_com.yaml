        title: Clickstream
        type: audit_event
      default_enabled: true
      event:
        kind: clickmeter_com.clickstream
        required_payload_fields:
        - accessTime
        schema_ref: clickmeter_com/clickstream/v1
        urn_kind: clickmeter_clickstream
      event_kind: clickstream
      id: clickstream
      id_field: accessTime
      label: Clickstream
      list_key: entities
      method: GET
      name_field: accessTime
      pagination:
        page_size: 100
        page_size_param: pageSize
        type: page
      path: "/clickstream"
      permissions_needed:
      - api_key
      projection:
        fields:
