entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: API token
            reference_only: true
            required: true
            secret: true
        model: api_key
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: ActiveCampaign account API origin, for example https://youraccountname.api-us1.com.
          key: base_url
          label: API base URL
          required: true
      description: Collects ActiveCampaign users, accounts, contacts, campaigns, and automations from the documented v3 REST API and projects them into the Cerebro graph for account, owner, and business-data evidence context.
      display_name: ActiveCampaign
      id: builtin-activecampaign
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: activecampaign.users
            required_payload_fields:
              - id
            schema_ref: activecampaign/users/v1
            urn_kind: activecampaign_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: username
          pagination:
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /api/3/users
          projection:
            fields:
              display_name: username
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.users[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - accounts
              high_value: true
              id: accounts
              support: partial
              title: Accounts
              type: entity_family
          default_enabled: true
          event:
            kind: activecampaign.accounts
            required_payload_fields:
              - id
            schema_ref: activecampaign/accounts/v1
            urn_kind: activecampaign_accounts
          id: accounts
          id_field: id
          label: Accounts
          method: GET
          name_field: name
          pagination:
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /api/3/accounts
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: account
            template: asset
          record_selector: $.accounts[*]
        - coverage:
            - control_domains:
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - contacts
              high_value: true
              id: contacts
              support: partial
              title: Contacts
              type: entity_family
          default_enabled: true
          event:
            kind: activecampaign.contacts
            required_payload_fields:
              - id
            schema_ref: activecampaign/contacts/v1
            urn_kind: activecampaign_contacts
          id: contacts
          id_field: id
          label: Contacts
          method: GET
          name_field: email
          pagination:
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /api/3/contacts
          projection:
            fields:
              id: id
              name: email
              resource_id: id
              resource_name: email
              resource_type: activecampaign_contact
            template: asset
          record_selector: $.contacts[*]
        - coverage:
            - control_domains:
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - campaigns
              high_value: true
              id: campaigns
              support: partial
              title: Campaigns
              type: entity_family
          default_enabled: true
          event:
            kind: activecampaign.campaigns
            required_payload_fields:
              - id
            schema_ref: activecampaign/campaigns/v1
            urn_kind: activecampaign_campaigns
          id: campaigns
          id_field: id
          label: Campaigns
          method: GET
          name_field: name
          pagination:
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /api/3/campaigns
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: activecampaign_campaign
            template: asset
          record_selector: $.campaigns[*]
        - coverage:
            - control_domains:
                - security_operations
              evidence_types:
                - configuration_state
              families:
                - automations
              high_value: true
              id: automations
              support: partial
              title: Automations
              type: entity_family
          default_enabled: true
          event:
            kind: activecampaign.automations
            required_payload_fields:
              - id
            schema_ref: activecampaign/automations/v1
            urn_kind: activecampaign_automations
          id: automations
          id_field: id
          label: Automations
          method: GET
          name_field: name
          pagination:
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /api/3/automations
          projection:
            fields:
              id: id
              resource_id: id
              resource_name: name
              resource_type: activecampaign_automation
            template: asset
          record_selector: $.automations[*]
      schema_version: cerebro.integration/v1
      source_id: activecampaign
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/3/users/me
