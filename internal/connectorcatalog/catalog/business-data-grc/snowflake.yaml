entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            reference_only: true
            secret: true
        model: oauth_client_credentials
        token_url: https://${config.account}.snowflakecomputing.com/oauth/token
      categories:
        - data
        - warehouse
      config_fields:
        - key: account
          label: Account
          required: true
      description: Collects data assets, cortex search services, audit events, and vulnerabilities from Snowflake and projects them into the Cerebro graph as assets, audit events, and vulnerabilities for owner, account, evidence, and compliance context.
      display_name: Snowflake
      id: builtin-snowflake
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - assets
              high_value: true
              id: assets
              support: partial
              title: Data assets
              type: entity_family
          event:
            kind: snowflake.assets
            required_payload_fields:
              - id
            schema_ref: snowflake/assets/v1
            urn_kind: snowflake_assets
          id: assets
          id_field: id
          label: Data assets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/assets
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - cortex_search_services
              high_value: true
              id: cortex_search_services
              support: partial
              title: Cortex search services
              type: entity_family
          event:
            kind: snowflake.cortex_search_services
            required_payload_fields:
              - name
            schema_ref: snowflake/cortex_search_services/v1
            urn_kind: snowflake_cortex_search_services
          id: cortex_search_services
          id_field: name
          label: Cortex search services
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/cortex/search/services
          projection:
            fields:
              resource_id: name
              resource_name: name
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: snowflake.audit_events
            required_payload_fields:
              - id
            schema_ref: snowflake/audit_events/v1
            urn_kind: snowflake_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - vulnerabilities
              high_value: true
              id: vulnerabilities
              support: partial
              title: Vulnerabilities
              type: remediation_state
          event:
            kind: snowflake.vulnerabilities
            required_payload_fields:
              - id
            schema_ref: snowflake/vulnerabilities/v1
            urn_kind: snowflake_vulnerabilities
          id: vulnerabilities
          id_field: id
          label: Vulnerabilities
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/vulnerabilities
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: vulnerability
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: snowflake
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.account}.snowflakecomputing.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/v2/databases
