entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - security_training
        - grc
      config_fields:
        - help: KnowBe4 Reporting API region host prefix, such as us, eu, ca, uk, or de.
          key: region
          label: API region
          placeholder: us
          required: true
      description: Collects learners, groups, training enrollments, and phishing campaigns from KnowBe4 and projects them into the Cerebro graph as users, groups, audit events, and assets for owner, account, evidence, and compliance context.
      display_name: KnowBe4
      id: builtin-knowbe4
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Learners
              type: entity_family
          event:
            kind: knowbe4.users
            required_payload_fields:
              - id
            schema_ref: knowbe4/users/v1
            urn_kind: knowbe4_users
          id: users
          id_field: id
          label: Learners
          method: GET
          name_field: email
          pagination:
            page_param: page
            page_size: 100
            page_size_param: per_page
            start_page: 1
            type: page
          path: /users
          projection:
            fields:
              display_name: email
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          event:
            kind: knowbe4.groups
            required_payload_fields:
              - id
            schema_ref: knowbe4/groups/v1
            urn_kind: knowbe4_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          name_field: name
          pagination:
            page_param: page
            page_size: 100
            page_size_param: per_page
            start_page: 1
            type: page
          path: /groups
          projection:
            fields:
              description: description|summary
              group_email: group_email|email
              group_id: id
              group_name: name
            template: identity_group
          record_selector: $[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - training_enrollments
              high_value: true
              id: training_enrollments
              support: partial
              title: Training enrollments
              type: audit_event
          event:
            kind: knowbe4.training_enrollments
            required_payload_fields:
              - id
            schema_ref: knowbe4/training_enrollments/v1
            urn_kind: knowbe4_training_enrollments
          id: training_enrollments
          id_field: id
          label: Training enrollments
          method: GET
          pagination:
            page_param: page
            page_size: 100
            page_size_param: per_page
            start_page: 1
            type: page
          path: /training/enrollments
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - phishing_campaigns
              high_value: true
              id: phishing_campaigns
              support: partial
              title: Phishing campaigns
              type: entity_family
          event:
            kind: knowbe4.phishing_campaigns
            required_payload_fields:
              - id
            schema_ref: knowbe4/phishing_campaigns/v1
            urn_kind: knowbe4_phishing_campaigns
          id: phishing_campaigns
          id_field: id
          label: Phishing campaigns
          method: GET
          name_field: name
          pagination:
            page_param: page
            page_size: 100
            page_size_param: per_page
            start_page: 1
            type: page
          path: /phishing/campaigns
          projection:
            fields:
              resource_id: id
              resource_name: name
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $[*]
      schema_version: cerebro.integration/v1
      source_id: knowbe4
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.region}.api.knowbe4.com/v1
        verification:
          expect_status:
            - 200
          method: GET
          path: /users
