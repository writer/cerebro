---
entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-ziphq
    tenant_id: builtin_catalog
    source_id: ziphq
    display_name: Ziphq
    description: "Collects users, accounts, records, policies, and audit events from Ziphq and projects them into the Cerebro graph as users, assets, policies, and audit events for owner, account, evidence, and compliance context."
    categories:
    - saas
    - business_data_grc
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        label: Bearer token
        secret: true
        reference_only: true
        required: true
      requires_references: true
    config_fields:
    - key: base_url
      label: API base URL
      required: true
      help: Tenant or regional API base URL.
    transport:
      base_url: "${config.base_url}"
      verification:
        method: GET
        path: "/v1/me"
        expect_status:
        - 200
    ingest:
      mode: pull
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: ziphq.users
        schema_ref: ziphq/users/v1
        required_payload_fields:
        - id
      projection:
        template: identity_user
        fields:
          user_id: id
          display_name: name
          email: email
          status: status
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: accounts
      label: Accounts
      path: "/v1/accounts"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: ziphq.accounts
        schema_ref: ziphq/accounts/v1
        required_payload_fields:
        - id
      projection:
        template: asset
        fields:
          id: id
          name: name
          resource_id: id
          resource_name: name
          resource_type: account
      coverage:
      - id: accounts
        type: entity_family
        title: Accounts
        families:
        - accounts
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: records
      label: Records
      path: "/v1/records"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: ziphq.records
        schema_ref: ziphq/records/v1
        required_payload_fields:
        - id
      projection:
        template: asset
        fields:
          id: id
          name: name
          resource_id: id
          resource_name: name
          resource_type: record
      coverage:
      - id: records
        type: entity_family
        title: Records
        families:
        - records
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - data_governance
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: policies
      label: Policies
      path: "/v1/policies"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: ziphq.policies
        schema_ref: ziphq/policies/v1
        required_payload_fields:
        - id
      projection:
        template: policy
        fields:
          policy_id: id
          policy_name: name
          policy_type: policy
          policy_status: status
      coverage:
      - id: policies
        type: entity_family
        title: Policies
        families:
        - policies
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - configuration_management
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: audit_events
      label: Audit events
      path: "/v1/audit_events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: ziphq.audit_events
        schema_ref: ziphq/audit_events/v1
        required_payload_fields:
        - id
      projection:
        template: audit_event
        fields:
          id: id
          event_type: event_type
          actor_id: actor_id
          actor_email: actor_email
          resource_id: resource_id
          resource_type: resource_type
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
