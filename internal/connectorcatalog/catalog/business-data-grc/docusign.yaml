entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: token
        label: Bearer token
        reference_only: true
        required: true
        secret: true
      model: bearer_token
      requires_references: true
    categories:
    - saas
    config_fields:
    - help: Path parameter inferred from the OpenAPI operation.
      key: accountid
      label: Accountid
      required: true
    description: The DocuSign REST API provides you with a powerful, convenient, and simple Web services API for interacting with DocuSign.
    display_name: DocuSign
    id: builtin_catalog-docusign
    resource_families:
    - coverage:
      - families:
        - bcc_email_archive
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: bcc_email_archive
        support: partial
        title: Bcc Email Archive
        type: entity_family
      default_enabled: true
      event:
        kind: docusign.bcc_email_archive
        required_payload_fields:
        - email
        schema_ref: docusign/bcc_email_archive/v1
        urn_kind: docusign_bcc_email_archive
      event_kind: bcc_email_archive
      id: bcc_email_archive
      id_field: email
      label: Bcc Email Archive
      list_key: bccEmailArchives
      method: GET
      name_field: email
      pagination:
        page_size: 100
        page_size_param: count
        type: page
      path: "/v2.1/accounts/${config.accountid}/settings/bcc_email_archives"
      projection:
        fields:
          id: email
          name: email
          provider_id: email
        template: identity_user
      record_selector: "$.bccEmailArchives[*]"
