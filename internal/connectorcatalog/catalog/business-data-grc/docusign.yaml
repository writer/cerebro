        urn_kind: docusign_signing_group
      event_kind: signing_group
      id: signing_group
      id_field: created
      label: Signing Group
      list_key: groups
      method: GET
      name_field: created
      pagination:
        type: none
      path: "/v2.1/accounts/${config.accountid}/signing_groups"
      projection:
        fields:
          id: created
          name: created
          provider_id: created
        template: identity_group
      record_selector: "$.groups[*]"
