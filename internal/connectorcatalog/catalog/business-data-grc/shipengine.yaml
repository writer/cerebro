entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: api_key
        label: API key
        reference_only: true
        required: true
        secret: true
      model: api_key
      requires_references: true
    categories:
    - saas
    config_fields:
    - help: Path parameter inferred from the OpenAPI operation.
      key: label_id
      label: Label Id
      required: true
    description: "Collects tracking, package, track, and webhook from ShipEngine and projects them into the Cerebro graph as audit events and assets for owner, account, evidence, and compliance context."
    display_name: ShipEngine
    id: builtin_catalog-shipengine
    resource_families:
    - coverage:
      - families:
        - tracking
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
        id: audit_events
        support: partial
        title: Tracking
        type: audit_event
      default_enabled: true
      event:
        kind: shipengine.tracking
        required_payload_fields:
        - carrier_detail_code
        schema_ref: shipengine/tracking/v1
        urn_kind: shipengine_tracking
      event_kind: tracking
      id: tracking
      id_field: carrier_detail_code
      label: Tracking
      list_key: events
      method: GET
      name_field: description
      pagination:
        type: none
      path: "/v1/tracking"
      permissions_needed:
      - api_key
      projection:
        fields:
          id: carrier_detail_code
          name: description
          provider_id: carrier_detail_code
        template: audit_event
      record_selector: "$.events[*]"
    - coverage:
      - families:
        - package
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: package
        support: partial
        title: Package
        type: entity_family
      default_enabled: true
      event:
        kind: shipengine.package
        required_payload_fields:
        - name
        schema_ref: shipengine/package/v1
        urn_kind: shipengine_package
      event_kind: package
      id: package
      id_field: name
      label: Package
      list_key: packages
      method: GET
      name_field: name
      pagination:
        type: none
      path: "/v1/packages"
      permissions_needed:
      - api_key
      projection:
        fields:
          id: name
          name: name
          resource_id: name
          resource_name: name
          resource_type: package
        template: asset
      record_selector: "$.packages[*]"
    - coverage:
      - families:
        - track
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
        id: audit_events
        support: partial
        title: Track
        type: audit_event
      default_enabled: true
      event:
        kind: shipengine.track
        required_payload_fields:
        - carrier_detail_code
        schema_ref: shipengine/track/v1
        urn_kind: shipengine_track
      event_kind: track
      id: track
      id_field: carrier_detail_code
      label: Track
      list_key: events
      method: GET
      name_field: description
      pagination:
        type: none
      path: "/v1/labels/${config.label_id}/track"
      permissions_needed:
      - api_key
      projection:
        fields:
          id: carrier_detail_code
          name: description
          provider_id: carrier_detail_code
        template: audit_event
      record_selector: "$.events[*]"
    - coverage:
      - families:
        - webhook
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: webhook
        support: partial
        title: Webhook
        type: entity_family
      default_enabled: true
      event:
        kind: shipengine.webhook
        required_payload_fields:
        - event
        schema_ref: shipengine/webhook/v1
        urn_kind: shipengine_webhook
      event_kind: webhook
      id: webhook
      id_field: event
      label: Webhook
      method: GET
      name_field: url
      pagination:
        type: none
      path: "/v1/environment/webhooks"
      permissions_needed:
      - api_key
      projection:
        fields:
          id: event
          name: url
          resource_id: event
          resource_name: url
          resource_type: webhook
        template: asset
      record_selector: "$[*]"
    schema_version: cerebro.integration/v1
    scope_options:
    - default_enabled: true
      families:
      - tracking
      id: tracking
      label: Tracking
    - default_enabled: true
      families:
      - package
      id: package
      label: Package
    - default_enabled: true
      families:
      - track
      id: track
      label: Track
    - default_enabled: true
      families:
      - webhook
      id: webhook
      label: Webhook
    source_id: shipengine
    tenant_id: builtin_catalog
    transport:
      base_url: https://api.shipengine.com
      retry:
        backoff: exponential
        max_attempts: 3
        retry_after_header: Retry-After
        statuses:
        - 429
        - 500
        - 502
        - 503
        - 504
      verification:
        expect_status:
        - 200
        method: GET
        path: "/v1/tracking"
