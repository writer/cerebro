entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: username
            label: API key
            reference_only: true
            required: true
            secret: true
          - key: password
            label: API secret
            reference_only: true
            required: true
            secret: true
        model: basic
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Fivetran API base URL. Use the default unless the tenant is pinned to a regional endpoint.
          key: base_url
          label: API base URL
          required: false
        - help: Comma-separated user IDs for user-scoped connection and group membership reads.
          key: user_ids
          label: User IDs
          required: false
        - help: Comma-separated team IDs for team-scoped user, connection, and group membership reads.
          key: team_ids
          label: Team IDs
          required: false
        - help: Comma-separated group IDs for group-scoped user and connection membership reads.
          key: group_ids
          label: Group IDs
          required: false
        - help: Comma-separated connection IDs for certificate and fingerprint trust reads.
          key: connection_ids
          label: Connection IDs
          required: false
      description: Collects Fivetran users, roles, teams, groups, memberships, destinations, connections, connection certificates, fingerprints, external logging, webhooks, private links, proxy agents, hybrid deployment agents, connector metadata, system keys, and transformations through the Fivetran REST API for access review, pipeline inventory, credential review, logging, and network trust context.
      display_name: Fivetran
      id: builtin-fivetran
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains: [identity_access, authorization]
              evidence_types: [identity_configuration, source_snapshot]
              families: [users]
              high_value: true
              id: users
              support: supported
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: fivetran.users
            required_attributes: [tenant_id, source_event_id, user_id]
            required_payload_fields: [id]
            schema_ref: fivetran/users/v1
            urn_kind: fivetran_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination: &fivetran_cursor_pagination
            cursor_json_path: $.data.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              display_name: name|given_name|email
              email: email
              login: email
              primary_email: email
              resource_id: id
              resource_name: name|email
              source_event_id: id
              status: verified|active|status
              user_id: id
            template: identity_user
          record_selector: $.data.items[*]
        - coverage:
            - control_domains: [identity_access, access_review]
              evidence_types: [access_review, relationship_evidence]
              families: [user_connections]
              high_value: true
              id: user_connections
              support: supported
              title: User connection access
              type: relationship
          default_enabled: true
