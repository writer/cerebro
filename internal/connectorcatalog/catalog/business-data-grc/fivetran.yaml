entries:
  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-fivetran
      tenant_id: builtin_catalog
      source_id: fivetran
      display_name: Fivetran
      description: Collects Fivetran account access, pipeline inventory, logging configuration, networking agents, keys, secrets, transformations, webhooks, and membership records from the Fivetran REST API.
      runtime: json_api
      stage: approved
      current_version: 2
      categories:
        - saas
        - business_data_grc
      auth:
        model: basic
        requires_references: true
        credential_fields:
          - key: username
            label: API key
            reference_only: true
            required: true
          - key: password
            label: API secret
            reference_only: true
            required: true
            secret: true
      config_fields:
        - key: base_url
          label: API base URL
          help: Fivetran REST API base URL.
          placeholder: https://api.fivetran.com
          required: true
        - key: group_id
          label: Group ID
          help: Group ID for group-scoped reads.
        - key: team_id
          label: Team ID
          help: Team ID for team-scoped reads.
        - key: user_id
          label: User ID
          help: User ID for user-scoped membership reads.
        - key: connection_id
          label: Connection ID
          help: Connection ID for connection-scoped reads.
        - key: destination_id
          label: Destination ID
          help: Destination ID for destination-scoped reads.
        - key: agent_id
          label: Proxy agent ID
          help: Proxy agent ID for proxy-scoped reads.
      ingest:
        mode: pull
      transport:
        base_url: ${config.base_url}
        headers:
          Accept: application/json;version=2
        verification:
          method: GET
          path: /v1/account/info
          expect_status: [200]
      resource_families:
        - id: users
          label: Users
          method: GET
          path: /v1/users
          record_selector: $.data.items[*]
          id_field: id
          name_field: email
          pagination: &fivetran_cursor
            type: cursor
            cursor_param: cursor
            cursor_json_path: $.data.next_cursor
            page_size_param: limit
            page_size: 100
          event:
            kind: fivetran.users
            schema_ref: fivetran/users/v1
            urn_kind: fivetran_users
            required_payload_fields: [id]
          projection:
            template: identity_user
            fields:
              user_id: id
              email: email
              display_name: given_name|family_name|email
              status: active
          coverage:
            - id: account_access
              title: Account access
              type: entity_family
              families: [users]
              support: supported
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [identity_access, access_review]
        - id: groups
          label: Groups
          method: GET
          path: /v1/groups
          record_selector: $.data.items[*]
          id_field: id
          name_field: name
          pagination: *fivetran_cursor
          event:
            kind: fivetran.groups
            schema_ref: fivetran/groups/v1
            urn_kind: fivetran_groups
            required_payload_fields: [id]
          projection:
            template: identity_group
            fields:
              group_id: id
              group_name: name
          coverage:
            - id: account_access
              title: Account access
              type: entity_family
              families: [groups]
              support: supported
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [identity_access, access_review]
        - id: group_users
          label: Group users
          method: GET
          path: /v1/groups/{group_id}/users
          record_selector: $.data.items[*]
          id_field: id
          name_field: email
          read:
            path_params: [group_id]
          config:
            config_attributes:
              group_id: group_id
          pagination: *fivetran_cursor
          event:
            kind: fivetran.group_users
            schema_ref: fivetran/group_users/v1
            urn_kind: fivetran_group_users
            required_attributes: [group_id]
            required_payload_fields: [id]
          projection:
            template: identity_user
            fields:
              user_id: id
              email: email
          coverage: &access_coverage
            - id: account_access
              title: Account access
              type: entity_family
              families: [group_users]
              support: supported
              high_value: false
              evidence_types: [source_snapshot]
              control_domains: [identity_access, access_review]
        - id: group_connections
          label: Group connections
          method: GET
          path: /v1/groups/{group_id}/connections
          record_selector: $.data.items[*]
          id_field: id
          name_field: schema
          read:
            path_params: [group_id]
          config:
            config_attributes:
              group_id: group_id
          pagination: *fivetran_cursor
          event:
            kind: fivetran.group_connections
            schema_ref: fivetran/group_connections/v1
            urn_kind: fivetran_group_connections
            required_attributes: [group_id]
            required_payload_fields: [id]
          projection:
            template: asset
            fields: &connection_fields
              resource_id: id
              resource_name: schema|service|id
              resource_type: connection
              connection_id: id
              group_id: group_id
          coverage: &pipeline_coverage
            - id: pipeline_inventory
              title: Pipeline inventory
              type: entity_family
              families: [connections]
              support: supported
              high_value: true
              evidence_types: [source_snapshot]
              control_domains: [asset_inventory, data_governance]
        - id: teams
