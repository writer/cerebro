      validation:
        status: ready
        summary: Fivetran REST API families are mapped from provider-owned API reference paths.
        checks:
          - id: provider_api_reference
            label: Provider API reference
            status: passed
            severity: info
            detail: REST paths, auth, pagination, and response envelope verified against the provider OpenAPI definition.
      promotion:
        eligible_stages: [approved, certified]
        required_gates: [definition_validation, sandbox_probe, admin_review]
