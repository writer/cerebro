            required_payload_fields: [id]
            schema_ref: fivetran/user_connections/v1
            urn_kind: fivetran_user_connections
          id: user_connections
          id_field: id
          label: User connections
          method: GET
          name_field: name
          pagination: *fivetran_cursor_pagination
          path: /v1/users/{user_id}/connections
          projection:
            fields:
              member_id: id|connection_id
              member_type: connection
              resource_id: id|connection_id
              resource_name: name|schema|service
              role: role
              source_event_id: id|connection_id
              tenant_id: tenant_id
              user_id: user_id
            template: asset
