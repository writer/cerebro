            urn_kind: fivetran_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination: &fivetran_cursor_pagination
            cursor_json_path: $.data.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              display_name: name|given_name|email
              email: email
              login: email
              primary_email: email
              resource_id: id
              resource_name: name|email
              source_event_id: id
