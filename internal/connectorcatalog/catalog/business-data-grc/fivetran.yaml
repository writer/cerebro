entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: username
            label: API key
            reference_only: true
            required: true
            secret: true
          - key: password
            label: API secret
            reference_only: true
            required: true
            secret: true
        model: basic
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Fivetran API base URL. Use the default unless the tenant is pinned to a regional endpoint.
          key: base_url
          label: API base URL
          required: false
        - help: Comma-separated user IDs for user-scoped connection and group membership reads.
          key: user_ids
          label: User IDs
          required: false
        - help: Comma-separated team IDs for team-scoped user, connection, and group membership reads.
          key: team_ids
          label: Team IDs
          required: false
        - help: Comma-separated group IDs for group-scoped user and connection membership reads.
          key: group_ids
          label: Group IDs
          required: false
        - help: Comma-separated connection IDs for certificate and fingerprint trust reads.
          key: connection_ids
          label: Connection IDs
          required: false
        - help: Comma-separated destination IDs for destination certificate and fingerprint trust reads.
          key: destination_ids
          label: Destination IDs
          required: false
        - help: Comma-separated external secret manager IDs for per-manager assignment reads.
          key: external_secret_manager_ids
          label: External secret manager IDs
          required: false
        - help: Comma-separated proxy agent IDs for proxy connection attachment reads.
          key: proxy_agent_ids
          label: Proxy agent IDs
          required: false
        - help: Comma-separated connector service slugs for connector metadata detail reads.
          key: connector_services
          label: Connector services
          required: false
        - help: Comma-separated transformation package definition IDs for package detail reads.
          key: package_definition_ids
          label: Package definition IDs
          required: false
        - help: Connection ID for table-column configuration reads.
          key: connection_id
          label: Column connection ID
          required: false
        - help: Schema name for table-column configuration reads.
          key: schema_name
          label: Column schema name
          required: false
        - help: Table name for table-column configuration reads.
          key: table_name
          label: Column table name
          required: false
      description: Collects Fivetran account info, users, roles, teams, groups, memberships, group keys and service accounts, destinations, connections, connection schema, state, and table-column configuration, connector package metadata, destination and connection trust material, account logging, external logging, webhooks, external secret managers, private links, proxy agents, proxy connection attachments, hybrid deployment agents, connector metadata and details, system keys, transformations, and transformation projects through the Fivetran REST API for access review, pipeline inventory, credential review, logging, secret-store dependency, and network trust context.
      display_name: Fivetran
      id: builtin-fivetran
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains: [identity_access, asset_inventory]
              evidence_types: [identity_configuration, source_snapshot]
              families: [account_info]
              high_value: false
              id: account_profile
              support: supported
              title: Account profile
              type: entity_family
          default_enabled: true
          event:
            kind: fivetran.account_info
            required_attributes: [tenant_id, source_event_id, account_id, resource_id, resource_type]
            required_payload_fields: [account_id]
            schema_ref: fivetran/account_info/v1
            urn_kind: fivetran_account_info
          id: account_info
          id_field: account_id
          label: Account info
          method: GET
          name_field: account_name
          path: /v1/account/info
          projection:
            fields:
              account_id: account_id
              resource_id: account_id
              resource_name: account_name|account_id
              resource_type: account
              source_event_id: account_id
              system_key_id: system_key_id
              user_id: user_id
            template: asset
          read:
            singleton: true
            disable_page_size: true
        - coverage:
            - control_domains: [identity_access, authorization]
              evidence_types: [identity_configuration, source_snapshot]
              families: [users]
              high_value: true
              id: users
              support: supported
