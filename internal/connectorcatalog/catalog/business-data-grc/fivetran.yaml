          name_field: name
          pagination: *fivetran_cursor
          event:
            kind: fivetran.teams
            schema_ref: fivetran/teams/v1
            urn_kind: fivetran_teams
            required_payload_fields: [id]
          projection:
            template: asset
            fields:
              resource_id: id
              resource_name: name
              resource_type: team
              team_id: id
          coverage: *access_coverage
        - id: team_users
          label: Team users
          method: GET
          path: /v1/teams/{team_id}/users
          record_selector: $.data.items[*]
          id_field: user_id
          name_field: user_id
          read:
            path_params: [team_id]
          config:
