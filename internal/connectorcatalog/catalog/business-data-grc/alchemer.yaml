entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_token
            label: API token
            reference_only: true
            required: true
            secret: true
          - key: api_token_secret
            label: API token secret
            reference_only: true
            required: true
            secret: true
        model: api_key
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Regional Alchemer API base URL, for example https://api.alchemer.com.
          key: base_url
          label: API base URL
          required: true
      description: Collects account, user, team, survey, contact list, and SSO configuration data from Alchemer and projects it into the Cerebro graph as identity, asset, and policy context.
      display_name: Alchemer
      id: builtin-alchemer
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains: [asset_inventory]
              evidence_types: [source_snapshot]
              families: [account]
              high_value: true
              id: account
              support: partial
              title: Account
              type: entity_family
          default_enabled: true
          event:
            kind: alchemer.account
            required_payload_fields: [id]
            schema_ref: alchemer/account/v1
            urn_kind: alchemer_account
          id: account
          id_field: id
          label: Account
          method: GET
          name_field: organization
          path: /v5/account
          singleton: true
          projection:
            fields:
              id: id
              name: organization
              resource_id: id
              resource_name: organization
              resource_type: account
            template: asset
          record_selector: $.data
        - coverage:
            - control_domains: [asset_inventory, identity_access]
              evidence_types: [source_snapshot]
              families: [account_users]
              high_value: true
              id: account_users
              support: partial
              title: Account users
              type: entity_family
          default_enabled: true
          event:
            kind: alchemer.account_users
            required_payload_fields: [id]
            schema_ref: alchemer/account_users/v1
            urn_kind: alchemer_account_users
          id: account_users
          id_field: id
          label: Account users
          method: GET
          name_field: username
          pagination:
            cursor_param: page
            page_size: 100
            page_size_param: resultsperpage
            type: page
          path: /v5/accountuser
          projection:
            fields:
              display_name: username
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains: [identity_access]
              evidence_types: [source_snapshot]
              families: [account_teams]
              high_value: true
              id: account_teams
              support: partial
              title: Account teams
              type: entity_family
          default_enabled: true
          event:
            kind: alchemer.account_teams
            required_payload_fields: [id]
            schema_ref: alchemer/account_teams/v1
            urn_kind: alchemer_account_teams
          id: account_teams
          id_field: id
          label: Account teams
          method: GET
          name_field: team_name
          pagination:
            cursor_param: page
            page_size: 100
            page_size_param: resultsperpage
            type: page
          path: /v5/accountteams
          projection:
            fields:
              id: id
              name: team_name
              resource_id: id
              resource_name: team_name
              resource_type: account_team
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains: [asset_inventory, data_governance]
              evidence_types: [source_snapshot]
              families: [surveys]
              high_value: true
              id: surveys
              support: partial
              title: Surveys
              type: entity_family
          default_enabled: true
          event:
            kind: alchemer.surveys
            required_payload_fields: [id]
            schema_ref: alchemer/surveys/v1
            urn_kind: alchemer_surveys
          id: surveys
          id_field: id
          label: Surveys
          method: GET
          name_field: title
          pagination:
            cursor_param: page
            page_size: 100
            page_size_param: resultsperpage
            type: page
          path: /v5/survey
          projection:
            fields:
              id: id
              name: title
              resource_id: id
              resource_name: title
              resource_type: survey
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains: [asset_inventory, data_governance]
              evidence_types: [source_snapshot]
              families: [contact_lists]
              high_value: true
              id: contact_lists
              support: partial
              title: Contact lists
              type: entity_family
          default_enabled: true
          event:
            kind: alchemer.contact_lists
            required_payload_fields: [id]
            schema_ref: alchemer/contact_lists/v1
            urn_kind: alchemer_contact_lists
          id: contact_lists
          id_field: id
          label: Contact lists
          method: GET
          name_field: list_name
          pagination:
            cursor_param: page
            page_size: 100
            page_size_param: resultsperpage
            type: page
          path: /v5/contactlist
          projection:
            fields:
              id: id
              name: list_name
              resource_id: id
              resource_name: list_name
              resource_type: contact_list
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains: [identity_access, security_operations]
              evidence_types: [configuration_state]
              families: [sso_integrations]
              high_value: true
              id: sso_integrations
              support: partial
              title: SSO integrations
              type: lifecycle_state
          default_enabled: true
          event:
            kind: alchemer.sso_integrations
            required_payload_fields: [id]
            schema_ref: alchemer/sso_integrations/v1
            urn_kind: alchemer_sso_integrations
          id: sso_integrations
          id_field: id
          label: SSO integrations
          method: GET
          name_field: name
          pagination:
            cursor_param: page
            page_size: 100
            page_size_param: resultsperpage
            type: page
          path: /v5/sso
          projection:
            fields:
              policy_id: id
              policy_name: name
              policy_status: status
              policy_type: sso_integration
            template: policy
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: alchemer
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status: [200]
          method: GET
          path: /v5/account
