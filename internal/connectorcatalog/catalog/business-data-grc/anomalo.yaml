entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Tenant API base URL including /api/public/v1.
          key: base_url
          label: API base URL
          required: true
      description: Collects warehouses, tables, checks, notification channels, and organizations from Anomalo and projects them into the Cerebro graph as data observability assets and policies for owner, evidence, and compliance context.
      display_name: Anomalo
      id: builtin-anomalo
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - warehouses
              high_value: true
              id: warehouses
              support: partial
              title: Warehouses
              type: entity_family
          default_enabled: true
          event:
            kind: anomalo.warehouses
            required_payload_fields:
              - id
            schema_ref: anomalo/warehouses/v1
            urn_kind: anomalo_warehouses
          id: warehouses
          id_field: id
          label: Warehouses
          method: GET
          name_field: name
          path: /list_warehouses
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: warehouse_type
            template: asset
          record_selector: $.warehouses[*]
        - coverage:
            - control_domains:
                - asset_inventory
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - tables
              high_value: true
              id: tables
              support: partial
              title: Tables
              type: entity_family
          default_enabled: true
          event:
            kind: anomalo.tables
            required_payload_fields:
              - id
            schema_ref: anomalo/tables/v1
            urn_kind: anomalo_tables
          id: tables
          id_field: id
          label: Tables
          method: GET
          name_field: name
          path: /get_table_information
          projection:
            fields:
              id: id
              name: full_name
              resource_id: id
              resource_name: full_name
              resource_type: table
            template: asset
          record_selector: $
        - coverage:
            - control_domains:
                - security_operations
                - data_governance
              evidence_types:
                - configuration_state
              families:
                - checks
              high_value: true
              id: checks
              support: partial
              title: Checks
              type: lifecycle_state
          default_enabled: true
          event:
            kind: anomalo.checks
            required_payload_fields:
              - check_static_id
              - check_type
            schema_ref: anomalo/checks/v1
            urn_kind: anomalo_checks
          id: checks
          id_field: check_static_id
          label: Checks
          method: GET
          name_field: ref
          path: /get_checks_for_table
          projection:
            fields:
              policy_id: check_static_id
              policy_name: ref
              policy_status: triage_status
              policy_type: check_type
            template: policy
          record_selector: $.checks[*]
        - coverage:
            - control_domains:
                - logging_monitoring
                - security_operations
              evidence_types:
                - configuration_state
              families:
                - notification_channels
              high_value: true
              id: notification_channels
              support: partial
              title: Notification channels
              type: entity_family
          default_enabled: true
          event:
            kind: anomalo.notification_channels
            required_payload_fields:
              - id
            schema_ref: anomalo/notification_channels/v1
            urn_kind: anomalo_notification_channels
          id: notification_channels
          id_field: id
          label: Notification channels
          method: GET
          name_field: description
          path: /list_notification_channels
          projection:
            fields:
              id: id
              name: description
              resource_id: id
              resource_name: description
              resource_type: notification_channel
            template: asset
          record_selector: $.notification_channels[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - organizations
              high_value: true
              id: organizations
              support: partial
              title: Organizations
              type: entity_family
          default_enabled: true
          event:
            kind: anomalo.organizations
            required_payload_fields:
              - id
            schema_ref: anomalo/organizations/v1
            urn_kind: anomalo_organizations
          id: organizations
          id_field: id
          label: Organizations
          method: GET
          name_field: name
          path: /organizations
          projection:
            fields:
              id: id
              name: name
              resource_id: resource_id
              resource_name: name
              resource_type: resource_type
            template: asset
          record_selector: $[*]
      schema_version: cerebro.integration/v1
      source_id: anomalo
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /ping
