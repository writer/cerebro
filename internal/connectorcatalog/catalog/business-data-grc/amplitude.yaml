entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: SCIM bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Optional Amplitude SCIM API base URL. Defaults to https://core.amplitude.com.
          key: base_url
          label: SCIM API base URL
          required: false
      description: Collects Amplitude SCIM users and permission groups from the documented SCIM API and projects them into the Cerebro graph as identity users and groups for access inventory and lifecycle context.
      display_name: Amplitude
      id: builtin-amplitude
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: amplitude.users
            required_payload_fields:
              - id
            schema_ref: amplitude/users/v1
            urn_kind: amplitude_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: userName
          pagination:
            cursor_json_path: $.startIndex
            cursor_param: startIndex
            page_size: 100
            page_size_param: itemsPerPage
            type: offset
          path: /scim/1/Users
          projection:
            fields:
              display_name: displayName
              email: emails.0.value
              status: active
              user_id: id
            template: identity_user
          record_selector: $.Resources[*]
        - coverage:
            - control_domains:
                - identity_access
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          default_enabled: true
          event:
            kind: amplitude.groups
            required_payload_fields:
              - id
            schema_ref: amplitude/groups/v1
            urn_kind: amplitude_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          name_field: displayName
          pagination:
            cursor_json_path: $.startIndex
            cursor_param: startIndex
            page_size: 100
            page_size_param: itemsPerPage
            type: offset
          path: /scim/1/Groups
          projection:
            fields:
              group_id: id
              group_name: displayName
              member_count: members.#
            template: identity_group
          record_selector: $.Resources[*]
      schema_version: cerebro.integration/v1
      source_id: amplitude
      tenant_id: builtin_catalog
      transport:
        base_url: https://core.amplitude.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /scim/1/Users
