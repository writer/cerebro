entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-cockroachdb_cloud
    tenant_id: builtin_catalog
    source_id: cockroachdb_cloud
    display_name: CockroachDB Cloud
    description: "Collects data assets, audit events, and vulnerabilities from CockroachDB Cloud and projects them into the Cerebro graph as assets, audit events, and vulnerabilities for owner, account, evidence, and compliance context."
    categories:
    - data
    - database
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://cockroachlabs.cloud/api
      verification:
        method: GET
        path: "/api/v1/user"
        expect_status:
        - 200
    resource_families:
    - id: assets
      label: Data assets
      path: "/v1/assets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: cockroachdb_cloud.assets
        schema_ref: cockroachdb_cloud/assets/v1
      projection:
        template: asset
      coverage:
      - id: assets
        type: entity_family
        title: Data assets
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: cockroachdb_cloud.audit_events
        schema_ref: cockroachdb_cloud/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: vulnerabilities
      label: Vulnerabilities
      path: "/v1/vulnerabilities"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: cockroachdb_cloud.vulnerabilities
        schema_ref: cockroachdb_cloud/vulnerabilities/v1
      projection:
        template: vulnerability
      coverage:
      - id: vulnerabilities
        type: remediation_state
        title: Vulnerabilities
        families:
        - vulnerabilities
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
