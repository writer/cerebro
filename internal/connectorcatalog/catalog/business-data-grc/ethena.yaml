entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-ethena
    tenant_id: builtin_catalog
    source_id: ethena
    display_name: Ethena
    description: Ethena connector definition catalog entry for high-value security training and learner resources.
    categories:
    - security_training
    - grc
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://api.goethena.com
      verification:
        method: GET
        path: "/v1/me"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Learners
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: ethena.users
        schema_ref: ethena/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Learners
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: training_statuses
      label: Training statuses
      path: "/v1/training/statuses"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: ethena.training_statuses
        schema_ref: ethena/training_statuses/v1
      projection:
        template: audit_event
      coverage:
      - id: training_statuses
        type: audit_event
        title: Training statuses
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: course_assignments
      label: Course assignments
      path: "/v1/course-assignments"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: ethena.course_assignments
        schema_ref: ethena/course_assignments/v1
      projection:
        template: audit_event
      coverage:
      - id: course_assignments
        type: audit_event
        title: Course assignments
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
