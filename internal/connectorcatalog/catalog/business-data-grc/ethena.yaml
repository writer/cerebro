entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - security_training
        - grc
      description: Collects learners, training statuses, and course assignments from Ethena and projects them into the Cerebro graph as users and audit events for owner, account, evidence, and compliance context.
      display_name: Ethena
      id: builtin-ethena
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Learners
              type: entity_family
          event:
            kind: ethena.users
            required_payload_fields:
              - id
            schema_ref: ethena/users/v1
            urn_kind: ethena_users
          id: users
          id_field: id
          label: Learners
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: training_statuses
              support: partial
              title: Training statuses
              type: audit_event
          event:
            kind: ethena.training_statuses
            required_payload_fields:
              - id
            schema_ref: ethena/training_statuses/v1
            urn_kind: ethena_training_statuses
          id: training_statuses
          id_field: id
          label: Training statuses
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/training/statuses
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: course_assignments
              support: partial
              title: Course assignments
              type: audit_event
          event:
            kind: ethena.course_assignments
            required_payload_fields:
              - id
            schema_ref: ethena/course_assignments/v1
            urn_kind: ethena_course_assignments
          id: course_assignments
          id_field: id
          label: Course assignments
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/course-assignments
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: ethena
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.goethena.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/me
