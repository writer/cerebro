entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-hitrust_mycsf
    tenant_id: builtin_catalog
    source_id: hitrust_mycsf
    display_name: HITRUST MyCSF
    description: "Collects assessments, controls, and evidence from HITRUST MyCSF and projects them into the Cerebro graph as assets and audit events for owner, account, evidence, and compliance context."
    categories:
    - grc
    - audit
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.api_base_url}
      verification:
        method: GET
        path: "/api/v1/me"
        expect_status:
        - 200
    resource_families:
    - id: assessments
      label: Assessments
      path: "/api/v1/assessments"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: hitrust_mycsf.assessments
        schema_ref: hitrust_mycsf/assessments/v1
      projection:
        template: asset
      coverage:
      - id: assessments
        type: entity_family
        title: Assessments
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: controls
      label: Controls
      path: "/api/v1/controls"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: hitrust_mycsf.controls
        schema_ref: hitrust_mycsf/controls/v1
      projection:
        template: asset
      coverage:
      - id: controls
        type: entity_family
        title: Controls
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: evidence
      label: Evidence
      path: "/api/v1/evidence"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: hitrust_mycsf.evidence
        schema_ref: hitrust_mycsf/evidence/v1
      projection:
        template: audit_event
      coverage:
      - id: evidence
        type: audit_event
        title: Evidence
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
