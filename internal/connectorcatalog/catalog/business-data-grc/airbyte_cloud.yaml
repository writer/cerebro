entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Optional API base URL override. Defaults to Airbyte Cloud's public API base URL.
          key: base_url
          label: API base URL
          required: false
        - help: Airbyte organization ID used by the users endpoint.
          key: organization_id
          label: Organization ID
          required: false
        - help: Optional comma-separated workspace IDs used by source and connection list endpoints.
          key: workspace_ids
          label: Workspace IDs
          required: false
      description: Collects Airbyte Cloud users, organizations, sources, permissions, and connections and projects them into the Cerebro graph as identity users, assets, policy-like access records, and operational integration context.
      display_name: Airbyte Cloud
      id: builtin-airbyte_cloud
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: airbyte_cloud.users
            required_payload_fields:
              - id
            schema_ref: airbyte_cloud/users/v1
            urn_kind: airbyte_cloud_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          path: /users
          projection:
            fields:
              display_name: name
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - organizations
              high_value: true
              id: organizations
              support: partial
              title: Organizations
              type: entity_family
          default_enabled: true
          event:
            kind: airbyte_cloud.organizations
            required_payload_fields:
              - organizationId
            schema_ref: airbyte_cloud/organizations/v1
            urn_kind: airbyte_cloud_organizations
          id: organizations
          id_field: organizationId
          label: Organizations
          method: GET
          name_field: organizationName
          path: /organizations
          projection:
            fields:
              id: organizationId
              name: organizationName
              resource_id: organizationId
              resource_name: organizationName
              resource_type: airbyte_organization
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - sources
              high_value: true
              id: sources
              support: partial
              title: Sources
              type: entity_family
          default_enabled: true
          event:
            kind: airbyte_cloud.sources
            required_payload_fields:
              - sourceId
            schema_ref: airbyte_cloud/sources/v1
            urn_kind: airbyte_cloud_sources
          id: sources
          id_field: sourceId
          label: Sources
          method: GET
          name_field: name
          pagination:
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /sources
          projection:
            fields:
              id: sourceId
              name: name
              resource_id: sourceId
              resource_name: name
              resource_type: airbyte_source
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - identity_access
                - security_operations
              evidence_types:
                - configuration_state
              families:
                - permissions
              high_value: true
              id: permissions
              support: partial
              title: Permissions
              type: lifecycle_state
          default_enabled: true
          event:
            kind: airbyte_cloud.permissions
            required_payload_fields:
              - permissionId
            schema_ref: airbyte_cloud/permissions/v1
            urn_kind: airbyte_cloud_permissions
          id: permissions
          id_field: permissionId
          label: Permissions
          method: GET
          name_field: permissionType
          path: /permissions
          projection:
            fields:
              policy_id: permissionId
              policy_name: permissionType
              policy_status: active
              policy_type: airbyte_permission
            template: policy
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
                - data_governance
              evidence_types:
                - source_snapshot
                - configuration_state
              families:
                - connections
              high_value: true
              id: connections
              support: partial
              title: Connections
              type: entity_family
          default_enabled: true
          event:
            kind: airbyte_cloud.connections
            required_payload_fields:
              - connectionId
            schema_ref: airbyte_cloud/connections/v1
            urn_kind: airbyte_cloud_connections
          id: connections
          id_field: connectionId
          label: Connections
          method: GET
          name_field: name
          pagination:
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /connections
          projection:
            fields:
              id: connectionId
              name: name
              resource_id: connectionId
              resource_name: name
              resource_type: airbyte_connection
            template: asset
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: airbyte_cloud
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.airbyte.com/v1
        verification:
          expect_status:
            - 200
          method: GET
          path: /health
