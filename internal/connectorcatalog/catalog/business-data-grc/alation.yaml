entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: API access token
            reference_only: true
            required: true
            secret: true
        model: api_key
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Tenant or regional Alation API base URL, for example https://yourcompany.alationcloud.com.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, groups, data sources, policies, and terms from Alation and projects them into the Cerebro graph as identities, assets, policies, and data-governance context.
      display_name: Alation
      id: builtin-alation
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: alation.users
            required_payload_fields:
              - id
            schema_ref: alation/users/v1
            urn_kind: alation_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: display_name
          pagination:
            cursor_param: skip
            page_size: 100
            page_size_param: limit
            type: offset
          path: /integration/v2/user/
          projection:
            fields:
              display_name: display_name
              email: email
              status: profile_status
              user_id: id
            template: identity_user
          record_selector: $[*]
        - coverage:
            - control_domains:
                - identity_access
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          default_enabled: true
          event:
            kind: alation.groups
            required_payload_fields:
              - id
            schema_ref: alation/groups/v1
            urn_kind: alation_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          name_field: display_name
          pagination:
            cursor_param: skip
            page_size: 100
            page_size_param: limit
            type: offset
          path: /integration/v1/group/
          projection:
            fields:
              group_id: id
              group_name: display_name
            template: identity_group
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - data_sources
              high_value: true
              id: data_sources
              support: partial
              title: Data Sources
              type: entity_family
          default_enabled: true
          event:
            kind: alation.data_sources
            required_payload_fields:
              - id
            schema_ref: alation/data_sources/v1
            urn_kind: alation_data_sources
          id: data_sources
          id_field: id
          label: Data Sources
          method: GET
          name_field: title
          pagination:
            cursor_param: skip
            page_size: 100
            page_size_param: limit
            type: offset
          path: /integration/v1/datasource/
          projection:
            fields:
              id: id
              name: title
              resource_id: id
              resource_name: title
              resource_type: data_source
            template: asset
          record_selector: $[*]
        - coverage:
            - control_domains:
                - security_operations
                - data_governance
              evidence_types:
                - configuration_state
              families:
                - policies
              high_value: true
              id: policies
              support: partial
              title: Policies
              type: lifecycle_state
          default_enabled: true
          event:
            kind: alation.policies
            required_payload_fields:
              - id
            schema_ref: alation/policies/v1
            urn_kind: alation_policies
          id: policies
          id_field: id
          label: Policies
          method: GET
          name_field: title
          pagination:
            cursor_param: skip
            page_size: 100
            page_size_param: limit
            type: offset
          path: /integration/v1/business_policies/
          projection:
            fields:
              policy_id: id
              policy_name: title
              policy_status: deleted
              policy_type: business_policy
            template: policy
          record_selector: $[*]
        - coverage:
            - control_domains:
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - terms
              high_value: true
              id: terms
              support: partial
              title: Terms
              type: entity_family
          default_enabled: true
          event:
            kind: alation.terms
            required_payload_fields:
              - id
            schema_ref: alation/terms/v1
            urn_kind: alation_terms
          id: terms
          id_field: id
          label: Terms
          method: GET
          name_field: title
          pagination:
            cursor_param: skip
            page_size: 100
            page_size_param: limit
            type: offset
          path: /integration/v2/term/
          projection:
            fields:
              id: id
              name: title
              resource_id: id
              resource_name: title
              resource_type: term
            template: asset
          record_selector: $[*]
      schema_version: cerebro.integration/v1
      source_id: alation
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /integration/v2/user/?limit=1&skip=0
