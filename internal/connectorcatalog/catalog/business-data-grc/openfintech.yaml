          resource_type: bank
        template: asset
      record_selector: "$.data[*]"
    - coverage:
      - families:
        - country
        id: country
        support: partial
        title: Country
        type: entity_family
      event:
        kind: openfintech.country
        required_payload_fields:
        - id
        schema_ref: openfintech/country/v1
        urn_kind: openfintech_country
      event_kind: country
      id: country
      id_field: id
      label: Country
      list_key: data
