      event_kind: organization
      id: organization
      id_field: id
      label: Organization
      list_key: data
      method: GET
      name_field: attributes
      pagination:
        type: none
      path: "/organizations"
      projection:
        fields:
          id: id
          name: attributes
          provider_id: id
        template: identity_group
      record_selector: "$.data[*]"
