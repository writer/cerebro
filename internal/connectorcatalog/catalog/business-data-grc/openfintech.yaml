      id: currency
      label: Currency
    source_id: openfintech
    tenant_id: builtin_catalog
    transport:
      base_url: https://api.openfintech.io/v1
      retry:
        backoff: exponential
        max_attempts: 3
        retry_after_header: Retry-After
        statuses:
