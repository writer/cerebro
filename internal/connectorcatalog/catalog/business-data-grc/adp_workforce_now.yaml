entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Optional ADP API base URL override. Defaults to the production API host.
          key: base_url
          label: API base URL
          required: false
      description: Collects worker profiles and event notification messages from ADP Workforce Now and projects them into the Cerebro graph as identity users and audit-style change events for HR and workforce ownership context.
      display_name: ADP Workforce Now
      id: builtin-adp_workforce_now
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - event_notifications
              high_value: true
              id: event_notifications
              support: partial
              title: Event Notifications
              type: audit_event
          default_enabled: true
          event:
            kind: adp_workforce_now.event_notifications
            required_payload_fields:
              - eventNameCode
            schema_ref: adp_workforce_now/event_notifications/v1
            urn_kind: adp_workforce_now_event_notifications
          id: event_notifications
          id_field: eventID
          label: Event notifications
          method: GET
          name_field: eventNameCode.codeValue
          path: /core/v1/event-notification-messages
          singleton: true
          projection:
            fields:
              actor_id: originator.associateOID
              event_type: eventNameCode.codeValue
              id: eventID
              resource_id: data.eventContext.worker.associateOID
              resource_type: worker
            template: audit_event
          record_selector: $.events[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: adp_workforce_now.users
            required_payload_fields:
              - associateOID
            schema_ref: adp_workforce_now/users/v1
            urn_kind: adp_workforce_now_users
          id: users
          id_field: associateOID
          label: Users
          method: GET
          name_field: person.legalName.formattedName
          pagination:
            cursor_param: $skip
            page_size: 100
            page_size_param: $top
            type: offset
          path: /hr/v2/workers
          projection:
            fields:
              display_name: person.legalName.formattedName
              email: businessCommunication.emails.0.emailUri
              status: workerStatus.statusCode.codeValue
              user_id: associateOID
            template: identity_user
          record_selector: $.workers[*]
      schema_version: cerebro.integration/v1
      source_id: adp_workforce_now
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.adp.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /hr/v2/workers/meta
