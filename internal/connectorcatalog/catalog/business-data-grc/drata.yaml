entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-drata
    tenant_id: builtin_catalog
    source_id: drata
    display_name: Drata
    description: "Collects users, controls, and findings from Drata and projects them into the Cerebro graph as users, assets, and findings for owner, account, evidence, and compliance context."
    categories:
    - grc
    - compliance
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://public-api.drata.com
      verification:
        method: GET
        path: "/public/users"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: drata.users
        schema_ref: drata/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: controls
      label: Controls
      path: "/v1/controls"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: drata.controls
        schema_ref: drata/controls/v1
      projection:
        template: asset
      coverage:
      - id: controls
        type: entity_family
        title: Controls
        families:
        - controls
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: findings
      label: Findings
      path: "/v1/findings"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: drata.findings
        schema_ref: drata/findings/v1
      projection:
        template: finding
      coverage:
      - id: findings
        type: remediation_state
        title: Findings
        families:
        - findings
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
