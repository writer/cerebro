entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            label: API key
            reference_only: true
            required: true
            secret: true
        model: api_key
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Optional Apollo API base URL override. Defaults to https://api.apollo.io/api/v1.
          key: base_url
          label: API base URL
          required: false
      description: Collects Apollo workspace users, saved accounts, and saved contacts from the documented Apollo REST API and projects them into the Cerebro graph as identity users and account/contact inventory for owner and evidence context.
      display_name: Apollo
      id: builtin-apollo
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: apollo.users
            required_payload_fields:
              - id
            schema_ref: apollo/users/v1
            urn_kind: apollo_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_param: page
            page_size: 100
            page_size_param: per_page
            type: cursor
          path: /users/search
          projection:
            fields:
              display_name: name
              email: email
              status: deleted
              user_id: id
            template: identity_user
          record_selector: $.users[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - accounts
              high_value: true
              id: accounts
              support: partial
              title: Accounts
              type: entity_family
          default_enabled: true
          event:
            kind: apollo.accounts
            required_payload_fields:
              - id
            schema_ref: apollo/accounts/v1
            urn_kind: apollo_accounts
          id: accounts
          id_field: id
          label: Accounts
          method: POST
          name_field: name
          pagination:
            cursor_param: page
            page_size: 100
            page_size_param: per_page
            type: cursor
          path: /accounts/search
          projection:
            fields:
              domain: domain
              organization_id: organization_id
              resource_id: id
              resource_name: name
              resource_type: apollo_account
            template: asset
          record_selector: $.accounts[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - contacts
              high_value: true
              id: contacts
              support: partial
              title: Contacts
              type: entity_family
          default_enabled: true
          event:
            kind: apollo.contacts
            required_payload_fields:
              - id
            schema_ref: apollo/contacts/v1
            urn_kind: apollo_contacts
          id: contacts
          id_field: id
          label: Contacts
          method: POST
          name_field: name
          pagination:
            cursor_param: page
            page_size: 100
            page_size_param: per_page
            type: cursor
          path: /contacts/search
          projection:
            fields:
              display_name: name
              email: email
              status: email_status
              user_id: id
            template: identity_user
          record_selector: $.contacts[*]
      schema_version: cerebro.integration/v1
      source_id: apollo
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.apollo.io/api/v1
        verification:
          expect_status:
            - 200
          method: GET
          path: /users/api_profile
