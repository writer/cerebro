entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-opsgenie
    tenant_id: builtin_catalog
    source_id: opsgenie
    display_name: Opsgenie
    description: Opsgenie connector definition catalog entry for high-value security and operations resources.
    categories:
    - itsm
    - incident
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.opsgenie.com
      verification:
        method: GET
        path: "/v2/account"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: opsgenie.users
        schema_ref: opsgenie/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: tickets
      label: Tickets
      path: "/v1/tickets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: opsgenie.tickets
        schema_ref: opsgenie/tickets/v1
      projection:
        template: asset
      coverage:
      - id: tickets
        type: entity_family
        title: Tickets
        families:
        - tickets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: opsgenie.audit_events
        schema_ref: opsgenie/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
