entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - itsm
        - support
      description: Collects users, tickets, and audit events from Freshservice and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context.
      display_name: Freshservice
      id: builtin-freshservice
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          event:
            kind: freshservice.users
            required_payload_fields:
              - id
            schema_ref: freshservice/users/v1
            urn_kind: freshservice_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - tickets
              high_value: true
              id: tickets
              support: partial
              title: Tickets
              type: entity_family
          event:
            kind: freshservice.tickets
            required_payload_fields:
              - id
            schema_ref: freshservice/tickets/v1
            urn_kind: freshservice_tickets
          id: tickets
          id_field: id
          label: Tickets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/tickets
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: freshservice.audit_events
            required_payload_fields:
              - id
            schema_ref: freshservice/audit_events/v1
            urn_kind: freshservice_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: freshservice
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.domain}.freshservice.com/api
        verification:
          expect_status:
            - 200
          method: GET
          path: /v2/requesters/me
