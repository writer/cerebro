entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - data
        - warehouse
      config_fields:
        - key: workspace_url
          label: Workspace URL
          required: true
      description: Collects data assets, model serving endpoints, audit events, and vulnerabilities from Databricks and projects them into the Cerebro graph as assets, deployments, audit events, and vulnerabilities for owner, account, evidence, and compliance context.
      display_name: Databricks
      id: builtin-databricks
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - assets
              high_value: true
              id: assets
              support: partial
              title: Data assets
              type: entity_family
          event:
            kind: databricks.assets
            required_payload_fields:
              - id
            schema_ref: databricks/assets/v1
            urn_kind: databricks_assets
          id: assets
          id_field: id
          label: Data assets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/assets
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - secure_delivery
              evidence_types:
                - change_management
              families:
                - model_serving_endpoints
              high_value: true
              id: model_serving_endpoints
              support: partial
              title: Model serving endpoints
              type: deployment_state
          event:
            kind: databricks.model_serving_endpoints
            required_payload_fields:
              - name
            schema_ref: databricks/model_serving_endpoints/v1
            urn_kind: databricks_model_serving_endpoints
          id: model_serving_endpoints
          id_field: name
          label: Model serving endpoints
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_page_token
            cursor_param: page_token
            page_size: 100
            page_size_param: page_size
            type: cursor
          path: /v1/model-serving/endpoints
          projection:
            fields:
              deployment_environment: environment|env|stage|target
              deployment_id: name
              deployment_name: name
              deployment_status: status|state|ready
              deployment_url: url|deployment_url|endpoint|domain
            template: deployment
          record_selector: $.endpoints[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: databricks.audit_events
            required_payload_fields:
              - id
            schema_ref: databricks/audit_events/v1
            urn_kind: databricks_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - vulnerabilities
              high_value: true
              id: vulnerabilities
              support: partial
              title: Vulnerabilities
              type: remediation_state
          event:
            kind: databricks.vulnerabilities
            required_payload_fields:
              - id
            schema_ref: databricks/vulnerabilities/v1
            urn_kind: databricks_vulnerabilities
          id: vulnerabilities
          id_field: id
          label: Vulnerabilities
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/vulnerabilities
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: vulnerability
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: databricks
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.workspace_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/2.0/preview/scim/v2/Me
