entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-salesforce
    tenant_id: builtin_catalog
    source_id: salesforce
    display_name: Salesforce
    description: "Collects users, business records, and audit events from Salesforce and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context."
    categories:
    - business
    - crm
    auth:
      model: oauth_authorization_code
      authorization_url: https://${config.instance_url}/oauth/authorize
      token_url: https://${config.instance_url}/oauth/token
      credential_fields:
      - key: client_id
        reference_only: true
      - key: client_secret
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.instance_url}
      verification:
        method: GET
        path: "/services/data/v60.0"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: salesforce.users
        schema_ref: salesforce/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: assets
      label: Business records
      path: "/v1/records"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: salesforce.assets
        schema_ref: salesforce/assets/v1
      projection:
        template: asset
      coverage:
      - id: assets
        type: entity_family
        title: Business records
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: salesforce.audit_events
        schema_ref: salesforce/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
