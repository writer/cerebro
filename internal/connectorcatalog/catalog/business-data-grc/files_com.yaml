        title: External Event
        type: audit_event
      default_enabled: true
      event:
        kind: files_com.external_event
        required_payload_fields:
        - id
        schema_ref: files_com/external_event/v1
        urn_kind: files_external_event
      event_kind: external_event
      id: external_event
      id_field: id
      label: External Event
      method: GET
      name_field: body
      pagination:
        cursor_param: cursor
        page_size: 100
        page_size_param: per_page
        type: cursor
      path: "/external_events"
      projection:
        fields:
          id: id
          name: body
          provider_id: id
