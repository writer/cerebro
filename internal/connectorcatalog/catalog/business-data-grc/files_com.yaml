entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: api_key
        label: API key
        reference_only: true
        required: true
        secret: true
      model: api_key
      requires_references: true
    categories:
    - saas
    description: "Collects external event, API key, group, group user, action notification export result, and permission from Files.com API and projects them into the Cerebro graph as audit events, secrets, groups, users, and alerts for owner, account, evidence, and compliance context."
