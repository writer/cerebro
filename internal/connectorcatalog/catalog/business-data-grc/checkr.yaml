entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-checkr
    tenant_id: builtin_catalog
    source_id: checkr
    display_name: Checkr
    description: Checkr connector definition catalog entry for high-value background-check and access resources.
    categories:
    - background_checks
    - hr
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.checkr.com
      verification:
        method: GET
        path: "/v1/account"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Access accounts
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: checkr.users
        schema_ref: checkr/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Access accounts
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_href"
        page_size_param: per_page
        page_size: 100
    - id: candidates
      label: Candidates
      path: "/v1/candidates"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: checkr.candidates
        schema_ref: checkr/candidates/v1
      projection:
        template: identity_user
      coverage:
      - id: candidates
        type: entity_family
        title: Candidates
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_href"
        page_size_param: per_page
        page_size: 100
    - id: background_checks
      label: Background checks
      path: "/v1/reports"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: checkr.background_checks
        schema_ref: checkr/background_checks/v1
      projection:
        template: audit_event
      coverage:
      - id: background_checks
        type: audit_event
        title: Background checks
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_href"
        page_size_param: per_page
        page_size: 100
