entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-calcom
    tenant_id: builtin_catalog
    source_id: calcom
    display_name: Cal.com
    description: "Collects bookings, users, and audit events from Cal.com and projects them into the Cerebro graph as audit events and users for owner, account, evidence, and compliance context."
    categories:
    - business
    - productivity
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://api.cal.com/v1
      verification:
        method: GET
        path: "/me"
        expect_status:
        - 200
    resource_families:
    - id: bookings
      label: Bookings
      path: "/bookings"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: calcom.bookings
        schema_ref: calcom/bookings/v1
      projection:
        template: audit_event
      coverage:
      - id: bookings
        type: audit_event
        title: Bookings
        families:
        - bookings
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: users
      label: Users
      path: "/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: calcom.users
        schema_ref: calcom/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit-events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: calcom.audit_events
        schema_ref: calcom/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
