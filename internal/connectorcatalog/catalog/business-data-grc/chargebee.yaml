entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-chargebee
    tenant_id: builtin_catalog
    source_id: chargebee
    display_name: Chargebee
    description: "Collects subscriptions, customers, and audit events from Chargebee and projects them into the Cerebro graph as assets, users, and audit events for owner, account, evidence, and compliance context."
    categories:
    - business
    - billing
    auth:
      model: basic
      credential_fields:
      - key: username
        reference_only: true
      - key: password
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.site}.chargebee.com/api/v2
      verification:
        method: GET
        path: "/customers"
        expect_status:
        - 200
    resource_families:
    - id: subscriptions
      label: Subscriptions
      path: "/subscriptions"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: chargebee.subscriptions
        schema_ref: chargebee/subscriptions/v1
      projection:
        template: asset
      coverage:
      - id: subscriptions
        type: entity_family
        title: Subscriptions
        families:
        - subscriptions
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: customers
      label: Customers
      path: "/customers"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: chargebee.customers
        schema_ref: chargebee/customers/v1
      projection:
        template: identity_user
      coverage:
      - id: customers
        type: entity_family
        title: Customers
        families:
        - customers
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: chargebee.audit_events
        schema_ref: chargebee/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
