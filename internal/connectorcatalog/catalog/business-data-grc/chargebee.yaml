entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: username
            reference_only: true
          - key: password
            reference_only: true
            secret: true
        model: basic
      categories:
        - business
        - billing
      description: Collects subscriptions, customers, and audit events from Chargebee and projects them into the Cerebro graph as assets, users, and audit events for owner, account, evidence, and compliance context.
      display_name: Chargebee
      id: builtin-chargebee
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - subscriptions
              high_value: true
              id: subscriptions
              support: partial
              title: Subscriptions
              type: entity_family
          event:
            kind: chargebee.subscriptions
            required_payload_fields:
              - id
            schema_ref: chargebee/subscriptions/v1
            urn_kind: chargebee_subscriptions
          id: subscriptions
          id_field: id
          label: Subscriptions
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /subscriptions
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - customers
              high_value: true
              id: customers
              support: partial
              title: Customers
              type: entity_family
          event:
            kind: chargebee.customers
            required_payload_fields:
              - id
            schema_ref: chargebee/customers/v1
            urn_kind: chargebee_customers
          id: customers
          id_field: id
          label: Customers
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /customers
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: chargebee.audit_events
            required_payload_fields:
              - id
            schema_ref: chargebee/audit_events/v1
            urn_kind: chargebee_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: chargebee
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.site}.chargebee.com/api/v2
        verification:
          expect_status:
            - 200
          method: GET
          path: /customers
