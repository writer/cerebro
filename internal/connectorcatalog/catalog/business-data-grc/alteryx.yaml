entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: OAuth2 bearer access token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - business_data_grc
      config_fields:
        - help: Alteryx Server base URL, without the /webapi suffix.
          key: base_url
          label: Server base URL
          required: true
      description: Collects Alteryx Server users, user groups, workflows, collections, and audit events and projects them into the Cerebro graph as identities, assets, and audit events for owner, evidence, and compliance context.
      display_name: Alteryx
      id: builtin-alteryx
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: alteryx.users
            required_payload_fields:
              - id
            schema_ref: alteryx/users/v1
            urn_kind: alteryx_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: email
          pagination:
            type: none
          path: /v3/users
          projection:
            fields:
              display_name: firstName+lastName
              email: email
              status: isActive
              user_id: id
            template: identity_user
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
                - identity_access
              evidence_types:
                - source_snapshot
              families:
                - usergroups
              high_value: true
              id: usergroups
              support: partial
              title: User groups
              type: entity_family
          default_enabled: true
          event:
            kind: alteryx.usergroups
            required_payload_fields:
              - id
            schema_ref: alteryx/usergroups/v1
            urn_kind: alteryx_usergroups
          id: usergroups
          id_field: id
          label: User groups
          method: GET
          name_field: name
          pagination:
            type: none
          path: /v3/usergroups
          projection:
            fields:
              group_id: id
              group_name: name
              role: role
            template: identity_group
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - workflows
              high_value: true
              id: workflows
              support: partial
              title: Workflows
              type: entity_family
          default_enabled: true
          event:
            kind: alteryx.workflows
            required_payload_fields:
              - id
            schema_ref: alteryx/workflows/v1
            urn_kind: alteryx_workflows
          id: workflows
          id_field: id
          label: Workflows
          method: GET
          name_field: name
          pagination:
            type: none
          path: /v3/workflows
          projection:
            fields:
              name: name
              owner_id: ownerId
              resource_id: id
              resource_name: name
              resource_type: workflow
            template: asset
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
                - identity_access
              evidence_types:
                - source_snapshot
              families:
                - collections
              high_value: true
              id: collections
              support: partial
              title: Collections
              type: entity_family
          default_enabled: true
          event:
            kind: alteryx.collections
            required_payload_fields:
              - id
            schema_ref: alteryx/collections/v1
            urn_kind: alteryx_collections
          id: collections
          id_field: id
          label: Collections
          method: GET
          name_field: name
          pagination:
            type: none
          path: /v3/collections
          projection:
            fields:
              name: name
              owner_id: ownerId
              resource_id: id
              resource_name: name
              resource_type: collection
            template: asset
          record_selector: $[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: alteryx.audit_events
            required_payload_fields:
              - id
            schema_ref: alteryx/audit_events/v1
            urn_kind: alteryx_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          name_field: event
          pagination:
            type: none
          path: /admin/v1/auditlog
          projection:
            fields:
              actor_id: userId
              event_type: event
              id: id
              resource_id: entityId
              resource_type: entity
            template: audit_event
          record_selector: $[*]
      schema_version: cerebro.integration/v1
      source_id: alteryx
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}/webapi
        verification:
          expect_status:
            - 200
          method: GET
          path: /v3/users
