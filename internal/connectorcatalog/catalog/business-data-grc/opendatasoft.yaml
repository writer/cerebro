entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: api_key
        label: API key
        reference_only: true
        required: true
        secret: true
      model: api_key
      requires_references: true
    categories:
    - saas
    config_fields:
    - help: Path parameter inferred from the OpenAPI operation.
      key: source
      label: Source
      required: true
    - help: Path parameter inferred from the OpenAPI operation.
      key: dataset_id
      label: Dataset Id
      required: true
    description: Collects aggregate, page, dataset, facet, resource, and resource 2 from Opendatasoft and projects them into the Cerebro graph as assets and audit events for inventory, access review, audit, risk, and operational context.
    display_name: Opendatasoft
    id: builtin_catalog-opendatasoft
    ingest:
      mode: pull
    resource_families:
    - coverage:
      - control_domains:
        - logging_monitoring
        evidence_types:
        - logging_configuration
        families:
        - aggregate
        high_value: true
        id: audit_events
        support: partial
        title: Aggregate
        type: audit_event
      default_enabled: true
      event:
        kind: opendatasoft.aggregate
        required_payload_fields:
        - id
        schema_ref: opendatasoft/aggregate/v1
        urn_kind: opendatasoft_aggregate
      event_kind: aggregate
      id: aggregate
      id_field: id
      label: Aggregate
      list_key: aggregations
      method: GET
      pagination:
        limit_param: limit
        offset_param: offset
        page_size: 100
        type: offset
      path: "/${config.source}/aggregates"
      permissions_needed:
      - api_key
      - basic
      projection:
        fields:
          id: id
          provider_id: id
        template: audit_event
      record_selector: "$.aggregations[*]"
