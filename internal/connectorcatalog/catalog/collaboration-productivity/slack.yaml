    categories:
    - saas
    description: One way to interact with the Slack platform is its HTTP RPC-based Web API, a collection of methods requiring OAuth 2.0-based user, bot, or workspace tokens blessed with related OAuth scopes.
    display_name: Slack
    id: builtin_catalog-slack
    resource_families:
    - coverage:
      - families:
        - usergroups_list
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: usergroups_list
        support: partial
        title: Usergroups List
        type: entity_family
      default_enabled: true
      event:
        kind: slack.usergroups_list
        required_payload_fields:
        - id
        schema_ref: slack/usergroups_list/v1
        urn_kind: slack_usergroups_list
