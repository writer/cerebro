entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - saas
        - collaboration
      description: Collects enterprise users, bases, and audit log events from Airtable and maps them into the Cerebro graph as users, assets, and audit events for workspace, base, and collaboration context.
      display_name: Airtable
      id: builtin-airtable
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          event:
            kind: airtable.users
            required_payload_fields:
              - id
            schema_ref: airtable/users/v1
            urn_kind: airtable_users
          id: users
          id_field: id
          label: Users
          method: GET
          path: /v0/meta/enterpriseAccounts/{enterpriseAccountId}/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.users[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - bases
              high_value: true
              id: bases
              support: partial
              title: Bases
              type: entity_family
          event:
            kind: airtable.bases
            required_payload_fields:
              - id
            schema_ref: airtable/bases/v1
            urn_kind: airtable_bases
          id: bases
          id_field: id
          label: Bases
          method: GET
          pagination:
            cursor_json_path: $.offset
            cursor_param: offset
            type: cursor
          path: /v0/meta/bases
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.bases[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: airtable.audit_events
            required_payload_fields:
              - id
            schema_ref: airtable/audit_events/v1
            urn_kind: airtable_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.pagination.previous
            cursor_param: previous
            page_size: 100
            page_size_param: pageSize
            type: cursor
          path: /v0/meta/enterpriseAccounts/{enterpriseAccountId}/auditLogEvents
          projection:
            fields:
              actor_email: actor.user.email
              actor_id: actor.user.id
              event_type: action
              id: id
            template: audit_event
          record_selector: $.events[*]
      schema_version: cerebro.integration/v1
      source_id: airtable
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.airtable.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /v0/meta/whoami
