entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            reference_only: true
            secret: true
        model: oauth_client_credentials
        token_url: https://api.zoom.us/oauth/token
      categories:
        - saas
        - collaboration
      description: Collects users, content assets, and audit events from Zoom and projects them into the Cerebro graph as users, assets, and audit events for workspace, document, message, and collaboration context.
      display_name: Zoom
      id: builtin-zoom
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          event:
            kind: zoom.users
            required_payload_fields:
              - id
            schema_ref: zoom/users/v1
            urn_kind: zoom_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - content_assets
              high_value: true
              id: content_assets
              support: partial
              title: Shared content assets
              type: entity_family
          event:
            kind: zoom.content_assets
            required_payload_fields:
              - id
            schema_ref: zoom/content_assets/v1
            urn_kind: zoom_content_assets
          id: content_assets
          id_field: id
          label: Content assets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/resources
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: zoom.audit_events
            required_payload_fields:
              - id
            schema_ref: zoom/audit_events/v1
            urn_kind: zoom_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: zoom
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.zoom.us
        verification:
          expect_status:
            - 200
          method: GET
          path: /v2/users/me
