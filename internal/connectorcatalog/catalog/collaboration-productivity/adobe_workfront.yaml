entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: API key
            reference_only: true
            required: true
            secret: true
        model: api_key
        requires_references: true
      categories:
        - saas
        - collaboration_productivity
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, groups, projects, documents, and audit events from Adobe Workfront and projects them into the Cerebro graph as users, groups, assets, and audit events for project, document, message, and collaboration context.
      display_name: Adobe Workfront
      id: builtin-adobe_workfront
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: adobe_workfront.users
            required_payload_fields:
              - ID
            schema_ref: adobe_workfront/users/v1
            urn_kind: adobe_workfront_users
          id: users
          id_field: ID
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_json_path: ""
            cursor_param: $$FIRST
            page_size: 100
            page_size_param: $$LIMIT
            type: cursor
          path: /user/search
          projection:
            fields:
              display_name: name
              email: emailAddr
              status: isActive
              user_id: ID
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          default_enabled: true
          event:
            kind: adobe_workfront.groups
            required_payload_fields:
              - ID
            schema_ref: adobe_workfront/groups/v1
            urn_kind: adobe_workfront_groups
          id: groups
          id_field: ID
          label: Groups
          method: GET
          name_field: name
          pagination:
            cursor_json_path: ""
            cursor_param: $$FIRST
            page_size: 100
            page_size_param: $$LIMIT
            type: cursor
          path: /group/search
          projection:
            fields:
              group_id: ID
              group_name: name
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - projects
              high_value: true
              id: projects
              support: partial
              title: Projects
              type: entity_family
          default_enabled: true
          event:
            kind: adobe_workfront.projects
            required_payload_fields:
              - ID
            schema_ref: adobe_workfront/projects/v1
            urn_kind: adobe_workfront_projects
          id: projects
          id_field: ID
          label: Projects
          method: GET
          name_field: name
          pagination:
            cursor_json_path: ""
            cursor_param: $$FIRST
            page_size: 100
            page_size_param: $$LIMIT
            type: cursor
          path: /proj/search
          projection:
            fields:
              id: ID
              name: name
              resource_id: ID
              resource_name: name
              resource_type: project
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - documents
              high_value: true
              id: documents
              support: partial
              title: Documents
              type: entity_family
          default_enabled: true
          event:
            kind: adobe_workfront.documents
            required_payload_fields:
              - ID
            schema_ref: adobe_workfront/documents/v1
            urn_kind: adobe_workfront_documents
          id: documents
          id_field: ID
          label: Documents
          method: GET
          name_field: name
          pagination:
            cursor_json_path: ""
            cursor_param: $$FIRST
            page_size: 100
            page_size_param: $$LIMIT
            type: cursor
          path: /docu/search
          projection:
            fields:
              id: ID
              name: name
              resource_id: ID
              resource_name: name
              resource_type: document
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: adobe_workfront.audit_events
            required_payload_fields:
              - ID
            schema_ref: adobe_workfront/audit_events/v1
            urn_kind: adobe_workfront_audit_events
          id: audit_events
          id_field: ID
          label: Audit events
          method: GET
          name_field: name
          pagination:
            cursor_json_path: ""
            cursor_param: $$FIRST
            page_size: 100
            page_size_param: $$LIMIT
            type: cursor
          path: /jrnle/search
          projection:
            fields:
              actor_id: userID
              event_type: fieldName
              id: ID
              resource_id: objID
              resource_type: objObjCode
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: adobe_workfront
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /info
