entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-jira
    tenant_id: builtin_catalog
    source_id: jira
    display_name: Jira
    description: Jira connector definition catalog entry for high-value security and operations resources.
    categories:
    - saas
    - project
    auth:
      model: basic
      credential_fields:
      - key: username
        reference_only: true
      - key: password
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.site_url}
      verification:
        method: GET
        path: "/rest/api/3/myself"
        expect_status:
        - 200
    resource_families:
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: jira.users
        schema_ref: jira/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: projects
      label: Projects
      path: "/v1/projects"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: jira.projects
        schema_ref: jira/projects/v1
      projection:
        template: asset
      coverage:
      - id: projects
        type: entity_family
        title: Projects
        families:
        - projects
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: jira.audit_events
        schema_ref: jira/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
