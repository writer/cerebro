entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - collaboration_productivity
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, groups, workspaces, documents, and audit events from Aircall and projects them into the Cerebro graph as users, groups, assets, and audit events for workspace, document, message, and collaboration context.
      display_name: Aircall
      id: builtin-aircall
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: aircall.users
            required_payload_fields:
              - id
            schema_ref: aircall/users/v1
            urn_kind: aircall_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              display_name: name
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Groups
              type: entity_family
          default_enabled: true
          event:
            kind: aircall.groups
            required_payload_fields:
              - id
            schema_ref: aircall/groups/v1
            urn_kind: aircall_groups
          id: groups
          id_field: id
          label: Groups
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/groups
          projection:
            fields:
              group_id: id
              group_name: name
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - workspaces
              high_value: true
              id: workspaces
              support: partial
              title: Workspaces
              type: entity_family
          default_enabled: true
          event:
            kind: aircall.workspaces
            required_payload_fields:
              - id
            schema_ref: aircall/workspaces/v1
            urn_kind: aircall_workspaces
          id: workspaces
          id_field: id
          label: Workspaces
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/workspaces
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: workspace
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - data_governance
              evidence_types:
                - source_snapshot
              families:
                - documents
              high_value: true
              id: documents
              support: partial
              title: Documents
              type: entity_family
          default_enabled: true
          event:
            kind: aircall.documents
            required_payload_fields:
              - id
            schema_ref: aircall/documents/v1
            urn_kind: aircall_documents
          id: documents
          id_field: id
          label: Documents
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/documents
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: document
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: aircall.audit_events
            required_payload_fields:
              - id
            schema_ref: aircall/audit_events/v1
            urn_kind: aircall_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit_events
          projection:
            fields:
              actor_email: actor_email
              actor_id: actor_id
              event_type: event_type
              id: id
              resource_id: resource_id
              resource_type: resource_type
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: aircall
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/me
