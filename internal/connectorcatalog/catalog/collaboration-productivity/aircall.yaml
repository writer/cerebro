entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: username
            label: API ID
            reference_only: true
            required: true
          - key: password
            label: API token
            reference_only: true
            required: true
            secret: true
        model: basic
        requires_references: true
      categories:
        - saas
        - collaboration_productivity
      config_fields:
        - help: Optional Aircall Public API base URL override. Defaults to https://api.aircall.io/v1.
          key: base_url
          label: API base URL
          required: false
      description: Collects Aircall users, teams, calls, contacts, and numbers from the documented Public API and projects them into the Cerebro graph as users, groups, assets, and call activity evidence for cloud phone inventory and collaboration context.
      display_name: Aircall
      id: builtin-aircall
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - calls
              high_value: true
              id: calls
              support: partial
              title: Calls
              type: audit_event
          default_enabled: true
          event:
            kind: aircall.calls
            required_payload_fields:
              - id
            schema_ref: aircall/calls/v1
            urn_kind: aircall_calls
          id: calls
          id_field: id
          label: Calls
          method: GET
          name_field: sid
          pagination:
            cursor_json_path: $.meta.next_page_link
            cursor_param: page
            page_size: 50
            page_size_param: per_page
            type: cursor
          path: /calls
          projection:
            fields:
              actor_id: user.id
              event_type: direction
              id: id
              resource_id: id
              resource_type: aircall_call
            template: audit_event
          record_selector: $.calls[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - contacts
              high_value: true
              id: contacts
              support: partial
              title: Contacts
              type: entity_family
          default_enabled: true
          event:
            kind: aircall.contacts
            required_payload_fields:
              - id
            schema_ref: aircall/contacts/v1
            urn_kind: aircall_contacts
          id: contacts
          id_field: id
          label: Contacts
          method: GET
          name_field: company_name
          pagination:
            cursor_json_path: $.meta.next_page_link
            cursor_param: page
            page_size: 50
            page_size_param: per_page
            type: cursor
          path: /contacts
          projection:
            fields:
              id: id
              name: company_name
              resource_id: id
              resource_name: company_name
              resource_type: aircall_contact
            template: asset
          record_selector: $.contacts[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - numbers
              high_value: true
              id: numbers
              support: partial
              title: Numbers
              type: entity_family
          default_enabled: true
          event:
            kind: aircall.numbers
            required_payload_fields:
              - id
            schema_ref: aircall/numbers/v1
            urn_kind: aircall_numbers
          id: numbers
          id_field: id
          label: Numbers
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.meta.next_page_link
            cursor_param: page
            page_size: 50
            page_size_param: per_page
            type: cursor
          path: /numbers
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: aircall_number
            template: asset
          record_selector: $.numbers[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - teams
              high_value: true
              id: teams
              support: partial
              title: Teams
              type: entity_family
          default_enabled: true
          event:
            kind: aircall.teams
            required_payload_fields:
              - id
            schema_ref: aircall/teams/v1
            urn_kind: aircall_teams
          id: teams
          id_field: id
          label: Teams
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.meta.next_page_link
            cursor_param: page
            page_size: 50
            page_size_param: per_page
            type: cursor
          path: /teams
          projection:
            fields:
              group_id: id
              group_name: name
            template: identity_group
          record_selector: $.teams[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: aircall.users
            required_payload_fields:
              - id
            schema_ref: aircall/users/v1
            urn_kind: aircall_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.meta.next_page_link
            cursor_param: page
            page_size: 50
            page_size_param: per_page
            type: cursor
          path: /users
          projection:
            fields:
              display_name: name
              email: email
              status: availability_status
              user_id: id
            template: identity_user
          record_selector: $.users[*]
      schema_version: cerebro.integration/v1
      source_id: aircall
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.aircall.io/v1
        verification:
          expect_status:
            - 200
          method: GET
          path: /ping
