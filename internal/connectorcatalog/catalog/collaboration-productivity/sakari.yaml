      - webhook
      id: webhook
      label: Webhook
    - families:
      - campaign
      id: campaign
      label: Campaign
    - families:
      - contact
      id: contact
      label: Contact
    - families:
      - conversation
      id: conversation
      label: Conversation
    source_id: sakari
    tenant_id: builtin_catalog
    transport:
      base_url: https://api.sakari.io
      retry:
