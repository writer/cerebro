        reference_only: true
        required: true
        secret: true
      - key: client_secret
        label: Client secret
        reference_only: true
        required: true
        secret: true
      model: oauth_client_credentials
      requires_references: true
      scopes:
      - messages:send
      token_expiration_buffer_seconds: 300
      token_request_auth_method: client_secret_basic
      token_url: "/oauth2/token"
    categories:
    - saas
    config_fields:
    - help: Path parameter inferred from the OpenAPI operation.
      key: accountid
      label: Accountid
      required: true
    description: "Collects webhook, campaign, contact, and conversation from Sakari and projects them into the Cerebro graph as assets for workspace, document, message, and collaboration context."
    display_name: Sakari
    id: builtin_catalog-sakari
    resource_families:
    - coverage:
      - families:
        - webhook
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: webhook
        support: partial
        title: Webhook
        type: entity_family
      default_enabled: true
      event:
        kind: sakari.webhook
        required_payload_fields:
        - eventTypes
        schema_ref: sakari/webhook/v1
        urn_kind: sakari_webhook
      event_kind: webhook
      id: webhook
      id_field: eventTypes
      label: Webhook
      list_key: data
      method: GET
      name_field: url
      pagination:
        type: none
      path: "/v1/accounts/${config.accountid}/webhooks"
