      id: builtin-doppler
      tenant_id: builtin_catalog
      source_id: doppler
      display_name: "Doppler"
      description: "Doppler connector definition catalog entry for high-value security and operations resources."
      categories:
        - secrets
        - identity
      auth:
        model: bearer_token
        credential_fields:
          - key: token
            secret: true
            reference_only: true
      transport:
        base_url: "https://api.doppler.com"
        verification:
          method: GET
          path: /v3/workplace
          expect_status: [200]
      resource_families:
        - id: secrets
          label: Secrets
          path: /v3/workplace/secrets
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: doppler.secrets
            schema_ref: doppler/secrets/v1
          projection:
            template: secret
            entity:
              entity_type: secret
              urn_kind: secret
              id_attributes: [secret_id]
              label_attribute: secret_name
            fields:
              project_id: project.id|project_id|project
            relationships:
              - relation: belongs_to
                to:
                  entity_type: doppler.project
                  urn_kind: doppler_project
                  id_attributes: [project_id]
                required_attributes: [project_id]
                match_type: secret_project
          coverage:
            - id: secrets
              type: entity_family
              title: "Secrets"
              families: [secrets]
              support: partial
              high_value: true
          pagination:
