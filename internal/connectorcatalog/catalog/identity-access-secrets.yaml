# Identity, access, and secrets connector definitions.
# Entries are sorted by source_id for deterministic review.
entries:
  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-akeyless
      tenant_id: builtin_catalog
      source_id: akeyless
      display_name: "Akeyless"
      description: "Akeyless connector definition catalog entry for high-value security and operations resources."
      categories:
        - identity
        - secrets
      auth:
        model: api_key
        credential_fields:
          - key: api_key
            secret: true
            reference_only: true
      transport:
        base_url: "https://api.akeyless.io"
        verification:
          method: GET
          path: /v2/item
          expect_status: [200]
      resource_families:
        - id: items
          label: Items
          path: /v2/items
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: akeyless.items
            schema_ref: akeyless/items/v1
          projection:
            template: secret
          coverage:
            - id: items
              type: entity_family
              title: "Items"
              families: [items]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: auth_methods
          label: Auth methods
          path: /v2/auth-methods
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: akeyless.auth_methods
            schema_ref: akeyless/auth_methods/v1
          projection:
            template: asset
          coverage:
            - id: auth_methods
              type: entity_family
              title: "Auth methods"
              families: [auth_methods]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: roles
          label: Roles
          path: /v2/roles
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: akeyless.roles
            schema_ref: akeyless/roles/v1
          projection:
            template: identity_group
          coverage:
            - id: roles
              type: entity_family
              title: "Roles"
              families: [roles]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100
        - id: audit_events
          label: Audit events
          path: /v2/audit
          method: GET
          record_selector: "$.data[*]"
          id_field: id
          event:
            kind: akeyless.audit_events
            schema_ref: akeyless/audit_events/v1
          projection:
            template: audit_event
          coverage:
            - id: audit_events
              type: audit_event
              title: "Audit events"
              families: [audit_events]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: cursor
            cursor_json_path: "$.next_cursor"
            page_size_param: limit
            page_size: 100

  - classifier_output: supported
    definition:
      schema_version: cerebro.integration/v1
      id: builtin-auth0
      tenant_id: builtin_catalog
      source_id: auth0
      display_name: Auth0
      description: "Auth0 connector definition catalog entry for high-value security and operations resources."
      categories:
        - identity
        - access
      config_fields:
        - key: domain
          label: "Tenant domain"
          required: true
          placeholder: "example.us.auth0.com"
          help: "Auth0 tenant domain used for Management API requests."
      auth:
        model: oauth_client_credentials
        token_url: "https://${config.domain}/oauth/token"
        scopes:
          - read:users
          - read:roles
          - read:logs
        token_params:
          audience: "https://${config.domain}/api/v2/"
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            secret: true
            reference_only: true
      transport:
        base_url: "https://${config.domain}/api/v2"
        verification:
          method: GET
          path: /users
          expect_status: [200]
      resource_families:
        - id: users
          label: Users
          path: /users
          method: GET
          record_selector: "$[*]"
          id_field: user_id
          name_field: name
          event:
            kind: auth0.users
            schema_ref: auth0/users/v1
          projection:
            template: identity_user
          coverage:
            - id: users
              type: entity_family
              title: "Identity users"
              families: [users]
              support: partial
              high_value: true
          pagination:
            type: page
            page_param: page
            page_size_param: per_page
            start_page: 0
            page_size: 100
        - id: roles
          label: Roles
          path: /roles
          method: GET
          record_selector: "$[*]"
          id_field: id
          name_field: name
          event:
            kind: auth0.roles
            schema_ref: auth0/roles/v1
          projection:
            template: identity_group
          coverage:
            - id: roles
              type: entity_family
              title: "Identity roles"
              families: [roles]
              support: partial
              high_value: true
          pagination:
            type: page
            page_param: page
            page_size_param: per_page
            start_page: 0
            page_size: 100
        - id: audit_events
          label: "Audit events"
          path: /logs
          method: GET
          record_selector: "$[*]"
          id_field: log_id
          event:
            kind: auth0.audit_events
            schema_ref: auth0/audit_events/v1
          projection:
            template: audit_event
          coverage:
            - id: audit_events
              type: audit_event
              title: "Audit events"
              families: [audit_events]
              support: partial
              high_value: true
          pagination:
            type: cursor
            cursor_param: from
            cursor_json_path: "$[-1].log_id"
            page_size_param: take
            page_size: 100
