entries:
  - classifier_output: supported
    definition:
      auth:
        authorization_url: https://dev.azure.com/${config.organization}/oauth/authorize
        credential_fields:
          - key: client_id
            reference_only: true
          - key: client_secret
            reference_only: true
            secret: true
        model: oauth_authorization_code
        token_url: https://dev.azure.com/${config.organization}/oauth/token
      categories:
        - dev
        - code
      description: Collects repositories, users, and audit events from Azure DevOps and projects them into the Cerebro graph as repositories, users, and audit events for repository, build, deployment, and release context.
      display_name: Azure DevOps
      id: builtin-azure_devops
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - repositories
              high_value: true
              id: repositories
              support: partial
              title: Repositories
              type: entity_family
          event:
            kind: azure_devops.repositories
            required_payload_fields:
              - id
            schema_ref: azure_devops/repositories/v1
            urn_kind: azure_devops_repositories
          id: repositories
          id_field: id
          label: Repositories
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/repositories
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: repository
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          event:
            kind: azure_devops.users
            required_payload_fields:
              - id
            schema_ref: azure_devops/users/v1
            urn_kind: azure_devops_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: azure_devops.audit_events
            required_payload_fields:
              - id
            schema_ref: azure_devops/audit_events/v1
            urn_kind: azure_devops_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: azure_devops
      tenant_id: builtin_catalog
      transport:
        base_url: https://dev.azure.com/${config.organization}
        verification:
          expect_status:
            - 200
          method: GET
          path: /_apis/projects
