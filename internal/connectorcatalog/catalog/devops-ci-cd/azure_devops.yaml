entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-azure_devops
    tenant_id: builtin_catalog
    source_id: azure_devops
    display_name: Azure DevOps
    description: Azure DevOps connector definition catalog entry for high-value security and operations resources.
    categories:
    - dev
    - code
    auth:
      model: oauth_authorization_code
      authorization_url: https://dev.azure.com/${config.organization}/oauth/authorize
      token_url: https://dev.azure.com/${config.organization}/oauth/token
      credential_fields:
      - key: client_id
        reference_only: true
      - key: client_secret
        secret: true
        reference_only: true
    transport:
      base_url: https://dev.azure.com/${config.organization}
      verification:
        method: GET
        path: "/_apis/projects"
        expect_status:
        - 200
    resource_families:
    - id: repositories
      label: Repositories
      path: "/v1/repositories"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: azure_devops.repositories
        schema_ref: azure_devops/repositories/v1
      projection:
        template: repository
      coverage:
      - id: repositories
        type: entity_family
        title: Repositories
        families:
        - repositories
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: azure_devops.users
        schema_ref: azure_devops/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: azure_devops.audit_events
        schema_ref: azure_devops/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
