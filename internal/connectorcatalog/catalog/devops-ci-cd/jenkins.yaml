entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: username
            reference_only: true
          - key: password
            reference_only: true
            secret: true
        model: basic
      categories:
        - dev
        - ci
      description: Collects pipelines, findings, and audit events from Jenkins and projects them into the Cerebro graph as assets, findings, and audit events for repository, build, deployment, and release context.
      display_name: Jenkins
      id: builtin-jenkins
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - pipelines
              high_value: true
              id: pipelines
              support: partial
              title: Pipelines
              type: entity_family
          event:
            kind: jenkins.pipelines
            required_payload_fields:
              - id
            schema_ref: jenkins/pipelines/v1
            urn_kind: jenkins_pipelines
          id: pipelines
          id_field: id
          label: Pipelines
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/pipelines
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - findings
              high_value: true
              id: findings
              support: partial
              title: Build findings
              type: remediation_state
          event:
            kind: jenkins.findings
            required_payload_fields:
              - id
            schema_ref: jenkins/findings/v1
            urn_kind: jenkins_findings
          id: findings
          id_field: id
          label: Findings
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/findings
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: finding
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: jenkins.audit_events
            required_payload_fields:
              - id
            schema_ref: jenkins/audit_events/v1
            urn_kind: jenkins_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: jenkins
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.jenkins_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/json
