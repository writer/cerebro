entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - devops
        - ci
      description: Collects projects, builds, and audit events from Codefresh and projects them into the Cerebro graph as repositories, assets, and audit events for repository, build, deployment, and release context.
      display_name: Codefresh
      id: builtin-codefresh
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - projects
              high_value: true
              id: projects
              support: partial
              title: Projects
              type: entity_family
          event:
            kind: codefresh.projects
            required_payload_fields:
              - id
            schema_ref: codefresh/projects/v1
            urn_kind: codefresh_projects
          id: projects
          id_field: id
          label: Projects
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /projects
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: repository
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - builds
              high_value: true
              id: builds
              support: partial
              title: Builds
              type: entity_family
          event:
            kind: codefresh.builds
            required_payload_fields:
              - id
            schema_ref: codefresh/builds/v1
            urn_kind: codefresh_builds
          id: builds
          id_field: id
          label: Builds
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /builds
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: codefresh.audit_events
            required_payload_fields:
              - id
            schema_ref: codefresh/audit_events/v1
            urn_kind: codefresh_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: codefresh
      tenant_id: builtin_catalog
      transport:
        base_url: https://g.codefresh.io/api
        verification:
          expect_status:
            - 200
          method: GET
          path: /orgs
