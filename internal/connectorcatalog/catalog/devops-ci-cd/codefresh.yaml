entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-codefresh
    tenant_id: builtin_catalog
    source_id: codefresh
    display_name: Codefresh
    description: Codefresh connector definition catalog entry for high-value security and operations resources.
    categories:
    - devops
    - ci
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://g.codefresh.io/api
      verification:
        method: GET
        path: "/orgs"
        expect_status:
        - 200
    resource_families:
    - id: projects
      label: Projects
      path: "/projects"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: codefresh.projects
        schema_ref: codefresh/projects/v1
      projection:
        template: repository
      coverage:
      - id: projects
        type: entity_family
        title: Projects
        families:
        - projects
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: builds
      label: Builds
      path: "/builds"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: codefresh.builds
        schema_ref: codefresh/builds/v1
      projection:
        template: asset
      coverage:
      - id: builds
        type: entity_family
        title: Builds
        families:
        - builds
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: codefresh.audit_events
        schema_ref: codefresh/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
