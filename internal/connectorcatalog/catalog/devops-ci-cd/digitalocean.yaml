entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - devops
        - cloud
      description: Collects droplets, VPCs, and firewalls from DigitalOcean and projects them into the Cerebro graph as cloud compute, network, and security assets with droplet-to-VPC and firewall-to-droplet reachability edges.
      display_name: DigitalOcean
      id: builtin-digitalocean
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - droplets
              high_value: true
              id: droplets
              support: partial
              title: Droplets
              type: entity_family
          event:
            kind: digitalocean.droplets
            required_payload_fields:
              - id
            schema_ref: digitalocean/droplets/v1
            urn_kind: digitalocean_droplets
          id: droplets
          id_field: id
          label: Droplets
          method: GET
          pagination:
            inject_first_page: true
            page_param: page
            page_size: 50
            page_size_param: per_page
            start_page: 1
            type: page
          path: /droplets
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: cloud_resource
          record_selector: $.droplets[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
