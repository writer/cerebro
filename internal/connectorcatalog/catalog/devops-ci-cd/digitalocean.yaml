entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - devops
        - cloud
      description: Collects droplets, teams, and audit events from DigitalOcean and projects them into the Cerebro graph as cloud resources, groups, and audit events for repository, build, deployment, and release context.
      display_name: DigitalOcean
      id: builtin-digitalocean
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - droplets
              high_value: true
              id: droplets
              support: partial
              title: Droplets
              type: entity_family
          event:
            kind: digitalocean.droplets
            required_payload_fields:
              - id
            schema_ref: digitalocean/droplets/v1
            urn_kind: digitalocean_droplets
          id: droplets
          id_field: id
          label: Droplets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /droplets
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: cloud_resource
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - teams
              high_value: true
              id: teams
              support: partial
              title: Teams
              type: entity_family
          event:
            kind: digitalocean.teams
            required_payload_fields:
              - id
            schema_ref: digitalocean/teams/v1
            urn_kind: digitalocean_teams
          id: teams
          id_field: id
          label: Teams
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /teams
          projection:
            fields:
              description: description|summary
              group_email: group_email|email
              group_id: id
            template: identity_group
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: digitalocean.audit_events
            required_payload_fields:
              - id
            schema_ref: digitalocean/audit_events/v1
            urn_kind: digitalocean_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /actions
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: digitalocean
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.digitalocean.com/v2
        verification:
          expect_status:
            - 200
          method: GET
          path: /account
