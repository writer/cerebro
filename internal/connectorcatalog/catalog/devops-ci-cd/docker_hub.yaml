entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-docker_hub
    tenant_id: builtin_catalog
    source_id: docker_hub
    display_name: Docker Hub
    description: Docker Hub connector definition catalog entry for high-value security and operations resources.
    categories:
    - dev
    - artifacts
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://hub.docker.com
      verification:
        method: GET
        path: "/v2/user/"
        expect_status:
        - 200
    resource_families:
    - id: repositories
      label: Repositories
      path: "/v1/repositories"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: docker_hub.repositories
        schema_ref: docker_hub/repositories/v1
      projection:
        template: repository
      coverage:
      - id: repositories
        type: entity_family
        title: Repositories
        families:
        - repositories
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: users
      label: Users
      path: "/v1/users"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: docker_hub.users
        schema_ref: docker_hub/users/v1
      projection:
        template: identity_user
      coverage:
      - id: users
        type: entity_family
        title: Users
        families:
        - users
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: docker_hub.audit_events
        schema_ref: docker_hub/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
