entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-vercel
    tenant_id: builtin_catalog
    source_id: vercel
    display_name: Vercel
    description: Vercel connector definition catalog entry for high-value security and operations resources.
    categories:
    - dev
    - cloud
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://api.vercel.com
      verification:
        method: GET
        path: "/v2/user"
        expect_status:
        - 200
    resource_families:
    - id: projects
      label: Projects
      path: "/v9/projects"
      method: GET
      record_selector: "$.projects[*]"
      id_field: id
      event:
        kind: vercel.projects
        schema_ref: vercel/projects/v1
      projection:
        template: asset
      coverage:
      - id: projects
        type: entity_family
        title: Projects
        families:
        - projects
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: deployments
      label: Deployments
      path: "/v6/deployments"
      method: GET
      record_selector: "$.deployments[*]"
      id_field: uid
      event:
        kind: vercel.deployments
        schema_ref: vercel/deployments/v1
      projection:
        template: asset
      coverage:
      - id: deployments
        type: entity_family
        title: Deployments
        families:
        - deployments
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: vercel.audit_events
        schema_ref: vercel/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
