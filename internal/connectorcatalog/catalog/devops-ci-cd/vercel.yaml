entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - dev
        - cloud
      description: Collects projects, deployments, and audit events from Vercel and projects them into the Cerebro graph as assets and audit events for repository, build, deployment, and release context.
      display_name: Vercel
      id: builtin-vercel
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - projects
              high_value: true
              id: projects
              support: partial
              title: Projects
              type: entity_family
          event:
            kind: vercel.projects
            required_payload_fields:
              - id
            schema_ref: vercel/projects/v1
            urn_kind: vercel_projects
          id: projects
          id_field: id
          label: Projects
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v9/projects
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.projects[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - deployments
              high_value: true
              id: deployments
              support: partial
              title: Deployments
              type: entity_family
          event:
            kind: vercel.deployments
            required_payload_fields:
              - uid
            schema_ref: vercel/deployments/v1
            urn_kind: vercel_deployments
          id: deployments
          id_field: uid
          label: Deployments
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v6/deployments
          projection:
            fields:
              resource_id: uid
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.deployments[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: vercel.audit_events
            required_payload_fields:
              - id
            schema_ref: vercel/audit_events/v1
            urn_kind: vercel_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: vercel
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.vercel.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /v2/user
