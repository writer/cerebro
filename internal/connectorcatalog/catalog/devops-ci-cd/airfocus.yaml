entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - devops_ci_cd
      config_fields:
        - help: Airfocus API base URL, such as https://app.airfocus.com or https://app.us.airfocus.com.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, workspaces, workspace groups, item link types, and API keys from Airfocus and projects them into the Cerebro graph as identities and product-management assets.
      display_name: Airfocus
      id: builtin-airfocus
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - identity_access
              evidence_types:
                - source_snapshot
              families:
                - api_keys
              high_value: true
              id: api_keys
              support: partial
              title: API Keys
              type: entity_family
          default_enabled: true
          event:
            kind: airfocus.api_keys
            required_payload_fields:
              - id
            schema_ref: airfocus/api_keys/v1
            urn_kind: airfocus_api_keys
          id: api_keys
          id_field: id
          label: API keys
          method: GET
          name_field: name
          path: /api/profile/api-keys
          projection:
            fields:
              api_key_scopes: scopes
              api_key_user_id: userId
              id: id
              last_used_at: lastUsedAt
              name: name
              resource_id: id
              resource_name: name
              resource_type: api_key
            template: asset
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - link_types
              high_value: true
              id: link_types
              support: partial
              title: Item Link Types
              type: entity_family
          default_enabled: true
          event:
            kind: airfocus.link_types
            required_payload_fields:
              - id
            schema_ref: airfocus/link_types/v1
            urn_kind: airfocus_link_types
          id: link_types
          id_field: id
          label: Item link types
          method: POST
          name_field: name
          pagination:
            cursor_json_path: $.offset
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /api/link-types/search
          projection:
            fields:
              id: id
              inward_name: inwardName
              name: name
              outward_name: outwardName
              resource_id: id
              resource_name: name
              resource_type: link_type
            template: asset
          record_selector: $.items[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: airfocus.users
            required_payload_fields:
              - id
            schema_ref: airfocus/users/v1
            urn_kind: airfocus_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: fullName
          path: /api/team/users
          projection:
            fields:
              display_name: fullName
              email: email
              status: disabled
              user_id: id
            template: identity_user
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - workspace_groups
              high_value: true
              id: workspace_groups
              support: partial
              title: Workspace Groups
              type: entity_family
          default_enabled: true
          event:
            kind: airfocus.workspace_groups
            required_payload_fields:
              - id
            schema_ref: airfocus/workspace_groups/v1
            urn_kind: airfocus_workspace_groups
          id: workspace_groups
          id_field: id
          label: Workspace groups
          method: POST
          name_field: name
          pagination:
            cursor_json_path: $.offset
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /api/workspaces/groups/search
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: workspace_group
            template: asset
          record_selector: $.items[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - workspaces
              high_value: true
              id: workspaces
              support: partial
              title: Workspaces
              type: entity_family
          default_enabled: true
          event:
            kind: airfocus.workspaces
            required_payload_fields:
              - id
            schema_ref: airfocus/workspaces/v1
            urn_kind: airfocus_workspaces
          id: workspaces
          id_field: id
          label: Workspaces
          method: POST
          name_field: name
          pagination:
            cursor_json_path: $.offset
            cursor_param: offset
            page_size: 100
            page_size_param: limit
            type: offset
          path: /api/workspaces/search
          projection:
            fields:
              alias: alias
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: workspace
            template: asset
          record_selector: $.items[*]
      schema_version: cerebro.integration/v1
      source_id: airfocus
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/team
