entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-postman
    tenant_id: builtin_catalog
    source_id: postman
    display_name: Postman
    description: "Collects collections, environments, and audit events from Postman and projects them into the Cerebro graph as assets, secrets, and audit events for repository, build, deployment, and release context."
    categories:
    - dev
    - api
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.getpostman.com
      verification:
        method: GET
        path: "/me"
        expect_status:
        - 200
    resource_families:
    - id: collections
      label: Collections
      path: "/collections"
      method: GET
      record_selector: "$.data[*]"
      id_field: uid
      event:
        kind: postman.collections
        schema_ref: postman/collections/v1
      projection:
        template: asset
      coverage:
      - id: collections
        type: entity_family
        title: Collections
        families:
        - collections
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: environments
      label: Environments
      path: "/environments"
      method: GET
      record_selector: "$.data[*]"
      id_field: uid
      event:
        kind: postman.environments
        schema_ref: postman/environments/v1
      projection:
        template: secret
      coverage:
      - id: environments
        type: entity_family
        title: Environments
        families:
        - environments
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: postman.audit_events
        schema_ref: postman/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
