entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-sentry
    tenant_id: builtin_catalog
    source_id: sentry
    display_name: Sentry
    description: "Collects assets, findings, and vulnerabilities from Sentry and projects them into the Cerebro graph as assets, findings, and vulnerabilities for repository, build, deployment, and release context."
    categories:
    - dev
    - observability
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://sentry.io/api
      verification:
        method: GET
        path: "/0/organizations/"
        expect_status:
        - 200
    resource_families:
    - id: assets
      label: Assets
      path: "/v1/assets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: sentry.assets
        schema_ref: sentry/assets/v1
      projection:
        template: asset
      coverage:
      - id: assets
        type: entity_family
        title: Assets
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: findings
      label: Findings
      path: "/v1/findings"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: sentry.findings
        schema_ref: sentry/findings/v1
      projection:
        template: finding
      coverage:
      - id: findings
        type: remediation_state
        title: Findings
        families:
        - findings
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: vulnerabilities
      label: Vulnerabilities
      path: "/v1/vulnerabilities"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: sentry.vulnerabilities
        schema_ref: sentry/vulnerabilities/v1
      projection:
        template: vulnerability
      coverage:
      - id: vulnerabilities
        type: remediation_state
        title: Vulnerabilities
        families:
        - vulnerabilities
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
