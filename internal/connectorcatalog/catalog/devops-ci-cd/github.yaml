entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: token
        label: Bearer token
        reference_only: true
        required: true
        secret: true
      model: bearer_token
      requires_references: true
    categories:
    - saas
    description: GitHub's v3 REST API.
    display_name: GitHub
    id: builtin_catalog-github
    resource_families:
    - coverage:
      - families:
        - issue
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
        id: findings
        support: partial
        title: Issue
        type: remediation_state
      default_enabled: true
      event:
        kind: github.issue
        required_payload_fields:
        - id
        schema_ref: github/issue/v1
        urn_kind: github_issue
      event_kind: issue
      id: issue
      id_field: id
      label: Issue
      method: GET
      name_field: title
      pagination:
        inject_first_page: true
        page_param: page
        page_size: 100
        page_size_param: per_page
        start_page: 1
        type: page
      path: "/issues"
      projection:
        fields:
          finding_id: id
          id: id
          name: title
          severity: active_lock_reason
          status: state
          title: title
        template: finding
      record_selector: "$[*]"
    - coverage:
      - families:
        - event
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
        id: audit_events
        support: partial
        title: Event
        type: audit_event
      default_enabled: true
      event:
        kind: github.event
        required_payload_fields:
        - id
        schema_ref: github/event/v1
        urn_kind: github_event
      event_kind: event
      id: event
      id_field: id
      label: Event
      method: GET
      name_field: actor
      pagination:
        inject_first_page: true
        page_param: page
        page_size: 100
        page_size_param: per_page
        start_page: 1
        type: page
      path: "/events"
      projection:
        fields:
          id: id
          name: actor
          provider_id: id
        template: audit_event
      record_selector: "$[*]"
    - coverage:
      - families:
        - email
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: email
        support: partial
        title: Email
        type: entity_family
      default_enabled: true
      event:
        kind: github.email
        required_payload_fields:
        - email
        schema_ref: github/email/v1
        urn_kind: github_email
      event_kind: email
      id: email
      id_field: email
      label: Email
      method: GET
      name_field: email
      pagination:
        inject_first_page: true
        page_param: page
        page_size: 100
        page_size_param: per_page
        start_page: 1
        type: page
      path: "/user/emails"
      projection:
        fields:
          id: email
          name: email
          provider_id: email
        template: identity_user
      record_selector: "$[*]"
    - coverage:
      - families:
        - organization
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: organization
        support: partial
        title: Organization
        type: entity_family
      default_enabled: true
      event:
        kind: github.organization
        required_payload_fields:
        - id
        schema_ref: github/organization/v1
        urn_kind: github_organization
      event_kind: organization
      id: organization
      id_field: id
      label: Organization
      method: GET
      name_field: login
      pagination:
        page_size: 100
        page_size_param: per_page
        type: page
      path: "/organizations"
      projection:
        fields:
          id: id
          name: login
          provider_id: id
        template: identity_group
      record_selector: "$[*]"
    schema_version: cerebro.integration/v1
    scope_options:
    - default_enabled: true
      families:
      - issue
      id: issue
      label: Issue
    - default_enabled: true
      families:
      - event
      id: event
      label: Event
    - default_enabled: true
      families:
      - email
      id: email
      label: Email
    - default_enabled: true
      families:
      - organization
      id: organization
      label: Organization
    source_id: github
    tenant_id: builtin_catalog
    transport:
      base_url: https://api.github.com
      retry:
        backoff: exponential
        max_attempts: 3
        retry_after_header: Retry-After
        statuses:
        - 429
        - 500
        - 502
        - 503
        - 504
      verification:
        expect_status:
        - 200
        method: GET
        path: "/issues"
