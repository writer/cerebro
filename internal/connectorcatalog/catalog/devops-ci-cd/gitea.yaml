entries:
- classifier_output: supported
  definition:
    auth:
      credential_fields:
      - key: api_key
        label: API key
        reference_only: true
        required: true
        secret: true
      model: api_key
      requires_references: true
    categories:
    - saas
    config_fields:
    - help: Path parameter inferred from the OpenAPI operation.
      key: owner
      label: Owner
      required: true
    - help: Path parameter inferred from the OpenAPI operation.
      key: repo
      label: Repo
      required: true
    - help: Path parameter inferred from the OpenAPI operation.
      key: index
      label: Index
      required: true
    description: "Collects search, email, team, and timeline from Gitea and projects them into the Cerebro graph as findings, users, groups, and audit events for repository, build, deployment, and release context."
    display_name: Gitea
    id: builtin_catalog-gitea
    resource_families:
    - coverage:
      - families:
        - search
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
        id: findings
        support: partial
        title: Search
        type: remediation_state
      default_enabled: true
      event:
        kind: gitea.search
        required_payload_fields:
        - id
        schema_ref: gitea/search/v1
        urn_kind: gitea_search
      event_kind: search
      id: search
      id_field: id
      label: Search
      method: GET
      name_field: title
      pagination:
        cursor_param: before
        page_size: 100
        page_size_param: limit
        type: cursor
      path: "/repos/issues/search"
      permissions_needed:
      - AccessToken
      - AuthorizationHeaderToken
      - BasicAuth
      - SudoHeader
      - SudoParam
      - TOTPHeader
      - Token
      projection:
        fields:
          finding_id: id
          id: id
          name: title
          severity: assets
          status: state
          title: title
        template: finding
      record_selector: "$[*]"
    - coverage:
      - families:
        - email
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: email
        support: partial
        title: Email
        type: entity_family
      default_enabled: true
      event:
        kind: gitea.email
        required_payload_fields:
        - email
        schema_ref: gitea/email/v1
        urn_kind: gitea_email
      event_kind: email
      id: email
      id_field: email
      label: Email
      method: GET
      name_field: email
      pagination:
        type: none
      path: "/user/emails"
      permissions_needed:
      - AccessToken
      - AuthorizationHeaderToken
      - BasicAuth
      - SudoHeader
      - SudoParam
      - TOTPHeader
      - Token
      projection:
        fields:
          id: email
          name: email
          provider_id: email
        template: identity_user
      record_selector: "$[*]"
    - coverage:
      - families:
        - team
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
        id: team
        support: partial
        title: Team
        type: entity_family
      default_enabled: true
      event:
        kind: gitea.team
        required_payload_fields:
        - id
        schema_ref: gitea/team/v1
        urn_kind: gitea_team
      event_kind: team
      id: team
      id_field: id
      label: Team
      method: GET
      name_field: name
      pagination:
        inject_first_page: true
        page_param: page
        page_size: 100
        page_size_param: limit
        start_page: 1
        type: page
      path: "/user/teams"
      permissions_needed:
      - AccessToken
      - AuthorizationHeaderToken
      - BasicAuth
      - SudoHeader
      - SudoParam
      - TOTPHeader
      - Token
      projection:
        fields:
          id: id
          name: name
          provider_id: id
        template: identity_group
      record_selector: "$[*]"
    - coverage:
      - families:
        - timeline
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
        id: audit_events
        support: partial
        title: Timeline
        type: audit_event
      default_enabled: true
      event:
        kind: gitea.timeline
        required_payload_fields:
        - id
        schema_ref: gitea/timeline/v1
        urn_kind: gitea_timeline
      event_kind: timeline
      id: timeline
      id_field: id
      label: Timeline
      method: GET
      name_field: label
      pagination:
        cursor_param: before
        page_size: 100
        page_size_param: limit
        type: cursor
      path: "/repos/${config.owner}/${config.repo}/issues/${config.index}/timeline"
      permissions_needed:
      - AccessToken
      - AuthorizationHeaderToken
      - BasicAuth
      - SudoHeader
      - SudoParam
      - TOTPHeader
      - Token
      projection:
        fields:
          id: id
          name: label
          provider_id: id
        template: audit_event
      record_selector: "$[*]"
    schema_version: cerebro.integration/v1
    scope_options:
    - default_enabled: true
      families:
      - search
      id: search
      label: Search
    - default_enabled: true
      families:
      - email
      id: email
      label: Email
    - default_enabled: true
      families:
      - team
      id: team
      label: Team
    - default_enabled: true
      families:
      - timeline
      id: timeline
      label: Timeline
    source_id: gitea
    tenant_id: builtin_catalog
    transport:
      base_url: "/api/v1"
      retry:
        backoff: exponential
        max_attempts: 3
        retry_after_header: Retry-After
        statuses:
        - 429
        - 500
        - 502
        - 503
        - 504
      verification:
        expect_status:
        - 200
        method: GET
        path: "/repos/issues/search"
