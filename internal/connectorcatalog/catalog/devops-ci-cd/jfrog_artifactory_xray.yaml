entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - dev
        - artifacts
      description: Collects assets, findings, and vulnerabilities from JFrog Artifactory/Xray and projects them into the Cerebro graph as assets, findings, and vulnerabilities for repository, build, deployment, and release context.
      display_name: JFrog Artifactory/Xray
      id: builtin-jfrog_artifactory_xray
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - assets
              high_value: true
              id: assets
              support: partial
              title: Assets
              type: entity_family
          event:
            kind: jfrog_artifactory_xray.assets
            required_payload_fields:
              - id
            schema_ref: jfrog_artifactory_xray/assets/v1
            urn_kind: jfrog_artifactory_xray_assets
          id: assets
          id_field: id
          label: Assets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/assets
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - findings
              high_value: true
              id: findings
              support: partial
              title: Findings
              type: remediation_state
          event:
            kind: jfrog_artifactory_xray.findings
            required_payload_fields:
              - id
            schema_ref: jfrog_artifactory_xray/findings/v1
            urn_kind: jfrog_artifactory_xray_findings
          id: findings
          id_field: id
          label: Findings
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/findings
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: finding
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - vulnerabilities
              high_value: true
              id: vulnerabilities
              support: partial
              title: Vulnerabilities
              type: remediation_state
          event:
            kind: jfrog_artifactory_xray.vulnerabilities
            required_payload_fields:
              - id
            schema_ref: jfrog_artifactory_xray/vulnerabilities/v1
            urn_kind: jfrog_artifactory_xray_vulnerabilities
          id: vulnerabilities
          id_field: id
          label: Vulnerabilities
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/vulnerabilities
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: vulnerability
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: jfrog_artifactory_xray
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.jfrog_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /xray/api/v1/system/ping
