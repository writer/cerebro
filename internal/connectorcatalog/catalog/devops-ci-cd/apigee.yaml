entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Google OAuth2 access token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - devops_ci_cd
      config_fields:
        - help: Apigee organization name used in organization-scoped API paths.
          key: organization
          label: Apigee organization
          required: true
      description: Collects Apigee organizations, API proxies, deployments, developers, and apps from the Google Cloud Apigee API and projects them into the Cerebro graph as assets, deployments, and identities for API management inventory and delivery context.
      display_name: Apigee
      id: builtin-apigee
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - organizations
              high_value: true
              id: organizations
              support: partial
              title: Organizations
              type: entity_family
          default_enabled: true
          event:
            kind: apigee.organizations
            required_payload_fields:
              - id
            schema_ref: apigee/organizations/v1
            urn_kind: apigee_organizations
          id: organizations
          id_field: organization
          label: Organizations
          method: GET
          name_field: organization
          pagination:
            type: none
          path: /v1/organizations
          projection:
            fields:
              id: organization
              name: organization
              resource_id: organization
              resource_name: organization
              resource_type: apigee_organization
            template: asset
          record_selector: $.organizations[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - api_proxies
              high_value: true
              id: api_proxies
              support: partial
              title: API Proxies
              type: entity_family
          default_enabled: true
          event:
            kind: apigee.api_proxies
            required_payload_fields:
              - id
            schema_ref: apigee/api_proxies/v1
            urn_kind: apigee_api_proxies
          id: api_proxies
          id_field: name
          label: API Proxies
          method: GET
          name_field: name
          pagination:
            type: none
          path: /v1/organizations/${config.organization}/apis
          projection:
            fields:
              id: name
              name: name
              resource_id: name
              resource_name: name
              resource_type: apigee_api_proxy
            template: asset
          record_selector: $.proxies[*]
        - coverage:
            - control_domains:
                - change_management
              evidence_types:
                - change_management
              families:
                - deployments
              high_value: true
              id: deployments
              support: partial
              title: Deployments
              type: deployment_state
          default_enabled: true
          event:
            kind: apigee.deployments
            required_payload_fields:
              - id
            schema_ref: apigee/deployments/v1
            urn_kind: apigee_deployments
          id: deployments
          id_field: apiProxy
          label: Deployments
          method: GET
          name_field: apiProxy
          pagination:
            type: none
          path: /v1/organizations/${config.organization}/deployments
          projection:
            fields:
              deployment_environment: environment
              deployment_id: apiProxy
              deployment_name: apiProxy
              deployment_status: state
              resource_id: apiProxy
            template: deployment
          record_selector: $.deployments[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - developers
              high_value: true
              id: developers
              support: partial
              title: Developers
              type: entity_family
          default_enabled: true
          event:
            kind: apigee.developers
            required_payload_fields:
              - id
            schema_ref: apigee/developers/v1
            urn_kind: apigee_developers
          id: developers
          id_field: email
          label: Developers
          method: GET
          name_field: email
          pagination:
            cursor_json_path: $.developer[-1:].email
            cursor_param: startKey
            page_size: 100
            page_size_param: count
            type: cursor
          path: /v1/organizations/${config.organization}/developers
          projection:
            fields:
              display_name: email
              email: email
              status: status
              user_id: email
            template: identity_user
          record_selector: $.developer[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - apps
              high_value: true
              id: apps
              support: partial
              title: Apps
              type: entity_family
          default_enabled: true
          event:
            kind: apigee.apps
            required_payload_fields:
              - id
            schema_ref: apigee/apps/v1
            urn_kind: apigee_apps
          id: apps
          id_field: appId
          label: Apps
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.nextPageToken
            cursor_param: pageToken
            page_size: 100
            page_size_param: pageSize
            type: cursor
          path: /v1/organizations/${config.organization}/apps
          projection:
            fields:
              id: appId
              name: name
              resource_id: appId
              resource_name: name
              resource_type: apigee_app
            template: asset
          record_selector: $.app[*]
      schema_version: cerebro.integration/v1
      source_id: apigee
      tenant_id: builtin_catalog
      transport:
        base_url: https://apigee.googleapis.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/organizations/${config.organization}
