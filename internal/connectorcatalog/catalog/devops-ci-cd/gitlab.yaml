entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - dev
        - code
      description: Collects repositories, users, and audit events from GitLab and projects them into the Cerebro graph as repositories, users, and audit events for repository, build, deployment, and release context.
      display_name: GitLab
      id: builtin-gitlab
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - repositories
              high_value: true
              id: repositories
              support: partial
              title: Repositories
              type: entity_family
          event:
            kind: gitlab.repositories
            required_payload_fields:
              - id
            schema_ref: gitlab/repositories/v1
            urn_kind: runtime_repositories
          id: repositories
          id_field: id
          label: Repositories
          method: GET
          pagination:
            cursor_param: page
            link_header: Link
            page_size: 100
            page_size_param: per_page
            type: link
          path: /api/v4/projects
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: repository
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          event:
            kind: gitlab.users
            required_payload_fields:
              - id
            schema_ref: gitlab/users/v1
            urn_kind: runtime_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_param: page
            link_header: Link
            page_size: 100
            page_size_param: per_page
            type: link
          path: /api/v4/users
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: gitlab.audit_events
            required_payload_fields:
              - id
            schema_ref: gitlab/audit_events/v1
            urn_kind: runtime_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_param: page
            link_header: Link
            page_size: 100
            page_size_param: per_page
            type: link
          path: /api/v4/audit_events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $[*]
      schema_version: cerebro.integration/v1
      source_id: gitlab
      tenant_id: builtin_catalog
      transport:
        base_url: https://gitlab.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/v4/user
