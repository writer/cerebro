entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-heroku
    tenant_id: builtin_catalog
    source_id: heroku
    display_name: Heroku
    description: Heroku connector definition catalog entry for high-value security and operations resources.
    categories:
    - devops
    - paas
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://api.heroku.com
      verification:
        method: GET
        path: "/apps"
        expect_status:
        - 200
    resource_families:
    - id: apps
      label: Apps
      path: "/apps"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: heroku.apps
        schema_ref: heroku/apps/v1
      projection:
        template: asset
      coverage:
      - id: apps
        type: entity_family
        title: Apps
        families:
        - apps
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: collaborators
      label: Collaborators
      path: "/collaborators"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: heroku.collaborators
        schema_ref: heroku/collaborators/v1
      projection:
        template: identity_user
      coverage:
      - id: collaborators
        type: entity_family
        title: Collaborators
        families:
        - collaborators
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit-events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: heroku.audit_events
        schema_ref: heroku/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
