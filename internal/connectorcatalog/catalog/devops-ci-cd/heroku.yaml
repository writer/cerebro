entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            reference_only: true
            secret: true
        model: bearer_token
      categories:
        - devops
        - paas
      description: Collects apps, collaborators, and audit events from Heroku and projects them into the Cerebro graph as assets, users, and audit events for repository, build, deployment, and release context.
      display_name: Heroku
      id: builtin-heroku
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - apps
              high_value: true
              id: apps
              support: partial
              title: Apps
              type: entity_family
          event:
            kind: heroku.apps
            required_payload_fields:
              - id
            schema_ref: heroku/apps/v1
            urn_kind: heroku_apps
          id: apps
          id_field: id
          label: Apps
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /apps
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - collaborators
              high_value: true
              id: collaborators
              support: partial
              title: Collaborators
              type: entity_family
          event:
            kind: heroku.collaborators
            required_payload_fields:
              - id
            schema_ref: heroku/collaborators/v1
            urn_kind: heroku_collaborators
          id: collaborators
          id_field: id
          label: Collaborators
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /collaborators
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: heroku.audit_events
            required_payload_fields:
              - id
            schema_ref: heroku/audit_events/v1
            urn_kind: heroku_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /audit-events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: heroku
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.heroku.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /apps
