entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - devops_ci_cd
      config_fields:
        - help: Account-specific Aha! domain, such as https://company.aha.io.
          key: base_url
          label: Aha! account base URL
          required: true
        - help: Product identifier used when reading product-scoped releases.
          key: product_id
          label: Product ID
          required: false
      description: Collects users, products, features, releases, and audit events from Aha! and projects them into the Cerebro graph as users, assets, release records, and audit evidence for product development context.
      display_name: Aha
      id: builtin-aha
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: aha.users
            required_payload_fields:
              - id
            schema_ref: aha/users/v1
            urn_kind: aha_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_param: page
            first_cursor: "1"
            page_size: 100
            page_size_param: per_page
            type: cursor
          path: /users
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: user
            template: identity_user
          record_selector: $.users[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - products
              high_value: true
              id: products
              support: partial
              title: Products
              type: entity_family
          default_enabled: true
          event:
            kind: aha.products
            required_payload_fields:
              - id
            schema_ref: aha/products/v1
            urn_kind: aha_products
          id: products
          id_field: id
          label: Products
          method: GET
          name_field: name
          pagination:
            cursor_param: page
            first_cursor: "1"
            page_size: 100
            page_size_param: per_page
            type: cursor
          path: /products
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: product
            template: asset
          record_selector: $.products[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - features
              high_value: true
              id: features
              support: partial
              title: Features
              type: entity_family
          default_enabled: true
          event:
            kind: aha.features
            required_payload_fields:
              - id
            schema_ref: aha/features/v1
            urn_kind: aha_features
          id: features
          id_field: id
          label: Features
          method: GET
          name_field: name
          pagination:
            cursor_param: page
            first_cursor: "1"
            page_size: 100
            page_size_param: per_page
            type: cursor
          path: /features
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: feature
            template: asset
          record_selector: $.features[*]
        - coverage:
            - control_domains:
                - secure_delivery
              evidence_types:
                - change_management
              families:
                - releases
              high_value: true
              id: releases
              support: partial
              title: Releases
              type: entity_family
          default_enabled: true
          event:
            kind: aha.releases
            required_payload_fields:
              - id
            schema_ref: aha/releases/v1
            urn_kind: aha_releases
          id: releases
          id_field: id
          label: Releases
          method: GET
          name_field: name
          pagination:
            cursor_param: page
            first_cursor: "1"
            page_size: 100
            page_size_param: per_page
            type: cursor
          path: /products/{product_id}/releases
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: release
            template: asset
          record_selector: $.releases[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: aha.audit_events
            required_payload_fields:
              - id
            schema_ref: aha/audit_events/v1
            urn_kind: aha_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          name_field: id
          pagination:
            cursor_param: page
            first_cursor: "1"
            page_size: 100
            page_size_param: per_page
            type: cursor
          path: /audits
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: audit_event
            template: audit_event
          record_selector: $.audits[*]
      schema_version: cerebro.integration/v1
      source_id: aha
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}/api/v1
        verification:
          expect_status:
            - 200
          method: GET
          path: /me
