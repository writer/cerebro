        - node_name
        - ready
        required_payload_fields:
        - name
        - node_info
        - ready
        schema_ref: kubernetes/node/v1
        urn_kind: kubernetes_node
      id: node
      id_field: metadata.uid
      label: Nodes
      method: GET
      name_field: metadata.name
      path: "/api/v1/nodes"
      projection:
        entity:
          entity_type: kubernetes.node
