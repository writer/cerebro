        urn_kind: kubernetes_workload
      id: workload
      id_field: metadata.uid
      label: Workloads
      method: GET
      name_field: metadata.name
      path: "/api/v1/pods"
      projection:
        entity:
          entity_type: kubernetes.workload
          id_attributes:
