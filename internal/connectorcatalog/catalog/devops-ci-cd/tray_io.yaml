entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - devops_ci_cd
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects users, projects, repositories, deployments, and audit events from Tray.io and projects them into the Cerebro graph as assets, audit events, deployments, repositories, and users for inventory, access review, audit, risk, and operational context.
      display_name: Tray.io
      id: builtin-tray_io
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - users
              high_value: true
              id: users
              support: partial
              title: Users
              type: entity_family
          default_enabled: true
          event:
            kind: tray_io.users
            required_payload_fields:
              - id
            schema_ref: tray_io/users/v1
            urn_kind: tray_io_users
          id: users
          id_field: id
          label: Users
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/users
          projection:
            fields:
              display_name: Tray.io
              email: email
              status: status
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - projects
              high_value: true
              id: projects
              support: partial
              title: Projects
              type: entity_family
          default_enabled: true
          event:
            kind: tray_io.projects
            required_payload_fields:
              - id
            schema_ref: tray_io/projects/v1
            urn_kind: tray_io_projects
          id: projects
          id_field: id
          label: Projects
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/projects
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: project
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - repositories
              high_value: true
              id: repositories
              support: partial
              title: Repositories
              type: entity_family
          default_enabled: true
          event:
            kind: tray_io.repositories
            required_payload_fields:
              - id
            schema_ref: tray_io/repositories/v1
            urn_kind: tray_io_repositories
          id: repositories
          id_field: id
          label: Repositories
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/repositories
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: repository
            template: repository
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - change_management
              evidence_types:
                - change_management
              families:
                - deployments
              high_value: true
              id: deployments
              support: partial
              title: Deployments
              type: deployment_state
          default_enabled: true
          event:
            kind: tray_io.deployments
            required_payload_fields:
              - id
            schema_ref: tray_io/deployments/v1
            urn_kind: tray_io_deployments
          id: deployments
          id_field: id
          label: Deployments
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/deployments
          projection:
            fields:
              deployment_id: id
              deployment_name: name
              deployment_status: status
              resource_id: resource_id
            template: deployment
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: tray_io.audit_events
            required_payload_fields:
              - id
            schema_ref: tray_io/audit_events/v1
            urn_kind: tray_io_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit_events
          projection:
            fields:
              actor_email: actor_email
              actor_id: actor_id
              event_type: event_type
              id: id
              resource_id: resource_id
              resource_type: resource_type
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: tray_io
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/me
