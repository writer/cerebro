entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: User or project API key
            reference_only: true
            required: true
            secret: true
        model: api_key
        requires_references: true
      categories:
        - saas
        - observability_soar_threat_intel
      config_fields:
        - help: Airbrake project id for project-scoped families such as deploys, source maps, and activities.
          key: project_id
          label: Project ID
          required: false
      description: Collects projects, error groups, deploys, source maps, and project activities from Airbrake and projects them into the Cerebro graph as assets, findings, change records, and audit evidence for error monitoring and incident response context.
      display_name: Airbrake
      id: builtin-airbrake
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - projects
              high_value: true
              id: projects
              support: partial
              title: Projects
              type: entity_family
          default_enabled: true
          event:
            kind: airbrake.projects
            required_payload_fields:
              - id
            schema_ref: airbrake/projects/v1
            urn_kind: airbrake_projects
          id: projects
          id_field: id
          label: Projects
          method: GET
          name_field: name
          pagination:
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /api/v4/projects
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: airbrake_project
            template: asset
          record_selector: $.projects[*]
        - coverage:
            - control_domains:
                - remediation
                - security_operations
              evidence_types:
                - remediation_state
              families:
                - groups
              high_value: true
              id: groups
              support: partial
              title: Error groups
              type: finding
          default_enabled: true
          event:
            kind: airbrake.groups
            required_payload_fields:
              - id
            schema_ref: airbrake/groups/v1
            urn_kind: airbrake_groups
          id: groups
          id_field: id
          label: Error groups
          method: GET
          name_field: id
          pagination:
            cursor_json_path: $.end
            cursor_param: start
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /api/v4/groups
          projection:
            fields:
              finding_id: id
              resource_id: projectId
              resource_type: airbrake_project
              severity: context.severity
              status: resolved
              title: errors.0.type
            template: finding
          record_selector: $.groups[*]
        - coverage:
            - control_domains:
                - secure_delivery
              evidence_types:
                - change_management
              families:
                - deploys
              high_value: true
              id: deploys
              support: partial
              title: Deploys
              type: entity_family
          default_enabled: true
          event:
            kind: airbrake.deploys
            required_payload_fields:
              - id
            schema_ref: airbrake/deploys/v1
            urn_kind: airbrake_deploys
          id: deploys
          id_field: id
          label: Deploys
          method: GET
          name_field: version
          pagination:
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /api/v4/projects/{project_id}/deploys
          projection:
            fields:
              id: id
              name: version
              resource_id: id
              resource_name: version
              resource_type: airbrake_deploy
            template: asset
          record_selector: $.deploys[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - source_maps
              high_value: true
              id: source_maps
              support: partial
              title: Source maps
              type: entity_family
          default_enabled: true
          event:
            kind: airbrake.source_maps
            required_payload_fields:
              - id
            schema_ref: airbrake/source_maps/v1
            urn_kind: airbrake_source_maps
          id: source_maps
          id_field: id
          label: Source maps
          method: GET
          name_field: name
          pagination:
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /api/v4/projects/{project_id}/sourcemaps
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: airbrake_source_map
            template: asset
          record_selector: $.sourcemaps[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - project_activities
              high_value: true
              id: project_activities
              support: partial
              title: Project activities
              type: audit_event
          default_enabled: true
          event:
            kind: airbrake.project_activities
            required_payload_fields:
              - id
            schema_ref: airbrake/project_activities/v1
            urn_kind: airbrake_project_activities
          id: project_activities
          id_field: id
          label: Project activities
          method: GET
          name_field: activity
          pagination:
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /api/v4/projects/{project_id}/activities
          projection:
            fields:
              actor_id: userId
              actor_name: userName
              event_type: activity
              id: id
              resource_id: trackableId
              resource_type: trackableType
            template: audit_event
          record_selector: $.activities[*]
      schema_version: cerebro.integration/v1
      source_id: airbrake
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.airbrake.io
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/v4/projects
