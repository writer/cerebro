entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - siem
        - observability
      description: Collects audit events, detections, and assets from Elastic Security and projects them into the Cerebro graph as audit events, findings, and assets for alert, incident, service health, and response context.
      display_name: Elastic Security
      id: builtin-elastic_security
      resource_families:
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: elastic_security.audit_events
            required_payload_fields:
              - id
            schema_ref: elastic_security/audit_events/v1
            urn_kind: elastic_security_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - findings
              high_value: true
              id: findings
              support: partial
              title: Detections
              type: remediation_state
          event:
            kind: elastic_security.findings
            required_payload_fields:
              - id
            schema_ref: elastic_security/findings/v1
            urn_kind: elastic_security_findings
          id: findings
          id_field: id
          label: Detections
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/detections
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: finding
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - assets
              high_value: true
              id: assets
              support: partial
              title: Assets
              type: entity_family
          event:
            kind: elastic_security.assets
            required_payload_fields:
              - id
            schema_ref: elastic_security/assets/v1
            urn_kind: elastic_security_assets
          id: assets
          id_field: id
          label: Assets
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/assets
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: elastic_security
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.elastic_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /api/status
