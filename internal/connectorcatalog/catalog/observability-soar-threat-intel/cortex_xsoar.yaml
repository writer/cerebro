entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-cortex_xsoar
    tenant_id: builtin_catalog
    source_id: cortex_xsoar
    display_name: Cortex XSOAR
    description: Cortex XSOAR connector definition catalog entry for high-value security and operations resources.
    categories:
    - soar
    - security
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.instance_url}
      verification:
        method: GET
        path: "/xsoar/public/v1/health"
        expect_status:
        - 200
    resource_families:
    - id: audit_events
      label: Workflow events
      path: "/v1/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: cortex_xsoar.audit_events
        schema_ref: cortex_xsoar/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Workflow events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: findings
      label: Cases
      path: "/v1/cases"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: cortex_xsoar.findings
        schema_ref: cortex_xsoar/findings/v1
      projection:
        template: finding
      coverage:
      - id: findings
        type: remediation_state
        title: Cases
        families:
        - findings
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: assets
      label: Assets
      path: "/v1/assets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: cortex_xsoar.assets
        schema_ref: cortex_xsoar/assets/v1
      projection:
        template: asset
      coverage:
      - id: assets
        type: entity_family
        title: Assets
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
