entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - threat_intel
        - identity
      description: Collects breaches, affected accounts, and audit events from Have I Been Pwned and projects them into the Cerebro graph as findings, users, and audit events for alert, incident, service health, and response context.
      display_name: Have I Been Pwned
      id: builtin-haveibeenpwned
      resource_families:
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - breaches
              high_value: true
              id: breaches
              support: partial
              title: Breaches
              type: remediation_state
          event:
            kind: haveibeenpwned.breaches
            required_payload_fields:
              - id
            schema_ref: haveibeenpwned/breaches/v1
            urn_kind: haveibeenpwned_breaches
          id: breaches
          id_field: id
          label: Breaches
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /breaches
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: finding
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - affected_accounts
              high_value: true
              id: affected_accounts
              support: partial
              title: Affected accounts
              type: entity_family
          event:
            kind: haveibeenpwned.affected_accounts
            required_payload_fields:
              - id
            schema_ref: haveibeenpwned/affected_accounts/v1
            urn_kind: haveibeenpwned_affected_accounts
          id: affected_accounts
          id_field: id
          label: Affected accounts
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /breachedaccount
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: haveibeenpwned.audit_events
            required_payload_fields:
              - id
            schema_ref: haveibeenpwned/audit_events/v1
            urn_kind: haveibeenpwned_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /audit-events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: haveibeenpwned
      tenant_id: builtin_catalog
      transport:
        base_url: https://haveibeenpwned.com/api/v3
        verification:
          expect_status:
            - 200
          method: GET
          path: /breaches
