entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-haveibeenpwned
    tenant_id: builtin_catalog
    source_id: haveibeenpwned
    display_name: Have I Been Pwned
    description: "Collects breaches, affected accounts, and audit events from Have I Been Pwned and projects them into the Cerebro graph as findings, users, and audit events for alert, incident, service health, and response context."
    categories:
    - threat_intel
    - identity
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://haveibeenpwned.com/api/v3
      verification:
        method: GET
        path: "/breaches"
        expect_status:
        - 200
    resource_families:
    - id: breaches
      label: Breaches
      path: "/breaches"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: haveibeenpwned.breaches
        schema_ref: haveibeenpwned/breaches/v1
      projection:
        template: finding
      coverage:
      - id: breaches
        type: remediation_state
        title: Breaches
        families:
        - breaches
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: affected_accounts
      label: Affected accounts
      path: "/breachedaccount"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: haveibeenpwned.affected_accounts
        schema_ref: haveibeenpwned/affected_accounts/v1
      projection:
        template: identity_user
      coverage:
      - id: affected_accounts
        type: entity_family
        title: Affected accounts
        families:
        - affected_accounts
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit-events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: haveibeenpwned.audit_events
        schema_ref: haveibeenpwned/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
