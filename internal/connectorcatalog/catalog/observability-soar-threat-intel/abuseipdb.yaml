entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
        token_header: Key
      categories:
        - threat_intel
        - security
      config_fields:
        - help: IP address whose report history will be collected.
          key: ip_address
          label: IP address
          required: true
        - help: Optional report lookback from 1 to 365 days.
          key: max_age_in_days
          label: Maximum age in days
        - help: Optional blacklist confidence threshold from 25 to 100.
          key: confidence_minimum
          label: Confidence minimum
        - help: Optional blacklist IP version, either 4 or 6.
          key: ip_version
          label: IP version
      description: Collects AbuseIPDB report history and blacklist IP reputation snapshots, then projects them into the Cerebro graph as findings and threat-intelligence assets for alert, incident, service health, and response context.
      display_name: AbuseIPDB
      id: builtin-abuseipdb
      resource_families:
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - reports
              high_value: true
              id: reports
              support: partial
              title: Reports
              type: remediation_state
          event:
            kind: abuseipdb.reports
            required_payload_fields:
              - reportedAt
              - reporterId
            schema_ref: abuseipdb/reports/v1
            urn_kind: abuseipdb_reports
          id: reports
          id_field: reportedAt
          label: Reports
          method: GET
          pagination:
            page_param: page
            page_size: 100
            page_size_param: perPage
            start_page: 1
            type: page
          path: /reports
          config:
            config_attributes:
              resource_id: ip_address
              resource_name: ip_address
            config_query:
              ipAddress: ip_address
              maxAgeInDays: max_age_in_days
            id_template: "${reportedAt}:${reporterId}"
          projection:
            fields:
              description: comment
              title: comment
            static_fields:
              resource_type: abuseipdb_report
              severity: reported
              status: observed
            template: finding
          record_selector: $.data.results[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - ip_addresses
              high_value: true
              id: ip_addresses
              support: partial
              title: IP addresses
              type: entity_family
          event:
            kind: abuseipdb.ip_addresses
            required_payload_fields:
              - ipAddress
            schema_ref: abuseipdb/ip_addresses/v1
            urn_kind: abuseipdb_ip_addresses
          id: ip_addresses
          id_field: ipAddress
          label: IP addresses
          method: GET
          pagination:
            type: none
          path: /blacklist
          config:
            config_query:
              confidenceMinimum: confidence_minimum
              ipVersion: ip_version
          projection:
            fields:
              resource_id: ipAddress
              resource_name: ipAddress
            static_fields:
              resource_type: ip_address
            template: asset
          record_selector: $.data[*]
          static_query:
            confidenceMinimum: "90"
            limit: "10000"
      schema_version: cerebro.integration/v1
      source_id: abuseipdb
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.abuseipdb.com/api/v2
        verification:
          expect_status:
            - 200
          method: GET
          path: /blacklist
