entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - threat_intel
        - security
      description: Collects AbuseIPDB report history and blacklist IP reputation snapshots, then projects them into the Cerebro graph as findings and threat-intelligence assets for alert, incident, service health, and response context.
      display_name: AbuseIPDB
      id: builtin-abuseipdb
      resource_families:
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - reports
              high_value: true
              id: reports
              support: partial
              title: Reports
              type: remediation_state
          event:
            kind: abuseipdb.reports
            required_payload_fields:
              - reportedAt
            schema_ref: abuseipdb/reports/v1
            urn_kind: abuseipdb_reports
          id: reports
          id_field: reportedAt
          label: Reports
          method: GET
          pagination:
            cursor_json_path: $.data.nextPageUrl
            cursor_param: page
            page_size: 25
            page_size_param: perPage
            type: cursor
          path: /reports
          projection:
            fields:
              description: comment
              finding_id: reportedAt
              resource_id: ipAddress
            template: finding
          record_selector: $.data.results[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - ip_addresses
              high_value: true
              id: ip_addresses
              support: partial
              title: IP addresses
              type: entity_family
          event:
            kind: abuseipdb.ip_addresses
            required_payload_fields:
              - ipAddress
            schema_ref: abuseipdb/ip_addresses/v1
            urn_kind: abuseipdb_ip_addresses
          id: ip_addresses
          id_field: ipAddress
          label: IP addresses
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /blacklist
          projection:
            fields:
              resource_id: ipAddress
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: abuseipdb
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.abuseipdb.com/api/v2
        verification:
          expect_status:
            - 200
          method: GET
          path: /blacklist
