entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-resend
    tenant_id: builtin_catalog
    source_id: resend
    display_name: Resend
    description: "Collects domains, API keys, and audit events from Resend and projects them into the Cerebro graph as assets, secrets, and audit events for alert, incident, service health, and response context."
    categories:
    - observability
    - email
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.resend.com
      verification:
        method: GET
        path: "/domains"
        expect_status:
        - 200
    resource_families:
    - id: domains
      label: Domains
      path: "/domains"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: resend.domains
        schema_ref: resend/domains/v1
      projection:
        template: asset
      coverage:
      - id: domains
        type: entity_family
        title: Domains
        families:
        - domains
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: api_keys
      label: API keys
      path: "/api-keys"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: resend.api_keys
        schema_ref: resend/api_keys/v1
      projection:
        template: secret
      coverage:
      - id: api_keys
        type: entity_family
        title: API keys
        families:
        - api_keys
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: resend.audit_events
        schema_ref: resend/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
