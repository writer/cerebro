entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-grafana_cloud
    tenant_id: builtin_catalog
    source_id: grafana_cloud
    display_name: Grafana Cloud
    description: Grafana Cloud connector definition catalog entry for high-value security and operations resources.
    categories:
    - observability
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        secret: true
        reference_only: true
    transport:
      base_url: https://${config.stack_url}
      verification:
        method: GET
        path: "/api/health"
        expect_status:
        - 200
    resource_families:
    - id: assets
      label: Monitored assets
      path: "/v1/entities"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: grafana_cloud.assets
        schema_ref: grafana_cloud/assets/v1
      projection:
        template: asset
      coverage:
      - id: assets
        type: entity_family
        title: Monitored assets
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: findings
      label: Alerts
      path: "/v1/alerts"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: grafana_cloud.findings
        schema_ref: grafana_cloud/findings/v1
      projection:
        template: finding
      coverage:
      - id: findings
        type: remediation_state
        title: Alerts
        families:
        - findings
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/v1/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: grafana_cloud.audit_events
        schema_ref: grafana_cloud/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
