---
entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-uptime_com
    tenant_id: builtin_catalog
    source_id: uptime_com
    display_name: Uptime Com
    description: "Collects alerts, incidents, monitors, dashboards, and audit events from Uptime Com and projects them into the Cerebro graph as alerts, findings, assets, and audit events for alert, incident, service health, and response context."
    categories:
    - saas
    - observability_soar_threat_intel
    auth:
      model: bearer_token
      credential_fields:
      - key: token
        label: Bearer token
        secret: true
        reference_only: true
        required: true
      requires_references: true
    config_fields:
    - key: base_url
      label: API base URL
      required: true
      help: Tenant or regional API base URL.
    transport:
      base_url: "${config.base_url}"
      verification:
        method: GET
        path: "/v1/me"
        expect_status:
        - 200
    ingest:
      mode: pull
    resource_families:
    - id: alerts
      label: Alerts
      path: "/v1/alerts"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: uptime_com.alerts
        schema_ref: uptime_com/alerts/v1
        required_payload_fields:
        - id
      projection:
        template: alert
        fields:
          alert_id: id
          alert_name: name
          alert_severity: severity
          alert_status: status
      coverage:
      - id: alerts
        type: alert_state
        title: Alerts
        families:
        - alerts
        support: partial
        high_value: true
        evidence_types:
        - security_monitoring
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: incidents
      label: Incidents
      path: "/v1/incidents"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: uptime_com.incidents
        schema_ref: uptime_com/incidents/v1
        required_payload_fields:
        - id
      projection:
        template: finding
        fields:
          finding_id: id
          title: title
          severity: severity
          status: status
          resource_id: resource_id
          resource_type: resource_type
      coverage:
      - id: incidents
        type: finding
        title: Incidents
        families:
        - incidents
        support: partial
        high_value: true
        evidence_types:
        - finding_snapshot
        control_domains:
        - incident_response
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: monitors
      label: Monitors
      path: "/v1/monitors"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: uptime_com.monitors
        schema_ref: uptime_com/monitors/v1
        required_payload_fields:
        - id
      projection:
        template: asset
        fields:
          id: id
          name: name
          resource_id: id
          resource_name: name
          resource_type: monitor
      coverage:
      - id: monitors
        type: entity_family
        title: Monitors
        families:
        - monitors
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: dashboards
      label: Dashboards
      path: "/v1/dashboards"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: uptime_com.dashboards
        schema_ref: uptime_com/dashboards/v1
        required_payload_fields:
        - id
      projection:
        template: asset
        fields:
          id: id
          name: name
          resource_id: id
          resource_name: name
          resource_type: dashboard
      coverage:
      - id: dashboards
        type: entity_family
        title: Dashboards
        families:
        - dashboards
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
    - id: audit_events
      label: Audit events
      path: "/v1/audit_events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      name_field: name
      event:
        kind: uptime_com.audit_events
        schema_ref: uptime_com/audit_events/v1
        required_payload_fields:
        - id
      projection:
        template: audit_event
        fields:
          id: id
          event_type: event_type
          actor_id: actor_id
          actor_email: actor_email
          resource_id: resource_id
          resource_type: resource_type
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
      default_enabled: true
