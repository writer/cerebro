entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            label: API key
            reference_only: true
            required: true
            secret: true
          - key: application_key
            label: Application key
            reference_only: true
            required: true
            secret: true
        header_parameters:
          DD-API-KEY: api_key
          DD-APPLICATION-KEY: application_key
        model: api_key
        requires_references: true
      categories:
        - observability
        - security
      description: Collects Datadog users, roles, teams, monitors, service level objectives, dashboards, incidents, and audit events for identity, access, reliability, and response context.
      display_name: Datadog
      id: builtin-datadog
      resource_families:
        - coverage:
            - control_domains: [identity_access, asset_inventory]
              evidence_types: [source_snapshot]
              families: [users]
              high_value: true
              id: identity_users
              support: supported
              title: Users
              type: entity_family
          event:
            attributes:
              created_at: attributes.created_at
              disabled: attributes.disabled
              email: attributes.email
              handle: attributes.handle
              modified_at: attributes.modified_at
              name: attributes.name|attributes.handle
              status: attributes.status
              user_id: id
              verified: attributes.verified
            exact_attributes: true
            kind: datadog.users
            required_attributes: [external_id, family, source_provider, source_product, user_id, email]
            required_payload_fields: [id, attributes]
            schema_ref: datadog/users/v1
            static_attributes: {source_product: datadog, source_system: datadog}
            urn_kind: datadog_users
          id: users
          id_field: id
          label: Users
          method: GET
          pagination:
            cursor_param: page[cursor]
            next_cursor_keys: [meta.page.after, meta.page.cursor]
            page_size: 100
            page_size_param: page[size]
            type: cursor
          path: /api/v2/users
          projection:
            fields:
              created_at: attributes.created_at
              disabled: attributes.disabled
              email: attributes.email
              handle: attributes.handle
              modified_at: attributes.modified_at
              name: attributes.name|attributes.handle
              status: attributes.status
              user_id: id
              verified: attributes.verified
            static_fields:
              source_product: datadog
              source_system: datadog
            template: identity_user
          record_selector: $.data[*]
          updated_at_field: attributes.modified_at|attributes.created_at
