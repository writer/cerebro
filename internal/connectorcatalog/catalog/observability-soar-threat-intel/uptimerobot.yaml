entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - observability
        - security
      description: Collects monitors, alert contacts, and audit events from UptimeRobot and projects them into the Cerebro graph as assets, users, and audit events for alert, incident, service health, and response context.
      display_name: UptimeRobot
      id: builtin-uptimerobot
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - monitors
              high_value: true
              id: monitors
              support: partial
              title: Monitors
              type: entity_family
          event:
            kind: uptimerobot.monitors
            required_payload_fields:
              - id
            schema_ref: uptimerobot/monitors/v1
            urn_kind: uptimerobot_monitors
          id: monitors
          id_field: id
          label: Monitors
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /getMonitors
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - alert_contacts
              high_value: true
              id: alert_contacts
              support: partial
              title: Alert contacts
              type: entity_family
          event:
            kind: uptimerobot.alert_contacts
            required_payload_fields:
              - id
            schema_ref: uptimerobot/alert_contacts/v1
            urn_kind: uptimerobot_alert_contacts
          id: alert_contacts
          id_field: id
          label: Alert contacts
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /getAlertContacts
          projection:
            fields:
              email: email|primary_email|profile.email
              status: status|state|lifecycle_state
              user_id: id
            template: identity_user
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: uptimerobot.audit_events
            required_payload_fields:
              - id
            schema_ref: uptimerobot/audit_events/v1
            urn_kind: uptimerobot_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /getAuditLog
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: uptimerobot
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.uptimerobot.com/v2
        verification:
          expect_status:
            - 200
          method: GET
          path: /getAccountDetails
