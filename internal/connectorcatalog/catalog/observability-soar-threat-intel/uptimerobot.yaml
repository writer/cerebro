entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-uptimerobot
    tenant_id: builtin_catalog
    source_id: uptimerobot
    display_name: UptimeRobot
    description: UptimeRobot connector definition catalog entry for high-value security and operations resources.
    categories:
    - observability
    - security
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.uptimerobot.com/v2
      verification:
        method: GET
        path: "/getAccountDetails"
        expect_status:
        - 200
    resource_families:
    - id: monitors
      label: Monitors
      path: "/getMonitors"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: uptimerobot.monitors
        schema_ref: uptimerobot/monitors/v1
      projection:
        template: asset
      coverage:
      - id: monitors
        type: entity_family
        title: Monitors
        families:
        - monitors
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: alert_contacts
      label: Alert contacts
      path: "/getAlertContacts"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: uptimerobot.alert_contacts
        schema_ref: uptimerobot/alert_contacts/v1
      projection:
        template: identity_user
      coverage:
      - id: alert_contacts
        type: entity_family
        title: Alert contacts
        families:
        - alert_contacts
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/getAuditLog"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: uptimerobot.audit_events
        schema_ref: uptimerobot/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
