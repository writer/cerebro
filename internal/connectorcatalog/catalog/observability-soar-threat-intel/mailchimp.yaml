entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: username
            label: Basic-auth username
            reference_only: true
            required: true
          - key: password
            label: Mailchimp API key
            reference_only: true
            required: true
            secret: true
        model: basic
        requires_references: true
        token_header: Authorization
        token_scheme: Basic
      categories:
        - identity
        - communications
      config_fields:
        - help: Data-center suffix from the API key, such as us19.
          key: dc
          label: Mailchimp data center
          required: true
        - help: Audience list identifier used when collecting the members family.
          key: list_id
          label: Audience list ID
          required: false
      description: Collects lists, members, and audit events from Mailchimp and projects them into the Cerebro graph as groups, users, and audit events for alert, incident, service health, and response context.
      display_name: Mailchimp
      id: builtin-mailchimp
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - lists
              high_value: true
              id: lists
              support: partial
              title: Lists
              type: entity_family
          event:
            kind: mailchimp.lists
            required_payload_fields:
              - id
            schema_ref: mailchimp/lists/v1
            urn_kind: mailchimp_lists
          id: lists
          id_field: id
          label: Lists
          method: GET
          name_field: name
          pagination:
            inject_first_page: true
            limit_param: count
            offset_param: offset
            page_size: 100
            type: offset
          path: /lists
          projection:
            fields:
              description: permission_reminder
              group_email: campaign_defaults.from_email
              group_id: id
              group_name: name
              source_event_id: id
            template: identity_group
          record_selector: $.lists[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - members
              high_value: true
              id: members
              support: partial
              title: Members
              type: entity_family
          event:
            kind: mailchimp.members
            required_payload_fields:
              - email_address
            schema_ref: mailchimp/members/v1
            urn_kind: mailchimp_members
          id: members
          id_field: id|email_address
          label: Members
          method: GET
          name_field: full_name|email_address
          pagination:
            inject_first_page: true
            limit_param: count
            offset_param: offset
            page_size: 100
            type: offset
          path: /lists/${config.list_id}/members
          projection:
            fields:
              display_name: full_name|email_address
              email: email_address
              source_event_id: id|email_address
              status: status
              user_id: id|email_address
            template: identity_user
          record_selector: $.members[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: mailchimp.audit_events
            required_payload_fields:
              - type
              - update_time
            schema_ref: mailchimp/audit_events/v1
            urn_kind: mailchimp_audit_events
          id: audit_events
          id_field: update_time+type+title+url+message+campaign_id+list_id|update_time+type+title+url+message|update_time+type+title+url|update_time+type+title+message|update_time+type+title
          label: Audit events
          method: GET
          pagination:
            inject_first_page: true
            limit_param: count
            offset_param: offset
            page_size: 100
            type: offset
          path: /activity-feed/chimp-chatter
          config:
            encode_urn_id: true
            identity_keys: [campaign_id, list_id, url, message]
          projection:
            fields:
              event_type: type
              id: _record_id
              source_event_id: _record_id
              title: title
            static_fields:
              actor_id: mailchimp_activity_feed
            template: audit_event
          record_selector: $.chimp_chatter[*]
          updated_at_field: update_time
      schema_version: cerebro.integration/v1
      source_id: mailchimp
      tenant_id: builtin_catalog
      transport:
        base_url: https://${config.dc}.api.mailchimp.com/3.0
        verification:
          expect_status:
            - 200
          method: GET
          path: /ping
