entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - observability
        - security
      description: Collects projects, errors, and audit events from Bugsnag and projects them into the Cerebro graph as assets, findings, and audit events for alert, incident, service health, and response context.
      display_name: Bugsnag
      id: builtin-bugsnag
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - projects
              high_value: true
              id: projects
              support: partial
              title: Projects
              type: entity_family
          event:
            kind: bugsnag.projects
            required_payload_fields:
              - id
            schema_ref: bugsnag/projects/v1
            urn_kind: bugsnag_projects
          id: projects
          id_field: id
          label: Projects
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /projects
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - errors
              high_value: true
              id: errors
              support: partial
              title: Errors
              type: remediation_state
          event:
            kind: bugsnag.errors
            required_payload_fields:
              - id
            schema_ref: bugsnag/errors/v1
            urn_kind: bugsnag_errors
          id: errors
          id_field: id
          label: Errors
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /errors
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: finding
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: bugsnag.audit_events
            required_payload_fields:
              - id
            schema_ref: bugsnag/audit_events/v1
            urn_kind: bugsnag_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /audit-events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: bugsnag
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.bugsnag.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /health
