entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-bugsnag
    tenant_id: builtin_catalog
    source_id: bugsnag
    display_name: Bugsnag
    description: "Collects projects, errors, and audit events from Bugsnag and projects them into the Cerebro graph as assets, findings, and audit events for alert, incident, service health, and response context."
    categories:
    - observability
    - security
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.bugsnag.com
      verification:
        method: GET
        path: "/health"
        expect_status:
        - 200
    resource_families:
    - id: projects
      label: Projects
      path: "/projects"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: bugsnag.projects
        schema_ref: bugsnag/projects/v1
      projection:
        template: asset
      coverage:
      - id: projects
        type: entity_family
        title: Projects
        families:
        - projects
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: errors
      label: Errors
      path: "/errors"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: bugsnag.errors
        schema_ref: bugsnag/errors/v1
      projection:
        template: finding
      coverage:
      - id: errors
        type: remediation_state
        title: Errors
        families:
        - errors
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit-events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: bugsnag.audit_events
        schema_ref: bugsnag/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
