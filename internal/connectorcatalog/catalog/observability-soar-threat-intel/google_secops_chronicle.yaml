entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-google_secops_chronicle
    tenant_id: builtin_catalog
    source_id: google_secops_chronicle
    display_name: Google SecOps/Chronicle
    description: "Collects audit events, detections, and assets from Google SecOps/Chronicle and projects them into the Cerebro graph as audit events, findings, and assets for alert, incident, service health, and response context."
    categories:
    - siem
    - security
    auth:
      model: jwt
      credential_fields:
      - key: private_key
        secret: true
        reference_only: true
    transport:
      base_url: https://backstory.googleapis.com
      verification:
        method: GET
        path: "/v2/detect/rules"
        expect_status:
        - 200
    resource_families:
    - id: audit_events
      label: Audit events
      path: "/v1/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: google_secops_chronicle.audit_events
        schema_ref: google_secops_chronicle/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: findings
      label: Detections
      path: "/v1/detections"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: google_secops_chronicle.findings
        schema_ref: google_secops_chronicle/findings/v1
      projection:
        template: finding
      coverage:
      - id: findings
        type: remediation_state
        title: Detections
        families:
        - findings
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: assets
      label: Assets
      path: "/v1/assets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: google_secops_chronicle.assets
        schema_ref: google_secops_chronicle/assets/v1
      projection:
        template: asset
      coverage:
      - id: assets
        type: entity_family
        title: Assets
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
