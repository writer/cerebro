entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-recorded_future
    tenant_id: builtin_catalog
    source_id: recorded_future
    display_name: Recorded Future
    description: Recorded Future connector definition catalog entry for high-value security and operations resources.
    categories:
    - security
    - threat_intel
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://api.recordedfuture.com
      verification:
        method: GET
        path: "/v2/intelligence"
        expect_status:
        - 200
    resource_families:
    - id: assets
      label: Assets
      path: "/v1/assets"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: recorded_future.assets
        schema_ref: recorded_future/assets/v1
      projection:
        template: asset
      coverage:
      - id: assets
        type: entity_family
        title: Assets
        families:
        - assets
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: findings
      label: Findings
      path: "/v1/findings"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: recorded_future.findings
        schema_ref: recorded_future/findings/v1
      projection:
        template: finding
      coverage:
      - id: findings
        type: remediation_state
        title: Findings
        families:
        - findings
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: vulnerabilities
      label: Vulnerabilities
      path: "/v1/vulnerabilities"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: recorded_future.vulnerabilities
        schema_ref: recorded_future/vulnerabilities/v1
      projection:
        template: vulnerability
      coverage:
      - id: vulnerabilities
        type: remediation_state
        title: Vulnerabilities
        families:
        - vulnerabilities
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
