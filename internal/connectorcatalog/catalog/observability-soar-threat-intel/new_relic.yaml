entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - observability
      description: Collects New Relic monitored entities, AI issues, and NrAuditEvent records through NerdGraph for asset inventory, finding review, and audit context.
      display_name: New Relic
      id: builtin-new_relic
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - assets
              high_value: true
              id: assets
              support: supported
              title: Monitored entities
              type: entity_family
          event:
            kind: new_relic.assets
            required_payload_fields:
              - guid
            schema_ref: new_relic/assets/v1
            urn_kind: runtime_new_relic_entity
          id: assets
          id_field: guid
          label: Monitored entities
          method: POST
          pagination:
            cursor_json_path: $.data.actor.entitySearch.results.nextCursor
            cursor_param: cursor
            page_size: 100
            type: cursor
          path: /graphql
          projection:
            fields:
              resource_id: guid
              resource_type: entityType|type|domain
              resource_urn: resource_urn
            template: asset
          record_selector: $.data.actor.entitySearch.results.entities[*]
        - coverage:
            - control_domains:
                - remediation
                - security_operations
              evidence_types:
                - remediation_state
              families:
                - findings
              high_value: true
              id: findings
              support: supported
              title: AI issues
              type: remediation_state
          event:
            kind: new_relic.findings
            required_payload_fields:
              - issueId
            schema_ref: new_relic/findings/v1
            urn_kind: finding
          id: findings
          id_field: issueId
          label: AI issues
          method: POST
          pagination:
            cursor_json_path: $.data.actor.account.aiIssues.issues.nextCursor
            cursor_param: cursor
            page_size: 100
            type: cursor
          path: /graphql
          projection:
            fields:
              description: description|summary
              finding_id: issueId
              severity: priority|severity
              status: status|state
            template: finding
          record_selector: $.data.actor.account.aiIssues.issues.issues[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: supported
              title: Audit events
              type: audit_event
          event:
            kind: new_relic.audit_events
            required_payload_fields:
              - actionIdentifier
            schema_ref: new_relic/audit_events/v1
            urn_kind: new_relic_audit_events
          id: audit_events
          id_field: actionIdentifier
          label: Audit events
          method: POST
          path: /graphql
          projection:
            fields:
              actor_email: actorEmail|userEmail|email
              actor_id: actorId|userId|user
              event_type: actionIdentifier|action|category|eventType
              id: eventId|id|uuid|actionIdentifier
            template: audit_event
          record_selector: $.data.actor.account.nrql.results[*]
      schema_version: cerebro.integration/v1
      source_id: new_relic
      tenant_id: builtin_catalog
      transport:
        base_url: https://api.newrelic.com
        verification:
          expect_status:
            - 200
          method: POST
          path: /graphql
