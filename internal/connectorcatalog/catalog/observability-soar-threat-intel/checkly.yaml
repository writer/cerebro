entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: token
            label: Bearer token
            reference_only: true
            required: true
            secret: true
        model: bearer_token
        requires_references: true
      categories:
        - saas
        - observability_soar_threat_intel
      config_fields:
        - help: Tenant or regional API base URL.
          key: base_url
          label: API base URL
          required: true
      description: Collects alerts, incidents, monitors, dashboards, and audit events from Checkly and projects them into the Cerebro graph as alerts, findings, assets, and audit events for alert, incident, service health, and response context.
      display_name: Checkly
      id: builtin-checkly
      ingest:
        mode: pull
      resource_families:
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - security_monitoring
              families:
                - alerts
              high_value: true
              id: alerts
              support: partial
              title: Alerts
              type: alert_state
          default_enabled: true
          event:
            kind: checkly.alerts
            required_payload_fields:
              - id
            schema_ref: checkly/alerts/v1
            urn_kind: checkly_alerts
          id: alerts
          id_field: id
          label: Alerts
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/alerts
          projection:
            fields:
              alert_id: id
              alert_name: name
              alert_severity: severity
              alert_status: status
            template: alert
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - incident_response
              evidence_types:
                - finding_snapshot
              families:
                - incidents
              high_value: true
              id: incidents
              support: partial
              title: Incidents
              type: finding
          default_enabled: true
          event:
            kind: checkly.incidents
            required_payload_fields:
              - id
            schema_ref: checkly/incidents/v1
            urn_kind: checkly_incidents
          id: incidents
          id_field: id
          label: Incidents
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/incidents
          projection:
            fields:
              finding_id: id
              resource_id: resource_id
              resource_type: resource_type
              severity: severity
              status: status
              title: title
            template: finding
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - monitors
              high_value: true
              id: monitors
              support: partial
              title: Monitors
              type: entity_family
          default_enabled: true
          event:
            kind: checkly.monitors
            required_payload_fields:
              - id
            schema_ref: checkly/monitors/v1
            urn_kind: checkly_monitors
          id: monitors
          id_field: id
          label: Monitors
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/monitors
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: monitor
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - dashboards
              high_value: true
              id: dashboards
              support: partial
              title: Dashboards
              type: entity_family
          default_enabled: true
          event:
            kind: checkly.dashboards
            required_payload_fields:
              - id
            schema_ref: checkly/dashboards/v1
            urn_kind: checkly_dashboards
          id: dashboards
          id_field: id
          label: Dashboards
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/dashboards
          projection:
            fields:
              id: id
              name: name
              resource_id: id
              resource_name: name
              resource_type: dashboard
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          default_enabled: true
          event:
            kind: checkly.audit_events
            required_payload_fields:
              - id
            schema_ref: checkly/audit_events/v1
            urn_kind: checkly_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          name_field: name
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /v1/audit_events
          projection:
            fields:
              actor_email: actor_email
              actor_id: actor_id
              event_type: event_type
              id: id
              resource_id: resource_id
              resource_type: resource_type
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: checkly
      tenant_id: builtin_catalog
      transport:
        base_url: ${config.base_url}
        verification:
          expect_status:
            - 200
          method: GET
          path: /v1/me
