entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - threat_intel
        - security
      description: Collects infostealers, domains, and audit events from Hudson Rock and projects them into the Cerebro graph as findings, assets, and audit events for alert, incident, service health, and response context.
      display_name: Hudson Rock
      id: builtin-hudsonrock
      resource_families:
        - coverage:
            - control_domains:
                - remediation
              evidence_types:
                - remediation_state
              families:
                - infostealers
              high_value: true
              id: infostealers
              support: partial
              title: Infostealers
              type: remediation_state
          event:
            kind: hudsonrock.infostealers
            required_payload_fields:
              - id
            schema_ref: hudsonrock/infostealers/v1
            urn_kind: hudsonrock_infostealers
          id: infostealers
          id_field: id
          label: Infostealers
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /infostealers
          projection:
            fields:
              description: description|summary
              finding_id: id
              severity: severity|risk|priority
              status: status|state
            template: finding
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - domains
              high_value: true
              id: domains
              support: partial
              title: Domains
              type: entity_family
          event:
            kind: hudsonrock.domains
            required_payload_fields:
              - id
            schema_ref: hudsonrock/domains/v1
            urn_kind: hudsonrock_domains
          id: domains
          id_field: id
          label: Domains
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /domains
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $.data[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: hudsonrock.audit_events
            required_payload_fields:
              - id
            schema_ref: hudsonrock/audit_events/v1
            urn_kind: hudsonrock_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /audit-events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: hudsonrock
      tenant_id: builtin_catalog
      transport:
        base_url: https://cavalier.hudsonrock.com/api
        verification:
          expect_status:
            - 200
          method: GET
          path: /health
