entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-hudsonrock
    tenant_id: builtin_catalog
    source_id: hudsonrock
    display_name: Hudson Rock
    description: Hudson Rock connector definition catalog entry for high-value security and operations resources.
    categories:
    - threat_intel
    - security
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://cavalier.hudsonrock.com/api
      verification:
        method: GET
        path: "/health"
        expect_status:
        - 200
    resource_families:
    - id: infostealers
      label: Infostealers
      path: "/infostealers"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: hudsonrock.infostealers
        schema_ref: hudsonrock/infostealers/v1
      projection:
        template: finding
      coverage:
      - id: infostealers
        type: remediation_state
        title: Infostealers
        families:
        - infostealers
        support: partial
        high_value: true
        evidence_types:
        - remediation_state
        control_domains:
        - remediation
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: domains
      label: Domains
      path: "/domains"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: hudsonrock.domains
        schema_ref: hudsonrock/domains/v1
      projection:
        template: asset
      coverage:
      - id: domains
        type: entity_family
        title: Domains
        families:
        - domains
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit-events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: hudsonrock.audit_events
        schema_ref: hudsonrock/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
