entries:
  - classifier_output: supported
    definition:
      auth:
        credential_fields:
          - key: api_key
            reference_only: true
            secret: true
        model: api_key
      categories:
        - observability
        - email
      description: Collects servers, domains, and audit events from Postmark and projects them into the Cerebro graph as assets and audit events for alert, incident, service health, and response context.
      display_name: Postmark
      id: builtin-postmark
      resource_families:
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - servers
              high_value: true
              id: servers
              support: partial
              title: Servers
              type: entity_family
          event:
            kind: postmark.servers
            required_payload_fields:
              - id
            schema_ref: postmark/servers/v1
            urn_kind: postmark_servers
          id: servers
          id_field: id
          label: Servers
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /servers
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $[*]
        - coverage:
            - control_domains:
                - asset_inventory
              evidence_types:
                - source_snapshot
              families:
                - domains
              high_value: true
              id: domains
              support: partial
              title: Domains
              type: entity_family
          event:
            kind: postmark.domains
            required_payload_fields:
              - id
            schema_ref: postmark/domains/v1
            urn_kind: postmark_domains
          id: domains
          id_field: id
          label: Domains
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /domains
          projection:
            fields:
              resource_id: id
              resource_type: resource_type|type|kind
              resource_urn: resource_urn|urn|metadata.resource_urn
            template: asset
          record_selector: $[*]
        - coverage:
            - control_domains:
                - logging_monitoring
              evidence_types:
                - logging_configuration
              families:
                - audit_events
              high_value: true
              id: audit_events
              support: partial
              title: Audit events
              type: audit_event
          event:
            kind: postmark.audit_events
            required_payload_fields:
              - id
            schema_ref: postmark/audit_events/v1
            urn_kind: postmark_audit_events
          id: audit_events
          id_field: id
          label: Audit events
          method: GET
          pagination:
            cursor_json_path: $.next_cursor
            cursor_param: cursor
            page_size: 100
            page_size_param: limit
            type: cursor
          path: /audit/events
          projection:
            fields:
              actor_email: actor_email|actor.email|email|user.email
              actor_id: actor_id|actor.id|actorId|user_id|user.id
              event_type: event_type|event_name|action|type
              id: id
            template: audit_event
          record_selector: $.data[*]
      schema_version: cerebro.integration/v1
      source_id: postmark
      tenant_id: builtin_catalog
      transport:
        base_url: https://postmark-api.com
        verification:
          expect_status:
            - 200
          method: GET
          path: /servers
