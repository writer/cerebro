entries:
- classifier_output: supported
  definition:
    schema_version: cerebro.integration/v1
    id: builtin-postmark
    tenant_id: builtin_catalog
    source_id: postmark
    display_name: Postmark
    description: "Collects servers, domains, and audit events from Postmark and projects them into the Cerebro graph as assets and audit events for alert, incident, service health, and response context."
    categories:
    - observability
    - email
    auth:
      model: api_key
      credential_fields:
      - key: api_key
        secret: true
        reference_only: true
    transport:
      base_url: https://postmark-api.com
      verification:
        method: GET
        path: "/servers"
        expect_status:
        - 200
    resource_families:
    - id: servers
      label: Servers
      path: "/servers"
      method: GET
      record_selector: "$[*]"
      id_field: id
      event:
        kind: postmark.servers
        schema_ref: postmark/servers/v1
      projection:
        template: asset
      coverage:
      - id: servers
        type: entity_family
        title: Servers
        families:
        - servers
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: domains
      label: Domains
      path: "/domains"
      method: GET
      record_selector: "$[*]"
      id_field: id
      event:
        kind: postmark.domains
        schema_ref: postmark/domains/v1
      projection:
        template: asset
      coverage:
      - id: domains
        type: entity_family
        title: Domains
        families:
        - domains
        support: partial
        high_value: true
        evidence_types:
        - source_snapshot
        control_domains:
        - asset_inventory
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
    - id: audit_events
      label: Audit events
      path: "/audit/events"
      method: GET
      record_selector: "$.data[*]"
      id_field: id
      event:
        kind: postmark.audit_events
        schema_ref: postmark/audit_events/v1
      projection:
        template: audit_event
      coverage:
      - id: audit_events
        type: audit_event
        title: Audit events
        families:
        - audit_events
        support: partial
        high_value: true
        evidence_types:
        - logging_configuration
        control_domains:
        - logging_monitoring
      pagination:
        type: cursor
        cursor_param: cursor
        cursor_json_path: "$.next_cursor"
        page_size_param: limit
        page_size: 100
