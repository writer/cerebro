                control_id: IR-4
              - framework_name: NIST 800-53 r5
                control_id: IR-6
          - id: CC7.5
            title: Security findings are remediated or risk-accepted
            objective: Security findings and vulnerabilities are remediated within defined expectations or covered by approved exceptions.
            intent: Keep unresolved security issues visible, owned, prioritized, and bounded by risk acceptance.
            applicability: [production, vulnerability_management, security_operations]
            assessment_methods: [examine, test]
            implementation_guidance:
              - Track remediation owner, due date, status, severity, and exception state for security findings.
              - Require risk acceptance and compensating controls when remediation misses the defined SLA.
            audit_procedure:
              - Review open finding age, remediation SLA status, overdue exceptions, and closure evidence.
              - Sample critical or high findings and verify remediation or approved risk acceptance.
            failure_modes:
              - Critical or high finding remains open past SLA without approved exception or compensating control.
              - Remediation evidence does not prove closure or cannot be tied to the source finding.
            remediation_guidance:
              - Patch, mitigate, isolate, or accept risk with approval, then refresh finding and evidence state.
            exception_guidance: Exceptions require risk acceptance, compensating controls, owner approval, and expiration.
            evidence_expectations:
              - id: finding-remediation-state
                title: Finding remediation and exception state
                type: remediation_state
                description: Open finding age, SLA status, remediation owner, closure evidence, and exception approvals.
                required: true
                assessment_methods: [examine, test]
                freshness_sla: 14d
                accepted_from: [github, aws, grc, ticketing_system, source_snapshot, manual_attestation]
            freshness_sla: 14d
            owner_domain: security_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [remediation, vulnerability, risk_acceptance]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.8
              - framework_name: NIST 800-53 r5
                control_id: RA-5
      - id: CC8
        name: Change Management
        controls:
          - id: CC8.1
            title: Production changes are reviewed, tested, and traceable
            objective: Production changes are approved, tested, reviewed, deployed through authorized paths, and traceable from request through release.
            intent: Reduce production risk from unauthorized, untested, or unreviewed changes.
            applicability: [production, software_delivery, change_management]
            assessment_methods: [examine, test]
            implementation_guidance:
              - Require code review, automated checks, deployment traceability, and approval for production changes.
              - Preserve change request, pull request, build, deployment, and rollback evidence.
            audit_procedure:
              - Sample deployed changes and verify approval, testing, reviewer, deployment, and rollback evidence.
              - Reconcile pull request and deployment evidence against current production release history.
            failure_modes:
              - Production deployment has no approval, missing test results, or cannot be traced to a reviewed change.
              - Emergency change evidence is missing retrospective review or owner approval.
            remediation_guidance:
              - Restore change evidence, remediate unauthorized changes, and update enforcement in the deployment path.
            exception_guidance: Emergency changes require retrospective review, owner approval, and linked incident or risk rationale.
            evidence_expectations:
              - id: production-change-trace
                title: Production change trace
                type: change_management
                description: Change request, reviewer approval, test result, deployment record, and rollback evidence.
                required: true
                assessment_methods: [examine, test]
                freshness_sla: 30d
                accepted_from: [github, source_control, ci_cd_system, ticketing_system, manual_attestation]
            freshness_sla: 30d
            owner_domain: engineering
            automatable: true
            manual_evidence_allowed: true
            tags: [change_management, secure_delivery]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.32
              - framework_name: NIST 800-53 r5
                control_id: CM-3
      - id: CC9
        name: Risk Mitigation
        controls:
          - id: CC9.1
            title: Business disruptions and risk events are mitigated
            objective: Risk mitigation activities reduce the likelihood or impact of business disruptions, security events, and operational failures.
            intent: Tie risk treatment to resilience, continuity, and security operating evidence.
            applicability: [risk_management, resilience, security_operations]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Document mitigation plans for material security, availability, vendor, and operational risks.
              - Track mitigation owners, due dates, dependencies, and residual risk decisions.
            audit_procedure:
              - Inspect risk mitigation plans, action owners, due dates, and residual risk approvals.
              - Sample material risks and verify mitigation progress or accepted risk.
            failure_modes:
              - Material risk lacks mitigation plan, owner, or residual risk decision.
              - Mitigation is overdue without escalation or accepted risk.
            remediation_guidance:
              - Define mitigation plan, assign owner, update due date, and refresh risk evidence.
            exception_guidance: Mitigation exceptions require risk owner approval and expiration.
            evidence_expectations:
              - id: risk-mitigation-plan
                title: Risk mitigation plan evidence
                type: risk_mitigation_plan
                description: Risk mitigation activities reduce the likelihood or impact of business disruptions, security events, and operational failures.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 180d
                accepted_from: [risk_register, incident_management, continuity_plan, manual_attestation]
            freshness_sla: 180d
            owner_domain: risk
            automatable: true
            manual_evidence_allowed: true
            tags: [risk_management, resilience, mitigation]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: 6.1.2
              - framework_name: NIST 800-53 r5
                control_id: RA-3
          - id: CC9.2
            title: Vendor and business partner risks are managed
            objective: Third-party and business partner risks are assessed, monitored, and mitigated throughout the vendor lifecycle.
            intent: Keep outsourced services and supplier dependencies within the organization's control and risk expectations.
            applicability: [vendor_risk, third_party_risk, governance]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Assess vendors before onboarding and review critical vendors on a defined cadence.
              - Track vendor owners, inherent risk, due diligence, findings, exceptions, and contract obligations.
            audit_procedure:
              - Inspect vendor inventory, risk tiers, due diligence, reviews, and open vendor findings.
              - Sample critical vendors and verify review currency, owner, and remediation evidence.
            failure_modes:
              - Critical vendor lacks current review, owner, or risk tier.
              - Vendor finding is overdue without accepted risk or remediation plan.
            remediation_guidance:
              - Complete vendor review, assign owner, remediate findings, or document risk acceptance.
            exception_guidance: Vendor-risk exceptions require business owner approval, compensating controls, and renewal date.
            evidence_expectations:
              - id: third-party-risk-management
                title: Third-party risk management evidence
                type: third_party_risk
                description: Third-party and business partner risks are assessed, monitored, and mitigated throughout the vendor lifecycle.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 180d
                accepted_from: [grc, vendor_management, risk_register, manual_attestation]
            freshness_sla: 180d
            owner_domain: vendor_risk
            automatable: true
            manual_evidence_allowed: true
            tags: [vendor_risk, third_party, risk_management]
            maps_to:
