                control_id: AU-6
              - framework_name: NIST 800-53 r5
                control_id: SI-4
              - framework_name: NIST 800-53 r5
                control_id: RA-5
          - id: CC7.1
            title: Security vulnerabilities are identified and prioritized
            objective: Security vulnerabilities affecting production assets are identified, triaged, and prioritized using current scanner and provider evidence.
            intent: Ensure exploitable weaknesses are visible quickly enough for risk-based remediation.
            applicability: [production, vulnerability_management]
            assessment_methods: [examine, test]
            implementation_guidance:
              - Run vulnerability and cloud security posture sources on a defined cadence for production assets.
              - Prioritize vulnerabilities by severity, exploitability, affected asset criticality, and exposure.
            audit_procedure:
              - Review current vulnerability inventory, scanner/source coverage, severity distribution, and triage status.
              - Sample critical and high vulnerabilities and verify source evidence, owner, and remediation path.
            failure_modes:
              - Production vulnerability evidence is stale, incomplete, or missing for high-value asset families.
              - Critical or high vulnerabilities are not triaged to an accountable owner.
            remediation_guidance:
              - Restore scanner/source coverage, triage unowned findings, and refresh vulnerability evidence.
            exception_guidance: Vulnerability triage exceptions require documented risk acceptance, owner approval, and expiration.
            evidence_expectations:
              - id: vulnerability-inventory-state
                title: Vulnerability inventory and triage state
                type: vulnerability_management
                description: Current vulnerability findings, severity, affected assets, owner, and triage posture.
                required: true
                assessment_methods: [examine, test]
                freshness_sla: 14d
                accepted_from: [github, aws, trivy, vulnerability_scanner, source_snapshot, manual_attestation]
            freshness_sla: 14d
            owner_domain: security_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [vulnerability, triage, security_operations]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.8
              - framework_name: NIST 800-53 r5
                control_id: RA-5
          - id: CC7.2
            title: Security events are logged and retained
            objective: Security-significant identity, cloud, source-control, and workload events are collected, protected, and retained.
            intent: Preserve reliable evidence for detection, investigation, control testing, and incident response.
            applicability: [production, security_monitoring, logging]
            assessment_methods: [examine, test]
            implementation_guidance:
              - Collect administrative, authentication, configuration, network, and workload events in protected logging destinations.
              - Configure retention, integrity protection, alert routing, and accountable ownership for security logs.
            audit_procedure:
              - Verify configured log sources, retention settings, destinations, and recent ingestion health.
              - Sample a security-significant event and trace it from source event to retained evidence.
            failure_modes:
              - Security logs are disabled, mutable, outside retention requirements, or missing for high-value source families.
              - Logging evidence cannot be reconciled to current production source coverage.
            remediation_guidance:
              - Enable required log sources, restore retention, protect log storage, and document review ownership.
            exception_guidance: Logging exceptions require documented compensating monitoring, approval, and restoration date.
            evidence_expectations:
              - id: security-log-retention
                title: Security log retention and source coverage
                type: logging_configuration
                description: Current security log sources, retention settings, alert routing, and ingestion evidence.
                required: true
                assessment_methods: [examine, test]
                freshness_sla: 30d
                accepted_from: [aws, okta, github, siem, cloud_logging, source_snapshot, manual_attestation]
            freshness_sla: 30d
            owner_domain: security_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [logging, retention, detection]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.15
              - framework_name: NIST 800-53 r5
                control_id: SI-4
          - id: CC7.3
            title: Security events are monitored and investigated
            objective: Security events and alerts are reviewed, escalated, investigated, and tracked to outcome.
            intent: Convert collected security telemetry into timely detection and accountable response.
            applicability: [production, security_monitoring, security_operations]
            assessment_methods: [examine, interview, test]
            implementation_guidance:
              - Route high-value security events and provider findings to accountable detection and response workflows.
              - Track alert investigation, disposition, owner, and closure evidence.
            audit_procedure:
              - Inspect recent security findings, alert routing, investigation records, and closure evidence.
              - Sample high-severity events and verify triage owner, timeline, and outcome.
            failure_modes:
              - Security findings are collected but not reviewed, assigned, or investigated.
              - Investigation evidence is missing, stale, or disconnected from source events.
            remediation_guidance:
              - Restore alert routing, assign owners, complete investigation records, and refresh evidence.
            exception_guidance: Monitoring exceptions require compensating detective controls, owner approval, and expiration.
            evidence_expectations:
              - id: security-monitoring-state
                title: Security monitoring and investigation state
                type: security_monitoring
                description: Current security events, findings, alert routing, investigation status, and closure evidence.
                required: true
                assessment_methods: [examine, interview, test]
                freshness_sla: 30d
                accepted_from: [aws, okta, github, siem, case_management, manual_attestation]
            freshness_sla: 30d
            owner_domain: security_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [monitoring, investigation, detection]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.15
              - framework_name: NIST 800-53 r5
                control_id: SI-4
          - id: CC7.4
            title: Incidents and anomalies are assessed and responded to
            objective: Security incidents, anomalies, and confirmed events are assessed, escalated, contained, and documented through closure.
            intent: Ensure detection signals become timely response and retained incident evidence.
            applicability: [incident_response, security_operations, production]
            assessment_methods: [examine, interview, test]
            implementation_guidance:
              - Define incident severity, escalation, containment, communication, and closure expectations.
              - Track security incidents and anomalies from detection through disposition and lessons learned.
            audit_procedure:
              - Inspect recent incident records, alert evidence, escalation timeline, containment, and closure notes.
              - Sample high-severity incidents and verify response followed procedure or exception approval.
            failure_modes:
              - Incident lacks severity, owner, timeline, containment, or closure evidence.
              - Anomaly was detected but not assessed or escalated according to procedure.
            remediation_guidance:
              - Complete incident record, assign owner, document containment and closure, and update response evidence.
            exception_guidance: Incident response exceptions require incident commander approval and post-incident review.
            evidence_expectations:
              - id: incident-response-assessment
                title: Incident assessment and response evidence
                type: incident_response
                description: Security incidents, anomalies, and confirmed events are assessed, escalated, contained, and documented through closure.
                required: true
                assessment_methods: [examine, interview, test]
                freshness_sla: 30d
                accepted_from: [siem, case_management, incident_management, aws, github, manual_attestation]
            freshness_sla: 30d
            owner_domain: security_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [incident_response, investigation, containment]
            maps_to:
