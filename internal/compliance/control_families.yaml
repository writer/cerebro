version: "2026-06-17"
frameworks:
  - name: SOC 2
    families:
      - id: A1
        name: Availability
        controls:
          - id: A1.1
            title: Availability commitments are defined and monitored
            objective: Availability commitments, service targets, and operating responsibilities are documented, monitored, and reviewed for production services.
            intent: Make uptime and service-resilience obligations testable instead of implicit.
            applicability: [production, availability, service_operations]
            assessment_methods: [examine, interview, test]
            implementation_guidance:
              - Define availability objectives, ownership, measurement windows, alert thresholds, and reporting cadence for production services.
              - Review service health, error-budget, uptime, and incident trends against stated availability commitments.
            audit_procedure:
              - Inspect service commitments, monitoring dashboards, alert routing, and recent availability reviews.
              - Sample production services and verify availability evidence is current, complete, and owner-reviewed.
            failure_modes:
              - Availability objective or owner is missing for an in-scope production service.
              - Monitoring evidence does not cover the committed service boundary or reporting period.
            remediation_guidance:
              - Define the missing commitment or monitoring coverage, assign an owner, and refresh availability evidence.
            exception_guidance: Availability exceptions require owner approval, customer-impact analysis, compensating monitoring, and expiration.
            evidence_expectations:
              - id: availability-commitment-monitoring
                title: Availability commitments and monitoring posture
                type: availability_monitoring
                description: Availability commitments, service targets, and operating responsibilities are documented, monitored, and reviewed for production services.
                required: true
                assessment_methods: [examine, interview, test]
                freshness_sla: 30d
                accepted_from: [monitoring_system, incident_management, service_catalog, manual_attestation]
            freshness_sla: 30d
            owner_domain: service_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [availability, monitoring, service_commitment]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.16
              - framework_name: NIST 800-53 r5
                control_id: CP-2
          - id: A1.2
            title: Capacity and performance are planned and reviewed
            objective: Production capacity, performance, and scaling risks are measured and reviewed before they affect availability commitments.
            intent: Reduce outage risk from avoidable resource exhaustion, saturation, or unplanned growth.
            applicability: [production, availability, capacity_management]
            assessment_methods: [examine, test]
            implementation_guidance:
              - Track capacity, saturation, latency, queue depth, and scaling headroom for production services.
              - Review forecast, threshold, and scaling evidence on a defined cadence.
            audit_procedure:
              - Inspect capacity dashboards, forecast assumptions, and owner review evidence.
              - Sample high-traffic services and verify capacity signals are within approved thresholds or have remediation plans.
            failure_modes:
              - Production service has no capacity owner, threshold, or current capacity evidence.
              - Capacity risk is known but not tracked to remediation or risk acceptance.
            remediation_guidance:
              - Add capacity monitoring, tune scaling limits, document owner review, and refresh evidence after changes.
            exception_guidance: Capacity exceptions require documented impact analysis, owner approval, and an expiration or review date.
            evidence_expectations:
              - id: capacity-performance-review
                title: Capacity and performance review evidence
                type: capacity_management
                description: Production capacity, performance, and scaling risks are measured and reviewed before they affect availability commitments.
                required: true
                assessment_methods: [examine, test]
                freshness_sla: 30d
                accepted_from: [monitoring_system, cloud_metrics, capacity_plan, manual_attestation]
            freshness_sla: 30d
            owner_domain: service_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [availability, capacity, performance]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.6
              - framework_name: NIST 800-53 r5
                control_id: CP-2
          - id: A1.3
            title: Recovery and continuity procedures are tested
            objective: Backup, recovery, continuity, and failover procedures are documented, tested, and remediated when gaps are found.
            intent: Prove the organization can restore critical services within defined recovery expectations.
            applicability: [production, availability, resilience]
            assessment_methods: [examine, interview, test]
            implementation_guidance:
              - Define recovery objectives, backup coverage, restore procedures, and continuity roles for critical services.
              - Run periodic restore, failover, or tabletop tests and track corrective actions to closure.
            audit_procedure:
              - Inspect the latest recovery test plan, participants, results, exceptions, and remediation outcomes.
              - Sample critical services and verify backup coverage and recovery evidence are current.
            failure_modes:
              - Critical service lacks tested recovery evidence for the review period.
              - Recovery test issues remain open without owner, due date, or risk acceptance.
            remediation_guidance:
              - Run or repeat the recovery test, remediate failed steps, and attach evidence of successful recovery.
            exception_guidance: Recovery-test exceptions require executive or service-owner approval, compensating continuity procedures, and a retest date.
            evidence_expectations:
              - id: recovery-continuity-test
                title: Recovery and continuity test evidence
                type: recovery_test
                description: Backup, recovery, continuity, and failover procedures are documented, tested, and remediated when gaps are found.
                required: true
                assessment_methods: [examine, interview, test]
                freshness_sla: 180d
                accepted_from: [backup_system, incident_management, disaster_recovery_test, manual_attestation]
            freshness_sla: 180d
            owner_domain: service_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [availability, recovery, continuity]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.13
              - framework_name: NIST 800-53 r5
                control_id: CP-4
      - id: C1
        name: Confidentiality
        controls:
          - id: C1.1
            title: Confidential data is protected by encryption and access controls
            objective: Confidential data stores and secrets are protected with approved encryption, key management, and least-privilege access controls.
            intent: Reduce exposure of customer and company confidential information if storage, compute, or identity boundaries fail.
            applicability: [production, confidential_data, cloud]
            assessment_methods: [examine, test]
            implementation_guidance:
              - Encrypt confidential storage, backups, queues, and secrets with approved provider or customer-managed keys.
              - Limit administrative and data-plane access to confidential data stores and review access on a defined cadence.
            audit_procedure:
              - Inspect current encryption posture for confidential storage, key rotation, and secret management families.
              - Sample confidential data stores and verify access restrictions, encryption state, and evidence freshness.
            failure_modes:
              - Confidential data store or secret is unencrypted, publicly reachable, or missing an accountable owner.
              - Encryption evidence cannot be reconciled to the current confidential asset inventory.
            remediation_guidance:
              - Enable encryption, restrict access, rotate exposed secrets or keys, and refresh evidence after remediation.
            exception_guidance: Exceptions require documented risk acceptance, compensating monitoring, owner approval, and expiration.
            evidence_expectations:
              - id: confidential-data-protection
                title: Confidential data protection posture
                type: encryption_configuration
                description: Current encryption, key-management, and access posture for confidential data stores and secrets.
                required: true
                assessment_methods: [examine, test]
                freshness_sla: 30d
                accepted_from: [aws, azure, gcp, source_snapshot, manual_attestation]
            freshness_sla: 30d
            owner_domain: security_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [confidentiality, encryption, data_protection]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.24
          - id: C1.2
            title: Confidential information handling is governed through its lifecycle
            objective: Confidential information is classified, retained, transmitted, and disposed according to approved handling requirements.
            intent: Keep confidential data protections consistent from creation through retention and disposal.
            applicability: [production, confidential_data, data_lifecycle]
            assessment_methods: [examine, interview, test]
            implementation_guidance:
              - Maintain data classification, retention, transfer, and disposal procedures for confidential information.
              - Monitor storage, sharing, and retention evidence for in-scope confidential data stores.
            audit_procedure:
              - Inspect classification, retention, disposal, and transfer evidence for confidential data families.
              - Sample confidential data locations and verify handling requirements are enforced or exception-approved.
            failure_modes:
              - Confidential data lacks classification, retention, transfer, or disposal evidence.
              - Data handling exception is missing owner approval or expiration.
            remediation_guidance:
              - Classify the data, apply retention or disposal controls, restrict transfer, and refresh lifecycle evidence.
            exception_guidance: Lifecycle exceptions require data-owner approval, legal or compliance rationale when applicable, and expiration.
            evidence_expectations:
              - id: confidential-data-lifecycle
                title: Confidential data lifecycle control evidence
                type: data_lifecycle_control
                description: Confidential information is classified, retained, transmitted, and disposed according to approved handling requirements.
                required: true
                assessment_methods: [examine, interview, test]
                freshness_sla: 90d
                accepted_from: [data_inventory, dlp_system, storage_policy, manual_attestation]
            freshness_sla: 90d
            owner_domain: data_protection
            automatable: true
            manual_evidence_allowed: true
            tags: [confidentiality, data_lifecycle, retention]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.5.12
              - framework_name: "ISO 27001:2022"
                control_id: A.8.10
              - framework_name: NIST 800-53 r5
                control_id: MP-6
      - id: CC1
        name: Control Environment
        controls:
          - id: CC1.1
            title: Integrity and ethical values are established and enforced
            objective: Leadership expectations, acceptable behavior, and accountability mechanisms are documented and reinforced through policy and evidence.
            intent: Create a control environment where security and compliance obligations are owned and enforceable.
            applicability: [governance, workforce, compliance]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Maintain code-of-conduct, security policy, and escalation mechanisms with accountable owners.
              - Track acknowledgement, training, or exception evidence for in-scope workforce populations.
            audit_procedure:
              - Inspect policy approval, acknowledgement, training, and escalation evidence.
              - Interview control owners to verify enforcement and issue escalation practices.
            failure_modes:
              - Required policy or acknowledgement evidence is missing for the assessment period.
              - Policy exception or misconduct escalation lacks owner review or documented outcome.
            remediation_guidance:
              - Refresh policy approval, collect acknowledgements, resolve overdue training, and document escalation outcomes.
            exception_guidance: Governance exceptions require accountable executive approval and a defined remediation date.
            evidence_expectations:
              - id: integrity-values-policy
                title: Integrity and ethics governance evidence
                type: governance_policy
                description: Leadership expectations, acceptable behavior, and accountability mechanisms are documented and reinforced through policy and evidence.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 365d
                accepted_from: [policy_repository, training_system, hr_system, manual_attestation]
            freshness_sla: 365d
            owner_domain: governance
            automatable: true
            manual_evidence_allowed: true
            tags: [governance, ethics, control_environment]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.5.1
              - framework_name: NIST 800-53 r5
                control_id: PM-1
          - id: CC1.2
            title: Board and oversight responsibilities are defined
            objective: Governance bodies receive sufficient security, risk, and control information to oversee the system and management accountability.
            intent: Ensure independent oversight can challenge, prioritize, and monitor security-control operation.
            applicability: [governance, oversight, compliance]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Define oversight roles, reporting cadence, risk topics, and escalation paths for security and compliance matters.
              - Provide periodic control, incident, risk, and remediation reporting to the oversight body.
            audit_procedure:
              - Inspect oversight charters, meeting materials, risk reports, and action-item tracking.
              - Sample reported risks and verify management actions are tracked to outcome.
            failure_modes:
              - Oversight body did not receive security or control reporting during the review period.
              - Material risk or remediation item lacks documented oversight follow-up.
            remediation_guidance:
              - Prepare oversight reporting, assign action owners, and record review and follow-up decisions.
            exception_guidance: Oversight exceptions require documented rationale, executive owner approval, and next review date.
            evidence_expectations:
              - id: board-oversight-review
                title: Board or oversight review evidence
                type: oversight_review
                description: Governance bodies receive sufficient security, risk, and control information to oversee the system and management accountability.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 180d
                accepted_from: [board_packet, risk_committee_minutes, grc, manual_attestation]
            freshness_sla: 180d
            owner_domain: governance
            automatable: true
            manual_evidence_allowed: true
            tags: [governance, oversight, risk_management]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.5.4
              - framework_name: NIST 800-53 r5
                control_id: PM-9
          - id: CC1.3
            title: Organizational structure supports control ownership
            objective: Security and compliance responsibilities are assigned to roles with authority, accountability, and clear escalation paths.
            intent: Avoid control gaps caused by unclear ownership or fragmented responsibility.
            applicability: [governance, workforce, compliance]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Maintain role definitions, RACI matrices, and escalation paths for security-control families.
              - Review ownership changes when organization, system, or provider scope changes.
            audit_procedure:
              - Inspect control owner assignments, organizational charts, and escalation evidence.
              - Sample controls and verify each has an accountable owner with authority to remediate issues.
            failure_modes:
              - Control or source family has no accountable owner.
              - Owner lacks authority or escalation path for overdue remediation.
            remediation_guidance:
              - Assign an accountable owner, document authority, and update control inventory evidence.
            exception_guidance: Ownership exceptions require temporary delegated owner approval and expiration.
            evidence_expectations:
              - id: control-ownership-structure
                title: Control ownership and authority evidence
                type: role_responsibility_matrix
                description: Security and compliance responsibilities are assigned to roles with authority, accountability, and clear escalation paths.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 180d
                accepted_from: [org_chart, grc, policy_repository, manual_attestation]
            freshness_sla: 180d
            owner_domain: governance
            automatable: true
            manual_evidence_allowed: true
            tags: [governance, ownership, accountability]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.5.2
              - framework_name: NIST 800-53 r5
                control_id: PM-2
          - id: CC1.4
            title: Competence is maintained for control responsibilities
            objective: Personnel with security, engineering, and compliance responsibilities have appropriate competence, training, and support.
            intent: Reduce control failure caused by insufficient skill, staffing, or awareness.
            applicability: [workforce, governance, security_operations]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Define required training or competence expectations for control owners and privileged operators.
              - Track completion, role changes, and remediation for overdue or missing training.
            audit_procedure:
              - Inspect training assignments, completion reports, and role-based training requirements.
              - Sample control owners and privileged operators to verify required competence evidence.
            failure_modes:
              - Control owner or privileged operator lacks required training evidence.
              - Training exceptions are stale, unapproved, or missing remediation owner.
            remediation_guidance:
              - Assign and complete training, update role requirements, and refresh competence evidence.
            exception_guidance: Training exceptions require manager approval, compensating supervision, and due date.
            evidence_expectations:
              - id: control-competence-training
                title: Competence and training evidence
                type: training_competence
                description: Personnel with security, engineering, and compliance responsibilities have appropriate competence, training, and support.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 365d
                accepted_from: [training_system, hr_system, policy_repository, manual_attestation]
            freshness_sla: 365d
            owner_domain: governance
            automatable: true
            manual_evidence_allowed: true
            tags: [training, competence, workforce]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.6.3
              - framework_name: NIST 800-53 r5
                control_id: AT-2
          - id: CC1.5
            title: Accountability is enforced for control operation
            objective: Control owners are held accountable for operating controls, resolving deficiencies, and maintaining evidence.
            intent: Make control ownership actionable through assignments, due dates, escalation, and performance follow-up.
            applicability: [governance, compliance, remediation]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Track control deficiencies, owner assignments, due dates, and escalation outcomes.
              - Review overdue control gaps and repeat deficiencies with accountable leaders.
            audit_procedure:
              - Inspect deficiency trackers, owner assignments, escalation records, and closure evidence.
              - Sample overdue items and verify accountability actions or approved exceptions.
            failure_modes:
              - Control deficiency lacks owner, due date, or status.
              - Overdue remediation has no escalation or accepted risk record.
            remediation_guidance:
              - Assign owners, define due dates, escalate overdue items, and refresh closure evidence.
            exception_guidance: Accountability exceptions require executive owner approval and documented follow-up date.
            evidence_expectations:
              - id: control-owner-accountability
                title: Control owner accountability evidence
                type: accountability_tracking
                description: Control owners are held accountable for operating controls, resolving deficiencies, and maintaining evidence.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 90d
                accepted_from: [grc, ticketing_system, risk_register, manual_attestation]
            freshness_sla: 90d
            owner_domain: governance
            automatable: true
            manual_evidence_allowed: true
            tags: [governance, accountability, remediation]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.5.2
              - framework_name: NIST 800-53 r5
                control_id: CA-5
      - id: CC2
        name: Communication and Information
        controls:
          - id: CC2.1
            title: Relevant information is identified and used for control operation
            objective: Operational, security, and compliance information needed to operate controls is identified, captured, and routed to owners.
            intent: Ensure control operators have the information needed to detect, assess, and correct control gaps.
            applicability: [governance, security_operations, compliance]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Identify source systems, evidence owners, and routing paths for control-relevant information.
              - Review whether information feeds are complete, timely, and available to control owners.
            audit_procedure:
              - Inspect evidence-source inventories, routing rules, and owner review evidence.
              - Sample control families and verify relevant information reaches the assigned owner.
            failure_modes:
              - Control-relevant source or evidence feed is missing, stale, or unrouted.
              - Owner cannot demonstrate receipt or review of required control information.
            remediation_guidance:
              - Register missing sources, fix routing or sync, and refresh owner review evidence.
            exception_guidance: Information-flow exceptions require owner approval, compensating review, and expiration.
            evidence_expectations:
              - id: control-information-flow
                title: Control information flow evidence
                type: control_information_flow
                description: Operational, security, and compliance information needed to operate controls is identified, captured, and routed to owners.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 90d
                accepted_from: [grc, siem, ticketing_system, policy_repository, manual_attestation]
            freshness_sla: 90d
            owner_domain: governance
            automatable: true
            manual_evidence_allowed: true
            tags: [information_flow, governance, control_operations]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.5.9
              - framework_name: NIST 800-53 r5
                control_id: PL-2
          - id: CC2.2
            title: Control information is communicated internally
            objective: Policies, responsibilities, incidents, deficiencies, and control changes are communicated to the internal audiences that need them.
            intent: Keep control owners, operators, and stakeholders aligned on requirements and changes.
            applicability: [governance, workforce, security_operations]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Communicate policy changes, control responsibilities, incident outcomes, and remediation expectations to affected teams.
              - Track acknowledgement or receipt for high-impact control communications.
            audit_procedure:
              - Inspect internal communication records, acknowledgement evidence, and related policy or incident artifacts.
              - Sample control changes and verify affected audiences were notified.
            failure_modes:
              - Material control change was not communicated to affected owners or operators.
              - Communication evidence lacks date, audience, or owner.
            remediation_guidance:
              - Send the required communication, collect acknowledgement if needed, and attach evidence.
            exception_guidance: Communication exceptions require owner approval and a planned communication date.
            evidence_expectations:
              - id: internal-control-communication
                title: Internal control communication evidence
                type: internal_communication
                description: Policies, responsibilities, incidents, deficiencies, and control changes are communicated to the internal audiences that need them.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 180d
                accepted_from: [policy_repository, training_system, ticketing_system, communication_archive, manual_attestation]
            freshness_sla: 180d
            owner_domain: governance
            automatable: true
            manual_evidence_allowed: true
            tags: [communication, governance, awareness]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.6.3
              - framework_name: NIST 800-53 r5
                control_id: AT-2
          - id: CC2.3
            title: External communication supports security and compliance obligations
            objective: External parties receive required security, privacy, incident, and responsibility communications through approved channels.
            intent: Ensure customers, vendors, regulators, and partners receive timely and accurate control-relevant information.
            applicability: [governance, vendor_risk, incident_response]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Define approved external communication channels for trust, incident, vendor, and compliance notices.
              - Track external commitments, notifications, and customer or vendor evidence requests to outcome.
            audit_procedure:
              - Inspect external communication procedures, notification records, and trust or vendor evidence.
              - Sample external obligations and verify communication timing and approval.
            failure_modes:
              - Required external notice or evidence response is missing or late.
              - External communication lacks approval, recipient scope, or retained evidence.
            remediation_guidance:
              - Send or correct the communication, document approval, and retain evidence.
            exception_guidance: External communication exceptions require legal or executive approval and documented rationale.
            evidence_expectations:
              - id: external-control-communication
                title: External control communication evidence
                type: external_communication
                description: External parties receive required security, privacy, incident, and responsibility communications through approved channels.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 180d
                accepted_from: [customer_trust_portal, vendor_management, incident_management, manual_attestation]
            freshness_sla: 180d
            owner_domain: governance
            automatable: true
            manual_evidence_allowed: true
            tags: [communication, third_party, governance]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.5.19
              - framework_name: NIST 800-53 r5
                control_id: IR-6
      - id: CC3
        name: Risk Assessment
        controls:
          - id: CC3.1
            title: Objectives are specified for risk assessment
            objective: Security, availability, confidentiality, and compliance objectives are defined clearly enough to assess related risks.
            intent: Give risk assessment a concrete target for what the control system must achieve.
            applicability: [governance, risk_management, compliance]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Document security and compliance objectives with scope, owner, and assessment criteria.
              - Review objectives when products, sources, infrastructure, or regulatory obligations change.
            audit_procedure:
              - Inspect risk objectives, scope definitions, and review evidence.
              - Sample risk assessments and verify they trace to documented objectives.
            failure_modes:
              - Risk objective is missing, stale, or not tied to system scope.
              - Assessment criteria do not support the claimed control objective.
            remediation_guidance:
              - Define or refresh objectives, attach owner approval, and update risk assessment scope.
            exception_guidance: Objective exceptions require risk owner approval and next review date.
            evidence_expectations:
              - id: risk-assessment-objectives
                title: Risk objective evidence
                type: risk_objectives
                description: Security, availability, confidentiality, and compliance objectives are defined clearly enough to assess related risks.
                required: true
                assessment_methods: [examine, interview]
                freshness_sla: 365d
                accepted_from: [risk_register, policy_repository, grc, manual_attestation]
            freshness_sla: 365d
            owner_domain: risk
            automatable: true
            manual_evidence_allowed: true
            tags: [risk_management, objectives, governance]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: 6.1.2
              - framework_name: NIST 800-53 r5
                control_id: RA-2
          - id: CC3.2
            title: Risks are identified and analyzed
            objective: Security and compliance risks are identified, assessed for likelihood and impact, prioritized, and assigned to owners.
            intent: Make risk decisions evidence-backed and connected to remediation or accepted risk.
            applicability: [governance, risk_management, security_operations]
            assessment_methods: [examine, interview, test]
            implementation_guidance:
              - Collect risk signals from vulnerabilities, incidents, source coverage, vendors, and architecture changes.
              - Prioritize risks using severity, likelihood, exposure, asset criticality, and control impact.
            audit_procedure:
              - Inspect the risk register, scoring rationale, source inputs, owners, and treatment decisions.
              - Sample high and critical risks and verify remediation, monitoring, or risk acceptance.
            failure_modes:
              - Material risk is unrecorded, unscored, or missing an owner.
              - Risk treatment is overdue without documented acceptance or compensating control.
            remediation_guidance:
              - Record the risk, assign owner and treatment path, update priority, and refresh evidence.
            exception_guidance: Risk exceptions require owner approval, treatment rationale, compensating controls, and expiration.
            evidence_expectations:
              - id: risk-identification-analysis
                title: Risk identification and analysis evidence
                type: risk_assessment
                description: Security and compliance risks are identified, assessed for likelihood and impact, prioritized, and assigned to owners.
                required: true
                assessment_methods: [examine, interview, test]
                freshness_sla: 90d
                accepted_from: [risk_register, grc, vulnerability_scanner, cloud_security_posture, manual_attestation]
            freshness_sla: 90d
            owner_domain: risk
            automatable: true
            manual_evidence_allowed: true
            tags: [risk_management, prioritization, assessment]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.5.7
              - framework_name: NIST 800-53 r5
                control_id: RA-3
              - framework_name: NIST 800-53 r5
                control_id: RA-5
          - id: CC3.3
            title: Fraud and misuse risks are considered
            objective: Risk assessments consider fraud, misuse, abuse, and unauthorized activity that could affect security or control objectives.
            intent: Surface insider, abuse, and misuse scenarios that ordinary configuration checks may miss.
            applicability: [risk_management, fraud_detection, security_operations]
            assessment_methods: [examine, interview]
            implementation_guidance:
              - Include insider misuse, abuse paths, privileged activity, and financial or data misuse in risk assessments.
              - Connect misuse scenarios to logging, access, approval, and investigation controls.
            audit_procedure:
