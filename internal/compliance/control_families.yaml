          - id: CC6.8
            title: Malware and endpoint protection controls are maintained
            objective: Endpoint, workload, and malware protection controls are deployed, monitored, and restored when disabled or stale.
            intent: Limit compromise risk from unmanaged endpoints, stale agents, or malicious activity.
            applicability: [endpoint, security_operations, production]
            assessment_methods: [examine, test]
            implementation_guidance:
              - Deploy endpoint protection or equivalent workload controls to in-scope devices and servers.
              - Monitor inactive, infected, unmanaged, or stale agents and route findings to owners.
            audit_procedure:
              - Inspect endpoint protection coverage, policy state, stale-agent findings, and threat disposition.
              - Sample unmanaged or infected endpoints and verify remediation or approved exception.
            failure_modes:
              - Endpoint protection is missing, disabled, stale, or not reporting for an in-scope asset.
              - Threat or stale-agent finding lacks owner or closure evidence.
            remediation_guidance:
              - Restore protection, isolate or remediate affected assets, and refresh endpoint evidence.
            exception_guidance: Endpoint protection exceptions require compensating controls, owner approval, and expiration.
            evidence_expectations:
              - id: endpoint-malware-protection
                title: Endpoint and malware protection evidence
                type: endpoint_protection
                description: Endpoint, workload, and malware protection controls are deployed, monitored, and restored when disabled or stale.
                required: true
                assessment_methods: [examine, test]
                freshness_sla: 14d
                accepted_from: [sentinelone, mdm, endpoint_detection_response, source_snapshot, manual_attestation]
            freshness_sla: 14d
            owner_domain: security_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [endpoint, malware, protection]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.7
              - framework_name: NIST 800-53 r5
                control_id: SI-3
      - id: CC7
        name: System Operations
        controls:
          - id: CC7
            title: System operations detect, evaluate, and respond to security events
            objective: Operational controls identify vulnerabilities, collect security events, monitor alerts, investigate issues, and remediate findings.
            intent: Provide an umbrella operations objective for detection, vulnerability, incident, and remediation findings.
            applicability: [production, security_operations, vulnerability_management]
            assessment_methods: [examine, interview, test]
            implementation_guidance:
              - Operate vulnerability, logging, monitoring, investigation, incident, and remediation workflows for production systems.
              - Review open findings, alert routing, source coverage, and exception state on a defined cadence.
            audit_procedure:
              - Inspect vulnerability, logging, monitoring, investigation, and remediation evidence for production systems.
              - Sample high-severity findings and verify owner, timeline, and outcome.
            failure_modes:
              - Operational security source is missing, stale, or not routed to accountable owners.
              - High-risk finding lacks triage, investigation, remediation, or risk acceptance.
            remediation_guidance:
              - Restore source coverage, triage findings, complete remediation or acceptance, and refresh evidence.
            exception_guidance: Operations exceptions require owner approval, compensating detection, and expiration.
            evidence_expectations:
              - id: system-operations-security-posture
                title: System operations security posture evidence
                type: security_operations_posture
                description: Operational controls identify vulnerabilities, collect security events, monitor alerts, investigate issues, and remediate findings.
                required: true
                assessment_methods: [examine, interview, test]
                freshness_sla: 14d
                accepted_from: [aws, github, okta, siem, vulnerability_scanner, grc, manual_attestation]
            freshness_sla: 14d
            owner_domain: security_operations
            automatable: true
            manual_evidence_allowed: true
            tags: [security_operations, monitoring, vulnerability, remediation]
            maps_to:
              - framework_name: "ISO 27001:2022"
                control_id: A.8.8
              - framework_name: "ISO 27001:2022"
                control_id: A.8.15
