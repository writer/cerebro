# Canonical mapping from a coverage dimension's declared control_domains to the
# framework controls that the dimension's evidence can defensibly support. Source
# coverage contracts declare coarse control_domains (e.g. identity_access) rather
# than per-control mappings; this overlay lets every source's coverage dimensions
# participate in the all-finding compliance mapping using one auditable table
# instead of hand-authoring control_refs on 580+ individual dimensions.
#
# Matching stays bounded by source plus dimension / evidence gating and only ever
# surfaces the intersection of a detection's controls and a dimension's controls,
# so controls listed here that no detection maps simply never appear. Domains
# that do not directly evidence framework controls (for example
# source_operations) are intentionally left unmapped and guarded by tests.
