  cerebro:s3Sources:
    # Aurelius NDJSON exporter archives. The bucket lives in account
    # 502497380968 (aurelius-dev); cerebro reads it cross-account by
    # assuming the dedicated reader role
    # cerebro-aurelius-source-dev, which is named to match cerebro's
    # task-role inline policy allow-list (cerebro-*-source-*). The
    # roleArn is consumed by infra/aws/__main__.py to append a
    # sts:AssumeRole grant for the cerebro task role, and by the
    # cerebro orchestrator at runtime when minting the s3 client.
    - name: aurelius
      bucket: writer-aurelius-scan-results-dev
      bucketArn: arn:aws:s3:::writer-aurelius-scan-results-dev
      region: us-east-1
      roleArn: arn:aws:iam::502497380968:role/cerebro-aurelius-source-dev
      prefixes:
        - "aurelius/verdicts/"
        - "aurelius/findings/"
        - "aurelius/image_scans/"
        - "aurelius/catalog_promotions/"
        - "aurelius/policy_exceptions/"
    # Panopticon canonical event archives. The dedicated bucket, family
    # prefixes, and reader role are exported from /Users/jonathan/panopticon
    # infra as cerebro_export_* outputs for the dev stack.
    - name: panopticon
      bucket: panopticon-dev-944130631940-cerebro-export
      bucketArn: arn:aws:s3:::panopticon-dev-944130631940-cerebro-export
      region: us-east-1
      roleArn: arn:aws:iam::944130631940:role/panopticon-dev-cerebro-export-reader
      prefixes:
        - "exports/alerts/"
        - "exports/cases/"
        - "exports/iocs/"
    # Cerebro API access audit archives. This only pre-wires the S3 read scope;
    # the source runtime should be enabled after the deployed image includes
    # sourceId=cerebro.
    - name: cerebro-access-audit
      bucket: cerebro-sec-dev-audit
      bucketArn: arn:aws:s3:::cerebro-sec-dev-audit
      region: us-east-1
      prefixes:
        - "access/"
