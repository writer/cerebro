config:
  aws:region: us-east-1
  cerebro:environment: sec-dev
  # Active API domain.
  cerebro:domain: cerebro.adm.dev.qordobadev.com
  # Managed certificate for the active API domain.
  cerebro:certificateDomain: cerebro.adm.dev.qordobadev.com
  cerebro:certificateImportArn: arn:aws:acm:us-east-1:944130631940:certificate/09143d7f-c377-4de4-9127-d8cb5c642ba3
  cerebro:ecrBaseUri: 944130631940.dkr.ecr.us-east-1.amazonaws.com/cerebro
  cerebro:imageTag: v2.1.29
  cerebro:useExistingVpc: true
  cerebro:vpcId: vpc-06bac7242cd09af4d
  cerebro:vpcCidr: "10.10.0.0/16"
  cerebro:privateSubnetIds:
    - subnet-057a99f8c1196f53b
    - subnet-06d2afc18911b9cc5
  cerebro:publicSubnetIds:
    - subnet-075aed8f036657648
    - subnet-0f3b3171121b9da7b
  cerebro:apiCpu: 1024
  cerebro:apiMemory: 2048
  cerebro:apiMinInstances: 1
  cerebro:apiMaxInstances: 1
  cerebro:postgresInstanceClass: db.t4g.micro
  cerebro:postgresAllocatedStorage: 20
  cerebro:postgresBackupRetentionDays: 3
  cerebro:postgresDeletionProtection: false
  cerebro:postgresMultiAz: false
  cerebro:retainLegacyJobsTableForDeletionProtectionTransition: true
  cerebro:natsCpu: 512
  cerebro:natsMemory: 1024
  cerebro:jetstreamStreamName: CEREBRO_EVENTS
  cerebro:jetstreamSubjectPrefix: events
  cerebro:enableJetstreamLagProbe: true
  cerebro:jetstreamLagProbeIntervalSeconds: 60
  cerebro:jetstreamLagAlarmThreshold: 1000
  cerebro:apiAuthEnabled: true
  cerebro:sourceSecretKeys:
    - GITHUB_TOKEN
    - OKTA_API_TOKEN
    - OKTA_DOMAIN
    - SENTINELONE_API_TOKEN
    - SENTINELONE_BASE_URL
    - VULNVIEW_PROVIDER_OKTA_ISSUER
    - VULNVIEW_PROVIDER_CLIENT_ID
    - VULNVIEW_PROVIDER_CLIENT_SECRET
  cerebro:orchestratorEnabled: true
  cerebro:orchestratorScheduleExpression: "rate(6 hours)"
  cerebro:orchestratorCommand:
    - orchestrator
    - run
    - page_limit=20
    - graph_page_limit=100
    - event_limit=1000
  cerebro:orchestratorSchedules:
    - name: okta-audit-live
      scheduleExpression: rate(10 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-audit
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-audit-april-backfill
      removeAfter: "2026-06-01"
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-audit-2026-04
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-audit-q1-backfill
      removeAfter: "2026-06-01"
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-audit-2026-q1
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-user-inventory
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-user
        - page_limit=100
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-group-inventory
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-group
        - page_limit=100
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-application-inventory
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-application
        - page_limit=100
        - graph_page_limit=100
        - event_limit=1000
    - name: sentinelone-threat-live
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-sentinelone-threat
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: sentinelone-agent-inventory
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-sentinelone-agent
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: sentinelone-exclusion-inventory
      scheduleExpression: rate(1 hour)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-sentinelone-exclusion
        - page_limit=5
        - graph_page_limit=100
        - event_limit=1000
    - name: sentinelone-activity-live
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-sentinelone-activity
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: github-audit-writer
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-github-audit
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: github-audit-writerinternal
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-github-audit-writerinternal
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: vulnview-vulnerability-live
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-vulnview-vulnerability
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: vulnview-asset-inventory
      scheduleExpression: rate(1 hour)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-vulnview-asset
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: vulnview-dns-alert-inventory
      scheduleExpression: rate(1 hour)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-vulnview-dns-alert
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
  cerebro:sourceRuntimes:
    - id: writer-github-audit
      sourceId: github
      tenantId: writer
      config:
        family: audit
        owner: writer
        per_page: "100"
        token: env:GITHUB_TOKEN
    - id: writer-github-audit-writerinternal
      sourceId: github
      tenantId: writer
      config:
        family: audit
        owner: WriterInternal
        per_page: "100"
        token: env:GITHUB_TOKEN
    - id: writer-okta-audit
      sourceId: okta
      tenantId: writer
      config:
        domain: env:OKTA_DOMAIN
        family: audit
        per_page: "200"
        since: "2026-05-01T00:00:00Z"
        token: env:OKTA_API_TOKEN
    - id: writer-okta-audit-2026-04
      sourceId: okta
      tenantId: writer
      config:
        domain: env:OKTA_DOMAIN
        family: audit
        per_page: "200"
        since: "2026-04-01T00:00:00Z"
        until: "2026-05-01T00:00:00Z"
        token: env:OKTA_API_TOKEN
    - id: writer-okta-audit-2026-q1
      sourceId: okta
      tenantId: writer
      config:
        domain: env:OKTA_DOMAIN
        family: audit
        per_page: "200"
        since: "2026-01-01T00:00:00Z"
        until: "2026-04-01T00:00:00Z"
        token: env:OKTA_API_TOKEN
    - id: writer-okta-user
      sourceId: okta
      tenantId: writer
      config:
        domain: env:OKTA_DOMAIN
        family: user
        per_page: "200"
        token: env:OKTA_API_TOKEN
    - id: writer-okta-group
      sourceId: okta
      tenantId: writer
      config:
        domain: env:OKTA_DOMAIN
        family: group
        per_page: "200"
        token: env:OKTA_API_TOKEN
    - id: writer-okta-application
      sourceId: okta
      tenantId: writer
      config:
        domain: env:OKTA_DOMAIN
        family: application
        per_page: "200"
        token: env:OKTA_API_TOKEN
    - id: writer-sentinelone-threat
      sourceId: sentinelone
      tenantId: writer
      config:
        base_url: env:SENTINELONE_BASE_URL
        family: threat
        per_page: "50"
        since: "2026-04-01T00:00:00Z"
        token: env:SENTINELONE_API_TOKEN
    - id: writer-sentinelone-agent
      sourceId: sentinelone
      tenantId: writer
      config:
        base_url: env:SENTINELONE_BASE_URL
        family: agent
        per_page: "200"
        token: env:SENTINELONE_API_TOKEN
    - id: writer-sentinelone-exclusion
      sourceId: sentinelone
      tenantId: writer
      config:
        base_url: env:SENTINELONE_BASE_URL
        family: exclusion
        per_page: "200"
        token: env:SENTINELONE_API_TOKEN
    - id: writer-sentinelone-activity
      sourceId: sentinelone
      tenantId: writer
      config:
        base_url: env:SENTINELONE_BASE_URL
        family: activity
        per_page: "200"
        since: "2026-05-01T00:00:00Z"
        token: env:SENTINELONE_API_TOKEN
    - id: writer-vulnview-vulnerability
      sourceId: vulnview
      tenantId: writer
      config:
        base_url: https://vulnview.writer-security.com/api
        client_id: env:VULNVIEW_PROVIDER_CLIENT_ID
        client_secret: env:VULNVIEW_PROVIDER_CLIENT_SECRET
        family: vulnerability
        okta_issuer: env:VULNVIEW_PROVIDER_OKTA_ISSUER
        per_page: "100"
        tenant_id: writer
    - id: writer-vulnview-asset
      sourceId: vulnview
      tenantId: writer
      config:
        base_url: https://vulnview.writer-security.com/api
        client_id: env:VULNVIEW_PROVIDER_CLIENT_ID
        client_secret: env:VULNVIEW_PROVIDER_CLIENT_SECRET
        family: asset
        okta_issuer: env:VULNVIEW_PROVIDER_OKTA_ISSUER
        per_page: "100"
        tenant_id: writer
    - id: writer-vulnview-dns-alert
      sourceId: vulnview
      tenantId: writer
      config:
        base_url: https://vulnview.writer-security.com/api
        client_id: env:VULNVIEW_PROVIDER_CLIENT_ID
        client_secret: env:VULNVIEW_PROVIDER_CLIENT_SECRET
        family: dns_alert
        okta_issuer: env:VULNVIEW_PROVIDER_OKTA_ISSUER
        per_page: "100"
        tenant_id: writer
  cerebro:enableWaf: true
  cerebro:albInternal: true
  cerebro:albIngressCidrs:
    - "10.10.0.0/16"
    - "100.64.0.0/10"
  cerebro:logRetentionDays: 14
  cerebro:natGatewayPerAz: false
  cerebro:enableAlbAccessLogs: false
  cerebro:enableAlbDeletionProtection: false
  cerebro:enableKmsLogEncryption: false
  cerebro:enableTailscale: true
  cerebro:tailscaleAdvertiseRoutes:
    - "10.10.0.0/18"
    - "10.10.128.0/18"
  cerebro:externalSecretsPrefix: cerebro-sec-dev
  cerebro:enableInfisicalSyncRole: true
  cerebro:infisicalAssumeRolePrincipalArn: "arn:aws:iam::381492033652:root"
  cerebro:neo4jAuraEnabled: true
  cerebro:neo4jAuraInstanceId: 6f9c9442
