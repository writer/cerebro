config:
  aws:region: us-east-1
  cerebro:environment: sec-dev
  # ECR repo in sec-dev account
  cerebro:containerImage: 944130631940.dkr.ecr.us-east-1.amazonaws.com/cerebro:latest
  
  # Snowflake - needs to be configured with actual credentials
  # Set via: pulumi config set --secret cerebro:snowflakeConnectionString "..."
  
  # Use existing VPC (sec-dev account)
  cerebro:useExistingVpc: true
  cerebro:vpcId: vpc-06bac7242cd09af4d
  cerebro:vpcCidr: "10.10.0.0/16"
  cerebro:privateSubnetIds:
    - subnet-057a99f8c1196f53b
    - subnet-06d2afc18911b9cc5
  cerebro:publicSubnetIds:
    - subnet-075aed8f036657648
    - subnet-0f3b3171121b9da7b
  
  # Dev environment sizing - smaller footprint
  cerebro:apiCpu: 512
  cerebro:apiMemory: 1024
  cerebro:apiMinInstances: 1
  cerebro:apiMaxInstances: 3
  
  # Worker sizing
  cerebro:enableWorkers: true
  cerebro:workerCpu: 256
  cerebro:workerMemory: 512
  cerebro:workerMinInstances: 1
  cerebro:workerMaxInstances: 3
  cerebro:workerConcurrency: 2
  
  # Security/cost settings for dev
  cerebro:enableWaf: true
  cerebro:albInternal: true
  cerebro:logRetentionDays: 14
  
  # Dev doesn't need HA NAT or expensive logging
  cerebro:natGatewayPerAz: false
  cerebro:enableAlbAccessLogs: false
  cerebro:enableAlbDeletionProtection: false
  cerebro:enableKmsLogEncryption: false
  
  # Infisical integration
  cerebro:externalSecretsPrefix: cerebro-sec-dev
  cerebro:enableInfisicalSyncRole: true
  cerebro:useExternalSecrets: true
  cerebro:infisicalAssumeRolePrincipalArn: "arn:aws:iam::381492033652:root"

  # GCP WIF - populate cerebro:gcpWifAudience from GCP stack output:
  #   cd infra/gcp && pulumi stack output wif_audience --stack gcp-dev
  cerebro:gcpWifAudience: "//iam.googleapis.com/projects/788018447969/locations/global/workloadIdentityPools/cerebro-aws-pool-dev/providers/cerebro-aws-provider-dev"
  cerebro:gcpImpersonateServiceAccount: "cerebro-scanner-dev@writer-iam.iam.gserviceaccount.com"