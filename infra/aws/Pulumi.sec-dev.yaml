config:
  aws:region: us-east-1
  cerebro:environment: sec-dev
  # Active API domain.
  cerebro:domain: cerebro.adm.dev.qordobadev.com
  # Managed certificate for the active API domain.
  cerebro:certificateDomain: cerebro.adm.dev.qordobadev.com
  cerebro:certificateImportArn: arn:aws:acm:us-east-1:944130631940:certificate/09143d7f-c377-4de4-9127-d8cb5c642ba3
  cerebro:ecrBaseUri: 944130631940.dkr.ecr.us-east-1.amazonaws.com/cerebro
  cerebro:imageTag: v2.1.257
  cerebro:webEnabled: true
  cerebro:webEcrBaseUri: 944130631940.dkr.ecr.us-east-1.amazonaws.com/cerebro
  cerebro:webImageTag: sha-1b59db4ed4ee
  cerebro:webDomain: cerebro-web.adm.dev.qordobadev.com
  cerebro:webCertificateDomain: cerebro-web.adm.dev.qordobadev.com
  cerebro:webApiBase: https://cerebro.adm.dev.qordobadev.com
  cerebro:webForwardAuthHeaders: false
  cerebro:webProxyTimeoutMs: 600000
  cerebro:webOidcEnabled: true
  cerebro:webOidcIssuer: https://writer.okta.com
  cerebro:webOidcAuthorizationEndpoint: https://writer.okta.com/oauth2/v1/authorize
  cerebro:webOidcTokenEndpoint: https://writer.okta.com/oauth2/v1/token
  cerebro:webOidcUserInfoEndpoint: https://writer.okta.com/oauth2/v1/userinfo
  cerebro:webOidcClientId: 0oa234e4mu4Dnot0q1d8
  cerebro:webCpu: 512
  cerebro:webMemory: 1024
  cerebro:webMinInstances: 1
  cerebro:webMaxInstances: 2
  cerebro:albIdleTimeoutSeconds: 600
  cerebro:webAlbIdleTimeoutSeconds: 600
  cerebro:useExistingVpc: true
  cerebro:vpcId: vpc-06bac7242cd09af4d
  cerebro:vpcCidr: "10.10.0.0/16"
  cerebro:privateSubnetIds:
    - subnet-057a99f8c1196f53b
    - subnet-06d2afc18911b9cc5
  cerebro:publicSubnetIds:
    - subnet-075aed8f036657648
    - subnet-0f3b3171121b9da7b
  cerebro:apiCpu: 1024
  cerebro:apiMemory: 2048
  cerebro:apiMinInstances: 1
  # Pinned to 1 because cerebro:deviceAuthEnabled is true and the secheck
  # DPoP replay cache is in-process per replica. The Pulumi __main__.py
  # guard refuses to plan an apply with apiMaxInstances > 1 while
  # deviceAuthEnabled is true; raise it only after shared replay state
  # ships and the corresponding code-side guard is relaxed.
  cerebro:apiMaxInstances: 1
  cerebro:apiRequestCountPerTargetScalingTarget: 300
  cerebro:apiRequestCountPerTargetAlarmThreshold: 600
  cerebro:apiLatencyP95AlarmThresholdSeconds: 3
  cerebro:webLatencyP95AlarmThresholdSeconds: 3
  cerebro:dashboardLatencyP95AlarmThresholdMs: 3000
  cerebro:postgresInstanceClass: db.t4g.small
  cerebro:postgresAllocatedStorage: 100
  cerebro:postgresStorageType: gp3
  cerebro:postgresMaxAllocatedStorage: 200
  cerebro:postgresBackupRetentionDays: 14
  cerebro:postgresDeletionProtection: true
  cerebro:postgresMultiAz: true
  cerebro:retainLegacyJobsTableForDeletionProtectionTransition: true
  cerebro:natsCpu: 512
  cerebro:natsMemory: 1024
  cerebro:jetstreamStreamName: CEREBRO_EVENTS
  cerebro:jetstreamSubjectPrefix: events
  cerebro:enableJetstreamLagProbe: true
  cerebro:jetstreamLagProbeIntervalSeconds: 60
  cerebro:jetstreamLagAlarmThreshold: 1000
  cerebro:alarmActionArns:
    - arn:aws:sns:us-east-1:944130631940:aws-controltower-SecurityNotifications
  cerebro:apiAuthEnabled: true
  # secheck-agent sender-constrained tokens (DPoP). The Ed25519 signing
  # bundle lives in AWS SecretsManager under the configured name; provision
  # it once with `scripts/devices/mint-deviceauth-signing-keys.sh` (see PR
  # description) and rotate via the same flow. Defaults for ttl/skew/risk
  # come from internal/config/device_auth.go and can be overridden here
  # if the pilot demands tighter values.
  cerebro:deviceAuthEnabled: true
  cerebro:deviceAuthCurrentKID: secheck-pilot-1
  cerebro:deviceAuthSigningKeysSecretName: CEREBRO_DEVICE_AUTH_SIGNING_KEYS_JSON
  cerebro:deviceAuthIssuer: cerebro-sec-dev
  cerebro:deviceAuthAudience: cerebro-device
  cerebro:deviceAuthRefreshTTL: 168h
  cerebro:deviceAuthDPoPProofTTL: 60s
  cerebro:deviceAuthClockSkew: 60s
  cerebro:accessAuditDeniedAlarmThreshold: 50
  cerebro:accessAuditAuthFailureAlarmThreshold: 25
  cerebro:accessAuditTenantMismatchAlarmThreshold: 0
  cerebro:accessAuditSensitiveDeniedAlarmThreshold: 0
  cerebro:capabilityTokenSecretName: CEREBRO_CAPABILITY_TOKEN_SECRETS_SEC_DEV
  cerebro:graphAgentLlmProvider: openrouter
  cerebro:graphAgentLlmModel: anthropic/claude-sonnet-4.6
  cerebro:openrouterApiKeySecret: CEREBRO_OPENROUTER_API_KEY
  cerebro:sourceSecretKeys:
    - CEREBRO_SOURCE_COSMO_BASE_URL
    - CEREBRO_SOURCE_COSMO_TOKEN
    - CEREBRO_SOURCE_SECURITY_TOOLING_MAP_TOKEN
    - EVIDENCE_CAS_BASE_URL
    - EVIDENCE_CAS_TOKEN
    - GITHUB_APP_ID
    - GITHUB_APP_INSTALLATION_ID_WRITERINTERNAL
    - GITHUB_APP_PRIVATE_KEY_BASE64
    - OKTA_API_TOKEN
    - OKTA_DOMAIN
    - SENTINELONE_API_TOKEN
    - SENTINELONE_BASE_URL
  cerebro:sourceRuntimeObservability:
    - environment: sec-dev
      sourceSystem: evidence_cas
      sourceRuntimeId: writer-evidence-cas-cases
      runtimeClass: object
      enabled: true
      freshnessSlaMinutes: 90
      logGroupRef: runtime
      dashboardEnabled: true
      alarmEnabled: true
      alarmRoute: default
      observabilityStates:
        - success
        - failure
        - stale
        - disabled
        - unknown
        - not_configured
    - environment: sec-dev
      sourceSystem: panopticon
      sourceRuntimeId: writer-panopticon-alerts
      runtimeClass: alert
      enabled: true
      freshnessSlaMinutes: 30
      logGroupRef: runtime
      dashboardEnabled: true
      alarmEnabled: true
      alarmRoute: default
      observabilityStates:
        - success
        - failure
        - stale
        - disabled
        - unknown
        - not_configured
    - environment: sec-dev
      sourceSystem: panopticon
      sourceRuntimeId: writer-panopticon-cases
      runtimeClass: case
      enabled: true
      freshnessSlaMinutes: 30
      logGroupRef: runtime
      dashboardEnabled: true
      alarmEnabled: true
      alarmRoute: default
      observabilityStates:
        - success
        - failure
        - stale
        - disabled
        - unknown
        - not_configured
    - environment: sec-dev
      sourceSystem: panopticon
      sourceRuntimeId: writer-panopticon-iocs
      runtimeClass: ioc
      enabled: true
      freshnessSlaMinutes: 30
      logGroupRef: runtime
      dashboardEnabled: true
      alarmEnabled: true
      alarmRoute: default
      observabilityStates:
        - success
        - failure
        - stale
        - disabled
        - unknown
        - not_configured
