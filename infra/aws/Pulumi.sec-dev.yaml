  cerebro:apiCpu: 1024
  cerebro:apiMemory: 2048
  cerebro:apiMinInstances: 1
  cerebro:apiMaxInstances: 1
  cerebro:postgresInstanceClass: db.t4g.micro
  cerebro:postgresAllocatedStorage: 20
  cerebro:postgresBackupRetentionDays: 3
  cerebro:postgresDeletionProtection: false
  cerebro:postgresMultiAz: false
