        per_page: "200"
        token: env:SENTINELONE_API_TOKEN
    - id: writer-sentinelone-activity
      sourceId: sentinelone
      tenantId: writer
      config:
        base_url: env:SENTINELONE_BASE_URL
        family: activity
        per_page: "200"
        since: "2026-05-01T00:00:00Z"
        token: env:SENTINELONE_API_TOKEN
    - id: writer-aws-sec-dev-us1-public-endpoint
      sourceId: aws
      tenantId: writer
      config:
        account_id: "944130631940"
        family: public_endpoint
        include_global: "true"
        per_page: "100"
        region: us-east-1
        role_arn: arn:aws:iam::944130631940:role/cerebro-org-scan-role
    - id: writer-aws-sec-dev-us2-public-endpoint
      sourceId: aws
      tenantId: writer
      config:
        account_id: "944130631940"
        family: public_endpoint
        include_global: "false"
        per_page: "100"
        region: us-west-2
        role_arn: arn:aws:iam::944130631940:role/cerebro-org-scan-role
    - id: writer-cosmo-session
      sourceId: cosmo
      tenantId: writer
      config:
        base_url: env:CEREBRO_SOURCE_COSMO_BASE_URL
        family: session
        per_page: "100"
        tenant_id: writer
        token: env:CEREBRO_SOURCE_COSMO_TOKEN
    - id: writer-cosmo-fact
      sourceId: cosmo
      tenantId: writer
      config:
        base_url: env:CEREBRO_SOURCE_COSMO_BASE_URL
        family: fact
        per_page: "100"
        tenant_id: writer
        token: env:CEREBRO_SOURCE_COSMO_TOKEN
    - id: writer-cosmo-survey-feedback
      sourceId: cosmo
      tenantId: writer
      config:
        base_url: env:CEREBRO_SOURCE_COSMO_BASE_URL
        family: survey_feedback
        per_page: "100"
        tenant_id: writer
        token: env:CEREBRO_SOURCE_COSMO_TOKEN
