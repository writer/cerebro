      command:
        - orchestrator
        - run
        - runtime_id=writer-aws-sec-dev-us2-public-endpoint
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: cosmo-session
      scheduleExpression: cron(2,32 * * * ? *)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-cosmo-session
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: cosmo-fact
      scheduleExpression: cron(12,42 * * * ? *)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-cosmo-fact
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
