config:
  aws:region: us-east-1
  cerebro:environment: sec-dev
  cerebro:ecrBaseUri: 944130631940.dkr.ecr.us-east-1.amazonaws.com/cerebro
  cerebro:imageTag: v1.0.0

  cerebro:useExistingVpc: true
  cerebro:vpcId: vpc-06bac7242cd09af4d
  cerebro:vpcCidr: "10.10.0.0/16"
  cerebro:privateSubnetIds:
    - subnet-057a99f8c1196f53b
    - subnet-06d2afc18911b9cc5
  cerebro:publicSubnetIds:
    - subnet-075aed8f036657648
    - subnet-0f3b3171121b9da7b

  cerebro:apiCpu: 1024
  cerebro:apiMemory: 2048
  cerebro:apiMinInstances: 1
  cerebro:apiMaxInstances: 1
  cerebro:postgresInstanceClass: db.t4g.micro
  cerebro:postgresAllocatedStorage: 20
  cerebro:postgresBackupRetentionDays: 3
  cerebro:postgresDeletionProtection: false
  cerebro:postgresMultiAz: false
  cerebro:retainLegacyJobsTableForDeletionProtectionTransition: true
  cerebro:natsCpu: 512
  cerebro:natsMemory: 1024
  cerebro:jetstreamStreamName: CEREBRO_EVENTS
  cerebro:jetstreamSubjectPrefix: events
  cerebro:apiAuthEnabled: true

  cerebro:enableWaf: true
  cerebro:albInternal: true
  cerebro:logRetentionDays: 14
  cerebro:natGatewayPerAz: false
  cerebro:enableAlbAccessLogs: false
  cerebro:enableAlbDeletionProtection: false
  cerebro:enableKmsLogEncryption: false

  cerebro:externalSecretsPrefix: cerebro-sec-dev
  cerebro:enableInfisicalSyncRole: true
  cerebro:infisicalAssumeRolePrincipalArn: "arn:aws:iam::381492033652:root"
