      command:
        - orchestrator
        - run
        - runtime_id=writer-cosmo-survey-feedback
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
  cerebro:sourceRuntimes:
    - id: writer-github-audit
      sourceId: github
      tenantId: writer
      config:
        family: audit
        owner: writer
        per_page: "100"
        token: env:GITHUB_TOKEN
    - id: writer-github-audit-writerinternal
      sourceId: github
      tenantId: writer
      config:
        family: audit
        owner: WriterInternal
        per_page: "100"
        token: env:GITHUB_TOKEN
    - id: writer-okta-audit
      sourceId: okta
      tenantId: writer
      config:
        domain: env:OKTA_DOMAIN
        family: audit
        per_page: "200"
        since: "2026-05-01T00:00:00Z"
        token: env:OKTA_API_TOKEN
    - id: writer-okta-audit-2026-04
      sourceId: okta
      tenantId: writer
      config:
        domain: env:OKTA_DOMAIN
        family: audit
        per_page: "200"
        since: "2026-04-01T00:00:00Z"
