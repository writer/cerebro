    - CEREBRO_SOURCE_COSMO_EXPORT_SECRET
    - CEREBRO_SOURCE_COSMO_TOKEN
    - GITHUB_TOKEN
    - OKTA_API_TOKEN
    - OKTA_DOMAIN
    - SENTINELONE_API_TOKEN
    - SENTINELONE_BASE_URL
  cerebro:orchestratorEnabled: true
  cerebro:orchestratorScheduleExpression: "rate(6 hours)"
  cerebro:orchestratorCommand:
    - orchestrator
    - run
    - page_limit=20
    - graph_page_limit=100
    - event_limit=1000
  cerebro:orchestratorSchedules:
    - name: okta-audit-live
      scheduleExpression: rate(10 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-audit
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-audit-april-backfill
      removeAfter: "2026-06-01"
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-audit-2026-04
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-audit-q1-backfill
      removeAfter: "2026-06-01"
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-audit-2026-q1
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-user-inventory
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-user
        - page_limit=100
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-group-inventory
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-group
        - page_limit=100
        - graph_page_limit=100
        - event_limit=1000
    - name: okta-application-inventory
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-okta-application
        - page_limit=100
        - graph_page_limit=100
        - event_limit=1000
    - name: sentinelone-threat-live
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-sentinelone-threat
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: sentinelone-agent-inventory
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-sentinelone-agent
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: sentinelone-exclusion-inventory
      scheduleExpression: rate(1 hour)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-sentinelone-exclusion
        - page_limit=5
        - graph_page_limit=100
        - event_limit=1000
    - name: sentinelone-activity-live
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-sentinelone-activity
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: github-audit-writer
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-github-audit
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: github-audit-writerinternal
      scheduleExpression: rate(15 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-github-audit-writerinternal
        - page_limit=10
        - graph_page_limit=100
        - event_limit=1000
    - name: aws-sec-dev-us1-public-endpoints
      scheduleExpression: rate(1 hour)
      taskCount: 1
