config:
  aws:region: us-east-1
  cerebro:environment: go-production
  cerebro:domain: cerebro.adm.prod.writer.com
  cerebro:certificateDomain: cerebro.adm.prod.writer.com
  cerebro:certificateImportArn: arn:aws:acm:us-east-1:837279440628:certificate/7fcbcda8-da84-4780-8065-6591ae9de3de
  cerebro:ecrBaseUri: 837279440628.dkr.ecr.us-east-1.amazonaws.com/cerebro
  cerebro:imageTag: v2.1.737
  cerebro:useExistingVpc: true
  cerebro:vpcId: vpc-0bec76c1fba4b8ad2
  cerebro:vpcCidr: "10.20.0.0/16"
  cerebro:privateSubnetIds:
    - subnet-0b278f102292ec822
    - subnet-065db524200fdd173
  cerebro:publicSubnetIds:
    - subnet-0dee23b7f11d39069
    - subnet-06c3659db5372e941
  cerebro:apiCpu: 4096
  cerebro:apiMemory: 8192
  cerebro:apiMinInstances: 1
  # apiMaxInstances pinned to 1 while deviceAuthEnabled is on: the DPoP
  # replay cache is per-replica in-process (internal/deviceauth/dpop.go), so
  # multi-replica would let a legitimate proof routed to a different task
  # than the one that minted the access token look like a replay -> 401.
  # validate_stack_config.py rejects deviceAuthEnabled + apiMaxInstances>1.
  # Lift back to 2 once shared DPoP replay state ships (Phase-2: Redis-backed
  # jti cache).
  cerebro:apiMaxInstances: 1
  cerebro:apiRequestCountPerTargetScalingTarget: 500
  cerebro:apiRequestCountPerTargetAlarmThreshold: 1000
  cerebro:apiLatencyP95AlarmThresholdSeconds: 3
  cerebro:dashboardLatencyP95AlarmThresholdMs: 3000
  cerebro:otelCollectorEnabled: true
  cerebro:otelCollectorImage: public.ecr.aws/aws-observability/aws-otel-collector:v0.48.0
  cerebro:otelCollectorConfigSecretName: CEREBRO_OTEL_COLLECTOR_CONFIG
  cerebro:otelTracesSampleRate: "0.25"
  cerebro:otelMetricsExportInterval: 30s
  cerebro:postgresInstanceClass: db.t4g.medium
  cerebro:postgresAllocatedStorage: 100
  cerebro:postgresStorageType: gp3
  cerebro:postgresMaxAllocatedStorage: 200
  cerebro:postgresBackupRetentionDays: 14
  cerebro:postgresDeletionProtection: true
  cerebro:postgresMultiAz: true
  cerebro:retainLegacyJobsTableForDeletionProtectionTransition: true
  cerebro:cacheEnabled: true
  cerebro:cacheEngine: valkey
  cerebro:cacheNamespace: cerebro:go-production:grc
  cerebro:cacheDefaultTTL: 30s
  cerebro:cacheStaleTTL: 5m
  cerebro:cacheMaxPayloadBytes: 1048576
  cerebro:natsCpu: 8192
  cerebro:natsMemory: 32768
  cerebro:natsImage: nats:2.14.2-alpine
  cerebro:natsBoxImage: natsio/nats-box:0.18.0
  cerebro:jetstreamStreamName: CEREBRO_EVENTS
  cerebro:jetstreamSubjectPrefix: events
  cerebro:jetstreamMaxBytes: "549755813888"
  cerebro:jetstreamDupeWindow: 10m
  cerebro:jetstreamDiscardPolicy: old
  cerebro:jetstreamPublishMaxInFlight: 16
  cerebro:jetstreamPublishFindingsMaxInFlight: 16
  cerebro:jetstreamPublishRetryAttempts: 24
  cerebro:jetstreamPublishRetryInitialBackoff: 500ms
  cerebro:jetstreamPublishRetryMaxBackoff: 10s
  cerebro:jetstreamPublishAttemptTimeout: 45s
  cerebro:jetstreamPublishRetryMaxElapsed: 5m
  cerebro:jetstreamPublishClientRetryAttempts: 6
  cerebro:jetstreamPublishClientRetryWait: 750ms
  cerebro:natsEfsThroughputMode: elastic
  cerebro:enableJetstreamLagProbe: true
  cerebro:jetstreamLagProbeIntervalSeconds: 60
  cerebro:jetstreamLagAlarmThreshold: 50000
  cerebro:jetstreamStreamBytesAlarmThreshold: 85899345920
  cerebro:jetstreamAppErrorAlarmThreshold: 10
  cerebro:jetstreamPublishRetryAlarmThreshold: 25
  cerebro:alarmActionArns:
    - arn:aws:sns:us-east-1:837279440628:aws-controltower-SecurityNotifications
  cerebro:apiAuthEnabled: true
  # secheck-agent sender-constrained tokens (DPoP). The Ed25519 signing
  # bundle lives in AWS SecretsManager under the configured name; provision
  # in Infisical's go-prod environment under the same key, with kid set to
  # secheck-pilot-1 to match deviceAuthCurrentKID. Rotate via the same flow.
  # Defaults for ttl/skew/risk come from internal/config/device_auth.go.
  cerebro:deviceAuthEnabled: true
  cerebro:deviceAuthCurrentKID: secheck-pilot-1
  cerebro:deviceAuthSigningKeysSecretName: CEREBRO_DEVICE_AUTH_SIGNING_KEYS_JSON
  cerebro:deviceAuthIssuer: cerebro-go-prod
  cerebro:deviceAuthAudience: cerebro-device
  cerebro:deviceAuthRefreshTTL: 168h
  cerebro:deviceAuthDPoPProofTTL: 60s
  cerebro:deviceAuthClockSkew: 60s
  cerebro:accessAuditDeniedAlarmThreshold: 50
  cerebro:accessAuditAuthFailureAlarmThreshold: 25
  cerebro:accessAuditTenantMismatchAlarmThreshold: 0
  cerebro:accessAuditSensitiveDeniedAlarmThreshold: 0
  cerebro:capabilityTokenSecretName: CEREBRO_CAPABILITY_TOKEN_SECRETS_GO_PROD
  cerebro:graphAgentLlmProvider: bedrock
  cerebro:graphAgentLlmModel: us.anthropic.claude-opus-4-8
  cerebro:bedrockRegion: us-east-1
  cerebro:allowedTenants:
    - writer
  cerebro:mcpOauthEnabled: true
  cerebro:mcpOauthUpstreamIssuer: https://writer.okta.com
  cerebro:mcpOauthUpstreamRedirectUri: https://cerebro.adm.prod.writer.com/oauth/callback
  cerebro:mcpOauthUpstreamClientIdSecretName: CEREBRO_MCP_OAUTH_UPSTREAM_CLIENT_ID_GO_PROD
  cerebro:mcpOauthUpstreamClientSecretName: CEREBRO_MCP_OAUTH_UPSTREAM_CLIENT_SECRET_GO_PROD
  cerebro:mcpOauthTenantId: writer
  cerebro:mcpOauthAllowedTenants:
    - writer
  cerebro:mcpOauthSecurityGroups:
    - "DEPT - SECURITY"
  cerebro:sourceSecretKeys:
    - CEREBRO_SOURCE_COSMO_BASE_URL
    - CEREBRO_SOURCE_COSMO_EXPORT_SECRET
    - CEREBRO_SOURCE_COSMO_TOKEN
