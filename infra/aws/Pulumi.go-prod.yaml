  cerebro:enableKmsLogEncryption: true
  cerebro:natGatewayPerAz: true
  # IAM scope retained for internal S3 source runtimes. Runtime source configs
  # provide bucket/prefix details to Cerebro; these entries grant task access.
  cerebro:s3Sources:
    # Aurelius NDJSON exporter archives. The bucket lives in account
    # 502497380968 (aurelius-prod); cerebro reads it cross-account by
    # assuming the dedicated reader role cerebro-aurelius-source-prod,
    # named to match cerebro's task-role inline allow-list
    # (cerebro-*-source-*). The role is provisioned by the security
    # repo Pulumi.aurelius-prod.yaml (cerebroReaderPrincipalArns).
    - name: aurelius
      bucket: writer-aurelius-scan-results-prod
      bucketArn: arn:aws:s3:::writer-aurelius-scan-results-prod
      region: us-east-1
      roleArn: arn:aws:iam::502497380968:role/cerebro-aurelius-source-prod
      prefixes:
        - "aurelius/verdicts/"
        - "aurelius/findings/"
        - "aurelius/image_scans/"
        - "aurelius/catalog_promotions/"
        - "aurelius/policy_exceptions/"
