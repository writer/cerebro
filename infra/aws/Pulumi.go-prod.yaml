config:
  aws:region: us-east-1
  cerebro:environment: go-production
  cerebro:ecrBaseUri: 837279440628.dkr.ecr.us-east-1.amazonaws.com/cerebro
  cerebro:imageTag: v2.1.24
  cerebro:useExistingVpc: true
  cerebro:vpcId: vpc-0bec76c1fba4b8ad2
  cerebro:vpcCidr: "10.20.0.0/16"
  cerebro:privateSubnetIds:
    - subnet-0b278f102292ec822
    - subnet-065db524200fdd173
  cerebro:publicSubnetIds:
    - subnet-0dee23b7f11d39069
    - subnet-06c3659db5372e941
  cerebro:apiCpu: 2048
  cerebro:apiMemory: 4096
  cerebro:apiMinInstances: 1
  cerebro:apiMaxInstances: 1
  cerebro:postgresInstanceClass: db.t4g.small
  cerebro:postgresAllocatedStorage: 100
  cerebro:postgresBackupRetentionDays: 14
  cerebro:postgresDeletionProtection: true
  cerebro:postgresMultiAz: true
  cerebro:retainLegacyJobsTableForDeletionProtectionTransition: true
  cerebro:natsCpu: 1024
  cerebro:natsMemory: 2048
  cerebro:jetstreamStreamName: CEREBRO_EVENTS
  cerebro:jetstreamSubjectPrefix: events
  cerebro:enableJetstreamLagProbe: true
  cerebro:jetstreamLagProbeIntervalSeconds: 60
  cerebro:jetstreamLagAlarmThreshold: 50000
  cerebro:apiAuthEnabled: true
  cerebro:allowedTenants:
    - writer
  cerebro:sourceSecretKeys:
    - VANTA_CLIENT_ID
    - VANTA_CLIENT_SECRET
  cerebro:orchestratorEnabled: true
  cerebro:orchestratorScheduleExpression: "rate(30 minutes)"
  cerebro:orchestratorCommand:
    - orchestrator
    - run
    - runtime_id=writer-grc-control-test
    - page_limit=20
    - graph_page_limit=100
    - event_limit=1000
  cerebro:orchestratorSchedules:
    - name: grc-vulnerability-live
      scheduleExpression: rate(30 minutes)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-vulnerability
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-control-inventory
      scheduleExpression: rate(1 hour)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-control
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-vendor-inventory
      scheduleExpression: rate(1 hour)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-vendor
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-risk-scenario-inventory
      scheduleExpression: rate(1 hour)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-risk-scenario
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-framework-inventory
      scheduleExpression: rate(6 hours)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-framework
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-policy-inventory
      scheduleExpression: rate(6 hours)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-policy
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-document-inventory
      scheduleExpression: rate(6 hours)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-document
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-person-inventory
      scheduleExpression: rate(6 hours)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-person
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-user-inventory
      scheduleExpression: rate(6 hours)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-user
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
    - name: grc-integration-inventory
      scheduleExpression: rate(6 hours)
      taskCount: 1
      command:
        - orchestrator
        - run
        - runtime_id=writer-grc-integration
        - page_limit=20
        - graph_page_limit=100
        - event_limit=1000
  cerebro:sourceRuntimes:
    - id: writer-grc-framework
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: framework
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-control
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: control
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-control-test
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: control_test
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-policy
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: policy
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-document
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: document
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-vendor
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: vendor
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-vulnerability
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: vulnerability
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-risk-scenario
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: risk_scenario
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-person
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: person
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-user
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: user
        per_page: "100"
        provider: vanta
        tenant_id: writer
    - id: writer-grc-integration
      sourceId: grc
      tenantId: writer
      config:
        client_id: env:VANTA_CLIENT_ID
        client_secret: env:VANTA_CLIENT_SECRET
        family: integration
        per_page: "100"
        provider: vanta
        tenant_id: writer
  cerebro:enableTailscale: true
  cerebro:tailscaleAdvertiseRoutes:
    - "10.20.0.0/18"
    - "10.20.128.0/18"
  cerebro:enableInfisicalSyncRole: true
  cerebro:infisicalAssumeRolePrincipalArn: "arn:aws:iam::381492033652:root"
  cerebro:enableAlbAccessLogs: true
  cerebro:enableAlbDeletionProtection: true
  cerebro:enableKmsLogEncryption: true
  cerebro:natGatewayPerAz: true
  # IAM scope retained for internal S3 source runtimes. Runtime source configs
  # provide bucket/prefix details to Cerebro; these entries grant task access.
  cerebro:s3Sources:
    - name: kolide
      bucket: writer-kolide-telemetry
      region: us-east-1
      prefixes:
        - "audit_logs/"
        - "results/incident_response/"
        - "results/inventory/"
        - "results/osx_attacks/"
        - "results/vulnerability_mgt_pack/"
    - name: sentinelone
      bucket: writer-sentinelone-cloud-funnel
      region: us-east-1
      prefixes:
        - "s1/cloud_funnel/"
  cerebro:neo4jAuraEnabled: true
  cerebro:neo4jAuraInstanceName: cerebro-go-prod-writer
  cerebro:neo4jAuraMemory: 8GB
  cerebro:neo4jAuraType: professional-db
  cerebro:neo4jAuraRegion: us-central1
  cerebro:neo4jAuraCloudProvider: gcp
  cerebro:neo4jAuraClientId:
    secure: AAABAJnWawGx95kLSGBqmI4oZqF2in6rgmU5J7Yj/S7PRCMJ5vltaMYfzZczP2umn6xdy5iO0oG9LDbPmn664w==
