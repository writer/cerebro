name: cerebro
runtime:
  name: python
  options:
    toolchain: uv
    virtualenv: ../.venv
description: Infrastructure for the Cerebro rewrite runtime

config:
  cerebro:environment:
    type: string
    description: Environment name override (derived from stack name if unset)
  cerebro:domain:
    type: string
    default: ""
    description: Custom domain for Cerebro API
  cerebro:certificateDomain:
    type: string
    default: ""
    description: ACM certificate domain to manage for Cerebro
  cerebro:certificateImportArn:
    type: string
    default: ""
    description: Existing ACM certificate ARN to import into Pulumi
  cerebro:ecrBaseUri:
    type: string
    description: ECR repository base URI without tag
  cerebro:imageTag:
    type: string
    default: v1.0.0
    description: Container image tag deployed to ECS
  cerebro:webEnabled:
    type: boolean
    default: false
    description: Deploy the Cerebro web console ECS service
  cerebro:webEcrBaseUri:
    type: string
    default: ""
    description: ECR repository base URI for the Cerebro web image without tag; defaults to cerebro:ecrBaseUri
  cerebro:webImageTag:
    type: string
    default: ""
    description: Cerebro web image tag deployed to ECS
  cerebro:webDomain:
    type: string
    default: ""
    description: Optional custom domain for the Cerebro web console
  cerebro:webCertificateArn:
    type: string
    default: ""
    description: Existing ACM certificate ARN for the Cerebro web console ALB listener
  cerebro:webCertificateDomain:
    type: string
    default: ""
    description: Optional ACM certificate domain to request for the Cerebro web console
  cerebro:webCertificateImportArn:
    type: string
    default: ""
    description: Optional existing ACM certificate ARN to import for cerebro:webCertificateDomain
  cerebro:webApiBase:
    type: string
    default: ""
    description: Cerebro API base URL used by the web console server-side proxy
  cerebro:webForwardAuthHeaders:
    type: boolean
    default: false
    description: Forward caller auth headers from the web console to the Cerebro API
  cerebro:webProxyTimeoutMs:
    type: integer
    default: 600000
    description: Web console server-side Cerebro API proxy timeout in milliseconds
  cerebro:webApiKeySecretName:
    type: string
    default: CEREBRO_API_KEYS
    description: Secret key under externalSecretsPrefix mounted into the web console as CEREBRO_API_KEYS
  cerebro:webOidcEnabled:
    type: boolean
    default: false
    description: Protect the web console ALB HTTPS listener with OIDC authentication
  cerebro:webOidcIssuer:
    type: string
    default: ""
    description: OIDC issuer URL for the web console ALB authentication action
  cerebro:webOidcAuthorizationEndpoint:
    type: string
    default: ""
    description: Optional OIDC authorization endpoint override for the web console ALB authentication action
  cerebro:webOidcTokenEndpoint:
    type: string
    default: ""
    description: Optional OIDC token endpoint override for the web console ALB authentication action
  cerebro:webOidcUserInfoEndpoint:
    type: string
    default: ""
    description: Optional OIDC user info endpoint override for the web console ALB authentication action
  cerebro:webOidcClientId:
    type: string
    default: ""
    description: OIDC client ID for the web console ALB authentication action
  cerebro:webOidcClientSecret:
    type: string
    default: ""
    description: OIDC client secret for the web console ALB authentication action; set with pulumi config set --secret
  cerebro:webOidcSessionCookieName:
    type: string
    default: CerebroWebOidcSession
    description: Session cookie name used by ALB OIDC authentication for the web console
  cerebro:webOidcSessionTimeoutSeconds:
    type: integer
    default: 28800
    description: ALB OIDC session timeout in seconds for the web console
  cerebro:webCpu:
    type: integer
    default: 512
    description: Web console task CPU units
  cerebro:webMemory:
    type: integer
    default: 1024
    description: Web console task memory in MB
  cerebro:webMinInstances:
    type: integer
    default: 1
    description: Minimum web console instances
  cerebro:webMaxInstances:
    type: integer
    default: 1
    description: Maximum web console instances
  cerebro:webContainerPort:
    type: integer
    default: 3000
    description: Web console container port

  cerebro:apiCpu:
    type: integer
    default: 1024
    description: API task CPU units
  cerebro:apiMemory:
    type: integer
    default: 2048
    description: API task memory in MB
  cerebro:apiMinInstances:
    type: integer
    default: 1
    description: Minimum API instances
  cerebro:apiMaxInstances:
    type: integer
    default: 1
    description: Maximum API instances; values above 1 require cerebro:imageTag >= v2.1.25 (cross-task source-runtime cursor locking, writer/cerebro PR #554).
  cerebro:mcpOauthEnabled:
    type: boolean
    default: false
    description: Enable OAuth 2.1 authorization for MCP clients.
  cerebro:mcpOauthUpstreamIssuer:
    type: string
    default: ""
    description: Upstream OIDC issuer used to authenticate MCP users.
  cerebro:mcpOauthUpstreamRedirectUri:
    type: string
    default: ""
    description: Redirect URI registered with the upstream OIDC client for MCP OAuth.
  cerebro:mcpOauthUpstreamClientIdSecretName:
    type: string
    default: CEREBRO_MCP_OAUTH_UPSTREAM_CLIENT_ID
    description: Secret key under externalSecretsPrefix mounted as CEREBRO_MCP_OAUTH_UPSTREAM_CLIENT_ID.
  cerebro:mcpOauthUpstreamClientSecretName:
    type: string
    default: CEREBRO_MCP_OAUTH_UPSTREAM_CLIENT_SECRET
    description: Secret key under externalSecretsPrefix mounted as CEREBRO_MCP_OAUTH_UPSTREAM_CLIENT_SECRET.
  cerebro:mcpOauthSecurityGroups:
    type: array
    items:
      type: string
    default: []
    description: Upstream OIDC group names allowed to obtain MCP OAuth tokens.
  cerebro:mcpOauthTenantId:
    type: string
    default: ""
    description: Tenant assigned to MCP OAuth-issued access tokens.
  cerebro:mcpOauthAllowedTenants:
    type: array
    items:
      type: string
    default: []
    description: Tenant allowlist assigned to MCP OAuth-issued access tokens.
  cerebro:apiRequestCountPerTargetScalingTarget:
    type: integer
    default: 0
    description: Optional ALB request-count-per-target autoscaling target for the API service; 0 disables this policy.
  cerebro:apiRequestCountPerTargetAlarmThreshold:
    type: integer
    default: 0
    description: Optional ALB RequestCountPerTarget saturation alarm threshold per 5-minute period; 0 disables this alarm.
  cerebro:apiLatencyP95AlarmThresholdSeconds:
    type: integer
    default: 3
    description: API ALB p95 target response time alarm threshold in seconds; 0 disables this alarm.
  cerebro:webLatencyP95AlarmThresholdSeconds:
    type: integer
    default: 3
    description: Web console ALB p95 target response time alarm threshold in seconds; 0 disables this alarm.
  cerebro:dashboardLatencyP95AlarmThresholdMs:
    type: integer
    default: 3000
    description: GRC dashboard application p95 latency alarm threshold in milliseconds; 0 disables this alarm.

  cerebro:postgresInstanceClass:
    type: string
    default: db.t4g.micro
    description: RDS Postgres instance class
  cerebro:postgresAllocatedStorage:
    type: integer
    default: 20
    description: RDS Postgres allocated storage in GB
  cerebro:postgresStorageType:
    type: string
    default: gp3
    description: RDS Postgres storage type
  cerebro:postgresMaxAllocatedStorage:
    type: integer
    default: 0
    description: RDS Postgres autoscaling storage ceiling in GB
  cerebro:postgresIops:
    type: integer
    default: 0
    description: RDS Postgres provisioned IOPS for storage types that support it
  cerebro:postgresStorageThroughput:
    type: integer
    default: 0
    description: RDS Postgres provisioned storage throughput in MiB/s for storage types that support it
  cerebro:postgresBackupRetentionDays:
    type: integer
    default: 7
    description: RDS Postgres backup retention in days
  cerebro:postgresDeletionProtection:
    type: boolean
    default: false
    description: Enable RDS deletion protection and final snapshot
  cerebro:postgresMultiAz:
    type: boolean
    default: false
    description: Deploy RDS Postgres in Multi-AZ mode
  cerebro:postgresApplyImmediately:
    type: boolean
    default: false
    description: Apply RDS modifications immediately instead of waiting for the maintenance window
  cerebro:postgresFinalSnapshotIdentifier:
    type: string
    default: ""
    description: Optional final snapshot identifier used when deletion protection requires a final snapshot
  cerebro:retainLegacyJobsTableForDeletionProtectionTransition:
    type: boolean
    default: false
    description: Temporarily retain the legacy DynamoDB jobs table while disabling its deletion protection

  cerebro:natsCpu:
    type: integer
    default: 512
    description: NATS task CPU units
  cerebro:natsMemory:
    type: integer
    default: 1024
    description: NATS task memory in MB
  cerebro:jetstreamSubjectPrefix:
    type: string
    default: events
    description: JetStream subject prefix used by Cerebro
  cerebro:jetstreamStreamName:
    type: string
    default: CEREBRO_EVENTS
    description: JetStream stream name bootstrapped for Cerebro events
  cerebro:enableJetstreamLagProbe:
    type: boolean
    default: true
    description: Emit JetStream stream depth and consumer lag metrics from the NATS ECS task
  cerebro:jetstreamLagProbeIntervalSeconds:
    type: integer
    default: 60
    description: Poll interval for the JetStream lag probe sidecar
  cerebro:jetstreamLagAlarmThreshold:
    type: integer
    default: 10000
    description: CloudWatch alarm threshold for aggregate JetStream consumer lag
  cerebro:accessAuditDeniedAlarmThreshold:
    type: integer
    default: 0
    description: Optional CloudWatch alarm threshold for API access denials per 5-minute period; 0 disables the alarm
  cerebro:accessAuditAuthFailureAlarmThreshold:
    type: integer
    default: 0
    description: Optional CloudWatch alarm threshold for unauthenticated API access attempts per 5-minute period; 0 disables the alarm
  cerebro:accessAuditTenantMismatchAlarmThreshold:
    type: integer
    default: -1
    description: Optional CloudWatch alarm threshold for API requests whose requested tenant differs from the authenticated principal per 5-minute period; -1 disables the alarm, 0 alerts on any occurrence
  cerebro:accessAuditSensitiveDeniedAlarmThreshold:
    type: integer
    default: -1
    description: Optional CloudWatch alarm threshold for denied sensitive API actions per 5-minute period; -1 disables the alarm, 0 alerts on any occurrence
  cerebro:alarmActionArns:
    type: array
    items:
      type: string
    default: []
    description: Additional SNS-compatible CloudWatch alarm action ARNs
  cerebro:alarmEmailSubscriptions:
    type: array
    items:
      type: string
    default: []
    description: Email addresses subscribed to the stack alarm SNS topic
  cerebro:neo4jDatabase:
    type: string
    default: ""
    description: Optional Neo4j/Aura database name; empty uses the server default
  cerebro:neo4jAuraEnabled:
    type: boolean
    default: false
    description: Provision Neo4j Aura and runtime graph/API secrets
  cerebro:neo4jAuraInstanceId:
    type: string
    default: ""
    description: Existing Neo4j Aura instance ID to import
  cerebro:neo4jAuraInstanceName:
    type: string
    default: ""
    description: Neo4j Aura instance name
  cerebro:neo4jAuraCloudProvider:
    type: string
    default: gcp
    description: Neo4j Aura cloud provider
  cerebro:neo4jAuraRegion:
    type: string
    default: us-central1
    description: Neo4j Aura region
  cerebro:neo4jAuraMemory:
    type: string
    default: 8GB
    description: Neo4j Aura memory allocation
  cerebro:neo4jAuraVersion:
    type: string
    default: "5"
    description: Neo4j Aura major version
  cerebro:neo4jAuraType:
    type: string
    default: professional-db
    description: Neo4j Aura instance type
  cerebro:neo4jAuraVectorOptimized:
    type: boolean
    default: true
    description: Enable Neo4j Aura vector optimization
  cerebro:neo4jAuraClientId:
    type: string
    default: ""
    description: Neo4j Aura API client ID
  cerebro:neo4jAuraClientSecret:
    type: string
    default: ""
    description: Neo4j Aura API client secret
  cerebro:neo4jAuraProjectId:
    type: string
    default: ""
    description: Neo4j Aura project ID
  cerebro:neo4jAuraPassword:
    type: string
    default: ""
    description: Existing Neo4j Aura database password
  cerebro:neo4jSecretImportArns:
    type: object
    default: {}
    description: Existing AWS Secrets Manager secret ARNs to import by key
  cerebro:apiKeys:
    type: string
    default: ""
    description: Existing API key material for CEREBRO_API_KEYS
  cerebro:apiCredentialsSecretName:
    type: string
    default: CEREBRO_API_CREDENTIALS_JSON
    description: Optional secret key under externalSecretsPrefix mounted into the API as CEREBRO_API_CREDENTIALS_JSON for structured credentials
  cerebro:apiAuthEnabled:
    type: boolean
    default: false
    description: Enable API key authentication for non-public routes
  cerebro:allowedTenants:
    type: array
    items:
      type: string
    default: []
    description: Optional tenant allowlist for unscoped API keys
  cerebro:capabilityTokenSecretName:
    type: string
    default: CEREBRO_CAPABILITY_TOKEN_SECRETS
    description: Secret key under externalSecretsPrefix mounted into the API as CEREBRO_CAPABILITY_TOKEN_SECRETS
  cerebro:capabilityTokenAudience:
    type: string
    default: cerebro-api
    description: Expected audience for HMAC capability tokens accepted by the API
  cerebro:sourceSecretKeys:
    type: array
    items:
      type: string
    default: []
    description: "Additional ECS secret env vars sourced from {infisicalSecretsPrefix}/<key> for source runtime env: references"
  cerebro:infisicalSecretsPrefix:
    type: string
    default: ""
    description: Secrets Manager prefix for Infisical-synced runtime inputs; keep separate from Pulumi-managed generated secrets when prune/delete is enabled
  cerebro:sourceRuntimes:
    type: array
    items:
      type: object
    default: []
    description: Declarative source runtime definitions bootstrapped before the API container starts
  cerebro:sourceRuntimeRollouts:
    type: array
    items:
      type: object
    default: []
    description: Compact source runtime rollout definitions expanded into sourceSecretKeys, sourceRuntimes, and orchestratorSchedules
  cerebro:temporarilyDisabledSourceRuntimes:
    type: array
    items:
      type: object
      required:
        - runtimeId
        - owner
        - reason
        - disabledDate
        - reviewDeadline
        - reenableCriteria
      properties:
        runtimeId:
          type: string
        owner:
          type: string
        reason:
          type: string
          enum:
            - invalid_credentials
            - missing_secret
            - upstream_auth_failure
            - upstream_rate_limit
            - upstream_schema_drift
            - runtime_contract_mismatch
            - bootstrap_payload_stale
            - task_failure
            - graph_ingest_failure
            - manual_operator_action
        disabledDate:
          type: string
        reviewDeadline:
          type: string
        reenableCriteria:
          type: string
    default: []
    description: Structured runtime quarantine metadata for source runtime IDs excluded from bootstrap and schedules while upstream credentials or runtime health are repaired
  cerebro:shutdownTimeout:
    type: string
    default: 10s
    description: Graceful shutdown timeout parsed by the Go runtime
  cerebro:orchestratorEnabled:
    type: boolean
    default: false
    description: Enable an EventBridge-scheduled ECS task that runs Cerebro source sync, finding evaluation, and graph ingest
  cerebro:orchestratorScheduleExpression:
    type: string
    default: "rate(1 hour)"
    description: EventBridge schedule expression for the Cerebro orchestrator task
  cerebro:orchestratorCpu:
    type: integer
    default: 1024
    description: Orchestrator task CPU units
  cerebro:orchestratorMemory:
    type: integer
    default: 2048
    description: Orchestrator task memory in MB
  cerebro:orchestratorCommand:
    type: array
    items:
      type: string
    default:
      - orchestrator
      - run
    description: Command passed to the Cerebro container entrypoint for orchestrator runs
  cerebro:orchestratorTaskCount:
    type: integer
    default: 1
    description: Number of Fargate tasks launched per default orchestrator schedule tick
  cerebro:orchestratorSchedules:
    type: array
    items:
      type: object
    default: []
    description: Optional named orchestrator schedules with independent commands and task counts
  cerebro:enableTailscale:
    type: boolean
    default: false
    description: Enable a Tailscale subnet router for internal VPC access
  cerebro:tailscaleAdvertiseRoutes:
    type: array
    items:
      type: string
    default: []
    description: CIDR routes advertised by the Tailscale subnet router
  cerebro:tailscaleHostname:
    type: string
    default: ""
    description: Hostname for the Tailscale subnet router
  cerebro:tailscaleAuthKeySecretName:
    type: string
    default: ""
    description: Existing Secrets Manager secret name containing a Tailscale auth key

  cerebro:enableWaf:
    type: boolean
    default: true
    description: Enable AWS WAF
  cerebro:enableAlbAccessLogs:
    type: boolean
    default: false
    description: Enable ALB access logs to S3
  cerebro:albAccessLogsRetentionDays:
    type: integer
    default: 30
    description: Number of days to retain ALB access log objects in S3
  cerebro:albIdleTimeoutSeconds:
    type: integer
    default: 300
    description: API ALB idle timeout in seconds for long-lived HTTP/SSE streams
  cerebro:albInternal:
    type: boolean
    default: true
    description: Deploy ALB as internal-only
  cerebro:webAlbIdleTimeoutSeconds:
    type: integer
    default: 300
    description: Web console ALB idle timeout in seconds for long-lived HTTP/SSE streams
  cerebro:albIngressCidrs:
    type: array
    items:
      type: string
    default: []
    description: CIDR ranges allowed to access the ALB; defaults to VPC CIDR for internal ALBs
  cerebro:logRetentionDays:
    type: integer
    default: 30
    description: CloudWatch log retention in days
