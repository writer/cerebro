name: cerebro-gcp
runtime:
  name: python
  options:
    toolchain: uv
    virtualenv: ../.venv
description: GCP infrastructure for Cerebro Security Platform (WIF + scanner)

# Config keys used by __main__.py (under the "cerebro" namespace, not the
# project name, so they cannot carry type definitions in this schema):
#   cerebro:trustedAwsAccountId   - AWS account ID trusted for WIF federation
#   cerebro:trustedAwsRoleArns    - list of AWS IAM role ARNs (task + worker)
#   cerebro:wifPoolId             - WIF pool ID (default: cerebro-aws-pool)
#   cerebro:wifProviderId         - WIF provider ID (default: cerebro-aws-provider)
#   cerebro:scannerServiceAccountId - scanner SA ID (default: cerebro-scanner)
#   cerebro:scannerRoleProjects   - list of GCP project IDs to grant scanner roles in
#   cerebro:scannerRoles          - list of IAM roles to grant the scanner SA per project
