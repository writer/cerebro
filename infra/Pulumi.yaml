name: cerebro
runtime:
  name: python
  options:
    toolchain: uv
    virtualenv: .venv
description: Infrastructure for Cerebro Security Platform (Go)

config:
  cerebro:environment:
    type: string
    default: production
    description: Environment name (dev, staging, production)

  cerebro:domain:
    type: string
    default: ""
    description: Custom domain for Cerebro API (optional)

  cerebro:containerImage:
    type: string
    default: "073877318660.dkr.ecr.us-east-1.amazonaws.com/cerebro:latest"
    description: Container image URI (ECR), defaults to latest in ECR

  # Snowflake connection (optional - app falls back to SQLite)
  cerebro:snowflakeConnectionString:
    type: string
    secret: true
    description: Snowflake connection string (optional, uses SQLite if not set)

  cerebro:snowflakeDatabase:
    type: string
    default: CEREBRO
    description: Snowflake database name

  cerebro:snowflakeSchema:
    type: string
    default: RAW
    description: Snowflake schema name

  # ECS sizing
  cerebro:apiCpu:
    type: integer
    default: 1024
    description: API task CPU units (1024 = 1 vCPU)

  cerebro:apiMemory:
    type: integer
    default: 2048
    description: API task memory in MB

  cerebro:apiMinInstances:
    type: integer
    default: 2
    description: Minimum API instances

  cerebro:apiMaxInstances:
    type: integer
    default: 10
    description: Maximum API instances

  # Optional integrations - set via: pulumi config set --secret cerebro:anthropicApiKey "..."
  # These are NOT defined in schema so they're truly optional

  # Feature flags
  cerebro:enableWaf:
    type: boolean
    default: true
    description: Enable AWS WAF

  cerebro:albInternal:
    type: boolean
    default: true
    description: Deploy ALB as internal only

  cerebro:logRetentionDays:
    type: integer
    default: 30
    description: CloudWatch log retention in days
