name: cerebro
runtime: python
description: Infrastructure for Cerebro Security Platform (Go)

config:
  cerebro:environment:
    type: string
    default: production
    description: Environment name (dev, staging, production)

  cerebro:domain:
    type: string
    default: ""
    description: Custom domain for Cerebro API (optional)

  cerebro:containerImage:
    type: string
    description: Container image URI (ECR)

  # Snowflake connection (required)
  cerebro:snowflakeConnectionString:
    type: string
    secret: true
    description: Snowflake connection string

  cerebro:snowflakeDatabase:
    type: string
    default: CEREBRO
    description: Snowflake database name

  cerebro:snowflakeSchema:
    type: string
    default: RAW
    description: Snowflake schema name

  # ECS sizing
  cerebro:apiCpu:
    type: integer
    default: 1024
    description: API task CPU units (1024 = 1 vCPU)

  cerebro:apiMemory:
    type: integer
    default: 2048
    description: API task memory in MB

  cerebro:apiMinInstances:
    type: integer
    default: 2
    description: Minimum API instances

  cerebro:apiMaxInstances:
    type: integer
    default: 10
    description: Maximum API instances

  # Optional integrations
  cerebro:anthropicApiKey:
    type: string
    secret: true
    description: Anthropic API key for AI agents

  cerebro:openaiApiKey:
    type: string
    secret: true
    description: OpenAI API key for AI agents

  cerebro:slackWebhookUrl:
    type: string
    secret: true
    description: Slack webhook URL for notifications

  cerebro:jiraBaseUrl:
    type: string
    description: Jira base URL

  cerebro:jiraEmail:
    type: string
    description: Jira email

  cerebro:jiraApiToken:
    type: string
    secret: true
    description: Jira API token

  cerebro:jiraProject:
    type: string
    default: SEC
    description: Default Jira project key

  cerebro:linearApiKey:
    type: string
    secret: true
    description: Linear API key

  cerebro:linearTeamId:
    type: string
    description: Linear team ID

  # Feature flags
  cerebro:enableWaf:
    type: boolean
    default: true
    description: Enable AWS WAF

  cerebro:albInternal:
    type: boolean
    default: true
    description: Deploy ALB as internal only

  cerebro:logRetentionDays:
    type: integer
    default: 30
    description: CloudWatch log retention in days
