run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
  
  govet:
    enable-all: true
    disable:
      - fieldalignment  # too strict
  
  gosec:
    excludes:
      - G104  # Audit errors not checked (too noisy)
      - G304  # File path from variable (needed for config)
  
  goimports:
    local-prefixes: github.com/writerinternal/cerebro
  
  misspell:
    locale: US
  
  prealloc:
    simple: true
    for-loops: true

issues:
  exclude-rules:
    # Exclude some linters from running on tests
    - path: _test\.go
      linters:
        - gosec
        - unparam
        - errcheck  # tests often ignore errors intentionally
    
    # Exclude known issues in generated files
    - path: internal/api/server\.go
      linters:
        - funlen  # handlers can be long
    
    # Type assertions in cache are safe (controlled internally)
    - path: internal/cache/cache\.go
      linters:
        - errcheck
    
    # JSON unmarshal in store is best-effort
    - path: internal/findings/snowflake_store\.go
      linters:
        - errcheck
    
  max-issues-per-linter: 50
  max-same-issues: 3

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
