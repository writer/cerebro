version: "2"

run:
  timeout: 15m
  tests: true

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - errorlint
    - misspell
    - gosec
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - nilerr
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - noctx
      # Source connector packages enumerate resource families, attribute
      # mappings, and OAuth method identifiers whose names include
      # "secret"/"credential"/"token" as data, not credential material. Real
      # credentials are always env: references, enforced by review and gitleaks.
      - path: ^sources/
        linters:
          - gosec
        text: G101

formatters:
  enable:
    - goimports
