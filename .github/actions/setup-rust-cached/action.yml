name: Set up cached Rust toolchain
description: Install the repository Rust toolchain and restore shared Cargo caches.

# Pull requests only restore caches. Repository cache storage is capped, and
# per-PR saves evict the main-branch caches every PR restores from, which leaves
# every job compiling from scratch. Only designated producers on main save.

inputs:
  cache-scope:
    description: Cache family to restore. Jobs that compile the same crates should share one family.
    required: false
    default: workspace
  save-cache:
    description: Save the Cargo cache on main. Set only on the job that compiles the whole family.
    required: false
    default: "false"
  components:
    description: Comma-separated rustup components.
    required: false
    default: ""
  target:
    description: Optional rustup compilation target.
    required: false
    default: ""
  install-policy-tools:
    description: Install the pinned dependency-policy and coverage tools.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        args=(toolchain install 1.93.1 --profile minimal)
        if [ -n "${COMPONENTS}" ]; then
          args+=(--component "${COMPONENTS}")
        fi
        if [ -n "${TARGET}" ]; then
          args+=(--target "${TARGET}")
        fi
        rustup "${args[@]}"

    - name: Disable incremental compilation
      shell: bash
      # CI builds start from restored artifacts, never from incremental state;
      # incremental data only inflates the cached target directory.
      run: echo "CARGO_INCREMENTAL=0" >> "${GITHUB_ENV}"

    - name: Compute cache generation
      id: generation
      shell: bash
      # A weekly generation lets main refresh caches whose lockfile hash has not
      # changed, so restored workspace artifacts do not drift arbitrarily far from HEAD.
      run: echo "week=$(date -u +%G-%V)" >> "${GITHUB_OUTPUT}"

    - name: Restore Rust build data
      if: inputs.save-cache != 'true' || github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-llvm-cov
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-${{ runner.arch }}-rust-v4-${{ inputs.cache-scope }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}-${{ steps.generation.outputs.week }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-rust-v4-${{ inputs.cache-scope }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}-
          ${{ runner.os }}-${{ runner.arch }}-rust-v4-${{ inputs.cache-scope }}-

    - name: Restore and save Rust build data
      if: inputs.save-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-llvm-cov
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-${{ runner.arch }}-rust-v4-${{ inputs.cache-scope }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}-${{ steps.generation.outputs.week }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-rust-v4-${{ inputs.cache-scope }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}-
          ${{ runner.os }}-${{ runner.arch }}-rust-v4-${{ inputs.cache-scope }}-

    - name: Install Rust dependency policy tool
      if: inputs.install-policy-tools == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! cargo deny --version 2>/dev/null | grep -Fxq 'cargo-deny 0.20.2'; then
          cargo install cargo-deny --version 0.20.2 --locked
        fi

    - name: Install Rust coverage tool
      if: inputs.install-policy-tools == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! cargo llvm-cov --version 2>/dev/null | grep -Fxq 'cargo-llvm-cov 0.8.7'; then
          cargo install cargo-llvm-cov --version 0.8.7 --locked
        fi
