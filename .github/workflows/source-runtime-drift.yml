name: Source Runtime Drift

on:
  schedule:
    - cron: '35 15 * * 1-5'
  workflow_dispatch:
    inputs:
      stack:
        description: AWS stack to compare
        required: true
        default: go-prod
        type: choice
        options:
          - sec-dev
          - go-prod
      max_age_hours:
        description: Warn when runtime activity fields are older than this many hours. Use 0 to disable.
        required: false
        default: '24'
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: source-runtime-drift-${{ github.event.inputs.stack || 'go-prod' }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check source runtime drift
    runs-on: ubuntu-latest
    env:
      CEREBRO_API_URL: ${{ secrets.CEREBRO_API_URL }}
      CEREBRO_API_KEY: ${{ secrets.CEREBRO_API_KEY }}
      CEREBRO_API_URL_GO_PROD: ${{ secrets.CEREBRO_API_URL_GO_PROD }}
      CEREBRO_API_KEY_GO_PROD: ${{ secrets.CEREBRO_API_KEY_GO_PROD }}
      CEREBRO_API_URL_SEC_DEV: ${{ secrets.CEREBRO_API_URL_SEC_DEV }}
      CEREBRO_API_KEY_SEC_DEV: ${{ secrets.CEREBRO_API_KEY_SEC_DEV }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        if: ${{ (github.event.inputs.stack || 'go-prod') == 'sec-dev' }}
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Configure AWS credentials (go-prod)
        if: ${{ (github.event.inputs.stack || 'go-prod') == 'go-prod' }}
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Check source role trust drift
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.stack || 'go-prod' }}
        run: |
          set -euo pipefail
          args=(--stack-file "aws/Pulumi.${STACK_NAME}.yaml" --same-account-only)
          uv run python scripts/verify_aws_scan_role_trust.py "${args[@]}"

      - name: Validate Tailscale credentials
        if: env.TAILSCALE_AUTHKEY == '' && env.TAILSCALE_OAUTH_CLIENT_ID != '' && env.TAILSCALE_OAUTH_CLIENT_SECRET != '' && env.TAILSCALE_TAGS == ''
        shell: bash
        run: |
          echo "::error::TAILSCALE_TAGS is required when using Tailscale OAuth credentials."
          exit 1

      - name: Connect to Tailscale with auth key
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          hostname: cerebro-source-runtime-drift

      - name: Connect to Tailscale with OAuth
        if: env.TAILSCALE_AUTHKEY == '' && env.TAILSCALE_OAUTH_CLIENT_ID != '' && env.TAILSCALE_OAUTH_CLIENT_SECRET != '' && env.TAILSCALE_TAGS != ''
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: ${{ env.TAILSCALE_TAGS }}
          hostname: cerebro-source-runtime-drift

      - name: Verify Tailscale connection
        if: env.TAILSCALE_AUTHKEY != '' || (env.TAILSCALE_OAUTH_CLIENT_ID != '' && env.TAILSCALE_OAUTH_CLIENT_SECRET != '' && env.TAILSCALE_TAGS != '')
        shell: bash
        run: sudo tailscale status --json | jq -e '.BackendState == "Running"'

      - name: Report runtime coverage
        shell: bash
        env:
          STACK_NAME: ${{ github.event.inputs.stack || 'go-prod' }}
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '24' }}
        run: |
          set -euo pipefail

          case "${STACK_NAME}" in
            go-prod)
              api_url="${CEREBRO_API_URL_GO_PROD:-${CEREBRO_API_URL:-}}"
              api_key="${CEREBRO_API_KEY_GO_PROD:-${CEREBRO_API_KEY:-}}"
              ;;
            sec-dev)
              api_url="${CEREBRO_API_URL_SEC_DEV:-${CEREBRO_API_URL:-}}"
              api_key="${CEREBRO_API_KEY_SEC_DEV:-${CEREBRO_API_KEY:-}}"
              ;;
            *)
              echo "::error::Unsupported stack ${STACK_NAME}"
              exit 1
              ;;
          esac

          if [ -z "${api_url}" ] || [ -z "${api_key}" ]; then
            echo "::error::CEREBRO_API_URL_${STACK_NAME^^} and CEREBRO_API_KEY_${STACK_NAME^^} secrets, or generic CEREBRO_API_URL/CEREBRO_API_KEY secrets, are required for live coverage checks."
            exit 1
          fi

          uv run --project infra python infra/scripts/source_runtime_coverage_report.py \
            --stack-file "infra/aws/Pulumi.${STACK_NAME}.yaml" \
            --tenant-id writer \
            --api-url "${api_url}" \
            --api-key "${api_key}" \
            --max-age-hours "${MAX_AGE_HOURS}" \
            --format markdown \
            --output "source-runtime-coverage-${STACK_NAME}.md" \
            --json-output "source-runtime-coverage-${STACK_NAME}.json" \
            --github-summary

      - name: Upload runtime coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-runtime-coverage-${{ github.event.inputs.stack || 'go-prod' }}
          path: |
            source-runtime-coverage-${{ github.event.inputs.stack || 'go-prod' }}.md
            source-runtime-coverage-${{ github.event.inputs.stack || 'go-prod' }}.json
          if-no-files-found: ignore

      - name: Check runtime drift
        shell: bash
        env:
          STACK_NAME: ${{ github.event.inputs.stack || 'go-prod' }}
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '24' }}
        run: |
          set -euo pipefail

          case "${STACK_NAME}" in
            go-prod)
              api_url="${CEREBRO_API_URL_GO_PROD:-${CEREBRO_API_URL:-}}"
              api_key="${CEREBRO_API_KEY_GO_PROD:-${CEREBRO_API_KEY:-}}"
              ;;
            sec-dev)
              api_url="${CEREBRO_API_URL_SEC_DEV:-${CEREBRO_API_URL:-}}"
              api_key="${CEREBRO_API_KEY_SEC_DEV:-${CEREBRO_API_KEY:-}}"
              ;;
            *)
              echo "::error::Unsupported stack ${STACK_NAME}"
              exit 1
              ;;
          esac

          if [ -z "${api_url}" ] || [ -z "${api_key}" ]; then
            echo "::error::CEREBRO_API_URL_${STACK_NAME^^} and CEREBRO_API_KEY_${STACK_NAME^^} secrets, or generic CEREBRO_API_URL/CEREBRO_API_KEY secrets, are required for live drift checks."
            exit 1
          fi

          export CEREBRO_API_URL="${api_url}"
          export CEREBRO_API_KEY="${api_key}"
          uv run --project infra python infra/scripts/check_source_runtime_drift.py \
            --stack-file "infra/aws/Pulumi.${STACK_NAME}.yaml" \
            --tenant-id writer \
            --max-age-hours "${MAX_AGE_HOURS}"
