name: telemetry-alerts

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Telemetry lookback window (days)"
        required: false
        default: "1"
      dry_run:
        description: "Force dry-run (true/false)"
        required: false
        default: "false"
      fail_on_severity:
        description: "Fail workflow when alerts meet severity (info/warning/critical/none)"
        required: false
        default: "critical"
      fail_on_alerts:
        description: "Fail workflow when any alerts trigger (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  run-telemetry-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WINDOW_DAYS: ${{ github.event.inputs.window_days || '1' }}
      FORCE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      FAIL_ON_SEVERITY_INPUT: ${{ github.event.inputs.fail_on_severity || '' }}
      FAIL_ON_ALERTS_INPUT: ${{ github.event.inputs.fail_on_alerts || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Evaluate telemetry prerequisites
        id: telemetry-check
        env:
          DATABASE_URL: ${{ secrets.CEREBRO_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Telemetry alerts skipping: DATABASE_URL secret not configured." >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run telemetry alerts orchestrator
        if: steps.telemetry-check.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.CEREBRO_DATABASE_URL }}
          REDIS_URL: ${{ secrets.CEREBRO_REDIS_URL }}
          SLACK_WEBHOOK: ${{ secrets.AUTONOMY_SLACK_WEBHOOK }}
          EMAIL_RECIPIENTS: ${{ secrets.TELEMETRY_ALERT_EMAILS }}
          FAIL_ON_SEVERITY_SECRET: ${{ secrets.TELEMETRY_ALERT_FAIL_SEVERITY }}
          FAIL_ON_ALERTS_SECRET: ${{ secrets.TELEMETRY_ALERT_FAIL_ON_ALERTS }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret is required to run telemetry alerts." >&2
            exit 1
          fi

          fail_on_severity="${FAIL_ON_SEVERITY_INPUT:-}";
          if [ -z "$fail_on_severity" ]; then
            fail_on_severity="${FAIL_ON_SEVERITY_SECRET:-}"
          fi

          fail_on_alerts="${FAIL_ON_ALERTS_INPUT:-}";
          if [ -z "$fail_on_alerts" ]; then
            fail_on_alerts="${FAIL_ON_ALERTS_SECRET:-}"
          fi

          args=(scripts/telemetry_alerts.py --window-days "$WINDOW_DAYS" --print-snapshot)

          if [ -n "${SLACK_WEBHOOK:-}" ]; then
            args+=(--slack-webhook "$SLACK_WEBHOOK")
          fi

          if [ -n "${EMAIL_RECIPIENTS:-}" ]; then
            IFS=',' read -ra recipients <<< "$EMAIL_RECIPIENTS"
            for recipient in "${recipients[@]}"; do
              args+=(--email-recipient "$recipient")
            done
          fi

          if [ -n "${REDIS_URL:-}" ]; then
            args+=(--redis-url "$REDIS_URL")
          fi

          dry_run_flag="${FORCE_DRY_RUN,,}"
          if [ "$dry_run_flag" = "true" ]; then
            args+=(--dry-run)
          elif [ -z "${SLACK_WEBHOOK:-}" ] && [ -z "${EMAIL_RECIPIENTS:-}" ]; then
            echo "No delivery targets configured; running in dry-run mode." >&2
            args+=(--dry-run)
          fi

          if [ -n "$fail_on_alerts" ] && [ "${fail_on_alerts,,}" = "true" ]; then
            args+=(--fail-on-alerts)
          fi

          lower_severity="${fail_on_severity,,}"
          if [ -n "$lower_severity" ] && [ "$lower_severity" != "none" ]; then
            args+=(--fail-on-severity "$lower_severity")
          fi

          uv run python "${args[@]}"

      - name: Telemetry alerts skipped (missing secrets)
        if: steps.telemetry-check.outputs.run != 'true'
        run: echo "Telemetry alerts workflow completed without execution because required secrets are not configured."

      - name: Run producer audit snapshot
        run: |
          set -euo pipefail
          uv run python scripts/producer_audit.py --output-format json > producer_audit.json

      - name: Publish producer audit summary
        run: |
          python - <<'PY'
import json
import os
from pathlib import Path

records = json.loads(Path("producer_audit.json").read_text(encoding="utf-8"))
total = len(records)
missing_builder = [r for r in records if not r.get("builder_used")]
missing_context = [r for r in records if not r.get("run_context_normalized")]

summary_lines = [
    "## Producer Audit Snapshot",
    f"- Producers audited: {total}",
    f"- Missing standardized builder: {len(missing_builder)}",
    f"- Missing ProducerRunContext.ensure: {len(missing_context)}",
]

if missing_builder:
    preview = ", ".join(record["name"] for record in missing_builder[:10])
    summary_lines.append("")
    summary_lines.append("### Builder gaps (first 10)")
    summary_lines.append(preview)

if missing_context:
    preview = ", ".join(record["name"] for record in missing_context[:10])
    summary_lines.append("")
    summary_lines.append("### Context normalization gaps (first 10)")
    summary_lines.append(preview)

summary = "\n".join(summary_lines) + "\n"
print(summary)

summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
if summary_path:
    with Path(summary_path).open("a", encoding="utf-8") as handle:
        handle.write(summary)

has_gaps = bool(missing_builder or missing_context)
Path("producer_audit_status.txt").write_text("gap" if has_gaps else "ok", encoding="utf-8")
PY

      - name: Send producer audit Slack alert
        if: github.event_name == 'schedule'
        env:
          SLACK_WEBHOOK: ${{ secrets.AUTONOMY_SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "Slack webhook not configured; skipping producer audit alert."
            exit 0
          fi

          STATUS="$(cat producer_audit_status.txt)"
          payload=$(python - <<'PY'
import json
from pathlib import Path

records = json.loads(Path("producer_audit.json").read_text(encoding="utf-8"))
missing_builder = [r for r in records if not r.get("builder_used")]
missing_context = [r for r in records if not r.get("run_context_normalized")]

if missing_builder or missing_context:
    status_line = "Audit gaps detected across finding producers."
else:
    status_line = "Producer audit passed with all required builders and context normalization."

details = [
    status_line,
    f"Missing builder: {len(missing_builder)}",
    f"Missing context normalization: {len(missing_context)}",
]

preview = []
for record in missing_builder[:5]:
    preview.append(f"🔧 {record['name']}")
for record in missing_context[:5]:
    preview.append(f"🧭 {record['name']}")

if preview:
    details.append("Preview: " + ", ".join(preview))

print(json.dumps({"text": "\n".join(details)}))
PY
)

          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK"
