name: Jira Ticket Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-jira-ticket:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check PR title for Jira ticket ID
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /[A-Z]{2,10}-[0-9]+/;
            const match = title.match(pattern);

            if (match) {
              console.log(`Found Jira ticket: ${match[0]} in PR title`);
              return;
            }

            if (/NOJIRA/i.test(title)) {
              console.log('Bypass: NOJIRA found in PR title');
              return;
            }

            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (labels.includes('no-jira')) {
              console.log('Bypass: no-jira label found');
              return;
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Jira Ticket ID Missing')
            );

            if (botComment) {
              console.log('Warning comment already posted, skipping duplicate');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `**Jira Ticket ID Missing**`,
                ``,
                `This PR title doesn't contain a Jira ticket ID (e.g., \`WE-1234\`, \`ACTION-567\`).`,
                ``,
                `Please update your PR title to include one:`,
                `\`ACTION-1234: Fix playbook bug\``,
                ``,
                `If this PR intentionally has no ticket, include \`NOJIRA\` in the title or add the \`no-jira\` label.`,
                ``,
                `_This is a warning and does not block merging._`,
              ].join('\n'),
            });

            console.log('Posted warning comment');
