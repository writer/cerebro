name: Generated Docs Refresh

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'PR branch to update'
        required: true
        type: string
      base_branch:
        description: 'Base branch to merge before regenerating'
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: generated-docs-refresh-${{ inputs.branch }}
  cancel-in-progress: false

env:
  # Fall back to direct module fetches when proxy.golang.org returns a
  # transient error; go.sum still verifies every module either way.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to update protected base directly
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          case "${TARGET_BRANCH}" in
            main|master)
              echo "Refusing to push generated-doc refresh directly to protected branch ${TARGET_BRANCH}" >&2
              exit 1
              ;;
          esac
          if [ "${TARGET_BRANCH}" = "${BASE_BRANCH}" ]; then
            echo "Refusing to push generated-doc refresh directly to ${BASE_BRANCH}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown

      - name: Merge base and regenerate generated artifacts
        id: refresh
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          start_sha="$(git rev-parse HEAD)"
          git fetch origin "${BASE_BRANCH}" "${TARGET_BRANCH}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" merge --no-edit "origin/${BASE_BRANCH}"
          make docs-autogen
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh generated docs"
          fi
          if [ "$(git rev-parse HEAD)" != "${start_sha}" ]; then
            git push origin "HEAD:${TARGET_BRANCH}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package policy compliance mapping workbook
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/policy-compliance-mapping.tar.gz" \
            -C tmp/policy-compliance-mapping .

      - name: Publish policy compliance mapping workbook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: policy-compliance-mapping-${{ github.run_id }}
          path: ${{ runner.temp }}/policy-compliance-mapping.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Report result
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          PUSHED: ${{ steps.refresh.outputs.pushed }}
        run: |
          if [ "${PUSHED}" = "true" ]; then
            echo "Generated docs refresh pushed to ${TARGET_BRANCH}."
          else
            echo "No generated docs refresh was needed for ${TARGET_BRANCH}."
          fi
