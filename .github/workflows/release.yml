name: Stable Release
# The run name carries the reserved tag and candidate run so dispatchers can
# find this run by title. A workflow_dispatch run's headSha is the head of the
# dispatch ref at dispatch time, not the candidate, so headSha cannot be used.
run-name: Stable Release ${{ inputs.release_tag || github.ref_name }} (candidate run ${{ inputs.candidate_run_id || github.run_id }})

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Candidate Build run ID
        required: true
        type: string
      release_tag:
        description: Stable tag in vMAJOR.MINOR.PATCH form
        required: true
        type: string
      release_notes:
        description: Completed release notes with every required section
        required: true
        type: string
      smoke_receipt_url:
        description: Successful canary or production smoke receipt URL
        required: true
        type: string
      require_current_main:
        description: Reject promotion if the candidate is no longer current main
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stable-release-publication
  cancel-in-progress: false

env:
  # Fall back to direct module fetches when proxy.golang.org returns a
  # transient error; go.sum still verifies every module either way.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.run.outputs.sha }}
      image: ${{ steps.receipt.outputs.image }}
      digest: ${{ steps.receipt.outputs.digest }}
      web_image: ${{ steps.receipt.outputs.web_image }}
      web_digest: ${{ steps.receipt.outputs.web_digest }}
      product_manifest_sha256: ${{ steps.receipt.outputs.product_manifest_sha256 }}
      smoke_evidence_mode: ${{ steps.smoke.outputs.mode }}
    steps:
      - name: Validate release tag and candidate run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release_tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ERROR: release tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          workflow_path="$(jq -r .path <<< "${run}")"
          conclusion="$(jq -r .conclusion <<< "${run}")"
          event="$(jq -r .event <<< "${run}")"
          head_sha="$(jq -r .head_sha <<< "${run}")"
          if [ "${workflow_path}" != ".github/workflows/cut-release.yml" ] || [ "${conclusion}" != success ]; then
            echo "ERROR: run ${CANDIDATE_RUN_ID} is not a successful Candidate Build" >&2
            exit 1
          fi
          if [ "${event}" != push ] && [ "${event}" != workflow_dispatch ]; then
            echo "ERROR: candidate run event ${event} is not allowed" >&2
            exit 1
          fi
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100")"
          candidate_artifacts="$(
            jq -c '[.artifacts[] | select(.expired == false) | .name | select(test("^cerebro-candidate-[0-9a-f]{40}$"))]' <<< "${artifacts}"
          )"
          if [ "$(jq 'length' <<< "${candidate_artifacts}")" -ne 1 ]; then
            echo "ERROR: run ${CANDIDATE_RUN_ID} must contain exactly one unexpired candidate artifact" >&2
            exit 1
          fi
          artifact_name="$(jq -r '.[0]' <<< "${candidate_artifacts}")"
          sha="${artifact_name#cerebro-candidate-}"
          if [ "${event}" = push ] && [ "${sha}" != "${head_sha}" ]; then
            echo "ERROR: push candidate artifact ${sha} does not match run head ${head_sha}" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cerebro-candidate-${{ steps.run.outputs.sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate receipt and bundle
        id: receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.run.outputs.sha }}
          EXPECTED_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          test "$(jq -r .schema_version candidate/candidate-receipt.json)" = "cerebro.release-candidate/v1"
          test "$(jq -r .commit candidate/candidate-receipt.json)" = "${EXPECTED_SHA}"
          test "$(jq -r .run_id candidate/candidate-receipt.json)" = "${EXPECTED_RUN_ID}"
          (cd candidate && sha256sum -c bundle-checksums.txt)
          image="$(jq -r .image candidate/candidate-receipt.json)"
          digest="$(jq -r .image_digest candidate/candidate-receipt.json)"
          web_image="$(jq -r .web_image candidate/candidate-receipt.json)"
          web_digest="$(jq -r .web_image_digest candidate/candidate-receipt.json)"
          product_manifest_sha256="$(jq -r .product_manifest_sha256 candidate/candidate-receipt.json)"
          rust_e2e_receipt_sha256="$(jq -r .rust_e2e_receipt_sha256 candidate/candidate-receipt.json)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${web_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${product_manifest_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${rust_e2e_receipt_sha256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum candidate/cerebro-product-release.json | awk '{print $1}')" = "${product_manifest_sha256}"
          test "$(sha256sum candidate/rust-organizational-e2e-receipt.json | awk '{print $1}')" = \
            "${rust_e2e_receipt_sha256}"
          test "$(jq -r .schema_version candidate/rust-organizational-e2e-receipt.json)" = \
            "cerebro.rust-organizational-e2e/v1"
          test "$(jq -r .status candidate/rust-organizational-e2e-receipt.json)" = passed
          test "$(jq -r .commit candidate/rust-organizational-e2e-receipt.json)" = "${EXPECTED_SHA}"
          test "$(jq -r .image_digest candidate/rust-organizational-e2e-receipt.json)" = "${digest}"
          {
            echo "image=${image}"
            echo "digest=${digest}"
            echo "web_image=${web_image}"
            echo "web_digest=${web_digest}"
            echo "product_manifest_sha256=${product_manifest_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Validate release notes and stable checks
        id: smoke
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SMOKE_RECEIPT_URL: ${{ inputs.smoke_receipt_url }}
          SMOKE_RECEIPT_ALLOWED_ORIGINS: ${{ vars.SMOKE_RECEIPT_ALLOWED_ORIGINS }}
          SMOKE_EVIDENCE_OUT: ${{ runner.temp }}/smoke-evidence.json
          CANDIDATE_SHA: ${{ steps.run.outputs.sha }}
          CANDIDATE_RUNTIME_DIGEST: ${{ steps.receipt.outputs.digest }}
          CANDIDATE_IMAGE: ${{ steps.receipt.outputs.image }}
          CANDIDATE_DIGEST: ${{ steps.receipt.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "${RELEASE_NOTES}" > release-notes.md
          scripts/release/validate_release_notes.sh release-notes.md
          grep -Fq "${SMOKE_RECEIPT_URL}" release-notes.md || {
            echo "ERROR: release notes do not contain smoke_receipt_url" >&2
            exit 1
          }
          SMOKE_NOTES_BOUND=true scripts/release/verify_smoke_receipt.sh
          smoke_evidence_mode="$(jq -r .evidence_mode "${SMOKE_EVIDENCE_OUT}")"
          grep -Fq "Evidence mode: \`${smoke_evidence_mode}\`" release-notes.md || {
            echo "ERROR: release notes do not record smoke evidence mode ${smoke_evidence_mode}" >&2
            exit 1
          }
          echo "mode=${smoke_evidence_mode}" >> "${GITHUB_OUTPUT}"
          python3 scripts/release/product_release.py validate candidate/cerebro-product-release.json --bundle-root candidate
          cosign verify-blob candidate/cerebro-product-release.json \
            --signature candidate/cerebro-product-release.json.sig \
            --certificate candidate/cerebro-product-release.json.pem \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cut-release.yml@refs/heads/main$"
          cosign verify-attestation \
            --type "https://writer.com/cerebro/rust-organizational-e2e/v1" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cut-release.yml@refs/heads/main$" \
            "${CANDIDATE_IMAGE}@${CANDIDATE_DIGEST}" >/dev/null
          make release-smoke docs-drift-check readme-check oss-audit

      - name: Upload verified smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-smoke-evidence-${{ steps.run.outputs.sha }}
          path: |
            ${{ runner.temp }}/smoke-evidence.json
            ${{ runner.temp }}/smoke-receipt.json
            ${{ runner.temp }}/smoke-receipt.json.sig
            ${{ runner.temp }}/smoke-receipt.json.pem
          if-no-files-found: error
          overwrite: true

  promote:
    runs-on: ubuntu-latest
    needs: verify-candidate
    environment: stable-release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      digest: ${{ needs.verify-candidate.outputs.digest }}
      web_digest: ${{ needs.verify-candidate.outputs.web_digest }}
      product_manifest_sha256: ${{ steps.product.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cerebro-candidate-${{ needs.verify-candidate.outputs.sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-smoke-evidence-${{ needs.verify-candidate.outputs.sha }}
          path: candidate
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: Verify and promote candidate images
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ needs.verify-candidate.outputs.image }}
          IMAGE_DIGEST: ${{ needs.verify-candidate.outputs.digest }}
          WEB_CANDIDATE_IMAGE: ${{ needs.verify-candidate.outputs.web_image }}
          WEB_IMAGE_DIGEST: ${{ needs.verify-candidate.outputs.web_digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REQUIRE_CURRENT_MAIN: ${{ inputs.require_current_main }}
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${REQUIRE_CURRENT_MAIN}" == true ]]; then
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [[ "${CANDIDATE_SHA}" != "${current_main}" ]]; then
              echo "ERROR: automatic candidate ${CANDIDATE_SHA} is superseded by main ${current_main}" >&2
              exit 1
            fi
          fi
          image_base="ghcr.io/${GITHUB_REPOSITORY}"
          web_image_base="ghcr.io/${GITHUB_REPOSITORY_OWNER}/cerebro-web"
          cosign verify "${image_base}@${IMAGE_DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cut-release.yml@refs/heads/main$"
          cosign verify "${web_image_base}@${WEB_IMAGE_DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cut-release.yml@refs/heads/main$"
          resolved="$(docker buildx imagetools inspect "${CANDIDATE_IMAGE}" --format '{{.Manifest.Digest}}')"
          test "${resolved}" = "${IMAGE_DIGEST}"
          web_resolved="$(docker buildx imagetools inspect "${WEB_CANDIDATE_IMAGE}" --format '{{.Manifest.Digest}}')"
          test "${web_resolved}" = "${WEB_IMAGE_DIGEST}"
          docker buildx imagetools create -t "${image_base}:${RELEASE_TAG}" "${image_base}@${IMAGE_DIGEST}"
          docker buildx imagetools create -t "${image_base}:latest" "${image_base}@${IMAGE_DIGEST}"
          docker buildx imagetools create -t "${web_image_base}:${RELEASE_TAG}" "${web_image_base}@${WEB_IMAGE_DIGEST}"
          docker buildx imagetools create -t "${web_image_base}:latest" "${web_image_base}@${WEB_IMAGE_DIGEST}"
          cosign sign --yes "${image_base}@${IMAGE_DIGEST}"
          cosign sign --yes "${web_image_base}@${WEB_IMAGE_DIGEST}"
      - name: Attest promoted image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.verify-candidate.outputs.digest }}
          push-to-registry: true
      - name: Attest promoted web image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cerebro-web
          subject-digest: ${{ needs.verify-candidate.outputs.web_digest }}
          push-to-registry: true
      - name: Render and sign stable product release
        id: product
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.sha }}
          RUNTIME_DIGEST: ${{ needs.verify-candidate.outputs.digest }}
          WEB_DIGEST: ${{ needs.verify-candidate.outputs.web_digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          slack_archive="$(find candidate -maxdepth 1 -type f -name 'writer-cerebro-slack-companion-*.tgz' -print -quit)"
          sdk_archive="$(find candidate -maxdepth 1 -type f -name 'writer-cerebro-sdk-*.tgz' -print -quit)"
          test -n "${slack_archive}"
          test -n "${sdk_archive}"
          python3 scripts/release/product_release.py build \
            --channel stable --version "${RELEASE_TAG}" --commit "${CANDIDATE_SHA}" \
            --runtime-image "ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_TAG}" --runtime-digest "${RUNTIME_DIGEST}" \
            --web-image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cerebro-web:${RELEASE_TAG}" --web-digest "${WEB_DIGEST}" \
            --slack-archive "${slack_archive}" --slack-version "$(jq -r .version apps/slack-companion/package.json)" \
            --sdk-archive "${sdk_archive}" --sdk-version "$(jq -r .version sdk/typescript/package.json)" \
            --openapi candidate/cerebro-openapi.yaml \
            --lifecycle-schema candidate/agent-service-lifecycle.schema.json \
            --bundle-root candidate --out candidate/cerebro-product-release.json
          cosign sign-blob --yes \
            --output-signature candidate/cerebro-product-release.json.sig \
            --output-certificate candidate/cerebro-product-release.json.pem \
            candidate/cerebro-product-release.json
          echo "sha256=$(sha256sum candidate/cerebro-product-release.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
      - name: Create and publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${RELEASE_NOTES}" > release-notes.md
          mapfile -t files < <(find candidate -type f \( -name '*.tar.gz' -o -name 'checksums.txt' \
            -o -name 'candidate-receipt.json' -o -name 'go-module-inventory.ndjson' \
            -o -name 'rust-organizational-e2e-receipt.json' \
            -o -name 'smoke-evidence.json' \
            -o -name 'smoke-receipt.json*' \
            -o -name '*.tgz' -o -name 'cerebro-product-release.json*' \
            -o -name 'cerebro-openapi.yaml' -o -name 'agent-service-lifecycle.schema.json' \
            -o -name 'product-release.schema.json' -o -name 'product-release-published.schema.json' \) | sort)
          gh release create "${RELEASE_TAG}" "${files[@]}" --target "${CANDIDATE_SHA}" \
            --title "Cerebro ${RELEASE_TAG}" --notes-file release-notes.md --draft
          gh release edit "${RELEASE_TAG}" --draft=false

  notify-release-consumer:
    runs-on: ubuntu-latest
    needs: [verify-candidate, promote]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}
          persist-credentials: false
      - name: Dispatch product release event
        shell: bash
        env:
          RELEASE_CONSUMER_TOKEN: ${{ secrets.RELEASE_CONSUMER_TOKEN || secrets.CEREBRO_INFRA_PROMOTION_TOKEN }}
          RELEASE_CONSUMER_REPOSITORY: ${{ vars.RELEASE_CONSUMER_REPOSITORY || secrets.CEREBRO_INFRA_REPOSITORY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.verify-candidate.outputs.sha }}
          MANIFEST_SHA256: ${{ needs.promote.outputs.product_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_CONSUMER_TOKEN}" ] && [ -z "${RELEASE_CONSUMER_REPOSITORY}" ]; then
            echo "No release consumer is configured; the signed public release is complete."
            exit 0
          fi
          if [ -z "${RELEASE_CONSUMER_TOKEN}" ] || [ -z "${RELEASE_CONSUMER_REPOSITORY}" ]; then
            echo "ERROR: configure both RELEASE_CONSUMER_TOKEN and RELEASE_CONSUMER_REPOSITORY" >&2
            exit 1
          fi
          if ! [[ "${RELEASE_CONSUMER_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: RELEASE_CONSUMER_REPOSITORY must be owner/repository" >&2
            exit 1
          fi
          python3 scripts/release/product_release.py event \
            --repository "${GITHUB_REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --release-commit "${RELEASE_COMMIT}" \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --out release-event.json
          python3 scripts/release/product_release.py validate-event release-event.json
          jq -n --slurpfile payload release-event.json \
            '{event_type:"product-release-published",client_payload:$payload[0]}' > dispatch.json
          test "$(jq '.client_payload | length' dispatch.json)" -eq 6
          export GH_TOKEN="${RELEASE_CONSUMER_TOKEN}"
          gh api --method POST "repos/${RELEASE_CONSUMER_REPOSITORY}/dispatches" --input dispatch.json
