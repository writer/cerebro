name: Stable Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Candidate Build run ID
        required: true
        type: string
      release_tag:
        description: Stable tag in vMAJOR.MINOR.PATCH form
        required: true
        type: string
      release_notes:
        description: Completed release notes with every required section
        required: true
        type: string
      smoke_receipt_url:
        description: Successful canary or production smoke receipt URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.run.outputs.sha }}
      image: ${{ steps.receipt.outputs.image }}
      digest: ${{ steps.receipt.outputs.digest }}
    steps:
      - name: Validate release tag and candidate run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release_tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ERROR: release tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          workflow_path="$(jq -r .path <<< "${run}")"
          conclusion="$(jq -r .conclusion <<< "${run}")"
          event="$(jq -r .event <<< "${run}")"
          sha="$(jq -r .head_sha <<< "${run}")"
          if [ "${workflow_path}" != ".github/workflows/cut-release.yml" ] || [ "${conclusion}" != success ]; then
            echo "ERROR: run ${CANDIDATE_RUN_ID} is not a successful Candidate Build" >&2
            exit 1
          fi
          if [ "${event}" != push ] && [ "${event}" != workflow_dispatch ]; then
            echo "ERROR: candidate run event ${event} is not allowed" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cerebro-candidate-${{ steps.run.outputs.sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate receipt and bundle
        id: receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.run.outputs.sha }}
          EXPECTED_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          test "$(jq -r .schema_version candidate/candidate-receipt.json)" = "cerebro.release-candidate/v1"
          test "$(jq -r .commit candidate/candidate-receipt.json)" = "${EXPECTED_SHA}"
          test "$(jq -r .run_id candidate/candidate-receipt.json)" = "${EXPECTED_RUN_ID}"
          (cd candidate && sha256sum -c bundle-checksums.txt)
          image="$(jq -r .image candidate/candidate-receipt.json)"
          digest="$(jq -r .image_digest candidate/candidate-receipt.json)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.run.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Validate release notes and stable checks
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SMOKE_RECEIPT_URL: ${{ inputs.smoke_receipt_url }}
        run: |
          printf '%s\n' "${RELEASE_NOTES}" > release-notes.md
          scripts/release/validate_release_notes.sh release-notes.md
          grep -Fq "${SMOKE_RECEIPT_URL}" release-notes.md || {
            echo "ERROR: release notes do not contain smoke_receipt_url" >&2
            exit 1
          }
          make release-smoke docs-drift-check readme-check oss-audit

  promote:
    runs-on: ubuntu-latest
    needs: verify-candidate
    environment: stable-release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      digest: ${{ needs.verify-candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cerebro-candidate-${{ needs.verify-candidate.outputs.sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: Verify and promote candidate image
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ needs.verify-candidate.outputs.image }}
          IMAGE_DIGEST: ${{ needs.verify-candidate.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image_base="ghcr.io/${GITHUB_REPOSITORY}"
          cosign verify "${image_base}@${IMAGE_DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cut-release.yml@refs/heads/main$"
          resolved="$(docker buildx imagetools inspect "${CANDIDATE_IMAGE}" --format '{{.Manifest.Digest}}')"
          test "${resolved}" = "${IMAGE_DIGEST}"
          docker buildx imagetools create -t "${image_base}:${RELEASE_TAG}" "${image_base}@${IMAGE_DIGEST}"
          docker buildx imagetools create -t "${image_base}:latest" "${image_base}@${IMAGE_DIGEST}"
          cosign sign --yes "${image_base}@${IMAGE_DIGEST}"
      - name: Attest promoted image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.verify-candidate.outputs.digest }}
          push-to-registry: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Render and sign stable runtime contracts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for target in sec-dev go-prod; do
            go run ./cmd/sourcedeploy -env "${target}" -tenant writer -format contract-json \
              -image-tag "${RELEASE_TAG}" -out "candidate/cerebro-runtime-contract-${target}.json"
            cosign sign-blob --yes \
              --output-signature "candidate/cerebro-runtime-contract-${target}.json.sig" \
              --output-certificate "candidate/cerebro-runtime-contract-${target}.json.pem" \
              "candidate/cerebro-runtime-contract-${target}.json"
          done
      - name: Create and publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${RELEASE_NOTES}" > release-notes.md
          mapfile -t files < <(find candidate -type f \( -name '*.tar.gz' -o -name 'checksums.txt' \
            -o -name 'candidate-receipt.json' -o -name 'go-module-inventory.ndjson' \
            -o -name 'cerebro-runtime-contract-*' \) | sort)
          gh release create "${RELEASE_TAG}" "${files[@]}" --target "${CANDIDATE_SHA}" \
            --title "Cerebro ${RELEASE_TAG}" --notes-file release-notes.md --draft
          gh release edit "${RELEASE_TAG}" --draft=false

  notify-infra:
    runs-on: ubuntu-latest
    needs: [verify-candidate, promote]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_environment: sec-dev
            apply_mode: direct_push
          - target_environment: go-prod
            apply_mode: pull_request
    steps:
      - name: Check Infisical bootstrap
        id: infisical
        shell: bash
        env:
          INFISICAL_ORG_IDENTITY_UUID: ${{ secrets.INFISICAL_ORG_IDENTITY_UUID }}
          INFISICAL_ORG_PROJECT_SLUG: ${{ secrets.INFISICAL_ORG_PROJECT_SLUG }}
          INFISICAL_REPO_IDENTITY_UUID: ${{ secrets.INFISICAL_REPO_IDENTITY_UUID }}
          INFISICAL_REPO_PROJECT_SLUG: ${{ secrets.INFISICAL_REPO_PROJECT_SLUG }}
        run: |
          set -euo pipefail
          missing=()
          for key in INFISICAL_ORG_IDENTITY_UUID INFISICAL_ORG_PROJECT_SLUG INFISICAL_REPO_IDENTITY_UUID INFISICAL_REPO_PROJECT_SLUG; do
            if [ -z "${!key:-}" ]; then
              missing+=("${key}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment credential bootstrap is incomplete; using the repository fallback."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Fetch organization release credentials
        if: steps.infisical.outputs.configured == 'true'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_ORG_IDENTITY_UUID }}
          oidc-audience: ${{ format('https://github.com/{0}', github.repository_owner) }}
          project-slug: ${{ secrets.INFISICAL_ORG_PROJECT_SLUG }}
          env-slug: prod
          export-type: env
      - name: Fetch repository release credentials
        if: steps.infisical.outputs.configured == 'true'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_REPO_IDENTITY_UUID }}
          oidc-audience: ${{ format('https://github.com/{0}', github.repository_owner) }}
          project-slug: ${{ secrets.INFISICAL_REPO_PROJECT_SLUG }}
          env-slug: prod
          export-type: env
      - name: Dispatch stable deployment request
        shell: bash
        env:
          GITHUB_CEREBRO_INFRA_PROMOTION_TOKEN: ${{ secrets.CEREBRO_INFRA_PROMOTION_TOKEN }}
          GITHUB_CEREBRO_INFRA_REPOSITORY: ${{ secrets.CEREBRO_INFRA_REPOSITORY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE_DIGEST: ${{ needs.promote.outputs.digest }}
          TARGET_ENVIRONMENT: ${{ matrix.target_environment }}
          APPLY_MODE: ${{ matrix.apply_mode }}
        run: |
          set -euo pipefail
          GH_TOKEN="${CEREBRO_INFRA_PROMOTION_TOKEN:-${GITHUB_CEREBRO_INFRA_PROMOTION_TOKEN:-}}"
          infra_repository="${CEREBRO_INFRA_REPOSITORY:-${GITHUB_CEREBRO_INFRA_REPOSITORY:-}}"
          export GH_TOKEN
          if [ -z "${GH_TOKEN}" ]; then
            echo "CEREBRO_INFRA_PROMOTION_TOKEN is not configured; no ${TARGET_ENVIRONMENT} dispatch was sent"
            exit 0
          fi
          if ! [[ "${infra_repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: CEREBRO_INFRA_REPOSITORY must be owner/repository" >&2
            exit 1
          fi
          handler="$(mktemp)"
          gh api "repos/${infra_repository}/contents/.github/workflows/propose-image-tag.yml?ref=main" --jq .content \
            | base64 -d > "${handler}"
          grep -Eq '^[[:space:]]*repository_dispatch:' "${handler}"
          grep -Eq 'cerebro-release-published' "${handler}"
          grep -Eq 'client_payload\.request_id' "${handler}"

          payload="$(mktemp)"
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          request_id="cerebro-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg tag "${RELEASE_TAG}" --arg digest "${IMAGE_DIGEST}" \
            --arg release_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --arg source_repository "${GITHUB_REPOSITORY}" --arg source_ref "refs/tags/${RELEASE_TAG}" \
            --arg request_id "${request_id}" \
            --arg target_environment "${TARGET_ENVIRONMENT}" --arg apply_mode "${APPLY_MODE}" \
            '{event_type:"cerebro-release-published",client_payload:{image_tag:$tag,image_digest:$digest,release_url:$release_url,source_repository:$source_repository,source_ref:$source_ref,request_id:$request_id,target_environment:$target_environment,apply_mode:$apply_mode}}' > "${payload}"
          test "$(jq '.client_payload | length' "${payload}")" -le 10
          gh api --method POST "repos/${infra_repository}/dispatches" --input "${payload}"

          deadline=$((SECONDS + 120))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            run_record="$(
              gh run list --repo "${infra_repository}" --workflow propose-image-tag.yml \
                --event repository_dispatch --limit 20 \
                --json databaseId,createdAt,displayTitle,url \
                | jq -r --arg requested_at "${requested_at}" --arg request_id "${request_id}" \
                  '.[] | select(.createdAt >= $requested_at and ((.displayTitle // "") | contains($request_id))) | [.databaseId, .url] | @tsv' \
                | head -n 1 || true
            )"
            if [ -n "${run_record}" ]; then
              IFS=$'\t' read -r run_id run_url <<< "${run_record}"
              echo "Dispatched ${TARGET_ENVIRONMENT} ${APPLY_MODE} deployment request for ${RELEASE_TAG}@${IMAGE_DIGEST}: ${run_url} (run ${run_id})"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: repository_dispatch was accepted, but no matching propose-image-tag.yml run appeared for ${TARGET_ENVIRONMENT} ${RELEASE_TAG}" >&2
          echo "The downstream handler may be absent or disabled; failing closed to avoid silent deployment loss." >&2
          exit 1
