name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.2.3). Must start with v.'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is_stable_release: ${{ steps.resolve.outputs.is_stable_release }}
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ inputs.release_tag }}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: tag '${tag}' must match vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_stable_release=true
          else
            is_stable_release=false
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_stable_release=${is_stable_release}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${tag} (stable=${is_stable_release})"

  release-verify:
    name: Verify release (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [resolve-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            command: make build
          - name: test
            command: make test
          - name: race
            command: make test-race
          - name: coverage
            command: make cover
          - name: sdk
            command: make sdk-test
          - name: sdk-dependency-audit
            command: make sdk-dependency-audit
          - name: script-test
            command: make script-test
          - name: mcp
            command: make mcp-contract-check mcp-sdk-compat
          - name: lint
            command: make lint
          - name: proto
            command: make proto-lint proto-generate-check proto-breaking
          - name: openapi
            command: make openapi-check openapi-lint
          - name: catalog
            command: make catalog-check detection-catalog-check
          - name: graph-actions
            command: make graph-action-check
          - name: finding-dsl
            command: make finding-dsl-check
          - name: policy-rule
            command: make policy-rule-check
          - name: docs-drift
            command: make docs-drift-check
          - name: readme
            command: make readme-check
          - name: oss-audit
            command: make oss-audit
          - name: govulncheck
            command: make govulncheck
          - name: release-smoke
            command: make release-smoke
          - name: docker-smoke
            command: make docker-smoke
          - name: structural
            command: make check-structural check-structural-test check-arch
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  goreleaser:
    runs-on: ubuntu-latest
    needs: [resolve-tag, release-verify]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: v2.16.0
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  runtime-binaries:
    runs-on: ubuntu-latest
    needs: [resolve-tag, release-verify]
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build linux runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/writer/cerebro/internal/buildinfo.Version=${version} -X github.com/writer/cerebro/internal/buildinfo.Commit=${commit} -X github.com/writer/cerebro/internal/buildinfo.BuildDate=${build_date}"
          for arch in amd64 arm64; do
            mkdir -p ".dist/linux-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags "${ldflags}" -o ".dist/linux-${arch}/cerebro" ./cmd/cerebro
          done

      - name: Attest runtime binaries
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            .dist/linux-amd64/cerebro
            .dist/linux-arm64/cerebro

      - name: Upload linux/amd64 runtime binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cerebro-linux-amd64
          path: .dist/linux-amd64/cerebro
          if-no-files-found: error

      - name: Upload linux/arm64 runtime binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cerebro-linux-arm64
          path: .dist/linux-arm64/cerebro
          if-no-files-found: error

  ghcr-build:
    name: Build runtime image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [resolve-tag, runtime-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            platform: linux/amd64
            artifact: cerebro-linux-amd64
          - goarch: arm64
            platform: linux/arm64
            artifact: cerebro-linux-arm64
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Download release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: .dist

      - name: Prepare release binary
        shell: bash
        run: chmod +x .dist/cerebro

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push runtime image
        shell: bash
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          GOARCH: ${{ matrix.goarch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker buildx build --platform "${PLATFORM}" \
            -f Dockerfile.runtime \
            -t "${IMAGE_BASE}:${RELEASE_TAG}-${GOARCH}" \
            --provenance=mode=max \
            --sbom=true \
            --push .

  ghcr-publish:
    runs-on: ubuntu-latest
    needs: [resolve-tag, ghcr-build]
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Create and push multi-arch manifests
        id: manifest
        shell: bash
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE_BASE}:${RELEASE_TAG}" \
            "${IMAGE_BASE}:${RELEASE_TAG}-amd64" \
            "${IMAGE_BASE}:${RELEASE_TAG}-arm64"

          if [ "${{ needs.resolve-tag.outputs.is_stable_release }}" = "true" ]; then
            docker buildx imagetools create -t "${IMAGE_BASE}:latest" \
              "${IMAGE_BASE}:${RELEASE_TAG}-amd64" \
              "${IMAGE_BASE}:${RELEASE_TAG}-arm64"
          else
            echo "Skipping latest tag for prerelease ${RELEASE_TAG}"
          fi

          digest="$(docker buildx imagetools inspect "${IMAGE_BASE}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          if [ -z "${digest}" ]; then
            echo "ERROR: failed to resolve manifest digest for ${IMAGE_BASE}:${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE_BASE}:${RELEASE_TAG}@${digest}"

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Keyless sign release images
        shell: bash
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_BASE}@${DIGEST}"

      - name: Attest release image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  notify-infra-release:
    runs-on: ubuntu-latest
    needs: [resolve-tag, ghcr-publish, runtime-contract-upload]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_environment: sec-dev
            apply_mode: direct_push
          - target_environment: go-prod
            apply_mode: pull_request
    steps:
      - name: Dispatch release deployment request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CEREBRO_INFRA_PROMOTION_TOKEN }}
          INFRA_REPOSITORY: ${{ secrets.CEREBRO_INFRA_REPOSITORY }}
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.ghcr-publish.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TARGET_ENVIRONMENT: ${{ matrix.target_environment }}
          APPLY_MODE: ${{ matrix.apply_mode }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::CEREBRO_INFRA_PROMOTION_TOKEN is not configured; skipping ${TARGET_ENVIRONMENT} deploy dispatch for ${RELEASE_TAG}"
            exit 0
          fi
          if ! [[ "${INFRA_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: CEREBRO_INFRA_REPOSITORY must be configured as owner/repo for deploy dispatches" >&2
            exit 1
          fi

          handler="$(mktemp)"
          gh api "repos/${INFRA_REPOSITORY}/contents/.github/workflows/propose-image-tag.yml?ref=main" --jq .content \
            | base64 -d > "${handler}"
          if ! grep -Eq '^[[:space:]]*repository_dispatch:' "${handler}" || ! grep -Eq 'cerebro-release-published' "${handler}"; then
            echo "ERROR: configured deploy repository does not have the cerebro-release-published repository_dispatch handler installed" >&2
            echo "Merge the deploy handler before dispatching releases." >&2
            exit 1
          fi
          if ! grep -Eq 'client_payload\.request_id' "${handler}"; then
            echo "ERROR: configured deploy repository does not expose request_id in workflow run names" >&2
            echo "Merge the request-id run-name handler before dispatching releases." >&2
            exit 1
          fi

          dispatch_target() {
            local requested_at
            local request_id
            local deadline
            local run_id
            local run_url

            requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            request_id="cerebro-${TARGET_ENVIRONMENT}-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            payload="$(
              jq -n \
              --arg tag "${RELEASE_TAG}" \
              --arg digest "${IMAGE_DIGEST}" \
              --arg release_url "https://github.com/${SOURCE_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
              --arg source_repository "${SOURCE_REPOSITORY}" \
              --arg source_ref "refs/tags/${RELEASE_TAG}" \
              --arg request_id "${request_id}" \
              --arg target_environment "${TARGET_ENVIRONMENT}" \
              --arg apply_mode "${APPLY_MODE}" \
              '{
                event_type: "cerebro-release-published",
                client_payload: {
                  image_tag: $tag,
                  image_digest: $digest,
                  release_url: $release_url,
                  source_repository: $source_repository,
                  source_ref: $source_ref,
                  request_id: $request_id,
                  target_environment: $target_environment,
                  apply_mode: $apply_mode
                }
              }'
            )"
            payload_keys="$(jq '.client_payload | length' <<<"${payload}")"
            if [ "${payload_keys}" -gt 10 ]; then
              echo "ERROR: repository_dispatch client_payload has ${payload_keys} keys; GitHub allows at most 10" >&2
              exit 1
            fi
            gh api --method POST "repos/${INFRA_REPOSITORY}/dispatches" --input - <<<"${payload}"

            deadline=$((SECONDS + 120))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              run_id="$(
                gh run list \
                  --repo "${INFRA_REPOSITORY}" \
                  --workflow propose-image-tag.yml \
                  --event repository_dispatch \
                  --json databaseId,createdAt,displayTitle,url \
                  --limit 20 \
                  | jq -r --arg requested_at "${requested_at}" --arg request_id "${request_id}" '.[] | select(.createdAt >= $requested_at and ((.displayTitle // "") | contains($request_id))) | .databaseId' \
                  | head -n 1
              )"
              if [ -n "${run_id}" ]; then
                run_url="$(
                  gh run list \
                    --repo "${INFRA_REPOSITORY}" \
                    --workflow propose-image-tag.yml \
                    --event repository_dispatch \
                    --json databaseId,url \
                    --limit 20 \
                    --jq ".[] | select(.databaseId == ${run_id}) | .url" \
                    | head -n 1
                )"
                echo "Dispatched ${TARGET_ENVIRONMENT} ${APPLY_MODE} deploy request for ${RELEASE_TAG}@${IMAGE_DIGEST}: ${run_url}"
                return 0
              fi
              sleep 5
            done

            echo "ERROR: repository_dispatch was accepted, but no matching propose-image-tag.yml run appeared for ${TARGET_ENVIRONMENT} ${RELEASE_TAG}" >&2
            echo "This usually means the downstream handler is absent or disabled; failing closed to avoid silent deploy loss." >&2
            exit 1
          }

          dispatch_target

  runtime-contract:
    runs-on: ubuntu-latest
    needs: [resolve-tag, release-verify]
    strategy:
      fail-fast: false
      matrix:
        target_environment: [sec-dev, go-prod]
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
      TARGET_ENVIRONMENT: ${{ matrix.target_environment }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Render runtime deploy contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dist
          go run ./cmd/sourcedeploy \
            -env "${TARGET_ENVIRONMENT}" \
            -tenant writer \
            -format contract-json \
            -image-tag "${RELEASE_TAG}" \
            -out ".dist/cerebro-runtime-contract-${TARGET_ENVIRONMENT}.json"

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Keyless sign runtime deploy contract
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature ".dist/cerebro-runtime-contract-${TARGET_ENVIRONMENT}.json.sig" \
            --output-certificate ".dist/cerebro-runtime-contract-${TARGET_ENVIRONMENT}.json.pem" \
            ".dist/cerebro-runtime-contract-${TARGET_ENVIRONMENT}.json"

      - name: Upload runtime deploy contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cerebro-runtime-contract-${{ matrix.target_environment }}
          path: |
            .dist/cerebro-runtime-contract-${{ matrix.target_environment }}.json
            .dist/cerebro-runtime-contract-${{ matrix.target_environment }}.json.sig
            .dist/cerebro-runtime-contract-${{ matrix.target_environment }}.json.pem
          if-no-files-found: error

  runtime-contract-upload:
    runs-on: ubuntu-latest
    needs: [resolve-tag, goreleaser, runtime-contract]
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Download sec-dev runtime deploy contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cerebro-runtime-contract-sec-dev
          path: .dist

      - name: Download go-prod runtime deploy contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cerebro-runtime-contract-go-prod
          path: .dist

      - name: Upload runtime deploy contract to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            .dist/cerebro-runtime-contract-sec-dev.json \
            .dist/cerebro-runtime-contract-sec-dev.json.sig \
            .dist/cerebro-runtime-contract-sec-dev.json.pem \
            .dist/cerebro-runtime-contract-go-prod.json \
            .dist/cerebro-runtime-contract-go-prod.json.sig \
            .dist/cerebro-runtime-contract-go-prod.json.pem \
            --clobber
