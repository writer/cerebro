name: lint

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Type-check with mypy
        run: uv run mypy src

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run Next.js lint
        run: npm run lint --prefix frontend

  docstrings:
    name: Docstring quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Check docstrings with Ruff
        run: >-
          python -m ruff check --select D
          src/cerebro/analytics/orientation.py
          src/cerebro/agents/tools/orientation_summary.py
          src/cerebro/agents/tools/benchmarks_status.py
          scripts/analyze_frontend_events.py
          scripts/build_agent_training_corpus.py
          scripts/export_agent_policy_dataset.py
          scripts/generate_orientation_summary.py
