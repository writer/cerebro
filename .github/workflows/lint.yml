name: lint

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: |
          uv run ruff check \
            src/cerebro/findings/producers/aws/codebuild_public_trigger.py \
            src/cerebro/findings/producers/aws/codebuild_source_credential.py \
            src/cerebro/findings/producers/aws/service_account_open_assume.py \
            src/cerebro/findings/producers/aws/security_group_admin_port.py \
            src/cerebro/findings/producers/aws/security_group_public_ingress.py \
            src/cerebro/findings/producers/aws/load_balancer_public_http.py \
            src/cerebro/findings/producers/aws/load_balancer_missing_https.py \
            src/cerebro/findings/producers/aws/load_balancer_weak_tls.py \
            src/cerebro/findings/producers/aws/load_balancer_certificate_expiry.py \
            src/cerebro/findings/producers/aws/load_balancer_target_exposure.py \
            src/cerebro/findings/producers/github/repo_runner_group_scope.py \
            src/cerebro/findings/producers/kubernetes/privileged_pod.py \
            src/cerebro/findings/producers/kubernetes/ingress_public_exposure.py \
            src/cerebro/findings/producers/kubernetes/cluster_admin_binding.py \
            src/cerebro/findings/producers/kubernetes/cluster_admin_wildcard.py \
            src/cerebro/findings/producers/kubernetes/service_public_exposure.py \
            src/cerebro/findings/producers/kubernetes/node_public_exposure.py \
            src/cerebro/findings/producers/kubernetes/service_account_token.py \
            src/cerebro/findings/producers/kubernetes/network_policy.py \
            src/cerebro/findings/producers/utils \
            src/cerebro/findings/producers/azure \
            src/cerebro/findings/producers/sentinelone

      - name: Type-check with mypy
        run: |
          uv run mypy \
            src/cerebro/findings/producers/aws \
            src/cerebro/findings/producers/github \
            src/cerebro/findings/producers/kubernetes \
            src/cerebro/findings/producers/utils \
            src/cerebro/findings/producers/azure \
            src/cerebro/findings/producers/sentinelone

      - name: Producer audit
        run: |
          uv run python scripts/producer_audit.py \
            --require-builder-prefix cerebro.findings.producers.aws.security_group_ \
            --require-builder-prefix cerebro.findings.producers.github.workflow_permissions \
            --require-builder-prefix cerebro.findings.producers.telemetry.repo_secret_key \
            --require-context-prefix cerebro.findings.producers.aws.security_group_ \
            --require-context-prefix cerebro.findings.producers.github.workflow_permissions \
            --require-context-prefix cerebro.findings.producers.github.org_workflow_permissions \
            --require-context-prefix cerebro.findings.producers.telemetry.repo_secret_key \
            --output-format compact

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run Next.js lint
        run: npm run lint --prefix frontend

  docstrings:
    name: Docstring quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Check docstrings with Ruff
        run: >-
          python -m ruff check --select D
          src/cerebro/analytics/orientation.py
          src/cerebro/agents/tools/orientation_summary.py
          src/cerebro/agents/tools/benchmarks_status.py
          scripts/analyze_frontend_events.py
          scripts/build_agent_training_corpus.py
          scripts/export_agent_policy_dataset.py
          scripts/generate_orientation_summary.py
