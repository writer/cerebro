name: Benchmarks

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    paths:
      - "benchmarks/**"
      - "scripts/run_benchmarks.py"
      - "scripts/check_regression_tournament.py"
      - "src/cerebro/agents/benchmarks/**"
      - "src/cerebro/analytics/datasets/**"
      - "src/cerebro/agents/self_play/**"
      - "tests/benchmarks/**"
      - "tests/analytics/**"
      - "tests/self_play/**"

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run benchmark suite
        run: uv run python scripts/run_benchmarks.py --fail-on-error

      - name: Verify regression baselines
        run: uv run python scripts/check_regression_tournament.py
