name: Droid Auto Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review-preflight:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: write
      issues: write
    outputs:
      run_droid_review: ${{ steps.preflight.outputs.run_droid_review }}
      review_model: ${{ steps.preflight.outputs.review_model }}
      review_reason: ${{ steps.preflight.outputs.review_reason }}
    steps:
      - name: Supersede previous Droid comments
        if: github.event.action == 'synchronize'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          pr_number = os.environ["PR_NUMBER"]

          replacements = [
              ("## Security Review Summary", "## Superseded Security Review Summary"),
              ("**Droid encountered an error**", "**Superseded Droid error**"),
              ("Droid is reviewing code and running a security check", "Superseded Droid review in progress"),
          ]

          def request_json(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/{path.lstrip('/')}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          page = 1
          while True:
              comments = request_json(
                  "GET",
                  f"/repos/{repository}/issues/{pr_number}/comments?per_page=100&page={page}",
              )
              if not comments:
                  break
              for comment in comments:
                  user = comment.get("user") or {}
                  login = (user.get("login") or "").lower()
                  if login not in {"factory-droid", "factory-droid[bot]"}:
                      continue
                  body = comment.get("body") or ""
                  updated = body
                  for marker, replacement in replacements:
                      if marker in updated:
                          updated = updated.replace(marker, replacement, 1)
                  if updated != body and "Superseded by a newer commit." not in updated:
                      updated = updated.rstrip() + "\n\n_Superseded by a newer commit._"
                  if updated != body:
                      request_json(
                          "PATCH",
                          f"/repos/{repository}/issues/comments/{comment['id']}",
                          {"body": updated},
                      )
              page += 1
          PY

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fast Droid review preflight
        id: preflight
        shell: bash
        env:
          DROID_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          DROID_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          DROID_PREFLIGHT_JSON_OUT: tmp/droid-preflight.json
        run: |
          set +e
          started="$(date +%s)"
          make droid-review-preflight
          status="$?"
          duration="$(( $(date +%s) - started ))"
          {
            echo "### Droid Review Preflight"
            echo
            echo "- Duration: ${duration}s"
            echo "- Status: $([ "${status}" -eq 0 ] && echo success || echo failure)"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Set up Node for DeepSec
        if: steps.preflight.outputs.run_droid_review == 'true'
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install DeepSec
        if: steps.preflight.outputs.run_droid_review == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm -C .deepsec install --frozen-lockfile
      - name: Install Semgrep
        if: steps.preflight.outputs.run_droid_review == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'semgrep==1.136.0'
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Run Droid SAST context
        id: sast
        if: steps.preflight.outputs.run_droid_review == 'true'
        shell: bash
        env:
          DROID_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          DROID_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          DROID_SAST_OUT: tmp/droid-sast-context.md
          DROID_SAST_JSON_OUT: tmp/droid-sast-context.json
        run: |
          set +e
          make droid-review-sast
          status="$?"
          if [ -s "${DROID_SAST_OUT}" ]; then
            {
              echo
              echo "### Droid SAST Context"
              echo
              sed 's/^/    /' "${DROID_SAST_OUT}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::warning::Droid SAST context reported blocking findings or failed; keeping Droid review running so findings can be validated."
          fi
          exit 0
      - name: Run Droid CI context
        id: ci-context
        if: always() && steps.preflight.outputs.run_droid_review == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DROID_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          DROID_CI_OUT: tmp/droid-ci-context.md
          DROID_CI_JSON_OUT: tmp/droid-ci-context.json
        run: |
          set -euo pipefail
          make droid-ci-context
          if [ -s "${DROID_CI_OUT}" ]; then
            {
              echo
              echo "### Droid CI Context"
              echo
              sed 's/^/    /' "${DROID_CI_OUT}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Run Droid feedback context
        id: feedback-context
        if: always() && steps.preflight.outputs.run_droid_review == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DROID_PR: ${{ github.event.pull_request.number }}
          DROID_FEEDBACK_OUT: tmp/droid-feedback.md
          DROID_FEEDBACK_JSON_OUT: tmp/droid-feedback.json
        run: |
          set -euo pipefail
          make droid-feedback
          if [ -s "${DROID_FEEDBACK_OUT}" ]; then
            {
              echo
              echo "### Droid Feedback Context"
              echo
              sed 's/^/    /' "${DROID_FEEDBACK_OUT}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Publish consolidated Droid context
        if: always() && steps.preflight.outputs.run_droid_review == 'true' && steps.sast.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DROID_SAST_OUT: tmp/droid-sast-context.md
          DROID_CI_OUT: tmp/droid-ci-context.md
          DROID_PREFLIGHT_JSON_OUT: tmp/droid-preflight.json
          DROID_SAST_JSON_OUT: tmp/droid-sast-context.json
          DROID_CI_JSON_OUT: tmp/droid-ci-context.json
          DROID_FEEDBACK_JSON_OUT: tmp/droid-feedback.json
          DROID_CONTEXT_OUT: tmp/droid-review-context.md
          DROID_CONTEXT_JSON_OUT: tmp/droid-review-context.json
        run: |
          set -euo pipefail
          python3 scripts/droid_review_context.py \
            --base "${PR_BASE_SHA}" \
            --head "${PR_HEAD_SHA}" \
            --preflight-json "${DROID_PREFLIGHT_JSON_OUT}" \
            --sast-json "${DROID_SAST_JSON_OUT}" \
            --ci-json "${DROID_CI_JSON_OUT}" \
            --feedback-json "${DROID_FEEDBACK_JSON_OUT}" \
            --markdown-out "${DROID_CONTEXT_OUT}" \
            --json-out "${DROID_CONTEXT_JSON_OUT}"
          if [ -s "${DROID_CONTEXT_OUT}" ]; then
            {
              echo
              echo "### Droid Recursive Review Context"
              echo
              sed 's/^/    /' "${DROID_CONTEXT_OUT}"
            } >> "${GITHUB_STEP_SUMMARY}"
            python3 scripts/droid_sast_context.py --post-existing "${DROID_CONTEXT_OUT}"
          else
            echo "No Droid context report to publish."
          fi
      - name: Upload Droid context artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: droid-review-context
          path: |
            tmp/droid-preflight.json
            tmp/droid-sast-context.json
            tmp/droid-ci-context.json
            tmp/droid-feedback.json
            tmp/droid-review-context.json
            tmp/droid-review-context.md

  droid-review:
    needs: droid-review-preflight
    # Dependabot pull_request runs cannot access FACTORY_API_KEY, so keep the
    # preflight context but skip the secret-dependent Droid execution job.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && needs.droid-review-preflight.outputs.run_droid_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Check Infisical bootstrap
        id: infisical
        shell: bash
        env:
          INFISICAL_ORG_IDENTITY_UUID: ${{ secrets.INFISICAL_ORG_IDENTITY_UUID }}
          INFISICAL_ORG_PROJECT_SLUG: ${{ secrets.INFISICAL_ORG_PROJECT_SLUG }}
          INFISICAL_REPO_IDENTITY_UUID: ${{ secrets.INFISICAL_REPO_IDENTITY_UUID }}
          INFISICAL_REPO_PROJECT_SLUG: ${{ secrets.INFISICAL_REPO_PROJECT_SLUG }}
        run: |
          set -euo pipefail
          missing=()
          for key in INFISICAL_ORG_IDENTITY_UUID INFISICAL_ORG_PROJECT_SLUG INFISICAL_REPO_IDENTITY_UUID INFISICAL_REPO_PROJECT_SLUG; do
            if [ -z "${!key:-}" ]; then
              missing+=("${key}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Infisical bootstrap is incomplete; using the repository Droid credential."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Fetch org-level secrets from Infisical
        if: steps.infisical.outputs.configured == 'true'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_ORG_IDENTITY_UUID }}
          oidc-audience: ${{ format('https://github.com/{0}', github.repository_owner) }}
          project-slug: ${{ secrets.INFISICAL_ORG_PROJECT_SLUG }}
          env-slug: prod
          export-type: env
      - name: Fetch repo-level secrets from Infisical
        if: steps.infisical.outputs.configured == 'true'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_REPO_IDENTITY_UUID }}
          oidc-audience: ${{ format('https://github.com/{0}', github.repository_owner) }}
          project-slug: ${{ secrets.INFISICAL_REPO_PROJECT_SLUG }}
          env-slug: prod
          export-type: env
      - name: Resolve Droid credential
        shell: bash
        env:
          REPOSITORY_FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FACTORY_API_KEY:-}" ]; then
            FACTORY_API_KEY="${REPOSITORY_FACTORY_API_KEY:-}"
          fi
          if [ -z "${FACTORY_API_KEY:-}" ]; then
            echo "::error::Droid credential missing: FACTORY_API_KEY"
            exit 1
          fi
          echo "FACTORY_API_KEY=${FACTORY_API_KEY}" >> "$GITHUB_ENV"
      - name: Run Droid Auto Review
        id: droid-review-first
        continue-on-error: true
        uses: Factory-AI/droid-action@aaa1cd31dfe2c4fc1756af9ec386390cf4b8a56a # main
        with:
          factory_api_key: ${{ env.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          # Fast deterministic preflight runs first; use GLM-5.2 for the actual
          # bug-finding review (faster than Sonnet while maintaining quality).
          review_model: ${{ needs.droid-review-preflight.outputs.review_model || 'glm-5.2' }}
          security_model: gpt-5.4
          reasoning_effort: medium
          allowed_bots: dependabot
      - name: Retry Droid Auto Review on failure
        if: steps.droid-review-first.outcome == 'failure'
        continue-on-error: true
        uses: Factory-AI/droid-action@aaa1cd31dfe2c4fc1756af9ec386390cf4b8a56a # main
        with:
          factory_api_key: ${{ env.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_model: ${{ needs.droid-review-preflight.outputs.review_model || 'glm-5.2' }}
          security_model: gpt-5.4
          reasoning_effort: medium
          allowed_bots: dependabot
