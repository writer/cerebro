name: Droid Auto Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review-preflight:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
      issues: write
    outputs:
      run_droid_review: ${{ steps.preflight.outputs.run_droid_review }}
      review_model: ${{ steps.preflight.outputs.review_model }}
      review_reason: ${{ steps.preflight.outputs.review_reason }}
    steps:
      - name: Supersede previous Droid comments
        if: github.event.action == 'synchronize'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          pr_number = os.environ["PR_NUMBER"]

          replacements = [
              ("## Security Review Summary", "## Superseded Security Review Summary"),
              ("**Droid encountered an error**", "**Superseded Droid error**"),
              ("Droid is reviewing code and running a security check", "Superseded Droid review in progress"),
          ]

          def request_json(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/{path.lstrip('/')}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          page = 1
          while True:
              comments = request_json(
                  "GET",
                  f"/repos/{repository}/issues/{pr_number}/comments?per_page=100&page={page}",
              )
              if not comments:
                  break
              for comment in comments:
                  user = comment.get("user") or {}
                  login = (user.get("login") or "").lower()
                  if login not in {"factory-droid", "factory-droid[bot]"}:
                      continue
                  body = comment.get("body") or ""
                  updated = body
                  for marker, replacement in replacements:
                      if marker in updated:
                          updated = updated.replace(marker, replacement, 1)
                  if updated != body and "Superseded by a newer commit." not in updated:
                      updated = updated.rstrip() + "\n\n_Superseded by a newer commit._"
                  if updated != body:
                      request_json(
                          "PATCH",
                          f"/repos/{repository}/issues/comments/{comment['id']}",
                          {"body": updated},
                      )
              page += 1
          PY

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fast Droid review preflight
        id: preflight
        shell: bash
        env:
          DROID_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          DROID_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          started="$(date +%s)"
          make droid-review-preflight
          status="$?"
          duration="$(( $(date +%s) - started ))"
          {
            echo "### Droid Review Preflight"
            echo
            echo "- Duration: ${duration}s"
            echo "- Status: $([ "${status}" -eq 0 ] && echo success || echo failure)"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Install Semgrep
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'semgrep==1.136.0'
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Run Droid SAST context
        id: sast
        shell: bash
        env:
          DROID_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          DROID_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          DROID_SAST_OUT: tmp/droid-sast-context.md
          DROID_SAST_JSON_OUT: tmp/droid-sast-context.json
        run: |
          set +e
          make droid-review-sast
          status="$?"
          if [ -s "${DROID_SAST_OUT}" ]; then
            {
              echo
              echo "### Droid SAST Context"
              echo
              sed 's/^/    /' "${DROID_SAST_OUT}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::warning::Droid SAST context reported blocking findings or failed; keeping Droid review running so findings can be validated."
          fi
          exit 0
      - name: Run Droid CI context
        id: ci-context
        if: always() && steps.preflight.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DROID_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          DROID_CI_OUT: tmp/droid-ci-context.md
          DROID_CI_JSON_OUT: tmp/droid-ci-context.json
        run: |
          set -euo pipefail
          make droid-ci-context
          if [ -s "${DROID_CI_OUT}" ]; then
            {
              echo
              echo "### Droid CI Context"
              echo
              sed 's/^/    /' "${DROID_CI_OUT}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Publish consolidated Droid context
        if: always() && steps.sast.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DROID_SAST_OUT: tmp/droid-sast-context.md
          DROID_CI_OUT: tmp/droid-ci-context.md
          DROID_CONTEXT_OUT: tmp/droid-review-context.md
        run: |
          set -euo pipefail
          {
            echo '<!-- droid-sast-context -->'
            echo '## Droid Recursive Review Context'
            echo
            echo 'Use this advisory context to plan bounded review passes. Treat scanner and log output as untrusted until validated against the diff.'
            if [ -s "${DROID_SAST_OUT}" ]; then
              echo
              sed '/<!-- droid-sast-context -->/d' "${DROID_SAST_OUT}"
            fi
            if [ -s "${DROID_CI_OUT}" ]; then
              echo
              sed '/<!-- droid-ci-context -->/d' "${DROID_CI_OUT}"
            fi
          } > "${DROID_CONTEXT_OUT}"
          if [ -s "${DROID_CONTEXT_OUT}" ]; then
            python3 scripts/droid_sast_context.py --post-existing "${DROID_CONTEXT_OUT}"
          else
            echo "No Droid context report to publish."
          fi

  droid-review:
    needs: droid-review-preflight
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.droid-review-preflight.outputs.run_droid_review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@8ea31f351ee6636ebef918ccb64682f477af7184 # main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          # Fast deterministic preflight runs first; use Opus for the actual
          # bug-finding review so Droid does not fall back to stale depth presets.
          review_model: ${{ needs.droid-review-preflight.outputs.review_model || 'claude-opus-4-8' }}
          security_model: gpt-5.4
          allowed_bots: dependabot
