name: Candidate Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Commit on main to rebuild as a candidate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release-tag-reservation
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      short_sha: ${{ steps.candidate.outputs.short_sha }}
      image_tag: ${{ steps.candidate.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve candidate commit
        id: candidate
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          sha="$(git rev-parse "${REQUESTED_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "ERROR: candidate commit ${sha} is not on main" >&2
            exit 1
          fi
          short_sha="${sha:0:12}"
          {
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
            echo "image_tag=candidate-${sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require successful CI for candidate commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            ci_run="$(
              gh run list --repo "${GITHUB_REPOSITORY}" --workflow CI --event push --branch main --limit 50 \
                --json headSha,status,conclusion,url \
                --jq ".[] | select(.headSha == \"${CANDIDATE_SHA}\") | [.status, (.conclusion // \"\"), .url] | @tsv" \
                | head -n 1 || true
            )"
            if [ -n "${ci_run}" ]; then
              IFS=$'\t' read -r status conclusion url <<< "${ci_run}"
              if [ "${status}" = completed ] && [ "${conclusion}" = success ]; then
                echo "CI passed for ${CANDIDATE_SHA}: ${url}"
                exit 0
              fi
              if [ "${status}" = completed ]; then
                echo "ERROR: CI completed with ${conclusion}: ${url}" >&2
                exit 1
              fi
            fi
            sleep 15
          done
          echo "ERROR: timed out waiting for CI on ${CANDIDATE_SHA}" >&2
          exit 1

  binary:
    name: binary-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - os: darwin
            arch: arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Rust toolchain
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: rustup toolchain install 1.93.1 --profile minimal --target "${RUST_TARGET}"
      - name: Install Linux musl toolchain
        if: matrix.os == 'linux'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target_env="$(printf '%s' "${RUST_TARGET}" | tr '[:lower:]-' '[:upper:]_')"
          target_cc="$(printf '%s' "${RUST_TARGET}" | tr '-' '_')"
          {
            echo "CARGO_TARGET_${target_env}_LINKER=musl-gcc"
            echo "CC_${target_cc}=musl-gcc"
          } >> "${GITHUB_ENV}"
      - name: Build candidate archive
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          mkdir -p .dist/bin .dist/release
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/writer/cerebro/internal/buildinfo.Version=candidate-${SHORT_SHA} -X github.com/writer/cerebro/internal/buildinfo.Commit=${CANDIDATE_SHA} -X github.com/writer/cerebro/internal/buildinfo.BuildDate=${build_date}"
          name="cerebro_candidate-${SHORT_SHA}_${TARGET_OS}_${TARGET_ARCH}"
          mkdir -p ".dist/bin/${name}"
          CGO_ENABLED=0 GOOS="${TARGET_OS}" GOARCH="${TARGET_ARCH}" go build -trimpath -ldflags "${ldflags}" -o ".dist/bin/${name}/cerebro" ./cmd/cerebro
          cargo +1.93.1 build --locked --release --target "${RUST_TARGET}" -p cerebro-sourceruntime-eventadmission --bin cerebro-event-admission-worker
          cp "target/${RUST_TARGET}/release/cerebro-event-admission-worker" ".dist/bin/${name}/cerebro-event-admission-worker"
          tar -C .dist/bin -czf ".dist/release/${name}.tar.gz" "${name}/cerebro" "${name}/cerebro-event-admission-worker"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-binary-${{ needs.resolve.outputs.sha }}-${{ matrix.os }}-${{ matrix.arch }}
          path: .dist/release/*.tar.gz
          if-no-files-found: error

  binaries:
    runs-on: ubuntu-latest
    needs: [resolve, binary]
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-binary-${{ needs.resolve.outputs.sha }}-*
          path: .dist/release
          merge-multiple: true
      - name: Build candidate checksums and inventory
        shell: bash
        run: |
          set -euo pipefail
          (cd .dist/release && sha256sum -- ./*.tar.gz > checksums.txt)
          go list -m -json all > .dist/release/go-module-inventory.ndjson
      - name: Attest candidate archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: .dist/release/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-binaries-${{ needs.resolve.outputs.sha }}
          path: .dist/release
          if-no-files-found: error
          include-hidden-files: true

  image:
    runs-on: ${{ matrix.runner }}
    needs: resolve
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build runtime binary
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          mkdir -p .dist
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/writer/cerebro/internal/buildinfo.Version=candidate-${SHORT_SHA} -X github.com/writer/cerebro/internal/buildinfo.Commit=${CANDIDATE_SHA} -X github.com/writer/cerebro/internal/buildinfo.BuildDate=${build_date}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
            go build -trimpath -ldflags "${ldflags}" -o .dist/cerebro ./cmd/cerebro
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish candidate image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.image_tag }}-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker buildx build --platform "${PLATFORM}" -f Dockerfile.runtime \
            --tag "${IMAGE}" --provenance=mode=max --sbom=true --push .

  manifest:
    runs-on: ubuntu-latest
    needs: [resolve, image]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Publish candidate manifest
        id: publish
        shell: bash
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE_BASE}:${IMAGE_TAG}" \
            "${IMAGE_BASE}:${IMAGE_TAG}-amd64" "${IMAGE_BASE}:${IMAGE_TAG}-arm64"
          digest=""
          for attempt in 1 2 3 4 5 6; do
            if digest="$(docker buildx imagetools inspect "${IMAGE_BASE}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')" \
              && [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            digest=""
            if [ "${attempt}" -eq 6 ]; then
              echo "ERROR: candidate manifest was not readable after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: Sign candidate image by digest
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE_BASE}@${DIGEST}"
      - name: Attest candidate image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  rust-organizational-e2e:
    runs-on: ubuntu-latest
    needs: [resolve, manifest]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: Verify and pull the exact candidate
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cut-release.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${CANDIDATE_IMAGE}" >/dev/null
          docker pull --platform linux/amd64 "${CANDIDATE_IMAGE}"
          runtime_image_id="$(docker image inspect --format '{{.Id}}' "${CANDIDATE_IMAGE}")"
          [[ "${runtime_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "CEREBRO_TEST_RUNTIME_IMAGE_ID=${runtime_image_id}" >> "${GITHUB_ENV}"
      - name: Start disposable PostgreSQL, Neo4j, and JetStream
        run: |
          set -euo pipefail
          docker network create cerebro-rust-e2e
          docker run -d --name cerebro-rust-postgres --network cerebro-rust-e2e \
            -e POSTGRES_USER=cerebro -e POSTGRES_PASSWORD=cerebro -e POSTGRES_DB=cerebro \
            -p 5432:5432 postgres:16-alpine
          docker run -d --name cerebro-rust-neo4j --network cerebro-rust-e2e \
            -e NEO4J_AUTH=neo4j/local-password -p 7687:7687 neo4j:5-community
          docker run -d --name cerebro-rust-nats --network cerebro-rust-e2e \
            -p 4222:4222 nats:2.10-alpine -js -sd /data
          for attempt in $(seq 1 60); do
            docker exec cerebro-rust-postgres pg_isready -U cerebro -d cerebro >/dev/null 2>&1 \
              && docker exec cerebro-rust-neo4j cypher-shell -u neo4j -p local-password \
                'RETURN 1' >/dev/null 2>&1 \
              && docker run --rm --network cerebro-rust-e2e natsio/nats-box:0.18.0 \
                nats --server nats://cerebro-rust-nats:4222 server check connection >/dev/null 2>&1 \
              && break
            if [ "${attempt}" -eq 60 ]; then
              echo "ERROR: disposable Rust E2E stores did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network cerebro-rust-e2e natsio/nats-box:0.18.0 \
            nats --server nats://cerebro-rust-nats:4222 stream add CEREBRO_EVENTS \
              --subjects "events.>" --storage file --retention limits --discard old \
              --replicas 1 --dupe-window 2m --defaults
      - name: Start Rust projection and graph API from the candidate image
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.manifest.outputs.digest }}
          GRAPH_SECRET: rust-candidate-e2e-tenant-secret-32-bytes
        run: |
          set -euo pipefail
          docker run -d --name cerebro-rust-platform --network cerebro-rust-e2e \
            -p 18080:8080 \
            -e CEREBRO_NEO4J_URI=bolt://cerebro-rust-neo4j:7687 \
            -e CEREBRO_NEO4J_USERNAME=neo4j \
            -e CEREBRO_NEO4J_PASSWORD=local-password \
            -e 'CEREBRO_POSTGRES_DSN=postgres://cerebro:cerebro@cerebro-rust-postgres:5432/cerebro?sslmode=disable' \
            -e CEREBRO_JETSTREAM_URL=nats://cerebro-rust-nats:4222 \
            -e CEREBRO_RUST_BIND=0.0.0.0:8080 \
            -e CEREBRO_REPOSITORY_ROOT=/app \
            -e CEREBRO_ORGANIZATIONAL_GRAPH_SHARED_SECRET="${GRAPH_SECRET}" \
            --entrypoint /usr/local/bin/cerebro-platform \
            "${CANDIDATE_IMAGE}" serve-neo4j-consumer
      - name: Seed committed events and prove the pre-restart graph
        env:
          CEREBRO_TEST_POSTGRES_DSN: postgres://cerebro:cerebro@127.0.0.1:5432/cerebro?sslmode=disable
          CEREBRO_TEST_NATS_URL: nats://127.0.0.1:4222
          CEREBRO_TEST_GRAPH_URL: http://127.0.0.1:18080
          CEREBRO_ORGANIZATIONAL_GRAPH_SHARED_SECRET: rust-candidate-e2e-tenant-secret-32-bytes
          CEREBRO_TEST_COMMIT: ${{ needs.resolve.outputs.sha }}
          CEREBRO_TEST_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.image_tag }}
          CEREBRO_TEST_IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
          CEREBRO_TEST_PLATFORM: linux/amd64
          CEREBRO_TEST_CHECKPOINT: .dist/rust-e2e/checkpoint.json
          CEREBRO_TEST_RECEIPT: .dist/rust-e2e/rust-organizational-e2e-receipt.json
          CEREBRO_REPOSITORY_ROOT: ${{ github.workspace }}
        run: cargo run --locked -p cerebro-platform --example organizational_graph_e2e -- seed
      - name: Restart the exact candidate and prove recovery
        env:
          CEREBRO_TEST_POSTGRES_DSN: postgres://cerebro:cerebro@127.0.0.1:5432/cerebro?sslmode=disable
          CEREBRO_TEST_NATS_URL: nats://127.0.0.1:4222
          CEREBRO_TEST_GRAPH_URL: http://127.0.0.1:18080
          CEREBRO_ORGANIZATIONAL_GRAPH_SHARED_SECRET: rust-candidate-e2e-tenant-secret-32-bytes
          CEREBRO_TEST_COMMIT: ${{ needs.resolve.outputs.sha }}
          CEREBRO_TEST_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.image_tag }}
          CEREBRO_TEST_IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
          CEREBRO_TEST_PLATFORM: linux/amd64
          CEREBRO_TEST_CHECKPOINT: .dist/rust-e2e/checkpoint.json
          CEREBRO_TEST_RECEIPT: .dist/rust-e2e/rust-organizational-e2e-receipt.json
          CEREBRO_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          docker restart cerebro-rust-platform
          cargo run --locked -p cerebro-platform --example organizational_graph_e2e -- verify
          test "$(jq -r .schema_version .dist/rust-e2e/rust-organizational-e2e-receipt.json)" = \
            "cerebro.rust-organizational-e2e/v1"
          test "$(jq -r .status .dist/rust-e2e/rust-organizational-e2e-receipt.json)" = passed
          test "$(jq -r .image_digest .dist/rust-e2e/rust-organizational-e2e-receipt.json)" = \
            "${CEREBRO_TEST_IMAGE_DIGEST}"
          test "$(jq '[.checks[] | select(.status == "passed")] | length' \
            .dist/rust-e2e/rust-organizational-e2e-receipt.json)" -eq 10
      - name: Attach the Rust E2E receipt to the candidate digest
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.manifest.outputs.digest }}
        run: |
          cosign attest --yes \
            --type "https://writer.com/cerebro/rust-organizational-e2e/v1" \
            --predicate .dist/rust-e2e/rust-organizational-e2e-receipt.json \
            "${CANDIDATE_IMAGE}"
      - name: Print runtime logs
        if: always()
        run: docker logs cerebro-rust-platform 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-rust-e2e-${{ needs.resolve.outputs.sha }}
          path: .dist/rust-e2e/rust-organizational-e2e-receipt.json
          if-no-files-found: error

  web-image:
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish candidate web image
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/cerebro-web:${{ needs.resolve.outputs.image_tag }}-${{ matrix.arch }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform "${PLATFORM}" -f apps/web/Dockerfile \
            --build-arg SOURCE_REVISION="${CANDIDATE_SHA}" \
            --build-arg NEXT_PUBLIC_CEREBRO_WEB_VERSION="candidate-${CANDIDATE_SHA}" \
            --tag "${IMAGE}" --provenance=mode=max --sbom=true --push .

  web-manifest:
    runs-on: ubuntu-latest
    needs: [resolve, web-image]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Publish candidate web manifest
        id: publish
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cerebro-web
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE_BASE}:${IMAGE_TAG}" \
            "${IMAGE_BASE}:${IMAGE_TAG}-amd64" "${IMAGE_BASE}:${IMAGE_TAG}-arm64"
          digest=""
          for attempt in 1 2 3 4 5 6; do
            if digest="$(docker buildx imagetools inspect "${IMAGE_BASE}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')" \
              && [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            digest=""
            if [ "${attempt}" -eq 6 ]; then
              echo "ERROR: candidate web manifest was not readable after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: Sign candidate web image by digest
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cerebro-web
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE_BASE}@${DIGEST}"
      - name: Attest candidate web image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cerebro-web
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  scan-images:
    runs-on: ubuntu-latest
    needs: [resolve, manifest, web-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify candidate image platforms
        shell: bash
        env:
          RUNTIME_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.manifest.outputs.digest }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/cerebro-web@${{ needs.web-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          for image in "${RUNTIME_IMAGE}" "${WEB_IMAGE}"; do
            platforms="$(
              docker buildx imagetools inspect --raw "${image}" \
                | jq -c '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort'
            )"
            test "${platforms}" = '["linux/amd64","linux/arm64"]'
          done
      - name: Scan candidate images
        shell: bash
        env:
          RUNTIME_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.manifest.outputs.digest }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/cerebro-web@${{ needs.web-manifest.outputs.digest }}
          TRIVY_IMAGE: aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for image in "${RUNTIME_IMAGE}" "${WEB_IMAGE}"; do
            for platform in linux/amd64 linux/arm64; do
              docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "${TRIVY_IMAGE}" image \
                --platform "${platform}" --scanners vuln \
                --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "${image}"
              docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "${TRIVY_IMAGE}" image \
                --platform "${platform}" --scanners vuln \
                --severity CRITICAL --ignore-unfixed --exit-code 1 "${image}"
            done
          done

  portable-artifacts:
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Build portable Slack companion and SDK archives
        run: |
          set -euo pipefail
          npm ci
          make openapi-check openapi-ts-check agent-service-lifecycle-check
          npm run check --workspace @writer/cerebro-sdk
          npm run check --workspace @writer/cerebro-slack-companion
          npm run build --workspace @writer/cerebro-slack-companion
          mkdir -p .dist/product
          npm pack --workspace @writer/cerebro-slack-companion --pack-destination .dist/product
          npm pack --workspace @writer/cerebro-sdk --pack-destination .dist/product
          cp api/openapi.yaml .dist/product/cerebro-openapi.yaml
          cp schemas/agent-service-lifecycle.schema.json .dist/product/agent-service-lifecycle.schema.json
          cp schemas/product-release.schema.json .dist/product/product-release.schema.json
          cp schemas/product-release-published.schema.json .dist/product/product-release-published.schema.json
          slack_archive="$(find .dist/product -maxdepth 1 -type f -name 'writer-cerebro-slack-companion-*.tgz' -print -quit)"
          sdk_archive="$(find .dist/product -maxdepth 1 -type f -name 'writer-cerebro-sdk-*.tgz' -print -quit)"
          test -n "${slack_archive}"
          test -n "${sdk_archive}"
          python3 scripts/release/verify_portable_artifacts.py \
            --bundle-root .dist/product \
            --slack-archive "${slack_archive}" \
            --sdk-archive "${sdk_archive}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-input-${{ needs.resolve.outputs.sha }}
          path: .dist/product
          if-no-files-found: error
          include-hidden-files: true

  product-release:
    runs-on: ubuntu-latest
    needs: [resolve, manifest, web-manifest, portable-artifacts]
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: product-input-${{ needs.resolve.outputs.sha }}
          path: .dist/product
      - name: Write candidate product release
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          RUNTIME_DIGEST: ${{ needs.manifest.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          slack_archive="$(find .dist/product -maxdepth 1 -type f -name 'writer-cerebro-slack-companion-*.tgz' -print -quit)"
          sdk_archive="$(find .dist/product -maxdepth 1 -type f -name 'writer-cerebro-sdk-*.tgz' -print -quit)"
          test -n "${slack_archive}"
          test -n "${sdk_archive}"
          python3 scripts/release/product_release.py build \
            --channel candidate --version "${IMAGE_TAG}" --commit "${CANDIDATE_SHA}" \
            --runtime-image "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}" --runtime-digest "${RUNTIME_DIGEST}" \
            --web-image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cerebro-web:${IMAGE_TAG}" --web-digest "${WEB_DIGEST}" \
            --slack-archive "${slack_archive}" --slack-version "$(jq -r .version apps/slack-companion/package.json)" \
            --sdk-archive "${sdk_archive}" --sdk-version "$(jq -r .version sdk/typescript/package.json)" \
            --openapi .dist/product/cerebro-openapi.yaml \
            --lifecycle-schema .dist/product/agent-service-lifecycle.schema.json \
            --bundle-root .dist/product --out .dist/product/cerebro-product-release.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: Sign candidate product release
        run: |
          cosign sign-blob --yes \
            --output-signature .dist/product/cerebro-product-release.json.sig \
            --output-certificate .dist/product/cerebro-product-release.json.pem \
            .dist/product/cerebro-product-release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-product-${{ needs.resolve.outputs.sha }}
          path: .dist/product
          if-no-files-found: error
          include-hidden-files: true

  receipt:
    runs-on: ubuntu-latest
    needs: [resolve, binaries, manifest, rust-organizational-e2e, web-manifest, scan-images, product-release]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*-${{ needs.resolve.outputs.sha }}
          path: candidate
          merge-multiple: true
      - name: Write candidate receipt
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
          WEB_IMAGE_DIGEST: ${{ needs.web-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/release/product_release.py validate candidate/cerebro-product-release.json --bundle-root candidate
          test "$(jq -r .schema_version candidate/cerebro-product-release.json)" = "cerebro.product-release/v1"
          test "$(jq -r .schema_version candidate/rust-organizational-e2e-receipt.json)" = \
            "cerebro.rust-organizational-e2e/v1"
          test "$(jq -r .status candidate/rust-organizational-e2e-receipt.json)" = "passed"
          test "$(jq -r .commit candidate/rust-organizational-e2e-receipt.json)" = "${CANDIDATE_SHA}"
          test "$(jq -r .image_digest candidate/rust-organizational-e2e-receipt.json)" = "${IMAGE_DIGEST}"
          product_manifest_sha256="$(sha256sum candidate/cerebro-product-release.json | awk '{print $1}')"
          rust_e2e_receipt_sha256="$(sha256sum candidate/rust-organizational-e2e-receipt.json | awk '{print $1}')"
          jq -n --arg schema_version "cerebro.release-candidate/v1" --arg commit "${CANDIDATE_SHA}" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}" --arg digest "${IMAGE_DIGEST}" \
            --arg web_image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cerebro-web:${IMAGE_TAG}" \
            --arg web_digest "${WEB_IMAGE_DIGEST}" --arg product_manifest_sha256 "${product_manifest_sha256}" \
            --arg rust_e2e_receipt_sha256 "${rust_e2e_receipt_sha256}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{schema_version:$schema_version,commit:$commit,image:$image,image_digest:$digest,web_image:$web_image,web_image_digest:$web_digest,product_manifest_sha256:$product_manifest_sha256,rust_e2e_receipt_sha256:$rust_e2e_receipt_sha256,run_id:$run_id,run_attempt:$run_attempt}' \
            > candidate/candidate-receipt.json
          checksum_file="$(mktemp)"
          (cd candidate && find . -type f ! -name bundle-checksums.txt -print0 | sort -z | xargs -0 sha256sum) > "${checksum_file}"
          mv "${checksum_file}" candidate/bundle-checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cerebro-candidate-${{ needs.resolve.outputs.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30
