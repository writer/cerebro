name: Cut Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create from main, e.g. v2.1.1'
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: stable-release-tag-reservation
  cancel-in-progress: false

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          RELEASE_TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && 'origin/main' || github.sha }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          git checkout --detach "${RELEASE_TARGET_REF}"

          if [ -n "${REQUESTED_RELEASE_TAG}" ]; then
            RELEASE_TAG="${REQUESTED_RELEASE_TAG}"
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "ERROR: release_tag '${RELEASE_TAG}' must match vMAJOR.MINOR.PATCH[-PRERELEASE]"
              exit 1
            fi
          else
            head_tags="$(git tag --points-at HEAD --list 'v*')"
            if [ -n "${head_tags}" ]; then
              echo "HEAD already has release tag(s):"
              printf '%s\n' "${head_tags}"
              echo "Skipping automatic release."
              exit 0
            fi

            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ -z "${latest_tag}" ]; then
              echo "ERROR: could not resolve latest stable vMAJOR.MINOR.PATCH tag"
              exit 1
            fi

            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "${version}"
            RELEASE_TAG="v${major}.${minor}.$((patch + 1))"
            echo "Resolved automatic release tag ${RELEASE_TAG} from ${latest_tag}"
          fi

          release_sha="$(git rev-parse HEAD)"
          echo "Waiting for successful 'CI' workflow run for push to main at ${release_sha}"
          for _ in {1..120}; do
            ci_run="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "CI" \
                --event push \
                --branch main \
                --limit 50 \
                --json headSha,status,conclusion,url \
                --jq ".[] | select(.headSha == \"${release_sha}\") | [.status, (.conclusion // \"\"), .url] | @tsv" \
              | head -n 1
            )" || true
            if [ -n "${ci_run}" ]; then
              IFS=$'\t' read -r ci_status ci_conclusion ci_url <<< "${ci_run}"
              if [ "${ci_status}" = "completed" ] && [ "${ci_conclusion}" = "success" ]; then
                echo "CI for ${release_sha} succeeded: ${ci_url}"
                break
              fi
              if [ "${ci_status}" = "completed" ]; then
                echo "ERROR: CI for ${release_sha} completed with ${ci_conclusion}: ${ci_url}" >&2
                exit 1
              fi
            fi
            sleep 15
          done
          if [ "${ci_status:-}" != "completed" ] || [ "${ci_conclusion:-}" != "success" ]; then
            echo "ERROR: timed out waiting for successful 'CI' workflow run for push to main at ${release_sha}" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "ERROR: tag '${RELEASE_TAG}' already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          gh workflow run "Release" --ref main -f "release_tag=${RELEASE_TAG}"
