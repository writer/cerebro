name: Cut Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create from main, e.g. v2.1.1'
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: cut-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: release_tag '${RELEASE_TAG}' must match vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi

          git fetch origin main --tags
          git checkout --detach origin/main
          make verify

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "ERROR: tag '${RELEASE_TAG}' already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          gh workflow run "Release" --ref "${RELEASE_TAG}" -f "release_tag=${RELEASE_TAG}"
