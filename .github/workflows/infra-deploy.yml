name: Infrastructure Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'go-prod'
        type: choice
        options:
          - sec-dev
          - go-prod
          - gcp-dev
          - gcp-prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cerebro
  TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
  TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

jobs:
  changes:
    name: Detect infra changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      aws_sec_dev: ${{ steps.filter.outputs.aws_sec_dev }}
      aws_go_prod: ${{ steps.filter.outputs.aws_go_prod }}
      gcp: ${{ steps.filter.outputs.gcp }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git ls-files infra > changed.txt
          else
            git diff --name-only "${base}" "${head}" > changed.txt
          fi

          aws_sec_dev=false
          aws_go_prod=false
          gcp=false
          if grep -Eq '^infra/aws/Pulumi\.sec-dev\.yaml$' changed.txt; then aws_sec_dev=true; fi
          if grep -Eq '^infra/aws/Pulumi\.go-prod\.yaml$' changed.txt; then aws_go_prod=true; fi
          if grep -Eq '^infra/aws/' changed.txt && grep -Ev '^infra/aws/Pulumi\.(sec-dev|go-prod)\.yaml$' changed.txt | grep -Eq '^infra/aws/'; then
            aws_sec_dev=true
            aws_go_prod=true
          fi
          if grep -Eq '^infra/gcp/' changed.txt; then gcp=true; fi
          if grep -Eq '^infra/(pyproject.toml|uv.lock)$|^infra/scripts/|^infra/tests/' changed.txt; then
            aws_sec_dev=true
            aws_go_prod=true
            if grep -Ev '^infra/scripts/verify_(graph_health|source_runtime)_ecs.py$|^infra/tests/test_verify_(graph_health|source_runtime)_ecs.py$' changed.txt | grep -Eq '^infra/(pyproject.toml|uv.lock)$|^infra/scripts/|^infra/tests/'; then
              gcp=true
            fi
          fi
          aws=false
          if [ "${aws_sec_dev}" = "true" ] || [ "${aws_go_prod}" = "true" ]; then aws=true; fi
          {
            echo "aws=${aws}"
            echo "aws_sec_dev=${aws_sec_dev}"
            echo "aws_go_prod=${aws_go_prod}"
            echo "gcp=${gcp}"
          } >> "$GITHUB_OUTPUT"
          printf 'Changed infra paths:\n'
          cat changed.txt

  static-validation:
    name: Static infra validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Run static checks
        shell: bash
        working-directory: infra
        run: |
          uv run python -m compileall aws gcp scripts tests
          uv run python scripts/validate_stack_config.py
          uv run python scripts/validate_gcp_config.py
          uv run python -m unittest discover -s tests

  # ===========================================================================
  # AWS jobs
  # ===========================================================================

  # PR: Pulumi preview for sec-dev stack
  deploy-sec-dev:
    name: Preview sec-dev
    runs-on: ubuntu-latest
    needs: [changes, static-validation]
    if: github.event_name == 'pull_request' && needs.changes.outputs.aws_sec_dev == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack sec-dev --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Pulumi Preview (sec-dev)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: sec-dev
          work-dir: infra/aws
          diff: true
          comment-on-pr: true

  # PR: Pulumi preview for go-prod stack in sec-prod account
  preview-go-prod:
    name: Preview go-prod
    runs-on: ubuntu-latest
    needs: [changes, static-validation]
    if: github.event_name == 'pull_request' && needs.changes.outputs.aws_go_prod == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack go-prod --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Pulumi Preview (go-prod)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: go-prod
          work-dir: infra/aws
          diff: true
          comment-on-pr: true

  # Main merge: keep sec-dev applied to the reviewed stack config
  deploy-sec-dev-main:
    name: Deploy sec-dev
    runs-on: ubuntu-latest
    needs: [changes, static-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.aws_sec_dev == 'true'
    concurrency:
      group: infra-deploy-sec-dev
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack sec-dev --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Wait for ECR image (sec-dev)
        shell: bash
        run: bash .github/scripts/wait-for-ecr-image.sh sec-dev

      - name: Detect AWS public-endpoint refresh need (sec-dev)
        id: aws_public_endpoint_refresh
        shell: bash
        working-directory: infra
        run: uv run python scripts/detect_public_endpoint_refresh.py --stack-file aws/Pulumi.sec-dev.yaml --github-output "$GITHUB_OUTPUT"

      - name: Verify AWS scan-role trust (sec-dev)
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.sec-dev.yaml --same-account-only

      - name: Pulumi Up (sec-dev)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: sec-dev
          work-dir: infra/aws
          diff: true

      - name: Refresh AWS credentials for runtime verification (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Verify Cosmo source runtimes (sec-dev)
        id: verify_cosmo_source_runtimes_sec_dev
        continue-on-error: true
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.sec-dev.yaml --source-id cosmo --run --run-page-limit 1 --run-graph-page-limit 1 --run-event-limit 10 --stop-running-before-run --stop-timeout-seconds 600 --allow-lease-contention-skip --failed-run-retry-seconds 600 --run-attempt-timeout-seconds 3600 --max-age-minutes 60 --wait-timeout-seconds 3600

      - name: Report Cosmo source runtime degradation (sec-dev)
        if: steps.verify_cosmo_source_runtimes_sec_dev.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Cosmo source runtime verification failed after deployment; rollout will continue and graph-health integrity checks remain blocking."
          {
            echo "### Source runtime verification degraded (sec-dev)"
            echo
            echo "Cosmo source runtime verification failed after deployment. This is reported as degraded source-provider health instead of blocking the service rollout."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AWS credentials for public-endpoint runtime verification (sec-dev)
        if: steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Refresh AWS public-endpoint runtimes (sec-dev)
        if: steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.sec-dev.yaml --source-id aws --family public_endpoint --run --max-age-minutes 60 --wait-timeout-seconds 3600

      - name: Refresh AWS credentials for graph verification (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Verify graph health (sec-dev)
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_graph_health_ecs.py --stack-file aws/Pulumi.sec-dev.yaml --wait-timeout-seconds 3600 --graph-command-retry-seconds 3600 --allow-transient-source-failures | tee graph-health-sec-dev.tsv

      - name: Upload graph health summary (sec-dev)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-health-sec-dev
          path: infra/graph-health-sec-dev.tsv
          if-no-files-found: ignore

  # Main merge: Pulumi up for go-prod stack
  deploy-go-prod:
    name: Deploy go-prod
    runs-on: ubuntu-latest
    needs: [changes, static-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.aws_go_prod == 'true'
    environment: production
    concurrency:
      group: infra-deploy-go-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
