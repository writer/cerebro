name: Infrastructure Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'go-prod'
        type: choice
        options:
          - sec-dev
          - go-prod
          - gcp-dev
          - gcp-prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cerebro
  TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
  TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

jobs:
  changes:
    name: Detect infra changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      gcp: ${{ steps.filter.outputs.gcp }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git ls-files infra > changed.txt
          else
            git diff --name-only "${base}" "${head}" > changed.txt
          fi

          aws=false
          gcp=false
          if grep -Eq '^infra/aws/' changed.txt; then aws=true; fi
          if grep -Eq '^infra/gcp/' changed.txt; then gcp=true; fi
          if grep -Eq '^infra/(pyproject.toml|uv.lock)$|^infra/scripts/|^infra/tests/' changed.txt; then
            aws=true
            if grep -Ev '^infra/scripts/verify_(graph_health|source_runtime)_ecs.py$|^infra/tests/test_verify_(graph_health|source_runtime)_ecs.py$' changed.txt | grep -Eq '^infra/(pyproject.toml|uv.lock)$|^infra/scripts/|^infra/tests/'; then
              gcp=true
            fi
          fi
          echo "aws=${aws}" >> "$GITHUB_OUTPUT"
          echo "gcp=${gcp}" >> "$GITHUB_OUTPUT"
          printf 'Changed infra paths:\n'
          cat changed.txt

  static-validation:
    name: Static infra validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Run static checks
        shell: bash
        working-directory: infra
        run: |
          uv run python -m compileall aws gcp scripts tests
          uv run python scripts/validate_stack_config.py
          uv run python -m unittest discover -s tests

  # ===========================================================================
  # AWS jobs
  # ===========================================================================

  # PR: Pulumi preview for sec-dev stack
  deploy-sec-dev:
    name: Preview sec-dev
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.aws == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack sec-dev --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Pulumi Preview (sec-dev)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: sec-dev
          work-dir: infra/aws
          diff: true
          comment-on-pr: true

  # PR: Pulumi preview for go-prod stack in sec-prod account
  preview-go-prod:
    name: Preview go-prod
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.aws == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack go-prod --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Pulumi Preview (go-prod)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: go-prod
          work-dir: infra/aws
          diff: true
          comment-on-pr: true

  # Main merge: keep sec-dev applied to the reviewed stack config
  deploy-sec-dev-main:
    name: Deploy sec-dev
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.aws == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack sec-dev --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Wait for ECR image (sec-dev)
        shell: bash
        run: bash .github/scripts/wait-for-ecr-image.sh sec-dev

      - name: Detect AWS public-endpoint refresh need (sec-dev)
        id: aws_public_endpoint_refresh
        shell: bash
        working-directory: infra
        run: uv run python scripts/detect_public_endpoint_refresh.py --stack-file aws/Pulumi.sec-dev.yaml --github-output "$GITHUB_OUTPUT"

      - name: Pulumi Up (sec-dev)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: sec-dev
          work-dir: infra/aws
          diff: true

      - name: Verify Cosmo source runtimes (sec-dev)
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.sec-dev.yaml --source-id cosmo --run --max-age-minutes 60

      - name: Refresh AWS public-endpoint runtimes (sec-dev)
        if: steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.sec-dev.yaml --source-id aws --family public_endpoint --run --max-age-minutes 60

      - name: Verify graph health (sec-dev)
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_graph_health_ecs.py --stack-file aws/Pulumi.sec-dev.yaml

  # Main merge: Pulumi up for go-prod stack
  deploy-go-prod:
    name: Deploy go-prod
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.aws == 'true'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack go-prod --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Wait for ECR image (go-prod)
        shell: bash
        run: bash .github/scripts/wait-for-ecr-image.sh go-prod

      - name: Detect AWS public-endpoint refresh need (go-prod)
        id: aws_public_endpoint_refresh
        shell: bash
        working-directory: infra
        run: uv run python scripts/detect_public_endpoint_refresh.py --stack-file aws/Pulumi.go-prod.yaml --github-output "$GITHUB_OUTPUT"

      - name: Pulumi Up (go-prod)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: go-prod
          work-dir: infra/aws
          diff: true

      - name: Verify Cosmo source runtimes (go-prod)
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.go-prod.yaml --source-id cosmo --run --max-age-minutes 60

      - name: Refresh AWS public-endpoint runtimes (go-prod)
        if: steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.go-prod.yaml --source-id aws --family public_endpoint --run --max-age-minutes 60

      - name: Verify graph health (go-prod)
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_graph_health_ecs.py --stack-file aws/Pulumi.go-prod.yaml

  # ===========================================================================
  # GCP jobs
  # ===========================================================================

  # PR: Pulumi preview for gcp-dev stack
  deploy-gcp-dev:
    name: Preview gcp-dev
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.gcp == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Authenticate to Google Cloud
        uses: WriterInternal/gcp-git-roles@0187ba36df08a6d05290458b927f1b03598d720e # v1
        with:
          deployment-profile: infra-writer-iam

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Pulumi Preview (gcp-dev)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: gcp-dev
          work-dir: infra/gcp
          diff: true
          comment-on-pr: true

  # PR: Pulumi preview for gcp-prod stack
  preview-gcp-prod:
    name: Preview gcp-prod
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.gcp == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Authenticate to Google Cloud
        uses: WriterInternal/gcp-git-roles@0187ba36df08a6d05290458b927f1b03598d720e # v1
        with:
          deployment-profile: infra-writer-iam

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Pulumi Preview (gcp-prod)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: gcp-prod
          work-dir: infra/gcp
          diff: true
          comment-on-pr: true

  # Main merge: Pulumi up for gcp-prod stack
  deploy-gcp-prod:
    name: Deploy gcp-prod
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.gcp == 'true'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Authenticate to Google Cloud
        uses: WriterInternal/gcp-git-roles@0187ba36df08a6d05290458b927f1b03598d720e # v1
        with:
          deployment-profile: infra-writer-iam

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Pulumi Up (gcp-prod)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: gcp-prod
          work-dir: infra/gcp
          diff: true

  # ===========================================================================
  # Manual deployment via workflow_dispatch
  # ===========================================================================

  deploy-manual:
    name: Manual Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        if: github.event.inputs.environment == 'sec-dev'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Configure AWS credentials (sec-prod)
        if: github.event.inputs.environment == 'go-prod'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Authenticate to Google Cloud
        if: startsWith(github.event.inputs.environment, 'gcp-')
        uses: WriterInternal/gcp-git-roles@0187ba36df08a6d05290458b927f1b03598d720e # v1
        with:
          deployment-profile: infra-writer-iam

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack ${{ github.event.inputs.environment }} --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Wait for ECR image (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: bash .github/scripts/wait-for-ecr-image.sh "${STACK_NAME}"

      - name: Detect AWS public-endpoint refresh need
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        id: aws_public_endpoint_refresh
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/detect_public_endpoint_refresh.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --github-output "$GITHUB_OUTPUT"

      - name: Pulumi Up (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: ${{ github.event.inputs.environment }}
          work-dir: infra/aws
          diff: true

      - name: Verify Cosmo source runtimes (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --source-id cosmo --run --max-age-minutes 60

      - name: Refresh AWS public-endpoint runtimes (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-') && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'"
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --source-id aws --family public_endpoint --run --max-age-minutes 60

      - name: Verify graph health (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/verify_graph_health_ecs.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml"

      - name: Pulumi Up (GCP)
        if: startsWith(github.event.inputs.environment, 'gcp-')
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: ${{ github.event.inputs.environment }}
          work-dir: infra/gcp
          diff: true
