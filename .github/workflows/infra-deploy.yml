        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Refresh AWS credentials for public-endpoint runtime verification (sec-prod)
        if: github.event.inputs.environment == 'go-prod' && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Refresh AWS public-endpoint runtimes (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-') && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'"
        shell: bash
