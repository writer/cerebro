    runs-on: ubuntu-latest
    needs: [changes, static-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.gcp == 'true'
    environment: production
    concurrency:
      group: infra-deploy-gcp-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Authenticate to Google Cloud
        uses: WriterInternal/gcp-git-roles@0187ba36df08a6d05290458b927f1b03598d720e # v1
        with:
          deployment-profile: infra-writer-iam

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Pulumi Up (gcp-prod)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: gcp-prod
          work-dir: infra/gcp
          diff: true

  # ===========================================================================
  # Manual deployment via workflow_dispatch
  # ===========================================================================

  deploy-manual:
    name: Manual Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: static-validation
    environment: production
    concurrency:
      group: infra-deploy-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        if: github.event.inputs.environment == 'sec-dev'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Configure AWS credentials (sec-prod)
        if: github.event.inputs.environment == 'go-prod'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Authenticate to Google Cloud
        if: startsWith(github.event.inputs.environment, 'gcp-')
        uses: WriterInternal/gcp-git-roles@0187ba36df08a6d05290458b927f1b03598d720e # v1
        with:
          deployment-profile: infra-writer-iam

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack ${{ github.event.inputs.environment }} --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Wait for ECR image (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: bash .github/scripts/wait-for-ecr-image.sh "${STACK_NAME}"

      - name: Detect AWS public-endpoint refresh need
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        id: aws_public_endpoint_refresh
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/detect_public_endpoint_refresh.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --github-output "$GITHUB_OUTPUT"

      - name: Verify AWS scan-role trust (AWS)
        if: github.event.inputs.environment == 'sec-dev' || github.event.inputs.environment == 'go-prod'
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/verify_aws_scan_role_trust.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --same-account-only

      - name: Pulumi Up (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: ${{ github.event.inputs.environment }}
          work-dir: infra/aws
          diff: true
          refresh: true

      - name: Refresh AWS credentials for runtime verification (sec-dev)
        if: github.event.inputs.environment == 'sec-dev'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Refresh AWS credentials for runtime verification (sec-prod)
        if: github.event.inputs.environment == 'go-prod'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Verify Cosmo source runtimes (AWS)
        id: verify_cosmo_source_runtimes_manual
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        continue-on-error: true
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: |
          extra_args=()
          if [ "${STACK_NAME}" = "sec-dev" ]; then
            extra_args+=(--stop-running-before-run --allow-lease-contention-skip)
          fi
          uv run python scripts/verify_source_runtime_ecs.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --source-id cosmo --run --run-page-limit 1 --run-graph-page-limit 1 --run-event-limit 10 "${extra_args[@]}" --stop-timeout-seconds 600 --failed-run-retry-seconds 600 --run-attempt-timeout-seconds 3600 --max-age-minutes 60 --wait-timeout-seconds 3600

      - name: Report Cosmo source runtime degradation (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-') && steps.verify_cosmo_source_runtimes_manual.outcome == 'failure'"
        shell: bash
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: |
          echo "::warning::Cosmo source runtime verification failed after deployment; rollout will continue and graph-health integrity checks remain blocking."
          {
            echo "### Source runtime verification degraded (${STACK_NAME})"
            echo
            echo "Cosmo source runtime verification failed after deployment. This is reported as degraded source-provider health instead of blocking the service rollout."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AWS credentials for public-endpoint runtime verification (sec-dev)
        if: github.event.inputs.environment == 'sec-dev' && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Refresh AWS credentials for public-endpoint runtime verification (sec-prod)
        if: github.event.inputs.environment == 'go-prod' && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Refresh AWS public-endpoint runtimes (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-') && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'"
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --source-id aws --family public_endpoint --run --max-age-minutes 60 --wait-timeout-seconds 3600

      - name: Refresh AWS credentials for graph verification (sec-dev)
        if: github.event.inputs.environment == 'sec-dev'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Refresh AWS credentials for graph verification (sec-prod)
        if: github.event.inputs.environment == 'go-prod'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Verify graph health (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/verify_graph_health_ecs.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --wait-timeout-seconds 3600 --graph-command-retry-seconds 3600 --allow-transient-source-failures | tee "graph-health-${STACK_NAME}.tsv"

      - name: Upload graph health summary (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-') && always()"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-health-${{ github.event.inputs.environment }}
          path: infra/graph-health-${{ github.event.inputs.environment }}.tsv
          if-no-files-found: ignore

      - name: Pulumi Up (GCP)
        if: startsWith(github.event.inputs.environment, 'gcp-')
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: ${{ github.event.inputs.environment }}
          work-dir: infra/gcp
          diff: true
