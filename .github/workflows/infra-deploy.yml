        working-directory: infra
        run: uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.go-prod.yaml --same-account-only

      - name: Pulumi Up (go-prod)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: go-prod
          work-dir: infra/aws
          diff: true

      - name: Refresh AWS credentials for runtime verification (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Verify Cosmo source runtimes (go-prod)
        id: verify_cosmo_source_runtimes_go_prod
        continue-on-error: true
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.go-prod.yaml --source-id cosmo --run --run-page-limit 1 --run-graph-page-limit 1 --run-event-limit 10 --stop-timeout-seconds 600 --failed-run-retry-seconds 600 --run-attempt-timeout-seconds 3600 --max-age-minutes 60 --wait-timeout-seconds 3600

      - name: Report Cosmo source runtime degradation (go-prod)
        if: steps.verify_cosmo_source_runtimes_go_prod.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Cosmo source runtime verification failed after deployment; rollout will continue and graph-health integrity checks remain blocking."
          {
            echo "### Source runtime verification degraded (go-prod)"
            echo
            echo "Cosmo source runtime verification failed after deployment. This is reported as degraded source-provider health instead of blocking the service rollout."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AWS credentials for public-endpoint runtime verification (sec-prod)
        if: steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Refresh AWS public-endpoint runtimes (go-prod)
        if: steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.go-prod.yaml --source-id aws --family public_endpoint --run --max-age-minutes 60 --wait-timeout-seconds 3600

      - name: Refresh AWS credentials for graph verification (sec-prod)
