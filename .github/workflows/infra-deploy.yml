          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Verify graph health (go-prod)
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_graph_health_ecs.py --stack-file aws/Pulumi.go-prod.yaml --wait-timeout-seconds 3600 --graph-command-retry-seconds 3600 --allow-transient-source-failures | tee graph-health-go-prod.tsv

      - name: Upload graph health summary (go-prod)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-health-go-prod
          path: infra/graph-health-go-prod.tsv
          if-no-files-found: ignore

