  # ===========================================================================
  # Manual deployment via workflow_dispatch
  # ===========================================================================

  deploy-manual:
    name: Manual Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: static-validation
    environment: production
    concurrency:
      group: infra-deploy-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        if: github.event.inputs.environment == 'sec-dev'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Configure AWS credentials (sec-prod)
        if: github.event.inputs.environment == 'go-prod'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Authenticate to Google Cloud
        if: startsWith(github.event.inputs.environment, 'gcp-')
        uses: WriterInternal/gcp-git-roles@0187ba36df08a6d05290458b927f1b03598d720e # v1
        with:
          deployment-profile: infra-writer-iam

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack ${{ github.event.inputs.environment }} --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Wait for ECR image (AWS)
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        shell: bash
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: bash .github/scripts/wait-for-ecr-image.sh "${STACK_NAME}"

      - name: Detect AWS public-endpoint refresh need
        if: "!startsWith(github.event.inputs.environment, 'gcp-')"
        id: aws_public_endpoint_refresh
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/detect_public_endpoint_refresh.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --github-output "$GITHUB_OUTPUT"

      - name: Verify AWS scan-role trust (AWS)
        if: github.event.inputs.environment == 'sec-dev' || github.event.inputs.environment == 'go-prod'
        shell: bash
        working-directory: infra
        env:
          GO_PROD_PANOPTICON_READINESS_ONLY: "true"
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          if [ "${STACK_NAME}" = "go-prod" ] && [ "${GO_PROD_PANOPTICON_READINESS_ONLY}" = "true" ]; then
            echo "go-prod Panopticon observability validation is dry-run/readiness-only; reporting prod export reader scan-role trust as not_configured/dry_run for this readiness gate."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## go-prod Panopticon readiness"
                echo ""
                echo "State: **not_configured/dry_run**"
                echo ""
                echo "Prod export reader scan-role trust is not required for dry-run/readiness-only validation. Live go-prod validation remains blocked by the full scan-role trust check."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
            uv run python scripts/verify_aws_scan_role_trust.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --same-account-only --exclude-source-id panopticon
          else
            uv run python scripts/verify_aws_scan_role_trust.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --same-account-only
          fi

      - name: Verify AWS secret imports (AWS)
        if: github.event.inputs.environment == 'go-prod'
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/verify_aws_secret_imports.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml"

      - name: Verify Cosmo source canary (AWS)
        if: github.event.inputs.environment == 'go-prod'
        shell: bash
        working-directory: infra
        env:
          STACK_NAME: ${{ github.event.inputs.environment }}
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file "aws/Pulumi.${STACK_NAME}.yaml" --source-id cosmo --run --run-page-limit 1 --run-graph-page-limit 1 --run-event-limit 20 --succeed-after-graph-ingest --allow-lease-contention-skip --allow-missing-targets --failed-run-retry-seconds 300 --run-attempt-timeout-seconds 300 --wait-timeout-seconds 900 --poll-seconds 5 --target-concurrency 2

      - name: Pulumi Up (AWS)
