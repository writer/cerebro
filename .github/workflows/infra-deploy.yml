name: Infrastructure Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'go-prod'
        type: choice
        options:
          - go-prod

env:
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  AWS_REGION: us-east-1

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd infra
          pip install -r requirements.txt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::533267360238:role/533267360238-writerinternal-cerebro-gha-oidc-role
          role-chaining: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume infra role via broker
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::533267360238:role/writer-aws-deployment-broker-role
          role-chaining: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume target account infra role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::073877318660:role/writer-aws-infra-deployment-role
          role-chaining: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Pulumi Preview
        uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: go-prod
          work-dir: infra
          comment-on-pr: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd infra
          pip install -r requirements.txt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::533267360238:role/533267360238-writerinternal-cerebro-gha-oidc-role
          role-chaining: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume infra role via broker
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::533267360238:role/writer-aws-deployment-broker-role
          role-chaining: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume target account infra role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::073877318660:role/writer-aws-infra-deployment-role
          role-chaining: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Pulumi Up
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ github.event.inputs.environment }}
          work-dir: infra
