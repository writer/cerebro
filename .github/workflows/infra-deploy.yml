name: Infrastructure Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'infra/README.md'
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'infra/README.md'
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'go-prod'
        type: choice
        options:
          - sec-dev
          - go-prod
          - gcp-dev
          - gcp-prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cerebro
  TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
  TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

jobs:
  changes:
    name: Detect infra changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      aws_sec_dev: ${{ steps.filter.outputs.aws_sec_dev }}
      aws_go_prod: ${{ steps.filter.outputs.aws_go_prod }}
      aws_sec_dev_deploy: ${{ steps.filter.outputs.aws_sec_dev_deploy }}
      aws_go_prod_deploy: ${{ steps.filter.outputs.aws_go_prod_deploy }}
      aws_sec_dev_runtime_verify: ${{ steps.filter.outputs.aws_sec_dev_runtime_verify }}
      aws_go_prod_runtime_verify: ${{ steps.filter.outputs.aws_go_prod_runtime_verify }}
      aws_sec_dev_graph_health: ${{ steps.filter.outputs.aws_sec_dev_graph_health }}
      aws_go_prod_graph_health: ${{ steps.filter.outputs.aws_go_prod_graph_health }}
      aws_sec_dev_graph_health_cache_allowed: ${{ steps.filter.outputs.aws_sec_dev_graph_health_cache_allowed }}
      aws_go_prod_graph_health_cache_allowed: ${{ steps.filter.outputs.aws_go_prod_graph_health_cache_allowed }}
      gcp: ${{ steps.filter.outputs.gcp }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git ls-files infra > changed.txt
          else
            git diff --name-only "${base}" "${head}" > changed.txt
          fi

          aws_sec_dev_deploy=false
          aws_go_prod_deploy=false
          aws_sec_dev_runtime_verify=false
          aws_go_prod_runtime_verify=false
          aws_sec_dev_graph_health=false
          aws_go_prod_graph_health=false
          gcp=false
          source_runtime_verifier_changed=false
          graph_health_verifier_changed=false
          deploy_verifier_changed=false

          if grep -Eq '^infra/scripts/verify_source_runtime_ecs\.py$|^infra/tests/test_verify_source_runtime_ecs\.py$' changed.txt; then
            source_runtime_verifier_changed=true
          fi
          if grep -Eq '^infra/scripts/verify_graph_health_ecs\.py$|^infra/tests/test_verify_graph_health_ecs\.py$' changed.txt; then
            graph_health_verifier_changed=true
          fi
          if grep -Eq '^infra/scripts/run_aws_deploy_verifications\.py$|^infra/tests/test_run_aws_deploy_verifications\.py$|^infra/scripts/(download_graph_health_artifact|plan_aws_deploy_verifications)\.py$|^infra/tests/test_(download_graph_health_artifact|plan_aws_deploy_verifications)\.py$' changed.txt; then
            deploy_verifier_changed=true
          fi

          if grep -Eq '^infra/aws/Pulumi\.sec-dev\.yaml$' changed.txt; then aws_sec_dev_deploy=true; fi
          if grep -Eq '^infra/aws/Pulumi\.go-prod\.yaml$' changed.txt; then aws_go_prod_deploy=true; fi
          if grep -Eq '^infra/aws/' changed.txt && grep -Ev '^infra/aws/Pulumi\.(sec-dev|go-prod)\.yaml$' changed.txt | grep -Eq '^infra/aws/'; then
            aws_sec_dev_deploy=true
            aws_go_prod_deploy=true
          fi
          if grep -Eq '^infra/gcp/' changed.txt; then gcp=true; fi
          if grep -Eq '^infra/(pyproject.toml|uv.lock)$' changed.txt; then
            aws_sec_dev_deploy=true
            aws_go_prod_deploy=true
            gcp=true
          fi
          if grep -Ev '^infra/scripts/(verify_(graph_health|source_runtime)_ecs|run_aws_deploy_verifications|download_graph_health_artifact|plan_aws_deploy_verifications)\.py$|^infra/tests/test_(verify_(graph_health|source_runtime)_ecs|run_aws_deploy_verifications|download_graph_health_artifact|plan_aws_deploy_verifications)\.py$' changed.txt | grep -Eq '^infra/scripts/|^infra/tests/'; then
            aws_sec_dev_deploy=true
            aws_go_prod_deploy=true
            gcp=true
          fi

          if [ "${source_runtime_verifier_changed}" = "true" ]; then
            aws_sec_dev_runtime_verify=true
            aws_go_prod_runtime_verify=true
            aws_sec_dev_graph_health=true
            aws_go_prod_graph_health=true
          fi
          if [ "${graph_health_verifier_changed}" = "true" ] || [ "${deploy_verifier_changed}" = "true" ]; then
            aws_sec_dev_graph_health=true
            aws_go_prod_graph_health=true
          fi
          if [ "${aws_sec_dev_deploy}" = "true" ]; then
            aws_sec_dev_runtime_verify=true
            aws_sec_dev_graph_health=true
          fi
          if [ "${aws_go_prod_deploy}" = "true" ]; then
            aws_go_prod_runtime_verify=true
            aws_go_prod_graph_health=true
          fi

          aws_sec_dev=false
          aws_go_prod=false
          if [ "${aws_sec_dev_deploy}" = "true" ] || [ "${aws_sec_dev_runtime_verify}" = "true" ] || [ "${aws_sec_dev_graph_health}" = "true" ]; then aws_sec_dev=true; fi
          if [ "${aws_go_prod_deploy}" = "true" ] || [ "${aws_go_prod_runtime_verify}" = "true" ] || [ "${aws_go_prod_graph_health}" = "true" ]; then aws_go_prod=true; fi
          aws=false
          if [ "${aws_sec_dev}" = "true" ] || [ "${aws_go_prod}" = "true" ]; then aws=true; fi
          aws_sec_dev_graph_health_cache_allowed=false
          aws_go_prod_graph_health_cache_allowed=false
          if [ "${aws_sec_dev_graph_health}" = "true" ] && [ "${aws_sec_dev_deploy}" != "true" ] && [ "${graph_health_verifier_changed}" != "true" ] && [ "${deploy_verifier_changed}" != "true" ]; then
            aws_sec_dev_graph_health_cache_allowed=true
          fi
          if [ "${aws_go_prod_graph_health}" = "true" ] && [ "${aws_go_prod_deploy}" != "true" ] && [ "${graph_health_verifier_changed}" != "true" ] && [ "${deploy_verifier_changed}" != "true" ]; then
            aws_go_prod_graph_health_cache_allowed=true
          fi
          {
            echo "aws=${aws}"
            echo "aws_sec_dev=${aws_sec_dev}"
            echo "aws_go_prod=${aws_go_prod}"
            echo "aws_sec_dev_deploy=${aws_sec_dev_deploy}"
            echo "aws_go_prod_deploy=${aws_go_prod_deploy}"
            echo "aws_sec_dev_runtime_verify=${aws_sec_dev_runtime_verify}"
            echo "aws_go_prod_runtime_verify=${aws_go_prod_runtime_verify}"
            echo "aws_sec_dev_graph_health=${aws_sec_dev_graph_health}"
            echo "aws_go_prod_graph_health=${aws_go_prod_graph_health}"
            echo "aws_sec_dev_graph_health_cache_allowed=${aws_sec_dev_graph_health_cache_allowed}"
            echo "aws_go_prod_graph_health_cache_allowed=${aws_go_prod_graph_health_cache_allowed}"
            echo "gcp=${gcp}"
          } >> "$GITHUB_OUTPUT"
          printf 'Changed infra paths:\n'
          cat changed.txt

  static-validation:
    name: Static infra validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Run static checks
        shell: bash
        working-directory: infra
        run: |
          uv run python -m compileall aws gcp scripts tests
          uv run python scripts/validate_readme.py
          uv run python scripts/validate_stack_config.py
          uv run python scripts/validate_gcp_config.py
          uv run python -m unittest discover -s tests

  # ===========================================================================
  # AWS jobs
  # ===========================================================================

  # PR: Pulumi preview for sec-dev stack
  deploy-sec-dev:
    name: Preview sec-dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, static-validation]
    if: github.event_name == 'pull_request' && needs.changes.outputs.aws_sec_dev_deploy == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true'
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true'
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack sec-dev --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Pulumi Preview (sec-dev)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: sec-dev
          work-dir: infra/aws
          diff: true
          comment-on-pr: true

  # PR: Pulumi preview for go-prod stack in sec-prod account
  preview-go-prod:
    name: Preview go-prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, static-validation]
    if: github.event_name == 'pull_request' && needs.changes.outputs.aws_go_prod_deploy == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack go-prod --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Pulumi Preview (go-prod)
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: go-prod
          work-dir: infra/aws
          diff: true
          comment-on-pr: true

  # Main merge: keep sec-dev applied to the reviewed stack config
  deploy-sec-dev-main:
    name: Deploy sec-dev
    runs-on: ubuntu-latest
    needs: [changes, static-validation]
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.aws_sec_dev == 'true' && !startsWith(github.event.head_commit.message, 'chore: deploy sec-dev Cerebro ') }}"
    concurrency:
      group: infra-${{ needs.changes.outputs.aws_sec_dev_deploy == 'true' && 'deploy' || 'verify' }}-sec-dev
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true'
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true'
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack sec-dev --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Wait for ECR image (sec-dev)
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true'
        shell: bash
        run: bash .github/scripts/wait-for-ecr-image.sh sec-dev

      - name: Detect AWS public-endpoint refresh need (sec-dev)
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true'
        id: aws_public_endpoint_refresh
        shell: bash
        working-directory: infra
        run: uv run python scripts/detect_public_endpoint_refresh.py --stack-file aws/Pulumi.sec-dev.yaml --github-output "$GITHUB_OUTPUT"

      - name: Verify AWS scan-role trust (sec-dev)
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.sec-dev.yaml --same-account-only

      - name: Pulumi Up (sec-dev)
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true'
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: sec-dev
          work-dir: infra/aws
          diff: true

      - name: Refresh AWS credentials for public-endpoint runtime verification (sec-dev)
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true' && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Refresh AWS public-endpoint runtimes (sec-dev)
        if: needs.changes.outputs.aws_sec_dev_deploy == 'true' && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.sec-dev.yaml --source-id aws --family public_endpoint --run --succeed-after-graph-ingest --allow-lease-contention-skip --run-attempt-timeout-seconds 900 --max-age-minutes 60 --wait-timeout-seconds 1200 --poll-seconds 5 --target-concurrency 4

      - name: Refresh AWS credentials for deployment verification (sec-dev)
        if: needs.changes.outputs.aws_sec_dev_runtime_verify == 'true' || needs.changes.outputs.aws_sec_dev_graph_health == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Plan AWS deployment verification (sec-dev)
        id: verification_plan
        if: needs.changes.outputs.aws_sec_dev_runtime_verify == 'true' || needs.changes.outputs.aws_sec_dev_graph_health == 'true'
        shell: bash
        working-directory: infra
        env:
          BASE_SHA: ${{ github.event.before }}
        run: uv run python scripts/plan_aws_deploy_verifications.py --stack-file aws/Pulumi.sec-dev.yaml --base-ref "${BASE_SHA}" --github-output "$GITHUB_OUTPUT"

      - name: Restore recent graph health cache (sec-dev)
        if: needs.changes.outputs.aws_sec_dev_graph_health_cache_allowed == 'true'
        shell: bash
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/download_graph_health_artifact.py --artifact-name graph-health-sec-dev --output graph-health-sec-dev-cache.tsv --max-age-seconds 3600

      - name: Verify deployment health (sec-dev)
        id: deployment_health_sec_dev
        if: needs.changes.outputs.aws_sec_dev_runtime_verify == 'true' || needs.changes.outputs.aws_sec_dev_graph_health == 'true'
        shell: bash
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ needs.changes.outputs.aws_sec_dev_runtime_verify }}" = "true" ]; then
            args+=(--source-runtime-verify --source-runtime-observability-targets --source-id panopticon --source-target-concurrency 4 --stop-running-source-before-run)
          fi
          if [ "${{ needs.changes.outputs.aws_sec_dev_graph_health }}" = "true" ]; then
            args+=(--graph-health --graph-health-output graph-health-sec-dev.tsv --allow-graph-health-degradation --graph-health-heal --graph-health-issue --graph-health-artifact-name graph-health-sec-dev --github-output "$GITHUB_OUTPUT")
            if [ "${{ needs.changes.outputs.aws_sec_dev_graph_health_cache_allowed }}" = "true" ]; then
              args+=(--allow-graph-health-cache --graph-health-cache-path graph-health-sec-dev-cache.tsv)
            fi
          fi
          uv run python scripts/run_aws_deploy_verifications.py --stack-file aws/Pulumi.sec-dev.yaml "${args[@]}"

      - name: Report graph health degradation (sec-dev)
        if: always() && steps.deployment_health_sec_dev.outputs.graph_health_degraded == 'true'
        shell: bash
        run: |
          echo "::warning title=Graph health degraded::sec-dev graph health degraded with category '${{ steps.deployment_health_sec_dev.outputs.graph_health_degradation_category }}'. See the graph-health-sec-dev artifact and follow-up issue."

      - name: Upload graph health summary (sec-dev)
        if: always() && needs.changes.outputs.aws_sec_dev_graph_health == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-health-sec-dev
          path: infra/graph-health-sec-dev.tsv
          if-no-files-found: ignore

  # Main merge: Pulumi up for go-prod stack
  deploy-go-prod:
    name: Deploy go-prod
    runs-on: ubuntu-latest
    needs: [changes, static-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.aws_go_prod == 'true'
    environment: production
    concurrency:
      group: infra-${{ needs.changes.outputs.aws_go_prod_deploy == 'true' && 'deploy' || 'verify' }}-go-prod
      cancel-in-progress: ${{ needs.changes.outputs.aws_go_prod_deploy != 'true' }}
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Authenticate with Pulumi Cloud
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1
        with:
          organization: writer-ai
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Set Infisical External ID
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        shell: bash
        working-directory: infra/aws
        run: uv run pulumi config set --stack go-prod --secret cerebro:infisicalExternalId "${{ secrets.INFISICAL_EXTERNAL_ID }}"

      - name: Wait for ECR image (go-prod)
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        shell: bash
        run: bash .github/scripts/wait-for-ecr-image.sh go-prod

      - name: Detect AWS public-endpoint refresh need (go-prod)
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        id: aws_public_endpoint_refresh
        shell: bash
        working-directory: infra
        run: uv run python scripts/detect_public_endpoint_refresh.py --stack-file aws/Pulumi.go-prod.yaml --github-output "$GITHUB_OUTPUT"

      - name: Verify AWS scan-role trust (go-prod)
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        shell: bash
        working-directory: infra
        env:
          GO_PROD_PANOPTICON_READINESS_ONLY: "true"
        run: |
          set -euo pipefail
          if [ "${GO_PROD_PANOPTICON_READINESS_ONLY}" = "true" ]; then
            echo "go-prod Panopticon observability validation is dry-run/readiness-only; reporting prod export reader scan-role trust as not_configured/dry_run for this readiness gate."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## go-prod Panopticon readiness"
                echo ""
                echo "State: **not_configured/dry_run**"
                echo ""
                echo "Prod export reader scan-role trust is not required for dry-run/readiness-only validation. Live go-prod validation remains blocked by the full scan-role trust check."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
            uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.go-prod.yaml --same-account-only --exclude-source-id panopticon
          else
            uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.go-prod.yaml --same-account-only
          fi

      - name: Verify AWS secret imports (go-prod)
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_aws_secret_imports.py --stack-file aws/Pulumi.go-prod.yaml

      - name: Verify Cosmo source canary (go-prod)
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.go-prod.yaml --source-id cosmo --run --run-page-limit 1 --run-graph-page-limit 1 --run-event-limit 20 --succeed-after-graph-ingest --allow-lease-contention-skip --allow-missing-targets --failed-run-retry-seconds 300 --run-attempt-timeout-seconds 300 --wait-timeout-seconds 900 --poll-seconds 5 --target-concurrency 1

      - name: Pulumi Up (go-prod)
        if: needs.changes.outputs.aws_go_prod_deploy == 'true'
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: go-prod
          work-dir: infra/aws
          diff: true

      - name: Refresh AWS credentials for public-endpoint runtime verification (sec-prod)
        if: needs.changes.outputs.aws_go_prod_deploy == 'true' && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Refresh AWS public-endpoint runtimes (go-prod)
        if: needs.changes.outputs.aws_go_prod_deploy == 'true' && steps.aws_public_endpoint_refresh.outputs.should_refresh == 'true'
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_source_runtime_ecs.py --stack-file aws/Pulumi.go-prod.yaml --source-id aws --family public_endpoint --run --succeed-after-graph-ingest --allow-lease-contention-skip --run-attempt-timeout-seconds 900 --max-age-minutes 60 --wait-timeout-seconds 1200 --poll-seconds 5 --target-concurrency 4

      - name: Refresh AWS credentials for deployment verification (sec-prod)
        if: needs.changes.outputs.aws_go_prod_runtime_verify == 'true' || needs.changes.outputs.aws_go_prod_graph_health == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Plan AWS deployment verification (go-prod)
        id: verification_plan
        if: needs.changes.outputs.aws_go_prod_runtime_verify == 'true' || needs.changes.outputs.aws_go_prod_graph_health == 'true'
        shell: bash
        working-directory: infra
        env:
          BASE_SHA: ${{ github.event.before }}
        run: uv run python scripts/plan_aws_deploy_verifications.py --stack-file aws/Pulumi.go-prod.yaml --base-ref "${BASE_SHA}" --github-output "$GITHUB_OUTPUT"

      - name: Restore recent graph health cache (go-prod)
        if: needs.changes.outputs.aws_go_prod_graph_health_cache_allowed == 'true'
        shell: bash
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/download_graph_health_artifact.py --artifact-name graph-health-go-prod --output graph-health-go-prod-cache.tsv --max-age-seconds 3600

      - name: Verify deployment health (go-prod)
        id: deployment_health_go_prod
        if: needs.changes.outputs.aws_go_prod_runtime_verify == 'true' || needs.changes.outputs.aws_go_prod_graph_health == 'true'
        shell: bash
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ needs.changes.outputs.aws_go_prod_runtime_verify }}" = "true" ]; then
            args+=(--source-runtime-verify --source-runtime-dry-run --source-runtime-observability-targets --source-runtime-allow-missing-targets --source-id panopticon --source-target-concurrency 2)
          fi
          if [ "${{ needs.changes.outputs.aws_go_prod_graph_health }}" = "true" ]; then
            args+=(--graph-health --graph-health-output graph-health-go-prod.tsv --allow-graph-health-degradation --graph-health-heal --graph-health-issue --graph-health-artifact-name graph-health-go-prod --github-output "$GITHUB_OUTPUT")
            if [ "${{ needs.changes.outputs.aws_go_prod_graph_health_cache_allowed }}" = "true" ]; then
              args+=(--allow-graph-health-cache --graph-health-cache-path graph-health-go-prod-cache.tsv)
            fi
          fi
          uv run python scripts/run_aws_deploy_verifications.py --stack-file aws/Pulumi.go-prod.yaml "${args[@]}"

      - name: Report graph health degradation (go-prod)
        if: always() && steps.deployment_health_go_prod.outputs.graph_health_degraded == 'true'
        shell: bash
        run: |
          echo "::warning title=Graph health degraded::go-prod graph health degraded with category '${{ steps.deployment_health_go_prod.outputs.graph_health_degradation_category }}'. See the graph-health-go-prod artifact and follow-up issue."

      - name: Upload graph health summary (go-prod)
        if: always() && needs.changes.outputs.aws_go_prod_graph_health == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-health-go-prod
          path: infra/graph-health-go-prod.tsv
          if-no-files-found: ignore

