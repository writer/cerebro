name: Security Source Scan

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run govulncheck
        run: make govulncheck

  gosec-source-scan:
    name: gosec-source-scan shard ${{ matrix.shard_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
        shard_total: [4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.24.7

      - name: Run gosec shard (JSON report)
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
          GOSEC_BATCH_SIZE: "12"
        run: |
          set -euo pipefail
          report_path="gosec-report-${SHARD_INDEX}.json"
          mapfile -t all_packages < <(go list -f '{{.Dir}}' ./...)
          selected=()
          for i in "${!all_packages[@]}"; do
            if (( i % SHARD_TOTAL == SHARD_INDEX )); then
              selected+=("${all_packages[$i]}")
            fi
          done
          echo "Running gosec shard ${SHARD_INDEX} with ${#selected[@]} packages"
          printf '{"Issues":[]}' > "${report_path}"
          if [ "${#selected[@]}" -eq 0 ]; then
            exit 0
          fi

          # gosec retains every analysed package for the life of the process, so
          # one invocation over a whole shard grows until the hosted runner is
          # killed mid-scan (exit 143, "runner has received a shutdown signal").
          # Scan in bounded batches and merge the per-batch reports instead.
          rm -rf gosec-batches
          mkdir gosec-batches
          batch_index=0
          for (( start = 0; start < ${#selected[@]}; start += GOSEC_BATCH_SIZE )); do
            batch=("${selected[@]:start:GOSEC_BATCH_SIZE}")
            batch_report="gosec-batches/batch-${batch_index}.json"
            echo "gosec batch ${batch_index}: ${#batch[@]} package(s)"
            # gosec exits non-zero when it reports findings, so its status is not
            # a usable error signal; an unwritten report is.
            "$(go env GOPATH)/bin/gosec" -severity medium -confidence medium \
              -exclude-generated -fmt=json -out "${batch_report}" "${batch[@]}" || true
            if [ ! -s "${batch_report}" ]; then
              echo "ERROR: gosec wrote no report for batch ${batch_index}; these packages went unscanned:" >&2
              printf '  %s\n' "${batch[@]}" >&2
              exit 1
            fi
            batch_index=$((batch_index + 1))
          done

          python3 - "${report_path}" gosec-batches/*.json <<'PY'
          import json
          import sys

          out_path, *batch_paths = sys.argv[1:]
          issues = []
          for path in batch_paths:
              with open(path, "r", encoding="utf-8") as handle:
                  issues.extend(json.load(handle).get("Issues") or [])
          with open(out_path, "w", encoding="utf-8") as handle:
              json.dump({"Issues": issues}, handle)
          print(f"merged {len(batch_paths)} batch report(s): {len(issues)} finding(s)")
          PY

      - name: Fail on HIGH findings
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          report_path="gosec-report-${SHARD_INDEX}.json"
          python3 - "${report_path}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], 'r', encoding='utf-8') as f:
              data = json.load(f)

          issues = data.get('Issues') or []
          high = [i for i in issues if str(i.get('severity', '')).upper() == 'HIGH']

          print(f"Total gosec findings: {len(issues)}")
          print(f"HIGH findings: {len(high)}")
          for finding in high:
              print(
                  f"- {finding.get('rule_id')} {finding.get('file')}:{finding.get('line')} "
                  f"{finding.get('details', '').strip()}"
              )

          if high:
              sys.exit(1)
          PY

      - name: Upload gosec report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosec-report-${{ matrix.shard_index }}
          path: gosec-report-${{ matrix.shard_index }}.json
