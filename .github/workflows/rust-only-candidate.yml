name: Rust-only Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Commit on main to rebuild as a Rust-only candidate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rust-only-candidate
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      image_tag: ${{ steps.candidate.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the main commit
        id: candidate
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          sha="$(git rev-parse "${REQUESTED_SHA}^{commit}")"
          git merge-base --is-ancestor "${sha}" origin/main
          {
            echo "sha=${sha}"
            echo "image_tag=candidate-${sha}"
          } >>"${GITHUB_OUTPUT}"

  image:
    runs-on: ${{ matrix.runner }}
    needs: resolve
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the native Rust image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.rust
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cerebro-rust:${{ needs.resolve.outputs.image_tag }}-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-24.04
    needs: [resolve, image]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Publish the Rust manifest
        id: publish
        shell: bash
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cerebro-rust
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE_BASE}:${IMAGE_TAG}" \
            "${IMAGE_BASE}:${IMAGE_TAG}-amd64" "${IMAGE_BASE}:${IMAGE_TAG}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE_BASE}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
      - name: Sign the Rust image
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cerebro-rust
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: bash .github/scripts/cosign.sh sign --yes "${IMAGE_BASE}@${DIGEST}"
      - name: Attest Rust image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cerebro-rust
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  e2e:
    runs-on: ubuntu-24.04
    needs: [resolve, manifest]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and pull the exact Rust candidate
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cerebro-rust@${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          bash .github/scripts/cosign.sh verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/rust-only-candidate.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${CANDIDATE_IMAGE}" >/dev/null
          docker pull --platform linux/amd64 "${CANDIDATE_IMAGE}"
          runtime_image_id="$(docker image inspect --format '{{.Id}}' "${CANDIDATE_IMAGE}")"
          [[ "${runtime_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "CEREBRO_TEST_RUNTIME_IMAGE_ID=${runtime_image_id}" >>"${GITHUB_ENV}"
      - name: Assert the candidate contains no Go server
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cerebro-rust@${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          config="$(docker image inspect "${CANDIDATE_IMAGE}")"
          test "$(jq -c '.[0].Config.Entrypoint' <<<"${config}")" = '["/usr/local/bin/cerebro-platform"]'
          test "$(jq -c '.[0].Config.Cmd' <<<"${config}")" = '["serve-neo4j-consumer"]'
          docker run --rm --entrypoint /bin/sh "${CANDIDATE_IMAGE}" -euc '
            test ! -e /usr/local/bin/cerebro
            test ! -e /usr/local/go/bin/go
            test ! -e /usr/bin/go
            test ! -e /bin/go
            test -x /usr/local/bin/cerebro-platform
            test -x /usr/local/bin/cerebro-event-admission-worker
          '
          summary="$(docker run --rm "${CANDIDATE_IMAGE}" catalog-summary)"
          test "$(jq -r .sources <<<"${summary}")" -eq 799
          test "$(jq -r .families <<<"${summary}")" -eq 3938
      - name: Start disposable PostgreSQL, Neo4j, and JetStream
        run: |
          set -euo pipefail
          docker network create cerebro-rust-only-e2e
          docker run -d --name cerebro-rust-only-postgres --network cerebro-rust-only-e2e \
            -e POSTGRES_USER=cerebro -e POSTGRES_PASSWORD=cerebro -e POSTGRES_DB=cerebro \
            -p 5432:5432 postgres:16-alpine
          docker run -d --name cerebro-rust-only-neo4j --network cerebro-rust-only-e2e \
            -e NEO4J_AUTH=neo4j/local-password -p 7687:7687 neo4j:5-community
          docker run -d --name cerebro-rust-only-nats --network cerebro-rust-only-e2e \
            -p 4222:4222 nats:2.10-alpine -js -sd /data
          for attempt in $(seq 1 60); do
            docker exec cerebro-rust-only-postgres pg_isready -U cerebro -d cerebro >/dev/null 2>&1 \
              && docker exec cerebro-rust-only-neo4j cypher-shell -u neo4j -p local-password \
                'RETURN 1' >/dev/null 2>&1 \
              && docker run --rm --network cerebro-rust-only-e2e natsio/nats-box:0.18.0 \
                nats --server nats://cerebro-rust-only-nats:4222 server check connection >/dev/null 2>&1 \
              && break
            test "${attempt}" -lt 60
            sleep 1
          done
          docker run --rm --network cerebro-rust-only-e2e natsio/nats-box:0.18.0 \
            nats --server nats://cerebro-rust-only-nats:4222 stream add CEREBRO_EVENTS \
              --subjects "events.>" --storage file --retention limits --discard old \
              --replicas 1 --dupe-window 2m --defaults
      - name: Run the candidate through its declared Rust entrypoint
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cerebro-rust@${{ needs.manifest.outputs.digest }}
          GRAPH_SECRET: rust-only-candidate-e2e-secret-32-bytes
        run: |
          docker run -d --name cerebro-rust-only-platform --network cerebro-rust-only-e2e \
            -p 18080:8080 \
            -e CEREBRO_NEO4J_URI=bolt://cerebro-rust-only-neo4j:7687 \
            -e CEREBRO_NEO4J_USERNAME=neo4j \
            -e CEREBRO_NEO4J_PASSWORD=local-password \
            -e 'CEREBRO_POSTGRES_DSN=postgres://cerebro:cerebro@cerebro-rust-only-postgres:5432/cerebro?sslmode=disable' \
            -e CEREBRO_JETSTREAM_URL=nats://cerebro-rust-only-nats:4222 \
            -e CEREBRO_RUST_BIND=0.0.0.0:8080 \
            -e CEREBRO_REPOSITORY_ROOT=/app \
            -e CEREBRO_ORGANIZATIONAL_GRAPH_SHARED_SECRET="${GRAPH_SECRET}" \
            "${CANDIDATE_IMAGE}"
      - name: Seed, restart, and verify the Rust-only runtime
        env:
          CEREBRO_TEST_POSTGRES_DSN: postgres://cerebro:cerebro@127.0.0.1:5432/cerebro?sslmode=disable
          CEREBRO_TEST_NEO4J_URI: bolt://127.0.0.1:7687
          CEREBRO_TEST_NEO4J_USERNAME: neo4j
          CEREBRO_TEST_NEO4J_PASSWORD: local-password
          CEREBRO_TEST_NATS_URL: nats://127.0.0.1:4222
          CEREBRO_TEST_GRAPH_URL: http://127.0.0.1:18080
          CEREBRO_ORGANIZATIONAL_GRAPH_SHARED_SECRET: rust-only-candidate-e2e-secret-32-bytes
          CEREBRO_TEST_COMMIT: ${{ needs.resolve.outputs.sha }}
          CEREBRO_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/cerebro-rust:${{ needs.resolve.outputs.image_tag }}
          CEREBRO_TEST_IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
          CEREBRO_TEST_PLATFORM: linux/amd64
          CEREBRO_TEST_CHECKPOINT: .dist/rust-only-e2e/checkpoint.json
          CEREBRO_TEST_RECEIPT: .dist/rust-only-e2e/rust-only-e2e-receipt.json
          CEREBRO_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cargo +1.93.1 run --locked -p cerebro-platform --example organizational_graph_e2e -- seed
          docker restart cerebro-rust-only-platform
          cargo +1.93.1 run --locked -p cerebro-platform --example organizational_graph_e2e -- verify
          jq '
            .schema_version = "cerebro.rust-only-e2e/v1"
            | .checks += [
                {name:"rust_entrypoint",status:"passed",evidence:"image starts cerebro-platform directly"},
                {name:"go_binary_absent",status:"passed",evidence:"/usr/local/bin/cerebro is absent"},
                {name:"source_catalog",status:"passed",evidence:"799 sources and 3938 families loaded"}
              ]
          ' .dist/rust-only-e2e/rust-only-e2e-receipt.json \
            > .dist/rust-only-e2e/receipt.tmp
          mv .dist/rust-only-e2e/receipt.tmp .dist/rust-only-e2e/rust-only-e2e-receipt.json
          test "$(jq '[.checks[] | select(.status == "passed")] | length' \
            .dist/rust-only-e2e/rust-only-e2e-receipt.json)" -eq 17
      - name: Prove backend failure blocks readiness
        run: |
          set -euo pipefail
          test "$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz)" = 200
          test "$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/readyz)" = 200
          docker stop cerebro-rust-only-neo4j
          body="${RUNNER_TEMP}/rust-only-readiness.json"
          test "$(curl --max-time 90 -sS -o "${body}" -w '%{http_code}' http://127.0.0.1:18080/readyz)" = 503
          jq -e '.code == "graph_unavailable"' "${body}" >/dev/null
          test "$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz)" = 200
      - name: Attach the Rust-only receipt
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cerebro-rust@${{ needs.manifest.outputs.digest }}
        run: |
          bash .github/scripts/cosign.sh attest --yes \
            --type "https://writer.com/cerebro/rust-only-e2e/v1" \
            --predicate .dist/rust-only-e2e/rust-only-e2e-receipt.json \
            "${CANDIDATE_IMAGE}"
      - name: Print Rust runtime logs
        if: always()
        run: docker logs cerebro-rust-only-platform 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-only-e2e-${{ needs.resolve.outputs.sha }}
          path: .dist/rust-only-e2e/rust-only-e2e-receipt.json
          if-no-files-found: error

  receipt:
    runs-on: ubuntu-24.04
    needs: [resolve, manifest, e2e]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-only-e2e-${{ needs.resolve.outputs.sha }}
          path: rust-only
      - name: Write the Rust-only candidate receipt
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(jq -r .schema_version rust-only/rust-only-e2e-receipt.json)" = "cerebro.rust-only-e2e/v1"
          test "$(jq -r .commit rust-only/rust-only-e2e-receipt.json)" = "${CANDIDATE_SHA}"
          test "$(jq -r .image_digest rust-only/rust-only-e2e-receipt.json)" = "${IMAGE_DIGEST}"
          e2e_sha256="$(sha256sum rust-only/rust-only-e2e-receipt.json | awk '{print $1}')"
          jq -n \
            --arg schema_version "cerebro.rust-only-candidate/v1" \
            --arg commit "${CANDIDATE_SHA}" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cerebro-rust:${IMAGE_TAG}" \
            --arg image_digest "${IMAGE_DIGEST}" \
            --arg e2e_sha256 "${e2e_sha256}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{schema_version:$schema_version,commit:$commit,image:$image,image_digest:$image_digest,e2e_receipt_sha256:$e2e_sha256,run_id:$run_id}' \
            > rust-only/rust-only-candidate-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cerebro-rust-only-candidate-${{ needs.resolve.outputs.sha }}
          path: rust-only
          if-no-files-found: error
          retention-days: 30
