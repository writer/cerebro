name: Portable Consumer Chain

on:
  pull_request:
    paths:
      - .github/workflows/portable-consumer-chain.yml
      - api/openapi.yaml
      - schemas/agent-service-lifecycle*.json
      - schemas/product-release*.json
      - internal/agentplatform/**
      - tools/agentlifecyclegen/**
      - tools/openapitsgen/**
      - sdk/typescript/**
      - apps/web/**
      - apps/slack-companion/**
      - package.json
      - package-lock.json
      - scripts/release/product_release.py
      - scripts/release/verify_portable_consumer_chain.sh
      - tools/archtests/portable_consumer_chain_test.go
  push:
    branches:
      - main
    paths:
      - .github/workflows/portable-consumer-chain.yml
      - api/openapi.yaml
      - schemas/agent-service-lifecycle*.json
      - schemas/product-release*.json
      - internal/agentplatform/**
      - tools/agentlifecyclegen/**
      - tools/openapitsgen/**
      - sdk/typescript/**
      - apps/web/**
      - apps/slack-companion/**
      - package.json
      - package-lock.json
      - scripts/release/product_release.py
      - scripts/release/verify_portable_consumer_chain.sh
      - tools/archtests/portable_consumer_chain_test.go
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Fall back to direct module fetches when proxy.golang.org returns a
  # transient error; go.sum still verifies every module either way.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  portable-consumer-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-javascript-workspaces
        with:
          install: "false"

      - name: Verify portable contract consumers and release inputs
        run: scripts/release/verify_portable_consumer_chain.sh
