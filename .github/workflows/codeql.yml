name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go build data
        if: matrix.language == 'go'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v2-codeql-go-${{ hashFiles('go.sum', 'internal/eventregistry/go.sum', 'sdk/go/cerebroapi/go.sum', 'tools/linters/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v2-codeql-go-${{ hashFiles('go.sum', 'internal/eventregistry/go.sum', 'sdk/go/cerebroapi/go.sum', 'tools/linters/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v2-codeql-go-
            ${{ runner.os }}-${{ runner.arch }}-go-v2-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          config-file: ./.github/codeql-config.yml
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Build Go modules
        if: matrix.language == 'go'
        env:
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          go build ./...
          go -C internal/eventregistry build ./...
          go -C sdk/go/cerebroapi build ./...
          go -C tools/linters build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
