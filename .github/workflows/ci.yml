name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  SEC_DEV_ACCOUNT_ID: "944130631940"
  SEC_PROD_ACCOUNT_ID: "837279440628"
  ECR_REPOSITORY: cerebro
  GHCR_IMAGE: ghcr.io/writer/cerebro

jobs:
  # PR: Pull from GHCR and push to sec-dev ECR
  publish-sec-dev:
    name: Publish to sec-dev ECR
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read image tag from Pulumi config
        id: image-tag
        shell: bash
        run: |
          tag=$(grep 'cerebro:imageTag:' infra/aws/Pulumi.sec-dev.yaml | awk '{print $2}')
          if [ -z "${tag}" ]; then
            echo "ERROR: cerebro:imageTag not found in Pulumi.sec-dev.yaml"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${tag}"

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_DEV_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@183a1442edf41672e66566b7fc560e297a290896 # v2

      - name: Pull from GHCR, retag, and push to ECR
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          echo "Pulling ${GHCR_IMAGE}:${IMAGE_TAG} from GHCR..."
          docker pull "${GHCR_IMAGE}:${IMAGE_TAG}"

          docker tag "${GHCR_IMAGE}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Pushed ${IMAGE_TAG} to sec-dev ECR"

  # Main merge: Pull from GHCR and push to sec-prod ECR
  publish-sec-prod:
    name: Publish to sec-prod ECR
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read image tag from Pulumi config
        id: image-tag
        shell: bash
        run: |
          tag=$(grep 'cerebro:imageTag:' infra/aws/Pulumi.go-prod.yaml | awk '{print $2}')
          if [ -z "${tag}" ]; then
            echo "ERROR: cerebro:imageTag not found in Pulumi.go-prod.yaml"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${tag}"

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_PROD_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@183a1442edf41672e66566b7fc560e297a290896 # v2

      - name: Pull from GHCR, retag, and push to ECR
        id: publish
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Pulling ${GHCR_IMAGE}:${IMAGE_TAG} from GHCR..."
          docker pull "${GHCR_IMAGE}:${IMAGE_TAG}"

          docker tag "${GHCR_IMAGE}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Pushed ${IMAGE_TAG} to sec-prod ECR"
