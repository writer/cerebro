name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  SEC_DEV_ACCOUNT_ID: "944130631940"
  SEC_PROD_ACCOUNT_ID: "837279440628"
  ECR_REPOSITORY: cerebro
  GHCR_IMAGE: ghcr.io/writer/cerebro
  WEB_GHCR_IMAGE: ghcr.io/writer/cerebro-web

jobs:
  changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    outputs:
      sec_dev: ${{ steps.filter.outputs.sec_dev }}
      go_prod: ${{ steps.filter.outputs.go_prod }}
      ci_workflow: ${{ steps.filter.outputs.ci_workflow }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed deployment inputs
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            {
              echo "sec_dev=true"
              echo "go_prod=true"
              echo "ci_workflow=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${BEFORE_SHA}"
            head="${HEAD_SHA}"
            if [ -z "${base}" ] || [[ "${base}" =~ ^0+$ ]]; then
              base="${HEAD_SHA}^"
            fi
          fi

          if ! git diff --name-only "${base}" "${head}" > changed-files.txt; then
            echo "::warning::Could not diff ${base}..${head}; running all deployment CI jobs"
            {
              echo "sec_dev=true"
              echo "go_prod=true"
              echo "ci_workflow=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sec_dev=false
          go_prod=false
          ci_workflow=false
          while IFS= read -r file; do
            case "${file}" in
              infra/aws/Pulumi.sec-dev.yaml) sec_dev=true ;;
              infra/aws/Pulumi.go-prod.yaml) go_prod=true ;;
              .github/workflows/ci.yml) ci_workflow=true ;;
            esac
          done < changed-files.txt

          {
            echo "sec_dev=${sec_dev}"
            echo "go_prod=${go_prod}"
            echo "ci_workflow=${ci_workflow}"
          } >> "$GITHUB_OUTPUT"

  # Pull from GHCR and push to sec-dev ECR for PR previews and main deploys.
  publish-sec-dev:
    name: Publish to sec-dev ECR
    needs: [changes]
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch' || (((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (needs.changes.outputs.sec_dev == 'true' || needs.changes.outputs.ci_workflow == 'true'))
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read image tag from Pulumi config
        id: image-tag
        shell: bash
        run: |
          tag=$(grep 'cerebro:imageTag:' infra/aws/Pulumi.sec-dev.yaml | awk '{print $2}')
          if [ -z "${tag}" ]; then
            echo "ERROR: cerebro:imageTag not found in Pulumi.sec-dev.yaml"
            exit 1
          fi
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid Cerebro image tag: ${tag}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${tag}"

      - name: Check GHCR image availability
        id: ghcr-image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          if docker manifest inspect "${GHCR_IMAGE}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Found ${GHCR_IMAGE}:${IMAGE_TAG}"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping sec-dev ECR publish because ${GHCR_IMAGE}:${IMAGE_TAG} is not available in GHCR yet"
          fi

      - name: Read web image tag from Pulumi config
        id: web-image-tag
        shell: bash
        run: |
          tag=$(grep 'cerebro:webImageTag:' infra/aws/Pulumi.sec-dev.yaml | awk '{print $2}' || true)
          if [ -n "${tag}" ] && ! [[ "${tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "ERROR: invalid Cerebro web image tag: ${tag}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "${tag}" ]; then
            echo "Resolved web image tag: ${tag}"
          else
            echo "::notice::cerebro:webImageTag not configured; skipping web image publish"
          fi

      - name: Log in to GHCR for web image
        if: steps.web-image-tag.outputs.tag != ''
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check web GHCR image availability
        id: web-ghcr-image
        if: steps.web-image-tag.outputs.tag != ''
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.web-image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          if docker manifest inspect "${WEB_GHCR_IMAGE}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Found ${WEB_GHCR_IMAGE}:${IMAGE_TAG}"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping sec-dev web ECR publish because ${WEB_GHCR_IMAGE}:${IMAGE_TAG} is not available in GHCR yet"
          fi

      - name: Set up Go for cosign
        if: steps.ghcr-image.outputs.available == 'true' || steps.web-ghcr-image.outputs.available == 'true'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.3"

      - name: Install cosign
        if: steps.ghcr-image.outputs.available == 'true' || steps.web-ghcr-image.outputs.available == 'true'
        shell: bash
        run: bash .github/scripts/install-cosign.sh

      - name: Verify GHCR image signature and attestations
        id: verify-ghcr-image
        if: steps.ghcr-image.outputs.available == 'true'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          escaped_tag="$(python3 - <<'PY'
          import os
          import re

          print(re.escape(os.environ["IMAGE_TAG"]))
          PY
          )"
          bash .github/scripts/verify-ghcr-image.sh \
            "${GHCR_IMAGE}" \
            "${IMAGE_TAG}" \
            "^https://github\.com/writer/cerebro/\.github/workflows/release\.yml@refs/tags/${escaped_tag}$"

      - name: Verify web GHCR image signature
        id: verify-web-ghcr-image
        if: steps.web-ghcr-image.outputs.available == 'true'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.web-image-tag.outputs.tag }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          bash .github/scripts/verify-ghcr-image.sh \
            "${WEB_GHCR_IMAGE}" \
            "${IMAGE_TAG}" \
            "^https://github\.com/writer/cerebro-web/\.github/workflows/release\.yml@refs/heads/main$"

      - name: Verify web GHCR build attestations
        if: steps.web-ghcr-image.outputs.available == 'true'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.verify-web-ghcr-image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${WEB_GHCR_IMAGE}@${IMAGE_DIGEST}" --raw > web-image-index.json
          if ! jq -e '.manifests[]? | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")' web-image-index.json >/dev/null; then
            echo "No SBOM/provenance attestation manifests found for ${WEB_GHCR_IMAGE}@${IMAGE_DIGEST}" >&2
            cat web-image-index.json >&2
            exit 1
          fi

      - name: Configure AWS credentials (sec-dev)
        if: steps.ghcr-image.outputs.available == 'true' || steps.web-ghcr-image.outputs.available == 'true'
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_DEV_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        if: steps.ghcr-image.outputs.available == 'true' || steps.web-ghcr-image.outputs.available == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@183a1442edf41672e66566b7fc560e297a290896 # v2

      - name: Pull from GHCR, retag, and push to ECR
        id: publish
        if: steps.ghcr-image.outputs.available == 'true'
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.verify-ghcr-image.outputs.digest }}
        run: |
          set -euo pipefail
          ecr_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image=${ecr_image}" >> "$GITHUB_OUTPUT"
          source_image="${GHCR_IMAGE}@${IMAGE_DIGEST}"

          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "${ecr_image} already exists; skipping immutable ECR push and Trivy scan"
            exit 0
          fi

          echo "Pulling verified ${source_image} from GHCR..."
          docker pull "${source_image}"

          docker tag "${source_image}" "${ecr_image}"
          docker push "${ecr_image}"

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_TAG} (${IMAGE_DIGEST}) to sec-dev ECR"

      - name: Pull web from GHCR, retag, and push to ECR
        id: publish-web
        if: steps.web-ghcr-image.outputs.available == 'true'
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.web-image-tag.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.verify-web-ghcr-image.outputs.digest }}
        run: |
          set -euo pipefail
          ecr_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image=${ecr_image}" >> "$GITHUB_OUTPUT"
          source_image="${WEB_GHCR_IMAGE}@${IMAGE_DIGEST}"

          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "${ecr_image} already exists; skipping immutable ECR push and Trivy scan"
            exit 0
          fi

          echo "Pulling verified ${source_image} from GHCR..."
          docker pull "${source_image}"

          docker tag "${source_image}" "${ecr_image}"
          docker push "${ecr_image}"

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed web ${IMAGE_TAG} (${IMAGE_DIGEST}) to sec-dev ECR"

      - name: Scan sec-dev ECR image
        if: steps.publish.outputs.pushed == 'true'
        shell: bash
        env:
          ECR_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cache/trivy"
          docker run --rm \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            aquasec/trivy:0.66.0 image \
            --exit-code 0 \
            --ignore-unfixed \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "${ECR_IMAGE}"
          docker run --rm \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            aquasec/trivy:0.66.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --severity CRITICAL \
            "${ECR_IMAGE}"

      - name: Scan sec-dev web ECR image
        if: steps.publish-web.outputs.pushed == 'true'
        shell: bash
        env:
          ECR_IMAGE: ${{ steps.publish-web.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cache/trivy"
          docker run --rm \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            aquasec/trivy:0.66.0 image \
            --exit-code 0 \
            --ignore-unfixed \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "${ECR_IMAGE}"
          docker run --rm \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            aquasec/trivy:0.66.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --severity CRITICAL \
            "${ECR_IMAGE}"

  # Main merge: Pull from GHCR and push to sec-prod ECR
  publish-sec-prod:
    name: Publish to sec-prod ECR
    needs: [changes]
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.go_prod == 'true' || needs.changes.outputs.ci_workflow == 'true')
    permissions:
      id-token: write
      contents: read
      packages: read
    outputs:
      image_tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read image tag from Pulumi config
        id: image-tag
        shell: bash
        run: |
          tag=$(grep 'cerebro:imageTag:' infra/aws/Pulumi.go-prod.yaml | awk '{print $2}')
          if [ -z "${tag}" ]; then
            echo "ERROR: cerebro:imageTag not found in Pulumi.go-prod.yaml"
            exit 1
          fi
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid Cerebro image tag: ${tag}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${tag}"

      - name: Set up Go for cosign
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.3"

      - name: Install cosign
        shell: bash
        run: bash .github/scripts/install-cosign.sh

      - name: Verify GHCR image signature and attestations
        id: verify-ghcr-image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          escaped_tag="$(python3 - <<'PY'
          import os
          import re

          print(re.escape(os.environ["IMAGE_TAG"]))
          PY
          )"
          bash .github/scripts/verify-ghcr-image.sh \
            "${GHCR_IMAGE}" \
            "${IMAGE_TAG}" \
            "^https://github\.com/writer/cerebro/\.github/workflows/release\.yml@refs/tags/${escaped_tag}$"

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_PROD_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@183a1442edf41672e66566b7fc560e297a290896 # v2

      - name: Pull from GHCR, retag, and push to ECR
        id: publish
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.verify-ghcr-image.outputs.digest }}
        run: |
          set -euo pipefail
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          ecr_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image=${ecr_image}" >> "$GITHUB_OUTPUT"
          source_image="${GHCR_IMAGE}@${IMAGE_DIGEST}"

          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "${ecr_image} already exists; skipping immutable ECR push and Trivy scan"
            exit 0
          fi

          echo "Pulling verified ${source_image} from GHCR..."
          docker pull "${source_image}"

          docker tag "${source_image}" "${ecr_image}"
          docker push "${ecr_image}"

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_TAG} (${IMAGE_DIGEST}) to sec-prod ECR"

      - name: Scan sec-prod ECR image
        if: steps.publish.outputs.pushed == 'true'
        shell: bash
        env:
          ECR_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cache/trivy"
          docker run --rm \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            aquasec/trivy:0.66.0 image \
            --exit-code 0 \
            --ignore-unfixed \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "${ECR_IMAGE}"
          docker run --rm \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            aquasec/trivy:0.66.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --severity CRITICAL \
            "${ECR_IMAGE}"
