name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  SEC_DEV_ACCOUNT_ID: "944130631940"
  SEC_PROD_ACCOUNT_ID: "837279440628"
  ECR_REPOSITORY: cerebro
  # sec-dev ECS config
  SEC_DEV_ECS_CLUSTER: cerebro-sec-dev-cluster
  SEC_DEV_ECS_SERVICES: "cerebro-sec-dev-api cerebro-sec-dev-worker"
  # sec-prod ECS config
  SEC_PROD_ECS_CLUSTER: cerebro-go-production-cluster
  SEC_PROD_ECS_SERVICES: "cerebro-go-production-api cerebro-go-production-worker"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0  # Supports Go 1.25
          # staticcheck is already enabled in .golangci.yml

  policy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o cerebro ./cmd/cerebro

      - name: Validate policies
        run: ./cerebro policy validate

  # PR: Build and push to sec-dev ECR
  build-and-push-sec-dev:
    name: Build & Push to sec-dev ECR
    runs-on: ubuntu-latest
    needs: [test, lint, policy-validate]
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (sec-dev)
        uses: writerInternal/aws-git-roles@v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_DEV_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check existing image tag
        id: tag-check
        shell: bash
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          echo "tag=${short_sha}" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${short_sha}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=,format=short,enable=${{ steps.tag-check.outputs.exists != 'true' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Main merge: Build and push to sec-prod ECR
  build-and-push-sec-prod:
    name: Build & Push to sec-prod ECR
    runs-on: ubuntu-latest
    needs: [test, lint, policy-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (sec-prod)
        uses: writerInternal/aws-git-roles@v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_PROD_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check existing image tag
        id: tag-check
        shell: bash
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          echo "tag=${short_sha}" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${short_sha}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=,format=short,enable=${{ steps.tag-check.outputs.exists != 'true' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PR: Deploy to sec-dev ECS
  deploy-sec-dev:
    name: Deploy to sec-dev ECS
    runs-on: ubuntu-latest
    needs: build-and-push-sec-dev
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (sec-dev)
        uses: writerInternal/aws-git-roles@v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_DEV_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Check sec-dev secrets
        id: sec-dev-secrets
        run: |
          missing=0
          for secret in SNOWFLAKE_PRIVATE_KEY SNOWFLAKE_ACCOUNT SNOWFLAKE_USER; do
            if ! aws secretsmanager describe-secret --secret-id "cerebro-sec-dev/${secret}" >/dev/null 2>&1; then
              echo "Missing secret: ${secret}"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Force new deployment
        if: steps.sec-dev-secrets.outputs.present == 'true'
        run: |
          for service in ${{ env.SEC_DEV_ECS_SERVICES }}; do
            aws ecs update-service \
              --cluster ${{ env.SEC_DEV_ECS_CLUSTER }} \
              --service $service \
              --force-new-deployment
          done

      - name: Wait for deployment
        if: steps.sec-dev-secrets.outputs.present == 'true'
        timeout-minutes: 30
        run: |
          log_service_debug() {
            local service=$1
            echo "Service status for $service:"
            aws ecs describe-services \
              --cluster ${{ env.SEC_DEV_ECS_CLUSTER }} \
              --services "$service" \
              --query 'services[0].{deployments:deployments,events:events[0:5]}' \
              --output json
            STOPPED_TASKS=$(aws ecs list-tasks \
              --cluster ${{ env.SEC_DEV_ECS_CLUSTER }} \
              --service-name "$service" \
              --desired-status STOPPED \
              --max-items 5 \
              --query 'taskArns' \
              --output text)
            if [ -n "$STOPPED_TASKS" ] && [ "$STOPPED_TASKS" != "None" ]; then
              aws ecs describe-tasks \
                --cluster ${{ env.SEC_DEV_ECS_CLUSTER }} \
                --tasks $STOPPED_TASKS \
                --query 'tasks[].{task:taskArn,lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
                --output json
            else
              echo "No stopped tasks found for $service"
            fi
          }

          echo "Waiting for ECS deployment to stabilize..."
          for service in ${{ env.SEC_DEV_ECS_SERVICES }}; do
            echo "Waiting for $service to stabilize..."
            for i in {1..120}; do
              STATUS=$(aws ecs describe-services \
                --cluster ${{ env.SEC_DEV_ECS_CLUSTER }} \
                --services $service \
                --query 'services[0].deployments[?status==`PRIMARY`] | [0].{running:runningCount,desired:desiredCount}' \
                --output json)
              RUNNING=$(echo $STATUS | jq -r '.running')
              DESIRED=$(echo $STATUS | jq -r '.desired')
              echo "Attempt $i ($service): $RUNNING/$DESIRED tasks running"
              if [ "$RUNNING" = "$DESIRED" ] && [ "$RUNNING" != "0" ]; then
                echo "Deployment complete for $service!"
                break
              fi
              if [ $((i % 10)) -eq 0 ]; then
                log_service_debug "$service"
              fi
              sleep 15
            done
            if [ "$RUNNING" != "$DESIRED" ] || [ "$RUNNING" = "0" ]; then
              echo "Deployment did not stabilize in time for $service"
              log_service_debug "$service"
              exit 1
            fi
          done

      - name: Skip sec-dev deploy (missing secrets)
        if: steps.sec-dev-secrets.outputs.present != 'true'
        run: echo "Skipping sec-dev deploy because required secrets are missing."

  # Main merge: Deploy to sec-prod ECS
  deploy-sec-prod:
    name: Deploy to sec-prod ECS
    runs-on: ubuntu-latest
    needs: build-and-push-sec-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (sec-prod)
        uses: writerInternal/aws-git-roles@v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_PROD_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Force new deployment
        run: |
          for service in ${{ env.SEC_PROD_ECS_SERVICES }}; do
            aws ecs update-service \
              --cluster ${{ env.SEC_PROD_ECS_CLUSTER }} \
              --service $service \
              --force-new-deployment
          done

      - name: Wait for deployment
        timeout-minutes: 30
        run: |
          log_service_debug() {
            local service=$1
            echo "Service status for $service:"
            aws ecs describe-services \
              --cluster ${{ env.SEC_PROD_ECS_CLUSTER }} \
              --services "$service" \
              --query 'services[0].{deployments:deployments,events:events[0:5]}' \
              --output json
            STOPPED_TASKS=$(aws ecs list-tasks \
              --cluster ${{ env.SEC_PROD_ECS_CLUSTER }} \
              --service-name "$service" \
              --desired-status STOPPED \
              --max-items 5 \
              --query 'taskArns' \
              --output text)
            if [ -n "$STOPPED_TASKS" ] && [ "$STOPPED_TASKS" != "None" ]; then
              aws ecs describe-tasks \
                --cluster ${{ env.SEC_PROD_ECS_CLUSTER }} \
                --tasks $STOPPED_TASKS \
                --query 'tasks[].{task:taskArn,lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
                --output json
            else
              echo "No stopped tasks found for $service"
            fi
          }

          echo "Waiting for ECS deployment to stabilize..."
          for service in ${{ env.SEC_PROD_ECS_SERVICES }}; do
            echo "Waiting for $service to stabilize..."
            for i in {1..120}; do
              STATUS=$(aws ecs describe-services \
                --cluster ${{ env.SEC_PROD_ECS_CLUSTER }} \
                --services $service \
                --query 'services[0].deployments[?status==`PRIMARY`] | [0].{running:runningCount,desired:desiredCount}' \
                --output json)
              RUNNING=$(echo $STATUS | jq -r '.running')
              DESIRED=$(echo $STATUS | jq -r '.desired')
              echo "Attempt $i ($service): $RUNNING/$DESIRED tasks running"
              if [ "$RUNNING" = "$DESIRED" ] && [ "$RUNNING" != "0" ]; then
                echo "Deployment complete for $service!"
                break
              fi
              if [ $((i % 10)) -eq 0 ]; then
                log_service_debug "$service"
              fi
              sleep 15
            done
            if [ "$RUNNING" != "$DESIRED" ] || [ "$RUNNING" = "0" ]; then
              echo "Deployment did not stabilize in time for $service"
              log_service_debug "$service"
              exit 1
            fi
          done
