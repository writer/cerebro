name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            command: make build
          - name: test
            command: make test
          - name: race
            command: make test-race
          - name: coverage
            command: make cover
          - name: sdk
            command: make sdk-test
          - name: sdk-dependency-audit
            command: make sdk-dependency-audit
          - name: script-test
            command: make script-test
          - name: mcp
            command: make mcp-contract-check mcp-sdk-compat
          - name: lint
            command: make lint
          - name: proto
            command: make proto-lint proto-generate-check proto-breaking
          - name: openapi
            command: make openapi-check openapi-lint
          - name: catalog
            command: make catalog-check detection-catalog-check
          - name: graph-actions
            command: make graph-action-check
          - name: docs-drift
            command: make docs-drift-check
          - name: readme
            command: make readme-check
          - name: oss-audit
            command: make oss-audit
          - name: govulncheck
            command: make govulncheck
          - name: release-smoke
            command: make release-smoke
          - name: docker-smoke
            command: make docker-smoke
          - name: structural
            command: make check-structural check-structural-test check-arch
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  verify:
    runs-on: ubuntu-latest
    needs: [verify-shard]
    if: always()
    steps:
      - name: Check verify shards
        run: |
          if [ "${{ needs.verify-shard.result }}" != "success" ]; then
            echo "One or more verify shards failed"
            exit 1
          fi
          echo "All verify shards passed"
