name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  SEC_DEV_ACCOUNT_ID: "944130631940"
  SEC_PROD_ACCOUNT_ID: "837279440628"
  ECR_REPOSITORY: cerebro
  GHCR_IMAGE: ghcr.io/writer/cerebro

jobs:
  # PR: Pull from GHCR and push to sec-dev ECR
  publish-sec-dev:
    name: Publish to sec-dev ECR
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (sec-dev)
        uses: writerInternal/aws-git-roles@v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_DEV_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read image tag from Pulumi config
        id: image-tag
        shell: bash
        run: |
          tag=$(grep 'cerebro:imageTag:' infra/aws/Pulumi.sec-dev.yaml | awk '{print $2}')
          if [ -z "${tag}" ]; then
            echo "ERROR: cerebro:imageTag not found in Pulumi.sec-dev.yaml"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${tag}"

      - name: Pull from GHCR, retag, and push to ECR
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          echo "Pulling ${GHCR_IMAGE}:${IMAGE_TAG} from GHCR..."
          docker pull "${GHCR_IMAGE}:${IMAGE_TAG}"

          docker tag "${GHCR_IMAGE}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Pushed ${IMAGE_TAG} to sec-dev ECR"

  # Main merge: Pull from GHCR and push to sec-prod ECR
  publish-sec-prod:
    name: Publish to sec-prod ECR
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (sec-prod)
        uses: writerInternal/aws-git-roles@v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_PROD_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read image tag from Pulumi config
        id: image-tag
        shell: bash
        run: |
          tag=$(grep 'cerebro:imageTag:' infra/aws/Pulumi.go-prod.yaml | awk '{print $2}')
          if [ -z "${tag}" ]; then
            echo "ERROR: cerebro:imageTag not found in Pulumi.go-prod.yaml"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${tag}"

      - name: Pull from GHCR, retag, and push to ECR
        id: publish
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Pulling ${GHCR_IMAGE}:${IMAGE_TAG} from GHCR..."
          docker pull "${GHCR_IMAGE}:${IMAGE_TAG}"

          docker tag "${GHCR_IMAGE}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Pushed ${IMAGE_TAG} to sec-prod ECR"

  # Main merge: Promote sec-prod image tag to latest
  promote-sec-prod-image:
    name: Promote sec-prod image tag
    runs-on: ubuntu-latest
    needs: [publish-sec-prod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (sec-prod)
        uses: writerInternal/aws-git-roles@v2
        with:
          assume-role-arn: arn:aws:iam::${{ env.SEC_PROD_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Promote image to latest
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${{ needs.publish-sec-prod.outputs.image_tag }}"
          if [ -z "${image_tag}" ]; then
            echo "Missing image tag output from publish-sec-prod"
            exit 1
          fi

          manifest=$(aws ecr batch-get-image \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${image_tag}" \
            --query 'images[0].imageManifest' \
            --output text)

          aws ecr put-image \
            --repository-name "${ECR_REPOSITORY}" \
            --image-tag latest \
            --image-manifest "${manifest}" >/dev/null

          echo "Promoted ${image_tag} to latest"
