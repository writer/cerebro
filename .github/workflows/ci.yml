name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            command: make build
          - name: coverage
            command: make cover
          - name: sdk
            command: make sdk-test
          - name: sdk-dependency-audit
            command: make sdk-dependency-audit
          - name: script-test
            command: make script-test
          - name: mcp
            command: make mcp-contract-check mcp-sdk-compat
          - name: proto
            command: make proto-lint proto-generate-check proto-breaking
            checkout_fetch_depth: '0'
          - name: openapi
            command: make openapi-check openapi-lint
          - name: catalog
            command: make catalog-check detection-catalog-check
          - name: graph-actions
            command: make graph-action-check
          - name: docs-drift
            command: make docs-drift-check
          - name: readme
            command: make readme-check
            checkout_fetch_depth: '0'
          - name: oss-audit
            command: make oss-audit
          - name: govulncheck
            command: make govulncheck
          - name: release-smoke
            command: make release-smoke
          - name: docker-smoke
            command: make docker-smoke
          - name: structural
            command: make check-structural check-structural-test check-arch
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ matrix.checkout_fetch_depth || '1' }}

      - name: Fetch main for base comparisons
        if: matrix.checkout_fetch_depth == '0'
        run: git fetch origin main:refs/remotes/origin/main

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/linters/go.sum

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  go-lint-shard:
    name: lint-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-cmd
            command: make lint-api-cmd
          - name: internal
            command: make lint-internal
          - name: sources
            command: make lint-sources
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/linters/go.sum

      - name: Cache golangci-lint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/go/bin/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-golangci-lint-${{ hashFiles('go.sum', '.golangci.yml', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-golangci-lint-

      - name: Run ${{ matrix.name }} lint
        run: ${{ matrix.command }}

  go-test-shard:
    name: test-${{ matrix.shard_index }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/linters/go.sum

      - name: Run Go test shard ${{ matrix.shard_index }}
        env:
          GO_TEST_SHARD_TOTAL: 4
          GO_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
        run: make test

  go-race-shard:
    name: race-${{ matrix.shard_index }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/linters/go.sum

      - name: Run Go race shard ${{ matrix.shard_index }}
        env:
          GO_TEST_SHARD_TOTAL: 6
          GO_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
        run: make test-race

  test:
    runs-on: ubuntu-latest
    needs: [go-test-shard]
    if: always()
    steps:
      - name: Check Go test shards
        run: |
          if [ "${{ needs.go-test-shard.result }}" != "success" ]; then
            echo "One or more Go test shards failed"
            exit 1
          fi
          echo "All Go test shards passed"

  race:
    runs-on: ubuntu-latest
    needs: [go-race-shard]
    if: always()
    steps:
      - name: Check Go race shards
        run: |
          if [ "${{ needs.go-race-shard.result }}" != "success" ]; then
            echo "One or more Go race shards failed"
            exit 1
          fi
          echo "All Go race shards passed"

  lint:
    runs-on: ubuntu-latest
    needs: [go-lint-shard]
    if: always()
    steps:
      - name: Check Go lint shards
        run: |
          if [ "${{ needs.go-lint-shard.result }}" != "success" ]; then
            echo "One or more Go lint shards failed"
            exit 1
          fi
          echo "All Go lint shards passed"

  verify:
    runs-on: ubuntu-latest
    needs: [verify-shard, test, race, lint]
    if: always()
    steps:
      - name: Check verify shards
        run: |
          if [ "${{ needs.verify-shard.result }}" != "success" ]; then
            echo "One or more verify shards failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more Go test shards failed"
            exit 1
          fi
          if [ "${{ needs.race.result }}" != "success" ]; then
            echo "One or more Go race shards failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more Go lint shards failed"
            exit 1
          fi
          echo "All verify shards passed"
