name: tests

on:
  push:
    branches:
      - main
      - feature/**
      - hotfix/**
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run unit test suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./cerebro_test.db?cache=shared&uri=true
        run: |
          set -euo pipefail
          uv run pytest -m "not integration" --cov=src --cov-report=term --cov-report=xml

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  postgres-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run Postgres-backed analytics tests
        env:
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          uv run pytest tests/integration/analytics/test_analytics_tasks_postgres.py

  ts-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix sdk/ts

      - name: Run TypeScript SDK tests
        run: npm test --prefix sdk/ts

      - name: Ensure TypeScript SDK builds
        run: npm run build --prefix sdk/ts
