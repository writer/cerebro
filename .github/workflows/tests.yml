name: tests

on:
  push:
    branches:
      - main
      - feature/**
      - hotfix/**
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check --select F src tests

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run API smoke tests
        env:
          CEREBRO_SMOKE_MODE: asgi
          CEREBRO_SMOKE_TARGETS: core,db,encryption
          CEREBRO_SMOKE_DATABASE_URL: sqlite+aiosqlite:///./cerebro_smoke_ci.db
        run: |
          set -euo pipefail
          uv run python scripts/smoke_api.py --json

      - name: Run full test suite with coverage
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./cerebro_test.db?cache=shared&uri=true
        run: |
          set -euo pipefail
          uv run pytest tests/ \
            --cov=src/cerebro \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=60 \
            -m "not slow and not integration" \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --ignore=tests/benchmarks

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Coverage report summary
        if: always()
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

  postgres-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run Postgres-backed analytics tests
        env:
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          uv run pytest tests/integration/analytics/test_analytics_tasks_postgres.py

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run E2E tests (in-process ASGI)
        env:
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          uv run pytest tests/e2e -m "e2e and not e2e_slow"

  ts-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Export OpenAPI schema
        run: uv run python scripts/export_openapi.py --output sdk/ts/tmp/openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix sdk/ts

      - name: Generate TypeScript API types
        run: |
          export CEREBRO_OPENAPI_SPEC_PATH="sdk/ts/tmp/openapi.json"
          npm run generate:types --prefix sdk/ts

      - name: Verify generated types are committed
        run: git diff --exit-code -- sdk/ts/src/generated/openapi.ts

      - name: Run TypeScript SDK tests
        run: npm test --prefix sdk/ts

      - name: Ensure TypeScript SDK builds
        run: npm run build --prefix sdk/ts

      - name: Enforce SDK bundle size limit
        run: npm run size-limit --prefix sdk/ts

      - name: Validate TypeScript SDK packaging
        run: npm run validate:package --prefix sdk/ts

  desktop-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run desktop agent unit tests
        working-directory: desktop-agent
        run: go test ./...
