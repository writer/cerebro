name: tests

on:
  push:
    branches:
      - main
      - feature/**
      - hotfix/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine what changed to optimize test runs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
      infra: ${{ steps.filter.outputs.infra }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
            tests:
              - 'tests/**'
              - 'tests_unit/**'
            infra:
              - 'infra/**'
            sdk:
              - 'sdk/**'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.tests == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check --select F src tests

      - name: Type check
        run: uv run mypy src/cerebro --ignore-missing-imports

  # Fast tests for PRs - only test changed packages with sharding
  unit-tests-changed:
    name: Unit Tests (Changed) - Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.src == 'true' || needs.changes.outputs.tests == 'true')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run API smoke tests
        if: matrix.shard == 1
        env:
          CEREBRO_SMOKE_MODE: asgi
          CEREBRO_SMOKE_TARGETS: core,db,encryption
          CEREBRO_SMOKE_DATABASE_URL: sqlite+aiosqlite:///./cerebro_smoke_ci.db
        run: |
          set -euo pipefail
          uv run python scripts/smoke_api.py --json

      - name: Run tests (shard ${{ matrix.shard }}/4)
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./cerebro_test.db?cache=shared&uri=true
        run: |
          set -euo pipefail
          uv run pytest tests/ \
            --cov=src/cerebro \
            --cov-report=term \
            --cov-report=xml \
            -m "not slow and not integration" \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --ignore=tests/benchmarks \
            --shard=${{ matrix.shard }}/4

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: shard-${{ matrix.shard }}

  # Full test suite on main pushes with sharding
  unit-tests-full:
    name: Unit Tests (Full) - Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run API smoke tests
        if: matrix.shard == 1
        env:
          CEREBRO_SMOKE_MODE: asgi
          CEREBRO_SMOKE_TARGETS: core,db,encryption
          CEREBRO_SMOKE_DATABASE_URL: sqlite+aiosqlite:///./cerebro_smoke_ci.db
        run: |
          set -euo pipefail
          uv run python scripts/smoke_api.py --json

      - name: Run full test suite (shard ${{ matrix.shard }}/4)
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./cerebro_test.db?cache=shared&uri=true
        run: |
          set -euo pipefail
          uv run pytest tests/ \
            --cov=src/cerebro \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=40 \
            -m "not slow and not integration" \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --ignore=tests/benchmarks \
            --shard=${{ matrix.shard }}/4

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: shard-${{ matrix.shard }}

      - name: Coverage report summary
        if: matrix.shard == 1
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

  snowflake-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint]
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run Snowflake-backed analytics tests
        env:
          ENVIRONMENT: test
          SNOWFLAKE_DATABASE_URL: ${{ secrets.SNOWFLAKE_DATABASE_URL }}
        run: |
          set -euo pipefail
          uv run pytest tests/integration/analytics/test_analytics_tasks_snowflake.py

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint]
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run E2E tests (in-process ASGI)
        env:
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          uv run pytest tests/e2e -m "e2e and not e2e_slow"

  ts-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.src == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Export OpenAPI schema
        run: uv run python scripts/export_openapi.py --output sdk/ts/tmp/openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix sdk/ts

      - name: Generate TypeScript API types
        run: |
          export CEREBRO_OPENAPI_SPEC_PATH="sdk/ts/tmp/openapi.json"
          npm run generate:types --prefix sdk/ts

      - name: Run TypeScript SDK tests
        run: npm test --prefix sdk/ts

      - name: Ensure TypeScript SDK builds
        run: npm run build --prefix sdk/ts

      - name: Enforce SDK bundle size limit
        run: npm run size-limit --prefix sdk/ts

      - name: Validate TypeScript SDK packaging
        run: npm run validate:package --prefix sdk/ts

  desktop-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run desktop agent unit tests
        working-directory: desktop-agent
        run: go test ./...

  infra-validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install infra dependencies
        working-directory: infra
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Validate Pulumi configuration
        working-directory: infra
        run: |
          source .venv/bin/activate
          python -c "from aws import networking, secrets, dynamodb, cache, kms, compute, load_balancer, monitoring, waf, backup, rds_proxy, blue_green; print('All modules import successfully')"

      - name: Run infra unit tests
        working-directory: infra
        run: |
          source .venv/bin/activate
          python -m pytest tests_unit/ -v || echo "No unit tests found"
