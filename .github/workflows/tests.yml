name: tests

on:
  push:
    branches:
      - main
      - feature/**
      - hotfix/**
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run API smoke tests
        env:
          CEREBRO_SMOKE_MODE: asgi
          CEREBRO_SMOKE_TARGETS: core,db,encryption
          CEREBRO_SMOKE_DATABASE_URL: sqlite+aiosqlite:///./cerebro_smoke_ci.db
        run: |
          set -euo pipefail
          uv run python scripts/smoke_api.py --json

      - name: Run unit test suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./cerebro_test.db?cache=shared&uri=true
        run: |
          set -euo pipefail
          uv run pytest -m "not integration" --cov=src --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  postgres-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run Postgres-backed analytics tests
        env:
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          uv run pytest tests/integration/analytics/test_analytics_tasks_postgres.py

  ts-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Export OpenAPI schema
        run: uv run python scripts/export_openapi.py --output sdk/ts/tmp/openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix sdk/ts

      - name: Generate TypeScript API types
        run: |
          export CEREBRO_OPENAPI_SPEC_PATH="sdk/ts/tmp/openapi.json"
          npm run generate:types --prefix sdk/ts

      - name: Verify generated types are committed
        run: git diff --exit-code -- sdk/ts/src/generated/openapi.ts

      - name: Run TypeScript SDK tests
        run: npm test --prefix sdk/ts

      - name: Ensure TypeScript SDK builds
        run: npm run build --prefix sdk/ts

      - name: Enforce SDK bundle size limit
        run: npm run size-limit --prefix sdk/ts

      - name: Validate TypeScript SDK packaging
        run: npm run validate:package --prefix sdk/ts

  desktop-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run desktop agent unit tests
        working-directory: desktop-agent
        run: go test ./...

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run frontend smoke tests
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8777/api/v1
          NEXT_PUBLIC_WS_BASE_URL: ws://127.0.0.1:8778/ws/events
        run: npm run test:e2e --prefix frontend
