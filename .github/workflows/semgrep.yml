name: Semgrep

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

concurrency:
  # Pull requests share one group per PR so superseded pushes cancel. Main
  # pushes key by commit so every merged SHA keeps its own terminal evidence
  # instead of being cancelled behind the next merge.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: |
          python3 -m pip install --user semgrep==1.167.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep
        run: |
          set -euo pipefail
          semgrep scan \
            --config .semgrep/cerebro.yml \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: semgrep.sarif
