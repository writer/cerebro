name: publish-ts-sdk

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag to use (e.g. latest, next)"
        required: false
        default: "latest"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Export OpenAPI schema
        run: uv run python scripts/export_openapi.py --output sdk/ts/tmp/openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install npm dependencies
        run: npm ci --prefix sdk/ts

      - name: Generate TypeScript API types
        run: |
          export CEREBRO_OPENAPI_SPEC_PATH="sdk/ts/tmp/openapi.json"
          npm run generate:types --prefix sdk/ts

      - name: Run TypeScript build & tests
        run: |
          npm test --prefix sdk/ts
          npm run build --prefix sdk/ts

      - name: Determine publish eligibility
        id: publish-check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN not configured; skipping publish." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm
        if: steps.publish-check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_NPM_TAG: ${{ github.event.inputs.npm_tag }}
        run: |
          TAG="${INPUT_NPM_TAG:-latest}"
          npm publish --prefix sdk/ts --access public --tag "$TAG"

      - name: Upload npm package artifact
        if: steps.publish-check.outputs.publish == 'true'
        shell: bash
        run: |
          mkdir -p dist
          npm pack --prefix sdk/ts --pack-destination ./dist

      - name: Upload npm pack artifact
        if: steps.publish-check.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ts-sdk-package
          path: dist/*.tgz
          if-no-files-found: warn

      - name: Publish skipped (missing npm token)
        if: steps.publish-check.outputs.publish != 'true'
        run: echo "Publish workflow completed without pushing to npm because NPM_TOKEN is not configured."
