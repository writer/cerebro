name: Benchmarks Nightly

on:
  schedule:
    - cron: "30 03 * * *"  # 03:30 UTC nightly
  workflow_dispatch:

jobs:
  skip-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Skip nightly benchmarks on push
        run: echo "Nightly benchmark workflow is skipped for push events."

  nightly-benchmarks:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run benchmark suite
        id: run_benchmarks
        continue-on-error: true
        run: uv run python scripts/run_benchmarks.py --fail-on-error

      - name: Verify regression baselines
        id: regression_check
        continue-on-error: true
        run: uv run python scripts/check_regression_tournament.py

      - name: Upload benchmark scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-scorecard-${{ github.run_id }}
          path: benchmarks/results/scorecard.json
          if-no-files-found: warn

      - name: Publish benchmark summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          scorecard_path = Path("benchmarks/results/scorecard.json")
          summary_path = Path(os.environ.get("GITHUB_STEP_SUMMARY", ""))

          if not summary_path:
              raise SystemExit("GITHUB_STEP_SUMMARY is not available")

          lines = ["## Nightly Benchmark Scorecard"]
          if scorecard_path.exists():
              data = json.loads(scorecard_path.read_text(encoding="utf-8"))
              if not data:
                  lines.append("No benchmark cases were executed.")
              else:
                  passed = [sid for sid, metrics in data.items() if metrics.get("passed")]
                  failed = [sid for sid, metrics in data.items() if not metrics.get("passed")]
                  lines.append(f"- ✅ Passed: {len(passed)}")
                  lines.append(f"- ❌ Failed: {len(failed)}")
                  if failed:
                      lines.append("")
                      lines.append("### Failing Scenarios")
                      for sid in failed:
                          metrics = data.get(sid, {})
                          detail = f"  - **{sid}** — turn_count={metrics.get('turn_count')}, reward={metrics.get('reward')}"
                          lines.append(detail)
          else:
              lines.append("Scorecard not produced (benchmark step may have failed before writing results).")

          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Post benchmark summary to Slack
        if: always() && secrets.AUTONOMY_SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.AUTONOMY_SLACK_WEBHOOK }}
        run: |
          if [ ! -f benchmarks/results/scorecard.json ]; then
            echo "Scorecard missing; skipping Slack notification." >&2
            exit 0
          fi

          uv run python scripts/post_benchmark_summary.py \
            --scorecard benchmarks/results/scorecard.json \
            --slack-webhook "$SLACK_WEBHOOK" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail on benchmark regression
        if: steps.run_benchmarks.outcome == 'failure' || steps.regression_check.outcome == 'failure'
        run: |
          echo "Benchmark regression detected during nightly run." >&2
          exit 1
