name: Content packs

on:
  pull_request:
    paths:
      - "contentpacks/**"
      - "internal/contentpacks/**"
      - "internal/config/**"
      - "internal/findingdsl/**"
      - "internal/findings/**"
      - "internal/observability/**"
      - "internal/sourceregistry/**"
      - "sources/deepseek/**"
      - "cmd/cerebro/**"
      - "tools/contentpack*/**"
      - ".github/workflows/content-packs.yml"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - "contentpacks/**"
      - "internal/contentpacks/**"
      - "internal/config/**"
      - "internal/findingdsl/**"
      - "internal/findings/**"
      - "internal/observability/**"
      - "internal/sourceregistry/**"
      - "sources/deepseek/**"
      - "cmd/cerebro/**"
      - "tools/contentpack*/**"
      - ".github/workflows/content-packs.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fall back to direct module fetches when proxy.golang.org returns a
  # transient error; go.sum still verifies every module either way.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  validate:
    name: validate signed packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate packs
        run: make content-pack-check
