name: Post-Merge Health

on:
  push:
    branches: [main]

concurrency:
  # Every merged SHA needs its own terminal receipt. A later main push must not
  # cancel evidence collection for an earlier merge.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  post-merge-health:
    runs-on: ubuntu-latest
    # Candidate workflows serialize behind at most one active run. Cover one
    # full 90-minute predecessor and the selected head's 90-minute CI gate,
    # then leave five minutes to write and upload the terminal receipt.
    timeout-minutes: 185
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Wait for exact-head post-merge health
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          POST_MERGE_HEAD: ${{ github.sha }}
          POST_MERGE_STRICT: "true"
          POST_MERGE_WAIT_SECONDS: "10800"
          POST_MERGE_POLL_SECONDS: "30"
          POST_MERGE_OUT: tmp/post-merge-health.md
          POST_MERGE_JSON_OUT: tmp/post-merge-health.json
        run: |
          set -euo pipefail
          make post-merge-health
          if [ -s "${POST_MERGE_OUT}" ]; then
            {
              echo "### Post-Merge Health"
              echo
              sed 's/^/    /' "${POST_MERGE_OUT}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload post-merge health artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-merge-health
          path: |
            tmp/post-merge-health.md
            tmp/post-merge-health.json
