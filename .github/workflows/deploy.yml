name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/workflows/infra-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: production
      skip_tests:
        description: "Skip tests (use for hotfixes only)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "073877318660"
  MANAGEMENT_ACCOUNT_ID: "533267360238"
  ECR_REPOSITORY: cerebro
  ECS_CLUSTER: cerebro-production
  ECS_SERVICE_API: cerebro-production-api
  ECS_SERVICE_WORKER: cerebro-production-worker
  ECS_SERVICE_BEAT: cerebro-production-beat

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uv run ruff check src/cerebro/api src/cerebro/core

      - name: Run type checking
        run: uv run mypy src/cerebro/api --ignore-missing-imports

      - name: Run unit tests
        run: uv run pytest tests/unit -v --tb=short -x

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped' || needs.test.result == 'failure')
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: writerInternal/aws-git-roles@v1
        with:
          aws-account-id: ${{ env.MANAGEMENT_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          assume-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Get version from pyproject.toml
          VERSION=$(python -c "import re; print(re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          
          # Create unique tag with timestamp and short SHA
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE_TAG="${VERSION}-${TIMESTAMP}-${SHORT_SHA}"
          
          # For production tags
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            IMAGE_TAG="prod-${TIMESTAMP}"
          fi
          
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          echo "## Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image URI:** ${IMAGE_URI}" >> $GITHUB_STEP_SUMMARY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: writerInternal/aws-git-roles@v1
        with:
          aws-account-id: ${{ env.MANAGEMENT_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          assume-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/writer-aws-deployment-role

      - name: Update ECS services
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "Deploying image: ${IMAGE_URI}"
          
          # Get current task definitions
          for SERVICE in $ECS_SERVICE_API $ECS_SERVICE_WORKER $ECS_SERVICE_BEAT; do
            echo "Updating service: ${SERVICE}"
            
            # Get the current task definition
            TASK_DEF_ARN=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $SERVICE \
              --query 'services[0].taskDefinition' \
              --output text)
            
            if [ "$TASK_DEF_ARN" = "None" ] || [ -z "$TASK_DEF_ARN" ]; then
              echo "Service $SERVICE not found, skipping..."
              continue
            fi
            
            echo "Current task definition: ${TASK_DEF_ARN}"
            
            # Get the task definition and update the image
            TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition $TASK_DEF_ARN \
              --query 'taskDefinition')
            
            # Update the container image in the task definition
            NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$IMAGE_URI" '
              .containerDefinitions[0].image = $IMAGE |
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ')
            
            # Register the new task definition
            NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK_DEF" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)
            
            echo "New task definition: ${NEW_TASK_DEF_ARN}"
            
            # Update the service to use the new task definition
            aws ecs update-service \
              --cluster $ECS_CLUSTER \
              --service $SERVICE \
              --task-definition $NEW_TASK_DEF_ARN \
              --force-new-deployment
            
            echo "Service ${SERVICE} updated successfully"
          done

      - name: Wait for deployment
        run: |
          echo "Waiting for API service to stabilize..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_API \
            --timeout 600 || echo "Timeout waiting for stability, but deployment may still succeed"

      - name: Deployment summary
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${ECS_CLUSTER}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Services Updated:**" >> $GITHUB_STEP_SUMMARY
          echo "  - ${ECS_SERVICE_API}" >> $GITHUB_STEP_SUMMARY
          echo "  - ${ECS_SERVICE_WORKER}" >> $GITHUB_STEP_SUMMARY
          echo "  - ${ECS_SERVICE_BEAT}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: failure()
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.AUTONOMY_SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{
                \"text\": \":x: Cerebro deployment failed\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \":x: *Cerebro Deployment Failed*\n\n*Branch:* \`${{ github.ref_name }}\`\n*Commit:* \`${{ github.sha }}\`\n*Actor:* ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\"
                    }
                  }
                ]
              }" \
              "$SLACK_WEBHOOK"
          fi
