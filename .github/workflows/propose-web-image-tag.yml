name: Propose Web Image Tag
run-name: Web image ${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'sec-dev' }} ${{ github.event.client_payload.web_image_tag || github.event.inputs.image_tag || 'latest' }} ${{ github.event.client_payload.request_id || github.run_id }}

on:
  repository_dispatch:
    types:
      - cerebro-web-release-published
  workflow_dispatch:
    inputs:
      environment:
        description: Stack to update
        required: true
        default: sec-dev
        type: choice
        options:
          - sec-dev
      image_tag:
        description: Web image tag (e.g. sha-7609e30ed701)
        required: true
        type: string

permissions:
  actions: write
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: propose-web-image-tag-${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'sec-dev' }}
  cancel-in-progress: false

env:
  WEB_GHCR_IMAGE: ghcr.io/writer/cerebro-web

jobs:
  propose:
    name: Update web image tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.web_image_tag || '' }}
          DISPATCH_ENV: ${{ github.event.client_payload.target_environment || '' }}
          DISPATCH_MODE: ${{ github.event.client_payload.apply_mode || '' }}
          DISPATCH_WEB_IMAGE: ${{ github.event.client_payload.web_image || '' }}
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || '' }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref || '' }}
          EXPECTED_DIGEST: ${{ github.event.client_payload.web_image_digest || '' }}
          INPUT_TAG: ${{ github.event.inputs.image_tag || '' }}
          INPUT_ENV: ${{ github.event.inputs.environment || '' }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG}}"
          env="${DISPATCH_ENV:-${INPUT_ENV:-sec-dev}}"
          mode="${DISPATCH_MODE:-pull_request}"
          if [ "${mode}" = "direct_push" ]; then
            echo "::warning::apply_mode=direct_push is deprecated; creating a trusted sec-dev release PR instead."
            mode="trusted_sec_dev_release"
          fi

          if [ -z "${tag}" ]; then
            echo "No web image tag provided" >&2
            exit 1
          fi
          if ! [[ "${tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid web image tag: ${tag}" >&2
            exit 1
          fi
          if [ "${env}" != "sec-dev" ]; then
            echo "Web image promotion is currently only supported for sec-dev" >&2
            exit 1
          fi
          if [ "${mode}" != "pull_request" ] && [ "${mode}" != "trusted_sec_dev_release" ]; then
            echo "Web image promotion must use pull_request or trusted_sec_dev_release mode" >&2
            exit 1
          fi
          if [ "${mode}" = "trusted_sec_dev_release" ] && [ "${EVENT_NAME}" != "repository_dispatch" ]; then
            echo "trusted_sec_dev_release is reserved for public release dispatches" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            if [ "${DISPATCH_SOURCE_REPOSITORY}" != "writer/cerebro-web" ]; then
              echo "Repository dispatch must originate from writer/cerebro-web; got ${DISPATCH_SOURCE_REPOSITORY}" >&2
              exit 1
            fi
            if [ "${DISPATCH_WEB_IMAGE}" != "${WEB_GHCR_IMAGE}" ]; then
              echo "Repository dispatch image ${DISPATCH_WEB_IMAGE} does not match ${WEB_GHCR_IMAGE}" >&2
              exit 1
            fi
            if ! [[ "${DISPATCH_SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Repository dispatch source_ref must be a full commit SHA" >&2
              exit 1
            fi
            if [ "${tag}" != "sha-${DISPATCH_SOURCE_REF:0:12}" ]; then
              echo "Repository dispatch tag ${tag} does not match source ref ${DISPATCH_SOURCE_REF}" >&2
              exit 1
            fi
            if [ -z "${EXPECTED_DIGEST}" ]; then
              echo "Repository dispatch must include web_image_digest" >&2
              exit 1
            fi
          fi
          if [ -n "${EXPECTED_DIGEST}" ] && ! [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid dispatched web image digest: ${EXPECTED_DIGEST}" >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "env=${env}"
            echo "mode=${mode}"
            echo "expected_digest=${EXPECTED_DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: ${WEB_GHCR_IMAGE}:${tag} -> ${env} (${mode})"

      - name: Log in to GHCR for web image
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GHCR image exists
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "${WEB_GHCR_IMAGE}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Image ${WEB_GHCR_IMAGE}:${IMAGE_TAG} not found in GHCR" >&2
            exit 1
          fi
          echo "Verified ${WEB_GHCR_IMAGE}:${IMAGE_TAG} exists"

      - name: Set up Go for cosign
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.3"
          cache: false

      - name: Install cosign
        shell: bash
        run: bash .github/scripts/install-cosign.sh

      - name: Verify web GHCR image signature
        id: verify
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.inputs.outputs.tag }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          bash .github/scripts/verify-ghcr-image.sh \
            "${WEB_GHCR_IMAGE}" \
            "${IMAGE_TAG}" \
            "^https://github\.com/writer/cerebro-web/\.github/workflows/release\.yml@refs/heads/main$" \
            "signature-only"

      - name: Verify web GHCR build attestations
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${WEB_GHCR_IMAGE}@${IMAGE_DIGEST}" --raw > web-image-index.json
          if ! jq -e '.manifests[]? | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")' web-image-index.json >/dev/null; then
            echo "No SBOM/provenance attestation manifests found for ${WEB_GHCR_IMAGE}@${IMAGE_DIGEST}" >&2
            cat web-image-index.json >&2
            exit 1
          fi

      - name: Validate dispatched digest
        if: steps.inputs.outputs.expected_digest != ''
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.inputs.outputs.expected_digest }}
          VERIFIED_DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "${EXPECTED_DIGEST}" != "${VERIFIED_DIGEST}" ]; then
            echo "Verified digest ${VERIFIED_DIGEST} does not match dispatched digest ${EXPECTED_DIGEST}" >&2
            exit 1
          fi
          echo "Verified dispatched digest ${EXPECTED_DIGEST}"

      - name: Resolve release automation auth
        id: release-auth
        shell: bash
        env:
          DEPLOY_APP_CLIENT_ID: ${{ vars.CEREBRO_DEPLOY_APP_CLIENT_ID }}
          DEPLOY_APP_PRIVATE_KEY: ${{ secrets.CEREBRO_DEPLOY_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${DEPLOY_APP_CLIENT_ID}" ] && [ -n "${DEPLOY_APP_PRIVATE_KEY}" ]; then
            echo "mode=deploy_app" >> "$GITHUB_OUTPUT"
            echo "Using deploy GitHub App token."
            exit 0
          fi

          echo "Release promotion requires CEREBRO_DEPLOY_APP_CLIENT_ID plus CEREBRO_DEPLOY_APP_PRIVATE_KEY." >&2
          exit 1

      - name: Create deploy GitHub App token
        id: deploy-app-token
        uses: ./.github/actions/deploy-app-token
        with:
          client-id: ${{ vars.CEREBRO_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CEREBRO_DEPLOY_APP_PRIVATE_KEY }}

      - name: Apply stack config update
        shell: bash
        env:
          GH_TOKEN: ${{ steps.deploy-app-token.outputs.token }}
          DEPLOY_APP_SLUG: ${{ steps.deploy-app-token.outputs.app-slug }}
          APPLY_MODE: ${{ steps.inputs.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          STACK_NAME: ${{ steps.inputs.outputs.env }}
          IMAGE_TAG: ${{ steps.inputs.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.verify.outputs.digest }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repository || 'manual' }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "No release promotion token resolved" >&2
            exit 1
          fi
          deploy_app_user_id="$(gh api "/users/${DEPLOY_APP_SLUG}[bot]" --jq .id)"
          git config user.name "${DEPLOY_APP_SLUG}[bot]"
          git config user.email "${deploy_app_user_id}+${DEPLOY_APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          safe_tag="$(printf '%s' "${IMAGE_TAG}" | tr -c 'A-Za-z0-9._-' '-')"
          branch="automation/cerebro-web-${STACK_NAME}-${safe_tag}"
          expected_file="infra/aws/Pulumi.${STACK_NAME}.yaml"
          title="chore: deploy ${STACK_NAME} cerebro-web ${IMAGE_TAG}"

          refresh_from_main_and_apply_update() {
            git fetch origin main:refs/remotes/origin/main
            git checkout -f -B "${branch}" origin/main

            current_tag="$(awk '$1 == "cerebro:webImageTag:" { print $2; exit }' "${expected_file}")"
            echo "Refreshed ${branch} from origin/main; ${STACK_NAME} web was ${current_tag}, target is ${IMAGE_TAG}."

            if [ "${current_tag}" = "${IMAGE_TAG}" ]; then
              echo "Stack ${STACK_NAME} already uses web image ${IMAGE_TAG}"
              exit 0
            fi

            sed -i "s|cerebro:webImageTag:.*|cerebro:webImageTag: ${IMAGE_TAG}|" "${expected_file}"
            if ! grep -q "cerebro:webImageTag: ${IMAGE_TAG}" "${expected_file}"; then
              echo "Failed to update webImageTag in ${expected_file}" >&2
              exit 1
            fi
          }

          refresh_from_main_and_apply_update
          changed_files="$(git diff --name-only)"
          if [ "${changed_files}" != "${expected_file}" ]; then
            echo "Unexpected changed files: ${changed_files}" >&2
            exit 1
          fi
          uv run --project infra python infra/scripts/validate_pulumi_project_config.py
          uv run --project infra python infra/scripts/validate_stack_config.py
          git add "${expected_file}"

          if [ "${APPLY_MODE}" != "pull_request" ] && [ "${APPLY_MODE}" != "trusted_sec_dev_release" ]; then
            echo "Unknown apply_mode ${APPLY_MODE}; expected pull_request or trusted_sec_dev_release" >&2
            exit 1
          fi

          git commit -m "${title}" \
            -m "Source: ${SOURCE_REPO}@${SOURCE_REF}" \
            -m "Image: ${WEB_GHCR_IMAGE}:${IMAGE_TAG}" \
            -m "Digest: ${IMAGE_DIGEST}"

          git fetch origin "${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "HEAD:${branch}"

          body="$(mktemp)"
          {
            echo "Updates \`${STACK_NAME}\` to \`${WEB_GHCR_IMAGE}:${IMAGE_TAG}\`."
            echo
            echo "- Source: \`${SOURCE_REPO}@${SOURCE_REF}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo
            if [ "${APPLY_MODE}" = "trusted_sec_dev_release" ]; then
              echo "Trusted release promotion: this PR will auto-merge after required checks pass, then the normal main push deploy workflow will run."
            else
              echo "Deployment remains review-gated: merge this PR to let the existing mirror and Pulumi deploy workflows run."
            fi
          } > "${body}"

          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"automation/cerebro-web-${STACK_NAME}-\")) | select(.headRefName != \"${branch}\") | .number" \
          | while read -r old_pr; do
            echo "Closing superseded PR #${old_pr}"
            gh pr close "${old_pr}" --comment "Superseded by ${IMAGE_TAG}." --delete-branch || true
          done

          existing_pr="$(gh pr list --head "${branch}" --json url --jq '.[0].url // empty')"
          if [ -n "${existing_pr}" ]; then
            pr_url="${existing_pr}"
            gh pr edit "${pr_url}" --title "${title}" --body-file "${body}"
            echo "Updated ${pr_url}"
          else
            pr_url="$(gh pr create --base main --head "${branch}" --title "${title}" --body-file "${body}")"
            echo "Created ${pr_url}"
          fi

          auto_merge_trusted_sec_dev_pr() {
            local pr_url="$1"
            local check_count=""
            local registered=false

            if [ "${APPLY_MODE}" != "trusted_sec_dev_release" ]; then
              return 0
            fi
            if [ "${STACK_NAME}" != "sec-dev" ] || [ "${EVENT_NAME}" != "repository_dispatch" ]; then
              echo "Refusing to auto-merge untrusted web promotion ${STACK_NAME} ${EVENT_NAME}" >&2
              exit 1
            fi

            changed_files="$(gh pr diff "${pr_url}" --name-only | sort)"
            if [ "${changed_files}" != "${expected_file}" ]; then
              echo "Refusing to auto-merge ${pr_url}; expected ${expected_file}, got:" >&2
              printf '%s\n' "${changed_files}" >&2
              exit 1
            fi

            for _ in {1..60}; do
              check_count="$(gh pr checks "${pr_url}" --required --json name --jq 'length' 2>/dev/null || true)"
              if [[ "${check_count}" =~ ^[0-9]+$ ]] && [ "${check_count}" -gt 0 ]; then
                registered=true
                break
              fi
              sleep 10
            done
            if [ "${registered}" != "true" ]; then
              echo "::notice::Required PR checks for ${pr_url} did not register within the wait window; leaving it open for the review-gated merge."
              return 0
            fi

            if ! gh pr checks "${pr_url}" --required --watch --interval 10 --fail-fast; then
              echo "::notice::Required PR checks for ${pr_url} did not all pass; leaving it open for the review-gated merge."
              return 0
            fi
            gh pr merge "${pr_url}" --merge --delete-branch
          }

          auto_merge_trusted_sec_dev_pr "${pr_url}"
