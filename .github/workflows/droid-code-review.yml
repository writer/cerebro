name: Droid Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: droid-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  pull-requests: write
  contents: read
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false

    steps:
      - name: Check auth availability
        id: auth_check
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ secrets.INFISICAL_ENV_SLUG }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          has_infisical=false
          has_factory_key=false

          if [ -n "$INFISICAL_IDENTITY_ID" ] && [ -n "$INFISICAL_PROJECT_SLUG" ] && [ -n "$INFISICAL_ENV_SLUG" ]; then
            has_infisical=true
          fi

          if [ -n "$FACTORY_API_KEY" ]; then
            has_factory_key=true
          fi

          should_run=false
          if [ "$has_infisical" = "true" ] || [ "$has_factory_key" = "true" ]; then
            should_run=true
          fi

          echo "has_infisical=$has_infisical" >> "$GITHUB_OUTPUT"
          echo "has_factory_key=$has_factory_key" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.auth_check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Droid CLI
        if: steps.auth_check.outputs.should_run == 'true'
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/droid" --version

      - name: Configure git identity
        if: steps.auth_check.outputs.should_run == 'true'
        run: |
          git config user.name "Droid Agent"
          git config user.email "droidagent@factory.ai"

      - name: Prepare review context
        if: steps.auth_check.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }} > diff.txt

          fetch_paginated() {
            local url="$1"
            local output="$2"
            local next_url="$url"
            local tmp_headers
            local tmp_body
            echo "[]" > "$output"
            while [ -n "$next_url" ]; do
              tmp_headers=$(mktemp)
              tmp_body=$(mktemp)

              curl -sS -D "$tmp_headers" \
                   -H "Authorization: token $GITHUB_TOKEN" \
                   -H "Accept: application/vnd.github.v3+json" \
                   "$next_url" > "$tmp_body"

              jq -s 'add' "$output" "$tmp_body" > "${output}.tmp"
              mv "${output}.tmp" "$output"

              next_url=$(grep -i '^link:' "$tmp_headers" | tr ',' '\n' | sed -n 's/.*<\([^>]*\)>; rel="next".*/\1/p' || true)

              rm -f "$tmp_headers" "$tmp_body"
            done
          }

          fetch_paginated "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" issue_comments.json
          fetch_paginated "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments?per_page=100" review_comments.json
          jq -s 'add' issue_comments.json review_comments.json > existing_comments.json
          rm -f issue_comments.json review_comments.json

          fetch_paginated "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" files_all.json
          jq '[.[] | {filename: .filename, patch: .patch}]' files_all.json > files.json
          rm -f files_all.json

      - name: Fetch secrets from Infisical
        if: steps.auth_check.outputs.has_infisical == 'true'
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          oidc-audience: "https://github.com/WriterInternal"
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ secrets.INFISICAL_ENV_SLUG }}
          export-type: env

      - name: Ensure Factory API key is available
        if: steps.auth_check.outputs.should_run == 'true'
        env:
          FACTORY_API_KEY_FALLBACK: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set -euo pipefail

          EFFECTIVE_FACTORY_API_KEY="${FACTORY_API_KEY:-${FACTORY_API_KEY_FALLBACK:-}}"
          if [ -z "$EFFECTIVE_FACTORY_API_KEY" ]; then
            echo "FACTORY_API_KEY is required from Infisical or GitHub secrets."
            exit 1
          fi

          echo "FACTORY_API_KEY=$EFFECTIVE_FACTORY_API_KEY" >> "$GITHUB_ENV"
          echo "::add-mask::$EFFECTIVE_FACTORY_API_KEY"

      - name: Perform automated code review
        if: steps.auth_check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > prompt.txt <<'EOF'
          You are an automated code review system. Review the PR diff and identify clear issues that need to be fixed.

          Input files (already in current directory):
          - diff.txt: the code changes to review
          - files.json: file patches with line numbers for positioning comments
          - existing_comments.json: skip issues already mentioned here

          Task: Create a file called comments.json with this exact format:
          [{ "path": "path/to/file.js", "position": 42, "body": "Your comment here" }]

          Focus on these types of issues:
          - Dead/unreachable code (if (false), while (false), code after return/throw/break)
          - Broken control flow (missing break in switch, fallthrough bugs)
          - Async/await mistakes (missing await, .then without return, unhandled promise rejections)
          - Array/object mutations in React components or reducers
          - useEffect dependency array problems (missing deps, incorrect deps)
          - Incorrect operator usage (== vs ===, && vs ||, = in conditions)
          - Off-by-one errors in loops or array indexing
          - Integer overflow/underflow in calculations
          - Regex catastrophic backtracking vulnerabilities
          - Missing base cases in recursive functions
          - Incorrect type coercion that changes behavior
          - Environment variable access without defaults or validation
          - Null/undefined dereferences
          - Resource leaks (unclosed files or connections)
          - SQL/XSS injection vulnerabilities
          - Concurrency/race conditions
          - Missing error handling for critical operations

          Comment format:
          - Clearly describe the issue: "This code block is unreachable due to the if (false) condition"
          - Provide a concrete fix: "Remove this entire if block as it will never execute"
          - When possible, suggest the exact code change:
            ```suggestion
            // Remove the unreachable code
            ```
          - Be specific about why it's a problem: "This will cause a TypeError if input is null"
          - No emojis, just clear technical language

          Skip commenting on:
          - Code style, formatting, or naming conventions
          - Minor performance optimizations
          - Architectural decisions or design patterns
          - Features or functionality (unless broken)
          - Test coverage (unless tests are clearly broken)

          Position calculation:
          - Use the "position" field from files.json patches
          - This is the line number in the diff, not the file
          - Comments must align with exact changed lines only

          Output:
          - Empty array [] if no issues found
          - Otherwise array of comment objects with path, position, body
          - Each comment should be actionable and clear about what needs to be fixed
          - Maximum 10 comments total; prioritize the most critical issues
          EOF

          echo "Running code review analysis..."
          if ! droid exec --auto high -f prompt.txt; then
            echo "droid exec failed; defaulting to empty review"
          fi

          if [ ! -s comments.json ]; then
            echo "[]" > comments.json
          fi

          echo "=== Review Results ==="
          cat comments.json

      - name: Submit inline review comments
        if: steps.auth_check.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;

            if (!fs.existsSync('comments.json')) {
              core.info('comments.json missing; skipping review submission');
              return;
            }

            const raw = fs.readFileSync('comments.json', 'utf8');
            let comments;
            try {
              comments = JSON.parse(raw);
            } catch (error) {
              core.warning(`Failed to parse comments.json: ${error.message}`);
              comments = [];
            }

            if (!Array.isArray(comments) || comments.length === 0) {
              const existing = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              });

              const hasNoIssuesComment = existing.some(c =>
                c.user?.login?.includes('[bot]') &&
                /no issues found|lgtm|✅/i.test(c.body || '')
              );

              if (!hasNoIssuesComment) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  event: 'COMMENT',
                  body: '✅ No issues found in the current changes.'
                });
              }
              return;
            }

            const summary = `Found ${comments.length} potential issue${comments.length === 1 ? '' : 's'} that should be addressed.`;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'COMMENT',
              body: summary,
              comments
            });

            core.info(`Submitted review with ${comments.length} inline comments`);

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: droid-review-debug-${{ github.run_id }}
          path: |
            diff.txt
            files.json
            existing_comments.json
            prompt.txt
            comments.json
            ${{ runner.home }}/.factory/logs/droid-log-single.log
            ${{ runner.home }}/.factory/logs/console.log
          if-no-files-found: ignore
          retention-days: 7
