name: Integration

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cerebro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CEREBRO_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/cerebro?sslmode=disable
      CEREBRO_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/cerebro?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres integration tests
        run: go test ./internal/statestore/postgres ./internal/findings ./cmd/cerebro -run '(Postgres|Closeout|Tombstone|TenantScoped|CloudflareZoneProtection|IdentityMFA|ProjectsTombstone)' -count=1 -v

      - name: Set up Rust
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Prove Slack wake delivery across store restarts
        run: >-
          cargo +1.93.1 test --locked -p cerebro-platform
          postgres_wake_delivery_survives_store_restart_and_reconciles_retry_once
          -- --ignored --nocapture

  neo4j:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Neo4j Docker integration tests
        env:
          CEREBRO_RUN_NEO4J_DOCKER: "1"
        run: go test ./internal/graphstore/neo4j -run '^TestNeo4jDockerProjectionAndQueries$' -count=1 -v
