name: Integration

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cerebro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CEREBRO_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/cerebro?sslmode=disable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres integration tests
        run: go test ./internal/statestore/postgres ./internal/findings ./cmd/cerebro -run '(Postgres|Closeout|Tombstone|TenantScoped|CloudflareZoneProtection|IdentityMFA|ProjectsTombstone)' -count=1 -v

  neo4j:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Neo4j Docker integration tests
        env:
          CEREBRO_RUN_NEO4J_DOCKER: "1"
        run: go test ./internal/graphstore/neo4j -run '^TestNeo4jDockerProjectionAndQueries$' -count=1 -v
