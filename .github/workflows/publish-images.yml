name: Publish Cerebro Images

on:
  push:
    branches:
      - main
    tags:
      - release-*
      - prod-*
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev | release | prod)"
        required: true
        type: choice
        options:
          - dev
          - release
          - prod
      publish_writer_shared_prod:
        description: "Also tag writer-shared image with -prod when publishing production"
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    name: Build and push container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      WRITER_REGISTRY: us-docker.pkg.dev/writer-shared/writer/cerebro
      LEGACY_DEV_REGISTRY: us-docker.pkg.dev/qordoba-devel/cerebro/cerebro-dev
      LEGACY_RELEASE_REGISTRY: us-docker.pkg.dev/qordoba-devel/cerebro/cerebro-test
      LEGACY_PROD_REGISTRY: us-docker.pkg.dev/qordoba-prod/cerebro/cerebro-prd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine deployment environment
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          DISPATCH_PROD_TAG: ${{ github.event.inputs.publish_writer_shared_prod }}
        run: |
          set -euo pipefail
          ENVIRONMENT=""
          PUBLISH_PROD_TAG="false"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${DISPATCH_ENV}"
            if [ "${DISPATCH_PROD_TAG}" = "true" ]; then
              PUBLISH_PROD_TAG="true"
            fi
          elif [ "${EVENT_NAME}" = "push" ]; then
            case "${GIT_REF}" in
              refs/heads/main)
                ENVIRONMENT="dev"
                ;;
              refs/tags/release-*)
                ENVIRONMENT="release"
                ;;
              refs/tags/prod-*)
                ENVIRONMENT="prod"
                ;;
              *)
                echo "Push target ${GIT_REF} is not configured for publishing." >&2
                exit 1
                ;;
            esac
          else
            echo "Unsupported event ${EVENT_NAME}" >&2
            exit 1
          fi

          if [ -z "${ENVIRONMENT}" ]; then
            echo "Unable to determine publishing environment." >&2
            exit 1
          fi

          echo "environment=${ENVIRONMENT}" >> "${GITHUB_OUTPUT}"
          echo "publish_writer_shared_prod=${PUBLISH_PROD_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Compute semantic version tag
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION=$(python - <<'PY'
import pathlib
import re

data = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
match = re.search(r"^version\s*=\s*\"([^\"]+)\"", data, re.MULTILINE)
if not match:
    raise SystemExit("Unable to locate project version in pyproject.toml")
version = match.group(1)
parts = version.split(".")
if len(parts) < 2:
    raise SystemExit("Project version must contain at least major and minor components")
print(".".join(parts[:2]))
PY
          )
          PATCH=${GITHUB_RUN_NUMBER}
          VERSION_TAG="${BASE_VERSION}.${PATCH}"
          echo "value=${VERSION_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Prepare image tags
        id: tags
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          PUBLISH_PROD_TAG: ${{ steps.target.outputs.publish_writer_shared_prod }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          case "${ENVIRONMENT}" in
            dev)
              SUFFIX="-dev"
              LEGACY_REGISTRY="${LEGACY_DEV_REGISTRY}"
              ;;
            release)
              SUFFIX="-release"
              LEGACY_REGISTRY="${LEGACY_RELEASE_REGISTRY}"
              ;;
            prod)
              SUFFIX="-prod"
              LEGACY_REGISTRY="${LEGACY_PROD_REGISTRY}"
              ;;
            *)
              echo "Invalid environment ${ENVIRONMENT}" >&2
              exit 1
              ;;
          esac

          TAG_LIST="${WRITER_REGISTRY}:${VERSION}${SUFFIX},${LEGACY_REGISTRY}:${VERSION}${SUFFIX}"

          if [ "${ENVIRONMENT}" = "prod" ] && [ "${PUBLISH_PROD_TAG}" = "true" ]; then
            TAG_LIST="${TAG_LIST},${WRITER_REGISTRY}:${VERSION}-prod"
          fi

          echo "legacy_registry=${LEGACY_REGISTRY}" >> "${GITHUB_OUTPUT}"
          echo "suffix=${SUFFIX}" >> "${GITHUB_OUTPUT}"
          echo "list=${TAG_LIST}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Artifact Registry
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: writer-shared

      - name: Configure Docker credential helper
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
