name: Weekly Security Health

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays at 05:00 UTC
  workflow_dispatch:

jobs:
  skip-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Skip security health on push
        run: echo "Security health workflow is skipped for push events."

  security-health:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run security health checks
        id: security
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.CEREBRO_DATABASE_URL }}
        run: |
          uv run python scripts/security_health_checks.py \
            --max-admin-age-days 90 \
            --output security_health.json \
            --fail-on-issues

      - name: Publish security report to Slack
        if: secrets.AUTONOMY_SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.AUTONOMY_SLACK_WEBHOOK }}
          STEP_RESULT: ${{ steps.security.outcome }}
        run: |
          if [ ! -f security_health.json ]; then
            echo "security_health.json not found; skipping Slack report." >&2
            exit 0
          fi

          payload=$(python - <<'PY'
import json
import os
from pathlib import Path

report = json.loads(Path("security_health.json").read_text(encoding="utf-8"))
status = os.environ.get("STEP_RESULT", "unknown")

stale_admins = report.get("stale_admins", [])
attestation_gaps = report.get("tools_missing_attestation", [])
cel_canary = report.get("cel_canary_present", False)

lines = [f"Security health check status: {status.upper()}"]
lines.append(f"Stale admin accounts: {len(stale_admins)}")
lines.append(f"CEL canary present: {'yes' if cel_canary else 'no'}")
lines.append(f"Tools without attestation: {', '.join(attestation_gaps) if attestation_gaps else 'none'}")

payload = {
    "text": "Security health check summary",
    "blocks": [
        {
            "type": "section",
            "text": {"type": "mrkdwn", "text": "\n".join(lines)},
        }
    ],
}

print(json.dumps(payload))
PY
)

          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK"

      - name: Fail when security issues detected
        if: steps.security.outcome == 'failure'
        run: |
          echo "Security health check reported issues." >&2
          exit 1
