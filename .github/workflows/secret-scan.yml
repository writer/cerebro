name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '9 5 * * 2'
  workflow_dispatch:

concurrency:
  # Pull requests share one group per PR so superseded pushes cancel. Main
  # pushes key by commit so every merged SHA keeps its own terminal evidence
  # instead of being cancelled behind the next merge.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Gitleaks
        run: |
          set -euo pipefail
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect \
            --source . \
            --no-git \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: gitleaks.sarif
