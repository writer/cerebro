name: Producer Conventions Nightly

on:
  schedule:
    - cron: "15 04 * * *"  # 04:15 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-producer-checks:
    name: Lint and convention tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run targeted Ruff lint
        run: |
          uv run ruff check \
            src/cerebro/findings/producers/utils \
            src/cerebro/findings/producers/okta \
            src/cerebro/findings/producers/m365 \
            src/cerebro/findings/producers/github/admin_without_2fa.py \
            src/cerebro/findings/producers/aws/codebuild_public_trigger.py \
            src/cerebro/findings/producers/aws/codebuild_source_credential.py \
            src/cerebro/findings/producers/kubernetes/ingress_public_exposure.py \
            src/cerebro/findings/producers/kubernetes/service_public_exposure.py \
            src/cerebro/findings/producers/kubernetes/node_public_exposure.py

      - name: Run producer convention tests
        run: |
          uv run pytest tests/findings/test_producer_conventions.py
