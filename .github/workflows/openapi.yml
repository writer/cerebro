name: openapi-spec

on:
  push:
    branches: ["main", "feature/**", "hotfix/**"]
  pull_request:

permissions:
  contents: write

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync

      - name: Export OpenAPI schema
        run: uv run python scripts/export_openapi.py --output openapi.json

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi.json
          path: openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install SDK dependencies
        run: npm ci --prefix sdk/ts

      - name: Generate TypeScript SDK types from exported schema
        env:
          CEREBRO_OPENAPI_SPEC_PATH: openapi.json
        run: npm run generate:types --prefix sdk/ts

      - name: Build TypeScript SDK
        run: npm run build --prefix sdk/ts

      - name: Commit generated files
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f openapi.json sdk/ts/src/generated/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate OpenAPI spec and SDK types"
            git push
          fi

      - name: Pack TypeScript SDK
        working-directory: sdk/ts
        run: |
          mkdir -p tmp
          npm pack --pack-destination tmp

      - name: Upload TypeScript SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-ts-sdk.tgz
          path: sdk/ts/tmp/*.tgz
