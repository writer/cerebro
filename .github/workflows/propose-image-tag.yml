name: Propose Cerebro Image Tag
run-name: Cerebro image ${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'go-prod' }} ${{ github.event.client_payload.image_tag || github.event.inputs.image_tag || 'latest' }} ${{ github.event.client_payload.request_id || github.run_id }}

on:
  schedule:
    - cron: '20 14 * * 1-5'
  repository_dispatch:
    types:
      - cerebro-release-published
  workflow_dispatch:
    inputs:
      environment:
        description: Stack to update
        required: true
        default: go-prod
        type: choice
        options:
          - sec-dev
          - go-prod
      image_tag:
        description: Optional explicit image tag. When empty, use the latest stable GHCR tag.
        required: false
        type: string

permissions:
  actions: write
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: propose-cerebro-image-tag-${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'go-prod' }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/writer/cerebro

jobs:
  propose:
    name: Propose image tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Resolve image tag
        id: image
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.client_payload.image_tag || github.event.inputs.image_tag || '' }}
          EXPECTED_DIGEST: ${{ github.event.client_payload.image_digest || '' }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            token="$(curl -fsSL "https://ghcr.io/token?scope=repository:writer/cerebro:pull" | jq -r '.token')"
            tags_json="$(curl -fsSL -H "Authorization: Bearer ${token}" "https://ghcr.io/v2/writer/cerebro/tags/list?n=1000")"
            tag="$(jq -r '.tags[]?' <<<"${tags_json}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          fi

          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Resolved invalid image tag: ${tag}" >&2
            exit 1
          fi

          docker buildx imagetools inspect "${GHCR_IMAGE}:${tag}" >/dev/null
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${tag}" --format '{{.Manifest.Digest}}')"
          if [ -z "${digest}" ]; then
            echo "Could not resolve manifest-list digest for ${GHCR_IMAGE}:${tag}" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_DIGEST}" ] && [ "${digest}" != "${EXPECTED_DIGEST}" ]; then
            echo "Resolved digest ${digest} does not match dispatched digest ${EXPECTED_DIGEST}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${GHCR_IMAGE}:${tag} ${digest}"

      - name: Verify release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DISPATCH_RELEASE_URL: ${{ github.event.client_payload.release_url || '' }}
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || '' }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "${IMAGE_TAG}" --repo writer/cerebro --json isDraft,isPrerelease,url,tagName)"
          release_url="$(jq -r '.url // empty' <<<"${release_json}")"
          if [ "$(jq -r '.isDraft' <<<"${release_json}")" = "true" ]; then
            echo "Release ${IMAGE_TAG} is still a draft" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "repository_dispatch" ] && [ "$(jq -r '.isPrerelease' <<<"${release_json}")" = "true" ]; then
            echo "Repository-dispatch auto deploys only accept stable releases; ${IMAGE_TAG} is a prerelease" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "repository_dispatch" ] && [ "${DISPATCH_SOURCE_REPOSITORY}" != "writer/cerebro" ]; then
            echo "Repository dispatch must originate from writer/cerebro; got ${DISPATCH_SOURCE_REPOSITORY}" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "repository_dispatch" ] && [ "${DISPATCH_SOURCE_REF}" != "refs/tags/${IMAGE_TAG}" ]; then
            echo "Repository dispatch source ref ${DISPATCH_SOURCE_REF} does not match refs/tags/${IMAGE_TAG}" >&2
            exit 1
          fi
          if [ -n "${DISPATCH_RELEASE_URL}" ] && [ -n "${release_url}" ] && [ "${DISPATCH_RELEASE_URL}" != "${release_url}" ]; then
            echo "Dispatched release URL ${DISPATCH_RELEASE_URL} does not match GitHub release ${release_url}" >&2
            exit 1
          fi
          echo "url=${release_url}" >> "$GITHUB_OUTPUT"

      - name: Verify image signature and attestations
        id: verify
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          image_ref="${GHCR_IMAGE}@${IMAGE_DIGEST}"

          cosign verify \
            --certificate-identity-regexp "https://github.com/writer/cerebro/.github/workflows/release.yml@refs/tags/${IMAGE_TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image_ref}" > cosign-verify.json

          docker buildx imagetools inspect "${image_ref}" --raw > image-index.json
          if ! jq -e '.manifests[]? | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")' image-index.json >/dev/null; then
            echo "No SBOM/provenance attestation manifests found for ${image_ref}" >&2
            cat image-index.json >&2
            exit 1
          fi

          echo "verify_summary=signature and build attestations verified" >> "$GITHUB_OUTPUT"

      - name: Download and verify runtime deploy contract
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          STACK_NAME: ${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'go-prod' }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          current_tag="$(awk '$1 == "cerebro:imageTag:" { print $2; exit }' "infra/aws/Pulumi.${STACK_NAME}.yaml")"
          if [ "${current_tag}" = "${IMAGE_TAG}" ]; then
            echo "Stack ${STACK_NAME} already uses ${IMAGE_TAG}; skipping runtime contract download."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p runtime-contract
          gh release download "${IMAGE_TAG}" --repo writer/cerebro --dir runtime-contract \
            --pattern cerebro-runtime-contract.json \
            --pattern cerebro-runtime-contract.json.sig \
            --pattern cerebro-runtime-contract.json.pem

          cosign verify-blob \
            --certificate runtime-contract/cerebro-runtime-contract.json.pem \
            --signature runtime-contract/cerebro-runtime-contract.json.sig \
            --certificate-identity-regexp "https://github.com/writer/cerebro/.github/workflows/release.yml@refs/tags/${IMAGE_TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            runtime-contract/cerebro-runtime-contract.json
          echo "path=runtime-contract/cerebro-runtime-contract.json" >> "$GITHUB_OUTPUT"

      - name: Update stack config
        id: update
        shell: bash
        env:
          STACK_NAME: ${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'go-prod' }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
        run: |
          set -euo pipefail

          current_tag="$(awk '$1 == "cerebro:imageTag:" { print $2; exit }' "infra/aws/Pulumi.${STACK_NAME}.yaml")"
          echo "current_tag=${current_tag}" >> "$GITHUB_OUTPUT"
          uv run --project infra python infra/scripts/set_image_tag.py --stack "${STACK_NAME}" --image-tag "${IMAGE_TAG}"
          uv run --project infra python infra/scripts/validate_stack_config.py "infra/aws/Pulumi.${STACK_NAME}.yaml"
          if [ -n "${CONTRACT_PATH}" ]; then
            contract_args=()
            if [ "${STACK_NAME}" = "sec-dev" ]; then
              contract_args+=(--require-manifest-runtimes)
            fi
            uv run --project infra python infra/scripts/verify_runtime_contract.py \
              --contract "${CONTRACT_PATH}" \
              --stack-file "infra/aws/Pulumi.${STACK_NAME}.yaml" \
              "${contract_args[@]}"
          fi

          if git diff --quiet -- "infra/aws/Pulumi.${STACK_NAME}.yaml"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Stack ${STACK_NAME} already uses ${IMAGE_TAG}"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Apply stack config update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CEREBRO_AUTORELEASE_TOKEN || github.token }}
          AUTORELEASE_TOKEN_CONFIGURED: ${{ secrets.CEREBRO_AUTORELEASE_TOKEN != '' }}
          STACK_NAME: ${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'go-prod' }}
          APPLY_MODE: ${{ github.event.client_payload.apply_mode || 'pull_request' }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_TAG: ${{ steps.update.outputs.current_tag }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          VERIFY_SUMMARY: ${{ steps.verify.outputs.verify_summary }}
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || '' }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref || '' }}
        run: |
          set -euo pipefail

          safe_tag="$(printf '%s' "${IMAGE_TAG}" | tr -c 'A-Za-z0-9._-' '-')"
          branch="automation/cerebro-image-${STACK_NAME}-${safe_tag}"
          title="chore: bump ${STACK_NAME} Cerebro image to ${IMAGE_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${APPLY_MODE}" = "direct_push" ]; then
            if [ "${STACK_NAME}" != "sec-dev" ]; then
              echo "direct_push is only allowed for sec-dev; got ${STACK_NAME}" >&2
              exit 1
            fi
            if [ "${EVENT_NAME}" != "repository_dispatch" ]; then
              echo "direct_push is reserved for signed public release dispatches" >&2
              exit 1
            fi
            if [ "${AUTORELEASE_TOKEN_CONFIGURED}" != "true" ]; then
              echo "CEREBRO_AUTORELEASE_TOKEN is required for direct_push so the push triggers deploy workflows" >&2
              exit 1
            fi

            changed_files="$(git diff --name-only)"
            expected_file="infra/aws/Pulumi.${STACK_NAME}.yaml"
            if [ "${changed_files}" != "${expected_file}" ]; then
              echo "direct_push can only change ${expected_file}; got:" >&2
              printf '%s\n' "${changed_files}" >&2
              exit 1
            fi
            uv run --project infra python infra/scripts/validate_stack_config.py

            git add "${expected_file}"
            git commit -m "chore: deploy ${STACK_NAME} Cerebro ${IMAGE_TAG}" \
              -m "Triggered by writer/cerebro release ${IMAGE_TAG}." \
              -m "Image: ${GHCR_IMAGE}:${IMAGE_TAG}" \
              -m "Digest: ${IMAGE_DIGEST}" \
              -m "Release: ${RELEASE_URL}" \
              -m "Supply chain: ${VERIFY_SUMMARY}"
            deploy_sha="$(git rev-parse HEAD)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/WriterInternal/cerebro.git" "HEAD:main"

            dispatch_and_require_run() {
              local workflow="$1"
              shift
              local run_id=""
              local run_url=""
              local run=""

              gh workflow run "${workflow}" --ref main "$@"
              for _ in {1..24}; do
                run="$(gh run list \
                  --workflow "${workflow}" \
                  --event workflow_dispatch \
                  --branch main \
                  --limit 20 \
                  --json databaseId,headSha,url \
                  --jq ".[] | select(.headSha == \"${deploy_sha}\") | [.databaseId, .url] | @tsv" | head -n 1)"
                if [ -n "${run}" ]; then
                  IFS=$'\t' read -r run_id run_url <<< "${run}"
                  echo "Created ${workflow} workflow_dispatch run ${run_id} for ${deploy_sha}: ${run_url}"
                  return 0
                fi
                sleep 5
              done
              echo "Could not find ${workflow} workflow_dispatch run for ${deploy_sha}" >&2
              exit 1
            }

            # Clean up stale sec-dev automation branches and PRs from prior runs
            gh pr list --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"automation/cerebro-image-${STACK_NAME}-\")) | .number" \
            | while read -r old_pr; do
              echo "Closing superseded PR #${old_pr}"
              gh pr close "${old_pr}" --comment "Superseded by direct-push of ${IMAGE_TAG}." --delete-branch || true
            done
            mapfile -t stale_branches < <(
              gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate -q '.[].name' \
              | grep -E "^automation/cerebro-image-${STACK_NAME}-" || true
            )
            for old_branch in "${stale_branches[@]}"; do
              echo "Deleting stale branch ${old_branch}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${old_branch}" 2>/dev/null || true
            done

            echo "Pushed ${STACK_NAME} deploy commit for ${IMAGE_TAG}; dispatching sec-dev publish and deploy workflows."
            dispatch_and_require_run ci.yml
            dispatch_and_require_run infra-deploy.yml -f environment="${STACK_NAME}"
            exit 0
          fi

          if [ "${APPLY_MODE}" != "pull_request" ]; then
            echo "Unknown apply_mode ${APPLY_MODE}; expected pull_request or direct_push" >&2
            exit 1
          fi

          git checkout -B "${branch}"
          git add "infra/aws/Pulumi.${STACK_NAME}.yaml"
          git commit -m "${title}"
          git push --force-with-lease "https://x-access-token:${GH_TOKEN}@github.com/WriterInternal/cerebro.git" "HEAD:${branch}"

          body="$(mktemp)"
          {
            echo "Updates \`${STACK_NAME}\` to \`${GHCR_IMAGE}:${IMAGE_TAG}\`."
            echo
            if [ -n "${CURRENT_TAG}" ]; then
              echo "- Compare: https://github.com/writer/cerebro/compare/${CURRENT_TAG}...${IMAGE_TAG}"
            fi
            echo "- Image: \`${GHCR_IMAGE}:${IMAGE_TAG}\`"
            if [ -n "${IMAGE_DIGEST}" ]; then
              echo "- Digest: \`${IMAGE_DIGEST}\`"
            fi
            echo "- Supply chain: ${VERIFY_SUMMARY}"
            if [ -n "${RELEASE_URL}" ]; then
              echo "- Release: ${RELEASE_URL}"
            fi
            echo
            echo "Deployment remains review-gated: merge this PR to let the existing mirror and Pulumi deploy workflows run."
          } > "${body}"

          # Close superseded automation PRs and delete their branches
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"automation/cerebro-image-${STACK_NAME}-\")) | select(.headRefName != \"${branch}\") | .number" \
          | while read -r old_pr; do
            echo "Closing superseded PR #${old_pr}"
            gh pr close "${old_pr}" --comment "Superseded by ${IMAGE_TAG}." --delete-branch || true
          done

          # Delete stale automation branches with no open PR
          mapfile -t stale_branches < <(
            gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate -q '.[].name' \
            | grep -E "^automation/cerebro-image-${STACK_NAME}-" \
            | grep -v "^${branch}$" || true
          )
          for old_branch in "${stale_branches[@]}"; do
            echo "Deleting stale branch ${old_branch}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${old_branch}" 2>/dev/null || true
          done

          existing_pr="$(gh pr list --head "${branch}" --json url --jq '.[0].url // empty')"
          if [ -n "${existing_pr}" ]; then
            pr_url="${existing_pr}"
            gh pr edit "${pr_url}" --title "${title}" --body-file "${body}"
            echo "Updated ${pr_url}"
          else
            pr_url="$(gh pr create --base main --head "${branch}" --title "${title}" --body-file "${body}")"
            echo "Created ${pr_url}"
          fi

          auto_merge_trusted_pr() {
            local pr_url="$1"
            local expected_file="infra/aws/Pulumi.${STACK_NAME}.yaml"
            local changed_files=""
            local check_count=""

            if [ "${EVENT_NAME}" != "repository_dispatch" ] || [ "${STACK_NAME}" != "go-prod" ] || [ "${APPLY_MODE}" != "pull_request" ]; then
              return 0
            fi
            if [ "${AUTORELEASE_TOKEN_CONFIGURED}" != "true" ]; then
              echo "::notice::CEREBRO_AUTORELEASE_TOKEN is not configured; leaving ${pr_url} for manual merge."
              return 0
            fi
            if [ "${DISPATCH_SOURCE_REPOSITORY}" != "writer/cerebro" ] || [ "${DISPATCH_SOURCE_REF}" != "refs/tags/${IMAGE_TAG}" ]; then
              echo "Refusing to auto-merge untrusted dispatch source ${DISPATCH_SOURCE_REPOSITORY} ${DISPATCH_SOURCE_REF}" >&2
              exit 1
            fi

            changed_files="$(gh pr diff "${pr_url}" --name-only)"
            if [ "${changed_files}" != "${expected_file}" ]; then
              echo "Refusing to auto-merge ${pr_url}; expected only ${expected_file}, got:" >&2
              printf '%s\n' "${changed_files}" >&2
              exit 1
            fi

            for _ in {1..36}; do
              check_count="$(gh pr checks "${pr_url}" --json name --jq 'length' 2>/dev/null || true)"
              if [[ "${check_count}" =~ ^[0-9]+$ ]] && [ "${check_count}" -gt 0 ]; then
                break
              fi
              sleep 5
            done
            if ! [[ "${check_count}" =~ ^[0-9]+$ ]] || [ "${check_count}" -eq 0 ]; then
              echo "No PR checks registered for ${pr_url}; refusing trusted auto-merge." >&2
              exit 1
            fi

            gh pr checks "${pr_url}" --watch --interval 10 --fail-fast
            gh pr merge "${pr_url}" --merge --delete-branch
          }

          auto_merge_trusted_pr "${pr_url}"
