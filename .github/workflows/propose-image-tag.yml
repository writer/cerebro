name: Propose Cerebro Image Tag
run-name: Cerebro image ${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'go-prod' }} ${{ github.event.client_payload.image_tag || github.event.inputs.image_tag || 'latest' }} ${{ github.event.client_payload.request_id || github.run_id }}

on:
  schedule:
    - cron: '20 14 * * 1-5'
  repository_dispatch:
    types:
      - cerebro-release-published
  workflow_dispatch:
    inputs:
      environment:
        description: Stack to update
        required: true
        default: go-prod
        type: choice
        options:
          - sec-dev
          - go-prod
      image_tag:
        description: Optional explicit image tag. When empty, use the latest published stable Cerebro release.
        required: false
        type: string

permissions:
  actions: write
  checks: read
  contents: write
  packages: read
  pull-requests: write
  statuses: read

concurrency:
  group: propose-cerebro-image-tag-${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'go-prod' }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/writer/cerebro
  INPUT_TAG: ${{ github.event.client_payload.image_tag || github.event.inputs.image_tag || '' }}
  STACK_NAME: ${{ github.event.client_payload.target_environment || github.event.inputs.environment || 'go-prod' }}

jobs:
  propose:
    name: Propose image tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Resolve image tag
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ env.INPUT_TAG }}
          EXPECTED_DIGEST: ${{ github.event.client_payload.image_digest || '' }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="$(gh api "repos/writer/cerebro/releases/latest" --jq '.tag_name')"
          fi

          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Resolved invalid image tag: ${tag}" >&2
            exit 1
          fi

          docker buildx imagetools inspect "${GHCR_IMAGE}:${tag}" >/dev/null
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${tag}" --format '{{.Manifest.Digest}}')"
          if [ -z "${digest}" ]; then
            echo "Could not resolve manifest-list digest for ${GHCR_IMAGE}:${tag}" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_DIGEST}" ] && [ "${digest}" != "${EXPECTED_DIGEST}" ]; then
            echo "Resolved digest ${digest} does not match dispatched digest ${EXPECTED_DIGEST}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${GHCR_IMAGE}:${tag} ${digest}"

      - name: Verify release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DISPATCH_RELEASE_URL: ${{ github.event.client_payload.release_url || '' }}
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || '' }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/writer/cerebro/releases/tags/${IMAGE_TAG}")"
          release_url="$(jq -r '.html_url // empty' <<<"${release_json}")"
          if [ "$(jq -r '.draft' <<<"${release_json}")" = "true" ]; then
            echo "Release ${IMAGE_TAG} is still a draft" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "repository_dispatch" ] && [ "$(jq -r '.prerelease' <<<"${release_json}")" = "true" ]; then
            echo "Repository-dispatch auto deploys only accept stable releases; ${IMAGE_TAG} is a prerelease" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "repository_dispatch" ] && [ "${DISPATCH_SOURCE_REPOSITORY}" != "writer/cerebro" ]; then
            echo "Repository dispatch must originate from writer/cerebro; got ${DISPATCH_SOURCE_REPOSITORY}" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "repository_dispatch" ] && [ "${DISPATCH_SOURCE_REF}" != "refs/tags/${IMAGE_TAG}" ]; then
            echo "Repository dispatch source ref ${DISPATCH_SOURCE_REF} does not match refs/tags/${IMAGE_TAG}" >&2
            exit 1
          fi
          if [ -n "${DISPATCH_RELEASE_URL}" ] && [ -n "${release_url}" ] && [ "${DISPATCH_RELEASE_URL}" != "${release_url}" ]; then
            echo "Dispatched release URL ${DISPATCH_RELEASE_URL} does not match GitHub release ${release_url}" >&2
            exit 1
          fi
          echo "url=${release_url}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest stable release
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          latest_tag="$(
            gh api "repos/writer/cerebro/releases/latest" --jq '.tag_name'
          )"
          if ! [[ "${latest_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve latest stable writer/cerebro release; got ${latest_tag}" >&2
            exit 1
          fi

          superseded=false
          if [ "${EVENT_NAME}" = "repository_dispatch" ] && [ "${IMAGE_TAG}" != "${latest_tag}" ]; then
            superseded=true
            echo "::notice::Superseding ${IMAGE_TAG}; latest stable writer/cerebro release is ${latest_tag}."
          fi
          if [ "${EVENT_NAME}" = "schedule" ] && [ "${IMAGE_TAG}" != "${latest_tag}" ]; then
            echo "Scheduled release scan resolved ${IMAGE_TAG}, but latest stable writer/cerebro release is ${latest_tag}." >&2
            exit 1
          fi

          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "superseded=${superseded}" >> "$GITHUB_OUTPUT"

      - name: Verify image signature and attestations
        if: steps.latest.outputs.superseded != 'true'
        id: verify
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          image_ref="${GHCR_IMAGE}@${IMAGE_DIGEST}"
          release_identity="https://github.com/writer/cerebro/.github/workflows/release.yml@refs/(tags/${IMAGE_TAG}|heads/main)"

          cosign verify \
            --certificate-identity-regexp "${release_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image_ref}" > cosign-verify.json

          docker buildx imagetools inspect "${image_ref}" --raw > image-index.json
          if ! jq -e '.manifests[]? | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")' image-index.json >/dev/null; then
            echo "No SBOM/provenance attestation manifests found for ${image_ref}" >&2
            cat image-index.json >&2
            exit 1
          fi

          echo "verify_summary=signature and build attestations verified" >> "$GITHUB_OUTPUT"

      - name: Download and verify runtime deploy contract
        if: steps.latest.outputs.superseded != 'true'
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          STACK_NAME: ${{ env.STACK_NAME }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          current_tag="$(awk '$1 == "cerebro:imageTag:" { print $2; exit }' "infra/aws/Pulumi.${STACK_NAME}.yaml")"
          if [ "${current_tag}" = "${IMAGE_TAG}" ]; then
            echo "Stack ${STACK_NAME} already uses ${IMAGE_TAG}; skipping runtime contract download."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p runtime-contract
          release_json="$(gh api "repos/writer/cerebro/releases/tags/${IMAGE_TAG}")"
          contract_base="cerebro-runtime-contract-${STACK_NAME}"
          if ! jq -e --arg name "${contract_base}.json" '.assets[]? | select(.name == $name)' <<<"${release_json}" >/dev/null; then
            contract_base="cerebro-runtime-contract"
          fi
          echo "Using runtime deploy contract assets ${contract_base}.* for ${STACK_NAME}."

          for suffix in json json.sig json.pem; do
            asset="${contract_base}.${suffix}"
            destination="runtime-contract/cerebro-runtime-contract.${suffix}"
            asset_id="$(jq -r --arg name "${asset}" '.assets[]? | select(.name == $name) | .id' <<<"${release_json}" | head -n 1)"
            if [ -z "${asset_id}" ] || [ "${asset_id}" = "null" ]; then
              echo "Release ${IMAGE_TAG} is missing ${asset}" >&2
              exit 1
            fi
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/writer/cerebro/releases/assets/${asset_id}" > "${destination}"
          done

          cosign verify-blob \
            --certificate runtime-contract/cerebro-runtime-contract.json.pem \
            --signature runtime-contract/cerebro-runtime-contract.json.sig \
            --certificate-identity-regexp "https://github.com/writer/cerebro/.github/workflows/release.yml@refs/(tags/${IMAGE_TAG}|heads/main)" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            runtime-contract/cerebro-runtime-contract.json
          echo "path=runtime-contract/cerebro-runtime-contract.json" >> "$GITHUB_OUTPUT"

      - name: Update stack config
        if: steps.latest.outputs.superseded != 'true'
        id: update
        shell: bash
        env:
          STACK_NAME: ${{ env.STACK_NAME }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          target_config="infra/aws/Pulumi.${STACK_NAME}.yaml"
          changed_paths=("${target_config}")
          current_tag="$(awk '$1 == "cerebro:imageTag:" { print $2; exit }' "${target_config}")"
          echo "current_tag=${current_tag}" >> "$GITHUB_OUTPUT"
          target_tag_args=(--stack "${STACK_NAME}" --image-tag "${IMAGE_TAG}")
          if [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            target_tag_args+=(--ensure-at-least)
          fi
          uv run --project infra python infra/scripts/set_image_tag.py "${target_tag_args[@]}"
          if [ "${STACK_NAME}" = "go-prod" ]; then
            sec_dev_config="infra/aws/Pulumi.sec-dev.yaml"
            changed_paths+=("${sec_dev_config}")
            uv run --project infra python infra/scripts/set_image_tag.py --stack sec-dev --image-tag "${IMAGE_TAG}" --ensure-at-least
          fi
          uv run --project infra python infra/scripts/validate_pulumi_project_config.py
          uv run --project infra python infra/scripts/validate_stack_config.py
          if [ -n "${CONTRACT_PATH}" ]; then
            uv run --project infra python infra/scripts/verify_runtime_contract.py \
              --contract "${CONTRACT_PATH}" \
              --stack-file "${target_config}"
            uv run --project infra python infra/scripts/build_deploy_preflight_receipt.py \
              --contract "${CONTRACT_PATH}" \
              --stack-file "${target_config}" \
              --output "deploy-preflight-${STACK_NAME}.json"
            if [ "${STACK_NAME}" = "go-prod" ] && ! git diff --quiet -- "${sec_dev_config}"; then
              uv run --project infra python infra/scripts/verify_runtime_contract.py \
                --contract "${CONTRACT_PATH}" \
                --stack-file "${sec_dev_config}"
              uv run --project infra python infra/scripts/build_deploy_preflight_receipt.py \
                --contract "${CONTRACT_PATH}" \
                --stack-file "${sec_dev_config}" \
                --output "deploy-preflight-sec-dev.json"
            fi
          fi

          if git diff --quiet -- "${changed_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Stack ${STACK_NAME} already uses ${IMAGE_TAG}"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release automation auth
        if: steps.latest.outputs.superseded != 'true' && steps.update.outputs.changed == 'true'
        id: release-auth
        shell: bash
        env:
          DEPLOY_APP_CLIENT_ID: ${{ vars.CEREBRO_DEPLOY_APP_CLIENT_ID }}
          DEPLOY_APP_PRIVATE_KEY: ${{ secrets.CEREBRO_DEPLOY_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${DEPLOY_APP_CLIENT_ID}" ] && [ -n "${DEPLOY_APP_PRIVATE_KEY}" ]; then
            echo "mode=deploy_app" >> "$GITHUB_OUTPUT"
            echo "Using deploy GitHub App token."
            exit 0
          fi

          echo "Release promotion requires CEREBRO_DEPLOY_APP_CLIENT_ID plus CEREBRO_DEPLOY_APP_PRIVATE_KEY." >&2
          exit 1

      - name: Create deploy GitHub App token
        if: steps.latest.outputs.superseded != 'true' && steps.update.outputs.changed == 'true'
        id: deploy-app-token
        uses: ./.github/actions/deploy-app-token
        with:
          client-id: ${{ vars.CEREBRO_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CEREBRO_DEPLOY_APP_PRIVATE_KEY }}

      - name: Apply stack config update
        if: steps.latest.outputs.superseded != 'true' && steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.deploy-app-token.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          DEPLOY_APP_SLUG: ${{ steps.deploy-app-token.outputs.app-slug }}
          STACK_NAME: ${{ env.STACK_NAME }}
          APPLY_MODE: ${{ github.event.client_payload.apply_mode || 'pull_request' }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_TAG: ${{ steps.update.outputs.current_tag }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          VERIFY_SUMMARY: ${{ steps.verify.outputs.verify_summary }}
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || '' }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref || '' }}
          LATEST_STABLE_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail

          safe_tag="$(printf '%s' "${IMAGE_TAG}" | tr -c 'A-Za-z0-9._-' '-')"
          branch="automation/cerebro-image-${STACK_NAME}-${safe_tag}"
          title="chore: bump ${STACK_NAME} Cerebro image to ${IMAGE_TAG}"

          if [ -z "${GH_TOKEN}" ]; then
            echo "No release promotion token resolved" >&2
            exit 1
          fi
          deploy_app_user_id="$(gh api "/users/${DEPLOY_APP_SLUG}[bot]" --jq .id)"
          git config user.name "${DEPLOY_APP_SLUG}[bot]"
          git config user.email "${deploy_app_user_id}+${DEPLOY_APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          promotion_mode="${APPLY_MODE}"
          if [ "${promotion_mode}" = "direct_push" ]; then
            echo "::warning::apply_mode=direct_push is deprecated; creating a trusted sec-dev release PR instead."
            promotion_mode="trusted_sec_dev_release"
          fi
          if [ "${promotion_mode}" = "trusted_sec_dev_release" ]; then
            if [ "${STACK_NAME}" != "sec-dev" ]; then
              echo "trusted_sec_dev_release is only allowed for sec-dev; got ${STACK_NAME}" >&2
              exit 1
            fi
            if [ "${EVENT_NAME}" != "repository_dispatch" ]; then
              echo "trusted_sec_dev_release is reserved for signed public release dispatches" >&2
              exit 1
            fi
          fi
          if [ "${promotion_mode}" != "pull_request" ] && [ "${promotion_mode}" != "trusted_sec_dev_release" ]; then
            echo "Unknown apply_mode ${APPLY_MODE}; expected pull_request or trusted_sec_dev_release" >&2
            exit 1
          fi

          refresh_from_main_and_apply_update() {
            local target_config="infra/aws/Pulumi.${STACK_NAME}.yaml"
            local sec_dev_config="infra/aws/Pulumi.sec-dev.yaml"
            local changed_paths=("${target_config}")
            local refreshed_current_tag=""

            git fetch origin main:refs/remotes/origin/main
            git checkout -f -B "${branch}" origin/main

            refreshed_current_tag="$(awk '$1 == "cerebro:imageTag:" { print $2; exit }' "${target_config}")"
            echo "Refreshed ${branch} from origin/main; ${STACK_NAME} was ${refreshed_current_tag}, target is ${IMAGE_TAG}."

            target_tag_args=(--stack "${STACK_NAME}" --image-tag "${IMAGE_TAG}")
            if [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
              target_tag_args+=(--ensure-at-least)
            fi
            uv run --project infra python infra/scripts/set_image_tag.py "${target_tag_args[@]}"
            if [ "${STACK_NAME}" = "go-prod" ]; then
              changed_paths+=("${sec_dev_config}")
              uv run --project infra python infra/scripts/set_image_tag.py --stack sec-dev --image-tag "${IMAGE_TAG}" --ensure-at-least
            fi

            uv run --project infra python infra/scripts/validate_pulumi_project_config.py
            uv run --project infra python infra/scripts/validate_stack_config.py
            if [ -n "${CONTRACT_PATH}" ]; then
              uv run --project infra python infra/scripts/verify_runtime_contract.py \
                --contract "${CONTRACT_PATH}" \
                --stack-file "${target_config}"
              uv run --project infra python infra/scripts/build_deploy_preflight_receipt.py \
                --contract "${CONTRACT_PATH}" \
                --stack-file "${target_config}" \
                --output "deploy-preflight-${STACK_NAME}.json"
              if [ "${STACK_NAME}" = "go-prod" ] && ! git diff --quiet -- "${sec_dev_config}"; then
                uv run --project infra python infra/scripts/verify_runtime_contract.py \
                  --contract "${CONTRACT_PATH}" \
                  --stack-file "${sec_dev_config}"
                uv run --project infra python infra/scripts/build_deploy_preflight_receipt.py \
                  --contract "${CONTRACT_PATH}" \
                  --stack-file "${sec_dev_config}" \
                  --output "deploy-preflight-sec-dev.json"
              fi
            fi

            if git diff --quiet -- "${changed_paths[@]}"; then
              echo "Stack ${STACK_NAME} already uses ${IMAGE_TAG} after refreshing origin/main."
              exit 0
            fi
          }

          resolve_latest_stable_tag() {
            gh api "repos/writer/cerebro/releases/latest" --jq '.tag_name'
          }

          release_is_still_latest() {
            local pr_url="${1:-}"
            local latest_tag="${LATEST_STABLE_TAG}"
            if [ -z "${latest_tag}" ]; then
              latest_tag="$(resolve_latest_stable_tag)"
            fi
            if [ -z "${latest_tag}" ]; then
              echo "Could not resolve latest stable writer/cerebro release" >&2
              exit 1
            fi
            if [ "${IMAGE_TAG}" = "${latest_tag}" ]; then
              return 0
            fi

            echo "::notice::Superseding ${IMAGE_TAG}; latest stable writer/cerebro release is ${latest_tag}."
            if [ -n "${pr_url}" ]; then
              gh pr close "${pr_url}" --comment "Superseded by latest stable Cerebro release ${latest_tag}." --delete-branch || true
            fi
            return 1
          }

          wait_for_sec_dev_release() {
            local deadline=$((SECONDS + 5400))
            local sec_dev_branch="automation/cerebro-image-sec-dev-${safe_tag}"
            local sec_dev_pr=""
            local sec_dev_pr_url=""
            local sec_dev_sha=""
            local run=""
            local status=""
            local conclusion=""
            local run_url=""

            while [ "${SECONDS}" -lt "${deadline}" ]; do
              if [ -z "${sec_dev_sha}" ]; then
                sec_dev_pr="$(
                  GH_TOKEN="${CHECKS_TOKEN}" gh pr list \
                    --repo "${GITHUB_REPOSITORY}" \
                    --state merged \
                    --head "${sec_dev_branch}" \
                    --limit 1 \
                    --json mergeCommit,url \
                    --jq '.[0] | [(.mergeCommit.oid // ""), (.url // "")] | @tsv'
                )"
                if [ -n "${sec_dev_pr}" ]; then
                  IFS=$'\t' read -r sec_dev_sha sec_dev_pr_url <<< "${sec_dev_pr}"
                fi
                if [ -z "${sec_dev_sha}" ]; then
                  echo "::notice::Waiting for the sec-dev ${IMAGE_TAG} promotion PR to merge."
                  sleep 10
                  continue
                fi
                echo "sec-dev ${IMAGE_TAG} promotion merged: ${sec_dev_pr_url}"
              fi

              run="$(
                GH_TOKEN="${CHECKS_TOKEN}" gh run list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --workflow infra-deploy.yml \
                  --event push \
                  --branch main \
                  --limit 100 \
                  --json headSha,status,conclusion,url \
                  --jq ".[] | select(.headSha == \"${sec_dev_sha}\") | [.status, (.conclusion // \"\"), .url] | @tsv" \
                  | head -n 1
              )"
              if [ -n "${run}" ]; then
                IFS=$'\t' read -r status conclusion run_url <<< "${run}"
                if [ "${status}" = "completed" ] && [ "${conclusion}" = "success" ]; then
                  echo "sec-dev deploy for ${IMAGE_TAG} succeeded: ${run_url}"
                  return 0
                fi
                if [ "${status}" = "completed" ]; then
                  echo "::notice::sec-dev deploy for ${IMAGE_TAG} completed with ${conclusion}; leaving go-prod PR open."
                  return 1
                fi
              fi
              sleep 10
            done

            echo "::notice::Timed out after 90 minutes waiting for the sec-dev ${IMAGE_TAG} promotion and deployment; leaving the go-prod PR open."
            return 1
          }

          refresh_from_main_and_apply_update

          git add "infra/aws/Pulumi.${STACK_NAME}.yaml"
          if [ "${STACK_NAME}" = "go-prod" ]; then
            git add "infra/aws/Pulumi.sec-dev.yaml"
          fi
          git commit -m "${title}"
          git fetch origin "${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "HEAD:${branch}"

          body="$(mktemp)"
          {
            echo "Updates \`${STACK_NAME}\` to \`${GHCR_IMAGE}:${IMAGE_TAG}\`."
            echo
            if [ -n "${CURRENT_TAG}" ]; then
              echo "- Compare: https://github.com/writer/cerebro/compare/${CURRENT_TAG}...${IMAGE_TAG}"
            fi
            if [ "${STACK_NAME}" = "go-prod" ]; then
              echo "- Keeps \`sec-dev\` at least \`${IMAGE_TAG}\` so it cannot lag production."
            fi
            echo "- Image: \`${GHCR_IMAGE}:${IMAGE_TAG}\`"
            if [ -n "${IMAGE_DIGEST}" ]; then
              echo "- Digest: \`${IMAGE_DIGEST}\`"
            fi
            echo "- Supply chain: ${VERIFY_SUMMARY}"
            if [ -n "${RELEASE_URL}" ]; then
              echo "- Release: ${RELEASE_URL}"
            fi
            if [ -n "${CONTRACT_PATH}" ] && [ -s "${CONTRACT_PATH}" ]; then
              contract_sources="$(jq '[.sources[]?] | length' "${CONTRACT_PATH}")"
              contract_runtimes="$(jq '[.sources[]?.runtimes[]?] | length' "${CONTRACT_PATH}")"
              contract_receipts="$(
                jq '[
                  (.source_health_receipts[]? // empty),
                  (.sources[]?.source_health_receipts[]? // empty),
                  (.sources[]?.source_health_receipt? // empty)
                ] | map(select(type == "object")) | length' "${CONTRACT_PATH}"
              )"
              echo "- Runtime contract: ${contract_sources} sources, ${contract_runtimes} manifest runtimes, ${contract_receipts} source-health receipts"
            fi
            echo
            if [ "${promotion_mode}" = "trusted_sec_dev_release" ]; then
              echo "Trusted release promotion: this PR will auto-merge after required checks pass, then the normal main push deploy workflow will run."
            else
              echo "Deployment remains review-gated: merge this PR to let the existing mirror and Pulumi deploy workflows run."
            fi
          } > "${body}"

          # Close superseded automation PRs and delete their branches
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"automation/cerebro-image-${STACK_NAME}-\")) | select(.headRefName != \"${branch}\") | .number" \
          | while read -r old_pr; do
            echo "Closing superseded PR #${old_pr}"
            gh pr close "${old_pr}" --comment "Superseded by ${IMAGE_TAG}." --delete-branch || true
          done

          # Delete stale automation branches with no open PR
          mapfile -t stale_branches < <(
            gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate -q '.[].name' \
            | grep -E "^automation/cerebro-image-${STACK_NAME}-" \
            | grep -v "^${branch}$" || true
          )
          for old_branch in "${stale_branches[@]}"; do
            echo "Deleting stale branch ${old_branch}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${old_branch}" 2>/dev/null || true
          done

          existing_pr="$(gh pr list --head "${branch}" --json url --jq '.[0].url // empty')"
          if [ -n "${existing_pr}" ]; then
            pr_url="${existing_pr}"
            gh pr edit "${pr_url}" --title "${title}" --body-file "${body}"
            echo "Updated ${pr_url}"
          else
            pr_url="$(gh pr create --base main --head "${branch}" --title "${title}" --body-file "${body}")"
            echo "Created ${pr_url}"
          fi

          auto_merge_trusted_pr() {
            local pr_url="$1"
            local expected_file="infra/aws/Pulumi.${STACK_NAME}.yaml"
            local expected_sec_dev_file="infra/aws/Pulumi.sec-dev.yaml"
            local expected_files=""
            local changed_files=""
            local check_count=""

            trusted_auto_merge_source() {
              if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
                if [ "${DISPATCH_SOURCE_REPOSITORY}" != "writer/cerebro" ] || [ "${DISPATCH_SOURCE_REF}" != "refs/tags/${IMAGE_TAG}" ]; then
                  echo "Refusing to auto-merge untrusted dispatch source ${DISPATCH_SOURCE_REPOSITORY} ${DISPATCH_SOURCE_REF}" >&2
                  exit 1
                fi
                return 0
              fi

              if [ "${EVENT_NAME}" = "schedule" ]; then
                echo "Scheduled release promotion resolved ${IMAGE_TAG}; treating latest stable release scan as trusted."
                return 0
              fi

              echo "::notice::Auto-merge is limited to signed release dispatches and scheduled latest-stable scans; leaving ${pr_url} open."
              return 1
            }

            if [ "${promotion_mode}" = "trusted_sec_dev_release" ]; then
              :
            elif [ "${STACK_NAME}" = "go-prod" ] && [ "${promotion_mode}" = "pull_request" ]; then
              :
            else
              return 0
            fi
            if ! trusted_auto_merge_source; then
              return 0
            fi
            if ! release_is_still_latest "${pr_url}"; then
              return 0
            fi

            changed_files="$(gh pr diff "${pr_url}" --name-only | sort)"
            expected_files="${expected_file}"
            if [ "${STACK_NAME}" = "go-prod" ]; then
              expected_files="$(printf '%s\n%s\n' "${expected_file}" "${expected_sec_dev_file}" | sort)"
            fi
            if [ "${changed_files}" != "${expected_file}" ] \
              && [ "${changed_files}" != "${expected_files}" ] \
              && { [ "${STACK_NAME}" != "go-prod" ] || [ "${changed_files}" != "${expected_sec_dev_file}" ]; }; then
              echo "Refusing to auto-merge ${pr_url}; expected ${expected_files}, got:" >&2
              printf '%s\n' "${changed_files}" >&2
              exit 1
            fi

            checks_passed=false
            stable_complete_count=0
            last_check_count=0
            for _ in {1..90}; do
              if ! check_rollup="$(GH_TOKEN="${CHECKS_TOKEN}" gh pr view "${pr_url}" --json statusCheckRollup --jq '.statusCheckRollup')"; then
                echo "Could not read the PR check rollup for ${pr_url}." >&2
                return 1
              fi
              check_count="$(jq 'length' <<<"${check_rollup}")"
              pending_count="$(jq '[.[] | select((has("status") and .status != "COMPLETED") or ((has("status") | not) and ((.state // "") != "SUCCESS" and (.state // "") != "FAILURE" and (.state // "") != "ERROR")))] | length' <<<"${check_rollup}")"
              failed_count="$(jq '[.[] | select(((.conclusion // .state // "") | ascii_downcase) as $s | $s == "failure" or $s == "failed" or $s == "error" or $s == "timed_out" or $s == "cancelled" or $s == "action_required")] | length' <<<"${check_rollup}")"
              echo "PR check rollup for ${pr_url}: total=${check_count} pending=${pending_count} failed=${failed_count}"
              if [ "${failed_count}" -gt 0 ]; then
                echo "::notice::PR checks for ${pr_url} did not all pass; leaving it open for the review-gated merge."
                return 0
              fi
              if [ "${check_count}" -gt 0 ] && [ "${pending_count}" -eq 0 ]; then
                if [ "${check_count}" -eq "${last_check_count}" ]; then
                  stable_complete_count=$((stable_complete_count + 1))
                else
                  stable_complete_count=1
                  last_check_count="${check_count}"
                fi
                if [ "${stable_complete_count}" -ge 3 ]; then
                  checks_passed=true
                  break
                fi
              else
                stable_complete_count=0
                last_check_count="${check_count}"
              fi
              sleep 10
            done
            if [ "${checks_passed}" != "true" ]; then
              echo "::notice::PR checks for ${pr_url} did not complete within the wait window; leaving it open for the review-gated merge."
              return 0
            fi
            if ! release_is_still_latest "${pr_url}"; then
              return 0
            fi
            if [ "${STACK_NAME}" = "go-prod" ] && ! wait_for_sec_dev_release; then
              return 0
            fi
            gh pr merge "${pr_url}" --merge --delete-branch
          }

          auto_merge_trusted_pr "${pr_url}"

      - name: Report superseded release
        if: steps.latest.outputs.superseded == 'true'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          LATEST_STABLE_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          echo "Cerebro ${IMAGE_TAG} is superseded by latest stable ${LATEST_STABLE_TAG}; no promotion changes were applied."
