name: Web Image Release

on:
  pull_request:
    paths:
      - ".github/workflows/web-release.yml"
      - "apps/web/**"
      - "apps/slack-companion/package.json"
      - "package.json"
      - "package-lock.json"
      - "sdk/typescript/package.json"
      - "scripts/tests/test_web_release_workflow.py"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/web-release.yml"
      - "apps/web/**"
      - "apps/slack-companion/package.json"
      - "package.json"
      - "package-lock.json"
      - "sdk/typescript/package.json"
      - "scripts/tests/test_web_release_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-image-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  WEB_APPLICATION_ID: web
  WEB_IMAGE: ghcr.io/writer/cerebro-web
  RELEASE_SCHEMA_VERSION: application-release/v1

jobs:
  validate-release:
    name: Validate web release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
      image_tag: ${{ steps.image.outputs.tag }}
      image_tags: ${{ steps.image.outputs.tags }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript workspaces
        run: npm ci

      - name: Validate web workspace
        run: |
          npm run check --workspace @writer/cerebro-web
          npm run build --workspace @writer/cerebro-web
          npm run smoke:standalone --workspace @writer/cerebro-web -- --skip-build
          npm audit --omit=dev --audit-level=moderate

      - name: Validate portable release contract
        run: python3 -m unittest scripts.tests.test_web_release_workflow

      - name: Check public source hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          make oss-audit

          zero="0000000000000000000000000000000000000000"
          case "${EVENT_NAME}" in
            pull_request)
              range="${BASE_SHA}...${HEAD_SHA}"
              ;;
            push)
              if [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "${zero}" ]; then
                range="${BEFORE_SHA}...${GITHUB_SHA}"
              else
                range="${GITHUB_SHA}^...${GITHUB_SHA}"
              fi
              ;;
            *)
              base="$(git merge-base origin/main "${GITHUB_SHA}")"
              range="${base}...${GITHUB_SHA}"
              ;;
          esac
          ./scripts/leak_check.sh range "${range}"

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="sha-${short_sha}"
          fi
          if ! [[ "${tag}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: ${tag}" >&2
            exit 1
          fi
          {
            echo "image=${WEB_IMAGE}"
            echo "tag=${tag}"
            echo "tags<<EOF"
            echo "${WEB_IMAGE}:${tag}"
            if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${WEB_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build-platform:
    name: Build web image (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            NEXT_PUBLIC_CEREBRO_WEB_VERSION=${{ github.sha }}
          outputs: type=image,name=${{ needs.validate-release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-image-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-image-release-${{ matrix.arch }}

      - name: Export platform digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid platform digest: ${DIGEST}" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-image-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish web image
    if: github.event_name != 'pull_request'
    needs:
      - validate-release
      - build-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ needs.validate-release.outputs.image }}
      image_tag: ${{ needs.validate-release.outputs.image_tag }}
      image_digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: web-image-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create multi-architecture image
        id: manifest
        shell: bash
        env:
          IMAGE: ${{ needs.validate-release.outputs.image }}
          IMAGE_TAG: ${{ needs.validate-release.outputs.image_tag }}
          IMAGE_TAGS: |
            ${{ needs.validate-release.outputs.image_tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && tag_args+=("-t" "${tag}")
          done <<< "${IMAGE_TAGS}"

          digest_args=()
          shopt -s nullglob
          for digest_file in /tmp/digests/*; do
            digest="$(basename "${digest_file}")"
            digest_args+=("${IMAGE}@sha256:${digest}")
          done
          if [ "${#digest_args[@]}" -ne 2 ]; then
            echo "Expected two platform digests, found ${#digest_args[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          manifest_digest="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{ .Manifest.Digest }}')"
          if ! [[ "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve multi-architecture image digest" >&2
            exit 1
          fi
          echo "digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Scan published image
        shell: bash
        env:
          IMAGE: ${{ needs.validate-release.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE}@${DIGEST}"
          scanner="aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e"
          mkdir -p "${HOME}/.cache/trivy"
          docker run --rm \
            -e TRIVY_USERNAME \
            -e TRIVY_PASSWORD \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            "${scanner}" image \
            --exit-code 0 \
            --ignore-unfixed \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "${image_ref}"
          docker run --rm \
            -e TRIVY_USERNAME \
            -e TRIVY_PASSWORD \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            "${scanner}" image \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --severity CRITICAL \
            "${image_ref}"

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Sign published image
        shell: bash
        env:
          IMAGE: ${{ needs.validate-release.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ needs.validate-release.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Write image summary
        shell: bash
        env:
          IMAGE: ${{ needs.validate-release.outputs.image }}
          IMAGE_TAG: ${{ needs.validate-release.outputs.image_tag }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Published web image"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Tag | \`${IMAGE_TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Pull by digest | \`${IMAGE}@${DIGEST}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify-release-consumer:
    name: Notify configured release consumer
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch application release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CONSUMER_TOKEN }}
          RELEASE_CONSUMER_REPOSITORY: ${{ secrets.RELEASE_CONSUMER_REPOSITORY }}
          APPLICATION_ID: ${{ env.WEB_APPLICATION_ID }}
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          SCHEMA_VERSION: ${{ env.RELEASE_SCHEMA_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ] && [ -z "${RELEASE_CONSUMER_REPOSITORY}" ]; then
            echo "No release consumer is configured; artifact publication is complete."
            exit 0
          fi
          if [ -z "${GH_TOKEN}" ] || ! [[ "${RELEASE_CONSUMER_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Release consumer configuration is incomplete." >&2
            exit 1
          fi
          if [ "${APPLICATION_ID}" != "web" ]; then
            echo "Unexpected application id." >&2
            exit 1
          fi
          if [ "${IMAGE}" != "${WEB_IMAGE}" ]; then
            echo "Unexpected public image identity." >&2
            exit 1
          fi
          if ! [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || [ "${IMAGE_TAG}" != "sha-${SOURCE_COMMIT:0:12}" ]; then
            echo "Image tag does not match the source commit." >&2
            exit 1
          fi
          if ! [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Image digest is invalid." >&2
            exit 1
          fi

          jq -n \
            --arg schema_version "${SCHEMA_VERSION}" \
            --arg application_id "${APPLICATION_ID}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '{
              event_type: "application-release-published",
              client_payload: {
                schema_version: $schema_version,
                application_id: $application_id,
                image: $image,
                tag: $tag,
                digest: $digest,
                source_commit: $source_commit
              }
            }' | gh api --method POST "repos/${RELEASE_CONSUMER_REPOSITORY}/dispatches" --input -
