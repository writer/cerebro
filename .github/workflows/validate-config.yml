name: Validate Configuration

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'alembic.ini'
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'alembic.ini'
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-pyproject:
    name: Validate pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate pyproject.toml
        run: |
          python << 'EOF'
          import sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          
          errors = []
          
          with open('pyproject.toml', 'rb') as f:
              try:
                  config = tomllib.load(f)
              except Exception as e:
                  print(f"❌ Invalid TOML syntax: {e}")
                  sys.exit(1)
          
          # Check required fields
          if 'project' not in config:
              errors.append("Missing [project] section")
          else:
              project = config['project']
              if 'name' not in project:
                  errors.append("Missing project.name")
              if 'version' not in project:
                  errors.append("Missing project.version")
          
          # Check tool configurations
          if 'tool' in config:
              tool = config['tool']
              
              # Validate mypy config
              if 'mypy' in tool:
                  mypy = tool['mypy']
                  if 'python_version' not in mypy:
                      errors.append("mypy: Missing python_version")
              
              # Validate ruff config
              if 'ruff' in tool:
                  ruff = tool['ruff']
                  if 'line-length' in ruff and ruff['line-length'] > 120:
                      errors.append(f"ruff: line-length {ruff['line-length']} exceeds recommended 120")
          
          if errors:
              print("❌ Validation errors found:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)
          
          print("✅ pyproject.toml is valid!")
          EOF

  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migration files
        run: |
          echo "Checking migration files..."
          
          ERRORS=0
          
          # Check that migrations directory exists
          if [ ! -d "migrations/versions" ]; then
            echo "❌ migrations/versions directory not found"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ migrations/versions directory exists"
            
            # Check that each migration has revision and down_revision
            for migration in migrations/versions/*.py; do
              if [ -f "$migration" ]; then
                if ! grep -q "^revision = " "$migration"; then
                  echo "❌ $migration: Missing revision"
                  ERRORS=$((ERRORS + 1))
                fi
                if ! grep -q "^down_revision = " "$migration"; then
                  echo "❌ $migration: Missing down_revision"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            done
          fi
          
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "❌ Found $ERRORS errors"
            exit 1
          fi
          
          echo ""
          echo "✅ All migration files valid!"

  validate-infra:
    name: Validate Infrastructure Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Pulumi config
        run: |
          python << 'EOF'
          import yaml
          import sys
          from pathlib import Path
          
          errors = []
          
          infra_dir = Path('infra')
          if not infra_dir.exists():
              print("⚠️  No infra directory found, skipping")
              sys.exit(0)
          
          # Check Pulumi.yaml exists
          pulumi_yaml = infra_dir / 'Pulumi.yaml'
          if not pulumi_yaml.exists():
              errors.append("Missing Pulumi.yaml")
          else:
              with open(pulumi_yaml) as f:
                  try:
                      config = yaml.safe_load(f)
                      if 'name' not in config:
                          errors.append("Pulumi.yaml: Missing 'name' field")
                      if 'runtime' not in config:
                          errors.append("Pulumi.yaml: Missing 'runtime' field")
                  except yaml.YAMLError as e:
                      errors.append(f"Pulumi.yaml: Invalid YAML - {e}")
          
          # Check for stack configs
          stack_configs = list(infra_dir.glob('Pulumi.*.yaml'))
          if not stack_configs:
              errors.append("No stack configuration files found (Pulumi.*.yaml)")
          
          if errors:
              print("❌ Infrastructure validation errors:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)
          
          print(f"✅ Infrastructure config valid! Found {len(stack_configs)} stack configs.")
          EOF

  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Lint commits
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
