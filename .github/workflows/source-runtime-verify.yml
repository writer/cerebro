name: Source Runtime Verify

on:
  workflow_dispatch:
    inputs:
      stack:
        description: AWS stack to verify
        required: true
        default: sec-dev
        type: choice
        options:
          - sec-dev
          - go-prod
      mode:
        description: Verify latest recent run, or start runtimes and verify them
        required: true
        default: recent
        type: choice
        options:
          - recent
          - run
          - dry-run
      runtime_id:
        description: Optional single runtime id. Leave blank to verify all runtimes for the source.
        required: false
        default: ''
        type: string
      family:
        description: Optional runtime family filter. Leave blank for all families.
        required: false
        default: ''
        type: string
      source_id:
        description: Source id to verify.
        required: false
        default: cosmo
        type: string
      observability_targets:
        description: Select enabled sourceRuntimeObservability targets instead of all source runtimes.
        required: false
        default: false
        type: boolean
      allow_missing_targets:
        description: Allow readiness checks to report not-yet-deployed EventBridge targets without failing.
        required: false
        default: false
        type: boolean
      succeed_after_graph_ingest:
        description: For run mode, pass once source sync and graph ingest complete.
        required: false
        default: false
        type: boolean
      target_concurrency:
        description: Maximum source runtime targets to verify concurrently.
        required: false
        default: '1'
        type: string
      max_age_minutes:
        description: Maximum age for recent-mode stopped tasks
        required: false
        default: '180'
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: source-runtime-verify-${{ github.event.inputs.stack }}-${{ github.event.inputs.source_id || 'cosmo' }}-${{ github.event.inputs.runtime_id || 'all' }}
  cancel-in-progress: false

jobs:
  verify-sec-dev:
    name: Verify sec-dev source runtimes
    runs-on: ubuntu-latest
    if: github.event.inputs.stack == 'sec-dev'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Check source role trust drift
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.sec-dev.yaml --same-account-only

      - name: Verify source runtimes
        shell: bash
        working-directory: infra
        env:
          VERIFY_MODE: ${{ github.event.inputs.mode }}
          RUNTIME_ID: ${{ github.event.inputs.runtime_id }}
          FAMILY: ${{ github.event.inputs.family }}
          SOURCE_ID: ${{ github.event.inputs.source_id || 'cosmo' }}
          OBSERVABILITY_TARGETS: ${{ github.event.inputs.observability_targets || 'false' }}
          ALLOW_MISSING_TARGETS: ${{ github.event.inputs.allow_missing_targets || 'false' }}
          SUCCEED_AFTER_GRAPH_INGEST: ${{ github.event.inputs.succeed_after_graph_ingest || 'false' }}
          TARGET_CONCURRENCY: ${{ github.event.inputs.target_concurrency }}
          MAX_AGE_MINUTES: ${{ github.event.inputs.max_age_minutes }}
        run: |
          set -euo pipefail
          args=(--stack-file aws/Pulumi.sec-dev.yaml --source-id "${SOURCE_ID}" --max-age-minutes "${MAX_AGE_MINUTES}" --target-concurrency "${TARGET_CONCURRENCY}")
          if [ "${VERIFY_MODE}" = "run" ]; then args+=(--run); fi
          if [ "${VERIFY_MODE}" = "dry-run" ]; then args+=(--dry-run); fi
          if [ "${OBSERVABILITY_TARGETS}" = "true" ]; then args+=(--observability-targets); fi
          if [ "${ALLOW_MISSING_TARGETS}" = "true" ]; then args+=(--allow-missing-targets); fi
          if [ "${SUCCEED_AFTER_GRAPH_INGEST}" = "true" ]; then args+=(--succeed-after-graph-ingest); fi
          if [ -n "${RUNTIME_ID}" ]; then args+=(--runtime-id "${RUNTIME_ID}"); fi
          if [ -n "${FAMILY}" ]; then args+=(--family "${FAMILY}"); fi
          uv run python scripts/verify_source_runtime_ecs.py "${args[@]}"

  verify-go-prod:
    name: Verify go-prod source runtimes
    runs-on: ubuntu-latest
    if: github.event.inputs.stack == 'go-prod'
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Check source role trust drift
        shell: bash
        working-directory: infra
        env:
          GO_PROD_PANOPTICON_READINESS_ONLY: "true"
          SOURCE_ID: ${{ github.event.inputs.source_id || 'cosmo' }}
          OBSERVABILITY_TARGETS: ${{ github.event.inputs.observability_targets || 'false' }}
        run: |
          set -euo pipefail
          if [ "${GO_PROD_PANOPTICON_READINESS_ONLY}" = "true" ] && [ "${SOURCE_ID}" = "panopticon" ] && [ "${OBSERVABILITY_TARGETS}" = "true" ]; then
            echo "go-prod Panopticon observability validation is dry-run/readiness-only; reporting prod export reader scan-role trust as not_configured/dry_run for this readiness gate."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## go-prod Panopticon readiness"
                echo ""
                echo "State: **not_configured/dry_run**"
                echo ""
                echo "Prod export reader scan-role trust is not required for dry-run/readiness-only validation. Live go-prod validation remains blocked by the full scan-role trust check."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
            uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.go-prod.yaml --same-account-only --exclude-source-id panopticon
          else
            uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.go-prod.yaml --same-account-only
          fi

      - name: Verify source runtimes
        shell: bash
        working-directory: infra
        env:
          GO_PROD_PANOPTICON_READINESS_ONLY: "true"
          VERIFY_MODE: ${{ github.event.inputs.mode }}
          RUNTIME_ID: ${{ github.event.inputs.runtime_id }}
          FAMILY: ${{ github.event.inputs.family }}
          SOURCE_ID: ${{ github.event.inputs.source_id || 'cosmo' }}
          OBSERVABILITY_TARGETS: ${{ github.event.inputs.observability_targets || 'false' }}
          ALLOW_MISSING_TARGETS: ${{ github.event.inputs.allow_missing_targets || 'false' }}
          SUCCEED_AFTER_GRAPH_INGEST: ${{ github.event.inputs.succeed_after_graph_ingest || 'false' }}
          TARGET_CONCURRENCY: ${{ github.event.inputs.target_concurrency }}
          MAX_AGE_MINUTES: ${{ github.event.inputs.max_age_minutes }}
        run: |
          set -euo pipefail
          args=(--stack-file aws/Pulumi.go-prod.yaml --source-id "${SOURCE_ID}" --max-age-minutes "${MAX_AGE_MINUTES}" --target-concurrency "${TARGET_CONCURRENCY}")
          if [ "${GO_PROD_PANOPTICON_READINESS_ONLY}" = "true" ] && [ "${SOURCE_ID}" = "panopticon" ] && [ "${OBSERVABILITY_TARGETS}" = "true" ]; then
            if [ "${VERIFY_MODE}" = "run" ]; then
              echo "go-prod Panopticon observability validation is dry-run/readiness-only until targets are deployed; using dry-run."
            fi
            args+=(--dry-run --allow-missing-targets)
          elif [ "${VERIFY_MODE}" = "run" ]; then
            args+=(--run)
          elif [ "${VERIFY_MODE}" = "dry-run" ]; then
            args+=(--dry-run)
          fi
          if [ "${OBSERVABILITY_TARGETS}" = "true" ]; then args+=(--observability-targets); fi
          if [ "${ALLOW_MISSING_TARGETS}" = "true" ]; then args+=(--allow-missing-targets); fi
          if [ "${SUCCEED_AFTER_GRAPH_INGEST}" = "true" ]; then args+=(--succeed-after-graph-ingest); fi
          if [ -n "${RUNTIME_ID}" ]; then args+=(--runtime-id "${RUNTIME_ID}"); fi
          if [ -n "${FAMILY}" ]; then args+=(--family "${FAMILY}"); fi
          uv run python scripts/verify_source_runtime_ecs.py "${args[@]}"
