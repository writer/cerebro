name: Source Runtime Verify

on:
  workflow_dispatch:
    inputs:
      stack:
        description: AWS stack to verify
        required: true
        default: sec-dev
        type: choice
        options:
          - sec-dev
          - go-prod
      mode:
        description: Verify latest recent run, or start runtimes and verify them
        required: true
        default: recent
        type: choice
        options:
          - recent
          - run
      runtime_id:
        description: Optional single runtime id. Leave blank to verify all Cosmo runtimes.
        required: false
        default: ''
        type: string
      max_age_minutes:
        description: Maximum age for recent-mode stopped tasks
        required: false
        default: '180'
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: source-runtime-verify-${{ github.event.inputs.stack }}-${{ github.event.inputs.runtime_id || 'cosmo' }}
  cancel-in-progress: false

jobs:
  verify-sec-dev:
    name: Verify sec-dev source runtimes
    runs-on: ubuntu-latest
    if: github.event.inputs.stack == 'sec-dev'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-dev)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::944130631940:role/writer-aws-deployment-role

      - name: Check source role trust drift
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.sec-dev.yaml --same-account-only

      - name: Verify Cosmo source runtimes
        shell: bash
        working-directory: infra
        env:
          VERIFY_MODE: ${{ github.event.inputs.mode }}
          RUNTIME_ID: ${{ github.event.inputs.runtime_id }}
          MAX_AGE_MINUTES: ${{ github.event.inputs.max_age_minutes }}
        run: |
          set -euo pipefail
          args=(--stack-file aws/Pulumi.sec-dev.yaml --source-id cosmo --max-age-minutes "${MAX_AGE_MINUTES}")
          if [ "${VERIFY_MODE}" = "run" ]; then args+=(--run); fi
          if [ -n "${RUNTIME_ID}" ]; then args+=(--runtime-id "${RUNTIME_ID}"); fi
          uv run python scripts/verify_source_runtime_ecs.py "${args[@]}"

  verify-go-prod:
    name: Verify go-prod source runtimes
    runs-on: ubuntu-latest
    if: github.event.inputs.stack == 'go-prod'
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "infra/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        working-directory: infra
        run: uv sync

      - name: Configure AWS credentials (sec-prod)
        uses: WriterInternal/aws-git-roles@8c4b3fefd85de2b9e35bba19a7389780d5bd1ec2 # v2
        with:
          assume-role-arn: arn:aws:iam::837279440628:role/writer-aws-deployment-role

      - name: Check source role trust drift
        shell: bash
        working-directory: infra
        run: uv run python scripts/verify_aws_scan_role_trust.py --stack-file aws/Pulumi.go-prod.yaml --same-account-only

      - name: Verify Cosmo source runtimes
        shell: bash
        working-directory: infra
        env:
          VERIFY_MODE: ${{ github.event.inputs.mode }}
          RUNTIME_ID: ${{ github.event.inputs.runtime_id }}
          MAX_AGE_MINUTES: ${{ github.event.inputs.max_age_minutes }}
        run: |
          set -euo pipefail
          args=(--stack-file aws/Pulumi.go-prod.yaml --source-id cosmo --max-age-minutes "${MAX_AGE_MINUTES}")
          if [ "${VERIFY_MODE}" = "run" ]; then args+=(--run); fi
          if [ -n "${RUNTIME_ID}" ]; then args+=(--runtime-id "${RUNTIME_ID}"); fi
          uv run python scripts/verify_source_runtime_ecs.py "${args[@]}"
