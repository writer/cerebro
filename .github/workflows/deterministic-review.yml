name: Deterministic Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: deterministic-review-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-go-cached
        with:
          cache-scope: deterministic-review

      - uses: ./.github/actions/setup-rust-cached
        with:
          cache-scope: deterministic-review
          components: llvm-tools-preview
          target: wasm32-unknown-unknown
          install-policy-tools: "true"

      - name: Verify the exact review range
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          review_base="$(git merge-base --octopus "${BASE_SHA}" "${HEAD_SHA}")"
          test -n "${review_base}"
          git merge-base --is-ancestor "${review_base}" "${HEAD_SHA}"
          {
            echo "REVIEW_BASE=${review_base}"
            echo "REVIEW_HEAD=${HEAD_SHA}"
          } >> "${GITHUB_ENV}"
          echo "review range: ${review_base}...${HEAD_SHA}"

      - name: Restore workflow lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/actionlint
            ~/.cache/pip
            ~/.local/bin/zizmor
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-${{ runner.arch }}-deterministic-review-tools-v1-actionlint-1.7.7-zizmor-1.29.0

      - name: Install workflow linters
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          python3 -m pip install --user 'zizmor==1.29.0'
          {
            echo "$(go env GOPATH)/bin"
            echo "$HOME/.local/bin"
          } >> "$GITHUB_PATH"

      - name: Validate workflow syntax and permissions
        run: |
          set -euo pipefail
          actionlint .github/workflows/deterministic-review.yml
          zizmor .github/workflows/deterministic-review.yml

      - name: Run deterministic repository review
        shell: bash
        env:
          REVIEW_INVARIANTS_JSON_OUT: tmp/review-invariants.json
        run: make deterministic-review

      - name: Run ShellCheck on changed shell scripts
        shell: bash
        run: |
          set -euo pipefail
          shell_files=()
          while IFS= read -r path; do
            if [ -f "$path" ]; then
              shell_files+=("$path")
            fi
          done < <(git diff --name-only --diff-filter=ACMR "${REVIEW_BASE}...${REVIEW_HEAD}" -- '*.sh')
          if [ "${#shell_files[@]}" -gt 0 ]; then
            command -v shellcheck >/dev/null
            shellcheck "${shell_files[@]}"
          else
            echo "no changed shell scripts"
          fi

      - name: Upload deterministic review evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-review-evidence
          if-no-files-found: ignore
          path: |
            tmp/review-invariants.json

  deterministic-review:
    name: deterministic-review
    if: ${{ always() }}
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce deterministic review results
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${REVIEW_RESULT}" = success
