version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/writer/cerebro/sdk/go/cerebroapi/genproto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: sdk/go/cerebroapi/genproto
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es:v2.2.5
    out: sdk/typescript/src/generated/proto
    opt:
      - target=ts
