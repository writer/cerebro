event_contracts:
  - kind: opendatasoft.aggregate
    schema_ref: opendatasoft/aggregate/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: opendatasoft.page
    schema_ref: opendatasoft/page/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
