id: opendatasoft
name: "Opendatasoft"
description: "Collects aggregate, page, dataset, facet, resource, and resource 2 from Opendatasoft and projects them into the Cerebro graph as assets and audit events for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - opendatasoft.aggregate
  - opendatasoft.page
  - opendatasoft.dataset
  - opendatasoft.facet
  - opendatasoft.resource
  - opendatasoft.resource_2
  - opendatasoft.metadata_template
  - opendatasoft.datasets_aggregate
  - opendatasoft.attachment
  - opendatasoft.datasets_facet
  - opendatasoft.record
  - opendatasoft.reuses
runtime_families:
  - aggregate
  - attachment
  - dataset
  - datasets_aggregate
  - datasets_facet
  - facet
  - metadata_template
  - page
  - record
  - resource
  - resource_2
  - reuses
kind_lifecycle:
  - kind: opendatasoft.aggregate
    status: active
  - kind: opendatasoft.page
    status: active
  - kind: opendatasoft.dataset
    status: active
  - kind: opendatasoft.facet
    status: active
  - kind: opendatasoft.resource
    status: active
  - kind: opendatasoft.resource_2
    status: active
  - kind: opendatasoft.metadata_template
    status: active
  - kind: opendatasoft.datasets_aggregate
    status: active
  - kind: opendatasoft.attachment
    status: active
  - kind: opendatasoft.datasets_facet
    status: active
  - kind: opendatasoft.record
    status: active
  - kind: opendatasoft.reuses
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: opendatasoft
  dimensions:
    - id: aggregate
      type: audit_event
      title: "Aggregate"
      families: [aggregate]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: page
      type: entity_family
      title: "Page"
      families: [page]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: dataset
