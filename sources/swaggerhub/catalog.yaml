event_contracts:
  - kind: swaggerhub.users
    schema_ref: swaggerhub/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: swaggerhub.projects
    schema_ref: swaggerhub/projects/v1
    required_attributes:
