id: swaggerhub
name: "Swaggerhub"
description: "Collects users, projects, repositories, deployments, and audit events from Swaggerhub and projects them into the Cerebro graph as users, assets, repositories, deployments, and audit events for repository, build, deployment, and release context."
emitted_kinds:
  - swaggerhub.users
  - swaggerhub.projects
  - swaggerhub.repositories
  - swaggerhub.deployments
  - swaggerhub.audit_events
runtime_families:
  - audit_events
  - deployments
  - projects
  - repositories
  - users
kind_lifecycle:
  - kind: swaggerhub.users
    status: active
  - kind: swaggerhub.projects
    status: active
  - kind: swaggerhub.repositories
    status: active
  - kind: swaggerhub.deployments
    status: active
  - kind: swaggerhub.audit_events
    status: active
