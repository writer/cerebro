id: addigy
name: "Addigy"
description: "Collects devices, organization users, end-user groups, policies, and system events from the Addigy API v2 and projects them into the Cerebro graph as assets, users, groups, policies, and audit events for Apple device management context."
emitted_kinds:
  - addigy.devices
  - addigy.users
  - addigy.groups
  - addigy.policies
  - addigy.audit_events
runtime_families:
  - audit_events
  - devices
  - groups
  - policies
  - users
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: x_api_key_header
  base_url: https://api.addigy.com/api/v2
  spec_url: https://api.addigy.com/api/v2/documentation/godoc_swagger.json
  spec_kind: swagger_json
  references:
    - https://api.addigy.com/api/v2/documentation/
    - https://api.addigy.com/api/v2/documentation/godoc_swagger.json
    - https://support.addigy.com/hc/en-us/articles/16938210315411-API-Documentation-v2
    - https://support.addigy.com/hc/en-us/articles/45221168205331-Migration-Guide-API-v1-to-API-v2
  auth_evidence:
    - https://api.addigy.com/api/v2/documentation/godoc_swagger.json
    - https://support.addigy.com/hc/en-us/articles/16938210315411-API-Documentation-v2
  scope_evidence:
    - https://api.addigy.com/api/v2/documentation/godoc_swagger.json
  families:
    - id: audit_events
      method: POST
      path: /system-events/search
      operation: Search system events
    - id: devices
      method: POST
      path: /devices
      operation: Universal Search Devices
    - id: groups
      method: POST
      path: /o/{organization_id}/end-users/groups/query
      operation: Query end user groups.
    - id: policies
      method: POST
      path: /oa/policies/query
      operation: Get Policy Info
    - id: users
      method: POST
      path: /o/{organization_id}/users/query
      operation: Query organization users.
kind_lifecycle:
  - kind: addigy.devices
    status: active
  - kind: addigy.users
    status: active
  - kind: addigy.groups
    status: active
  - kind: addigy.policies
    status: active
  - kind: addigy.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: addigy
  dimensions:
    - id: devices
      type: entity_family
      title: "Devices"
      families: [device]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, endpoint_security]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "CIS Controls v8"
          control_id: "1"
      notes:
        - Maps Addigy API v2 device search records to graph assets; live tenant sample certification is still pending.
        - Uses the singular device coverage token for detection matching while preserving Addigy's devices runtime family and emitted kind.
    - id: users
      type: entity_family
      title: "Organization Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "CIS Controls v8"
          control_id: "5"
      notes:
        - Maps Addigy API v2 organization users to graph identity users; requires organization_id.
    - id: groups
      type: entity_family
      title: "End-user Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "CIS Controls v8"
          control_id: "5"
      notes:
        - Maps Addigy API v2 end-user groups to graph identity groups; requires organization_id.
    - id: policies
      type: lifecycle_state
      title: "Policies"
      families: [policies]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [endpoint_security, security_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "CIS Controls v8"
          control_id: "4"
      notes:
        - Maps Addigy API v2 policy records to graph policies.
    - id: audit_events
      type: audit_event
      title: "System Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - Maps Addigy API v2 system event search records to graph audit events.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental page sync
      support: partial
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      notes:
        - Page cursors follow API v2 response metadata; event freshness windows are controlled by audit_start_time and audit_end_time.
event_contracts:
  - kind: addigy.devices
    schema_ref: addigy/devices/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_id
      - resource_type
    required_payload_fields:
      - agentid
  - kind: addigy.users
    schema_ref: addigy/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - email
  - kind: addigy.groups
    schema_ref: addigy/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - group_name
    required_payload_fields:
      - id
  - kind: addigy.policies
    schema_ref: addigy/policies/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - policyId
  - kind: addigy.audit_events
    schema_ref: addigy/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
    required_payload_fields:
      - event_id
