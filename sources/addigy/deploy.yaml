sourceId: addigy
secretKeys:
  - ADDIGY_BASE_URL
  - ADDIGY_API_KEY
runtimes:
  - localId: devices
    config:
      base_url: env:ADDIGY_BASE_URL
      family: devices
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_key: env:ADDIGY_API_KEY
