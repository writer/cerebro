sourceId: pingone
secretKeys:
  - PINGONE_CLIENT_ID
  - PINGONE_CLIENT_SECRET
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/environments
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:PINGONE_CLIENT_ID
      client_secret: env:PINGONE_CLIENT_SECRET
