id: opsgenie
name: "Opsgenie"
description: "Collects users, tickets, and audit events from Opsgenie and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - opsgenie.users
  - opsgenie.tickets
  - opsgenie.audit_events
runtime_families:
  - audit_events
  - tickets
  - users
kind_lifecycle:
  - kind: opsgenie.users
    status: active
  - kind: opsgenie.tickets
    status: active
  - kind: opsgenie.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: opsgenie
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: tickets
      type: entity_family
      title: "Tickets"
      families: [tickets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: opsgenie.users
    schema_ref: opsgenie/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: opsgenie.tickets
    schema_ref: opsgenie/tickets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: opsgenie.audit_events
    schema_ref: opsgenie/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
