sourceId: meraki
secretKeys:
  - MERAKI_NETWORKID
  - MERAKI_API_TOKEN
runtimes:
  - localId: eventtype
    config:
      networkid: env:MERAKI_NETWORKID
      family: eventtype
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /networks/${config.networkid}/events/eventTypes
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:MERAKI_API_TOKEN
