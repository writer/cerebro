id: meraki
name: "Cisco Meraki"
description: "Collects eventtype, organization, merakiauthuser, and accesspolicy from Cisco Meraki and projects them into the Cerebro graph as audit events, groups, users, and policies for repository, build, deployment, and release context."
emitted_kinds:
  - meraki.eventtype
  - meraki.organization
  - meraki.merakiauthuser
  - meraki.accesspolicy
kind_lifecycle:
  - kind: meraki.eventtype
    status: active
  - kind: meraki.organization
    status: active
  - kind: meraki.merakiauthuser
    status: active
  - kind: meraki.accesspolicy
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: meraki
  dimensions:
    - id: eventtype
      type: audit_event
      title: "Eventtype"
      families: [eventtype]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: organization
      type: entity_family
      title: "Organization"
      families: [organization]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: merakiauthuser
      type: entity_family
      title: "Merakiauthuser"
      families: [merakiauthuser]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: accesspolicy
      type: lifecycle_state
      title: "Accesspolicy"
      families: [accesspolicy]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: meraki.eventtype
    schema_ref: meraki/eventtype/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: meraki.organization
    schema_ref: meraki/organization/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: meraki.merakiauthuser
    schema_ref: meraki/merakiauthuser/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: meraki.accesspolicy
    schema_ref: meraki/accesspolicy/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
