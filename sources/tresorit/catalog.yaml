id: tresorit
name: "Tresorit"
description: "Collects users, groups, workspaces, documents, and audit events from Tresorit and projects them into the Cerebro graph as users, groups, assets, and audit events for workspace, document, message, and collaboration context."
emitted_kinds:
  - tresorit.users
  - tresorit.groups
  - tresorit.workspaces
  - tresorit.documents
  - tresorit.audit_events
runtime_families:
  - audit_events
  - documents
  - groups
  - users
  - workspaces
kind_lifecycle:
  - kind: tresorit.users
    status: active
  - kind: tresorit.groups
    status: active
  - kind: tresorit.workspaces
    status: active
  - kind: tresorit.documents
    status: active
  - kind: tresorit.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: tresorit
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: workspaces
      type: entity_family
      title: "Workspaces"
      families: [workspaces]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: documents
      type: entity_family
      title: "Documents"
      families: [documents]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: tresorit.users
    schema_ref: tresorit/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: tresorit.groups
    schema_ref: tresorit/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: tresorit.workspaces
    schema_ref: tresorit/workspaces/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: tresorit.documents
    schema_ref: tresorit/documents/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: tresorit.audit_events
    schema_ref: tresorit/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
