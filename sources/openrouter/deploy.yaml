sourceId: openrouter
secretKeys:
  - OPENROUTER_TOKEN
runtimes:
  - localId: organization-members
    config:
      family: organization_members
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/models
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      tenant_id: tenant
      token: env:OPENROUTER_TOKEN
  - localId: api-keys
    config:
      family: api_keys
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/models
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      tenant_id: tenant
      token: env:OPENROUTER_TOKEN
  - localId: provider-keys
    config:
      family: provider_keys
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/models
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      tenant_id: tenant
      token: env:OPENROUTER_TOKEN
  - localId: usage-activity
    config:
      family: usage_reports
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/models
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      tenant_id: tenant
      token: env:OPENROUTER_TOKEN
