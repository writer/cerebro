id: openrouter
name: "OpenRouter"
description: "Collects organization members, API keys, provider keys, and usage reports from OpenRouter and projects them into the Cerebro graph as users, secrets, and assets for model access, API key, usage, and workspace governance context."
emitted_kinds:
  - openrouter.organization_members
  - openrouter.api_keys
  - openrouter.provider_keys
  - openrouter.usage_reports
runtime_families:
  - api_keys
  - organization_members
  - provider_keys
  - usage_reports
kind_lifecycle:
  - kind: openrouter.organization_members
    status: active
  - kind: openrouter.api_keys
    status: active
  - kind: openrouter.provider_keys
    status: active
  - kind: openrouter.usage_reports
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: openrouter
  dimensions:
    - id: organization_members
      type: entity_family
      title: "Organization Members"
      families: [organization_members]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Backed by the documented OpenRouter GET /api/v1/organization/members management endpoint; pagination is not yet implemented in this source.
    - id: api_keys
      type: entity_family
      title: "Api Keys"
      families: [api_keys]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      notes:
        - Backed by the documented OpenRouter GET /api/v1/keys management endpoint; pagination and optional workspace filters are not yet implemented in this source.
    - id: provider_keys
      type: entity_family
      title: "Provider Keys"
      families: [provider_keys]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      notes:
        - Backed by the documented OpenRouter GET /api/v1/byok management endpoint for BYOK provider credentials; optional workspace and provider filters are not yet implemented in this source.
    - id: usage_reports
      type: entity_family
      title: "Usage Reports"
      families: [usage_reports]
      support: partial
      high_value: true
      evidence_types: [logging_configuration, source_snapshot]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - Backed by the documented OpenRouter GET /api/v1/activity management endpoint for the last 30 completed UTC days; this is activity grouped by endpoint, not an unrestricted usage export.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: openrouter.organization_members
    schema_ref: openrouter/organization_members/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - user_id
    required_payload_fields:
      - id
  - kind: openrouter.api_keys
    schema_ref: openrouter/api_keys/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - secret_id
      - secret_name
    required_payload_fields:
      - hash
  - kind: openrouter.provider_keys
    schema_ref: openrouter/provider_keys/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: openrouter.usage_reports
    schema_ref: openrouter/usage_reports/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - endpoint_id
