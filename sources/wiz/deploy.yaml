sourceId: wiz
secretKeys:
  - WIZ_CLIENT_ID
  - WIZ_CLIENT_SECRET
runtimes:
  - localId: assets
    config:
      family: assets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /graphql
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:WIZ_CLIENT_ID
      client_secret: env:WIZ_CLIENT_SECRET
