id: akeneo
name: "Akeneo"
description: "Collects attribute, attribute group, option, reference entities attribute, attributes option, and asset from Akeneo and projects them into the Cerebro graph as assets and groups for inventory, access review, audit, risk, and operational context."
provider_api:
  status: verified
  transport: rest
  auth: bearer_token
  base_url: https://{tenant}.akeneo.com
  references:
    - https://storage.googleapis.com/akecld-prd-pim-saas-shared-openapi-spec/openapi.yaml
    - https://api.akeneo.com/
  families:
    - id: attribute
      method: GET
      path: /api/rest/v1/asset-families/{asset_family_code}/attributes
    - id: attribute_group
      method: GET
      path: /api/rest/v1/attribute-groups/{code}
    - id: option
      method: GET
      path: /api/rest/v1/asset-families/{asset_family_code}/attributes/{attribute_code}/options
    - id: reference_entities_attribute
      method: GET
      path: /api/rest/v1/reference-entities/{reference_entity_code}/attributes
    - id: attributes_option
      method: GET
      path: /api/rest/v1/reference-entities/{reference_entity_code}/attributes/{attribute_code}/options
    - id: asset
      method: GET
      path: /api/rest/v1/assets/{code}
    - id: asset_family
      method: GET
      path: /api/rest/v1/asset-families/{code}
    - id: draft
      method: GET
      path: /api/rest/v1/product-models/{code}/draft
    - id: products_uuid_draft
      method: GET
      path: /api/rest/v1/products-uuid/{uuid}/draft
    - id: products_draft
      method: GET
      path: /api/rest/v1/products/{code}/draft
    - id: asset_families_attribute
      method: GET
      path: /api/rest/v1/asset-families/{asset_family_code}/attributes/{code}
    - id: v1_attribute
      method: GET
      path: /api/rest/v1/attributes/{code}
emitted_kinds:
  - akeneo.attribute
  - akeneo.attribute_group
  - akeneo.option
  - akeneo.reference_entities_attribute
  - akeneo.attributes_option
  - akeneo.asset
  - akeneo.asset_family
  - akeneo.draft
  - akeneo.products_uuid_draft
  - akeneo.products_draft
  - akeneo.asset_families_attribute
  - akeneo.v1_attribute
runtime_families:
  - asset
  - asset_families_attribute
  - asset_family
  - attribute
  - attribute_group
  - attributes_option
  - draft
  - option
  - products_draft
  - products_uuid_draft
  - reference_entities_attribute
  - v1_attribute
kind_lifecycle:
  - kind: akeneo.attribute
    status: active
  - kind: akeneo.attribute_group
    status: active
  - kind: akeneo.option
    status: active
  - kind: akeneo.reference_entities_attribute
    status: active
  - kind: akeneo.attributes_option
    status: active
  - kind: akeneo.asset
    status: active
  - kind: akeneo.asset_family
    status: active
  - kind: akeneo.draft
    status: active
  - kind: akeneo.products_uuid_draft
    status: active
  - kind: akeneo.products_draft
    status: active
  - kind: akeneo.asset_families_attribute
    status: active
  - kind: akeneo.v1_attribute
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: akeneo
  dimensions:
    - id: attribute
      type: entity_family
      title: "Attribute"
      families: [attribute]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
