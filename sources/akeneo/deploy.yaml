sourceId: akeneo
secretKeys:
  - AKENEO_ASSET_FAMILY_CODE
  - AKENEO_ATTRIBUTE_CODE
  - AKENEO_CODE
  - AKENEO_REFERENCE_ENTITY_CODE
  - AKENEO_UUID
  - AKENEO_TOKEN
runtimes:
  - localId: attribute
    config:
      asset_family_code: env:AKENEO_ASSET_FAMILY_CODE
      attribute_code: env:AKENEO_ATTRIBUTE_CODE
      code: env:AKENEO_CODE
      reference_entity_code: env:AKENEO_REFERENCE_ENTITY_CODE
      uuid: env:AKENEO_UUID
      family: attribute
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/rest/v1/asset-families/${config.asset_family_code}/attributes
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:AKENEO_TOKEN
