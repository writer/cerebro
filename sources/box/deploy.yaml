sourceId: box
secretKeys:
  - BOX_TOKEN
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /2.0/users/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:BOX_TOKEN
