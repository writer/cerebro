sourceId: box
secretKeys:
  - BOX_GROUP_ID
  - BOX_TOKEN
runtimes:
  - localId: event
    config:
      group_id: env:BOX_GROUP_ID
      family: event
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /events
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:BOX_TOKEN
