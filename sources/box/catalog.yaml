id: box
name: "Box"
description: "Box enterprise content and access source covering managed users, groups, group memberships, root folder content items, and enterprise admin log events. The runtime reads Box Platform API v2 collections, preserves marker, offset, and stream cursors, and emits identity, membership, content asset, and audit event records for graph projection and review."
emitted_kinds:
  - box.users
  - box.content_assets
  - box.groups
  - box.group_memberships
  - box.audit_events
provider_api:
  status: verified
  transport: rest
  auth: oauth_client_credentials
  base_url: https://api.box.com/2.0
  references:
    - https://github.com/box/box-openapi
    - https://raw.githubusercontent.com/box/box-openapi/main/openapi/openapi.json
    - https://developer.box.com/guides/authentication/client-credentials/
    - https://developer.box.com/reference/get-users/
    - https://developer.box.com/reference/get-groups/
    - https://developer.box.com/reference/get-groups-id-memberships/
    - https://developer.box.com/reference/get-folders-id-items/
    - https://developer.box.com/reference/get-events/
  families:
    - id: users
      method: GET
      path: /users
      response: entries
      pagination: marker
    - id: content_assets
      method: GET
      path: /folders/0/items
      response: entries
      pagination: marker
    - id: groups
      method: GET
      path: /groups
      response: entries
      pagination: offset
    - id: group_memberships
      method: GET
      path: /groups/{group_id}/memberships
      response: entries
      pagination: offset
    - id: audit_events
      method: GET
      path: /events
      response: entries
      pagination: stream_position
runtime_families:
  - users
  - content_assets
  - groups
  - group_memberships
  - audit_events
kind_lifecycle:
  - kind: box.users
    status: active
  - kind: box.content_assets
    status: active
  - kind: box.groups
    status: active
  - kind: box.group_memberships
    status: active
  - kind: box.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: box
  dimensions:
    - id: users
      type: entity_family
      title: "Managed users"
      families: [users]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access, asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Reads `GET /users` with `usemarker=true`, `marker`, `limit`, and `next_marker` to preserve managed user ID, login email, display name, account status, and user resource URNs.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Reads `GET /groups` with offset pagination and preserves group ID, name, type, and group resource URNs for access review.
    - id: group_memberships
      type: entity_family
      title: "Group memberships"
      families: [group_memberships]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Reads `GET /groups/{group_id}/memberships` across configured `group_ids` and projects Box user-to-group membership edges with membership role.
    - id: content_assets
      type: entity_family
      title: "Root folder content"
      families: [content_assets]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, data_governance]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
        - framework_name: SOC 2
          control_id: CC6.7
        - framework_name: "ISO 27001:2022"
          control_id: A.8.12
      notes:
        - Reads `GET /folders/0/items` with marker pagination to seed Box content inventory from the enterprise root folder and preserve file or folder ID, type, name, owner, and resource URN.
    - id: audit_events
      type: audit_event
      title: "Enterprise events"
      families: [audit_events]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
      notes:
        - Reads `GET /events` with `stream_type=admin_logs_streaming` and records event ID, actor, source item, event type, and stream position.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      families: [users, content_assets, groups, group_memberships, audit_events]
      support: supported
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
      notes:
        - Uses Box `next_marker` for users and content, offset metadata for groups and group memberships, and `next_stream_position` for enterprise events.
event_contracts:
  - kind: box.users
    schema_ref: box/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: box.content_assets
    schema_ref: box/content_assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: box.groups
    schema_ref: box/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - group_name
    required_payload_fields:
      - id
  - kind: box.group_memberships
    schema_ref: box/group_memberships/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - member_user_id
    required_payload_fields:
      - id
      - user.id
  - kind: box.audit_events
    schema_ref: box/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - event_id
