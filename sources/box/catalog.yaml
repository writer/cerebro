id: box
name: "Box"
description: "Box enterprise content and access source covering managed users, groups, group memberships, root folder content items, and enterprise admin log events. The runtime reads Box Platform API v2 collections, preserves marker, offset, and stream cursors, and emits identity, membership, content asset, and audit event records for graph projection and review."
emitted_kinds:
  - box.users
  - box.content_assets
  - box.groups
  - box.group_memberships
  - box.audit_events
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-03T00:00:00Z
  transport: rest
  auth: oauth_client_credentials
  auth_mechanics: oauth2_client_credentials_bearer
  base_url: https://api.box.com/2.0
  spec_url: https://raw.githubusercontent.com/box/box-openapi/main/openapi/openapi.json
  spec_kind: openapi
  references:
    - https://github.com/box/box-openapi
    - https://raw.githubusercontent.com/box/box-openapi/main/openapi/openapi.json
    - https://developer.box.com/guides/authentication/client-credentials/
    - https://developer.box.com/reference/get-users/
    - https://developer.box.com/reference/get-groups/
    - https://developer.box.com/reference/get-groups-id-memberships/
    - https://developer.box.com/reference/get-folders-id-items/
    - https://developer.box.com/reference/get-events/
  auth_evidence:
    - https://developer.box.com/guides/authentication/client-credentials/
  families:
    - id: users
      method: GET
      path: /users
      response: entries
      pagination: marker
    - id: content_assets
      method: GET
      path: /folders/0/items
      response: entries
      pagination: marker
    - id: groups
      method: GET
      path: /groups
      response: entries
      pagination: offset
    - id: group_memberships
      method: GET
      path: /groups/{group_id}/memberships
      response: entries
      pagination: offset
    - id: audit_events
      method: GET
      path: /events
      response: entries
      pagination: stream_position
runtime_families:
  - users
  - content_assets
  - groups
  - group_memberships
  - audit_events
kind_lifecycle:
  - kind: box.users
    status: active
  - kind: box.content_assets
    status: active
  - kind: box.groups
    status: active
  - kind: box.group_memberships
    status: active
  - kind: box.audit_events
    status: active
