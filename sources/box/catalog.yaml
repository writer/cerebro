id: box
name: "Box"
description: "Box content management and collaboration platform."
emitted_kinds:
  - box.event
  - box.group
  - box.shield_information_barrier_segment_member
  - box.membership
kind_lifecycle:
  - kind: box.event
    status: active
  - kind: box.group
    status: active
  - kind: box.shield_information_barrier_segment_member
    status: active
  - kind: box.membership
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: box
  dimensions:
    - id: event
      type: entity_family
      title: "Event"
      families: [event]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: group
      type: entity_family
      title: "Group"
      families: [group]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: shield_information_barrier_segment_member
      type: entity_family
      title: "Shield Information Barrier Segment Member"
      families: [shield_information_barrier_segment_member]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: membership
      type: entity_family
      title: "Membership"
      families: [membership]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
event_contracts:
  - kind: box.event
    schema_ref: box/event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - additional_details
  - kind: box.group
    schema_ref: box/group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - by
  - kind: box.shield_information_barrier_segment_member
    schema_ref: box/shield_information_barrier_segment_member/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: box.membership
    schema_ref: box/membership/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - member_id
    required_payload_fields:
      - by
