event_contracts:
  - kind: box.users
    schema_ref: box/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: box.content_assets
    schema_ref: box/content_assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: box.groups
    schema_ref: box/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - group_name
    required_payload_fields:
      - id
  - kind: box.group_memberships
    schema_ref: box/group_memberships/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - member_user_id
    required_payload_fields:
      - id
      - user.id
  - kind: box.audit_events
    schema_ref: box/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - event_id
