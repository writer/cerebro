id: twitter
name: "Twitter"
description: "Collects list membership, member, job, and dm event from Twitter and projects them into the Cerebro graph as group memberships, users, policies, and audit events for workspace, document, message, and collaboration context."
emitted_kinds:
  - twitter.list_membership
  - twitter.member
  - twitter.job
  - twitter.dm_event
kind_lifecycle:
  - kind: twitter.list_membership
    status: active
  - kind: twitter.member
    status: active
  - kind: twitter.job
    status: active
  - kind: twitter.dm_event
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: twitter
  dimensions:
    - id: list_membership
      type: entity_family
      title: "List Membership"
      families: [list_membership]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: member
      type: entity_family
      title: "Member"
      families: [member]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: job
      type: lifecycle_state
      title: "Job"
      families: [job]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: dm_event
      type: audit_event
      title: "Dm Event"
      families: [dm_event]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: twitter.list_membership
    schema_ref: twitter/list_membership/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - member_id
    required_payload_fields:
      - id
  - kind: twitter.member
    schema_ref: twitter/member/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: twitter.job
    schema_ref: twitter/job/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: twitter.dm_event
    schema_ref: twitter/dm_event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
