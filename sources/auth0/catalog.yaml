id: auth0
name: "Auth0"
description: "Collects Auth0 users, roles, applications, connections, organizations, role assignments, organization membership, organization member roles, and tenant logs from the Auth0 Management API."
emitted_kinds:
  - auth0.users
  - auth0.roles
  - auth0.audit_events
  - auth0.clients
  - auth0.connections
  - auth0.organizations
  - auth0.organization_members
  - auth0.role_users
  - auth0.organization_member_roles
families:
  - id: users
    incremental: watermark
  - id: roles
    incremental: watermark
  - id: audit_events
    incremental: watermark
  - id: clients
    incremental: watermark
  - id: connections
    incremental: watermark
  - id: organizations
    incremental: watermark
  - id: organization_members
  - id: role_users
  - id: organization_member_roles
coverage_contract:
  owner_domain: source_runtime
  authority_domain: auth0
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads /api/v2/users with include_totals pagination and projects Auth0 identities.
    - id: roles
      type: entity_family
      title: "Roles"
      families: [roles]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads /api/v2/roles with include_totals pagination and projects role definitions.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Reads /api/v2/logs with checkpoint pagination and projects actor/resource audit links.
    - id: clients
      type: entity_family
      title: "Applications"
      families: [clients]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      notes:
        - Reads /api/v2/clients with include_totals pagination and projects Auth0 applications.
    - id: connections
      type: entity_family
      title: "Connections"
      families: [connections]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      notes:
        - Reads /api/v2/connections with checkpoint pagination and projects identity provider connections and enabled-client relationships.
    - id: organizations
      type: entity_family
      title: "Organizations"
      families: [organizations]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      notes:
        - Reads /api/v2/organizations with checkpoint pagination and projects Auth0 organization scopes.
    - id: organization_members
      type: relationship
      title: "Organization Members"
      families: [organization_members]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      notes:
        - Reads /api/v2/organizations/{id}/members across configured organization_ids and projects user membership links.
    - id: role_users
      type: relationship
      title: "Role Users"
      families: [role_users]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      notes:
        - Reads /api/v2/roles/{id}/users across configured role_ids and projects user role assignment links.
    - id: organization_member_roles
      type: relationship
      title: "Organization Member Roles"
      families: [organization_member_roles]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      notes:
        - Reads /api/v2/organizations/{id}/members/{user_id}/roles across configured organization_ids and user_ids and projects organization-scoped role assignments.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      families: [users, roles, audit_events, clients, connections, organizations]
      support: supported
      high_value: true
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      notes:
        - Watermark filtering is applied from durable source checkpoints; provider page continuation cursors are preserved when present.
event_contracts:
  - kind: auth0.users
    schema_ref: auth0/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - user_id
  - kind: auth0.roles
    schema_ref: auth0/roles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - role_id
    required_payload_fields:
      - id
  - kind: auth0.audit_events
    schema_ref: auth0/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - log_id
  - kind: auth0.clients
    schema_ref: auth0/clients/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - client_id
    required_payload_fields:
      - client_id
  - kind: auth0.connections
    schema_ref: auth0/connections/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - connection_id
    required_payload_fields:
      - id
  - kind: auth0.organizations
    schema_ref: auth0/organizations/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - organization_id
    required_payload_fields:
      - id
  - kind: auth0.organization_members
    schema_ref: auth0/organization_members/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - organization_id
      - user_id
    required_payload_fields:
      - user_id
  - kind: auth0.role_users
    schema_ref: auth0/role_users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - role_id
      - subject_id
    required_payload_fields:
      - user_id
  - kind: auth0.organization_member_roles
    schema_ref: auth0/organization_member_roles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - organization_id
      - user_id
      - role_id
    required_payload_fields:
      - id
