id: brex
name: "Brex"
description: "Collects cards, users, and audit events from Brex and projects them into the Cerebro graph as assets, users, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - brex.cards
  - brex.users
  - brex.audit_events
runtime_families:
  - audit_events
  - cards
  - users
kind_lifecycle:
  - kind: brex.cards
    status: active
  - kind: brex.users
    status: active
  - kind: brex.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: brex
  dimensions:
    - id: cards
      type: entity_family
      title: "Cards"
      families: [cards]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: brex.cards
    schema_ref: brex/cards/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: brex.users
    schema_ref: brex/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: brex.audit_events
    schema_ref: brex/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
