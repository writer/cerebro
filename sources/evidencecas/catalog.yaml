id: evidence_cas
name: EvidenceCAS
description: EvidenceCAS evidence manifest source.
emitted_kinds:
  - evidence_cas.object
coverage_contract:
  owner_domain: compliance
  authority_domain: evidence_cas
  dimensions:
    - id: evidence_objects
      type: entity_family
      title: Evidence manifest objects
      families: [object]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: integrity_metadata
      type: entity_family
      title: Evidence URI and digest metadata
      families: [object]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: source_event_links
      type: relationship
      title: Source event evidence links
      families: [object]
      support: supported
      high_value: true
      evidence_types: [relationship_evidence]
      control_domains: [asset_inventory]
event_contracts:
  - kind: evidence_cas.object
    schema_ref: evidence_cas/object/v1
    required_attributes:
      - tenant_id
      - source_system
      - source_event_id
      - evidence_id
      - evidence_type
      - resource_urn
      - evidence_cas_uri
      - evidence_cas_digest
    required_payload_fields:
      - uri
      - digest
      - manifest_version
