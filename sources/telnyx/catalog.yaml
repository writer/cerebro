id: telnyx
name: "Telnyx"
description: "Collects call event, billing group, credential connection, managed account, call control application, and notification channel from Telnyx and projects them into the Cerebro graph as alerts, assets, audit events, groups, policies, secrets, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - telnyx.call_event
  - telnyx.billing_group
  - telnyx.credential_connection
  - telnyx.managed_account
  - telnyx.call_control_application
  - telnyx.notification_channel
  - telnyx.detail_records_report
  - telnyx.notification_event
  - telnyx.notification_event_condition
  - telnyx.wireless_connectivity_log
  - telnyx.sim_card_group
  - telnyx.sim_card_group_action
runtime_families:
  - billing_group
  - call_control_application
  - call_event
  - credential_connection
  - detail_records_report
  - managed_account
  - notification_channel
  - notification_event
  - notification_event_condition
  - sim_card_group
  - sim_card_group_action
  - wireless_connectivity_log
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: authorization_bearer_header
  base_url: https://api.telnyx.com/v2
  spec_url: https://raw.githubusercontent.com/team-telnyx/openapi/master/openapi/spec3.json
  spec_kind: openapi
  references:
    - https://developers.telnyx.com/api-reference/overview
    - https://developers.telnyx.com/development/api-fundamentals
    - https://github.com/team-telnyx/openapi
    - https://raw.githubusercontent.com/team-telnyx/openapi/master/openapi/spec3.json
  auth_evidence:
    - https://developers.telnyx.com/development/api-fundamentals
    - https://raw.githubusercontent.com/team-telnyx/openapi/master/openapi/spec3.json
  scope_evidence:
    - https://developers.telnyx.com/api-reference/overview
    - https://raw.githubusercontent.com/team-telnyx/openapi/master/openapi/spec3.json
  families:
    - id: call_event
      method: GET
      path: /call_events
      operation: ListCallEvents
    - id: billing_group
      method: GET
      path: /billing_groups
      operation: ListBillingGroups
    - id: credential_connection
      method: GET
      path: /credential_connections
      operation: ListCredentialConnections
    - id: managed_account
      method: GET
      path: /managed_accounts
      operation: ListManagedAccounts
    - id: call_control_application
      method: GET
      path: /call_control_applications
      operation: ListCallControlApplications
    - id: notification_channel
      method: GET
      path: /notification_channels
      operation: ListNotificationChannels
    - id: detail_records_report
      method: GET
      path: /wireless/detail_records_reports
      operation: GetWdrReports
    - id: notification_event
      method: GET
      path: /notification_events
      operation: FindNotificationsEvents
    - id: notification_event_condition
      method: GET
      path: /notification_event_conditions
      operation: FindNotificationsEventsConditions
    - id: sim_card_group
      method: GET
      path: /sim_card_groups
      operation: GetAllSimCardGroups
    - id: sim_card_group_action
      method: GET
      path: /sim_card_group_actions
      operation: GetSimCardGroupActions
    - id: wireless_connectivity_log
      method: GET
      path: /sim_cards/{id}/wireless_connectivity_logs
      operation: GetWirelessConnectivityLogs
kind_lifecycle:
  - kind: telnyx.call_event
    status: active
  - kind: telnyx.billing_group
    status: active
  - kind: telnyx.credential_connection
    status: active
  - kind: telnyx.managed_account
    status: active
  - kind: telnyx.call_control_application
    status: active
  - kind: telnyx.notification_channel
    status: active
  - kind: telnyx.detail_records_report
    status: active
  - kind: telnyx.notification_event
    status: active
  - kind: telnyx.notification_event_condition
    status: active
  - kind: telnyx.wireless_connectivity_log
    status: active
  - kind: telnyx.sim_card_group
    status: active
  - kind: telnyx.sim_card_group_action
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: telnyx
  dimensions:
    - id: call_event
      type: audit_event
      title: "Call Event"
      families: [call_event]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - Backed by Telnyx GET /call_events for recent call-control events; caller-configured event filters are not yet modeled.
    - id: billing_group
      type: entity_family
      title: "Billing Group"
      families: [billing_group]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Backed by Telnyx GET /billing_groups for billing group inventory and organization ownership.
    - id: credential_connection
      type: entity_family
      title: "Credential Connection"
      families: [credential_connection]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      known_unsupported_fields:
        - credential password value
      notes:
        - Backed by Telnyx GET /credential_connections for credential-auth connection metadata; credential secret values are not represented in fixtures or normalized attributes.
    - id: managed_account
      type: entity_family
      title: "Managed Account"
      families: [managed_account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Backed by Telnyx GET /managed_accounts for managed account identity, organization, billing, and manager-account metadata.
    - id: call_control_application
      type: lifecycle_state
      title: "Call Control Application"
      families: [call_control_application]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
      notes:
        - Backed by Telnyx GET /call_control_applications for call-control application status, webhook URL, and inbound or outbound call limits.
    - id: notification_channel
      type: alert_state
      title: "Notification Channel"
      families: [notification_channel]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
      known_unsupported_fields:
        - delivery severity
        - notification delivery result
      notes:
        - Backed by Telnyx GET /notification_channels for configured notification destinations and channel types; delivery outcome is not returned by this endpoint.
    - id: detail_records_report
      type: entity_family
      title: "Detail Records Report"
      families: [detail_records_report]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      known_unsupported_fields:
        - downloaded report rows
      notes:
        - Backed by Telnyx GET /wireless/detail_records_reports for WDR report status and report URL metadata; the source does not download report file contents.
    - id: notification_event
      type: audit_event
      title: "Notification Event"
      families: [notification_event]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - Backed by Telnyx GET /notification_events for available notification event types and categories.
    - id: notification_event_condition
      type: audit_event
      title: "Notification Event Condition"
      families: [notification_event_condition]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - Backed by Telnyx GET /notification_event_conditions for notification condition parameters, supported channels, and associated record types.
    - id: wireless_connectivity_log
      type: audit_event
      title: "Wireless Connectivity Log"
      families: [wireless_connectivity_log]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - Backed by Telnyx GET /sim_cards/{id}/wireless_connectivity_logs for a configured SIM card's session log, network, and APN fields.
    - id: sim_card_group
      type: entity_family
      title: "Sim Card Group"
      families: [sim_card_group]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      known_unsupported_fields:
        - SIM card membership list
      notes:
        - Backed by Telnyx GET /sim_card_groups for wireless group inventory, data limit, gateway, and blocklist metadata.
    - id: sim_card_group_action
      type: entity_family
      title: "Sim Card Group Action"
      families: [sim_card_group_action]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
      notes:
        - Backed by Telnyx GET /sim_card_group_actions for asynchronous SIM card group operation status and requested action type.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: telnyx.call_event
    schema_ref: telnyx/call_event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - name
  - kind: telnyx.billing_group
    schema_ref: telnyx/billing_group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: telnyx.credential_connection
    schema_ref: telnyx/credential_connection/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: telnyx.managed_account
    schema_ref: telnyx/managed_account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: telnyx.call_control_application
    schema_ref: telnyx/call_control_application/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: telnyx.notification_channel
    schema_ref: telnyx/notification_channel/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_type
    required_payload_fields:
      - id
  - kind: telnyx.detail_records_report
    schema_ref: telnyx/detail_records_report/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: telnyx.notification_event
    schema_ref: telnyx/notification_event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: telnyx.notification_event_condition
    schema_ref: telnyx/notification_event_condition/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: telnyx.wireless_connectivity_log
    schema_ref: telnyx/wireless_connectivity_log/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: telnyx.sim_card_group
    schema_ref: telnyx/sim_card_group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: telnyx.sim_card_group_action
    schema_ref: telnyx/sim_card_group_action/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
