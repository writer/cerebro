event_contracts:
  - kind: telnyx.call_event
    schema_ref: telnyx/call_event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - name
  - kind: telnyx.billing_group
    schema_ref: telnyx/billing_group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: telnyx.credential_connection
    schema_ref: telnyx/credential_connection/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: telnyx.managed_account
    schema_ref: telnyx/managed_account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: telnyx.call_control_application
    schema_ref: telnyx/call_control_application/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: telnyx.notification_channel
    schema_ref: telnyx/notification_channel/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_severity
    required_payload_fields:
      - id
  - kind: telnyx.detail_records_report
    schema_ref: telnyx/detail_records_report/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: telnyx.notification_event
    schema_ref: telnyx/notification_event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: telnyx.notification_event_condition
    schema_ref: telnyx/notification_event_condition/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: telnyx.wireless_connectivity_log
    schema_ref: telnyx/wireless_connectivity_log/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: telnyx.sim_card_group
    schema_ref: telnyx/sim_card_group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: telnyx.sim_card_group_action
    schema_ref: telnyx/sim_card_group_action/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
