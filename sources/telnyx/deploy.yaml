sourceId: telnyx
secretKeys:
  - TELNYX_TOKEN
  - TELNYX_SIM_CARD_ID
runtimes:
  - localId: billing-groups
    config:
      family: billing_group
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:TELNYX_TOKEN
