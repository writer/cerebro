sourceId: telnyx
secretKeys:
  - TELNYX_SIM_CARD_ID
  - TELNYX_TOKEN
runtimes:
  - localId: call-event
    config:
      sim_card_id: env:TELNYX_SIM_CARD_ID
      family: call_event
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /call_events
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:TELNYX_TOKEN
