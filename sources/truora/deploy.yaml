sourceId: truora
secretKeys:
  - TRUORA_API_TOKEN
runtimes:
  - localId: hook
    config:
      family: hook
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/hooks
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:TRUORA_API_TOKEN
