id: increase
name: "Increase"
description: "Collects event, account, digital wallet token, ach prenotification, oauth connection, and event subscription from Increase and projects them into the Cerebro graph as alerts, assets, audit events, secrets, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - increase.event
  - increase.account
  - increase.digital_wallet_token
  - increase.ach_prenotification
  - increase.oauth_connection
  - increase.event_subscription
  - increase.account_number
  - increase.account_statement
  - increase.account_transfer
  - increase.external_account
  - increase.ach_transfer
  - increase.card
kind_lifecycle:
  - kind: increase.event
    status: active
  - kind: increase.account
    status: active
  - kind: increase.digital_wallet_token
    status: active
  - kind: increase.ach_prenotification
    status: active
  - kind: increase.oauth_connection
    status: active
  - kind: increase.event_subscription
    status: active
  - kind: increase.account_number
    status: active
  - kind: increase.account_statement
    status: active
  - kind: increase.account_transfer
    status: active
  - kind: increase.external_account
    status: active
  - kind: increase.ach_transfer
    status: active
  - kind: increase.card
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: increase
  dimensions:
    - id: event
      type: audit_event
      title: "Event"
      families: [event]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: account
      type: entity_family
      title: "Account"
      families: [account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: digital_wallet_token
      type: entity_family
      title: "Digital Wallet Token"
      families: [digital_wallet_token]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: ach_prenotification
      type: alert_state
      title: "Ach Prenotification"
      families: [ach_prenotification]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: oauth_connection
      type: entity_family
      title: "Oauth Connection"
      families: [oauth_connection]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: event_subscription
      type: audit_event
      title: "Event Subscription"
      families: [event_subscription]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: account_number
      type: entity_family
      title: "Account Number"
      families: [account_number]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: account_statement
      type: entity_family
      title: "Account Statement"
      families: [account_statement]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: account_transfer
      type: entity_family
      title: "Account Transfer"
      families: [account_transfer]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: external_account
      type: entity_family
      title: "External Account"
      families: [external_account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: ach_transfer
      type: entity_family
      title: "Ach Transfer"
      families: [ach_transfer]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
