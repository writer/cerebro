id: increase
name: "Increase"
description: "Collects Increase events, accounts, account numbers, statements, transfers, external accounts, cards, digital wallet tokens, OAuth connections, and event subscriptions for inventory, audit, risk, and operational context."
emitted_kinds:
  - increase.event
  - increase.account
  - increase.digital_wallet_token
  - increase.ach_prenotification
  - increase.oauth_connection
  - increase.event_subscription
  - increase.account_number
  - increase.account_statement
  - increase.account_transfer
  - increase.external_account
  - increase.ach_transfer
  - increase.card
runtime_families:
  - account
  - account_number
  - account_statement
  - account_transfer
  - ach_prenotification
  - ach_transfer
  - card
  - digital_wallet_token
  - event
  - event_subscription
  - external_account
  - oauth_connection
kind_lifecycle:
  - kind: increase.event
    status: active
  - kind: increase.account
    status: active
  - kind: increase.digital_wallet_token
    status: active
  - kind: increase.ach_prenotification
    status: active
  - kind: increase.oauth_connection
    status: active
  - kind: increase.event_subscription
    status: active
  - kind: increase.account_number
    status: active
  - kind: increase.account_statement
    status: active
  - kind: increase.account_transfer
    status: active
  - kind: increase.external_account
    status: active
  - kind: increase.ach_transfer
    status: active
  - kind: increase.card
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: increase
  dimensions:
    - id: event
      type: audit_event
      title: "Event"
      families: [event]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - Maps the official Increase event list response under the top-level `data` key, using `category` as the event type and `associated_object_id` as the affected resource reference.
    - id: account
      type: entity_family
      title: "Account"
      families: [account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase account list response, including account status, program, funding, currency, and entity references.
    - id: digital_wallet_token
      type: entity_family
      title: "Digital Wallet Token"
      families: [digital_wallet_token]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase digital wallet token list response, including token status, card reference, requestor, device, and cardholder fields.
    - id: ach_prenotification
      type: alert_state
      title: "Ach Prenotification"
      families: [ach_prenotification]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Maps the official Increase ACH prenotification list response, including status, effective date, standard entry class, and notification-of-change state.
    - id: oauth_connection
      type: entity_family
      title: "Oauth Connection"
      families: [oauth_connection]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase OAuth connection list response, including connection status, group, application, and deletion fields.
    - id: event_subscription
      type: entity_family
      title: "Event Subscription"
      families: [event_subscription]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase event subscription list response, including status, URL, selected event categories, and OAuth connection reference.
    - id: account_number
      type: entity_family
      title: "Account Number"
      families: [account_number]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase account number list response, including account reference, status, inbound ACH, and inbound check settings.
    - id: account_statement
      type: entity_family
      title: "Account Statement"
      families: [account_statement]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase account statement list response, including account reference, statement period, file reference, and balances.
    - id: account_transfer
      type: entity_family
      title: "Account Transfer"
      families: [account_transfer]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase account transfer list response, including source and destination accounts, approval, status, transaction, and amount fields.
    - id: external_account
      type: entity_family
      title: "External Account"
      families: [external_account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase external account list response, including holder type, funding, status, and masked bank-account routing fields from documented examples.
    - id: ach_transfer
      type: entity_family
      title: "Ach Transfer"
      families: [ach_transfer]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase ACH transfer list response, including status, network, settlement, return, external account, and transaction references.
    - id: card
      type: entity_family
      title: "Card"
      families: [card]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps the official Increase card list response, including card status, account reference, expiration, last four digits, digital wallet, and authorization controls.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      known_unsupported_fields:
        - durable incremental watermark across Increase cursor-list endpoints
      notes:
        - Increase list endpoints expose cursor pagination; this source currently runs scheduled full-family reads.
event_contracts:
  - kind: increase.event
    schema_ref: increase/event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - resource_id
    required_payload_fields:
      - id
  - kind: increase.account
    schema_ref: increase/account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: increase.digital_wallet_token
    schema_ref: increase/digital_wallet_token/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: increase.ach_prenotification
    schema_ref: increase/ach_prenotification/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_severity
    required_payload_fields:
      - id
  - kind: increase.oauth_connection
    schema_ref: increase/oauth_connection/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: increase.event_subscription
    schema_ref: increase/event_subscription/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: increase.account_number
    schema_ref: increase/account_number/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: increase.account_statement
    schema_ref: increase/account_statement/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: increase.account_transfer
    schema_ref: increase/account_transfer/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: increase.external_account
    schema_ref: increase/external_account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: increase.ach_transfer
    schema_ref: increase/ach_transfer/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: increase.card
    schema_ref: increase/card/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
