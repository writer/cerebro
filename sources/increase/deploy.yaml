sourceId: increase
secretKeys:
  - INCREASE_TOKEN
runtimes:
  - localId: account
    config:
      family: account
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /accounts
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:INCREASE_TOKEN
