sourceId: alation
secretKeys:
  - ALATION_BASE_URL
  - ALATION_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:ALATION_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /integration/v2/user/?limit=1&skip=0
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ALATION_TOKEN
