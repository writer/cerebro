id: alation
name: "Alation"
description: "Collects users, groups, data sources, policies, and terms from Alation and projects them into the Cerebro graph as identities, assets, policies, and data-governance context."
emitted_kinds:
  - alation.users
  - alation.groups
  - alation.data_sources
  - alation.policies
  - alation.terms
runtime_families:
  - data_sources
  - groups
  - policies
  - terms
  - users
kind_lifecycle:
  - kind: alation.users
    status: active
  - kind: alation.groups
    status: active
  - kind: alation.data_sources
    status: active
  - kind: alation.policies
    status: active
  - kind: alation.terms
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: token_header
  base_url: ${config.base_url}
  spec_url: ${config.base_url}/openapi/user/
  spec_kind: openapi
  references:
    - https://developer.alation.com/dev/docs/open-api-index
    - https://developer.alation.com/dev/docs/authentication-into-alation-apis
    - https://developer.alation.com/dev/reference/getusers-1
    - https://developer.alation.com/dev/reference/getgroups
    - https://developer.alation.com/dev/reference/getdatasources-1
    - https://developer.alation.com/dev/reference/listpolicies
    - https://developer.alation.com/dev/reference/getterms
  families:
    - id: users
      method: GET
      path: /integration/v2/user/
      operation: get_users
    - id: groups
      method: GET
      path: /integration/v1/group/
      operation: get_groups
    - id: data_sources
      method: GET
      path: /integration/v1/datasource/
      operation: get_datasources
    - id: policies
      method: GET
      path: /integration/v1/business_policies/
      operation: list_policies
    - id: terms
      method: GET
      path: /integration/v2/term/
      operation: get_terms
coverage_contract:
  owner_domain: source_runtime
  authority_domain: alation
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads user metadata from Alation's documented User API for identity inventory context.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      notes:
        - Reads group metadata from Alation's documented Group API for access governance context.
    - id: data_sources
      type: entity_family
      title: "Data Sources"
      families: [data_sources]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, data_governance]
      notes:
        - Reads native data source inventory from Alation's documented Data Sources API.
    - id: policies
      type: lifecycle_state
      title: "Policies"
      families: [policies]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations, data_governance]
      notes:
        - Reads business policy definitions from Alation's documented Policy API.
    - id: terms
      type: entity_family
      title: "Terms"
      families: [terms]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [data_governance]
      notes:
        - Reads glossary terms from Alation's documented Terms API for governance coverage.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: alation.users
    schema_ref: alation/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: alation.groups
    schema_ref: alation/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - group_name
    required_payload_fields:
      - id
  - kind: alation.data_sources
    schema_ref: alation/data_sources/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: alation.policies
    schema_ref: alation/policies/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: alation.terms
    schema_ref: alation/terms/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
