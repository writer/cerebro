id: influxdata
name: "InfluxDB"
description: "Collects log, user, secret, and dbrp from InfluxDB and projects them into the Cerebro graph as audit events, users, secrets, and policies for alert, incident, service health, and response context."
emitted_kinds:
  - influxdata.log
  - influxdata.user
  - influxdata.secret
  - influxdata.dbrp
runtime_families:
  - dbrp
  - log
  - secret
  - user
kind_lifecycle:
  - kind: influxdata.log
    status: active
  - kind: influxdata.user
    status: active
  - kind: influxdata.secret
    status: active
  - kind: influxdata.dbrp
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: influxdata
  dimensions:
    - id: log
      type: audit_event
      title: "Log"
      families: [log]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user
      type: entity_family
      title: "User"
      families: [user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: secret
      type: entity_family
      title: "Secret"
      families: [secret]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: dbrp
      type: lifecycle_state
      title: "Dbrp"
      families: [dbrp]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: influxdata.log
    schema_ref: influxdata/log/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - message
  - kind: influxdata.user
    schema_ref: influxdata/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: influxdata.secret
    schema_ref: influxdata/secret/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: influxdata.dbrp
    schema_ref: influxdata/dbrp/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
