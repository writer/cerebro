sourceId: whatsapp
secretKeys:
  - WHATSAPP_GROUPID
  - WHATSAPP_USERUSERNAME
  - WHATSAPP_TOKEN
runtimes:
  - localId: group
    config:
      groupid: env:WHATSAPP_GROUPID
      userusername: env:WHATSAPP_USERUSERNAME
      family: group
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /groups
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:WHATSAPP_TOKEN
