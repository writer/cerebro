id: akeyless
name: "Akeyless"
description: "Akeyless connector definition catalog entry for high-value security and operations resources."
emitted_kinds:
  - akeyless.items
  - akeyless.auth_methods
  - akeyless.roles
  - akeyless.audit_events
coverage_contract:
  owner_domain: source_runtime
  authority_domain: akeyless
  dimensions:
    - id: items
      type: entity_family
      title: "Items"
      families: [items]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: auth_methods
      type: entity_family
      title: "Auth Methods"
      families: [auth_methods]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: roles
      type: entity_family
      title: "Roles"
      families: [roles]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
event_contracts:
  - kind: akeyless.items
    schema_ref: akeyless/items/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: akeyless.auth_methods
    schema_ref: akeyless/auth_methods/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: akeyless.roles
    schema_ref: akeyless/roles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: akeyless.audit_events
    schema_ref: akeyless/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
