sourceId: journy_io
secretKeys:
  - JOURNY_IO_TOKEN
runtimes:
  - localId: event
    config:
      family: event
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /events
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:JOURNY_IO_TOKEN
