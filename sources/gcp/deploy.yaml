sourceId: gcp
secretKeys:
  - GCP_ARTIFACT_REPOSITORY
  - GCP_CUSTOMER_ID
  - GCP_GROUP_KEY
  - GCP_KEY_RING
  - GCP_KMS_LOCATION
  - GCP_PROJECT_ID
  - GCP_SERVICE_ACCOUNT_EMAIL
  - GCP_TOKEN
runtimes:
  - localId: asset-metadata
    config:
      family: asset_metadata
      per_page: "100"
      project_id: env:GCP_PROJECT_ID
      token: env:GCP_TOKEN
  - localId: artifact-registry-image
    config:
      artifact_repository: env:GCP_ARTIFACT_REPOSITORY
      family: artifact_registry_image
      per_page: "100"
      project_id: env:GCP_PROJECT_ID
      token: env:GCP_TOKEN
  - localId: artifact-registry-repository
    config:
      family: artifact_registry_repository
      per_page: "100"
      project_id: env:GCP_PROJECT_ID
      token: env:GCP_TOKEN
  - localId: audit
    config:
      family: audit
      per_page: "100"
      project_id: env:GCP_PROJECT_ID
      token: env:GCP_TOKEN
  - localId: cloud-function
    config:
      family: cloud_function
      per_page: "100"
      project_id: env:GCP_PROJECT_ID
      token: env:GCP_TOKEN
  - localId: cloud-run-service
