id: trivy
name: Trivy
description: Offline Trivy JSON report source for container image packages, vulnerabilities, and fixes.
emitted_kinds:
  - trivy.image_scan
  - trivy.image_package
  - trivy.image_vulnerability
  - trivy.fix
coverage_contract:
  owner_domain: vulnerability_management
  authority_domain: trivy
  dimensions:
    - id: fixes
      type: remediation_state
      title: Available package fixes
      families: [fix]
      support: supported
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
    - id: image_packages
      type: entity_family
      title: Image packages
      families: [image_package]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: image_scans
      type: entity_family
      title: Image scan reports
      families: [image_scan]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: image_vulnerabilities
      type: entity_family
      title: Image vulnerabilities
      families: [image_vulnerability]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
event_contracts:
  - kind: trivy.image_scan
    schema_ref: trivy/image_scan/v1
    required_attributes:
      - image_digest
    required_payload_fields:
      - image_digest
  - kind: trivy.image_package
    schema_ref: trivy/image_package/v1
    required_attributes:
      - image_digest
      - package
    required_payload_fields:
      - image_digest
      - package
  - kind: trivy.image_vulnerability
    schema_ref: trivy/image_vulnerability/v1
    required_attributes:
      - image_digest
      - vulnerability_id
      - package
    required_payload_fields:
      - image_digest
      - vulnerability_id
      - package
  - kind: trivy.fix
    schema_ref: trivy/fix/v1
    required_attributes:
      - vulnerability_id
      - package
      - fixed_version
    required_payload_fields:
      - vulnerability_id
      - package
      - fixed_version
