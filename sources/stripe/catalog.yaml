id: stripe
name: "Stripe"
description: "Collects users, business records, and audit events from Stripe and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - stripe.users
  - stripe.assets
  - stripe.audit_events
runtime_families:
  - assets
  - audit_events
  - users
kind_lifecycle:
  - kind: stripe.users
    status: active
  - kind: stripe.assets
    status: active
  - kind: stripe.audit_events
    status: active
provider_api_disproof:
  status: invalidated
  reason: generated_runtime_paths_not_in_provider_spec
  checked_at: 2026-07-04T00:00:00Z
  references:
    - https://api.apis.guru/v2/specs/stripe.com/2022-11-15/openapi.json
    - https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.yaml
  affected_families:
    - users
    - assets
    - audit_events
  missing_paths:
    - /v1/users
    - /v1/records
    - /v1/audit/events
  notes:
    - Provider-origin OpenAPI coverage did not contain the generated runtime paths for these families.
    - Rewrite this source from documented provider resources before promotion.
coverage_contract:
  owner_domain: source_runtime
  authority_domain: stripe
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: stripe.users
    schema_ref: stripe/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: stripe.assets
    schema_ref: stripe/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: stripe.audit_events
    schema_ref: stripe/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
