event_contracts:
  - kind: iqualify.learners_progress
    schema_ref: iqualify/learners_progress/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - email
  - kind: iqualify.group
    schema_ref: iqualify/group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
