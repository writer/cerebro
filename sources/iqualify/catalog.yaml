id: iqualify
name: "iQualify"
description: "Collects learners progress, group, user, pulses, progress, and responses from iQualify and projects them into the Cerebro graph as assets, audit events, groups, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - iqualify.learners_progress
  - iqualify.group
  - iqualify.user
  - iqualify.pulses
  - iqualify.progress
  - iqualify.responses
  - iqualify.social_note
  - iqualify.unit_reaction
  - iqualify.learner
  - iqualify.courses
  - iqualify.current
  - iqualify.future
kind_lifecycle:
  - kind: iqualify.learners_progress
    status: active
  - kind: iqualify.group
    status: active
  - kind: iqualify.user
    status: active
  - kind: iqualify.pulses
    status: active
  - kind: iqualify.progress
    status: active
  - kind: iqualify.responses
    status: active
  - kind: iqualify.social_note
    status: active
  - kind: iqualify.unit_reaction
    status: active
  - kind: iqualify.learner
    status: active
  - kind: iqualify.courses
    status: active
  - kind: iqualify.current
    status: active
  - kind: iqualify.future
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: iqualify
  dimensions:
    - id: learners_progress
      type: audit_event
      title: "Learners Progress"
      families: [learners_progress]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: group
      type: entity_family
      title: "Group"
      families: [group]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
