sourceId: iqualify
secretKeys:
  - IQUALIFY_GROUPID
  - IQUALIFY_OFFERINGID
  - IQUALIFY_USEREMAIL
  - IQUALIFY_API_TOKEN
runtimes:
  - localId: learners-progress
    config:
      groupid: env:IQUALIFY_GROUPID
      offeringid: env:IQUALIFY_OFFERINGID
      useremail: env:IQUALIFY_USEREMAIL
      family: learners_progress
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /offerings/${config.offeringid}/analytics/learners-progress
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:IQUALIFY_API_TOKEN
