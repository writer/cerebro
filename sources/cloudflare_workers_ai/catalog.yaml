id: cloudflare_workers_ai
name: "Cloudflare Workers AI"
description: "Collects Workers AI models, AI Gateway configuration, gateway provider configs, gateway evaluations, gateway logs, and Vectorize indexes from Cloudflare."
emitted_kinds:
  - cloudflare_workers_ai.model_catalog
  - cloudflare_workers_ai.ai_gateways
  - cloudflare_workers_ai.gateway_provider_configs
  - cloudflare_workers_ai.gateway_evaluations
  - cloudflare_workers_ai.gateway_logs
  - cloudflare_workers_ai.vectorize_indexes
runtime_families:
  - ai_gateways
  - gateway_evaluations
  - gateway_logs
  - gateway_provider_configs
  - model_catalog
  - vectorize_indexes
kind_lifecycle:
  - kind: cloudflare_workers_ai.model_catalog
    status: active
  - kind: cloudflare_workers_ai.ai_gateways
    status: active
  - kind: cloudflare_workers_ai.gateway_provider_configs
    status: active
  - kind: cloudflare_workers_ai.gateway_evaluations
    status: active
  - kind: cloudflare_workers_ai.gateway_logs
    status: active
  - kind: cloudflare_workers_ai.vectorize_indexes
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: cloudflare_api_token
  auth_mechanics: bearer_token
  base_url: https://api.cloudflare.com/client/v4
  spec_url: https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.json
  spec_kind: openapi
  references:
    - https://developers.cloudflare.com/api/
    - https://developers.cloudflare.com/workers-ai/
    - https://developers.cloudflare.com/ai-gateway/
    - https://developers.cloudflare.com/vectorize/
    - https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.json
  auth_evidence:
    - https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
  families:
    - id: model_catalog
      method: GET
      path: /accounts/{account_id}/ai/models/search
    - id: ai_gateways
      method: GET
      path: /accounts/{account_id}/ai-gateway/gateways
    - id: gateway_provider_configs
      method: GET
      path: /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/provider_configs
    - id: gateway_evaluations
      method: GET
      path: /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/evaluations
    - id: gateway_logs
      method: GET
      path: /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/logs
    - id: vectorize_indexes
      method: GET
      path: /accounts/{account_id}/vectorize/v2/indexes
coverage_contract:
  owner_domain: source_runtime
  authority_domain: cloudflare_workers_ai
  dimensions:
    - id: model_catalog
      type: entity_family
      title: "Model Catalog"
      families: [model_catalog]
      support: partial
      notes:
        - Provider field mapping review is required before certification.
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: ai_gateways
      type: deployment_state
      title: "Ai Gateways"
      families: [ai_gateways]
      support: partial
      notes:
        - Provider field mapping review is required before certification.
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery]
      control_refs:
        - framework_name: SOC 2
          control_id: CC8.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.32
    - id: gateway_provider_configs
      type: entity_family
      title: "Gateway Provider Configs"
      families: [gateway_provider_configs]
      support: partial
      notes:
        - Provider field mapping review is required before certification.
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access, data_protection]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.5.17
    - id: gateway_evaluations
      type: lifecycle_state
      title: "Gateway Evaluations"
      families: [gateway_evaluations]
      support: partial
      notes:
        - Provider field mapping review is required before certification.
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
    - id: gateway_logs
      type: audit_event
      title: "Gateway Logs"
      families: [gateway_logs]
      support: partial
      notes:
        - Provider field mapping review is required before certification.
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
    - id: vectorize_indexes
      type: entity_family
      title: "Vectorize Indexes"
      families: [vectorize_indexes]
      support: partial
      notes:
        - Provider field mapping review is required before certification.
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: cloudflare_workers_ai.model_catalog
    schema_ref: cloudflare_workers_ai/model_catalog/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: cloudflare_workers_ai.ai_gateways
    schema_ref: cloudflare_workers_ai/ai_gateways/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - id
  - kind: cloudflare_workers_ai.gateway_provider_configs
    schema_ref: cloudflare_workers_ai/gateway_provider_configs/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: cloudflare_workers_ai.gateway_evaluations
    schema_ref: cloudflare_workers_ai/gateway_evaluations/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: cloudflare_workers_ai.gateway_logs
    schema_ref: cloudflare_workers_ai/gateway_logs/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: cloudflare_workers_ai.vectorize_indexes
    schema_ref: cloudflare_workers_ai/vectorize_indexes/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - name
