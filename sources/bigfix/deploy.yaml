sourceId: bigfix
secretKeys:
  - BIGFIX_TOKEN
runtimes:
  - localId: computers
    config:
      family: computers
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/sites
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:BIGFIX_TOKEN
