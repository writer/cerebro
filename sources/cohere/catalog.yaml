id: cohere
name: "Cohere"
description: "Collects model catalog, connectors, datasets, and fine-tuned models from Cohere and projects them into the Cerebro graph as assets and deployments for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - cohere.model_catalog
  - cohere.connectors
  - cohere.datasets
  - cohere.fine_tuned_models
runtime_families:
  - connectors
  - datasets
  - fine_tuned_models
  - model_catalog
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: authorization_bearer_token
  base_url: https://api.cohere.com
  spec_url: https://docs.cohere.com/reference
  spec_kind: openapi_embedded_html
  references:
    - https://docs.cohere.com/reference
    - https://docs.cohere.com/reference/list-models
    - https://docs.cohere.com/reference/list-connectors
    - https://docs.cohere.com/reference/list-datasets
    - https://docs.cohere.com/reference/listfinetunedmodels
  auth_evidence:
    - https://docs.cohere.com/reference/list-models
  families:
    - id: connectors
      method: GET
      path: /v1/connectors
    - id: datasets
      method: GET
      path: /v1/datasets
    - id: fine_tuned_models
      method: GET
      path: /v1/finetuning/finetuned-models
    - id: model_catalog
      method: GET
      path: /v1/models
kind_lifecycle:
  - kind: cohere.model_catalog
    status: active
  - kind: cohere.connectors
    status: active
  - kind: cohere.datasets
    status: active
  - kind: cohere.fine_tuned_models
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: cohere
  dimensions:
    - id: model_catalog
      type: entity_family
      title: "Model Catalog"
      families: [model_catalog]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps the official Cohere model list response under the top-level `models` key.
    - id: connectors
      type: entity_family
      title: "Connectors"
      families: [connectors]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps the official Cohere connector list response under the top-level `connectors` key; Cohere marks this endpoint deprecated.
        - This family remains partial coverage and is expected to surface provider errors if Cohere removes the deprecated endpoint before a replacement list API is available.
    - id: datasets
      type: entity_family
      title: "Datasets"
      families: [datasets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps the official Cohere dataset list response under the top-level `datasets` key.
    - id: fine_tuned_models
      type: deployment_state
      title: "Fine Tuned Models"
      families: [fine_tuned_models]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery]
      control_refs:
        - framework_name: SOC 2
          control_id: CC8.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.32
      notes:
        - Maps the official Cohere fine-tuned model list response under the top-level `finetuned_models` key.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: cohere.model_catalog
    schema_ref: cohere/model_catalog/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - name
  - kind: cohere.connectors
    schema_ref: cohere/connectors/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: cohere.datasets
    schema_ref: cohere/datasets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: cohere.fine_tuned_models
    schema_ref: cohere/fine_tuned_models/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - id
