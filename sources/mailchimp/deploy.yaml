sourceId: mailchimp
secretKeys:
  - MAILCHIMP_API_TOKEN
runtimes:
  - localId: lists
    config:
      family: lists
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /ping
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:MAILCHIMP_API_TOKEN
