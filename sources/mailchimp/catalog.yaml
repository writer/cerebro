id: mailchimp
name: "Mailchimp"
description: "Collects lists, members, and audit events from Mailchimp and projects them into the Cerebro graph as groups, users, and audit events for alert, incident, service health, and response context."
emitted_kinds:
  - mailchimp.lists
  - mailchimp.members
  - mailchimp.audit_events
kind_lifecycle:
  - kind: mailchimp.lists
    status: active
  - kind: mailchimp.members
    status: active
  - kind: mailchimp.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: mailchimp
  dimensions:
    - id: lists
      type: entity_family
      title: "Lists"
      families: [lists]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: members
      type: entity_family
      title: "Members"
      families: [members]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: mailchimp.lists
    schema_ref: mailchimp/lists/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: mailchimp.members
    schema_ref: mailchimp/members/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: mailchimp.audit_events
    schema_ref: mailchimp/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
