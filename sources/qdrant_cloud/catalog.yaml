id: qdrant_cloud
name: "Qdrant Cloud"
description: "Collects accounts, account members, clusters, database API keys, backups, backup restores, backup schedules, and IAM roles from Qdrant Cloud."
emitted_kinds:
  - qdrant_cloud.accounts
  - qdrant_cloud.account_members
  - qdrant_cloud.clusters
  - qdrant_cloud.database_api_keys
  - qdrant_cloud.backups
  - qdrant_cloud.backup_restores
  - qdrant_cloud.backup_schedules
  - qdrant_cloud.roles
runtime_families:
  - account_members
  - accounts
  - backup_restores
  - backup_schedules
  - backups
  - clusters
  - database_api_keys
  - roles
kind_lifecycle:
  - kind: qdrant_cloud.accounts
    status: active
  - kind: qdrant_cloud.account_members
    status: active
  - kind: qdrant_cloud.clusters
    status: active
  - kind: qdrant_cloud.database_api_keys
    status: active
  - kind: qdrant_cloud.backups
    status: active
  - kind: qdrant_cloud.backup_restores
    status: active
  - kind: qdrant_cloud.backup_schedules
    status: active
  - kind: qdrant_cloud.roles
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: qdrant_cloud
  dimensions:
    - id: accounts
      type: entity_family
      title: "Accounts"
      families: [accounts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Maps Qdrant Cloud account list records from GET /api/account/v1/accounts, including account owner, company, and privilege metadata.
    - id: account_members
      type: entity_family
      title: "Account Members"
      families: [account_members]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Maps Qdrant Cloud account member records from GET /api/account/v1/accounts/{account_id}/members, including user status and account ownership.
    - id: clusters
      type: deployment_state
      title: "Clusters"
      families: [clusters]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [asset_inventory, secure_delivery]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC8.1
      notes:
        - Maps Qdrant Cloud cluster records from GET /api/cluster/v1/accounts/{account_id}/clusters, including cloud region, endpoint, version, and phase.
    - id: database_api_keys
      type: entity_family
      title: "Database Api Keys"
      families: [database_api_keys]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      notes:
        - Maps Qdrant Cloud database API key records from GET /api/cluster/auth/v2/accounts/{account_id}/database-api-keys, including cluster scope and access rules.
    - id: backups
      type: entity_family
      title: "Backups"
      families: [backups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, availability_resilience]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.8.13
      notes:
        - Maps Qdrant Cloud backup records from GET /api/cluster/backup/v1/accounts/{account_id}/backups, including backup status, duration, retention, and source cluster.
    - id: backup_restores
      type: deployment_state
      title: "Backup Restores"
      families: [backup_restores]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [availability_resilience, secure_delivery]
      control_refs:
        - framework_name: SOC 2
          control_id: CC8.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.13
      notes:
        - Maps Qdrant Cloud backup restore records from GET /api/cluster/backup/v1/accounts/{account_id}/backup_restores, including restore status, backup ID, and target cluster.
    - id: backup_schedules
      type: lifecycle_state
      title: "Backup Schedules"
      families: [backup_schedules]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [availability_resilience, security_operations]
      control_refs:
        - framework_name: "ISO 27001:2022"
          control_id: A.8.13
      notes:
        - Maps Qdrant Cloud backup schedule records from GET /api/cluster/backup/v1/accounts/{account_id}/backup_schedules, including cron schedule, retention, and schedule status.
    - id: roles
      type: entity_family
      title: "Roles"
      families: [roles]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Maps Qdrant Cloud IAM role records from GET /api/iam/v1/accounts/{account_id}/roles, including role type and permissions.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: qdrant_cloud.accounts
    schema_ref: qdrant_cloud/accounts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: qdrant_cloud.account_members
    schema_ref: qdrant_cloud/account_members/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - accountMember.id
  - kind: qdrant_cloud.clusters
    schema_ref: qdrant_cloud/clusters/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
      - deployment_status
    required_payload_fields:
      - id
  - kind: qdrant_cloud.database_api_keys
    schema_ref: qdrant_cloud/database_api_keys/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: qdrant_cloud.backups
    schema_ref: qdrant_cloud/backups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: qdrant_cloud.backup_restores
    schema_ref: qdrant_cloud/backup_restores/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - id
  - kind: qdrant_cloud.backup_schedules
    schema_ref: qdrant_cloud/backup_schedules/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
      - policy_status
    required_payload_fields:
      - id
  - kind: qdrant_cloud.roles
    schema_ref: qdrant_cloud/roles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
