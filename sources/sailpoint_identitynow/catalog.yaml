id: sailpoint_identitynow
name: SailPoint Identity Security Cloud
description: Collects SailPoint Identity Security Cloud identities, accounts, sources, access profiles, roles, entitlements, certification reviews, access requests, account activity, workgroups, tokens, and segments from the provider v2025 REST API and projects identity governance state into the Cerebro graph.
provider_api:
  status: verified
  transport: rest
  auth: oauth_client_credentials
  base_url: https://{tenant}.api.identitynow.com/v2025
  references:
    - https://developer.sailpoint.com/docs/api/
    - https://developer.sailpoint.com/docs/api/authentication/
    - https://developer.sailpoint.com/docs/api/standard-collection-parameters/
    - https://raw.githubusercontent.com/sailpoint-oss/api-specs/refs/heads/main/dereferenced/deref-sailpoint-api.v2025.yaml
  pagination:
    type: offset
    limit_param: limit
    offset_param: offset
    total_header: X-Total-Count
  families:
    - id: identities
      method: GET
      path: /identities
    - id: accounts
      method: GET
      path: /accounts
    - id: account_entitlements
      method: GET
      path: /accounts/{id}/entitlements
      requires_config: [account_ids]
    - id: sources
      method: GET
      path: /sources
    - id: source_schemas
      method: GET
      path: /sources/{sourceId}/schemas
      requires_config: [source_ids]
    - id: source_health
      method: GET
      path: /sources/{sourceId}/source-health
      requires_config: [source_ids]
    - id: source_provisioning_policies
      method: GET
      path: /sources/{sourceId}/provisioning-policies
      requires_config: [source_ids]
    - id: source_schedules
      method: GET
      path: /sources/{sourceId}/schedules
      requires_config: [source_ids]
    - id: access_profiles
      method: GET
      path: /access-profiles
    - id: access_profile_entitlements
      method: GET
      path: /access-profiles/{id}/entitlements
      requires_config: [access_profile_ids]
    - id: roles
      method: GET
      path: /roles
    - id: role_assigned_identities
      method: GET
      path: /roles/{id}/assigned-identities
      requires_config: [role_ids]
    - id: role_entitlements
      method: GET
      path: /roles/{id}/entitlements
      requires_config: [role_ids]
    - id: role_dimensions
      method: GET
      path: /roles/{roleId}/dimensions
      requires_config: [role_ids]
    - id: entitlements
      method: GET
      path: /entitlements
    - id: identity_entitlements
      method: GET
      path: /entitlements/identities/{id}/entitlements
      requires_config: [identity_ids]
    - id: identity_role_assignments
      method: GET
      path: /identities/{identityId}/role-assignments
      requires_config: [identity_ids]
    - id: identity_profiles
      method: GET
      path: /identity-profiles
    - id: lifecycle_states
      method: GET
      path: /identity-profiles/{identity-profile-id}/lifecycle-states
      requires_config: [identity_profile_ids]
    - id: workgroups
      method: GET
      path: /workgroups
    - id: workgroup_members
      method: GET
      path: /workgroups/{workgroupId}/members
      requires_config: [workgroup_ids]
    - id: campaigns
      method: GET
      path: /campaigns
    - id: certifications
      method: GET
      path: /certifications
    - id: certification_access_review_items
      method: GET
      path: /certifications/{id}/access-review-items
      requires_config: [certification_ids]
    - id: access_request_status
      method: GET
      path: /access-request-status
    - id: account_activities
      method: GET
      path: /account-activities
    - id: personal_access_tokens
      method: GET
      path: /personal-access-tokens
    - id: segments
      method: GET
      path: /segments
