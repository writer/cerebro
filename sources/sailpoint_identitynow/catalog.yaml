coverage_contract:
  owner_domain: identity_governance
  authority_domain: sailpoint_identitynow
  dimensions:
    - id: identity_inventory
      type: entity_family
      title: Identity inventory
      families: [identities, accounts]
      support: supported
      high_value: true
      evidence_types: [source_snapshot, identity_configuration]
      control_domains: [asset_inventory, identity_access]
      control_refs: &identity_controls
        - framework_name: "CIS Controls v8"
          control_id: "5"
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-6
    - id: source_inventory
      type: entity_family
      title: Managed sources and connectors
      families: [sources, source_schemas, source_health, source_provisioning_policies, source_schedules]
      support: supported
      high_value: true
      evidence_types: [configuration_state, source_snapshot]
      control_domains: [asset_inventory, change_management]
      control_refs: *identity_controls
    - id: access_model
      type: relationship
      title: Roles, access profiles, and entitlements
      families: [roles, role_dimensions, role_entitlements, access_profiles, access_profile_entitlements, entitlements]
      support: supported
      high_value: true
      evidence_types: [access_review, identity_configuration]
      control_domains: [identity_access, privileged_access]
      control_refs: *identity_controls
    - id: identity_access_assignments
      type: relationship
      title: Identity and account access assignments
      families: [identity_role_assignments, identity_entitlements, role_assigned_identities, account_entitlements, workgroups, workgroup_members]
      support: supported
      high_value: true
      evidence_types: [access_review, source_snapshot]
      control_domains: [identity_access, privileged_access]
      control_refs: *identity_controls
    - id: certification_reviews
      type: audit_event
      title: Certification campaigns and review items
      families: [campaigns, certifications, certification_access_review_items]
      support: supported
      high_value: true
      evidence_types: [access_review, approval_record]
      control_domains: [identity_access, governance_risk]
      control_refs: *identity_controls
    - id: access_request_operations
      type: audit_event
      title: Access requests and account activities
      families: [access_request_status, account_activities]
      support: supported
      high_value: true
      evidence_types: [audit_event, approval_record]
      control_domains: [identity_access, logging_monitoring]
      control_refs: *identity_controls
    - id: api_credentials
      type: app_entitlement
      title: Personal access tokens
      families: [personal_access_tokens]
      support: supported
      high_value: true
      evidence_types: [credential_inventory]
      control_domains: [secrets_management, privileged_access]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "NIST 800-53 r5"
          control_id: IA-5
        - framework_name: "NIST 800-53 r5"
          control_id: AC-6
    - id: segmentation_policy
      type: lifecycle_state
      title: Segments and lifecycle policy state
      families: [segments, identity_profiles, lifecycle_states]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [identity_access, governance_risk]
      control_refs: *identity_controls
