sourceId: illumidesk
secretKeys:
  - ILLUMIDESK_ENTITY
  - ILLUMIDESK_NAMESPACE
  - ILLUMIDESK_PROJECT
  - ILLUMIDESK_TEAM
  - ILLUMIDESK_USER
  - ILLUMIDESK_API_TOKEN
runtimes:
  - localId: team
    config:
      entity: env:ILLUMIDESK_ENTITY
      namespace: env:ILLUMIDESK_NAMESPACE
      project: env:ILLUMIDESK_PROJECT
      team: env:ILLUMIDESK_TEAM
      user: env:ILLUMIDESK_USER
      family: team
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/teams/
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:ILLUMIDESK_API_TOKEN
