event_contracts:
  - kind: illumidesk.team
    schema_ref: illumidesk/team/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: illumidesk.email
    schema_ref: illumidesk/email/v1
