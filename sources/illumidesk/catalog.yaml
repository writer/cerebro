id: illumidesk
name: "IllumiDesk"
description: "Collects team, email, notification, deployment, application, and group from IllumiDesk and projects them into the Cerebro graph as alerts, assets, deployments, groups, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - illumidesk.team
  - illumidesk.email
  - illumidesk.notification
  - illumidesk.deployment
  - illumidesk.application
  - illumidesk.group
  - illumidesk.entity
  - illumidesk.setting
  - illumidesk.profile
  - illumidesk.server_size
  - illumidesk.card
  - illumidesk.invoice
runtime_families:
  - application
  - card
  - deployment
  - email
  - entity
  - group
  - invoice
  - notification
  - profile
  - server_size
  - setting
  - team
kind_lifecycle:
  - kind: illumidesk.team
    status: active
  - kind: illumidesk.email
    status: active
  - kind: illumidesk.notification
    status: active
  - kind: illumidesk.deployment
    status: active
  - kind: illumidesk.application
    status: active
  - kind: illumidesk.group
    status: active
  - kind: illumidesk.entity
    status: active
  - kind: illumidesk.setting
    status: active
  - kind: illumidesk.profile
    status: active
  - kind: illumidesk.server_size
    status: active
  - kind: illumidesk.card
    status: active
  - kind: illumidesk.invoice
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: illumidesk
