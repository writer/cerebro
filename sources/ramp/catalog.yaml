id: ramp
name: "Ramp"
description: "Collects users, cards, and transactions from Ramp and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - ramp.users
  - ramp.cards
  - ramp.transactions
kind_lifecycle:
  - kind: ramp.users
    status: active
  - kind: ramp.cards
    status: active
  - kind: ramp.transactions
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: ramp
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: cards
      type: entity_family
      title: "Cards"
      families: [cards]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: transactions
      type: audit_event
      title: "Transactions"
      families: [transactions]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: ramp.users
    schema_ref: ramp/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: ramp.cards
    schema_ref: ramp/cards/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: ramp.transactions
    schema_ref: ramp/transactions/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
