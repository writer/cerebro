id: recorded_future
name: "Recorded Future"
description: "Collects assets, findings, and vulnerabilities from Recorded Future and projects them into the Cerebro graph as assets, findings, and vulnerabilities for alert, incident, service health, and response context."
emitted_kinds:
  - recorded_future.assets
  - recorded_future.findings
  - recorded_future.vulnerabilities
kind_lifecycle:
  - kind: recorded_future.assets
    status: active
  - kind: recorded_future.findings
    status: active
  - kind: recorded_future.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: recorded_future
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: recorded_future.assets
    schema_ref: recorded_future/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: recorded_future.findings
    schema_ref: recorded_future/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: recorded_future.vulnerabilities
    schema_ref: recorded_future/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
