id: anomali_threatstream
name: "Anomali Threatstream"
description: "Collects assets, findings, vulnerabilities, policies, and audit events from Anomali Threatstream and projects them into the Cerebro graph as assets, findings, vulnerabilities, policies, and audit events for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - anomali_threatstream.assets
  - anomali_threatstream.findings
  - anomali_threatstream.vulnerabilities
  - anomali_threatstream.policies
  - anomali_threatstream.audit_events
runtime_families:
  - assets
  - audit_events
  - findings
  - policies
  - vulnerabilities
kind_lifecycle:
  - kind: anomali_threatstream.assets
    status: active
  - kind: anomali_threatstream.findings
    status: active
  - kind: anomali_threatstream.vulnerabilities
    status: active
  - kind: anomali_threatstream.policies
    status: active
  - kind: anomali_threatstream.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: anomali_threatstream
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: policies
      type: lifecycle_state
      title: "Policies"
      families: [policies]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: anomali_threatstream.assets
    schema_ref: anomali_threatstream/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: anomali_threatstream.findings
    schema_ref: anomali_threatstream/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: anomali_threatstream.vulnerabilities
    schema_ref: anomali_threatstream/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: anomali_threatstream.policies
    schema_ref: anomali_threatstream/policies/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: anomali_threatstream.audit_events
    schema_ref: anomali_threatstream/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
provider_api_disproof:
  status: invalidated
  reason: no_public_provider_api_spec_for_generated_runtime_families
  checked_at: 2026-07-06T00:00:00Z
  references:
    - https://www.anomali.com/marketplace/sdks
    - https://api.threatstream.com/
    - https://github.com/threatstream/threatstream-api
    - https://github.com/threatstream/threatstream-api/blob/master/threatstream-api.py
    - https://www.elastic.co/docs/reference/integrations/ti_anomali
    - https://xsoar.pan.dev/docs/reference/integrations/anomali-threat-stream-v2
  affected_families:
    - assets
    - audit_events
    - findings
    - policies
    - vulnerabilities
  missing_paths:
    - /v1/assets
    - /v1/audit_events
    - /v1/findings
    - /v1/policies
    - /v1/vulnerabilities
  notes:
    - Provider-owned public pages confirm Anomali publishes ThreatStream APIs and SDKs, and api.threatstream.com is the public API host, but they do not publish an endpoint-level REST reference or machine-readable OpenAPI spec for the generated families.
    - The public ThreatStream SDK repository uses https://api.threatstream.com/api/v2 with the intelligence resource, and third-party integrations corroborate the REST API V2 intelligence endpoint rather than /v1 assets, findings, vulnerabilities, policies, or audit events resources.
    - Rewrite this source from a provider-published endpoint reference or machine-readable API spec before promotion.
