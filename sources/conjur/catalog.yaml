      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: conjur.resource_3
    schema_ref: conjur/resource_3/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
