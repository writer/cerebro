sourceId: drchrono
secretKeys:
  - DRCHRONO_TOKEN
runtimes:
  - localId: patient-risk-assessment
    config:
      family: patient_risk_assessment
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/patient_risk_assessments
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:DRCHRONO_TOKEN
