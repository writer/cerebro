id: drchrono
name: "DrChrono"
description: "Collects patient risk assessment, comm log, care team member, user, implantable device, and patient payment log from DrChrono and projects them into the Cerebro graph as assets, audit events, findings, memberships, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - drchrono.patient_risk_assessment
  - drchrono.comm_log
  - drchrono.care_team_member
  - drchrono.user
  - drchrono.implantable_device
  - drchrono.patient_payment_log
  - drchrono.user_group
  - drchrono.allergy
  - drchrono.amendment
  - drchrono.appointment
  - drchrono.appointment_profile
  - drchrono.appointment_template
kind_lifecycle:
  - kind: drchrono.patient_risk_assessment
    status: active
  - kind: drchrono.comm_log
    status: active
  - kind: drchrono.care_team_member
    status: active
  - kind: drchrono.user
    status: active
  - kind: drchrono.implantable_device
    status: active
  - kind: drchrono.patient_payment_log
    status: active
  - kind: drchrono.user_group
    status: active
  - kind: drchrono.allergy
    status: active
  - kind: drchrono.amendment
    status: active
  - kind: drchrono.appointment
    status: active
  - kind: drchrono.appointment_profile
    status: active
  - kind: drchrono.appointment_template
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: drchrono
  dimensions:
    - id: patient_risk_assessment
      type: entity_family
      title: "Patient Risk Assessment"
      families: [patient_risk_assessment]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: comm_log
