event_contracts:
  - kind: drchrono.patient_risk_assessment
    schema_ref: drchrono/patient_risk_assessment/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: drchrono.comm_log
    schema_ref: drchrono/comm_log/v1
