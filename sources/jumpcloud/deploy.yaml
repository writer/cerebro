sourceId: jumpcloud
secretKeys:
  - JUMPCLOUD_API_KEY
  - JUMPCLOUD_GROUP_IDS
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /systemusers?limit=1&skip=0
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_key: env:JUMPCLOUD_API_KEY
  - localId: groups
    config:
      family: groups
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /systemusers?limit=1&skip=0
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_key: env:JUMPCLOUD_API_KEY
  - localId: systems
    config:
      family: systems
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /systemusers?limit=1&skip=0
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_key: env:JUMPCLOUD_API_KEY
  - localId: applications
    config:
      family: applications
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /systemusers?limit=1&skip=0
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_key: env:JUMPCLOUD_API_KEY
  - localId: system-groups
    config:
      family: system_groups
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /systemusers?limit=1&skip=0
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_key: env:JUMPCLOUD_API_KEY
  - localId: group-members
    config:
      family: group_members
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      group_ids: env:JUMPCLOUD_GROUP_IDS
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_key: env:JUMPCLOUD_API_KEY
  - localId: audit-events
    config:
      family: audit_events
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      audit_service: all
      audit_start_time: "2026-01-01T00:00:00Z"
      expected_cadence_seconds: "3600"
      stale_after_seconds: "7200"
      per_page: "1000"
      api_key: env:JUMPCLOUD_API_KEY
