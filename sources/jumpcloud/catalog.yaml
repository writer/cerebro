id: jumpcloud
name: "JumpCloud"
description: "Collects users, groups, and audit events from JumpCloud and projects them into the Cerebro graph as users, groups, and audit events for identity, access, device, and secret context."
emitted_kinds:
  - jumpcloud.users
  - jumpcloud.groups
  - jumpcloud.audit_events
kind_lifecycle:
  - kind: jumpcloud.users
    status: active
  - kind: jumpcloud.groups
    status: active
  - kind: jumpcloud.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: jumpcloud
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: jumpcloud.users
    schema_ref: jumpcloud/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: jumpcloud.groups
    schema_ref: jumpcloud/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: jumpcloud.audit_events
    schema_ref: jumpcloud/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
