id: jumpcloud
name: "JumpCloud"
description: "Collects JumpCloud directory users, user groups, systems, applications, group membership edges, and Directory Insights events for identity, access, device, and audit graph context."
emitted_kinds:
  - jumpcloud.users
  - jumpcloud.groups
  - jumpcloud.systems
  - jumpcloud.applications
  - jumpcloud.system_groups
  - jumpcloud.group_members
  - jumpcloud.audit_events
runtime_families:
  - users
  - groups
  - systems
  - applications
  - system_groups
  - group_members
  - audit_events
kind_lifecycle:
  - kind: jumpcloud.users
    status: active
  - kind: jumpcloud.groups
    status: active
  - kind: jumpcloud.systems
    status: active
  - kind: jumpcloud.applications
    status: active
  - kind: jumpcloud.system_groups
    status: active
  - kind: jumpcloud.group_members
    status: active
  - kind: jumpcloud.audit_events
    status: active
