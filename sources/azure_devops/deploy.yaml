sourceId: azure_devops
secretKeys:
  - AZURE_DEVOPS_TOKEN
runtimes:
  - localId: repositories
    config:
      family: repositories
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /_apis/projects
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:AZURE_DEVOPS_TOKEN
