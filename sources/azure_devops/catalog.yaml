id: azure_devops
name: "Azure DevOps"
description: "Collects repositories, users, and audit events from Azure DevOps and projects them into the Cerebro graph as repositories, users, and audit events for repository, build, deployment, and release context."
emitted_kinds:
  - azure_devops.repositories
  - azure_devops.users
  - azure_devops.audit_events
runtime_families:
  - audit_events
  - repositories
  - users
kind_lifecycle:
  - kind: azure_devops.repositories
    status: active
  - kind: azure_devops.users
    status: active
  - kind: azure_devops.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: azure_devops
  dimensions:
    - id: repositories
      type: entity_family
      title: "Repositories"
      families: [repositories]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: azure_devops.repositories
    schema_ref: azure_devops/repositories/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: azure_devops.users
    schema_ref: azure_devops/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: azure_devops.audit_events
    schema_ref: azure_devops/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
