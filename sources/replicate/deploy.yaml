sourceId: replicate
secretKeys:
  - REPLICATE_TOKEN
runtimes:
  - localId: models
    config:
      family: models
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/models
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:REPLICATE_TOKEN
