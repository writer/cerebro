id: braintree
name: "Braintree"
description: "Collects transactions, customers, and audit events from Braintree and projects them into the Cerebro graph as audit events and users for owner, account, evidence, and compliance context."
emitted_kinds:
  - braintree.transactions
  - braintree.customers
  - braintree.audit_events
runtime_families:
  - audit_events
  - customers
  - transactions
kind_lifecycle:
  - kind: braintree.transactions
    status: active
  - kind: braintree.customers
    status: active
  - kind: braintree.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: braintree
  dimensions:
    - id: transactions
      type: audit_event
      title: "Transactions"
      families: [transactions]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: customers
      type: entity_family
      title: "Customers"
      families: [customers]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: braintree.transactions
    schema_ref: braintree/transactions/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: braintree.customers
    schema_ref: braintree/customers/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: braintree.audit_events
    schema_ref: braintree/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
