sourceId: braintree
secretKeys:
  - BRAINTREE_API_TOKEN
runtimes:
  - localId: transactions
    config:
      family: transactions
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /transactions
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:BRAINTREE_API_TOKEN
