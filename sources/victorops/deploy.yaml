sourceId: victorops
secretKeys:
  - VICTOROPS_TEAM
  - VICTOROPS_TOKEN
runtimes:
  - localId: log
    config:
      team: env:VICTOROPS_TEAM
      family: log
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api-reporting/v1/team/${config.team}/oncall/log
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:VICTOROPS_TOKEN
