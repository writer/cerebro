id: vulnview
name: VulnView
description: VulnView attack-surface, scan, asset, and standardized-finding source.
emitted_kinds:
  - vulnview.site
  - vulnview.scan
  - vulnview.asset
  - vulnview.finding
event_contracts:
  - kind: vulnview.site
    schema_ref: vulnview/site/v1
    required_attributes:
      - family
  - kind: vulnview.scan
    schema_ref: vulnview/scan/v1
    required_attributes:
      - family
  - kind: vulnview.asset
    schema_ref: vulnview/asset/v1
    required_attributes:
      - family
  - kind: vulnview.finding
    schema_ref: vulnview/finding/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: security
  authority_domain: vulnview
  dimensions:
    - id: sites
      type: entity_family
      title: Attack-surface sites
      families: [site]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: scans
      type: lifecycle_state
      title: Scan lifecycle state
      families: [scan]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
    - id: assets
      type: entity_family
      title: Attack-surface assets
      families: [asset]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: findings
      type: entity_family
      title: VulnView standardized findings (nuclei, caido, port, dns, prowler, cloud_identity, github)
      families: [finding]
      support: supported
      high_value: true
      evidence_types: [source_snapshot, remediation_state]
      control_domains: [asset_inventory, identity_access, remediation]
      notes:
        - VulnView is the detection authority for every finding source it exports; Cerebro imports its standardized, lifecycle-tracked findings through one export route per source rather than collecting or re-deriving them.
        - VulnView is also the detection authority for cloud-identity excess-privilege and shared-principal posture; cloud_identity findings join the graph through the canonical AWS role / GCP service account principal they are about, never a scan-scoped entity Cerebro's own rule engine re-derives.
