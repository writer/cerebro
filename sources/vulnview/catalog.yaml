id: vulnview
name: VulnView
description: VulnView attack-surface, scan, vulnerability, asset, and DNS alert source.
emitted_kinds:
  - vulnview.site
  - vulnview.scan
  - vulnview.vulnerability
  - vulnview.asset
  - vulnview.dns_alert
event_contracts:
  - kind: vulnview.site
    schema_ref: vulnview/site/v1
    required_attributes:
      - family
  - kind: vulnview.scan
    schema_ref: vulnview/scan/v1
    required_attributes:
      - family
  - kind: vulnview.vulnerability
    schema_ref: vulnview/vulnerability/v1
    required_attributes:
      - family
  - kind: vulnview.asset
    schema_ref: vulnview/asset/v1
    required_attributes:
      - family
  - kind: vulnview.dns_alert
    schema_ref: vulnview/dns_alert/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: security
  authority_domain: vulnview
  dimensions:
    - id: sites
      type: entity_family
      title: Attack-surface sites
      families: [site]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: scans
      type: lifecycle_state
      title: Scan lifecycle state
      families: [scan]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
    - id: vulnerabilities
      type: entity_family
      title: Vulnerabilities
      families: [vulnerability]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: assets
      type: entity_family
      title: Attack-surface assets
      families: [asset]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: dns_alerts
      type: entity_family
      title: DNS alerts
      families: [dns_alert]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: remediation_state
      type: remediation_state
      title: Vulnerability remediation lifecycle state
      families: [vulnerability, dns_alert]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - VulnView vulnerability and DNS alert state attributes are surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
