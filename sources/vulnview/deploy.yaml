sourceId: vulnview
secretKeys:
  - VULNVIEW_BASE_URL
  - VULNVIEW_CLIENT_ID
  - VULNVIEW_CLIENT_SECRET
  - VULNVIEW_OKTA_ISSUER
runtimes:
  - localId: site
    config:
      base_url: env:VULNVIEW_BASE_URL
      client_id: env:VULNVIEW_CLIENT_ID
      client_secret: env:VULNVIEW_CLIENT_SECRET
      family: site
      okta_issuer: env:VULNVIEW_OKTA_ISSUER
      per_page: "100"
  - localId: scan
    config:
      base_url: env:VULNVIEW_BASE_URL
      client_id: env:VULNVIEW_CLIENT_ID
      client_secret: env:VULNVIEW_CLIENT_SECRET
      family: scan
      okta_issuer: env:VULNVIEW_OKTA_ISSUER
      per_page: "100"
  - localId: asset
    config:
      base_url: env:VULNVIEW_BASE_URL
      client_id: env:VULNVIEW_CLIENT_ID
      client_secret: env:VULNVIEW_CLIENT_SECRET
      family: asset
      okta_issuer: env:VULNVIEW_OKTA_ISSUER
      per_page: "100"
  - localId: finding-nuclei
    config:
      base_url: env:VULNVIEW_BASE_URL
      client_id: env:VULNVIEW_CLIENT_ID
      client_secret: env:VULNVIEW_CLIENT_SECRET
      family: finding
      source: nuclei
      okta_issuer: env:VULNVIEW_OKTA_ISSUER
