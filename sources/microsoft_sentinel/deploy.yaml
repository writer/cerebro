sourceId: microsoft_sentinel
secretKeys:
  - MICROSOFT_SENTINEL_CLIENT_ID
  - MICROSOFT_SENTINEL_CLIENT_SECRET
runtimes:
  - localId: audit-events
    config:
      family: audit_events
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /subscriptions
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:MICROSOFT_SENTINEL_CLIENT_ID
      client_secret: env:MICROSOFT_SENTINEL_CLIENT_SECRET
