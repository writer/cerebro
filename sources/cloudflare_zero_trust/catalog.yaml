id: cloudflare_zero_trust
name: "Cloudflare Zero Trust"
description: "Collects users, groups, roles, applications, and audit events from Cloudflare Zero Trust and projects them into the Cerebro graph as users, groups, policies, assets, and audit events for identity, access, device, and secret context."
emitted_kinds:
  - cloudflare_zero_trust.users
  - cloudflare_zero_trust.groups
  - cloudflare_zero_trust.roles
  - cloudflare_zero_trust.applications
  - cloudflare_zero_trust.audit_events
runtime_families:
  - applications
  - audit_events
  - groups
  - roles
  - users
kind_lifecycle:
  - kind: cloudflare_zero_trust.users
    status: active
  - kind: cloudflare_zero_trust.groups
    status: active
  - kind: cloudflare_zero_trust.roles
    status: active
  - kind: cloudflare_zero_trust.applications
    status: active
  - kind: cloudflare_zero_trust.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: cloudflare_zero_trust
  dimensions:
    - id: users
      type: app_entitlement
      title: "Users"
      families: [users]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
    - id: groups
      type: app_entitlement
      title: "Groups"
      families: [groups]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
    - id: roles
      type: lifecycle_state
      title: "Roles"
      families: [roles]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [identity_access, security_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.3
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
    - id: applications
      type: entity_family
      title: "Applications"
      families: [applications]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: cloudflare_zero_trust.users
    schema_ref: cloudflare_zero_trust/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: cloudflare_zero_trust.groups
    schema_ref: cloudflare_zero_trust/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: cloudflare_zero_trust.roles
    schema_ref: cloudflare_zero_trust/roles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: cloudflare_zero_trust.applications
    schema_ref: cloudflare_zero_trust/applications/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: cloudflare_zero_trust.audit_events
    schema_ref: cloudflare_zero_trust/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
