sourceId: bitwarden
secretKeys:
  - BITWARDEN_BASE_URL
  - BITWARDEN_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:BITWARDEN_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /public/organization/subscription
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      token: env:BITWARDEN_TOKEN
