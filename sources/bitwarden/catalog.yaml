id: bitwarden
name: "Bitwarden"
description: "Collects members, groups, collections, policies, and event logs from the Bitwarden Public API and projects them into the Cerebro graph as users, groups, policies, assets, and audit events for identity, access, and secret-management context."
emitted_kinds:
  - bitwarden.users
  - bitwarden.groups
  - bitwarden.collections
  - bitwarden.policies
  - bitwarden.audit_events
runtime_families:
  - audit_events
  - collections
  - groups
  - policies
  - users
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: oauth2_client_credentials_access_token_scope_api_organization
  base_url: ${config.base_url}/public
  spec_url: https://bitwarden.com/help/api/
  spec_kind: openapi_embedded_html
  references:
    - https://bitwarden.com/help/public-api/
    - https://bitwarden.com/help/api/
  auth_evidence:
    - https://bitwarden.com/help/public-api/
  scope_evidence:
    - https://bitwarden.com/help/public-api/
    - https://bitwarden.com/help/api/
  families:
    - id: audit_events
      method: GET
      path: /public/events
      operation: Events_List
    - id: collections
      method: GET
      path: /public/collections
      operation: Collections_List
    - id: groups
      method: GET
      path: /public/groups
      operation: Groups_List
    - id: policies
      method: GET
      path: /public/policies
      operation: Policies_List
    - id: users
      method: GET
      path: /public/members
      operation: Members_List
kind_lifecycle:
  - kind: bitwarden.users
    status: active
  - kind: bitwarden.groups
    status: active
  - kind: bitwarden.collections
    status: active
  - kind: bitwarden.policies
    status: active
  - kind: bitwarden.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: bitwarden
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Maps Bitwarden Public API members to identity users; live tenant sample certification is still pending.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Maps Bitwarden Public API groups to identity groups; live tenant sample certification is still pending.
    - id: collections
      type: entity_family
      title: "Collections"
      families: [collections]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Maps Bitwarden Public API collections to graph assets; live tenant sample certification is still pending.
    - id: policies
      type: lifecycle_state
      title: "Policies"
      families: [policies]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Maps Bitwarden Public API policies to graph policies; live tenant sample certification is still pending.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Maps Bitwarden Public API event logs to graph audit events; live tenant sample certification is still pending.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: bitwarden.users
    schema_ref: bitwarden/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: bitwarden.groups
    schema_ref: bitwarden/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: bitwarden.collections
    schema_ref: bitwarden/collections/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_id
      - resource_type
    required_payload_fields:
      - id
  - kind: bitwarden.policies
    schema_ref: bitwarden/policies/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
      - type
  - kind: bitwarden.audit_events
    schema_ref: bitwarden/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
    required_payload_fields:
      - type
      - date
