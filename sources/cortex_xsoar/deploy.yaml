sourceId: cortex_xsoar
secretKeys:
  - CORTEX_XSOAR_API_TOKEN
runtimes:
  - localId: audit-events
    config:
      family: audit_events
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /xsoar/public/v1/health
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:CORTEX_XSOAR_API_TOKEN
