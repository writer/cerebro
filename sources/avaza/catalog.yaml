id: avaza
name: "Avaza"
description: "Collects projectmember, lookup, userprofile, webhook, bill, and billpayment from Avaza and projects them into the Cerebro graph as assets and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - avaza.projectmember
  - avaza.lookup
  - avaza.userprofile
  - avaza.webhook
  - avaza.bill
  - avaza.billpayment
  - avaza.company
  - avaza.contact
  - avaza.creditnote
  - avaza.currency
  - avaza.estimate
  - avaza.expense
runtime_families:
  - bill
  - billpayment
  - company
  - contact
  - creditnote
  - currency
  - estimate
  - expense
  - lookup
  - projectmember
  - userprofile
  - webhook
kind_lifecycle:
  - kind: avaza.projectmember
    status: active
  - kind: avaza.lookup
    status: active
  - kind: avaza.userprofile
    status: active
  - kind: avaza.webhook
    status: active
  - kind: avaza.bill
    status: active
  - kind: avaza.billpayment
    status: active
  - kind: avaza.company
    status: active
  - kind: avaza.contact
    status: active
  - kind: avaza.creditnote
    status: active
  - kind: avaza.currency
    status: active
  - kind: avaza.estimate
    status: active
  - kind: avaza.expense
    status: active
