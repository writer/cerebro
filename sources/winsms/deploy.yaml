sourceId: winsms
secretKeys:
  - WINSMS_API_TOKEN
runtimes:
  - localId: subaccount
    config:
      family: subaccount
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /subaccounts
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:WINSMS_API_TOKEN
