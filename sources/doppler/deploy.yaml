sourceId: doppler
secretKeys:
  - DOPPLER_TOKEN
runtimes:
  - localId: secrets
    config:
      family: secrets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v3/workplace
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:DOPPLER_TOKEN
