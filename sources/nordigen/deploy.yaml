sourceId: nordigen
secretKeys:
  - NORDIGEN_TOKEN
runtimes:
  - localId: account
    config:
      family: account
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v2/payments/account/
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:NORDIGEN_TOKEN
