sourceId: openfintech
secretKeys:
  - OPENFINTECH_TOKEN
runtimes:
  - localId: organization
    config:
      family: organization
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /organizations
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:OPENFINTECH_TOKEN
