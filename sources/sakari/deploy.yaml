sourceId: sakari
secretKeys:
  - SAKARI_ACCOUNTID
  - SAKARI_CLIENT_ID
  - SAKARI_CLIENT_SECRET
runtimes:
  - localId: webhook
    config:
      accountid: env:SAKARI_ACCOUNTID
      family: webhook
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/accounts/${config.accountid}/webhooks
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:SAKARI_CLIENT_ID
      client_secret: env:SAKARI_CLIENT_SECRET
