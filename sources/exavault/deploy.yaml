sourceId: exavault
secretKeys:
  - EXAVAULT_TOKEN
runtimes:
  - localId: email-list
    config:
      family: email_list
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /email-lists
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:EXAVAULT_TOKEN
