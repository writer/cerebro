sourceId: stigg
secretKeys:
  - STIGG_BASE_URL
  - STIGG_TOKEN
runtimes:
  - localId: alerts
    config:
      base_url: env:STIGG_BASE_URL
      family: alerts
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:STIGG_TOKEN
