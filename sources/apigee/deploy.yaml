sourceId: apigee
secretKeys:
  - APIGEE_ORGANIZATION
  - APIGEE_TOKEN
runtimes:
  - localId: organizations
    config:
      family: organizations
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/organizations/${config.organization}
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      organization: env:APIGEE_ORGANIZATION
      per_page: "100"
      token: env:APIGEE_TOKEN
