sourceId: onelogin
secretKeys:
  - ONELOGIN_SUBDOMAIN
  - ONELOGIN_CLIENT_ID
  - ONELOGIN_CLIENT_SECRET
  - ONELOGIN_USER_IDS
  - ONELOGIN_ROLE_IDS
  - ONELOGIN_APP_IDS
  - ONELOGIN_PRIVILEGE_IDS
runtimes:
