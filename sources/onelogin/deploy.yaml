    config:
      family: users
      subdomain: env:ONELOGIN_SUBDOMAIN
      client_id: env:ONELOGIN_CLIENT_ID
      client_secret: env:ONELOGIN_CLIENT_SECRET
      health_path: /api/2/users?limit=1
      per_page: "100"
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      failure_modes: api_error,auth_error,rate_limit,schema_drift
