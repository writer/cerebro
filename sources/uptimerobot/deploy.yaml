sourceId: uptimerobot
secretKeys:
  - UPTIMEROBOT_API_TOKEN
runtimes:
  - localId: monitors
    config:
      family: monitors
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /getAccountDetails
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:UPTIMEROBOT_API_TOKEN
