id: uptimerobot
name: "UptimeRobot"
description: "Collects monitors, alert contacts, and audit events from UptimeRobot and projects them into the Cerebro graph as assets, users, and audit events for alert, incident, service health, and response context."
emitted_kinds:
  - uptimerobot.monitors
  - uptimerobot.alert_contacts
  - uptimerobot.audit_events
runtime_families:
  - alert_contacts
  - audit_events
  - monitors
kind_lifecycle:
  - kind: uptimerobot.monitors
    status: active
  - kind: uptimerobot.alert_contacts
    status: active
  - kind: uptimerobot.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: uptimerobot
  dimensions:
    - id: monitors
      type: entity_family
      title: "Monitors"
      families: [monitors]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: alert_contacts
      type: entity_family
      title: "Alert Contacts"
      families: [alert_contacts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: uptimerobot.monitors
    schema_ref: uptimerobot/monitors/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: uptimerobot.alert_contacts
    schema_ref: uptimerobot/alert_contacts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: uptimerobot.audit_events
    schema_ref: uptimerobot/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
