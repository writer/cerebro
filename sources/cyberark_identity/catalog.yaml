id: cyberark_identity
name: "CyberArk Identity"
description: "Collects users, groups, and audit events from CyberArk Identity and projects them into the Cerebro graph as users, groups, and audit events for identity, access, device, and secret context."
emitted_kinds:
  - cyberark_identity.users
  - cyberark_identity.groups
  - cyberark_identity.audit_events
kind_lifecycle:
  - kind: cyberark_identity.users
    status: active
  - kind: cyberark_identity.groups
    status: active
  - kind: cyberark_identity.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: cyberark_identity
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: cyberark_identity.users
    schema_ref: cyberark_identity/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: cyberark_identity.groups
    schema_ref: cyberark_identity/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: cyberark_identity.audit_events
    schema_ref: cyberark_identity/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
