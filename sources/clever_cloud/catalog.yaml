id: clever_cloud
name: "Clever Cloud"
description: "Collects email, token, networkgroup, and deployment from Clever Cloud and projects them into the Cerebro graph as users, secrets, groups, and deployments for repository, build, deployment, and release context."
emitted_kinds:
  - clever_cloud.email
  - clever_cloud.token
  - clever_cloud.networkgroup
  - clever_cloud.deployment
runtime_families:
  - deployment
  - email
  - networkgroup
  - token
kind_lifecycle:
  - kind: clever_cloud.email
    status: active
  - kind: clever_cloud.token
    status: active
  - kind: clever_cloud.networkgroup
    status: active
  - kind: clever_cloud.deployment
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: clever_cloud
  dimensions:
    - id: email
      type: entity_family
      title: "Email"
      families: [email]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: token
      type: entity_family
      title: "Token"
      families: [token]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: networkgroup
      type: entity_family
      title: "Networkgroup"
      families: [networkgroup]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: deployment
      type: deployment_state
      title: "Deployment"
      families: [deployment]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: clever_cloud.email
    schema_ref: clever_cloud/email/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: clever_cloud.token
    schema_ref: clever_cloud/token/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - consumer
  - kind: clever_cloud.networkgroup
    schema_ref: clever_cloud/networkgroup/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: clever_cloud.deployment
    schema_ref: clever_cloud/deployment/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - id
