id: calcom
name: "Cal.com"
description: "Collects bookings, users, and audit events from Cal.com and projects them into the Cerebro graph as audit events and users for owner, account, evidence, and compliance context."
emitted_kinds:
  - calcom.bookings
  - calcom.users
  - calcom.audit_events
runtime_families:
  - audit_events
  - bookings
  - users
kind_lifecycle:
  - kind: calcom.bookings
    status: active
  - kind: calcom.users
    status: active
  - kind: calcom.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: calcom
  dimensions:
    - id: bookings
      type: audit_event
      title: "Bookings"
      families: [bookings]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: calcom.bookings
    schema_ref: calcom/bookings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: calcom.users
    schema_ref: calcom/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: calcom.audit_events
    schema_ref: calcom/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
