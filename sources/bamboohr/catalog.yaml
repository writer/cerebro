id: bamboohr
name: "BambooHR"
description: "Collects workers, organizations, and audit events from BambooHR and projects them into the Cerebro graph as users, groups, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - bamboohr.users
  - bamboohr.groups
  - bamboohr.audit_events
kind_lifecycle:
  - kind: bamboohr.users
    status: active
  - kind: bamboohr.groups
    status: active
  - kind: bamboohr.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: bamboohr
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: bamboohr.users
    schema_ref: bamboohr/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: bamboohr.groups
    schema_ref: bamboohr/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: bamboohr.audit_events
    schema_ref: bamboohr/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
