id: cenit
name: "Cenit"
description: "Collects observer, connection role, webhook, connection, data type, and flow from Cenit and projects them into the Cerebro graph as assets, audit events, and groups for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - cenit.observer
  - cenit.connection_role
  - cenit.webhook
  - cenit.connection
  - cenit.data_type
  - cenit.flow
  - cenit.namespace
  - cenit.scheduler
  - cenit.schema
  - cenit.translator
  - cenit.setup_connection_role
  - cenit.setup_webhook
runtime_families:
  - connection
  - connection_role
  - data_type
  - flow
  - namespace
  - observer
  - scheduler
  - schema
  - setup_connection_role
  - setup_webhook
  - translator
  - webhook
kind_lifecycle:
  - kind: cenit.observer
    status: active
  - kind: cenit.connection_role
    status: active
  - kind: cenit.webhook
    status: active
  - kind: cenit.connection
    status: active
  - kind: cenit.data_type
    status: active
  - kind: cenit.flow
    status: active
  - kind: cenit.namespace
    status: active
  - kind: cenit.scheduler
    status: active
  - kind: cenit.schema
    status: active
  - kind: cenit.translator
    status: active
  - kind: cenit.setup_connection_role
    status: active
  - kind: cenit.setup_webhook
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: cenit
  dimensions:
    - id: observer
      type: audit_event
      title: "Observer"
      families: [observer]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
