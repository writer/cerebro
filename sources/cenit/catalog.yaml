event_contracts:
  - kind: cenit.observer
    schema_ref: cenit/observer/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: cenit.connection_role
    schema_ref: cenit/connection_role/v1
