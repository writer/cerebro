sourceId: cenit
secretKeys:
  - CENIT_ID
  - CENIT_API_TOKEN
runtimes:
  - localId: observer
    config:
      id: env:CENIT_ID
      family: observer
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /setup/observer/
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:CENIT_API_TOKEN
