sourceId: square
secretKeys:
  - SQUARE_TOKEN
runtimes:
  - localId: activity
    config:
      family: activity
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v2/gift-cards/activities
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:SQUARE_TOKEN
