sourceId: heroku
secretKeys:
  - HEROKU_TOKEN
runtimes:
  - localId: apps
    config:
      family: apps
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /apps
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:HEROKU_TOKEN
