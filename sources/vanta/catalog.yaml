id: vanta
name: "Vanta"
description: "Collects users, controls, and findings from Vanta and projects them into the Cerebro graph as users, assets, and findings for owner, account, evidence, and compliance context."
emitted_kinds:
  - vanta.users
  - vanta.controls
  - vanta.findings
runtime_families:
  - controls
  - findings
  - users
kind_lifecycle:
  - kind: vanta.users
    status: active
  - kind: vanta.controls
    status: active
  - kind: vanta.findings
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: vanta
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: controls
      type: entity_family
      title: "Controls"
      families: [controls]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: vanta.users
    schema_ref: vanta/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: vanta.controls
    schema_ref: vanta/controls/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: vanta.findings
    schema_ref: vanta/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
