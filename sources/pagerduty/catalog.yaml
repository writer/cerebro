id: pagerduty
name: PagerDuty
description: PagerDuty incident-response topology source covering users, teams, services, schedules, escalation policies, service integrations, and vendors. Emits responder identity, escalation coverage, and service-to-integration context for graph projection and review.
emitted_kinds:
  - pagerduty.user
  - pagerduty.team
  - pagerduty.service
  - pagerduty.schedule
  - pagerduty.escalation_policy
  - pagerduty.integration
  - pagerduty.vendor
provider_api:
  status: verified
  transport: rest
  auth: pagerduty_api_token
  base_url: https://api.pagerduty.com
  references:
    - https://github.com/PagerDuty/api-schema/blob/main/reference/REST/openapiv3.json
    - https://developer.pagerduty.com/api-reference
    - https://developer.pagerduty.com/docs/ZG9jOjExMDI5NTgx-authentication
  families:
    - id: user
      method: GET
      path: /users
    - id: team
      method: GET
      path: /teams
    - id: service
      method: GET
      path: /services
    - id: integration
      method: GET
      path: /services/{service_id}/integrations
    - id: schedule
      method: GET
      path: /schedules
    - id: escalation_policy
      method: GET
      path: /escalation_policies
    - id: vendor
      method: GET
      path: /vendors
runtime_families:
  - user
  - team
  - service
  - integration
  - schedule
  - escalation_policy
  - vendor
families:
  - id: user
    incremental: cursor
  - id: team
    incremental: cursor
  - id: service
    incremental: cursor
  - id: schedule
    incremental: cursor
  - id: escalation_policy
    incremental: cursor
  - id: integration
    incremental: cursor
  - id: vendor
    incremental: cursor
coverage_contract:
  owner_domain: incident_management
  authority_domain: pagerduty
  dimensions:
    - id: escalation_policies
      type: lifecycle_state
      title: Escalation policies
      families: [escalation_policy]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Escalation policies emit policy IDs, names, loop counts, team references, and schedule/user targets so the graph can resolve responder coverage for services.
    - id: integrations
      type: entity_family
      title: Service integrations
      families: [integration]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Integrations fan out across service_ids, fall back to service_id for single-service deployments, and retain each service ID plus vendor reference for service-to-tool dependency projection.
    - id: schedules
      type: entity_family
      title: Schedules
      families: [schedule]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Schedules emit schedule IDs, names, summaries, and time zones for escalation target nodes.
    - id: services
      type: entity_family
      title: Services
      families: [service]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Services emit status and escalation policy references so graph projection can flag services with or without active escalation coverage.
    - id: teams
      type: entity_family
      title: Teams
      families: [team]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Teams provide organizational context for escalation policy ownership.
    - id: users
      type: entity_family
      title: Users
      families: [user]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Users emit email, role, time zone, and job title for identity resolution and responder review.
    - id: vendors
      type: entity_family
      title: Vendors
      families: [vendor]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Vendors provide third-party integration context for services.
    - id: pagination
      type: incremental_sync
      title: Offset cursor pagination
      families: [user, team, service, schedule, escalation_policy, integration, vendor]
      support: supported
      high_value: true
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      notes:
        - PagerDuty limit/offset responses are preserved through Source CDK cursors and use the provider more flag when total counts are omitted.
event_contracts:
  - kind: pagerduty.user
    schema_ref: pagerduty/user/v1
    required_attributes:
      - external_id
      - family
      - source_provider
      - source_product
      - user_id
    required_payload_fields:
      - id
  - kind: pagerduty.team
    schema_ref: pagerduty/team/v1
    required_attributes:
      - external_id
      - family
      - source_provider
      - source_product
      - team_id
    required_payload_fields:
      - id
  - kind: pagerduty.service
    schema_ref: pagerduty/service/v1
    required_attributes:
      - external_id
      - family
      - source_provider
      - source_product
      - service_id
    required_payload_fields:
      - id
  - kind: pagerduty.schedule
    schema_ref: pagerduty/schedule/v1
    required_attributes:
      - external_id
      - family
      - source_provider
      - source_product
      - schedule_id
    required_payload_fields:
      - id
  - kind: pagerduty.escalation_policy
    schema_ref: pagerduty/escalation_policy/v1
    required_attributes:
      - external_id
      - family
      - source_provider
      - source_product
      - escalation_policy_id
    required_payload_fields:
      - id
  - kind: pagerduty.integration
    schema_ref: pagerduty/integration/v1
    required_attributes:
      - external_id
      - family
      - integration_id
      - service_id
      - source_provider
      - source_product
    required_payload_fields:
      - id
  - kind: pagerduty.vendor
    schema_ref: pagerduty/vendor/v1
    required_attributes:
      - external_id
      - family
      - source_provider
      - source_product
      - vendor_id
    required_payload_fields:
      - id
