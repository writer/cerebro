id: google_drive
name: "Google Drive"
description: "Reads Google Drive file metadata and shared-drive metadata. Emits Drive change records when a provider page token is supplied, so document inventory and Drive activity can be projected into the graph."
emitted_kinds:
  - google_drive.files
  - google_drive.shared_drives
  - google_drive.changes
runtime_families:
  - files
  - shared_drives
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-03T00:00:00Z
  transport: rest
  auth: oauth_authorization_code
  auth_mechanics: oauth2_authorization_code_bearer
  base_url: https://www.googleapis.com/drive/v3
  spec_url: https://raw.githubusercontent.com/googleapis/google-api-go-client/main/drive/v3/drive-api.json
  spec_kind: google_discovery
  references:
    - https://raw.githubusercontent.com/googleapis/google-api-go-client/main/drive/v3/drive-api.json
    - https://developers.google.com/workspace/drive/api/reference/rest/v3/files/list
    - https://developers.google.com/workspace/drive/api/reference/rest/v3/drives/list
    - https://developers.google.com/workspace/drive/api/reference/rest/v3/changes/list
    - https://developers.google.com/workspace/drive/api/reference/rest/v3/changes/getStartPageToken
  auth_evidence:
    - https://developers.google.com/workspace/guides/create-credentials
  scope_evidence:
    - https://developers.google.com/drive/api/guides/api-specific-auth
  families:
    - id: files
      method: GET
      path: /files
    - id: shared_drives
      method: GET
      path: /drives
    - id: changes
      method: GET
      path: /changes
kind_lifecycle:
  - kind: google_drive.files
    status: active
  - kind: google_drive.shared_drives
    status: active
  - kind: google_drive.changes
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: google_drive
  dimensions:
    - id: files
      type: entity_family
      title: "Files"
      families: [files]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: shared_drives
      type: entity_family
      title: "Shared Drives"
      families: [shared_drives]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: changes
      type: audit_event
      title: "Changes"
      families: [changes]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: google_drive.files
    schema_ref: google_drive/files/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: google_drive.shared_drives
    schema_ref: google_drive/shared_drives/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: google_drive.changes
    schema_ref: google_drive/changes/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - fileId
