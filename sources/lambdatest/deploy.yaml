sourceId: lambdatest
secretKeys:
  - LAMBDATEST_TEST_ID
  - LAMBDATEST_TOKEN
runtimes:
  - localId: profile
    config:
      test_id: env:LAMBDATEST_TEST_ID
      family: profile
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /profiles
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:LAMBDATEST_TOKEN
