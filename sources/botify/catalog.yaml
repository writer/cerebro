id: botify
name: "Botify"
description: "Collects filter, export, out of config, sitemap only, report, and project from Botify and projects them into the Cerebro graph as assets for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - botify.filter
  - botify.export
  - botify.out_of_config
  - botify.sitemap_only
  - botify.report
  - botify.project
  - botify.analyses
  - botify.url
  - botify.orphan_url
  - botify.datamodel
  - botify.domain
  - botify.percentile
runtime_families:
  - analyses
  - datamodel
  - domain
  - export
  - filter
  - orphan_url
  - out_of_config
  - percentile
  - project
  - report
  - sitemap_only
  - url
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-28T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: token_authorization_header
  base_url: https://api.botify.com/v1
  spec_url: https://api.botify.com/v1/swagger.json
  spec_kind: openapi
  references:
    - https://developers.botify.com/docs/getting-started
    - https://developers.botify.com/docs/important-concepts
    - https://developers.botify.com/docs/openapi-specifications
    - https://api.botify.com/v1/swagger.json
  auth_evidence:
    - https://developers.botify.com/docs/getting-started
  families:
    - id: filter
      method: GET
      path: /projects/{username}/{project_slug}/filters
      operation: getSavedFilters
    - id: export
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/urls/export
      operation: getUrlsExports
    - id: out_of_config
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/features/sitemaps/samples/out_of_config
      operation: getSitemapsSamplesOutOfConfig
    - id: sitemap_only
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/features/sitemaps/samples/sitemap_only
      operation: getSitemapsSamplesSitemapsOnly
    - id: report
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/features/sitemaps/report
      operation: getSitemapsReport
    - id: project
      method: GET
      path: /projects/{username}
      operation: getUserProjects
    - id: analyses
      method: GET
      path: /analyses/{username}/{project_slug}
      operation: getProjectAnalyses
    - id: url
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/crawl_statistics/urls/{list_type}
      operation: getCrawlStatisticsUrls
    - id: orphan_url
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/features/ganalytics/orphan_urls/{medium}/{source}
      operation: getGanalyticsOrphanURLs
    - id: datamodel
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/urls/datamodel
      operation: getUrlsDatamodel
    - id: domain
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/features/top_domains/domains
      operation: getLinksTopDomains
    - id: percentile
      method: GET
      path: /analyses/{username}/{project_slug}/{analysis_slug}/features/links/percentiles
      operation: getLinksPercentiles
kind_lifecycle:
  - kind: botify.filter
    status: active
  - kind: botify.export
    status: active
  - kind: botify.out_of_config
    status: active
