id: botify
name: "Botify"
description: "Collects filter, export, out of config, sitemap only, report, and project from Botify and projects them into the Cerebro graph as assets for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - botify.filter
  - botify.export
  - botify.out_of_config
  - botify.sitemap_only
  - botify.report
  - botify.project
  - botify.analyses
  - botify.url
  - botify.orphan_url
  - botify.datamodel
  - botify.domain
  - botify.percentile
kind_lifecycle:
  - kind: botify.filter
    status: active
  - kind: botify.export
    status: active
  - kind: botify.out_of_config
    status: active
  - kind: botify.sitemap_only
    status: active
  - kind: botify.report
    status: active
  - kind: botify.project
    status: active
  - kind: botify.analyses
    status: active
  - kind: botify.url
    status: active
  - kind: botify.orphan_url
    status: active
  - kind: botify.datamodel
    status: active
  - kind: botify.domain
    status: active
  - kind: botify.percentile
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: botify
  dimensions:
    - id: filter
      type: entity_family
      title: "Filter"
      families: [filter]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: export
      type: entity_family
