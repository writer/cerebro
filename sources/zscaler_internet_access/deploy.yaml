sourceId: zscaler_internet_access
secretKeys:
  - ZSCALER_INTERNET_ACCESS_BASE_URL
  - ZSCALER_INTERNET_ACCESS_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:ZSCALER_INTERNET_ACCESS_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ZSCALER_INTERNET_ACCESS_TOKEN
