event_contracts:
  - kind: apacta.activity
    schema_ref: apacta/activity/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: apacta.mass_messages_user
    schema_ref: apacta/mass_messages_user/v1
    required_attributes:
      - tenant_id
      - source_event_id
