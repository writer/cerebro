id: apacta
name: "Apacta"
description: "Collects documented Apacta Partner API activities, cities, contact people, project users, and users into the Cerebro graph for inventory, access review, and operational context."
emitted_kinds:
  - apacta.activity
  - apacta.city
  - apacta.contact_person
  - apacta.projects_user
  - apacta.user
runtime_families:
  - activity
  - city
  - contact_person
  - projects_user
  - user
kind_lifecycle:
  - kind: apacta.activity
    status: active
  - kind: apacta.city
    status: active
  - kind: apacta.contact_person
    status: active
  - kind: apacta.projects_user
    status: active
  - kind: apacta.user
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: authorization_bearer_header
  base_url: https://app.apacta.com/api/v1
  spec_url: https://apidoc.apacta.com/partner.yaml
  spec_kind: openapi
  references:
    - https://apidoc.apacta.com/
  families:
    - id: activity
      method: GET
      path: /activities
      operation: getActivities
    - id: city
      method: GET
      path: /cities
      operation: getCities
    - id: contact_person
      method: GET
      path: /contacts/{contact_id}/contact_persons
      operation: getContactPersonsList
    - id: projects_user
      method: GET
      path: /projects/{project_id}/users
      operation: listProjectsUsers
    - id: user
      method: GET
      path: /users
      operation: listUsers
coverage_contract:
  owner_domain: source_runtime
  authority_domain: apacta
  dimensions:
    - id: activity
      type: entity_family
      title: "Activities"
      families: [activity]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Documented Apacta Partner API activity catalog via GET /activities.
    - id: city
      type: entity_family
      title: "Cities"
      families: [city]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Documented Apacta Partner API city reference data via GET /cities.
    - id: contact_person
      type: entity_family
      title: "Contact People"
      families: [contact_person]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Documented Apacta Partner API contact people for a configured contact via GET /contacts/{contact_id}/contact_persons.
    - id: projects_user
      type: entity_family
      title: "Project Users"
      families: [projects_user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, access_review]
      notes:
        - Documented Apacta Partner API project-user assignments for a configured project via GET /projects/{project_id}/users.
    - id: user
      type: entity_family
      title: "Users"
      families: [user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, access_review]
      notes:
        - Documented Apacta Partner API user directory via GET /users.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: apacta.activity
    schema_ref: apacta/activity/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_id
    required_payload_fields:
      - id
  - kind: apacta.city
    schema_ref: apacta/city/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: apacta.contact_person
    schema_ref: apacta/contact_person/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: apacta.projects_user
    schema_ref: apacta/projects_user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: apacta.user
    schema_ref: apacta/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
