id: apacta
name: "Apacta"
description: "Collects activity, mass messages user, role, city, event, and changelog from Apacta and projects them into the Cerebro graph as assets, audit events, groups, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - apacta.activity
  - apacta.mass_messages_user
  - apacta.role
  - apacta.city
  - apacta.event
  - apacta.changelog
  - apacta.time_entry_rule_group
  - apacta.user
  - apacta.user_custom_field_attribute
  - apacta.contact_person
  - apacta.projects_user
  - apacta.user_custom_field_value
kind_lifecycle:
  - kind: apacta.activity
    status: active
  - kind: apacta.mass_messages_user
    status: active
  - kind: apacta.role
    status: active
  - kind: apacta.city
    status: active
  - kind: apacta.event
    status: active
  - kind: apacta.changelog
    status: active
  - kind: apacta.time_entry_rule_group
    status: active
  - kind: apacta.user
    status: active
  - kind: apacta.user_custom_field_attribute
    status: active
  - kind: apacta.contact_person
    status: active
  - kind: apacta.projects_user
    status: active
  - kind: apacta.user_custom_field_value
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: apacta
  dimensions:
    - id: activity
      type: audit_event
      title: "Activity"
      families: [activity]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
