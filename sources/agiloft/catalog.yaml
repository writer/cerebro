id: agiloft
name: "Agiloft"
description: "Collects users, accounts, records, policies, and audit events from Agiloft and projects them into the Cerebro graph as users, assets, policies, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - agiloft.users
  - agiloft.accounts
  - agiloft.records
  - agiloft.policies
  - agiloft.audit_events
runtime_families:
  - accounts
  - audit_events
  - policies
  - records
  - users
kind_lifecycle:
  - kind: agiloft.users
    status: active
  - kind: agiloft.accounts
    status: active
  - kind: agiloft.records
    status: active
  - kind: agiloft.policies
    status: active
  - kind: agiloft.audit_events
    status: active
provider_api_disproof:
  status: invalidated
  reason: generated_runtime_paths_not_in_provider_reference
  checked_at: 2026-07-06T00:00:00Z
  references:
    - https://help.agiloft.com/space/HELP/43715778/REST+Interface
    - https://help.agiloft.com/space/HELP/43716366/API+Web+Services
    - https://help.agiloft.com/space/HELP/43717730/REST+-+Search
    - https://help.agiloft.com/space/HELP/43715609/REST+-+Table
  affected_families:
    - accounts
    - audit_events
    - policies
    - records
    - users
  missing_paths:
    - /v1/accounts
    - /v1/audit_events
    - /v1/policies
    - /v1/records
    - /v1/users
  notes:
    - Agiloft documents KB-specific REST operations under /ewws, including /ewws/REST/{kbName}/{table}[/{id}], /ewws/EWSearch, and /ewws/EWTable, rather than fixed /v1 resource collections.
    - The public documentation says OpenAPI is generated inside each customer KB and includes system-specific tables and fields, so the generated generic runtime families cannot be truthfully mapped to stable provider paths.
    - Rewrite this source around documented KB/table-specific Agiloft resources before promotion.
coverage_contract:
  owner_domain: source_runtime
  authority_domain: agiloft
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: accounts
      type: entity_family
      title: "Accounts"
      families: [accounts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: records
      type: entity_family
      title: "Records"
      families: [records]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: policies
      type: lifecycle_state
      title: "Policies"
      families: [policies]
      support: partial
      high_value: true
