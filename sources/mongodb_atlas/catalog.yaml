id: mongodb_atlas
name: "MongoDB Atlas"
description: "Collects data assets, audit events, and vulnerabilities from MongoDB Atlas and projects them into the Cerebro graph as assets, audit events, and vulnerabilities for owner, account, evidence, and compliance context."
emitted_kinds:
  - mongodb_atlas.assets
  - mongodb_atlas.audit_events
  - mongodb_atlas.vulnerabilities
kind_lifecycle:
  - kind: mongodb_atlas.assets
    status: active
  - kind: mongodb_atlas.audit_events
    status: active
  - kind: mongodb_atlas.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: mongodb_atlas
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: entity_family
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: mongodb_atlas.assets
    schema_ref: mongodb_atlas/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: mongodb_atlas.audit_events
    schema_ref: mongodb_atlas/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: mongodb_atlas.vulnerabilities
    schema_ref: mongodb_atlas/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
