sourceId: freshservice
secretKeys:
  - FRESHSERVICE_API_TOKEN
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v2/requesters/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:FRESHSERVICE_API_TOKEN
