sourceId: ibm_watsonx_ai
secretKeys:
  - IBM_WATSONX_AI_PROJECT_ID
  - IBM_WATSONX_AI_REGION
  - IBM_WATSONX_AI_TOKEN
runtimes:
  - localId: foundation-model-specs
    config:
      project_id: env:IBM_WATSONX_AI_PROJECT_ID
      region: env:IBM_WATSONX_AI_REGION
      family: foundation_model_specs
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /ml/v1/foundation_model_specs?version=2024-03-14
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:IBM_WATSONX_AI_TOKEN
