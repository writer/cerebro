id: alteryx
name: "Alteryx"
description: "Collects Alteryx Server users, user groups, workflows, collections, and audit events and projects them into the Cerebro graph as identities, assets, and audit events for owner, evidence, and compliance context."
emitted_kinds:
  - alteryx.users
  - alteryx.usergroups
  - alteryx.workflows
  - alteryx.collections
  - alteryx.audit_events
runtime_families:
  - audit_events
  - collections
  - usergroups
  - users
  - workflows
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: oauth2_bearer_access_token_authorization_header
  base_url: ${config.base_url}/webapi
  spec_url: ${config.base_url}/webapi/swagger
  spec_kind: openapi_embedded_html
  references:
    - https://help.alteryx.com/current/en/developer-help/apis/server-api-overview.html
    - https://help.alteryx.com/current/en/server/api-overview/alteryx-server-api-v3/server-api-configuration-and-authorization.html
    - https://help.alteryx.com/current/en/server/api-overview/alteryx-server-api-v3/server-api-v3-objects/user-endpoints.html
    - https://help.alteryx.com/current/en/server/api-overview/alteryx-server-api-v3/server-api-v3-objects/user-group-endpoints.html
    - https://help.alteryx.com/current/en/server/api-overview/alteryx-server-api-v3/server-api-v3-objects/workflow-endpoints.html
    - https://help.alteryx.com/current/en/server/api-overview/alteryx-server-api-v3/server-api-v3-objects/collection-endpoints.html
  families:
    - id: audit_events
      method: GET
      path: /admin/v1/auditlog
      operation: get_audit_events
    - id: collections
      method: GET
      path: /v3/collections
      operation: retrieve_records_of_all_collections
    - id: usergroups
      method: GET
      path: /v3/usergroups
      operation: retrieve_all_user_groups
    - id: users
      method: GET
      path: /v3/users
      operation: retrieve_all_user_records
    - id: workflows
      method: GET
      path: /v3/workflows
      operation: retrieve_all_workflows
kind_lifecycle:
  - kind: alteryx.users
    status: active
  - kind: alteryx.usergroups
    status: active
  - kind: alteryx.workflows
    status: active
  - kind: alteryx.collections
    status: active
  - kind: alteryx.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: alteryx
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Alteryx Server V3 exposes user records with role, active state, API access, and DCM permission fields.
    - id: usergroups
      type: entity_family
      title: "User groups"
      families: [usergroups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      notes:
        - Alteryx Server V3 exposes custom user group records and roles for access-review context.
    - id: workflows
      type: entity_family
      title: "Workflows"
      families: [workflows]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, data_governance]
      notes:
        - Alteryx Server V3 exposes workflow records with owners and execution metadata.
    - id: collections
      type: entity_family
      title: "Collections"
      families: [collections]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      notes:
        - Alteryx Server V3 exposes collection records and membership/permission relationships.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Alteryx Server Admin V1 exposes audit event records for tracked entity changes.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: alteryx.users
    schema_ref: alteryx/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: alteryx.usergroups
    schema_ref: alteryx/usergroups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - group_name
    required_payload_fields:
      - id
  - kind: alteryx.workflows
    schema_ref: alteryx/workflows/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: alteryx.collections
    schema_ref: alteryx/collections/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: alteryx.audit_events
    schema_ref: alteryx/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
