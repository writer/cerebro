id: email_domain_health
name: Email Domain Health
description: Email authentication posture source. Probes SPF, DKIM, DMARC, MX, and related DNS records for configured tenant mail domains.
emitted_kinds:
  - email_domain_health.health
coverage_contract:
  owner_domain: security
  authority_domain: dns
  dimensions:
    - id: email_authentication_posture
      type: entity_family
      title: Email authentication posture
      families: [email_domain, health]
      support: supported
      high_value: true
      evidence_types: [email_authentication_control, source_snapshot]
      control_domains: [email_security, network_security]
      control_refs:
        - framework_name: NIST SP 800-177
          control_id: TLS-MAIL
        - framework_name: ISO 27001:2022
          control_id: A.5.14
        - framework_name: SOC 2
          control_id: CC6.6
    - id: dns_record_checks
      type: entity_family
      title: SPF, DKIM, DMARC, MX, and related DNS checks
      families: [email_domain, dkim_selector, health]
      support: supported
      high_value: true
      evidence_types: [email_authentication_control, network_configuration, source_snapshot]
      control_domains: [email_security, network_security]
      control_refs:
        - framework_name: NIST SP 800-177
          control_id: TLS-MAIL
        - framework_name: ISO 27001:2022
          control_id: A.5.14
        - framework_name: SOC 2
          control_id: CC6.6
    - id: remediation_state
      type: remediation_state
      title: Domain remediation lifecycle state
      families: [health]
      support: unsupported
      high_value: true
      known_unsupported_fields:
        - remediation workflow state
event_contracts:
  - kind: email_domain_health.health
    schema_ref: email_domain_health/health/v1
    required_attributes:
      - domain
      - status
      - score
    required_payload_fields:
      - domain
      - status
      - score
      - issues
