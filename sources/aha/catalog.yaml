id: aha
name: "Aha"
description: "Collects users, products, features, releases, and audit events from Aha! and projects them into the Cerebro graph as users, assets, release records, and audit evidence for product development context."
emitted_kinds:
  - aha.users
  - aha.products
  - aha.features
  - aha.releases
  - aha.audit_events
runtime_families:
  - audit_events
  - features
  - products
  - releases
  - users
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: authorization_bearer_header_api_key_or_oauth2_token
  base_url: ${config.base_url}/api/v1
  spec_url: https://www.aha.io/openapi.json
  spec_kind: openapi
  references:
    - https://www.aha.io/api
    - https://www.aha.io/redoc-static.html
    - https://www.aha.io/openapi.json
  families:
    - id: audit_events
      method: GET
      path: /audits
      operation: retrieve_record_history
    - id: features
      method: GET
      path: /features
      operation: list_features
    - id: products
      method: GET
      path: /products
      operation: list_products
    - id: releases
      method: GET
      path: /products/{product_id}/releases
      operation: list_releases_in_product
    - id: users
      method: GET
      path: /users
      operation: list_users
kind_lifecycle:
  - kind: aha.users
    status: active
  - kind: aha.products
    status: active
  - kind: aha.features
    status: active
  - kind: aha.releases
    status: active
  - kind: aha.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: aha
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Aha! account users from the documented GET /users endpoint.
    - id: products
      type: entity_family
      title: "Products"
      families: [products]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Aha! products and Aha! Develop teams from the documented GET /products endpoint.
    - id: features
      type: entity_family
      title: "Features"
      families: [features]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Aha! features from the documented GET /features endpoint.
    - id: releases
      type: entity_family
      title: "Releases"
      families: [releases]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery]
      notes:
        - Reads releases scoped to a configured Aha! product from the documented GET /products/{product_id}/releases endpoint.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Reads recent Aha! audit records from the documented GET /audits endpoint.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: aha.users
    schema_ref: aha/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: aha.products
    schema_ref: aha/products/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: aha.features
    schema_ref: aha/features/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: aha.releases
    schema_ref: aha/releases/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: aha.audit_events
    schema_ref: aha/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
