coverage_contract:
  owner_domain: cloud
  authority_domain: azure
  dimensions:
    - id: activity_log
      type: audit_event
      title: Azure activity logs
      families: [activity_log]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
    - id: activity_log_alert
      type: entity_family
      title: Azure Activity Log Alert
      families: [activity_log_alert]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: ad_authorization_policy
      type: entity_family
      title: Azure authorization policy
      families: [authorization_policy]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: aks_cluster
      type: entity_family
      title: Azure AKS clusters
      families: [aks_cluster, aks, containerservice_managed_cluster]
      support: supported
      high_value: true
      evidence_types: [cloud_configuration, identity_configuration, network_exposure, security_monitoring, source_snapshot]
      control_domains: [asset_inventory, cloud_security, identity_access, network_security, security_operations]
      control_refs:
        - framework_name: CIS Benchmarks
          control_id: "5.1.1"
    - id: aks_node
      type: entity_family
      title: Azure AKS nodes and node pools
      families: [aks_cluster, aks_node_pool, virtual_machine_scale_set_instance]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: app_service
      type: entity_family
      title: Azure App Service apps
      families: [app_service, app_service_web_app]
      support: supported
      high_value: true
      evidence_types: [cloud_configuration, encryption_configuration, network_exposure, source_snapshot]
      control_domains: [asset_inventory, data_protection, network_security]
    - id: app_role_assignment
      type: app_entitlement
      title: Azure app role assignments
      families: [app_role_assignment]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
