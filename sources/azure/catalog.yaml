      support: supported
      high_value: true
    - id: ad_authorization_policy
      type: entity_family
      title: Azure authorization policy
      families: [asset_metadata]
      support: partial
      high_value: true
      known_unsupported_fields: [tenant-wide guest and user authorization settings]
    - id: aks_cluster
      type: entity_family
      title: Azure AKS clusters
      families: [aks_cluster]
      support: supported
      high_value: true
