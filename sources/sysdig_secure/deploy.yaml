sourceId: sysdig_secure
secretKeys:
  - SYSDIG_SECURE_TOKEN
runtimes:
  - localId: assets
    config:
      family: assets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /user
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:SYSDIG_SECURE_TOKEN
