id: learnifier
name: "Learnifier"
description: "Collects globalusergroup, coursedesign, user, member, usergroup, and usergroups member from Learnifier and projects them into the Cerebro graph as assets and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - learnifier.globalusergroup
  - learnifier.coursedesign
  - learnifier.user
  - learnifier.member
  - learnifier.usergroup
  - learnifier.usergroups_member
  - learnifier.teammember
  - learnifier.orgunits_usergroup
  - learnifier.orgunit
  - learnifier.project
  - learnifier.participant
kind_lifecycle:
  - kind: learnifier.globalusergroup
    status: active
  - kind: learnifier.coursedesign
    status: active
  - kind: learnifier.user
    status: active
  - kind: learnifier.member
    status: active
  - kind: learnifier.usergroup
    status: active
  - kind: learnifier.usergroups_member
    status: active
  - kind: learnifier.teammember
    status: active
  - kind: learnifier.orgunits_usergroup
    status: active
  - kind: learnifier.orgunit
    status: active
  - kind: learnifier.project
    status: active
  - kind: learnifier.participant
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: learnifier
  dimensions:
    - id: globalusergroup
      type: entity_family
      title: "Globalusergroup"
      families: [globalusergroup]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: coursedesign
      type: entity_family
      title: "Coursedesign"
      families: [coursedesign]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
