    - id: usergroups_member
      type: entity_family
      title: "Usergroups Member"
      families: [usergroups_member]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: teammember
      type: entity_family
      title: "Teammember"
      families: [teammember]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: orgunits_usergroup
      type: entity_family
      title: "Orgunits Usergroup"
