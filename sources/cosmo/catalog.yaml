id: cosmo
name: Cosmo
description: Cosmo agent memory sessions, facts, messages, and survey feedback source.
emitted_kinds:
  - cosmo.fact
  - cosmo.message
  - cosmo.session
  - cosmo.survey_feedback
event_contracts:
  - kind: cosmo.fact
    schema_ref: cosmo/fact/v1
    required_attributes:
      - record_id
  - kind: cosmo.message
    schema_ref: cosmo/message/v1
    required_attributes:
      - record_id
  - kind: cosmo.session
    schema_ref: cosmo/session/v1
    required_attributes:
      - record_id
  - kind: cosmo.survey_feedback
    schema_ref: cosmo/survey_feedback/v1
    required_attributes:
      - record_id
coverage_contract:
  owner_domain: product_telemetry
  authority_domain: cosmo
  dimensions:
    - id: facts
      type: entity_family
      title: Memory facts
      families: [fact]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: messages
      type: audit_event
      title: Message exports
      families: [message]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
    - id: sessions
      type: entity_family
      title: Memory sessions
      families: [session]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: survey_feedback
      type: entity_family
      title: Survey feedback
      families: [survey_feedback]
      support: supported
