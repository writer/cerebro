sourceId: fulfillment_com
secretKeys:
  - FULFILLMENT_COM_API_TOKEN
runtimes:
  - localId: accounting
    config:
      family: accounting
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /accounting
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:FULFILLMENT_COM_API_TOKEN
