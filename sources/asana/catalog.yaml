id: asana
name: "Asana"
description: "Asana work-management source covering users, projects, and workspace audit log events. The runtime reads Asana REST collections from the official API, keeps workspace-scoped audit events tied to actors and resources, and emits project and user records for ownership, access, and change review."
emitted_kinds:
  - asana.users
  - asana.projects
  - asana.audit_events
provider_api:
  status: verified
  transport: rest
  auth: bearer_token
  base_url: https://app.asana.com/api/1.0
  references:
    - https://github.com/Asana/openapi/blob/master/defs/asana_oas.yaml
    - https://developers.asana.com/reference/getusers
    - https://developers.asana.com/reference/getprojects
    - https://developers.asana.com/reference/getauditlogevents
    - https://developers.asana.com/docs/authentication
  families:
    - id: users
      method: GET
      path: /users
    - id: projects
      method: GET
      path: /projects
    - id: audit_events
      method: GET
      path: /workspaces/{workspace_gid}/audit_log_events
runtime_families:
  - users
  - projects
  - audit_events
kind_lifecycle:
  - kind: asana.users
    status: active
  - kind: asana.projects
    status: active
  - kind: asana.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: asana
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access, asset_inventory]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "5"
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
      known_unsupported_fields:
        - workspace guest access may need additional workspace membership context
      notes:
        - Reads `GET /users` with optional workspace filtering and preserves user gid, name, and email fields for identity matching and access review.
    - id: projects
      type: entity_family
      title: "Projects"
      families: [projects]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads `GET /projects` with workspace filtering and emits project gid, name, archive state, and timestamps as project inventory.
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "3"
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "NIST 800-53 r5"
          control_id: AC-3
        - framework_name: "ISO 27001:2022"
          control_id: A.5.12
      known_unsupported_fields:
        - task and attachment inventory are outside this project-level snapshot
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Reads `GET /workspaces/{workspace_gid}/audit_log_events`; each event keeps actor, resource, event type, and observed timestamp for workspace change review.
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "8"
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "NIST 800-53 r5"
          control_id: AU-2
        - framework_name: "NIST 800-53 r5"
          control_id: AU-6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      known_unsupported_fields:
        - audit log availability depends on Asana plan and workspace audit permissions
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      families: [users, projects, audit_events]
      support: supported
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      notes:
        - Uses Asana `limit` and `offset` pagination and stores `next_page.offset` in the Source CDK cursor for continued reads.
event_contracts:
  - kind: asana.users
    schema_ref: asana/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - gid
  - kind: asana.projects
    schema_ref: asana/projects/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - gid
  - kind: asana.audit_events
    schema_ref: asana/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - gid
