id: asana
name: "Asana"
description: "Asana work management platform."
emitted_kinds:
  - asana.event
  - asana.membership
  - asana.role
  - asana.user
kind_lifecycle:
  - kind: asana.event
    status: active
  - kind: asana.membership
    status: active
  - kind: asana.role
    status: active
  - kind: asana.user
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: asana
  dimensions:
    - id: event
      type: entity_family
      title: "Event"
      families: [event]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: membership
      type: entity_family
      title: "Membership"
      families: [membership]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: role
      type: entity_family
      title: "Role"
      families: [role]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user
      type: entity_family
      title: "User"
      families: [user]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
event_contracts:
  - kind: asana.event
    schema_ref: asana/event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - action
  - kind: asana.membership
    schema_ref: asana/membership/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - member_id
    required_payload_fields:
      - id
  - kind: asana.role
    schema_ref: asana/role/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - name
  - kind: asana.user
    schema_ref: asana/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - name
