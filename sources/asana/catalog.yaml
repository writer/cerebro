id: asana
name: "Asana"
description: "Asana connector definition catalog entry for high-value security and operations resources."
emitted_kinds:
  - asana.users
  - asana.projects
  - asana.audit_events
kind_lifecycle:
  - kind: asana.users
    status: active
  - kind: asana.projects
    status: active
  - kind: asana.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: asana
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: projects
      type: entity_family
      title: "Projects"
      families: [projects]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: entity_family
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
event_contracts:
  - kind: asana.users
    schema_ref: asana/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: asana.projects
    schema_ref: asana/projects/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: asana.audit_events
    schema_ref: asana/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
