sourceId: asana
secretKeys:
  - ASANA_TOKEN
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /users/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ASANA_TOKEN
  - localId: projects
    config:
      family: projects
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /users/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ASANA_TOKEN
  - localId: audit-events
    config:
      family: audit_events
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /users/me
      expected_cadence_seconds: "3600"
      stale_after_seconds: "7200"
      per_page: "100"
      token: env:ASANA_TOKEN
