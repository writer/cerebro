sourceId: launchdarkly
secretKeys:
  - LAUNCHDARKLY_API_TOKEN
runtimes:
  - localId: repositories
    config:
      family: repositories
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v2/account
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:LAUNCHDARKLY_API_TOKEN
