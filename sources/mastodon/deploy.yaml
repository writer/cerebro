sourceId: mastodon
secretKeys:
  - MASTODON_ID
  - MASTODON_TOKEN
runtimes:
  - localId: account
    config:
      id: env:MASTODON_ID
      family: account
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v1/lists/${config.id}/accounts
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:MASTODON_TOKEN
