id: mastodon
name: "Mastodon"
description: "Collects account, activity, verify credential, and notification from Mastodon and projects them into the Cerebro graph as users, audit events, secrets, and alerts for workspace, document, message, and collaboration context."
emitted_kinds:
  - mastodon.account
  - mastodon.activity
  - mastodon.verify_credential
  - mastodon.notification
kind_lifecycle:
  - kind: mastodon.account
    status: active
  - kind: mastodon.activity
    status: active
  - kind: mastodon.verify_credential
    status: active
  - kind: mastodon.notification
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: mastodon
  dimensions:
    - id: account
      type: entity_family
      title: "Account"
      families: [account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: activity
      type: audit_event
      title: "Activity"
      families: [activity]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: verify_credential
      type: entity_family
      title: "Verify Credential"
      families: [verify_credential]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: notification
      type: alert_state
      title: "Notification"
      families: [notification]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: mastodon.account
    schema_ref: mastodon/account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: mastodon.activity
    schema_ref: mastodon/activity/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - logins
  - kind: mastodon.verify_credential
    schema_ref: mastodon/verify_credential/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - category
  - kind: mastodon.notification
    schema_ref: mastodon/notification/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_severity
    required_payload_fields:
      - id
