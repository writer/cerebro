id: hashicorp_vault
name: "HashiCorp Vault"
description: "HashiCorp Vault connector definition catalog entry for high-value security and operations resources."
emitted_kinds:
  - hashicorp_vault.users
  - hashicorp_vault.secrets
  - hashicorp_vault.audit_events
coverage_contract:
  owner_domain: source_runtime
  authority_domain: hashicorp_vault
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: secrets
      type: entity_family
      title: "Secrets"
      families: [secrets]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: entity_family
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
event_contracts:
  - kind: hashicorp_vault.users
    schema_ref: hashicorp_vault/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: hashicorp_vault.secrets
    schema_ref: hashicorp_vault/secrets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: hashicorp_vault.audit_events
    schema_ref: hashicorp_vault/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
