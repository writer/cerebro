id: hashicorp_vault
name: "HashiCorp Vault"
description: "HashiCorp Vault connector definition catalog entry for high-value security and operations resources."
emitted_kinds:
  - hashicorp_vault.users
  - hashicorp_vault.secrets
  - hashicorp_vault.audit_events
runtime_families:
  - audit_events
  - secrets
  - users
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: x_vault_token_header
  base_url: ${config.base_url}
  spec_url: ${config.base_url}/v1/sys/internal/specs/openapi
  spec_kind: openapi
  references:
    - https://developer.hashicorp.com/vault/api-docs
    - https://developer.hashicorp.com/vault/api-docs/system/internal-specs-openapi
    - https://developer.hashicorp.com/vault/api-docs/secret/identity/entity
    - https://developer.hashicorp.com/vault/api-docs/system/mounts
    - https://developer.hashicorp.com/vault/api-docs/system/audit
  auth_evidence:
    - https://developer.hashicorp.com/vault/api-docs
  scope_evidence:
    - https://developer.hashicorp.com/vault/api-docs/secret/identity/entity
    - https://developer.hashicorp.com/vault/api-docs/system/mounts
    - https://developer.hashicorp.com/vault/api-docs/system/audit
  families:
    - id: users
      method: GET
      path: /identity/entity/id
      operation: identity_entity_list_by_id
    - id: secrets
      method: GET
      path: /sys/mounts
      operation: sys_mounts_list
    - id: audit_events
      method: GET
      path: /sys/audit
      operation: sys_audit_list_enabled_devices
coverage_contract:
  owner_domain: source_runtime
  authority_domain: hashicorp_vault
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Vault identity entities from /identity/entity/id with list=true.
    - id: secrets
      type: entity_family
      title: "Secrets"
      families: [secrets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads mounted Vault secret engines from /sys/mounts. This does not read secret values.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Reads enabled audit devices from /sys/audit as logging configuration evidence. Vault audit log events are emitted to configured devices, not read back from the Vault API.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
event_contracts:
  - kind: hashicorp_vault.users
    schema_ref: hashicorp_vault/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: hashicorp_vault.secrets
    schema_ref: hashicorp_vault/secrets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: hashicorp_vault.audit_events
    schema_ref: hashicorp_vault/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
