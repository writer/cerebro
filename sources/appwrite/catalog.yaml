id: appwrite
name: "Appwrite"
description: "Collects team, log, membership, and continent from Appwrite and projects them into the Cerebro graph as groups, audit events, group memberships, and assets for repository, build, deployment, and release context."
emitted_kinds:
  - appwrite.team
  - appwrite.log
  - appwrite.membership
  - appwrite.continent
kind_lifecycle:
  - kind: appwrite.team
    status: active
  - kind: appwrite.log
    status: active
  - kind: appwrite.membership
    status: active
  - kind: appwrite.continent
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: appwrite
  dimensions:
    - id: team
      type: entity_family
      title: "Team"
      families: [team]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: log
      type: audit_event
      title: "Log"
      families: [log]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: membership
      type: entity_family
      title: "Membership"
      families: [membership]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: continent
      type: entity_family
      title: "Continent"
      families: [continent]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: appwrite.team
    schema_ref: appwrite/team/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - name
  - kind: appwrite.log
    schema_ref: appwrite/log/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - clientCode
  - kind: appwrite.membership
    schema_ref: appwrite/membership/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - member_id
    required_payload_fields:
      - name
  - kind: appwrite.continent
    schema_ref: appwrite/continent/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - name
