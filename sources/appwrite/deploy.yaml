sourceId: appwrite
secretKeys:
  - APPWRITE_TEAMID
  - APPWRITE_API_TOKEN
runtimes:
  - localId: team
    config:
      teamid: env:APPWRITE_TEAMID
      family: team
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /teams
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:APPWRITE_API_TOKEN
