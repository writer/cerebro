id: postman
name: "Postman"
description: "Collects collections, environments, and audit events from Postman and projects them into the Cerebro graph as assets, secrets, and audit events for repository, build, deployment, and release context."
emitted_kinds:
  - postman.collections
  - postman.environments
  - postman.audit_events
runtime_families:
  - audit_events
  - collections
  - environments
kind_lifecycle:
  - kind: postman.collections
    status: active
  - kind: postman.environments
    status: active
  - kind: postman.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: postman
  dimensions:
    - id: collections
      type: entity_family
      title: "Collections"
      families: [collections]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: environments
      type: entity_family
      title: "Environments"
      families: [environments]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: postman.collections
    schema_ref: postman/collections/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - uid
  - kind: postman.environments
    schema_ref: postman/environments/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - uid
  - kind: postman.audit_events
    schema_ref: postman/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
