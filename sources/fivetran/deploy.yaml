sourceId: fivetran
secretKeys:
  - FIVETRAN_API_KEY
  - FIVETRAN_API_SECRET
  - FIVETRAN_BASE_URL
  - FIVETRAN_USER_IDS
  - FIVETRAN_TEAM_IDS
  - FIVETRAN_GROUP_IDS
  - FIVETRAN_CONNECTION_IDS
  - FIVETRAN_DESTINATION_IDS
  - FIVETRAN_EXTERNAL_SECRET_MANAGER_IDS
  - FIVETRAN_PROXY_AGENT_IDS
  - FIVETRAN_CONNECTOR_SERVICES
  - FIVETRAN_PACKAGE_DEFINITION_IDS
  - FIVETRAN_TABLE_COLUMN_CONNECTION_ID
  - FIVETRAN_TABLE_COLUMN_SCHEMA_NAME
  - FIVETRAN_TABLE_COLUMN_TABLE_NAME
runtimes:
  - localId: account-info
    config: &base
      base_url: env:FIVETRAN_BASE_URL
      username: env:FIVETRAN_API_KEY
      password: env:FIVETRAN_API_SECRET
      health_path: /v1/account/info
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      family: account_info
  - localId: users
    config:
      <<: *base
      family: users
  - localId: user-connections
    config:
      <<: *base
      family: user_connections
      user_ids: env:FIVETRAN_USER_IDS
  - localId: user-groups
    config:
      <<: *base
      family: user_groups
      user_ids: env:FIVETRAN_USER_IDS
  - localId: roles
    config:
      <<: *base
      family: roles
  - localId: teams
    config:
      <<: *base
      family: teams
  - localId: team-users
    config:
      <<: *base
      family: team_users
      team_ids: env:FIVETRAN_TEAM_IDS
  - localId: team-connections
    config:
      <<: *base
      family: team_connections
      team_ids: env:FIVETRAN_TEAM_IDS
  - localId: team-groups
    config:
      <<: *base
      family: team_groups
      team_ids: env:FIVETRAN_TEAM_IDS
  - localId: groups
    config:
      <<: *base
      family: groups
  - localId: group-users
    config:
      <<: *base
      family: group_users
      group_ids: env:FIVETRAN_GROUP_IDS
  - localId: group-connections
    config:
      <<: *base
      family: group_connections
      group_ids: env:FIVETRAN_GROUP_IDS
  - localId: group-public-keys
    config:
      <<: *base
      family: group_public_keys
      group_ids: env:FIVETRAN_GROUP_IDS
  - localId: group-service-accounts
    config:
      <<: *base
      family: group_service_accounts
      group_ids: env:FIVETRAN_GROUP_IDS
  - localId: destinations
    config:
      <<: *base
      family: destinations
  - localId: connections
    config:
      <<: *base
      family: connections
  - localId: connection-certificates
    config:
      <<: *base
      family: connection_certificates
      connection_ids: env:FIVETRAN_CONNECTION_IDS
  - localId: connection-fingerprints
    config:
      <<: *base
      family: connection_fingerprints
      connection_ids: env:FIVETRAN_CONNECTION_IDS
  - localId: connection-schemas
    config:
      <<: *base
      family: connection_schemas
      connection_ids: env:FIVETRAN_CONNECTION_IDS
  - localId: connection-state
    config:
      <<: *base
      family: connection_state
      connection_ids: env:FIVETRAN_CONNECTION_IDS
  - localId: connection-table-columns
    config:
      <<: *base
      family: connection_table_columns
      connection_id: env:FIVETRAN_TABLE_COLUMN_CONNECTION_ID
      schema_name: env:FIVETRAN_TABLE_COLUMN_SCHEMA_NAME
      table_name: env:FIVETRAN_TABLE_COLUMN_TABLE_NAME
  - localId: connector-sdk-packages
    config:
      <<: *base
      family: connector_sdk_packages
  - localId: destination-certificates
    config:
      <<: *base
      family: destination_certificates
      destination_ids: env:FIVETRAN_DESTINATION_IDS
  - localId: destination-fingerprints
    config:
      <<: *base
      family: destination_fingerprints
      destination_ids: env:FIVETRAN_DESTINATION_IDS
  - localId: account-log-service
    config:
      <<: *base
      family: account_log_service
  - localId: log-services
    config:
      <<: *base
      family: log_services
  - localId: webhooks
    config:
      <<: *base
      family: webhooks
  - localId: external-secret-managers
    config:
      <<: *base
      family: external_secret_managers
  - localId: external-secret-manager-entities
    config:
      <<: *base
      family: external_secret_manager_entities
  - localId: external-secret-manager-assignments
    config:
      <<: *base
      family: external_secret_manager_assignments
      external_secret_manager_ids: env:FIVETRAN_EXTERNAL_SECRET_MANAGER_IDS
  - localId: private-links
    config:
      <<: *base
      family: private_links
  - localId: proxy-agents
    config:
      <<: *base
      family: proxy_agents
  - localId: proxy-agent-connections
    config:
      <<: *base
      family: proxy_agent_connections
      proxy_agent_ids: env:FIVETRAN_PROXY_AGENT_IDS
  - localId: hybrid-deployment-agents
    config:
      <<: *base
      family: hybrid_deployment_agents
  - localId: public-connector-types
    config:
      <<: *base
      family: public_connector_types
  - localId: connector-metadata
    config:
      <<: *base
      family: connector_metadata
  - localId: connector-metadata-details
    config:
      <<: *base
      family: connector_metadata_details
      connector_services: env:FIVETRAN_CONNECTOR_SERVICES
  - localId: system-keys
    config:
      <<: *base
      family: system_keys
  - localId: transformations
    config:
      <<: *base
      family: transformations
  - localId: transformation-projects
    config:
      <<: *base
      family: transformation_projects
  - localId: transformation-package-metadata
    config:
      <<: *base
      family: transformation_package_metadata
  - localId: transformation-package-details
    config:
      <<: *base
      family: transformation_package_details
      package_definition_ids: env:FIVETRAN_PACKAGE_DEFINITION_IDS
