id: fivetran
name: "Fivetran"
description: "Collects Fivetran users, groups, teams, roles, pipeline resources, logging configuration, networking agents, keys, secrets, transformations, webhooks, and membership edges from the Fivetran REST API."
provider_api:
  status: verified
  transport: rest
  auth: basic_api_key_secret
  base_url: https://api.fivetran.com
  required_headers:
    Accept: application/json;version=2
  references:
    - https://fivetran.com/docs/rest-api/api-reference/open-api-definition
    - https://fivetran.com/assets-docs/openapi/file_v1.json
    - https://fivetran.com/docs/rest-api/getting-started
    - https://fivetran.com/docs/rest-api/getting-started/pagination
  health:
    method: GET
    path: /v1/account/info
  pagination:
    type: cursor
    cursor_param: cursor
    cursor_json_path: $.data.next_cursor
    page_size_param: limit
    record_selector: $.data.items[*]
  families:
    - id: users
      method: GET
      path: /v1/users
    - id: user_connection_memberships
      method: GET
      path: /v1/users/{userId}/connections
    - id: user_group_memberships
      method: GET
      path: /v1/users/{userId}/groups
    - id: groups
      method: GET
      path: /v1/groups
    - id: group_users
      method: GET
      path: /v1/groups/{groupId}/users
    - id: group_connections
      method: GET
      path: /v1/groups/{groupId}/connections
    - id: teams
      method: GET
      path: /v1/teams
    - id: team_users
      method: GET
      path: /v1/teams/{teamId}/users
    - id: team_groups
      method: GET
      path: /v1/teams/{teamId}/groups
    - id: team_connections
      method: GET
      path: /v1/teams/{teamId}/connections
    - id: roles
      method: GET
      path: /v1/roles
    - id: destinations
      method: GET
      path: /v1/destinations
    - id: destination_certificates
      method: GET
      path: /v1/destinations/{destinationId}/certificates
    - id: destination_fingerprints
      method: GET
      path: /v1/destinations/{destinationId}/fingerprints
    - id: connections
      method: GET
      path: /v1/connections
    - id: connection_certificates
      method: GET
      path: /v1/connections/{connectionId}/certificates
    - id: connection_fingerprints
      method: GET
      path: /v1/connections/{connectionId}/fingerprints
    - id: log_services
      method: GET
      path: /v1/external-logging
    - id: webhooks
      method: GET
      path: /v1/webhooks
    - id: private_links
      method: GET
      path: /v1/private-links
    - id: proxy_agents
      method: GET
      path: /v1/proxy
    - id: proxy_agent_connections
      method: GET
      path: /v1/proxy/{agentId}/connections
    - id: hybrid_deployment_agents
      method: GET
      path: /v1/hybrid-deployment-agents
    - id: connector_metadata
      method: GET
      path: /v1/metadata/connector-types
    - id: connector_sdk_packages
      method: GET
      path: /v1/connector-sdk/packages
    - id: system_keys
      method: GET
      path: /v1/system-keys
    - id: external_secrets_managers
      method: GET
      path: /v1/external-secrets-managers
    - id: external_secrets_manager_entities
      method: GET
      path: /v1/external-secrets-managers-entities
    - id: transformations
      method: GET
      path: /v1/transformations
    - id: transformation_projects
      method: GET
      path: /v1/transformation-projects
    - id: transformation_package_metadata
      method: GET
      path: /v1/transformations/package-metadata
