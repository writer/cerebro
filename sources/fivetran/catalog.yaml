coverage_contract:
  owner_domain: source_runtime
  authority_domain: fivetran
  dimensions:
    - id: account_access
      type: entity_family
      title: "Account access"
      families: [users, groups, group_users, teams, team_users, team_groups, team_connections, roles, user_group_memberships, user_connection_memberships]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access, access_review]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
      notes:
        - Fivetran REST API account access endpoints enumerate users, groups, teams, roles, and scoped membership relationships.
    - id: pipeline_inventory
      type: entity_family
      title: "Pipeline inventory"
      families: [connections, destinations, group_connections, connector_metadata, connector_sdk_packages]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, data_governance]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
      notes:
        - Connection and destination endpoints use the provider's versioned JSON accept header.
    - id: logging_and_hooks
      type: lifecycle_state
      title: "Logging and webhooks"
      families: [log_services, webhooks]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - The REST API exposes log service and webhook configuration; event logs are delivered through Fivetran logging products rather than a REST audit-events list.
    - id: networking_agents
      type: entity_family
      title: "Networking and agents"
      families: [private_links, proxy_agents, proxy_agent_connections, hybrid_deployment_agents, connection_certificates, connection_fingerprints, destination_certificates, destination_fingerprints]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [network_security, asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.20
    - id: keys_and_secrets
      type: entity_family
      title: "Keys and secrets managers"
      families: [system_keys, external_secrets_managers, external_secrets_manager_entities]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [secrets_management]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.17
    - id: transformations
      type: entity_family
      title: "Transformations"
      families: [transformations, transformation_projects, transformation_package_metadata]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [data_governance]
      control_refs:
        - framework_name: SOC 2
          control_id: CC8.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.32
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      families: [users, groups, teams, roles, destinations, connections, log_services]
      support: supported
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
