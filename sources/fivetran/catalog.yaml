id: fivetran
name: "Fivetran"
description: "Fivetran account, access, pipeline, destination, trust, logging, private connectivity, external secret manager, connector metadata, system key, and transformation source. The runtime reads the Fivetran REST API with Basic API key authentication, follows `data.items` cursor pagination, unwraps singleton `data` records for account, group credential, connection schema, connection state, log service, connector metadata, and transformation package detail routes, expands nested object maps for connection table columns, applies v2 Accept headers only to connection and destination list routes, redacts destination config, connection config, external logging config, and system key material from raw event payloads, and emits graph-ready users, groups, roles, memberships, pipeline assets, schema columns, network trust controls, logging targets, credentials, external secret manager assignments, connector packages, and transformation records."
