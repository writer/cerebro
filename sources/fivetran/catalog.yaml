coverage_contract:
  owner_domain: source_runtime
  authority_domain: fivetran
  dimensions:
    - id: account_access_inventory
      type: app_entitlement
      title: Account access inventory
      families: [fivetran_users, fivetran_roles, fivetran_teams, fivetran_groups]
      support: partial
      high_value: false
      evidence_types: [identity_configuration, source_snapshot]
      control_domains: [identity_access, authorization]
      notes:
        - Reads Fivetran account users, roles, teams, and destination groups for Fivetran access review. Families are source-qualified so this SaaS-local access evidence does not claim primary IAM, MFA, or cloud-service-account coverage.
    - id: account_profile
      type: entity_family
      title: Account profile
      families: [account_info]
      support: supported
      high_value: false
      evidence_types: [identity_configuration, source_snapshot]
      control_domains: [identity_access, asset_inventory]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: CM-8
        - framework_name: SOC 2
          control_id: CC7.1
      notes:
        - Reads account identity and system-key owner metadata from the account info endpoint so account-scoped records can retain tenant and API principal context.
    - id: account_membership_edges
      type: relationship
      title: User, team, group, and connection memberships
      families: [user_connections, user_groups, team_users, team_connections, team_groups, group_users, group_connections]
      support: supported
      high_value: true
      evidence_types: [access_review, relationship_evidence]
      control_domains: [identity_access, access_review]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-6
        - framework_name: "PCI DSS v4.0.1"
          control_id: "7.2"
        - framework_name: SOC 2
          control_id: CC6.3
      notes:
        - Fans out over configured user, team, and group IDs to collect role-bearing membership edges between principals, destination groups, and connections.
    - id: pipeline_inventory
      type: entity_family
      title: Destinations, connections, connector packages, metadata, and transformations
      families: [destinations, connections, connection_schemas, connection_state, connection_table_columns, connector_sdk_packages, public_connector_types, connector_metadata, connector_metadata_details, transformations, transformation_projects, transformation_package_metadata, transformation_package_details]
      support: supported
      high_value: true
      evidence_types: [source_snapshot, configuration_state]
      control_domains: [asset_inventory, data_governance]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: CM-8
        - framework_name: SOC 2
          control_id: CC7.1
      notes:
        - Reads pipeline inventory, connection schema and state records, per-table column configuration, connector package and public connector metadata details, destination configuration, paused state, sync cadence, transformation projects, quickstart package lists and detail records, and transformation records through Fivetran APIs.
    - id: trust_and_connectivity_controls
      type: entity_family
      title: Connection and destination trust plus private connectivity
      families: [group_public_keys, group_service_accounts, connection_certificates, connection_fingerprints, destination_certificates, destination_fingerprints, private_links, proxy_agents, proxy_agent_connections, hybrid_deployment_agents]
      support: supported
      high_value: true
      evidence_types: [configuration_state, source_snapshot]
      control_domains: [network_security, asset_inventory]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: SC-7
        - framework_name: "NIST 800-53 r5"
          control_id: SC-12
        - framework_name: "PCI DSS v4.0.1"
          control_id: "1.2"
      notes:
        - Collects group SSH keys and service accounts, approved connection and destination certificates, SSH fingerprints, private links, proxy agents, proxy connection attachments, and hybrid deployment agents for review of trusted endpoints and private network paths.
    - id: logging_and_webhook_controls
      type: lifecycle_state
      title: Log service and webhook configuration
      families: [account_log_service, log_services, webhooks]
      support: supported
      high_value: true
      evidence_types: [logging_configuration, configuration_state]
      control_domains: [logging_monitoring, change_management]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: AU-2
        - framework_name: "NIST 800-53 r5"
          control_id: AU-6
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Reads account log service configuration, external logging services, and webhook subscriptions so teams can review whether Fivetran events and sync outcomes are routed to operational systems.
    - id: api_credentials
      type: app_entitlement
      title: System key inventory
      families: [system_keys]
      support: supported
      high_value: true
      evidence_types: [credential_inventory]
      control_domains: [identity_access, authorization]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: IA-5
        - framework_name: "PCI DSS v4.0.1"
          control_id: "8.6"
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Reads system key metadata and redacts `key` and `secret` from stored raw payloads before emitting source events.
    - id: external_secret_managers
      type: app_entitlement
      title: External secrets manager inventory
      families: [external_secret_managers, external_secret_manager_entities, external_secret_manager_assignments]
      support: supported
      high_value: true
      evidence_types: [credential_inventory, configuration_state]
      control_domains: [identity_access, authorization, asset_inventory]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: IA-5
        - framework_name: "NIST 800-53 r5"
          control_id: CM-8
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Reads external secrets managers, entities that use them, and per-manager entity assignments so operators can review which Fivetran resources depend on external secret stores.
    - id: incremental_sync
      type: incremental_sync
      title: Cursor sync
      families: [account_info, users, user_connections, user_groups, roles, teams, team_users, team_connections, team_groups, groups, group_users, group_connections, group_public_keys, group_service_accounts, destinations, connections, connection_certificates, connection_fingerprints, connection_schemas, connection_state, connection_table_columns, connector_sdk_packages, destination_certificates, destination_fingerprints, account_log_service, log_services, webhooks, external_secret_managers, external_secret_manager_entities, external_secret_manager_assignments, private_links, proxy_agents, proxy_agent_connections, hybrid_deployment_agents, public_connector_types, connector_metadata, connector_metadata_details, system_keys, transformations, transformation_projects, transformation_package_metadata, transformation_package_details]
      support: supported
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: AU-12
      notes:
        - Every list runtime follows Fivetran `data.next_cursor` and sends that value as the next `cursor` query parameter with bounded `limit` page sizes.
