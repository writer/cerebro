coverage_contract:
  owner_domain: source_runtime
  authority_domain: fivetran
  dimensions:
    - id: account_access_inventory
      type: app_entitlement
      title: Account access inventory
      families: [users, roles, teams, groups]
      support: supported
      high_value: true
      evidence_types: [identity_configuration, source_snapshot]
      control_domains: [identity_access, authorization]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "5"
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: SOC 2
          control_id: CC6.2
      notes:
        - Reads account users, roles, teams, and destination groups from first-class Fivetran API routes and preserves IDs, emails, role names, team names, group names, and provider status fields for access review.
    - id: account_membership_edges
      type: relationship
      title: User, team, group, and connection memberships
      families: [user_connections, user_groups, team_users, team_connections, team_groups, group_users, group_connections]
      support: supported
      high_value: true
      evidence_types: [access_review, relationship_evidence]
      control_domains: [identity_access, access_review]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-6
        - framework_name: "PCI DSS v4.0.1"
          control_id: "7.2"
        - framework_name: SOC 2
          control_id: CC6.3
      notes:
        - Fans out over configured user, team, and group IDs to collect role-bearing membership edges between principals, destination groups, and connections.
    - id: pipeline_inventory
      type: entity_family
      title: Destinations, connections, connector metadata, and transformations
      families: [destinations, connections, connector_metadata, transformations]
      support: supported
      high_value: true
      evidence_types: [source_snapshot, configuration_state]
      control_domains: [asset_inventory, data_governance]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: CM-8
        - framework_name: SOC 2
          control_id: CC7.1
      notes:
        - Reads pipeline inventory, source connector metadata, destination configuration, connection status, paused state, sync cadence, and transformation records through Fivetran list APIs.
    - id: trust_and_connectivity_controls
      type: entity_family
      title: Connection trust and private connectivity
      families: [connection_certificates, connection_fingerprints, private_links, proxy_agents, hybrid_deployment_agents]
      support: supported
      high_value: true
      evidence_types: [configuration_state, source_snapshot]
      control_domains: [network_security, asset_inventory]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: SC-7
        - framework_name: "NIST 800-53 r5"
          control_id: SC-12
        - framework_name: "PCI DSS v4.0.1"
          control_id: "1.2"
      notes:
        - Collects approved connection certificates, SSH fingerprints, private links, proxy agents, and hybrid deployment agents for review of trusted endpoints and private network paths.
    - id: logging_and_webhook_controls
      type: lifecycle_state
      title: Log service and webhook configuration
      families: [log_services, webhooks]
      support: supported
      high_value: true
      evidence_types: [logging_configuration, configuration_state]
      control_domains: [logging_monitoring, change_management]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: AU-2
        - framework_name: "NIST 800-53 r5"
          control_id: AU-6
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Reads external logging services and webhook subscriptions so teams can review whether Fivetran events and sync outcomes are routed to operational systems.
    - id: api_credentials
      type: app_entitlement
      title: System key inventory
      families: [system_keys]
      support: supported
      high_value: true
      evidence_types: [credential_inventory]
      control_domains: [identity_access, authorization]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: IA-5
        - framework_name: "PCI DSS v4.0.1"
          control_id: "8.6"
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Reads system key metadata and redacts `key` and `secret` from stored raw payloads before emitting source events.
    - id: incremental_sync
      type: incremental_sync
      title: Cursor sync
      families: [users, user_connections, user_groups, roles, teams, team_users, team_connections, team_groups, groups, group_users, group_connections, destinations, connections, connection_certificates, connection_fingerprints, log_services, webhooks, private_links, proxy_agents, hybrid_deployment_agents, connector_metadata, system_keys, transformations]
      support: supported
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: AU-12
      notes:
        - Every list runtime follows Fivetran `data.next_cursor` and sends that value as the next `cursor` query parameter with bounded `limit` page sizes.
