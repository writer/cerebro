id: fivetran
name: "Fivetran"
description: "Fivetran account, access, pipeline, destination, trust, logging, private connectivity, connector metadata, system key, and transformation source. The runtime reads the Fivetran REST API with Basic API key authentication, follows `data.items` cursor pagination, applies v2 Accept headers only to connection and destination list routes, redacts system key material from raw event payloads, and emits graph-ready users, groups, roles, memberships, pipeline assets, network trust controls, logging targets, credentials, and transformation records."
emitted_kinds:
  - fivetran.users
  - fivetran.user_connections
  - fivetran.user_groups
  - fivetran.roles
  - fivetran.teams
  - fivetran.team_users
  - fivetran.team_connections
  - fivetran.team_groups
  - fivetran.groups
  - fivetran.group_users
  - fivetran.group_connections
  - fivetran.destinations
  - fivetran.connections
  - fivetran.connection_certificates
  - fivetran.connection_fingerprints
  - fivetran.log_services
  - fivetran.webhooks
  - fivetran.private_links
  - fivetran.proxy_agents
  - fivetran.hybrid_deployment_agents
  - fivetran.connector_metadata
  - fivetran.system_keys
  - fivetran.transformations
provider_api:
  status: verified
  transport: rest
  auth: basic
  base_url: https://api.fivetran.com
  references:
    - https://fivetran.com/assets-docs/openapi/file_v1.json
    - https://fivetran.com/docs/rest-api
    - https://fivetran.com/docs/rest-api/getting-started
    - https://fivetran.com/docs/rest-api/getting-started/pagination
    - https://fivetran.com/docs/rest-api/getting-started/system-keys
    - https://fivetran.com/docs/rest-api/api-reference/users/list-all-users
    - https://fivetran.com/docs/rest-api/api-reference/roles/list-all-roles
    - https://fivetran.com/docs/rest-api/api-reference/teams
    - https://fivetran.com/docs/rest-api/api-reference/groups
    - https://fivetran.com/docs/rest-api/api-reference/destinations/list-destinations
    - https://fivetran.com/docs/rest-api/api-reference/connections/list-connections
    - https://github.com/fivetran/go-fivetran
  pagination:
    type: cursor
    cursor_param: cursor
    page_size_param: limit
    response_cursor: data.next_cursor
    response_items: data.items
  families:
    - id: users
      method: GET
      path: /v1/users
      response: data.items
      pagination: cursor
    - id: user_connections
      method: GET
      path: /v1/users/{user_id}/connections
      response: data.items
      pagination: cursor
      path_params: [user_id]
    - id: user_groups
      method: GET
      path: /v1/users/{user_id}/groups
      response: data.items
      pagination: cursor
      path_params: [user_id]
    - id: roles
      method: GET
      path: /v1/roles
      response: data.items
      pagination: cursor
    - id: teams
      method: GET
      path: /v1/teams
      response: data.items
      pagination: cursor
    - id: team_users
      method: GET
      path: /v1/teams/{team_id}/users
      response: data.items
      pagination: cursor
      path_params: [team_id]
    - id: team_connections
      method: GET
      path: /v1/teams/{team_id}/connections
      response: data.items
      pagination: cursor
      path_params: [team_id]
    - id: team_groups
      method: GET
      path: /v1/teams/{team_id}/groups
      response: data.items
      pagination: cursor
      path_params: [team_id]
    - id: groups
      method: GET
      path: /v1/groups
      response: data.items
      pagination: cursor
    - id: group_users
      method: GET
      path: /v1/groups/{group_id}/users
      response: data.items
      pagination: cursor
      path_params: [group_id]
    - id: group_connections
      method: GET
      path: /v1/groups/{group_id}/connections
      response: data.items
      pagination: cursor
      path_params: [group_id]
    - id: destinations
      method: GET
      path: /v1/destinations
      response: data.items
      pagination: cursor
      headers:
        Accept: application/json;version=2
    - id: connections
      method: GET
      path: /v1/connections
      response: data.items
      pagination: cursor
      headers:
        Accept: application/json;version=2
    - id: connection_certificates
      method: GET
      path: /v1/connections/{connection_id}/certificates
      response: data.items
      pagination: cursor
      path_params: [connection_id]
    - id: connection_fingerprints
      method: GET
      path: /v1/connections/{connection_id}/fingerprints
      response: data.items
      pagination: cursor
      path_params: [connection_id]
    - id: log_services
      method: GET
      path: /v1/external-logging
      response: data.items
      pagination: cursor
    - id: webhooks
      method: GET
      path: /v1/webhooks
      response: data.items
      pagination: cursor
    - id: private_links
      method: GET
      path: /v1/private-links
      response: data.items
      pagination: cursor
    - id: proxy_agents
      method: GET
      path: /v1/proxy
      response: data.items
      pagination: cursor
    - id: hybrid_deployment_agents
      method: GET
      path: /v1/hybrid-deployment-agents
      response: data.items
      pagination: cursor
    - id: connector_metadata
      method: GET
      path: /v1/metadata/connector-types
      response: data.items
      pagination: cursor
    - id: system_keys
      method: GET
      path: /v1/system-keys
      response: data.items
      pagination: cursor
      payload_redaction: [key, secret]
    - id: transformations
      method: GET
      path: /v1/transformations
      response: data.items
      pagination: cursor
