coverage_contract:
  owner_domain: compliance
  authority_domain: grc
  dimensions:
    - id: frameworks
      type: entity_family
      title: GRC frameworks
      families: [framework]
      support: supported
      high_value: true
      evidence_types: [control_catalog]
      control_domains: [compliance_operations]
    - id: controls
      type: entity_family
      title: GRC controls
      families: [control]
      support: supported
      high_value: true
      evidence_types: [control_catalog]
      control_domains: [compliance_operations]
    - id: control_tests
      type: lifecycle_state
      title: Control test status
      families: [control_test]
      support: supported
      high_value: true
      evidence_types: [control_assessment]
      control_domains: [compliance_operations]
    - id: policies
      type: entity_family
      title: Policies and documents
      families: [policy, document]
      support: supported
      high_value: true
      evidence_types: [policy_document]
      control_domains: [compliance_operations]
    - id: contracts
      type: entity_family
      title: Third-party contracts and obligations
      families: [contract]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: security_reviews
      type: lifecycle_state
      title: Security review status
      families: [security_review]
      support: supported
      high_value: true
      evidence_types: [third_party_risk, security_review]
      control_domains: [vendor_risk]
    - id: security_questionnaires
      type: lifecycle_state
      title: Security questionnaire status
      families: [security_questionnaire]
      support: supported
      high_value: true
      evidence_types: [questionnaire_response, assurance_package]
      control_domains: [customer_assurance, compliance_operations]
    - id: penetration_tests
      type: lifecycle_state
      title: Penetration test status
      families: [penetration_test]
      support: supported
      high_value: true
      evidence_types: [penetration_test, vulnerability_management]
      control_domains: [vulnerability_management, security_operations]
    - id: assurance_documents
      type: entity_family
      title: Uploaded assurance documents
      families: [assurance_document]
      support: supported
      high_value: true
      evidence_types: [assurance_package, policy_document, source_snapshot]
      control_domains: [customer_assurance, compliance_operations]
    - id: regulatory_notifications
      type: lifecycle_state
      title: Regulatory notification status
      families: [regulatory_notification]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
    - id: recovery_objectives
      type: entity_family
      title: Recovery objectives and BIA records
      families: [recovery_objective]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: authorization_packages
      type: entity_family
      title: Authorization packages and ATO records
      families: [authorization_package]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: poam_items
      type: lifecycle_state
      title: POA&M weakness remediation items
      families: [poam_item]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
    - id: training_attestations
      type: lifecycle_state
      title: Security training attestations
      families: [training_attestation]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
    - id: discovered_vendors
      type: lifecycle_state
      title: Discovered vendors
      families: [discovered_vendor]
      support: supported
      high_value: true
      evidence_types: [third_party_risk]
      control_domains: [vendor_risk]
    - id: audit_event_logs
      type: lifecycle_state
      title: GRC audit event logs
      families: [event_log]
      support: supported
      high_value: true
      evidence_types: [audit_event]
      control_domains: [security_operations]
    - id: groups
      type: entity_family
      title: GRC groups
      families: [group]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
    - id: vendor_risk_attributes
      type: entity_family
      title: Vendor risk attributes
      families: [vendor_risk_attribute]
      support: supported
      high_value: true
      evidence_types: [third_party_risk]
      control_domains: [vendor_risk]
    - id: vendors
      type: entity_family
      title: Vendors
      families: [vendor]
      support: supported
      high_value: true
      evidence_types: [third_party_risk]
      control_domains: [vendor_risk]
    - id: vulnerabilities
      type: entity_family
      title: Vulnerabilities
      families: [vulnerability]
      support: supported
      high_value: true
      evidence_types: [vulnerability_management]
      control_domains: [vulnerability_management]
    - id: vulnerability_remediations
      type: lifecycle_state
      title: Vulnerability remediation status
      families: [vulnerability_remediation]
      support: supported
      high_value: true
      evidence_types: [vulnerability_management]
      control_domains: [vulnerability_management]
    - id: vulnerable_assets
