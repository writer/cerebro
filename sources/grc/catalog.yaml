      families: [vulnerable_asset]
      support: supported
      high_value: true
      evidence_types: [relationship_evidence, vulnerability_management]
      control_domains: [vulnerability_management]
    - id: monitored_computers
      type: entity_family
      title: Monitored endpoint computers
      families: [monitored_computer]
      support: supported
      high_value: true
      evidence_types: [device_posture, configuration_state]
      control_domains: [endpoint_security, device_management]
    - id: risk_scenarios
      type: entity_family
      title: Risk scenarios
      families: [risk_scenario]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: people
      type: entity_family
      title: People and users
      families: [person, user]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: integrations
      type: entity_family
      title: GRC integrations
      families: [integration]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
