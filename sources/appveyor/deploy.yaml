sourceId: appveyor
secretKeys:
  - APPVEYOR_JOBID
  - APPVEYOR_API_TOKEN
runtimes:
  - localId: role
    config:
      jobid: env:APPVEYOR_JOBID
      family: role
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /roles
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:APPVEYOR_API_TOKEN
