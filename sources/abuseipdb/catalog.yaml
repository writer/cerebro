id: abuseipdb
name: "AbuseIPDB"
description: "Collects AbuseIPDB report history and blacklist IP reputation snapshots, then projects them into the Cerebro graph as findings and threat-intelligence assets for alert, incident, service health, and response context."
emitted_kinds:
  - abuseipdb.reports
  - abuseipdb.ip_addresses
runtime_families:
  - ip_addresses
  - reports
kind_lifecycle:
  - kind: abuseipdb.reports
    status: active
  - kind: abuseipdb.ip_addresses
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: key_header
  base_url: https://api.abuseipdb.com/api/v2
  spec_url: https://raw.githubusercontent.com/api-evangelist/abuseipdb/main/openapi/abuseipdb-apiv2-openapi.yml
  spec_kind: openapi
  references:
    - https://docs.abuseipdb.com/
    - https://www.abuseipdb.com/api.html
  families:
    - id: ip_addresses
      method: GET
      path: /blacklist
      operation: getBlacklist
    - id: reports
      method: GET
      path: /reports
      operation: listReports
coverage_contract:
  owner_domain: source_runtime
  authority_domain: abuseipdb
  dimensions:
    - id: ip_addresses
      type: entity_family
      title: "Blacklist IP addresses"
      families: [ip_addresses]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads documented AbuseIPDB blacklist entries from GET /blacklist.
    - id: reports
      type: remediation_state
      title: "Reports"
      families: [reports]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Reads documented AbuseIPDB report history for a configured IP address from GET /reports.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: abuseipdb.reports
    schema_ref: abuseipdb/reports/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - reportedAt
  - kind: abuseipdb.ip_addresses
    schema_ref: abuseipdb/ip_addresses/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - ipAddress
