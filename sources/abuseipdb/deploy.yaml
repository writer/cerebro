sourceId: abuseipdb
secretKeys:
  - ABUSEIPDB_API_TOKEN
runtimes:
  - localId: reports
    config:
      family: reports
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /blacklist
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:ABUSEIPDB_API_TOKEN
