id: statuspage
name: "Statuspage"
description: "Collects users, tickets, and audit events from Statuspage and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - statuspage.users
  - statuspage.tickets
  - statuspage.audit_events
kind_lifecycle:
  - kind: statuspage.users
    status: active
  - kind: statuspage.tickets
    status: active
  - kind: statuspage.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: statuspage
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: tickets
      type: entity_family
      title: "Tickets"
      families: [tickets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: statuspage.users
    schema_ref: statuspage/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: statuspage.tickets
    schema_ref: statuspage/tickets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: statuspage.audit_events
    schema_ref: statuspage/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
