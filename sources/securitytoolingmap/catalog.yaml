id: security_tooling_map
name: Security Tooling Map
description: Security and GRC tooling inventory source.
emitted_kinds:
  - security_tooling_map.tool
  - security_tooling_map.control_mapping
coverage_contract:
  owner_domain: security
  authority_domain: security_tooling_map
  dimensions:
    - id: tools
      type: entity_family
      title: Security and GRC tools
      families: [tool]
      support: supported
      high_value: true
    - id: control_mappings
      type: relationship
      title: Tool to control mappings
      families: [control_mapping]
      support: supported
      high_value: true
event_contracts:
  - kind: security_tooling_map.tool
    schema_ref: security_tooling_map/tool/v1
    required_attributes:
      - tool_id
      - name
    required_payload_fields:
      - id
      - name
  - kind: security_tooling_map.control_mapping
    schema_ref: security_tooling_map/control_mapping/v1
    required_attributes:
      - tool_id
      - control_id
    required_payload_fields:
      - tool_id
      - control_id
