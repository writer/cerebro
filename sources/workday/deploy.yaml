sourceId: workday
secretKeys:
  - WORKDAY_CLIENT_ID
  - WORKDAY_CLIENT_SECRET
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /ccx/api/v1/${config.tenant}/workers
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:WORKDAY_CLIENT_ID
      client_secret: env:WORKDAY_CLIENT_SECRET
