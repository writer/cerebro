sourceId: gitea
secretKeys:
  - GITEA_INDEX
  - GITEA_OWNER
  - GITEA_REPO
  - GITEA_API_TOKEN
runtimes:
  - localId: search
    config:
      index: env:GITEA_INDEX
      owner: env:GITEA_OWNER
      repo: env:GITEA_REPO
      family: search
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /repos/issues/search
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:GITEA_API_TOKEN
