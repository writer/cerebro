sourceId: adobe_workfront
secretKeys:
  - ADOBE_WORKFRONT_BASE_URL
  - ADOBE_WORKFRONT_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:ADOBE_WORKFRONT_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /info
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ADOBE_WORKFRONT_TOKEN
