sourceId: slideroom
secretKeys:
  - SLIDEROOM_TOKEN
runtimes:
  - localId: name
    config:
      token: env:SLIDEROOM_TOKEN
      family: name
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v2/applicant/attributes/names
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
