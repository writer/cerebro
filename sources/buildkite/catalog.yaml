id: buildkite
name: "Buildkite"
description: "Collects pipelines, findings, and audit events from Buildkite and projects them into the Cerebro graph as assets, findings, and audit events for repository, build, deployment, and release context."
emitted_kinds:
  - buildkite.pipelines
  - buildkite.findings
  - buildkite.audit_events
runtime_families:
  - audit_events
  - findings
  - pipelines
kind_lifecycle:
  - kind: buildkite.pipelines
    status: active
  - kind: buildkite.findings
    status: active
  - kind: buildkite.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: buildkite
  dimensions:
    - id: pipelines
      type: entity_family
      title: "Pipelines"
      families: [pipelines]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: buildkite.pipelines
    schema_ref: buildkite/pipelines/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: buildkite.findings
    schema_ref: buildkite/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: buildkite.audit_events
    schema_ref: buildkite/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
