id: clearblade
name: "ClearBlade"
description: "Collects system, user, deployment, connection, platform system, and audit from ClearBlade and projects them into the Cerebro graph as assets, audit events, deployments, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - clearblade.system
  - clearblade.user
  - clearblade.deployment
  - clearblade.connection
  - clearblade.platform_system
  - clearblade.audit
  - clearblade.timer
  - clearblade.topic
  - clearblade.trigger
  - clearblade.session_user
  - clearblade.listindexe
  - clearblade.admin_audit
kind_lifecycle:
  - kind: clearblade.system
    status: active
  - kind: clearblade.user
    status: active
  - kind: clearblade.deployment
    status: active
  - kind: clearblade.connection
    status: active
  - kind: clearblade.platform_system
    status: active
  - kind: clearblade.audit
    status: active
  - kind: clearblade.timer
    status: active
  - kind: clearblade.topic
    status: active
  - kind: clearblade.trigger
    status: active
  - kind: clearblade.session_user
    status: active
  - kind: clearblade.listindexe
    status: active
  - kind: clearblade.admin_audit
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: clearblade
  dimensions:
    - id: system
      type: audit_event
      title: "System"
      families: [system]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user
      type: entity_family
      title: "User"
