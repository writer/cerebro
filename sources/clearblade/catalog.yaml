event_contracts:
  - kind: clearblade.system
    schema_ref: clearblade/system/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - name
  - kind: clearblade.user
    schema_ref: clearblade/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - email
  - kind: clearblade.deployment
    schema_ref: clearblade/deployment/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - name
  - kind: clearblade.connection
    schema_ref: clearblade/connection/v1
