sourceId: gitguardian
secretKeys:
  - GITGUARDIAN_API_TOKEN
runtimes:
  - localId: incidents
    config:
      family: incidents
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/health
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:GITGUARDIAN_API_TOKEN
  - localId: members
    config:
      family: members
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/health
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:GITGUARDIAN_API_TOKEN
  - localId: audit_events
    config:
      family: audit_events
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/health
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:GITGUARDIAN_API_TOKEN
