id: gitguardian
name: "GitGuardian"
description: "Collects incidents, members, and audit events from GitGuardian and projects them into the Cerebro graph as findings, users, and audit events for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - gitguardian.incidents
  - gitguardian.members
  - gitguardian.audit_events
runtime_families:
  - audit_events
  - incidents
  - members
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: authorization_token_header
  base_url: https://api.gitguardian.com/v1
  spec_url: https://docs.gitguardian.com/api-docs/api-reference
  spec_kind: openapi_embedded_html
  references:
    - https://api.gitguardian.com/docs
    - https://docs.gitguardian.com/api-docs/api-reference
    - https://docs.gitguardian.com/api-docs/authentication
    - https://docs.gitguardian.com/api-docs/pagination
  auth_evidence:
    - https://docs.gitguardian.com/api-docs/authentication
  scope_evidence:
    - https://docs.gitguardian.com/api-docs/authentication
  families:
    - id: audit_events
      method: GET
      path: /audit_logs
    - id: incidents
      method: GET
      path: /incidents/secrets
    - id: members
      method: GET
      path: /members
kind_lifecycle:
  - kind: gitguardian.incidents
    status: active
  - kind: gitguardian.members
    status: active
  - kind: gitguardian.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: gitguardian
  dimensions:
    - id: incidents
      type: remediation_state
      title: "Incidents"
      families: [incidents]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: SOC 2
          control_id: CC7.5
      notes:
        - Maps GitGuardian secret incident list records from `/v1/incidents/secrets`.
        - Cerebro finding assignment, exception, SLA, and approval state remain owned by the finding workflow surfaces.
    - id: members
      type: entity_family
      title: "Members"
      families: [members]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "CIS Controls v8"
          control_id: "5"
      notes:
        - Maps workspace member records from `/v1/members` for owner, manager, member, and restricted access review.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
      notes:
        - Maps workspace audit log records from `/v1/audit_logs` with actor, action, target, and timestamp fields.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: gitguardian.incidents
    schema_ref: gitguardian/incidents/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: gitguardian.members
    schema_ref: gitguardian/members/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: gitguardian.audit_events
    schema_ref: gitguardian/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
