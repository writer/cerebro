id: gitguardian
name: "GitGuardian"
description: "Collects incidents, members, and audit events from GitGuardian and projects them into the Cerebro graph as findings, users, and audit events for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - gitguardian.incidents
  - gitguardian.members
  - gitguardian.audit_events
kind_lifecycle:
  - kind: gitguardian.incidents
    status: active
  - kind: gitguardian.members
    status: active
  - kind: gitguardian.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: gitguardian
  dimensions:
    - id: incidents
      type: entity_family
      title: "Incidents"
      families: [incidents]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: members
      type: entity_family
      title: "Members"
      families: [members]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: gitguardian.incidents
    schema_ref: gitguardian/incidents/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: gitguardian.members
    schema_ref: gitguardian/members/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: gitguardian.audit_events
    schema_ref: gitguardian/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
