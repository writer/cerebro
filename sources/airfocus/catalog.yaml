id: airfocus
name: "Airfocus"
description: "Collects users, workspaces, workspace groups, item link types, and API keys from Airfocus and projects them into the Cerebro graph as identities and product-management assets."
emitted_kinds:
  - airfocus.users
  - airfocus.workspaces
  - airfocus.workspace_groups
  - airfocus.link_types
  - airfocus.api_keys
runtime_families:
  - api_keys
  - link_types
  - users
  - workspace_groups
  - workspaces
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: authorization_bearer_header_personal_access_token
  base_url: ${config.base_url}
  spec_url: https://developer.airfocus.com/openapi.json
  spec_kind: openapi
  references:
    - https://developer.airfocus.com/
    - https://developer.airfocus.com/endpoints
    - https://developer.airfocus.com/authentication
    - https://help.airfocus.com/en/articles/9009544-api
  families:
    - id: api_keys
      method: GET
      path: /api/profile/api-keys
      operation: listApiKeys
    - id: link_types
      method: POST
      path: /api/link-types/search
      operation: searchItemLinkTypes
    - id: users
      method: GET
      path: /api/team/users
      operation: listUsers
    - id: workspace_groups
      method: POST
      path: /api/workspaces/groups/search
      operation: searchWorkspaceGroups
    - id: workspaces
      method: POST
      path: /api/workspaces/search
      operation: searchWorkspaces
kind_lifecycle:
  - kind: airfocus.users
    status: active
  - kind: airfocus.workspaces
    status: active
  - kind: airfocus.workspace_groups
    status: active
  - kind: airfocus.link_types
    status: active
  - kind: airfocus.api_keys
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: airfocus
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads team users from the documented GET /api/team/users endpoint.
    - id: workspaces
      type: entity_family
      title: "Workspaces"
      families: [workspaces]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads product workspaces from the documented POST /api/workspaces/search endpoint.
    - id: workspace_groups
      type: entity_family
      title: "Workspace Groups"
      families: [workspace_groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads workspace groups from the documented POST /api/workspaces/groups/search endpoint.
    - id: link_types
      type: entity_family
      title: "Item Link Types"
      families: [link_types]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads custom item link types from the documented POST /api/link-types/search endpoint.
    - id: api_keys
      type: entity_family
      title: "API Keys"
      families: [api_keys]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      notes:
        - Reads personal access token metadata from the documented GET /api/profile/api-keys endpoint.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: airfocus.users
    schema_ref: airfocus/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: airfocus.workspaces
    schema_ref: airfocus/workspaces/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: airfocus.workspace_groups
    schema_ref: airfocus/workspace_groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: airfocus.link_types
    schema_ref: airfocus/link_types/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: airfocus.api_keys
    schema_ref: airfocus/api_keys/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
