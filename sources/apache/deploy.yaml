sourceId: apache
secretKeys:
  - APACHE_TOKEN
runtimes:
  - localId: eventlog
    config:
      family: eventlog
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /eventLogs
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:APACHE_TOKEN
