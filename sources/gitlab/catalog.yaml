id: gitlab
name: "GitLab"
description: "Collects repositories, users, and audit events from GitLab and projects them into the Cerebro graph as repositories, users, and audit events for repository, build, deployment, and release context."
provider_api:
  status: verified
  transport: rest
  auth: bearer_token
  base_url: https://gitlab.com
  references:
    - https://github.com/gitlabhq/gitlabhq/blob/master/doc/api/openapi/openapi_v3.yaml
    - https://docs.gitlab.com/api/rest/
    - https://docs.gitlab.com/api/rest/authentication/
  families:
    - id: repositories
      method: GET
      path: /api/v4/projects
    - id: users
      method: GET
      path: /api/v4/users
    - id: audit_events
      method: GET
      path: /api/v4/audit_events
emitted_kinds:
  - gitlab.repositories
  - gitlab.users
  - gitlab.audit_events
runtime_families:
  - repositories
  - users
  - audit_events
kind_lifecycle:
  - kind: gitlab.repositories
    status: active
  - kind: gitlab.users
    status: active
  - kind: gitlab.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: gitlab
  dimensions:
    - id: repositories
      type: entity_family
      title: "Repositories"
      families: [repositories]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: gitlab.repositories
    schema_ref: gitlab/repositories/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: gitlab.users
    schema_ref: gitlab/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: gitlab.audit_events
    schema_ref: gitlab/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
