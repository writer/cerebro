id: gitlab
name: "GitLab"
description: "Collects repositories, users, and audit events from GitLab and projects them into the Cerebro graph as repositories, users, and audit events for repository, build, deployment, and release context."
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-03T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: bearer_token_or_private_token
  base_url: https://gitlab.com
  spec_url: https://raw.githubusercontent.com/gitlabhq/gitlabhq/master/doc/api/openapi/openapi_v3.yaml
  spec_kind: openapi
  references:
    - https://github.com/gitlabhq/gitlabhq/blob/master/doc/api/openapi/openapi_v3.yaml
    - https://docs.gitlab.com/api/rest/
    - https://docs.gitlab.com/api/rest/authentication/
  families:
    - id: repositories
      method: GET
      path: /api/v4/projects
    - id: users
      method: GET
      path: /api/v4/users
    - id: audit_events
      method: GET
      path: /api/v4/audit_events
emitted_kinds:
  - gitlab.repositories
  - gitlab.users
  - gitlab.audit_events
runtime_families:
  - repositories
  - users
  - audit_events
kind_lifecycle:
  - kind: gitlab.repositories
    status: active
  - kind: gitlab.users
    status: active
  - kind: gitlab.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: gitlab
  dimensions:
    - id: repositories
      type: entity_family
      title: "Repositories"
      families: [repositories]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "NIST 800-53 r5"
          control_id: AC-3
        - framework_name: "NIST 800-53 r5"
          control_id: CM-6
        - framework_name: "NIST 800-53 r5"
          control_id: CM-8
        - framework_name: "CIS Controls v8"
          control_id: "1"
        - framework_name: "CIS Controls v8"
          control_id: "2"
        - framework_name: "CIS Controls v8"
          control_id: "4"
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "NIST 800-53 r5"
          control_id: AC-3
        - framework_name: "NIST 800-53 r5"
          control_id: CM-6
        - framework_name: "NIST 800-53 r5"
          control_id: CM-8
        - framework_name: "CIS Controls v8"
          control_id: "1"
        - framework_name: "CIS Controls v8"
          control_id: "2"
        - framework_name: "CIS Controls v8"
          control_id: "4"
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "NIST 800-53 r5"
          control_id: AU-2
        - framework_name: "NIST 800-53 r5"
          control_id: AU-6
        - framework_name: "NIST 800-53 r5"
          control_id: SI-4
        - framework_name: "CIS Controls v8"
          control_id: "8"
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
event_contracts:
  - kind: gitlab.repositories
    schema_ref: gitlab/repositories/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: gitlab.users
    schema_ref: gitlab/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: gitlab.audit_events
    schema_ref: gitlab/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
