sourceId: microsoft_defender_for_endpoint
secretKeys:
  - MICROSOFT_DEFENDER_FOR_ENDPOINT_CLIENT_ID
  - MICROSOFT_DEFENDER_FOR_ENDPOINT_CLIENT_SECRET
runtimes:
  - localId: endpoint-devices
    config:
      family: endpoint_devices
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/machines
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:MICROSOFT_DEFENDER_FOR_ENDPOINT_CLIENT_ID
      client_secret: env:MICROSOFT_DEFENDER_FOR_ENDPOINT_CLIENT_SECRET
