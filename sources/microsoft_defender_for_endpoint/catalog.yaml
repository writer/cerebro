id: microsoft_defender_for_endpoint
name: "Microsoft Defender for Endpoint"
description: "Collects endpoint devices, findings, and vulnerabilities from Microsoft Defender for Endpoint and projects them into the Cerebro graph as devices, findings, and vulnerabilities for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - microsoft_defender_for_endpoint.endpoint_devices
  - microsoft_defender_for_endpoint.findings
  - microsoft_defender_for_endpoint.vulnerabilities
kind_lifecycle:
  - kind: microsoft_defender_for_endpoint.endpoint_devices
    status: active
  - kind: microsoft_defender_for_endpoint.findings
    status: active
  - kind: microsoft_defender_for_endpoint.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: microsoft_defender_for_endpoint
  dimensions:
    - id: endpoint_devices
      type: entity_family
      title: "Endpoint Devices"
      families: [endpoint_devices]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: microsoft_defender_for_endpoint.endpoint_devices
    schema_ref: microsoft_defender_for_endpoint/endpoint_devices/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: microsoft_defender_for_endpoint.findings
    schema_ref: microsoft_defender_for_endpoint/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: microsoft_defender_for_endpoint.vulnerabilities
    schema_ref: microsoft_defender_for_endpoint/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
