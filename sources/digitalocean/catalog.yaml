id: digitalocean
name: "DigitalOcean"
description: "Collects droplets, teams, and audit events from DigitalOcean and projects them into the Cerebro graph as cloud resources, groups, and audit events for repository, build, deployment, and release context."
emitted_kinds:
  - digitalocean.droplets
  - digitalocean.teams
  - digitalocean.audit_events
runtime_families:
  - audit_events
  - droplets
  - teams
kind_lifecycle:
  - kind: digitalocean.droplets
    status: active
  - kind: digitalocean.teams
    status: active
  - kind: digitalocean.audit_events
    status: active
provider_api_disproof:
  status: invalidated
  reason: runtime_families_not_in_provider_spec
  checked_at: 2026-07-04T00:00:00Z
  references:
    - https://api-engineering.nyc3.digitaloceanspaces.com/spec-ci/DigitalOcean-public.v2.yaml
    - https://github.com/digitalocean/openapi
  affected_families:
    - audit_events
    - teams
  missing_paths:
    - /v2/teams
  notes:
    - The public v2 OpenAPI lists /v2/droplets and /v2/actions, but no teams collection.
    - The /v2/actions collection returns provider action records, not actor-scoped audit events, so audit_events needs a rewrite as actions or removal.
coverage_contract:
  owner_domain: source_runtime
  authority_domain: digitalocean
  dimensions:
    - id: droplets
      type: entity_family
      title: "Droplets"
      families: [droplets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: teams
      type: entity_family
      title: "Teams"
      families: [teams]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: digitalocean.droplets
    schema_ref: digitalocean/droplets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: digitalocean.teams
    schema_ref: digitalocean/teams/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: digitalocean.audit_events
    schema_ref: digitalocean/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
