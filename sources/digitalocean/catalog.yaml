id: digitalocean
name: "DigitalOcean"
description: "Collects droplets, VPCs, and firewalls from DigitalOcean through the official godo SDK and projects them into the Cerebro graph as cloud compute, network, and security assets with droplet-to-VPC and firewall-to-droplet reachability edges."
emitted_kinds:
  - digitalocean.droplets
  - digitalocean.firewalls
  - digitalocean.vpcs
runtime_families:
  - droplets
  - firewalls
  - vpcs
kind_lifecycle:
  - kind: digitalocean.droplets
    status: active
  - kind: digitalocean.firewalls
    status: active
  - kind: digitalocean.vpcs
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: authorization_bearer_header
  base_url: https://api.digitalocean.com/v2
  spec_url: https://api-engineering.nyc3.digitaloceanspaces.com/spec-ci/DigitalOcean-public.v2.yaml
  spec_kind: openapi
  references:
    - https://docs.digitalocean.com/reference/api/api-reference/
    - https://api-engineering.nyc3.digitaloceanspaces.com/spec-ci/DigitalOcean-public.v2.yaml
    - https://docs.digitalocean.com/reference/api/api-reference/#tag/Droplets
    - https://docs.digitalocean.com/reference/api/api-reference/#tag/VPCs
    - https://docs.digitalocean.com/reference/api/api-reference/#tag/Firewalls
  auth_evidence:
    - https://docs.digitalocean.com/reference/api/intro/
  families:
    - id: droplets
      method: GET
      path: /v2/droplets
      operation: droplets_list
    - id: vpcs
      method: GET
      path: /v2/vpcs
      operation: vpcs_list
    - id: firewalls
      method: GET
      path: /v2/firewalls
      operation: firewalls_list
coverage_contract:
  owner_domain: source_runtime
  authority_domain: digitalocean
  dimensions:
    - id: droplets
      type: entity_family
      title: "Droplets"
      families: [droplets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Droplets from /v2/droplets via godo and carries vpc_uuid for droplet-to-VPC edges.
    - id: vpcs
      type: entity_family
      title: "VPCs"
      families: [vpcs]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads VPCs from /v2/vpcs via godo as network assets.
    - id: firewalls
      type: entity_family
      title: "Firewalls"
      families: [firewalls]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Firewalls from /v2/firewalls via godo and derives firewall-to-droplet reachability from inbound rules.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: digitalocean.droplets
    schema_ref: digitalocean/droplets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: digitalocean.vpcs
    schema_ref: digitalocean/vpcs/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: digitalocean.firewalls
    schema_ref: digitalocean/firewalls/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
