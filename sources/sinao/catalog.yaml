id: sinao
name: "Sinao"
description: "Collects product, account, organization, rule, access, and productcategory from Sinao and projects them into the Cerebro graph as assets, audit events, groups, policies, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - sinao.product
  - sinao.account
  - sinao.organization
  - sinao.rule
  - sinao.access
  - sinao.productcategory
  - sinao.productstock
  - sinao.accountcategory
  - sinao.accounting_entry
  - sinao.person
  - sinao.invite
  - sinao.apps_organization
kind_lifecycle:
  - kind: sinao.product
    status: active
  - kind: sinao.account
    status: active
  - kind: sinao.organization
    status: active
  - kind: sinao.rule
    status: active
  - kind: sinao.access
    status: active
  - kind: sinao.productcategory
    status: active
  - kind: sinao.productstock
    status: active
  - kind: sinao.accountcategory
    status: active
  - kind: sinao.accounting_entry
    status: active
  - kind: sinao.person
    status: active
  - kind: sinao.invite
    status: active
  - kind: sinao.apps_organization
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: sinao
  dimensions:
    - id: product
      type: audit_event
      title: "Product"
      families: [product]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
