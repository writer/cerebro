sourceId: sinao
secretKeys:
  - SINAO_APPID
  - SINAO_TOKEN
runtimes:
  - localId: product
    config:
      appid: env:SINAO_APPID
      family: product
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /apps/${config.appid}/products
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:SINAO_TOKEN
