sourceId: redirection_io
secretKeys:
  - REDIRECTION_IO_API_TOKEN
runtimes:
  - localId: aggregate-log
    config:
      family: aggregate_log
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /aggregate-logs
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:REDIRECTION_IO_API_TOKEN
