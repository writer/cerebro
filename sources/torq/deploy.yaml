sourceId: torq
secretKeys:
  - TORQ_CLIENT_ID
  - TORQ_CLIENT_SECRET
runtimes:
  - localId: audit-events
    config:
      family: audit_events
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/users/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:TORQ_CLIENT_ID
      client_secret: env:TORQ_CLIENT_SECRET
