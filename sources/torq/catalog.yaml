id: torq
name: "Torq"
description: "Collects workflow events, cases, and assets from Torq and projects them into the Cerebro graph as audit events, findings, and assets for alert, incident, service health, and response context."
emitted_kinds:
  - torq.audit_events
  - torq.findings
  - torq.assets
runtime_families:
  - assets
  - audit_events
  - findings
kind_lifecycle:
  - kind: torq.audit_events
    status: active
  - kind: torq.findings
    status: active
  - kind: torq.assets
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: torq
  dimensions:
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: torq.audit_events
    schema_ref: torq/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: torq.findings
    schema_ref: torq/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: torq.assets
    schema_ref: torq/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
