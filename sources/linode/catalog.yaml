id: linode
name: "Linode"
description: "Akamai Linode cloud computing platform."
emitted_kinds:
  - linode.issue
  - linode.event
  - linode.credential
  - linode.user
kind_lifecycle:
  - kind: linode.issue
    status: active
  - kind: linode.event
    status: active
  - kind: linode.credential
    status: active
  - kind: linode.user
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: linode
  dimensions:
    - id: issue
      type: entity_family
      title: "Issue"
      families: [issue]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: event
      type: entity_family
      title: "Event"
      families: [event]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: credential
      type: entity_family
      title: "Credential"
      families: [credential]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user
      type: entity_family
      title: "User"
      families: [user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
event_contracts:
  - kind: linode.issue
    schema_ref: linode/issue/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: linode.event
    schema_ref: linode/event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: linode.credential
    schema_ref: linode/credential/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: linode.user
    schema_ref: linode/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - email
