sourceId: svix
secretKeys:
  - SVIX_API_BASE_URL
  - SVIX_APP_ID
  - SVIX_ENDPOINT_ID
  - SVIX_MSG_ID
  - SVIX_TOKEN
runtimes:
  - localId: event-type
    config:
      api_base_url: env:SVIX_API_BASE_URL
      app_id: env:SVIX_APP_ID
      endpoint_id: env:SVIX_ENDPOINT_ID
      msg_id: env:SVIX_MSG_ID
      family: event_type
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v1/event-type/
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:SVIX_TOKEN
