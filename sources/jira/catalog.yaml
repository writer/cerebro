id: jira
name: "Jira"
description: "Collects Jira Cloud users, groups, group membership, projects, project role assignments, permission schemes, and audit records from the Jira REST API."
emitted_kinds:
  - jira.users
  - jira.groups
  - jira.group_members
  - jira.projects
  - jira.project_roles
  - jira.permission_schemes
  - jira.audit_events
runtime_families:
  - audit_events
  - group_members
  - groups
  - permission_schemes
  - project_roles
  - projects
  - users
kind_lifecycle:
  - kind: jira.users
    status: active
  - kind: jira.groups
    status: active
  - kind: jira.group_members
    status: active
  - kind: jira.projects
    status: active
  - kind: jira.project_roles
    status: active
  - kind: jira.permission_schemes
    status: active
  - kind: jira.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: jira
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Reads Jira Cloud users from /rest/api/3/users/search with startAt and maxResults pagination.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Reads Jira groups from /rest/api/3/group/bulk and keys them by groupId instead of mutable names.
    - id: group_members
      type: entity_family
      title: "Group members"
      families: [group_members]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Fans out configured group IDs into /rest/api/3/group/member and emits one user-to-group membership event per member.
    - id: projects
      type: entity_family
      title: "Projects"
      families: [projects]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Reads visible projects from /rest/api/3/project/search and preserves project id, key, type, lead, and lifecycle state.
    - id: project_roles
      type: entity_family
      title: "Project role assignments"
      families: [project_roles]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access, authorization]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Fans out configured project IDs or keys, reads /roledetails, enriches each role through /role/{id}, and projects actor assignments.
    - id: permission_schemes
      type: entity_family
      title: "Permission schemes"
      families: [permission_schemes]
      support: partial
      high_value: true
      evidence_types: [policy_configuration]
      control_domains: [authorization, change_management]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
        - framework_name: SOC 2
          control_id: CC8.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.32
      notes:
        - Reads /rest/api/3/permissionscheme with permissions expanded and projects permission grants to groups, users, roles, and application roles.
    - id: audit_events
      type: audit_event
      title: "Audit events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
      notes:
        - Reads Jira audit records from /rest/api/3/auditing/record with offset and limit pagination.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: partial
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
      notes:
        - Cursor pagination is provider-backed for users, groups, members, projects, and audit records. Relationship fanout preserves provider cursors per configured scope.
event_contracts:
  - kind: jira.users
    schema_ref: jira/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
      - resource_id
      - resource_type
    required_payload_fields:
      - accountId
  - kind: jira.groups
    schema_ref: jira/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - group_name
      - resource_id
    required_payload_fields:
      - groupId
  - kind: jira.group_members
    schema_ref: jira/group_members/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - member_user_id
    required_payload_fields:
      - accountId
      - group_id
  - kind: jira.projects
    schema_ref: jira/projects/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - project_id
      - project_key
      - resource_id
      - resource_type
    required_payload_fields:
      - id
      - key
  - kind: jira.project_roles
    schema_ref: jira/project_roles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - project_id_or_key
      - role_id
      - role_name
      - resource_id
      - resource_type
    required_payload_fields:
      - id
      - actors
      - project_id_or_key
  - kind: jira.permission_schemes
    schema_ref: jira/permission_schemes/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
      - policy_type
      - resource_id
    required_payload_fields:
      - id
      - permissions
  - kind: jira.audit_events
    schema_ref: jira/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
      - created
