id: jira
name: "Jira"
description: "Collects Jira Cloud users, groups, group membership, projects, project role assignments, permission schemes, and audit records from the Jira REST API."
emitted_kinds:
  - jira.users
  - jira.groups
  - jira.group_members
  - jira.projects
  - jira.project_roles
  - jira.permission_schemes
  - jira.audit_events
runtime_families:
  - audit_events
  - group_members
  - groups
  - permission_schemes
  - project_roles
  - projects
  - users
kind_lifecycle:
  - kind: jira.users
    status: active
  - kind: jira.groups
    status: active
  - kind: jira.group_members
    status: active
  - kind: jira.projects
    status: active
  - kind: jira.project_roles
    status: active
  - kind: jira.permission_schemes
    status: active
  - kind: jira.audit_events
    status: active
