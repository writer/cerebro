event_contracts:
  - kind: jira.users
    schema_ref: jira/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
      - resource_id
      - resource_type
    required_payload_fields:
      - accountId
  - kind: jira.groups
    schema_ref: jira/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - group_name
      - resource_id
    required_payload_fields:
      - groupId
  - kind: jira.group_members
    schema_ref: jira/group_members/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - member_user_id
    required_payload_fields:
      - accountId
      - group_id
  - kind: jira.projects
    schema_ref: jira/projects/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - project_id
      - project_key
      - resource_id
      - resource_type
    required_payload_fields:
      - id
      - key
  - kind: jira.project_roles
    schema_ref: jira/project_roles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - project_id_or_key
      - role_id
      - role_name
      - resource_id
      - resource_type
    required_payload_fields:
      - id
      - actors
      - project_id_or_key
  - kind: jira.permission_schemes
    schema_ref: jira/permission_schemes/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
      - policy_type
      - resource_id
    required_payload_fields:
      - id
      - permissions
  - kind: jira.audit_events
    schema_ref: jira/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
      - created
