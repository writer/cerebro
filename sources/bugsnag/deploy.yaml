sourceId: bugsnag
health:
  adapterPath: /health
secretKeys:
  - BUGSNAG_API_TOKEN
  - BUGSNAG_ORGANIZATION_ID
runtimes:
  - localId: projects
    config:
      family: projects
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /organizations/${config.organization_id}/projects
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:BUGSNAG_API_TOKEN
      organization_id: env:BUGSNAG_ORGANIZATION_ID
