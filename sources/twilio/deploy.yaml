sourceId: twilio
secretKeys:
  - TWILIO_TOKEN
runtimes:
  - localId: accounts
    config:
      family: accounts
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /2010-04-01/Accounts.json
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:TWILIO_TOKEN
