sourceId: authentik_cloud
secretKeys:
  - AUTHENTIK_CLOUD_BASE_URL
  - AUTHENTIK_CLOUD_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:AUTHENTIK_CLOUD_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v3/core/users/me/
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:AUTHENTIK_CLOUD_TOKEN
