sourceId: okta
secretKeys:
  - OKTA_API_TOKEN
  - OKTA_DOMAIN
runtimes:
  - localId: audit
    config:
      domain: env:OKTA_DOMAIN
      family: audit
      per_page: "200"
      since: "2026-05-01T00:00:00Z"
      token: env:OKTA_API_TOKEN
  - localId: user
    config:
      domain: env:OKTA_DOMAIN
      family: user
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: group
    config:
      domain: env:OKTA_DOMAIN
      family: group
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: application
    config:
      domain: env:OKTA_DOMAIN
      family: application
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: authenticator
    config:
      domain: env:OKTA_DOMAIN
      family: authenticator
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: policy-rule
    config:
      domain: env:OKTA_DOMAIN
      family: policy_rule
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: threat-insight
    config:
      domain: env:OKTA_DOMAIN
      family: threat_insight
      per_page: "200"
      token: env:OKTA_API_TOKEN
