sourceId: okta
secretKeys:
  - OKTA_API_TOKEN
  - OKTA_DOMAIN
runtimes:
  - localId: audit
    config:
      domain: env:OKTA_DOMAIN
      family: audit
      per_page: "200"
      since: "2026-05-01T00:00:00Z"
      token: env:OKTA_API_TOKEN
  - localId: admin-role
    config:
      domain: env:OKTA_DOMAIN
      family: admin_role
      per_page: "200"
      token: env:OKTA_API_TOKEN
      user_id: config:OKTA_ADMIN_ROLE_USER_ID
      user_email: config:OKTA_ADMIN_ROLE_USER_EMAIL
  - localId: app-assignment
    config:
      app_id: config:OKTA_APP_ID
      domain: env:OKTA_DOMAIN
      family: app_assignment
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: application
    config:
      domain: env:OKTA_DOMAIN
      family: application
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: api-token
    config:
      domain: env:OKTA_DOMAIN
      family: api_token
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: authorization-server
    config:
      domain: env:OKTA_DOMAIN
      family: authorization_server
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: authenticator
    config:
      domain: env:OKTA_DOMAIN
      family: authenticator
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: brand
    config:
      domain: env:OKTA_DOMAIN
      family: brand
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: device-assurance
    config:
      domain: env:OKTA_DOMAIN
      family: device_assurance
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: event-hook
    config:
      domain: env:OKTA_DOMAIN
      family: event_hook
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: group
    config:
      domain: env:OKTA_DOMAIN
      family: group
      per_page: "200"
      token: env:OKTA_API_TOKEN
  - localId: group-membership
    config:
      domain: env:OKTA_DOMAIN
      family: group_membership
