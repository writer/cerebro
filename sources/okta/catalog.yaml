coverage_contract:
  owner_domain: identity
  authority_domain: okta
  dimensions:
    - id: admin_roles
      type: relationship
      title: Admin role grants
      families: [admin_role]
      support: partial
      high_value: true
      evidence_types: [access_review, identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      known_unsupported_fields:
        - full custom admin permission expansion
    - id: app_assignments
      type: app_entitlement
      title: App assignments and entitlements
      families: [app_assignment]
      support: partial
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
      known_unsupported_fields:
        - app-specific fine-grained entitlement payloads
    - id: api_tokens
      type: entity_family
      title: API token metadata
      families: [api_token]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Token values are never collected; only token metadata, creator user, timestamps, and network conditions are surfaced.
    - id: applications
      type: entity_family
      title: Applications
      families: [application]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: authorization_servers
      type: entity_family
