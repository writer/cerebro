id: okta
name: Okta
description: Okta audit log, identity inventory, group, application, assignment, and admin role source.
emitted_kinds:
  - okta.audit
  - okta.admin_role
  - okta.app_assignment
  - okta.application
  - okta.authenticator
  - okta.group
  - okta.group_membership
  - okta.policy_rule
  - okta.threat_insight
  - okta.user
coverage_contract:
  owner_domain: identity
  authority_domain: okta
  dimensions:
    - id: admin_roles
      type: relationship
      title: Admin role grants
      families: [admin_role]
      support: partial
      high_value: true
      known_unsupported_fields:
        - full custom admin permission expansion
    - id: app_assignments
      type: app_entitlement
      title: App assignments and entitlements
      families: [app_assignment]
      support: partial
      high_value: true
      known_unsupported_fields:
        - app-specific fine-grained entitlement payloads
    - id: applications
      type: entity_family
      title: Applications
      families: [application]
      support: supported
      high_value: true
    - id: authenticators
      type: entity_family
      title: Authenticators
      families: [authenticator]
      support: supported
      high_value: true
    - id: audit_events
      type: audit_event
      title: Audit events
      families: [audit]
      support: supported
      high_value: true
    - id: groups
      type: entity_family
      title: Groups
      families: [group]
      support: supported
      high_value: true
    - id: group_memberships
      type: relationship
      title: Group memberships
      families: [group_membership]
      support: supported
      high_value: true
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: supported
      high_value: true
    - id: policy_rules
      type: entity_family
      title: Policy rules
      families: [policy_rule]
      support: supported
      high_value: true
    - id: remediation_state
      type: remediation_state
      title: Remediation lifecycle state
      support: unsupported
      high_value: true
      known_unsupported_fields:
        - remediation workflow state
      notes:
        - Okta user, app, assignment, policy, and audit status fields are provider lifecycle state, not Cerebro finding remediation state.
        - Findings and source-runtime consumers must use Cerebro finding status for remediation lifecycle decisions.
    - id: threat_insight
      type: entity_family
      title: ThreatInsight configuration
      families: [threat_insight]
      support: supported
      high_value: true
    - id: users
      type: entity_family
      title: Users
      families: [user]
      support: supported
      high_value: true
