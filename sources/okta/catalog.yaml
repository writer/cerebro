      type: remediation_state
      title: Remediation lifecycle state
      families: [admin_role, app_assignment, application, audit, identity_provider, network_zone, policy_rule, trusted_origin, user]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - Okta user, app, assignment, policy, federation, network, trusted origin, role grant, and audit status fields are surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
