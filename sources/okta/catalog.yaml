id: okta
name: Okta
description: Okta audit log, identity inventory, group, application, assignment, federation, network zone, trusted origin, control-plane asset, and admin role source.
emitted_kinds:
  - okta.audit
  - okta.admin_role
  - okta.api_token
  - okta.app_assignment
  - okta.application
  - okta.authorization_server
  - okta.authenticator
  - okta.brand
  - okta.device_assurance
  - okta.event_hook
  - okta.group
  - okta.group_membership
  - okta.identity_provider
  - okta.inline_hook
  - okta.log_stream
  - okta.network_zone
  - okta.policy_rule
  - okta.threat_insight
  - okta.trusted_origin
  - okta.user
coverage_contract:
  owner_domain: identity
  authority_domain: okta
  dimensions:
    - id: admin_roles
      type: relationship
      title: Admin role grants
      families: [admin_role]
      support: partial
      high_value: true
      known_unsupported_fields:
        - full custom admin permission expansion
    - id: app_assignments
      type: app_entitlement
      title: App assignments and entitlements
      families: [app_assignment]
      support: partial
      high_value: true
      known_unsupported_fields:
        - app-specific fine-grained entitlement payloads
    - id: api_tokens
      type: entity_family
      title: API token metadata
      families: [api_token]
      support: supported
      high_value: true
      notes:
        - Token values are never collected; only token metadata, creator user, timestamps, and network conditions are surfaced.
    - id: applications
      type: entity_family
      title: Applications
      families: [application]
      support: supported
      high_value: true
    - id: authorization_servers
      type: entity_family
      title: Authorization servers
      families: [authorization_server]
      support: supported
      high_value: true
    - id: authenticators
      type: entity_family
      title: Authenticators
      families: [authenticator]
      support: supported
      high_value: true
    - id: brands
      type: entity_family
      title: Brands
      families: [brand]
      support: supported
      high_value: true
    - id: device_assurance
      type: entity_family
      title: Device assurance policies
      families: [device_assurance]
      support: supported
      high_value: true
    - id: event_hooks
      type: entity_family
      title: Event hooks
      families: [event_hook]
      support: supported
      high_value: true
    - id: audit_events
      type: audit_event
      title: Audit events
      families: [audit]
      support: supported
      high_value: true
    - id: groups
      type: entity_family
      title: Groups
      families: [group]
      support: supported
      high_value: true
    - id: group_memberships
      type: relationship
      title: Group memberships
      families: [group_membership]
      support: supported
      high_value: true
    - id: identity_providers
      type: entity_family
      title: Identity providers
      families: [identity_provider]
      support: supported
      high_value: true
    - id: inline_hooks
      type: entity_family
      title: Inline hooks
      families: [inline_hook]
      support: supported
      high_value: true
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: supported
      high_value: true
    - id: network_zones
      type: entity_family
      title: Network zones
      families: [network_zone]
      support: supported
      high_value: true
    - id: log_streams
      type: entity_family
      title: Log streams
      families: [log_stream]
      support: supported
      high_value: true
    - id: policy_rules
      type: entity_family
      title: Policy rules
      families: [policy_rule]
      support: supported
      high_value: true
    - id: remediation_state
      type: remediation_state
      title: Remediation lifecycle state
      families: [admin_role, app_assignment, application, audit, identity_provider, network_zone, policy_rule, trusted_origin, user]
      support: partial
      high_value: true
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - Okta user, app, assignment, policy, federation, network, trusted origin, role grant, and audit status fields are surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
    - id: threat_insight
      type: entity_family
      title: ThreatInsight configuration
      families: [threat_insight]
      support: supported
      high_value: true
    - id: trusted_origins
      type: entity_family
      title: Trusted origins
      families: [trusted_origin]
      support: supported
      high_value: true
    - id: users
      type: entity_family
      title: Users
      families: [user]
      support: supported
      high_value: true
