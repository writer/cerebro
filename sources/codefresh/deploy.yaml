sourceId: codefresh
secretKeys:
  - CODEFRESH_API_TOKEN
runtimes:
  - localId: projects
    config:
      family: projects
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /orgs
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:CODEFRESH_API_TOKEN
