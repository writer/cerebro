id: codefresh
name: "Codefresh"
description: "Collects projects, builds, and audit events from Codefresh and projects them into the Cerebro graph as repositories, assets, and audit events for repository, build, deployment, and release context."
emitted_kinds:
  - codefresh.projects
  - codefresh.builds
  - codefresh.audit_events
kind_lifecycle:
  - kind: codefresh.projects
    status: active
  - kind: codefresh.builds
    status: active
  - kind: codefresh.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: codefresh
  dimensions:
    - id: projects
      type: entity_family
      title: "Projects"
      families: [projects]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: builds
      type: entity_family
      title: "Builds"
      families: [builds]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: codefresh.projects
    schema_ref: codefresh/projects/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: codefresh.builds
    schema_ref: codefresh/builds/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: codefresh.audit_events
    schema_ref: codefresh/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
