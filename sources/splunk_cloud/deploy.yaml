sourceId: splunk_cloud
secretKeys:
  - SPLUNK_CLOUD_TOKEN
runtimes:
  - localId: audit-events
    config:
      family: audit_events
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /services/server/info
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:SPLUNK_CLOUD_TOKEN
