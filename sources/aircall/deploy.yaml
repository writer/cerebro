sourceId: aircall
secretKeys:
  - AIRCALL_API_ID
  - AIRCALL_API_TOKEN
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /ping
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "50"
      username: env:AIRCALL_API_ID
      password: env:AIRCALL_API_TOKEN
