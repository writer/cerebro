sourceId: cortex_xdr
secretKeys:
  - CORTEX_XDR_API_TOKEN
runtimes:
  - localId: assets
    config:
      family: assets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /public_api/v1/system/get_healthcheck_status/
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:CORTEX_XDR_API_TOKEN
