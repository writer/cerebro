id: kubernetes
name: Kubernetes
description: Kubernetes cluster, workload, service account, and workload identity source.
emitted_kinds:
  - kubernetes.cluster
  - kubernetes.namespace
  - kubernetes.pod
  - kubernetes.container
  - kubernetes.rbac_binding
  - kubernetes.rbac_role
  - kubernetes.service_account
  - kubernetes.workload
  - kubernetes.workload_identity_binding
event_contracts:
  - kind: kubernetes.cluster
    schema_ref: kubernetes/cluster/v1
    required_attributes:
      - cluster_id
      - cluster_name
    required_payload_fields:
      - cluster_id
      - cluster_name
  - kind: kubernetes.namespace
    schema_ref: kubernetes/namespace/v1
    required_attributes:
      - cluster_id
      - namespace
    required_payload_fields:
      - name
      - uid
  - kind: kubernetes.pod
    schema_ref: kubernetes/pod/v1
    required_attributes:
      - cluster_id
      - namespace
      - workload_uid
    required_payload_fields:
      - name
      - uid
      - namespace
  - kind: kubernetes.container
    schema_ref: kubernetes/container/v1
    required_attributes:
      - cluster_id
      - namespace
      - container_name
    required_payload_fields:
      - container_name
      - pod_uid
  - kind: kubernetes.rbac_binding
    schema_ref: kubernetes/rbac_binding/v1
    required_attributes:
      - cluster_id
      - binding_name
      - binding_kind
      - role_name
    required_payload_fields:
      - name
      - binding_kind
      - role_ref
  - kind: kubernetes.rbac_role
    schema_ref: kubernetes/rbac_role/v1
    required_attributes:
      - cluster_id
      - role_name
      - role_kind
    required_payload_fields:
      - name
      - role_kind
      - rules
  - kind: kubernetes.service_account
    schema_ref: kubernetes/service_account/v1
    required_attributes:
      - cluster_id
      - namespace
      - service_account_name
    required_payload_fields:
      - name
      - namespace
  - kind: kubernetes.workload
    schema_ref: kubernetes/workload/v1
    required_attributes:
      - cluster_id
      - namespace
      - workload_uid
    required_payload_fields:
      - workload_uid
      - workload_kind
      - workload_name
  - kind: kubernetes.workload_identity_binding
    schema_ref: kubernetes/workload_identity_binding/v1
    required_attributes:
      - cluster_id
      - namespace
      - service_account_name
      - cloud_provider
      - target_id
    required_payload_fields:
      - service_account_name
      - cloud_provider
      - target_id
coverage_contract:
  owner_domain: cloud
  authority_domain: kubernetes
  dimensions:
    - id: clusters
      type: entity_family
      title: Kubernetes clusters
      families: [cluster]
      support: supported
      high_value: true
    - id: namespaces
      type: entity_family
      title: Kubernetes namespaces
      families: [namespace]
      support: supported
      high_value: true
    - id: ingresses
      type: entity_family
      title: Kubernetes ingresses
      families: [workload]
      support: partial
      high_value: true
      known_unsupported_fields: [dedicated ingress entities and TLS rule expansion]
    - id: nodes
      type: entity_family
      title: Kubernetes nodes
      families: [cluster]
      support: partial
      high_value: true
      known_unsupported_fields: [dedicated node entities and kubelet posture fields]
    - id: pods
      type: entity_family
      title: Kubernetes pods
      families: [pod, container]
      support: supported
      high_value: true
    - id: service_accounts
      type: entity_family
      title: Kubernetes service accounts
      families: [service_account]
      support: supported
      high_value: true
    - id: services
      type: entity_family
      title: Kubernetes services
      families: [workload]
      support: partial
      high_value: true
      known_unsupported_fields: [dedicated service entities and external IP details]
    - id: workloads
      type: entity_family
      title: Kubernetes workloads
      families: [workload]
      support: supported
      high_value: true
    - id: workload_identity_bindings
      type: relationship
      title: Kubernetes workload identity bindings
      families: [workload_identity_binding]
      support: supported
      high_value: true
    - id: rbac_roles
      type: app_entitlement
      title: Kubernetes RBAC roles
      families: [rbac_role]
      support: supported
      high_value: true
    - id: rbac_bindings
      type: relationship
      title: Kubernetes RBAC bindings
      families: [rbac_binding]
      support: supported
      high_value: true
