sourceId: ada_support
secretKeys:
  - ADA_SUPPORT_BASE_URL
  - ADA_SUPPORT_TOKEN
runtimes:
  - localId: end-users
    config:
      base_url: env:ADA_SUPPORT_BASE_URL
      family: end_users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v2/end-users/
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ADA_SUPPORT_TOKEN
