id: callfire
name: "CallFire"
description: "Collects account, credential, broadcast, and call from CallFire and projects them into the Cerebro graph as users, secrets, and assets for workspace, document, message, and collaboration context."
emitted_kinds:
  - callfire.account
  - callfire.credential
  - callfire.broadcast
  - callfire.call
runtime_families:
  - account
  - broadcast
  - call
  - credential
kind_lifecycle:
  - kind: callfire.account
    status: active
  - kind: callfire.credential
    status: active
  - kind: callfire.broadcast
    status: active
  - kind: callfire.call
    status: active
provider_api:
  status: verified
  basis: discovered
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: basic
  auth_mechanics: basic_authorization_header
  base_url: https://api.callfire.com/v2
  spec_url: https://api.apis.guru/v2/specs/callfire.com/V2/openapi.json
  spec_kind: openapi
  references:
    - https://api.apis.guru/v2/specs/callfire.com/V2/openapi.json
    - https://www.callfire.com/v2/api-docs/swagger.json
  families:
    - id: account
      method: GET
      path: /me/account
    - id: broadcast
      method: GET
      path: /calls/broadcasts
    - id: call
      method: GET
      path: /calls
    - id: credential
      method: GET
      path: /me/api/credentials
coverage_contract:
  owner_domain: source_runtime
  authority_domain: callfire
  dimensions:
    - id: account
      type: entity_family
      title: "Account"
      families: [account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: credential
      type: entity_family
      title: "Credential"
      families: [credential]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: broadcast
      type: entity_family
      title: "Broadcast"
      families: [broadcast]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: call
      type: entity_family
      title: "Call"
      families: [call]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: callfire.account
    schema_ref: callfire/account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: callfire.credential
    schema_ref: callfire/credential/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: callfire.broadcast
    schema_ref: callfire/broadcast/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: callfire.call
    schema_ref: callfire/call/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
