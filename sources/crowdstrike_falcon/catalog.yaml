id: crowdstrike_falcon
name: "CrowdStrike Falcon"
description: "Collects endpoint devices, findings, and vulnerabilities from CrowdStrike Falcon and projects them into the Cerebro graph as devices, findings, and vulnerabilities for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - crowdstrike_falcon.endpoint_devices
  - crowdstrike_falcon.findings
  - crowdstrike_falcon.vulnerabilities
kind_lifecycle:
  - kind: crowdstrike_falcon.endpoint_devices
    status: active
  - kind: crowdstrike_falcon.findings
    status: active
  - kind: crowdstrike_falcon.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: crowdstrike_falcon
  dimensions:
    - id: endpoint_devices
      type: entity_family
      title: "Endpoint Devices"
      families: [endpoint_devices]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: crowdstrike_falcon.endpoint_devices
    schema_ref: crowdstrike_falcon/endpoint_devices/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: crowdstrike_falcon.findings
    schema_ref: crowdstrike_falcon/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: crowdstrike_falcon.vulnerabilities
    schema_ref: crowdstrike_falcon/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
