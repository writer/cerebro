sourceId: perplexity
secretKeys:
  - PERPLEXITY_TOKEN
runtimes:
  - localId: api-groups
    config:
      family: api_groups
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /models
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:PERPLEXITY_TOKEN
