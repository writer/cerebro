id: elevenlabs
name: "ElevenLabs"
description: "Collects model catalog, voices, service accounts, service-account api keys, webhooks, and auth connections from ElevenLabs and projects them into the Cerebro graph as assets, deployments, secrets, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - elevenlabs.model_catalog
  - elevenlabs.voices
  - elevenlabs.service_accounts
  - elevenlabs.service_account_api_keys
  - elevenlabs.webhooks
  - elevenlabs.auth_connections
runtime_families:
  - auth_connections
  - model_catalog
  - service_account_api_keys
  - service_accounts
  - voices
  - webhooks
kind_lifecycle:
  - kind: elevenlabs.model_catalog
    status: active
  - kind: elevenlabs.voices
    status: active
  - kind: elevenlabs.service_accounts
    status: active
  - kind: elevenlabs.service_account_api_keys
    status: active
  - kind: elevenlabs.webhooks
    status: active
  - kind: elevenlabs.auth_connections
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: xi_api_key_header
  base_url: https://api.elevenlabs.io
  spec_url: https://api.elevenlabs.io/openapi.json
  spec_kind: openapi
  references:
    - https://elevenlabs.io/docs/api-reference/introduction
    - https://api.elevenlabs.io/openapi.json
  auth_evidence:
    - https://elevenlabs.io/docs/api-reference/authentication
  families:
    - id: model_catalog
      method: GET
      path: /v1/models
    - id: voices
      method: GET
      path: /v2/voices
    - id: service_accounts
      method: GET
      path: /v1/service-accounts
    - id: service_account_api_keys
      method: GET
      path: /v1/service-accounts/{service_account_user_id}/api-keys
    - id: webhooks
      method: GET
      path: /v1/workspace/webhooks
    - id: auth_connections
      method: GET
      path: /v1/workspace/auth-connections
coverage_contract:
  owner_domain: source_runtime
  authority_domain: elevenlabs
  dimensions:
    - id: model_catalog
      type: entity_family
      title: "Model Catalog"
      families: [model_catalog]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Reads the official models list response and maps model_id, name, capabilities, token cost, limits, and languages.
    - id: voices
      type: entity_family
      title: "Voices"
      families: [voices]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Reads the official voices search response and maps voice_id, name, category, labels, settings, preview URL, and pagination token.
    - id: service_accounts
      type: entity_family
      title: "Service Accounts"
      families: [service_accounts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      notes:
        - Reads the official service-accounts response and maps service_account_user_id, name, and created_at_unix.
    - id: service_account_api_keys
      type: entity_family
      title: "Service Account Api Keys"
      families: [service_account_api_keys]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      notes:
        - Reads the official service-account API keys response and maps key_id, name, created_at_unix, and disabled state.
    - id: webhooks
      type: deployment_state
      title: "Webhooks"
      families: [webhooks]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery]
      control_refs:
        - framework_name: SOC 2
          control_id: CC8.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.32
      notes:
        - Reads the official workspace webhooks response and maps webhook_id, name, URL, enabled state, and timestamps.
    - id: auth_connections
      type: entity_family
      title: "Auth Connections"
      families: [auth_connections]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      notes:
        - Reads the official workspace auth connections response and maps connection id, name, URLs, status, and created timestamp.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: elevenlabs.model_catalog
    schema_ref: elevenlabs/model_catalog/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - model_id
  - kind: elevenlabs.voices
    schema_ref: elevenlabs/voices/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - voice_id
  - kind: elevenlabs.service_accounts
    schema_ref: elevenlabs/service_accounts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - service_account_user_id
  - kind: elevenlabs.service_account_api_keys
    schema_ref: elevenlabs/service_account_api_keys/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - key_id
  - kind: elevenlabs.webhooks
    schema_ref: elevenlabs/webhooks/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - webhook_id
  - kind: elevenlabs.auth_connections
    schema_ref: elevenlabs/auth_connections/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - name
