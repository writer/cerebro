id: detectify
name: "Detectify"
description: "Collects findings, assets, and scan profiles from Detectify and projects them into the Cerebro graph as findings, assets, and policies for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - detectify.findings
  - detectify.assets
  - detectify.scan_profiles
kind_lifecycle:
  - kind: detectify.findings
    status: active
  - kind: detectify.assets
    status: active
  - kind: detectify.scan_profiles
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: detectify
  dimensions:
    - id: findings
      type: entity_family
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: scan_profiles
      type: entity_family
      title: "Scan Profiles"
      families: [scan_profiles]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: detectify.findings
    schema_ref: detectify/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: detectify.assets
    schema_ref: detectify/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: detectify.scan_profiles
    schema_ref: detectify/scan_profiles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
