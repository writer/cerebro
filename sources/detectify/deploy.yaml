sourceId: detectify
secretKeys:
  - DETECTIFY_TOKEN
runtimes:
  - localId: findings
    config:
      family: findings
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v2/status
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:DETECTIFY_TOKEN
