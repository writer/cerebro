sourceId: hetzner
secretKeys:
  - HETZNER_TOKEN
runtimes:
  - localId: placement-group
    config:
      family: placement_group
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /placement_groups
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:HETZNER_TOKEN
