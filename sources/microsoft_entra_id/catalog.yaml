id: microsoft_entra_id
name: "Microsoft Entra ID"
description: "Collects users, groups, and audit events from Microsoft Entra ID and projects them into the Cerebro graph as users, groups, and audit events for identity, access, device, and secret context."
provider_api:
  status: verified
  transport: rest
  auth: oauth_client_credentials
  base_url: https://graph.microsoft.com
  references:
    - https://github.com/microsoftgraph/msgraph-metadata/blob/master/openapi/v1.0/openapi.yaml
    - https://learn.microsoft.com/en-us/graph/api/user-list?view=graph-rest-1.0
    - https://learn.microsoft.com/en-us/graph/api/group-list?view=graph-rest-1.0
    - https://learn.microsoft.com/en-us/graph/api/directoryaudit-list?view=graph-rest-1.0
    - https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-client-creds-grant-flow
  families:
    - id: users
      method: GET
      path: /v1.0/users
    - id: groups
      method: GET
      path: /v1.0/groups
    - id: audit_events
      method: GET
      path: /v1.0/auditLogs/directoryAudits
emitted_kinds:
  - microsoft_entra_id.users
  - microsoft_entra_id.groups
  - microsoft_entra_id.audit_events
runtime_families:
  - users
  - groups
  - audit_events
kind_lifecycle:
  - kind: microsoft_entra_id.users
    status: active
  - kind: microsoft_entra_id.groups
    status: active
  - kind: microsoft_entra_id.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: microsoft_entra_id
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
event_contracts:
  - kind: microsoft_entra_id.users
    schema_ref: microsoft_entra_id/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: microsoft_entra_id.groups
    schema_ref: microsoft_entra_id/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: microsoft_entra_id.audit_events
    schema_ref: microsoft_entra_id/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
