id: databricks
name: "Databricks"
description: "Collects data assets, model serving endpoints, audit events, and vulnerabilities from Databricks and projects them into the Cerebro graph as assets, deployments, audit events, and vulnerabilities for owner, account, evidence, and compliance context."
emitted_kinds:
  - databricks.assets
  - databricks.model_serving_endpoints
  - databricks.audit_events
  - databricks.vulnerabilities
kind_lifecycle:
  - kind: databricks.assets
    status: active
  - kind: databricks.model_serving_endpoints
    status: active
  - kind: databricks.audit_events
    status: active
  - kind: databricks.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: databricks
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: model_serving_endpoints
      type: deployment_state
      title: "Model Serving Endpoints"
      families: [model_serving_endpoints]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: databricks.assets
    schema_ref: databricks/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: databricks.model_serving_endpoints
    schema_ref: databricks/model_serving_endpoints/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - name
  - kind: databricks.audit_events
    schema_ref: databricks/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: databricks.vulnerabilities
    schema_ref: databricks/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
