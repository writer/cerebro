id: n_auth
name: "nextAuth"
description: "Collects apikey, account, permission, and user from nextAuth and projects them into the Cerebro graph as secrets, users, and assets for identity, access, device, and secret context."
emitted_kinds:
  - n_auth.apikey
  - n_auth.account
  - n_auth.permission
  - n_auth.user
runtime_families:
  - account
  - apikey
  - permission
  - user
kind_lifecycle:
  - kind: n_auth.apikey
    status: active
  - kind: n_auth.account
    status: active
  - kind: n_auth.permission
    status: active
  - kind: n_auth.user
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: n_auth
  dimensions:
    - id: apikey
      type: entity_family
      title: "Apikey"
      families: [apikey]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: account
      type: entity_family
      title: "Account"
      families: [account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: permission
      type: entity_family
      title: "Permission"
      families: [permission]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user
      type: entity_family
      title: "User"
      families: [user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: n_auth.apikey
    schema_ref: n_auth/apikey/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - apikey
  - kind: n_auth.account
    schema_ref: n_auth/account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: n_auth.permission
    schema_ref: n_auth/permission/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - acl
  - kind: n_auth.user
    schema_ref: n_auth/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - lastlogin
