  - kind: osisoft.eventframe
    schema_ref: osisoft/eventframe/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - Id
  - kind: osisoft.elements_eventframe
    schema_ref: osisoft/elements_eventframe/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - Id
  - kind: osisoft.eventframes_eventframe
    schema_ref: osisoft/eventframes_eventframe/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - Id
  - kind: osisoft.eventframeattribute
    schema_ref: osisoft/eventframeattribute/v1
    required_attributes:
