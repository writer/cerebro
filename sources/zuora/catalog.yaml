id: zuora
name: "Zuora"
description: "Collects event triggers, billing configuration, notification history, catalog products, revenue events, and account payment methods from Zuora and projects them into the Cerebro graph as alerts, assets, audit events, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - zuora.event_trigger
  - zuora.accounting_code
  - zuora.callout
  - zuora.hostedpage
  - zuora.product
  - zuora.accounting_period
  - zuora.email
  - zuora.email_template
  - zuora.notification_definition
  - zuora.revenue_event
  - zuora.revenue_schedule
  - zuora.account
runtime_families:
  - account
  - accounting_code
  - accounting_period
  - callout
  - email
  - email_template
  - event_trigger
  - hostedpage
  - notification_definition
  - product
  - revenue_event
  - revenue_schedule
kind_lifecycle:
  - kind: zuora.event_trigger
    status: active
  - kind: zuora.accounting_code
    status: active
  - kind: zuora.callout
    status: active
  - kind: zuora.hostedpage
    status: active
  - kind: zuora.product
    status: active
  - kind: zuora.accounting_period
    status: active
  - kind: zuora.email
    status: active
  - kind: zuora.email_template
    status: active
  - kind: zuora.notification_definition
    status: active
  - kind: zuora.revenue_event
    status: active
  - kind: zuora.revenue_schedule
    status: active
  - kind: zuora.account
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: zuora
  dimensions:
    - id: event_trigger
      type: audit_event
      title: "Event Trigger"
      families: [event_trigger]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Maps the official List event triggers response under the top-level `data` key, including trigger ID, base object, JEXL condition, nested event type, and active state.
      known_unsupported_fields:
        - List event triggers does not return the user that last changed the trigger.
    - id: accounting_code
      type: entity_family
      title: "Accounting Code"
      families: [accounting_code]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps the official List all accounting codes response under `accountingCodes`, including GL account name, account number, category, type, status, and audit timestamps.
    - id: callout
      type: alert_state
      title: "Callout"
      families: [callout]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Maps notification callout history under `calloutHistories`, retaining attempted count, request URL, method, response code, event category, and notification name.
      known_unsupported_fields:
        - Request and response bodies are not collected by this source.
    - id: hostedpage
      type: entity_family
      title: "Hostedpage"
      families: [hostedpage]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps the official List hosted pages response under `hostedpages`, including page ID, payment page type, and page version.
    - id: product
      type: audit_event
      title: "Product"
      families: [product]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Maps the official List all products catalog response under `products`, including product ID, product number, SKU, category, effective dates, and rate-plan link.
    - id: accounting_period
      type: entity_family
      title: "Accounting Period"
      families: [accounting_period]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps the official List all accounting periods response under `accountingPeriods`, including period dates, status, fiscal year, fiscal quarter, trial-balance status, and report file IDs.
    - id: email
      type: audit_event
      title: "Email"
      families: [email]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps notification email history under `emailHistories`, retaining result, event category, notification name, subject, recipients, sender, reply-to, and send time.
      known_unsupported_fields:
        - Email bodies and attachment contents are not collected.
    - id: email_template
      type: entity_family
      title: "Email Template"
      families: [email_template]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps the official List email templates response under `data`, including template ID, event type, name, description, subject, sender settings, and active state.
    - id: notification_definition
      type: alert_state
      title: "Notification Definition"
      families: [notification_definition]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Maps the official List notification definitions response under `data`, including notification ID, event type, name, description, subject, delivery addressing mode, and active state.
    - id: revenue_event
      type: audit_event
      title: "Revenue Event"
      families: [revenue_event]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Maps revenue item responses under `revenueItems` for a configured revenue event number.
      known_unsupported_fields:
        - The current public Swagger does not expose this revenue route; shape is held as a provider-like inert replay until the revenue API OpenAPI is published with this path.
    - id: revenue_schedule
      type: audit_event
      title: "Revenue Schedule"
      families: [revenue_schedule]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
      notes:
        - Maps revenue event detail responses under `revenueEventDetails` for a configured revenue schedule number.
      known_unsupported_fields:
        - The current public Swagger does not expose this revenue route; shape is held as a provider-like inert replay until the revenue API OpenAPI is published with this path.
    - id: account
      type: entity_family
      title: "Account Payment Method"
      families: [account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
      notes:
        - Maps the official List payment methods of an account response for the configured account key, using the documented payment-method type arrays such as `creditcard`.
      known_unsupported_fields:
        - Full payment PAN, CVV, and decrypted payment credentials are intentionally not collected.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: zuora.event_trigger
    schema_ref: zuora/event_trigger/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - resource_id
    required_payload_fields:
      - id
  - kind: zuora.accounting_code
    schema_ref: zuora/accounting_code/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - provider_id
      - status
    required_payload_fields:
      - id
  - kind: zuora.callout
    schema_ref: zuora/callout/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_status
    required_payload_fields:
      - attemptedNum
  - kind: zuora.hostedpage
    schema_ref: zuora/hostedpage/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - pageId
  - kind: zuora.product
    schema_ref: zuora/product/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_id
      - resource_name
    required_payload_fields:
      - id
  - kind: zuora.accounting_period
    schema_ref: zuora/accounting_period/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - provider_id
      - status
    required_payload_fields:
      - id
  - kind: zuora.email
    schema_ref: zuora/email/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - provider_id
      - resource_name
    required_payload_fields:
      - accountId
  - kind: zuora.email_template
    schema_ref: zuora/email_template/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - provider_id
      - resource_name
    required_payload_fields:
      - id
  - kind: zuora.notification_definition
    schema_ref: zuora/notification_definition/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_status
    required_payload_fields:
      - id
  - kind: zuora.revenue_event
    schema_ref: zuora/revenue_event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - resource_id
    required_payload_fields:
      - accountingPeriodEndDate
  - kind: zuora.revenue_schedule
    schema_ref: zuora/revenue_schedule/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - resource_id
    required_payload_fields:
      - accountId
  - kind: zuora.account
    schema_ref: zuora/account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - provider_id
      - resource_id
    required_payload_fields:
      - id
