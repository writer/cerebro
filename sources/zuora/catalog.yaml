      control_domains: [source_operations]
event_contracts:
  - kind: zuora.event_trigger
    schema_ref: zuora/event_trigger/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: zuora.accounting_code
    schema_ref: zuora/accounting_code/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: zuora.callout
    schema_ref: zuora/callout/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_severity
    required_payload_fields:
      - attemptedNum
  - kind: zuora.hostedpage
    schema_ref: zuora/hostedpage/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - pageId
  - kind: zuora.product
    schema_ref: zuora/product/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: zuora.accounting_period
    schema_ref: zuora/accounting_period/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: zuora.email
    schema_ref: zuora/email/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - bcc
  - kind: zuora.email_template
    schema_ref: zuora/email_template/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: zuora.notification_definition
    schema_ref: zuora/notification_definition/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_severity
    required_payload_fields:
      - id
  - kind: zuora.revenue_event
    schema_ref: zuora/revenue_event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - accountingPeriodEndDate
  - kind: zuora.revenue_schedule
    schema_ref: zuora/revenue_schedule/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - accountId
  - kind: zuora.account
    schema_ref: zuora/account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
