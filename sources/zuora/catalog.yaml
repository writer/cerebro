id: zuora
name: "Zuora"
description: "Collects event trigger, accounting code, callout, hostedpage, product, and accounting period from Zuora and projects them into the Cerebro graph as alerts, assets, audit events, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - zuora.event_trigger
  - zuora.accounting_code
  - zuora.callout
  - zuora.hostedpage
  - zuora.product
  - zuora.accounting_period
  - zuora.email
  - zuora.email_template
  - zuora.notification_definition
  - zuora.revenue_event
  - zuora.revenue_schedule
  - zuora.account
kind_lifecycle:
  - kind: zuora.event_trigger
    status: active
  - kind: zuora.accounting_code
    status: active
  - kind: zuora.callout
    status: active
  - kind: zuora.hostedpage
    status: active
  - kind: zuora.product
    status: active
  - kind: zuora.accounting_period
    status: active
  - kind: zuora.email
    status: active
  - kind: zuora.email_template
    status: active
  - kind: zuora.notification_definition
    status: active
  - kind: zuora.revenue_event
    status: active
  - kind: zuora.revenue_schedule
    status: active
  - kind: zuora.account
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: zuora
  dimensions:
    - id: event_trigger
      type: audit_event
      title: "Event Trigger"
      families: [event_trigger]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: accounting_code
      type: entity_family
      title: "Accounting Code"
      families: [accounting_code]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: callout
      type: alert_state
      title: "Callout"
      families: [callout]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: hostedpage
      type: entity_family
      title: "Hostedpage"
      families: [hostedpage]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: product
      type: audit_event
      title: "Product"
      families: [product]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: accounting_period
      type: entity_family
      title: "Accounting Period"
      families: [accounting_period]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: email
      type: entity_family
      title: "Email"
      families: [email]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: email_template
      type: entity_family
      title: "Email Template"
      families: [email_template]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: notification_definition
      type: alert_state
      title: "Notification Definition"
      families: [notification_definition]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      notes:
