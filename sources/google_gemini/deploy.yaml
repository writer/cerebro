sourceId: google_gemini
secretKeys:
  - GOOGLE_GEMINI_API_TOKEN
runtimes:
  - localId: model-catalog
    config:
      family: model_catalog
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1beta/models
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:GOOGLE_GEMINI_API_TOKEN
