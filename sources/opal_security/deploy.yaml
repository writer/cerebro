sourceId: opal_security
secretKeys:
  - OPAL_SECURITY_BASE_URL
  - OPAL_SECURITY_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:OPAL_SECURITY_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:OPAL_SECURITY_TOKEN
