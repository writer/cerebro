sourceId: openpolicy
secretKeys:
  - OPENPOLICY_ID
  - OPENPOLICY_PATH
  - OPENPOLICY_TOKEN
runtimes:
  - localId: policy
    config:
      id: env:OPENPOLICY_ID
      path: env:OPENPOLICY_PATH
      family: policy
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/policies
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:OPENPOLICY_TOKEN
