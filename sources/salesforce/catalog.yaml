id: salesforce
name: "Salesforce"
description: "Collects users, business records, and audit events from Salesforce and projects them into the Cerebro graph as users, assets, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - salesforce.users
  - salesforce.assets
  - salesforce.audit_events
runtime_families:
  - assets
  - audit_events
  - users
kind_lifecycle:
  - kind: salesforce.users
    status: active
  - kind: salesforce.assets
    status: active
  - kind: salesforce.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: salesforce
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: salesforce.users
    schema_ref: salesforce/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: salesforce.assets
    schema_ref: salesforce/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: salesforce.audit_events
    schema_ref: salesforce/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
