sourceId: salesforce
secretKeys:
  - SALESFORCE_TOKEN
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /services/data/v60.0
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:SALESFORCE_TOKEN
