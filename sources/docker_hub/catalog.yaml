id: docker_hub
name: "Docker Hub"
description: "Collects repositories, users, and audit events from Docker Hub and projects them into the Cerebro graph as repositories, users, and audit events for repository, build, deployment, and release context."
emitted_kinds:
  - docker_hub.repositories
  - docker_hub.users
  - docker_hub.audit_events
kind_lifecycle:
  - kind: docker_hub.repositories
    status: active
  - kind: docker_hub.users
    status: active
  - kind: docker_hub.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: docker_hub
  dimensions:
    - id: repositories
      type: entity_family
      title: "Repositories"
      families: [repositories]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: docker_hub.repositories
    schema_ref: docker_hub/repositories/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: docker_hub.users
    schema_ref: docker_hub/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: docker_hub.audit_events
    schema_ref: docker_hub/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
