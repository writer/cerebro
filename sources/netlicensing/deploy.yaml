sourceId: netlicensing
secretKeys:
  - NETLICENSING_TOKEN
runtimes:
  - localId: token
    config:
      family: token
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /token
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:NETLICENSING_TOKEN
