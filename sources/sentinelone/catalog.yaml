id: sentinelone
name: SentinelOne
description: SentinelOne EDR threat, agent, application, activity, site, group, and exclusion source.
emitted_kinds:
  - sentinelone.activity
  - sentinelone.agent
  - sentinelone.application_inventory
  - sentinelone.exclusion
  - sentinelone.group
  - sentinelone.site
  - sentinelone.threat
runtime_families:
  - activity
  - agent
  - application
  - exclusion
  - group
  - site
  - threat
event_contracts:
  - kind: sentinelone.activity
    schema_ref: sentinelone/activity/v1
    required_attributes:
      - family
  - kind: sentinelone.agent
    schema_ref: sentinelone/agent/v1
    required_attributes:
      - family
  - kind: sentinelone.application_inventory
    schema_ref: sentinelone/application_inventory/v1
    required_attributes:
      - family
  - kind: sentinelone.exclusion
    schema_ref: sentinelone/exclusion/v1
    required_attributes:
      - family
  - kind: sentinelone.group
    schema_ref: sentinelone/group/v1
    required_attributes:
      - family
  - kind: sentinelone.site
    schema_ref: sentinelone/site/v1
    required_attributes:
      - family
  - kind: sentinelone.threat
    schema_ref: sentinelone/threat/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: endpoint
  authority_domain: sentinelone
  dimensions:
    - id: activities
      type: audit_event
      title: SentinelOne activities
      families: [activity]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
    - id: agents
      type: entity_family
      title: SentinelOne agents
      families: [agent]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: applications
      type: entity_family
      title: Application inventory
      families: [application]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: exclusions
      type: entity_family
      title: Security exclusions
      families: [exclusion]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
    - id: groups
      type: entity_family
      title: SentinelOne groups
      families: [group]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: sites
      type: entity_family
      title: SentinelOne sites
      families: [site]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.9
    - id: threats
      type: entity_family
      title: Threat detections
      families: [threat]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
    - id: remediation_state
      type: remediation_state
      title: Threat remediation lifecycle state
      families: [threat]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.4
        - framework_name: "ISO 27001:2022"
          control_id: A.5.26
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - SentinelOne threat mitigation and investigation fields are surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
