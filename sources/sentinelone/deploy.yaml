sourceId: sentinelone
health:
  authModel: api_token
  adapterPath: /web/api/v2.1/agents
secretKeys:
  - SENTINELONE_API_TOKEN
  - SENTINELONE_BASE_URL
runtimes:
  - localId: threat
    config:
      base_url: env:SENTINELONE_BASE_URL
      family: threat
      per_page: "200"
      token: env:SENTINELONE_API_TOKEN
  - localId: agent
    config:
      base_url: env:SENTINELONE_BASE_URL
      family: agent
      per_page: "200"
      token: env:SENTINELONE_API_TOKEN
  - localId: application
    config:
      base_url: env:SENTINELONE_BASE_URL
      family: application
      per_page: "50"
      token: env:SENTINELONE_API_TOKEN
  - localId: exclusion
    config:
      base_url: env:SENTINELONE_BASE_URL
      family: exclusion
      per_page: "200"
      token: env:SENTINELONE_API_TOKEN
  - localId: group
    config:
      base_url: env:SENTINELONE_BASE_URL
      family: group
      per_page: "200"
      token: env:SENTINELONE_API_TOKEN
  - localId: site
    config:
      base_url: env:SENTINELONE_BASE_URL
      family: site
      per_page: "200"
      token: env:SENTINELONE_API_TOKEN
  - localId: activity
    config:
      base_url: env:SENTINELONE_BASE_URL
      family: activity
      per_page: "200"
      token: env:SENTINELONE_API_TOKEN
