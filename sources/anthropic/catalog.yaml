id: anthropic
name: Anthropic
description: Anthropic organization user, workspace, and API key source.
emitted_kinds:
  - anthropic.user
  - anthropic.workspace
  - anthropic.api_key
coverage_contract:
  owner_domain: ai
  authority_domain: anthropic
  dimensions:
    - id: api_keys
      type: app_entitlement
      title: API keys
      families: [api_key]
      support: supported
      high_value: true
    - id: users
      type: entity_family
      title: Organization users
      families: [user]
      support: supported
      high_value: true
    - id: workspaces
      type: entity_family
      title: Workspaces
      families: [workspace]
      support: supported
      high_value: true
event_contracts:
  - kind: anthropic.user
    schema_ref: anthropic/user/v1
    required_attributes:
      - user_id
    required_payload_fields:
      - id
  - kind: anthropic.workspace
    schema_ref: anthropic/workspace/v1
    required_attributes:
      - workspace_id
    required_payload_fields:
      - id
  - kind: anthropic.api_key
    schema_ref: anthropic/api_key/v1
    required_attributes:
      - api_key_id
    required_payload_fields:
      - id
