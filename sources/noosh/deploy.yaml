sourceId: noosh
secretKeys:
  - NOOSH_CLIENT_WORKGROUP_ID
  - NOOSH_PROJECT_ID
  - NOOSH_USER_ID
  - NOOSH_WORKGROUP_ID
  - NOOSH_TOKEN
runtimes:
  - localId: workgroup
    config:
      client_workgroup_id: env:NOOSH_CLIENT_WORKGROUP_ID
      project_id: env:NOOSH_PROJECT_ID
      user_id: env:NOOSH_USER_ID
      workgroup_id: env:NOOSH_WORKGROUP_ID
      family: workgroup
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/workgroups
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:NOOSH_TOKEN
