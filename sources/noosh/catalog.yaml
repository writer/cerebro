  - kind: noosh.clientworkgroups_projecthomeuserfield
    schema_ref: noosh/clientworkgroups_projecthomeuserfield/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - is_required
  - kind: noosh.teammember
    schema_ref: noosh/teammember/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - name
  - kind: noosh.teammembersofclientproject
    schema_ref: noosh/teammembersofclientproject/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - name
  - kind: noosh.memberrole
    schema_ref: noosh/memberrole/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - role_id
  - kind: noosh.billingrecipient
    schema_ref: noosh/billingrecipient/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - email
