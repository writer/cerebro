id: noosh
name: "Noosh"
description: "Collects workgroup, projecthomeuserfield, automaticinvitation, clientworkgroup, supplierworkgroup, and teamtemplate from Noosh and projects them into the Cerebro graph as assets, groups, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - noosh.workgroup
  - noosh.projecthomeuserfield
  - noosh.automaticinvitation
  - noosh.clientworkgroup
  - noosh.supplierworkgroup
  - noosh.teamtemplate
  - noosh.workgroupmember
  - noosh.clientworkgroups_projecthomeuserfield
  - noosh.teammember
  - noosh.teammembersofclientproject
  - noosh.memberrole
  - noosh.billingrecipient
kind_lifecycle:
  - kind: noosh.workgroup
    status: active
  - kind: noosh.projecthomeuserfield
    status: active
  - kind: noosh.automaticinvitation
    status: active
  - kind: noosh.clientworkgroup
    status: active
  - kind: noosh.supplierworkgroup
    status: active
  - kind: noosh.teamtemplate
    status: active
  - kind: noosh.workgroupmember
    status: active
  - kind: noosh.clientworkgroups_projecthomeuserfield
    status: active
  - kind: noosh.teammember
    status: active
  - kind: noosh.teammembersofclientproject
    status: active
  - kind: noosh.memberrole
    status: active
  - kind: noosh.billingrecipient
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: noosh
  dimensions:
    - id: workgroup
      type: entity_family
      title: "Workgroup"
      families: [workgroup]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
