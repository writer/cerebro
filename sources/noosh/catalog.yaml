event_contracts:
  - kind: noosh.workgroup
    schema_ref: noosh/workgroup/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - is_default
  - kind: noosh.projecthomeuserfield
    schema_ref: noosh/projecthomeuserfield/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - is_required
  - kind: noosh.automaticinvitation
    schema_ref: noosh/automaticinvitation/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - automatic_invitation_type_name
  - kind: noosh.clientworkgroup
    schema_ref: noosh/clientworkgroup/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
