sourceId: jumpseller
secretKeys:
  - JUMPSELLER_TOKEN
runtimes:
  - localId: hooks-json
    config:
      family: hooks_json
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /hooks.json
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:JUMPSELLER_TOKEN
