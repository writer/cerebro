id: jumpseller
name: "Jumpseller"
description: "Collects hooks json, checkout custom fields json, countries json, custom fields json, customer categories json, and customers json from Jumpseller and projects them into the Cerebro graph as assets for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - jumpseller.hooks_json
  - jumpseller.checkout_custom_fields_json
  - jumpseller.countries_json
  - jumpseller.custom_fields_json
  - jumpseller.customer_categories_json
  - jumpseller.customers_json
  - jumpseller.fulfillments_json
  - jumpseller.jsapps_json
  - jumpseller.orders_json
  - jumpseller.pages_json
  - jumpseller.payment_methods_json
  - jumpseller.products_json
kind_lifecycle:
  - kind: jumpseller.hooks_json
    status: active
  - kind: jumpseller.checkout_custom_fields_json
    status: active
  - kind: jumpseller.countries_json
    status: active
