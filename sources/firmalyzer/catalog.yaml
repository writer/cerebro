id: firmalyzer
name: "Firmalyzer IoTVAS"
description: "Collects config issue, account, private key, and risk from Firmalyzer IoTVAS and projects them into the Cerebro graph as findings, users, and assets for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - firmalyzer.config_issue
  - firmalyzer.account
  - firmalyzer.private_key
  - firmalyzer.risk
runtime_families:
  - account
  - config_issue
  - private_key
  - risk
kind_lifecycle:
  - kind: firmalyzer.config_issue
    status: active
  - kind: firmalyzer.account
    status: active
  - kind: firmalyzer.private_key
    status: active
  - kind: firmalyzer.risk
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: firmalyzer
  dimensions:
    - id: config_issue
      type: remediation_state
      title: "Config Issue"
      families: [config_issue]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: account
      type: entity_family
      title: "Account"
      families: [account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: private_key
      type: entity_family
      title: "Private Key"
      families: [private_key]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: risk
      type: remediation_state
      title: "Risk"
      families: [risk]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: firmalyzer.config_issue
    schema_ref: firmalyzer/config_issue/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - config_file
  - kind: firmalyzer.account
    schema_ref: firmalyzer/account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - uid
  - kind: firmalyzer.private_key
    schema_ref: firmalyzer/private_key/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - algorithm
  - kind: firmalyzer.risk
    schema_ref: firmalyzer/risk/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - name
