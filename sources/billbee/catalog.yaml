id: billbee
name: "Billbee"
description: "Collects webhook, cloudstorage, custom field, customer, customer addresses, and layout from Billbee and projects them into the Cerebro graph as assets for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - billbee.webhook
  - billbee.cloudstorage
  - billbee.custom_field
  - billbee.customer
  - billbee.customer_addresses
  - billbee.layout
  - billbee.order
  - billbee.product
  - billbee.shipment
  - billbee.stock
  - billbee.addresses
  - billbee.image
runtime_families:
  - addresses
  - cloudstorage
  - custom_field
  - customer
  - customer_addresses
  - image
  - layout
  - order
  - product
  - shipment
  - stock
  - webhook
kind_lifecycle:
  - kind: billbee.webhook
    status: active
  - kind: billbee.cloudstorage
    status: active
  - kind: billbee.custom_field
    status: active
  - kind: billbee.customer
    status: active
  - kind: billbee.customer_addresses
    status: active
  - kind: billbee.layout
    status: active
  - kind: billbee.order
    status: active
  - kind: billbee.product
    status: active
  - kind: billbee.shipment
    status: active
  - kind: billbee.stock
    status: active
  - kind: billbee.addresses
    status: active
  - kind: billbee.image
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: billbee
