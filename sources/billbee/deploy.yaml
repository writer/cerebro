sourceId: billbee
secretKeys:
  - BILLBEE_ID
  - BILLBEE_PRODUCTID
  - BILLBEE_API_TOKEN
runtimes:
  - localId: webhook
    config:
      id: env:BILLBEE_ID
      productid: env:BILLBEE_PRODUCTID
      family: webhook
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v1/webhooks
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:BILLBEE_API_TOKEN
