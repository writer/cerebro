sourceId: configcat
secretKeys:
  - CONFIGCAT_ORGANIZATIONID
  - CONFIGCAT_PRODUCTID
  - CONFIGCAT_TOKEN
runtimes:
  - localId: auditlog
    config:
      organizationid: env:CONFIGCAT_ORGANIZATIONID
      productid: env:CONFIGCAT_PRODUCTID
      family: auditlog
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/organizations/${config.organizationid}/auditlogs
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:CONFIGCAT_TOKEN
