sourceId: taxamo
secretKeys:
  - TAXAMO_KEY
  - TAXAMO_API_TOKEN
runtimes:
  - localId: payment
    config:
      key: env:TAXAMO_KEY
      family: payment
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v1/transactions/${config.key}/payments
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:TAXAMO_API_TOKEN
