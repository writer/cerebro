id: motaword
name: "MotaWord"
description: "Collects comment, user, permission, corporates user, user group, and user group 2 from MotaWord and projects them into the Cerebro graph as assets, audit events, and users for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - motaword.comment
  - motaword.user
  - motaword.permission
  - motaword.corporates_user
  - motaword.user_group
  - motaword.user_group_2
  - motaword.blog
  - motaword.activity
  - motaword.projects_activity
  - motaword.activities_comment
  - motaword.corporate_user
  - motaword.corporate_user_group
kind_lifecycle:
  - kind: motaword.comment
    status: active
  - kind: motaword.user
    status: active
  - kind: motaword.permission
    status: active
  - kind: motaword.corporates_user
    status: active
