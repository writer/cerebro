  - kind: motaword.activities_comment
    status: active
  - kind: motaword.corporate_user
    status: active
  - kind: motaword.corporate_user_group
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: motaword
  dimensions:
