id: jfrog_artifactory_xray
name: "JFrog Artifactory/Xray"
description: "Collects assets, findings, and vulnerabilities from JFrog Artifactory/Xray and projects them into the Cerebro graph as assets, findings, and vulnerabilities for repository, build, deployment, and release context."
emitted_kinds:
  - jfrog_artifactory_xray.assets
  - jfrog_artifactory_xray.findings
  - jfrog_artifactory_xray.vulnerabilities
runtime_families:
  - assets
  - findings
  - vulnerabilities
kind_lifecycle:
  - kind: jfrog_artifactory_xray.assets
    status: active
  - kind: jfrog_artifactory_xray.findings
    status: active
  - kind: jfrog_artifactory_xray.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: jfrog_artifactory_xray
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: jfrog_artifactory_xray.assets
    schema_ref: jfrog_artifactory_xray/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: jfrog_artifactory_xray.findings
    schema_ref: jfrog_artifactory_xray/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: jfrog_artifactory_xray.vulnerabilities
    schema_ref: jfrog_artifactory_xray/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
