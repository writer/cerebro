id: duo
name: Duo
description: Collects Duo users, groups, administrators, endpoints, MFA factors, administrator roles, protected applications, activity logs, and authentication logs from the Duo Admin API.
provider_api:
  status: verified
  transport: rest
  auth: duo_signed_admin_api
  base_url: https://api-XXXXXXXX.duosecurity.com
  references:
    - https://duo.com/docs/adminapi
    - https://github.com/duosecurity/duo_client_python/blob/master/duo_client/admin.py
    - https://github.com/duosecurity/duo_api_golang/blob/master/duoapi.go
  families:
    - id: user
      method: GET
      path: /admin/v1/users
    - id: group
      method: GET
      path: /admin/v1/groups
    - id: administrator
      method: GET
      path: /admin/v1/admins
    - id: endpoint
      method: GET
      path: /admin/v1/endpoints
    - id: phone
      method: GET
      path: /admin/v1/phones
    - id: token
      method: GET
      path: /admin/v1/tokens
    - id: web_authn_credential
      method: GET
      path: /admin/v1/webauthncredentials
    - id: role
      method: GET
      path: /admin/v1/admin_roles
    - id: application
      method: GET
      path: /admin/v3/integrations
    - id: audit_event
      method: GET
      path: /admin/v2/logs/activity
    - id: authentication_log
      method: GET
      path: /admin/v2/logs/authentication
emitted_kinds:
  - duo.user
  - duo.group
  - duo.administrator
  - duo.endpoint
  - duo.phone
  - duo.token
  - duo.web_authn_credential
  - duo.role
  - duo.application
  - duo.audit_event
  - duo.authentication_log
runtime_families:
  - user
  - group
  - administrator
  - endpoint
  - phone
  - token
  - web_authn_credential
  - role
  - application
  - audit_event
  - authentication_log
kind_lifecycle:
  - kind: duo.user
    status: active
  - kind: duo.group
    status: active
  - kind: duo.administrator
    status: active
  - kind: duo.endpoint
    status: active
