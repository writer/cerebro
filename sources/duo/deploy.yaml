sourceId: duo
secretKeys:
  - DUO_TENANT_ID
  - DUO_BASE_URL
  - DUO_CLIENT_ID
  - DUO_CLIENT_SECRET
  - DUO_ACTIVITY_MINTIME
  - DUO_ACTIVITY_MAXTIME
  - DUO_AUTH_MINTIME
  - DUO_AUTH_MAXTIME
runtimes:
  - localId: users
    config:
      tenant_id: env:DUO_TENANT_ID
      base_url: env:DUO_BASE_URL
      family: user
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /admin/v1/users
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:DUO_CLIENT_ID
      client_secret: env:DUO_CLIENT_SECRET
