id: tailscale
name: Tailscale
description: Tailscale tailnet, user, device, group, tag, service, and grant source.
emitted_kinds:
  - tailscale.tailnet
  - tailscale.user
  - tailscale.device
  - tailscale.group
  - tailscale.tag
  - tailscale.service
  - tailscale.grant
coverage_contract:
  owner_domain: network
  authority_domain: tailscale
  dimensions:
    - id: acl_grants
      type: app_entitlement
      title: ACL grants
      families: [grant]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
    - id: devices
      type: entity_family
      title: Devices
      families: [device]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: groups
      type: relationship
      title: ACL groups
      families: [group]
      support: supported
      high_value: true
      evidence_types: [relationship_evidence]
      control_domains: [asset_inventory]
    - id: services
      type: entity_family
      title: Services
      families: [service]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: tag_owners
      type: app_entitlement
      title: Tag owners
      families: [tag]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
    - id: tailnet
      type: entity_family
      title: Tailnet settings
      families: [tailnet]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: users
      type: entity_family
      title: Users
      families: [user]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
event_contracts:
  - kind: tailscale.tailnet
    schema_ref: tailscale/tailnet/v1
    required_attributes:
      - tailnet
    required_payload_fields:
      - id
  - kind: tailscale.user
    schema_ref: tailscale/user/v1
    required_attributes:
      - user_id
      - login_name
    required_payload_fields:
      - id
  - kind: tailscale.device
    schema_ref: tailscale/device/v1
    required_attributes:
      - device_id
    required_payload_fields:
      - id
  - kind: tailscale.group
    schema_ref: tailscale/group/v1
    required_attributes:
      - group_id
    required_payload_fields:
      - id
  - kind: tailscale.tag
    schema_ref: tailscale/tag/v1
    required_attributes:
      - tag_id
    required_payload_fields:
      - id
  - kind: tailscale.service
    schema_ref: tailscale/service/v1
    required_attributes:
      - service_id
    required_payload_fields:
      - id
  - kind: tailscale.grant
    schema_ref: tailscale/grant/v1
    required_attributes:
      - grant_id
    required_payload_fields:
      - id
