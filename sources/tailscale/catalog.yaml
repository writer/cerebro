id: tailscale
name: Tailscale
description: Tailscale source for tailnet settings, user inventory, device inventory, ACL groups, tag ownership, Services inventory, and policy grants.
provider_api:
  status: verified
  transport: rest
  auth: bearer_token
  base_url: https://api.tailscale.com/api/v2
  references:
    - https://tailscale.com/docs/reference/tailscale-api
    - https://tailscale.com/api
    - https://tailscale.com/docs/reference/trust-credentials
    - https://tailscale.com/docs/features/oauth-clients
    - https://tailscale.com/docs/reference/syntax/policy-file
    - https://tailscale.com/docs/features/tailscale-services
    - https://github.com/tailscale/tailscale/blob/b727675a8be8eb307420eb5e6cb8d7b902eb751b/client/tailscale/devices.go
    - https://github.com/tailscale/tailscale/blob/b727675a8be8eb307420eb5e6cb8d7b902eb751b/client/tailscale/acl.go
    - https://github.com/tailscale/tailscale/blob/b727675a8be8eb307420eb5e6cb8d7b902eb751b/internal/client/tailscale/vip_service.go
  families:
    - id: device
      method: GET
      path: /tailnet/{tailnet}/devices
    - id: grant
      method: GET
      path: /tailnet/{tailnet}/acl
    - id: group
      method: GET
      path: /tailnet/{tailnet}/acl
    - id: service
      method: GET
      path: /tailnet/{tailnet}/vip-services
    - id: tag
      method: GET
      path: /tailnet/{tailnet}/acl
    - id: tailnet
      method: GET
      path: /tailnet/{tailnet}/settings
    - id: user
      method: GET
      path: /tailnet/{tailnet}/users
emitted_kinds:
  - tailscale.tailnet
  - tailscale.user
  - tailscale.device
  - tailscale.group
  - tailscale.tag
  - tailscale.service
  - tailscale.grant
runtime_families:
  - device
  - grant
  - group
  - service
  - tag
  - tailnet
  - user
coverage_contract:
  owner_domain: network
  authority_domain: tailscale
  dimensions:
    - id: acl_grants
      type: app_entitlement
      title: ACL grants
      families: [grant]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "5"
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: "CIS Controls v8"
          control_id: "12"
        - framework_name: "CIS Controls v8"
          control_id: "13"
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: SOC 2
          control_id: CC6.3
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-4
        - framework_name: "NIST 800-53 r5"
          control_id: AC-6
        - framework_name: "NIST 800-53 r5"
          control_id: SC-7
        - framework_name: "PCI DSS v4.0.1"
          control_id: "1.3"
        - framework_name: "PCI DSS v4.0.1"
          control_id: "1.4"
        - framework_name: "PCI DSS v4.0.1"
          control_id: "7.2"
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.8.20
        - framework_name: "ISO 27001:2022"
