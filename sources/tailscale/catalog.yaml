      type: entity_family
      title: Devices
      families: [device, external_device]
      support: supported
      high_value: true
      evidence_types: [identity_configuration, network_exposure, source_snapshot]
      control_domains: [asset_inventory, identity_access, network_security]
      control_refs:
        - framework_name: "CIS Controls v8"
