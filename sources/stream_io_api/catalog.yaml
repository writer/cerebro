id: stream_io_api
name: "Stream"
description: "Collects member, role, device, and query banned user from Stream and projects them into the Cerebro graph as users, groups, and assets for repository, build, deployment, and release context."
emitted_kinds:
  - stream_io_api.member
  - stream_io_api.role
  - stream_io_api.device
  - stream_io_api.query_banned_user
runtime_families:
  - device
  - member
  - query_banned_user
  - role
kind_lifecycle:
  - kind: stream_io_api.member
    status: active
  - kind: stream_io_api.role
    status: active
  - kind: stream_io_api.device
    status: active
  - kind: stream_io_api.query_banned_user
    status: active
provider_api:
  status: verified
  basis: discovered
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: token_authorization_header
  base_url: https://chat.stream-io-api.com
  spec_url: https://api.apis.guru/v2/specs/stream-io-api.com/v79.19.1/openapi.json
  spec_kind: openapi
  references:
    - https://api.apis.guru/v2/specs/stream-io-api.com/v79.19.1/openapi.json
    - https://stream-openapi.s3.us-east-1.amazonaws.com/chat/openapi-latest.yaml
  families:
    - id: device
      method: GET
      path: /devices
    - id: member
      method: GET
      path: /members
    - id: query_banned_user
      method: GET
      path: /query_banned_users
    - id: role
      method: GET
      path: /roles
coverage_contract:
  owner_domain: source_runtime
  authority_domain: stream_io_api
  dimensions:
    - id: member
      type: entity_family
      title: "Member"
      families: [member]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: role
      type: entity_family
      title: "Role"
      families: [role]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: device
      type: entity_family
      title: "Device"
      families: [device]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: query_banned_user
      type: entity_family
      title: "Query Banned User"
      families: [query_banned_user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: stream_io_api.member
    schema_ref: stream_io_api/member/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - ban_expires
  - kind: stream_io_api.role
    schema_ref: stream_io_api/role/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - name
  - kind: stream_io_api.device
    schema_ref: stream_io_api/device/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: stream_io_api.query_banned_user
    schema_ref: stream_io_api/query_banned_user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - banned_by
