id: kubernetes
name: Kubernetes
description: Kubernetes cluster, workload, service account, and workload identity source.
emitted_kinds:
  - kubernetes.cluster
  - kubernetes.ingress
  - kubernetes.namespace
  - kubernetes.node
  - kubernetes.pod
  - kubernetes.service
  - kubernetes.container
  - kubernetes.rbac_binding
  - kubernetes.rbac_role
  - kubernetes.service_account
  - kubernetes.workload
  - kubernetes.workload_identity_binding
event_contracts:
  - kind: kubernetes.cluster
    schema_ref: kubernetes/cluster/v1
    required_attributes:
      - cluster_id
      - cluster_name
    required_payload_fields:
      - cluster_id
      - cluster_name
  - kind: kubernetes.ingress
    schema_ref: kubernetes/ingress/v1
    required_attributes:
      - cluster_id
      - namespace
      - ingress_name
    required_payload_fields:
      - name
      - namespace
      - rules
  - kind: kubernetes.namespace
    schema_ref: kubernetes/namespace/v1
    required_attributes:
      - cluster_id
      - namespace
    required_payload_fields:
      - name
      - uid
  - kind: kubernetes.node
    schema_ref: kubernetes/node/v1
    required_attributes:
      - cluster_id
      - node_name
      - ready
    required_payload_fields:
      - name
      - ready
      - node_info
  - kind: kubernetes.pod
    schema_ref: kubernetes/pod/v1
    required_attributes:
      - cluster_id
      - namespace
      - workload_uid
    required_payload_fields:
      - name
      - uid
      - namespace
  - kind: kubernetes.service
    schema_ref: kubernetes/service/v1
    required_attributes:
      - cluster_id
      - namespace
      - service_name
      - service_type
    required_payload_fields:
      - name
      - namespace
      - type
      - ports
  - kind: kubernetes.container
    schema_ref: kubernetes/container/v1
    required_attributes:
      - cluster_id
      - namespace
      - container_name
    required_payload_fields:
      - container_name
      - pod_uid
  - kind: kubernetes.rbac_binding
    schema_ref: kubernetes/rbac_binding/v1
    required_attributes:
      - cluster_id
      - binding_name
      - binding_kind
      - role_name
    required_payload_fields:
      - name
      - binding_kind
      - role_ref
  - kind: kubernetes.rbac_role
    schema_ref: kubernetes/rbac_role/v1
    required_attributes:
      - cluster_id
      - role_name
      - role_kind
    required_payload_fields:
      - name
      - role_kind
      - rules
  - kind: kubernetes.service_account
    schema_ref: kubernetes/service_account/v1
    required_attributes:
      - cluster_id
      - namespace
      - service_account_name
    required_payload_fields:
      - name
      - namespace
  - kind: kubernetes.workload
    schema_ref: kubernetes/workload/v1
    required_attributes:
      - cluster_id
      - namespace
      - workload_uid
    required_payload_fields:
      - workload_uid
      - workload_kind
      - workload_name
  - kind: kubernetes.workload_identity_binding
    schema_ref: kubernetes/workload_identity_binding/v1
    required_attributes:
      - cluster_id
      - namespace
      - service_account_name
      - cloud_provider
      - target_id
    required_payload_fields:
      - service_account_name
      - cloud_provider
      - target_id
