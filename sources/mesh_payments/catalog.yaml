id: mesh_payments
name: "Mesh Payments"
description: "Collects users, accounts, records, policies, and audit events from Mesh Payments and projects them into the Cerebro graph as users, assets, policies, and audit events for owner, account, evidence, and compliance context."
emitted_kinds:
  - mesh_payments.users
  - mesh_payments.accounts
  - mesh_payments.records
  - mesh_payments.policies
  - mesh_payments.audit_events
kind_lifecycle:
  - kind: mesh_payments.users
    status: active
  - kind: mesh_payments.accounts
    status: active
  - kind: mesh_payments.records
    status: active
  - kind: mesh_payments.policies
    status: active
  - kind: mesh_payments.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: mesh_payments
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: accounts
      type: entity_family
      title: "Accounts"
      families: [accounts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: records
      type: entity_family
      title: "Records"
      families: [records]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: policies
      type: entity_family
      title: "Policies"
      families: [policies]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: mesh_payments.users
    schema_ref: mesh_payments/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: mesh_payments.accounts
    schema_ref: mesh_payments/accounts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: mesh_payments.records
    schema_ref: mesh_payments/records/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: mesh_payments.policies
    schema_ref: mesh_payments/policies/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: mesh_payments.audit_events
    schema_ref: mesh_payments/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
