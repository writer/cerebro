id: postmark
name: "Postmark"
description: "Collects servers, domains, and audit events from Postmark and projects them into the Cerebro graph as assets and audit events for alert, incident, service health, and response context."
emitted_kinds:
  - postmark.servers
  - postmark.domains
  - postmark.audit_events
kind_lifecycle:
  - kind: postmark.servers
    status: active
  - kind: postmark.domains
    status: active
  - kind: postmark.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: postmark
  dimensions:
    - id: servers
      type: entity_family
      title: "Servers"
      families: [servers]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: domains
      type: entity_family
      title: "Domains"
      families: [domains]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: postmark.servers
    schema_ref: postmark/servers/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: postmark.domains
    schema_ref: postmark/domains/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: postmark.audit_events
    schema_ref: postmark/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
