sourceId: postmark
secretKeys:
  - POSTMARK_API_TOKEN
runtimes:
  - localId: servers
    config:
      family: servers
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /servers
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:POSTMARK_API_TOKEN
