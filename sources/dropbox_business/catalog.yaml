id: dropbox_business
name: "Dropbox Business"
description: "Collects users, content assets, and audit events from Dropbox Business and projects them into the Cerebro graph as users, assets, and audit events for workspace, document, message, and collaboration context."
emitted_kinds:
  - dropbox_business.users
  - dropbox_business.content_assets
  - dropbox_business.audit_events
runtime_families:
  - audit_events
  - content_assets
  - users
kind_lifecycle:
  - kind: dropbox_business.users
    status: active
  - kind: dropbox_business.content_assets
    status: active
  - kind: dropbox_business.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: dropbox_business
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: content_assets
      type: entity_family
      title: "Content Assets"
      families: [content_assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: dropbox_business.users
    schema_ref: dropbox_business/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: dropbox_business.content_assets
    schema_ref: dropbox_business/content_assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: dropbox_business.audit_events
    schema_ref: dropbox_business/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
