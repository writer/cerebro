sourceId: sonarcloud
secretKeys:
  - SONARCLOUD_TOKEN
runtimes:
  - localId: assets
    config:
      family: assets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /authentication/validate
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:SONARCLOUD_TOKEN
