id: sonarcloud
name: "SonarCloud"
description: "Collects assets, findings, and vulnerabilities from SonarCloud and projects them into the Cerebro graph as assets, findings, and vulnerabilities for repository, build, deployment, and release context."
emitted_kinds:
  - sonarcloud.assets
  - sonarcloud.findings
  - sonarcloud.vulnerabilities
kind_lifecycle:
  - kind: sonarcloud.assets
    status: active
  - kind: sonarcloud.findings
    status: active
  - kind: sonarcloud.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: sonarcloud
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: entity_family
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: entity_family
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: sonarcloud.assets
    schema_ref: sonarcloud/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: sonarcloud.findings
    schema_ref: sonarcloud/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: sonarcloud.vulnerabilities
    schema_ref: sonarcloud/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
