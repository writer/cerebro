id: snyk
name: "Snyk"
description: "Snyk application security source covering tenant inventory, organization and group access, service accounts, projects, targets, collections, cloud inventory, asset-to-project relationships, audit logs, issues, and package vulnerabilities. The runtime reads Snyk REST JSON:API endpoints with date-versioned requests, cursor pagination, org-scoped paths, group-scoped fanout, and configured asset relationship fanout, then projects identities, access, assets, findings, and relationships into the graph."
emitted_kinds:
  - snyk.orgs
  - snyk.groups
  - snyk.projects
  - snyk.targets
  - snyk.assets
  - snyk.findings
  - snyk.vulnerabilities
  - snyk.org_memberships
  - snyk.service_accounts
  - snyk.audit_logs
  - snyk.collections
  - snyk.cloud_environments
  - snyk.cloud_resources
  - snyk.cloud_scans
  - snyk.group_memberships
  - snyk.group_service_accounts
  - snyk.group_audit_logs
  - snyk.asset_project_relationships
  - snyk.asset_target_relationships
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-03T00:00:00Z
  transport: rest
  auth: snyk_api_token
  auth_mechanics: token_header
  base_url: https://api.snyk.io/rest
  spec_url: https://raw.githubusercontent.com/snyk/user-docs/main/developer-tools/.gitbook/assets/rest-spec.json
  spec_kind: openapi
  references:
    - https://github.com/snyk/user-docs/blob/main/developer-tools/.gitbook/assets/rest-spec.json
    - https://docs.snyk.io/snyk-api/rest-api/about-the-rest-api
    - https://docs.snyk.io/snyk-api/authentication-for-api
  families:
    - id: orgs
      method: GET
      path: /orgs
      description: Lists Snyk organizations visible to the token.
    - id: groups
      method: GET
      path: /groups
      description: Lists Snyk groups visible to the token.
    - id: projects
      method: GET
      path: /orgs/{org_id}/projects
      description: Lists projects in a configured Snyk organization.
    - id: targets
      method: GET
      path: /orgs/{org_id}/targets
      description: Lists import targets in a configured Snyk organization.
    - id: assets
      method: GET
      path: /orgs/{org_id}/inventory/assets
      description: Lists Snyk inventory assets in a configured organization.
    - id: findings
      method: GET
      path: /orgs/{org_id}/issues
      description: Lists Snyk issues for remediation state and affected scan items.
    - id: vulnerabilities
      method: GET
      path: /orgs/{org_id}/issues
      description: Lists package vulnerability issues using the provider issue type filter.
    - id: org_memberships
      method: GET
      path: /orgs/{org_id}/memberships
      description: Lists organization membership records with user and role relationships.
    - id: service_accounts
      method: GET
      path: /orgs/{org_id}/service_accounts
      description: Lists organization service accounts and role assignments.
    - id: audit_logs
      method: GET
      path: /orgs/{org_id}/audit_logs/search
      description: Searches organization audit events with cursor and size pagination.
    - id: collections
      method: GET
      path: /orgs/{org_id}/collections
      description: Lists organization collections and issue counters.
    - id: cloud_environments
      method: GET
      path: /orgs/{org_id}/cloud/environments
      description: Lists Snyk cloud environments and related projects.
    - id: cloud_resources
      method: GET
      path: /orgs/{org_id}/cloud/resources
      description: Lists cloud resources discovered by Snyk Cloud.
    - id: cloud_scans
      method: GET
      path: /orgs/{org_id}/cloud/scans
      description: Lists Snyk Cloud scan records and environment relationships.
    - id: group_memberships
      method: GET
      path: /groups/{group_id}/memberships
      description: Lists group membership records for configured group IDs.
    - id: group_service_accounts
      method: GET
      path: /groups/{group_id}/service_accounts
      description: Lists group service accounts for configured group IDs.
    - id: group_audit_logs
      method: GET
      path: /groups/{group_id}/audit_logs/search
      description: Searches group audit events with cursor and size pagination.
    - id: asset_project_relationships
      method: GET
      path: /orgs/{org_id}/inventory/assets/{asset_id}/relationships/projects
      description: Lists projects related to configured Snyk inventory asset IDs.
    - id: asset_target_relationships
      method: GET
      path: /orgs/{org_id}/inventory/assets/{asset_id}/relationships/targets
      description: Lists targets related to configured Snyk inventory asset IDs.
