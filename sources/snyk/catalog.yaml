id: snyk
name: "Snyk"
description: "Collects assets, findings, and vulnerabilities from Snyk and projects them into the Cerebro graph as assets, findings, and vulnerabilities for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - snyk.assets
  - snyk.findings
  - snyk.vulnerabilities
kind_lifecycle:
  - kind: snyk.assets
    status: active
  - kind: snyk.findings
    status: active
  - kind: snyk.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: snyk
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: entity_family
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: entity_family
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: snyk.assets
    schema_ref: snyk/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: snyk.findings
    schema_ref: snyk/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: snyk.vulnerabilities
    schema_ref: snyk/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
