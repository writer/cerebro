coverage_contract:
  owner_domain: source_runtime
  authority_domain: snyk
  dimensions:
    - id: tenant_inventory
      type: entity_family
      title: "Tenant inventory"
      families: [orgs, groups]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads `/orgs` and `/groups` with Snyk REST versioning and preserves organization and group IDs, names, slugs, and relationships.
    - id: org_access
      type: app_entitlement
      title: "Organization access"
      families: [org_memberships, service_accounts]
      support: supported
      high_value: true
      evidence_types: [access_review]
      control_domains: [identity_access]
      notes:
        - Reads `/orgs/{org_id}/memberships` and `/orgs/{org_id}/service_accounts` to project users, service accounts, groups, and role assignments.
    - id: group_access
      type: app_entitlement
      title: "Group access"
      families: [group_memberships, group_service_accounts]
      support: supported
      high_value: true
      evidence_types: [access_review]
      control_domains: [identity_access]
      notes:
        - Fans out across configured group IDs for `/groups/{group_id}/memberships` and `/groups/{group_id}/service_accounts`.
    - id: audit_activity
      type: audit_event
      title: "Audit activity"
      families: [audit_logs, group_audit_logs]
      support: supported
      high_value: true
      evidence_types: [audit_log]
      control_domains: [logging_monitoring, identity_access]
      notes:
        - Reads Snyk audit search endpoints using `cursor` and `size` pagination and projects actors to acted-on resources.
    - id: application_inventory
      type: entity_family
      title: "Application inventory"
      families: [projects, targets, collections]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory, remediation]
      notes:
        - Reads projects, targets, and collections for Snyk application scope and remediation grouping.
    - id: cloud_inventory
      type: entity_family
      title: "Cloud inventory"
      families: [assets, cloud_environments, cloud_resources, cloud_scans, asset_project_relationships, asset_target_relationships]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Snyk inventory assets, cloud environments, cloud resources, cloud scans, and configured asset relationships to connect assets to projects and targets.
    - id: remediation_state
      type: remediation_state
      title: "Issues and vulnerabilities"
      families: [findings, vulnerabilities]
      support: supported
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Reads `/orgs/{org_id}/issues` for Snyk issues and package vulnerabilities, preserving severity, status, title, type, and scan item references.
    - id: incremental_sync
      type: incremental_sync
      title: "Incremental cursor sync"
      families: [orgs, groups, projects, targets, assets, findings, vulnerabilities, org_memberships, service_accounts, audit_logs, collections, cloud_environments, cloud_resources, cloud_scans, group_memberships, group_service_accounts, group_audit_logs, asset_project_relationships, asset_target_relationships]
      support: supported
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      notes:
        - Uses Snyk REST `version`, `links.next`, `starting_after`/`limit`, and audit `cursor`/`size` pagination through the Source CDK cursor envelope.
