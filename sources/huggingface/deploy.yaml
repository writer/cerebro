sourceId: huggingface
secretKeys:
  - HUGGINGFACE_ORGANIZATION
  - HUGGINGFACE_TOKEN
runtimes:
  - localId: organization-members
    config:
      organization: env:HUGGINGFACE_ORGANIZATION
      family: organization_members
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /whoami-v2
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:HUGGINGFACE_TOKEN
