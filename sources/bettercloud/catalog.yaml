id: bettercloud
name: "Bettercloud"
description: "Collects users, groups, roles, applications, and audit events from Bettercloud and projects them into the Cerebro graph as users, groups, policies, assets, and audit events for identity, access, device, and secret context."
emitted_kinds:
  - bettercloud.users
  - bettercloud.groups
  - bettercloud.roles
  - bettercloud.applications
  - bettercloud.audit_events
kind_lifecycle:
  - kind: bettercloud.users
    status: active
  - kind: bettercloud.groups
    status: active
  - kind: bettercloud.roles
    status: active
  - kind: bettercloud.applications
    status: active
  - kind: bettercloud.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: bettercloud
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: roles
      type: entity_family
      title: "Roles"
      families: [roles]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: applications
      type: entity_family
      title: "Applications"
      families: [applications]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: bettercloud.users
    schema_ref: bettercloud/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: bettercloud.groups
    schema_ref: bettercloud/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: bettercloud.roles
    schema_ref: bettercloud/roles/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: bettercloud.applications
    schema_ref: bettercloud/applications/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: bettercloud.audit_events
    schema_ref: bettercloud/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
