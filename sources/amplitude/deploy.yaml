sourceId: amplitude
secretKeys:
  - AMPLITUDE_TOKEN
runtimes:
  - localId: users
    config:
      base_url: https://core.amplitude.com
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /scim/1/Users
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:AMPLITUDE_TOKEN
