id: amplitude
name: "Amplitude"
description: "Collects Amplitude SCIM users and permission groups from the documented SCIM API and projects them into the Cerebro graph as identity users and groups for access inventory and lifecycle context."
emitted_kinds:
  - amplitude.users
  - amplitude.groups
runtime_families:
  - groups
  - users
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: scim_bearer_token_authorization_header
  base_url: https://core.amplitude.com
  spec_url: https://raw.githubusercontent.com/api-evangelist/amplitude/refs/heads/main/openapi/amplitude-scim-api-openapi.yml
  spec_kind: openapi
  references:
    - https://amplitude.com/docs/apis/analytics/scim
    - https://amplitude.com/docs/apis/keys-and-tokens
    - https://raw.githubusercontent.com/api-evangelist/amplitude/refs/heads/main/openapi/amplitude-scim-api-openapi.yml
  families:
    - id: groups
      method: GET
      path: /scim/1/Groups
      operation: listScimGroups
    - id: users
      method: GET
      path: /scim/1/Users
      operation: listScimUsers
kind_lifecycle:
  - kind: amplitude.users
    status: active
  - kind: amplitude.groups
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: amplitude
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Amplitude organization users from the documented GET /scim/1/Users SCIM API endpoint.
    - id: groups
      type: entity_family
      title: "Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [identity_access]
      notes:
        - Reads Amplitude permission groups from the documented GET /scim/1/Groups SCIM API endpoint.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: amplitude.users
    schema_ref: amplitude/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: amplitude.groups
    schema_ref: amplitude/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
      - group_name
    required_payload_fields:
      - id
