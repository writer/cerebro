sourceId: airtable
secretKeys:
  - AIRTABLE_TOKEN
runtimes:
  - localId: bases
    config:
      family: bases
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v0/meta/whoami
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      token: env:AIRTABLE_TOKEN
