id: airtable
name: "Airtable"
description: "Collects enterprise users, bases, and audit log events from Airtable and maps them into the Cerebro graph as users, assets, and audit events for workspace, base, and collaboration context."
emitted_kinds:
  - airtable.users
  - airtable.bases
  - airtable.audit_events
runtime_families:
  - audit_events
  - bases
  - users
kind_lifecycle:
  - kind: airtable.users
    status: active
  - kind: airtable.bases
    status: active
  - kind: airtable.audit_events
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: authorization_bearer_header_personal_access_token
  base_url: https://api.airtable.com
  spec_url: https://airtable.com/developers/web/api
  spec_kind: openapi_embedded_html
  references:
    - https://airtable.com/developers/web/api/authentication
    - https://airtable.com/developers/web/api/list-bases
    - https://airtable.com/developers/web/api/get-users-by-id-or-email
    - https://airtable.com/developers/web/api/audit-log-events
  families:
    - id: audit_events
      method: GET
      path: /v0/meta/enterpriseAccounts/{enterpriseAccountId}/auditLogEvents
      operation: list_audit_log_events
    - id: bases
      method: GET
      path: /v0/meta/bases
      operation: list_bases
    - id: users
      method: GET
      path: /v0/meta/enterpriseAccounts/{enterpriseAccountId}/users
      operation: get_users_by_id_or_email
coverage_contract:
  owner_domain: source_runtime
  authority_domain: airtable
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Maps Airtable enterprise user records returned by the documented users-by-id-or-email endpoint.
    - id: bases
      type: entity_family
      title: "Bases"
      families: [bases]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Maps Airtable base metadata returned by the documented List bases endpoint.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Maps Airtable enterprise audit log event records from the documented Audit Log Events API.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: airtable.users
    schema_ref: airtable/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: airtable.bases
    schema_ref: airtable/bases/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: airtable.audit_events
    schema_ref: airtable/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
