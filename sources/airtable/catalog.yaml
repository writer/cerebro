id: airtable
name: "Airtable"
description: "Collects users, projects, and audit events from Airtable and projects them into the Cerebro graph as users, assets, and audit events for workspace, document, message, and collaboration context."
emitted_kinds:
  - airtable.users
  - airtable.projects
  - airtable.audit_events
runtime_families:
  - audit_events
  - projects
  - users
kind_lifecycle:
  - kind: airtable.users
    status: active
  - kind: airtable.projects
    status: active
  - kind: airtable.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: airtable
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: projects
      type: entity_family
      title: "Projects"
      families: [projects]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: airtable.users
    schema_ref: airtable/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: airtable.projects
    schema_ref: airtable/projects/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: airtable.audit_events
    schema_ref: airtable/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
