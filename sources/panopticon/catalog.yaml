id: panopticon
name: Panopticon
description: Panopticon security operations source. Reads curated cases by default, with explicit alert and IOC families available for evidence and enrichment.
emitted_kinds:
  - panopticon.alert
  - panopticon.case
  - panopticon.ioc
coverage_contract:
  owner_domain: security_operations
  authority_domain: panopticon
  dimensions:
    - id: alerts
      type: lifecycle_state
      title: Alerts
      families: [alert]
      support: supported
      high_value: true
    - id: cases
      type: lifecycle_state
      title: Cases
      families: [case]
      support: supported
      high_value: true
    - id: iocs
      type: entity_family
      title: Indicators of compromise
      families: [ioc]
      support: supported
      high_value: true
event_contracts:
  - kind: panopticon.alert
    schema_ref: panopticon/alert/v1
    required_attributes:
      - alert_id
      - severity
      - status
    required_payload_fields:
      - alert_id
      - severity
      - status
      - title
  - kind: panopticon.case
    schema_ref: panopticon/case/v1
    required_attributes:
      - case_id
      - status
    required_payload_fields:
      - case_id
      - status
      - title
  - kind: panopticon.ioc
    schema_ref: panopticon/ioc/v1
    required_attributes:
      - ioc_id
      - ioc_type
      - value
    required_payload_fields:
      - ioc_id
      - ioc_type
      - value
