id: panopticon
name: Panopticon
description: Panopticon security operations source. Reads curated cases by default, with explicit alert and IOC families available for evidence and enrichment. Case payloads preserve Evidence CAS object references (evidence_id, CAS URI, digest) so projection and findings can correlate deterministically with Evidence CAS object projections.
emitted_kinds:
  - panopticon.alert
  - panopticon.case
  - panopticon.ioc
coverage_contract:
  owner_domain: security_operations
  authority_domain: panopticon
  dimensions:
    - id: alerts
      type: audit_event
      title: Raw alerts for evidence and enrichment
      families: [alert]
      support: supported
      high_value: false
    - id: cases
      type: lifecycle_state
      title: Curated cases
      families: [case]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
    - id: iocs
      type: entity_family
      title: Indicators of compromise
      families: [ioc]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
event_contracts:
  - kind: panopticon.alert
    schema_ref: panopticon/alert/v1
    required_attributes:
      - alert_id
      - severity
      - status
    required_payload_fields:
      - alert_id
      - severity
      - status
      - title
  - kind: panopticon.case
    schema_ref: panopticon/case/v1
    required_attributes:
      - case_id
      - status
    required_payload_fields:
      - case_id
      - status
      - title
  - kind: panopticon.ioc
    schema_ref: panopticon/ioc/v1
    required_attributes:
      - ioc_id
      - ioc_type
      - value
    required_payload_fields:
      - ioc_id
      - ioc_type
      - value
