sourceId: threatjammer
secretKeys:
  - THREATJAMMER_API_BASE_URL
  - THREATJAMMER_IP_ADDRESS
  - THREATJAMMER_TOKEN
runtimes:
  - localId: activity
    config:
      api_base_url: env:THREATJAMMER_API_BASE_URL
      ip_address: env:THREATJAMMER_IP_ADDRESS
      family: activity
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/token/activity
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:THREATJAMMER_TOKEN
