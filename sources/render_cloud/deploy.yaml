sourceId: render_cloud
secretKeys:
  - RENDER_CLOUD_BASE_URL
  - RENDER_CLOUD_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:RENDER_CLOUD_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:RENDER_CLOUD_TOKEN
