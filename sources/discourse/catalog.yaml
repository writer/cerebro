id: discourse
name: "Discourse"
description: "Collects groups json, user actions json, notifications json, and backups json from Discourse and projects them into the Cerebro graph as groups, users, alerts, and assets for workspace, document, message, and collaboration context."
emitted_kinds:
  - discourse.groups_json
  - discourse.user_actions_json
  - discourse.notifications_json
  - discourse.backups_json
kind_lifecycle:
  - kind: discourse.groups_json
    status: active
  - kind: discourse.user_actions_json
    status: active
  - kind: discourse.notifications_json
    status: active
  - kind: discourse.backups_json
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: discourse
  dimensions:
    - id: groups_json
      type: entity_family
      title: "Groups Json"
      families: [groups_json]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user_actions_json
      type: entity_family
      title: "User Actions Json"
      families: [user_actions_json]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: notifications_json
      type: alert_state
      title: "Notifications Json"
      families: [notifications_json]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: backups_json
      type: entity_family
      title: "Backups Json"
      families: [backups_json]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: discourse.groups_json
    schema_ref: discourse/groups_json/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: discourse.user_actions_json
    schema_ref: discourse/user_actions_json/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - slug
  - kind: discourse.notifications_json
    schema_ref: discourse/notifications_json/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_severity
    required_payload_fields:
      - id
  - kind: discourse.backups_json
    schema_ref: discourse/backups_json/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - filename
