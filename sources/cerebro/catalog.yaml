id: cerebro
name: Cerebro
description: Cerebro product telemetry source. Reads structured access audit telemetry exported as NDJSON archives.
emitted_kinds:
  - cerebro.api_access
coverage_contract:
  owner_domain: product_telemetry
  authority_domain: cerebro
  dimensions:
    - id: api_access
      type: audit_event
      title: API access telemetry
      families: [access]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
event_contracts:
  - kind: cerebro.api_access
    schema_ref: cerebro/api_access/v1
    required_attributes:
      - event_type
      - outcome_result
      - route
      - method
    required_payload_fields:
      - name
      - outcome
      - route
