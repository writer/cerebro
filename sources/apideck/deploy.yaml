sourceId: apideck
secretKeys:
  - APIDECK_API_TOKEN
runtimes:
  - localId: ledger-account
    config:
      family: ledger_account
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /accounting/ledger-accounts
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:APIDECK_API_TOKEN
