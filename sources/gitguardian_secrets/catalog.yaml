id: gitguardian_secrets
name: "GitGuardian Secrets"
description: "Collects secrets, sources, and audit events from GitGuardian Secrets and projects them into the Cerebro graph as secrets, repositories, and audit events for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - gitguardian_secrets.secrets
  - gitguardian_secrets.sources
  - gitguardian_secrets.audit_events
runtime_families:
  - audit_events
  - secrets
  - sources
kind_lifecycle:
  - kind: gitguardian_secrets.secrets
    status: active
  - kind: gitguardian_secrets.sources
    status: active
  - kind: gitguardian_secrets.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: gitguardian_secrets
  dimensions:
    - id: secrets
      type: entity_family
      title: "Secrets"
      families: [secrets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: sources
      type: entity_family
      title: "Sources"
      families: [sources]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: gitguardian_secrets.secrets
    schema_ref: gitguardian_secrets/secrets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: gitguardian_secrets.sources
    schema_ref: gitguardian_secrets/sources/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: gitguardian_secrets.audit_events
    schema_ref: gitguardian_secrets/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
