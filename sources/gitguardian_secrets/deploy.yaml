sourceId: gitguardian_secrets
secretKeys:
  - GITGUARDIAN_SECRETS_API_TOKEN
runtimes:
  - localId: secrets
    config:
      family: secrets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/health
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:GITGUARDIAN_SECRETS_API_TOKEN
