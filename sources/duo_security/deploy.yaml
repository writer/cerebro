sourceId: duo_security
secretKeys:
  - DUO_SECURITY_CLIENT_ID
  - DUO_SECURITY_CLIENT_SECRET
runtimes:
  - localId: users
    config:
      base_url: env:DUO_SECURITY_BASE_URL
      client_id: env:DUO_SECURITY_CLIENT_ID
      client_secret: env:DUO_SECURITY_CLIENT_SECRET
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /admin/v1/users
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
