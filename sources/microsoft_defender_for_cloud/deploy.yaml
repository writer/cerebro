sourceId: microsoft_defender_for_cloud
secretKeys:
  - MICROSOFT_DEFENDER_FOR_CLOUD_CLIENT_ID
  - MICROSOFT_DEFENDER_FOR_CLOUD_CLIENT_SECRET
runtimes:
  - localId: assets
    config:
      family: assets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /subscriptions
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:MICROSOFT_DEFENDER_FOR_CLOUD_CLIENT_ID
      client_secret: env:MICROSOFT_DEFENDER_FOR_CLOUD_CLIENT_SECRET
