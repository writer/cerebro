id: microsoft_defender_for_cloud
name: "Microsoft Defender for Cloud"
description: "Collects assets, findings, and vulnerabilities from Microsoft Defender for Cloud and projects them into the Cerebro graph as assets, findings, and vulnerabilities for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - microsoft_defender_for_cloud.assets
  - microsoft_defender_for_cloud.findings
  - microsoft_defender_for_cloud.vulnerabilities
kind_lifecycle:
  - kind: microsoft_defender_for_cloud.assets
    status: active
  - kind: microsoft_defender_for_cloud.findings
    status: active
  - kind: microsoft_defender_for_cloud.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: microsoft_defender_for_cloud
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: entity_family
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: entity_family
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: microsoft_defender_for_cloud.assets
    schema_ref: microsoft_defender_for_cloud/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: microsoft_defender_for_cloud.findings
    schema_ref: microsoft_defender_for_cloud/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: microsoft_defender_for_cloud.vulnerabilities
    schema_ref: microsoft_defender_for_cloud/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
