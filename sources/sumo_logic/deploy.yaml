sourceId: sumo_logic
secretKeys:
  - SUMO_LOGIC_TOKEN
runtimes:
  - localId: audit-events
    config:
      family: audit_events
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/collectors
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:SUMO_LOGIC_TOKEN
