id: sumo_logic
name: "Sumo Logic"
description: "Collects audit events, detections, and assets from Sumo Logic and projects them into the Cerebro graph as audit events, findings, and assets for alert, incident, service health, and response context."
emitted_kinds:
  - sumo_logic.audit_events
  - sumo_logic.findings
  - sumo_logic.assets
runtime_families:
  - assets
  - audit_events
  - findings
kind_lifecycle:
  - kind: sumo_logic.audit_events
    status: active
  - kind: sumo_logic.findings
    status: active
  - kind: sumo_logic.assets
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: sumo_logic
  dimensions:
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: sumo_logic.audit_events
    schema_ref: sumo_logic/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: sumo_logic.findings
    schema_ref: sumo_logic/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: sumo_logic.assets
    schema_ref: sumo_logic/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
