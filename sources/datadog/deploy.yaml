sourceId: datadog
secretKeys:
  - DATADOG_API_KEY
  - DATADOG_APP_KEY
runtimes:
  - localId: users
    config:
      family: users
      api_key: env:DATADOG_API_KEY
      application_key: env:DATADOG_APP_KEY
      health_path: /api/v1/validate
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      failure_modes: api_error,auth_error,rate_limit,schema_drift
