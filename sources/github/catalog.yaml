id: github
name: GitHub
description: GitHub audit, pull request, and Dependabot alert source.
emitted_kinds:
  - github.audit
  - github.code.repository
  - github.dependabot_alert
  - github.org_installation
  - github.org_member
  - github.pull_request
  - github.secret_scanning_alert
families:
  - id: audit
    incremental: cursor
  - id: dependabot_alert
    incremental: watermark
  - id: org_inventory
    freshness_probe:
      supported: true
      canary_kind: newest_audit_event
      confidence: heuristic
      reconciliation_interval: 24h
      max_skip_duration: 6h
      max_consecutive_skips: 3
  - id: pull_request
    incremental: watermark
  - id: repository
    incremental: watermark
    freshness_probe:
      supported: true
      canary_kind: newest_updated_resource
      confidence: heuristic
      reconciliation_interval: 24h
      max_skip_duration: 6h
      max_consecutive_skips: 3
  - id: secret_scanning_alert
    incremental: watermark
coverage_contract:
  owner_domain: source_control
  authority_domain: github
  dimensions:
    - id: actions_workflow_content
      type: entity_family
      title: Actions workflow content
      families: [repository, workflow_trigger, pull_request_target]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery, data_protection]
      control_refs:
        - framework_name: "NIST 800-53 r5"
          control_id: IA-5
        - framework_name: "NIST 800-53 r5"
          control_id: SC-12
        - framework_name: "PCI DSS v4.0.1"
          control_id: "3.5"
        - framework_name: "PCI DSS v4.0.1"
          control_id: "8.6"
      known_unsupported_fields:
        - full workflow file inventory through the repository family
    - id: actions_workflow_permissions
      type: app_entitlement
      title: Actions workflow permissions
      families: [repository, audit, actions_permissions, workflow_permissions, write_permissions]
      support: partial
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access, secure_delivery]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "5"
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-6
        - framework_name: "PCI DSS v4.0.1"
          control_id: "7.2"
        - framework_name: SOC 2
          control_id: CC6.2
      known_unsupported_fields:
        - complete repository and organization Actions permission inventory
    - id: audit_events
      type: audit_event
      title: Organization audit events
      families: [audit]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
    - id: code_security_alerts
      type: audit_event
      title: Code security alerts
      families: [dependabot_alert, secret_scanning_alert]
      support: supported
      high_value: true
      evidence_types: [vulnerability_management]
      control_domains: [vulnerability_management]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: SOC 2
          control_id: CC7.5
        - framework_name: "ISO 27001:2022"
          control_id: A.8.8
    - id: code_security_controls
      type: audit_event
      title: Code security control posture
      families: [repository, audit, code_security, secret_scanning, dependabot_alerts, vulnerability_alerts]
      support: partial
      high_value: true
      evidence_types: [vulnerability_management]
      control_domains: [secure_delivery, vulnerability_management]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      known_unsupported_fields:
        - full organization-level Advanced Security and code scanning configuration inventory
    - id: fine_grained_permissions
      type: app_entitlement
      title: Fine-grained repository permissions
      families: [org_inventory]
      support: partial
      high_value: true
      evidence_types: [access_review, identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
      known_unsupported_fields:
        - branch-protection bypass actors
        - repository rulesets
    - id: organization_authentication_policy
      type: audit_event
      title: Organization authentication policy
      families: [audit, org_auth, auth_control, authentication, mfa, 2fa, two_factor]
      support: partial
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: "CIS GitHub Benchmark"
          control_id: "1.3.1"
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
        - framework_name: "NIST 800-53 r5"
          control_id: IA-2
        - framework_name: "NIST 800-53 r5"
          control_id: IA-5
        - framework_name: "PCI DSS v4.0.1"
          control_id: "8.3"
        - framework_name: "PCI DSS v4.0.1"
          control_id: "8.4"
        - framework_name: SOC 2
          control_id: CC6.6
      known_unsupported_fields:
        - complete point-in-time organization authentication settings inventory
    - id: organization_network_policy
      type: audit_event
      title: Organization network access policy
      families: [audit, ip_allow_list, allow_list, cidr]
      support: partial
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access, network_security]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      known_unsupported_fields:
        - complete current IP allow list entries
    - id: organization_owners
      type: app_entitlement
      title: Organization owner assignments
      families: [org_inventory, audit, org_owner, organization_owner]
      support: partial
      high_value: true
      evidence_types: [access_review, identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.3
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.2
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      known_unsupported_fields:
        - complete owner-role inventory from the org member family
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: partial
      high_value: true
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      known_unsupported_fields:
        - org inventory snapshot deltas
    - id: programmatic_credentials
      type: app_entitlement
      title: Programmatic credentials and app installations
      families: [audit, org_inventory, personal_access_token, app_integration, integration_installation, github_app]
      support: partial
      high_value: true
      evidence_types: [access_review, identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      known_unsupported_fields:
        - complete fine-grained personal access token inventory
    - id: organization_members
      type: entity_family
      title: Organization members
      families: [org_inventory]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
    - id: pull_requests
      type: lifecycle_state
      title: Pull request lifecycle
      families: [pull_request]
      support: supported
      evidence_types: [change_management]
      control_domains: [secure_delivery]
      control_refs:
        - framework_name: SOC 2
          control_id: CC8.1
        - framework_name: "ISO 27001:2022"
          control_id: A.8.32
    - id: remediation_state
      type: remediation_state
      title: Remediation lifecycle state
      families: [dependabot_alert, pull_request, secret_scanning_alert]
      support: partial
      high_value: true
      evidence_types: [remediation_state, vulnerability_management]
      control_domains: [remediation, vulnerability_management]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.5
        - framework_name: "ISO 27001:2022"
          control_id: A.8.8
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - GitHub alert and pull request open, dismissed, resolved, closed, and merged states are surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
    - id: repositories
      type: entity_family
      title: Repositories
      families: [repository]
      support: supported
      high_value: true
      evidence_types: [asset_inventory, change_management]
      control_domains: [asset_inventory, secure_delivery]
      control_refs:
        - framework_name: SOC 2
          control_id: CC8.1
    - id: self_hosted_runners
      type: audit_event
      title: Self-hosted runners
      families: [audit, self_hosted_runner, runner]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery, identity_access]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      known_unsupported_fields:
        - complete current self-hosted runner inventory outside audit-observed changes
    - id: webhooks
      type: app_entitlement
      title: Webhook configuration
      families: [audit, webhook]
      support: partial
      high_value: true
      evidence_types: [change_management]
      control_domains: [secure_delivery, network_security]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "ISO 27001:2022"
          control_id: A.8.9
      known_unsupported_fields:
        - complete current webhook destination inventory outside audit-observed changes
event_contracts:
  - kind: github.audit
    schema_ref: github/audit/v1
    required_attributes:
      - action
      - org
    required_payload_fields:
      - action
      - org
  - kind: github.code.repository
    schema_ref: github/code_repository/v1
    required_attributes:
      - owner_login
      - repository
      - resource_id
      - resource_type
    required_payload_fields:
      - full_name
      - owner_login
  - kind: github.dependabot_alert
    schema_ref: github/dependabot_alert/v1
    required_attributes:
      - owner
      - repo
      - repository
      - state
    required_payload_fields:
      - number
      - repository
      - state
  - kind: github.pull_request
    schema_ref: github/pull_request/v1
    required_attributes:
      - owner
      - repo
      - repository
    required_payload_fields:
      - number
      - repository
  - kind: github.org_member
    schema_ref: github/org_member/v1
    required_attributes:
      - login
      - owner
      - role
    required_payload_fields:
      - login
      - org
      - role
  - kind: github.org_installation
    schema_ref: github/org_installation/v1
    required_attributes:
      - app_slug
      - installation_id
      - owner
    required_payload_fields:
      - app_slug
      - id
      - org
  - kind: github.secret_scanning_alert
    schema_ref: github/secret_scanning_alert/v1
    required_attributes:
      - owner
      - state
    required_payload_fields:
      - number
      - state
