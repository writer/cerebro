id: github
name: GitHub
description: GitHub audit, pull request, and Dependabot alert source.
emitted_kinds:
  - github.audit
  - github.code.repository
  - github.dependabot_alert
  - github.org_installation
  - github.org_member
  - github.pull_request
  - github.secret_scanning_alert
families:
  - id: audit
    incremental: cursor
  - id: dependabot_alert
    incremental: watermark
  - id: org_inventory
    freshness_probe:
      supported: true
      canary_kind: newest_audit_event
      confidence: heuristic
      reconciliation_interval: 24h
      max_skip_duration: 6h
      max_consecutive_skips: 3
  - id: pull_request
    incremental: watermark
  - id: repository
    incremental: watermark
    freshness_probe:
      supported: true
      canary_kind: newest_updated_resource
      confidence: heuristic
      reconciliation_interval: 24h
      max_skip_duration: 6h
      max_consecutive_skips: 3
  - id: secret_scanning_alert
    incremental: watermark
coverage_contract:
  owner_domain: source_control
  authority_domain: github
  dimensions:
    - id: audit_events
      type: audit_event
      title: Organization audit events
      families: [audit]
      support: supported
      high_value: true
    - id: code_security_alerts
      type: entity_family
      title: Code security alerts
      families: [dependabot_alert, secret_scanning_alert]
      support: supported
      high_value: true
    - id: fine_grained_permissions
      type: app_entitlement
      title: Fine-grained repository permissions
      families: [org_inventory]
      support: partial
      high_value: true
      known_unsupported_fields:
        - branch-protection bypass actors
        - repository rulesets
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: partial
      high_value: true
      known_unsupported_fields:
        - org inventory snapshot deltas
    - id: organization_members
      type: entity_family
      title: Organization members
      families: [org_inventory]
      support: supported
      high_value: true
    - id: pull_requests
      type: lifecycle_state
      title: Pull request lifecycle
      families: [pull_request]
      support: supported
    - id: remediation_state
      type: remediation_state
      title: Remediation lifecycle state
      support: unsupported
      high_value: true
      known_unsupported_fields:
        - remediation workflow state
      notes:
        - GitHub alert and pull request state is provider lifecycle state, not Cerebro finding remediation state.
        - Findings and source-runtime consumers must use Cerebro finding status for remediation lifecycle decisions.
    - id: repositories
      type: entity_family
      title: Repositories
      families: [repository]
      support: supported
      high_value: true
event_contracts:
  - kind: github.audit
    schema_ref: github/audit/v1
    required_attributes:
      - action
      - org
    required_payload_fields:
      - action
      - org
  - kind: github.code.repository
    schema_ref: github/code_repository/v1
    required_attributes:
      - owner_login
      - repository
      - resource_id
      - resource_type
    required_payload_fields:
      - full_name
      - owner_login
  - kind: github.dependabot_alert
    schema_ref: github/dependabot_alert/v1
    required_attributes:
      - owner
      - repo
      - repository
      - state
    required_payload_fields:
      - number
      - repository
      - state
  - kind: github.pull_request
    schema_ref: github/pull_request/v1
    required_attributes:
      - owner
      - repo
      - repository
    required_payload_fields:
      - number
      - repository
  - kind: github.org_member
    schema_ref: github/org_member/v1
    required_attributes:
      - login
      - owner
      - role
    required_payload_fields:
      - login
      - org
      - role
  - kind: github.org_installation
    schema_ref: github/org_installation/v1
    required_attributes:
      - app_slug
      - installation_id
      - owner
    required_payload_fields:
      - app_slug
      - id
      - org
  - kind: github.secret_scanning_alert
    schema_ref: github/secret_scanning_alert/v1
    required_attributes:
      - owner
      - state
    required_payload_fields:
      - number
      - state
