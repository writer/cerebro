sourceId: github
secretKeys:
  - GITHUB_TOKEN
runtimes:
  - localId: audit
    config:
      family: audit
      owner: writer
      per_page: "100"
      token: env:GITHUB_TOKEN
  - localId: repository
    config:
      family: repository
      owner: writer
      per_page: "100"
      token: env:GITHUB_TOKEN
  - localId: cerebro-repository
    config:
      family: repository
      owner: writer
      per_page: "100"
      repo: cerebro
      token: env:GITHUB_TOKEN
  - localId: cerebro-pull-request
    config:
      family: pull_request
      owner: writer
      per_page: "100"
      repo: cerebro
      state: all
      token: env:GITHUB_TOKEN
  - localId: cerebro-dependabot-alert
    config:
      family: dependabot_alert
      owner: writer
      per_page: "100"
      repo: cerebro
      state: open
      token: env:GITHUB_TOKEN
  - localId: cerebro-audit
    config:
      family: audit
      include: all
      order: desc
      owner: writer
      per_page: "100"
      phrase: repo:writer/cerebro
      token: env:GITHUB_TOKEN
  - localId: org-inventory
    config:
      family: org_inventory
      owner: writer
      per_page: "100"
      token: env:GITHUB_TOKEN
  - localId: secret-scanning-alert
    config:
      family: secret_scanning_alert
      owner: writer
      per_page: "100"
      state: open
      token: env:GITHUB_TOKEN
