sourceId: activtrak
secretKeys:
  - ACTIVTRAK_API_KEY
runtimes:
  - localId: users
    config:
      base_url: https://api.activtrak.com
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /scim/v1/ping
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_key: env:ACTIVTRAK_API_KEY
