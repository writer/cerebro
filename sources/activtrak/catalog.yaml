id: activtrak
name: "ActivTrak"
description: "Collects ActivTrak SCIM users and groups, administration clients and consumers, and activity-log events from the documented public API, then projects them into the Cerebro graph for identity, asset, access, and audit context."
emitted_kinds:
  - activtrak.users
  - activtrak.groups
  - activtrak.clients
  - activtrak.consumers
  - activtrak.activity_log
runtime_families:
  - activity_log
  - clients
  - consumers
  - groups
  - users
kind_lifecycle:
  - kind: activtrak.users
    status: active
  - kind: activtrak.groups
    status: active
  - kind: activtrak.clients
    status: active
  - kind: activtrak.consumers
    status: active
  - kind: activtrak.activity_log
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: x_api_key_header
  base_url: https://api.activtrak.com
  spec_url: https://developers.activtrak.com/reports/activity-log/get-activity-log.md
  spec_kind: api_reference_markdown
  references:
    - https://developers.activtrak.com/introduction
    - https://developers.activtrak.com/administration/scim/ping
    - https://developers.activtrak.com/administration/scim/users/get-users.md
    - https://developers.activtrak.com/administration/scim/groups/get-groups.md
    - https://developers.activtrak.com/administration/clients/get-all-clients.md
    - https://developers.activtrak.com/administration/consumers/get-all-consumers.md
    - https://developers.activtrak.com/reports/activity-log/get-activity-log.md
  families:
    - id: activity_log
      method: GET
      path: /reports/v2/activitylog
      operation: get_activity_log
    - id: clients
      method: GET
      path: /admin/v1/clients
      operation: get_all_clients
    - id: consumers
      method: GET
      path: /admin/v1/consumers
      operation: get_all_consumers
    - id: groups
      method: GET
      path: /scim/v1/groups
      operation: get_groups
    - id: users
      method: GET
      path: /scim/v1/users
      operation: get_users
coverage_contract:
  owner_domain: source_runtime
  authority_domain: activtrak
  dimensions:
    - id: users
      type: entity_family
      title: "SCIM Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Lists ActivTrak SCIM users through the documented `GET /scim/v1/users` endpoint.
    - id: groups
      type: entity_family
      title: "SCIM Groups"
      families: [groups]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Lists ActivTrak SCIM groups through the documented `GET /scim/v1/groups` endpoint.
    - id: clients
      type: entity_family
      title: "Clients"
      families: [clients]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Lists ActivTrak administration clients through the documented `GET /admin/v1/clients` endpoint.
    - id: consumers
      type: entity_family
      title: "Consumers"
      families: [consumers]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Lists ActivTrak app-access consumers and roles through the documented `GET /admin/v1/consumers` endpoint.
    - id: activity_log
      type: audit_event
      title: "Activity Log"
      families: [activity_log]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Reads ActivTrak activity-log events through the documented `GET /reports/v2/activitylog` endpoint.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: activtrak.users
    schema_ref: activtrak/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: activtrak.groups
    schema_ref: activtrak/groups/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: activtrak.clients
    schema_ref: activtrak/clients/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: activtrak.consumers
    schema_ref: activtrak/consumers/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: activtrak.activity_log
    schema_ref: activtrak/activity_log/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - logId
