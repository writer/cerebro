event_contracts:
  - kind: aws_bedrock.foundation_models
    schema_ref: aws_bedrock/foundation_models/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - modelId
  - kind: aws_bedrock.custom_models
    schema_ref: aws_bedrock/custom_models/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - modelArn
  - kind: aws_bedrock.provisioned_model_throughputs
    schema_ref: aws_bedrock/provisioned_model_throughputs/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - provisionedModelArn
  - kind: aws_bedrock.model_customization_jobs
    schema_ref: aws_bedrock/model_customization_jobs/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - deployment_id
      - deployment_name
    required_payload_fields:
      - jobArn
  - kind: aws_bedrock.guardrails
    schema_ref: aws_bedrock/guardrails/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
