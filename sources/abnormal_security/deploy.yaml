sourceId: abnormal_security
secretKeys:
  - ABNORMAL_SECURITY_BASE_URL
  - ABNORMAL_SECURITY_TOKEN
runtimes:
  - localId: resources
    config:
      base_url: env:ABNORMAL_SECURITY_BASE_URL
      family: resources
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /users
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ABNORMAL_SECURITY_TOKEN
