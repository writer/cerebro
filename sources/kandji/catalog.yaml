id: kandji
name: Kandji / Iru
description: Kandji/Iru Apple endpoint inventory, app inventory, and vulnerability remediation source.
emitted_kinds:
  - kandji.application
  - kandji.device
  - kandji.vulnerability
runtime_families:
  - application
  - device
  - vulnerability
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: authorization_bearer_token
  base_url: https://{sub_domain}.api.kandji.io/api/v1
  spec_url: https://www.postman.com/ksapitest/kandji-api-support-flows/collection/r796tjz/kandji-api
  spec_kind: postman_collection
  references:
    - https://api-docs.iru.com/
    - https://www.postman.com/ksapitest/kandji-api-support-flows/collection/r796tjz/kandji-api
    - https://support.kandji.io/kb/kandji-api
    - https://support.kandji.io/kb/prism
  auth_evidence:
    - https://support.kandji.io/kb/kandji-api
  families:
    - id: application
      method: GET
      path: /prism/apps
    - id: device
      method: GET
      path: /devices
    - id: device
      method: GET
      path: /devices/{device_id}/details
    - id: vulnerability
      method: GET
      path: /vulnerability-management/detections
event_contracts:
  - kind: kandji.application
    schema_ref: kandji/application/v1
    required_attributes:
      - family
  - kind: kandji.device
    schema_ref: kandji/device/v1
    required_attributes:
      - family
  - kind: kandji.vulnerability
    schema_ref: kandji/vulnerability/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: endpoint
  authority_domain: kandji
  dimensions:
    - id: devices
      type: entity_family
      title: Apple endpoint devices
      families: [device]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "CIS Controls v8"
          control_id: "1"
    - id: applications
      type: entity_family
      title: Installed applications
      families: [application]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "CIS Controls v8"
          control_id: "2"
    - id: vulnerabilities
      type: entity_family
      title: Endpoint application vulnerabilities
      families: [vulnerability]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "CIS Controls v8"
          control_id: "7"
    - id: remediation_state
      type: remediation_state
      title: Vulnerability remediation lifecycle state
      families: [vulnerability]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      control_refs:
        - framework_name: SOC 2
          control_id: CC7.5
        - framework_name: "CIS Controls v8"
          control_id: "7"
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - Kandji vulnerability remediation status is surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
