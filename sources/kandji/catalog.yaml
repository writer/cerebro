id: kandji
name: Kandji / Iru
description: Kandji/Iru Apple endpoint inventory, app inventory, and vulnerability remediation source.
emitted_kinds:
  - kandji.application
  - kandji.device
  - kandji.vulnerability
event_contracts:
  - kind: kandji.application
    schema_ref: kandji/application/v1
    required_attributes:
      - family
  - kind: kandji.device
    schema_ref: kandji/device/v1
    required_attributes:
      - family
  - kind: kandji.vulnerability
    schema_ref: kandji/vulnerability/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: endpoint
  authority_domain: kandji
  dimensions:
    - id: devices
      type: entity_family
      title: Apple endpoint devices
      families: [device]
      support: supported
      high_value: true
    - id: applications
      type: entity_family
      title: Installed applications
      families: [application]
      support: supported
      high_value: true
    - id: vulnerabilities
      type: entity_family
      title: Endpoint application vulnerabilities
      families: [vulnerability]
      support: supported
      high_value: true
    - id: remediation_state
      type: remediation_state
      title: Vulnerability remediation lifecycle state
      families: [vulnerability]
      support: partial
      high_value: true
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - Kandji vulnerability remediation status is surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
