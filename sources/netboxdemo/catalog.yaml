id: netboxdemo
name: "NetBox"
description: "Collects cluster group, secret, connected device, and device role from NetBox and projects them into the Cerebro graph as groups, secrets, and assets for repository, build, deployment, and release context."
emitted_kinds:
  - netboxdemo.cluster_group
  - netboxdemo.secret
  - netboxdemo.connected_device
  - netboxdemo.device_role
runtime_families:
  - cluster_group
  - connected_device
  - device_role
  - secret
kind_lifecycle:
  - kind: netboxdemo.cluster_group
    status: active
  - kind: netboxdemo.secret
    status: active
  - kind: netboxdemo.connected_device
    status: active
  - kind: netboxdemo.device_role
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: netboxdemo
  dimensions:
    - id: cluster_group
      type: entity_family
      title: "Cluster Group"
      families: [cluster_group]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: secret
      type: entity_family
      title: "Secret"
      families: [secret]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: connected_device
      type: entity_family
      title: "Connected Device"
      families: [connected_device]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: device_role
      type: entity_family
      title: "Device Role"
      families: [device_role]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: netboxdemo.cluster_group
    schema_ref: netboxdemo/cluster_group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: netboxdemo.secret
    schema_ref: netboxdemo/secret/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - secret_id
      - secret_name
    required_payload_fields:
      - id
  - kind: netboxdemo.connected_device
    schema_ref: netboxdemo/connected_device/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: netboxdemo.device_role
    schema_ref: netboxdemo/device_role/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
