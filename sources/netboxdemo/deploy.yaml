sourceId: netboxdemo
secretKeys:
  - NETBOXDEMO_API_TOKEN
runtimes:
  - localId: cluster-group
    config:
      family: cluster_group
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /virtualization/cluster-groups/
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:NETBOXDEMO_API_TOKEN
