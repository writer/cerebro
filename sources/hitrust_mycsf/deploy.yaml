sourceId: hitrust_mycsf
secretKeys:
  - HITRUST_MYCSF_API_TOKEN
runtimes:
  - localId: assessments
    config:
      family: assessments
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v1/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:HITRUST_MYCSF_API_TOKEN
