sourceId: onepassword_business
secretKeys:
  - ONEPASSWORD_BUSINESS_TOKEN
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/vaults
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ONEPASSWORD_BUSINESS_TOKEN
