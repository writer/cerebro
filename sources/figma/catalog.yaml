id: figma
name: "Figma"
description: "Collects users, projects, and audit events from Figma and projects them into the Cerebro graph as users, assets, and audit events for workspace, document, message, and collaboration context."
emitted_kinds:
  - figma.users
  - figma.projects
  - figma.audit_events
runtime_families:
  - audit_events
  - projects
  - users
kind_lifecycle:
  - kind: figma.users
    status: active
  - kind: figma.projects
    status: active
  - kind: figma.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: figma
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: projects
      type: entity_family
      title: "Projects"
      families: [projects]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: figma.users
    schema_ref: figma/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: figma.projects
    schema_ref: figma/projects/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: figma.audit_events
    schema_ref: figma/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
