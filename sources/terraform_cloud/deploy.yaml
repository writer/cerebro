sourceId: terraform_cloud
secretKeys:
  - TERRAFORM_CLOUD_TOKEN
runtimes:
  - localId: repositories
    config:
      family: repositories
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v2/account/details
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:TERRAFORM_CLOUD_TOKEN
