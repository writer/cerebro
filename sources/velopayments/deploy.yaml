sourceId: velopayments
secretKeys:
  - VELOPAYMENTS_CLIENT_ID
  - VELOPAYMENTS_CLIENT_SECRET
runtimes:
  - localId: delta
    config:
      family: delta
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v4/payments/deltas
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      client_id: env:VELOPAYMENTS_CLIENT_ID
      client_secret: env:VELOPAYMENTS_CLIENT_SECRET
