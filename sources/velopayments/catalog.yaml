id: velopayments
name: "Velo Payments"
description: "Collects delta, sourceaccount, paymentchannelrule, and webhook from Velo Payments and projects them into the Cerebro graph as audit events, users, policies, and assets for owner, account, evidence, and compliance context."
emitted_kinds:
  - velopayments.delta
  - velopayments.sourceaccount
  - velopayments.paymentchannelrule
  - velopayments.webhook
runtime_families:
  - delta
  - paymentchannelrule
  - sourceaccount
  - webhook
kind_lifecycle:
  - kind: velopayments.delta
    status: active
  - kind: velopayments.sourceaccount
    status: active
  - kind: velopayments.paymentchannelrule
    status: active
  - kind: velopayments.webhook
    status: active
provider_api:
  status: verified
  basis: discovered
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: oauth_client_credentials
  auth_mechanics: oauth_client_credentials_bearer_token
  base_url: https://api.sandbox.velopayments.com
  spec_url: https://api.apis.guru/v2/specs/velopayments.com/2.34.63/openapi.json
  spec_kind: openapi
  references:
    - https://api.apis.guru/v2/specs/velopayments.com/2.34.63/openapi.json
    - https://raw.githubusercontent.com/velopaymentsapi/VeloOpenApi/master/spec/openapi.yaml
  auth_evidence:
    - https://api.apis.guru/v2/specs/velopayments.com/2.34.63/openapi.json
  scope_evidence:
    - https://api.apis.guru/v2/specs/velopayments.com/2.34.63/openapi.json
  families:
    - id: delta
      method: GET
      path: /v4/payments/deltas
    - id: paymentchannelrule
      method: GET
      path: /v1/paymentChannelRules
    - id: sourceaccount
      method: GET
      path: /v3/sourceAccounts
    - id: webhook
      method: GET
      path: /v1/webhooks
coverage_contract:
  owner_domain: source_runtime
  authority_domain: velopayments
  dimensions:
    - id: delta
      type: audit_event
      title: "Delta"
      families: [delta]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: sourceaccount
      type: entity_family
      title: "Sourceaccount"
      families: [sourceaccount]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: paymentchannelrule
      type: lifecycle_state
      title: "Paymentchannelrule"
      families: [paymentchannelrule]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: webhook
      type: entity_family
      title: "Webhook"
      families: [webhook]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: velopayments.delta
    schema_ref: velopayments/delta/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - paymentAmount
  - kind: velopayments.sourceaccount
    schema_ref: velopayments/sourceaccount/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: velopayments.paymentchannelrule
    schema_ref: velopayments/paymentchannelrule/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - isoCountryCode
  - kind: velopayments.webhook
    schema_ref: velopayments/webhook/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
