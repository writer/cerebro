id: velopayments
name: "Velo Payments"
description: "Collects delta, sourceaccount, paymentchannelrule, and webhook from Velo Payments and projects them into the Cerebro graph as audit events, users, policies, and assets for owner, account, evidence, and compliance context."
emitted_kinds:
  - velopayments.delta
  - velopayments.sourceaccount
  - velopayments.paymentchannelrule
  - velopayments.webhook
kind_lifecycle:
  - kind: velopayments.delta
    status: active
  - kind: velopayments.sourceaccount
    status: active
  - kind: velopayments.paymentchannelrule
    status: active
  - kind: velopayments.webhook
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: velopayments
  dimensions:
    - id: delta
      type: audit_event
      title: "Delta"
      families: [delta]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: sourceaccount
      type: entity_family
      title: "Sourceaccount"
      families: [sourceaccount]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: paymentchannelrule
      type: entity_family
      title: "Paymentchannelrule"
      families: [paymentchannelrule]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: webhook
      type: entity_family
      title: "Webhook"
      families: [webhook]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: velopayments.delta
    schema_ref: velopayments/delta/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - paymentAmount
  - kind: velopayments.sourceaccount
    schema_ref: velopayments/sourceaccount/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: velopayments.paymentchannelrule
    schema_ref: velopayments/paymentchannelrule/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - isoCountryCode
  - kind: velopayments.webhook
    schema_ref: velopayments/webhook/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
