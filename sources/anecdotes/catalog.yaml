id: anecdotes
name: "Anecdotes"
description: "Collects assets, findings, vulnerabilities, policies, and audit events from Anecdotes and projects them into the Cerebro graph as assets, findings, vulnerabilities, policies, and audit events for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - anecdotes.assets
  - anecdotes.findings
  - anecdotes.vulnerabilities
  - anecdotes.policies
  - anecdotes.audit_events
runtime_families:
  - assets
  - audit_events
  - findings
  - policies
  - vulnerabilities
kind_lifecycle:
  - kind: anecdotes.assets
    status: active
  - kind: anecdotes.findings
    status: active
  - kind: anecdotes.vulnerabilities
    status: active
  - kind: anecdotes.policies
    status: active
  - kind: anecdotes.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: anecdotes
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: policies
      type: lifecycle_state
      title: "Policies"
      families: [policies]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: anecdotes.assets
    schema_ref: anecdotes/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: anecdotes.findings
    schema_ref: anecdotes/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: anecdotes.vulnerabilities
    schema_ref: anecdotes/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: anecdotes.policies
    schema_ref: anecdotes/policies/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: anecdotes.audit_events
    schema_ref: anecdotes/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
provider_api_disproof:
  status: invalidated
  reason: no_public_provider_api_spec_for_generated_runtime_families
  checked_at: 2026-07-06T00:00:00Z
  references:
    - https://apitracker.io/a/anecdotes-ai/specifications
    - https://www.anecdotes.ai/api
    - https://www.anecdotes.ai/data-studio
    - https://www.anecdotes.ai/mcp
    - https://www.stitchflow.com/user-management/anecdotes/api
  affected_families:
    - assets
    - audit_events
    - findings
    - policies
    - vulnerabilities
  missing_paths:
    - /v1/assets
    - /v1/audit_events
    - /v1/findings
    - /v1/policies
    - /v1/vulnerabilities
  notes:
    - API Tracker lists no public Anecdotes API specifications, and the provider-owned Data Engine, Data Studio, and MCP pages are product descriptions rather than endpoint references.
    - Public provider pages mention programmatic evidence ingestion, custom pipelines, and MCP access, but do not document REST endpoints for the generated runtime families or authentication mechanics.
    - Rewrite this source from a provider-published developer reference or machine-readable API spec before promotion.
