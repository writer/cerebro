sourceId: dracoon
secretKeys:
  - DRACOON_CUSTOMER_ID
  - DRACOON_TOKEN
runtimes:
  - localId: event-type
    config:
      customer_id: env:DRACOON_CUSTOMER_ID
      family: event_type
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v4/provisioning/webhooks/event_types
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:DRACOON_TOKEN
