id: dracoon
name: "DRACOON"
description: "Collects event type, group, user, and channel from DRACOON and projects them into the Cerebro graph as audit events, groups, users, and alerts for workspace, document, message, and collaboration context."
emitted_kinds:
  - dracoon.event_type
  - dracoon.group
  - dracoon.user
  - dracoon.channel
kind_lifecycle:
  - kind: dracoon.event_type
    status: active
  - kind: dracoon.group
    status: active
  - kind: dracoon.user
    status: active
  - kind: dracoon.channel
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: dracoon
  dimensions:
    - id: event_type
      type: audit_event
      title: "Event Type"
      families: [event_type]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: group
      type: entity_family
      title: "Group"
      families: [group]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user
      type: entity_family
      title: "User"
      families: [user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: channel
      type: entity_family
      title: "Channel"
      families: [channel]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: dracoon.event_type
    schema_ref: dracoon/event_type/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: dracoon.group
    schema_ref: dracoon/group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: dracoon.user
    schema_ref: dracoon/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: dracoon.channel
    schema_ref: dracoon/channel/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_severity
    required_payload_fields:
      - id
