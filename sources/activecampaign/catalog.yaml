id: activecampaign
name: "ActiveCampaign"
description: "Collects ActiveCampaign users, accounts, contacts, campaigns, and automations from the documented v3 REST API and projects them into the Cerebro graph for account, owner, and business-data evidence context."
emitted_kinds:
  - activecampaign.users
  - activecampaign.accounts
  - activecampaign.contacts
  - activecampaign.campaigns
  - activecampaign.automations
runtime_families:
  - accounts
  - automations
  - campaigns
  - contacts
  - users
kind_lifecycle:
  - kind: activecampaign.users
    status: active
  - kind: activecampaign.accounts
    status: active
  - kind: activecampaign.contacts
    status: active
  - kind: activecampaign.campaigns
    status: active
  - kind: activecampaign.automations
    status: active
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: api_token_header
  base_url: ${config.base_url}
  spec_url: https://developers.activecampaign.com/reference/list-all-users.md
  spec_kind: api_reference_markdown
  references:
    - https://developers.activecampaign.com/reference/overview
    - https://developers.activecampaign.com/reference/authentication
    - https://developers.activecampaign.com/reference/get-user-loggedin
    - https://developers.activecampaign.com/reference/list-all-users
    - https://developers.activecampaign.com/reference/list-all-accounts
    - https://developers.activecampaign.com/reference/list-all-contacts
    - https://developers.activecampaign.com/reference/list-all-campaigns
    - https://developers.activecampaign.com/reference/list-all-automations
  families:
    - id: accounts
      method: GET
      path: /api/3/accounts
      operation: list_all_accounts
    - id: automations
      method: GET
      path: /api/3/automations
      operation: list_all_automations
    - id: campaigns
      method: GET
      path: /api/3/campaigns
      operation: list_all_campaigns
    - id: contacts
      method: GET
      path: /api/3/contacts
      operation: list_search_filter_contacts
    - id: users
      method: GET
      path: /api/3/users
      operation: list_all_users
coverage_contract:
  owner_domain: source_runtime
  authority_domain: activecampaign
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Lists account users through the documented ActiveCampaign v3 `GET /users` endpoint.
    - id: accounts
      type: entity_family
      title: "Accounts"
      families: [accounts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Lists CRM accounts through the documented ActiveCampaign v3 `GET /accounts` endpoint.
    - id: contacts
      type: entity_family
      title: "Contacts"
      families: [contacts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [data_governance]
      notes:
        - Lists contacts through the documented ActiveCampaign v3 `GET /contacts` endpoint.
    - id: campaigns
      type: entity_family
      title: "Campaigns"
      families: [campaigns]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [data_governance]
      notes:
        - Lists campaigns through the documented ActiveCampaign v3 `GET /campaigns` endpoint.
    - id: automations
      type: entity_family
      title: "Automations"
      families: [automations]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Lists automations through the documented ActiveCampaign v3 `GET /automations` endpoint.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: activecampaign.users
    schema_ref: activecampaign/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: activecampaign.accounts
    schema_ref: activecampaign/accounts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: activecampaign.contacts
    schema_ref: activecampaign/contacts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: activecampaign.campaigns
    schema_ref: activecampaign/campaigns/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: activecampaign.automations
    schema_ref: activecampaign/automations/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
