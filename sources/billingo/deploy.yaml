sourceId: billingo
secretKeys:
  - BILLINGO_API_TOKEN
runtimes:
  - localId: bank-account
    config:
      family: bank_account
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /bank-accounts
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:BILLINGO_API_TOKEN
