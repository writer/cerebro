id: billingo
name: "Billingo"
description: "Collects bank account, document, document block, and partner from Billingo and projects them into the Cerebro graph as users and assets for owner, account, evidence, and compliance context."
emitted_kinds:
  - billingo.bank_account
  - billingo.document
  - billingo.document_block
  - billingo.partner
runtime_families:
  - bank_account
  - document
  - document_block
  - partner
kind_lifecycle:
  - kind: billingo.bank_account
    status: active
  - kind: billingo.document
    status: active
  - kind: billingo.document_block
    status: active
  - kind: billingo.partner
    status: active
provider_api:
  status: verified
  basis: discovered
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: token_authorization_header
  base_url: https://api.billingo.hu/v3
  spec_url: https://api.apis.guru/v2/specs/billingo.hu/3.0.7/openapi.json
  spec_kind: openapi
  references:
    - https://api.apis.guru/v2/specs/billingo.hu/3.0.7/openapi.json
    - https://api.swaggerhub.com/apis/Billingo/Billingo/3.0.7
  families:
    - id: bank_account
      method: GET
      path: /bank-accounts
    - id: document
      method: GET
      path: /documents
    - id: document_block
      method: GET
      path: /document-blocks
    - id: partner
      method: GET
      path: /partners
coverage_contract:
  owner_domain: source_runtime
  authority_domain: billingo
  dimensions:
    - id: bank_account
      type: entity_family
      title: "Bank Account"
      families: [bank_account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
