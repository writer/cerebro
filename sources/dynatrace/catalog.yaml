id: dynatrace
name: "Dynatrace"
description: "Collects alerts, incidents, monitors, dashboards, and audit events from Dynatrace and projects them into the Cerebro graph as alerts, findings, assets, and audit events for alert, incident, service health, and response context."
emitted_kinds:
  - dynatrace.alerts
  - dynatrace.incidents
  - dynatrace.monitors
  - dynatrace.dashboards
  - dynatrace.audit_events
kind_lifecycle:
  - kind: dynatrace.alerts
    status: active
  - kind: dynatrace.incidents
    status: active
  - kind: dynatrace.monitors
    status: active
  - kind: dynatrace.dashboards
    status: active
  - kind: dynatrace.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: dynatrace
  dimensions:
    - id: alerts
      type: alert_state
      title: "Alerts"
      families: [alerts]
      support: partial
      high_value: true
      evidence_types: [security_monitoring]
      control_domains: [logging_monitoring, security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incidents
      type: remediation_state
      title: "Incidents"
      families: [incidents]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: monitors
      type: entity_family
      title: "Monitors"
      families: [monitors]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: dashboards
      type: entity_family
      title: "Dashboards"
      families: [dashboards]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: dynatrace.alerts
    schema_ref: dynatrace/alerts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - alert_id
      - alert_severity
    required_payload_fields:
      - id
  - kind: dynatrace.incidents
    schema_ref: dynatrace/incidents/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: dynatrace.monitors
    schema_ref: dynatrace/monitors/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: dynatrace.dashboards
    schema_ref: dynatrace/dashboards/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: dynatrace.audit_events
    schema_ref: dynatrace/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
