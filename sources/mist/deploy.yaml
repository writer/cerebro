sourceId: mist
secretKeys:
  - MIST_ORG_ID
  - MIST_API_TOKEN
runtimes:
  - localId: call-event
    config:
      org_id: env:MIST_ORG_ID
      family: call_event
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v1/const/call_events
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:MIST_API_TOKEN
