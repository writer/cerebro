event_contracts:
  - kind: clickmeter.clickstream
    schema_ref: clickmeter/clickstream/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - accessTime
  - kind: clickmeter.group
    schema_ref: clickmeter/group/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - group_id
    required_payload_fields:
      - id
  - kind: clickmeter.list
    schema_ref: clickmeter/list/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - activityDay
  - kind: clickmeter.hit
    schema_ref: clickmeter/hit/v1
