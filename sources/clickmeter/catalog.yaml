id: clickmeter
name: "ClickMeter"
description: "Collects clickstream, group, list, hit, ipblacklist, and conversions hit from ClickMeter and projects them into the Cerebro graph as assets, audit events, and groups for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - clickmeter.clickstream
  - clickmeter.group
  - clickmeter.list
  - clickmeter.hit
  - clickmeter.ipblacklist
  - clickmeter.conversions_hit
  - clickmeter.datapoints_hit
  - clickmeter.groups_hit
  - clickmeter.tags_group
  - clickmeter.summary_group
  - clickmeter.datapoint
  - clickmeter.aggregated_list
runtime_families:
  - aggregated_list
  - clickstream
  - conversions_hit
  - datapoint
  - datapoints_hit
  - group
  - groups_hit
  - hit
  - ipblacklist
  - list
  - summary_group
  - tags_group
kind_lifecycle:
  - kind: clickmeter.clickstream
    status: active
  - kind: clickmeter.group
    status: active
  - kind: clickmeter.list
    status: active
  - kind: clickmeter.hit
    status: active
  - kind: clickmeter.ipblacklist
    status: active
  - kind: clickmeter.conversions_hit
    status: active
  - kind: clickmeter.datapoints_hit
    status: active
  - kind: clickmeter.groups_hit
    status: active
  - kind: clickmeter.tags_group
    status: active
  - kind: clickmeter.summary_group
    status: active
  - kind: clickmeter.datapoint
    status: active
  - kind: clickmeter.aggregated_list
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: clickmeter
  dimensions:
    - id: clickstream
      type: audit_event
      title: "Clickstream"
      families: [clickstream]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: group
      type: entity_family
      title: "Group"
      families: [group]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: list
