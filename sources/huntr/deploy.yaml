sourceId: huntr
secretKeys:
  - HUNTR_BASE_URL
  - HUNTR_TOKEN
runtimes:
  - localId: assets
    config:
      base_url: env:HUNTR_BASE_URL
      family: assets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:HUNTR_TOKEN
