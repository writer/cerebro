id: monday_com
name: "Monday.com"
description: "Collects users, projects, and audit events from Monday.com and projects them into the Cerebro graph as users, assets, and audit events for workspace, document, message, and collaboration context."
emitted_kinds:
  - monday_com.users
  - monday_com.projects
  - monday_com.audit_events
kind_lifecycle:
  - kind: monday_com.users
    status: active
  - kind: monday_com.projects
    status: active
  - kind: monday_com.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: monday_com
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: projects
      type: entity_family
      title: "Projects"
      families: [projects]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: monday_com.users
    schema_ref: monday_com/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: monday_com.projects
    schema_ref: monday_com/projects/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: monday_com.audit_events
    schema_ref: monday_com/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
