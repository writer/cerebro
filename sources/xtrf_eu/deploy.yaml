sourceId: xtrf_eu
secretKeys:
  - XTRF_EU_API_TOKEN
runtimes:
  - localId: user
    config:
      family: user
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /users
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:XTRF_EU_API_TOKEN
