sourceId: anomalo
secretKeys:
  - ANOMALO_BASE_URL
  - ANOMALO_TOKEN
runtimes:
  - localId: warehouses
    config:
      base_url: env:ANOMALO_BASE_URL
      family: warehouses
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /ping
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ANOMALO_TOKEN
