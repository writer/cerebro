id: mailscript
name: "Mailscript"
description: "Collects workspace, workflow, key, action, addresses, and domain from Mailscript and projects them into the Cerebro graph as assets and groups for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - mailscript.workspace
  - mailscript.workflow
  - mailscript.key
  - mailscript.action
  - mailscript.addresses
  - mailscript.domain
  - mailscript.input
  - mailscript.integration
  - mailscript.trigger
  - mailscript.verification
  - mailscript.verify
runtime_families:
  - action
  - addresses
  - domain
  - input
  - integration
  - key
  - trigger
  - verification
  - verify
  - workflow
  - workspace
kind_lifecycle:
  - kind: mailscript.workspace
    status: active
  - kind: mailscript.workflow
    status: active
  - kind: mailscript.key
    status: active
  - kind: mailscript.action
    status: active
  - kind: mailscript.addresses
    status: active
  - kind: mailscript.domain
    status: active
  - kind: mailscript.input
    status: active
  - kind: mailscript.integration
    status: active
  - kind: mailscript.trigger
    status: active
  - kind: mailscript.verification
    status: active
  - kind: mailscript.verify
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: mailscript
  dimensions:
    - id: workspace
      type: entity_family
      title: "Workspace"
      families: [workspace]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
