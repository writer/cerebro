sourceId: mailscript
secretKeys:
  - MAILSCRIPT_ADDRESS
  - MAILSCRIPT_DOMAIN
  - MAILSCRIPT_TOKEN
runtimes:
  - localId: workspace
    config:
      address: env:MAILSCRIPT_ADDRESS
      domain: env:MAILSCRIPT_DOMAIN
      family: workspace
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /workspaces
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:MAILSCRIPT_TOKEN
