sourceId: hudsonrock
secretKeys:
  - HUDSONROCK_API_TOKEN
runtimes:
  - localId: infostealers
    config:
      family: infostealers
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /health
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:HUDSONROCK_API_TOKEN
