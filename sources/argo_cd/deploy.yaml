sourceId: argo_cd
secretKeys:
  - ARGO_CD_TOKEN
runtimes:
  - localId: pipelines
    config:
      family: pipelines
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /api/v1/session/userinfo
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ARGO_CD_TOKEN
