id: argo_cd
name: "Argo CD"
description: "Collects pipelines, findings, and audit events from Argo CD and projects them into the Cerebro graph as assets, findings, and audit events for repository, build, deployment, and release context."
emitted_kinds:
  - argo_cd.pipelines
  - argo_cd.findings
  - argo_cd.audit_events
kind_lifecycle:
  - kind: argo_cd.pipelines
    status: active
  - kind: argo_cd.findings
    status: active
  - kind: argo_cd.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: argo_cd
  dimensions:
    - id: pipelines
      type: entity_family
      title: "Pipelines"
      families: [pipelines]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: entity_family
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: argo_cd.pipelines
    schema_ref: argo_cd/pipelines/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: argo_cd.findings
    schema_ref: argo_cd/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: argo_cd.audit_events
    schema_ref: argo_cd/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
