sourceId: loket
secretKeys:
  - LOKET_EMPLOYERID
  - LOKET_EMPLOYMENTID
  - LOKET_TOKEN
runtimes:
  - localId: integration
    config:
      employerid: env:LOKET_EMPLOYERID
      employmentid: env:LOKET_EMPLOYMENTID
      family: integration
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /users/integrations
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:LOKET_TOKEN
