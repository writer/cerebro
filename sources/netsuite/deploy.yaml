sourceId: netsuite
secretKeys:
  - NETSUITE_TOKEN
runtimes:
  - localId: users
    config:
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /services/rest/record/v1/metadata-catalog
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:NETSUITE_TOKEN
