sourceId: manageengine_endpoint_central
secretKeys:
  - MANAGEENGINE_ENDPOINT_CENTRAL_BASE_URL
  - MANAGEENGINE_ENDPOINT_CENTRAL_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:MANAGEENGINE_ENDPOINT_CENTRAL_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:MANAGEENGINE_ENDPOINT_CENTRAL_TOKEN
