sourceId: jetbrains_space
secretKeys:
  - JETBRAINS_SPACE_BASE_URL
  - JETBRAINS_SPACE_TOKEN
runtimes:
  - localId: users
    config:
      base_url: env:JETBRAINS_SPACE_BASE_URL
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/me
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:JETBRAINS_SPACE_TOKEN
