id: probely
name: "Probely"
description: "Collects needs attention top, event, user, and framework from Probely and projects them into the Cerebro graph as findings, audit events, users, and policies for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - probely.needs_attention_top
  - probely.event
  - probely.user
  - probely.framework
runtime_families:
  - event
  - framework
  - needs_attention_top
  - user
kind_lifecycle:
  - kind: probely.needs_attention_top
    status: active
  - kind: probely.event
    status: active
  - kind: probely.user
    status: active
  - kind: probely.framework
    status: active
provider_api:
  status: verified
  basis: discovered
  verified_at: 2026-07-04T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: bearer_token_authorization_header
  base_url: https://api.probely.com
  spec_url: https://api.apis.guru/v2/specs/probely.com/1.2.0/openapi.json
  spec_kind: openapi
  references:
    - https://api.apis.guru/v2/specs/probely.com/1.2.0/openapi.json
    - https://developers.probely.com/openapi.yaml
  families:
    - id: event
      method: GET
      path: /events/
    - id: framework
      method: GET
      path: /frameworks/
    - id: needs_attention_top
      method: GET
      path: /targets/all/needs_attention_top/
    - id: user
      method: GET
      path: /users/
coverage_contract:
  owner_domain: source_runtime
  authority_domain: probely
  dimensions:
    - id: needs_attention_top
      type: remediation_state
      title: "Needs Attention Top"
      families: [needs_attention_top]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: event
      type: audit_event
      title: "Event"
      families: [event]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user
      type: entity_family
      title: "User"
      families: [user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: framework
      type: lifecycle_state
      title: "Framework"
      families: [framework]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: probely.needs_attention_top
    schema_ref: probely/needs_attention_top/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: probely.event
    schema_ref: probely/event/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
  - kind: probely.user
    schema_ref: probely/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: probely.framework
    schema_ref: probely/framework/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
