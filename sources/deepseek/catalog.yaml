id: deepseek
name: "DeepSeek"
description: "Collects model catalog and account balances from DeepSeek and projects them into the Cerebro graph as assets for inventory, access review, audit, risk, and operational context."
emitted_kinds:
  - deepseek.model_catalog
  - deepseek.account_balances
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-08-22T00:00:00Z
  transport: rest
  auth: bearer_token
  auth_mechanics: bearer_authorization_header
  base_url: https://api.deepseek.com
  spec_url: https://api-docs.deepseek.com/api/deepseek-api
  spec_kind: api_reference_html
  references:
    - https://api-docs.deepseek.com/api/deepseek-api
    - https://api-docs.deepseek.com/api/list-models
    - https://api-docs.deepseek.com/api/get-user-balance/
  auth_evidence:
    - https://api-docs.deepseek.com/api/deepseek-api
  families:
    - id: model_catalog
      method: GET
      path: /models
    - id: account_balances
      method: GET
      path: /user/balance
runtime_families:
  - account_balances
  - model_catalog
kind_lifecycle:
  - kind: deepseek.model_catalog
    status: active
  - kind: deepseek.account_balances
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: deepseek
  dimensions:
    - id: model_catalog
      type: entity_family
      title: "Model Catalog"
      families: [model_catalog]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: account_balances
      type: entity_family
      title: "Account Balances"
      families: [account_balances]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: deepseek.model_catalog
    schema_ref: deepseek/model_catalog/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: deepseek.account_balances
    schema_ref: deepseek/account_balances/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - currency
