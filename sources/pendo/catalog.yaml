id: pendo
name: "Pendo"
description: "Collects account, feature, user, and search from Pendo and projects them into the Cerebro graph as users and assets for owner, account, evidence, and compliance context."
emitted_kinds:
  - pendo.account
  - pendo.feature
  - pendo.user
  - pendo.search
runtime_families:
  - account
  - feature
  - search
  - user
kind_lifecycle:
  - kind: pendo.account
    status: active
  - kind: pendo.feature
    status: active
  - kind: pendo.user
    status: active
  - kind: pendo.search
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: pendo
  dimensions:
    - id: account
      type: entity_family
      title: "Account"
      families: [account]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: feature
      type: entity_family
      title: "Feature"
      families: [feature]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: user
      type: entity_family
      title: "User"
      families: [user]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: search
      type: entity_family
      title: "Search"
      families: [search]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: pendo.account
    schema_ref: pendo/account/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: pendo.feature
    schema_ref: pendo/feature/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: pendo.user
    schema_ref: pendo/user/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: pendo.search
    schema_ref: pendo/search/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
