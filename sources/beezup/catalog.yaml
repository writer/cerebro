event_contracts:
  - kind: beezup.channelcatalog
    schema_ref: beezup/channelcatalog/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - apiSettingsStatus
  - kind: beezup.offer
    schema_ref: beezup/offer/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
