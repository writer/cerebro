id: apiiro
name: "Apiiro"
description: "Collects assets, findings, vulnerabilities, policies, and audit events from Apiiro and projects them into the Cerebro graph as assets, findings, vulnerabilities, policies, and audit events for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - apiiro.assets
  - apiiro.findings
  - apiiro.vulnerabilities
  - apiiro.policies
  - apiiro.audit_events
runtime_families:
  - assets
  - audit_events
  - findings
  - policies
  - vulnerabilities
kind_lifecycle:
  - kind: apiiro.assets
    status: active
  - kind: apiiro.findings
    status: active
  - kind: apiiro.vulnerabilities
    status: active
  - kind: apiiro.policies
    status: active
  - kind: apiiro.audit_events
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: apiiro
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: policies
      type: lifecycle_state
      title: "Policies"
      families: [policies]
      support: partial
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: audit_events
      type: audit_event
      title: "Audit Events"
      families: [audit_events]
      support: partial
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      notes:
        - Generated Source Runtime SDK mapping requires provider field review before certification.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: apiiro.assets
    schema_ref: apiiro/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: apiiro.findings
    schema_ref: apiiro/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: apiiro.vulnerabilities
    schema_ref: apiiro/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: apiiro.policies
    schema_ref: apiiro/policies/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - policy_id
      - policy_name
    required_payload_fields:
      - id
  - kind: apiiro.audit_events
    schema_ref: apiiro/audit_events/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - event_type
      - actor_id
    required_payload_fields:
      - id
provider_api_disproof:
  status: invalidated
  reason: no_public_provider_api_reference_for_generated_runtime_families
  checked_at: 2026-07-06T00:00:00Z
  references:
    - https://docs.apiiro.com/
    - https://docs.apiiro.com/admin-apiiro/access-tokens
    - https://docs.cortex.io/ingesting-data-into-cortex/integrations/apiiro
    - https://github.com/apiiro/mcp-server
    - https://github.com/apiiro/mcp-server/blob/main/server.json
    - https://apiiro.com/product/integrations/
    - https://apiiro.com/product/api-security-testing/
  affected_families:
    - assets
    - audit_events
    - findings
    - policies
    - vulnerabilities
  missing_paths:
    - /v1/assets
    - /v1/audit_events
    - /v1/findings
    - /v1/policies
    - /v1/vulnerabilities
  notes:
    - "Apiiro's provider documentation host resolves to a sign-in page, so the public FetchUrl-visible provider docs do not expose a machine-readable specification or endpoint-level REST reference for these generated families."
    - "Cortex's Apiiro integration guidance corroborates API-key access and read permissions for risks, applications, and repositories, but it does not document method/path mappings for the generated /v1 assets, findings, vulnerabilities, policies, or audit-events resources."
    - "Apiiro's public MCP server documents a streamable HTTP MCP endpoint at https://mcp.apiiro.com/mcp for agent tools, not REST resource endpoints matching this json_api runtime."
    - "Apiiro's public product pages describe integrations, risk, vulnerability, and API-security capabilities, but they do not publish endpoint paths that can truthfully ground this generated runtime. Promotion needs a provider-owned public API reference or machine-readable spec before reshaping."
