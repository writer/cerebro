id: apollo
name: "Apollo"
description: "Collects Apollo workspace users, saved accounts, and saved contacts from the documented Apollo REST API and projects them into the Cerebro graph as identity users and account/contact inventory for owner and evidence context."
emitted_kinds:
  - apollo.users
  - apollo.accounts
  - apollo.contacts
runtime_families:
  - accounts
  - contacts
  - users
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: api_key
  auth_mechanics: x_api_key_header
  base_url: https://api.apollo.io/api/v1
  spec_url: https://docs.apollo.io/openapi/apollo-rest-api.json
  spec_kind: openapi
  references:
    - https://docs.apollo.io/reference/openapi-specification
    - https://docs.apollo.io/reference/authentication
    - https://docs.apollo.io/reference/get-a-list-of-users
    - https://docs.apollo.io/reference/search-for-accounts
    - https://docs.apollo.io/reference/search-for-contacts
  families:
    - id: accounts
      method: POST
      path: /accounts/search
      operation: search-for-accounts
    - id: contacts
      method: POST
      path: /contacts/search
      operation: search-for-contacts
    - id: users
      method: GET
      path: /users/search
      operation: get-a-list-of-users
kind_lifecycle:
  - kind: apollo.users
    status: active
  - kind: apollo.accounts
    status: active
  - kind: apollo.contacts
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: apollo
  dimensions:
    - id: users
      type: entity_family
      title: "Users"
      families: [users]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Apollo workspace users from the documented GET /users/search endpoint.
    - id: accounts
      type: entity_family
      title: "Accounts"
      families: [accounts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads saved Apollo company accounts from the documented POST /accounts/search endpoint.
    - id: contacts
      type: entity_family
      title: "Contacts"
      families: [contacts]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads saved Apollo contacts from the documented POST /contacts/search endpoint.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: apollo.users
    schema_ref: apollo/users/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
  - kind: apollo.accounts
    schema_ref: apollo/accounts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: apollo.contacts
    schema_ref: apollo/contacts/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - user_id
    required_payload_fields:
      - id
