sourceId: apollo
secretKeys:
  - APOLLO_API_KEY
runtimes:
  - localId: users
    config:
      api_key: env:APOLLO_API_KEY
      family: users
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /users/api_profile
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
