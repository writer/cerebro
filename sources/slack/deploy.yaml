sourceId: slack
secretKeys:
  - SLACK_TOKEN
runtimes:
  - localId: teams
    config:
      family: team
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "200"
      token: env:SLACK_TOKEN
  - localId: users
    config:
      family: user
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "200"
      token: env:SLACK_TOKEN
  - localId: channels
    config:
      family: channel
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "200"
      token: env:SLACK_TOKEN
  - localId: user-groups
    config:
      family: user_group
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      token: env:SLACK_TOKEN
  - localId: access-logs
    config:
      family: access_log
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "200"
      token: env:SLACK_TOKEN
  - localId: channel-members
    config:
      family: channel_member
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      channel_id: config:SLACK_CHANNEL_ID
      per_page: "200"
      token: env:SLACK_TOKEN
  - localId: user-group-members
    config:
      family: user_group_member
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "200"
      token: env:SLACK_TOKEN
      usergroup_id: config:SLACK_USERGROUP_ID
  - localId: audit-logs
    config:
      family: audit_log
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      expected_cadence_seconds: "86400"
      lookback_seconds: "90000"
      stale_after_seconds: "86400"
      per_page: "200"
      token: env:SLACK_TOKEN
