id: google_workspace
name: Google Workspace
description: Reads Google Workspace Directory users, groups, group memberships, admin role assignments, and Reports API admin activity. Emits identity, membership, privileged assignment, and audit records for access review and graph projection.
emitted_kinds:
  - google_workspace.audit
  - google_workspace.group
  - google_workspace.group_member
  - google_workspace.role_assignment
  - google_workspace.user
runtime_families:
  - audit
  - group
  - group_member
  - role_assignment
  - user
provider_api:
  status: verified
  transport: rest
  auth: bearer_token
  base_url: https://admin.googleapis.com
  references:
    - https://raw.githubusercontent.com/googleapis/google-api-go-client/main/admin/directory/v1/admin-api.json
    - https://raw.githubusercontent.com/googleapis/google-api-go-client/main/admin/reports/v1/admin-api.json
    - https://developers.google.com/workspace/admin/directory/reference/rest/v1/users/list
    - https://developers.google.com/workspace/admin/directory/reference/rest/v1/groups/list
    - https://developers.google.com/workspace/admin/directory/reference/rest/v1/members/list
    - https://developers.google.com/workspace/admin/directory/reference/rest/v1/roleAssignments/list
    - https://developers.google.com/workspace/admin/reports/reference/rest/v1/activities/list
  families:
    - id: audit
      method: GET
      path: /admin/reports/v1/activity/users/{userKey}/applications/{applicationName}
    - id: group
      method: GET
      path: /admin/directory/v1/groups
    - id: group_member
      method: GET
      path: /admin/directory/v1/groups/{groupKey}/members
    - id: role_assignment
      method: GET
      path: /admin/directory/v1/customer/{customer}/roleassignments
    - id: user
      method: GET
      path: /admin/directory/v1/users
families:
  - id: audit
    incremental: watermark
  - id: group
    incremental: watermark
  - id: group_member
    incremental: watermark
  - id: role_assignment
    incremental: watermark
  - id: user
    incremental: watermark
event_contracts:
  - kind: google_workspace.audit
    schema_ref: google_workspace/audit/v1
    required_attributes:
      - family
  - kind: google_workspace.group
    schema_ref: google_workspace/group/v1
    required_attributes:
      - family
  - kind: google_workspace.group_member
    schema_ref: google_workspace/group_member/v1
    required_attributes:
      - family
  - kind: google_workspace.role_assignment
    schema_ref: google_workspace/role_assignment/v1
    required_attributes:
      - family
  - kind: google_workspace.user
    schema_ref: google_workspace/user/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: identity
  authority_domain: google_workspace
  dimensions:
    - id: audit_events
      type: audit_event
      title: Admin audit events
      families: [audit]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "8"
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: SOC 2
          control_id: CC7.3
        - framework_name: "NIST 800-53 r5"
          control_id: SI-4
        - framework_name: "ISO 27001:2022"
          control_id: A.8.15
        - framework_name: "ISO 27001:2022"
          control_id: A.8.16
    - id: groups
      type: entity_family
      title: Groups
      families: [group]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "ISO 27001:2022"
          control_id: A.5.17
    - id: group_memberships
      type: relationship
      title: Group memberships
      families: [external_member, group_member, membership, orphaned_membership]
      support: supported
      high_value: true
      evidence_types: [access_review, identity_configuration, relationship_evidence]
      control_domains: [identity_access]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "5"
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: SOC 2
          control_id: CC6.3
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-6
        - framework_name: "PCI DSS v4.0.1"
          control_id: "7.2"
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.17
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      families: [audit, group, group_member, role_assignment, user]
      support: partial
      high_value: true
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
      known_unsupported_fields:
        - full Directory API deletion tombstones
    - id: remediation_state
      type: remediation_state
      title: Remediation lifecycle state
      families: [audit, group_member, user]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - Google Workspace suspended, archived, member status, and admin audit attributes are surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
    - id: role_assignments
      type: app_entitlement
      title: Role assignments
      families: [admin_role, privileged, role_assignment, super_admin]
      support: partial
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "5"
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: SOC 2
          control_id: CC6.2
        - framework_name: SOC 2
          control_id: CC6.3
        - framework_name: SOC 2
          control_id: CC6.6
        - framework_name: "NIST 800-53 r5"
          control_id: AC-2
        - framework_name: "NIST 800-53 r5"
          control_id: AC-6
        - framework_name: "PCI DSS v4.0.1"
          control_id: "7.2"
        - framework_name: "ISO 27001:2022"
          control_id: A.5.15
        - framework_name: "ISO 27001:2022"
          control_id: A.5.18
        - framework_name: "ISO 27001:2022"
          control_id: A.8.2
    - id: user_lifecycle
      type: lifecycle_state
      title: User lifecycle and activity
      families: [account, active_account, archived, dormant_user, employee_record, last_login, never_logged_in, stale_login, suspended, terminated_account, user]
