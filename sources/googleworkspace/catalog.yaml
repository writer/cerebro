id: google_workspace
name: Google Workspace
description: Google Workspace Directory and Admin audit source.
emitted_kinds:
  - google_workspace.audit
  - google_workspace.group
  - google_workspace.group_member
  - google_workspace.role_assignment
  - google_workspace.user
families:
  - id: audit
    incremental: watermark
  - id: group
    incremental: watermark
  - id: group_member
    incremental: watermark
  - id: role_assignment
    incremental: watermark
  - id: user
    incremental: watermark
event_contracts:
  - kind: google_workspace.audit
    schema_ref: google_workspace/audit/v1
    required_attributes:
      - family
  - kind: google_workspace.group
    schema_ref: google_workspace/group/v1
    required_attributes:
      - family
  - kind: google_workspace.group_member
    schema_ref: google_workspace/group_member/v1
    required_attributes:
      - family
  - kind: google_workspace.role_assignment
    schema_ref: google_workspace/role_assignment/v1
    required_attributes:
      - family
  - kind: google_workspace.user
    schema_ref: google_workspace/user/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: identity
  authority_domain: google_workspace
  dimensions:
    - id: audit_events
      type: audit_event
      title: Admin audit events
      families: [audit]
      support: supported
      high_value: true
    - id: groups
      type: entity_family
      title: Groups
      families: [group]
      support: supported
      high_value: true
    - id: group_memberships
      type: relationship
      title: Group memberships
      families: [group_member]
      support: supported
      high_value: true
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      families: [audit, group, group_member, role_assignment, user]
      support: partial
      high_value: true
      known_unsupported_fields:
        - full Directory API deletion tombstones
    - id: remediation_state
      type: remediation_state
      title: Remediation lifecycle state
      families: [audit, group_member, user]
      support: partial
      high_value: true
      known_unsupported_fields:
        - Cerebro remediation workflow assignment, exception, SLA, and approval state
      notes:
        - Google Workspace suspended, archived, member status, and admin audit attributes are surfaced as provider lifecycle evidence.
        - Cerebro finding remediation lifecycle remains owned by the finding/workflow surfaces and their typed action boundaries.
    - id: role_assignments
      type: app_entitlement
      title: Role assignments
      families: [role_assignment]
      support: partial
      high_value: true
    - id: users
      type: entity_family
      title: Users
      families: [user]
      support: supported
      high_value: true
