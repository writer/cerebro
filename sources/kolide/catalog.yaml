id: kolide
name: Kolide
description: Kolide/osquery endpoint inventory, compliance, software, ownership, and vulnerability source.
emitted_kinds:
  - kolide.check
  - kolide.device
  - kolide.issue
  - kolide.software
  - kolide.user_device
  - kolide.vulnerability
runtime_families:
  - check
  - device
  - issue
  - software
  - user_device
  - vulnerability
event_contracts:
  - kind: kolide.check
    schema_ref: kolide/check/v1
    required_attributes:
      - family
  - kind: kolide.device
    schema_ref: kolide/device/v1
    required_attributes:
      - family
  - kind: kolide.issue
    schema_ref: kolide/issue/v1
    required_attributes:
      - family
  - kind: kolide.software
    schema_ref: kolide/software/v1
    required_attributes:
      - family
  - kind: kolide.user_device
    schema_ref: kolide/user_device/v1
    required_attributes:
      - family
  - kind: kolide.vulnerability
    schema_ref: kolide/vulnerability/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: endpoint
  authority_domain: kolide
  dimensions:
    - id: devices
      type: entity_family
      title: Endpoint devices
      families: [device]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "1"
        - framework_name: SOC 2
          control_id: CC6.1
        - framework_name: "NIST 800-53 r5"
          control_id: CM-8
    - id: checks
      type: lifecycle_state
      title: Device compliance checks
      families: [check]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "4"
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "NIST 800-53 r5"
          control_id: CA-7
    - id: issues
      type: lifecycle_state
      title: Open and resolved device check issues
      families: [issue]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "4"
        - framework_name: SOC 2
          control_id: CC7.2
        - framework_name: "NIST 800-53 r5"
          control_id: SI-2
    - id: software_inventory
      type: entity_family
      title: Kolide installation packages
      families: [software]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "2"
        - framework_name: "NIST 800-53 r5"
          control_id: CM-8
      known_unsupported_fields:
        - Installed third-party application inventory is not exposed by Kolide's documented /packages response.
      notes:
        - The software family reflects Kolide package records documented on the /packages endpoint.
    - id: user_device_relationships
      type: relationship
      title: User to device relationships
      families: [user_device]
      support: supported
      high_value: true
      evidence_types: [relationship_evidence]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "5"
        - framework_name: "CIS Controls v8"
          control_id: "6"
        - framework_name: SOC 2
          control_id: CC6.1
    - id: vulnerabilities
      type: entity_family
      title: Endpoint software vulnerabilities
      families: [vulnerability]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      control_refs:
        - framework_name: "CIS Controls v8"
          control_id: "7"
        - framework_name: SOC 2
          control_id: CC7.1
        - framework_name: "NIST 800-53 r5"
          control_id: RA-5
      notes:
        - Vulnerability attributes are emitted from Kolide issue value objects when the failed check payload includes vulnerability metadata.
