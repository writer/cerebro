id: kolide
name: Kolide
description: Kolide/osquery endpoint inventory, compliance, software, ownership, and vulnerability source.
emitted_kinds:
  - kolide.check
  - kolide.device
  - kolide.issue
  - kolide.software
  - kolide.user_device
  - kolide.vulnerability
event_contracts:
  - kind: kolide.check
    schema_ref: kolide/check/v1
    required_attributes:
      - family
  - kind: kolide.device
    schema_ref: kolide/device/v1
    required_attributes:
      - family
  - kind: kolide.issue
    schema_ref: kolide/issue/v1
    required_attributes:
      - family
  - kind: kolide.software
    schema_ref: kolide/software/v1
    required_attributes:
      - family
  - kind: kolide.user_device
    schema_ref: kolide/user_device/v1
    required_attributes:
      - family
  - kind: kolide.vulnerability
    schema_ref: kolide/vulnerability/v1
    required_attributes:
      - family
coverage_contract:
  owner_domain: endpoint
  authority_domain: kolide
  dimensions:
    - id: devices
      type: entity_family
      title: Endpoint devices
      families: [device]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: checks
      type: lifecycle_state
      title: Device compliance checks
      families: [check]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
    - id: issues
      type: lifecycle_state
      title: Open and resolved device check issues
      families: [issue]
      support: supported
      high_value: true
      evidence_types: [configuration_state]
      control_domains: [security_operations]
    - id: software_inventory
      type: entity_family
      title: Installed software inventory
      families: [software]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: user_device_relationships
      type: relationship
      title: User to device relationships
      families: [user_device]
      support: supported
      high_value: true
      evidence_types: [relationship_evidence]
      control_domains: [asset_inventory]
    - id: vulnerabilities
      type: entity_family
      title: Endpoint software vulnerabilities
      families: [vulnerability]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
