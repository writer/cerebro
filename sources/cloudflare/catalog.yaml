id: cloudflare
name: Cloudflare
description: Collects Cloudflare accounts, members, roles, Access applications and groups, Gateway rules, rulesets, Workers, load balancers, zones, DNS records, and account audit logs.
provider_api:
  status: verified
  transport: rest
  auth: bearer_token
  base_url: https://api.cloudflare.com/client/v4
  references:
    - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
  families:
    - id: account
      method: GET
      path: /accounts
    - id: member
      method: GET
      path: /accounts/{account_id}/members
    - id: role
      method: GET
      path: /accounts/{account_id}/roles
    - id: role
      method: GET
      path: /accounts/{account_id}/roles/{role_id}
    - id: account_ruleset
      method: GET
      path: /accounts/{account_id}/rulesets
    - id: account_ruleset
      method: GET
      path: /accounts/{account_id}/rulesets/{ruleset_id}
    - id: worker_script
      method: GET
      path: /accounts/{account_id}/workers/scripts
    - id: audit_log
      method: GET
      path: /accounts/{account_id}/audit_logs
    - id: zone
      method: GET
      path: /zones
    - id: dns_record
      method: GET
      path: /zones/{zone_id}/dns_records
    - id: zone_ruleset
      method: GET
      path: /zones/{zone_id}/rulesets
    - id: zone_ruleset
      method: GET
      path: /zones/{zone_id}/rulesets/{ruleset_id}
    - id: load_balancer
      method: GET
      path: /zones/{zone_id}/load_balancers
    - id: load_balancer_pool
      method: GET
      path: /accounts/{account_id}/load_balancers/pools
    - id: access_application
      method: GET
      path: /accounts/{account_id}/access/apps
    - id: zone_access_application
      method: GET
      path: /zones/{zone_id}/access/apps
    - id: access_group
      method: GET
      path: /accounts/{account_id}/access/groups
    - id: zone_access_group
      method: GET
      path: /zones/{zone_id}/access/groups
    - id: gateway_rule
      method: GET
      path: /accounts/{account_id}/gateway/rules
emitted_kinds:
  - cloudflare.access_application
  - cloudflare.access_group
  - cloudflare.account
  - cloudflare.account_ruleset
  - cloudflare.audit_log
  - cloudflare.member
  - cloudflare.gateway_rule
  - cloudflare.load_balancer
  - cloudflare.load_balancer_pool
  - cloudflare.role
  - cloudflare.worker_script
  - cloudflare.zone
  - cloudflare.zone_access_application
  - cloudflare.zone_access_group
  - cloudflare.zone_ruleset
  - cloudflare.dns_record
runtime_families:
  - access_application
  - access_group
  - account
  - account_ruleset
  - audit_log
  - member
  - gateway_rule
  - load_balancer
  - load_balancer_pool
  - role
  - worker_script
  - zone
  - zone_access_application
  - zone_access_group
  - zone_ruleset
  - dns_record
coverage_contract:
  owner_domain: cloud
  authority_domain: cloudflare
  dimensions:
    - id: access_applications
      type: entity_family
      title: Zero Trust Access applications
      families: [access_application, zone_access_application]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: access_groups
      type: app_entitlement
      title: Zero Trust Access groups
      families: [access_group, zone_access_group]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
    - id: accounts
      type: entity_family
      title: Accounts
      families: [account]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: account_rulesets
      type: entity_family
      title: Account rulesets
      families: [account_ruleset]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: audit_logs
      type: audit_event
      title: Account audit logs
      families: [audit_log]
      support: supported
      high_value: true
      evidence_types: [logging_configuration]
      control_domains: [logging_monitoring]
    - id: dns_records
      type: entity_family
      title: DNS records
      families: [dns_record]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: gateway_rules
      type: entity_family
      title: Zero Trust Gateway rules
      families: [gateway_rule]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      known_unsupported_fields: [inherited parent account rules]
      notes:
        - Configured account Gateway rule metadata, filters, actions, precedence, enabled state, and traffic settings are surfaced.
    - id: load_balancer_pools
      type: entity_family
      title: Load balancer pools
      families: [load_balancer_pool]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: load_balancers
      type: entity_family
      title: Load balancers
      families: [load_balancer]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: members
      type: app_entitlement
      title: Account members
      families: [member]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
    - id: roles
      type: app_entitlement
      title: Account roles
      families: [role]
      support: supported
      high_value: true
      evidence_types: [identity_configuration]
      control_domains: [identity_access]
    - id: worker_scripts
      type: entity_family
      title: Workers scripts
      families: [worker_script]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      known_unsupported_fields: [script content and secret binding values]
      notes:
        - Worker script metadata and binding names/types are surfaced; source code and secret values remain intentionally out of scope.
    - id: zones
      type: entity_family
      title: Zones
      families: [zone]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
    - id: zone_rulesets
      type: entity_family
      title: Zone rulesets
      families: [zone_ruleset]
      support: supported
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
event_contracts:
  - kind: cloudflare.access_application
    schema_ref: cloudflare/access_application/v1
    required_attributes:
      - account_id
      - application_id
    required_payload_fields:
      - id
  - kind: cloudflare.access_group
    schema_ref: cloudflare/access_group/v1
    required_attributes:
      - account_id
      - group_id
    required_payload_fields:
      - id
  - kind: cloudflare.account
    schema_ref: cloudflare/account/v1
    required_attributes:
      - account_id
    required_payload_fields:
      - id
  - kind: cloudflare.account_ruleset
    schema_ref: cloudflare/account_ruleset/v1
    required_attributes:
      - account_id
      - ruleset_id
    required_payload_fields:
      - id
  - kind: cloudflare.audit_log
    schema_ref: cloudflare/audit_log/v1
    required_attributes:
      - account_id
      - audit_id
    required_payload_fields:
      - id
  - kind: cloudflare.member
    schema_ref: cloudflare/member/v1
    required_attributes:
      - account_id
      - member_id
    required_payload_fields:
      - id
  - kind: cloudflare.gateway_rule
    schema_ref: cloudflare/gateway_rule/v1
    required_attributes:
      - account_id
      - rule_id
    required_payload_fields:
      - id
  - kind: cloudflare.load_balancer
    schema_ref: cloudflare/load_balancer/v1
    required_attributes:
      - load_balancer_id
      - zone_id
    required_payload_fields:
      - id
  - kind: cloudflare.load_balancer_pool
    schema_ref: cloudflare/load_balancer_pool/v1
    required_attributes:
      - account_id
      - pool_id
    required_payload_fields:
      - id
  - kind: cloudflare.role
    schema_ref: cloudflare/role/v1
    required_attributes:
      - account_id
      - role_id
    required_payload_fields:
      - id
  - kind: cloudflare.worker_script
    schema_ref: cloudflare/worker_script/v1
    required_attributes:
      - account_id
      - script_id
    required_payload_fields:
      - id
  - kind: cloudflare.zone
    schema_ref: cloudflare/zone/v1
    required_attributes:
      - zone_id
    required_payload_fields:
      - id
  - kind: cloudflare.zone_access_application
    schema_ref: cloudflare/zone_access_application/v1
    required_attributes:
      - application_id
      - zone_id
    required_payload_fields:
      - id
  - kind: cloudflare.zone_access_group
    schema_ref: cloudflare/zone_access_group/v1
    required_attributes:
      - group_id
      - zone_id
    required_payload_fields:
      - id
  - kind: cloudflare.zone_ruleset
    schema_ref: cloudflare/zone_ruleset/v1
    required_attributes:
      - ruleset_id
      - zone_id
    required_payload_fields:
      - id
  - kind: cloudflare.dns_record
    schema_ref: cloudflare/dns_record/v1
    required_attributes:
      - record_id
      - zone_id
    required_payload_fields:
      - id
