id: anchore
name: "Anchore"
description: "Collects assets, findings, and vulnerabilities from Anchore and projects them into the Cerebro graph as assets, findings, and vulnerabilities for asset exposure, vulnerability, finding, and remediation context."
emitted_kinds:
  - anchore.assets
  - anchore.findings
  - anchore.vulnerabilities
runtime_families:
  - assets
  - findings
  - vulnerabilities
provider_api:
  status: verified
  basis: declared
  verified_at: 2026-07-06T00:00:00Z
  transport: rest
  auth: basic
  auth_mechanics: http_basic_authorization_header_or_api_key_as_basic_password
  base_url: https://${config.enterprise_url}/v2
  spec_url: https://docs.anchore.com/current/docs/api/specs/anchore_api_swagger.yaml
  spec_kind: openapi
  references:
    - https://docs.anchore.com/current/docs/api/
    - https://docs.anchore.com/current/docs/api/reference/
    - https://docs.anchore.com/current/docs/api/specs/anchore_api_swagger.yaml
  families:
    - id: assets
      method: GET
      path: /apps/{app_id}/versions/{version_id}/assets
      operation: list_assets
    - id: findings
      method: GET
      path: /apps/{app_id}/versions/{version_id}/policy/findings/all
      operation: list_all_findings
    - id: vulnerabilities
      method: GET
      path: /apps/{app_id}/versions/{version_id}/vulnerabilities
      operation: list_vulnerabilities
kind_lifecycle:
  - kind: anchore.assets
    status: active
  - kind: anchore.findings
    status: active
  - kind: anchore.vulnerabilities
    status: active
coverage_contract:
  owner_domain: source_runtime
  authority_domain: anchore
  dimensions:
    - id: assets
      type: entity_family
      title: "Assets"
      families: [assets]
      support: partial
      high_value: true
      evidence_types: [source_snapshot]
      control_domains: [asset_inventory]
      notes:
        - Reads Anchore Enterprise application version assets from the documented GET /apps/{app_id}/versions/{version_id}/assets endpoint.
    - id: findings
      type: remediation_state
      title: "Findings"
      families: [findings]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Reads Anchore Enterprise application version policy findings from the documented GET /apps/{app_id}/versions/{version_id}/policy/findings/all endpoint.
    - id: vulnerabilities
      type: remediation_state
      title: "Vulnerabilities"
      families: [vulnerabilities]
      support: partial
      high_value: true
      evidence_types: [remediation_state]
      control_domains: [remediation]
      notes:
        - Reads Anchore Enterprise application version vulnerabilities from the documented GET /apps/{app_id}/versions/{version_id}/vulnerabilities endpoint.
    - id: incremental_sync
      type: incremental_sync
      title: Incremental cursor sync
      support: planned
      evidence_types: [source_sync_status]
      control_domains: [source_operations]
event_contracts:
  - kind: anchore.assets
    schema_ref: anchore/assets/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - resource_urn
      - resource_type
      - resource_id
    required_payload_fields:
      - id
  - kind: anchore.findings
    schema_ref: anchore/findings/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
  - kind: anchore.vulnerabilities
    schema_ref: anchore/vulnerabilities/v1
    required_attributes:
      - tenant_id
      - source_event_id
      - finding_id
      - resource_urn
      - severity
      - status
    required_payload_fields:
      - id
