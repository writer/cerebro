sourceId: sendgrid
secretKeys:
  - SENDGRID_API_TOKEN
runtimes:
  - localId: activity
    config:
      family: activity
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /access_settings/activity
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      api_token: env:SENDGRID_API_TOKEN
