sourceId: mercury
secretKeys:
  - MERCURY_TOKEN
runtimes:
  - localId: accounts
    config:
      family: accounts
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /v1/accounts
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:MERCURY_TOKEN
