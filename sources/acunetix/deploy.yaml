sourceId: acunetix
secretKeys:
  - ACUNETIX_BASE_URL
  - ACUNETIX_API_KEY
runtimes:
  - localId: targets
    config:
      base_url: env:ACUNETIX_BASE_URL
      family: targets
      failure_modes: api_error,auth_error,rate_limit,schema_drift
      health_path: /targets
      expected_cadence_seconds: "86400"
      stale_after_seconds: "86400"
      per_page: "100"
      token: env:ACUNETIX_API_KEY
