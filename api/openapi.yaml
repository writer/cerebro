      responses:
        '302':
          description: Redirect to upstream Writer SSO/OIDC.
        '400':
          description: Invalid OAuth authorization request.
  /oauth/callback:
    get:
      summary: Complete upstream Writer SSO/OIDC callback
      description: Consumes upstream OIDC callback state and redirects the MCP client with a one-time authorization code.
      tags:
        - OAuth
      security: []
      responses:
        '302':
          description: Redirect to the registered MCP client callback with an authorization code.
        '400':
          description: Invalid or expired callback state.
        '403':
          description: Authenticated human is not authorized for MCP access.
  /oauth/token:
    post:
      summary: Exchange OAuth token grants
      description: Issues a resource-bound bearer capability token for MCP after PKCE verification, refresh-token rotation, confidential MCP client_credentials authentication, or hashed Cerebro API client_credentials authentication.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, resource]
              additionalProperties:
                type: string
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token, client_credentials]
                client_id:
                  type: string
                resource:
                  type: string
                  format: uri
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: OAuth token response.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  scope:
                    type: string
        '400':
          description: Invalid token request or grant.
        '401':
          description: Client authentication failed.
  /oauth/revoke:
    post:
      summary: Revoke an MCP OAuth refresh token
      description: Revokes the refresh-token family associated with a client-owned MCP OAuth refresh token. Access tokens remain short-lived and resource-bound.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              additionalProperties:
                type: string
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  enum: [refresh_token]
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Token revocation processed.
        '400':
          description: Invalid revocation request.
        '401':
          description: Client authentication failed.
  /oauth/register:
    post:
      summary: Dynamically register an MCP OAuth client
      description: Registers an MCP client with loopback redirect URIs for OAuth authorization-code + PKCE. Confidential dynamic clients receive a generated client secret.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                grant_types:
                  type: array
                  items:
                    type: string
                    enum: [authorization_code, refresh_token]
                response_types:
                  type: array
                  items:
                    type: string
                    enum: [code]
                token_endpoint_auth_method:
                  type: string
                  enum: [none, client_secret_basic, client_secret_post]
      responses:
        '201':
          description: Dynamic client registration response.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, redirect_uris, grant_types, response_types, token_endpoint_auth_method]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                  client_secret_expires_at:
                    type: integer
                    description: Zero means the generated dynamic client secret does not expire.
                  client_name:
                    type: string
                  redirect_uris:
                    type: array
                    items:
                      type: string
                      format: uri
                  grant_types:
                    type: array
                    items:
                      type: string
                  response_types:
                    type: array
                    items:
                      type: string
                  token_endpoint_auth_method:
                    type: string
                    enum: [none, client_secret_basic, client_secret_post]
        '400':
          description: Invalid client metadata.
        '429':
          description: Per-client-IP dynamic registration rate limit exceeded.
  /metrics:
    get:
      operationId: getMetrics
      summary: Export Prometheus-compatible metrics
      tags:
        - Platform
      responses:
        '200':
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
  /platform/append-log/dead-letters/{deadLetterID}/force-purge:
    post:
      operationId: forcePurgePendingAppendLogDeadLetter
      summary: Delete one pending append-log dead letter
      description: Requires an authenticated admin credential allowed for the requested tenant. The actor is derived from that credential. The operation rejects terminal records and records with an active replay claim, writes the audit row and deletion in one transaction, and never returns the replayable event envelope.
      tags:
        - Platform
      parameters:
        - name: deadLetterID
          in: path
          required: true
          description: Exact pending dead-letter record ID to delete.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenant_id
                - reason
              properties:
                tenant_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Concrete incident, change, or recovery reason recorded in the durable audit row.
      responses:
        '200':
          description: The pending record was deleted and its audit row was committed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - dead_letter_id
                  - outcome
                properties:
                  dead_letter_id:
                    type: string
                  outcome:
                    type: string
                    enum:
                      - purged
        '400':
          description: The record ID, tenant ID, or reason is missing or invalid.
        '401':
          description: An authenticated credential is required.
        '403':
          description: The credential is not an admin or is not allowed for the requested tenant.
        '404':
          description: The dead-letter record does not exist for the requested tenant.
        '409':
          description: The dead-letter record is terminal or has an active replay claim.
        '503':
          description: Pending dead-letter purge storage is not configured.
