          description: Updated finding.
  /platform/graph/actions:
    post:
      summary: Execute graph action
      description: Executes or dry-runs a supported provider-backed action against an eligible finding-scoped graph target. `finding_id` is required so Cerebro can authorize the tenant, verify the finding allows the action, and derive the default target. `dry_run=true` returns the planned provider action without mutating provider or finding state. Mutating execution requires `approved=true`, emits a workflow action event, and links the provider action back to the finding as an external lifecycle reference. `target` is an optional explicit target assertion within the authorized finding context. Requires the `cerebro.graph_actions.write` scope. Currently supported actions are `identity.okta.suspend_user`, `identity.okta.unsuspend_user`, and `endpoint.cerebro.revoke_device`.
      tags:
        - Graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphActionRequest'
      responses:
        '200':
          description: Dry-run graph action plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphActionResponse'
        '202':
          description: Approved graph action accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphActionResponse'
  /platform/graph/actions/reconcile:
    post:
      summary: Reconcile graph action
      description: Refreshes one provider-backed graph action already linked to a finding. Cerebro authorizes the finding tenant, reads the action status from the provider, emits a workflow action event, and updates the finding external lifecycle reference. Requires the `cerebro.graph_actions.write` scope.
      tags:
        - Graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileGraphActionRequest'
      responses:
        '202':
          description: Graph action status refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphActionResponse'
