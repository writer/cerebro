openapi: 3.1.0
info:
  title: Cerebro Bootstrap API
  version: v1
  description: Current Writer/Cerebro bootstrap HTTP API. The Connect RPC contract is defined in proto/cerebro/v1/bootstrap.proto.
  contact:
    name: Writer Security
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: Findings
  - name: GRC
  - name: Graph
  - name: Health
  - name: Knowledge
  - name: Platform
  - name: Reports
  - name: Sources
  - name: Workflow
paths:
  /health:
    get:
      summary: Health check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service health and dependency status.
  /healthz:
    get:
      summary: Health check alias
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service health and dependency status.
  /openapi.yaml:
    get:
      summary: Current OpenAPI contract
      tags:
        - Platform
      security: []
      responses:
        '200':
          description: Embedded OpenAPI YAML.
  /sources:
    get:
      summary: List registered sources
      tags:
        - Sources
      responses:
        '200':
          description: Source catalog.
  /sources/{sourceID}/check:
    get:
      summary: Check source configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
      responses:
        '200':
          description: Source check result.
  /sources/{sourceID}/discover:
    get:
      summary: Discover source URNs
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
      responses:
        '200':
          description: Discovery result.
  /sources/{sourceID}/read:
    get:
      summary: Read one source preview page
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Source events and cursor.
  /source-runtimes:
    get:
      summary: List source runtime configurations
      tags:
        - Sources
      parameters:
        - name: runtime_id
          in: query
          schema:
            type: string
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: source_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Source runtime list.
  /source-runtimes/{runtimeID}:
    put:
      summary: Store source runtime configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSourceRuntimeRequest'
      responses:
        '200':
          description: Stored source runtime.
    get:
      summary: Get source runtime configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Stored source runtime.
  /source-runtimes/{runtimeID}/sync:
    post:
      summary: Sync one source runtime through the append log and projections
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Sync result.
  /source-runtimes/{runtimeID}/graph-ingest-runs:
    post:
      summary: Run graph ingest for one source runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Graph ingest run.
  /source-runtimes/{runtimeID}/claims:
    get:
      summary: List claims for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Claim list.
    post:
      summary: Write claims for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Claim write result.
  /source-runtimes/{runtimeID}/findings:
    get:
      summary: List findings for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, suppressed]
        - name: resource_urn
          in: query
          schema:
            type: string
        - name: event_id
          in: query
          schema:
            type: string
        - name: policy_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
        - name: order
          in: query
          schema:
            type: string
            enum: [last_observed, priority, risk_score]
      responses:
        '200':
          description: Finding list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Finding'
  /source-runtimes/{runtimeID}/finding-rules/evaluate:
    post:
      summary: Evaluate selected finding rules for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Rule evaluation result.
  /source-runtimes/{runtimeID}/findings/evaluate:
    post:
      summary: Evaluate and persist findings for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Finding evaluation result.
  /source-runtimes/{runtimeID}/finding-evidence:
    get:
      summary: List finding evidence for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: claim_id
          in: query
          schema:
            type: string
        - name: event_id
          in: query
          schema:
            type: string
        - name: graph_root_urn
          in: query
          schema:
            type: string
        - name: graph_path_urn
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Finding evidence list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingEvidence'
  /source-runtimes/{runtimeID}/finding-evaluation-runs:
    get:
      summary: List finding evaluation runs for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: rule_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Finding evaluation run list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingEvaluationRun'
  /findings/{findingID}:
    get:
      summary: Get finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Finding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  finding:
                    $ref: '#/components/schemas/Finding'
  /findings/{findingID}/resolve:
    post:
      summary: Resolve finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/suppress:
    post:
      summary: Suppress finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/notes:
    post:
      summary: Add finding note
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/tickets:
    post:
      summary: Link finding ticket
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/assign:
    put:
      summary: Assign finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/due:
    put:
      summary: Set finding due date
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /endpoint-vulnerability-findings:
    get:
      summary: List enriched endpoint vulnerability findings
      description: Requires an endpoint identifier. Provide device_id for the primary contract; serial_number and agent_id are accepted as additional lookup keys.
      x-cerebro-required-any-query:
        - device_id
        - serial_number
        - agent_id
      tags:
        - Findings
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: device_id
          in: query
          schema:
            type: string
        - name: serial_number
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: include_stale
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Active endpoint vulnerability findings enriched with source provenance and remediation hints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointVulnerabilityFindingsResponse'
  /finding-rules:
    get:
      summary: List finding rules
      tags:
        - Findings
      responses:
        '200':
          description: Finding rule catalog.
  /finding-evaluation-runs/{runID}:
    get:
      summary: Get finding evaluation run
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Finding evaluation run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: '#/components/schemas/FindingEvaluationRun'
  /finding-evidence/{evidenceID}:
    get:
      summary: Get finding evidence
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/evidenceID'
      responses:
        '200':
          description: Finding evidence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    $ref: '#/components/schemas/FindingEvidence'
  /reports:
    get:
      summary: List report definitions
      tags:
        - Reports
      responses:
        '200':
          description: Report definition catalog.
  /reports/{reportID}/runs:
    post:
      summary: Run report
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/reportID'
      responses:
        '200':
          description: Report run.
  /report-runs/{runID}:
    get:
      summary: Get report run
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Report run.
  /grc/dashboard:
    get:
      summary: GRC operator dashboard
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: GRC dashboard summary, priority findings, controls, evidence, and connector health.
  /grc/ask:
    post:
      summary: Ask natural-language questions over the GRC graph
      tags:
        - GRC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GRCAskRequest'
      responses:
        '200':
          description: Server-sent graph answer events in rationale, cypher, rows, summary, done order.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid ask request.
        '503':
          description: Graph or LLM runtime unavailable.
  /grc/findings:
    get:
      summary: GRC risk inbox findings
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: status
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: resource_urn
          in: query
          schema:
            type: string
        - name: policy_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: GRC-friendly finding list.
  /grc/controls:
    get:
      summary: GRC control posture
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Control status grouped from mapped findings and evidence.
  /grc/evidence:
    get:
      summary: GRC evidence library
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: graph_root_urn
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Evidence items with finding context.
  /grc/entities/{entityID}/impact:
    get:
      summary: GRC entity impact map
      tags:
        - GRC
      parameters:
        - name: entityID
          in: path
          required: true
          schema:
            type: string
        - name: root_urn
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Graph neighborhood and related findings for one entity.
  /grc/audit-packets/{packetID}:
    get:
      summary: GRC audit packet for one finding
      tags:
        - GRC
      parameters:
        - name: packetID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Finding, evidence, controls, graph context, and recommended next action.
  /platform/knowledge/decisions:
    post:
      summary: Record platform decision
      tags:
        - Knowledge
      responses:
        '200':
          description: Decision write result.
  /platform/knowledge/actions:
    post:
      summary: Record platform action
      tags:
        - Knowledge
      responses:
        '200':
          description: Action write result.
  /platform/knowledge/actions/recommendation:
    post:
      summary: Record recommended action
      tags:
        - Knowledge
      responses:
        '200':
          description: Action write result.
  /platform/knowledge/outcomes:
    post:
      summary: Record platform outcome
      tags:
        - Knowledge
      responses:
        '200':
          description: Outcome write result.
  /platform/workflow/replay:
    post:
      summary: Replay workflow events
      tags:
        - Workflow
      responses:
        '200':
          description: Replay result.
  /platform/graph/neighborhood:
    get:
      summary: Query graph neighborhood
      tags:
        - Graph
      parameters:
        - name: root_urn
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Neighborhood result.
  /platform/graph/impact/vulnerability/{id}:
    get:
      summary: Query vulnerability impact graph
      tags:
        - Graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Vulnerability impact result.
  /platform/graph/impact/package:
    get:
      summary: Query package exposure graph
      tags:
        - Graph
      parameters:
        - name: package
          in: query
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Package exposure result.
  /platform/graph/impact/asset:
    get:
      summary: Query asset vulnerability graph
      tags:
        - Graph
      parameters:
        - name: urn
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Asset vulnerability result.
  /platform/graph/attack-paths:
    get:
      summary: Query cloud attack paths
      tags:
        - Graph
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Cloud attack paths.
  /platform/graph/crown-jewel-rankings:
    get:
      summary: Query personalized crown-jewel graph rankings
      tags:
        - Graph
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
        - name: seed_limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Personalized crown-jewel graph rankings.
  /platform/graph/aws-public-endpoint-insights:
    get:
      summary: Query AWS public endpoint overlap insights
      tags:
        - Graph
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: AWS public endpoint overlap insights.
  /platform/endpoints/{deviceKey}/vulnerability-findings:
    get:
      summary: Query enriched vulnerability findings for one endpoint device key
      tags:
        - Findings
      parameters:
        - name: deviceKey
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: include_stale
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Endpoint vulnerability findings joined from graph inventory and vulnerability evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointVulnerabilityFindingsResponse'
  /platform/graph/ingest-health:
    get:
      summary: Check graph ingest health
      tags:
        - Graph
      responses:
        '200':
          description: Graph ingest health.
  /platform/graph/ingest-runs:
    get:
      summary: List graph ingest runs
      tags:
        - Graph
      responses:
        '200':
          description: Graph ingest runs.
  /platform/graph/ingest-runs/{runID}:
    get:
      summary: Get graph ingest run
      tags:
        - Graph
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Graph ingest run.
  /graph/neighborhood:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/neighborhood
      tags:
        - Graph
      responses:
        '200':
          description: Neighborhood result.
  /graph/impact/vulnerability/{id}:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/impact/vulnerability/{id}
      tags:
        - Graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Vulnerability impact result.
  /graph/impact/package:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/impact/package
      tags:
        - Graph
      parameters:
        - name: package
          in: query
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Package exposure result.
  /graph/impact/asset:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/impact/asset
      tags:
        - Graph
      parameters:
        - name: urn
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Asset vulnerability result.
  /graph/ingest-health:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/ingest-health
      tags:
        - Graph
      responses:
        '200':
          description: Graph ingest health.
  /graph/ingest-runs:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/ingest-runs
      tags:
        - Graph
      responses:
        '200':
          description: Graph ingest runs.
  /graph/ingest-runs/{runID}:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/ingest-runs/{runID}
      tags:
        - Graph
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Graph ingest run.
  /graph/actuate/recommendation:
    post:
      deprecated: true
      summary: Legacy alias for /platform/knowledge/actions/recommendation
      tags:
        - Graph
      responses:
        '200':
          description: Action write result.
  /graph/write/outcome:
    post:
      deprecated: true
      summary: Legacy alias for /platform/knowledge/outcomes
      tags:
        - Graph
      responses:
        '200':
          description: Outcome write result.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    sourceID:
      name: sourceID
