openapi: 3.1.0
info:
  title: Cerebro Bootstrap API
  version: v1
  description: Current Writer/Cerebro bootstrap HTTP API. The Connect RPC contract is defined in proto/cerebro/v1/bootstrap.proto.
  contact:
    name: Writer Security
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: Devices
  - name: Findings
  - name: GRC
  - name: Graph
  - name: Health
  - name: Knowledge
  - name: MCP
  - name: OAuth
  - name: Platform
  - name: Reports
  - name: Sources
  - name: Telemetry
  - name: Workflow
paths:
  /health:
    get:
      summary: Readiness check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is ready and configured dependencies are healthy.
        '503':
          description: Service is live but one or more configured dependencies are degraded.
  /healthz:
    get:
      summary: Liveness check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service process is live.
  /livez:
    get:
      summary: Liveness check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service process is live.
  /openapi.yaml:
    get:
      summary: Current OpenAPI contract
      tags:
        - Platform
      security: []
      responses:
        '200':
          description: Embedded OpenAPI YAML.
  /api/v1/mcp:
    get:
      summary: Reject MCP stateful event-stream transport
      tags:
        - MCP
      responses:
        '405':
          description: Cerebro's MCP route is stateless Streamable HTTP over POST only; GET is not an SSE endpoint.
    post:
      summary: Invoke MCP JSON-RPC method
      tags:
        - MCP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: MCP JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '202':
          description: Accepted MCP notification or client message with no response body.
        '400':
          description: Unsupported or invalid MCP protocol version.
        '401':
          description: Authentication is required.
        '403':
          description: Request origin or authorization scope is not allowed.
  /sources:
    get:
      summary: List registered sources
      tags:
        - Sources
      responses:
        '200':
          description: Source catalog.
  /sources/{sourceID}/check:
    get:
      summary: Check source configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
      responses:
        '200':
          description: Source check result.
  /sources/{sourceID}/discover:
    get:
      summary: Discover source URNs
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
      responses:
        '200':
          description: Discovery result.
  /sources/{sourceID}/read:
    get:
      summary: Read one source preview page
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Source events and cursor.
  /source-runtimes:
    get:
      summary: List source runtime configurations
      tags:
        - Sources
      parameters:
        - name: runtime_id
          in: query
          schema:
            type: string
        - name: runtime_ids
          in: query
          schema:
            type: string
          description: Comma-separated runtime IDs.
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: source_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Source runtime list.
  /source-runtimes/health:
    get:
      summary: List consolidated source runtime health
      tags:
        - Sources
      parameters:
        - name: runtime_id
          in: query
          schema:
            type: string
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: source_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Consolidated runtime freshness, graph ingest, and finding evaluation health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRuntimeHealthResponse'
  /source-runtimes/{runtimeID}:
    put:
      summary: Store source runtime configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSourceRuntimeRequest'
      responses:
        '200':
          description: Stored source runtime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSourceRuntimeResponse'
    get:
      summary: Get source runtime configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Stored source runtime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSourceRuntimeResponse'
  /source-runtimes/{runtimeID}/sync:
    post:
      summary: Sync one source runtime through the append log and projections
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Sync result.
  /source-runtimes/{runtimeID}/invalid-events:
    get:
      summary: List invalid or quarantined events for one source runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Operator-inspectable invalid event diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRuntimeInvalidEventsResponse'
  /source-runtimes/{runtimeID}/graph-ingest-runs:
    post:
      summary: Run graph ingest for one source runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Graph ingest run.
  /source-runtimes/{runtimeID}/claims:
    get:
      summary: List claims for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: claim_id
          in: query
          schema:
            type: string
        - name: subject_urn
          in: query
          schema:
            type: string
        - name: predicate
          in: query
          schema:
            type: string
        - name: object_urn
          in: query
          schema:
            type: string
        - name: object_value
          in: query
          schema:
            type: string
        - name: claim_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: source_event_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Claim list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClaimsResponse'
    post:
      summary: Write claims for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteClaimsRequest'
      responses:
        '200':
          description: Claim write result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteClaimsResponse'
  /source-runtimes/{runtimeID}/findings:
    get:
      summary: List findings for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, suppressed]
        - name: resource_urn
          in: query
          schema:
            type: string
        - name: event_id
          in: query
          schema:
            type: string
        - name: policy_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
        - name: order
          in: query
          schema:
            type: string
            enum: [last_observed, priority, risk_score]
      responses:
        '200':
          description: Finding list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Finding'
  /source-runtimes/{runtimeID}/finding-rules/evaluate:
    post:
      summary: Evaluate selected finding rules for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Rule evaluation result.
  /source-runtimes/{runtimeID}/finding-candidates:
    get:
      summary: List candidate findings for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: candidate_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [candidate, promoted, rejected]
        - name: fingerprint
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Candidate finding list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingCandidate'
  /source-runtimes/{runtimeID}/finding-candidates/evaluate:
    post:
      summary: Evaluate candidate findings for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: rule_id
          in: query
          schema:
            type: string
        - name: event_limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Candidate finding evaluation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    type: object
                  events_evaluated:
                    type: integer
                    minimum: 0
                  evaluations:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingCandidateRuleEvaluation'
  /source-runtimes/{runtimeID}/findings/evaluate:
    post:
      summary: Evaluate and persist findings for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Finding evaluation result.
  /source-runtimes/{runtimeID}/finding-evidence:
    get:
      summary: List finding evidence for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: claim_id
          in: query
          schema:
            type: string
        - name: event_id
          in: query
          schema:
            type: string
        - name: graph_root_urn
          in: query
          schema:
            type: string
        - name: graph_path_urn
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Finding evidence list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingEvidence'
  /source-runtimes/{runtimeID}/finding-evaluation-runs:
    get:
      summary: List finding evaluation runs for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: rule_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Finding evaluation run list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingEvaluationRun'
  /findings/{findingID}:
    get:
      summary: Get finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Finding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  finding:
                    $ref: '#/components/schemas/Finding'
  /finding-candidates/{candidateID}:
    get:
      summary: Get candidate finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/candidateID'
      responses:
        '200':
          description: Candidate finding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidate:
                    $ref: '#/components/schemas/FindingCandidate'
  /finding-candidates/{candidateID}/promote:
    post:
      summary: Promote candidate finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/candidateID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteFindingCandidateRequest'
      responses:
        '200':
          description: Promoted finding and candidate metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  finding:
                    $ref: '#/components/schemas/Finding'
                  candidate:
                    $ref: '#/components/schemas/FindingCandidate'
                  decision_id:
                    type: string
  /finding-candidates/{candidateID}/reject:
    post:
      summary: Reject candidate finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/candidateID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectFindingCandidateRequest'
      responses:
        '200':
          description: Rejected candidate metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidate:
                    $ref: '#/components/schemas/FindingCandidate'
                  decision_id:
                    type: string
  /findings/{findingID}/resolve:
    post:
      summary: Resolve finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/suppress:
    post:
      summary: Suppress finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/notes:
    post:
      summary: Add finding note
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/tickets:
    post:
      summary: Link finding ticket
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/assign:
    put:
      summary: Assign finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/due:
    put:
      summary: Set finding due date
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /endpoint-vulnerability-findings:
    get:
      summary: List enriched endpoint vulnerability findings
      description: Requires an endpoint identifier. Provide device_id for the primary contract; serial_number and agent_id are accepted as additional lookup keys.
      x-cerebro-required-any-query:
        - device_id
        - serial_number
        - agent_id
      tags:
        - Findings
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: device_id
          in: query
          schema:
            type: string
        - name: serial_number
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: include_stale
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Active endpoint vulnerability findings enriched with source provenance and remediation hints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointVulnerabilityFindingsResponse'
  /finding-rules:
    get:
      summary: List finding rules
      tags:
        - Findings
      responses:
        '200':
          description: Finding rule catalog.
  /finding-evaluation-runs/{runID}:
    get:
      summary: Get finding evaluation run
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Finding evaluation run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: '#/components/schemas/FindingEvaluationRun'
  /finding-evidence/{evidenceID}:
    get:
      summary: Get finding evidence
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/evidenceID'
      responses:
        '200':
          description: Finding evidence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    $ref: '#/components/schemas/FindingEvidence'
  /reports:
    get:
      summary: List report definitions
      tags:
        - Reports
      responses:
        '200':
          description: Report definition catalog.
  /reports/{reportID}/runs:
    post:
      summary: Run report
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/reportID'
      responses:
        '200':
          description: Report run.
  /report-runs/{runID}:
    get:
      summary: Get report run
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Report run.
  /grc/dashboard:
    get:
      summary: GRC operator dashboard
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: GRC dashboard summary, priority findings, controls, evidence, and connector health.
  /grc/ask:
    post:
      summary: Ask natural-language questions over the GRC graph
      tags:
        - GRC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GRCAskRequest'
      responses:
        '200':
          description: Server-sent graph answer events. Successful streams emit progress, graph_probe, rationale, query_plan, cypher, optional recovery, rows, summary, and done events; failures after streaming starts emit an error event.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid ask request.
        '503':
          description: Graph or LLM runtime unavailable.
  /grc/findings:
    get:
      summary: GRC risk inbox findings
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: status
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: resource_urn
          in: query
          schema:
            type: string
        - name: policy_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: GRC-friendly finding list.
  /grc/controls:
    get:
      summary: GRC control posture
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Control status grouped from mapped findings and evidence.
  /grc/evidence:
    get:
      summary: GRC evidence library
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: graph_root_urn
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Evidence items with finding context.
  /grc/inventory/categories:
    get:
      summary: Inventory categories
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Inventory categories grouped by graph entity type.
  /grc/inventory/assets:
    get:
      summary: Inventory assets
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: category_id
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: scope_state
          in: query
          schema:
            type: string
            enum: [in_scope, out_of_scope, all]
      responses:
        '200':
          description: Inventory asset list with risk, ownership, and GRC purview state.
  /grc/inventory/assets/detail:
    get:
      summary: Inventory asset detail
      tags:
        - GRC
      parameters:
        - name: urn
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Inventory asset overview, related findings, evidence, controls, tests, vulnerabilities, timeline, and recommended actions.
  /grc/inventory/resource-scope:
    get:
      summary: Inventory resource scope
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: category_id
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Source runtime scope and currently projected resources.
    post:
      summary: Update inventory resource scope
      tags:
        - GRC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_urn, scope_state]
              properties:
                tenant_id:
                  type: string
                asset_urn:
                  type: string
                source_id:
                  type: string
                scope_state:
                  type: string
                  enum: [in_scope, out_of_scope]
                reason:
                  type: string
                attributes:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Updated GRC purview state for one inventory asset.
  /grc/inventory/asset-reports:
    get:
      summary: Inventory asset reports
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: asset_urn
          in: query
          schema:
