      type: object
      required: [action, finding_id]
      properties:
        action:
          type: string
          enum: [identity.okta.suspend_user, identity.okta.unsuspend_user, endpoint.cerebro.revoke_device]
        finding_id:
          type: string
          minLength: 1
          description: Required finding id. Cerebro authorizes the finding tenant, derives the default target, and links the provider action back to the finding.
        target:
          type: string
          description: Optional explicit graph action target within the authorized finding context. For Okta identity actions this is an Okta user id, login, or email; for Cerebro device actions this is the finding-scoped device id.
        reason:
          type: string
          maxLength: 2048
        ticket_url:
          type: string
          format: uri
        idempotency_key:
          type: string
          maxLength: 256
          description: Optional caller-provided idempotency key. Cerebro generates a stable per-action/finding-or-target key when omitted.
        dry_run:
          type: boolean
          description: Validate policy, target resolution, and provider routing without calling the provider or linking an external reference.
        approved:
          type: boolean
          description: Required as true for mutating execution. Not required when dry_run is true.
        parameters:
          type: object
          additionalProperties:
            type: string
          description: Reserved generic action parameters for future executors. Current actions reject non-empty parameters.
