openapi: 3.1.0
info:
  title: Cerebro Bootstrap API
  version: v1
  description: Current Writer/Cerebro bootstrap HTTP API. The Connect RPC contract is defined in proto/cerebro/v1/bootstrap.proto.
  contact:
    name: Writer Security
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: Devices
  - name: Findings
  - name: GRC
  - name: Graph
  - name: Health
  - name: Knowledge
  - name: Platform
  - name: Reports
  - name: Sources
  - name: Telemetry
  - name: Workflow
paths:
  /health:
    get:
      summary: Health check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service health and dependency status.
  /healthz:
    get:
      summary: Health check alias
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service health and dependency status.
  /openapi.yaml:
    get:
      summary: Current OpenAPI contract
      tags:
        - Platform
      security: []
      responses:
        '200':
          description: Embedded OpenAPI YAML.
  /sources:
    get:
      summary: List registered sources
      tags:
        - Sources
      responses:
        '200':
          description: Source catalog.
  /sources/{sourceID}/check:
    get:
      summary: Check source configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
      responses:
        '200':
          description: Source check result.
  /sources/{sourceID}/discover:
    get:
      summary: Discover source URNs
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
      responses:
        '200':
          description: Discovery result.
  /sources/{sourceID}/read:
    get:
      summary: Read one source preview page
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Source events and cursor.
  /source-runtimes:
    get:
      summary: List source runtime configurations
      tags:
        - Sources
      parameters:
        - name: runtime_id
          in: query
          schema:
            type: string
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: source_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Source runtime list.
  /source-runtimes/{runtimeID}:
    put:
      summary: Store source runtime configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSourceRuntimeRequest'
      responses:
        '200':
          description: Stored source runtime.
    get:
      summary: Get source runtime configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Stored source runtime.
  /source-runtimes/{runtimeID}/sync:
    post:
      summary: Sync one source runtime through the append log and projections
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Sync result.
  /source-runtimes/{runtimeID}/graph-ingest-runs:
    post:
      summary: Run graph ingest for one source runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Graph ingest run.
  /source-runtimes/{runtimeID}/claims:
    get:
      summary: List claims for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Claim list.
    post:
      summary: Write claims for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Claim write result.
  /source-runtimes/{runtimeID}/findings:
    get:
      summary: List findings for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, suppressed]
        - name: resource_urn
          in: query
          schema:
            type: string
        - name: event_id
          in: query
          schema:
            type: string
        - name: policy_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
        - name: order
          in: query
          schema:
            type: string
            enum: [last_observed, priority, risk_score]
      responses:
        '200':
          description: Finding list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Finding'
  /source-runtimes/{runtimeID}/finding-rules/evaluate:
    post:
      summary: Evaluate selected finding rules for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Rule evaluation result.
  /source-runtimes/{runtimeID}/findings/evaluate:
    post:
      summary: Evaluate and persist findings for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
      responses:
        '200':
          description: Finding evaluation result.
  /source-runtimes/{runtimeID}/finding-evidence:
    get:
      summary: List finding evidence for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: claim_id
          in: query
          schema:
            type: string
        - name: event_id
          in: query
          schema:
            type: string
        - name: graph_root_urn
          in: query
          schema:
            type: string
        - name: graph_path_urn
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Finding evidence list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingEvidence'
  /source-runtimes/{runtimeID}/finding-evaluation-runs:
    get:
      summary: List finding evaluation runs for one runtime
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/runtimeID'
        - name: rule_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Finding evaluation run list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingEvaluationRun'
  /findings/{findingID}:
    get:
      summary: Get finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Finding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  finding:
                    $ref: '#/components/schemas/Finding'
  /findings/{findingID}/resolve:
    post:
      summary: Resolve finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/suppress:
    post:
      summary: Suppress finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/notes:
    post:
      summary: Add finding note
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/tickets:
    post:
      summary: Link finding ticket
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/assign:
    put:
      summary: Assign finding
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /findings/{findingID}/due:
    put:
      summary: Set finding due date
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/findingID'
      responses:
        '200':
          description: Updated finding.
  /endpoint-vulnerability-findings:
    get:
      summary: List enriched endpoint vulnerability findings
      description: Requires an endpoint identifier. Provide device_id for the primary contract; serial_number and agent_id are accepted as additional lookup keys.
      x-cerebro-required-any-query:
        - device_id
        - serial_number
        - agent_id
      tags:
        - Findings
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: device_id
          in: query
          schema:
            type: string
        - name: serial_number
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: include_stale
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Active endpoint vulnerability findings enriched with source provenance and remediation hints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointVulnerabilityFindingsResponse'
  /finding-rules:
    get:
      summary: List finding rules
      tags:
        - Findings
      responses:
        '200':
          description: Finding rule catalog.
  /finding-evaluation-runs/{runID}:
    get:
      summary: Get finding evaluation run
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Finding evaluation run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: '#/components/schemas/FindingEvaluationRun'
  /finding-evidence/{evidenceID}:
    get:
      summary: Get finding evidence
      tags:
        - Findings
      parameters:
        - $ref: '#/components/parameters/evidenceID'
      responses:
        '200':
          description: Finding evidence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    $ref: '#/components/schemas/FindingEvidence'
  /reports:
    get:
      summary: List report definitions
      tags:
        - Reports
      responses:
        '200':
          description: Report definition catalog.
  /reports/{reportID}/runs:
    post:
      summary: Run report
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/reportID'
      responses:
        '200':
          description: Report run.
  /report-runs/{runID}:
    get:
      summary: Get report run
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Report run.
  /grc/dashboard:
    get:
      summary: GRC operator dashboard
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: GRC dashboard summary, priority findings, controls, evidence, and connector health.
  /grc/ask:
    post:
      summary: Ask natural-language questions over the GRC graph
      tags:
        - GRC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GRCAskRequest'
      responses:
        '200':
          description: Server-sent graph answer events in rationale, cypher, rows, summary, done order.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid ask request.
        '503':
          description: Graph or LLM runtime unavailable.
  /grc/findings:
    get:
      summary: GRC risk inbox findings
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: status
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: resource_urn
          in: query
          schema:
            type: string
        - name: policy_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: GRC-friendly finding list.
  /grc/controls:
    get:
      summary: GRC control posture
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Control status grouped from mapped findings and evidence.
  /grc/evidence:
    get:
      summary: GRC evidence library
      tags:
        - GRC
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/runtimeIDQuery'
        - $ref: '#/components/parameters/sourceIDQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: finding_id
          in: query
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: graph_root_urn
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Evidence items with finding context.
  /grc/entities/{entityID}/impact:
    get:
      summary: GRC entity impact map
      tags:
        - GRC
      parameters:
        - name: entityID
          in: path
          required: true
          schema:
            type: string
        - name: root_urn
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/tenantIDQuery'
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Graph neighborhood and related findings for one entity.
  /grc/audit-packets/{packetID}:
    get:
      summary: GRC audit packet for one finding
      tags:
        - GRC
      parameters:
        - name: packetID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Finding, evidence, controls, graph context, and recommended next action.
  /platform/knowledge/decisions:
    post:
      summary: Record platform decision
      tags:
        - Knowledge
      responses:
        '200':
          description: Decision write result.
  /platform/knowledge/actions:
    post:
      summary: Record platform action
      tags:
        - Knowledge
      responses:
        '200':
          description: Action write result.
  /platform/knowledge/actions/recommendation:
    post:
      summary: Record recommended action
      tags:
        - Knowledge
      responses:
        '200':
          description: Action write result.
  /platform/knowledge/outcomes:
    post:
      summary: Record platform outcome
      tags:
        - Knowledge
      responses:
        '200':
          description: Outcome write result.
  /platform/workflow/replay:
    post:
      summary: Replay workflow events
      tags:
        - Workflow
      responses:
        '200':
          description: Replay result.
  /platform/graph/neighborhood:
    get:
      summary: Query graph neighborhood
      tags:
        - Graph
      parameters:
        - name: root_urn
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Neighborhood result.
  /platform/graph/impact/vulnerability/{id}:
    get:
      summary: Query vulnerability impact graph
      tags:
        - Graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Vulnerability impact result.
  /platform/graph/impact/package:
    get:
      summary: Query package exposure graph
      tags:
        - Graph
      parameters:
        - name: package
          in: query
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Package exposure result.
  /platform/graph/impact/asset:
    get:
      summary: Query asset vulnerability graph
      tags:
        - Graph
      parameters:
        - name: urn
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Asset vulnerability result.
  /platform/graph/attack-paths:
    get:
      summary: Query cloud attack paths
      tags:
        - Graph
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Cloud attack paths.
  /platform/graph/crown-jewel-rankings:
    get:
      summary: Query personalized crown-jewel graph rankings
      tags:
        - Graph
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
        - name: seed_limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Personalized crown-jewel graph rankings.
  /platform/graph/aws-public-endpoint-insights:
    get:
      summary: Query AWS public endpoint overlap insights
      tags:
        - Graph
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: AWS public endpoint overlap insights.
  /platform/endpoints/{deviceKey}/vulnerability-findings:
    get:
      summary: Query enriched vulnerability findings for one endpoint device key
      tags:
        - Findings
      parameters:
        - name: deviceKey
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: include_stale
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Endpoint vulnerability findings joined from graph inventory and vulnerability evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointVulnerabilityFindingsResponse'
  /platform/graph/ingest-health:
    get:
      summary: Check graph ingest health
      tags:
        - Graph
      responses:
        '200':
          description: Graph ingest health.
  /platform/graph/ingest-runs:
    get:
      summary: List graph ingest runs
      tags:
        - Graph
      responses:
        '200':
          description: Graph ingest runs.
  /platform/graph/ingest-runs/{runID}:
    get:
      summary: Get graph ingest run
      tags:
        - Graph
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Graph ingest run.
  /graph/neighborhood:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/neighborhood
      tags:
        - Graph
      responses:
        '200':
          description: Neighborhood result.
  /graph/impact/vulnerability/{id}:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/impact/vulnerability/{id}
      tags:
        - Graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Vulnerability impact result.
  /graph/impact/package:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/impact/package
      tags:
        - Graph
      parameters:
        - name: package
          in: query
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Package exposure result.
  /graph/impact/asset:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/impact/asset
      tags:
        - Graph
      parameters:
        - name: urn
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Asset vulnerability result.
  /graph/ingest-health:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/ingest-health
      tags:
        - Graph
      responses:
        '200':
          description: Graph ingest health.
  /graph/ingest-runs:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/ingest-runs
      tags:
        - Graph
      responses:
        '200':
          description: Graph ingest runs.
  /graph/ingest-runs/{runID}:
    get:
      deprecated: true
      summary: Legacy alias for /platform/graph/ingest-runs/{runID}
      tags:
        - Graph
      parameters:
        - $ref: '#/components/parameters/runID'
      responses:
        '200':
          description: Graph ingest run.
  /graph/actuate/recommendation:
    post:
      deprecated: true
      summary: Legacy alias for /platform/knowledge/actions/recommendation
      tags:
        - Graph
      responses:
        '200':
          description: Action write result.
  /graph/write/outcome:
    post:
      deprecated: true
      summary: Legacy alias for /platform/knowledge/outcomes
      tags:
        - Graph
      responses:
        '200':
          description: Outcome write result.
  /platform/devices/enroll:
    post:
      summary: Enroll a SeCheck agent
      description: |
        Consumes a single-use bootstrap token and provisions a device
        identity. The bootstrap token is delivered out-of-band by MDM and
        is bound to the device's hardware_uuid. Returns a short-lived
        access token (EdDSA JWT) and a long-lived refresh token. Replay
        of an already-consumed bootstrap token returns 401.
      tags:
        - Devices
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnrollRequest'
      responses:
        '200':
          description: Enrollment succeeded; access + refresh pair returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          description: Malformed request body.
        '401':
          description: Bootstrap token invalid, expired, already consumed, or hardware-uuid mismatch.
        '429':
          description: Per-IP enrollment rate limit exceeded.
  /platform/devices/token:
    post:
      summary: Rotate a device refresh token
      description: |
        Exchanges a refresh token for a new access + refresh pair. The
        previous refresh token is consumed atomically. Replaying a
        consumed refresh token revokes the entire token family per RFC 6819
        §5.2.2.3.

        When the device was enrolled with a hardware-bound key (App Attest
        or TPM 2.0), the request MUST carry an RFC 9449 DPoP proof JWT in
        the `DPoP` header signed by the bound key, with `htm` matching the
        request method, `htu` matching the canonical request URL, a unique
        `jti`, and a fresh `iat`. The proof's JWK SHA-256 thumbprint
        (RFC 7638) must equal the device's stored `dpop_jkt`.
      tags:
        - Devices
      security: []
      parameters:
        - in: header
          name: DPoP
          required: false
          schema:
            type: string
          description: |
            RFC 9449 DPoP proof JWT. Required when the device was enrolled
            with a hardware-bound key. Algorithms: ES256, ES384, EdDSA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Rotation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          description: Unsupported grant_type.
        '401':
          description: |
            Refresh token unknown, expired, or replayed (family revoked); or
            DPoP proof is missing (`dpop_required`), malformed
            (`dpop_malformed`), or invalid -- bad signature, replayed jti,
            expired iat, htm/htu mismatch, or jkt mismatch (`dpop_invalid`).
        '429':
          description: Per-device token rate limit exceeded.
  /platform/devices/bootstrap-tokens:
    post:
      summary: Issue a single-use bootstrap token (operator-only)
      description: |
        Mints a single-use enrollment credential bound to a hardware_uuid
        for one tenant. Requires the platform.devices.bootstrap_tokens.write
        scope. The plaintext token is returned exactly once; only its
        SHA-256 digest is persisted.
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBootstrapTokenRequest'
      responses:
        '201':
          description: Bootstrap token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBootstrapTokenResponse'
        '400':
          description: Malformed request body.
        '403':
          description: Caller lacks the platform.devices.bootstrap_tokens.write scope.
  /platform/devices/{deviceID}/revoke:
    post:
      summary: Revoke a device (operator-only)
      description: |
        Marks the device revoked. Subsequent refresh attempts fail with
        403; access tokens already issued expire on their own at the
        configured access TTL.
      tags:
        - Devices
      parameters:
        - name: deviceID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDeviceRequest'
      responses:
        '200':
          description: Revocation succeeded.
        '403':
          description: Caller lacks the platform.devices.revoke scope.
        '404':
          description: Device not found.
  /platform/telemetry/ingest:
    post:
      summary: Ingest device telemetry (device-only)
      description: |
        Accepts a telemetry batch from an enrolled SeCheck agent. Requires
        a device JWT carrying the platform.telemetry.ingest scope and a
        non-empty Idempotency-Key request header. A retried submission
        with the same key + body is replayed without side effects; same
        key with a different body returns 409 (RFC 5789-inspired
        idempotency contract).
      tags:
        - Telemetry
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Telemetry accepted.
        '400':
          description: Missing Idempotency-Key or malformed body.
        '403':
          description: Caller is not a device principal.
        '409':
          description: Idempotency-Key reused with a different body.
        '413':
          description: Body exceeds 1 MiB.
  /.well-known/device-jwks.json:
    get:
      summary: Device-JWT verification keys
      description: |
        Publishes the active and retiring Ed25519 verification keys as a
        JWK Set (RFC 7517 §4 + RFC 8037). Cache headers permit short-term
        caching by downstream verifiers.
      tags:
        - Devices
      security: []
      responses:
        '200':
          description: JWK Set document.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    sourceID:
      name: sourceID
      in: path
      required: true
      schema:
        type: string
    runtimeID:
      name: runtimeID
      in: path
      required: true
      schema:
        type: string
    findingID:
      name: findingID
      in: path
      required: true
      schema:
        type: string
    runID:
      name: runID
      in: path
      required: true
      schema:
        type: string
    evidenceID:
      name: evidenceID
      in: path
      required: true
      schema:
        type: string
    reportID:
      name: reportID
      in: path
      required: true
      schema:
        type: string
    tenantIDQuery:
      name: tenant_id
      in: query
      schema:
        type: string
    runtimeIDQuery:
      name: runtime_id
      in: query
      schema:
        type: string
    sourceIDQuery:
      name: source_id
      in: query
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
  schemas:
    DeviceEnrollRequest:
      type: object
      required: [bootstrap_token, hardware_uuid]
      properties:
        bootstrap_token:
          type: string
          minLength: 1
        hardware_uuid:
          type: string
          minLength: 1
        serial_number:
          type: string
        hostname:
          type: string
        os_type:
          type: string
        os_version:
          type: string
        agent_version:
          type: string
        attestation:
          type: string
          description: |
            Base64-encoded device-bound attestation statement. On macOS this is
            an Apple App Attest CBOR attestationObject; on Windows a TPM 2.0
            quote bundle (JSON envelope with ek_chain, ak_pub_der, quote, signature, alg).
            Required when CEREBRO_DEVICE_AUTH_ATTESTATION_REQUIRED=true; if
            present and verified, the server binds a DPoP key (RFC 9449) to
            subsequent refresh-token rotations and the response includes
            assurance_level=hardware.
    DeviceTokenRequest:
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
          minLength: 1
    DeviceTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scopes]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until access_token expires.
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
        device_id:
          type: string
        assurance_level:
          type: string
          enum: [software, hardware]
          description: |
            Attestation outcome: "hardware" when the device-bound key was
            produced by Apple Secure Enclave or a TPM 2.0; "software" when
            no attestation was supplied or the configured registry runs in
            non-required mode.
        attestation_vendor:
          type: string
          description: |
            Backend that produced the attestation result (e.g.
            "apple-appattest", "tpm-2.0", or "none").
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Composite 0..100 risk score for this rotation.
        risk_level:
          type: string
          enum: [low, elevated, high]
          description: |
            Mapped from risk_score. On "high", sensitive scopes (telemetry
            ingest, bootstrap-token write, device revoke) are dropped from
            the issued access token.
    IssueBootstrapTokenRequest:
      type: object
      required: [hardware_uuid]
      properties:
        hardware_uuid:
          type: string
          minLength: 1
        tenant_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        ttl_seconds:
          type: integer
          minimum: 1
    IssueBootstrapTokenResponse:
      type: object
      required: [token_id, token, expires_at]
      properties:
        token_id:
          type: string
        token:
          type: string
          description: Plaintext bootstrap token; returned once and never persisted in clear.
        expires_at:
          type: string
          format: date-time
    RevokeDeviceRequest:
      type: object
      properties:
        reason:
          type: string
    GRCAskRequest:
      type: object
      required: [tenant_id, question]
      properties:
        tenant_id:
          type: string
        question:
          type: string
          minLength: 1
          maxLength: 4096
        scope_urn:
          type: string
        model:
          type: string
          default: claude-sonnet-4-6
        history:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
    PutSourceRuntimeRequest:
      type: object
      required: [runtime]
      properties:
        runtime:
          type: object
          required: [id, sourceId, tenantId]
          properties:
            id:
              type: string
            sourceId:
              type: string
            tenantId:
              type: string
            config:
              type: object
              additionalProperties:
                type: string
    FindingEvaluationRun:
      type: object
      properties:
        id:
          type: string
        runtime_id:
          type: string
        rule_id:
          type: string
        status:
          type: string
        event_limit:
          type: integer
          minimum: 0
        events_evaluated:
          type: integer
          minimum: 0
        events_processed:
          type: integer
          minimum: 0
        events_matched:
          type: integer
          minimum: 0
        findings_upserted:
          type: integer
          minimum: 0
        findings_emitted:
          type: integer
          minimum: 0
        finding_ids:
          type: array
          items:
            type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          type: string
    Finding:
      type: object
      properties:
        id:
          type: string
        fingerprint:
          type: string
        tenant_id:
          type: string
        runtime_id:
          type: string
        rule_id:
          type: string
        title:
          type: string
        severity:
          type: string
        status:
          type: string
          enum: [FINDING_STATUS_OPEN, FINDING_STATUS_RESOLVED, FINDING_STATUS_SUPPRESSED]
        summary:
          type: string
        resource_urns:
          type: array
          items:
            type: string
        event_ids:
          type: array
          items:
            type: string
        observed_policy_ids:
          type: array
          items:
            type: string
        policy_id:
          type: string
        policy_name:
          type: string
        check_id:
          type: string
        check_name:
          type: string
        control_refs:
          type: array
          items:
            type: object
            properties:
              framework_name:
                type: string
              control_id:
                type: string
        notes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              body:
                type: string
              created_at:
                type: string
                format: date-time
        tickets:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              name:
                type: string
              external_id:
                type: string
              linked_at:
                type: string
                format: date-time
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        likelihood_score:
          type: integer
          minimum: 0
          maximum: 100
        impact_score:
          type: integer
          minimum: 0
          maximum: 100
        confidence_score:
          type: integer
          minimum: 0
          maximum: 100
        likelihood_level:
          type: string
        impact_level:
          type: string
        risk_reasons:
          type: array
          items:
            type: string
        risk_model_version:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        assignee:
          type: string
        status_reason:
          type: string
        status_updated_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        first_observed_at:
          type: string
          format: date-time
        last_observed_at:
          type: string
          format: date-time
    FindingEvidence:
      type: object
