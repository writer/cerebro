        runtime_id:
          type: string
        rule_id:
          type: string
        finding_id:
          type: string
        run_id:
          type: string
        run_ids:
          type: array
          items:
            type: string
        claim_ids:
          type: array
          items:
            type: string
        event_ids:
          type: array
          items:
            type: string
        graph_root_urns:
          type: array
          items:
            type: string
        graph_path_urns:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_observed_at:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties:
            type: string
        graph_rows:
          type: array
          items:
            $ref: '#/components/schemas/GraphEvidenceRow'
        observation_count:
          type: integer
          minimum: 0
        observations:
          type: array
          items:
            $ref: '#/components/schemas/FindingEvidenceObservation'
    EndpointVulnerabilityFindingsResponse:
      type: object
      properties:
        tenant_id:
          type: string
        device:
          $ref: '#/components/schemas/EndpointIdentity'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/EndpointVulnerabilityFinding'
    EndpointIdentity:
      type: object
      properties:
        device_id:
          type: string
        serial_number:
          type: string
        agent_id:
          type: string
    EndpointVulnerabilityFinding:
      type: object
      properties:
        id:
          type: string
        finding_ids:
          type: array
          items:
            type: string
        title:
          type: string
        status:
          type: string
        severity:
          type: string
        vulnerability_id:
          type: string
        aliases:
          type: array
          items:
            type: string
        package:
          $ref: '#/components/schemas/EndpointVulnerabilityPackage'
        kev:
          $ref: '#/components/schemas/EndpointVulnerabilityKEV'
        epss:
          $ref: '#/components/schemas/EndpointVulnerabilityEPSS'
        remediation:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/EndpointVulnerabilityEvidence'
