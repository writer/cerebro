openapi: 3.1.0
info:
  title: Cerebro Bootstrap API
  version: v1
  description: Current Writer/Cerebro bootstrap HTTP API. The Connect RPC contract is defined in proto/cerebro/v1/bootstrap.proto.
  contact:
    name: Writer Security
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: Devices
  - name: Findings
  - name: GRC
  - name: Graph
  - name: Health
  - name: Knowledge
  - name: MCP
  - name: OAuth
  - name: Platform
  - name: Reports
  - name: Connectors
  - name: Sources
  - name: Telemetry
  - name: Workflow
paths:
  /health:
    get:
      summary: Readiness check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is ready and configured dependencies are healthy.
        '503':
          description: Service is live but one or more configured dependencies are degraded.
  /healthz:
    get:
      summary: Liveness check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service process is live.
  /livez:
    get:
      summary: Liveness check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service process is live.
  /openapi.yaml:
    get:
      summary: Current OpenAPI contract
      tags:
        - Platform
      security: []
      responses:
        '200':
          description: Embedded OpenAPI YAML.
  /.well-known/agent-card.json:
    get:
      operationId: getA2AAgentCard
      summary: Get public A2A Agent Card
      tags:
        - Platform
      security: []
      responses:
        '200':
          description: Public Agent2Agent discovery document with supported interfaces, skills, authentication, and capability metadata.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AAgentCard'
  /.well-known/agent.json:
    get:
      operationId: getLegacyA2AAgentCard
      summary: Get legacy A2A Agent Card alias
      tags:
        - Platform
      security: []
      responses:
        '200':
          description: Compatibility alias for clients that still discover A2A metadata from /.well-known/agent.json.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AAgentCard'
  /api/v1/a2a:
    post:
      operationId: callA2AJSONRPC
      summary: Call the authenticated A2A JSON-RPC contract and work endpoint
      tags:
        - Platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2AJSONRPCRequest'
      responses:
        '200':
          description: JSON-RPC response. SendMessage returns contract discovery by default and can create durable agent-evidence-packet tasks; GetTask and ListTasks read tenant-scoped A2A task records. Streaming, cancellation, and push methods return A2A UnsupportedOperationError until backed by replayable runtime adapters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AJSONRPCResponse'
        '400':
          description: Malformed JSON-RPC request body.
  /api/v1/agent-platform/contract:
    get:
      operationId: getAgentPlatformContract
      summary: Get agent platform contract
      tags:
        - Platform
      responses:
        '200':
          description: Cerebro agent platform domains, capabilities, runtime events, connector infrastructure, and provenance requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlatformContract'
  /api/v1/agent-platform/capabilities:
    get:
      operationId: listAgentPlatformCapabilities
      summary: List governed agent platform capabilities
      tags:
        - Platform
      parameters:
        - name: domain_id
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
        - name: owner
          in: query
          schema:
            type: string
        - name: risk
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: default_on
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Filtered capability registry with operational totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlatformCapabilityRegistry'
        '400':
          description: Invalid capability filter.
  /api/v1/agent-platform/capability-decisions:
    post:
      operationId: decideAgentPlatformCapability
      summary: Decide whether an agent platform capability is selectable
      tags:
        - Platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPlatformCapabilityDecisionRequest'
      responses:
        '200':
          description: Capability selection decision with scopes, eval, connector, runtime event, and provenance gates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlatformCapabilityDecision'
        '400':
          description: Invalid capability decision request.
        '404':
          description: Capability was not found.
  /api/v1/agent-platform/preflight:
    post:
      operationId: preflightAgentPlatformRun
      summary: Resolve agent run preconditions
      tags:
        - Platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPlatformPreflightRequest'
      responses:
        '200':
          description: Tenant-scoped capability, graph, connector, policy, and write-back preflight envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlatformPreflight'
        '400':
          description: Invalid preflight request.
        '403':
          description: Tenant or graph scope is not allowed.
  /api/v1/agent-platform/security-control-plane:
    get:
      operationId: getAgentPlatformSecurityControlPlane
      summary: Get security agent control plane
      tags:
        - Platform
      responses:
        '200':
          description: Security-agent evidence, verifier, role, action, eval, memory, connector, and simulation contracts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlatformSecurityControlPlane'
  /api/v1/event-subscriptions/contract:
    get:
      operationId: getEventSubscriptionContract
      summary: Get outbound event subscription contract
      tags:
        - Platform
      responses:
        '200':
          description: Supported outbound webhook event types, delivery headers, signing, retry, dead-letter, and idempotency semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionContract'
  /api/v1/idempotency-contract:
    get:
      operationId: getIdempotencyContract
      summary: Get public idempotency contract
      tags:
        - Platform
      responses:
        '200':
          description: Public Idempotency-Key semantics for retry-safe mutating requests and outbound webhook deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyContract'
  /api/v1/agent-platform/evidence-packets:
    post:
      operationId: buildAgentPlatformEvidencePacket
      summary: Build a security agent evidence packet
      tags:
        - Platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPlatformEvidencePacketRequest'
      responses:
        '200':
          description: Tenant-scoped evidence packet with preflight, recommended agent profiles, verifier results, action stages, memory, connector gates, and simulation plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlatformEvidencePacket'
        '400':
          description: Invalid evidence packet request.
        '403':
          description: Tenant or graph scope is not allowed.
  /api/v1/agent-platform/graph/reason:
    post:
      operationId: reasonOverAgentPlatformGraph
      summary: Reason over the graph for an agent
      tags:
        - Platform
        - Graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPlatformGraphReasonRequest'
      responses:
        '200':
          description: Structured graph reasoning envelope with query plan, validation, rows, graph context, citations, and provenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlatformGraphReasonResponse'
        '400':
          description: Invalid graph reasoning request.
        '403':
          description: Tenant or scope is not allowed.
        '503':
          description: Graph or LLM runtime unavailable.
  /api/v1/mcp:
    get:
      summary: Reject MCP stateful event-stream transport
      tags:
        - MCP
      responses:
        '405':
          description: Cerebro's MCP route is stateless Streamable HTTP over POST only; GET is not an SSE endpoint.
    post:
      summary: Invoke MCP JSON-RPC method
      tags:
        - MCP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: MCP JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '202':
          description: Accepted MCP notification or client message with no response body.
        '400':
          description: Unsupported or invalid MCP protocol version.
        '401':
          description: Authentication is required.
        '403':
          description: Request origin or authorization scope is not allowed.
  /sources:
    get:
      summary: List registered sources
      tags:
        - Sources
      responses:
        '200':
          description: Source catalog.
  /sources/{sourceID}/check:
    get:
      summary: Check source configuration
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
      responses:
        '200':
          description: Source check result.
  /sources/{sourceID}/discover:
    get:
      summary: Discover source URNs
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
      responses:
        '200':
          description: Discovery result.
  /sources/{sourceID}/read:
    get:
      summary: Read one source preview page
      tags:
        - Sources
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Source events and cursor.
  /connectors:
    get:
      summary: List connector library entries
      tags:
        - Connectors
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Connector catalog with executable built-in sources plus catalog-only connector definitions. Entries include runtime counts, credential capability state, catalog status (catalog_ready, generateable, needs_auth_extension, needs_bespoke_runtime), classifier output, auth model, verification endpoint, resource families, backend-advertised connection methods when executable, credential-store choices, deployment/readiness guidance, product groups, region guidance, and source resource scope options including support notes for resource scoping.
  /connectors/{sourceID}:
    get:
      summary: Get connector operations summary
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: tenant_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Connector catalog entry with catalog status and classifier metadata, plus runtime health summary, setup guidance, safe connection summaries with typed scope policies, resource scope support notes, and recent activity for executable sources. Catalog-only definitions return empty runtime health/activity until generated or promoted into a Source Runtime SDK source.
        '404':
          description: Connector source was not found.
  /connectors/{sourceID}/activity:
    get:
      summary: List connector activity
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Safe sync and graph activity derived from connector runtime health.
        '404':
          description: Connector source was not found.
  /connectors/{sourceID}/credentials:
    get:
      summary: List connector credential metadata
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: runtime_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - valid
              - invalid
              - revoked
              - rotating
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000
      responses:
        '200':
          description: Credential metadata for a tenant/source/runtime. Plaintext credentials and sealed blobs are never returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - source_id
                  - tenant_id
                  - credentials
                properties:
                  source_id:
                    type: string
                  tenant_id:
                    type: string
                  runtime_id:
                    type: string
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConnectorCredential'
        '400':
          description: Tenant or query filter was invalid.
        '403':
          description: Caller is not allowed to inspect credentials for the requested tenant.
        '404':
          description: Connector source was not found.
        '503':
          description: Connector credential vault is unavailable.
    post:
      summary: Broker connector credentials
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - runtime_id
                - encrypted_credentials
              properties:
                runtime_id:
                  type: string
                  description: Runtime namespace the credential references will be bound to.
                tenant_id:
                  type: string
                  description: Tenant namespace for the credential. May be omitted when the caller is already tenant-scoped by auth context.
                credential_store_id:
                  type: string
                  description: Credential store selected for encrypted browser submission.
                  default: cerebro_vault
                  enum:
                    - cerebro_vault
                idempotency_key:
                  type: string
                  description: Optional caller-supplied key used to safely retry one credential submission for the same tenant, source, and runtime.
                encrypted_credentials:
                  type: object
                  description: Browser-encrypted credential fields. The backend unwraps this payload, seals it in the connector vault, and returns only credential references.
                  required:
                    - key_id
                    - algorithm
                    - wrapped_key
                    - nonce
                    - ciphertext
                  properties:
                    key_id:
                      type: string
                    algorithm:
                      type: string
                      enum:
                        - RSA-OAEP-256+A256GCM
                    wrapped_key:
                      type: string
                    nonce:
                      type: string
                    ciphertext:
                      type: string
      responses:
        '201':
          description: Credential sealed in the connector vault with metadata and non-secret field references. The response never includes plaintext credential values or sealed secret blobs.
          content:
            application/json:
              schema:
                type: object
                required:
                  - source_id
                  - tenant_id
                  - runtime_id
                  - status
                  - credential
                  - credential_references
                properties:
                  source_id:
                    type: string
                  tenant_id:
                    type: string
                  runtime_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - stored
                      - existing
                  credential:
                    $ref: '#/components/schemas/ConnectorCredential'
                  credential_references:
                    type: object
                    description: Field-to-reference map that can be passed as connector credential_references without exposing the underlying secret.
                    additionalProperties:
                      type: string
        '200':
          description: Existing credential metadata and references returned for a replayed idempotent request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorCredentialBrokerResponse'
        '400':
          description: Request shape, credential payload context, or credential fields were invalid.
        '403':
          description: Caller is not allowed to write credentials for the requested tenant or runtime.
        '404':
          description: Connector source was not found.
        '503':
          description: Connector credential transport or vault is unavailable.
  /connectors/{sourceID}/credentials/{credentialID}:
    get:
      summary: Get connector credential metadata
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: credentialID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential metadata and recent broker audit events. Plaintext credentials and sealed blobs are never returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - source_id
                  - credential
                properties:
                  source_id:
                    type: string
                  credential:
                    $ref: '#/components/schemas/ConnectorCredential'
                  audit:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConnectorCredentialAuditEvent'
        '403':
          description: Caller is not allowed to inspect credentials for the credential tenant.
        '404':
          description: Connector source or credential was not found.
        '503':
          description: Connector credential vault is unavailable.
  /connectors/{sourceID}/credentials/{credentialID}/rotate:
    post:
      summary: Rotate connector credential
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: credentialID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - encrypted_credentials
              properties:
                tenant_id:
                  type: string
                runtime_id:
                  type: string
                credential_store_id:
                  type: string
                  default: cerebro_vault
                  enum:
                    - cerebro_vault
                idempotency_key:
                  type: string
                revoke_previous:
                  type: boolean
                  description: When true, revokes the previous credential after the replacement is sealed.
                encrypted_credentials:
                  $ref: '#/components/schemas/EncryptedConnectorCredentialPayload'
      responses:
        '201':
          description: Replacement credential sealed and linked to the previous credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorCredentialBrokerResponse'
        '200':
          description: Existing replacement credential returned for a replayed idempotent request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorCredentialBrokerResponse'
        '400':
          description: Request shape, credential payload context, or credential fields were invalid.
        '403':
          description: Caller is not allowed to rotate credentials for the credential tenant.
        '404':
          description: Connector source or credential was not found.
        '503':
          description: Connector credential transport or vault is unavailable.
  /connectors/{sourceID}/credentials/{credentialID}/revoke:
    post:
      summary: Revoke connector credential
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
        - name: credentialID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Credential marked revoked. Runtime resolution rejects future use of this credential reference.
          content:
            application/json:
              schema:
                type: object
                required:
                  - source_id
                  - credential
                properties:
                  source_id:
                    type: string
                  credential:
                    $ref: '#/components/schemas/ConnectorCredential'
        '400':
          description: Request shape was invalid.
        '403':
          description: Caller is not allowed to revoke credentials for the credential tenant.
        '404':
          description: Connector source or credential was not found.
        '503':
          description: Connector credential vault is unavailable.
  /connectors/credential-key:
    get:
      summary: Get connector credential transit key
      tags:
        - Connectors
      responses:
        '200':
          description: Public RSA-OAEP key metadata used to encrypt connector credentials before submission.
  /connector-definitions:
    get:
      summary: List dynamic connector definitions
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - name: stage
          in: query
          schema:
            type: string
            enum: [draft, sandbox, pilot, approved, certified]
        - $ref: '#/components/parameters/limitQuery'
      responses:
        '200':
          description: Tenant-local dynamic connector definitions stored as versioned declarative manifests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionListResponse'
    post:
      summary: Create or update a dynamic connector definition
      tags:
        - Connectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorDefinition'
      responses:
        '200':
          description: Stored connector definition with validation and promotion gates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionResponse'
  /connector-definitions/validate:
    post:
      summary: Validate a dynamic connector definition without persisting it
      tags:
        - Connectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorDefinition'
      responses:
        '200':
          description: Definition readiness checks and next promotion gates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionValidationResponse'
  /connector-definitions/plan:
    post:
      summary: Build a Source CDK promotion plan without persisting it
      tags:
        - Connectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorDefinitionPlanRequest'
      responses:
        '200':
          description: Checklist, blockers, and dry-run scaffold for Source CDK promotion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionPlanResponse'
  /connector-definitions/{definitionID}:
    get:
      summary: Get a dynamic connector definition
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/definitionID'
      responses:
        '200':
          description: Stored connector definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionResponse'
        '404':
          description: Connector definition was not found.
    put:
      summary: Replace a dynamic connector definition
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/definitionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorDefinition'
      responses:
        '200':
          description: Updated connector definition current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionResponse'
  /connector-definitions/{definitionID}/promotion-plan:
    get:
      summary: Get a Source CDK promotion plan for a stored connector definition
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/definitionID'
      responses:
        '200':
          description: Checklist, blockers, and dry-run scaffold for Source CDK promotion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionPlanResponse'
        '404':
          description: Connector definition was not found.
  /connector-definitions/{definitionID}/promote:
    post:
      summary: Promote a dynamic connector definition lifecycle stage
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/definitionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_stage:
                  type: string
                  enum: [sandbox, pilot, approved, certified]
                reason:
                  type: string
      responses:
        '200':
          description: Promotion result with the updated definition when gates pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionPromotionResponse'
  /connectors/{sourceID}/preflight:
    post:
      summary: Preflight a connector runtime without persisting it
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - runtime_id
                - tenant_id
              properties:
                runtime_id:
                  type: string
                tenant_id:
                  type: string
                auth_method:
                  type: string
                  enum:
                    - encrypted_submission
                    - aws_sso_profile
                    - infisical_cli
                    - environment_managed
                    - external_reference
                credential_store_id:
                  type: string
                  enum:
                    - cerebro_vault
                    - environment_managed
                    - infisical
                    - google_secret_manager
                    - aws_secrets_manager
                    - azure_key_vault
                    - hashicorp_vault
                config:
                  type: object
                  additionalProperties:
                    type: string
                credential_references:
                  type: object
                  description: Non-secret credential references for environment-managed or external-reference methods.
                  additionalProperties:
                    type: string
                scope_policy:
                  type: object
                  description: Non-secret connector scope policy previewed before source validation.
                encrypted_credentials:
                  type: object
                  description: Required only when auth_method is encrypted_submission. The response never returns secret values.
      responses:
        '200':
          description: Provider-neutral readiness checks, credential-boundary summary, non-secret field-level reference templates, and source-time resource scope preview. Status is ready, warning, or blocked; blocked preflight checks are returned as data without persisting credentials or runtimes.
  /connectors/{sourceID}/connections:
    post:
      summary: Create a credentialed connector runtime
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - runtime_id
                - tenant_id
              properties:
                runtime_id:
                  type: string
                tenant_id:
                  type: string
                check_only:
                  type: boolean
                  description: Validate the connector configuration and selected credential path without persisting a runtime or storing credentials.
                  default: false
                auth_method:
                  type: string
                  description: Backend-advertised connection method selected from /connectors connection_methods metadata. Method metadata can include prerequisites, setup steps, command snippets, product groups, deployment guides, region guidance, and security notes; clients must treat these as user-facing setup guidance and still submit only this closed-set id.
                  default: encrypted_submission
                  enum:
                    - encrypted_submission
                    - aws_sso_profile
                    - infisical_cli
                    - environment_managed
                    - external_reference
                credential_store_id:
                  type: string
                  description: Closed credential-store identifier selected from /connectors credential_stores metadata.
                  default: cerebro_vault
                  enum:
                    - cerebro_vault
                    - environment_managed
                    - infisical
                    - google_secret_manager
                    - aws_secrets_manager
                    - azure_key_vault
                    - hashicorp_vault
                config:
                  type: object
                  additionalProperties:
                    type: string
                credential_references:
                  type: object
                  description: Non-secret credential references for environment-managed or external-reference methods. Values must use prefixes advertised by /connectors credential_stores metadata or generated by preflight credential_boundary.reference_templates, such as env:CEREBRO_SOURCE_<SOURCE>_<FIELD> or scoped AWS Secrets Manager references like aws-sm:us-east-1:cerebro/<tenant>/<source>/<runtime>/credentials#<field>. The browser must never submit plaintext secret values for reference-backed methods.
                  additionalProperties:
                    type: string
                scope_policy:
                  type: object
                  description: Non-secret connector scope policy. Excluded families are short-circuited before source reads; exact resources are filtered before downstream projection when the runtime can identify them.
                  properties:
                    mode:
                      type: string
                      enum:
                        - exclude
                    excluded_families:
                      type: array
                      items:
                        type: string
                    excluded_asset_classes:
                      type: array
                      items:
                        type: string
                    excluded_kinds:
                      type: array
                      items:
                        type: string
                    excluded_resource_urns:
                      type: array
                      items:
                        type: string
                    excluded_resources:
                      type: array
                      items:
                        type: object
                        properties:
                          urn:
                            type: string
                          type:
                            type: string
                          id:
                            type: string
                          reason:
                            type: string
                encrypted_credentials:
                  type: object
                  description: Required only when auth_method is encrypted_submission.
                  required:
                    - key_id
                    - algorithm
                    - wrapped_key
                    - nonce
                    - ciphertext
                  properties:
                    key_id:
                      type: string
                    algorithm:
                      type: string
                      enum:
                        - RSA-OAEP-256+A256GCM
                    wrapped_key:
                      type: string
                    nonce:
                      type: string
                    ciphertext:
                      type: string
      responses:
        '200':
          description: Stored runtime with sensitive config redacted, credential metadata, and the applied typed scope policy when provided.
