          description: Stored preferences for the authenticated user after normalization.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant_id
                  - user_id
                  - preferences
                  - persisted
                properties:
                  tenant_id:
                    type: string
                  user_id:
                    type: string
                  preferences:
                    type: object
                    additionalProperties: true
                  persisted:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          description: Authenticated user identity is required.

