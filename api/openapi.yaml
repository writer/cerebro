    DeviceEnrollRequest:
      type: object
      required: [bootstrap_token, hardware_uuid]
      properties:
        bootstrap_token:
          type: string
          minLength: 1
        hardware_uuid:
          type: string
          minLength: 1
        serial_number:
          type: string
        hostname:
          type: string
        os_type:
          type: string
        os_version:
          type: string
        agent_version:
          type: string
        attestation:
          type: string
          description: |
            Base64-encoded device-bound attestation statement. On macOS this is
            an Apple App Attest CBOR attestationObject; on Windows a TPM 2.0
            quote bundle (JSON envelope with ek_chain, ak_pub_der, quote, signature, alg).
            Required when CEREBRO_DEVICE_AUTH_ATTESTATION_REQUIRED=true; if
            present and verified, the server binds a DPoP key (RFC 9449) to
            subsequent refresh-token rotations and the response includes
            assurance_level=hardware.
        device_key:
          type: object
          additionalProperties: true
          description: |
            Agent-supplied public JWK used to bind the device's access and
            refresh tokens to RFC 9449 DPoP proofs when attestation does not
            provide a public key. Required unless verified attestation or an
            existing active device record supplies the binding. Allowed keys:
            EC P-256, EC P-384, or OKP Ed25519. RSA is rejected.
    DeviceTokenRequest:
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
          minLength: 1
    DeviceTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scopes]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until access_token expires.
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
        device_id:
          type: string
        assurance_level:
          type: string
          enum: [software, hardware]
          description: |
            Attestation outcome: "hardware" when the device-bound key was
            produced by Apple Secure Enclave or a TPM 2.0; "software" when
            no attestation was supplied or the configured registry runs in
            non-required mode.
        attestation_vendor:
          type: string
          description: |
            Backend that produced the attestation result (e.g.
            "apple-appattest", "tpm-2.0", or "none").
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Composite 0..100 risk score for this rotation.
        risk_level:
          type: string
          enum: [low, elevated, high]
          description: |
            Mapped from risk_score. On "high", sensitive scopes (telemetry
            ingest, bootstrap-token write, device revoke) are dropped from
            the issued access token.
    IssueBootstrapTokenRequest:
      type: object
      required: [hardware_uuid]
      properties:
        hardware_uuid:
          type: string
          minLength: 1
        tenant_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        ttl_seconds:
          type: integer
          minimum: 0
          description: Optional override in seconds. Omit or set 0 to use the configured default TTL.
    IssueBootstrapTokenResponse:
      type: object
      required: [token_id, token, expires_at]
      properties:
        token_id:
          type: string
        token:
          type: string
          description: Plaintext bootstrap token; returned once and never persisted in clear.
        expires_at:
          type: string
          format: date-time
