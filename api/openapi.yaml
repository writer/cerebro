  /platform/devices/enroll:
    post:
      summary: Enroll a SeCheck agent
      description: |
        Consumes a single-use bootstrap token and provisions a device
        identity. The bootstrap token is delivered out-of-band by MDM and
        is bound to the device's hardware_uuid. Enrollment must bind a
        DPoP key through verified attestation, an agent-supplied
        `device_key`, or an existing active device binding before the
        service returns a short-lived access token (EdDSA JWT) and
        single-use refresh token. Replay of an already-consumed bootstrap
        token returns 401.
      tags:
        - Devices
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnrollRequest'
      responses:
        '200':
          description: Enrollment succeeded; access + refresh pair returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          description: Malformed request body.
        '401':
          description: Bootstrap token invalid, expired, already consumed, or hardware-uuid mismatch.
        '429':
          description: Per-IP enrollment rate limit exceeded.
  /platform/devices/token:
    post:
      summary: Rotate a device refresh token
      description: |
        Exchanges a refresh token for a new access + refresh pair. The
        previous refresh token is consumed atomically. Replaying a
        consumed refresh token revokes the entire token family per RFC 6819
        §5.2.2.3.

        The request MUST carry an RFC 9449 DPoP proof JWT in the `DPoP`
        header signed by the device's bound key, with `htm` matching the
        request method, `htu` matching the canonical request URL, a unique
        `jti`, and a fresh `iat`. The proof's JWK SHA-256 thumbprint
        (RFC 7638) must equal the device's stored `dpop_jkt`; devices
        without a stored binding are rejected and must re-enroll.
      tags:
        - Devices
      security: []
      parameters:
        - in: header
          name: DPoP
          required: true
          schema:
            type: string
          description: |
            RFC 9449 DPoP proof JWT signed by the enrolled device key.
            Algorithms: ES256, ES384, EdDSA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Rotation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          description: Unsupported grant_type.
        '401':
          description: |
            Refresh token unknown, expired, or replayed (family revoked); or
            DPoP proof is missing (`dpop_required`), malformed
            (`dpop_malformed`), or invalid -- bad signature, replayed jti,
            expired iat, htm/htu mismatch, or jkt mismatch (`dpop_invalid`).
        '429':
          description: Per-device token rate limit exceeded.
  /platform/devices/bootstrap-tokens:
    post:
      summary: Issue a single-use bootstrap token (operator-only)
      description: |
        Mints a single-use enrollment credential bound to a hardware_uuid
        for one tenant. Requires the platform.devices.bootstrap_tokens.write
        scope. The plaintext token is returned exactly once; only its
        SHA-256 digest is persisted.
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBootstrapTokenRequest'
      responses:
        '201':
          description: Bootstrap token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBootstrapTokenResponse'
        '400':
          description: Malformed request body.
        '403':
          description: Caller lacks the platform.devices.bootstrap_tokens.write scope.
  /platform/devices/{deviceID}/revoke:
    post:
      summary: Revoke a device (operator-only)
      description: |
        Marks the device revoked. Subsequent refresh attempts fail with
        403; access tokens already issued expire on their own at the
        configured access TTL.
      tags:
        - Devices
      parameters:
        - name: deviceID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDeviceRequest'
      responses:
        '200':
          description: Revocation succeeded.
        '403':
          description: Caller lacks the platform.devices.revoke scope.
        '404':
          description: Device not found.
  /platform/telemetry/ingest:
    post:
      summary: Ingest device telemetry (device-only)
      description: |
        Accepts a telemetry batch from an enrolled SeCheck agent. Requires
        a device JWT carrying the platform.telemetry.ingest scope and a
        non-empty Idempotency-Key request header. When the JWT contains a
        `cnf.jkt` confirmation claim, the request MUST also carry an RFC
        9449 DPoP proof JWT in the `DPoP` header. A retried submission with
        the same key + body is replayed without side effects; same key with
        a different body returns 409 (RFC 5789-inspired idempotency
        contract).
      tags:
        - Telemetry
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
        - in: header
          name: DPoP
          required: false
          schema:
            type: string
          description: |
            RFC 9449 DPoP proof JWT. Required when the bearer device JWT
            contains a `cnf.jkt` confirmation claim. Algorithms: ES256,
            ES384, EdDSA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Telemetry accepted.
        '400':
          description: Missing Idempotency-Key or malformed body.
        '401':
          description: |
            Bearer token is missing, malformed, expired, or invalid; or DPoP
            proof is missing (`dpop_required`), malformed
            (`dpop_malformed`), or invalid -- bad signature, replayed jti,
            expired iat, htm/htu mismatch, ath mismatch, or jkt mismatch
            (`dpop_invalid`).
        '403':
          description: Caller is not a device principal.
        '409':
          description: Idempotency-Key reused with a different body.
        '413':
          description: Body exceeds 1 MiB.
  /.well-known/device-jwks.json:
    get:
      summary: Device-JWT verification keys
      description: |
        Publishes the active and retiring Ed25519 verification keys as a
        JWK Set (RFC 7517 §4 + RFC 8037). Cache headers permit short-term
        caching by downstream verifiers.
      tags:
        - Devices
      security: []
      responses:
        '200':
          description: JWK Set document.
  /.well-known/oauth-authorization-server:
    get:
      summary: OAuth authorization server metadata
      description: Publishes Cerebro's OAuth 2.1 authorization-server metadata for MCP clients.
      tags:
        - OAuth
      security: []
      responses:
        '200':
          description: Authorization server metadata document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /.well-known/oauth-protected-resource:
    get:
      summary: OAuth protected resource metadata
      description: Publishes OAuth protected-resource metadata for the Cerebro MCP resource.
      tags:
        - OAuth
      security: []
      responses:
        '200':
          description: Protected resource metadata document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /.well-known/oauth-protected-resource/api/v1/mcp:
    get:
      summary: OAuth protected resource metadata for MCP
      description: Path-specific OAuth protected-resource metadata for `/api/v1/mcp`.
      tags:
        - OAuth
      security: []
      responses:
        '200':
          description: Protected resource metadata document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /oauth/authorize:
    get:
      summary: Start MCP OAuth authorization
      description: Validates the downstream MCP OAuth request and redirects the human to upstream Writer SSO/OIDC.
      tags:
        - OAuth
      security: []
      parameters:
        - name: response_type
          in: query
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          schema:
            type: string
        - name: redirect_uri
          in: query
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
        - name: code_challenge_method
          in: query
          schema:
            type: string
            enum: [S256]
        - name: resource
          in: query
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to upstream Writer SSO/OIDC.
        '400':
          description: Invalid OAuth authorization request.
  /oauth/callback:
    get:
      summary: Complete upstream Writer SSO/OIDC callback
      description: Consumes upstream OIDC callback state and redirects the MCP client with a one-time authorization code.
      tags:
        - OAuth
      security: []
      responses:
        '302':
          description: Redirect to the registered MCP client callback with an authorization code.
        '400':
          description: Invalid or expired callback state.
        '403':
          description: Authenticated human is not authorized for MCP access.
  /oauth/token:
    post:
      summary: Exchange OAuth token grants
      description: Issues a resource-bound bearer capability token for MCP after PKCE verification, refresh-token rotation, confidential MCP client_credentials authentication, or hashed Cerebro API client_credentials authentication.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, resource]
              additionalProperties:
                type: string
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token, client_credentials]
                client_id:
                  type: string
                resource:
                  type: string
                  format: uri
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: OAuth token response.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  scope:
                    type: string
        '400':
          description: Invalid token request or grant.
        '401':
          description: Client authentication failed.
  /oauth/revoke:
    post:
      summary: Revoke an MCP OAuth refresh token
      description: Revokes the refresh-token family associated with a client-owned MCP OAuth refresh token. Access tokens remain short-lived and resource-bound.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              additionalProperties:
                type: string
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  enum: [refresh_token]
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Token revocation processed.
        '400':
          description: Invalid revocation request.
        '401':
          description: Client authentication failed.
  /oauth/register:
    post:
      summary: Dynamically register an MCP OAuth client
      description: Registers an MCP client with loopback redirect URIs for OAuth authorization-code + PKCE. Confidential dynamic clients receive a generated client secret.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                grant_types:
                  type: array
                  items:
                    type: string
                    enum: [authorization_code, refresh_token]
                response_types:
                  type: array
                  items:
                    type: string
                    enum: [code]
                token_endpoint_auth_method:
                  type: string
                  enum: [none, client_secret_basic, client_secret_post]
      responses:
        '201':
          description: Dynamic client registration response.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, redirect_uris, grant_types, response_types, token_endpoint_auth_method]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                  client_secret_expires_at:
                    type: integer
                    description: Zero means the generated dynamic client secret does not expire.
                  client_name:
                    type: string
                  redirect_uris:
                    type: array
                    items:
                      type: string
                      format: uri
                  grant_types:
                    type: array
                    items:
                      type: string
                  response_types:
                    type: array
                    items:
                      type: string
                  token_endpoint_auth_method:
                    type: string
                    enum: [none, client_secret_basic, client_secret_post]
        '400':
          description: Invalid client metadata.
        '429':
          description: Per-client-IP dynamic registration rate limit exceeded.
  /metrics:
    get:
      operationId: getMetrics
      summary: Export Prometheus-compatible metrics
      tags:
        - Platform
      responses:
        '200':
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
  /platform/jobs:
    get:
      operationId: listPlatformJobs
      summary: List platform jobs
      tags:
        - Platform
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Platform jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobListResponse'
    post:
      operationId: createPlatformJob
      summary: Create a platform job
      tags:
        - Platform
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformJobRequest'
      responses:
        '202':
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResponse'
        '200':
          description: Existing idempotent job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResponse'
  /platform/jobs/{jobID}:
    get:
      operationId: getPlatformJob
      summary: Get one platform job
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/jobID'
      responses:
        '200':
          description: Platform job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResponse'
  /platform/jobs/{jobID}/cancel:
    post:
      operationId: cancelPlatformJob
      summary: Request platform job cancellation
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/jobID'
      responses:
        '200':
          description: Cancelled or cancellation-requested job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResponse'
  /platform/jobs/{jobID}/events:
    get:
      operationId: listPlatformJobEvents
      summary: List platform job events
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/jobID'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Job event timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobEventListResponse'
  /platform/runtime-response/actions:
    post:
      operationId: executeRuntimeResponseAction
      summary: Execute a runtime response action
      tags:
        - Platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeResponseExecuteRequest'
      responses:
        '202':
          description: Runtime response action accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBlocklistEntryResponse'
        '422':
          description: Action is not supported by the configured executor surface.
  /platform/runtime-response/blocklist:
    get:
      operationId: listRuntimeBlocklist
      summary: List runtime response blocklist entries
      tags:
        - Platform
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [ip, domain]
        - name: include_revoked
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Runtime blocklist entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBlocklistListResponse'
  /platform/runtime-response/blocklist/{entryID}/revoke:
    post:
      operationId: revokeRuntimeBlocklistEntry
      summary: Revoke a runtime response blocklist entry
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/entryID'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked runtime blocklist entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBlocklistEntryResponse'
  /platform/runtime-response/capabilities:
    get:
      operationId: listRuntimeResponseCapabilities
      summary: List runtime response capability coverage
      tags:
        - Platform
      responses:
        '200':
          description: Runtime response capabilities and executor modes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResponseCapabilitiesResponse'
  /connectors/coverage:
    get:
      summary: Report connector coverage and high-value blind spots
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/tenantIDQuery'
        - name: source_id
          in: query
          schema:
            type: string
          description: Optional connector/source identifier to scope the report.
      responses:
        '200':
          description: Tenant-scoped connector coverage report with per-dimension state, summaries, and blind spots.
  /platform/graph/provenance:
    get:
      summary: Explain graph entity projection provenance
      tags:
        - Platform
      parameters:
        - name: urn
          in: query
          schema:
            type: string
          required: true
          description: Tenant-bearing Cerebro URN to explain.
      responses:
        '200':
          description: Projection provenance for one graph entity, including projection class, source/runtime identifiers, attributes, and freshness signals.
  /grc/audit-packets/{packetID}/export:
    get:
      operationId: exportGRCAuditPacket
      summary: Export a GRC audit packet
      tags:
        - GRC
      parameters:
        - name: packetID
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum:
              - markdown
              - json
          description: Optional export format. Defaults to markdown.
      responses:
        '200':
          description: Exported audit packet content.
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    sourceID:
      name: sourceID
      in: path
      required: true
      schema:
        type: string
    definitionID:
      name: definitionID
      in: path
      required: true
      schema:
        type: string
    runtimeID:
      name: runtimeID
      in: path
      required: true
      schema:
        type: string
    findingID:
      name: findingID
      in: path
      required: true
      schema:
        type: string
    candidateID:
      name: candidateID
      in: path
      required: true
      schema:
        type: string
    runID:
      name: runID
      in: path
      required: true
      schema:
        type: string
    jobID:
      name: jobID
      in: path
      required: true
      schema:
        type: string
    entryID:
      name: entryID
      in: path
      required: true
      schema:
        type: string
    evidenceID:
      name: evidenceID
      in: path
      required: true
      schema:
        type: string
    reportID:
      name: reportID
      in: path
      required: true
      schema:
        type: string
    tenantIDQuery:
      name: tenant_id
      in: query
      schema:
        type: string
    runtimeIDQuery:
      name: runtime_id
      in: query
      schema:
        type: string
    sourceIDQuery:
      name: source_id
      in: query
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
  schemas:
    A2AAgentCard:
      type: object
      required:
        - name
        - description
        - supportedInterfaces
        - provider
        - version
        - capabilities
        - defaultInputModes
        - defaultOutputModes
        - skills
      properties:
        name:
          type: string
        description:
          type: string
        supportedInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/A2AAgentInterface'
        provider:
          type: object
          required: [organization]
          properties:
            organization:
              type: string
            url:
              type: string
              format: uri
        version:
          type: string
        documentationUrl:
          type: string
          format: uri
        capabilities:
          $ref: '#/components/schemas/A2AAgentCapabilities'
        securitySchemes:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        security:
          type: array
          items:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
        defaultInputModes:
          type: array
          items:
            type: string
        defaultOutputModes:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/A2AAgentSkill'
    A2AAgentInterface:
      type: object
      required:
        - url
        - protocolBinding
        - protocolVersion
      properties:
        url:
          type: string
          format: uri
        protocolBinding:
          type: string
        protocolVersion:
          type: string
    A2AAgentCapabilities:
      type: object
      required:
        - streaming
        - pushNotifications
        - stateTransitionHistory
        - extendedAgentCard
      properties:
        streaming:
          type: boolean
        pushNotifications:
          type: boolean
        stateTransitionHistory:
          type: boolean
        extendedAgentCard:
          type: boolean
        extensions:
          type: array
          items:
            type: object
            required: [uri, description, required]
            properties:
              uri:
                type: string
                format: uri
              description:
                type: string
              required:
                type: boolean
    A2AAgentSkill:
      type: object
      required:
        - id
        - name
        - description
        - tags
        - inputModes
        - outputModes
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        inputModes:
          type: array
          items:
            type: string
        outputModes:
          type: array
          items:
            type: string
    A2AJSONRPCRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        method:
          type: string
          enum:
            - SendMessage
            - ListTasks
            - GetTask
            - SendStreamingMessage
            - CancelTask
            - SubscribeToTask
            - CreateTaskPushNotificationConfig
            - GetTaskPushNotificationConfig
            - ListTaskPushNotificationConfigs
            - DeleteTaskPushNotificationConfig
            - GetExtendedAgentCard
        params:
          type: object
          additionalProperties: true
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
    A2AJSONRPCResponse:
      type: object
      required:
        - jsonrpc
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/A2AJSONRPCError'
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
    A2AJSONRPCError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    A2AProtocolContract:
      type: object
      required:
        - protocol_version
        - discovery_paths
        - jsonrpc_path
        - supported_methods
        - unsupported_methods
        - authentication
        - controls
      properties:
        protocol_version:
          type: string
        discovery_paths:
          type: array
          items:
            type: string
        jsonrpc_path:
          type: string
        supported_methods:
          type: array
          items:
            type: string
        unsupported_methods:
          type: array
          items:
            type: string
        authentication:
          type: array
          items:
            type: string
        controls:
          type: array
          items:
            type: string
    EventSubscriptionContract:
      type: object
      required:
        - version
        - resource
        - summary
        - event_types
        - delivery
        - signing
        - retry
        - idempotency
        - required_controls
      properties:
        version:
          type: string
        resource:
          type: string
        summary:
          type: string
        event_types:
          type: array
          items:
            type: object
            required: [name, family, description, payload_fields]
            properties:
              name:
                type: string
              family:
                type: string
              description:
                type: string
              payload_fields:
                type: array
                items:
                  type: string
        delivery:
          type: object
          additionalProperties: true
        signing:
          type: object
          additionalProperties: true
        retry:
          type: object
          additionalProperties: true
        idempotency:
          $ref: '#/components/schemas/IdempotencyContract'
        required_controls:
          type: array
          items:
            type: string
    IdempotencyContract:
      type: object
      required:
        - version
        - header
        - max_length_bytes
        - key_scope
        - conflict_status
        - replay_headers
        - semantics
        - routes
      properties:
        version:
          type: string
        header:
          type: string
          enum:
            - Idempotency-Key
        max_length_bytes:
          type: integer
