              properties:
                runtime_id:
                  type: string
                tenant_id:
                  type: string
                auth_method:
                  type: string
                  enum:
                    - encrypted_submission
                    - aws_sso_profile
                    - infisical_cli
                    - environment_managed
                    - external_reference
                credential_store_id:
                  type: string
                  enum:
                    - cerebro_vault
                    - environment_managed
                    - infisical
                    - google_secret_manager
                    - aws_secrets_manager
                    - azure_key_vault
                    - hashicorp_vault
                config:
                  type: object
                  additionalProperties:
                    type: string
                credential_references:
                  type: object
                  description: Non-secret credential references for environment-managed or external-reference methods.
                  additionalProperties:
                    type: string
                scope_policy:
                  type: object
                  description: Non-secret connector scope policy previewed before source validation.
                encrypted_credentials:
                  type: object
                  description: Required only when auth_method is encrypted_submission. The response never returns secret values.
      responses:
        '200':
          description: Provider-neutral readiness checks, credential-boundary summary, non-secret field-level reference templates, and source-time resource scope preview. Status is ready, warning, or blocked; blocked preflight checks are returned as data without persisting credentials or runtimes.
  /connectors/{sourceID}/connections:
    post:
      summary: Create a credentialed connector runtime
      tags:
        - Connectors
      parameters:
        - $ref: '#/components/parameters/sourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - runtime_id
                - tenant_id
              properties:
                runtime_id:
                  type: string
                tenant_id:
                  type: string
                check_only:
                  type: boolean
                  description: Validate the connector configuration and selected credential path without persisting a runtime or storing credentials.
                  default: false
                auth_method:
                  type: string
                  description: Backend-advertised connection method selected from /connectors connection_methods metadata. Method metadata can include prerequisites, setup steps, command snippets, product groups, deployment guides, region guidance, and security notes; clients must treat these as user-facing setup guidance and still submit only this closed-set id.
                  default: encrypted_submission
                  enum:
                    - encrypted_submission
                    - aws_sso_profile
                    - infisical_cli
                    - environment_managed
                    - external_reference
                credential_store_id:
                  type: string
                  description: Closed credential-store identifier selected from /connectors credential_stores metadata.
                  default: cerebro_vault
                  enum:
                    - cerebro_vault
                    - environment_managed
                    - infisical
                    - google_secret_manager
                    - aws_secrets_manager
                    - azure_key_vault
                    - hashicorp_vault
                config:
                  type: object
                  additionalProperties:
                    type: string
                credential_references:
                  type: object
                  description: Non-secret credential references for environment-managed or external-reference methods. Values must use prefixes advertised by /connectors credential_stores metadata or generated by preflight credential_boundary.reference_templates, such as env:CEREBRO_SOURCE_<SOURCE>_<FIELD> or scoped AWS Secrets Manager references like aws-sm:us-east-1:cerebro/<tenant>/<source>/<runtime>/credentials#<field>. The browser must never submit plaintext secret values for reference-backed methods.
                  additionalProperties:
                    type: string
                scope_policy:
                  type: object
                  description: Non-secret connector scope policy. Excluded families are short-circuited before source reads; exact resources are filtered before downstream projection when the runtime can identify them.
                  properties:
                    mode:
                      type: string
                      enum:
                        - exclude
                    excluded_families:
                      type: array
                      items:
                        type: string
                    excluded_asset_classes:
                      type: array
                      items:
                        type: string
                    excluded_kinds:
                      type: array
                      items:
                        type: string
                    excluded_resource_urns:
                      type: array
                      items:
                        type: string
                    excluded_resources:
                      type: array
                      items:
                        type: object
                        properties:
                          urn:
                            type: string
                          type:
                            type: string
                          id:
                            type: string
                          reason:
                            type: string
                encrypted_credentials:
                  type: object
                  description: Required only when auth_method is encrypted_submission.
                  required:
                    - key_id
                    - algorithm
                    - wrapped_key
                    - nonce
                    - ciphertext
                  properties:
                    key_id:
                      type: string
                    algorithm:
                      type: string
                      enum:
                        - RSA-OAEP-256+A256GCM
                    wrapped_key:
                      type: string
                    nonce:
                      type: string
                    ciphertext:
                      type: string
      responses:
        '200':
          description: Stored runtime with sensitive config redacted, credential metadata, and the applied typed scope policy when provided.
