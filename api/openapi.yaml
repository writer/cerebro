  /platform/jobs/{jobID}:
    get:
      operationId: getPlatformJob
      summary: Get one platform job
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/jobID'
      responses:
        '200':
          description: Platform job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResponse'
  /platform/jobs/{jobID}/cancel:
    post:
      operationId: cancelPlatformJob
      summary: Request platform job cancellation
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/jobID'
      responses:
        '200':
          description: Cancelled or cancellation-requested job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResponse'
  /platform/jobs/{jobID}/events:
    get:
      operationId: listPlatformJobEvents
      summary: List platform job events
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/jobID'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Job event timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobEventListResponse'
  /platform/runtime-response/actions:
    post:
      operationId: executeRuntimeResponseAction
      summary: Execute a runtime response action
      tags:
        - Platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeResponseExecuteRequest'
      responses:
        '202':
          description: Runtime response action accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBlocklistEntryResponse'
        '422':
          description: Action is not supported by the configured executor surface.
  /platform/runtime-response/blocklist:
    get:
      operationId: listRuntimeBlocklist
      summary: List runtime response blocklist entries
      tags:
        - Platform
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [ip, domain]
        - name: include_revoked
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Runtime blocklist entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBlocklistListResponse'
  /platform/runtime-response/blocklist/{entryID}/revoke:
    post:
      operationId: revokeRuntimeBlocklistEntry
      summary: Revoke a runtime response blocklist entry
      tags:
        - Platform
      parameters:
        - $ref: '#/components/parameters/entryID'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked runtime blocklist entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBlocklistEntryResponse'
  /platform/runtime-response/capabilities:
    get:
      operationId: listRuntimeResponseCapabilities
      summary: List runtime response capability coverage
      tags:
        - Platform
      responses:
        '200':
          description: Runtime response capabilities and executor modes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResponseCapabilitiesResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    sourceID:
      name: sourceID
      in: path
      required: true
      schema:
        type: string
    runtimeID:
      name: runtimeID
      in: path
      required: true
      schema:
        type: string
    findingID:
      name: findingID
      in: path
      required: true
      schema:
        type: string
    candidateID:
      name: candidateID
      in: path
      required: true
      schema:
        type: string
    runID:
      name: runID
      in: path
      required: true
      schema:
        type: string
    jobID:
      name: jobID
      in: path
      required: true
      schema:
        type: string
    entryID:
      name: entryID
      in: path
      required: true
      schema:
        type: string
    evidenceID:
      name: evidenceID
      in: path
      required: true
      schema:
        type: string
    reportID:
      name: reportID
      in: path
      required: true
      schema:
        type: string
    tenantIDQuery:
      name: tenant_id
      in: query
      schema:
        type: string
    runtimeIDQuery:
      name: runtime_id
      in: query
      schema:
        type: string
    sourceIDQuery:
      name: source_id
      in: query
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
  schemas:
    CreatePlatformJobRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - source_runtime_sync
            - source_runtime_orchestrate
            - graph_ingest_runtime
            - finding_rules_evaluate
            - findings_evaluate
            - report_run
        tenant_id:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        idempotency_key:
          type: string
        payload:
          type: object
          additionalProperties: true
    PlatformJobResponse:
      type: object
      required:
        - job
      properties:
        job:
          $ref: '#/components/schemas/PlatformJob'
    PlatformJobListResponse:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/PlatformJob'
    PlatformJobEventListResponse:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/PlatformJobEvent'
    PlatformJob:
      type: object
      required:
        - id
        - kind
        - status
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        tenant_id:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        idempotency_key:
          type: string
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
        error:
          type: string
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        result_refs:
          type: object
          additionalProperties:
            type: string
        cancel_requested:
          type: boolean
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformJobEvent:
      type: object
      required:
        - job_id
        - sequence
        - type
      properties:
        job_id:
          type: string
        sequence:
          type: integer
        type:
          type: string
        status:
          type: string
        message:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    RuntimeResponseExecuteRequest:
      type: object
      required:
        - tenant_id
        - action
        - target
      properties:
        tenant_id:
          type: string
        action:
          type: string
          enum: [block_ip, block_domain, scale_down, kill_process, isolate_container, isolate_host, quarantine_file, revoke_credentials]
        target:
          type: string
        reason:
          type: string
        source:
          type: string
        source_job_id:
          type: string
        trusted_scope:
          type: boolean
          readOnly: true
          description: Server-derived authorization marker for mutating runtime response actions.
        attributes:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    RuntimeResponseCapabilitiesResponse:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeResponseCapability'
    RuntimeResponseCapability:
      type: object
      required:
        - action
        - mode
        - supported
        - requires_trusted_scope
      properties:
        action:
          type: string
        mode:
          type: string
        supported:
          type: boolean
        requires_trusted_scope:
          type: boolean
    RuntimeBlocklistEntryResponse:
      type: object
      required:
        - entry
      properties:
        entry:
          $ref: '#/components/schemas/RuntimeBlocklistEntry'
    RuntimeBlocklistListResponse:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeBlocklistEntry'
    RuntimeBlocklistEntry:
      type: object
      required:
        - id
        - tenant_id
        - type
        - value
      properties:
        id:
          type: string
        tenant_id:
          type: string
        type:
          type: string
          enum: [ip, domain]
        value:
          type: string
        reason:
          type: string
        source:
          type: string
        source_job_id:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    DeviceEnrollRequest:
      type: object
      required: [bootstrap_token, hardware_uuid]
      properties:
        bootstrap_token:
          type: string
          minLength: 1
        hardware_uuid:
          type: string
          minLength: 1
        serial_number:
          type: string
        hostname:
          type: string
        os_type:
          type: string
        os_version:
          type: string
        agent_version:
          type: string
        attestation:
          type: string
          description: |
            Base64-encoded device-bound attestation statement. On macOS this is
            an Apple App Attest CBOR attestationObject; on Windows a TPM 2.0
            quote bundle (JSON envelope with ek_chain, ak_pub_der, quote, signature, alg).
            Required when CEREBRO_DEVICE_AUTH_ATTESTATION_REQUIRED=true; if
            present and verified, the server binds a DPoP key (RFC 9449) to
            subsequent refresh-token rotations and the response includes
            assurance_level=hardware.
    DeviceTokenRequest:
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
          minLength: 1
    DeviceTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scopes]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until access_token expires.
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
        device_id:
          type: string
        assurance_level:
          type: string
          enum: [software, hardware]
          description: |
            Attestation outcome: "hardware" when the device-bound key was
            produced by Apple Secure Enclave or a TPM 2.0; "software" when
            no attestation was supplied or the configured registry runs in
            non-required mode.
        attestation_vendor:
          type: string
          description: |
            Backend that produced the attestation result (e.g.
            "apple-appattest", "tpm-2.0", or "none").
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Composite 0..100 risk score for this rotation.
        risk_level:
          type: string
          enum: [low, elevated, high]
          description: |
            Mapped from risk_score. On "high", sensitive scopes (telemetry
            ingest, bootstrap-token write, device revoke) are dropped from
            the issued access token.
    IssueBootstrapTokenRequest:
      type: object
      required: [hardware_uuid]
      properties:
        hardware_uuid:
          type: string
          minLength: 1
        tenant_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        ttl_seconds:
          type: integer
          minimum: 0
          description: Optional override in seconds. Omit or set 0 to use the configured default TTL.
    IssueBootstrapTokenResponse:
      type: object
      required: [token_id, token, expires_at]
      properties:
        token_id:
          type: string
        token:
          type: string
          description: Plaintext bootstrap token; returned once and never persisted in clear.
        expires_at:
          type: string
          format: date-time
    RevokeDeviceRequest:
      type: object
      properties:
        reason:
          type: string
    GRCAskRequest:
      type: object
      required: [tenant_id, question]
      properties:
        tenant_id:
          type: string
        question:
          type: string
          minLength: 1
          maxLength: 4096
        scope_urn:
          type: string
        model:
          type: string
          default: claude-sonnet-4-6
        history:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
    PutSourceRuntimeRequest:
