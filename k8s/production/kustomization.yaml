apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cerebro-production

resources:
  - ../base
  - external-secret.yaml

patchesStrategicMerge:
  - patches/configmap.yaml
  - patches/ingress.yaml
  - patches/deployment-api.yaml
  - patches/deployment-worker.yaml

images:
  - name: cerebro
    newTag: v1.0.0

replicas:
  - name: cerebro-api
    count: 4
  - name: cerebro-worker
    count: 3
  - name: cerebro-beat
    count: 1
