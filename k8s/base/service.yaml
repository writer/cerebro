apiVersion: v1
kind: Service
metadata:
  name: cerebro-api
  labels:
    app.kubernetes.io/name: cerebro
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cerebro
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: cerebro-api-headless
  labels:
    app.kubernetes.io/name: cerebro
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cerebro
    app.kubernetes.io/component: api
