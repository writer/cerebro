apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerebro-beat
  labels:
    app.kubernetes.io/name: cerebro
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cerebro
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cerebro
        app.kubernetes.io/component: beat
    spec:
      serviceAccountName: cerebro
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: beat
          image: cerebro:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - cerebro.tasks.celery_app
            - beat
            - -l
            - info
          envFrom:
            - configMapRef:
                name: cerebro-config
            - secretRef:
                name: cerebro-secrets
          env:
            - name: CELERY_PROCESS_ROLE
              value: beat
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: REDIS_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: celerybeat-schedule
              mountPath: /app/celerybeat-schedule
      volumes:
        - name: tmp
          emptyDir: {}
        - name: celerybeat-schedule
          emptyDir: {}
