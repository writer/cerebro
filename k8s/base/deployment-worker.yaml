apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerebro-worker
  labels:
    app.kubernetes.io/name: cerebro
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cerebro
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cerebro
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: cerebro
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: cerebro:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - cerebro.tasks.celery_app
            - worker
            - -l
            - info
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: cerebro-config
            - secretRef:
                name: cerebro-secrets
          env:
            - name: CELERY_PROCESS_ROLE
              value: worker
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: REDIS_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - cerebro.tasks.celery_app
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 300
