apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cerebro-api
  labels:
    app.kubernetes.io/name: cerebro
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cerebro
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cerebro-worker
  labels:
    app.kubernetes.io/name: cerebro
    app.kubernetes.io/component: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cerebro
      app.kubernetes.io/component: worker
