apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cerebro-staging

resources:
  - ../base

patchesStrategicMerge:
  - staging-config.yaml

images:
  - name: cerebro
    newTag: staging-latest

replicas:
  - name: cerebro-api
    count: 2
  - name: cerebro-worker-collection
    count: 1
  - name: cerebro-worker-findings
    count: 1
