apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cerebro-staging

resources:
  - ../base
  - external-secret.yaml

patchesStrategicMerge:
  - patches/configmap.yaml
  - patches/ingress.yaml

images:
  - name: cerebro
    newTag: staging-latest

replicas:
  - name: cerebro-api
    count: 2
  - name: cerebro-worker
    count: 1
  - name: cerebro-beat
    count: 1
