repos:
  - repo: local
    hooks:
      - id: ts-sdk-openapi-types
        name: Ensure TypeScript SDK OpenAPI types are current
        entry: scripts/check_ts_sdk_openapi.sh
        language: system
        pass_filenames: false
        stages: [commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: ["--fix"]
        files: "^(src|tests|tests_unit|scripts)/.*\\.py$"
        exclude: "^(migrations|notebooks)/.*\\.py$"
      - id: ruff-format
        files: "^(src|tests|tests_unit|scripts)/.*\\.py$"
        exclude: "^(migrations|notebooks)/.*\\.py$"
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        files: "^src/cerebro/.*\\.py$"
        additional_dependencies:
          - pydantic>=2.5.0
          - sqlalchemy>=2.0.23
          - types-redis
          - types-cachetools
