repos:
  - repo: local
    hooks:
      - id: ts-sdk-openapi-types
        name: Ensure TypeScript SDK OpenAPI types are current
        entry: scripts/check_ts_sdk_openapi.sh
        language: system
        pass_filenames: false
        stages: [commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: ["--fix"]
        files: "^src/cerebro/findings/producers/(aws/(codebuild_(public_trigger|source_credential)|service_account_open_assume|security_group_admin_port|security_group_public_ingress|load_balancer_public_http|load_balancer_missing_https|load_balancer_weak_tls|load_balancer_certificate_expiry|load_balancer_target_exposure|bucket_cleartext_key|ec2_instance_public_ip|iam_user_without_mfa|s3_bucket_public|s3_bucket_unencrypted|storage_write_access)\\.py|azure/(storage_public_write|storage_secret_artifacts)\\.py|github/(repo_runner_group_scope|workflow_permissions|org_workflow_permissions|org_2fa_disabled|admin_without_2fa|public_repo_no_branch_protection|runner_exposure)\\.py|kubernetes/(privileged_pod|ingress_public_exposure|cluster_admin_binding|cluster_admin_wildcard|service_public_exposure|node_public_exposure|service_account_token|network_policy)\\.py|utils/.+\\.py)$"
      - id: ruff-format
        files: "^src/cerebro/findings/producers/(aws/(codebuild_(public_trigger|source_credential)|service_account_open_assume|security_group_admin_port|security_group_public_ingress|load_balancer_public_http|load_balancer_missing_https|load_balancer_weak_tls|load_balancer_certificate_expiry|load_balancer_target_exposure|bucket_cleartext_key|ec2_instance_public_ip|iam_user_without_mfa|s3_bucket_public|s3_bucket_unencrypted|storage_write_access)\\.py|azure/(storage_public_write|storage_secret_artifacts)\\.py|github/(repo_runner_group_scope|workflow_permissions|org_workflow_permissions|org_2fa_disabled|admin_without_2fa|public_repo_no_branch_protection|runner_exposure)\\.py|kubernetes/(privileged_pod|ingress_public_exposure|cluster_admin_binding|cluster_admin_wildcard|service_public_exposure|node_public_exposure|service_account_token|network_policy)\\.py|utils/.+\\.py)$"
