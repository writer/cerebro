cerebroService:
  enabled: true

  image:
    repository: us-docker.pkg.dev/writer-shared/writer/cerebro
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []

  legacyRepositories:
    dev: us-docker.pkg.dev/qordoba-devel/cerebro/cerebro-dev
    release: us-docker.pkg.dev/qordoba-devel/cerebro/cerebro-test
    prod: us-docker.pkg.dev/qordoba-prod/cerebro/cerebro-prd

  secretName: cerebro-secrets

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  podAnnotations: {}
  podLabels: {}

  sharedEnv:
    - name: ENVIRONMENT
      value: production
    - name: LOG_LEVEL
      value: INFO

  config:
    enabled: true
    data:
      LOG_FORMAT: json
      API_V1_PREFIX: /api/v1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  components:
    api:
      enabled: true
      replicas: 2
      podAnnotations: {}
      podLabels: {}
      env: []
      extraEnvFrom: []
      resources:
        requests:
          cpu: 500m
          memory: 1024Mi
        limits:
          cpu: 1000m
          memory: 2048Mi
      livenessProbe:
        enabled: true
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
      readinessProbe:
        enabled: true
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 5
        periodSeconds: 5
      service:
        enabled: true
        type: ClusterIP
        port: 80
        targetPort: 8000
        annotations: {}
      ingress:
        enabled: false
        className: ""
        annotations: {}
        hosts: []
        tls: []

    workerCollection:
      enabled: true
      replicas: 2
      queue: collection
      concurrency: 2
      env: []
      extraEnvFrom: []
      resources:
        requests:
          cpu: 500m
          memory: 1024Mi
        limits:
          cpu: 2000m
          memory: 4096Mi

    workerFindings:
      enabled: true
      replicas: 1
      queue: findings
      concurrency: 1
      env: []
      extraEnvFrom: []
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2048Mi

    beat:
      enabled: true
      env: []
      extraEnvFrom: []
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1024Mi

    flower:
      enabled: false
      service:
        enabled: true
        type: ClusterIP
        port: 5555
        targetPort: 5555
        annotations: {}
      env: []
      extraEnvFrom: []
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1024Mi
