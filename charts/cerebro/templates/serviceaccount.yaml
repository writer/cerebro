{{- if and .Values.cerebroService.enabled .Values.cerebroService.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cerebro.serviceAccountName" . }}
  labels:
    {{- include "cerebro.labels" . | nindent 4 }}
  {{- with .Values.cerebroService.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
