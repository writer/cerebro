{{- $root := . -}}
{{- $svc := .Values.cerebroService -}}
{{- $component := $svc.components.api -}}
{{- if and $svc.enabled $component.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cerebro.componentName" (list $root "api") }}
  labels:
    {{- include "cerebro.labels" $root | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with $svc.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $component.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "cerebro.selectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cerebro.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with $svc.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $component.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $allAnnotations := merge (dict) ($svc.podAnnotations | default dict) ($component.podAnnotations | default dict) }}
      {{- if $allAnnotations }}
      annotations:
        {{- toYaml $allAnnotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cerebro.serviceAccountName" $root }}
      containers:
        - name: cerebro-api
          image: "{{ $svc.image.repository }}:{{ default $root.Chart.AppVersion $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          command:
            - uvicorn
            - cerebro.api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          {{- if $component.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml (omit $component.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if $component.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml (omit $component.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          {{- $envFrom := list -}}
          {{- if $svc.config.enabled }}
          {{- $envFrom = append $envFrom (dict "configMapRef" (dict "name" (include "cerebro.configMapName" $root))) -}}
          {{- end }}
          {{- if $svc.secretName }}
          {{- $envFrom = append $envFrom (dict "secretRef" (dict "name" $svc.secretName)) -}}
          {{- end }}
          {{- range $entry := ($component.extraEnvFrom | default list) }}
          {{- $envFrom = append $envFrom $entry -}}
          {{- end }}
          {{- if $envFrom }}
          envFrom:
            {{- toYaml $envFrom | nindent 12 }}
          {{- end }}
          {{- $envList := list -}}
          {{- range $entry := ($svc.sharedEnv | default list) }}
          {{- $envList = append $envList $entry -}}
          {{- end }}
          {{- range $entry := ($component.env | default list) }}
          {{- $envList = append $envList $entry -}}
          {{- end }}
          {{- if $envList }}
          env:
            {{- toYaml $envList | nindent 12 }}
          {{- end }}
      {{- with $svc.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
