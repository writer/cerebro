{{- $root := . -}}
{{- $svc := .Values.cerebroService -}}
{{- $component := $svc.components.api -}}
{{- if and $svc.enabled $component.enabled $component.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cerebro.componentName" (list $root "api") }}
  labels:
    {{- include "cerebro.labels" $root | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with $component.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $component.ingress.className }}
  ingressClassName: {{ $component.ingress.className }}
  {{- end }}
  {{- if $component.ingress.tls }}
  tls:
    {{- toYaml $component.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range $component.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          - path: {{ default "/" .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "cerebro.componentName" (list $root "api") }}
                port:
                  number: {{ $component.service.port }}
    {{- end }}
{{- end }}
