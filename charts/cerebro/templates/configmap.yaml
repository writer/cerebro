{{- if and .Values.cerebroService.enabled .Values.cerebroService.config.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cerebro.configMapName" . }}
  labels:
    {{- include "cerebro.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.cerebroService.config.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
