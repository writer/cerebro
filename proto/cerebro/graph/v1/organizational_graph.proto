syntax = "proto3";

package cerebro.graph.v1;

option go_package = "github.com/writer/cerebro/gen/cerebro/graph/v1;cerebrographv1";

// OrganizationalGraphService exposes bounded, tenant-scoped graph reads to agents and product clients.
service OrganizationalGraphService {
  // Search returns entities matching a label or stable identifier.
  rpc Search(SearchRequest) returns (SearchResponse);
  // GetEntity returns one entity by its sealed identifier.
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  // Expand returns the bounded neighborhood around one entity or stable agent key.
  rpc Expand(ExpandRequest) returns (ExpandResponse);
  // ExpandBatch returns bounded neighborhoods for a closed set of roots.
  rpc ExpandBatch(ExpandBatchRequest) returns (ExpandBatchResponse);
  // FindPaths returns bounded directed paths between two entities.
  rpc FindPaths(FindPathsRequest) returns (FindPathsResponse);
  // ExplainAssertion returns the stored edge and source runtime for one assertion.
  rpc ExplainAssertion(ExplainAssertionRequest) returns (ExplainAssertionResponse);
  // QueryFacts executes one bounded, schema-checked graph pattern.
  rpc QueryFacts(QueryFactsRequest) returns (QueryFactsResponse);
  // CompareExposureCoverage returns one bounded, revision-bound comparison of
  // primary observations and an independent corroborating source.
  rpc CompareExposureCoverage(CompareExposureCoverageRequest) returns (CompareExposureCoverageResponse);
  // ListEntities returns one bounded page from the tenant entity catalog.
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  // CountEntityKinds returns bounded entity-kind counts from the tenant catalog.
  rpc CountEntityKinds(CountEntityKindsRequest) returns (CountEntityKindsResponse);
  // CountRelations returns bounded relation counts from the tenant legacy graph projection.
  rpc CountRelations(CountRelationsRequest) returns (CountRelationsResponse);
  // ListPersonAccessPaths returns bounded person-to-access-target paths from the legacy graph projection.
  rpc ListPersonAccessPaths(ListPersonAccessPathsRequest) returns (ListPersonAccessPathsResponse);
  // ListEffectiveAccessPaths returns bounded identity-to-capability proofs from the legacy graph projection.
  rpc ListEffectiveAccessPaths(ListEffectiveAccessPathsRequest) returns (ListEffectiveAccessPathsResponse);
  // ListCloudAttackPaths returns bounded public-exposure-to-privilege paths from the legacy graph projection.
  rpc ListCloudAttackPaths(ListCloudAttackPathsRequest) returns (ListCloudAttackPathsResponse);
  // ListCrownJewelPaths returns bounded paths rooted at explicitly classified crown jewels.
  rpc ListCrownJewelPaths(ListCrownJewelPathsRequest) returns (ListCrownJewelPathsResponse);
  // ListEntityRelations returns filtered direct relations for one catalog entity.
  rpc ListEntityRelations(ListEntityRelationsRequest) returns (ListEntityRelationsResponse);
  // GetComplianceImpactFact resolves one exact compliance revision and its dependencies.
  rpc GetComplianceImpactFact(GetComplianceImpactFactRequest) returns (GetComplianceImpactFactResponse);
  // ListComplianceImpactDependents returns one keyset-paged reverse-dependency page.
  rpc ListComplianceImpactDependents(ListComplianceImpactDependentsRequest) returns (ListComplianceImpactDependentsResponse);
  // GetSourceSummary returns the catalog coverage compiled into the running Rust service.
  rpc GetSourceSummary(GetSourceSummaryRequest) returns (GetSourceSummaryResponse);
  // ListVendorRegister returns the product-ready vendor register at one graph revision.
  rpc ListVendorRegister(ListVendorRegisterRequest) returns (ListVendorRegisterResponse);
  // ListVendorDiscoveries returns source-backed vendor candidates at one graph revision.
  rpc ListVendorDiscoveries(ListVendorDiscoveriesRequest) returns (ListVendorDiscoveriesResponse);
}

// GraphEntity is the stable agent-facing view of one organizational entity.
message GraphEntity {
  string entity_id = 1;
  string agent_key = 2;
  string entity_kind = 3;
  string label = 4;
  string authority = 5;
  string source_runtime_id = 6;
  string provider_kind = 7;
  string provider_id = 8;
  map<string, string> properties = 9;
}

// GraphEdge is one typed, source-backed assertion between two entities.
message GraphEdge {
  string assertion_id = 1;
  string from_entity_id = 2;
  string relation = 3;
  string to_entity_id = 4;
  string source_runtime_id = 5;
  bool identity_binding = 6;
}

// GraphPath is an ordered directed path.
message GraphPath {
  repeated GraphEntity entities = 1;
  repeated GraphEdge edges = 2;
}

// SearchRequest binds a bounded search to one authenticated tenant.
message SearchRequest {
  string tenant_id = 1;
  string query = 2;
  repeated string kinds = 3;
  uint32 limit = 4;
}

// SearchResponse returns stable entities at one graph revision.
message SearchResponse {
  uint64 graph_revision = 1;
  repeated GraphEntity entities = 2;
}

// GetEntityRequest identifies one tenant-scoped entity.
message GetEntityRequest {
  string tenant_id = 1;
  string entity_id = 2;
}

// GetEntityResponse returns one stable entity at one graph revision.
message GetEntityResponse {
  uint64 graph_revision = 1;
  GraphEntity entity = 2;
}

// ExpandRequest identifies one graph root and hard traversal bounds.
message ExpandRequest {
  string tenant_id = 1;
  string root_key = 2;
  uint32 depth = 3;
  uint32 limit = 4;
}

// ExpandResponse returns only the entities needed to interpret its bounded edge set.
message ExpandResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  GraphEntity root = 3;
  repeated GraphEntity entities = 4;
  repeated GraphEdge edges = 5;
  bool truncated = 6;
}

// ExpandBatchRequest identifies a closed set of graph roots with shared hard bounds.
message ExpandBatchRequest {
  string tenant_id = 1;
  repeated string root_keys = 2;
  uint32 depth = 3;
  uint32 limit = 4;
}

// ExpandBatchResponse returns one bounded neighborhood for each resolved root.
message ExpandBatchResponse {
  map<string, ExpandResponse> neighborhoods = 1;
}

// FindPathsRequest identifies two endpoints and hard traversal bounds.
message FindPathsRequest {
  string tenant_id = 1;
  string from_entity_id = 2;
  string to_entity_id = 3;
  uint32 max_depth = 4;
  uint32 limit = 5;
}

// FindPathsResponse returns bounded directed paths at one graph revision.
message FindPathsResponse {
  uint64 graph_revision = 1;
  repeated GraphPath paths = 2;
}

// ExplainAssertionRequest identifies one source-backed graph assertion.
message ExplainAssertionRequest {
  string tenant_id = 1;
  string assertion_id = 2;
}

// ExplainAssertionResponse returns the assertion edge.
message ExplainAssertionResponse {
  GraphEdge edge = 1;
}

// QueryNodePattern binds a variable to a closed set of entity kinds and optional stable keys.
message QueryNodePattern {
  string variable = 1;
  repeated string kinds = 2;
  repeated string keys = 3;
}

// QueryEdgePattern requires one directed typed assertion between two bound variables.
message QueryEdgePattern {
  string variable = 1;
  string from_variable = 2;
  string relation = 3;
  string to_variable = 4;
}

enum QueryDirection {
  QUERY_DIRECTION_UNSPECIFIED = 0;
  QUERY_DIRECTION_OUTGOING = 1;
  QUERY_DIRECTION_INCOMING = 2;
}

// QueryAbsentEdgePattern rejects a match when the bound variable has the specified edge.
message QueryAbsentEdgePattern {
  string bound_variable = 1;
  QueryDirection direction = 2;
  string relation = 3;
  repeated string other_kinds = 4;
}

// QueryFactsRequest carries a bounded structured query. It never contains Cypher.
message QueryFactsRequest {
  string tenant_id = 1;
  repeated QueryNodePattern nodes = 2;
  repeated QueryEdgePattern edges = 3;
  repeated QueryAbsentEdgePattern absent_edges = 4;
  uint32 limit = 5;
}

message QueryBoundEntity {
  string variable = 1;
  GraphEntity entity = 2;
}

message QueryBoundEdge {
  string variable = 1;
  GraphEdge edge = 2;
}

message QueryFactMatch {
  repeated QueryBoundEntity entities = 1;
  repeated QueryBoundEdge edges = 2;
}

// QueryFactsResponse binds every result to one durable graph revision.
message QueryFactsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated QueryFactMatch matches = 3;
  bool truncated = 4;
}

// EntityCatalogFilter is a closed, provider-neutral entity selector. Exact and
// prefix kind lists are ORed; exclusions are always applied.
message EntityCatalogFilter {
  string tenant_id = 1;
  string source_id = 2;
  repeated string runtime_ids = 3;
  string exact_agent_key = 4;
  repeated string include_kinds = 5;
  repeated string include_kind_prefixes = 6;
  repeated string exclude_kinds = 7;
  repeated string exclude_kind_prefixes = 8;
  string query = 9;
  uint64 expected_graph_revision = 10;
  // query_attributes opts into searching stored attributes in addition to the
  // stable key and label. Callers must select this explicitly.
  bool query_attributes = 11;
  EntityRelationCountFilter relation_counts = 12;
  // application_workspace_id scopes the read to a Cerebro application
  // workspace. It is distinct from provider-owned workspace identifiers.
  string application_workspace_id = 13;
  // attribute_substrings_any applies a case-insensitive OR across stored
  // attribute JSON without widening the stable key and label search.
  repeated string attribute_substrings_any = 14;
}

// EntityRelationCountFilter requests complete grouped counts for the bounded
// entity page. Every list is closed and parameterized by the Rust store.
message EntityRelationCountFilter {
  repeated EntityRelationDirection directions = 1;
  repeated string relations = 2;
  repeated string neighbor_kinds = 3;
}

message ListEntitiesRequest {
  EntityCatalogFilter filter = 1;
  uint32 limit = 2;
  string after_agent_key = 3;
}

message ListEntitiesResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated GraphEntity entities = 3;
  bool truncated = 4;
  string next_after_agent_key = 5;
  repeated EntityRelationCount relation_counts = 6;
}

message EntityRelationCount {
  string agent_key = 1;
  EntityRelationDirection direction = 2;
  string relation = 3;
  string neighbor_kind = 4;
  uint64 count = 5;
}

message EntityKindCount {
  string entity_kind = 1;
  uint64 count = 2;
}

message CountEntityKindsRequest {
  EntityCatalogFilter filter = 1;
  uint32 limit = 2;
  string after_entity_kind = 3;
}

message CountEntityKindsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated EntityKindCount counts = 3;
  bool truncated = 4;
  string next_after_entity_kind = 5;
}

message RelationCount {
  string relation = 1;
  uint64 count = 2;
}

message CountRelationsRequest {
  string tenant_id = 1;
  uint32 limit = 2;
  string after_relation = 3;
  uint64 expected_graph_revision = 4;
}

message CountRelationsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated RelationCount counts = 3;
  bool truncated = 4;
  string next_after_relation = 5;
}

message PersonAccessPath {
  GraphEntity person = 1;
  GraphEntity identity = 2;
  GraphEntity principal = 3;
  GraphEntity access_target = 4;
  repeated string relation_chain = 5;
}

message ListPersonAccessPathsRequest {
  string tenant_id = 1;
  string person_urn = 2;
  string person_query = 3;
  uint32 limit = 4;
  uint32 max_depth = 5;
  uint64 expected_graph_revision = 6;
}

message ListPersonAccessPathsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated PersonAccessPath paths = 3;
  bool truncated = 4;
}

message EffectiveAccessPathEdge {
  GraphEntity from = 1;
  string relation = 2;
  GraphEntity to = 3;
  string source_id = 4;
  string runtime_id = 5;
  string attributes_json = 6;
}

message EffectiveAccessPath {
  GraphEntity identity = 1;
  GraphEntity principal = 2;
  GraphEntity mediator = 3;
  GraphEntity access_target = 4;
  GraphEntity entitlement = 5;
  GraphEntity capability = 6;
  string assignment_kind = 7;
  repeated string identity_relation_chain = 8;
  repeated EffectiveAccessPathEdge identity_edges = 9;
  repeated string relation_chain = 10;
  repeated EffectiveAccessPathEdge edges = 11;
}

message ListEffectiveAccessPathsRequest {
  string tenant_id = 1;
  string identity_urn = 2;
  string identity_query = 3;
  string application_urn = 4;
  string capability_urn = 5;
  string capability_id = 6;
  uint32 limit = 7;
  uint64 expected_graph_revision = 8;
}

message ListEffectiveAccessPathsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated EffectiveAccessPath paths = 3;
  bool truncated = 4;
}

message CloudAttackPathNode {
  string urn = 1;
  string entity_kind = 2;
  string label = 3;
}

message CloudAttackPathEdge {
  CloudAttackPathNode from = 1;
  string relation = 2;
  CloudAttackPathNode to = 3;
  string direction = 4;
  string source_id = 5;
  string source_runtime_id = 6;
  repeated string assertion_runtime_ids = 7;
  string attributes_json = 8;
}

message CloudAttackPathOwnership {
  CloudAttackPathNode owner = 1;
  CloudAttackPathEdge edge = 2;
}

message CloudAttackPath {
  CloudAttackPathNode public_principal = 1;
  CloudAttackPathNode exposed_resource = 2;
  CloudAttackPathNode cloud_account = 3;
  CloudAttackPathNode principal = 4;
  CloudAttackPathNode permission = 5;
  repeated CloudAttackPathOwnership ownerships = 6;
  string reach_relation = 7;
  string access_relation = 8;
  repeated string relation_chain = 9;
  CloudAttackPathEdge exposure_edge = 10;
  CloudAttackPathEdge resource_account_edge = 11;
  repeated CloudAttackPathEdge traversal_edges = 12;
  CloudAttackPathEdge privilege_edge = 13;
  CloudAttackPathEdge permission_account_edge = 14;
}

message CloudAttackPathCounts {
  uint64 paths = 1;
  uint64 exposed_resources = 2;
  uint64 privileged_principals = 3;
  uint64 cloud_accounts = 4;
}

message ListCloudAttackPathsRequest {
  string tenant_id = 1;
  string account_id = 2;
  string runtime_id = 3;
  bool require_assertion_proof = 4;
  uint32 limit = 5;
  uint32 max_depth = 6;
  uint64 expected_graph_revision = 7;
}

message ListCloudAttackPathsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  CloudAttackPathCounts counts = 3;
  repeated CloudAttackPath paths = 4;
  bool truncated = 5;
}

message CrownJewelPath {
  GraphEntity seed = 1;
  repeated GraphEntity nodes = 2;
  repeated string relations = 3;
}

message ListCrownJewelPathsRequest {
  string tenant_id = 1;
  string account_id = 2;
  string entity_kind = 3;
  uint32 limit = 4;
  uint32 seed_limit = 5;
  uint32 max_depth = 6;
  uint64 expected_graph_revision = 7;
}

message ListCrownJewelPathsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated GraphEntity seeds = 3;
  repeated CrownJewelPath paths = 4;
  bool truncated = 5;
}

enum EntityRelationDirection {
  ENTITY_RELATION_DIRECTION_UNSPECIFIED = 0;
  ENTITY_RELATION_DIRECTION_INCOMING = 1;
  ENTITY_RELATION_DIRECTION_OUTGOING = 2;
}

message ListEntityRelationsRequest {
  string tenant_id = 1;
  string agent_key = 2;
  repeated EntityRelationDirection directions = 3;
  repeated string relations = 4;
  repeated string neighbor_kinds = 5;
  uint32 limit = 6;
  string after_agent_key = 7;
  uint64 expected_graph_revision = 8;
  string after_relation = 9;
  EntityRelationDirection after_direction = 10;
  repeated string neighbor_agent_keys = 11;
  string neighbor_application_workspace_id = 12;
}

message EntityRelation {
  EntityRelationDirection direction = 1;
  string relation = 2;
  GraphEntity entity = 3;
  string source_id = 4;
  string attributes_json = 5;
}

message ListEntityRelationsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated EntityRelation relations = 3;
  bool truncated = 4;
  string next_after_agent_key = 5;
  string next_after_relation = 6;
  EntityRelationDirection next_after_direction = 7;
}

// GetSourceSummaryRequest binds the catalog read to one authenticated tenant.
message GetSourceSummaryRequest {
  string tenant_id = 1;
}

// GetSourceSummaryResponse reports the source and family coverage in this exact runtime.
message GetSourceSummaryResponse {
  uint64 sources = 1;
  uint64 families = 2;
  uint64 authoritative_sources = 3;
  uint64 authoritative_families = 4;
  uint64 shadow_only_sources = 5;
  map<string, uint64> projection_classes = 6;
}

// VendorRegisterFilter contains only the bounded filters exposed by the vendor worklist.
message VendorRegisterFilter {
  string tenant_id = 1;
  string source_id = 2;
  repeated string runtime_ids = 3;
  string query = 4;
  string risk_level = 5;
  string review_state = 6;
  string owner_state = 7;
  string lifecycle_state = 8;
  bool queue_only = 9;
  // application_workspace_id scopes the read to a Cerebro application
  // workspace. It is distinct from provider-owned workspace identifiers.
  string application_workspace_id = 10;
}

message ListVendorRegisterRequest {
  VendorRegisterFilter filter = 1;
  uint32 limit = 2;
}

// VendorRegisterRow is the Rust-owned product view rendered by the vendor register.
message VendorRegisterRow {
  string urn = 1;
  string vendor_id = 2;
  string name = 3;
  string source_id = 4;
  string runtime_id = 5;
  string provider = 6;
  string status = 7;
  string category = 8;
  string website_url = 9;
  string services_provided = 10;
  string lifecycle_state = 11;
  string owner = 12;
  string owner_state = 13;
  string risk_level = 14;
  int32 risk_score = 15;
  string risk_score_level = 16;
  string review_state = 17;
  string review_due_at = 18;
  string evidence_freshness_state = 19;
  string packet_state = 20;
  uint64 contract_count = 21;
  uint64 security_review_count = 22;
  uint64 questionnaire_count = 23;
  uint64 assurance_document_count = 24;
  uint64 open_findings = 25;
  uint64 critical_findings = 26;
  uint64 high_findings = 27;
  uint64 evidence_items = 28;
  int32 risk_queue_rank = 29;
  repeated string queue_reasons = 30;
  string next_action_id = 31;
  string next_action_label = 32;
  map<string, string> attributes = 33;
}

message VendorRegisterSummary {
  uint64 total_vendors = 1;
  uint64 active_vendors = 2;
  uint64 high_risk_vendors = 3;
  uint64 owner_missing_vendors = 4;
  uint64 review_overdue_vendors = 5;
  uint64 review_due_soon_vendors = 6;
  uint64 review_not_scheduled = 7;
  uint64 risk_queue_vendors = 8;
  uint64 stale_evidence_vendors = 9;
  uint64 open_findings = 10;
  uint64 critical_findings = 11;
  uint64 high_findings = 12;
  uint64 evidence_items = 13;
}

message ListVendorRegisterResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  string data_authority = 3;
  string generated_at = 4;
  repeated VendorRegisterRow vendors = 5;
  VendorRegisterSummary summary = 6;
}

message VendorDiscoveryFilter {
  string tenant_id = 1;
  string source_id = 2;
  repeated string runtime_ids = 3;
  string query = 4;
  string source_status = 5;
  // application_workspace_id scopes the read to a Cerebro application
  // workspace. It is distinct from provider-owned workspace identifiers.
  string application_workspace_id = 6;
}

message ListVendorDiscoveriesRequest {
  VendorDiscoveryFilter filter = 1;
  uint32 limit = 2;
}

message VendorDiscoveryRow {
  string urn = 1;
  string discovery_id = 2;
  string name = 3;
  string normalized_name = 4;
  string source_id = 5;
  string runtime_id = 6;
  string provider = 7;
  string source_status = 8;
  string decision_state = 9;
  string category = 10;
  string website_url = 11;
  string linked_vendor_urn = 12;
  string decision_reason = 13;
  string decision_updated_by = 14;
  string decision_updated_at = 15;
  map<string, string> attributes = 16;
  repeated string source_ids = 17;
  double confidence_score = 18;
  string discovery_reason = 19;
  string first_observed_at = 20;
  string last_observed_at = 21;
  repeated VendorDiscoverySignal signals = 22;
}

message VendorDiscoverySignal {
  string id = 1;
  string label = 2;
  string source_id = 3;
  string runtime_id = 4;
  string entity_type = 5;
  string entity_urn = 6;
  double confidence_score = 7;
  string observed_at = 8;
  string reason = 9;
  map<string, string> attributes = 10;
}

message VendorDiscoverySummary {
  uint64 total_discoveries = 1;
  uint64 discovered = 2;
  uint64 approved = 3;
  uint64 rejected = 4;
  uint64 ignored = 5;
  uint64 linked = 6;
  uint64 source_count = 7;
  uint64 evidence_signals = 8;
}

message VendorDiscoverySourceSummary {
  string source_id = 1;
  string provider = 2;
  string runtime_id = 3;
  string status = 4;
  string freshness = 5;
  uint64 total = 6;
  uint64 discovered = 7;
  uint64 approved = 8;
  uint64 rejected = 9;
  uint64 ignored = 10;
  uint64 linked = 11;
  uint64 failed = 12;
  uint64 stale = 13;
  uint64 cursor_pending = 14;
  uint64 sync_lag_seconds = 15;
  string last_error = 16;
  string last_synced_at = 17;
}

message ListVendorDiscoveriesResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  string data_authority = 3;
  string generated_at = 4;
  repeated VendorDiscoveryRow discoveries = 5;
  VendorDiscoverySummary summary = 6;
  repeated VendorDiscoverySourceSummary source_summaries = 7;
}

// ExposureCoverageProfile declares the closed entity kinds and sources used by
// one coverage comparison. Relations are fixed by the server.
message ExposureCoverageProfile {
  string primary_source_id = 1;
  string primary_entity_kind_prefix = 2;
  string corroborating_source_id = 3;
  string corroborating_entity_kind = 4;
  repeated string indicator_kinds = 5;
  string account_kind = 6;
  string corroborating_observation_kind = 7;
}

// CompareExposureCoverageRequest scopes one bounded coverage comparison to an
// authenticated tenant. Empty account, region, and query values disable those
// optional filters.
message CompareExposureCoverageRequest {
  string tenant_id = 1;
  ExposureCoverageProfile profile = 2;
  string account_id = 3;
  string region = 4;
  string query = 5;
  uint32 limit = 6;
}

message ExposureCoverageCounts {
  uint64 primary_entities = 1;
  uint64 indicators = 2;
  uint64 host_indicators = 3;
  uint64 ip_indicators = 4;
  uint64 overlapping_primary_entities = 5;
  uint64 overlapping_indicators = 6;
  uint64 overlapping_corroborating_entities = 7;
}

message ExposureCoverageKindCount {
  string entity_kind = 1;
  uint64 count = 2;
}

message ExposureCoverageOverlap {
  GraphEntity primary = 1;
  GraphEntity indicator = 2;
  GraphEntity corroborating = 3;
}

message ExposureCoveragePair {
  GraphEntity primary = 1;
  GraphEntity indicator = 2;
}

message ExposureCoverageCorroboratingOnly {
  GraphEntity corroborating = 1;
  GraphEntity indicator = 2;
}

message ExposureCoverageAccount {
  GraphEntity account = 1;
  uint64 primary_entities = 2;
  uint64 corroborating_observations = 3;
}

message ExposureCoverageCompleteness {
  bool type_counts_truncated = 1;
  bool overlaps_truncated = 2;
  bool primary_only_truncated = 3;
  bool corroborating_only_truncated = 4;
  bool accounts_truncated = 5;
}

// CompareExposureCoverageResponse binds every count and sample to one durable
// graph revision and reports every server-side collection bound explicitly.
message CompareExposureCoverageResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  ExposureCoverageCounts counts = 3;
  repeated ExposureCoverageKindCount type_counts = 4;
  repeated ExposureCoverageOverlap overlaps = 5;
  repeated ExposureCoveragePair primary_only = 6;
  repeated ExposureCoverageCorroboratingOnly corroborating_only = 7;
  repeated ExposureCoverageAccount accounts = 8;
  ExposureCoverageCompleteness completeness = 9;
}

message GetComplianceImpactFactRequest {
  string tenant_id = 1;
  string agent_key = 2;
}

message ComplianceImpactDependency {
  GraphEntity entity = 1;
  string relation = 2;
}

message GetComplianceImpactFactResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  GraphEntity fact = 3;
  uint32 dependency_count = 4;
  repeated ComplianceImpactDependency dependencies = 5;
}

message ListComplianceImpactDependentsRequest {
  string tenant_id = 1;
  string dependency_agent_key = 2;
  string after_agent_key = 3;
  uint32 limit = 4;
}

message ListComplianceImpactDependentsResponse {
  string tenant_id = 1;
  uint64 graph_revision = 2;
  repeated GraphEntity dependents = 3;
  bool truncated = 4;
  string next_after_agent_key = 5;
}
