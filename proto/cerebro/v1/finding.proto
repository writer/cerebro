syntax = "proto3";

package cerebro.v1;

option go_package = "github.com/writer/cerebro/gen/cerebro/v1;cerebrov1";

import "google/protobuf/timestamp.proto";

// FindingEvaluationSourceSnapshot binds one rule run to a source population.
// Counters and status are copied from the durable runtime sync state so a
// completed rule run cannot hide rejected records or a later scope change.
message FindingEvaluationSourceSnapshot {
  string runtime_id = 1;
  string source_id = 2;
  string family = 3;
  google.protobuf.Timestamp last_synced_at = 4;
  google.protobuf.Timestamp checkpoint_watermark = 5;
  optional bool complete = 6;
  uint32 records_scanned = 7;
  uint32 records_accepted = 8;
  uint32 records_rejected = 9;
  string sync_status = 10;
  string contract_probe_state = 11;
  string progress_config_hash = 12;
  string graph_ingest_run_id = 13;
  string graph_ingest_status = 14;
  string graph_checkpoint_id = 15;
  google.protobuf.Timestamp graph_ingested_at = 16;
  optional bool graph_snapshot_complete = 17;
}

// FindingEvaluationRun is the durable audit envelope for one rule evaluation over one source runtime.
message FindingEvaluationRun {
  string id = 1;
  string runtime_id = 2;
  string rule_id = 3;
  string status = 4;
  uint32 event_limit = 5;
  uint32 events_evaluated = 6;
  uint32 findings_upserted = 7;
  repeated string finding_ids = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  string error = 11;
  uint32 events_processed = 12;
  uint32 events_matched = 13;
  uint32 findings_emitted = 14;
  // graph_rule discriminates graph-rule evaluation runs (whose counters live on
  // graph_rows_read) from event-rule runs (whose counters live on events_*).
  // Operators reading events_evaluated=0 rely on this flag to tell graph runs
  // apart from event rules that simply never saw events.
  optional bool graph_rule = 15;
  // graph_rows_read records how many cypher rows the rule's read transaction
  // returned. It is the graph-rule analog of events_evaluated and lets operators
  // distinguish "graph rule fetched zero rows" from "graph rule never ran".
  optional uint32 graph_rows_read = 16;
  // graph_truncated records the producer's completeness decision, including
  // rule-internal caps that can fire below the transport row limit.
  optional bool graph_truncated = 17;
  // graph_row_limit records the effective transport cap used for this run.
  optional uint32 graph_row_limit = 18;
  repeated FindingEvaluationSourceSnapshot source_snapshots = 19;
  // source_dependency_complete is true only when every source/family read by a
  // graph rule was resolved and bound into source_snapshots.
  optional bool source_dependency_complete = 20;
  // rule_applicable distinguishes a real evaluation from stale-finding cleanup
  // for a rule that no longer supports the trigger runtime.
  optional bool rule_applicable = 21;
}

// GraphEvidencePath captures one supporting graph edge for a graph-backed finding.
message GraphEvidencePath {
  string from_urn = 1;
  string from_label = 2;
  string from_type = 3;
  string relation = 4;
  string to_urn = 5;
  string to_label = 6;
  string to_type = 7;
  map<string, string> attributes = 8;
  string observed_at = 9;
}

// GraphEvidenceRow captures one rule-specific graph row and its supporting paths.
message GraphEvidenceRow {
  string label = 1;
  map<string, string> attributes = 2;
  repeated GraphEvidencePath paths = 3;
}

// FindingRiskFactor explains one scoring contributor and its supporting material.
message FindingRiskFactor {
  string factor_id = 1;
  int32 weight = 2;
  string severity_contribution = 3;
  repeated string evidence_refs = 4;
  google.protobuf.Timestamp observed_at = 5;
  string category = 6;
  string suppression_scope = 7;
}

// FindingEvidenceObservation captures one observed occurrence of a deduplicated evidence record.
message FindingEvidenceObservation {
  string run_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  repeated string claim_ids = 3;
  repeated string event_ids = 4;
  repeated string graph_root_urns = 5;
  repeated string graph_path_urns = 6;
  repeated GraphEvidenceRow graph_rows = 7;
}

// FindingEvidence links one persisted finding and one evaluation run to its supporting claims, events, graph roots, and graph rows.
message FindingEvidence {
  string id = 1;
  string runtime_id = 2;
  string rule_id = 3;
  string finding_id = 4;
  string run_id = 5;
  repeated string claim_ids = 6;
  repeated string event_ids = 7;
  repeated string graph_root_urns = 8;
  google.protobuf.Timestamp created_at = 9;
  repeated GraphEvidenceRow graph_rows = 10;
  google.protobuf.Timestamp last_observed_at = 11;
  map<string, string> attributes = 12;
  repeated string graph_path_urns = 13;
  repeated string run_ids = 14;
  uint32 observation_count = 15;
  repeated FindingEvidenceObservation observations = 16;
}

enum FindingStatus {
  FINDING_STATUS_UNSPECIFIED = 0;
  FINDING_STATUS_OPEN = 1;
  FINDING_STATUS_RESOLVED = 2;
  FINDING_STATUS_SUPPRESSED = 3;
}

enum FindingOrder {
  FINDING_ORDER_UNSPECIFIED = 0;
  FINDING_ORDER_LAST_OBSERVED = 1;
  FINDING_ORDER_PRIORITY = 2;
  FINDING_ORDER_RISK_SCORE = 3;
}

// FindingControlRef maps one finding to one compliance framework control.
message FindingControlRef {
  string framework_name = 1;
  string control_id = 2;
}

// FindingNote captures one analyst note attached to one finding.
message FindingNote {
  string id = 1;
  string body = 2;
  google.protobuf.Timestamp created_at = 3;
}

// FindingTicket captures one external ticket reference attached to one finding.
message FindingTicket {
  string url = 1;
  string name = 2;
  string external_id = 3;
  google.protobuf.Timestamp linked_at = 4;
}

// FindingExternalRef captures a source-native alert or case lifecycle reference attached to a finding.
message FindingExternalRef {
  string system = 1;
  string kind = 2;
  string external_id = 3;
  string url = 4;
  string external_status = 5;
  string external_status_reason = 6;
  string lifecycle_owner = 7;
  google.protobuf.Timestamp observed_at = 8;
}

// Finding is the normalized persisted finding view for the runtime evaluator.
message Finding {
  string id = 1;
  string fingerprint = 2;
  string tenant_id = 3;
  string runtime_id = 4;
  string rule_id = 5;
  string title = 6;
  string severity = 7;
  FindingStatus status = 8;
  string summary = 9;
  repeated string resource_urns = 10;
  repeated string event_ids = 11;
  map<string, string> attributes = 12;
  google.protobuf.Timestamp first_observed_at = 13;
  google.protobuf.Timestamp last_observed_at = 14;
  string assignee = 15;
  string status_reason = 16;
  google.protobuf.Timestamp status_updated_at = 17;
  repeated string observed_policy_ids = 18;
  string policy_id = 19;
  string policy_name = 20;
  string check_id = 21;
  string check_name = 22;
  repeated FindingControlRef control_refs = 23;
  google.protobuf.Timestamp due_at = 24;
  repeated FindingNote notes = 25;
  repeated FindingTicket tickets = 26;
  int32 risk_score = 27;
  int32 likelihood_score = 28;
  int32 impact_score = 29;
  int32 confidence_score = 30;
  string likelihood_level = 31;
  string impact_level = 32;
  repeated string risk_reasons = 33;
  string risk_model_version = 34;
  repeated FindingRiskFactor risk_factors = 35;
  repeated FindingExternalRef external_refs = 36;
}

// FindingCandidateRun is the durable audit envelope for one non-production candidate evaluation.
message FindingCandidateRun {
  string id = 1;
  string tenant_id = 2;
  string runtime_id = 3;
  string rule_id = 4;
  string status = 5;
  uint32 event_limit = 6;
  uint32 events_evaluated = 7;
  uint32 events_matched = 8;
  uint32 candidates = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  string error = 12;
}

// FindingCandidate stores a reviewed candidate finding snapshot outside production alerts.
message FindingCandidate {
  string id = 1;
  string tenant_id = 2;
  string runtime_id = 3;
  string rule_id = 4;
  string fingerprint = 5;
  string status = 6;
  Finding finding = 7;
  repeated FindingEvidence evidence = 8;
  string last_run_id = 9;
  uint32 observation_count = 10;
  google.protobuf.Timestamp first_observed_at = 11;
  google.protobuf.Timestamp last_observed_at = 12;
  string promoted_finding_id = 13;
  string decision_id = 14;
  string promoted_by = 15;
  string promotion_rationale = 16;
  string change_ticket = 17;
  google.protobuf.Timestamp promoted_at = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  string rejected_by = 21;
  string rejection_rationale = 22;
  google.protobuf.Timestamp rejected_at = 23;
}
