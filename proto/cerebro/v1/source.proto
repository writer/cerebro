syntax = "proto3";

package cerebro.v1;

option go_package = "github.com/writer/cerebro/gen/cerebro/v1;cerebrov1";

import "google/protobuf/timestamp.proto";

// SourceSpec describes a source integration in the Source CDK.
message SourceSpec {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string emitted_kinds = 4;
}

// SourceCursor is an opaque continuation token returned by a source.
message SourceCursor {
  string opaque = 1;
}

// SourceCheckpoint records the latest durable watermark emitted by a source.
message SourceCheckpoint {
  google.protobuf.Timestamp watermark = 1;
  string cursor_opaque = 2;
}

// SourceExecutionPlanV1 is the compiled, credential-free contract for one
// bounded provider read. Runtime workers consume this message; they never read
// connector YAML or receive credential material.
message SourceExecutionPlanV1 {
  string plan_id = 1;
  string source_id = 2;
  string family_id = 3;
  string provider_kernel = 4;
  string method = 5;
  string origin = 6;
  string path = 7;
  string record_selector = 8;
  string id_field = 9;
  string singleton_fallback_id = 10;
  uint64 max_response_bytes = 11;
  string event_kind = 12;
  string schema_ref = 13;
  repeated string required_attributes = 14;
  repeated string required_payload_fields = 15;
  string plan_digest_sha256 = 16;
}

// SourceWorkerExecutionContextV1 is trusted host state for one bounded page.
// Provider response fields cannot supply or override any value in this message.
message SourceWorkerExecutionContextV1 {
  string tenant_id = 1;
  string runtime_id = 2;
  string logical_page_id = 3;
  string prior_cursor = 4;
  uint64 runtime_generation = 5;
  uint64 lease_generation = 6;
  int64 observed_at_unix_millis = 7;
}

// SourceWorkerPlanRequestV1 closes request planning over a compiled plan and
// trusted execution context. It contains no credential material.
message SourceWorkerPlanRequestV1 {
  SourceExecutionPlanV1 plan = 1;
  SourceWorkerExecutionContextV1 context = 2;
}

// SourceWorkerHTTPRequestV1 is a safe request plan returned by the
// capability-free Rust worker. The Go host owns credential redemption,
// authorization headers, DNS, egress, redirects, deadlines, and network I/O.
message SourceWorkerHTTPRequestV1 {
  string plan_id = 1;
  string method = 2;
  string url = 3;
  string accept = 4;
  uint64 max_response_bytes = 5;
  string plan_digest_sha256 = 6;
  string request_intent_digest = 7;
}

// SourceWorkerDecodeRequestV1 carries only bounded provider output and safe
// execution identity into the capability-free Rust decoder.
message SourceWorkerDecodeRequestV1 {
  SourceExecutionPlanV1 plan = 1;
  uint32 status_code = 2;
  bytes response_body = 3;
  string logical_page_id = 4;
  string request_intent_digest = 5;
  SourceWorkerSafeReceiptV1 receipt = 6;
  SourceWorkerExecutionContextV1 context = 7;
}

// SourceWorkerSafeReceiptV1 binds normalized output to bounded provider-safe
// execution evidence. It contains no credential, response body, or private route.
message SourceWorkerSafeReceiptV1 {
  string plan_digest_sha256 = 1;
  string logical_page_id = 2;
  string request_intent_digest = 3;
  uint64 runtime_generation = 4;
  uint64 lease_generation = 5;
  string credential_operation = 6;
  uint32 status_code = 7;
  uint64 response_bytes = 8;
  string response_sha256 = 9;
  string tenant_id = 10;
  string runtime_id = 11;
  int64 observed_at_unix_millis = 12;
}

// SourceWorkerRuntimeMetadataV2 carries validated public resume inputs that
// are additive to the stable v1 adapter messages. It contains no credentials.
message SourceWorkerRuntimeMetadataV2 {
  map<string, string> public_config = 1;
  int64 prior_terminal_watermark_unix_millis = 2;
  string prior_checkpoint = 3;
}

// SourceWorkerPlanEnvelopeV2 adds public runtime metadata without changing
// existing provider adapter request structs.
message SourceWorkerPlanEnvelopeV2 {
  SourceWorkerPlanRequestV1 request = 1;
  SourceWorkerRuntimeMetadataV2 metadata = 2;
}

// SourceWorkerHTTPExecutionV2 adds a non-secret body and declared public
// headers to the stable v1 request plan.
message SourceWorkerHTTPExecutionV2 {
  SourceWorkerHTTPRequestV1 request = 1;
  bytes body = 2;
  map<string, string> declared_headers = 3;
  string execution_intent_digest_sha256 = 4;
  string credential_operation = 5;
  // Exact public origin authorized by the credential-free Rust adapter.
  string allowed_origin = 6;
}

// SourceWorkerDecodeEnvelopeV2 carries bounded response metadata and the
// same durable resume inputs used during planning.
message SourceWorkerDecodeEnvelopeV2 {
  SourceWorkerDecodeRequestV1 request = 1;
  SourceWorkerRuntimeMetadataV2 metadata = 2;
  map<string, string> response_headers = 3;
  string response_headers_sha256 = 4;
  string execution_intent_digest_sha256 = 5;
}

// SourceWorkerDecodeOutputV2 returns the Rust-constructed safe receipt and
// normalized result together so the host never authors receipt digests.
message SourceWorkerDecodeOutputV2 {
  SourceWorkerSafeReceiptV1 receipt = 1;
  SourceWorkerDecodeResultV1 result = 2;
}

// SourceWorkerRecordV1 is one normalized, credential-free provider record.
message SourceWorkerRecordV1 {
  string provider_id = 1;
  map<string, string> attributes = 2;
  bytes payload_json = 3;
  string event_id = 4;
  int64 occurred_at_unix_millis = 5;
}

// SourceWorkerDecodeResultV1 binds normalized records to the exact plan and
// logical page. Singleton families leave next_cursor empty.
message SourceWorkerDecodeResultV1 {
  string plan_id = 1;
  string plan_digest_sha256 = 2;
  string logical_page_id = 3;
  string request_intent_digest = 4;
  repeated SourceWorkerRecordV1 records = 5;
  string next_cursor = 6;
  string result_digest_sha256 = 7;
  string tenant_id = 8;
  string runtime_id = 9;
  uint64 runtime_generation = 10;
  uint64 lease_generation = 11;
  int64 observed_at_unix_millis = 12;
}
