        - "**/*.scala"
        - "**/*.sc"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/test/**"
        - "**/*Test.scala"
        - "**/generated/**"
    pattern-regex: \b(\w*([Tt]oken|[Ss]ecret|[Pp]assword|apiKey|ApiKey|api[_-]?key)\w*\s*=\s*[^\n]*(new\s+Random|Random\.)|(new\s+Random|Random\.)[^\n]*([Tt]oken|[Ss]ecret|[Pp]assword|apiKey|ApiKey|api[_-]?key))
  - id: scala.security.insecure-tls-trust-all
    languages:
      - scala
    message: "Do not trust all TLS certificates: Do not add trust-all hostname
