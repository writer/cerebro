        - "**/*.scala"
        - "**/*.sc"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/test/**"
        - "**/*Test.scala"
        - "**/generated/**"
    pattern-regex: \b(NoopHostnameVerifier|ALLOW_ALL_HOSTNAME_VERIFIER|InsecureTrustManagerFactory|trustAllCerts|TrustAllStrategy)\b|checkServerTrusted\s*\([^\n]*\)\s*=\s*\(\)
  - id: scala.security.java-deserialization
    languages:
      - scala
    message: "Avoid Java native deserialization: Do not add ObjectInputStream or
