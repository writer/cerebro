  - id: scala.security.crypto-random-for-secrets
    languages:
      - scala
    message: "Use SecureRandom for secrets: Do not create tokens, passwords,
      secrets, or API keys with scala.util.Random or java.util.Random."
    severity: ERROR
    metadata:
      practice_id: scala.security.crypto-random-for-secrets
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: scala/secure-random-for-secrets.yml
    paths:
