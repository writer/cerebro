        - src/**/*.rs
        - crates/**/*.rs
        - services/**/*.rs
        - apps/**/*.rs
      exclude:
        - target/**
        - vendor/**
        - "**/generated/**"
        - "**/tests/**"
        - tests/**
    pattern-regex: \bunsafe\s*\{
  - id: scala.effects.no-await-result-in-services
    languages:
      - scala
    message: "Do not block on futures in services: Do not add Await.result or
      blocking waits in service code."
    severity: ERROR
    metadata:
      practice_id: scala.effects.no-await-result-in-services
