        - server/src/**/*.scala
        - src/**/*.scala
        - apps/**/*.scala
        - services/**/*.scala
      exclude:
        - legacy/**
        - "**/generated/**"
        - server/test/**
        - "**/*Spec.scala"
    pattern-regex: \.unsafeRunSync\s*\(
  - id: scala.errors.typed-errors
    languages:
      - scala
    message: "Return typed Scala errors at service boundaries: Use Either,
      Validated, IO.raiseError with domain errors, or the local effect error
      convention at service boundaries."
    severity: WARNING
    metadata:
      practice_id: scala.errors.typed-errors
      status: preferred
