# Generated from practices/*.yml. Edit practice records, then run practice generate-semgrep.
rules:
  - id: python.db.parameterized-sql
    languages:
      - python
    message: "Parameterize SQL values: Do not build SQL statements by interpolating
      values into query strings."
    severity: ERROR
    metadata:
      practice_id: python.db.parameterized-sql
      status: banned
      enforcement: blocking
      owner: data-platform
      source_file: python/parameterized-sql.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
    pattern-regex: \b(execute|executemany)\s*\(\s*f["'][^\n]*(select|insert|update|delete)
  - id: python.defaults.no-mutable-defaults
    languages:
      - python
    message: "Do not use mutable default arguments: Do not add list, dict, set, or
      bytearray values as Python function defaults."
    severity: ERROR
    metadata:
      practice_id: python.defaults.no-mutable-defaults
      status: banned
      enforcement: blocking
      owner: backend-platform
      source_file: python/no-mutable-defaults.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - tests/**
        - "**/tests/**"
    pattern-regex: \bdef\s+\w+\s*\([^\n)]*=\s*(\[\]|\{\}|set\s*\(\)|list\s*\(\)|dict\s*\(\)|bytearray\s*\(\))
  - id: python.errors.no-broad-except-without-context
    languages:
      - python
    message: "Keep exception handlers specific: Avoid broad except blocks unless
      they add context and re-raise or return a defined error state."
    severity: WARNING
    metadata:
      practice_id: python.errors.no-broad-except-without-context
      status: discouraged
      enforcement: advisory
      owner: backend-platform
      source_file: python/broad-except.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
    pattern-regex: "\\bexcept\\s+(Exception)?\\s*:"
  - id: python.http.client-timeout
    languages:
      - python
    message: "Set timeouts on Python HTTP calls: Do not add outbound requests or
      httpx calls without an explicit timeout."
    severity: WARNING
    metadata:
      practice_id: python.http.client-timeout
      status: discouraged
      enforcement: advisory
      owner: backend-platform
      source_file: python/http-client-timeout.yml
    paths:
      include:
        - src/**/*.py
        - services/**/*.py
        - apps/**/*.py
        - packages/**/*.py
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - tests/**
        - "**/tests/**"
        - scripts/**
    pattern-regex: \b(requests|httpx)\.(get|post|put|patch|delete|request)\s*\((?![^\n)]*timeout\s*=)[^\n)]*\)
  - id: python.logging.no-fstring-logs
    languages:
      - python
    message: "Use structured fields in Python logs: Do not add f-string logger
      messages in Python service code."
    severity: WARNING
    metadata:
      practice_id: python.logging.no-fstring-logs
      status: discouraged
      enforcement: advisory
      owner: observability
      source_file: python/no-fstring-logs.yml
    paths:
      include:
        - src/**/*.py
        - services/**/*.py
        - apps/**/*.py
        - packages/**/*.py
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - tests/**
        - "**/tests/**"
        - scripts/**
    pattern-regex: \blogger\.(debug|info|warn|warning|error|exception)\s*\(\s*f["']
  - id: python.logging.no-print-in-services
    languages:
      - python
    message: "Use structured logging in Python services: Do not add print statements
      to service code."
    severity: WARNING
    metadata:
      practice_id: python.logging.no-print-in-services
      status: discouraged
      enforcement: advisory
      owner: observability
      source_file: python/no-print-in-services.yml
    paths:
      include:
        - services/**/*.py
        - apps/**/*.py
        - src/**/*.py
      exclude:
        - scripts/**
        - notebooks/**
        - legacy/**
    pattern-regex: \bprint\s*\(
  - id: python.security.crypto-random-for-secrets
    languages:
      - python
    message: "Use cryptographic randomness for secrets: Do not create tokens,
      passwords, secrets, or API keys with the random module."
    severity: ERROR
    metadata:
      practice_id: python.security.crypto-random-for-secrets
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/secure-random.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(\w*(token|secret|password|api[_-]?key)\w*\s*=\s*[^\n]*random\.(random|randint|randrange|choice|choices|sample)\s*\(|random\.(random|randint|randrange|choice|choices|sample)\s*\([^\n]*(token|secret|password|api[_-]?key))
  - id: python.security.insecure-tls-verification
    languages:
      - python
    message: "Keep TLS certificate verification on: Do not disable TLS certificate
      verification in Python HTTP clients or SSL contexts."
    severity: ERROR
    metadata:
      practice_id: python.security.insecure-tls-verification
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/insecure-tls-verification.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(verify\s*=\s*False|ssl\._create_unverified_context\s*\(|cert_reqs\s*=\s*["']CERT_NONE["']|ssl\.CERT_NONE)
  - id: python.security.jwt-signature-verification
    languages:
      - python
    message: "Verify JWT signatures: Do not decode JWTs with signature verification
      disabled or with the none algorithm."
    severity: ERROR
    metadata:
      practice_id: python.security.jwt-signature-verification
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/jwt-verify-signature.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(options\s*=\s*\{[^\n]*["']verify_signature["']\s*:\s*False|verify_signature\s*=\s*False|algorithms\s*=\s*\[\s*["']none["']\s*\])
  - id: python.security.no-debug-mode
    languages:
      - python
    message: "Keep Python debug mode out of service code: Do not enable framework
      debug mode in Python service code."
    severity: ERROR
    metadata:
      practice_id: python.security.no-debug-mode
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-debug-mode.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(DEBUG\s*=\s*True|debug\s*=\s*True|app\.run\s*\([^\n]*debug\s*=\s*True)
  - id: python.security.no-eval-exec
    languages:
      - python
    message: "Do not evaluate Python strings as code: Do not add eval, exec, or
      compile for request, job, or configuration data."
    severity: ERROR
    metadata:
      practice_id: python.security.no-eval-exec
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-eval-exec.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(eval|exec|compile)\s*\(
  - id: python.security.no-fast-password-hash
    languages:
      - python
    message: "Use password hashing libraries for passwords: Do not hash passwords
      with hashlib digest functions."
    severity: ERROR
    metadata:
      practice_id: python.security.no-fast-password-hash
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-fast-password-hash.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(\w*(password|passwd|pwd)\w*\s*=\s*hashlib\.(md5|sha1|sha256|sha512)\s*\(|hashlib\.(md5|sha1|sha256|sha512)\s*\([^\n]*(password|passwd|pwd))
  - id: python.security.no-request-path-file-access
    languages:
      - python
    message: "Do not open request paths directly: Do not pass request parameters
      directly to file open, Path, or send_file helpers."
    severity: ERROR
    metadata:
      practice_id: python.security.no-request-path-file-access
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-request-path-file-access.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b((open|send_file|send_from_directory)\s*\([^\n]*(request\.(args|form|json|values)|flask\.request|req\.)|Path\s*\([^\n]*(request\.(args|form|json|values)|flask\.request|req\.))
  - id: python.security.no-request-url-fetch
    languages:
      - python
    message: "Do not fetch request-controlled URLs: Do not pass request parameters
      directly to outbound HTTP clients."
    severity: ERROR
    metadata:
      practice_id: python.security.no-request-url-fetch
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-ssrf-from-request.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(requests|httpx)\.(get|post|put|patch|delete|request)\s*\([^\n]*(request\.(args|form|json|values)|flask\.request|req\.)
  - id: python.security.no-sqlalchemy-text-fstring
    languages:
      - python
    message: "Parameterize SQLAlchemy text queries: Do not pass f-string SQL to
      SQLAlchemy text, session.execute, or connection.execute."
    severity: ERROR
    metadata:
      practice_id: python.security.no-sqlalchemy-text-fstring
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-sqlalchemy-text-fstring.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(text|session\.execute|connection\.execute)\s*\(\s*f["'][^\n]*(select|insert|update|delete)
  - id: python.security.no-tempfile-mktemp
    languages:
      - python
    message: "Use safe temporary file APIs: Do not use tempfile.mktemp."
    severity: ERROR
    metadata:
      practice_id: python.security.no-tempfile-mktemp
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-tempfile-mktemp.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \btempfile\.mktemp\s*\(
  - id: python.security.no-template-autoescape-off
    languages:
      - python
    message: "Keep template autoescape enabled: Do not disable template autoescape
      in Python web code."
    severity: ERROR
    metadata:
      practice_id: python.security.no-template-autoescape-off
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-template-autoescape-off.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(autoescape\s*=\s*False|Environment\s*\([^\n]*autoescape\s*=\s*False)
  - id: python.security.unsafe-deserialization
    languages:
      - python
    message: "Avoid unsafe Python deserialization: Do not deserialize untrusted
      bytes with pickle, dill, marshal, or unsafe YAML loaders."
    severity: ERROR
    metadata:
      practice_id: python.security.unsafe-deserialization
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/unsafe-deserialization.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b((pickle|dill|marshal)\.(load|loads)\s*\(|yaml\.(unsafe_load|full_load)\s*\(|yaml\.load\s*\([^\n]*(Loader\s*=\s*yaml\.(UnsafeLoader|FullLoader)|Loader\s*=\s*UnsafeLoader|Loader\s*=\s*FullLoader))
  - id: python.security.unsafe-xml-parsing
    languages:
      - python
    message: "Use hardened XML parsers: Do not parse untrusted XML with standard
      library or lxml default parsers."
    severity: ERROR
    metadata:
      practice_id: python.security.unsafe-xml-parsing
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/unsafe-xml-parsing.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b((xml\.etree\.ElementTree|ElementTree|ET)\.(fromstring|parse)\s*\(|(xml\.dom\.minidom|minidom)\.(parse|parseString)\s*\(|lxml\.etree\.(fromstring|parse)\s*\()
  - id: python.subprocess.no-shell-true
    languages:
      - python
    message: "Avoid shell=True for subprocess calls: Do not add subprocess calls
      with shell=True."
    severity: ERROR
    metadata:
      practice_id: python.subprocess.no-shell-true
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: python/no-shell-true.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
    pattern-regex: \b(subprocess\.(run|call|check_call|check_output)\([^\n#]*shell\s*=\s*True|os\.system\s*\()
  - id: python.time.utc-aware-datetime
    languages:
      - python
    message: "Use timezone-aware UTC datetimes: Use timezone-aware UTC datetimes for
      persisted values, job scheduling, and external API timestamps."
    severity: WARNING
    metadata:
      practice_id: python.time.utc-aware-datetime
      status: preferred
      enforcement: advisory
      owner: backend-platform
      source_file: python/utc-aware-datetime.yml
    paths:
      include:
        - "**/*.py"
      exclude:
        - legacy/**
    pattern-regex: \bdatetime\.(utcnow|now)\s*\(\s*\)
  - id: python.writer.async-background-work
    languages:
      - python
    message: "Run Python consumers from FastAPI lifespan: Do not start long-running
      consumers or schedulers with ad-hoc asyncio.create_task calls."
    severity: WARNING
    metadata:
      practice_id: python.writer.async-background-work
      status: discouraged
      enforcement: advisory
      owner: backend-platform
      source_file: python/async-background-work.yml
    paths:
      include:
        - src/**/*.py
        - services/**/*.py
        - apps/**/*.py
        - packages/**/*.py
      exclude:
        - tests/**
        - scripts/**
        - legacy/**
        - notebooks/**
    pattern-regex: \basyncio\.create_task\s*\(
  - id: python.writer.newtype-domain-branding
    languages:
      - python
    message: "Separate boundary validation from Python domain branding: Do not
      combine NewType and Annotated in one alias; validate at the boundary and
      use NewType inside domain code."
    severity: WARNING
    metadata:
      practice_id: python.writer.newtype-domain-branding
      status: discouraged
      enforcement: advisory
      owner: backend-platform
      source_file: python/newtype-domain-branding.yml
    paths:
      include:
        - src/**/*.py
        - services/**/*.py
        - apps/**/*.py
        - packages/**/*.py
      exclude:
        - legacy/**
        - notebooks/**
    pattern-regex: \bNewType\s*\(\s*["'][^"']+["']\s*,\s*Annotated\s*\[
  - id: python.writer.typed-settings
    languages:
      - python
    message: "Load Python service configuration through typed settings: Do not read
      environment variables throughout Python service code; parse configuration
      once with pydantic-settings."
    severity: WARNING
    metadata:
      practice_id: python.writer.typed-settings
      status: discouraged
      enforcement: advisory
      owner: backend-platform
      source_file: python/typed-settings.yml
    paths:
      include:
        - src/**/*.py
        - services/**/*.py
        - apps/**/*.py
        - packages/**/*.py
      exclude:
        - "**/config.py"
        - tests/**
        - scripts/**
        - legacy/**
        - notebooks/**
    pattern-regex: \b(os\.getenv\s*\(|os\.environ(?:\.get\s*\(|\s*\[))
  - id: rust.http.no-insecure-tls-verification
    languages:
      - rust
    message: "Keep TLS verification enabled in Rust clients: Do not accept invalid
      TLS certificates or hostnames in Rust HTTP clients."
    severity: ERROR
    metadata:
      practice_id: rust.http.no-insecure-tls-verification
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: rust/no-insecure-tls.yml
    paths:
      include:
        - src/**/*.rs
        - crates/**/*.rs
        - services/**/*.rs
        - apps/**/*.rs
      exclude:
        - target/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \.danger_accept_invalid_(?:certs|hostnames)\s*\(\s*true\s*,?\s*\)
  - id: rust.process.no-shell-command
    languages:
      - rust
    message: "Execute Rust child processes without a shell: Do not launch sh, bash,
      zsh, cmd, or PowerShell from production Rust code."
    severity: ERROR
    metadata:
      practice_id: rust.process.no-shell-command
      status: banned
      enforcement: blocking
      owner: security-platform
      source_file: rust/no-shell-command.yml
    paths:
      include:
        - src/**/*.rs
        - crates/**/*.rs
        - services/**/*.rs
        - apps/**/*.rs
      exclude:
        - target/**
        - fixtures/**
        - testdata/**
        - "**/tests/**"
        - tests/**
    pattern-regex: \b(?:std::process::|tokio::process::)?Command::new\s*\(\s*"(?:sh|bash|zsh|cmd(?:\.exe)?|powershell(?:\.exe)?|pwsh)"\s*,?\s*\)
  - id: rust.safety.document-unsafe-invariants
    languages:
      - rust
    message: "Document the invariant for each Rust unsafe block: Keep unsafe code in
      a narrow boundary with a SAFETY comment that states the caller, lifetime,
