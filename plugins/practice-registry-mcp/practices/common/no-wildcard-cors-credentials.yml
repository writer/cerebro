id: security.cors.no-wildcard-credentials
title: Do not combine wildcard CORS with credentials
status: banned
enforcement: blocking
summary: Do not allow credentials when CORS origins include the wildcard origin.
rationale: Credentialed wildcard CORS weakens the browser origin boundary and can expose authenticated responses to unintended callers.
scope:
  languages: [python, scala, typescript, javascript, rust]
  frameworks: []
  paths:
    include: ["**/*.py", "**/*.scala", "**/*.sc", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.rs"]
    exclude: ["legacy/**", "fixtures/**", "testdata/**", "dist/**", "node_modules/**", "target/**", "**/tests/**", "tests/**", "**/test/**", "**/*Test.scala"]
applies_when:
  intents: ["cors", "cross-origin", "origin allowlist"]
  keywords: ["allow_credentials=True", "allow_origins=[\"*\"]", "supportsCredentials=true", "allowedOrigins=[\"*\"]"]
avoid:
  - 'allow_origins=["*"], allow_credentials=True'
  - 'allowedOrigins = List("*"), supportsCredentials = true'
use_instead:
  - List the allowed application origins explicitly.
  - Keep credentials disabled for public wildcard CORS responses.
good_examples:
  - 'allow_origins=["https://app.writer.com"], allow_credentials=True'
bad_examples:
  - 'allow_origins=["*"], allow_credentials=True'
semgrep:
  severity: ERROR
  pattern_regex: "\\b(allow_credentials\\s*=\\s*True[^\\n]*allow_origins\\s*=\\s*\\[[^\\n]*[\"']\\*[\"']|allow_origins\\s*=\\s*\\[[^\\n]*[\"']\\*[\"'][^\\n]*allow_credentials\\s*=\\s*True|supportsCredentials\\s*=\\s*true[^\\n]*allowedOrigins[^\\n]*[\"']\\*[\"'])"
  languages: [python, scala, typescript, javascript, rust]
owner: security-platform
last_reviewed: 2026-07-01
