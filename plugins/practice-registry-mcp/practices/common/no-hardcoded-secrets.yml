id: security.secrets.no-hardcoded-secrets
title: Keep secrets out of source code
status: banned
enforcement: blocking
summary: Do not add tokens, credentials, private keys, or service secrets to source files.
rationale: Secrets in source code spread through clones, logs, packages, and long-lived repository history.
scope:
  languages: [python, scala, typescript, javascript, rust]
  frameworks: []
  paths:
    include: ["**/*.py", "**/*.scala", "**/*.sc", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.rs", "**/*.conf", "**/*.env", "**/*.yml", "**/*.yaml"]
    exclude: ["dist/**", "node_modules/**", "target/**", "fixtures/**", "testdata/**"]
applies_when:
  intents: ["configuration", "secret", "token", "credential", "api key"]
  keywords: ["api_key", "secret", "token", "password", "private_key", "BEGIN PRIVATE KEY", "AKIA"]
avoid:
  - Literal credentials in source files.
  - Test secrets that look valid or reusable.
use_instead:
  - Secret manager references.
  - Environment variable names with documented ownership.
good_examples:
  - val token = config.requireSecret("vendor.token")
bad_examples:
  - api_key = "sk_live_..."
semgrep:
  severity: ERROR
  pattern_regex: "(sk_live_[A-Za-z0-9_\\-]+|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----)"
  languages: [python, scala, typescript, javascript, rust]
owner: security-platform
last_reviewed: 2026-06-30
