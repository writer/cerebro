id: python.security.no-fast-password-hash
title: Use password hashing libraries for passwords
status: banned
enforcement: blocking
summary: Do not hash passwords with hashlib digest functions.
rationale: Fast general-purpose digests do not provide password-specific salts, work factors, or memory hardness.
scope:
  languages: [python]
  frameworks: []
  paths:
    include: ["**/*.py"]
    exclude: ["legacy/**", "fixtures/**", "testdata/**", "**/tests/**", "tests/**"]
applies_when:
  intents: ["password hash", "password storage", "credential storage"]
  keywords: ["hashlib.sha256(password", "hashlib.sha512(password", "password_hash = hashlib"]
avoid:
  - 'password_hash = hashlib.sha256(password.encode()).hexdigest()'
  - 'hashlib.md5(password).hexdigest()'
use_instead:
  - Use the approved password hashing library with per-password salts and configured work factors.
  - Store password verifier metadata with the hash format used by the library.
good_examples:
  - 'password_hash = password_hasher.hash(password)'
bad_examples:
  - 'password_hash = hashlib.sha256(password.encode()).hexdigest()'
semgrep:
  severity: ERROR
  pattern_regex: "\\b(\\w*(password|passwd|pwd)\\w*\\s*=\\s*hashlib\\.(md5|sha1|sha256|sha512)\\s*\\(|hashlib\\.(md5|sha1|sha256|sha512)\\s*\\([^\\n]*(password|passwd|pwd))"
owner: security-platform
last_reviewed: 2026-07-01
