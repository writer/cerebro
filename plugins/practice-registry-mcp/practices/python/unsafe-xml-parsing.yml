id: python.security.unsafe-xml-parsing
title: Use hardened XML parsers
status: banned
enforcement: blocking
summary: Do not parse untrusted XML with standard library or lxml default parsers.
rationale: Default XML parsers can process attacker-controlled structures before application validation runs.
scope:
  languages: [python]
  frameworks: []
  paths:
    include: ["**/*.py"]
    exclude: ["legacy/**", "fixtures/**", "testdata/**", "**/tests/**", "tests/**"]
applies_when:
  intents: ["xml", "xml parse", "feed parser", "document import"]
  keywords: ["ElementTree.fromstring", "ElementTree.parse", "minidom.parseString", "lxml.etree.fromstring"]
avoid:
  - 'ElementTree.fromstring(payload)'
  - 'minidom.parseString(payload)'
use_instead:
  - Use defusedxml for untrusted XML payloads.
  - Prefer JSON or a typed schema when the integration does not require XML.
good_examples:
  - 'from defusedxml import ElementTree'
bad_examples:
  - 'root = ElementTree.fromstring(payload)'
semgrep:
  severity: ERROR
  pattern_regex: "\\b((xml\\.etree\\.ElementTree|ElementTree|ET)\\.(fromstring|parse)\\s*\\(|(xml\\.dom\\.minidom|minidom)\\.(parse|parseString)\\s*\\(|lxml\\.etree\\.(fromstring|parse)\\s*\\()"
owner: security-platform
last_reviewed: 2026-07-01
