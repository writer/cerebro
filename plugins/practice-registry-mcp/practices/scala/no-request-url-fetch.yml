id: scala.security.no-request-url-fetch
title: Do not fetch request-controlled URLs
status: banned
enforcement: blocking
summary: Do not pass request parameters directly to outbound HTTP clients.
rationale: Server-side fetches of caller-supplied URLs can reach internal metadata services, private network hosts, and service-only endpoints.
scope:
  languages: [scala]
  frameworks: []
  paths:
    include: ["**/*.scala", "**/*.sc"]
    exclude: ["legacy/**", "fixtures/**", "testdata/**", "**/test/**", "**/*Test.scala", "**/generated/**"]
applies_when:
  intents: ["ssrf", "webhook", "url fetch", "outbound http"]
  keywords: ["requests.get(request.", "HttpRequest(request.", "getParameter(\"url\")"]
avoid:
  - 'requests.get(request.getParameter("url"))'
  - 'HttpRequest(uri = req.query("url"))'
use_instead:
  - Resolve destinations from an allowlisted integration record.
  - Validate scheme, host, port, redirects, and private-network ranges before fetching.
good_examples:
  - 'integrationClient.fetch(allowedDestinationId)'
bad_examples:
  - 'requests.get(request.getParameter("url"))'
semgrep:
  severity: ERROR
  pattern_regex: "\\b(requests\\.(get|post|put|delete)|HttpRequest|basicRequest)\\s*\\([^\\n]*(request\\.|req\\.|getParameter\\s*\\()"
owner: security-platform
last_reviewed: 2026-07-01
