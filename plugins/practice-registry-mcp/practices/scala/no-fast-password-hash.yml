id: scala.security.no-fast-password-hash
title: Use password hashing libraries for passwords
status: banned
enforcement: blocking
summary: Do not hash passwords with MessageDigest.
rationale: Fast general-purpose digests do not provide password-specific salts, work factors, or memory hardness.
scope:
  languages: [scala]
  frameworks: []
  paths:
    include: ["**/*.scala", "**/*.sc"]
    exclude: ["legacy/**", "fixtures/**", "testdata/**", "**/test/**", "**/*Test.scala", "**/generated/**"]
applies_when:
  intents: ["password hash", "password storage", "credential storage"]
  keywords: ["MessageDigest.getInstance", "passwordHash", "password hash"]
avoid:
  - 'MessageDigest.getInstance("SHA-256").digest(password.getBytes)'
  - 'MessageDigest.getInstance("MD5").digest(password.getBytes)'
use_instead:
  - Use the approved password hashing library with per-password salts and configured work factors.
  - Store password verifier metadata with the hash format used by the library.
good_examples:
  - 'val passwordHash = passwordHasher.hash(password)'
bad_examples:
  - 'val passwordHash = MessageDigest.getInstance("SHA-256").digest(password.getBytes)'
semgrep:
  severity: ERROR
  pattern_regex: "\\b(\\w*([Pp]assword|passwd|pwd)\\w*[^\\n]*MessageDigest\\.getInstance\\s*\\(\\s*[\"'](MD5|SHA-1|SHA1|SHA-256|SHA-512)[\"']\\s*\\)|MessageDigest\\.getInstance\\s*\\(\\s*[\"'](MD5|SHA-1|SHA1|SHA-256|SHA-512)[\"']\\s*\\)[^\\n]*([Pp]assword|passwd|pwd))"
owner: security-platform
last_reviewed: 2026-07-01
