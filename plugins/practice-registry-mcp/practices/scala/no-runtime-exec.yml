id: scala.security.no-runtime-exec
title: Do not execute shell commands from Scala services
status: banned
enforcement: blocking
summary: Do not add Runtime.exec, ProcessBuilder, sh -c, or interpolated scala.sys.process commands in service code.
rationale: Shell and process execution paths make argument boundaries hard to audit and can turn input into command execution.
scope:
  languages: [scala]
  frameworks: []
  paths:
    include: ["**/*.scala", "**/*.sc"]
    exclude: ["legacy/**", "scripts/**", "fixtures/**", "testdata/**", "**/test/**", "**/*Test.scala", "**/generated/**"]
applies_when:
  intents: ["process", "shell", "command", "runtime exec"]
  keywords: ["Runtime.getRuntime().exec", "ProcessBuilder", "scala.sys.process", "sh -c"]
avoid:
  - 'Runtime.getRuntime().exec(command)'
  - 'Seq("sh", "-c", command).!'
use_instead:
  - Use an approved library API for the operation.
  - If a process is required, pass fixed executable names and argument lists through a reviewed wrapper.
good_examples:
  - 'approvedProcessRunner.run("git", List("status", "--short"))'
bad_examples:
  - 'Runtime.getRuntime().exec(command)'
semgrep:
  severity: ERROR
  pattern_regex: "\\b(Runtime\\.getRuntime\\(\\)\\.exec\\s*\\(|new\\s+ProcessBuilder\\s*\\(|Seq\\s*\\([^\\n]*[\"']sh[\"'][^\\n]*[\"']-c[\"']|s?[\"'][^\"']*\\$[^\"']*[\"']\\s*\\.!!?)"
owner: security-platform
last_reviewed: 2026-07-01
