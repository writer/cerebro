id: scala.security.crypto-random-for-secrets
title: Use SecureRandom for secrets
status: banned
enforcement: blocking
summary: Do not create tokens, passwords, secrets, or API keys with scala.util.Random or java.util.Random.
rationale: General-purpose random generators are not designed to protect generated credentials or bearer tokens.
scope:
  languages: [scala]
  frameworks: []
  paths:
    include: ["**/*.scala", "**/*.sc"]
    exclude: ["legacy/**", "fixtures/**", "testdata/**", "**/test/**", "**/*Test.scala", "**/generated/**"]
applies_when:
  intents: ["token", "password", "secret", "api key", "credential", "random"]
  keywords: ["Random.alphanumeric", "new Random", "resetToken", "apiKey"]
avoid:
  - 'val resetToken = Random.alphanumeric.take(32).mkString'
  - 'val apiKey = new Random().nextLong().toString'
use_instead:
  - Use java.security.SecureRandom through the approved token helper.
  - Use the approved identity or secret-issuing service when the token has account access.
good_examples:
  - 'val resetToken = secureTokenGenerator.urlSafe(32)'
bad_examples:
  - 'val resetToken = Random.alphanumeric.take(32).mkString'
semgrep:
  severity: ERROR
  pattern_regex: "\\b(\\w*([Tt]oken|[Ss]ecret|[Pp]assword|apiKey|ApiKey|api[_-]?key)\\w*\\s*=\\s*[^\\n]*(new\\s+Random|Random\\.)|(new\\s+Random|Random\\.)[^\\n]*([Tt]oken|[Ss]ecret|[Pp]assword|apiKey|ApiKey|api[_-]?key))"
owner: security-platform
last_reviewed: 2026-07-01
