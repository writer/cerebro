version: '3.8'

services:
  cerebro:
    build: .
    ports:
      - "8080:8080"
    environment:
      API_PORT: 8080
      LOG_LEVEL: info
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PRIVATE_KEY: ${SNOWFLAKE_PRIVATE_KEY:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-CEREBRO}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-CEREBRO}
      CEDAR_POLICIES_PATH: /app/policies
    volumes:
      - ./policies:/app/policies:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # CloudQuery sync with auto-generated DSN from key-pair env vars
  # Uses cerebro sync command which handles DSN generation internally
  cloudquery-sync:
    build: .
    volumes:
      - ./config:/app/config:ro
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/config/gcp-credentials.json
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PRIVATE_KEY: ${SNOWFLAKE_PRIVATE_KEY:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-CEREBRO}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
    command: ["sync", "--native=false", "--config", "/app/config/cloudquery.yml"]
    profiles:
      - sync  # Only run with: docker-compose --profile sync up cloudquery-sync

networks:
  default:
    name: cerebro-network
