version: '3.8'

services:
  cerebro:
    build: .
    ports:
      - "8080:8080"
    environment:
      API_PORT: 8080
      LOG_LEVEL: info
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PRIVATE_KEY: ${SNOWFLAKE_PRIVATE_KEY:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-CEREBRO}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW}
      CEDAR_POLICIES_PATH: /app/policies
    volumes:
      - ./policies:/app/policies:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # CloudQuery for syncing cloud assets
  cloudquery:
    image: ghcr.io/cloudquery/cloudquery:latest
    volumes:
      - ./config:/config:ro
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: /config/gcp-credentials.json
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      SNOWFLAKE_KEYPAIR_DSN: ${SNOWFLAKE_KEYPAIR_DSN:-}
    command: ["sync", "/config/cloudquery.yml"]
    profiles:
      - sync  # Only run with: docker-compose --profile sync up cloudquery

networks:
  default:
    name: cerebro-network
