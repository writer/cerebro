version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: cerebro
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cerebro-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cerebro:cerebro@postgres/cerebro
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src  # For development hot-reload
    command: uvicorn cerebro.api.main:app --host 0.0.0.0 --port 8000 --reload

  cerebro-worker:
    build: .
    environment:
      DATABASE_URL: postgresql://cerebro:cerebro@postgres/cerebro
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: celery -A cerebro.tasks.celery_app worker -l info
    scale: 2

  cerebro-beat:
    build: .
    environment:
      DATABASE_URL: postgresql://cerebro:cerebro@postgres/cerebro
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: celery -A cerebro.tasks.celery_app beat -l info

  flower:
    build: .
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A cerebro.tasks.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: cerebro-network
