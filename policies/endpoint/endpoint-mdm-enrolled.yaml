apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: endpoint-mdm-enrolled
    name: Endpoints Enrolled in MDM
    description: Ensures all corporate endpoints are enrolled in mobile device management
    tags:
        - endpoint
        - mdm
        - device-management
        - security
spec:
    severity: HIGH
    category: endpoint
    resourceType: endpoint
    match:
        query: SELECT e.id, e.email, e.name FROM employees e WHERE e.status = 'active' AND NOT EXISTS (SELECT 1 FROM endpoints ep WHERE ep.user_email = e.work_email AND ep.mdm_enrolled = true)
    remediation:
        summary: Enroll all corporate devices in MDM (Jamf, Kandji, Intune, etc.) for security monitoring and policy enforcement.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.8
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.8.1
            - A.8.7
        - name: NIST 800-53 r5
          controls:
            - SI-3
            - SI-4
            - CM-8
        - name: CIS Controls v8
          controls:
            - "1"
            - "10"
        - name: PCI DSS v4.0.1
          controls:
            - "5.2"
            - "5.3"
    enabled: true
