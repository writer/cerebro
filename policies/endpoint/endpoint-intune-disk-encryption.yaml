apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: endpoint-intune-disk-encryption
    name: Intune Devices Without Disk Encryption
    description: Identifies Intune-managed devices without disk encryption enabled
    tags:
        - endpoint
        - intune
        - encryption
        - disk-encryption
        - bitlocker
spec:
    severity: HIGH
    category: endpoint
    resourceType: intune_managed_device
    match:
        query: SELECT id, device_name, user_principal_name, operating_system, os_version FROM intune_managed_devices WHERE COALESCE(is_encrypted, false) = false
    remediation:
        summary: Enable BitLocker/FileVault via Intune compliance policies and enforce escrow of recovery keys.
    frameworks:
        - name: CIS Controls v8
          controls:
            - "3.6"
        - name: SOC 2
          controls:
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-28
        - name: HIPAA
          controls:
            - 164.312(a)(2)(iv)
        - name: PCI DSS v4.0.1
          controls:
            - 3.5.1
    enabled: true
