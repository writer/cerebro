apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: endpoint-sentinelone-active
    name: SentinelOne Agents Actively Reporting
    description: Ensures SentinelOne agents are installed and actively reporting on all endpoints
    tags:
        - endpoint
        - sentinelone
        - edr
        - monitoring
        - security
spec:
    severity: HIGH
    category: endpoint
    resourceType: sentinelone_agent
    match:
        query: SELECT id, computer_name, os_name, last_active_date FROM sentinelone_agents WHERE is_active = false OR last_active_date < DATEADD(day, -7, CURRENT_TIMESTAMP())
    remediation:
        summary: Investigate stale SentinelOne agents. Reinstall agent or remove device from inventory if no longer in use.
    frameworks:
        - name: SOC 2
          controls:
            - CC4
            - CC7
            - CC7.2
            - CC6.8
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.8.15
            - A.8.16
            - A.8.1
            - A.8.7
        - name: NIST 800-53 r5
          controls:
            - SI-3
            - SI-4
            - AU-2
            - AU-12
            - CM-8
        - name: CIS Controls v8
          controls:
            - "8"
            - "1"
            - "10"
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
            - "5.2"
            - "5.3"
    enabled: true
