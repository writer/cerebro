apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: endpoint-intune-noncompliant
    name: Intune Devices Not Compliant
    description: Identifies Intune-managed devices reporting a non-compliant state
    tags:
        - endpoint
        - intune
        - compliance
        - device-management
        - security
spec:
    severity: HIGH
    category: endpoint
    resourceType: intune_managed_device
    match:
        query: SELECT id, device_name, user_principal_name, compliance_state, operating_system, os_version FROM intune_managed_devices WHERE COALESCE(LOWER(compliance_state), '') != 'compliant'
    remediation:
        summary: Review non-compliant devices, remediate configuration gaps, and enforce Intune compliance policies.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.8
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.8.1
            - A.8.7
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - SI-3
            - SI-4
            - CM-8
        - name: CIS Controls v8
          controls:
            - "1"
            - "10"
        - name: PCI DSS v4.0.1
          controls:
            - "5.2"
            - "5.3"
    enabled: true
