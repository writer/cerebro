apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: endpoint-password-manager
    name: Password Manager Installed on Endpoints
    description: Ensures corporate endpoints have an approved password manager installed
    tags:
        - endpoint
        - password-manager
        - security
        - credentials
spec:
    severity: MEDIUM
    category: endpoint
    resourceType: endpoint
    match:
        query: SELECT id, hostname, os_type, user_email FROM endpoints WHERE password_manager_installed = false
    remediation:
        summary: Deploy approved password manager (1Password, LastPass, Bitwarden, etc.) to all corporate endpoints.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - C1.1
            - CC6.8
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
            - A.8.24
            - A.8.1
            - A.8.7
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - SC-12
            - SI-3
            - SI-4
            - CM-8
        - name: CIS Controls v8
          controls:
            - "6"
            - "1"
            - "10"
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "3.5"
            - "8.6"
            - "5.2"
            - "5.3"
    enabled: true
