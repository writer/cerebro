apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: endpoint-edr-reporting
    name: EDR Agents Actively Reporting
    description: EDR agents should be actively reporting to the console. Agents that haven't checked in recently may indicate offline devices or tampering
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - endpoint
        - edr
        - agent-health
        - monitoring
spec:
    severity: high
    effect: forbid
    resource: edr_agents
    match:
        conditions:
            - cmp_gt(path(resource, "days_since_last_seen"), 7)
            - cmp_eq(path(resource, "agent_status"), path(resource, "ACTIVE"))
        conditionFormat: cel
    remediation:
        summary: Investigate why the agent is not reporting. The device may be offline, the agent may be corrupted, or it may have been uninstalled
        steps:
            - Check if the device is online and connected to network
            - Verify agent service is running on the device
            - Check for agent errors in local logs
            - Reinstall agent if necessary
            - If device is lost/stolen, initiate incident response
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS Controls v8
          controls:
            - "10.7"
        - name: SOC 2
          controls:
            - CC6.8
        - name: NIST 800-53 r5
          controls:
            - SI-3
            - SI-4
