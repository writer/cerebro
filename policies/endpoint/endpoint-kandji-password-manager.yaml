apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: endpoint-kandji-password-manager
    name: Kandji Devices Missing Password Manager
    description: Identifies Kandji-managed devices missing an approved password manager
    tags:
        - endpoint
        - kandji
        - password-manager
        - credentials
        - security
spec:
    severity: MEDIUM
    category: endpoint
    resourceType: kandji_device
    match:
        query: SELECT d.device_id, d.device_name, d.user_email FROM kandji_devices d WHERE NOT EXISTS (SELECT 1 FROM kandji_device_apps a WHERE a.device_id = d.device_id AND (LOWER(COALESCE(a.app_name, '')) LIKE '%1password%' OR LOWER(COALESCE(a.app_name, '')) LIKE '%lastpass%' OR LOWER(COALESCE(a.app_name, '')) LIKE '%bitwarden%' OR LOWER(COALESCE(a.app_name, '')) LIKE '%dashlane%' OR LOWER(COALESCE(a.app_name, '')) LIKE '%keeper%' OR LOWER(COALESCE(a.app_name, '')) LIKE '%nordpass%'))
    remediation:
        summary: Deploy an approved password manager (1Password, Bitwarden, LastPass, Dashlane, Keeper, etc.) via Kandji.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - C1.1
            - CC6.8
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
            - A.8.24
            - A.8.1
            - A.8.7
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - SC-12
            - SI-3
            - SI-4
            - CM-8
        - name: CIS Controls v8
          controls:
            - "6"
            - "1"
            - "10"
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "3.5"
            - "8.6"
            - "5.2"
            - "5.3"
    enabled: true
