apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: endpoint-jamf-screenlock
    name: Jamf Mobile Devices Without Screen Lock
    description: Identifies Jamf-managed mobile devices without a compliant passcode
    tags:
        - endpoint
        - jamf
        - screen-lock
        - passcode
        - access-control
spec:
    severity: MEDIUM
    category: endpoint
    resourceType: jamf_mobile_device
    match:
        query: SELECT id, name, user_email, os_version FROM jamf_mobile_devices WHERE COALESCE(passcode_present, false) = false OR COALESCE(passcode_compliant, false) = false
    remediation:
        summary: Enforce a device passcode and screen lock timeout through Jamf configuration profiles.
    frameworks:
        - name: CIS Controls v8
          controls:
            - "4.3"
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.7.7
            - A.8.1
        - name: NIST 800-53 r5
          controls:
            - AC-11
    enabled: true
