apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vendor-auth-method
    name: Vendor Authentication Method Specified
    description: Ensures all vendors have their authentication method documented
    tags:
        - vendor
        - authentication
        - documentation
        - security
spec:
    severity: MEDIUM
    category: vendor
    resourceType: vendor
    match:
        query: SELECT id, name, risk_level FROM vendors WHERE authentication_method IS NULL OR authentication_method = ''
    remediation:
        summary: Document the authentication method for vendor access (SSO, MFA, API keys, etc.).
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC9.2
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
            - A.5.19
            - A.5.20
            - A.5.21
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - SA-9
            - SR-3
        - name: CIS Controls v8
          controls:
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "12.8"
    enabled: true
