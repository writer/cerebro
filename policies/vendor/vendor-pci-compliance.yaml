apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vendor-pci-compliance
    name: High Risk Vendors PCI DSS Compliance
    description: Ensures high-risk vendors processing cardholder data have PCI DSS compliance documentation
    tags:
        - vendor
        - pci
        - compliance
        - cardholder-data
spec:
    severity: HIGH
    category: vendor
    resourceType: vendor
    match:
        query: SELECT id, name, risk_level, processes_cardholder_data FROM vendors WHERE processes_cardholder_data = true AND risk_level = 'high' AND (pci_aoc_date IS NULL OR pci_aoc_date < NOW() - INTERVAL '365 days')
    remediation:
        summary: Obtain current PCI DSS Attestation of Compliance (AOC) from all high-risk vendors that process cardholder data.
    frameworks:
        - name: SOC 2
          controls:
            - CC9.2
        - name: ISO 27001:2022
          controls:
            - A.5.19
            - A.5.20
            - A.5.21
        - name: NIST 800-53 r5
          controls:
            - SA-9
            - SR-3
        - name: PCI DSS v4.0.1
          controls:
            - "12.8"
    enabled: true
