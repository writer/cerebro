apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vendor-dpa-exists
    name: Vendor Data Processing Agreement Exists
    description: Vendors that process personal data on behalf of the organization should have a Data Processing Agreement (DPA) in place
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - vendor
        - dpa
        - privacy
        - gdpr
        - data-processing
spec:
    severity: high
    effect: forbid
    resource: vendors
    match:
        conditionFormat: cel
        conditions:
            - cmp_eq(path(resource, "processes_personal_data"), true)
            - cmp_ne(path(resource, "dpa_signed"), true)
    remediation:
        summary: Execute a Data Processing Agreement with the vendor that covers data protection requirements per GDPR, CCPA, and other applicable regulations
        steps:
            - Identify vendors processing personal data
            - Request vendor's standard DPA or provide your template
            - Review DPA for required clauses (sub-processors, data security, breach notification)
            - Execute the DPA with appropriate signatories
            - Store DPA in contract management system
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: GDPR
          controls:
            - Article 28
        - name: SOC 2
          controls:
            - CC9.2
            - P6.1
        - name: ISO 27001:2022
          controls:
            - A.5.20
        - name: ISO 27701
          controls:
            - 7.2.6
            - 8.2.1
