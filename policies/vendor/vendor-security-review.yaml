apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vendor-security-review-complete
    name: Vendor Security Review Completed
    description: High and critical risk vendors should have completed security reviews with SOC2, ISO27001, or equivalent documentation on file
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - vendor
        - third-party
        - security-review
        - due-diligence
spec:
    severity: high
    effect: forbid
    resource: vendors
    match:
        conditionFormat: cel
        conditions:
            - cmp_eq(path(resource, "risk_level"), path(resource, "HIGH"))
            - cmp_ne(path(resource, "security_review_complete"), true)
    remediation:
        summary: Complete a security review of the vendor including review of their SOC2 report, security questionnaire, or conduct a security assessment
        steps:
            - Request SOC2 Type II report or equivalent from vendor
            - Review the report for any exceptions or concerns
            - Send security questionnaire for areas not covered
            - Document findings and any accepted risks
            - Set reminder for annual review renewal
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC9.2
        - name: ISO 27001:2022
          controls:
            - A.5.19
            - A.5.20
            - A.5.21
        - name: NIST 800-53 r5
          controls:
            - SA-9
            - SR-6
        - name: HIPAA
          controls:
            - 164.308(b)(1)
