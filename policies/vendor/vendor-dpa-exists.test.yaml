apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        dpa_signed: false
        processes_personal_data: true
      wantFinding: true
    - name: non-matching resource passes
      resource:
        dpa_signed: false
        processes_personal_data: false
      wantFinding: false
