apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vendor-risk-assessed
    name: Vendor Risk Level Assigned
    description: All vendors should have a risk level assigned based on data access, criticality, and other factors
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - vendor
        - risk-assessment
        - third-party-risk
spec:
    severity: medium
    effect: forbid
    resource: vendors
    match:
        conditionFormat: cel
        conditions:
            - cmp_eq(path(resource, "risk_level"), null)
            - cmp_eq(path(resource, "vendor_status"), path(resource, "ACTIVE"))
    remediation:
        summary: Assess the vendor's risk level based on the type of data accessed, service criticality, and security posture
        steps:
            - Review what data/systems the vendor has access to
            - Assess business criticality of the vendor relationship
            - Review vendor's security certifications and history
            - Assign risk level (Critical, High, Medium, Low)
            - Document the risk assessment rationale
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC9.2
        - name: ISO 27001:2022
          controls:
            - A.5.19
        - name: NIST 800-53 r5
          controls:
            - RA-3
            - SA-9
