apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: tls-weak-ciphers
    name: Services Supporting Weak TLS Cipher Suites
    description: Identifies services that support weak or deprecated cipher suites (RC4, DES, 3DES, NULL ciphers)
    tags:
        - ssl
        - tls
        - cipher
        - weak-crypto
        - pci
spec:
    severity: HIGH
    category: certificate
    resourceType: tls_endpoint
    match:
        query: SELECT id, hostname, port, cipher_suites FROM tls_endpoints WHERE cipher_suites && ARRAY['RC4', 'DES', '3DES', 'NULL', 'EXPORT', 'anon']
    remediation:
        summary: Disable weak cipher suites and configure the server to use only strong ciphers. Prefer AEAD ciphers like AES-GCM and ChaCha20-Poly1305.
    frameworks:
        - name: SOC 2
          controls:
            - C1.1
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
            - SC-8
            - SC-23
        - name: CIS Controls v8
          controls:
            - "3"
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
    enabled: true
