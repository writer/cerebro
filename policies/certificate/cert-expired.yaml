apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: cert-expired
    name: Expired SSL/TLS Certificates
    description: Identifies SSL/TLS certificates that have already expired
    tags:
        - ssl
        - tls
        - certificate
        - expired
        - critical
spec:
    severity: CRITICAL
    category: certificate
    resourceType: certificate
    match:
        query: SELECT id, domain, issuer, valid_to, days_until_expiry FROM certificates WHERE days_until_expiry <= 0
    remediation:
        summary: Immediately renew the expired certificate. Services using this certificate may be unavailable or showing security warnings to users.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-8
            - SC-12
            - SC-13
            - SC-23
            - SC-28
        - name: CIS Controls v8
          controls:
            - "3"
        - name: PCI DSS v4.0.1
          controls:
            - "4.2"
    enabled: true
