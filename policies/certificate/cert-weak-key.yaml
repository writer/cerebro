apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: cert-weak-key
    name: Certificates Using Weak Key Sizes
    description: Identifies certificates using RSA keys smaller than 2048 bits or ECC keys smaller than 256 bits
    tags:
        - ssl
        - tls
        - certificate
        - weak-crypto
        - key-size
spec:
    severity: HIGH
    category: certificate
    resourceType: certificate
    match:
        query: SELECT id, domain, issuer, key_algorithm, key_size FROM certificates WHERE (key_algorithm = 'RSA' AND key_size < 2048) OR (key_algorithm LIKE 'EC%' AND key_size < 256)
    remediation:
        summary: Replace the certificate with one using RSA 2048-bit or higher, or ECC P-256 or higher keys.
    frameworks:
        - name: SOC 2
          controls:
            - C1.1
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
            - SC-8
            - SC-23
        - name: CIS Controls v8
          controls:
            - "3"
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
    enabled: true
