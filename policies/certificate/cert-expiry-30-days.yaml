apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: cert-expiry-30-days
    name: SSL/TLS Certificates Expiring Within 30 Days
    description: Identifies SSL/TLS certificates that will expire within the next 30 days
    tags:
        - ssl
        - tls
        - certificate
        - expiry
        - availability
spec:
    severity: HIGH
    category: certificate
    resourceType: certificate
    match:
        query: SELECT id, domain, issuer, valid_to, days_until_expiry FROM certificates WHERE days_until_expiry <= 30 AND days_until_expiry > 0
    remediation:
        summary: Renew the certificate before expiration. Contact your certificate authority or use automated certificate management (e.g., Let's Encrypt, AWS ACM).
    frameworks:
        - name: SOC 2
          controls:
            - CC6.7
            - A1.1
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.8.24
            - A.8.13
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - SC-8
            - SC-12
            - SC-13
            - SC-23
            - SC-28
            - CP-2
            - CP-4
            - CP-9
            - CP-10
        - name: CIS Controls v8
          controls:
            - "3"
            - "11"
        - name: PCI DSS v4.0.1
          controls:
            - "4.2"
    enabled: true
