apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: cert-weak-signature
    name: Certificates Using Weak Signature Algorithms
    description: Identifies certificates using deprecated signature algorithms like SHA-1 or MD5
    tags:
        - ssl
        - tls
        - certificate
        - weak-crypto
        - sha1
spec:
    severity: HIGH
    category: certificate
    resourceType: certificate
    match:
        query: SELECT id, domain, issuer, signature_algorithm FROM certificates WHERE signature_algorithm IN ('SHA1withRSA', 'MD5withRSA', 'SHA1withECDSA')
    remediation:
        summary: Replace the certificate with one using SHA-256 or stronger signature algorithm. Contact your certificate authority to issue a new certificate.
    frameworks:
        - name: SOC 2
          controls:
            - C1.1
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
            - SC-8
            - SC-23
        - name: CIS Controls v8
          controls:
            - "3"
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
    enabled: true
