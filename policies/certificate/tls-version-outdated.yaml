apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: tls-version-outdated
    name: Services Using Outdated TLS Versions
    description: Identifies services still supporting TLS 1.0 or TLS 1.1 which are deprecated
    tags:
        - ssl
        - tls
        - protocol
        - deprecated
        - pci
spec:
    severity: HIGH
    category: certificate
    resourceType: tls_endpoint
    match:
        query: SELECT id, hostname, port, tls_versions_supported FROM tls_endpoints WHERE 'TLSv1.0' = ANY(tls_versions_supported) OR 'TLSv1.1' = ANY(tls_versions_supported)
    remediation:
        summary: Disable TLS 1.0 and TLS 1.1 on the server. Configure the server to only support TLS 1.2 and TLS 1.3.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-8
            - SC-12
            - SC-13
            - SC-23
            - SC-28
        - name: CIS Controls v8
          controls:
            - "3"
        - name: PCI DSS v4.0.1
          controls:
            - "4.2"
    enabled: true
