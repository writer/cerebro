apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: pci-firewall-inbound-rules
    name: PCI Firewall Inbound Rules Reviewed
    description: Ensures firewall and router rule sets are reviewed at least every 6 months (PCI DSS 1.1.7)
    tags:
        - pci
        - firewall
        - review
        - requirement-1
spec:
    severity: HIGH
    category: pci
    resourceType: firewall_rule
    match:
        query: SELECT id, name, direction, last_reviewed_date FROM firewall_rules WHERE direction = 'inbound' AND cde_scope = true AND (last_reviewed_date IS NULL OR last_reviewed_date < NOW() - INTERVAL '180 days')
    remediation:
        summary: Review all inbound firewall rules every 6 months. Document the review and remove unnecessary rules.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.6
        - name: ISO 27001:2022
          controls:
            - A.8.20
            - A.8.22
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - AC-4
            - SC-7
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
    enabled: true
