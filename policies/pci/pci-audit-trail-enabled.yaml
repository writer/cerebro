apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: pci-audit-trail-enabled
    name: Audit Trails Enabled for CDE Systems
    description: Ensures audit trails are enabled and link all access to individual users (PCI DSS 10.1)
    tags:
        - pci
        - audit
        - logging
        - requirement-10
spec:
    severity: HIGH
    category: pci
    resourceType: system
    match:
        query: SELECT id, hostname, audit_logging_enabled, audit_user_tracking FROM systems WHERE cde_scope = true AND (audit_logging_enabled = false OR audit_user_tracking = false)
    remediation:
        summary: Enable comprehensive audit logging on all CDE systems. Ensure all actions can be traced to individual users.
    frameworks:
        - name: PCI DSS v4.0
          controls:
            - "1.1"
    enabled: true
