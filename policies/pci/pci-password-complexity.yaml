apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: pci-password-complexity
    name: PCI Password Complexity Requirements
    description: Ensures passwords meet PCI DSS complexity requirements (min 7 chars, numeric and alpha) (PCI DSS 8.2.3)
    tags:
        - pci
        - password
        - authentication
        - requirement-8
spec:
    severity: HIGH
    category: pci
    resourceType: password_policy
    match:
        query: SELECT id, system_name, min_length, require_numeric, require_alpha FROM password_policies WHERE cde_scope = true AND (min_length < 7 OR require_numeric = false OR require_alpha = false)
    remediation:
        summary: Configure password policies to require minimum 7 characters with both numeric and alphabetic characters.
    frameworks:
        - name: PCI DSS v4.0
          controls:
            - "1.1"
    enabled: true
