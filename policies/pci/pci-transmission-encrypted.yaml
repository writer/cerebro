apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: pci-transmission-encrypted
    name: Cardholder Data Encrypted in Transit
    description: Ensures cardholder data is encrypted during transmission using TLS 1.2+ (PCI DSS 4.1)
    tags:
        - pci
        - encryption
        - tls
        - requirement-4
spec:
    severity: CRITICAL
    category: pci
    resourceType: tls_endpoint
    match:
        query: SELECT id, hostname, port, tls_version, service_type FROM tls_endpoints WHERE service_type = 'payment' AND tls_version < 'TLSv1.2'
    remediation:
        summary: Configure all payment endpoints to use TLS 1.2 or higher. Disable TLS 1.0 and 1.1.
    frameworks:
        - name: SOC 2
          controls:
            - C1.1
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
            - SC-8
            - SC-23
        - name: CIS Controls v8
          controls:
            - "3"
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
    enabled: true
