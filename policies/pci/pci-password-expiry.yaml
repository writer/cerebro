apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: pci-password-expiry
    name: PCI Password Expiry 90 Days
    description: Ensures passwords are changed at least every 90 days (PCI DSS 8.2.4)
    tags:
        - pci
        - password
        - expiry
        - requirement-8
spec:
    severity: HIGH
    category: pci
    resourceType: password_policy
    match:
        query: SELECT id, system_name, max_password_age_days FROM password_policies WHERE cde_scope = true AND (max_password_age_days > 90 OR max_password_age_days IS NULL)
    remediation:
        summary: Configure password expiry to maximum 90 days for all accounts with CDE access.
    frameworks:
        - name: PCI DSS v4.0
          controls:
            - "1.1"
    enabled: true
