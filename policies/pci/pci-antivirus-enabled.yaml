apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: pci-antivirus-enabled
    name: Anti-Malware on Systems in CDE
    description: Ensures anti-malware software is deployed on all systems in the cardholder data environment (PCI DSS 5.1)
    tags:
        - pci
        - antimalware
        - endpoint
        - requirement-5
spec:
    severity: HIGH
    category: pci
    resourceType: endpoint
    match:
        query: SELECT id, hostname, os_type, antimalware_installed, cde_scope FROM endpoints WHERE cde_scope = true AND (antimalware_installed = false OR antimalware_installed IS NULL)
    remediation:
        summary: Deploy anti-malware software on all systems commonly affected by malware in the CDE.
    frameworks:
        - name: PCI DSS v4.0
          controls:
            - "1.1"
    enabled: true
