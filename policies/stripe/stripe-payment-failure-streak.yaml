apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: stripe-payment-failure-streak
    name: Consecutive Payment Failures
    description: Detects subscriptions in past_due state with repeated payment failures.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - churn-risk
        - revenue
        - stripe
spec:
    severity: critical
    effect: forbid
    resource: stripe::subscription
    match:
        conditions:
            - cmp_eq(path(resource, "past_due"), true)
            - cmp_gt(path(resource, "failed_payment_count"), 2)
        conditionFormat: cel
    frameworks:
        - name: Cerebro Revenue Operations
          controls:
            - REV-4
            - REV-5
