apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: secrets-least-privilege
    name: Secrets Least Privilege Access
    description: Ensures secrets have minimal necessary access permissions
    tags:
        - secrets
        - access
        - least-privilege
        - security
spec:
    severity: MEDIUM
    category: secrets
    resourceType: secret
    match:
        query: SELECT id, name, secret_type, access_principals FROM secrets WHERE array_length(access_principals, 1) > 5
    remediation:
        summary: Review and restrict secret access to only required principals. Use service accounts with specific permissions.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - C1.1
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.15
            - A.5.18
            - A.5.17
            - A.8.5
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
    enabled: true
