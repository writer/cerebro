apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: secrets-rotation
    name: Secrets Rotation Policy
    description: Ensures secrets are rotated within the defined rotation period
    tags:
        - secrets
        - rotation
        - security
        - credentials
spec:
    severity: HIGH
    category: secrets
    resourceType: secret
    match:
        query: SELECT id, name, secret_type, last_rotated, rotation_days FROM secrets WHERE last_rotated IS NULL OR last_rotated < NOW() - INTERVAL '90 days'
    remediation:
        summary: Rotate secrets according to policy. Enable automatic rotation where supported (AWS Secrets Manager, Vault).
    frameworks:
        - name: SOC 2
          controls:
            - C1.1
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: CIS Controls v8
          controls:
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    enabled: true
