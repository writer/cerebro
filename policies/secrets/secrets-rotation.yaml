apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: secrets-rotation
    name: Secrets Rotation Policy
    description: Ensures secrets are rotated within the defined rotation period
    tags:
        - secrets
        - rotation
        - security
        - credentials
spec:
    severity: HIGH
    category: secrets
    resourceType: secret
    match:
        query: SELECT id, name, secret_type, last_rotated, rotation_days FROM secrets WHERE last_rotated IS NULL OR last_rotated < NOW() - INTERVAL '90 days'
    remediation:
        summary: Rotate secrets according to policy. Enable automatic rotation where supported (AWS Secrets Manager, Vault).
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: ISO 27001:2022
          controls:
            - A.5.1
        - name: NIST 800-53 r5
          controls:
            - AC-1
    enabled: true
