apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: secrets-access-audit
    name: Secrets Access Auditing Enabled
    description: Ensures all secret access is logged and auditable
    tags:
        - secrets
        - audit
        - logging
        - monitoring
spec:
    severity: MEDIUM
    category: secrets
    resourceType: secret
    match:
        query: SELECT id, name, secret_type, audit_logging_enabled FROM secrets WHERE audit_logging_enabled = false
    remediation:
        summary: Enable audit logging for secret access. Configure alerting for unusual access patterns.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
