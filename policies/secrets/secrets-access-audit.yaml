apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: secrets-access-audit
    name: Secrets Access Auditing Enabled
    description: Ensures all secret access is logged and auditable
    tags:
        - secrets
        - audit
        - logging
        - monitoring
spec:
    severity: MEDIUM
    category: secrets
    resourceType: secret
    match:
        query: SELECT id, name, secret_type, audit_logging_enabled FROM secrets WHERE audit_logging_enabled = false
    remediation:
        summary: Enable audit logging for secret access. Configure alerting for unusual access patterns.
    frameworks:
        - name: SOC 2
          controls:
            - CC4
            - CC6.1
            - CC7.2
            - CC7.3
            - C1.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
            - A.8.24
            - A.8.15
            - A.8.16
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
            - AU-2
            - AU-12
        - name: CIS Controls v8
          controls:
            - "6"
            - "8"
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
            - "10.2"
            - "10.3"
    enabled: true
