apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: secrets-vault-storage
    name: Secrets Stored in Vault
    description: Ensures secrets are stored in approved secret management systems
    tags:
        - secrets
        - vault
        - storage
        - security
spec:
    severity: HIGH
    category: secrets
    resourceType: secret
    match:
        query: SELECT id, name, secret_type, storage_location FROM secrets WHERE storage_location NOT IN ('vault', 'aws_secrets_manager', 'gcp_secret_manager', 'azure_key_vault')
    remediation:
        summary: Migrate secrets to approved secret management systems. Never store secrets in environment variables or config files.
    frameworks:
        - name: SOC 2
          controls:
            - C1.1
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: CIS Controls v8
          controls:
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    enabled: true
