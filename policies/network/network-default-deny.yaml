apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: network-default-deny
    name: Network Firewall Default Deny
    description: Ensures firewalls have default deny rules and explicit allow rules
    tags:
        - network
        - firewall
        - default-deny
        - security
spec:
    severity: HIGH
    category: network
    resourceType: firewall
    match:
        query: SELECT id, name, default_policy FROM firewalls WHERE default_policy != 'deny'
    remediation:
        summary: Configure firewalls with default deny policy. Create explicit allow rules only for required traffic.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: ISO 27001:2022
          controls:
            - A.5.1
        - name: CIS Benchmarks
          controls:
            - "1.1"
    enabled: true
