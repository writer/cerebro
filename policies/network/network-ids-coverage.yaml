apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: network-ids-coverage
    name: Network IDS/IPS Coverage
    description: Ensures intrusion detection/prevention systems monitor critical network segments
    tags:
        - network
        - ids
        - ips
        - monitoring
        - security
spec:
    severity: HIGH
    category: network
    resourceType: network_segment
    match:
        query: SELECT id, name, classification, ids_monitored FROM network_segments WHERE classification IN ('critical', 'sensitive', 'cde') AND ids_monitored = false
    remediation:
        summary: Deploy IDS/IPS to monitor all critical network segments. Ensure signatures are updated regularly.
    frameworks:
        - name: SOC 2
          controls:
            - CC4
            - CC6.6
            - CC7.2
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.8.20
            - A.8.22
            - A.8.15
            - A.8.16
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - AC-4
            - SC-7
            - AU-2
            - AU-12
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "8"
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "10.2"
            - "10.3"
    enabled: true
