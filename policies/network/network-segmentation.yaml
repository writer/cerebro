apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: network-segmentation
    name: Network Segmentation Enforced
    description: Ensures critical network segments are properly isolated from general network
    tags:
        - network
        - segmentation
        - isolation
        - security
spec:
    severity: HIGH
    category: network
    resourceType: network_segment
    match:
        query: SELECT id, name, classification, connected_segments FROM network_segments WHERE classification IN ('critical', 'sensitive') AND array_length(connected_segments, 1) > 2
    remediation:
        summary: Review and limit connectivity between critical network segments. Implement proper firewall rules between segments.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: ISO 27001:2022
          controls:
            - A.5.1
        - name: NIST 800-53 r5
          controls:
            - AC-1
    enabled: true
