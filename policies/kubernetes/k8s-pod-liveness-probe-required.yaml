apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-pod-liveness-probe-required
    name: Kubernetes Pod Requires Liveness Probes
    description: All containers should define liveness probes for reliable health monitoring.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - reliability
        - operations
spec:
    severity: medium
    effect: forbid
    resource: kubernetes::pod
    match:
        conditions:
            - cmp_ne(path(resource, "spec.all_containers_have_liveness_probe"), true)
        conditionFormat: cel
    remediation:
        summary: Define a livenessProbe for each container with appropriate thresholds and timing.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.2
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.5.30
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - CP-2
            - CP-4
        - name: Cerebro Operational Resilience
          controls:
            - OPS-2
