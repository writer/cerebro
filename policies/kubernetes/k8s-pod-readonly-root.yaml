apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-pod-readonly-root-filesystem
    name: K8s Pod Read-Only Root Filesystem
    description: Containers should use read-only root filesystem
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-k8s-5.2.4
        - pod-security
        - filesystem
spec:
    severity: medium
    effect: forbid
    resource: kubernetes::pod
    match:
        conditions:
            - cmp_ne(path(resource, "spec.containers.security_context.read_only_root_filesystem"), true)
        conditionFormat: cel
    remediation:
        summary: 'Set readOnlyRootFilesystem: true in container security context.'
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.2.4
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
