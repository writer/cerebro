apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-pod-seccomp-runtime-default
    name: Kubernetes Pod Uses RuntimeDefault Seccomp
    description: Pods should run with RuntimeDefault seccomp profiles for all containers.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - pod-security
        - seccomp
spec:
    severity: medium
    effect: forbid
    resource: kubernetes::pod
    match:
        conditions:
            - cmp_ne(path(resource, "spec.all_containers_runtime_default_seccomp"), true)
        conditionFormat: cel
    remediation:
        summary: 'Set seccompProfile.type: RuntimeDefault at pod or container level.'
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.2.1
            - 5.2.2
            - 5.2.3
            - 5.2.4
            - 5.2.5
            - 5.2.6
            - 5.2.7
            - 5.2.8
        - name: NIST 800-53 r5
          controls:
            - AC-6
            - CM-7
            - SC-7
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
