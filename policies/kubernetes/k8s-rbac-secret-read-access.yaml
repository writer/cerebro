apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-rbac-secret-read-access
    name: User/ServiceAccount Can Read Kubernetes Secrets
    description: A user or service account can get/list/watch Kubernetes Secrets via RBAC bindings.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - rbac
        - secrets
        - least-privilege
spec:
    severity: low
    effect: forbid
    resource: k8s::rbac::risky_binding
    match:
        conditions:
            - in_list(path(resource, "subject_kind"), ["User","ServiceAccount"])
            - contains_value(path(resource, "risk_reasons"), "secret_access")
        conditionFormat: cel
    remediation:
        summary: Remove unnecessary secret read permissions and scope access to only required namespaces and identities.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.1.1
            - 5.1.3
            - 5.1.4
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
