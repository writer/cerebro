apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-cluster-admin-wildcard
    name: Kubernetes ClusterRole with Wildcard Permissions
    description: ClusterRole grants wildcard (*) permissions on resources, verbs, or API groups
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - rbac
        - least-privilege
        - cis-k8s-5.1.3
spec:
    severity: high
    effect: forbid
    resource: k8s::rbac::cluster_role
    match:
        conditions:
            - '!(in_list(path(resource, "metadata.name"), ["cluster-admin","system:*"]))'
            - list_value(path(resource, "rules")).exists(item, (contains_value(path(item, "resources"), "*")) || (contains_value(path(item, "verbs"), "*")) || (contains_value(path(item, "api_groups"), "*")))
        conditionFormat: cel
    remediation:
        summary: Replace wildcard permissions with specific resources and verbs. Create separate roles for different access patterns. Follow principle of least privilege.
    riskCategories:
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.1.3
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
