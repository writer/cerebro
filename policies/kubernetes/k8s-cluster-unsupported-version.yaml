apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-cluster-unsupported-version
    name: Kubernetes Cluster on Unsupported Minor Version
    description: Cluster is running an older Kubernetes minor version that is likely outside standard support windows.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - version
        - hardening
spec:
    severity: medium
    effect: forbid
    resource: k8s::cluster::inventory
    match:
        conditions:
            - matches_value(path(resource, "kubernetes_version"), "v1\\.(1[0-9]|2[0-7])\\.")
        conditionFormat: cel
    remediation:
        summary: Upgrade control plane and nodes to a currently supported Kubernetes minor release and establish a regular upgrade cadence.
    riskCategories:
        - VULNERABILITY
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
        - name: NIST 800-53 r5
          controls:
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "6.3"
            - "11.3"
        - name: CIS Controls v8
          controls:
            - "7"
