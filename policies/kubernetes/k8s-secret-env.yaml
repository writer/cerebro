apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-secrets-in-secrets-not-env
    name: K8s Secrets Via Secret Objects
    description: Sensitive data should be stored in Secret objects, not environment variables
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - secrets
        - security
        - credentials
spec:
    severity: high
    effect: forbid
    resource: kubernetes::pod
    match:
        conditions:
            - matches_value(path(resource, "spec.containers.env.name"), "(?i)(password|secret|api_key|token|credential)")
            - cmp_eq(path(resource, "spec.containers.env.value_from.secret_key_ref"), null)
        conditionFormat: cel
    remediation:
        summary: Use secretKeyRef to reference secrets instead of inline values.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Credential Access
          technique: T1552
        - tactic: Collection
          technique: T1530
