apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-rbac-high-risk-binding
    name: Kubernetes High-Risk RBAC Binding
    description: RBAC binding grants high-risk permissions that can enable privilege escalation or broad cluster takeover.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - rbac
        - least-privilege
        - privilege-escalation
spec:
    severity: high
    effect: forbid
    resource: k8s::rbac::risky_binding
    match:
        conditions:
            - cmp_eq(path(resource, "risk_level"), "high")
        conditionFormat: cel
    remediation:
        summary: Replace broad role bindings with least-privilege roles, remove wildcard verbs/resources, and tightly restrict cluster-admin access.
    riskCategories:
        - PRIVILEGE_ESCALATION
        - IDENTITY_RISK
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.1.1
            - 5.1.3
            - 5.1.4
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
