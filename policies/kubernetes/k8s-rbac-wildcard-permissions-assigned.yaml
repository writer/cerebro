apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-rbac-wildcard-permissions-assigned
    name: User/ServiceAccount Bound to Wildcard RBAC Permissions
    description: A user or service account is bound to a role with wildcard verbs or resources.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - rbac
        - least-privilege
spec:
    severity: low
    effect: forbid
    resource: k8s::rbac::risky_binding
    match:
        conditions:
            - in_list(path(resource, "subject_kind"), ["User","ServiceAccount"])
            - (cmp_eq(path(resource, "wildcard_verbs"), true)) || (cmp_eq(path(resource, "wildcard_resources"), true))
        conditionFormat: cel
    remediation:
        summary: Replace wildcard RBAC permissions with explicit verbs and resources and split broad roles into least-privilege roles.
    riskCategories:
        - PRIVILEGE_ESCALATION
        - IDENTITY_RISK
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.1.1
            - 5.1.3
            - 5.1.4
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
