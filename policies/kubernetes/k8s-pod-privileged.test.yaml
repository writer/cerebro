apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        spec:
            containers:
                security_context:
                    privileged: true
      wantFinding: true
    - name: non-matching resource passes
      resource:
        spec:
            containers:
                security_context:
                    privileged: false
      wantFinding: false
