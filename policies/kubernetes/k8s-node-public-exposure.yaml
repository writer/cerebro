apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-node-public-exposure
    name: Kubernetes Node with Public IP
    description: Kubernetes node has a public IP address, potentially exposing cluster infrastructure to the internet
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - network
        - infrastructure
        - exposure
spec:
    severity: high
    effect: forbid
    resource: k8s::core::node
    match:
        conditions:
            - list_value(path(resource, "status.addresses")).exists(item, (cmp_eq(path(item, "type"), "ExternalIP")) && (!(matches_value(path(item, "address"), "^10\\.|^172\\.(1[6-9]|2[0-9]|3[01])\\.|^192\\.168\\."))))
        conditionFormat: cel
    remediation:
        summary: Deploy nodes in private subnets without public IPs. Use NAT gateways for outbound traffic. Access nodes via bastion hosts or VPN. Use private GKE/EKS/AKS clusters.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
