apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-workload-not-default-namespace
    name: Kubernetes Workloads Avoid Default Namespace
    description: Application workloads should not run in the default namespace.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - namespace
        - segmentation
spec:
    severity: low
    effect: forbid
    resource: kubernetes::deployment
    match:
        conditions:
            - cmp_eq(path(resource, "namespace"), "default")
        conditionFormat: cel
    remediation:
        summary: Deploy workloads into dedicated namespaces with scoped RBAC and network policies.
    riskCategories:
        - MISCONFIGURATION
        - LATERAL_MOVEMENT
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-4
            - SC-7
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
        - name: PCI DSS v4.0.1
          controls:
            - 1.3.1
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
