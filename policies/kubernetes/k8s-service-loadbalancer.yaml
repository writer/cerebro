apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-service-loadbalancer-internal
    name: K8s LoadBalancer Service Internal
    description: LoadBalancer services should use internal load balancers when possible
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - service
        - network
        - exposure
spec:
    severity: medium
    effect: forbid
    resource: kubernetes::service
    match:
        conditions:
            - cmp_eq(path(resource, "spec.type"), "LoadBalancer")
            - cmp_ne(path(resource, "metadata.annotations['service.beta.kubernetes.io/aws-load-balancer-internal']"), "true")
            - cmp_ne(path(resource, "metadata.annotations['cloud.google.com/load-balancer-type']"), "Internal")
        conditionFormat: cel
    remediation:
        summary: Use internal load balancer annotations or switch to ClusterIP with Ingress.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-4
            - SC-7
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
        - name: PCI DSS v4.0.1
          controls:
            - 1.3.1
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
