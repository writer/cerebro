apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-ingress-public
    name: Kubernetes Ingress Exposes Sensitive Service
    description: Ingress resource exposes a service to the internet without authentication or with sensitive paths
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - ingress
        - network-exposure
        - authentication
spec:
    severity: high
    effect: forbid
    resource: k8s::networking::ingress
    match:
        conditions:
            - list_value(path(resource, "spec.rules")).exists(item, list_value(path(item, "http.paths")).exists(item, (matches_value(path(item, "path"), "/admin|/api/internal|/debug|/metrics|/health")) && (cmp_ne(path(item, "backend.service.name"), null))))
            - cmp_eq(path(resource, "metadata.annotations['nginx.ingress.kubernetes.io/auth-type']"), null)
        conditionFormat: cel
    remediation:
        summary: Add authentication annotations to the Ingress. Use network policies to restrict access. Consider using a service mesh for mTLS.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - IA-2
            - IA-5
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "8.3"
            - "8.4"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
