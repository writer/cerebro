apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-role-wildcard-permissions
    name: Kubernetes Role with Wildcard Permissions
    description: Role grants wildcard (*) permissions on resources, verbs, or API groups.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - rbac
        - least-privilege
spec:
    severity: low
    effect: forbid
    resource: k8s::role
    match:
        conditions:
            - list_value(path(resource, "rules")).exists(item, (contains_value(path(item, "resources"), "*")) || (contains_value(path(item, "verbs"), "*")) || (contains_value(path(item, "api_groups"), "*")))
        conditionFormat: cel
    remediation:
        summary: Replace wildcard role permissions with explicit resources, verbs, and API groups.
    riskCategories:
        - PRIVILEGE_ESCALATION
        - IDENTITY_RISK
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.1.1
            - 5.1.3
            - 5.1.4
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
