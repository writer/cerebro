apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-service-account-token-mount
    name: Kubernetes Pod Auto-Mounts Service Account Token
    description: Pod automatically mounts a service account token that may not be needed
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - security
        - least-privilege
        - cis-k8s-5.1.6
spec:
    severity: low
    effect: forbid
    resource: k8s::core::pod
    match:
        conditions:
            - cmp_ne(path(resource, "spec.automount_service_account_token"), false)
            - '!(in_list(path(resource, "spec.service_account_name"), ["default"]))'
        conditionFormat: cel
    remediation:
        summary: 'Set automountServiceAccountToken: false in pod spec if the pod doesn''t need to access the Kubernetes API. Create minimal RBAC roles for pods that do need API access.'
    riskCategories:
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.1.6
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Credential Access
          technique: T1552
