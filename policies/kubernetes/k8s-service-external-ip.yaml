apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-service-external-ip
    name: Kubernetes Service with ExternalIP
    description: Kubernetes Service uses externalIPs which can be exploited for CVE-2020-8554 man-in-the-middle attacks
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - network
        - cve-2020-8554
        - service-exposure
spec:
    severity: high
    effect: forbid
    resource: k8s::core::service
    match:
        conditions:
            - cmp_ne(path(resource, "spec.external_ips"), null)
            - cmp_gt(path(resource, "spec.external_ips_count"), 0)
        conditionFormat: cel
    remediation:
        summary: Remove externalIPs from Service spec. Use LoadBalancer or Ingress for external access. Enable ExternalIP admission controller to restrict usage.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - VULNERABILITY
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
