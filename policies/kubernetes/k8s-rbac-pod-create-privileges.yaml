apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-rbac-pod-create-privileges
    name: User/ServiceAccount Can Create Pods
    description: A user or service account has RBAC permissions to create pods, which can be abused for privilege escalation.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - rbac
        - least-privilege
        - workload-security
spec:
    severity: low
    effect: forbid
    resource: k8s::rbac::risky_binding
    match:
        conditions:
            - in_list(path(resource, "subject_kind"), ["User","ServiceAccount"])
            - contains_value(path(resource, "risk_reasons"), "pod_create_access")
        conditionFormat: cel
    remediation:
        summary: Limit pod creation privileges to trusted automation identities and tightly scoped namespaces.
    riskCategories:
        - PRIVILEGE_ESCALATION
        - LATERAL_MOVEMENT
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.1.1
            - 5.1.3
            - 5.1.4
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
