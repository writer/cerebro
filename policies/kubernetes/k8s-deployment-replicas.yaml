apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-deployment-multiple-replicas
    name: K8s Deployment Multiple Replicas
    description: Production deployments should have multiple replicas for availability
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - deployment
        - availability
        - ha
spec:
    severity: low
    effect: forbid
    resource: kubernetes::deployment
    match:
        conditions:
            - cmp_lt(path(resource, "spec.replicas"), 2)
            - cmp_ne(path(resource, "metadata.namespace"), "kube-system")
        conditionFormat: cel
    remediation:
        summary: Increase replica count to at least 2 for high availability.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.2
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.5.30
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - CP-2
            - CP-4
        - name: Cerebro Operational Resilience
          controls:
            - OPS-2
