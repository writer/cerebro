apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-pod-no-host-pid
    name: K8s Pod No Host PID
    description: Pods should not share host PID namespace
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-k8s-5.2.2
        - pod-security
        - namespace
spec:
    severity: high
    effect: forbid
    resource: kubernetes::pod
    match:
        conditions:
            - cmp_eq(path(resource, "spec.host_pid"), true)
        conditionFormat: cel
    remediation:
        summary: 'Remove hostPID: true from pod spec.'
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.2.2
