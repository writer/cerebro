apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-ingress-no-wildcard-host
    name: Kubernetes Ingress Avoids Wildcard Hosts
    description: Ingress resources should not use wildcard hosts that broaden routing scope.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - kubernetes
        - ingress
        - network
spec:
    severity: medium
    effect: forbid
    resource: k8s::networking::ingress
    match:
        conditions:
            - cmp_eq(path(resource, "wildcard_host"), true)
        conditionFormat: cel
    remediation:
        summary: Use explicit hostnames for ingress rules instead of wildcard hosts.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-4
            - SC-7
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
        - name: PCI DSS v4.0.1
          controls:
            - 1.3.1
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
