apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        spec:
            containers:
                security_context:
                    run_as_user: 0
            security_context:
                run_as_non_root: false
      wantFinding: true
    - name: non-matching resource passes
      resource:
        spec:
            containers:
                security_context:
                    run_as_user: 0
            security_context:
                run_as_non_root: true
      wantFinding: false
