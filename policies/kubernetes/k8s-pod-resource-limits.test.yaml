apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        spec:
            containers:
                resources:
                    limits:
                        cpu: null
                        memory: null
      wantFinding: true
    - name: non-matching resource passes
      resource:
        spec:
            containers:
                resources:
                    limits:
                        cpu: null
                        memory: true
      wantFinding: false
