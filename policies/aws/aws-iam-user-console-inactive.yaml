apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-user-console-inactive
    name: IAM User Console Inactive
    description: IAM user with console access has not logged in for 90+ days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-1.12
        - iam
        - hygiene
        - inactive
spec:
    severity: medium
    effect: forbid
    resource: aws::iam::credential_report
    match:
        conditions:
            - cmp_eq(path(resource, "password_enabled"), true)
            - cmp_gt(path(resource, "password_last_used_days"), 90)
        conditionFormat: cel
    remediation:
        summary: Disable console access for inactive users or delete the user if no longer needed.
    riskCategories:
        - IDENTITY_RISK
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "1.12"
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
