apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-s3-public-write
    name: S3 Bucket Allows Public Write Access
    description: S3 bucket policy or ACL grants write permissions to anonymous users or all authenticated AWS users
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - s3
        - public-access
        - data-integrity
        - cwe-732
spec:
    severity: critical
    effect: forbid
    resource: aws::s3::bucket
    match:
        conditions:
            - list_value(path(resource, "policy.Statement")).exists(item, (cmp_eq(path(item, "Effect"), "Allow")) && (cmp_eq(path(item, "Principal"), "*")) && (matches_value(path(item, "Action"), "s3:(Put|Delete).*")))
            - list_value(path(resource, "acl.grants")).exists(item, (contains_value(path(item, "grantee.uri"), "AllUsers")) && (in_list(path(item, "permission"), ["WRITE","FULL_CONTROL"])))
        conditionFormat: cel
    remediation:
        summary: Remove public write permissions immediately. Enable Block Public Access settings. Review and restrict bucket policy. Enable versioning for recovery from malicious writes.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
