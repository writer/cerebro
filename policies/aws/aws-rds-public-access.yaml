apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-rds-no-public-access
    name: RDS No Public Access
    description: RDS instances should not be publicly accessible
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-2.3.3
        - rds
        - database
        - exposure
        - public-access
spec:
    severity: critical
    effect: forbid
    resource: aws::rds::db_instance
    match:
        conditions:
            - cmp_eq(path(resource, "publicly_accessible"), true)
        conditionFormat: cel
    remediation:
        summary: Modify the RDS instance to disable public accessibility and use VPC endpoints or bastion hosts.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - 2.3.3
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
