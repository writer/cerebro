apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-alb-http-to-https
    name: ALB HTTP to HTTPS Redirect
    description: Ensures Application Load Balancers redirect HTTP traffic to HTTPS
    tags:
        - aws
        - alb
        - https
        - redirect
        - tls
spec:
    severity: HIGH
    category: aws
    resourceType: aws_lb_listener
    match:
        query: 'SELECT _cq_id AS id, load_balancer_arn, port, protocol FROM aws_lb_listeners WHERE protocol = ''HTTP'' AND NOT (default_actions ILIKE ''%"Type": "redirect"%'' AND default_actions ILIKE ''%"Protocol": "HTTPS"%'')'
    remediation:
        summary: Configure HTTP listeners to redirect to HTTPS. Add a redirect action on port 80 listeners.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-8
            - SC-12
            - SC-13
            - SC-23
            - SC-28
        - name: CIS Controls v8
          controls:
            - "3"
        - name: PCI DSS v4.0.1
          controls:
            - "4.2"
    enabled: true
