apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-cloudtrail-kms-encryption
    name: CloudTrail KMS Encryption Enabled
    description: CloudTrail trails should have KMS encryption enabled using an AWS KMS key for additional security of log files stored in S3
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-3.7
        - cloudtrail
        - encryption
        - kms
        - logging
spec:
    severity: medium
    effect: forbid
    resource: aws_cloudtrail_trails
    match:
        conditions:
            - cmp_eq(path(resource, "kms_key_id"), null)
        conditionFormat: cel
    remediation:
        summary: Enable KMS encryption for CloudTrail by specifying a KMS key ID in the trail configuration. Use aws cloudtrail update-trail --name <trail-name> --kms-key-id <kms-key-arn>
        steps:
            - Navigate to CloudTrail in the AWS Console
            - Select the trail that needs encryption
            - Click 'Edit' and scroll to 'Log file SSE-KMS encryption'
            - Enable the option and select or create a KMS key
            - Save the changes
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "3.7"
        - name: NIST 800-53 r5
          controls:
            - AU-9
            - SC-28
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.33
            - A.8.24
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562.008
