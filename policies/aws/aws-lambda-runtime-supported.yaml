apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-lambda-runtime-supported
    name: Lambda Runtime Supported
    description: Lambda functions should use supported runtimes
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - lambda
        - serverless
        - runtime
        - deprecation
spec:
    severity: medium
    effect: forbid
    resource: aws::lambda::function
    match:
        conditions:
            - in_list(path(resource, "runtime"), ["['python2.7","python3.6","nodejs10.x","nodejs12.x","dotnetcore2.1","ruby2.5']"])
        conditionFormat: cel
    remediation:
        summary: Upgrade Lambda function to a supported runtime version.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
        - name: NIST 800-53 r5
          controls:
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "6.3"
            - "11.3"
        - name: CIS Controls v8
          controls:
            - "7"
    mitreAttack:
        - tactic: Execution
          technique: T1059
