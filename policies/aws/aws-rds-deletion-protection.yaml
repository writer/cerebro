apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-rds-deletion-protection
    name: RDS Deletion Protection
    description: RDS instances should have deletion protection enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - rds
        - database
        - data-protection
spec:
    severity: medium
    effect: forbid
    resource: aws::rds::db_instance
    match:
        conditions:
            - cmp_ne(path(resource, "deletion_protection"), true)
        conditionFormat: cel
    remediation:
        summary: Enable deletion protection to prevent accidental database deletion.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
            - A1.1
            - A1.2
        - name: ISO 27001:2022
          controls:
            - A.5.30
            - A.8.13
        - name: NIST 800-53 r5
          controls:
            - CP-9
            - CP-10
    mitreAttack:
        - tactic: Collection
          technique: T1530
