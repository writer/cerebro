apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-sns-public-access
    name: SNS Topic Allows Public Access
    description: SNS topic policy allows access from any AWS account or public access
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - sns
        - messaging
        - public-access
spec:
    severity: high
    effect: forbid
    resource: aws::sns::topic
    match:
        conditions:
            - list_value(path(resource, "policy.Statement")).exists(item, (cmp_eq(path(item, "Principal"), "*")) && (cmp_eq(path(item, "Condition"), null)))
        conditionFormat: cel
    remediation:
        summary: Update SNS topic policy to restrict access to specific AWS accounts or principals. Add conditions to limit access scope.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
