apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-s3-bucket-versioning-enabled
    name: S3 Bucket Versioning Enabled
    description: S3 bucket should have versioning enabled for data protection
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - s3
        - data-protection
        - versioning
        - backup
spec:
    severity: medium
    effect: forbid
    resource: aws::s3::bucket
    match:
        conditions:
            - cmp_ne(path(resource, "versioning.status"), "Enabled")
        conditionFormat: cel
    remediation:
        summary: Enable versioning on the S3 bucket to protect against accidental deletion.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
            - A1.1
            - A1.2
        - name: ISO 27001:2022
          controls:
            - A.5.30
            - A.8.13
        - name: NIST 800-53 r5
          controls:
            - CP-9
            - CP-10
    mitreAttack:
        - tactic: Collection
          technique: T1530
