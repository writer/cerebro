apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-no-full-admin
    name: IAM Policies No Full Administrative Privileges
    description: Ensures IAM policies do not allow full administrative privileges (Action:* on Resource:*)
    tags:
        - aws
        - iam
        - admin
        - least-privilege
        - security
spec:
    severity: CRITICAL
    category: aws
    resourceType: aws_iam_policy
    match:
        query: 'SELECT p.id, p.policy_name, p.arn FROM aws_iam_policies p JOIN aws_iam_policy_default_versions v ON p.arn = v.policy_arn WHERE v.document_json ILIKE ''%"Action": "*"%'' AND v.document_json ILIKE ''%"Resource": "*"%'' AND v.document_json ILIKE ''%"Effect": "Allow"%'''
    remediation:
        summary: Review and restrict IAM policies. Replace full admin policies with least-privilege permissions specific to required actions and resources.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
        - name: ISO 27001:2022
          controls:
            - A.5.15
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
    enabled: true
