apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-codebuild-public-trigger
    name: CodeBuild Project with Public Webhook
    description: CodeBuild project has a public webhook that can be triggered by external sources
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - codebuild
        - supply-chain
        - ci-cd
spec:
    severity: high
    effect: forbid
    resource: aws::codebuild::project
    match:
        conditions:
            - list_value(path(resource, "webhook.filter_groups")).exists(item, list_value(path(item, "filters")).exists(item, (cmp_eq(path(item, "type"), "EVENT")) && (contains_value(path(item, "pattern"), "PULL_REQUEST"))))
            - in_list(path(resource, "source.type"), ["GITHUB","BITBUCKET","GITLAB"])
        conditionFormat: cel
    remediation:
        summary: Configure webhook filters to only accept events from trusted sources. Use branch filters and file path filters. Enable build badge but disable webhook for public repos.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Execution
          technique: T1059
