apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-rds-iam-authentication
    name: RDS IAM Authentication
    description: RDS instances should have IAM database authentication enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - rds
        - database
        - iam
        - authentication
spec:
    severity: low
    effect: forbid
    resource: aws::rds::db_instance
    match:
        conditions:
            - cmp_ne(path(resource, "iam_database_authentication_enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable IAM database authentication for centralized credential management.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "7.2"
        - name: CIS Controls v8
          controls:
            - "6"
            - "5"
        - name: SOC 2
          controls:
            - CC6
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
