apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-lambda-no-env-secrets
    name: Lambda No Environment Secrets
    description: Lambda functions should not have secrets in environment variables
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - lambda
        - serverless
        - secrets
        - credentials
spec:
    severity: high
    effect: forbid
    resource: aws::lambda::function
    match:
        conditions:
            - matches_value(path(resource, "environment.variables"), "(?i)(password|secret|api_key|apikey|token|credential)")
        conditionFormat: cel
    remediation:
        summary: Use AWS Secrets Manager or Parameter Store for sensitive values instead of environment variables.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Execution
          technique: T1059
        - tactic: Credential Access
          technique: T1552
