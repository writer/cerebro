apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ecr-scan-on-push
    name: ECR Scan on Push Enabled
    description: ECR repositories should have scan on push enabled to detect vulnerabilities
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ecr
        - container
        - vulnerability
        - scanning
spec:
    severity: medium
    effect: forbid
    resource: aws::ecr::repository
    match:
        conditions:
            - cmp_ne(path(resource, "image_scanning_configuration.scan_on_push"), true)
        conditionFormat: cel
    remediation:
        summary: Enable scan on push in the ECR repository image scanning configuration.
    riskCategories:
        - MISCONFIGURATION
        - VULNERABILITY
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "6.3"
            - "11.3"
        - name: CIS Controls v8
          controls:
            - "7"
