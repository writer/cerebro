apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-secretsmanager-rotation-enabled
    name: Secrets Manager Rotation Enabled
    description: Secrets Manager secrets should have automatic rotation enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - secretsmanager
        - secrets
        - rotation
        - credentials
spec:
    severity: medium
    effect: forbid
    resource: aws::secretsmanager::secret
    match:
        conditions:
            - cmp_ne(path(resource, "rotation_enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable automatic rotation for the secret with an appropriate rotation Lambda function.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Credential Access
          technique: T1552
