apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-password-policy-no-reuse
    name: IAM Password Policy Prevents Reuse
    description: IAM password policy should prevent password reuse by remembering at least 24 previous passwords
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-1.9
        - iam
        - password-policy
        - authentication
spec:
    severity: medium
    effect: forbid
    resource: aws_iam_account_password_policy
    match:
        conditions:
            - cmp_lt(path(resource, "password_reuse_prevention"), 24)
        conditionFormat: cel
    remediation:
        summary: 'Update the IAM password policy to prevent reuse of at least 24 previous passwords. Use: aws iam update-account-password-policy --password-reuse-prevention 24'
        steps:
            - Navigate to IAM in AWS Console
            - Select 'Account settings' from the left menu
            - Click 'Edit' for the password policy
            - Set 'Number of passwords to remember' to 24
            - Save changes
    riskCategories:
        - MISCONFIGURATION
        - IDENTITY_RISK
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "1.9"
        - name: NIST 800-53 r5
          controls:
            - IA-5
        - name: SOC 2
          controls:
            - CC6.1
        - name: PCI DSS v4.0.1
          controls:
            - 8.3.7
