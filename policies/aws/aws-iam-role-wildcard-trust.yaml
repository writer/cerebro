apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-role-wildcard-trust
    name: IAM Role Wildcard Trust Policy
    description: IAM role trust policy allows assumption from any AWS account or principal
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - iam
        - trust-policy
        - lateral-movement
        - privilege-escalation
spec:
    severity: critical
    effect: forbid
    resource: aws::iam::role
    match:
        conditions:
            - cmp_eq(path(resource, "assume_role_policy_document.Statement.Principal.AWS"), "*")
        conditionFormat: cel
    remediation:
        summary: Restrict trust policy to specific accounts, roles, or services with conditions.
    riskCategories:
        - IDENTITY_RISK
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Lateral Movement
          technique: T1021
