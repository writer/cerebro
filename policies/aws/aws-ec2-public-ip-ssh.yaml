apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ec2-public-ip-ssh
    name: EC2 Public IP with SSH Exposed
    description: EC2 instance has public IP with SSH port 22 open to the internet (0.0.0.0/0)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-5.2
        - exposure
        - ec2
        - network
        - ssh
spec:
    severity: critical
    effect: forbid
    resource: aws::ec2::instance
    match:
        conditions:
            - cmp_ne(path(resource, "public_ip_address"), null)
            - cmp_le(path(resource, "security_groups.ingress.from_port"), 22)
            - cmp_ge(path(resource, "security_groups.ingress.to_port"), 22)
            - contains_value(path(resource, "security_groups.ingress.cidr_blocks"), "0.0.0.0/0")
        conditionFormat: cel
    remediation:
        summary: Remove public IP or restrict security group to specific IP ranges. Use AWS Systems Manager Session Manager for secure access.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "5.2"
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
