apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ec2-sg-no-all-traffic-ingress
    name: Security Group No All Traffic Ingress
    description: Security group should not allow all traffic (0.0.0.0/0 on all ports) inbound
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-5.4
        - security-group
        - network
        - exposure
spec:
    severity: critical
    effect: forbid
    resource: aws::ec2::security_group
    match:
        conditions:
            - cmp_eq(path(resource, "ip_permissions.ip_protocol"), "-1")
            - contains_value(path(resource, "ip_permissions.ip_ranges"), "0.0.0.0/0")
        conditionFormat: cel
    remediation:
        summary: Restrict security group rules to specific ports and IP ranges.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "5.4"
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
