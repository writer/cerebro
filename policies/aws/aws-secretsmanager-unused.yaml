apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-secretsmanager-secret-used
    name: Secrets Manager Secret Used
    description: Secrets Manager secrets should be accessed within 90 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - secretsmanager
        - secrets
        - hygiene
spec:
    severity: low
    effect: forbid
    resource: aws::secretsmanager::secret
    match:
        conditions:
            - cmp_gt(path(resource, "last_accessed_date_days"), 90)
        conditionFormat: cel
    remediation:
        summary: Review and delete unused secrets or update applications to use them.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
