apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-eks-secrets-encryption
    name: EKS Secrets Encryption
    description: EKS cluster should have envelope encryption for Kubernetes secrets
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-eks-5.1.1
        - eks
        - kubernetes
        - encryption
        - secrets
spec:
    severity: high
    effect: forbid
    resource: aws::eks::cluster
    match:
        conditions:
            - cmp_eq(path(resource, "encryption_config"), null)
        conditionFormat: cel
    remediation:
        summary: Enable envelope encryption for secrets using a KMS key.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
            - IA-5
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
            - "8.6"
        - name: CIS Controls v8
          controls:
            - "3"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
