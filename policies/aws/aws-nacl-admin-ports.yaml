apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-nacl-admin-ports-restricted
    name: Network ACLs Restrict Admin Port Access
    description: Network ACLs should not allow unrestricted ingress (0.0.0.0/0) to remote server administration ports (SSH port 22, RDP port 3389)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-5.1
        - nacl
        - vpc
        - network-security
        - admin-access
spec:
    severity: high
    effect: forbid
    resource: aws_ec2_network_acls
    match:
        conditions:
            - cmp_eq(path(resource, "allows_admin_ports_from_internet"), true)
        conditionFormat: cel
    remediation:
        summary: Modify Network ACL rules to restrict access to ports 22 and 3389 from specific IP ranges only, not 0.0.0.0/0
        steps:
            - Navigate to VPC in AWS Console
            - Select 'Network ACLs'
            - Review inbound rules for each NACL
            - Identify rules allowing 0.0.0.0/0 to ports 22 or 3389
            - Modify or remove these rules
            - Add rules allowing access only from trusted IP ranges
    riskCategories:
        - EXTERNAL_EXPOSURE
        - EXTERNAL_ATTACK_SURFACE
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "5.1"
        - name: NIST 800-53 r5
          controls:
            - AC-4
            - SC-7
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
        - name: PCI DSS v4.0.1
          controls:
            - 1.3.1
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Lateral Movement
          technique: T1021
