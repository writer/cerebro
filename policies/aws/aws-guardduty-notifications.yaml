apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-guardduty-notifications
    name: GuardDuty Findings Have Notifications Configured
    description: GuardDuty findings should be configured to send notifications via SNS, EventBridge, or another alerting mechanism to ensure security team awareness
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - guardduty
        - notifications
        - alerting
        - incident-response
spec:
    severity: high
    effect: forbid
    resource: aws_guardduty_detectors
    match:
        conditions:
            - cmp_eq(path(resource, "has_notification_configuration"), false)
        conditionFormat: cel
    remediation:
        summary: Configure EventBridge rules to capture GuardDuty findings and send notifications to SNS topics or other targets
        steps:
            - Navigate to EventBridge in AWS Console
            - Create a new rule with source 'aws.guardduty'
            - Select 'GuardDuty Finding' as the event type
            - Add targets (SNS topic, Lambda, or other notification services)
            - Alternatively, configure GuardDuty to publish to SNS directly in the GuardDuty settings
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IR-4
            - SI-4
        - name: SOC 2
          controls:
            - CC7.2
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.5.24
            - A.5.25
