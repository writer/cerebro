apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-cloudtrail-enabled
    name: CloudTrail Enabled
    description: CloudTrail should be enabled in all regions
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-3.1
        - security
        - cloudtrail
        - audit
spec:
    severity: critical
    effect: forbid
    resource: aws::cloudtrail::trail
    match:
        conditions:
            - cmp_ne(path(resource, "is_multi_region_trail"), true)
        conditionFormat: cel
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "3.1"
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
        - name: SOC 2
          controls:
            - CC4
            - CC7.2
        - name: CIS Controls v8
          controls:
            - "8"
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
