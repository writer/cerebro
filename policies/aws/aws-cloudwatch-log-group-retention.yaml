apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-cloudwatch-log-group-retention
    name: CloudWatch Log Group Retention
    description: CloudWatch log groups should have a retention policy set
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cloudwatch
        - logging
        - retention
        - cost
spec:
    severity: low
    effect: forbid
    resource: aws::logs::log_group
    match:
        conditions:
            - cmp_eq(path(resource, "retention_in_days"), null)
        conditionFormat: cel
    remediation:
        summary: Set a retention policy on the log group to manage storage costs and compliance requirements.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
        - name: SOC 2
          controls:
            - CC4
            - CC7.2
            - A1.1
            - A1.3
        - name: CIS Controls v8
          controls:
            - "8"
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
