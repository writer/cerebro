apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-s3-bucket-no-public-access
    name: S3 Bucket Public Access
    description: S3 buckets should not allow public access
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-2.1.5
        - security
        - s3
        - data-exposure
spec:
    severity: critical
    effect: forbid
    resource: aws::s3::bucket
    match:
        conditions:
            - cmp_ne(path(resource, "block_public_acls"), true)
        conditionFormat: cel
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - 2.1.5
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
