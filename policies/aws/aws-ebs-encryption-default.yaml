apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ebs-encryption-default
    name: EBS Encryption by Default
    description: EBS encryption should be enabled by default in each region
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-2.2.1
        - ebs
        - encryption
        - data-protection
spec:
    severity: medium
    effect: forbid
    resource: aws::ec2::ebs_encryption_by_default
    match:
        conditions:
            - cmp_ne(path(resource, "ebs_encryption_enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable EBS encryption by default in each region using the EC2 console or EnableEbsEncryptionByDefault API.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - 2.2.1
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
        - name: CIS Controls v8
          controls:
            - "3"
    mitreAttack:
        - tactic: Collection
          technique: T1530
