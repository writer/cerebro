apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-user-multiple-access-keys
    name: IAM User Multiple Access Keys
    description: IAM user has more than one active access key
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - iam
        - hygiene
        - access-keys
spec:
    severity: low
    effect: forbid
    resource: aws::iam::user
    match:
        conditions:
            - cmp_eq(path(resource, "access_key_1_active"), true)
            - cmp_eq(path(resource, "access_key_2_active"), true)
        conditionFormat: cel
    remediation:
        summary: Rotate access keys and ensure only one is active at a time.
    riskCategories:
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Credential Access
          technique: T1552
