apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-lambda-not-publicly-accessible
    name: Lambda Not Publicly Accessible
    description: Lambda functions should not be publicly invocable
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - lambda
        - serverless
        - exposure
        - public-access
spec:
    severity: high
    effect: forbid
    resource: aws::lambda::function
    match:
        conditions:
            - cmp_eq(path(resource, "policy.Statement.Principal"), "*")
            - cmp_eq(path(resource, "policy.Statement.Effect"), "Allow")
        conditionFormat: cel
    remediation:
        summary: Restrict Lambda resource policy to specific principals or use API Gateway with authentication.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Execution
          technique: T1059
