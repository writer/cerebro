apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ec2-public-ports-restricted
    name: EC2 Instance Public Ports Restricted
    description: Ensures EC2 instances do not expose sensitive ports (SSH, RDP, databases) to the public internet
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - ec2
        - network
        - security-group
        - ports
        - exposure
spec:
    severity: critical
    effect: forbid
    resource: aws_ec2_instances
    match:
        conditions:
            - exists_path(resource, "public_ip_address")
            - '(cmp_gt(path(resource, "security_groups @"), "[{\"rules\": [{\"from_port\": 22, \"cidr\": \"0.0.0.0/0\"}]}]")) || (cmp_gt(path(resource, "security_groups @"), "[{\"rules\": [{\"from_port\": 3389, \"cidr\": \"0.0.0.0/0\"}]}]")) || (cmp_gt(path(resource, "security_groups @"), "[{\"rules\": [{\"from_port\": 3306, \"cidr\": \"0.0.0.0/0\"}]}]")) || (cmp_gt(path(resource, "security_groups @"), "[{\"rules\": [{\"from_port\": 5432, \"cidr\": \"0.0.0.0/0\"}]}]"))'
        conditionFormat: cel
    remediation:
        summary: Restrict security group rules to allow access only from specific IP ranges or through a bastion host/VPN. Remove 0.0.0.0/0 CIDR blocks for sensitive ports.
        steps:
            - Identify EC2 instances with public IPs and open sensitive ports
            - Review security groups attached to these instances
            - Remove or restrict inbound rules allowing 0.0.0.0/0 for ports 22, 3389, 3306, 5432
            - Implement bastion hosts or VPN for administrative access
            - Use AWS Systems Manager Session Manager for SSH-less access
    riskCategories:
        - EXPOSED_INFRASTRUCTURE
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "5.2"
            - "5.3"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
        - name: ISO 27001:2022
          controls:
            - A.8.20
            - A.8.22
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - AC-4
            - SC-7
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
