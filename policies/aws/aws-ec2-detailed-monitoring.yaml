apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ec2-detailed-monitoring-enabled
    name: EC2 Detailed Monitoring Enabled
    description: EC2 instances should have detailed monitoring enabled for better observability
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ec2
        - monitoring
        - observability
spec:
    severity: low
    effect: forbid
    resource: aws::ec2::instance
    match:
        conditions:
            - cmp_ne(path(resource, "monitoring.state"), "enabled")
        conditionFormat: cel
    remediation:
        summary: Enable detailed monitoring on the EC2 instance for 1-minute CloudWatch metrics.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
        - name: SOC 2
          controls:
            - CC4
            - CC7.2
            - CC7.3
        - name: CIS Controls v8
          controls:
            - "8"
