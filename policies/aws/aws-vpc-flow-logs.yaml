apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-vpc-flow-logs-enabled
    name: VPC Flow Logs Enabled
    description: VPC Flow Logs should be enabled for all VPCs to capture network traffic metadata
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-3.9
        - vpc
        - network
        - logging
        - monitoring
spec:
    severity: medium
    effect: forbid
    resource: aws::ec2::vpc
    match:
        conditions:
            - cmp_eq(path(resource, "flow_logs_count"), 0)
        conditionFormat: cel
    remediation:
        summary: Enable VPC Flow Logs for the VPC. Configure to send logs to CloudWatch Logs or S3 for analysis.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "3.9"
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
        - name: SOC 2
          controls:
            - CC4
            - CC7.2
            - CC7.3
        - name: CIS Controls v8
          controls:
            - "8"
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
        - tactic: Collection
          technique: T1530
