apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-password-policy
    name: IAM Password Policy Requirements
    description: IAM password policy should enforce strong passwords with minimum length, complexity, and rotation requirements
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-1.8
        - cis-aws-1.9
        - cis-aws-1.10
        - iam
        - authentication
spec:
    severity: medium
    effect: forbid
    resource: aws::iam::account_password_policy
    match:
        conditions:
            - cmp_lt(path(resource, "minimum_password_length"), 14)
            - cmp_ne(path(resource, "require_symbols"), true)
            - cmp_ne(path(resource, "require_numbers"), true)
            - cmp_ne(path(resource, "require_uppercase_characters"), true)
            - cmp_ne(path(resource, "require_lowercase_characters"), true)
            - cmp_gt(path(resource, "max_password_age"), 90)
        conditionFormat: cel
    remediation:
        summary: Update the IAM password policy to require minimum 14 characters, symbols, numbers, and uppercase/lowercase letters with 90-day rotation.
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "1.8"
            - "1.9"
            - "1.10"
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "7.2"
        - name: CIS Controls v8
          controls:
            - "6"
            - "5"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Credential Access
          technique: T1552
