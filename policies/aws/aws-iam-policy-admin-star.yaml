apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-policy-no-admin-star
    name: IAM Policy No Admin Star
    description: IAM policy should not grant full administrative privileges (*:*)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-1.16
        - iam
        - least-privilege
        - admin
spec:
    severity: high
    effect: forbid
    resource: aws::iam::policy
    match:
        conditions:
            - cmp_eq(path(resource, "policy_document.Statement.Effect"), "Allow")
            - cmp_eq(path(resource, "policy_document.Statement.Action"), "*")
            - cmp_eq(path(resource, "policy_document.Statement.Resource"), "*")
        conditionFormat: cel
    remediation:
        summary: Replace wildcard permissions with specific actions and resources following least privilege principle.
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "1.16"
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
