apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ecr-public-repository
    name: ECR Public Repository
    description: ECR repository is publicly accessible, potentially exposing container images
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - ecr
        - containers
        - data-exposure
spec:
    severity: high
    effect: forbid
    resource: aws::ecr_public::repository
    match:
        conditions:
            - cmp_eq(path(resource, "repository_visibility"), "PUBLIC")
        conditionFormat: cel
    remediation:
        summary: Use private ECR repositories. If public access is required, ensure no sensitive data or credentials are included in images. Use separate repositories for public images.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
