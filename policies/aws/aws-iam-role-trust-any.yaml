apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-role-trust-any-principal
    name: IAM Role Trusts Any Principal
    description: IAM role trust policy allows any AWS principal to assume the role
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - iam
        - lateral-movement
        - privilege-escalation
        - trust-policy
spec:
    severity: critical
    effect: forbid
    resource: aws::iam::role
    match:
        conditions:
            - cmp_eq(path(resource, "assume_role_policy_document.Statement.Principal"), "*")
        conditionFormat: cel
    remediation:
        summary: Restrict the trust policy to specific AWS accounts, services, or principals.
    riskCategories:
        - IDENTITY_RISK
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Lateral Movement
          technique: T1021
