apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-access-key-rotation
    name: IAM Access Key Rotation
    description: IAM access keys should be rotated within 90 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-1.14
        - iam
        - access-key
        - rotation
        - credentials
spec:
    severity: medium
    effect: forbid
    resource: aws::iam::access_key
    match:
        conditions:
            - cmp_gt(path(resource, "create_date_days"), 90)
        conditionFormat: cel
    remediation:
        summary: Rotate access keys by creating a new key, updating applications, and deleting the old key.
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "1.14"
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Persistence
          technique: T1098
        - tactic: Credential Access
          technique: T1552
