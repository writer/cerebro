apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-kms-key-rotation-enabled
    name: KMS Key Rotation Enabled
    description: Customer-managed KMS keys should have automatic rotation enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-3.8
        - kms
        - encryption
        - key-management
spec:
    severity: medium
    effect: forbid
    resource: aws::kms::key
    match:
        conditions:
            - cmp_eq(path(resource, "key_manager"), "CUSTOMER")
            - cmp_ne(path(resource, "key_rotation_enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable automatic key rotation for customer-managed KMS keys using the KMS console or EnableKeyRotation API.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "3.8"
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
            - IA-5
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
            - "8.6"
        - name: CIS Controls v8
          controls:
            - "3"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
