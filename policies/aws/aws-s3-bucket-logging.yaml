apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-s3-bucket-logging-enabled
    name: S3 Bucket Logging Enabled
    description: S3 bucket should have server access logging enabled for audit trail
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-3.6
        - s3
        - logging
        - audit
spec:
    severity: medium
    effect: forbid
    resource: aws::s3::bucket
    match:
        conditions:
            - cmp_ne(path(resource, "logging_enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable server access logging on the S3 bucket to capture access requests.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "3.6"
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
            - "7.2"
        - name: SOC 2
          controls:
            - CC4
            - CC6.2
            - CC7.2
        - name: CIS Controls v8
          controls:
            - "8"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
        - tactic: Collection
          technique: T1530
