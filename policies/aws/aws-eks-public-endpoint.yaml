apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-eks-public-endpoint-disabled
    name: EKS Public Endpoint Disabled
    description: EKS cluster API server endpoint should not be publicly accessible
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - eks
        - kubernetes
        - exposure
        - api-server
spec:
    severity: high
    effect: forbid
    resource: aws::eks::cluster
    match:
        conditions:
            - cmp_eq(path(resource, "resources_vpc_config.endpoint_public_access"), true)
            - contains_value(path(resource, "resources_vpc_config.public_access_cidrs"), "0.0.0.0/0")
        conditionFormat: cel
    remediation:
        summary: Disable public endpoint or restrict to specific CIDR blocks. Use VPC endpoints for private access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
