apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ecs-active-candidate-secret-role-path
    name: Candidate ECS Launch Retains an Active Secret-Bearing Execution Path
    description: Detects an observed ECS RunTask path where a candidate workload depends on a task definition that remains active with secret bindings and an execution role.
    tags:
        - aws
        - ecs
        - workload-identity
        - secrets
        - graph-backed
    references:
        - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html
spec:
    severity: HIGH
    category: cloud_security
    resourceType: aws_ecs_task_definition
    remediation:
        summary: Deregister the candidate task definition or replace its secret bindings and execution role before another task is launched.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
        - name: ISO 27001:2022
          controls:
            - A.5.15
            - A.8.2
    input:
        sourceKinds:
            - aws.cloudtrail
            - aws.ecs_task_definition
        requiredFields:
            - event_type
            - task_arn
            - task_definition_arn
            - status
            - has_candidate_marker
            - has_secret_bindings
            - execution_role_arn
        freshnessSLA: 24h
    evidence:
        type: configuration_snapshot
        assessmentMethods:
            - examine
        requiredForAudit: true
        acceptableSources:
            - aws
        requiredFields:
            - task_arn
            - task_definition_arn
            - execution_role_arn
            - graph_evidence_count
        fingerprintFields:
            - tenant_id
            - policy_id
            - resource_urn
            - resource_id
    audit:
        evidenceType: configuration_snapshot
        assessmentMethods:
            - examine
        freshnessSLA: 24h
        auditorStatement: Candidate ECS workloads must not retain active launch paths to secret-bearing execution roles.
        riskStatement: An active candidate task definition can be relaunched with its configured secret bindings and execution-role permissions.
        remediationIntent: Remove the active launch path by deregistering the candidate definition or isolating its secrets and execution role.
        auditorGuidance: Confirm the CloudTrail launch edge, current task-definition status, secret-binding indicator, and execution-role edge before remediation.
        falsePositives:
            - A controlled pre-production account may permit candidate workloads with isolated secrets and a purpose-scoped execution role; retain the isolation evidence with an exception.
    verification:
        fixtures:
            - name: candidate launch reaches secret-bearing execution role
              expect: finding
              description: A RunTask actor reaches a candidate task, active secret-bearing definition, and execution role through the projected AWS graph.
            - name: candidate definition has no execution-role path
              expect: pass
              description: The same assets pass when the policy-critical task-definition-to-role edge is absent.
        mutationChecks:
            - remove_execution_role_edge
            - deregister_candidate_task_definition
        remediationCheck:
            rerunAfter: source_sync
            expectedStatus: closed
    graph:
        query: |-
            MATCH (actor:Entity {tenant_id: $tenant_id, source_id: 'aws', entity_type: 'aws.assumed_role_session'})-[launch:RELATION {relation: 'acted_on'}]->(task:Entity {tenant_id: $tenant_id, source_id: 'aws', entity_type: 'aws.ecs.task'})-[:RELATION {relation: 'depends_on'}]->(definition:Entity {tenant_id: $tenant_id, source_id: 'aws', entity_type: 'aws.ecs.task_definition'})-[role_use:RELATION {relation: 'runs_as'}]->(role:Entity {tenant_id: $tenant_id, source_id: 'aws', entity_type: 'aws.role'})
            WITH actor, launch, task, definition, role_use, role,
                 toLower(coalesce(launch.attributes_json, '')) AS launch_attrs,
                 toLower(coalesce(task.attributes_json, '')) AS task_attrs,
                 toLower(coalesce(definition.attributes_json, '')) AS definition_attrs,
                 toLower(coalesce(role_use.attributes_json, '')) AS role_attrs
            WHERE launch_attrs CONTAINS '"event_type":"runtask"'
              AND task_attrs CONTAINS '"started_by":"'
              AND task_attrs CONTAINS 'candidate'
              AND definition_attrs CONTAINS '"status":"active"'
              AND definition_attrs CONTAINS '"has_candidate_marker":"true"'
              AND definition_attrs CONTAINS '"has_secret_bindings":"true"'
              AND role_attrs CONTAINS '"role_usage":"execution"'
            RETURN definition.urn AS primary_urn,
                   definition.label AS primary_label,
                   definition.entity_type AS primary_type,
                   definition.urn + '|' + role.urn AS fingerprint_key,
                   'HIGH' AS severity,
                   'Active candidate ECS task definition ' + coalesce(definition.label, definition.urn) + ' was launched with secret bindings and execution role ' + coalesce(role.label, role.urn) AS summary,
                   'Deregister the candidate task definition or replace its secret bindings and execution role before another launch' AS action,
                   [actor.urn, task.urn, definition.urn, role.urn] AS resource_urns,
                   [{urn: actor.urn, label: actor.label, entity_type: actor.entity_type, relation: 'acted_on', attributes_json: coalesce(launch.attributes_json, '')},
                    {urn: task.urn, label: task.label, entity_type: task.entity_type, relation: 'depends_on', attributes_json: coalesce(task.attributes_json, '')},
                    {urn: definition.urn, label: definition.label, entity_type: definition.entity_type, relation: 'runs_as', attributes_json: coalesce(definition.attributes_json, '')},
                    {urn: role.urn, label: role.label, entity_type: role.entity_type, relation: 'execution_role', attributes_json: coalesce(role.attributes_json, '')}] AS evidence,
                   {evidence_basis: 'cloudtrail_run_task_to_current_ecs_definition_to_execution_role', confidence: 'high', remediation_intent: 'Remove the active candidate launch path or isolate its secrets and execution role', source_provenance: 'aws.cloudtrail RunTask plus aws.ecs_task_definition current inventory', limitation: 'Secret names and values are intentionally omitted; the finding uses only the presence and count of secret bindings.'} AS finding_attributes
            ORDER BY definition.urn, role.urn
            LIMIT $row_limit
        rowLimit: 500
        requiredColumns:
            - primary_urn
            - fingerprint_key
            - summary
            - resource_urns
    enabled: true
