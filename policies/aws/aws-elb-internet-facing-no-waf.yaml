apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-elb-internet-facing-no-waf
    name: Internet-Facing ALB Without WAF
    description: Application Load Balancer is internet-facing without AWS WAF protection
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - alb
        - waf
        - exposure
        - network
spec:
    severity: high
    effect: forbid
    resource: aws::elbv2::load_balancer
    match:
        conditions:
            - cmp_eq(path(resource, "scheme"), "internet-facing")
            - cmp_eq(path(resource, "type"), "application")
            - cmp_eq(path(resource, "waf_web_acl_arn"), null)
        conditionFormat: cel
    remediation:
        summary: Associate an AWS WAF WebACL with the Application Load Balancer to protect against common web exploits.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
