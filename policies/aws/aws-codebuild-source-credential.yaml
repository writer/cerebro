apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-codebuild-source-credential
    name: CodeBuild Source Credentials Stored Insecurely
    description: CodeBuild project stores source credentials directly instead of using Secrets Manager or Parameter Store
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - codebuild
        - secrets
        - ci-cd
        - cwe-522
spec:
    severity: high
    effect: forbid
    resource: aws::codebuild::source_credential
    match:
        conditions:
            - cmp_eq(path(resource, "auth_type"), "BASIC_AUTH")
            - in_list(path(resource, "server_type"), ["GITHUB","GITHUB_ENTERPRISE","BITBUCKET","GITLAB"])
        conditionFormat: cel
    remediation:
        summary: Use OAuth or personal access tokens stored in Secrets Manager. Configure CodeBuild to use credential references. Rotate any exposed credentials immediately.
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Execution
          technique: T1059
        - tactic: Credential Access
          technique: T1552
