apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-sns-topic-encrypted
    name: SNS Topic Encrypted
    description: SNS topics should be encrypted with KMS
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - sns
        - encryption
        - messaging
spec:
    severity: medium
    effect: forbid
    resource: aws::sns::topic
    match:
        conditions:
            - cmp_eq(path(resource, "kms_master_key_id"), null)
        conditionFormat: cel
    remediation:
        summary: Enable server-side encryption for the SNS topic using a KMS key.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
        - name: CIS Controls v8
          controls:
            - "3"
