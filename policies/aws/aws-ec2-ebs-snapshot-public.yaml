apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ec2-ebs-snapshot-not-public
    name: EBS Snapshot Not Public
    description: EBS snapshots should not be publicly accessible
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ebs
        - data-exposure
        - snapshot
        - public-access
spec:
    severity: critical
    effect: forbid
    resource: aws::ec2::ebs_snapshot
    match:
        conditions:
            - contains_value(path(resource, "create_volume_permissions"), "all")
        conditionFormat: cel
    remediation:
        summary: Remove public access from the EBS snapshot by modifying createVolumePermission.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
