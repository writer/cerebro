apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
  - name: candidate task to active secret-bearing definition and execution role produces a finding
    graphFixture:
      tenantId: test-aws-candidate-path
      nodes: &nodes
        - urn: urn:cerebro:test-aws-candidate-path:aws:assumed-role-session:operator
          sourceId: aws
          entityType: aws.assumed_role_session
          label: Deployment operator
        - urn: urn:cerebro:test-aws-candidate-path:aws:ecs-task:candidate-task
          sourceId: aws
          entityType: aws.ecs.task
          label: candidate-task
          attributes:
            started_by: automation-candidate-7
            task_definition_arn: urn:cerebro:test-aws-candidate-path:aws:ecs-task-definition:release-candidate-7
        - urn: urn:cerebro:test-aws-candidate-path:aws:ecs-task-definition:release-candidate-7
          sourceId: aws
          entityType: aws.ecs.task_definition
          label: release-candidate
          attributes:
            status: ACTIVE
            has_candidate_marker: "true"
            has_secret_bindings: "true"
            secret_binding_count: "2"
        - urn: urn:cerebro:test-aws-candidate-path:aws:role:execution-role
          sourceId: aws
          entityType: aws.role
          label: Candidate execution role
      edges:
        - fromUrn: urn:cerebro:test-aws-candidate-path:aws:assumed-role-session:operator
          toUrn: urn:cerebro:test-aws-candidate-path:aws:ecs-task:candidate-task
          sourceId: aws
          relation: acted_on
          attributes:
            event_type: RunTask
        - fromUrn: urn:cerebro:test-aws-candidate-path:aws:ecs-task:candidate-task
          toUrn: urn:cerebro:test-aws-candidate-path:aws:ecs-task-definition:release-candidate-7
          sourceId: aws
          relation: depends_on
        - fromUrn: urn:cerebro:test-aws-candidate-path:aws:ecs-task-definition:release-candidate-7
          toUrn: urn:cerebro:test-aws-candidate-path:aws:role:execution-role
          sourceId: aws
          relation: runs_as
          attributes:
            role_usage: execution
    wantEvidenceUrns:
      - urn:cerebro:test-aws-candidate-path:aws:assumed-role-session:operator
      - urn:cerebro:test-aws-candidate-path:aws:ecs-task:candidate-task
      - urn:cerebro:test-aws-candidate-path:aws:ecs-task-definition:release-candidate-7
      - urn:cerebro:test-aws-candidate-path:aws:role:execution-role
    wantFinding: true
  - name: identical candidate assets without execution role reachability pass
    graphFixture:
      tenantId: test-aws-candidate-path
      nodes: *nodes
      edges:
        - fromUrn: urn:cerebro:test-aws-candidate-path:aws:assumed-role-session:operator
          toUrn: urn:cerebro:test-aws-candidate-path:aws:ecs-task:candidate-task
          sourceId: aws
          relation: acted_on
          attributes:
            event_type: RunTask
        - fromUrn: urn:cerebro:test-aws-candidate-path:aws:ecs-task:candidate-task
          toUrn: urn:cerebro:test-aws-candidate-path:aws:ecs-task-definition:release-candidate-7
          sourceId: aws
          relation: depends_on
    wantFinding: false
