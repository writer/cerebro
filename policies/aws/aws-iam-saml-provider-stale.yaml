apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-saml-provider-stale
    name: IAM SAML Provider Metadata Stale
    description: IAM SAML provider metadata may be outdated (over 1 year old)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - iam
        - saml
        - federation
        - maintenance
spec:
    severity: medium
    effect: forbid
    resource: aws::iam::saml_provider
    match:
        conditions:
            - cmp_lt(path(resource, "valid_until_days"), 0)
        conditionFormat: cel
    remediation:
        summary: Update SAML provider metadata from your identity provider.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
