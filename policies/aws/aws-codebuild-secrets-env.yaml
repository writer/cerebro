apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-codebuild-secrets-in-env-vars
    name: CodeBuild Secrets in Environment Variables
    description: CodeBuild project has potential secrets stored in plaintext environment variables
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - secrets
        - codebuild
        - credentials
        - cicd
spec:
    severity: high
    effect: forbid
    resource: aws::codebuild::project
    match:
        conditions:
            - matches_value(path(resource, "environment.environment_variables.name"), "(?i)(password|secret|api_key|token|credential)")
            - cmp_eq(path(resource, "environment.environment_variables.type"), "PLAINTEXT")
        conditionFormat: cel
    remediation:
        summary: Use PARAMETER_STORE or SECRETS_MANAGER type for sensitive environment variables.
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Execution
          technique: T1059
        - tactic: Credential Access
          technique: T1552
