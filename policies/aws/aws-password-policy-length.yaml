apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-password-policy-minimum-length
    name: IAM Password Policy Minimum Length
    description: IAM password policy should require a minimum password length of at least 14 characters to ensure strong passwords
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-1.8
        - iam
        - password-policy
        - authentication
spec:
    severity: medium
    effect: forbid
    resource: aws_iam_account_password_policy
    match:
        conditions:
            - cmp_lt(path(resource, "minimum_password_length"), 14)
        conditionFormat: cel
    remediation:
        summary: 'Update the IAM password policy to require at least 14 character passwords. Use: aws iam update-account-password-policy --minimum-password-length 14'
        steps:
            - Navigate to IAM in AWS Console
            - Select 'Account settings' from the left menu
            - Click 'Edit' for the password policy
            - Set 'Minimum password length' to at least 14
            - Save changes
    riskCategories:
        - MISCONFIGURATION
        - IDENTITY_RISK
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "1.8"
        - name: NIST 800-53 r5
          controls:
            - IA-5
        - name: SOC 2
          controls:
            - CC6.1
        - name: PCI DSS v4.0.1
          controls:
            - 8.3.6
