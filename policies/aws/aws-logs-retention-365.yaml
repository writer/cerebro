apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-logs-retention-365
    name: CloudWatch Logs Retention 365 Days
    description: Ensures CloudWatch log groups have retention set to at least 365 days
    tags:
        - aws
        - cloudwatch
        - logs
        - retention
        - compliance
spec:
    severity: MEDIUM
    category: aws
    resourceType: aws_cloudwatch_log_group
    match:
        query: SELECT _cq_id AS id, log_group_name, retention_in_days FROM aws_cloudwatch_log_groups WHERE retention_in_days IS NULL OR retention_in_days < 365
    remediation:
        summary: 'Set log retention to 365 days or more. Configure via AWS Console or CLI: aws logs put-retention-policy'
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
