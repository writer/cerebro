apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-role-confused-deputy-prevention
    name: IAM Role Confused Deputy Prevention
    description: IAM role trusted by AWS service should have ExternalId or SourceAccount condition
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - iam
        - trust-policy
        - confused-deputy
        - security
spec:
    severity: medium
    effect: forbid
    resource: aws::iam::role
    match:
        conditions:
            - cmp_ne(path(resource, "assume_role_policy_document.Statement.Principal.Service"), null)
            - cmp_eq(path(resource, "assume_role_policy_document.Statement.Condition"), null)
            - '!(contains_value(path(resource, "path"), "/aws-service-role/"))'
            - '!(contains_value(path(resource, "path"), "/aws-reserved/sso.amazonaws.com/"))'
        conditionFormat: cel
    remediation:
        summary: Add aws:SourceAccount or aws:SourceArn conditions to prevent confused deputy attacks.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - MISCONFIGURATION
        - LATERAL_MOVEMENT
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Lateral Movement
          technique: T1021
