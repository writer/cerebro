apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ec2-internet-facing-iam
    name: Internet-Facing EC2 with Privileged IAM Role
    description: EC2 instance with public IP has an IAM role with administrative or sensitive permissions
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - ec2
        - iam
        - network-exposure
        - privilege-escalation
spec:
    severity: critical
    effect: forbid
    resource: aws::ec2::instance
    match:
        conditions:
            - cmp_ne(path(resource, "public_ip_address"), null)
            - (cmp_eq(path(resource, "iam_instance_profile.role.has_admin_policy"), true)) || (cmp_eq(path(resource, "iam_instance_profile.role.has_sensitive_permissions"), true))
        conditionFormat: cel
    remediation:
        summary: Remove public IP or move to private subnet with NAT. Apply least privilege IAM role. Use Systems Manager Session Manager instead of direct SSH access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Collection
          technique: T1530
