apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-elasticache-public
    name: ElastiCache Cluster in Public Subnet
    description: ElastiCache cluster is deployed in a public subnet, potentially exposing it to the internet
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - elasticache
        - network-exposure
        - data-protection
spec:
    severity: high
    effect: forbid
    resource: aws::elasticache::cluster
    match:
        conditions:
            - list_value(path(resource, "subnet_group.subnets")).exists(item, cmp_eq(path(item, "is_public"), true))
        conditionFormat: cel
    remediation:
        summary: Move the ElastiCache cluster to private subnets. Ensure security groups restrict access to application servers only.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
