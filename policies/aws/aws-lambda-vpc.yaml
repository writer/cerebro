apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-lambda-in-vpc
    name: Lambda In VPC
    description: Lambda functions should be deployed in a VPC for network isolation
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - lambda
        - serverless
        - network
        - vpc
spec:
    severity: low
    effect: forbid
    resource: aws::lambda::function
    match:
        conditions:
            - cmp_eq(path(resource, "vpc_config.subnet_ids"), null)
        conditionFormat: cel
    remediation:
        summary: Configure Lambda function to run within a VPC with appropriate security groups.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-4
            - SC-7
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
        - name: PCI DSS v4.0.1
          controls:
            - 1.3.1
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Execution
          technique: T1059
