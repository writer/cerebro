apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-opensearch-public
    name: OpenSearch Domain Publicly Accessible
    description: OpenSearch domain allows public access without VPC configuration
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - opensearch
        - elasticsearch
        - network-exposure
        - data-protection
spec:
    severity: critical
    effect: forbid
    resource: aws::opensearch::domain
    match:
        conditions:
            - (cmp_eq(path(resource, "vpc_options"), null)) || (cmp_eq(path(resource, "vpc_options.vpc_id"), null))
        conditionFormat: cel
    remediation:
        summary: Deploy the OpenSearch domain within a VPC. Configure security groups and access policies to restrict access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
