apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-cloudwatch-log-group-encrypted
    name: CloudWatch Log Group Encrypted
    description: CloudWatch log groups should be encrypted with KMS
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cloudwatch
        - logging
        - encryption
spec:
    severity: medium
    effect: forbid
    resource: aws::logs::log_group
    match:
        conditions:
            - cmp_eq(path(resource, "kms_key_id"), null)
        conditionFormat: cel
    remediation:
        summary: Associate a KMS key with the CloudWatch log group for encryption at rest.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
            - AU-2
            - AU-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
            - "10.2"
            - "10.3"
        - name: CIS Controls v8
          controls:
            - "3"
            - "8"
        - name: SOC 2
          controls:
            - CC4
            - CC7.2
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
