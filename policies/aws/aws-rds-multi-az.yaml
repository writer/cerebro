apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-rds-multi-az-enabled
    name: RDS Multi-AZ Enabled
    description: RDS instances should have Multi-AZ enabled for high availability
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - rds
        - database
        - availability
        - disaster-recovery
spec:
    severity: medium
    effect: forbid
    resource: aws::rds::db_instance
    match:
        conditions:
            - cmp_ne(path(resource, "multi_az"), true)
            - cmp_ne(path(resource, "engine"), "aurora")
        conditionFormat: cel
    remediation:
        summary: Enable Multi-AZ deployment for the RDS instance.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.2
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.5.30
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - CP-2
            - CP-4
    mitreAttack:
        - tactic: Collection
          technique: T1530
