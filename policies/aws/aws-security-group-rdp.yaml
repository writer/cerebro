apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-security-group-restrict-rdp
    name: Security Group RDP Restriction
    description: Security groups should not allow unrestricted RDP access (0.0.0.0/0 on port 3389)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-5.3
        - security-group
        - network
        - rdp
        - remote-access
spec:
    severity: high
    effect: forbid
    resource: aws::ec2::security_group
    match:
        conditions:
            - cmp_le(path(resource, "ip_permissions.from_port"), 3389)
            - cmp_ge(path(resource, "ip_permissions.to_port"), 3389)
            - contains_value(path(resource, "ip_permissions.ip_ranges"), "0.0.0.0/0")
        conditionFormat: cel
    remediation:
        summary: Restrict RDP access to specific IP ranges or use AWS Systems Manager Session Manager for remote access.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "5.3"
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
