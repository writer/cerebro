apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-s3-bucket-policy-public
    name: S3 Bucket Policy Allows Public Access
    description: 'S3 bucket policy allows public access via Principal: ''*'' without restrictive conditions'
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-2.1.5
        - s3
        - data-exposure
        - public-access
spec:
    severity: critical
    effect: forbid
    resource: aws::s3::bucket
    match:
        conditions:
            - cmp_eq(path(resource, "policy.Statement.Principal"), "*")
            - cmp_eq(path(resource, "policy.Statement.Effect"), "Allow")
            - cmp_eq(path(resource, "policy.Statement.Condition"), null)
        conditionFormat: cel
    remediation:
        summary: Remove public access from bucket policy or add restrictive conditions (e.g., source VPC, IP).
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - 2.1.5
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
