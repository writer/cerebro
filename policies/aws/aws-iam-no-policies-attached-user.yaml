apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-iam-no-policies-attached-user
    name: IAM Policies Attached to Groups Not Users
    description: IAM policies should be attached to groups or roles, not directly to users
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-1.15
        - iam
        - best-practice
        - least-privilege
spec:
    severity: low
    effect: forbid
    resource: aws::iam::user
    match:
        conditions:
            - cmp_ne(path(resource, "attached_policies"), null)
            - cmp_gt(path(resource, "attached_policies.length"), 0)
        conditionFormat: cel
    remediation:
        summary: Detach policies from user and attach to a group. Add user to the group.
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - "1.15"
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
