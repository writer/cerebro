apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-ec2-ebs-volume-encrypted
    name: EBS Volume Encrypted
    description: EBS volume should be encrypted at rest
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aws-2.2.1
        - ebs
        - encryption
        - data-protection
spec:
    severity: medium
    effect: forbid
    resource: aws::ec2::ebs_volume
    match:
        conditions:
            - cmp_ne(path(resource, "encrypted"), true)
        conditionFormat: cel
    remediation:
        summary: Create encrypted snapshots of unencrypted volumes and restore to new encrypted volumes.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - 2.2.1
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
        - name: CIS Controls v8
          controls:
            - "3"
    mitreAttack:
        - tactic: Collection
          technique: T1530
