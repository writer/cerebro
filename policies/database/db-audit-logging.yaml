apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: db-audit-logging
    name: Database Audit Logging Enabled
    description: Ensures audit logging is enabled for database activity tracking
    tags:
        - database
        - audit
        - logging
        - monitoring
spec:
    severity: MEDIUM
    category: database
    resourceType: database
    match:
        query: SELECT id, name, engine, audit_logging_enabled FROM databases WHERE audit_logging_enabled = false
    remediation:
        summary: Enable database audit logging to track queries, logins, and administrative actions.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: HIPAA
          controls:
            - "164.312"
        - name: ISO 27001:2022
          controls:
            - A.5.1
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
    enabled: true
