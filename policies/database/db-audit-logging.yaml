apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: db-audit-logging
    name: Database Audit Logging Enabled
    description: Ensures audit logging is enabled for database activity tracking
    tags:
        - database
        - audit
        - logging
        - monitoring
spec:
    severity: MEDIUM
    category: database
    resourceType: database
    match:
        query: SELECT id, name, engine, audit_logging_enabled FROM databases WHERE audit_logging_enabled = false
    remediation:
        summary: Enable database audit logging to track queries, logins, and administrative actions.
    frameworks:
        - name: SOC 2
          controls:
            - CC4
            - CC7
            - CC7.2
        - name: ISO 27001:2022
          controls:
            - A.8.15
            - A.8.16
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
        - name: CIS Controls v8
          controls:
            - "8"
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
        - name: HIPAA
          controls:
            - "164.312"
    enabled: true
