apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: db-ssl-connections
    name: Database SSL Connections Enforced
    description: Ensures SSL/TLS is required for all database connections
    tags:
        - database
        - ssl
        - tls
        - encryption
        - transit
spec:
    severity: HIGH
    category: database
    resourceType: database
    match:
        query: SELECT id, name, engine, ssl_enforced FROM databases WHERE ssl_enforced = false
    remediation:
        summary: Enable SSL enforcement for database connections. Configure clients to use SSL certificates.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: HIPAA
          controls:
            - "164.312"
    enabled: true
