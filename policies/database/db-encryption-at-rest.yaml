apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: db-encryption-at-rest
    name: Database Encryption at Rest
    description: Ensures all databases have encryption at rest enabled
    tags:
        - database
        - encryption
        - security
        - data-protection
spec:
    severity: HIGH
    category: database
    resourceType: database
    match:
        query: SELECT id, name, engine, region, encryption_enabled FROM databases WHERE encryption_enabled = false
    remediation:
        summary: Enable encryption at rest for all databases. For AWS RDS, enable encryption when creating or use snapshot migration.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: HIPAA
          controls:
            - "164.312"
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
