apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: db-backup-enabled
    name: Database Automated Backups Enabled
    description: Ensures automated backups are enabled for all databases
    tags:
        - database
        - backup
        - recovery
        - availability
spec:
    severity: HIGH
    category: database
    resourceType: database
    match:
        query: SELECT id, name, engine, backup_retention_period FROM databases WHERE backup_retention_period IS NULL OR backup_retention_period = 0
    remediation:
        summary: Enable automated backups with appropriate retention period (minimum 7 days recommended).
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.8.13
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - CP-9
            - CP-2
            - CP-4
            - CP-10
        - name: CIS Controls v8
          controls:
            - "11"
    enabled: true
