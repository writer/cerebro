apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: sentinelone-command-control
    name: SentinelOne Command and Control Activity
    description: SentinelOne detected command and control (C2) communication from an endpoint
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - sentinelone
        - edr
        - c2
        - threat-detection
        - mitre-ta0011
spec:
    severity: critical
    effect: forbid
    resource: sentinelone::threat
    match:
        conditions:
            - contains_value(path(resource, "indicators.mitre_tactics"), "TA0011")
            - cmp_ne(path(resource, "threat_info.analyst_verdict"), "false_positive")
        conditionFormat: cel
    remediation:
        summary: Immediately isolate endpoint from network. Block C2 domains/IPs at perimeter. Conduct forensic investigation. Engage incident response procedures. Hunt for lateral movement.
    frameworks:
        - name: CIS Controls v8
          controls:
            - "10.1"
            - "10.2"
            - "10.7"
        - name: SOC 2
          controls:
            - CC6.8
            - CC7.2
        - name: ISO 27001:2022
          controls:
            - A.8.7
            - A.8.16
        - name: NIST 800-53 r5
          controls:
            - SI-3
            - SI-4
