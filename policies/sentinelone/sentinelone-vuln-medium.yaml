apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: sentinelone-vuln-medium
    name: SentinelOne Agent Medium Vulnerabilities Addressed
    description: Ensures medium vulnerabilities detected by SentinelOne are addressed within SLA (30 days)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - sentinelone
        - endpoint
        - vulnerability
        - medium
        - sla
        - compliance
spec:
    severity: medium
    effect: forbid
    resource: sentinelone_vulnerabilities
    match:
        conditions:
            - cmp_eq(path(resource, "severity"), "Medium")
            - cmp_eq(path(resource, "status"), "open")
            - cmp_lt(path(resource, "detected_at"), "NOW() - INTERVAL '30 days'")
        conditionFormat: cel
    remediation:
        summary: Patch or update affected software to address medium severity vulnerabilities within 30 days.
    riskCategories:
        - VULNERABLE_WORKLOAD
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
        - name: PCI DSS v4.0
          controls:
            - 6.3.1
        - name: NIST 800-53 r5
          controls:
            - RA-5
            - SI-2
