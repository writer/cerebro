apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: org-relationship-decay-customer
    name: Customer Relationship Weakening
    description: Primary contact interaction with customer has decayed below threshold before renewal.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - org-topology
        - customer-health
        - churn-risk
spec:
    severity: high
    effect: forbid
    resource: org::customer_relationship
    match:
        conditions:
            - cmp_lt(path(resource, "relationship_strength"), 0.3)
            - cmp_gt(path(resource, "previous_strength"), 0.7)
            - cmp_lt(path(resource, "renewal_days"), 90)
        conditionFormat: cel
    remediation:
        summary: Escalate account engagement and assign backup contacts before renewal.
    riskCategories:
        - CUSTOMER_HEALTH_RISK
        - CHURN_RISK
    frameworks:
        - name: Cerebro Organizational Resilience
          controls:
            - ORG-2
        - name: Cerebro Revenue Operations
          controls:
            - REV-5
