apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: org-tenure-risk
    name: Long-Tenured Sole Expert Showing Disengagement
    description: A person owning bus-factor-1 systems is showing declining activity and has long tenure.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - org-topology
        - departure-risk
        - knowledge-transfer
spec:
    severity: high
    effect: forbid
    resource: org::person
    match:
        conditions:
            - cmp_gt(path(resource, "bus_factor_1_systems"), 0)
            - cmp_eq(path(resource, "activity_trend"), "declining")
            - cmp_gt(path(resource, "tenure_years"), 2)
        conditionFormat: cel
    remediation:
        summary: Start successor planning, document ownership, and rebalance system coverage.
    riskCategories:
        - DEPARTURE_RISK
        - KNOWLEDGE_CONCENTRATION
    frameworks:
        - name: Cerebro Organizational Resilience
          controls:
            - ORG-1
            - ORG-4
