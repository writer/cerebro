apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: hubspot-excessive-discount
    name: Excessive Discount on Small Deal
    description: Flags unusually high discount percentages on lower-value deals.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - revenue
        - guardrail
        - hubspot
spec:
    severity: medium
    effect: forbid
    resource: hubspot::deal
    match:
        conditions:
            - cmp_gt(path(resource, "properties.discount_percentage"), 30)
            - cmp_lt(path(resource, "properties.amount"), 50000)
        conditionFormat: cel
    frameworks:
        - name: Cerebro Revenue Operations
          controls:
            - REV-2
        - name: Cerebro Financial Controls
          controls:
            - FIN-3
