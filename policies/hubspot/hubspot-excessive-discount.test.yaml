apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        properties:
            amount: 49999
            discount_percentage: 31
      wantFinding: true
    - name: non-matching resource passes
      resource:
        properties:
            amount: 49999
            discount_percentage: 30
      wantFinding: false
