apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-duplicate-membership-assignment
    name: Google Workspace Duplicate Membership Assignments
    description: Detects duplicate Google Workspace group membership rows for the same member and group.
    tags:
        - google-workspace
        - identity
        - groups
        - data-integrity
spec:
    severity: LOW
    category: identity
    resourceType: google_workspace_group_member
    match:
        query: SELECT m.group_id, LOWER(TRIM(m.email)) AS member_key, COUNT(*) AS membership_count FROM google_workspace_group_members m WHERE m.group_id IS NOT NULL AND COALESCE(TRIM(m.email), '') != '' GROUP BY m.group_id, LOWER(TRIM(m.email)) HAVING COUNT(*) > 1
    remediation:
        summary: Deduplicate repeated membership rows and validate provisioning idempotency in sync pipelines.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
