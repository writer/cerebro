apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-auth0-personal-email-domain
    name: Auth0 Accounts Using Personal Email Domains
    description: Detects active auth0 accounts using personal email domains instead of corporate identity domains.
    tags:
        - auth0
        - identity
        - account-hygiene
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: auth0_user
    match:
        query: SELECT u.id AS id, u.email AS email FROM auth0_users u WHERE COALESCE(u.blocked, false) = false AND LOWER(COALESCE(u.email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate account identities to corporate domains and disable personal-domain access where not explicitly approved.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
