apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-cyberark-duplicate-group-name
    name: Cyberark Duplicate Group Names
    description: Detects duplicate group names in cyberark, which can cause ambiguous access assignment.
    tags:
        - cyberark
        - identity
        - groups
        - access-governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: cyberark_group
    match:
        query: SELECT LOWER(TRIM(g.display_name)) AS group_name, COUNT(*) AS group_count FROM cyberark_groups g WHERE COALESCE(TRIM(g.display_name), '') != '' GROUP BY LOWER(TRIM(g.display_name)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate groups or rename to make ownership and access scope unambiguous.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
