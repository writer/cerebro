apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-superadmin-count
    name: Excessive Okta Super Admins
    description: Identifies when more than 5 users are assigned Okta Super Admin roles.
    tags:
        - okta
        - identity
        - admin
        - least-privilege
spec:
    severity: HIGH
    category: identity
    resourceType: okta_admin_role
    match:
        query: SELECT COUNT(DISTINCT user_id) AS super_admin_count FROM okta_admin_roles WHERE LOWER(COALESCE(role_type, '')) LIKE '%super%' OR LOWER(COALESCE(role_label, '')) LIKE '%super%' HAVING COUNT(DISTINCT user_id) > 5
    remediation:
        summary: Reduce Super Admin assignments to a minimal break-glass set and delegate routine tasks to scoped admin roles.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.8.2
    enabled: true
