apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-saviynt-orphaned-membership-group
    name: Saviynt Memberships With Missing Groups
    description: Detects orphaned saviynt memberships referencing groups that no longer exist.
    tags:
        - saviynt
        - identity
        - groups
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: saviynt_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM saviynt_group_memberships m LEFT JOIN saviynt_groups g ON m.group_id = g.id WHERE m.group_id IS NOT NULL AND g.id IS NULL
    remediation:
        summary: Remove orphaned memberships and reconcile all references to deleted or migrated groups.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
