apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-duplicate-email
    name: Google Workspace Duplicate Account Emails
    description: Detects duplicate active google_workspace accounts sharing the same email identity.
    tags:
        - google_workspace
        - identity
        - access-control
        - account-hygiene
spec:
    severity: HIGH
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT LOWER(TRIM(u.primary_email)) AS email, COUNT(*) AS account_count FROM google_workspace_users u WHERE 1=1 AND COALESCE(TRIM(u.primary_email), '') != '' GROUP BY LOWER(TRIM(u.primary_email)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate identities and remove unintended duplicate access paths.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
