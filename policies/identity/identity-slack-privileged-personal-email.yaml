apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-slack-privileged-personal-email
    name: Slack Privileged Accounts on Personal Email Domains
    description: Detects privileged slack accounts tied to personal email domains.
    tags:
        - slack
        - identity
        - privileged-access
        - governance
spec:
    severity: HIGH
    category: identity
    resourceType: slack_user
    match:
        query: SELECT u.id AS id, u.email AS email FROM slack_users u WHERE COALESCE(u.deleted, false) = false AND (COALESCE(u.is_admin, false) = true OR COALESCE(u.is_owner, false) = true OR COALESCE(u.is_primary_owner, false) = true) AND LOWER(COALESCE(u.email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate privileged accounts to corporate identity domains and remove personal-domain privileged access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
