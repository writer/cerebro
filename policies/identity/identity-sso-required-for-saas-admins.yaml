apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-sso-required-for-saas-admins
    name: Identity Sso Required For Saas Admins
    description: "Identity Sso Required For Saas Admins policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - identity
        - sso
        - saas
        - generated
spec:
    severity: high
    effect: forbid
    resource: "identity::saas_account"
    match:
        conditions:
            - "cmp_ne(path(resource, \"sso_required_for_saas_admins\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore sso required for saas admins controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - ACCESS_CONTROL
        - IDENTITY_GOVERNANCE
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.3
        - name: "ISO 27001:2022"
          controls:
            - A.5.15
            - A.5.16
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-3
            - IA-2
