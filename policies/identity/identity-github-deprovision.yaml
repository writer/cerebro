apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-deprovision
    name: GitHub Accounts Deprovisioned on Termination
    description: Ensures GitHub organization access is revoked when personnel leave the company
    tags:
        - github
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: github_user
    match:
        query: SELECT g.id, g.login, g.email, e.termination_date FROM github_organization_members g JOIN employees e ON g.email = e.work_email WHERE e.status = 'terminated' AND g.org_membership_state = 'active'
    remediation:
        summary: Remove GitHub organization access for terminated employees within 24 hours of termination.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.3
        - name: ISO 27001:2022
          controls:
            - A.5.11
            - A.6.5
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - PS-4
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - 8.1.3
    enabled: true
