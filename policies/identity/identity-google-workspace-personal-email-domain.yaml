apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-personal-email-domain
    name: Google Workspace Accounts Using Personal Email Domains
    description: Detects active google_workspace accounts using personal email domains instead of corporate identity domains.
    tags:
        - google_workspace
        - identity
        - account-hygiene
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.primary_email AS email FROM google_workspace_users u WHERE 1=1 AND LOWER(COALESCE(u.primary_email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate account identities to corporate domains and disable personal-domain access where not explicitly approved.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
