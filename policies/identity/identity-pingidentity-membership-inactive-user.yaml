apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-pingidentity-membership-inactive-user
    name: PingIdentity Memberships With Inactive Users
    description: Detects PingIdentity group memberships that still reference inactive users.
    tags:
        - pingidentity
        - identity
        - groups
        - offboarding
spec:
    severity: MEDIUM
    category: identity
    resourceType: pingidentity_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM pingidentity_group_memberships m JOIN pingidentity_users u ON m.user_id = u.id WHERE NOT (COALESCE(u.enabled, true) = true)
    remediation:
        summary: Remove inactive users from all groups and verify deprovisioning workflows are complete.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
