apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-session-lifetime-too-long-admin
    name: Identity Session Lifetime Too Long Admin
    description: "Identity Session Lifetime Too Long Admin policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - identity
        - session
        - admin
        - generated
spec:
    severity: high
    effect: forbid
    resource: "identity::session_policy"
    match:
        conditions:
            - "cmp_gt(path(resource, \"session_lifetime_too_long_admin\"), path(resource, \"approved_threshold\"))"
        conditionFormat: cel
    remediation:
        summary: "Restore session lifetime too long admin controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - ACCESS_CONTROL
        - IDENTITY_GOVERNANCE
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.3
        - name: "ISO 27001:2022"
          controls:
            - A.5.15
            - A.5.16
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-3
            - IA-2
