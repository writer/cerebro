apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-stale-login-365d
    name: Okta Stale Active Accounts (365 days)
    description: Detects active Okta accounts with no login activity for at least 365 days.
    tags:
        - okta
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: okta_user
    match:
        query: SELECT u.id AS id, u.login AS account_name, u.last_login AS last_login FROM okta_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND (u.last_login IS NULL OR u.last_login < CURRENT_TIMESTAMP() - INTERVAL '365 days')
    remediation:
        summary: Disable long-dormant accounts and require formal approval before any reactivation.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
