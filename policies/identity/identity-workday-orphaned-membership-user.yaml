apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-workday-orphaned-membership-user
    name: Workday Group Memberships With Missing Users
    description: Detects orphaned workday group memberships referencing users that no longer exist.
    tags:
        - workday
        - identity
        - groups
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: workday_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM workday_group_memberships m LEFT JOIN workday_users u ON m.user_id = u.id WHERE m.user_id IS NOT NULL AND u.id IS NULL
    remediation:
        summary: Remove orphaned memberships and reconcile group assignments from authoritative identity sources.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
