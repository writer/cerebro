apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-sign-on-rule-without-mfa
    name: Okta Sign-On Rule Allows Access Without MFA
    description: Detects active Okta sign-on or access policy rules that allow access without requiring MFA.
    tags:
        - okta
        - identity
        - mfa
        - policy
spec:
    severity: HIGH
    category: identity
    resourceType: okta_policy_rule
    match:
        query: SELECT r.policy_rule_id AS id, r.name AS rule_name, r.policy_id, r.policy_name, r.policy_type, r.access, r.requires_mfa, r.group_include_ids, r.app_include_ids FROM okta_policy_rules r WHERE LOWER(COALESCE(r.status, r.policy_rule_status, '')) IN ('active','enabled') AND LOWER(COALESCE(r.policy_status, 'active')) IN ('active','enabled') AND UPPER(COALESCE(r.policy_type, '')) IN ('OKTA_SIGN_ON','ACCESS_POLICY') AND UPPER(COALESCE(r.access, 'ALLOW')) = 'ALLOW' AND COALESCE(r.requires_mfa, false) = false
    remediation:
        summary: Require MFA on the policy rule or narrow the rule to a documented exception group.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
    input:
        sourceKinds:
            - okta.policy_rule
        requiredFields:
            - policy_rule_id
            - policy_id
            - policy_type
            - status
            - access
            - requires_mfa
        freshnessSLA: 24h
    evidence:
        type: identity_configuration
        assessmentMethods:
            - examine
            - test
        requiredForAudit: true
        acceptableSources:
            - okta
        requiredFields:
            - policy_rule_id
            - policy_id
            - policy_type
            - status
            - access
            - requires_mfa
            - observed_at
        fingerprintFields:
            - tenant_id
            - policy_id
            - policy_rule_id
    audit:
        evidenceType: identity_configuration
        assessmentMethods:
            - examine
            - test
        freshnessSLA: 24h
        auditorStatement: Okta sign-on rules require MFA unless an approved exception rule is documented.
        riskStatement: A sign-on rule that allows access without MFA can bypass identity control enforcement for users or applications in scope.
        remediationIntent: Update the policy rule to require MFA, limit exception scope, and retain the rule snapshot after synchronization.
        acceptableEvidence:
            - source: okta
              fields:
                - policy_rule_id
                - policy_id
                - policy_type
                - requires_mfa
                - observed_at
        exceptionPolicy:
            maxAge: 30d
            requiresApproval: true
        exceptionGuidance:
            - A break-glass or service-access exception is approved, scoped, and reviewed before expiration.
        falsePositives:
            - The rule is inactive, denied, or restricted to a documented exception population.
    enabled: true
