apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-orphaned-membership-group
    name: Google Workspace Memberships With Missing Groups
    description: Detects orphaned google_workspace memberships referencing groups that no longer exist.
    tags:
        - google_workspace
        - identity
        - groups
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: google_workspace_group_member
    match:
        query: SELECT m.group_id, m.user_id FROM google_workspace_group_members m LEFT JOIN google_workspace_groups g ON m.group_id = g.id WHERE m.group_id IS NOT NULL AND g.id IS NULL
    remediation:
        summary: Remove orphaned memberships and reconcile all references to deleted or migrated groups.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
