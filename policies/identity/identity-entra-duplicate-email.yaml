apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-duplicate-email
    name: Entra Duplicate Account Emails
    description: Detects duplicate active entra accounts sharing the same email identity.
    tags:
        - entra
        - identity
        - access-control
        - account-hygiene
spec:
    severity: HIGH
    category: identity
    resourceType: entra_user
    match:
        query: SELECT LOWER(TRIM(u.mail)) AS email, COUNT(*) AS account_count FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND COALESCE(TRIM(u.mail), '') != '' GROUP BY LOWER(TRIM(u.mail)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate identities and remove unintended duplicate access paths.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
