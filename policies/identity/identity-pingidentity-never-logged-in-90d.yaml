apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-pingidentity-never-logged-in-90d
    name: PingIdentity Accounts Never Used (90 days)
    description: Detects active PingIdentity accounts older than 90 days that have never logged in.
    tags:
        - pingidentity
        - identity
        - least-privilege
        - stale-accounts
spec:
    severity: MEDIUM
    category: identity
    resourceType: pingidentity_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.created_at AS created_at FROM pingidentity_users u WHERE COALESCE(u.enabled, true) = true AND u.last_sign_on IS NULL AND u.created_at < NOW() - INTERVAL '90 days'
    remediation:
        summary: Remove or disable never-used accounts and fix any over-provisioning in onboarding workflows.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
