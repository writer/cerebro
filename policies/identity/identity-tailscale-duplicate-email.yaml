apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-tailscale-duplicate-email
    name: Tailscale Duplicate Account Emails
    description: Detects duplicate active tailscale accounts sharing the same email identity.
    tags:
        - tailscale
        - identity
        - access-control
        - account-hygiene
spec:
    severity: HIGH
    category: identity
    resourceType: tailscale_user
    match:
        query: SELECT LOWER(TRIM(u.login_name)) AS email, COUNT(*) AS account_count FROM tailscale_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND COALESCE(TRIM(u.login_name), '') != '' GROUP BY LOWER(TRIM(u.login_name)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate identities and remove unintended duplicate access paths.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
