apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-never-logged-in-90d
    name: Entra ID Accounts Never Used (90 days)
    description: Detects active Entra ID accounts older than 90 days that have never logged in.
    tags:
        - entra
        - identity
        - least-privilege
        - stale-accounts
spec:
    severity: MEDIUM
    category: identity
    resourceType: entra_user
    match:
        query: SELECT u.id AS id, u.display_name AS account_name, u.created_datetime AS created_at FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND u.last_sign_in_datetime IS NULL AND u.created_datetime < NOW() - INTERVAL '90 days'
    remediation:
        summary: Remove or disable never-used accounts and fix any over-provisioning in onboarding workflows.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
