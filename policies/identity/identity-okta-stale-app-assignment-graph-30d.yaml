apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-stale-app-assignment-graph-30d
    name: Okta Stale App Assignment Graph Evidence (30 days)
    description: Graph-backed companion to identity-okta-stale-app-assignment-30d; detects active Okta user-to-app assignment graph edges with no recent Okta app activity evidence.
    tags:
        - okta
        - identity
        - access-review
        - stale-access
        - graph-backed
    references:
        - https://www.iso.org/standard/27001
spec:
    severity: MEDIUM
    category: identity
    resourceType: okta_app_assignment
    remediation:
        summary: Review stale assignments, confirm business need, and remove unused user access to Okta applications.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.18
    input:
        sourceKinds:
            - okta.app_assignment
            - okta.audit
            - okta.user
        requiredFields:
            - subject_id
            - app_id
            - event_type
            - last_activity
        freshnessSLA: 24h
    evidence:
        type: access_review
        assessmentMethods:
            - examine
        requiredForAudit: true
        acceptableSources:
            - okta
        requiredFields:
            - user_id
            - app_id
            - graph_evidence_count
        fingerprintFields:
            - tenant_id
            - policy_id
            - resource_urn
            - resource_id
    audit:
        evidenceType: access_review
        assessmentMethods:
            - examine
        freshnessSLA: 24h
        auditorStatement: Okta application assignments should be reviewed when no recent app activity is observed.
        riskStatement: Unused app assignments increase access scope and can persist after business need ends.
        remediationIntent: Confirm business need or remove the assignment, then retain updated graph evidence.
        auditorGuidance: Review the user-to-application assignment path and any recent activity evidence before suppressing.
        falsePositives:
            - The app may not emit Okta SSO or OAuth usage events; attach downstream usage evidence before suppressing.
    verification:
        fixtures:
            - name: assigned app without recent activity
              expect: finding
              description: Active Okta user has an app assignment edge and no recent acted_on activity edge for that app.
            - name: recent app activity or assignment removed
              expect: pass
              description: Recent Okta activity exists for the app or the assignment edge has been removed.
        mutationChecks:
            - add_recent_app_activity_edge
            - remove_app_assignment_edge
        remediationCheck:
            rerunAfter: source_sync
            expectedStatus: closed
    graph:
        query: |-
            MATCH (user:Entity {tenant_id: $tenant_id, source_id: 'okta', entity_type: 'okta.user'})-[assignment:RELATION {relation: 'assigned_to'}]->(app:Entity {tenant_id: $tenant_id, source_id: 'okta', entity_type: 'okta.application'})
            OPTIONAL MATCH (user)-[activity:RELATION {relation: 'acted_on'}]->(app)
            WHERE coalesce(activity.attributes_json, '') CONTAINS '"at":"'
              AND (coalesce(activity.attributes_json, '') CONTAINS '"event_type":"user.authentication.sso"' OR coalesce(activity.attributes_json, '') CONTAINS '"event_type":"app.oauth2.token.grant.')
              AND split(split(coalesce(activity.attributes_json, ''), '"at":"')[1], '"')[0] =~ '^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9].*'
              AND split(split(coalesce(activity.attributes_json, ''), '"at":"')[1], '"')[0] >= substring(toString(datetime() - duration('P30D')), 0, 19)
            WITH user, app, collect(activity) AS recent_activity,
                 toLower(coalesce(user.attributes_json, '')) AS user_attrs,
                 toLower(coalesce(assignment.attributes_json, '')) AS assignment_attrs
            WHERE (user_attrs CONTAINS '"status":"active"' OR user_attrs CONTAINS '"status":"provisioned"' OR user_attrs CONTAINS '"status":"enabled"')
              AND (assignment_attrs = '' OR NOT assignment_attrs CONTAINS '"status":' OR assignment_attrs CONTAINS '"status":"active"' OR assignment_attrs CONTAINS '"status":"assigned"')
              AND size(recent_activity) = 0
            RETURN user.urn AS primary_urn,
                   user.label AS primary_label,
                   user.entity_type AS primary_type,
                   user.urn + '|' + app.urn AS fingerprint_key,
                   'MEDIUM' AS severity,
                   'Okta app assignment for ' + coalesce(user.label, user.urn) + ' has no recent activity on ' + coalesce(app.label, app.urn) AS summary,
                   'Review business need and remove unused application access' AS action,
                   [user.urn, app.urn] AS resource_urns,
                   [{urn: app.urn, label: app.label, entity_type: app.entity_type, relation: 'assigned_to', attributes_json: coalesce(app.attributes_json, '')}] AS evidence,
                   {evidence_basis: 'okta_assignment_graph_path_without_recent_activity_edge', confidence: 'medium', remediation_intent: 'Review business need and remove unused Okta application access', lifecycle_state: CASE WHEN user_attrs CONTAINS '"status":"active"' THEN 'active' WHEN user_attrs CONTAINS '"status":"provisioned"' THEN 'provisioned' WHEN user_attrs CONTAINS '"status":"enabled"' THEN 'enabled' ELSE 'active_or_provisioned' END, mfa_state: CASE WHEN user_attrs CONTAINS '"mfa_enrolled":"true"' THEN 'enrolled' WHEN user_attrs CONTAINS '"mfa_enrolled":"false"' THEN 'not_enrolled' ELSE 'unknown' END, source_provenance: 'okta.user assigned_to okta.application path without recent ISO-shaped okta.audit acted_on edge', limitation: 'Absence of recent Okta activity is not proof the app is unused if usage is recorded outside Okta; malformed activity timestamps are ignored instead of parsed.'} AS finding_attributes
            ORDER BY user.urn, app.urn
            LIMIT $row_limit
        rowLimit: 500
        requiredColumns:
            - primary_urn
            - fingerprint_key
            - summary
            - resource_urns
    enabled: true
