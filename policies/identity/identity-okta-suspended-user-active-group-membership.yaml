apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-suspended-user-active-group-membership
    name: Okta Suspended User Remains in Access Group
    description: Detects suspended or deprovisioned Okta users that remain in active group memberships.
    tags:
        - okta
        - identity
        - offboarding
        - group-membership
spec:
    severity: HIGH
    category: identity
    resourceType: okta_group_membership
    match:
        query: SELECT m.member_user_id AS id, COALESCE(u.login, m.member_email, m.member_user_id) AS account_name, COALESCE(u.status, m.member_status) AS user_status, m.group_id, COALESCE(g.name, g.group_name, m.group_id) AS group_name FROM okta_group_memberships m LEFT JOIN okta_users u ON u.id = m.member_user_id LEFT JOIN okta_groups g ON g.id = m.group_id WHERE LOWER(COALESCE(u.status, m.member_status, '')) IN ('suspended','deprovisioned','deactivated','locked_out')
    remediation:
        summary: Remove suspended or deprovisioned users from access groups and confirm connected app access is closed.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.3
        - name: ISO 27001:2022
          controls:
            - A.5.18
    input:
        sourceKinds:
            - okta.group_membership
            - okta.user
        requiredFields:
            - member_user_id
            - member_status
            - group_id
        freshnessSLA: 24h
    evidence:
        type: identity_governance
        assessmentMethods:
            - examine
        requiredForAudit: true
        acceptableSources:
            - okta
        requiredFields:
            - user_id
            - user_status
            - group_id
            - observed_at
        fingerprintFields:
            - tenant_id
            - policy_id
            - resource_urn
            - resource_id
    enabled: true
