apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-gong-active-no-employee-record
    name: Gong Active Accounts Without Employee Record
    description: Detects active Gong accounts whose email does not match any employee record.
    tags:
        - gong
        - identity
        - joiner-mover-leaver
        - access-review
spec:
    severity: MEDIUM
    category: identity
    resourceType: gong_user
    match:
        query: SELECT u.id AS id, u.email AS email FROM gong_users u LEFT JOIN employees e ON LOWER(COALESCE(u.email, '')) = LOWER(e.work_email) WHERE COALESCE(u.active, true) = true AND COALESCE(TRIM(u.email), '') != '' AND e.work_email IS NULL
    remediation:
        summary: Review unmatched accounts, classify approved non-employee identities, and disable unknown access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
