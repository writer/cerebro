apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-missing-email
    name: Github Active Accounts Missing Email
    description: Detects active github accounts missing an email address for identity matching and offboarding controls.
    tags:
        - github
        - identity
        - data-quality
        - account-hygiene
spec:
    severity: MEDIUM
    category: identity
    resourceType: github_organization_member
    match:
        query: SELECT u.id AS id, u.login AS account_name FROM github_organization_members u WHERE 1=1 AND COALESCE(TRIM(u.email), '') = ''
    remediation:
        summary: Populate a valid corporate email on the account or disable the account until ownership can be verified.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
