apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-atlassian-empty-groups
    name: Atlassian Empty Access Groups
    description: Detects empty groups in atlassian that may indicate stale access governance artifacts.
    tags:
        - atlassian
        - identity
        - groups
        - stale-configuration
spec:
    severity: LOW
    category: identity
    resourceType: atlassian_group
    match:
        query: SELECT g.group_id AS id, g.name AS group_name FROM atlassian_groups g LEFT JOIN atlassian_group_memberships m ON g.group_id = m.group_id WHERE m.group_id IS NULL
    remediation:
        summary: Delete stale groups or document their future purpose and ownership before retaining them.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
