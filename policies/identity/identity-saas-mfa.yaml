apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-saas-mfa-enforced
    name: MFA Enforced on SaaS Applications
    description: All users should have MFA enabled on critical SaaS applications including identity providers, email, and collaboration tools
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - identity
        - mfa
        - authentication
        - saas
spec:
    severity: high
    effect: forbid
    resource: identity_user_accounts
    match:
        conditions:
            - cmp_ne(path(resource, "mfa_enabled"), true)
            - cmp_eq(path(resource, "account_active"), true)
            - cmp_eq(path(resource, "is_human_user"), true)
        conditionFormat: cel
    remediation:
        summary: Enable MFA for the user account. Enforce MFA at the organization level if available
        steps:
            - Identify users without MFA enrolled
            - Send MFA enrollment reminders
            - Set a deadline for MFA enrollment
            - Block access for users who don't enroll by deadline
            - Consider hardware security keys for high-privilege users
    riskCategories:
        - IDENTITY_RISK
        - UNPROTECTED_PRINCIPAL
    frameworks:
        - name: CIS Controls v8
          controls:
            - "6.3"
            - "6.4"
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
        - name: NIST 800-53 r5
          controls:
            - IA-2
        - name: PCI DSS v4.0.1
          controls:
            - 8.4.2
    mitreAttack:
        - tactic: Credential Access
          technique: T1110
        - tactic: Initial Access
          technique: T1078
