apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-pingidentity-never-logged-in-30d
    name: Pingidentity Accounts Never Used After Provisioning
    description: Detects active pingidentity accounts older than 30 days with no successful login recorded.
    tags:
        - pingidentity
        - identity
        - stale-accounts
        - least-privilege
spec:
    severity: MEDIUM
    category: identity
    resourceType: pingidentity_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.created_at AS created_at FROM pingidentity_users u WHERE COALESCE(u.enabled, true) = true AND u.last_sign_on IS NULL AND u.created_at < NOW() - INTERVAL '30 days'
    remediation:
        summary: Remove or disable unused accounts and confirm provisioning flows are not creating unnecessary access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
