apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-membership-personal-email-domain
    name: Google Workspace Memberships Using Personal Email Domains
    description: Detects Google Workspace group memberships tied to personal email domains.
    tags:
        - google-workspace
        - identity
        - groups
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: google_workspace_group_member
    match:
        query: SELECT m.group_id, m.email AS email FROM google_workspace_group_members m WHERE LOWER(COALESCE(m.email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\.com'
    remediation:
        summary: Replace personal-domain group members with corporate identities or remove unauthorized access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
