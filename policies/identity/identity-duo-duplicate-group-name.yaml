apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-duo-duplicate-group-name
    name: Duo Duplicate Group Names
    description: Detects duplicate group names in duo, which can cause ambiguous access assignment.
    tags:
        - duo
        - identity
        - groups
        - access-governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: duo_group
    match:
        query: SELECT LOWER(TRIM(g.name)) AS group_name, COUNT(*) AS group_count FROM duo_groups g WHERE COALESCE(TRIM(g.name), '') != '' GROUP BY LOWER(TRIM(g.name)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate groups or rename to make ownership and access scope unambiguous.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
