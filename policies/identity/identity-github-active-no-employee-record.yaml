apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-active-no-employee-record
    name: GitHub Active Accounts Without Employee Record
    description: Detects active GitHub accounts whose email does not match any employee record.
    tags:
        - github
        - identity
        - joiner-mover-leaver
        - access-review
spec:
    severity: MEDIUM
    category: identity
    resourceType: github_organization_member
    match:
        query: SELECT u.id AS id, u.email AS email FROM github_organization_members u LEFT JOIN employees e ON LOWER(COALESCE(u.email, '')) = LOWER(e.work_email) WHERE 1=1 AND COALESCE(TRIM(u.email), '') != '' AND e.work_email IS NULL
    remediation:
        summary: Review unmatched accounts, classify approved non-employee identities, and disable unknown access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
