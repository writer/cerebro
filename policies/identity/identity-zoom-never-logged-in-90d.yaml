apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-zoom-never-logged-in-90d
    name: Zoom Accounts Never Used (90 days)
    description: Detects active Zoom accounts older than 90 days that have never logged in.
    tags:
        - zoom
        - identity
        - least-privilege
        - stale-accounts
spec:
    severity: MEDIUM
    category: identity
    resourceType: zoom_user
    match:
        query: SELECT u.id AS id, u.first_name AS account_name, u.created_at AS created_at FROM zoom_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND u.last_login_time IS NULL AND u.created_at < NOW() - INTERVAL '90 days'
    remediation:
        summary: Remove or disable never-used accounts and fix any over-provisioning in onboarding workflows.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
