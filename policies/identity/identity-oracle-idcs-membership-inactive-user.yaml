apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-oracle-idcs-membership-inactive-user
    name: Oracle IDCS Memberships With Inactive Users
    description: Detects Oracle IDCS group memberships that still reference inactive users.
    tags:
        - oracle-idcs
        - identity
        - groups
        - offboarding
spec:
    severity: MEDIUM
    category: identity
    resourceType: oracle_idcs_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM oracle_idcs_group_memberships m JOIN oracle_idcs_users u ON m.user_id = u.id WHERE NOT (COALESCE(u.active, true) = true)
    remediation:
        summary: Remove inactive users from all groups and verify deprovisioning workflows are complete.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
