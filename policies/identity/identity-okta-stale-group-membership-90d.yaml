apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-stale-group-membership-90d
    name: Okta Stale Group Membership (90 days)
    description: Detects active Okta users with group-membership graph edges and observed stale login activity.
    tags:
        - okta
        - identity
        - group-membership
        - stale-access
        - graph-backed
    references:
        - https://www.iso.org/standard/27001
spec:
    severity: HIGH
    category: identity
    resourceType: okta_group_membership
    remediation:
        summary: Review stale memberships and remove users from groups they no longer need.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.18
    input:
        sourceKinds:
            - okta.group_membership
            - okta.app_assignment
            - okta.user
        requiredFields:
            - member_user_id
            - group_id
            - last_login_at
        freshnessSLA: 24h
    evidence:
        type: access_review
        assessmentMethods:
            - examine
        requiredForAudit: true
        acceptableSources:
            - okta
        requiredFields:
            - user_id
            - user_status
            - group_id
            - last_login_at
            - graph_evidence_count
        fingerprintFields:
            - tenant_id
            - policy_id
            - resource_urn
            - resource_id
    audit:
        evidenceType: access_review
        assessmentMethods:
            - examine
        freshnessSLA: 24h
        auditorStatement: Group memberships should be reviewed when assigned users have no recent Okta login activity.
        riskStatement: Stale group memberships can preserve application access outside current business need.
        remediationIntent: Confirm business need, remove unnecessary group membership, and retain updated source evidence.
        auditorGuidance: Review the user-to-group path, last_login_at source fact, and group-assigned applications before suppressing.
        falsePositives:
            - Some accounts may be service or break-glass identities; attach owner and monitoring evidence before suppressing.
            - Last login may be absent when the source cannot observe app activity; this rule waits for last_login_at source evidence before emitting.
    verification:
        fixtures:
            - name: stale user in group
              expect: finding
              description: Active Okta user has stale last_login_at and a group membership graph edge.
            - name: recent login or membership removed
              expect: pass
              description: Okta user has recent last_login_at evidence or no group membership edge.
        mutationChecks:
            - refresh_last_login_at
            - remove_group_membership_edge
        remediationCheck:
            rerunAfter: source_sync
            expectedStatus: closed
    graph:
        query: |-
            MATCH (user:Entity {tenant_id: $tenant_id, source_id: 'okta', entity_type: 'okta.user'})-[:RELATION {relation: 'member_of'}]->(group:Entity {tenant_id: $tenant_id, source_id: 'okta', entity_type: 'okta.group'})
            OPTIONAL MATCH (group)-[:RELATION {relation: 'assigned_to'}]->(app:Entity {tenant_id: $tenant_id, source_id: 'okta', entity_type: 'okta.application'})
            WITH user, group, collect(DISTINCT app) AS apps,
                 coalesce(user.attributes_json, '') AS attrs,
                 toLower(coalesce(user.attributes_json, '')) AS user_attrs
            WITH user, group, apps, user_attrs,
                 CASE WHEN attrs CONTAINS '"last_login_at":"' THEN split(split(attrs, '"last_login_at":"')[1], '"')[0] ELSE '' END AS last_login_at
            WHERE (user_attrs CONTAINS '"status":"active"' OR user_attrs CONTAINS '"status":"provisioned"' OR user_attrs CONTAINS '"status":"enabled"')
              AND last_login_at <> ''
              AND datetime(last_login_at) < datetime() - duration('P90D')
            RETURN user.urn AS primary_urn,
                   user.label AS primary_label,
                   user.entity_type AS primary_type,
                   user.urn + '|' + group.urn AS fingerprint_key,
                   'HIGH' AS severity,
                   'Okta user ' + coalesce(user.label, user.urn) + ' has stale login activity and remains in group ' + coalesce(group.label, group.urn) AS summary,
                   'Review group access and remove stale membership when no business need remains' AS action,
                   [user.urn, group.urn] AS resource_urns,
                   [{urn: group.urn, label: group.label, entity_type: group.entity_type, relation: 'member_of', attributes_json: coalesce(group.attributes_json, '')}] +
                   [a IN apps | {urn: a.urn, label: a.label, entity_type: a.entity_type, relation: 'assigned_to', attributes_json: coalesce(a.attributes_json, '')}] AS evidence,
                   {evidence_basis: 'okta_last_login_at_to_group_membership_graph_path', confidence: 'medium', remediation_intent: 'Review group access and remove stale Okta membership when no business need remains', lifecycle_state: CASE WHEN user_attrs CONTAINS '"status":"active"' THEN 'active' WHEN user_attrs CONTAINS '"status":"provisioned"' THEN 'provisioned' WHEN user_attrs CONTAINS '"status":"enabled"' THEN 'enabled' ELSE 'active_or_provisioned' END, mfa_state: CASE WHEN user_attrs CONTAINS '"mfa_enrolled":"true"' THEN 'enrolled' WHEN user_attrs CONTAINS '"mfa_enrolled":"false"' THEN 'not_enrolled' ELSE 'unknown' END, last_login_at: last_login_at, source_provenance: 'okta.user last_login_at source fact plus okta.group_membership member_of edge', limitation: 'Requires last_login_at source evidence; stale login is review evidence, not proof the account is unused in every downstream system.'} AS finding_attributes
            ORDER BY user.urn, group.urn
            LIMIT $row_limit
        rowLimit: 500
        requiredColumns:
            - primary_urn
            - fingerprint_key
            - summary
            - resource_urns
    enabled: true
