apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-atlassian-missing-email
    name: Atlassian Active Accounts Missing Email
    description: Detects active atlassian accounts missing an email address for identity matching and offboarding controls.
    tags:
        - atlassian
        - identity
        - data-quality
        - account-hygiene
spec:
    severity: MEDIUM
    category: identity
    resourceType: atlassian_user
    match:
        query: SELECT u.account_id AS id, u.display_name AS account_name FROM atlassian_users u WHERE COALESCE(u.active, true) = true AND COALESCE(TRIM(u.email_address), '') = ''
    remediation:
        summary: Populate a valid corporate email on the account or disable the account until ownership can be verified.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
