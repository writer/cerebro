apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-gong-terminated-active-account
    name: Gong Terminated Accounts Still Active
    description: Detects terminated employees that still have active access in gong.
    tags:
        - gong
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: gong_user
    match:
        query: SELECT u.id AS id, u.email AS email, e.termination_date FROM gong_users u JOIN employees e ON LOWER(COALESCE(u.email, '')) = LOWER(e.work_email) WHERE e.status = 'terminated' AND COALESCE(u.active, true) = true
    remediation:
        summary: Disable or remove provider access for terminated employees within 24 hours and verify all active sessions are revoked.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
