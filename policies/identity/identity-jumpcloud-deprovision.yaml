apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-jumpcloud-deprovision
    name: JumpCloud Accounts Deprovisioned on Termination
    description: Ensures JumpCloud access is revoked when personnel leave the company
    tags:
        - jumpcloud
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: jumpcloud_user
    match:
        query: SELECT j.id, j.username, j.email, e.termination_date FROM jumpcloud_users j JOIN employees e ON LOWER(j.email) = LOWER(e.work_email) WHERE e.status = 'terminated' AND COALESCE(j.suspended, false) = false AND COALESCE(j.activated, true) = true
    remediation:
        summary: Disable or remove accounts for terminated employees within 24 hours. Automate offboarding workflows where possible.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.3
        - name: ISO 27001:2022
          controls:
            - A.5.11
            - A.6.5
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - PS-4
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - 8.1.3
    enabled: true
