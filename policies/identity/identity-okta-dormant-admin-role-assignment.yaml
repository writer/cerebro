apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-dormant-admin-role-assignment
    name: Okta Dormant Admin Role Assignment
    description: Detects active Okta admin role assignments for users with no login activity in 30 days.
    tags:
        - okta
        - identity
        - privileged-access
        - stale-accounts
spec:
    severity: HIGH
    category: identity
    resourceType: okta_admin_role
    match:
        query: SELECT r.user_id AS id, COALESCE(u.login, r.user_login, r.user_id) AS account_name, r.role_type, r.role_label, u.last_login FROM okta_admin_roles r LEFT JOIN okta_users u ON u.id = r.user_id WHERE LOWER(COALESCE(u.status, 'active')) IN ('active','enabled','provisioned','onboarded') AND (u.last_login IS NULL OR u.last_login < CURRENT_TIMESTAMP() - INTERVAL '30 days')
    remediation:
        summary: Remove the admin role from dormant users or document the active break-glass review.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
        - name: ISO 27001:2022
          controls:
            - A.5.18
            - A.8.2
    input:
        sourceKinds:
            - okta.admin_role
            - okta.user
        requiredFields:
            - user_id
            - role_type
            - status
            - last_login
        freshnessSLA: 24h
    evidence:
        type: access_review
        assessmentMethods:
            - examine
        requiredForAudit: true
        acceptableSources:
            - okta
        requiredFields:
            - user_id
            - role_type
            - last_login
            - observed_at
        fingerprintFields:
            - tenant_id
            - policy_id
            - resource_urn
            - resource_id
    enabled: true
