apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-dormant-admin-role-assignment
    name: Okta Dormant Admin Role Assignment
    description: Detects each active Okta admin-role assignment whose assigned user has observed stale login activity, preserving per-role evidence for access review alongside account-level stale-login findings.
    tags:
        - okta
        - identity
        - privileged-access
        - stale-accounts
        - graph-backed
    references:
        - https://www.iso.org/standard/27001
spec:
    severity: HIGH
    category: identity
    resourceType: okta_admin_role
    remediation:
        summary: Remove the specific admin role assignment from dormant users or document the active break-glass review.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
        - name: ISO 27001:2022
          controls:
            - A.5.18
            - A.8.2
    input:
        sourceKinds:
            - okta.admin_role
            - okta.user
        requiredFields:
            - user_id
            - role_type
            - status
            - last_login_at
        freshnessSLA: 24h
    context:
        graph:
            anchors:
                - primary_urn
                - resource_urns
            enrich:
                - admin_role
                - privileged_capability
                - last_login_at
                - source_user
    evidence:
        type: access_review
        assessmentMethods:
            - examine
        requiredForAudit: true
        acceptableSources:
            - okta
        requiredFields:
            - user_id
            - role_type
            - last_login_at
            - graph_evidence_count
        fingerprintFields:
            - tenant_id
            - policy_id
            - resource_urn
            - resource_id
    audit:
        evidenceType: access_review
        assessmentMethods:
            - examine
        freshnessSLA: 24h
        auditorStatement: Each Okta admin-role assignment should be reviewed when the assigned user has no recent login activity, even when a separate account-level stale-login finding also exists.
        riskStatement: A dormant user can retain one or more distinct Okta admin roles outside normal activity patterns.
        remediationIntent: Remove the specific admin role assignment, disable the dormant account, or document the reviewed break-glass use case.
        auditorGuidance: Use the per-role graph path from user to admin role and the Okta last_login_at source fact before deciding remediation. This rule intentionally emits one finding per admin-role assignment; account-level stale-login rules should remain account posture evidence.
        falsePositives:
            - A break-glass account may intentionally have no recent login; retain review and monitoring evidence before suppressing.
            - Last login can be absent for source-limited accounts; this rule waits for last_login_at source evidence before emitting.
    verification:
        fixtures:
            - name: dormant user with specific admin role
              expect: finding
              description: Active Okta user has stale last_login_at and a specific admin-role graph edge.
            - name: recent admin login or role removed
              expect: pass
              description: Okta admin user has recent last_login_at evidence or no admin-role graph edge.
        mutationChecks:
            - refresh_last_login_at
            - remove_admin_role_edge
        remediationCheck:
            rerunAfter: source_sync
            expectedStatus: closed
    graph:
        query: |-
            MATCH (user:Entity {tenant_id: $tenant_id, source_id: 'okta', entity_type: 'okta.user'})-[:RELATION {relation: 'can_admin'}]->(role:Entity {tenant_id: $tenant_id, source_id: 'okta', entity_type: 'okta.admin_role'})
            OPTIONAL MATCH (role)-[:RELATION {relation: 'grants_entitlement'}]->(entitlement:Entity {tenant_id: $tenant_id})
            OPTIONAL MATCH (entitlement)-[:RELATION {relation: 'confers_capability'}]->(capability:Entity {tenant_id: $tenant_id})
            WITH user, role, collect(DISTINCT entitlement) AS entitlements, collect(DISTINCT capability) AS capabilities,
                 coalesce(user.attributes_json, '') AS attrs,
                 toLower(coalesce(user.attributes_json, '')) AS user_attrs
            WITH user, role, entitlements, capabilities, user_attrs,
                 CASE WHEN attrs CONTAINS '"last_login_at":"' THEN split(split(attrs, '"last_login_at":"')[1], '"')[0] ELSE '' END AS last_login_at
            WHERE (user_attrs CONTAINS '"status":"active"' OR user_attrs CONTAINS '"status":"provisioned"' OR user_attrs CONTAINS '"status":"enabled"')
              AND last_login_at <> ''
              AND datetime(last_login_at) < datetime() - duration('P30D')
            RETURN user.urn AS primary_urn,
                   user.label AS primary_label,
                   user.entity_type AS primary_type,
                   user.urn + '|' + role.urn AS fingerprint_key,
                   'HIGH' AS severity,
                   'Okta dormant user ' + coalesce(user.label, user.urn) + ' still has admin role assignment ' + coalesce(role.label, role.urn) AS summary,
                   'Remove this admin role assignment or document the current break-glass review' AS action,
                   [user.urn, role.urn] AS resource_urns,
                   [{urn: role.urn, label: role.label, entity_type: role.entity_type, relation: 'can_admin', attributes_json: coalesce(role.attributes_json, '')}] +
                   [e IN entitlements | {urn: e.urn, label: e.label, entity_type: e.entity_type, relation: 'grants_entitlement', attributes_json: coalesce(e.attributes_json, '')}] +
                   [c IN capabilities | {urn: c.urn, label: c.label, entity_type: c.entity_type, relation: 'confers_capability', attributes_json: coalesce(c.attributes_json, '')}] AS evidence,
                   {evidence_basis: 'okta_last_login_at_to_admin_role_assignment_graph_path', confidence: 'medium', remediation_intent: 'Remove this dormant admin role assignment or document a current break-glass review', finding_scope: 'per_admin_role_assignment', lifecycle_state: CASE WHEN user_attrs CONTAINS '"status":"active"' THEN 'active' WHEN user_attrs CONTAINS '"status":"provisioned"' THEN 'provisioned' WHEN user_attrs CONTAINS '"status":"enabled"' THEN 'enabled' ELSE 'active_or_provisioned' END, mfa_state: CASE WHEN user_attrs CONTAINS '"mfa_enrolled":"true"' THEN 'enrolled' WHEN user_attrs CONTAINS '"mfa_enrolled":"false"' THEN 'not_enrolled' ELSE 'unknown' END, last_login_at: last_login_at, source_provenance: 'okta.user last_login_at source fact plus specific okta.admin_role can_admin edge', limitation: 'Requires last_login_at source evidence; this rule emits per admin role assignment and may coexist with account-level stale-login policies.'} AS finding_attributes
            ORDER BY user.urn, role.urn
            LIMIT $row_limit
        rowLimit: 500
        requiredColumns:
            - primary_urn
            - fingerprint_key
            - summary
            - resource_urns
    enabled: true
