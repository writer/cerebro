apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-zoom-stale-login-180d
    name: Zoom Stale Active Accounts (180 days)
    description: Detects long-dormant active zoom accounts with no recent login activity for 180 days.
    tags:
        - zoom
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: zoom_user
    match:
        query: SELECT u.id AS id, u.first_name AS account_name, u.last_login_time AS last_login FROM zoom_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND (u.last_login_time IS NULL OR u.last_login_time < NOW() - INTERVAL '180 days')
    remediation:
        summary: Immediately disable long-dormant accounts and require formal reactivation approval for reinstatement.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
