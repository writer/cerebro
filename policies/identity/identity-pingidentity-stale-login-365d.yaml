apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-pingidentity-stale-login-365d
    name: PingIdentity Stale Active Accounts (365 days)
    description: Detects active PingIdentity accounts with no login activity for at least 365 days.
    tags:
        - pingidentity
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: pingidentity_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.last_sign_on AS last_login FROM pingidentity_users u WHERE COALESCE(u.enabled, true) = true AND (u.last_sign_on IS NULL OR u.last_sign_on < NOW() - INTERVAL '365 days')
    remediation:
        summary: Disable long-dormant accounts and require formal approval before any reactivation.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
