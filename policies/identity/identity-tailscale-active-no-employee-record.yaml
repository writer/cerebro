apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-tailscale-active-no-employee-record
    name: Tailscale Active Accounts Without Employee Record
    description: Detects active Tailscale accounts whose email does not match any employee record.
    tags:
        - tailscale
        - identity
        - joiner-mover-leaver
        - access-review
spec:
    severity: MEDIUM
    category: identity
    resourceType: tailscale_user
    match:
        query: SELECT u.id AS id, u.login_name AS email FROM tailscale_users u LEFT JOIN employees e ON LOWER(COALESCE(u.login_name, '')) = LOWER(e.work_email) WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND COALESCE(TRIM(u.login_name), '') != '' AND e.work_email IS NULL
    remediation:
        summary: Review unmatched accounts, classify approved non-employee identities, and disable unknown access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
