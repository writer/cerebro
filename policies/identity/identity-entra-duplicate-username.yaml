apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-duplicate-username
    name: Entra ID Duplicate Usernames
    description: Detects active Entra ID identities sharing the same username/login.
    tags:
        - entra
        - identity
        - account-hygiene
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: entra_user
    match:
        query: SELECT LOWER(TRIM(u.user_principal_name)) AS username, COUNT(*) AS account_count FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND COALESCE(TRIM(u.user_principal_name), '') != '' GROUP BY LOWER(TRIM(u.user_principal_name)) HAVING COUNT(*) > 1
    remediation:
        summary: Normalize account identifiers to unique usernames and remove duplicate access identities.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
