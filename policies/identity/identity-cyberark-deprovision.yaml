apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-cyberark-deprovision
    name: CyberArk Accounts Deprovisioned on Termination
    description: Ensures CyberArk access is revoked when personnel leave the company
    tags:
        - cyberark
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: cyberark_user
    match:
        query: SELECT c.id, c.username, c.email, e.termination_date FROM cyberark_users c JOIN employees e ON LOWER(c.email) = LOWER(e.work_email) WHERE e.status = 'terminated' AND COALESCE(c.active, true) = true
    remediation:
        summary: Disable or remove accounts for terminated employees within 24 hours. Automate offboarding workflows where possible.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
