apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-sailpoint-membership-personal-email-domain
    name: SailPoint Memberships Using Personal Email Domains
    description: Detects SailPoint group memberships tied to personal email domains.
    tags:
        - sailpoint
        - identity
        - groups
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: sailpoint_group_membership
    match:
        query: SELECT m.group_id, m.email AS email FROM sailpoint_group_memberships m WHERE LOWER(COALESCE(m.email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\.com'
    remediation:
        summary: Replace personal-domain group members with corporate identities or remove unauthorized access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
