apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-risky-terminated-active-account
    name: Entra Risky Terminated Accounts Still Active
    description: Detects terminated employees that still have active access in entra_risky.
    tags:
        - entra_risky
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: entra_risky_user
    match:
        query: SELECT u.id AS id, u.user_principal_name AS email, e.termination_date FROM entra_risky_users u JOIN employees e ON LOWER(COALESCE(u.user_principal_name, '')) = LOWER(e.work_email) WHERE e.status = 'terminated' AND 1=1
    remediation:
        summary: Disable or remove provider access for terminated employees within 24 hours and verify all active sessions are revoked.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
