apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-privileged-personal-email
    name: Okta Privileged Accounts on Personal Email Domains
    description: Detects privileged okta accounts tied to personal email domains.
    tags:
        - okta
        - identity
        - privileged-access
        - governance
spec:
    severity: HIGH
    category: identity
    resourceType: okta_user
    match:
        query: SELECT u.id AS id, u.email AS email FROM okta_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND (COALESCE(u.is_admin, false) = true) AND LOWER(COALESCE(u.email, '')) RLIKE '.*@(gmail|yahoo|hotmail|outlook)\\.com$'
    remediation:
        summary: Migrate privileged accounts to corporate identity domains and remove personal-domain privileged access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
