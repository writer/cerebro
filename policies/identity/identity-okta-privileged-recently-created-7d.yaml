apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-privileged-recently-created-7d
    name: Okta Newly Created Privileged Accounts
    description: Detects privileged Okta accounts created in the last 7 days for expedited review.
    tags:
        - okta
        - identity
        - privileged-access
        - change-control
spec:
    severity: MEDIUM
    category: identity
    resourceType: okta_user
    match:
        query: SELECT u.id AS id, u.login AS account_name, u.created AS created_at FROM okta_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND (COALESCE(u.is_admin, false) = true) AND u.created > CURRENT_TIMESTAMP() - INTERVAL '7 days'
    remediation:
        summary: Confirm change tickets and owner approval for newly created privileged accounts.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
