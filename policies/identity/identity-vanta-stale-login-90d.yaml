apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-vanta-stale-login-90d
    name: Vanta Stale Active Accounts (90 days)
    description: Detects active vanta accounts with no recent login activity for 90 days.
    tags:
        - vanta
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: vanta_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.last_login_at AS last_login FROM vanta_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND (u.last_login_at IS NULL OR u.last_login_at < NOW() - INTERVAL '90 days')
    remediation:
        summary: Review stale accounts and disable or deprovision access if no valid business need exists.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
