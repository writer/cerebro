apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-stale-login-180d
    name: Entra Stale Active Accounts (180 days)
    description: Detects long-dormant active entra accounts with no recent login activity for 180 days.
    tags:
        - entra
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: entra_user
    match:
        query: SELECT u.id AS id, u.display_name AS account_name, u.last_sign_in_datetime AS last_login FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND (u.last_sign_in_datetime IS NULL OR u.last_sign_in_datetime < NOW() - INTERVAL '180 days')
    remediation:
        summary: Immediately disable long-dormant accounts and require formal reactivation approval for reinstatement.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
