apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-onelogin-missing-email
    name: Onelogin Active Accounts Missing Email
    description: Detects active onelogin accounts missing an email address for identity matching and offboarding controls.
    tags:
        - onelogin
        - identity
        - data-quality
        - account-hygiene
spec:
    severity: MEDIUM
    category: identity
    resourceType: onelogin_user
    match:
        query: SELECT u.id AS id, u.username AS account_name FROM onelogin_users u WHERE COALESCE(u.status, 0) = 1 AND COALESCE(TRIM(u.email), '') = ''
    remediation:
        summary: Populate a valid corporate email on the account or disable the account until ownership can be verified.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
