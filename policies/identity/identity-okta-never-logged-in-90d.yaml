apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-never-logged-in-90d
    name: Okta Accounts Never Used (90 days)
    description: Detects active Okta accounts older than 90 days that have never logged in.
    tags:
        - okta
        - identity
        - least-privilege
        - stale-accounts
spec:
    severity: MEDIUM
    category: identity
    resourceType: okta_user
    match:
        query: SELECT u.id AS id, u.login AS account_name, u.created AS created_at FROM okta_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND u.last_login IS NULL AND u.created < CURRENT_TIMESTAMP() - INTERVAL '90 days'
    remediation:
        summary: Remove or disable never-used accounts and fix any over-provisioning in onboarding workflows.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
