apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-onelogin-stale-login-180d
    name: Onelogin Stale Active Accounts (180 days)
    description: Detects long-dormant active onelogin accounts with no recent login activity for 180 days.
    tags:
        - onelogin
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: onelogin_user
    match:
        query: SELECT u.id AS id, u.username AS account_name, u.last_login AS last_login FROM onelogin_users u WHERE COALESCE(u.status, 0) = 1 AND (u.last_login IS NULL OR u.last_login < NOW() - INTERVAL '180 days')
    remediation:
        summary: Immediately disable long-dormant accounts and require formal reactivation approval for reinstatement.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
