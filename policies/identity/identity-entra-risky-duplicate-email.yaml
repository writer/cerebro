apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-risky-duplicate-email
    name: Entra Risky Duplicate Account Emails
    description: Detects duplicate active entra_risky accounts sharing the same email identity.
    tags:
        - entra_risky
        - identity
        - access-control
        - account-hygiene
spec:
    severity: HIGH
    category: identity
    resourceType: entra_risky_user
    match:
        query: SELECT LOWER(TRIM(u.user_principal_name)) AS email, COUNT(*) AS account_count FROM entra_risky_users u WHERE 1=1 AND COALESCE(TRIM(u.user_principal_name), '') != '' GROUP BY LOWER(TRIM(u.user_principal_name)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate identities and remove unintended duplicate access paths.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
