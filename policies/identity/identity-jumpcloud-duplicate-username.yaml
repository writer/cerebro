apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-jumpcloud-duplicate-username
    name: JumpCloud Duplicate Usernames
    description: Detects active JumpCloud identities sharing the same username/login.
    tags:
        - jumpcloud
        - identity
        - account-hygiene
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: jumpcloud_user
    match:
        query: SELECT LOWER(TRIM(u.username)) AS username, COUNT(*) AS account_count FROM jumpcloud_users u WHERE COALESCE(u.activated, true) = true AND COALESCE(u.suspended, false) = false AND COALESCE(TRIM(u.username), '') != '' GROUP BY LOWER(TRIM(u.username)) HAVING COUNT(*) > 1
    remediation:
        summary: Normalize account identifiers to unique usernames and remove duplicate access identities.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
