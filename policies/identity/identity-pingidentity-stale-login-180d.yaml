apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-pingidentity-stale-login-180d
    name: Pingidentity Stale Active Accounts (180 days)
    description: Detects long-dormant active pingidentity accounts with no recent login activity for 180 days.
    tags:
        - pingidentity
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: pingidentity_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.last_sign_on AS last_login FROM pingidentity_users u WHERE COALESCE(u.enabled, true) = true AND (u.last_sign_on IS NULL OR u.last_sign_on < NOW() - INTERVAL '180 days')
    remediation:
        summary: Immediately disable long-dormant accounts and require formal reactivation approval for reinstatement.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
