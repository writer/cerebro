apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-tailscale-deprovision
    name: Tailscale Accounts Deprovisioned on Termination
    description: Ensures Tailscale network access is revoked when personnel leave the company
    tags:
        - tailscale
        - network
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: tailscale_user
    match:
        query: SELECT t.id, t.login_name, t.display_name, e.termination_date FROM tailscale_users t JOIN employees e ON t.login_name LIKE '%' || e.work_email || '%' WHERE e.status = 'terminated' AND t.status = 'active'
    remediation:
        summary: Remove Tailscale access for terminated employees within 24 hours of termination.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.3
            - CC6.6
        - name: ISO 27001:2022
          controls:
            - A.5.11
            - A.6.5
            - A.8.20
            - A.8.22
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - PS-4
            - AC-3
            - AC-4
            - SC-7
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
            - "12"
            - "13"
        - name: PCI DSS v4.0.1
          controls:
            - 8.1.3
            - "1.3"
            - "1.4"
    enabled: true
