apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-external-account-no-owner
    name: Okta External Account Missing Owner Evidence
    description: Detects active Okta accounts on non-corporate domains that do not have manager, employee, or owner evidence.
    tags:
        - okta
        - identity
        - third-party-access
        - owner-evidence
spec:
    severity: MEDIUM
    category: identity
    resourceType: okta_user
    match:
        query: SELECT u.id AS id, COALESCE(u.login, u.email, u.id) AS account_name, u.email, u.user_type, u.manager, u.manager_id, u.employee_number FROM okta_users u LEFT JOIN employees e ON LOWER(COALESCE(u.email, '')) = LOWER(e.work_email) WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND COALESCE(TRIM(u.email), '') != '' AND LOWER(COALESCE(u.email, '')) RLIKE '.*@(gmail|yahoo|hotmail|outlook|icloud|protonmail)\\.com$' AND e.work_email IS NULL AND COALESCE(TRIM(u.manager_id), TRIM(u.manager), TRIM(u.employee_number), '') = ''
    remediation:
        summary: Assign an internal owner, document the external account purpose, or disable the account.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.5.18
    input:
        sourceKinds:
            - okta.user
        requiredFields:
            - email
            - status
            - manager
            - manager_id
            - employee_number
        freshnessSLA: 24h
    evidence:
        type: identity_governance
        assessmentMethods:
            - examine
        requiredForAudit: true
        acceptableSources:
            - okta
        requiredFields:
            - user_id
            - email
            - manager
            - manager_id
            - employee_number
            - observed_at
        fingerprintFields:
            - tenant_id
            - policy_id
            - resource_urn
            - resource_id
    enabled: true
