apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-jumpcloud-membership-inactive-user
    name: JumpCloud Memberships With Inactive Users
    description: Detects JumpCloud group memberships that still reference inactive users.
    tags:
        - jumpcloud
        - identity
        - groups
        - offboarding
spec:
    severity: MEDIUM
    category: identity
    resourceType: jumpcloud_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM jumpcloud_group_memberships m JOIN jumpcloud_users u ON m.user_id = u.id WHERE NOT (COALESCE(u.activated, true) = true AND COALESCE(u.suspended, false) = false)
    remediation:
        summary: Remove inactive users from all groups and verify deprovisioning workflows are complete.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
