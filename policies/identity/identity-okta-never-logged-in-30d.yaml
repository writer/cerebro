apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-never-logged-in-30d
    name: Okta Accounts Never Used After Provisioning
    description: Detects active okta accounts older than 30 days with no successful login recorded.
    tags:
        - okta
        - identity
        - stale-accounts
        - least-privilege
spec:
    severity: MEDIUM
    category: identity
    resourceType: okta_user
    match:
        query: SELECT u.id AS id, u.login AS account_name, u.created AS created_at FROM okta_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND u.last_login IS NULL AND u.created < CURRENT_TIMESTAMP() - INTERVAL '30 days'
    remediation:
        summary: Remove or disable unused accounts and confirm provisioning flows are not creating unnecessary access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
