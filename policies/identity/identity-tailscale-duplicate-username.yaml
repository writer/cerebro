apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-tailscale-duplicate-username
    name: Tailscale Duplicate Usernames
    description: Detects active Tailscale identities sharing the same username/login.
    tags:
        - tailscale
        - identity
        - account-hygiene
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: tailscale_user
    match:
        query: SELECT LOWER(TRIM(u.login_name)) AS username, COUNT(*) AS account_count FROM tailscale_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND COALESCE(TRIM(u.login_name), '') != '' GROUP BY LOWER(TRIM(u.login_name)) HAVING COUNT(*) > 1
    remediation:
        summary: Normalize account identifiers to unique usernames and remove duplicate access identities.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
