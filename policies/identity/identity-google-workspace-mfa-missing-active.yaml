apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-mfa-missing-active
    name: Google Workspace Active Accounts Without MFA
    description: Detects active google_workspace accounts that do not meet MFA requirements.
    tags:
        - google_workspace
        - identity
        - mfa
        - authentication
spec:
    severity: HIGH
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.name AS account_name FROM google_workspace_users u WHERE 1=1 AND (COALESCE(u.is_enrolled_in_2sv, false) = false OR COALESCE(u.is_enforced_in_2sv, false) = false)
    remediation:
        summary: Require MFA enrollment and enforcement for all active accounts.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
