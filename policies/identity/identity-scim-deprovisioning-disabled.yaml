apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-scim-deprovisioning-disabled
    name: Identity Scim Deprovisioning Disabled
    description: "Identity Scim Deprovisioning Disabled policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - identity
        - scim
        - offboarding
        - generated
spec:
    severity: medium
    effect: forbid
    resource: "identity::provisioning_connection"
    match:
        conditions:
            - "cmp_eq(path(resource, \"scim_deprovisioning_disabled\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore scim deprovisioning disabled controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - ACCESS_CONTROL
        - IDENTITY_GOVERNANCE
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.3
        - name: "ISO 27001:2022"
          controls:
            - A.5.15
            - A.5.16
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-3
            - IA-2
