apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-oracle-idcs-duplicate-username
    name: Oracle IDCS Duplicate Usernames
    description: Detects active Oracle IDCS identities sharing the same username/login.
    tags:
        - oracle-idcs
        - identity
        - account-hygiene
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: oracle_idcs_user
    match:
        query: SELECT LOWER(TRIM(u.username)) AS username, COUNT(*) AS account_count FROM oracle_idcs_users u WHERE COALESCE(u.active, true) = true AND COALESCE(TRIM(u.username), '') != '' GROUP BY LOWER(TRIM(u.username)) HAVING COUNT(*) > 1
    remediation:
        summary: Normalize account identifiers to unique usernames and remove duplicate access identities.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
