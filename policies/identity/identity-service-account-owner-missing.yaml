apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-service-account-owner-missing
    name: Identity Service Account Owner Missing
    description: "Identity Service Account Owner Missing policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - identity
        - service-account
        - ownership
        - generated
        - service
spec:
    severity: medium
    effect: forbid
    resource: "identity::service_account"
    match:
        conditions:
            - "cmp_eq(path(resource, \"service_account_owner_missing\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore service account owner missing controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - ACCESS_CONTROL
        - IDENTITY_GOVERNANCE
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.3
        - name: "ISO 27001:2022"
          controls:
            - A.5.15
            - A.5.16
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-3
            - IA-2
