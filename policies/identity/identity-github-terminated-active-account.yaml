apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-terminated-active-account
    name: Github Terminated Accounts Still Active
    description: Detects terminated employees that still have active access in github.
    tags:
        - github
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: github_organization_member
    match:
        query: SELECT u.id AS id, u.email AS email, e.termination_date FROM github_organization_members u JOIN employees e ON LOWER(COALESCE(u.email, '')) = LOWER(e.work_email) WHERE e.status = 'terminated' AND 1=1
    remediation:
        summary: Disable or remove provider access for terminated employees within 24 hours and verify all active sessions are revoked.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
