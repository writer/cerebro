apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-kolide-stale-login-365d
    name: Kolide Stale Active Accounts (365 days)
    description: Detects active Kolide accounts with no login activity for at least 365 days.
    tags:
        - kolide
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: kolide_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.last_seen_at AS last_login FROM kolide_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND (u.last_seen_at IS NULL OR u.last_seen_at < NOW() - INTERVAL '365 days')
    remediation:
        summary: Disable long-dormant accounts and require formal approval before any reactivation.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
