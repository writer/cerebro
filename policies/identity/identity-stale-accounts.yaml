apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-stale-accounts-disabled
    name: Stale User Accounts Disabled
    description: User accounts that have not been used for 90 days should be disabled or reviewed to reduce attack surface
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - identity
        - stale-accounts
        - access-review
        - hygiene
spec:
    severity: medium
    effect: forbid
    resource: identity_user_accounts
    match:
        conditions:
            - cmp_gt(path(resource, "days_since_last_login"), 90)
            - cmp_eq(path(resource, "account_active"), true)
            - cmp_ne(path(resource, "is_service_account"), true)
        conditionFormat: cel
    remediation:
        summary: Review the account for necessity. Disable if no longer needed or contact the user to confirm continued need
        steps:
            - Identify accounts with no login activity for 90+ days
            - Cross-reference with HRIS to verify employment status
            - Contact account owner to verify continued need
            - Disable accounts that are no longer needed
            - Document exceptions with business justification
    riskCategories:
        - IDENTITY_RISK
    frameworks:
        - name: CIS Controls v8
          controls:
            - "5.3"
        - name: SOC 2
          controls:
            - CC6.2
        - name: ISO 27001:2022
          controls:
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
