apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-saviynt-empty-groups
    name: Saviynt Empty Access Groups
    description: Detects empty groups in saviynt that may indicate stale access governance artifacts.
    tags:
        - saviynt
        - identity
        - groups
        - stale-configuration
spec:
    severity: LOW
    category: identity
    resourceType: saviynt_group
    match:
        query: SELECT g.id AS id, g.display_name AS group_name FROM saviynt_groups g LEFT JOIN saviynt_group_memberships m ON g.id = m.group_id WHERE m.group_id IS NULL
    remediation:
        summary: Delete stale groups or document their future purpose and ownership before retaining them.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
