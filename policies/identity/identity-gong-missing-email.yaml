apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-gong-missing-email
    name: Gong Active Accounts Missing Email
    description: Detects active gong accounts missing an email address for identity matching and offboarding controls.
    tags:
        - gong
        - identity
        - data-quality
        - account-hygiene
spec:
    severity: MEDIUM
    category: identity
    resourceType: gong_user
    match:
        query: SELECT u.id AS id, u.first_name AS account_name FROM gong_users u WHERE COALESCE(u.active, true) = true AND COALESCE(TRIM(u.email), '') = ''
    remediation:
        summary: Populate a valid corporate email on the account or disable the account until ownership can be verified.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
