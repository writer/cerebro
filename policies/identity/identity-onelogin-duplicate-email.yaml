apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-onelogin-duplicate-email
    name: Onelogin Duplicate Account Emails
    description: Detects duplicate active onelogin accounts sharing the same email identity.
    tags:
        - onelogin
        - identity
        - access-control
        - account-hygiene
spec:
    severity: HIGH
    category: identity
    resourceType: onelogin_user
    match:
        query: SELECT LOWER(TRIM(u.email)) AS email, COUNT(*) AS account_count FROM onelogin_users u WHERE COALESCE(u.status, 0) = 1 AND COALESCE(TRIM(u.email), '') != '' GROUP BY LOWER(TRIM(u.email)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate identities and remove unintended duplicate access paths.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
