apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-auth0-never-logged-in-90d
    name: Auth0 Accounts Never Used (90 days)
    description: Detects active Auth0 accounts older than 90 days that have never logged in.
    tags:
        - auth0
        - identity
        - least-privilege
        - stale-accounts
spec:
    severity: MEDIUM
    category: identity
    resourceType: auth0_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.created_at AS created_at FROM auth0_users u WHERE COALESCE(u.blocked, false) = false AND u.last_login IS NULL AND u.created_at < NOW() - INTERVAL '90 days'
    remediation:
        summary: Remove or disable never-used accounts and fix any over-provisioning in onboarding workflows.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
