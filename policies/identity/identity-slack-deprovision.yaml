apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-slack-deprovision
    name: Slack Accounts Deprovisioned on Termination
    description: Ensures Slack workspace access is revoked when personnel leave the company
    tags:
        - slack
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: slack_user
    match:
        query: SELECT s.id, s.email, s.real_name, e.termination_date FROM slack_users s JOIN employees e ON s.email = e.work_email WHERE e.status = 'terminated' AND s.deleted = false
    remediation:
        summary: Deactivate Slack accounts for terminated employees within 24 hours of termination.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.3
        - name: ISO 27001:2022
          controls:
            - A.5.11
            - A.6.5
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - PS-4
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - 8.1.3
    enabled: true
