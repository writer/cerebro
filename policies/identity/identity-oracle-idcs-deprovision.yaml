apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-oracle-idcs-deprovision
    name: Oracle IDCS Accounts Deprovisioned on Termination
    description: Ensures Oracle IDCS access is revoked when personnel leave the company
    tags:
        - oracle_idcs
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: oracle_idcs_user
    match:
        query: SELECT o.id, o.username, o.email, e.termination_date FROM oracle_idcs_users o JOIN employees e ON LOWER(o.email) = LOWER(e.work_email) WHERE e.status = 'terminated' AND COALESCE(o.active, true) = true
    remediation:
        summary: Disable or remove accounts for terminated employees within 24 hours. Automate offboarding workflows where possible.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
