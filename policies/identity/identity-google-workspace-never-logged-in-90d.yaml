apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-never-logged-in-90d
    name: Google Workspace Accounts Never Used (90 days)
    description: Detects active Google Workspace accounts older than 90 days that have never logged in.
    tags:
        - google-workspace
        - identity
        - least-privilege
        - stale-accounts
spec:
    severity: MEDIUM
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.creation_time AS created_at FROM google_workspace_users u WHERE 1=1 AND u.last_login_time IS NULL AND u.creation_time < NOW() - INTERVAL '90 days'
    remediation:
        summary: Remove or disable never-used accounts and fix any over-provisioning in onboarding workflows.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
