apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-ramp-privileged-personal-email
    name: Ramp Privileged Accounts on Personal Email Domains
    description: Detects privileged ramp accounts tied to personal email domains.
    tags:
        - ramp
        - identity
        - privileged-access
        - governance
spec:
    severity: HIGH
    category: identity
    resourceType: ramp_user
    match:
        query: SELECT u.id AS id, u.email AS email FROM ramp_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND (LOWER(COALESCE(u.role, '')) LIKE '%admin%' OR LOWER(COALESCE(u.role, '')) LIKE '%owner%' OR LOWER(COALESCE(u.role, '')) LIKE '%super%') AND LOWER(COALESCE(u.email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate privileged accounts to corporate identity domains and remove personal-domain privileged access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
