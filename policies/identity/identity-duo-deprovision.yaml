apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-duo-deprovision
    name: Duo Accounts Deprovisioned on Termination
    description: Ensures Duo access is revoked when personnel leave the company
    tags:
        - duo
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: duo_user
    match:
        query: SELECT d.id, d.username, d.email, e.termination_date FROM duo_users d JOIN employees e ON LOWER(d.email) = LOWER(e.work_email) WHERE e.status = 'terminated' AND LOWER(COALESCE(d.status, '')) = 'active'
    remediation:
        summary: Disable or remove accounts for terminated employees within 24 hours. Automate offboarding workflows where possible.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
