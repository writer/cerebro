apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-conditional-access-high-risk-signin
    name: Identity Conditional Access High Risk Signin
    description: "Identity Conditional Access High Risk Signin policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - identity
        - conditional-access
        - signin
        - generated
        - conditional
spec:
    severity: medium
    effect: forbid
    resource: "identity::conditional_access_policy"
    match:
        conditions:
            - "cmp_ne(path(resource, \"conditional_access_high_risk_signin_compliant\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore conditional access high risk signin controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - ACCESS_CONTROL
        - IDENTITY_GOVERNANCE
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.3
        - name: "ISO 27001:2022"
          controls:
            - A.5.15
            - A.5.16
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-3
            - IA-2
