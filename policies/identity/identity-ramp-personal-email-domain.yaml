apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-ramp-personal-email-domain
    name: Ramp Accounts Using Personal Email Domains
    description: Detects active ramp accounts using personal email domains instead of corporate identity domains.
    tags:
        - ramp
        - identity
        - account-hygiene
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: ramp_user
    match:
        query: SELECT u.id AS id, u.email AS email FROM ramp_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND LOWER(COALESCE(u.email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate account identities to corporate domains and disable personal-domain access where not explicitly approved.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
