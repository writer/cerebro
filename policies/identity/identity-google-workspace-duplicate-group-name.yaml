apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-duplicate-group-name
    name: Google Workspace Duplicate Group Names
    description: Detects duplicate group names in google_workspace, which can cause ambiguous access assignment.
    tags:
        - google_workspace
        - identity
        - groups
        - access-governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: google_workspace_group
    match:
        query: SELECT LOWER(TRIM(g.name)) AS group_name, COUNT(*) AS group_count FROM google_workspace_groups g WHERE COALESCE(TRIM(g.name), '') != '' GROUP BY LOWER(TRIM(g.name)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate groups or rename to make ownership and access scope unambiguous.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
