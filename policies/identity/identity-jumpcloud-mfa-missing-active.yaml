apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-jumpcloud-mfa-missing-active
    name: Jumpcloud Active Accounts Without MFA
    description: Detects active jumpcloud accounts that do not meet MFA requirements.
    tags:
        - jumpcloud
        - identity
        - mfa
        - authentication
spec:
    severity: HIGH
    category: identity
    resourceType: jumpcloud_user
    match:
        query: SELECT u.id AS id, u.display_name AS account_name FROM jumpcloud_users u WHERE COALESCE(u.activated, true) = true AND COALESCE(u.suspended, false) = false AND COALESCE(u.mfa_enabled, false) = false
    remediation:
        summary: Require MFA enrollment and enforcement for all active accounts.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
