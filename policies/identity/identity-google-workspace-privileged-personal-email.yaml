apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-privileged-personal-email
    name: Google Workspace Privileged Accounts on Personal Email Domains
    description: Detects privileged google_workspace accounts tied to personal email domains.
    tags:
        - google_workspace
        - identity
        - privileged-access
        - governance
spec:
    severity: HIGH
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.primary_email AS email FROM google_workspace_users u WHERE 1=1 AND (COALESCE(u.is_admin, false) = true) AND LOWER(COALESCE(u.primary_email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate privileged accounts to corporate identity domains and remove personal-domain privileged access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
