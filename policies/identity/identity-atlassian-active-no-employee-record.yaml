apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-atlassian-active-no-employee-record
    name: Atlassian Active Accounts Without Employee Record
    description: Detects active Atlassian accounts whose email does not match any employee record.
    tags:
        - atlassian
        - identity
        - joiner-mover-leaver
        - access-review
spec:
    severity: MEDIUM
    category: identity
    resourceType: atlassian_user
    match:
        query: SELECT u.account_id AS id, u.email_address AS email FROM atlassian_users u LEFT JOIN employees e ON LOWER(COALESCE(u.email_address, '')) = LOWER(e.work_email) WHERE COALESCE(u.active, true) = true AND COALESCE(TRIM(u.email_address), '') != '' AND e.work_email IS NULL
    remediation:
        summary: Review unmatched accounts, classify approved non-employee identities, and disable unknown access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
