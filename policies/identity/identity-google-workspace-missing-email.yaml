apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-missing-email
    name: Google Workspace Active Accounts Missing Email
    description: Detects active google_workspace accounts missing an email address for identity matching and offboarding controls.
    tags:
        - google_workspace
        - identity
        - data-quality
        - account-hygiene
spec:
    severity: MEDIUM
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.name AS account_name FROM google_workspace_users u WHERE 1=1 AND COALESCE(TRIM(u.primary_email), '') = ''
    remediation:
        summary: Populate a valid corporate email on the account or disable the account until ownership can be verified.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
