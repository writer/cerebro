apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-never-logged-in-30d
    name: Entra Accounts Never Used After Provisioning
    description: Detects active entra accounts older than 30 days with no successful login recorded.
    tags:
        - entra
        - identity
        - stale-accounts
        - least-privilege
spec:
    severity: MEDIUM
    category: identity
    resourceType: entra_user
    match:
        query: SELECT u.id AS id, u.display_name AS account_name, u.created_datetime AS created_at FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND u.last_sign_in_datetime IS NULL AND u.created_datetime < NOW() - INTERVAL '30 days'
    remediation:
        summary: Remove or disable unused accounts and confirm provisioning flows are not creating unnecessary access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
