apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-office365-deprovision
    name: Office 365 Accounts Deprovisioned on Termination
    description: Ensures Office 365 access is revoked when personnel leave the company
    tags:
        - office365
        - entra
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: entra_user
    match:
        query: SELECT u.id, u.user_principal_name, u.display_name, e.termination_date FROM entra_users u JOIN employees e ON u.mail = e.work_email WHERE e.status = 'terminated' AND u.account_enabled = true
    remediation:
        summary: Disable Office 365/Entra ID accounts for terminated employees within 24 hours of termination.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.3
        - name: ISO 27001:2022
          controls:
            - A.5.11
            - A.6.5
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - PS-4
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - 8.1.3
    enabled: true
