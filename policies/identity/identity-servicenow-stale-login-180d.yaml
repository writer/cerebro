apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-servicenow-stale-login-180d
    name: Servicenow Stale Active Accounts (180 days)
    description: Detects long-dormant active servicenow accounts with no recent login activity for 180 days.
    tags:
        - servicenow
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: servicenow_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.last_login_at AS last_login FROM servicenow_users u WHERE COALESCE(u.active, true) = true AND (u.last_login_at IS NULL OR u.last_login_at < NOW() - INTERVAL '180 days')
    remediation:
        summary: Immediately disable long-dormant accounts and require formal reactivation approval for reinstatement.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
