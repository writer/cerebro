apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-missing-email
    name: Entra Active Accounts Missing Email
    description: Detects active entra accounts missing an email address for identity matching and offboarding controls.
    tags:
        - entra
        - identity
        - data-quality
        - account-hygiene
spec:
    severity: MEDIUM
    category: identity
    resourceType: entra_user
    match:
        query: SELECT u.id AS id, u.display_name AS account_name FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND COALESCE(TRIM(u.mail), '') = ''
    remediation:
        summary: Populate a valid corporate email on the account or disable the account until ownership can be verified.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
