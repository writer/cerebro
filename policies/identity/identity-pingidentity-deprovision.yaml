apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-pingidentity-deprovision
    name: PingIdentity Accounts Deprovisioned on Termination
    description: Ensures PingIdentity access is revoked when personnel leave the company
    tags:
        - pingidentity
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: pingidentity_user
    match:
        query: SELECT p.id, p.username, p.email, e.termination_date FROM pingidentity_users p JOIN employees e ON LOWER(p.email) = LOWER(e.work_email) WHERE e.status = 'terminated' AND COALESCE(p.enabled, true) = true
    remediation:
        summary: Disable or remove accounts for terminated employees within 24 hours. Automate offboarding workflows where possible.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
