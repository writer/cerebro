apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-privileged-no-mfa
    name: Github Privileged Accounts Without MFA
    description: Detects privileged github accounts missing MFA protections.
    tags:
        - github
        - identity
        - mfa
        - privileged-access
spec:
    severity: HIGH
    category: identity
    resourceType: github_organization_member
    match:
        query: SELECT u.id AS id, u.login AS account_name FROM github_organization_members u WHERE 1=1 AND (COALESCE(u.site_admin, false) = true OR LOWER(COALESCE(u.role, '')) LIKE '%admin%' OR LOWER(COALESCE(u.role, '')) LIKE '%owner%' OR LOWER(COALESCE(u.role, '')) LIKE '%super%') AND COALESCE(u.two_factor_enabled, false) = false
    remediation:
        summary: Immediately enforce MFA on privileged identities and suspend privileged actions until compliant.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
