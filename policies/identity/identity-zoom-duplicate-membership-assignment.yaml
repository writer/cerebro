apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-zoom-duplicate-membership-assignment
    name: Zoom Duplicate Membership Assignments
    description: Detects duplicate Zoom group membership rows for the same member and group.
    tags:
        - zoom
        - identity
        - groups
        - data-integrity
spec:
    severity: LOW
    category: identity
    resourceType: zoom_group_membership
    match:
        query: SELECT m.group_id, m.user_id AS member_key, COUNT(*) AS membership_count FROM zoom_group_memberships m WHERE m.group_id IS NOT NULL AND m.user_id IS NOT NULL GROUP BY m.group_id, m.user_id HAVING COUNT(*) > 1
    remediation:
        summary: Deduplicate repeated membership rows and validate provisioning idempotency in sync pipelines.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
