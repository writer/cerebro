apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-pingidentity-personal-email-domain
    name: Pingidentity Accounts Using Personal Email Domains
    description: Detects active pingidentity accounts using personal email domains instead of corporate identity domains.
    tags:
        - pingidentity
        - identity
        - account-hygiene
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: pingidentity_user
    match:
        query: SELECT u.id AS id, u.email AS email FROM pingidentity_users u WHERE COALESCE(u.enabled, true) = true AND LOWER(COALESCE(u.email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate account identities to corporate domains and disable personal-domain access where not explicitly approved.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
