apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-group-description-missing
    name: Google Workspace Groups Missing Description
    description: Detects google_workspace groups missing descriptions required for access governance and reviews.
    tags:
        - google_workspace
        - identity
        - groups
        - governance
spec:
    severity: LOW
    category: identity
    resourceType: google_workspace_group
    match:
        query: SELECT g.id AS id, g.name AS group_name FROM google_workspace_groups g WHERE COALESCE(TRIM(g.description), '') = ''
    remediation:
        summary: Add business-owner and purpose descriptions to all groups to improve certification quality.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
