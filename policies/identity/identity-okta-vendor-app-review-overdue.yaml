apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-vendor-app-review-overdue
    name: Okta Vendor App Linked to Overdue Vendor Review
    description: Detects active Okta SaaS or vendor-facing applications whose matching GRC vendor record has no security owner or an overdue security review.
    tags:
        - okta
        - identity
        - vendor-monitoring
        - third-party-risk
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: okta_application
    match:
        query: WITH vendor_apps AS (SELECT app.id AS app_id, COALESCE(app.label, app.name, app.id) AS app_name, app.sign_on_mode, app.status FROM okta_applications app WHERE LOWER(COALESCE(app.status, 'active')) IN ('active', 'enabled') AND NOT LOWER(COALESCE(app.label, app.name, '')) RLIKE '.*(test|sandbox|dev|internal).*' AND (LOWER(COALESCE(app.sign_on_mode, '')) RLIKE '.*(saml|oidc|oauth|openid).*' OR LOWER(COALESCE(app.label, app.name, '')) RLIKE '.*(org2org|vendor|partner|supplier|contractor|external).*')) SELECT va.app_id AS id, va.app_name, v.id AS vendor_id, v.name AS vendor_name, v.security_owner_user_id, v.next_security_review_due_date FROM vendor_apps va JOIN vendors v ON LOWER(COALESCE(v.name, '')) = LOWER(va.app_name) WHERE COALESCE(v.security_owner_user_id, '') = '' OR v.next_security_review_due_date IS NULL OR v.next_security_review_due_date < NOW()
    remediation:
        summary: Assign a security owner, complete or update the vendor security review, and confirm the Okta application remains approved for use.
    frameworks:
        - name: SOC 2
          controls:
            - CC9.2
        - name: ISO 27001:2022
          controls:
            - A.5.19
            - A.5.20
    enabled: true
