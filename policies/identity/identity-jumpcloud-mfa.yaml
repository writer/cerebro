apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-jumpcloud-mfa
    name: JumpCloud Active Users Without MFA
    description: Detects active JumpCloud users that do not have MFA enabled
    tags:
        - jumpcloud
        - identity
        - mfa
        - authentication
spec:
    severity: HIGH
    category: identity
    resourceType: jumpcloud_user
    match:
        query: SELECT id, username, email, activated, suspended, mfa_enabled FROM jumpcloud_users WHERE COALESCE(activated, true) = true AND COALESCE(suspended, false) = false AND COALESCE(mfa_enabled, false) = false
    remediation:
        summary: Enable MFA for all active JumpCloud users and enforce MFA enrollment with policy controls.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
