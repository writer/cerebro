apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-atlassian-duplicate-membership-assignment
    name: Atlassian Duplicate Membership Assignments
    description: Detects duplicate Atlassian group membership rows for the same member and group.
    tags:
        - atlassian
        - identity
        - groups
        - data-integrity
spec:
    severity: LOW
    category: identity
    resourceType: atlassian_group_membership
    match:
        query: SELECT m.group_id, m.account_id AS member_key, COUNT(*) AS membership_count FROM atlassian_group_memberships m WHERE m.group_id IS NOT NULL AND m.account_id IS NOT NULL GROUP BY m.group_id, m.account_id HAVING COUNT(*) > 1
    remediation:
        summary: Deduplicate repeated membership rows and validate provisioning idempotency in sync pipelines.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
