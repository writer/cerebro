apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-saviynt-deprovision
    name: Saviynt Accounts Deprovisioned on Termination
    description: Ensures Saviynt access is revoked when personnel leave the company
    tags:
        - saviynt
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: saviynt_user
    match:
        query: SELECT s.id, s.username, s.email, e.termination_date FROM saviynt_users s JOIN employees e ON LOWER(s.email) = LOWER(e.work_email) WHERE e.status = 'terminated' AND COALESCE(s.active, true) = true
    remediation:
        summary: Disable or remove accounts for terminated employees within 24 hours. Automate offboarding workflows where possible.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.3
        - name: ISO 27001:2022
          controls:
            - A.5.11
            - A.6.5
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - PS-4
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - 8.1.3
    enabled: true
