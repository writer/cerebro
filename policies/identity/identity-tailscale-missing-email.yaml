apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-tailscale-missing-email
    name: Tailscale Active Accounts Missing Email
    description: Detects active tailscale accounts missing an email address for identity matching and offboarding controls.
    tags:
        - tailscale
        - identity
        - data-quality
        - account-hygiene
spec:
    severity: MEDIUM
    category: identity
    resourceType: tailscale_user
    match:
        query: SELECT u.id AS id, u.display_name AS account_name FROM tailscale_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND COALESCE(TRIM(u.login_name), '') = ''
    remediation:
        summary: Populate a valid corporate email on the account or disable the account until ownership can be verified.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
