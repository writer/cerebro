apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-onelogin-never-logged-in-30d
    name: Onelogin Accounts Never Used After Provisioning
    description: Detects active onelogin accounts older than 30 days with no successful login recorded.
    tags:
        - onelogin
        - identity
        - stale-accounts
        - least-privilege
spec:
    severity: MEDIUM
    category: identity
    resourceType: onelogin_user
    match:
        query: SELECT u.id AS id, u.username AS account_name, u.created_at AS created_at FROM onelogin_users u WHERE COALESCE(u.status, 0) = 1 AND u.last_login IS NULL AND u.created_at < NOW() - INTERVAL '30 days'
    remediation:
        summary: Remove or disable unused accounts and confirm provisioning flows are not creating unnecessary access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
