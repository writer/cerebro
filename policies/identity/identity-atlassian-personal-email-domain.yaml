apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-atlassian-personal-email-domain
    name: Atlassian Accounts Using Personal Email Domains
    description: Detects active atlassian accounts using personal email domains instead of corporate identity domains.
    tags:
        - atlassian
        - identity
        - account-hygiene
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: atlassian_user
    match:
        query: SELECT u.account_id AS id, u.email_address AS email FROM atlassian_users u WHERE COALESCE(u.active, true) = true AND LOWER(COALESCE(u.email_address, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate account identities to corporate domains and disable personal-domain access where not explicitly approved.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
