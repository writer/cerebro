apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-risky-active-no-employee-record
    name: Entra Risky Users Active Accounts Without Employee Record
    description: Detects active Entra Risky Users accounts whose email does not match any employee record.
    tags:
        - entra-risky
        - identity
        - joiner-mover-leaver
        - access-review
spec:
    severity: MEDIUM
    category: identity
    resourceType: entra_risky_user
    match:
        query: SELECT u.id AS id, u.user_principal_name AS email FROM entra_risky_users u LEFT JOIN employees e ON LOWER(COALESCE(u.user_principal_name, '')) = LOWER(e.work_email) WHERE 1=1 AND COALESCE(TRIM(u.user_principal_name), '') != '' AND e.work_email IS NULL
    remediation:
        summary: Review unmatched accounts, classify approved non-employee identities, and disable unknown access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
