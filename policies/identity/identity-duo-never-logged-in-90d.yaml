apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-duo-never-logged-in-90d
    name: Duo Accounts Never Used (90 days)
    description: Detects active Duo accounts older than 90 days that have never logged in.
    tags:
        - duo
        - identity
        - least-privilege
        - stale-accounts
spec:
    severity: MEDIUM
    category: identity
    resourceType: duo_user
    match:
        query: SELECT u.id AS id, u.username AS account_name, u.created_at AS created_at FROM duo_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND u.last_login_at IS NULL AND u.created_at < NOW() - INTERVAL '90 days'
    remediation:
        summary: Remove or disable never-used accounts and fix any over-provisioning in onboarding workflows.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
