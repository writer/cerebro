apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-zoom-never-logged-in-30d
    name: Zoom Accounts Never Used After Provisioning
    description: Detects active zoom accounts older than 30 days with no successful login recorded.
    tags:
        - zoom
        - identity
        - stale-accounts
        - least-privilege
spec:
    severity: MEDIUM
    category: identity
    resourceType: zoom_user
    match:
        query: SELECT u.id AS id, u.first_name AS account_name, u.created_at AS created_at FROM zoom_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND u.last_login_time IS NULL AND u.created_at < NOW() - INTERVAL '30 days'
    remediation:
        summary: Remove or disable unused accounts and confirm provisioning flows are not creating unnecessary access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
