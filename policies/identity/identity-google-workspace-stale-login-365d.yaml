apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-stale-login-365d
    name: Google Workspace Stale Active Accounts (365 days)
    description: Detects active Google Workspace accounts with no login activity for at least 365 days.
    tags:
        - google-workspace
        - identity
        - stale-accounts
        - access-review
spec:
    severity: HIGH
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.last_login_time AS last_login FROM google_workspace_users u WHERE 1=1 AND (u.last_login_time IS NULL OR u.last_login_time < NOW() - INTERVAL '365 days')
    remediation:
        summary: Disable long-dormant accounts and require formal approval before any reactivation.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
