apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-personal-email-domain
    name: Github Accounts Using Personal Email Domains
    description: Detects active github accounts using personal email domains instead of corporate identity domains.
    tags:
        - github
        - identity
        - account-hygiene
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: github_organization_member
    match:
        query: SELECT u.id AS id, u.email AS email FROM github_organization_members u WHERE 1=1 AND LOWER(COALESCE(u.email, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate account identities to corporate domains and disable personal-domain access where not explicitly approved.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
