apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-privileged-stale-login-30d
    name: Okta Privileged Accounts Stale (30 days)
    description: Detects privileged okta accounts with stale login activity.
    tags:
        - okta
        - identity
        - privileged-access
        - stale-accounts
spec:
    severity: HIGH
    category: identity
    resourceType: okta_user
    match:
        query: SELECT u.id AS id, u.login AS account_name, u.last_login AS last_login FROM okta_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND (COALESCE(u.is_admin, false) = true) AND (u.last_login IS NULL OR u.last_login < CURRENT_TIMESTAMP() - INTERVAL '30 days')
    remediation:
        summary: Review privileged stale accounts immediately; remove excessive privileges or disable unused access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
