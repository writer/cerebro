apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-privileged-personal-email
    name: Entra Privileged Accounts on Personal Email Domains
    description: Detects privileged entra accounts tied to personal email domains.
    tags:
        - entra
        - identity
        - privileged-access
        - governance
spec:
    severity: HIGH
    category: identity
    resourceType: entra_user
    match:
        query: SELECT u.id AS id, u.mail AS email FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND (LOWER(COALESCE(u.user_type, '')) LIKE '%admin%' OR LOWER(COALESCE(u.user_type, '')) LIKE '%owner%' OR LOWER(COALESCE(u.user_type, '')) LIKE '%super%') AND LOWER(COALESCE(u.mail, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate privileged accounts to corporate identity domains and remove personal-domain privileged access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
