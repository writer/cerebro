apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-splunk-duplicate-email
    name: Splunk Duplicate Account Emails
    description: Detects duplicate active splunk accounts sharing the same email identity.
    tags:
        - splunk
        - identity
        - access-control
        - account-hygiene
spec:
    severity: HIGH
    category: identity
    resourceType: splunk_user
    match:
        query: SELECT LOWER(TRIM(u.email)) AS email, COUNT(*) AS account_count FROM splunk_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND COALESCE(TRIM(u.email), '') != '' GROUP BY LOWER(TRIM(u.email)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate identities and remove unintended duplicate access paths.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
