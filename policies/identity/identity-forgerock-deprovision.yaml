apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-forgerock-deprovision
    name: ForgeRock Accounts Deprovisioned on Termination
    description: Ensures ForgeRock access is revoked when personnel leave the company
    tags:
        - forgerock
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: forgerock_user
    match:
        query: SELECT f.id, f.username, f.email, e.termination_date FROM forgerock_users f JOIN employees e ON LOWER(f.email) = LOWER(e.work_email) WHERE e.status = 'terminated' AND COALESCE(f.active, true) = true
    remediation:
        summary: Disable or remove accounts for terminated employees within 24 hours. Automate offboarding workflows where possible.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
