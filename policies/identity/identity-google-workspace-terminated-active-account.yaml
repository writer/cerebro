apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-terminated-active-account
    name: Google Workspace Terminated Accounts Still Active
    description: Detects terminated employees that still have active access in google_workspace.
    tags:
        - google_workspace
        - identity
        - offboarding
        - access-control
spec:
    severity: HIGH
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.primary_email AS email, e.termination_date FROM google_workspace_users u JOIN employees e ON LOWER(COALESCE(u.primary_email, '')) = LOWER(e.work_email) WHERE e.status = 'terminated' AND 1=1
    remediation:
        summary: Disable or remove provider access for terminated employees within 24 hours and verify all active sessions are revoked.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
