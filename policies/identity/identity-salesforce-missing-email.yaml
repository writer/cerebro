apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-salesforce-missing-email
    name: Salesforce Active Accounts Missing Email
    description: Detects active salesforce accounts missing an email address for identity matching and offboarding controls.
    tags:
        - salesforce
        - identity
        - data-quality
        - account-hygiene
spec:
    severity: MEDIUM
    category: identity
    resourceType: salesforce_user
    match:
        query: SELECT u.id AS id, u.name AS account_name FROM salesforce_users u WHERE COALESCE(u.is_active, true) = true AND COALESCE(TRIM(u.email), '') = ''
    remediation:
        summary: Populate a valid corporate email on the account or disable the account until ownership can be verified.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
