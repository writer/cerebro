apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-oracle-idcs-orphaned-membership-user
    name: Oracle Idcs Group Memberships With Missing Users
    description: Detects orphaned oracle_idcs group memberships referencing users that no longer exist.
    tags:
        - oracle_idcs
        - identity
        - groups
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: oracle_idcs_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM oracle_idcs_group_memberships m LEFT JOIN oracle_idcs_users u ON m.user_id = u.id WHERE m.user_id IS NOT NULL AND u.id IS NULL
    remediation:
        summary: Remove orphaned memberships and reconcile group assignments from authoritative identity sources.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
