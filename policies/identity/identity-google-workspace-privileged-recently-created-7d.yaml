apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-privileged-recently-created-7d
    name: Google Workspace Newly Created Privileged Accounts
    description: Detects privileged Google Workspace accounts created in the last 7 days for expedited review.
    tags:
        - google-workspace
        - identity
        - privileged-access
        - change-control
spec:
    severity: MEDIUM
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.creation_time AS created_at FROM google_workspace_users u WHERE 1=1 AND (COALESCE(u.is_admin, false) = true) AND u.creation_time > NOW() - INTERVAL '7 days'
    remediation:
        summary: Confirm change tickets and owner approval for newly created privileged accounts.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
