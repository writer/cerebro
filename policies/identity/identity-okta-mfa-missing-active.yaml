apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-mfa-missing-active
    name: Okta Active Accounts Without MFA
    description: Detects active okta accounts that do not meet MFA requirements.
    tags:
        - okta
        - identity
        - mfa
        - authentication
spec:
    severity: HIGH
    category: identity
    resourceType: okta_user
    match:
        query: SELECT u.id AS id, u.login AS account_name FROM okta_users u WHERE LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded') AND COALESCE(u.mfa_enrolled, false) = false
    remediation:
        summary: Require MFA enrollment and enforcement for all active accounts.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
