apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-oracle-idcs-orphaned-membership-group
    name: Oracle Idcs Memberships With Missing Groups
    description: Detects orphaned oracle_idcs memberships referencing groups that no longer exist.
    tags:
        - oracle_idcs
        - identity
        - groups
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: oracle_idcs_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM oracle_idcs_group_memberships m LEFT JOIN oracle_idcs_groups g ON m.group_id = g.id WHERE m.group_id IS NOT NULL AND g.id IS NULL
    remediation:
        summary: Remove orphaned memberships and reconcile all references to deleted or migrated groups.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
