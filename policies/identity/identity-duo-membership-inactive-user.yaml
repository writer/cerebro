apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-duo-membership-inactive-user
    name: Duo Memberships With Inactive Users
    description: Detects Duo group memberships that still reference inactive users.
    tags:
        - duo
        - identity
        - groups
        - offboarding
spec:
    severity: MEDIUM
    category: identity
    resourceType: duo_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM duo_group_memberships m JOIN duo_users u ON m.user_id = u.id WHERE NOT (LOWER(COALESCE(u.status, '')) IN ('active','enabled','provisioned','onboarded'))
    remediation:
        summary: Remove inactive users from all groups and verify deprovisioning workflows are complete.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
