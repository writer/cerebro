apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-member-mfa
    name: GitHub Members Without MFA
    description: Detects active GitHub organization members that do not have MFA enabled
    tags:
        - github
        - identity
        - mfa
        - authentication
spec:
    severity: HIGH
    category: identity
    resourceType: github_organization_member
    match:
        query: SELECT id, login, email, role, org_membership_state FROM github_organization_members WHERE LOWER(COALESCE(org_membership_state, '')) = 'active' AND two_factor_enabled = false
    remediation:
        summary: Require MFA for all active GitHub organization members and remove access for users who cannot enroll.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
