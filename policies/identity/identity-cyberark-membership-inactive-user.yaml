apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-cyberark-membership-inactive-user
    name: Cyberark Memberships With Inactive Users
    description: Detects Cyberark group memberships that still reference inactive users.
    tags:
        - cyberark
        - identity
        - groups
        - offboarding
spec:
    severity: MEDIUM
    category: identity
    resourceType: cyberark_group_membership
    match:
        query: SELECT m.group_id, m.user_id FROM cyberark_group_memberships m JOIN cyberark_users u ON m.user_id = u.id WHERE NOT (COALESCE(u.active, true) = true)
    remediation:
        summary: Remove inactive users from all groups and verify deprovisioning workflows are complete.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
