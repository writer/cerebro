apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-privileged-no-mfa
    name: Entra Privileged Accounts Without MFA
    description: Detects privileged entra accounts missing MFA protections.
    tags:
        - entra
        - identity
        - mfa
        - privileged-access
spec:
    severity: HIGH
    category: identity
    resourceType: entra_user
    match:
        query: SELECT u.id AS id, u.display_name AS account_name FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND (LOWER(COALESCE(u.user_type, '')) LIKE '%admin%' OR LOWER(COALESCE(u.user_type, '')) LIKE '%owner%' OR LOWER(COALESCE(u.user_type, '')) LIKE '%super%') AND COALESCE(u.mfa_registered, false) = false
    remediation:
        summary: Immediately enforce MFA on privileged identities and suspend privileged actions until compliant.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
