apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-mfa-missing-active
    name: Github Active Accounts Without MFA
    description: Detects active github accounts that do not meet MFA requirements.
    tags:
        - github
        - identity
        - mfa
        - authentication
spec:
    severity: HIGH
    category: identity
    resourceType: github_organization_member
    match:
        query: SELECT u.id AS id, u.login AS account_name FROM github_organization_members u WHERE 1=1 AND COALESCE(u.two_factor_enabled, false) = false
    remediation:
        summary: Require MFA enrollment and enforcement for all active accounts.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
