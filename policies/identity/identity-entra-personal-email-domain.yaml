apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-entra-personal-email-domain
    name: Entra Accounts Using Personal Email Domains
    description: Detects active entra accounts using personal email domains instead of corporate identity domains.
    tags:
        - entra
        - identity
        - account-hygiene
        - governance
spec:
    severity: MEDIUM
    category: identity
    resourceType: entra_user
    match:
        query: SELECT u.id AS id, u.mail AS email FROM entra_users u WHERE COALESCE(u.account_enabled, true) = true AND LOWER(COALESCE(u.mail, '')) SIMILAR TO '%@(gmail|yahoo|hotmail|outlook)\\.com'
    remediation:
        summary: Migrate account identities to corporate domains and disable personal-domain access where not explicitly approved.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
