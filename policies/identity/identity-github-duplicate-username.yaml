apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-github-duplicate-username
    name: GitHub Duplicate Usernames
    description: Detects active GitHub identities sharing the same username/login.
    tags:
        - github
        - identity
        - account-hygiene
        - data-integrity
spec:
    severity: MEDIUM
    category: identity
    resourceType: github_organization_member
    match:
        query: SELECT LOWER(TRIM(u.login)) AS username, COUNT(*) AS account_count FROM github_organization_members u WHERE 1=1 AND COALESCE(TRIM(u.login), '') != '' GROUP BY LOWER(TRIM(u.login)) HAVING COUNT(*) > 1
    remediation:
        summary: Normalize account identifiers to unique usernames and remove duplicate access identities.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
