apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-google-workspace-privileged-stale-login-30d
    name: Google Workspace Privileged Accounts Stale (30 days)
    description: Detects privileged google_workspace accounts with stale login activity.
    tags:
        - google_workspace
        - identity
        - privileged-access
        - stale-accounts
spec:
    severity: HIGH
    category: identity
    resourceType: google_workspace_user
    match:
        query: SELECT u.id AS id, u.name AS account_name, u.last_login_time AS last_login FROM google_workspace_users u WHERE 1=1 AND (COALESCE(u.is_admin, false) = true) AND (u.last_login_time IS NULL OR u.last_login_time < NOW() - INTERVAL '30 days')
    remediation:
        summary: Review privileged stale accounts immediately; remove excessive privileges or disable unused access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
