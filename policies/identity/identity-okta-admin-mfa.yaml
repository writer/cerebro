apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-okta-admin-mfa
    name: Okta Admin Accounts Without MFA
    description: Detects active Okta admin users that are not enrolled in MFA
    tags:
        - okta
        - identity
        - mfa
        - admin
spec:
    severity: HIGH
    category: identity
    resourceType: okta_user
    match:
        query: SELECT id, login, email, status, is_admin, mfa_enrolled FROM okta_users WHERE LOWER(COALESCE(status, '')) = 'active' AND COALESCE(is_admin, false) = true AND COALESCE(mfa_enrolled, false) = false
    remediation:
        summary: Enroll all active Okta admins in MFA and block privileged access for non-compliant accounts.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.8.5
    enabled: true
