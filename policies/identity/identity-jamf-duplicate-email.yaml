apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: identity-jamf-duplicate-email
    name: Jamf Duplicate Account Emails
    description: Detects duplicate active jamf accounts sharing the same email identity.
    tags:
        - jamf
        - identity
        - access-control
        - account-hygiene
spec:
    severity: HIGH
    category: identity
    resourceType: jamf_user
    match:
        query: SELECT LOWER(TRIM(u.email)) AS email, COUNT(*) AS account_count FROM jamf_users u WHERE COALESCE(u.enabled, true) = true AND COALESCE(TRIM(u.email), '') != '' GROUP BY LOWER(TRIM(u.email)) HAVING COUNT(*) > 1
    remediation:
        summary: Consolidate duplicate identities and remove unintended duplicate access paths.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
    enabled: true
