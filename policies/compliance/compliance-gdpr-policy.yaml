apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: compliance-gdpr-policy
    name: GDPR Compliance Policy Exists
    description: Ensures the organization has an approved GDPR compliance policy
    tags:
        - compliance
        - gdpr
        - privacy
        - policy
spec:
    severity: HIGH
    category: compliance
    resourceType: policy_document
    match:
        query: SELECT id, policy_type, status, last_approved_date FROM policy_documents WHERE policy_type = 'gdpr_compliance' AND (status != 'approved' OR last_approved_date < NOW() - INTERVAL '365 days')
    remediation:
        summary: Create and approve a GDPR compliance policy. Review and update annually.
    frameworks:
        - name: GDPR
          controls:
            - Art.5
        - name: SOC 2
          controls:
            - CC1.1
    enabled: true
