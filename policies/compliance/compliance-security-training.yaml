apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: compliance-security-training
    name: Security Awareness Training Completed
    description: Ensures all employees have completed security awareness training
    tags:
        - compliance
        - training
        - security-awareness
        - annual
spec:
    severity: MEDIUM
    category: compliance
    resourceType: employee
    match:
        query: SELECT id, name, work_email, last_training_date FROM employees WHERE status = 'active' AND (last_training_date IS NULL OR last_training_date < NOW() - INTERVAL '365 days')
    remediation:
        summary: Assign and track completion of annual security awareness training for all employees.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.4
        - name: ISO 27001:2022
          controls:
            - A.6.3
        - name: NIST 800-53 r5
          controls:
            - AT-2
        - name: CIS Controls v8
          controls:
            - "14"
        - name: PCI DSS v4.0.1
          controls:
            - "12.6"
        - name: HIPAA
          controls:
            - "164.312"
    enabled: true
