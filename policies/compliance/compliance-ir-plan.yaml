apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: compliance-ir-plan-exists
    name: Incident Response Plan Exists
    description: The organization should have a documented incident response plan that is reviewed and approved annually
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - compliance
        - incident-response
        - documentation
spec:
    severity: high
    effect: forbid
    resource: compliance_documents
    match:
        conditions:
            - cmp_eq(path(resource, "document_type"), path(resource, "INCIDENT_RESPONSE_PLAN"))
            - cmp_ne(path(resource, "approved"), true)
        conditionFormat: cel
    remediation:
        summary: Create, review, and approve an incident response plan that covers detection, containment, eradication, recovery, and lessons learned
        steps:
            - Draft or update the incident response plan
            - Include roles, responsibilities, and escalation paths
            - Define incident classification and severity levels
            - Document communication and notification procedures
            - Get management approval and sign-off
            - Schedule annual review
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC7.3
            - CC7.4
            - CC7.5
        - name: ISO 27001:2022
          controls:
            - A.5.24
            - A.5.25
            - A.5.26
        - name: NIST 800-53 r5
          controls:
            - IR-1
            - IR-8
        - name: HIPAA
          controls:
            - 164.308(a)(6)
        - name: PCI DSS v4.0.1
          controls:
            - 12.10.1
