apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: compliance-inventory-owners
    name: Inventory Items Have Active Owners
    description: Ensures all infrastructure inventory items have assigned active owners for accountability
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - compliance
        - inventory
        - ownership
        - accountability
        - governance
spec:
    severity: medium
    effect: forbid
    resource: infrastructure_inventory
    match:
        conditions:
            - (!exists_path(resource, "owner_id")) || (cmp_eq(path(resource, "owner_status"), "inactive"))
        conditionFormat: cel
    remediation:
        summary: Assign active owners to all infrastructure resources. Update ownership when personnel changes occur.
        steps:
            - Identify resources without assigned owners
            - Determine appropriate owner based on team responsibility
            - Update resource metadata with owner information
            - Implement automated ownership assignment for new resources
            - Set up alerts for orphaned resources
    riskCategories:
        - OPERATIONAL_RISK
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.9
        - name: NIST 800-53 r5
          controls:
            - CM-8
