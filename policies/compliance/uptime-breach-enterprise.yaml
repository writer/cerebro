apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: uptime-breach-enterprise
    name: Enterprise Uptime SLA Breach
    description: Flags enterprise services whose 30-day uptime falls below contractual targets.
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - sla
        - uptime
        - operations
spec:
    severity: critical
    effect: forbid
    resource: service::uptime
    match:
        conditions:
            - cmp_eq(path(resource, "plan_tier"), "enterprise")
            - cmp_lt(path(resource, "uptime_pct_30d"), 99.9)
        conditionFormat: cel
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.2
        - name: Cerebro Operational Resilience
          controls:
            - OPS-2
