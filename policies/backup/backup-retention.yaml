apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: backup-retention
    name: Backup Retention Policy Compliance
    description: Ensures backups are retained according to data classification requirements
    tags:
        - backup
        - retention
        - compliance
        - data-lifecycle
spec:
    severity: MEDIUM
    category: backup
    resourceType: backup
    match:
        query: SELECT id, backup_name, target_system, retention_days, required_retention_days FROM backups WHERE retention_days < required_retention_days
    remediation:
        summary: Configure backup retention to meet data classification requirements. Ensure compliance with regulatory requirements.
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.8.13
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - CP-2
            - CP-4
            - CP-9
            - CP-10
        - name: CIS Controls v8
          controls:
            - "11"
        - name: HIPAA
          controls:
            - "164.312"
    enabled: true
