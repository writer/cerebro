apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: backup-offsite
    name: Offsite Backup Storage
    description: Ensures critical system backups are stored offsite or in a different region
    tags:
        - backup
        - offsite
        - disaster-recovery
        - bcdr
spec:
    severity: HIGH
    category: backup
    resourceType: backup
    match:
        query: SELECT id, backup_name, target_system, storage_location, primary_location FROM backups WHERE system_criticality = 'critical' AND storage_location = primary_location
    remediation:
        summary: Configure critical system backups to replicate to an offsite location or different geographic region.
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.8.13
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - CP-9
            - CP-2
            - CP-4
            - CP-10
        - name: CIS Controls v8
          controls:
            - "11"
    enabled: true
