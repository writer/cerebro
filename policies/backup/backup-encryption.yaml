apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: backup-encryption
    name: Backups Encrypted at Rest
    description: Ensures all backups are encrypted using strong cryptography
    tags:
        - backup
        - encryption
        - security
        - data-protection
spec:
    severity: HIGH
    category: backup
    resourceType: backup
    match:
        query: SELECT id, backup_name, target_system, encryption_enabled, encryption_algorithm FROM backups WHERE encryption_enabled = false OR encryption_algorithm IN ('DES', '3DES', 'RC4')
    remediation:
        summary: Enable encryption for all backups using AES-256 or stronger encryption algorithm.
    frameworks:
        - name: SOC 2
          controls:
            - C1.1
            - A1.1
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.8.24
            - A.8.13
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - SC-28
            - SC-12
            - SC-13
            - CP-2
            - CP-4
            - CP-9
            - CP-10
        - name: CIS Controls v8
          controls:
            - "3"
            - "11"
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
        - name: HIPAA
          controls:
            - "164.312"
    enabled: true
