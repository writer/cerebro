apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: backup-encryption
    name: Backups Encrypted at Rest
    description: Ensures all backups are encrypted using strong cryptography
    tags:
        - backup
        - encryption
        - security
        - data-protection
spec:
    severity: HIGH
    category: backup
    resourceType: backup
    match:
        query: SELECT id, backup_name, target_system, encryption_enabled, encryption_algorithm FROM backups WHERE encryption_enabled = false OR encryption_algorithm IN ('DES', '3DES', 'RC4')
    remediation:
        summary: Enable encryption for all backups using AES-256 or stronger encryption algorithm.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
        - name: HIPAA
          controls:
            - "164.312"
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: NIST 800-53 r5
          controls:
            - SC-28
    enabled: true
