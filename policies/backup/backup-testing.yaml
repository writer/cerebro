apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: backup-testing
    name: Backup Restoration Testing
    description: Ensures backup restoration is tested at least quarterly
    tags:
        - backup
        - testing
        - recovery
        - bcdr
spec:
    severity: HIGH
    category: backup
    resourceType: backup
    match:
        query: SELECT id, backup_name, target_system, last_restore_test FROM backups WHERE last_restore_test IS NULL OR last_restore_test < NOW() - INTERVAL '90 days'
    remediation:
        summary: Test backup restoration at least quarterly. Document results and time to restore.
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.8.13
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - CP-4
            - CP-10
            - CP-2
            - CP-9
        - name: CIS Controls v8
          controls:
            - "11"
    enabled: true
