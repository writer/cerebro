apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: ai-rag-vector-index-access-control
    name: AI Rag Vector Index Access Control
    description: "AI Rag Vector Index Access Control policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - rag
        - vector
        - access-control
        - generated
spec:
    severity: medium
    effect: forbid
    resource: "ai::vector_index"
    match:
        conditions:
            - "cmp_ne(path(resource, \"rag_vector_index_access_control_compliant\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore rag vector index access control controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - MODEL_RISK
        - DATA_EXPOSURE
        - GOVERNANCE
    frameworks:
        - name: ISO 42001
          controls:
            - A.2.2
            - A.6.2.4
            - A.8.2
            - A.9.2
        - name: EU AI Act
          controls:
            - Art.13
            - Art.14
        - name: SOC 2
          controls:
            - CC3.2
            - CC7.2
