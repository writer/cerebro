apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: ai-human-oversight
    name: AI High-Risk Decisions Human Oversight
    description: Ensures high-risk AI decisions have human oversight mechanisms (ISO 42001, EU AI Act)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - ml
        - human-oversight
        - high-risk
        - iso42001
spec:
    severity: high
    effect: forbid
    resource: ai_models
    match:
        conditions:
            - cmp_eq(path(resource, "risk_level"), "high")
            - cmp_eq(path(resource, "human_oversight_enabled"), false)
        conditionFormat: cel
    remediation:
        summary: Implement human oversight mechanisms for high-risk AI systems. Enable human review before consequential decisions.
    frameworks:
        - name: ISO 42001
          controls:
            - "6.2"
            - "9.1"
        - name: EU AI Act
          controls:
            - Art.14
