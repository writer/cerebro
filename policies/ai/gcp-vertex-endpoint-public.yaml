apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-vertex-ai-public-endpoint
    name: GCP Vertex AI Public Endpoint
    description: Vertex AI endpoint is publicly accessible without VPC restrictions
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - vertex-ai
        - gcp
        - public-access
        - network
spec:
    severity: high
    effect: forbid
    resource: gcp::aiplatform::endpoint
    match:
        conditions:
            - cmp_eq(path(resource, "network"), null)
            - cmp_eq(path(resource, "private_service_connect_config"), null)
        conditionFormat: cel
    remediation:
        summary: Configure VPC peering or Private Service Connect for the Vertex AI endpoint.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
