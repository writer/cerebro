apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-openai-public-network
    name: Azure OpenAI Public Network Access
    description: Azure OpenAI service allows public network access
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - azure-openai
        - azure
        - public-access
        - network
spec:
    severity: high
    effect: forbid
    resource: azure::cognitive_services::account
    match:
        conditions:
            - cmp_eq(path(resource, "kind"), "OpenAI")
            - cmp_eq(path(resource, "public_network_access"), "Enabled")
        conditionFormat: cel
    remediation:
        summary: Disable public network access and use private endpoints.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
