apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: ai-bias-testing
    name: AI Model Bias Testing Performed
    description: Ensures AI models are tested for bias and fairness before deployment (ISO 42001)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - ml
        - bias
        - fairness
        - iso42001
spec:
    severity: high
    effect: forbid
    resource: ai_models
    match:
        conditions:
            - in_list(path(resource, "model_type"), ["classification","recommendation","scoring"])
            - (!exists_path(resource, "last_bias_test")) || (cmp_lt(path(resource, "last_bias_test"), "NOW() - INTERVAL '180 days'"))
        conditionFormat: cel
    remediation:
        summary: Perform bias testing on AI models that make decisions affecting individuals. Document testing methodology and results.
    frameworks:
        - name: ISO 42001
          controls:
            - "6.1"
            - "9.2"
        - name: SOC 2
          controls:
            - CC1.4
