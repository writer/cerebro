apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-sagemaker-model-artifact-public
    name: AWS SageMaker Model Artifact Public
    description: SageMaker model artifact stored in publicly accessible S3 bucket
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - sagemaker
        - model-artifact
        - ip-theft
        - data-exposure
spec:
    severity: critical
    effect: forbid
    resource: aws::sagemaker::model
    match:
        conditions:
            - references_public_bucket(resource, "primary_container.model_data_url")
        conditionFormat: cel
    remediation:
        summary: Move model artifacts to private S3 bucket with encryption.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
