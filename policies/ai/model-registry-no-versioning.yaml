apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: ml-model-registry-no-versioning
    name: ML Model Registry No Versioning
    description: ML model registry does not enforce version control and audit trail
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - model-registry
        - governance
        - audit-trail
spec:
    severity: medium
    effect: forbid
    resource: aws::sagemaker::model_package_group
    match:
        conditions:
            - (cmp_ne(path(resource, "model_package_group_status"), "Pending")) || (cmp_ne(path(resource, "model_package_group_status"), "Completed"))
            - cmp_eq(path(resource, "model_approval_status"), "PendingManualApproval")
        conditionFormat: cel
    remediation:
        summary: Implement model approval workflow and version control.
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
        - name: SOC 2
          controls:
            - CC4
            - CC7
        - name: CIS Controls v8
          controls:
            - "8"
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
