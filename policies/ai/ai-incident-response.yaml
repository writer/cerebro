apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: ai-incident-response
    name: AI Incident Response Plan
    description: Ensures AI systems have documented incident response procedures (ISO 42001)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - ml
        - incident-response
        - iso42001
spec:
    severity: high
    effect: forbid
    resource: ai_models
    match:
        conditions:
            - cmp_eq(path(resource, "environment"), "production")
            - (!exists_path(resource, "incident_response_plan")) || (cmp_eq(path(resource, "incident_response_plan"), ""))
        conditionFormat: cel
    remediation:
        summary: Create incident response plan for AI systems covering model failures, biased outputs, and security incidents.
    frameworks:
        - name: ISO 42001
          controls:
            - "10.1"
            - "10.2"
        - name: SOC 2
          controls:
            - CC7.4
