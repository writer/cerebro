apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-bedrock-custom-model-public
    name: AWS Bedrock Custom Model Public Access
    description: Bedrock custom model training data stored in publicly accessible S3 bucket
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - ai
        - bedrock
        - training-data
        - data-exposure
        - model-security
spec:
    severity: critical
    effect: forbid
    resource: aws::bedrock::custom_model
    match:
        conditions:
            - references_public_bucket(resource, "training_data_config.s3_uri")
        conditionFormat: cel
    remediation:
        summary: Ensure training data S3 bucket has public access blocked.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
