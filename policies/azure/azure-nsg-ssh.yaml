apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-nsg-restrict-ssh
    name: NSG SSH Restriction
    description: Network Security Groups should not allow unrestricted SSH access from the internet
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-azure-6.1
        - nsg
        - network
        - ssh
spec:
    severity: high
    effect: forbid
    resource: azure::network::security_group
    match:
        conditions:
            - cmp_eq(path(resource, "security_rules.destination_port_range"), "22")
            - cmp_eq(path(resource, "security_rules.source_address_prefix"), "*")
            - cmp_eq(path(resource, "security_rules.access"), "Allow")
        conditionFormat: cel
    remediation:
        summary: Restrict SSH access to specific IP ranges. Use Azure Bastion for secure remote access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
