apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-appservice-https
    name: App Service HTTPS Only Not Enabled
    description: Azure App Service does not enforce HTTPS-only connections
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - app-service
        - encryption
        - transport-security
spec:
    severity: medium
    effect: forbid
    resource: azure::app_service::web_app
    match:
        conditions:
            - cmp_ne(path(resource, "https_only"), true)
        conditionFormat: cel
    remediation:
        summary: Enable 'HTTPS Only' in App Service configuration. This redirects all HTTP traffic to HTTPS.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
        - name: CIS Controls v8
          controls:
            - "3"
