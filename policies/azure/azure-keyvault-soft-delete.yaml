apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-keyvault-soft-delete-enabled
    name: Key Vault Soft Delete
    description: Azure Key Vault should have soft delete enabled to protect against accidental deletion
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-azure-8.4
        - keyvault
        - secrets
        - data-protection
spec:
    severity: medium
    effect: forbid
    resource: azure::keyvault::vault
    match:
        conditions:
            - cmp_ne(path(resource, "properties.enable_soft_delete"), true)
        conditionFormat: cel
    remediation:
        summary: Enable soft delete on Key Vault to allow recovery of deleted secrets, keys, and certificates.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
        - tactic: Collection
          technique: T1530
