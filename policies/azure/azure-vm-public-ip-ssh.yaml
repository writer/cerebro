apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-vm-public-ip-ssh
    name: Azure VM Public IP with SSH Exposed
    description: Azure VM has public IP with SSH port 22 allowed from Any source in NSG
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-azure-6.1
        - exposure
        - vm
        - network
        - ssh
spec:
    severity: critical
    effect: forbid
    resource: azure::compute::virtual_machine
    match:
        conditions:
            - cmp_ne(path(resource, "public_ip_address"), null)
            - cmp_eq(path(resource, "network_security_group.rules.destination_port"), "22")
            - cmp_eq(path(resource, "network_security_group.rules.source_address_prefix"), "*")
            - cmp_eq(path(resource, "network_security_group.rules.access"), "Allow")
        conditionFormat: cel
    remediation:
        summary: Remove public IP or restrict NSG rules to specific IP ranges. Use Azure Bastion for secure access.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
