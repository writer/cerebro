apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-cosmosdb-public
    name: CosmosDB Public Network Access Enabled
    description: Azure CosmosDB account allows access from public networks
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - cosmosdb
        - network-exposure
        - data-protection
spec:
    severity: high
    effect: forbid
    resource: azure::cosmosdb::account
    match:
        conditions:
            - cmp_eq(path(resource, "public_network_access"), "Enabled")
            - cmp_ne(path(resource, "is_virtual_network_filter_enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Disable public network access or configure virtual network service endpoints. Use private endpoints for secure access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
