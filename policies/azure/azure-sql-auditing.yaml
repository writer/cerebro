apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-sql-auditing-enabled
    name: SQL Database Auditing
    description: Azure SQL Database should have auditing enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-azure-4.1.1
        - sql
        - database
        - audit
        - logging
spec:
    severity: medium
    effect: forbid
    resource: azure::sql::database
    match:
        conditions:
            - cmp_ne(path(resource, "auditing_state"), "Enabled")
        conditionFormat: cel
    remediation:
        summary: Enable auditing on Azure SQL Database. Configure retention and destination (Storage Account, Log Analytics, or Event Hub).
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
        - name: SOC 2
          controls:
            - CC4
            - CC7
        - name: CIS Controls v8
          controls:
            - "8"
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
        - tactic: Collection
          technique: T1530
