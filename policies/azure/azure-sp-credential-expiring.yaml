apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-sp-credential-expiring
    name: Azure Service Principal Credential Expiring
    description: Azure service principal has credentials expiring within 30 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure-ad
        - service-principal
        - credentials
        - rotation
spec:
    severity: medium
    effect: forbid
    resource: azure::ad::service_principal
    match:
        conditions:
            - cmp_lt(path(resource, "password_credentials.end_date_time_days"), 30)
        conditionFormat: cel
    remediation:
        summary: Rotate service principal credentials before expiration to prevent service disruption.
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Credential Access
          technique: T1552
