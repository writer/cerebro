apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-storage-blob-public-access-disabled
    name: Azure Storage Blob Public Access Disabled
    description: Storage accounts should have blob public access disabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-azure-3.7
        - storage
        - data-exposure
        - public-access
spec:
    severity: high
    effect: forbid
    resource: azure::storage::account
    match:
        conditions:
            - cmp_eq(path(resource, "allow_blob_public_access"), true)
        conditionFormat: cel
    remediation:
        summary: Disable blob public access at the storage account level.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Defense Evasion
          technique: T1562
        - tactic: Collection
          technique: T1530
