apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-function-public
    name: Azure Function App Publicly Accessible
    description: Azure Function App allows anonymous access without authentication
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - functions
        - serverless
        - authentication
spec:
    severity: medium
    effect: forbid
    resource: azure::functionapp::function
    match:
        conditions:
            - cmp_eq(path(resource, "auth_level"), "anonymous")
            - (cmp_eq(path(resource, "site_config.http20_enabled"), true)) || (cmp_eq(path(resource, "http_trigger"), true))
        conditionFormat: cel
    remediation:
        summary: Configure authentication for the Function App. Use function keys or Azure AD authentication. Restrict network access using Private Endpoints or IP restrictions.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "7.2"
        - name: CIS Controls v8
          controls:
            - "6"
            - "5"
        - name: SOC 2
          controls:
            - CC6
    mitreAttack:
        - tactic: Execution
          technique: T1059
