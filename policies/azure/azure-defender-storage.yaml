apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-defender-storage
    name: Microsoft Defender for Storage Disabled
    description: Microsoft Defender for Storage is not enabled on the storage account
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - storage
        - defender
        - threat-detection
spec:
    severity: medium
    effect: forbid
    resource: azure::storage::account
    match:
        conditions:
            - cmp_ne(path(resource, "defender_for_storage_enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable Microsoft Defender for Storage in Security Center. This provides threat detection for storage accounts.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
            - CC7.2
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.5.24
            - A.5.25
            - A.8.16
        - name: NIST 800-53 r5
          controls:
            - IR-4
            - SI-4
        - name: CIS Controls v8
          controls:
            - "8"
    mitreAttack:
        - tactic: Collection
          technique: T1530
