apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-keyvault-key-expiry-set
    name: Azure Key Vault Key Expiry Set
    description: Azure Key Vault keys should have expiration dates set
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-azure-8.1
        - keyvault
        - keys
        - rotation
spec:
    severity: medium
    effect: forbid
    resource: azure::keyvault::key
    match:
        conditions:
            - cmp_eq(path(resource, "attributes.expires"), null)
        conditionFormat: cel
    remediation:
        summary: Set an expiration date on the key to enforce rotation.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
