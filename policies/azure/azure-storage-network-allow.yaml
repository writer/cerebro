apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-storage-network-allow
    name: Azure Storage Network Default Allow
    description: Storage account network rules default to allowing access from all networks
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - storage
        - network
        - zero-trust
        - cis-azure-3.7
spec:
    severity: medium
    effect: forbid
    resource: azure::storage::account
    match:
        conditions:
            - cmp_eq(path(resource, "network_rule_set.default_action"), "Allow")
        conditionFormat: cel
    remediation:
        summary: Set network default action to Deny. Add specific virtual network rules or IP rules for required access. Use Private Endpoints for secure access from VNets.
    riskCategories:
        - LATERAL_MOVEMENT
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Lateral Movement
          technique: T1021
        - tactic: Collection
          technique: T1530
