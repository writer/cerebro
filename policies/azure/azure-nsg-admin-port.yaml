apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-nsg-admin-port
    name: NSG Allows Admin Ports from Internet
    description: Network Security Group allows SSH (22) or RDP (3389) access from any source (Internet)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - nsg
        - network
        - admin-access
        - cis-azure-6.1
spec:
    severity: high
    effect: forbid
    resource: azure::network::security_group
    match:
        conditions:
            - list_value(path(resource, "security_rules")).exists(item, (cmp_eq(path(item, "direction"), "Inbound")) && (cmp_eq(path(item, "access"), "Allow")) && (in_list(path(item, "source_address_prefix"), ["*","Internet","0.0.0.0/0"])) && (in_list(path(item, "destination_port_range"), ["22","3389","*"])))
        conditionFormat: cel
    remediation:
        summary: Restrict source addresses to specific IPs or ranges. Use Azure Bastion for secure RDP/SSH access. Implement Just-in-Time VM access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Privilege Escalation
          technique: T1078
