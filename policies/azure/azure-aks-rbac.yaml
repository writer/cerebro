apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-aks-rbac-enabled
    name: Azure AKS RBAC Enabled
    description: AKS clusters should have Kubernetes RBAC enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-aks-5.1.1
        - aks
        - kubernetes
        - rbac
spec:
    severity: high
    effect: forbid
    resource: azure::containerservice::managed_cluster
    match:
        conditions:
            - cmp_ne(path(resource, "enable_rbac"), true)
        conditionFormat: cel
    remediation:
        summary: Enable Kubernetes RBAC when creating the cluster (cannot be changed after).
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS Benchmarks
          controls:
            - 5.1.1
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
