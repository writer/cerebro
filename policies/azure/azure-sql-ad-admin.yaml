apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-sql-azure-ad-admin
    name: Azure SQL Azure AD Admin
    description: Azure SQL servers should have an Azure AD administrator configured
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-azure-4.4
        - sql
        - database
        - authentication
spec:
    severity: medium
    effect: forbid
    resource: azure::sql::server
    match:
        conditions:
            - cmp_eq(path(resource, "azure_ad_administrator"), null)
        conditionFormat: cel
    remediation:
        summary: Configure an Azure AD administrator for the SQL server.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - MISCONFIGURATION
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
        - name: CIS Controls v8
          controls:
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Collection
          technique: T1530
