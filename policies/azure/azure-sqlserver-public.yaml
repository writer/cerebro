apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-sqlserver-public
    name: Azure SQL Server Allows All Azure IPs
    description: Azure SQL Server firewall allows connections from all Azure services (0.0.0.0)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - sql
        - database
        - network-exposure
spec:
    severity: high
    effect: forbid
    resource: azure::sql::server
    match:
        conditions:
            - list_value(path(resource, "firewall_rules")).exists(item, (cmp_eq(path(item, "start_ip_address"), "0.0.0.0")) && (cmp_eq(path(item, "end_ip_address"), "0.0.0.0")))
        conditionFormat: cel
    remediation:
        summary: Remove the 'Allow Azure services' firewall rule. Use Private Endpoints for secure access. Add specific IP ranges for required services.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
