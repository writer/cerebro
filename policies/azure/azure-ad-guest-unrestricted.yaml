apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-ad-guest-access-restricted
    name: Azure AD Guest Access Restricted
    description: Azure AD should restrict guest user access to directory objects
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-azure-1.3
        - azure-ad
        - guest
        - access-control
spec:
    severity: medium
    effect: forbid
    resource: azure::ad::authorization_policy
    match:
        conditions:
            - cmp_eq(path(resource, "guest_user_role_id"), "a0b1b346-4d3e-4e8b-98f8-753987be4970")
        conditionFormat: cel
    remediation:
        summary: Restrict guest user access in Azure AD external collaboration settings.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
