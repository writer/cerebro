apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-vm-unmanaged-disk
    name: Azure VM Using Unmanaged Disks
    description: Azure VM is using unmanaged disks stored in storage accounts instead of Managed Disks
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - compute
        - storage
        - best-practice
spec:
    severity: medium
    effect: forbid
    resource: azure::compute::virtual_machine
    match:
        conditions:
            - cmp_eq(path(resource, "storage_profile.os_disk.managed_disk"), null)
        conditionFormat: cel
    remediation:
        summary: Convert unmanaged disks to Managed Disks. Managed Disks provide better reliability, encryption options, and RBAC integration.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.7
        - name: ISO 27001:2022
          controls:
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-28
        - name: CIS Controls v8
          controls:
            - "3"
    mitreAttack:
        - tactic: Collection
          technique: T1530
