apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-storage-secrets-artifact
    name: Azure Storage Contains Credential Artifacts
    description: Azure Storage blob contains potential credentials, private keys, or sensitive configuration files
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - azure
        - storage
        - secrets
        - data-exposure
        - cwe-312
spec:
    severity: high
    effect: forbid
    resource: azure::storage::blob
    match:
        conditions:
            - matches_value(path(resource, "name"), "(?i).*\\.(pem|key|pfx|p12|env|credentials|secret|htpasswd)$")
            - matches_value(path(resource, "name"), "(?i).*(password|secret|api.?key|private.?key|connection.?string).*")
        conditionFormat: cel
    remediation:
        summary: Move secrets to Azure Key Vault. Remove credential files from blob storage. Enable soft delete for recovery. Audit access logs for potential exposure.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
            - C1.1
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Initial Access
          technique: T1078
        - tactic: Credential Access
          technique: T1552
        - tactic: Collection
          technique: T1530
