apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        bypass_actor_added: "true"
        resource_type: repository_ruleset
      wantFinding: true
    - name: non-matching resource passes
      resource:
        bypass_actor_added: "true"
        resource_type: repository_ruleset-passing
      wantFinding: false
