apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-secret-scanning-alert
  name: GitHub Secret Scanning Alert
  description: Repository has exposed secret detected by GitHub secret scanning
  lastModified: '0001-01-01T00:00:00Z'
  tags:
  - devsecops
  - secrets
  - credentials
  - data-exposure
spec:
  severity: critical
  effect: forbid
  resource: github.secret_scanning_alert
  match:
    conditions:
    - cmp_eq(path(resource, "state"), "open")
    conditionFormat: cel
  remediation:
    summary: Rotate the exposed secret immediately and update all systems using it.
  riskCategories:
  - EXTERNAL_EXPOSURE
  - UNPROTECTED_DATA
  frameworks:
  - name: NIST 800-53 r5
    controls:
    - AC-3
    - SC-7
    - IA-5
    - SC-12
  - name: PCI DSS v4.0.1
    controls:
    - '1.3'
    - '1.4'
    - '3.5'
    - '8.6'
  - name: SOC 2
    controls:
    - CC6.1
    - CC6.6
    - C1.1
  - name: CIS Controls v8
    controls:
    - '12'
    - '13'
  mitreAttack:
  - tactic: Initial Access
    technique: T1190
  - tactic: Initial Access
    technique: T1078
  - tactic: Credential Access
    technique: T1552
  - tactic: Collection
    technique: T1530
