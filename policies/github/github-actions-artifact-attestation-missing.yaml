apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: github-actions-artifact-attestation-missing
    name: Github Actions Artifact Attestation Missing
    description: "Github Actions Artifact Attestation Missing policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - github
        - actions
        - attestation
        - generated
spec:
    severity: medium
    effect: forbid
    resource: "github::workflow"
    match:
        conditions:
            - "cmp_eq(path(resource, \"actions_artifact_attestation_missing\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore actions artifact attestation missing controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - SUPPLY_CHAIN
        - CHANGE_CONTROL
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC7.1
            - CC8.1
        - name: "ISO 27001:2022"
          controls:
            - A.5.15
            - A.8.8
            - A.8.25
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SA-10
            - SR-4
