apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        actor_is_agent: "true"
        credential_type: automation_actor
      wantFinding: true
    - name: non-matching resource passes
      resource:
        actor_is_agent: "true"
        credential_type: automation_actor-passing
      wantFinding: false
