apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: github-repo-secrets-exposure
    name: GitHub Repository Secrets in Workflow Logs
    description: Repository workflow may expose secrets in logs through echo or debug statements
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - github
        - actions
        - secrets
        - logging
spec:
    severity: high
    effect: forbid
    resource: github::workflow
    match:
        conditions:
            - (matches_value(path(resource, "content"), "echo.*\\$\\{\\{.*secrets\\.")) || (matches_value(path(resource, "content"), "print.*secrets\\.")) || (contains_value(path(resource, "content"), "::debug::"))
        conditionFormat: cel
    remediation:
        summary: Remove debug statements that expose secrets. Use GitHub's secret masking. Never echo secrets directly. Use ACTIONS_STEP_DEBUG only in private repos.
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AU-2
            - AU-12
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "10.2"
            - "10.3"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC4
            - CC7
        - name: CIS Controls v8
          controls:
            - "8"
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
        - tactic: Credential Access
          technique: T1552
