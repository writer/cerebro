apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-secops-secret-anthropic-admin-api-key-resolution-false-positive
  name: GitHub Secret Scanning Anthropic Admin Api Key Resolution False Positive
  description: Resolved GitHub secret scanning alerts for anthropic_admin_api_key with false_positive resolution require review because credential exposure may remain accepted rather than remediated.
  lastModified: '2026-06-19T00:00:00Z'
  tags:
  - github
  - secops
  - generated
  - graph-backed
  - secret-scanning
  - resolution
  - exception
  - anthropic_admin_api_key
  - false_positive
spec:
  severity: medium
  effect: forbid
  resource: github.secret_scanning_alert
  input:
    sourceKinds:
    - github
    eventKinds:
    - github.secret_scanning_alert
    requiredFields:
    - alert_number
    - state
    - secret_type
    - resolution
    - repository
    freshnessSLA: 12h
  match:
    conditions:
    - cmp_eq(path(resource, "state"), "resolved")
    - cmp_eq(path(resource, "secret_type"), "anthropic_admin_api_key")
    - cmp_eq(path(resource, "resolution"), "false_positive")
    conditionFormat: cel
  assert:
    all:
    - field: alert_number
      op: exists
    - field: state
      op: exists
    - field: secret_type
      op: exists
    - field: resolution
      op: exists
  context:
    graph:
      anchors:
      - resource_urn
      - tenant_id
      enrich:
      - repository
      - secret_type
      - resolver
      - push_protection_bypasser
    severityAdjustments:
    - when: path(resource, "visibility") == "public"
      delta: "+1"
    - when: context.crown_jewel_distance <= 2
      set: critical
  evidence:
    type: github_secret_scanning_resolution
    assessmentMethods:
    - examine
    - test
    requiredForAudit: true
    freshnessSLA: 12h
    acceptableSources:
    - github
    requiredFields:
    - alert_number
    - state
    - secret_type
    - resolution
    - repository
    fingerprintFields:
    - tenant_id
    - policy_id
    - resource_urn
    - alert_number
    - repository
  audit:
    evidenceType: github_secret_scanning_resolution
    assessmentMethods:
    - examine
    - test
    freshnessSLA: 12h
    auditorStatement: Secret scanning resolution evidence is projected on the GitHub secret scanning alert asset.
    auditorGuidance: Review the GitHub graph entity, the source event kind, and the required evidence fields before accepting or suppressing this policy result.
    riskStatement: Resolved GitHub secret scanning alerts for anthropic_admin_api_key with false_positive resolution require review because credential exposure may remain accepted rather than remediated.
    remediationIntent: Review the false_positive resolution for the anthropic_admin_api_key alert.
    acceptableEvidence:
    - source: github
      fields:
      - alert_number
      - state
      - secret_type
      - resolution
      - repository
    exceptionPolicy:
      maxAge: 14d
      requiresApproval: true
    exceptionGuidance:
    - Document the repository, organization, app, runner, or credential owner.
    - Record the compensating control and the planned date for returning to the secure state.
    falsePositives:
    - Provider preview fields may be absent from older GitHub Enterprise versions.
    - Short-lived migration windows may produce transient audit evidence before the next source sync.
  verification:
    fixtures:
    - name: github-secops-secret-anthropic-admin-api-key-resolution-false-positive-finding
      expect: finding
      description: Required GitHub evidence matches the failing condition.
    - name: github-secops-secret-anthropic-admin-api-key-resolution-false-positive-pass
      expect: pass
      description: The projected graph asset returns to the expected secure state.
    mutationChecks:
    - missing_required_field
    - stale_evidence
    - control_value_inverted
    remediationCheck:
      rerunAfter: source_sync
      expectedStatus: pass
  actions:
    owner:
      from: graph.owner
      fallback: security.platform
    remediation:
      type: manual
      steps:
      - Review the false_positive resolution for the anthropic_admin_api_key alert.
      - Confirm the credential is revoked, rotated, or covered by an approved compensating control.
      - Update the resolution or exception record and rerun secret scanning ingestion.
    effort: low
    blastRadius:
      estimateFrom: graph.neighborhood
    verification:
      rerunPolicy: true
  remediation:
    summary: Review the false_positive resolution for the anthropic_admin_api_key alert.
    steps:
    - Review the false_positive resolution for the anthropic_admin_api_key alert.
    - Confirm the credential is revoked, rotated, or covered by an approved compensating control.
    - Update the resolution or exception record and rerun secret scanning ingestion.
  riskCategories:
  - SECRET_EXPOSURE
  - UNPROTECTED_DATA
  frameworks:
  - name: SOC 2
    controls:
    - CC7.1
    - CC8.1
  - name: ISO 27001:2022
    controls:
    - A.8.8
    - A.8.15
  - name: NIST 800-53 r5
    controls:
    - AU-2
    - AU-6
    - SI-2
