apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-secops-secret-pypi-upload-token-open
  name: GitHub Secret Scanning Pypi Upload Token Alert Open
  description: Open GitHub secret scanning alerts for pypi_upload_token should be treated as active credential exposure until revoked or resolved.
  lastModified: '2026-06-19T00:00:00Z'
  tags:
  - github
  - secops
  - generated
  - graph-backed
  - secret-scanning
  - secret
  - pypi_upload_token
spec:
  severity: high
  effect: forbid
  resource: github.secret_scanning_alert
  input:
    sourceKinds:
    - github
    eventKinds:
    - github.secret_scanning_alert
    requiredFields:
    - alert_number
    - state
    - secret_type
    - repository
    - push_protection_bypassed
    freshnessSLA: 12h
  match:
    conditions:
    - cmp_eq(path(resource, "state"), "open")
    - cmp_eq(path(resource, "secret_type"), "pypi_upload_token")
    conditionFormat: cel
  assert:
    all:
    - field: alert_number
      op: exists
    - field: state
      op: exists
    - field: secret_type
      op: exists
    - field: repository
      op: exists
  context:
    graph:
      anchors:
      - resource_urn
      - tenant_id
      enrich:
      - repository
      - secret_type
      - resolver
      - push_protection_bypasser
    severityAdjustments:
    - when: path(resource, "visibility") == "public"
      delta: "+1"
    - when: context.crown_jewel_distance <= 2
      set: critical
  evidence:
    type: github_secret_scanning_alert
    assessmentMethods:
    - examine
    - test
    requiredForAudit: true
    freshnessSLA: 12h
    acceptableSources:
    - github
    requiredFields:
    - alert_number
    - state
    - secret_type
    - repository
    - push_protection_bypassed
    fingerprintFields:
    - tenant_id
    - policy_id
    - resource_urn
    - alert_number
    - repository
  audit:
    evidenceType: github_secret_scanning_alert
    assessmentMethods:
    - examine
    - test
    freshnessSLA: 12h
    auditorStatement: Secret scanning alerts are projected as first-class GitHub secret assets linked to repositories and resolver actors.
    auditorGuidance: Review the GitHub graph entity, the source event kind, and the required evidence fields before accepting or suppressing this policy result.
    riskStatement: Open GitHub secret scanning alerts for pypi_upload_token should be treated as active credential exposure until revoked or resolved.
    remediationIntent: Revoke or rotate the exposed pypi_upload_token credential.
    acceptableEvidence:
    - source: github
      fields:
      - alert_number
      - state
      - secret_type
      - repository
      - push_protection_bypassed
    exceptionPolicy:
      maxAge: 14d
      requiresApproval: true
    exceptionGuidance:
    - Document the repository, organization, app, runner, or credential owner.
    - Record the compensating control and the planned date for returning to the secure state.
    falsePositives:
    - Provider preview fields may be absent from older GitHub Enterprise versions.
    - Short-lived migration windows may produce transient audit evidence before the next source sync.
  verification:
    fixtures:
    - name: github-secops-secret-pypi-upload-token-open-finding
      expect: finding
      description: Required GitHub evidence matches the failing condition.
    - name: github-secops-secret-pypi-upload-token-open-pass
      expect: pass
      description: The projected graph asset returns to the expected secure state.
    mutationChecks:
    - missing_required_field
    - stale_evidence
    - control_value_inverted
    remediationCheck:
      rerunAfter: source_sync
      expectedStatus: pass
  actions:
    owner:
      from: graph.owner
      fallback: security.platform
    remediation:
      type: manual
      steps:
      - Revoke or rotate the exposed pypi_upload_token credential.
      - Remove the secret from source history where required.
      - Rerun secret scanning ingestion and confirm the alert is resolved.
    effort: medium
    blastRadius:
      estimateFrom: graph.neighborhood
    verification:
      rerunPolicy: true
  remediation:
    summary: Revoke or rotate the exposed pypi_upload_token credential.
    steps:
    - Revoke or rotate the exposed pypi_upload_token credential.
    - Remove the secret from source history where required.
    - Rerun secret scanning ingestion and confirm the alert is resolved.
  riskCategories:
  - SECRET_EXPOSURE
  - UNPROTECTED_DATA
  frameworks:
  - name: SOC 2
    controls:
    - CC7.1
    - CC8.1
  - name: ISO 27001:2022
    controls:
    - A.8.8
    - A.8.15
  - name: NIST 800-53 r5
    controls:
    - AU-2
    - AU-6
    - SI-2
