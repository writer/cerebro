apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-repo-branch-protection
  name: GitHub Repository Branch Protection
  description: GitHub repository default branch lacks branch protection rules
  lastModified: '0001-01-01T00:00:00Z'
  tags:
  - devsecops
  - github
  - branch-protection
  - cis-github-1.1.3
spec:
  severity: high
  effect: forbid
  resource: github.code.repository
  match:
    conditions:
    - cmp_ne(path(resource, "default_branch_protection.enabled"), true)
    conditionFormat: cel
  remediation:
    summary: Enable branch protection rules for the default branch requiring reviews and status checks.
  frameworks:
  - name: CIS GitHub Benchmark
    controls:
    - 1.1.3
  - name: NIST 800-53 r5
    controls:
    - CM-3
    - CM-5
