apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-dependabot-high-alert
  name: GitHub High Dependabot Alert
  description: Repository has high severity Dependabot security alert open for more than 14 days
  lastModified: '0001-01-01T00:00:00Z'
  tags:
  - devsecops
  - dependencies
  - supply-chain
  - dependabot
spec:
  severity: high
  effect: forbid
  resource: github.dependabot_alert
  match:
    conditions:
    - cmp_eq(path(resource, "severity"), "high")
    - cmp_eq(path(resource, "state"), "open")
    - cmp_gt(path(resource, "created_at_days"), 14)
    conditionFormat: cel
  remediation:
    summary: Update the vulnerable dependency to a patched version.
  frameworks:
  - name: SOC 2
    controls:
    - CC7.1
  - name: NIST 800-53 r5
    controls:
    - RA-5
    - SI-2
  - name: PCI DSS v4.0.1
    controls:
    - '6.3'
    - '11.3'
  - name: CIS Controls v8
    controls:
    - '7'
