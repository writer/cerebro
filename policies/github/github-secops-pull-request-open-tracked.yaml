apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-secops-pull-request-open-tracked
  name: GitHub Open Pull Request Tracked
  description: Open Pull Request should retain repository and author graph context for change-control evidence.
  lastModified: '2026-06-19T00:00:00Z'
  tags:
  - github
  - secops
  - generated
  - graph-backed
  - pull-request
  - change-control
  - open
spec:
  severity: medium
  effect: forbid
  resource: github.pull_request
  input:
    sourceKinds:
    - github
    eventKinds:
    - github.pull_request
    requiredFields:
    - repository
    - pull_number
    - state
    - html_url
    freshnessSLA: 12h
  match:
    conditions:
    - cmp_eq(path(resource, "state"), "open")
    conditionFormat: cel
  assert:
    all:
    - field: repository
      op: exists
    - field: pull_number
      op: exists
    - field: state
      op: exists
    - field: html_url
      op: exists
  context:
    graph:
      anchors:
      - resource_urn
      - tenant_id
      enrich:
      - organization
      - repository
      - actor
      - audit_event
    severityAdjustments:
    - when: path(resource, "visibility") == "public"
      delta: "+1"
    - when: context.crown_jewel_distance <= 2
      set: critical
  evidence:
    type: github_pull_request_lifecycle
    assessmentMethods:
    - examine
    - test
    requiredForAudit: true
    freshnessSLA: 12h
    acceptableSources:
    - github
    requiredFields:
    - repository
    - pull_number
    - state
    - html_url
    fingerprintFields:
    - tenant_id
    - policy_id
    - resource_urn
    - repository
  audit:
    evidenceType: github_pull_request_lifecycle
    assessmentMethods:
    - examine
    - test
    freshnessSLA: 12h
    auditorStatement: Pull request lifecycle evidence is projected as github.pull_request assets linked to repository and author.
    auditorGuidance: Review the GitHub graph entity, the source event kind, and the required evidence fields before accepting or suppressing this policy result.
    riskStatement: Open Pull Request should retain repository and author graph context for change-control evidence.
    remediationIntent: Review the pull request state and linked repository context.
    acceptableEvidence:
    - source: github
      fields:
      - repository
      - pull_number
      - state
      - html_url
    exceptionPolicy:
      maxAge: 14d
      requiresApproval: true
    exceptionGuidance:
    - Document the repository, organization, app, runner, or credential owner.
    - Record the compensating control and the planned date for returning to the secure state.
    falsePositives:
    - Provider preview fields may be absent from older GitHub Enterprise versions.
    - Short-lived migration windows may produce transient audit evidence before the next source sync.
  verification:
    fixtures:
    - name: github-secops-pull-request-open-tracked-finding
      expect: finding
      description: Required GitHub evidence matches the failing condition.
    - name: github-secops-pull-request-open-tracked-pass
      expect: pass
      description: The projected graph asset returns to the expected secure state.
    mutationChecks:
    - missing_required_field
    - stale_evidence
    - control_value_inverted
    remediationCheck:
      rerunAfter: source_sync
      expectedStatus: pass
  actions:
    owner:
      from: graph.owner
      fallback: security.platform
    remediation:
      type: manual
      steps:
      - Review the pull request state and linked repository context.
      - Confirm required reviews and status checks are represented by repository controls.
      - Rerun pull request ingestion after lifecycle changes.
    effort: low
    blastRadius:
      estimateFrom: graph.neighborhood
    verification:
      rerunPolicy: true
  remediation:
    summary: Review the pull request state and linked repository context.
    steps:
    - Review the pull request state and linked repository context.
    - Confirm required reviews and status checks are represented by repository controls.
    - Rerun pull request ingestion after lifecycle changes.
  riskCategories:
  - CHANGE_CONTROL
  - SUPPLY_CHAIN
  frameworks:
  - name: SOC 2
    controls:
    - CC6.1
    - CC7.1
    - CC8.1
  - name: ISO 27001:2022
    controls:
    - A.5.15
    - A.8.8
    - A.8.25
  - name: NIST 800-53 r5
    controls:
    - AC-3
    - CM-5
    - CM-6
