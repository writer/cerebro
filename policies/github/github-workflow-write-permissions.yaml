apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-workflow-write-permissions
  name: GitHub Actions Default Write Permissions
  description: Repository grants GitHub Actions workflows default write permissions, increasing blast radius of compromised workflows
  lastModified: '0001-01-01T00:00:00Z'
  tags:
  - github
  - actions
  - supply-chain
  - least-privilege
spec:
  severity: high
  effect: forbid
  resource: github.code.repository
  match:
    conditions:
    - cmp_eq(path(resource, "actions_permissions.default_workflow_permissions"), "write")
    conditionFormat: cel
  remediation:
    summary: Set default workflow permissions to 'read' in repository settings under Actions > General. Grant specific permissions in workflow YAML files as needed.
  riskCategories:
  - PRIVILEGE_ESCALATION
  frameworks:
  - name: NIST 800-53 r5
    controls:
    - AC-2
    - AC-6
  - name: PCI DSS v4.0.1
    controls:
    - '7.2'
  - name: SOC 2
    controls:
    - CC6.2
  - name: CIS Controls v8
    controls:
    - '5'
    - '6'
  mitreAttack:
  - tactic: Privilege Escalation
    technique: T1078
