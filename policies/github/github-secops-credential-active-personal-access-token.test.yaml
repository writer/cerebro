apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        resource_type: personal_access_token
        status: active
      wantFinding: true
    - name: non-matching resource passes
      resource:
        resource_type: personal_access_token-passing
        status: active
      wantFinding: false
