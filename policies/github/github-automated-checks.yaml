apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-automated-checks
  name: GitHub Code Changes Have Automated Checks
  description: Ensures repositories have required status checks configured for pull requests
  tags:
  - github
  - ci-cd
  - automated-checks
  - code-quality
spec:
  severity: MEDIUM
  category: github
  match:
    query: SELECT id, repository, branch FROM github_branch_protections WHERE required_status_checks IS NULL OR array_length(required_status_checks, 1) = 0
  remediation:
    summary: Configure required status checks in branch protection rules. Add CI/CD checks that must pass before merging.
  frameworks:
  - name: SOC 2
    controls:
    - CC1.1
  - name: ISO 27001:2022
    controls:
    - A.5.1
  - name: NIST 800-53 r5
    controls:
    - CM-3
  enabled: true
  resource: github.code.repository
