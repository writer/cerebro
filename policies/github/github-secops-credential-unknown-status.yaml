apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-secops-credential-unknown-status
  name: GitHub Unknown Credential Status
  description: Unknown Credential Status should be reviewed because programmatic GitHub access can bypass human identity controls.
  lastModified: '2026-06-19T00:00:00Z'
  tags:
  - github
  - secops
  - generated
  - graph-backed
  - credential
  - programmatic-access
  - unknown-status
spec:
  severity: medium
  effect: forbid
  resource: github.credential
  input:
    sourceKinds:
    - github
    eventKinds:
    - github.audit
    requiredFields:
    - credential_type
    - resource_type
    - status
    - programmatic_access_type
    freshnessSLA: 24h
  match:
    conditions:
    - cmp_eq(path(resource, "status"), "unknown")
    conditionFormat: cel
  assert:
    all:
    - field: credential_type
      op: exists
    - field: resource_type
      op: exists
    - field: status
      op: exists
    - field: programmatic_access_type
      op: exists
  context:
    graph:
      anchors:
      - resource_urn
      - tenant_id
      enrich:
      - organization
      - repository
      - actor
      - programmatic_access
    severityAdjustments:
    - when: path(resource, "visibility") == "public"
      delta: "+1"
    - when: context.crown_jewel_distance <= 2
      set: critical
  evidence:
    type: github_programmatic_credential
    assessmentMethods:
    - examine
    - test
    requiredForAudit: true
    freshnessSLA: 24h
    acceptableSources:
    - github
    requiredFields:
    - credential_type
    - resource_type
    - status
    - programmatic_access_type
    fingerprintFields:
    - tenant_id
    - policy_id
    - resource_urn
    - credential_type
  audit:
    evidenceType: github_programmatic_credential
    assessmentMethods:
    - examine
    - test
    freshnessSLA: 24h
    auditorStatement: GitHub audit events project programmatic access into github.credential assets.
    auditorGuidance: Review the GitHub graph entity, the source event kind, and the required evidence fields before accepting or suppressing this policy result.
    riskStatement: Unknown Credential Status should be reviewed because programmatic GitHub access can bypass human identity controls.
    remediationIntent: Review the credential owner, scope, and last action.
    acceptableEvidence:
    - source: github
      fields:
      - credential_type
      - resource_type
      - status
      - programmatic_access_type
    exceptionPolicy:
      maxAge: 14d
      requiresApproval: true
    exceptionGuidance:
    - Document the repository, organization, app, runner, or credential owner.
    - Record the compensating control and the planned date for returning to the secure state.
    falsePositives:
    - Provider preview fields may be absent from older GitHub Enterprise versions.
    - Short-lived migration windows may produce transient audit evidence before the next source sync.
  verification:
    fixtures:
    - name: github-secops-credential-unknown-status-finding
      expect: finding
      description: Required GitHub evidence matches the failing condition.
    - name: github-secops-credential-unknown-status-pass
      expect: pass
      description: The projected graph asset returns to the expected secure state.
    mutationChecks:
    - missing_required_field
    - stale_evidence
    - control_value_inverted
    remediationCheck:
      rerunAfter: source_sync
      expectedStatus: pass
  actions:
    owner:
      from: graph.owner
      fallback: security.platform
    remediation:
      type: manual
      steps:
      - Review the credential owner, scope, and last action.
      - Revoke or reduce access when the credential is not required.
      - Rerun GitHub audit ingestion and verify credential status.
    effort: medium
    blastRadius:
      estimateFrom: graph.neighborhood
    verification:
      rerunPolicy: true
  remediation:
    summary: Review the credential owner, scope, and last action.
    steps:
    - Review the credential owner, scope, and last action.
    - Revoke or reduce access when the credential is not required.
    - Rerun GitHub audit ingestion and verify credential status.
  riskCategories:
  - PRIVILEGE_ESCALATION
  - SECRET_EXPOSURE
  frameworks:
  - name: SOC 2
    controls:
    - CC6.1
    - CC7.1
  - name: ISO 27001:2022
    controls:
    - A.5.15
    - A.8.8
  - name: NIST 800-53 r5
    controls:
    - AC-2
    - AC-3
    - IA-2
