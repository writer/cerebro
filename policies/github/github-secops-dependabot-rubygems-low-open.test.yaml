apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        ecosystem: rubygems
        severity: low
        state: open
      wantFinding: true
    - name: non-matching resource passes
      resource:
        ecosystem: rubygems
        severity: low
        state: open-passing
      wantFinding: false
