apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: github-dependabot-critical-alert
    name: GitHub Critical Dependabot Alert
    description: Repository has critical Dependabot security alert open for more than 7 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - devsecops
        - dependencies
        - supply-chain
        - dependabot
spec:
    severity: critical
    effect: forbid
    resource: github::repository_dependabot_alert
    match:
        conditions:
            - cmp_eq(path(resource, "severity"), "critical")
            - cmp_eq(path(resource, "state"), "open")
            - cmp_gt(path(resource, "created_at_days"), 7)
        conditionFormat: cel
    remediation:
        summary: Update the vulnerable dependency or apply the security patch provided by Dependabot.
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
        - name: NIST 800-53 r5
          controls:
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "6.3"
            - "11.3"
        - name: CIS Controls v8
          controls:
            - "7"
