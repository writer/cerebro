apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        repository_secret_scanning_enabled: "false"
        resource_type: repository_secret_scanning
      wantFinding: true
    - name: non-matching resource passes
      resource:
        repository_secret_scanning_enabled: "false"
        resource_type: repository_secret_scanning-passing
      wantFinding: false
