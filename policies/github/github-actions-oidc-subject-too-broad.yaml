apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-actions-oidc-subject-too-broad
  name: Github Actions Oidc Subject Too Broad
  description: Github Actions Oidc Subject Too Broad policy evidence is missing, disabled, or outside the expected secure state.
  lastModified: '0001-01-01T00:00:00Z'
  tags:
  - github
  - actions
  - oidc
  - generated
spec:
  severity: medium
  effect: forbid
  resource: github.resource
  match:
    conditions:
    - cmp_ne(path(resource, "actions_oidc_subject_too_broad_compliant"), true)
    conditionFormat: cel
  remediation:
    summary: Restore actions oidc subject too broad controls to the approved state, capture owner approval, and retain evidence from the authoritative system.
    steps:
    - Review the affected resource or subject and confirm the policy evidence is in scope.
    - Update the authoritative system configuration or documented control evidence.
    - Rerun evidence collection and attach the passing result or approved exception.
  riskCategories:
  - SUPPLY_CHAIN
  - CHANGE_CONTROL
  frameworks:
  - name: SOC 2
    controls:
    - CC6.1
    - CC7.1
    - CC8.1
  - name: ISO 27001:2022
    controls:
    - A.5.15
    - A.8.8
    - A.8.25
  - name: NIST 800-53 r5
    controls:
    - AC-3
    - SA-10
    - SR-4
