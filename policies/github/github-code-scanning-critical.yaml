apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: github-code-scanning-critical
    name: GitHub Code Scanning Critical Alert
    description: Repository has critical code scanning alert from CodeQL or third-party scanner
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - devsecops
        - sast
        - code-scanning
        - codeql
spec:
    severity: critical
    effect: forbid
    resource: github::code_scanning_alert
    match:
        conditions:
            - (cmp_eq(path(resource, "rule.severity"), "critical")) || (cmp_eq(path(resource, "rule.security_severity_level"), "critical"))
            - cmp_eq(path(resource, "state"), "open")
        conditionFormat: cel
    remediation:
        summary: Fix the vulnerability identified by the code scanner.
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
        - name: NIST 800-53 r5
          controls:
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "6.3"
            - "11.3"
        - name: CIS Controls v8
          controls:
            - "7"
    mitreAttack:
        - tactic: Execution
          technique: T1059
