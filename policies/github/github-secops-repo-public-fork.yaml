apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-secops-repo-public-fork
  name: GitHub Public fork should have a maintainer-approved exposure exception
  description: Public fork should have a maintainer-approved exposure exception so GitHub repository risk can be routed and reviewed with graph context.
  lastModified: '2026-06-19T00:00:00Z'
  tags:
  - github
  - secops
  - generated
  - graph-backed
  - repository
  - exposure
  - public-fork
spec:
  severity: medium
  effect: forbid
  resource: github.code.repository
  input:
    sourceKinds:
    - github
    eventKinds:
    - github.code.repository
    requiredFields:
    - repository
    - resource_type
    - visibility
    - archived
    - fork
    - owner_login
    freshnessSLA: 12h
  match:
    conditions:
    - cmp_eq(path(resource, "resource_type"), "code_repository")
    - cmp_eq(path(resource, "visibility"), "public")
    - cmp_eq(path(resource, "fork"), "true")
    conditionFormat: cel
  assert:
    all:
    - field: repository
      op: exists
    - field: resource_type
      op: exists
    - field: visibility
      op: exists
    - field: archived
      op: exists
  context:
    graph:
      anchors:
      - resource_urn
      - tenant_id
      enrich:
      - owner
      - repository
      - default_branch
      - security_alerts
      - rulesets
      - branch_protection
    severityAdjustments:
    - when: path(resource, "visibility") == "public"
      delta: "+1"
    - when: context.crown_jewel_distance <= 2
      set: critical
  evidence:
    type: github_repository_posture
    assessmentMethods:
    - examine
    - test
    requiredForAudit: true
    freshnessSLA: 12h
    acceptableSources:
    - github
    requiredFields:
    - repository
    - resource_type
    - visibility
    - archived
    - fork
    - owner_login
    fingerprintFields:
    - tenant_id
    - policy_id
    - resource_urn
    - repository
  audit:
    evidenceType: github_repository_posture
    assessmentMethods:
    - examine
    - test
    freshnessSLA: 12h
    auditorStatement: Repository exposure posture is evaluated from the projected GitHub repository node.
    auditorGuidance: Review the GitHub graph entity, the source event kind, and the required evidence fields before accepting or suppressing this policy result.
    riskStatement: Public fork should have a maintainer-approved exposure exception so GitHub repository risk can be routed and reviewed with graph context.
    remediationIntent: Review the affected repository exposure and ownership state.
    acceptableEvidence:
    - source: github
      fields:
      - repository
      - resource_type
      - visibility
      - archived
      - fork
      - owner_login
    exceptionPolicy:
      maxAge: 14d
      requiresApproval: true
    exceptionGuidance:
    - Document the repository, organization, app, runner, or credential owner.
    - Record the compensating control and the planned date for returning to the secure state.
    falsePositives:
    - Provider preview fields may be absent from older GitHub Enterprise versions.
    - Short-lived migration windows may produce transient audit evidence before the next source sync.
  verification:
    fixtures:
    - name: github-secops-repo-public-fork-finding
      expect: finding
      description: Required GitHub evidence matches the failing condition.
    - name: github-secops-repo-public-fork-pass
      expect: pass
      description: The projected graph asset returns to the expected secure state.
    mutationChecks:
    - missing_required_field
    - stale_evidence
    - control_value_inverted
    remediationCheck:
      rerunAfter: source_sync
      expectedStatus: pass
  actions:
    owner:
      from: graph.owner
      fallback: security.platform
    remediation:
      type: manual
      steps:
      - Review the affected repository exposure and ownership state.
      - Update repository visibility, archive status, or ownership metadata as appropriate.
      - Rerun the GitHub repository source and verify the graph node is current.
    effort: medium
    blastRadius:
      estimateFrom: graph.neighborhood
    verification:
      rerunPolicy: true
  remediation:
    summary: Review the affected repository exposure and ownership state.
    steps:
    - Review the affected repository exposure and ownership state.
    - Update repository visibility, archive status, or ownership metadata as appropriate.
    - Rerun the GitHub repository source and verify the graph node is current.
  riskCategories:
  - SUPPLY_CHAIN
  - CHANGE_CONTROL
  frameworks:
  - name: SOC 2
    controls:
    - CC6.1
    - CC7.1
    - CC8.1
  - name: ISO 27001:2022
    controls:
    - A.5.15
    - A.8.8
    - A.8.25
  - name: NIST 800-53 r5
    controls:
    - RA-5
    - SA-10
    - SR-4
