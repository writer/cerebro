apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        created_at_days: 8
        severity: critical
        state: open
      wantFinding: true
    - name: non-matching resource passes
      resource:
        created_at_days: 8
        severity: critical-passing
        state: open
      wantFinding: false
