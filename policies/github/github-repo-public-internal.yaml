apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-repo-internal-exposed
  name: GitHub Internal Repository Made Public
  description: Repository appears to contain internal code but is publicly visible
  lastModified: '0001-01-01T00:00:00Z'
  tags:
  - devsecops
  - github
  - data-exposure
  - misconfiguration
spec:
  severity: critical
  effect: forbid
  resource: github.code.repository
  match:
    conditions:
    - cmp_eq(path(resource, "visibility"), "public")
    - matches_value(path(resource, "name"), "(?i)(internal|private|confidential|secret)")
    conditionFormat: cel
  remediation:
    summary: Change repository visibility to private or internal.
  riskCategories:
  - EXTERNAL_EXPOSURE
  - UNPROTECTED_DATA
  - MISCONFIGURATION
  frameworks:
  - name: NIST 800-53 r5
    controls:
    - AC-3
    - SC-7
  - name: PCI DSS v4.0.1
    controls:
    - '1.3'
    - '1.4'
  - name: SOC 2
    controls:
    - CC6.6
  - name: CIS Controls v8
    controls:
    - '12'
    - '13'
  mitreAttack:
  - tactic: Initial Access
    technique: T1190
  - tactic: Execution
    technique: T1059
  - tactic: Collection
    technique: T1530
