apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-secops-audit-org-oauth-app-created
  name: GitHub Audit OAuth Application Created
  description: GitHub audit evidence indicates oauth application created at organization scope, reducing account, app, or network control strength.
  lastModified: '2026-06-19T00:00:00Z'
  tags:
  - github
  - secops
  - generated
  - graph-backed
  - audit
  - organization
  - identity
  - oauth-app-created
spec:
  severity: medium
  effect: forbid
  resource: github.resource
  input:
    sourceKinds:
    - github
    eventKinds:
    - github.audit
    requiredFields:
    - action
    - resource_type
    - resource_id
    - org
    freshnessSLA: 24h
  match:
    conditions:
    - cmp_eq(path(resource, "resource_type"), "oauth_application")
    conditionFormat: cel
  assert:
    all:
    - field: action
      op: exists
    - field: resource_type
      op: exists
    - field: resource_id
      op: exists
    - field: org
      op: exists
  context:
    graph:
      anchors:
      - resource_urn
      - tenant_id
      enrich:
      - organization
      - repository
      - actor
      - audit_event
    severityAdjustments:
    - when: path(resource, "visibility") == "public"
      delta: "+1"
    - when: context.crown_jewel_distance <= 2
      set: critical
  evidence:
    type: github_audit_organization_control
    assessmentMethods:
    - examine
    - test
    requiredForAudit: true
    freshnessSLA: 24h
    acceptableSources:
    - github
    requiredFields:
    - action
    - resource_type
    - resource_id
    - org
    fingerprintFields:
    - tenant_id
    - policy_id
    - resource_urn
    - resource_id
  audit:
    evidenceType: github_audit_organization_control
    assessmentMethods:
    - examine
    - test
    freshnessSLA: 24h
    auditorStatement: Organization-scoped GitHub audit fields are projected onto github.resource assets for control review.
    auditorGuidance: Review the GitHub graph entity, the source event kind, and the required evidence fields before accepting or suppressing this policy result.
    riskStatement: GitHub audit evidence indicates oauth application created at organization scope, reducing account, app, or network control strength.
    remediationIntent: Review the organization-level GitHub audit event.
    acceptableEvidence:
    - source: github
      fields:
      - action
      - resource_type
      - resource_id
      - org
    exceptionPolicy:
      maxAge: 14d
      requiresApproval: true
    exceptionGuidance:
    - Document the repository, organization, app, runner, or credential owner.
    - Record the compensating control and the planned date for returning to the secure state.
    falsePositives:
    - Provider preview fields may be absent from older GitHub Enterprise versions.
    - Short-lived migration windows may produce transient audit evidence before the next source sync.
  verification:
    fixtures:
    - name: github-secops-audit-org-oauth-app-created-finding
      expect: finding
      description: Required GitHub evidence matches the failing condition.
    - name: github-secops-audit-org-oauth-app-created-pass
      expect: pass
      description: The projected graph asset returns to the expected secure state.
    mutationChecks:
    - missing_required_field
    - stale_evidence
    - control_value_inverted
    remediationCheck:
      rerunAfter: source_sync
      expectedStatus: pass
  actions:
    owner:
      from: graph.owner
      fallback: security.platform
    remediation:
      type: manual
      steps:
      - Review the organization-level GitHub audit event.
      - Restore the affected organization security setting.
      - Record approval for any exception and verify the next audit sync.
    effort: medium
    blastRadius:
      estimateFrom: graph.neighborhood
    verification:
      rerunPolicy: true
  remediation:
    summary: Review the organization-level GitHub audit event.
    steps:
    - Review the organization-level GitHub audit event.
    - Restore the affected organization security setting.
    - Record approval for any exception and verify the next audit sync.
  riskCategories:
  - PRIVILEGE_ESCALATION
  - WEAK_AUTHENTICATION
  frameworks:
  - name: SOC 2
    controls:
    - CC6.1
    - CC7.1
  - name: ISO 27001:2022
    controls:
    - A.5.15
    - A.8.8
  - name: NIST 800-53 r5
    controls:
    - AC-2
    - AC-3
    - IA-2
