apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: github-branch-protection-admin
    name: GitHub Branch Protection Enforced for Admins
    description: Ensures branch protection rules apply to administrators and cannot be bypassed
    tags:
        - github
        - branch-protection
        - admin
        - code-review
spec:
    severity: HIGH
    category: github
    resource: github.code.repository
    match:
        query: SELECT id, repository, branch, enforce_admins FROM github_branch_protections WHERE enforce_admins = false
    remediation:
        summary: Enable 'Include administrators' in branch protection rules to ensure admins cannot bypass protections.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC8.1
        - name: ISO 27001:2022
          controls:
            - A.5.15
            - A.5.18
            - A.8.32
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - CM-3
            - CM-5
            - SI-7
            - SR-11
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
            - "2"
            - "7"
            - "16"
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "6.3"
            - "6.5"
    enabled: true
