apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-runner-public-repo
  name: GitHub Self-Hosted Runner on Public Repository
  description: Self-hosted runner is configured on a public repository, allowing arbitrary code execution from external pull requests
  lastModified: '0001-01-01T00:00:00Z'
  tags:
  - github
  - runners
  - supply-chain
  - code-execution
spec:
  severity: critical
  effect: forbid
  resource: github.runner
  match:
    conditions:
    - cmp_eq(path(resource, "repository.visibility"), "public")
    - cmp_eq(path(resource, "runner_group.allows_public_repositories"), true)
    conditionFormat: cel
  remediation:
    summary: Move self-hosted runners to private repositories only. Use GitHub-hosted runners for public repositories. Configure runner groups to disallow public repositories.
  riskCategories:
  - EXTERNAL_EXPOSURE
  frameworks:
  - name: NIST 800-53 r5
    controls:
    - AC-3
    - SC-7
  - name: PCI DSS v4.0.1
    controls:
    - '1.3'
    - '1.4'
  - name: SOC 2
    controls:
    - CC6
  - name: CIS Controls v8
    controls:
    - '12'
    - '13'
  mitreAttack:
  - tactic: Initial Access
    technique: T1190
  - tactic: Execution
    technique: T1059
