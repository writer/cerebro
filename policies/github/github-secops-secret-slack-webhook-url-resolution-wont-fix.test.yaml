apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: matching resource produces a finding
      resource:
        resolution: wont_fix
        secret_type: slack_webhook_url
        state: resolved
      wantFinding: true
    - name: non-matching resource passes
      resource:
        resolution: wont_fix
        secret_type: slack_webhook_url
        state: resolved-passing
      wantFinding: false
