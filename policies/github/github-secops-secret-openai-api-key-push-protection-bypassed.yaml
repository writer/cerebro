apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
  id: github-secops-secret-openai-api-key-push-protection-bypassed
  name: GitHub Secret Scanning Openai Api Key Push Protection Bypassed
  description: Push protection bypasses for openai_api_key should be reviewed because the secret reached GitHub despite pre-receive controls.
  lastModified: '2026-06-19T00:00:00Z'
  tags:
  - github
  - secops
  - generated
  - graph-backed
  - secret-scanning
  - push-protection
  - bypass
  - openai_api_key
spec:
  severity: critical
  effect: forbid
  resource: github.secret_scanning_alert
  input:
    sourceKinds:
    - github
    eventKinds:
    - github.secret_scanning_alert
    requiredFields:
    - alert_number
    - state
    - secret_type
    - repository
    - push_protection_bypassed
    freshnessSLA: 12h
  match:
    conditions:
    - cmp_eq(path(resource, "push_protection_bypassed"), "true")
    - cmp_eq(path(resource, "secret_type"), "openai_api_key")
    conditionFormat: cel
  assert:
    all:
    - field: alert_number
      op: exists
    - field: state
      op: exists
    - field: secret_type
      op: exists
    - field: repository
      op: exists
  context:
    graph:
      anchors:
      - resource_urn
      - tenant_id
      enrich:
      - repository
      - secret_type
      - resolver
      - push_protection_bypasser
    severityAdjustments:
    - when: path(resource, "visibility") == "public"
      delta: "+1"
    - when: context.crown_jewel_distance <= 2
      set: critical
  evidence:
    type: github_secret_scanning_push_protection
    assessmentMethods:
    - examine
    - test
    requiredForAudit: true
    freshnessSLA: 12h
    acceptableSources:
    - github
    requiredFields:
    - alert_number
    - state
    - secret_type
    - repository
    - push_protection_bypassed
    fingerprintFields:
    - tenant_id
    - policy_id
    - resource_urn
    - alert_number
    - repository
  audit:
    evidenceType: github_secret_scanning_push_protection
    assessmentMethods:
    - examine
    - test
    freshnessSLA: 12h
    auditorStatement: Push protection bypass evidence is projected on the GitHub secret scanning alert asset.
    auditorGuidance: Review the GitHub graph entity, the source event kind, and the required evidence fields before accepting or suppressing this policy result.
    riskStatement: Push protection bypasses for openai_api_key should be reviewed because the secret reached GitHub despite pre-receive controls.
    remediationIntent: Review the bypassing actor and business justification.
    acceptableEvidence:
    - source: github
      fields:
      - alert_number
      - state
      - secret_type
      - repository
      - push_protection_bypassed
    exceptionPolicy:
      maxAge: 14d
      requiresApproval: true
    exceptionGuidance:
    - Document the repository, organization, app, runner, or credential owner.
    - Record the compensating control and the planned date for returning to the secure state.
    falsePositives:
    - Provider preview fields may be absent from older GitHub Enterprise versions.
    - Short-lived migration windows may produce transient audit evidence before the next source sync.
  verification:
    fixtures:
    - name: github-secops-secret-openai-api-key-push-protection-bypassed-finding
      expect: finding
      description: Required GitHub evidence matches the failing condition.
    - name: github-secops-secret-openai-api-key-push-protection-bypassed-pass
      expect: pass
      description: The projected graph asset returns to the expected secure state.
    mutationChecks:
    - missing_required_field
    - stale_evidence
    - control_value_inverted
    remediationCheck:
      rerunAfter: source_sync
      expectedStatus: pass
  actions:
    owner:
      from: graph.owner
      fallback: security.platform
    remediation:
      type: manual
      steps:
      - Review the bypassing actor and business justification.
      - Revoke or rotate the exposed openai_api_key credential.
      - Require delegated bypass approval before accepting recurrence.
    effort: medium
    blastRadius:
      estimateFrom: graph.neighborhood
    verification:
      rerunPolicy: true
  remediation:
    summary: Review the bypassing actor and business justification.
    steps:
    - Review the bypassing actor and business justification.
    - Revoke or rotate the exposed openai_api_key credential.
    - Require delegated bypass approval before accepting recurrence.
  riskCategories:
  - SECRET_EXPOSURE
  - UNPROTECTED_DATA
  frameworks:
  - name: SOC 2
    controls:
    - CC7.1
    - CC8.1
  - name: ISO 27001:2022
    controls:
    - A.8.8
    - A.8.15
  - name: NIST 800-53 r5
    controls:
    - AU-2
    - AU-6
    - SI-2
