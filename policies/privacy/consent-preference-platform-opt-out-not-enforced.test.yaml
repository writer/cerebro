apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: active opt-out not enforced fails
      resource:
          subject_id: person-100
          preference_type: sale_or_share_opt_out
          opted_out: true
          enforced: false
          downstream_systems:
              - ads
              - analytics
          observed_at: "2026-07-01T00:00:00Z"
      wantFinding: true
    - name: enforced opt-out passes
      resource:
          subject_id: person-101
          preference_type: sale_or_share_opt_out
          opted_out: true
          enforced: true
          downstream_systems:
              - ads
          observed_at: "2026-07-01T00:00:00Z"
      wantFinding: false
