apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-file-shared-externally
    name: Microsoft 365 File Shared Externally
    description: SharePoint site or OneDrive file is shared with external users outside the organization
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - m365
        - sharepoint
        - data-exposure
        - external-sharing
        - nist-ac-3
spec:
    severity: medium
    effect: forbid
    resource: m365::sharepoint::site
    match:
        conditions:
            - cmp_eq(path(resource, "external_sharing_enabled"), true)
            - cmp_gt(path(resource, "external_user_count"), 0)
        conditionFormat: cel
    remediation:
        summary: Review external sharing permissions. Remove unauthorized external access. Use expiring sharing links. Configure tenant-level sharing restrictions.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
