apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-inactive-users
    name: M365 Inactive User Accounts
    description: Identifies enabled user accounts with no sign-in activity in 90 days
    tags:
        - m365
        - entra
        - identity
        - access-review
        - hygiene
spec:
    severity: MEDIUM
    category: m365
    resourceType: entra_user
    match:
        query: SELECT id, user_principal_name, display_name, last_sign_in_datetime FROM entra_users WHERE account_enabled = true AND (last_sign_in_datetime IS NULL OR last_sign_in_datetime < NOW() - INTERVAL '90 days')
    remediation:
        summary: Review inactive accounts and disable or remove access if no longer needed. Perform periodic access reviews.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
        - name: ISO 27001:2022
          controls:
            - A.5.15
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
    enabled: true
