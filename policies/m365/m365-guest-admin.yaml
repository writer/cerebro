apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-guest-admin
    name: Microsoft 365 Guest User with Admin Role
    description: External guest user has been assigned an administrative role in the tenant
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - m365
        - identity
        - privileged-access
        - guest-user
        - nist-ac-6
spec:
    severity: critical
    effect: forbid
    resource: m365::directory::user
    match:
        conditions:
            - cmp_eq(path(resource, "user_type"), "Guest")
            - list_value(path(resource, "directory_roles")).exists(item, cmp_eq(path(item, "is_privileged"), true))
        conditionFormat: cel
    remediation:
        summary: Remove admin roles from guest users immediately. Guest users should not have elevated privileges. Create internal accounts if external admin access is required.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
