apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-guest-access-review
    name: M365 Guest Users Without Recent Access Review
    description: Identifies guest users who have not had access reviewed in the last 90 days
    tags:
        - m365
        - entra
        - guest
        - access-review
        - identity
spec:
    severity: MEDIUM
    category: m365
    resourceType: entra_user
    match:
        query: SELECT id, user_principal_name, display_name, created_datetime, last_sign_in_datetime FROM entra_users WHERE user_type = 'Guest' AND (last_access_review IS NULL OR last_access_review < NOW() - INTERVAL '90 days')
    remediation:
        summary: Conduct regular access reviews for guest users. Remove guest accounts that are no longer needed.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
        - name: ISO 27001:2022
          controls:
            - A.5.15
            - A.5.18
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
    enabled: true
