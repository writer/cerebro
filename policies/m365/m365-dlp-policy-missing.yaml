apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-dlp-policy-missing
    name: M365 DLP Policy Configured
    description: Ensures Data Loss Prevention policies are configured and reviewed
    tags:
        - m365
        - dlp
        - data-protection
        - compliance
        - policy
spec:
    severity: HIGH
    category: m365
    resourceType: policy_document
    match:
        query: SELECT id, policy_type, status, last_approved_date FROM policy_documents WHERE policy_type = 'm365_dlp' AND (status != 'approved' OR last_approved_date < NOW() - INTERVAL '365 days')
    remediation:
        summary: Enable Microsoft Purview DLP policies for sensitive data types and review them at least annually.
    frameworks:
        - name: SOC 2
          controls:
            - C1.1
        - name: ISO 27001:2022
          controls:
            - A.8.12
        - name: NIST 800-53 r5
          controls:
            - SI-4
    enabled: true
