apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-privileged-roles-pim
    name: Privileged Roles Without PIM Controls
    description: Detects privileged role assignments that should be managed with Privileged Identity Management (PIM)
    tags:
        - m365
        - entra
        - pim
        - privileged-access
        - identity
spec:
    severity: HIGH
    category: m365
    resourceType: entra_role_assignment
    match:
        query: SELECT ra.id, ra.principal_id, dr.display_name FROM entra_role_assignments ra JOIN entra_directory_roles dr ON ra.role_definition_id = dr.id WHERE dr.is_enabled = true AND dr.is_built_in = true AND LOWER(dr.display_name) LIKE '%admin%'
    remediation:
        summary: Use Privileged Identity Management to require just-in-time activation, approvals, and time-bound access for privileged roles.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
    enabled: true
