apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-stale-service-principal
    name: M365 Stale Service Principals
    description: Identifies service principals (apps) that have not been used in 90 days
    tags:
        - m365
        - entra
        - service-principal
        - app
        - hygiene
spec:
    severity: LOW
    category: m365
    resourceType: entra_service_principal
    match:
        query: SELECT id, app_id, display_name, created_datetime, last_sign_in FROM entra_service_principals WHERE account_enabled = true AND (last_sign_in IS NULL OR last_sign_in < NOW() - INTERVAL '90 days')
    remediation:
        summary: Review stale service principals and disable or delete those no longer needed. Rotate credentials for active service principals.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
    enabled: true
