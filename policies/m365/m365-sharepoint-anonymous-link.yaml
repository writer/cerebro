apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-sharepoint-anonymous-link
    name: SharePoint Anonymous Sharing Link
    description: SharePoint site allows anonymous sharing links that don't require authentication
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - m365
        - sharepoint
        - data-exposure
        - anonymous-access
        - cwe-200
spec:
    severity: high
    effect: forbid
    resource: m365::sharepoint::site
    match:
        conditions:
            - in_list(path(resource, "sharing_capability"), ["ExternalUserAndGuestSharing","Anyone"])
            - cmp_gt(path(resource, "anonymous_link_count"), 0)
        conditionFormat: cel
    remediation:
        summary: Disable anonymous sharing links. Use authenticated links with expiration. Configure site-level and tenant-level sharing restrictions.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "8.3"
            - "8.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "6"
            - "5"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
