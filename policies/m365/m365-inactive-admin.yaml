apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-inactive-admin
    name: Microsoft 365 Inactive Admin Account
    description: User with administrative role has not signed in for over 90 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - m365
        - identity
        - privileged-access
        - hygiene
        - access-review
spec:
    severity: medium
    effect: forbid
    resource: m365::directory::user
    match:
        conditions:
            - list_value(path(resource, "directory_roles")).exists(item, cmp_eq(path(item, "is_privileged"), true))
            - cmp_gt(path(resource, "sign_in_activity.last_sign_in_days_ago"), 90)
        conditionFormat: cel
    remediation:
        summary: Review dormant admin accounts. Remove admin privileges if no longer needed. Disable accounts for departed users. Implement regular access certification.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
