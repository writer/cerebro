apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-email-security-baseline
    name: M365 Email Security Baseline Configured
    description: Ensures anti-phishing, Safe Links/Safe Attachments, and DMARC/DKIM/SPF protections are configured
    tags:
        - m365
        - email
        - phishing
        - dmarc
        - dkim
        - spf
spec:
    severity: HIGH
    category: m365
    resourceType: policy_document
    match:
        query: SELECT id, policy_type, status, last_approved_date FROM policy_documents WHERE policy_type = 'm365_email_security' AND (status != 'approved' OR last_approved_date < NOW() - INTERVAL '365 days')
    remediation:
        summary: Enable anti-phishing, Safe Links, Safe Attachments, and enforce DMARC/DKIM/SPF for all domains. Review configurations annually.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.6
        - name: ISO 27001:2022
          controls:
            - A.5.7
        - name: NIST 800-53 r5
          controls:
            - SI-8
            - SC-7
    enabled: true
