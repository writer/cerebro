apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-global-admin-count
    name: Excessive Global Administrators
    description: Identifies when there are more than 5 Global Administrator accounts
    tags:
        - m365
        - entra
        - admin
        - least-privilege
        - identity
spec:
    severity: MEDIUM
    category: m365
    resourceType: entra_role_assignment
    match:
        query: SELECT COUNT(*) as admin_count FROM entra_role_assignments WHERE role_definition_id = 'global_admin_role_id' HAVING COUNT(*) > 5
    remediation:
        summary: Reduce the number of Global Administrators to 2-5. Use least-privilege roles where possible (e.g., User Administrator, Security Administrator).
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: ISO 27001:2022
          controls:
            - A.5.1
        - name: CIS Benchmarks
          controls:
            - "1.1"
    enabled: true
