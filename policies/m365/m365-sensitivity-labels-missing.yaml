apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-sensitivity-labels-missing
    name: M365 Sensitivity Labels Applied
    description: Ensures sensitivity labels are defined and applied for data classification
    tags:
        - m365
        - sensitivity-labels
        - data-classification
        - compliance
        - policy
spec:
    severity: HIGH
    category: m365
    resourceType: policy_document
    match:
        query: SELECT id, policy_type, status, last_approved_date FROM policy_documents WHERE policy_type = 'm365_sensitivity_labels' AND (status != 'approved' OR last_approved_date < NOW() - INTERVAL '365 days')
    remediation:
        summary: Define sensitivity labels and auto-labeling policies for regulated data. Review label taxonomy annually.
    frameworks:
        - name: SOC 2
          controls:
            - CC6
        - name: ISO 27001:2022
          controls:
            - A.5.12
        - name: NIST 800-53 r5
          controls:
            - MP-4
    enabled: true
