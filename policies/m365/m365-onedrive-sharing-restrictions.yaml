apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-onedrive-sharing-restrictions
    name: OneDrive Sharing Restrictions Documented
    description: Ensures OneDrive sharing settings are restricted and reviewed
    tags:
        - m365
        - onedrive
        - sharing
        - data-protection
        - policy
spec:
    severity: MEDIUM
    category: m365
    resourceType: policy_document
    match:
        query: SELECT id, policy_type, status, last_approved_date FROM policy_documents WHERE policy_type = 'm365_onedrive_sharing' AND (status != 'approved' OR last_approved_date < NOW() - INTERVAL '365 days')
    remediation:
        summary: Configure OneDrive sharing restrictions, require authenticated sharing links, and review settings annually.
    frameworks:
        - name: SOC 2
          controls:
            - CC6
        - name: ISO 27001:2022
          controls:
            - A.5.1
        - name: NIST 800-53 r5
          controls:
            - AC-3
    enabled: true
