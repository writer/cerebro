apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-mailbox-audit-disabled
    name: M365 Mailbox Audit Disabled
    description: "M365 Mailbox Audit Disabled policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - m365
        - exchange
        - audit
        - generated
        - mailbox
spec:
    severity: medium
    effect: forbid
    resource: "m365::mailbox"
    match:
        conditions:
            - "cmp_eq(path(resource, \"mailbox_audit_disabled\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore mailbox audit disabled controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - DATA_PROTECTION
        - ACCESS_CONTROL
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
            - CC7.1
        - name: "ISO 27001:2022"
          controls:
            - A.5.15
            - A.5.23
            - A.8.12
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-3
            - AU-2
