apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: m365-mfa-required
    name: M365 Users Without MFA Enabled
    description: Identifies Microsoft 365 users who do not have MFA configured
    tags:
        - m365
        - entra
        - mfa
        - authentication
        - identity
spec:
    severity: HIGH
    category: m365
    resourceType: entra_user
    match:
        query: SELECT id, user_principal_name, display_name, account_enabled FROM entra_users WHERE account_enabled = true AND mfa_registered = false
    remediation:
        summary: Enable MFA for all user accounts. Use Conditional Access policies to enforce MFA requirements.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
        - name: ISO 27001:2022
          controls:
            - A.5.17
            - A.8.5
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
        - name: CIS Controls v8
          controls:
            - "6"
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
    enabled: true
