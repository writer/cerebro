apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-bigquery-public-dataset
    name: GCP BigQuery Public Dataset
    description: BigQuery dataset is accessible by allUsers or allAuthenticatedUsers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - dspm
        - bigquery
        - gcp
        - data-exposure
        - public-access
spec:
    severity: critical
    effect: forbid
    resource: gcp::bigquery::dataset
    match:
        conditions:
            - (contains_value(path(resource, "access"), "allUsers")) || (contains_value(path(resource, "access"), "allAuthenticatedUsers"))
        conditionFormat: cel
    remediation:
        summary: Remove allUsers and allAuthenticatedUsers from dataset IAM bindings.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
