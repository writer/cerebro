apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-rds-public-snapshot
    name: AWS RDS Public Snapshot
    description: RDS database snapshot is publicly accessible
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - dspm
        - rds
        - database
        - data-exposure
        - snapshot
spec:
    severity: critical
    effect: forbid
    resource: aws::rds::db_snapshot
    match:
        conditions:
            - contains_value(path(resource, "attributes.restore"), "all")
        conditionFormat: cel
    remediation:
        summary: Modify snapshot permissions to remove public access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
