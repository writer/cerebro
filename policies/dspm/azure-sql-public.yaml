apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: azure-sql-public-network-access
    name: Azure SQL Public Network Access
    description: Azure SQL database allows public network access
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - dspm
        - azure-sql
        - database
        - public-access
        - network
spec:
    severity: high
    effect: forbid
    resource: azure::sql::server
    match:
        conditions:
            - cmp_eq(path(resource, "public_network_access"), "Enabled")
        conditionFormat: cel
    remediation:
        summary: Disable public network access and use private endpoints.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
