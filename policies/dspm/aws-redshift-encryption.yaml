apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-redshift-no-encryption
    name: AWS Redshift Not Encrypted
    description: Redshift cluster is not encrypted at rest
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - dspm
        - redshift
        - encryption
        - data-protection
        - cis-aws-2.3.2
spec:
    severity: high
    effect: forbid
    resource: aws::redshift::cluster
    match:
        conditions:
            - cmp_ne(path(resource, "encrypted"), true)
        conditionFormat: cel
    remediation:
        summary: Enable encryption for the Redshift cluster using KMS.
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: CIS AWS Foundations Benchmark v2.0
          controls:
            - 2.3.2
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
        - name: CIS Controls v8
          controls:
            - "3"
    mitreAttack:
        - tactic: Collection
          technique: T1530
