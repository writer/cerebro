apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: api-shadow-endpoint-detected
    name: API Shadow Endpoint Detected
    description: "API Shadow Endpoint Detected policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - api
        - shadow-api
        - inventory
        - generated
        - shadow
spec:
    severity: medium
    effect: forbid
    resource: "api::endpoint"
    match:
        conditions:
            - "cmp_ne(path(resource, \"shadow_endpoint_detected_compliant\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore shadow endpoint detected controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - ACCESS_CONTROL
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
            - CC7.1
        - name: "ISO 27001:2022"
          controls:
            - A.8.20
            - A.8.21
            - A.8.28
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - AC-4
            - SC-7
