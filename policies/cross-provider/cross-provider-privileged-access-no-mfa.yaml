apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: cross-provider-privileged-access-no-mfa
    name: Privileged Access Without MFA
    description: User with administrative privileges in any cloud provider does not have MFA enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cross-provider
        - identity
        - privileged-access
        - mfa
spec:
    severity: critical
    effect: forbid
    resource: cross_provider::identity_cluster
    match:
        conditions:
            - cmp_eq(path(resource, "has_admin_role"), true)
            - cmp_eq(path(resource, "mfa_enabled_count"), 0)
        conditionFormat: cel
    remediation:
        summary: Immediately enable MFA for all accounts with administrative access. Consider using hardware security keys for privileged accounts. Implement just-in-time access for admin roles.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "7.2"
        - name: CIS Controls v8
          controls:
            - "6"
            - "5"
        - name: SOC 2
          controls:
            - CC6
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
