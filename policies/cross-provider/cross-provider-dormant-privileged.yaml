apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: cross-provider-dormant-privileged
    name: Dormant Account with Privileged Access
    description: User has not logged in for 90+ days but still has administrative access across providers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cross-provider
        - identity
        - privileged-access
        - hygiene
spec:
    severity: high
    effect: forbid
    resource: cross_provider::identity_cluster
    match:
        conditions:
            - cmp_eq(path(resource, "has_admin_role"), true)
            - cmp_gt(path(resource, "last_login_days_ago"), 90)
        conditionFormat: cel
    remediation:
        summary: Review dormant privileged accounts. Remove admin access if no longer needed. Disable accounts for users who have left. Implement access certification reviews.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
