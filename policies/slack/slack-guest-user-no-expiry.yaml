apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: slack-guest-user-no-expiry
    name: Slack Guest User No Expiry
    description: "Slack Guest User No Expiry policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - slack
        - guest-user
        - expiry
        - generated
        - guest
spec:
    severity: medium
    effect: forbid
    resource: "slack::user"
    match:
        conditions:
            - "cmp_ne(path(resource, \"guest_user_no_expiry_compliant\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore guest user no expiry controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - ACCESS_CONTROL
        - DATA_EXPOSURE
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
            - CC7.1
        - name: "ISO 27001:2022"
          controls:
            - A.5.15
            - A.5.18
            - A.8.12
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-3
            - AU-2
