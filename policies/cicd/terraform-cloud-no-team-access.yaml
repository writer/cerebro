apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: terraform-cloud-no-team-access-control
    name: Terraform Cloud Workspace Without Team Access Control
    description: Terraform Cloud workspace lacks team-based access control
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cicd
        - terraform
        - iac
        - access-control
spec:
    severity: medium
    effect: forbid
    resource: terraform::workspace
    match:
        conditions:
            - (cmp_eq(path(resource, "team_access"), null)) || (cmp_eq(path(resource, "team_access.length"), 0))
        conditionFormat: cel
    remediation:
        summary: Configure team access permissions for the Terraform Cloud workspace.
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
