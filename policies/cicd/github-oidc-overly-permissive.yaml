apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: github-oidc-overly-permissive
    name: GitHub Actions OIDC Overly Permissive
    description: AWS IAM role trust policy for GitHub OIDC allows any repository or branch
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cicd
        - github-actions
        - oidc
        - iam
        - supply-chain
spec:
    severity: critical
    effect: forbid
    resource: aws::iam::role
    match:
        conditions:
            - contains_value(path(resource, "assume_role_policy"), "token.actions.githubusercontent.com")
            - (contains_value(path(resource, "assume_role_policy"), "sub' == '*")) || (!(contains_value(path(resource, "assume_role_policy"), "repo:")))
        conditionFormat: cel
    remediation:
        summary: Restrict the OIDC trust policy to specific repositories and branches using the sub condition.
    riskCategories:
        - IDENTITY_RISK
        - LATERAL_MOVEMENT
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Lateral Movement
          technique: T1021
