apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-codebuild-plaintext-secrets
    name: AWS CodeBuild Plaintext Secrets
    description: CodeBuild project has secrets in plaintext environment variables
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cicd
        - codebuild
        - secrets
        - credentials
spec:
    severity: critical
    effect: forbid
    resource: aws::codebuild::project
    match:
        conditions:
            - 'matches_value(path(resource, "environment.environment_variables contains { type: ''PLAINTEXT'', name"), "(?i)(secret|password|token|key|api_key)'' }")'
        conditionFormat: cel
    remediation:
        summary: Use SECRETS_MANAGER or PARAMETER_STORE type for sensitive environment variables.
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Execution
          technique: T1059
        - tactic: Credential Access
          technique: T1552
