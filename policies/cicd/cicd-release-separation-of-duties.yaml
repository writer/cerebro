apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: cicd-release-separation-of-duties
    name: Cicd Release Separation Of Duties
    description: "Cicd Release Separation Of Duties policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cicd
        - release
        - separation-of-duties
        - generated
spec:
    severity: medium
    effect: forbid
    resource: "cicd::release"
    match:
        conditions:
            - "cmp_ne(path(resource, \"release_separation_of_duties_compliant\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore release separation of duties controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - SUPPLY_CHAIN
        - CHANGE_CONTROL
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC7.1
            - CC8.1
        - name: "ISO 27001:2022"
          controls:
            - A.8.8
            - A.8.25
            - A.8.32
        - name: NIST 800-53 r5
          controls:
            - SA-10
            - SA-15
            - SR-4
