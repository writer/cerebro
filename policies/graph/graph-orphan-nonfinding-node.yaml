apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: graph-orphan-nonfinding-node
    name: Graph Orphan Non-Finding Node
    description: Detect durable non-finding graph nodes with no relationships, indicating source projection or enrichment gaps while ignoring intentionally standalone inventory streams.
    tags:
        - graph
        - graph-backed
        - graph-hygiene
        - orphan
        - enrichment
    references:
        - https://www.iso.org/standard/27001
spec:
    severity: LOW
    category: graph
    resourceType: graph entity
    remediation:
        summary: Review the source projection for the entity type and add ownership, source, identity, or resource relations where appropriate.
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
        - name: ISO 27001:2022
          controls:
            - A.5.35
    input:
        sourceKinds:
            - graph
        eventKinds:
            - graph
    evidence:
        type: graph_state
        assessmentMethods:
            - examine
        fingerprintFields:
            - orphan_urn
    audit:
        evidenceType: graph_state
        assessmentMethods:
            - examine
        auditorStatement: Durable graph entities should have meaningful relationships unless they are intentionally inventory-only.
        riskStatement: Orphan durable graph nodes can hide projection gaps and weaken graph-backed finding context.
        remediationIntent: Add the missing projection relationship or document why the entity should remain standalone inventory.
        falsePositives:
            - Some source records may intentionally be inventory-only and not yet connected to the rest of the graph.
            - Panopticon alerts/cases, SentinelOne installed applications, and Cosmo session/fact records are currently intentionally standalone inventory and are excluded from this broad hygiene check.
    verification:
        fixtures:
            - name: orphan graph entity
              expect: finding
              description: A projected non-finding graph entity with no relationships is returned as the primary finding asset.
            - name: related graph entity
              expect: pass
              description: A projected non-finding graph entity with at least one relationship is not returned.
        mutationChecks:
            - add_graph_relationship
            - mark_inventory_only_exception
        remediationCheck:
            rerunAfter: 1h
            expectedStatus: closed
    graph:
        query: |-
            MATCH (entity:Entity {tenant_id: $tenant_id})
            WHERE entity.entity_type <> 'finding'
              AND NOT (coalesce(entity.entity_type, '') IN [
                'cosmo.fact',
                'cosmo.session',
                'panopticon.alert',
                'panopticon.case',
                'sentinelone.installed_application'
              ])
              AND NOT (entity)-[:RELATION]-()
            RETURN entity.urn AS primary_urn,
                   entity.label AS primary_label,
                   entity.entity_type AS primary_type,
                   entity.urn AS fingerprint_key,
                   'LOW' AS severity,
                   'Graph entity ' + coalesce(entity.label, entity.urn) + ' has no relationships' AS summary,
                   'Add projection relationships or document why the entity is intentionally inventory-only' AS action,
                   [entity.urn] AS resource_urns,
                   [] AS evidence
            ORDER BY entity.entity_type, entity.label, entity.urn
            LIMIT $row_limit
        rowLimit: 500
        requiredColumns:
            - primary_urn
            - fingerprint_key
            - summary
            - resource_urns
