apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-resource-limits
    name: Container Resource Limits Set
    description: Ensures containers have CPU and memory limits defined
    tags:
        - container
        - resources
        - limits
        - kubernetes
spec:
    severity: MEDIUM
    category: container
    resourceType: container
    match:
        query: SELECT id, name, image, namespace, cpu_limit, memory_limit FROM containers WHERE cpu_limit IS NULL OR memory_limit IS NULL
    remediation:
        summary: Define resource limits for all containers to prevent resource exhaustion and noisy neighbor issues.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.6
            - CC7.1
        - name: ISO 27001:2022
          controls:
            - A.8.9
            - A.8.20
        - name: NIST 800-53 r5
          controls:
            - AC-6
            - CM-6
            - SC-7
        - name: CIS Controls v8
          controls:
            - "4"
            - "12"
            - "13"
        - name: PCI DSS v4.0.1
          controls:
            - "2.2"
            - "7.2"
    enabled: true
