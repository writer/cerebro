apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-privileged
    name: Container Privileged Mode Disabled
    description: Ensures containers are not running in privileged mode
    tags:
        - container
        - privileged
        - security
        - kubernetes
spec:
    severity: CRITICAL
    category: container
    resourceType: container
    match:
        query: SELECT id, name, image, namespace, privileged FROM containers WHERE privileged = true
    remediation:
        summary: Disable privileged mode for containers. Use specific capabilities instead of full privileged access.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
            - CC7.1
        - name: ISO 27001:2022
          controls:
            - A.5.15
            - A.5.18
            - A.8.9
            - A.8.20
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - CM-6
            - SC-7
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
            - "4"
            - "12"
            - "13"
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "2.2"
    enabled: true
