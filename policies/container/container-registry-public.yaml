apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-registry-public
    name: Container Registry Public
    description: "Container Registry Public policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - container
        - registry
        - public-access
        - generated
spec:
    severity: high
    effect: forbid
    resource: container_registry
    match:
        conditions:
            - "cmp_eq(path(resource, \"registry_public\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore registry public controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - WORKLOAD_HARDENING
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC7.1
        - name: "ISO 27001:2022"
          controls:
            - A.8.8
            - A.8.9
            - A.8.25
        - name: NIST 800-53 r5
          controls:
            - CM-6
            - SI-2
            - SI-7
