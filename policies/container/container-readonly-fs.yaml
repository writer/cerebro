apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-readonly-fs
    name: Container Read-Only Filesystem
    description: Ensures container root filesystems are mounted read-only where possible
    tags:
        - container
        - filesystem
        - readonly
        - security
        - kubernetes
spec:
    severity: MEDIUM
    category: container
    resourceType: container
    match:
        query: SELECT id, name, image, namespace, read_only_root_filesystem FROM containers WHERE read_only_root_filesystem = false AND environment = 'production'
    remediation:
        summary: 'Set readOnlyRootFilesystem: true in security context. Use emptyDir volumes for writable paths.'
    frameworks:
        - name: SOC 2
          controls:
            - CC6.6
            - CC7.1
        - name: ISO 27001:2022
          controls:
            - A.8.9
            - A.8.20
        - name: NIST 800-53 r5
          controls:
            - AC-6
            - CM-6
            - SC-7
        - name: CIS Controls v8
          controls:
            - "4"
            - "12"
            - "13"
        - name: PCI DSS v4.0.1
          controls:
            - "2.2"
            - "7.2"
    enabled: true
