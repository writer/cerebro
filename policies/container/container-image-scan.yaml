apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-image-scan
    name: Container Image Vulnerability Scan
    description: Ensures container images are scanned for vulnerabilities before deployment
    tags:
        - container
        - image
        - vulnerability
        - scan
        - security
spec:
    severity: HIGH
    category: container
    resourceType: container_image
    match:
        query: SELECT id, image, tag, last_scan_date, critical_vulns, high_vulns FROM container_images WHERE last_scan_date IS NULL OR last_scan_date < NOW() - INTERVAL '7 days'
    remediation:
        summary: Integrate container image scanning into CI/CD pipeline. Block images with critical vulnerabilities.
    frameworks:
        - name: SOC 2
          controls:
            - CC1.1
        - name: PCI DSS v4.0
          controls:
            - "1.1"
        - name: NIST 800-53 r5
          controls:
            - AC-1
    enabled: true
