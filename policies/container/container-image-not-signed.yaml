apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-image-not-signed
    name: Container Image Not Signed
    description: "Container Image Not Signed policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - container
        - signing
        - generated
        - image
spec:
    severity: medium
    effect: forbid
    resource: container_image
    match:
        conditions:
            - "cmp_ne(path(resource, \"image_not_signed\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore image not signed controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - WORKLOAD_HARDENING
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC7.1
        - name: "ISO 27001:2022"
          controls:
            - A.8.8
            - A.8.9
            - A.8.25
        - name: NIST 800-53 r5
          controls:
            - CM-6
            - SI-2
            - SI-7
