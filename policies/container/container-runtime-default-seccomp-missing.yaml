apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-runtime-default-seccomp-missing
    name: Container Runtime Default Seccomp Missing
    description: "Container Runtime Default Seccomp Missing policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - container
        - seccomp
        - runtime
        - generated
spec:
    severity: medium
    effect: forbid
    resource: container
    match:
        conditions:
            - "cmp_eq(path(resource, \"runtime_default_seccomp_missing\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore runtime default seccomp missing controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - WORKLOAD_HARDENING
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC7.1
        - name: "ISO 27001:2022"
          controls:
            - A.8.8
            - A.8.9
            - A.8.25
        - name: NIST 800-53 r5
          controls:
            - CM-6
            - SI-2
            - SI-7
