apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-host-network
    name: Container Host Network Disabled
    description: Ensures containers do not use host network namespace
    tags:
        - container
        - network
        - host
        - isolation
        - kubernetes
spec:
    severity: HIGH
    category: container
    resourceType: container
    match:
        query: SELECT id, name, image, namespace, host_network FROM containers WHERE host_network = true
    remediation:
        summary: Disable host network mode for containers. Use Kubernetes services for networking.
    frameworks:
        - name: SOC 2
          controls:
            - CC6.6
            - CC7.1
        - name: ISO 27001:2022
          controls:
            - A.8.20
            - A.8.22
            - A.8.9
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - AC-4
            - SC-7
            - AC-6
            - CM-6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "4"
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "2.2"
            - "7.2"
    enabled: true
