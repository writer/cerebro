apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: okta-user-mfa-disabled
    name: Okta User Without MFA Enrolled
    description: Okta user does not have any multi-factor authentication methods enrolled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - okta
        - authentication
        - mfa
        - identity
spec:
    severity: high
    effect: forbid
    resource: okta::user
    match:
        conditions:
            - cmp_eq(path(resource, "status"), "ACTIVE")
            - cmp_eq(path(resource, "mfa_factors_count"), 0)
        conditionFormat: cel
    remediation:
        summary: Enroll the user in MFA. Configure authentication policies to require MFA enrollment. Use Okta's self-service MFA enrollment.
    riskCategories:
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
        - name: CIS Controls v8
          controls:
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
