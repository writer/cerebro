apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: okta-password-policy-weak
    name: Okta Password Policy Does Not Meet Standards
    description: Okta password policy does not enforce sufficient complexity requirements
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - okta
        - authentication
        - password-policy
        - cis
spec:
    severity: medium
    effect: forbid
    resource: okta::policy::password
    match:
        conditions:
            - (cmp_lt(path(resource, "settings.password.complexity.min_length"), 12)) || (cmp_gt(path(resource, "settings.password.age.max_age_days"), 365)) || (cmp_gt(path(resource, "settings.password.lockout.max_attempts"), 10))
        conditionFormat: cel
    remediation:
        summary: 'Update password policy: minimum 12 characters, lockout after 5-10 attempts, reasonable password age. Consider passwordless authentication with WebAuthn.'
    riskCategories:
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
        - name: CIS Controls v8
          controls:
            - "6"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
