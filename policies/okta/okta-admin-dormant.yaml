apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: okta-admin-dormant
    name: Okta Dormant Admin Account
    description: Okta admin account has not logged in for over 90 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - okta
        - identity
        - privileged-access
        - hygiene
spec:
    severity: medium
    effect: forbid
    resource: okta::user
    match:
        conditions:
            - cmp_eq(path(resource, "is_admin"), true)
            - cmp_gt(path(resource, "last_login_days_ago"), 90)
        conditionFormat: cel
    remediation:
        summary: Review the admin account. Remove admin privileges if no longer needed. Deactivate the account if the user has left the organization.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
