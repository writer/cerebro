apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: okta-suspicious-login
    name: Okta Suspicious Login Detected
    description: Login from unusual location, impossible travel, or anomalous behavior pattern detected
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - okta
        - identity
        - threat-detection
        - anomaly
spec:
    severity: high
    effect: forbid
    resource: okta::system_log
    match:
        conditions:
            - cmp_eq(path(resource, "event_type"), "user.session.start")
            - (cmp_eq(path(resource, "security_context.is_proxy"), true)) || (cmp_eq(path(resource, "geographic_context.impossible_travel"), true)) || (cmp_gt(path(resource, "behavior_detection.anomaly_score"), 0.8))
        conditionFormat: cel
    remediation:
        summary: Investigate the login event. Verify with the user. Consider forcing password reset and MFA re-enrollment. Review session for suspicious activity.
    riskCategories:
        - IDENTITY_RISK
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
            - CC7.2
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.5.24
            - A.5.25
            - A.8.16
        - name: NIST 800-53 r5
          controls:
            - IR-4
            - SI-4
        - name: CIS Controls v8
          controls:
            - "8"
