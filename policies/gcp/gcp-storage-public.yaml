apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-storage-bucket-no-public
    name: GCP Storage Bucket Public Access
    description: GCP Storage buckets should not be publicly accessible
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-5.1
        - security
        - storage
        - data-exposure
spec:
    severity: critical
    effect: forbid
    resource: gcp::storage::bucket
    match:
        conditions:
            - cmp_eq(path(resource, "iam_policy_public"), true)
        conditionFormat: cel
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
