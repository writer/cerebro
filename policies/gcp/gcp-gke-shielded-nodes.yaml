apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-gke-shielded-nodes
    name: GKE Shielded Nodes Enabled
    description: GKE clusters should have Shielded GKE Nodes enabled to protect against rootkit and bootkit attacks
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gke
        - kubernetes
        - shielded-nodes
        - secure-boot
spec:
    severity: medium
    effect: forbid
    resource: gcp_container_clusters
    match:
        conditions:
            - cmp_ne(path(resource, "shielded_nodes.enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable Shielded GKE Nodes on the cluster
        steps:
            - 'For existing clusters: gcloud container clusters update CLUSTER_NAME --enable-shielded-nodes'
            - 'For new clusters: gcloud container clusters create CLUSTER_NAME --enable-shielded-nodes'
            - Existing nodes will be recreated with shielded node features
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS GKE Benchmark v1.4
          controls:
            - 5.5.1
        - name: NIST 800-53 r5
          controls:
            - SI-7
