apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-compute-no-public-ip
    name: Compute Instance Public IP
    description: Compute instances should not have public IP addresses unless required
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-4.9
        - compute
        - network
        - public-ip
spec:
    severity: high
    effect: forbid
    resource: gcp::compute::instance
    match:
        conditions:
            - cmp_ne(path(resource, "network_interfaces.access_configs"), null)
            - cmp_ne(path(resource, "labels.allow_public_ip"), "true")
        conditionFormat: cel
    remediation:
        summary: Remove external IP addresses from compute instances. Use Cloud NAT for outbound internet access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
