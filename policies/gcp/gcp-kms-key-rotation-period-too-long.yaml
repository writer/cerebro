apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-kms-key-rotation-period-too-long
    name: GCP KMS Key Rotation Period Too Long
    description: "GCP KMS Key Rotation Period Too Long policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - kms
        - rotation
        - generated
spec:
    severity: medium
    effect: forbid
    resource: "gcp::kms::crypto_key"
    match:
        conditions:
            - "cmp_gt(path(resource, \"kms_key_rotation_period_too_long\"), path(resource, \"approved_threshold\"))"
        conditionFormat: cel
    remediation:
        summary: "Restore kms key rotation period too long controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - CLOUD_MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC6.1
            - CC7.1
            - CC8.1
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - CM-6
            - SI-4
        - name: CIS Controls v8
          controls:
            - "4"
            - "6"
            - "8"
