apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-gke-private-cluster
    name: GKE Private Cluster
    description: GKE clusters should be private with no public endpoint
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gke-6.6.2
        - gke
        - kubernetes
        - network
spec:
    severity: high
    effect: forbid
    resource: gcp::container::cluster
    match:
        conditions:
            - cmp_ne(path(resource, "private_cluster_config.enable_private_endpoint"), true)
        conditionFormat: cel
    remediation:
        summary: Enable private endpoint and use Cloud IAP or VPN for cluster access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
