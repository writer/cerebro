apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-sql-backup-enabled
    name: GCP Cloud SQL Backup Enabled
    description: Cloud SQL instances should have automated backups enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-6.7
        - cloudsql
        - database
        - backup
spec:
    severity: medium
    effect: forbid
    resource: gcp::sql::database_instance
    match:
        conditions:
            - cmp_ne(path(resource, "settings.backup_configuration.enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable automated backups in the Cloud SQL instance settings.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - A1.1
            - A1.2
            - A1.3
        - name: ISO 27001:2022
          controls:
            - A.5.30
            - A.8.13
            - A.8.14
        - name: NIST 800-53 r5
          controls:
            - CP-9
            - CP-10
            - CP-2
            - CP-4
        - name: CIS Controls v8
          controls:
            - "11"
    mitreAttack:
        - tactic: Collection
          technique: T1530
