apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-compute-public-ssh
    name: GCP Instance Public IP with SSH Exposed
    description: GCP Compute instance has external IP with firewall allowing SSH from 0.0.0.0/0
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-3.6
        - exposure
        - compute
        - network
        - ssh
spec:
    severity: critical
    effect: forbid
    resource: gcp::compute::instance
    match:
        conditions:
            - cmp_ne(path(resource, "network_interfaces.access_configs"), null)
            - contains_value(path(resource, "firewall_rules.allowed.ports"), "22")
            - contains_value(path(resource, "firewall_rules.source_ranges"), "0.0.0.0/0")
        conditionFormat: cel
    remediation:
        summary: Remove external IP or restrict firewall rules. Use IAP for TCP forwarding for secure access.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
