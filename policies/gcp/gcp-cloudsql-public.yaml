apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-cloudsql-no-public-ip
    name: Cloud SQL Public IP
    description: Cloud SQL instances should not have public IP addresses
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-6.2
        - cloudsql
        - database
        - network
spec:
    severity: high
    effect: forbid
    resource: gcp::sql::database_instance
    match:
        conditions:
            - cmp_eq(path(resource, "ip_addresses.type"), "PRIMARY")
        conditionFormat: cel
    remediation:
        summary: Configure Cloud SQL to use private IP only. Use Cloud SQL Proxy for secure connections.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
