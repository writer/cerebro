apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-iam-sa-no-admin-privileges
    name: GCP Service Account No Admin Privileges
    description: Service accounts should not have Owner or Editor roles at project level
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-1.5
        - iam
        - service-account
        - least-privilege
spec:
    severity: high
    effect: forbid
    resource: gcp::iam::service_account
    match:
        conditions:
            - (contains_value(path(resource, "roles"), "roles/owner")) || (contains_value(path(resource, "roles"), "roles/editor"))
        conditionFormat: cel
    remediation:
        summary: Replace Owner/Editor with more specific roles following least privilege principle.
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
