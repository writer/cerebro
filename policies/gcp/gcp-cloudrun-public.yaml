apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-cloudrun-public-ingress
    name: Cloud Run Service Allows Public Internet Access
    description: Cloud Run service is configured to allow ingress from all sources including the public internet
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - cloudrun
        - serverless
        - exposure
        - network
spec:
    severity: medium
    effect: forbid
    resource: gcp::cloudrun::service
    match:
        conditions:
            - cmp_eq(path(resource, "ingress"), "INGRESS_TRAFFIC_ALL")
        conditionFormat: cel
    remediation:
        summary: Configure ingress settings to restrict traffic to internal sources only or use IAP/Cloud Armor for authentication. Set ingress to 'INGRESS_TRAFFIC_INTERNAL_ONLY' or 'INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER'.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - SC-7
            - AC-3
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
        - name: SOC 2
          controls:
            - CC6.6
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
