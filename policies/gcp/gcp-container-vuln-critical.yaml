apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-container-vuln-critical
    name: GCP Container Critical Vulnerabilities Addressed
    description: Ensures critical vulnerabilities in GCP container images are remediated within SLA (7 days)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - container
        - vulnerability
        - critical
        - sla
        - compliance
spec:
    severity: critical
    effect: forbid
    resource: gcp_container_vulnerabilities
    match:
        conditions:
            - cmp_eq(path(resource, "severity"), "CRITICAL")
            - cmp_eq(path(resource, "state"), "ACTIVE")
            - cmp_lt(path(resource, "discovered_at"), "NOW() - INTERVAL '7 days'")
        conditionFormat: cel
    remediation:
        summary: Update container images to address critical vulnerabilities. Rebuild and redeploy containers with patched base images.
        steps:
            - Identify affected container images in GCR/Artifact Registry
            - Review vulnerability details in Container Analysis
            - Update base images or application dependencies
            - Rebuild container images
            - Deploy updated images to GKE clusters
    riskCategories:
        - VULNERABLE_WORKLOAD
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
        - name: PCI DSS v4.0
          controls:
            - 6.3.1
            - 11.3.1
        - name: NIST 800-53 r5
          controls:
            - RA-5
            - SI-2
