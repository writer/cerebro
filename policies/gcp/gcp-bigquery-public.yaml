apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-bigquery-public
    name: BigQuery Dataset Publicly Accessible
    description: BigQuery dataset grants access to allUsers or allAuthenticatedUsers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - bigquery
        - data-exposure
        - public-access
spec:
    severity: critical
    effect: forbid
    resource: gcp::bigquery::dataset
    match:
        conditions:
            - list_value(path(resource, "access")).exists(item, in_list(path(item, "special_group"), ["allUsers","allAuthenticatedUsers"]))
        conditionFormat: cel
    remediation:
        summary: Remove allUsers and allAuthenticatedUsers from dataset access. Grant access to specific users, groups, or service accounts.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
