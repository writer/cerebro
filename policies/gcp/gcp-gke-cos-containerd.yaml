apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-gke-cos-containerd
    name: GKE Nodes Use Container-Optimized OS
    description: GKE node pools should use Container-Optimized OS with containerd (cos_containerd) for optimal security and performance
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gke
        - kubernetes
        - node-pools
        - cos
        - containerd
spec:
    severity: low
    effect: forbid
    resource: gcp_container_node_pools
    match:
        conditions:
            - cmp_ne(path(resource, "config.image_type"), path(resource, "COS_CONTAINERD"))
        conditionFormat: cel
    remediation:
        summary: Update the node pool to use COS_CONTAINERD image type
        steps:
            - Create a new node pool with image type cos_containerd
            - Migrate workloads to the new node pool
            - Delete the old node pool
            - 'Note: Image type cannot be changed on existing node pools'
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS GKE Benchmark v1.4
          controls:
            - 5.5.4
