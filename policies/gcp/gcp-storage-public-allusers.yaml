apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-storage-no-public-allusers
    name: GCP Storage No Public allUsers Access
    description: Cloud Storage buckets should not grant access to allUsers (public)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-5.1
        - storage
        - data-exposure
        - public-access
spec:
    severity: critical
    effect: forbid
    resource: gcp::storage::bucket
    match:
        conditions:
            - contains_value(path(resource, "iam_policy.bindings.members"), "allUsers")
        conditionFormat: cel
    remediation:
        summary: Remove allUsers binding from bucket IAM policy.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
