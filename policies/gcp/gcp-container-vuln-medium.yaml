apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-container-vuln-medium
    name: GCP Container Medium Vulnerabilities Addressed
    description: Ensures medium vulnerabilities in GCP container images are remediated within SLA (30 days)
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - container
        - vulnerability
        - medium
        - sla
        - compliance
spec:
    severity: medium
    effect: forbid
    resource: gcp_container_vulnerabilities
    match:
        conditions:
            - cmp_eq(path(resource, "severity"), "MEDIUM")
            - cmp_eq(path(resource, "state"), "ACTIVE")
            - cmp_lt(path(resource, "discovered_at"), "NOW() - INTERVAL '30 days'")
        conditionFormat: cel
    remediation:
        summary: Update container images to address medium vulnerabilities within 30 days of discovery.
    riskCategories:
        - VULNERABLE_WORKLOAD
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
        - name: NIST 800-53 r5
          controls:
            - RA-5
            - SI-2
