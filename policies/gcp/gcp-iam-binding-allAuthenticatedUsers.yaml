apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-iam-binding-no-allAuthenticatedUsers
    name: GCP IAM Binding No allAuthenticatedUsers
    description: IAM bindings should not grant roles to allAuthenticatedUsers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-1.2
        - iam
        - overly-permissive
        - least-privilege
spec:
    severity: high
    effect: forbid
    resource: gcp::iam::policy
    match:
        conditions:
            - contains_value(path(resource, "bindings.members"), "allAuthenticatedUsers")
        conditionFormat: cel
    remediation:
        summary: Remove allAuthenticatedUsers and grant access to specific identities or groups.
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
