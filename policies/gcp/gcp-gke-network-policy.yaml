apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-gke-network-policy-enabled
    name: GKE Network Policy Enabled
    description: GKE clusters should have network policy enabled to control traffic flow between pods and implement microsegmentation
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gke
        - kubernetes
        - network-policy
        - microsegmentation
spec:
    severity: medium
    effect: forbid
    resource: gcp_container_clusters
    match:
        conditions:
            - cmp_ne(path(resource, "network_policy.enabled"), true)
        conditionFormat: cel
    remediation:
        summary: 'Enable network policy on the GKE cluster. Note: This requires recreating node pools'
        steps:
            - 'For existing clusters: gcloud container clusters update CLUSTER_NAME --update-addons=NetworkPolicy=ENABLED'
            - 'For new clusters: gcloud container clusters create CLUSTER_NAME --enable-network-policy'
            - Create NetworkPolicy resources to define allowed traffic flows
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: CIS GKE Benchmark v1.4
          controls:
            - 5.6.3
        - name: NIST 800-53 r5
          controls:
            - AC-4
            - SC-7
        - name: SOC 2
          controls:
            - CC6.6
