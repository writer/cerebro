apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-kms-public
    name: KMS Key Publicly Accessible
    description: Cloud KMS key grants access to allUsers or allAuthenticatedUsers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - kms
        - encryption
        - public-access
        - data-protection
spec:
    severity: critical
    effect: forbid
    resource: gcp::kms::crypto_key
    match:
        conditions:
            - list_value(path(resource, "iam_policy.bindings")).exists(item, (contains_value(path(item, "members"), "allUsers")) || (contains_value(path(item, "members"), "allAuthenticatedUsers")))
        conditionFormat: cel
    remediation:
        summary: Remove allUsers and allAuthenticatedUsers from KMS key IAM policy. Grant access to specific principals only.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - SC-12
            - SC-13
            - SC-28
            - AC-2
            - AC-6
            - IA-5
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "3.5"
            - "4.2"
            - "7.2"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "3"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Credential Access
          technique: T1552
        - tactic: Collection
          technique: T1530
