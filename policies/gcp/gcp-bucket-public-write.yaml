apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-bucket-public-write
    name: GCS Bucket Allows Public Write Access
    description: Cloud Storage bucket grants write permissions to allUsers or allAuthenticatedUsers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - storage
        - public-access
        - data-integrity
spec:
    severity: critical
    effect: forbid
    resource: gcp::storage::bucket
    match:
        conditions:
            - (list_value(path(resource, "iam_policy.bindings")).exists(item, (contains_value(path(item, "members"), "allUsers")) || (contains_value(path(item, "members"), "allAuthenticatedUsers")))) && (in_list(path(resource, "role"), ["roles/storage.objectCreator","roles/storage.objectAdmin","roles/storage.admin"]))
        conditionFormat: cel
    remediation:
        summary: Remove public write access immediately. Grant write access only to specific service accounts or users. Enable object versioning for recovery.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
