apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-gke-secrets-kms-encryption
    name: GKE Secrets Encrypted with Cloud KMS
    description: GKE clusters should use Cloud KMS keys to encrypt Kubernetes secrets at the application layer for enhanced security
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gke
        - kubernetes
        - secrets
        - kms
        - encryption
spec:
    severity: high
    effect: forbid
    resource: gcp_container_clusters
    match:
        conditions:
            - cmp_ne(path(resource, "database_encryption.state"), path(resource, "ENCRYPTED"))
        conditionFormat: cel
    remediation:
        summary: Enable application-layer secrets encryption using a Cloud KMS key
        steps:
            - Create a Cloud KMS key ring and key if not exists
            - Grant the GKE service account access to use the key
            - 'Update the cluster: gcloud container clusters update CLUSTER_NAME --database-encryption-key=projects/PROJECT/locations/LOCATION/keyRings/RING/cryptoKeys/KEY'
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: CIS GKE Benchmark v1.4
          controls:
            - 5.3.1
        - name: NIST 800-53 r5
          controls:
            - SC-28
            - SC-12
        - name: SOC 2
          controls:
            - CC6.1
        - name: PCI DSS v4.0.1
          controls:
            - 3.5.1
