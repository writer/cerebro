apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-compute-serial-port-disabled
    name: GCP Compute Serial Port Disabled
    description: Compute instances should have serial port access disabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-4.5
        - compute
        - security
spec:
    severity: medium
    effect: forbid
    resource: gcp::compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "metadata.serial-port-enable"), "true")
        conditionFormat: cel
    remediation:
        summary: Set metadata key 'serial-port-enable' to 'false' or remove the key.
    riskCategories:
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Defense Evasion
          technique: T1562
