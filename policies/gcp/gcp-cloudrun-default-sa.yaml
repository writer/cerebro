apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-cloudrun-default-service-account
    name: Cloud Run Service Using Default Compute Service Account
    description: Cloud Run services using the default compute service account have excessive privileges and pose a security risk
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - cloudrun
        - serverless
        - iam
        - least-privilege
spec:
    severity: high
    effect: forbid
    resource: gcp::cloudrun::revision
    match:
        conditions:
            - contains_value(path(resource, "service_account"), "compute@developer.gserviceaccount.com")
        conditionFormat: cel
    remediation:
        summary: Create a dedicated service account with minimal required permissions for the Cloud Run service. Update the service to use the dedicated service account instead of the default compute service account.
    riskCategories:
        - UNPROTECTED_PRINCIPAL
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-6
            - AC-2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: SOC 2
          controls:
            - CC6
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
