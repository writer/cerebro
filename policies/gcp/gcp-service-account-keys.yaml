apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-service-account-key-rotation
    name: Service Account Key Rotation
    description: Service account keys should be rotated within 90 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - cis-gcp-1.7
        - iam
        - service-account
        - key-rotation
spec:
    severity: medium
    effect: forbid
    resource: gcp::iam::service_account_key
    match:
        conditions:
            - cmp_eq(path(resource, "key_type"), "USER_MANAGED")
            - cmp_lt(path(resource, "valid_after_time"), "now() - 90d")
        conditionFormat: cel
    remediation:
        summary: Rotate service account keys every 90 days. Consider using workload identity instead of keys.
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Credential Access
          technique: T1552
