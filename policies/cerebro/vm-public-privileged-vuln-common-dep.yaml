apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-public-privileged-vuln-common-dep
    name: Publicly exposed VM/serverless with high privileges and initial access vulnerabilities affecting a common dependency
    description: A privileged public resource has vulnerabilities in a common dependency
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - vulnerability
        - dependency
        - privileged
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - (cmp_eq(path(resource, "service_account.has_high_privilege"), true)) || (cmp_eq(path(resource, "attached_role.has_high_privilege"), true))
            - list_value(path(resource, "vulnerabilities")).exists(item, (in_list(path(item, "severity"), ["CRITICAL","HIGH"])) && (cmp_eq(path(item, "initial_access"), true)) && (cmp_eq(path(item, "is_common_dependency"), true)))
        conditionFormat: cel
    remediation:
        summary: Patch immediately. Reduce privileges. This is a critical combined risk.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - VULNERABILITY
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Privilege Escalation
          technique: T1078
