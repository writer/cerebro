apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: sa-inactive-privileged
    name: Service account with high privileges is inactive for over 90 days
    description: A service account with high privileges has been inactive for over 90 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - dormant
        - privileged
        - service-account
spec:
    severity: high
    effect: forbid
    resource: iam::service_account
    match:
        conditions:
            - cmp_eq(path(resource, "has_high_privilege"), true)
            - cmp_gt(path(resource, "last_activity_days_ago"), 90)
        conditionFormat: cel
    remediation:
        summary: Review and disable or delete unused service accounts. If still needed, reduce privileges to minimum required.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
