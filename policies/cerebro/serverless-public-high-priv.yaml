apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: serverless-public-high-priv
    name: Publicly exposed serverless with high privileges
    description: A publicly exposed serverless function has high privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - serverless
        - high-privilege
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - cmp_eq(path(resource, "execution_role.has_high_privilege"), true)
        conditionFormat: cel
    remediation:
        summary: Reduce function privileges to minimum required. Add authentication. Consider using API Gateway with authorization.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Execution
          technique: T1059
        - tactic: Privilege Escalation
          technique: T1078
