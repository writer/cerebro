apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: group-excessive-data-priv
    name: Group with excessive data privileges
    description: A group has excessive data access privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - group
        - data-access
        - excessive-privilege
spec:
    severity: high
    effect: forbid
    resource: iam::group
    match:
        conditions:
            - (cmp_eq(path(resource, "data_access_scope"), "all")) || (cmp_gt(path(resource, "data_access_resource_count"), 100))
        conditionFormat: cel
    remediation:
        summary: Reduce group data access scope. Implement data classification and need-to-know access controls.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Collection
          technique: T1530
