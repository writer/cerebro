apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-public-data-access
    name: Publicly exposed VM/serverless with data access to sensitive data
    description: A publicly exposed compute resource has access to sensitive data
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - public-exposure
        - data-access
spec:
    severity: critical
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - (cmp_eq(path(resource, "service_account.has_sensitive_data_access"), true)) || (cmp_eq(path(resource, "attached_role.has_sensitive_data_access"), true))
        conditionFormat: cel
    remediation:
        summary: Remove public access or remove data access. Implement network segmentation.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
