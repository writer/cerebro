apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: internal-vm-cross-account-keys
    name: Internal VM/serverless with cleartext cloud keys granting permission to access resources in other subscriptions with high privileges
    description: An internal resource contains highly privileged cross-account access keys
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - secrets
        - cross-account
        - privileged
spec:
    severity: high
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "cloud_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "cross_account_access"), true)) && (cmp_eq(path(item, "grants_high_privilege"), true)))
        conditionFormat: cel
    remediation:
        summary: Remove cleartext keys. Use cross-account IAM roles with proper trust relationships.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Credential Access
          technique: T1552
        - tactic: Lateral Movement
          technique: T1021
