apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: data-resource-excessive-access
    name: Data resource with sensitive data has excessive access permissions
    description: A data resource with sensitive data has overly broad access permissions
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - data
        - excessive-access
        - sensitive-data
spec:
    severity: high
    effect: forbid
    resource: storage::bucket|database::instance|storage::blob_container
    match:
        conditions:
            - cmp_eq(path(resource, "has_sensitive_data"), true)
            - (cmp_gt(path(resource, "iam_policy.principals_count"), 20)) || (cmp_eq(path(resource, "iam_policy.allows_any_authenticated_user"), true))
        conditionFormat: cel
    remediation:
        summary: Reduce access to minimum required. Implement need-to-know access controls for sensitive data.
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Collection
          technique: T1530
