apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: bucket-public-low-exposure
    name: Publicly readable non-empty bucket with low exposure level
    description: A non-empty bucket is publicly readable even with low exposure level
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - storage
        - public-exposure
spec:
    severity: medium
    effect: forbid
    resource: storage::bucket|storage::blob_container
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - cmp_gt(path(resource, "object_count"), 0)
        conditionFormat: cel
    remediation:
        summary: Review if public access is required. Remove public access if not necessary for business operations.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
