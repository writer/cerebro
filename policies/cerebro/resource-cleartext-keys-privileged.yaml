apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: resource-cleartext-keys-privileged
    name: Resource with cleartext cloud keys granting high privileges
    description: A resource contains cleartext cloud credentials that grant high privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - secrets
        - cleartext-keys
        - privileged
spec:
    severity: critical
    effect: forbid
    resource: '*'
    match:
        conditions:
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "cloud_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "grants_high_privilege"), true)))
        conditionFormat: cel
    remediation:
        summary: Remove cleartext keys. Use IAM roles, managed identities, or secret managers. Rotate any potentially exposed credentials.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1078
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Credential Access
          technique: T1552
