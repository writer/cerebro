apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-public-high-priv
    name: Publicly exposed VM with high privileges
    description: A publicly exposed virtual machine has high privileges that could enable lateral movement
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - high-privilege
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - (cmp_eq(path(resource, "service_account.has_high_privilege"), true)) || (cmp_eq(path(resource, "attached_role.has_high_privilege"), true))
        conditionFormat: cel
    remediation:
        summary: Remove public access or reduce privileges. Use bastion hosts for access. Implement proper network segmentation.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Lateral Movement
          technique: T1021
