apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: group-excessive-admin
    name: Group with excessive admin privileges
    description: A group has excessive administrative privileges, affecting all members
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - group
        - admin
        - excessive-privilege
spec:
    severity: high
    effect: forbid
    resource: iam::group
    match:
        conditions:
            - (cmp_gt(path(resource, "admin_role_count"), 3)) || (cmp_eq(path(resource, "has_wildcard_admin"), true))
        conditionFormat: cel
    remediation:
        summary: Reduce group privileges. Create more specific groups with targeted permissions. Implement role-based access control.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
