apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-cleartext-keys-cross-account
    name: VM/serverless with cleartext cloud keys granting permission to access resources in external subscriptions
    description: A compute resource contains cleartext cloud keys that grant access to resources in other cloud accounts or subscriptions
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - secrets
        - cleartext-keys
        - cross-account
spec:
    severity: high
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "cloud_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "cross_account_access"), true)))
        conditionFormat: cel
    remediation:
        summary: Remove cleartext keys. Use cross-account IAM roles with proper trust relationships. Implement proper secrets management.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - LATERAL_MOVEMENT
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.6
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Execution
          technique: T1059
        - tactic: Credential Access
          technique: T1552
        - tactic: Lateral Movement
          technique: T1021
