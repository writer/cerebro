apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: user-data-access-unused-password
    name: User account with data access to sensitive data and an unused password
    description: A user with access to sensitive data has an unused password, suggesting the account may be dormant
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - dormant
        - data-access
        - unused-password
spec:
    severity: high
    effect: forbid
    resource: iam::user
    match:
        conditions:
            - cmp_eq(path(resource, "has_sensitive_data_access"), true)
            - (cmp_eq(path(resource, "password_last_used"), null)) || (cmp_gt(path(resource, "password_last_used_days_ago"), 365))
        conditionFormat: cel
    remediation:
        summary: Review and disable unused accounts with data access. Implement regular access certification.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "7.2"
        - name: CIS Controls v8
          controls:
            - "6"
            - "5"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Credential Access
          technique: T1552
        - tactic: Collection
          technique: T1530
