apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: bucket-cleartext-keys-data
    name: Bucket with cleartext cloud keys granting data access to sensitive data
    description: A bucket contains cleartext cloud keys that grant access to sensitive data
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - storage
        - secrets
        - cleartext-keys
        - data-access
spec:
    severity: critical
    effect: forbid
    resource: storage::bucket|storage::blob_container
    match:
        conditions:
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "cloud_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "grants_sensitive_data_access"), true)))
        conditionFormat: cel
    remediation:
        summary: Remove cleartext keys. Use IAM roles. Rotate any exposed credentials immediately.
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
        - tactic: Collection
          technique: T1530
