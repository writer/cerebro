apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-public-admin
    name: Publicly exposed VM with admin privileges
    description: A publicly exposed virtual machine has administrative privileges, creating a critical attack surface
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - admin
        - public-exposure
        - critical
spec:
    severity: critical
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - (cmp_eq(path(resource, "service_account.has_admin_role"), true)) || (cmp_eq(path(resource, "attached_role.is_admin"), true))
        conditionFormat: cel
    remediation:
        summary: Remove public access or reduce privileges. Use a bastion host for admin access. Implement zero-trust network access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Privilege Escalation
          technique: T1078
