apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-user-data-no-mfa
    name: AWS user account with access to sensitive data and MFA disabled
    description: An AWS user with access to sensitive data does not have MFA enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - aws
        - identity
        - mfa
        - data-access
spec:
    severity: high
    effect: forbid
    resource: aws::iam::user
    match:
        conditions:
            - cmp_eq(path(resource, "has_sensitive_data_access"), true)
            - cmp_eq(path(resource, "mfa_enabled"), false)
        conditionFormat: cel
    remediation:
        summary: Enable MFA immediately for all users with access to sensitive data.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - MISCONFIGURATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "7.2"
        - name: CIS Controls v8
          controls:
            - "6"
            - "5"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Collection
          technique: T1530
