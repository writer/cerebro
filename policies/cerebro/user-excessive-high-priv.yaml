apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: user-excessive-high-priv
    name: User account with excessive high privileges
    description: A user account has excessive high-level privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - user
        - excessive-privilege
spec:
    severity: high
    effect: forbid
    resource: iam::user
    match:
        conditions:
            - cmp_gt(path(resource, "high_privilege_role_count"), 5)
        conditionFormat: cel
    remediation:
        summary: Apply least privilege principle. Remove unnecessary roles. Use just-in-time access for elevated privileges.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
