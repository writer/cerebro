apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: bucket-sensitive-no-lock
    name: Bucket with sensitive data has object lock disabled
    description: A bucket containing sensitive data does not have object lock enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - storage
        - sensitive-data
        - object-lock
spec:
    severity: medium
    effect: forbid
    resource: storage::bucket
    match:
        conditions:
            - cmp_eq(path(resource, "has_sensitive_data"), true)
            - cmp_eq(path(resource, "object_lock_enabled"), false)
        conditionFormat: cel
    remediation:
        summary: Enable S3 Object Lock to prevent deletion or modification of sensitive data.
    riskCategories:
        - UNPROTECTED_DATA
        - MISCONFIGURATION
    frameworks:
        - name: SOC 2
          controls:
            - CC6.7
            - A1.2
        - name: ISO 27001:2022
          controls:
            - A.8.13
            - A.8.24
        - name: NIST 800-53 r5
          controls:
            - SC-28
            - CP-9
        - name: CIS Controls v8
          controls:
            - "3"
    mitreAttack:
        - tactic: Collection
          technique: T1530
