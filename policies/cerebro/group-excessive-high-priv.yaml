apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: group-excessive-high-priv
    name: Group with excessive high privileges
    description: A group has excessive high-level privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - group
        - excessive-privilege
spec:
    severity: high
    effect: forbid
    resource: iam::group
    match:
        conditions:
            - cmp_gt(path(resource, "high_privilege_role_count"), 5)
        conditionFormat: cel
    remediation:
        summary: Review and reduce group privileges. Create more granular groups based on job functions.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
