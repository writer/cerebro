apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: public-resource-keys-data-access
    name: Publicly exposed resource with cleartext cloud keys allowing access to sensitive data
    description: A public resource contains keys that grant access to sensitive data
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - secrets
        - data-access
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: '*'
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "cloud_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "grants_sensitive_data_access"), true)))
        conditionFormat: cel
    remediation:
        summary: Remove public access. Remove cleartext keys. Rotate all potentially exposed credentials.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Credential Access
          technique: T1552
        - tactic: Collection
          technique: T1530
