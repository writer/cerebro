apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: data-resource-org-access
    name: Data resource with sensitive data allows organization-wide access
    description: A resource with sensitive data allows access to the entire organization
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - data
        - org-wide-access
        - sensitive-data
spec:
    severity: high
    effect: forbid
    resource: storage::bucket|database::instance|storage::blob_container
    match:
        conditions:
            - cmp_eq(path(resource, "has_sensitive_data"), true)
            - cmp_eq(path(resource, "iam_policy.allows_org_wide_access"), true)
        conditionFormat: cel
    remediation:
        summary: Remove organization-wide access. Implement granular access controls based on business need.
    riskCategories:
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Collection
          technique: T1530
