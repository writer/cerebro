apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: bedrock-excessive-permissions
    name: Bedrock AI Service Role with Excessive Permissions
    description: An AWS Bedrock service role has excessive permissions beyond model invocation
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - aws
        - bedrock
        - ai
        - excessive-permissions
spec:
    severity: high
    effect: forbid
    resource: aws::iam::role
    match:
        conditions:
            - cmp_eq(path(resource, "used_by_bedrock"), true)
            - (contains_value(path(resource, "policy_document"), "*")) || (cmp_eq(path(resource, "has_admin_actions"), true))
        conditionFormat: cel
    remediation:
        summary: Reduce Bedrock service role to minimum required permissions. Use specific model ARNs in policies.
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
