apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: sa-inactive-assigned
    name: Service account with high privileges is inactive for over 90 days and assigned to a resource
    description: An inactive privileged service account is still assigned to a resource
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - dormant
        - privileged
        - assigned
spec:
    severity: high
    effect: forbid
    resource: iam::service_account
    match:
        conditions:
            - cmp_eq(path(resource, "has_high_privilege"), true)
            - cmp_gt(path(resource, "last_activity_days_ago"), 90)
            - cmp_gt(path(resource, "assigned_resources_count"), 0)
        conditionFormat: cel
    remediation:
        summary: Review and update resource assignments. Remove inactive service accounts or reduce their privileges.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
