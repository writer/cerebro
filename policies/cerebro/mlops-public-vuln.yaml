apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: mlops-public-vuln
    name: Publicly exposed VM/serverless with MLOps with initial access vulnerabilities
    description: A publicly exposed MLOps resource has vulnerabilities that could enable initial access
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - mlops
        - vulnerability
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - cmp_eq(path(resource, "has_mlops_installed"), true)
            - list_value(path(resource, "vulnerabilities")).exists(item, (in_list(path(item, "severity"), ["CRITICAL","HIGH"])) && (cmp_eq(path(item, "initial_access"), true)))
        conditionFormat: cel
    remediation:
        summary: Patch vulnerabilities. Remove public access from MLOps infrastructure.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - VULNERABILITY
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
