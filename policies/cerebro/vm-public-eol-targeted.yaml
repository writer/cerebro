apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-public-eol-targeted
    name: Publicly exposed VM with end-of-life targeted technology
    description: A publicly exposed VM has EOL software that is commonly targeted by attackers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - eol
        - targeted
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "installed_packages")).exists(item, (cmp_eq(path(item, "end_of_life"), true)) && (cmp_eq(path(item, "is_commonly_targeted"), true)))
        conditionFormat: cel
    remediation:
        summary: Update or remove targeted EOL software immediately. This is an actively exploited attack surface.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
