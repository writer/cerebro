apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: serverless-unauth-privileged
    name: Publicly exposed serverless with high privileges can be invoked by unauthenticated users
    description: A privileged serverless function allows unauthenticated invocations
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - serverless
        - authentication
        - privileged
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - cmp_eq(path(resource, "allows_unauthenticated_invocation"), true)
            - cmp_eq(path(resource, "execution_role.has_high_privilege"), true)
        conditionFormat: cel
    remediation:
        summary: Add authentication. Reduce function privileges. Use API Gateway with authorization.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "8.3"
            - "8.4"
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "6"
            - "5"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Execution
          technique: T1059
        - tactic: Privilege Escalation
          technique: T1078
