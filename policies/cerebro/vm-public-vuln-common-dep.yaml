apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-public-vuln-common-dep
    name: Publicly exposed VM/serverless with initial access vulnerabilities affecting a common dependency
    description: A publicly exposed resource has vulnerabilities in a commonly used dependency
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - vulnerability
        - dependency
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "vulnerabilities")).exists(item, (in_list(path(item, "severity"), ["CRITICAL","HIGH"])) && (cmp_eq(path(item, "initial_access"), true)) && (cmp_eq(path(item, "is_common_dependency"), true)))
        conditionFormat: cel
    remediation:
        summary: Patch common dependency vulnerabilities immediately. These are high-value targets for attackers.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - VULNERABILITY
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
