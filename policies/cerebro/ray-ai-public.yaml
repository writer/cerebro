apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: ray-ai-public
    name: Publicly exposed VM vulnerable with Ray AI installed (authentication not supported)
    description: A VM with Ray AI framework is publicly exposed without authentication
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - ray
        - ai
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "installed_packages")).exists(item, cmp_eq(path(item, "name"), "ray"))
        conditionFormat: cel
    remediation:
        summary: Remove public access. Ray does not support authentication by default. Use network-level controls.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - IA-2
            - IA-5
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "8.3"
            - "8.4"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
