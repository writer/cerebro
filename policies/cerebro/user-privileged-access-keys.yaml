apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: user-privileged-access-keys
    name: User account with high privileges has active access keys
    description: A user with high privileges has active access keys, increasing compromise risk
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - access-keys
        - privileged
spec:
    severity: medium
    effect: forbid
    resource: iam::user
    match:
        conditions:
            - cmp_eq(path(resource, "has_high_privilege"), true)
            - list_value(path(resource, "access_keys")).exists(item, cmp_eq(path(item, "status"), "Active"))
        conditionFormat: cel
    remediation:
        summary: Disable access keys for privileged users. Use IAM roles for programmatic access. Implement MFA for console access.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Credential Access
          technique: T1552
