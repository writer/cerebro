apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-user-inactive-admin-no-mfa
    name: Inactive AWS user account with admin privileges and MFA disabled
    description: An inactive AWS user with admin privileges does not have MFA enabled
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - aws
        - identity
        - mfa
        - admin
        - dormant
spec:
    severity: critical
    effect: forbid
    resource: aws::iam::user
    match:
        conditions:
            - cmp_eq(path(resource, "has_admin_role"), true)
            - cmp_eq(path(resource, "mfa_enabled"), false)
            - cmp_gt(path(resource, "last_activity_days_ago"), 90)
        conditionFormat: cel
    remediation:
        summary: Disable or delete inactive admin accounts. If account is needed, enable MFA immediately.
    riskCategories:
        - IDENTITY_RISK
        - MISCONFIGURATION
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "7.2"
        - name: CIS Controls v8
          controls:
            - "6"
            - "5"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
