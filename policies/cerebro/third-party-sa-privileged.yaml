apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: third-party-sa-privileged
    name: Third party service account with high privileges
    description: A service account owned by a third party has high privileges in the environment
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - third-party
        - privileged
spec:
    severity: high
    effect: forbid
    resource: iam::service_account|iam::role
    match:
        conditions:
            - cmp_eq(path(resource, "is_third_party"), true)
            - cmp_eq(path(resource, "has_high_privilege"), true)
        conditionFormat: cel
    remediation:
        summary: Review third-party access requirements. Reduce to minimum necessary privileges. Implement logging and monitoring.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
