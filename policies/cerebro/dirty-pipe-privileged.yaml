apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: dirty-pipe-privileged
    name: VM with high privileges vulnerable to CVE-2022-0847 (Dirty Pipe)
    description: A privileged VM is vulnerable to the Dirty Pipe kernel exploit
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - vulnerability
        - kernel
        - dirty-pipe
spec:
    severity: critical
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - (cmp_eq(path(resource, "service_account.has_high_privilege"), true)) || (cmp_eq(path(resource, "attached_role.has_high_privilege"), true))
            - list_value(path(resource, "vulnerabilities")).exists(item, cmp_eq(path(item, "cve_id"), "CVE-2022-0847"))
        conditionFormat: cel
    remediation:
        summary: Update the Linux kernel to 5.16.11, 5.15.25, or 5.10.102 or later.
    riskCategories:
        - IDENTITY_RISK
        - VULNERABILITY
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
            - "7"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
