apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: user-privileged-unused-password
    name: User account with high privileges and an unused password
    description: A privileged user account has a password that has never been used, suggesting the account may be dormant
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - dormant
        - privileged
        - unused-password
spec:
    severity: high
    effect: forbid
    resource: iam::user
    match:
        conditions:
            - cmp_eq(path(resource, "has_high_privilege"), true)
            - (cmp_eq(path(resource, "password_last_used"), null)) || (cmp_gt(path(resource, "password_last_used_days_ago"), 365))
        conditionFormat: cel
    remediation:
        summary: Review and disable unused privileged accounts. Implement regular access certification.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-2
            - IA-5
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "8.3"
            - "8.4"
            - "7.2"
        - name: CIS Controls v8
          controls:
            - "6"
            - "5"
        - name: SOC 2
          controls:
            - CC6
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Credential Access
          technique: T1552
