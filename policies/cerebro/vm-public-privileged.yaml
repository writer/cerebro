apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-public-high-privileges
    name: Internet-facing VM with high privileges
    description: Compute instance is exposed to the public internet via external IP and has high privileges through its service account, creating an attractive target for attackers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - compute
        - public-ip
        - privileged
        - toxic-combination
        - security
spec:
    severity: critical
    effect: forbid
    resource: gcp::compute::instance
    match:
        conditions:
            - contains_value(path(resource, "network_interfaces"), "accessConfigs")
            - contains_value(path(resource, "service_accounts"), "compute@developer.gserviceaccount.com")
        conditionFormat: cel
    remediation:
        summary: 1. Remove external IP if not required (use Cloud NAT for egress). 2. Create dedicated service account with minimal permissions. 3. Apply OS-level hardening. 4. Enable Shielded VM features. 5. Use VPC Service Controls.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_PRINCIPAL
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-6
            - SC-7
            - SI-2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
            - "7"
            - "12"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Privilege Escalation
          technique: T1078
