apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gke-cluster-admin
    name: GKE cluster-admin role is used by an account
    description: An account is using the cluster-admin role in GKE, granting full cluster control
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gke
        - kubernetes
        - rbac
        - admin
spec:
    severity: high
    effect: forbid
    resource: gcp::gke::cluster_role_binding|k8s::rbac::risky_binding
    match:
        conditions:
            - (cmp_eq(path(resource, "role_ref_name"), "cluster-admin")) || (cmp_eq(path(resource, "role_ref.name"), "cluster-admin"))
            - (in_list(path(resource, "subject_kind"), ["User","ServiceAccount","Group"])) || (list_value(path(resource, "subjects")).exists(item, in_list(path(item, "kind"), ["User","ServiceAccount","Group"])))
        conditionFormat: cel
    remediation:
        summary: Replace cluster-admin with more restrictive custom roles. Use namespaced roles when possible.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: CIS Kubernetes Benchmark
          controls:
            - 5.1.1
            - 5.1.3
            - 5.1.4
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
