apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: public-resource-cleartext-admin-keys
    name: Publicly exposed resource with cleartext cloud keys granting admin privileges
    description: A publicly exposed resource contains cleartext cloud credentials with administrative privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - secrets
        - cleartext-keys
        - public-exposure
        - admin
spec:
    severity: critical
    effect: forbid
    resource: '*'
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "cloud_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "grants_admin"), true)))
        conditionFormat: cel
    remediation:
        summary: Assume compromise. Remove public access, rotate all admin credentials, and audit for unauthorized access. Use IAM roles instead of keys.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.6
            - C1.1
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Initial Access
          technique: T1078
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Credential Access
          technique: T1552
