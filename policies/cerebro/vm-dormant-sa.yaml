apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-dormant-sa
    name: VM using a service account with high privileges that is inactive for over 90 days
    description: A VM is using a highly privileged service account that has been inactive for over 90 days
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - identity
        - dormant
        - privileged
spec:
    severity: high
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "service_account.has_high_privilege"), true)
            - cmp_gt(path(resource, "service_account.last_activity_days_ago"), 90)
        conditionFormat: cel
    remediation:
        summary: Review and disable unused service accounts. Reduce privileges if the account is still needed. Implement regular access reviews.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
