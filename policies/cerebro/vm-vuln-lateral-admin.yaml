apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-vuln-lateral-admin
    name: Internet-facing VM/serverless with initial access vulnerabilities and a lateral movement finding to admin privileges
    description: An internet-facing resource has vulnerabilities that could enable initial access and an attack path to admin privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - vulnerability
        - lateral-movement
        - admin
spec:
    severity: critical
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_internet_facing"), true)
            - list_value(path(resource, "vulnerabilities")).exists(item, (in_list(path(item, "severity"), ["CRITICAL","HIGH"])) && (cmp_eq(path(item, "initial_access"), true)))
            - list_value(path(resource, "attack_paths")).exists(item, cmp_eq(path(item, "target.is_admin"), true))
        conditionFormat: cel
    remediation:
        summary: Patch vulnerabilities immediately. Break the attack path by removing excessive permissions or trust relationships. Consider isolating the resource.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - VULNERABILITY
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Lateral Movement
          technique: T1021
