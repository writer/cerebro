apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: exposed-saas-api-token
    name: Validated exposure of SaaS API token
    description: A SaaS API token has been found exposed in a resource configuration, environment variable, or code, potentially allowing unauthorized access to external services
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - gcp
        - secrets
        - api-token
        - exposure
        - security
spec:
    severity: high
    effect: forbid
    resource: gcp::cloudrun::revision
    match:
        conditions:
            - (contains_value(path(resource, "containers"), "API_KEY")) || (contains_value(path(resource, "containers"), "api_key")) || (contains_value(path(resource, "containers"), "SECRET")) || (contains_value(path(resource, "containers"), "TOKEN"))
        conditionFormat: cel
    remediation:
        summary: 1. Immediately rotate the exposed API token. 2. Move secrets to Secret Manager. 3. Use workload identity for authentication where possible. 4. Audit access logs for unauthorized use.
    riskCategories:
        - INSECURE_USE_OF_SECRETS
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
            - SC-28
        - name: CIS Controls v8
          controls:
            - "3"
            - "16"
        - name: SOC 2
          controls:
            - CC6.1
            - C1.1
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
