apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: efs-public-subnet
    name: AWS EFS mount target associated with a public subnet
    description: An EFS mount target is in a public subnet, potentially exposing file data
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - aws
        - storage
        - efs
        - public-subnet
spec:
    severity: high
    effect: forbid
    resource: aws::efs::mount_target
    match:
        conditions:
            - cmp_eq(path(resource, "subnet.is_public"), true)
        conditionFormat: cel
    remediation:
        summary: Move EFS mount targets to private subnets. Use VPC endpoints for access.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
