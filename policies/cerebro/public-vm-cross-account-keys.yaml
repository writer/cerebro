apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: public-vm-cross-account-keys
    name: Publicly exposed VM with cleartext cloud keys granting permission to access resources in other subscriptions with high privileges
    description: A publicly exposed VM contains highly privileged cross-account access keys
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - secrets
        - cross-account
        - privileged
        - public-exposure
spec:
    severity: critical
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "cloud_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "cross_account_access"), true)) && (cmp_eq(path(item, "grants_high_privilege"), true)))
        conditionFormat: cel
    remediation:
        summary: Assume keys are compromised. Rotate all keys. Remove public access. Use IAM roles.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Credential Access
          technique: T1552
        - tactic: Lateral Movement
          technique: T1021
