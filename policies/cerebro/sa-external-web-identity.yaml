apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: sa-external-web-identity
    name: Service account with high privileges can be assumed by an external web identity
    description: A highly privileged service account can be assumed by an external web identity provider
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - web-identity
        - federation
        - privileged
spec:
    severity: high
    effect: forbid
    resource: iam::service_account|iam::role
    match:
        conditions:
            - cmp_eq(path(resource, "has_high_privilege"), true)
            - cmp_eq(path(resource, "trust_policy.allows_external_web_identity"), true)
        conditionFormat: cel
    remediation:
        summary: Restrict web identity federation to specific issuers and subjects. Reduce privileges or add conditions to the trust policy.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Lateral Movement
          technique: T1021
