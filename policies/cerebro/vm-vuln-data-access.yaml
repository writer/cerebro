apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-vuln-data-access
    name: Internet-facing VM/serverless with initial access vulnerabilities and data access to sensitive data
    description: An internet-facing resource has vulnerabilities and access to sensitive data
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - vulnerability
        - data-access
spec:
    severity: critical
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_internet_facing"), true)
            - list_value(path(resource, "vulnerabilities")).exists(item, (in_list(path(item, "severity"), ["CRITICAL","HIGH"])) && (cmp_eq(path(item, "initial_access"), true)))
            - (cmp_eq(path(resource, "service_account.has_sensitive_data_access"), true)) || (cmp_eq(path(resource, "attached_role.has_sensitive_data_access"), true))
        conditionFormat: cel
    remediation:
        summary: Patch vulnerabilities immediately. Remove data access until vulnerabilities are resolved.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
        - VULNERABILITY
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Collection
          technique: T1530
