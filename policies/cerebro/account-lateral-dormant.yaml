apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: account-lateral-dormant
    name: Account with a lateral movement finding to admin is inactive for over 90 days
    description: A dormant account has an attack path to admin privileges, posing a risk if the account is compromised
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - dormant
        - lateral-movement
        - admin
spec:
    severity: high
    effect: forbid
    resource: iam::user|iam::service_account
    match:
        conditions:
            - cmp_gt(path(resource, "last_activity_days_ago"), 90)
            - list_value(path(resource, "attack_paths")).exists(item, cmp_eq(path(item, "target.is_admin"), true))
        conditionFormat: cel
    remediation:
        summary: Disable or delete dormant accounts. Break the attack path to admin if the account must be retained.
    riskCategories:
        - IDENTITY_RISK
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Lateral Movement
          technique: T1021
