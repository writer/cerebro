apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: ai-model-excessive-agency
    name: AI Model with excessive agency
    description: An AI model has excessive permissions or agency that could lead to unintended actions
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - ai
        - agency
        - permissions
spec:
    severity: high
    effect: forbid
    resource: ai::model|ai::endpoint
    match:
        conditions:
            - (cmp_eq(path(resource, "execution_role.has_admin_role"), true)) || (cmp_eq(path(resource, "can_modify_resources"), true)) || (cmp_eq(path(resource, "can_invoke_other_models"), true))
        conditionFormat: cel
    remediation:
        summary: Reduce model permissions to minimum required. Implement guardrails and output filtering.
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
