apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: gcp-sa-impersonation
    name: GCP user account assigned with the 'Service Account User' or 'Service Account Token Creator' roles
    description: A GCP user can impersonate service accounts, potentially escalating privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - gcp
        - identity
        - impersonation
spec:
    severity: medium
    effect: forbid
    resource: gcp::iam::member
    match:
        conditions:
            - list_value(path(resource, "roles")).exists(item, in_list(path(item, "name"), ["roles/iam.serviceAccountUser","roles/iam.serviceAccountTokenCreator"]))
        conditionFormat: cel
    remediation:
        summary: Review service account impersonation permissions. Remove if not required. Implement proper IAM conditions.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
