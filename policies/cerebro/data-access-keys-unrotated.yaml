apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: data-access-keys-unrotated
    name: User/service account with access to sensitive data and active access keys unrotated in the past year
    description: An account with access to sensitive data has access keys that have not been rotated in over a year
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - access-keys
        - data-access
        - rotation
spec:
    severity: high
    effect: forbid
    resource: iam::user|iam::service_account
    match:
        conditions:
            - cmp_eq(path(resource, "has_sensitive_data_access"), true)
            - list_value(path(resource, "access_keys")).exists(item, (cmp_eq(path(item, "status"), "Active")) && (cmp_gt(path(item, "created_days_ago"), 365)))
        conditionFormat: cel
    remediation:
        summary: Rotate access keys. Implement key rotation policy for accounts with data access.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Credential Access
          technique: T1552
        - tactic: Collection
          technique: T1530
