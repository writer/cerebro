apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-public-eol
    name: Publicly exposed VM with end-of-life software
    description: A publicly exposed VM is running end-of-life software that no longer receives security updates
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - eol
        - public-exposure
spec:
    severity: high
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "installed_packages")).exists(item, cmp_eq(path(item, "end_of_life"), true))
        conditionFormat: cel
    remediation:
        summary: Update to supported software versions. If not possible, remove public access and implement compensating controls.
    riskCategories:
        - EXTERNAL_EXPOSURE
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
