apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: iam-inactive-privileged-account
    name: Service account with high privileges is inactive for over 90 days
    description: An IAM role or service account with high privileges has not been used in over 90 days, indicating potential over-provisioning and creating unnecessary attack surface
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - iam
        - inactive
        - privileged
        - hygiene
        - security
spec:
    severity: medium
    effect: forbid
    resource: aws::iam::role
    match:
        conditions:
            - (cmp_lt(path(resource, "role_last_used.last_used_date"), "NOW() - 90 days")) || (!exists_path(resource, "role_last_used"))
        conditionFormat: cel
    remediation:
        summary: 1. Review if the role is still needed. 2. If unused, delete or disable the role. 3. If needed, apply least privilege principles. 4. Enable CloudTrail logging to monitor future usage.
    riskCategories:
        - UNPROTECTED_PRINCIPAL
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
        - name: SOC 2
          controls:
            - CC6
    mitreAttack:
        - tactic: Persistence
          technique: T1078
