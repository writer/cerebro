apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: k8s-secrets-access
    name: User/service account with get/list/watch permissions on secrets in a Kubernetes cluster
    description: An identity can read secrets across the Kubernetes cluster
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - kubernetes
        - secrets
        - rbac
spec:
    severity: medium
    effect: forbid
    resource: k8s::cluster_role|k8s::role|k8s::rbac::risky_binding
    match:
        conditions:
            - (contains_value(path(resource, "risk_reasons"), "secret_access")) || (list_value(path(resource, "rules")).exists(item, (contains_value(path(item, "resources"), "secrets")) && (list_value(path(item, "verbs")).exists(item, in_list(path(item, "verb"), ["get","list","watch"])))))
        conditionFormat: cel
    remediation:
        summary: Restrict secrets access to specific namespaces. Use external secret managers when possible.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "8.6"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
