apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: public-saas-keys
    name: Publicly exposed resource with cleartext SaaS API keys
    description: A public resource contains cleartext SaaS API keys
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - secrets
        - saas
        - public-exposure
spec:
    severity: high
    effect: forbid
    resource: '*'
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "saas_api_key")) && (cmp_eq(path(item, "cleartext"), true)))
        conditionFormat: cel
    remediation:
        summary: Remove cleartext SaaS keys. Rotate exposed keys. Use secret managers.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - UNPROTECTED_DATA
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.6
            - C1.1
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Credential Access
          technique: T1552
