apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: unknown-account-trusted
    name: Unknown AWS account with trusted access to non-admin IAM role
    description: An unknown AWS account has trust relationship to assume a role
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - aws
        - identity
        - trust
        - cross-account
spec:
    severity: medium
    effect: forbid
    resource: aws::iam::role
    match:
        conditions:
            - list_value(path(resource, "trust_policy.principals")).exists(item, (cmp_eq(path(item, "type"), "AWS")) && (!(in_list(path(item, "account_id"), ["known_accounts"]))))
        conditionFormat: cel
    remediation:
        summary: Review and validate all cross-account trust relationships. Remove unknown accounts.
    riskCategories:
        - IDENTITY_RISK
        - LATERAL_MOVEMENT
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Lateral Movement
          technique: T1021
