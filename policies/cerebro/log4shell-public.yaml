apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: log4shell-public
    name: Publicly exposed unprivileged VM/serverless vulnerable to CVE-2021-44228 (Log4Shell)
    description: A publicly exposed resource is vulnerable to Log4Shell
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - vulnerability
        - log4shell
        - cve-2021-44228
spec:
    severity: critical
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - cmp_eq(path(resource, "is_public"), true)
            - list_value(path(resource, "vulnerabilities")).exists(item, cmp_eq(path(item, "cve_id"), "CVE-2021-44228"))
        conditionFormat: cel
    remediation:
        summary: Patch Log4j immediately. If patching is not possible, remove public access and apply WAF rules.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - VULNERABILITY
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
