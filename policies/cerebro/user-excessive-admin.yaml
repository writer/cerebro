apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: user-excessive-admin
    name: User account with excessive admin privileges
    description: A user account has more admin privileges than necessary for their role
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - admin
        - excessive-privilege
spec:
    severity: high
    effect: forbid
    resource: iam::user
    match:
        conditions:
            - (cmp_gt(path(resource, "admin_role_count"), 3)) || (cmp_eq(path(resource, "has_wildcard_admin"), true))
        conditionFormat: cel
    remediation:
        summary: Apply least privilege principle. Remove unnecessary admin roles. Implement break-glass procedures for emergency access.
    riskCategories:
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
