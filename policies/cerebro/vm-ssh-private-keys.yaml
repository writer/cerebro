apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-ssh-private-keys
    name: VM/serverless with cleartext SSH private keys that can be used to access other resources
    description: A compute resource contains SSH private keys that can be used to access other resources
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - secrets
        - ssh-keys
        - lateral-movement
spec:
    severity: high
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "ssh_private_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "can_access_other_resources"), true)))
        conditionFormat: cel
    remediation:
        summary: Remove SSH private keys from the resource. Use SSH certificate-based authentication or IAM-based access. Rotate compromised keys.
    riskCategories:
        - UNPROTECTED_DATA
        - LATERAL_MOVEMENT
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6.1
            - CC6.2
            - CC6.6
            - C1.1
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Credential Access
          technique: T1552
        - tactic: Lateral Movement
          technique: T1021
