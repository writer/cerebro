apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: user-excessive-data-priv
    name: User account with excessive data privileges
    description: A user account has excessive data access privileges
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - identity
        - user
        - data-access
        - excessive-privilege
spec:
    severity: high
    effect: forbid
    resource: iam::user
    match:
        conditions:
            - (cmp_eq(path(resource, "data_access_scope"), "all")) || (cmp_gt(path(resource, "data_access_resource_count"), 100))
        conditionFormat: cel
    remediation:
        summary: Reduce data access to minimum required. Implement data classification and least privilege access.
    riskCategories:
        - UNPROTECTED_DATA
        - IDENTITY_RISK
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Privilege Escalation
          technique: T1078
        - tactic: Collection
          technique: T1530
