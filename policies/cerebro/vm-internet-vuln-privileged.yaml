apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: vm-internet-vuln-privileged
    name: Internet-facing VM with high privileges and initial access vulnerabilities
    description: An internet-facing VM has both high privileges and vulnerabilities that could enable initial access, creating a critical combined risk
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - vulnerability
        - privileged
        - internet-facing
spec:
    severity: critical
    effect: forbid
    resource: compute::instance
    match:
        conditions:
            - cmp_eq(path(resource, "is_internet_facing"), true)
            - (cmp_eq(path(resource, "service_account.has_high_privilege"), true)) || (cmp_eq(path(resource, "attached_role.has_high_privilege"), true))
            - list_value(path(resource, "vulnerabilities")).exists(item, (in_list(path(item, "severity"), ["CRITICAL","HIGH"])) && (cmp_eq(path(item, "initial_access"), true)))
        conditionFormat: cel
    remediation:
        summary: Immediately patch vulnerabilities and reduce privileges. Consider isolating the VM until both issues are resolved.
    riskCategories:
        - EXTERNAL_EXPOSURE
        - IDENTITY_RISK
        - VULNERABILITY
        - PRIVILEGE_ESCALATION
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-3
            - SC-7
            - AC-2
            - AC-6
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "1.3"
            - "1.4"
            - "7.2"
            - "6.3"
            - "11.3"
        - name: SOC 2
          controls:
            - CC6.2
            - CC6.6
        - name: CIS Controls v8
          controls:
            - "12"
            - "13"
            - "5"
            - "6"
            - "7"
    mitreAttack:
        - tactic: Initial Access
          technique: T1190
        - tactic: Privilege Escalation
          technique: T1078
