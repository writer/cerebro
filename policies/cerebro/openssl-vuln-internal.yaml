apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: openssl-vuln-internal
    name: Internal VM/serverless vulnerable to CVE-2022-3602 or CVE-2022-3786 (OpenSSL vulnerability)
    description: An internal resource is vulnerable to OpenSSL buffer overflow vulnerabilities
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - compute
        - vulnerability
        - openssl
spec:
    severity: high
    effect: forbid
    resource: compute::instance|serverless::function
    match:
        conditions:
            - list_value(path(resource, "vulnerabilities")).exists(item, in_list(path(item, "cve_id"), ["CVE-2022-3602","CVE-2022-3786"]))
        conditionFormat: cel
    remediation:
        summary: Update OpenSSL to version 3.0.7 or later.
    riskCategories:
        - VULNERABILITY
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - SC-12
            - SC-13
            - SC-28
            - RA-5
            - SI-2
        - name: PCI DSS v4.0.1
          controls:
            - "3.5"
            - "4.2"
            - "6.3"
            - "11.3"
        - name: CIS Controls v8
          controls:
            - "3"
            - "7"
