apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: notebook-excessive-agency
    name: Notebook with excessive agency
    description: A notebook has excessive permissions that could lead to unintended resource access
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - ai
        - notebook
        - agency
        - permissions
spec:
    severity: high
    effect: forbid
    resource: ai::notebook
    match:
        conditions:
            - (cmp_eq(path(resource, "execution_role.has_admin_role"), true)) || (cmp_eq(path(resource, "can_access_production_data"), true))
        conditionFormat: cel
    remediation:
        summary: Reduce notebook execution role permissions. Separate development and production access.
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
        - name: SOC 2
          controls:
            - CC6.2
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
