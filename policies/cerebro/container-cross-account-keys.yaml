apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: container-cross-account-keys
    name: Internal container using a container image with cleartext cloud keys granting permission to access resources in other subscriptions
    description: A container uses an image with cleartext cross-account access keys
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - wiz
        - container
        - secrets
        - cross-account
spec:
    severity: high
    effect: forbid
    resource: container::image
    match:
        conditions:
            - (cmp_eq(path(resource, "has_cross_account_cloud_keys"), true)) || (list_value(path(resource, "secrets")).exists(item, (cmp_eq(path(item, "type"), "cloud_key")) && (cmp_eq(path(item, "cleartext"), true)) && (cmp_eq(path(item, "cross_account_access"), true))))
        conditionFormat: cel
    remediation:
        summary: Rebuild image without embedded keys. Use IAM roles for cross-account access.
    riskCategories:
        - UNPROTECTED_DATA
        - LATERAL_MOVEMENT
    frameworks:
        - name: NIST 800-53 r5
          controls:
            - AC-2
            - AC-6
            - IA-5
            - SC-12
        - name: PCI DSS v4.0.1
          controls:
            - "7.2"
            - "3.5"
            - "8.6"
        - name: SOC 2
          controls:
            - CC6
        - name: CIS Controls v8
          controls:
            - "5"
            - "6"
    mitreAttack:
        - tactic: Persistence
          technique: T1098
        - tactic: Credential Access
          technique: T1552
        - tactic: Lateral Movement
          technique: T1021
