apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: aws-guardduty-c2-traffic
    name: AWS GuardDuty Command and Control Traffic
    description: GuardDuty detected communication with known C&C servers
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - runtime
        - c2
        - botnet
        - guardduty
        - incident-response
spec:
    severity: critical
    effect: forbid
    resource: aws::guardduty::finding
    match:
        conditions:
            - (contains_value(path(resource, "type"), "Trojan")) || (contains_value(path(resource, "type"), "Backdoor")) || (contains_value(path(resource, "type"), "C\u0026CActivity"))
        conditionFormat: cel
    remediation:
        summary: Immediately isolate the instance, block C2 IP at the firewall, and initiate incident response.
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
            - CC7.2
            - CC7.3
        - name: ISO 27001:2022
          controls:
            - A.5.24
            - A.5.25
            - A.8.16
        - name: NIST 800-53 r5
          controls:
            - IR-4
            - SI-4
        - name: CIS Controls v8
          controls:
            - "8"
        - name: SOC 2
          controls:
            - CC7.3
            - CC7.4
            - CC7.5
        - name: ISO 27001:2022
          controls:
            - A.5.24
            - A.5.25
            - A.5.26
        - name: NIST 800-53 r5
          controls:
            - IR-4
            - IR-5
            - IR-8
