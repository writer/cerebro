apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: runtime-identity-provider-risky-session
    name: Runtime Identity Provider Risky Session
    description: "Runtime Identity Provider Risky Session policy evidence is missing, disabled, or outside the expected secure state."
    lastModified: "0001-01-01T00:00:00Z"
    tags:
        - runtime
        - identity
        - session
        - generated
spec:
    severity: medium
    effect: forbid
    resource: "identity::session"
    match:
        conditions:
            - "cmp_ne(path(resource, \"identity_provider_risky_session_compliant\"), true)"
        conditionFormat: cel
    remediation:
        summary: "Restore identity provider risky session controls to the approved state, capture owner approval, and retain evidence from the authoritative system."
        steps:
            - Review the affected resource or subject and confirm the policy evidence is in scope.
            - Update the authoritative system configuration or documented control evidence.
            - Rerun evidence collection and attach the passing result or approved exception.
    riskCategories:
        - ACTIVE_THREAT
        - INCIDENT_RESPONSE
    frameworks:
        - name: SOC 2
          controls:
            - CC7.1
            - CC7.2
            - CC7.3
        - name: "ISO 27001:2022"
          controls:
            - A.5.24
            - A.5.25
            - A.8.16
        - name: NIST 800-53 r5
          controls:
            - IR-4
            - SI-4
            - AU-6
