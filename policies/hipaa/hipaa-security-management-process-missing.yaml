apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: hipaa-security-management-process-missing
    name: HIPAA Security Management Process Missing
    description: Flags HIPAA risk records for ePHI scope that do not show a security management process.
    tags:
        - hipaa
        - administrative-safeguards
        - security-management
        - risk-assessment
        - ephi
    references:
        - https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C/section-164.308
spec:
    severity: high
    effect: forbid
    resource: hipaa_risk_assessment::safeguard_risk_record
    match:
        conditions:
            - cmp_eq(path(resource, "ephi_scope"), true)
            - cmp_ne(path(resource, "security_management_process_implemented"), true)
        conditionFormat: cel
    remediation:
        summary: Record the security management process for the ePHI risk scope.
        steps:
            - Confirm the ePHI systems, risks, and safeguard owner.
            - Document the process used to prevent, detect, contain, and correct security violations.
            - Link the process evidence to the HIPAA risk record.
    riskCategories:
        - GOVERNANCE
        - DATA_EXPOSURE
    frameworks:
        - name: HIPAA
          controls:
            - 164.308(a)(1)(i)
    input:
        sourceKinds:
            - hipaa_risk_assessment.safeguard_risk_record
        requiredFields:
            - risk_record_id
            - ephi_scope
            - security_management_process_implemented
            - owner_id
            - reviewed_at
        freshnessSLA: 90d
    evidence:
        type: governance_review
        assessmentMethods:
            - examine
            - interview
        requiredForAudit: true
        acceptableSources:
            - hipaa_risk_assessment
        requiredFields:
            - risk_record_id
            - ephi_scope
            - security_management_process_implemented
            - owner_id
            - reviewed_at
        fingerprintFields:
            - tenant_id
            - policy_id
            - risk_record_id
    audit:
        evidenceType: governance_review
        assessmentMethods:
            - examine
            - interview
        freshnessSLA: 90d
        auditorStatement: ePHI risk records identify the security management process used for HIPAA administrative safeguards.
        auditorGuidance: Review the risk record, ePHI scope, process evidence, owner, review date, and linked safeguard decisions.
        riskStatement: Missing security management process evidence weakens the record for how ePHI security violations are prevented, detected, contained, and corrected.
        remediationIntent: Add source-backed process evidence and link it to the in-scope HIPAA risk record.
        acceptableEvidence:
            - source: hipaa_risk_assessment
              fields:
                - risk_record_id
                - ephi_scope
                - security_management_process_implemented
                - owner_id
                - reviewed_at
        exceptionPolicy:
            maxAge: 90d
            requiresApproval: true
        falsePositives:
            - The record is outside ePHI scope or the process evidence is stored in a linked risk assessment artifact.
    actions:
        owner:
            from: resource.owner_id
            fallback: compliance.owner
        remediation:
            type: hipaa_safeguard_review
            steps:
                - Add security management process evidence to the risk record.
                - Link the evidence to the ePHI systems in scope.
                - Rerun HIPAA risk assessment evidence collection.
        effort: medium
        verification:
            rerunPolicy: true
    enabled: true
