apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: ephi system without access controls fails
      resource:
          system_id: ps-100
          contains_ephi: true
          access_control_policy_enabled: false
          owner_id: security-owner
          observed_at: "2026-07-01T00:00:00Z"
      wantFinding: true
    - name: ephi system with access controls passes
      resource:
          system_id: ps-101
          contains_ephi: true
          access_control_policy_enabled: true
          owner_id: security-owner
          observed_at: "2026-07-01T00:00:00Z"
      wantFinding: false
