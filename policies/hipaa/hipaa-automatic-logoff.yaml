apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: hipaa-automatic-logoff
    name: HIPAA Automatic Logoff
    description: Ensures automatic logoff is enabled for PHI systems after inactivity (HIPAA 164.312(a)(2)(iii))
    tags:
        - hipaa
        - session
        - timeout
        - logoff
        - healthcare
spec:
    severity: MEDIUM
    category: hipaa
    resourceType: system
    match:
        query: SELECT id, name, contains_phi, session_timeout_minutes FROM systems WHERE contains_phi = true AND (session_timeout_minutes IS NULL OR session_timeout_minutes > 15)
    remediation:
        summary: Configure automatic session timeout of 15 minutes or less for PHI systems.
    frameworks:
        - name: HIPAA
          controls:
            - "164.312"
    enabled: true
