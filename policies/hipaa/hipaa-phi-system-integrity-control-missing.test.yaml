apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRuleTest
cases:
    - name: ephi system without integrity controls fails
      resource:
          system_id: ps-400
          contains_ephi: true
          integrity_controls_enabled: false
          owner_id: security-owner
          observed_at: "2026-07-01T00:00:00Z"
      wantFinding: true
    - name: ephi system with integrity controls passes
      resource:
          system_id: ps-401
          contains_ephi: true
          integrity_controls_enabled: true
          owner_id: security-owner
          observed_at: "2026-07-01T00:00:00Z"
      wantFinding: false
