apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: hipaa-phi-system-automatic-logoff-missing
    name: HIPAA PHI System Automatic Logoff Missing
    description: Flags ePHI systems without automatic logoff evidence.
    tags:
        - hipaa
        - technical-safeguards
        - automatic-logoff
        - session-control
        - ephi
    references:
        - https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C/section-164.312
spec:
    severity: high
    effect: forbid
    resource: phi_system_inventory::phi_system
    match:
        conditions:
            - cmp_eq(path(resource, "contains_ephi"), true)
            - cmp_ne(path(resource, "automatic_logoff_enabled"), true)
        conditionFormat: cel
    remediation:
        summary: Enable automatic logoff or attach the approved session-control exception.
        steps:
            - Confirm the ePHI system and session timeout requirement.
            - Enable automatic logoff after the approved inactivity period.
            - Retain session-control and exception evidence in the PHI system inventory.
    riskCategories:
        - IDENTITY_RISK
        - DATA_EXPOSURE
    frameworks:
        - name: HIPAA
          controls:
            - 164.312(a)(2)(iii)
    input:
        sourceKinds:
            - phi_system_inventory.phi_system
        requiredFields:
            - system_id
            - contains_ephi
            - automatic_logoff_enabled
            - session_timeout_minutes
            - owner_id
            - observed_at
        freshnessSLA: 30d
    evidence:
        type: control_review
        assessmentMethods:
            - examine
            - test
        requiredForAudit: true
        acceptableSources:
            - phi_system_inventory
        requiredFields:
            - system_id
            - contains_ephi
            - automatic_logoff_enabled
            - session_timeout_minutes
            - owner_id
            - observed_at
        fingerprintFields:
            - tenant_id
            - policy_id
            - system_id
    audit:
        evidenceType: control_review
        assessmentMethods:
            - examine
            - test
        freshnessSLA: 30d
        auditorStatement: ePHI systems terminate inactive sessions through automatic logoff or approved equivalent controls.
        auditorGuidance: Review the PHI system record, logoff state, timeout value, exception evidence, owner, and last observed timestamp.
        riskStatement: Missing automatic logoff can leave ePHI sessions active after user inactivity.
        remediationIntent: Enable automatic logoff and retain session-control evidence for the ePHI system.
        acceptableEvidence:
            - source: phi_system_inventory
              fields:
                - system_id
                - contains_ephi
                - automatic_logoff_enabled
                - session_timeout_minutes
                - owner_id
                - observed_at
        exceptionPolicy:
            maxAge: 30d
            requiresApproval: true
        falsePositives:
            - The system does not maintain ePHI or an approved compensating session-control mechanism is linked to the record.
    actions:
        owner:
            from: resource.owner_id
            fallback: security.owner
        remediation:
            type: phi_system_session_control_update
            steps:
                - Enable automatic logoff.
                - Confirm the timeout value and exception state.
                - Rerun PHI system inventory collection.
        effort: medium
        verification:
            rerunPolicy: true
    enabled: true
