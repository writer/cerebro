apiVersion: cerebro.writer.com/v1alpha1
kind: PolicyFindingRule
metadata:
    id: hipaa-breach-secretary-notice-overdue
    name: HIPAA Secretary Breach Notice Overdue
    description: Flags confirmed unsecured PHI breaches whose required HHS Secretary notice is past the source-calculated notification deadline.
    tags:
        - hipaa
        - breach-notification
        - secretary-notice
        - hhs-notice
        - privacy-breach
        - phi
    references:
        - https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-D/section-164.408
spec:
    severity: high
    effect: forbid
    resource: breach_response_system::privacy_incident_record
    match:
        conditions:
            - cmp_eq(path(resource, "breach_confirmed"), true)
            - cmp_eq(path(resource, "unsecured_phi"), true)
            - cmp_eq(path(resource, "secretary_notice_required"), true)
            - cmp_ne(path(resource, "regulator_notice_state"), "submitted")
            - cmp_eq(path(resource, "regulator_notice_overdue"), true)
        conditionFormat: cel
    remediation:
        summary: Submit the required HHS Secretary notice or attach approved delay evidence.
        steps:
            - Confirm the discovery date, affected subject count, notification track, and source-calculated notice deadline.
            - Submit the HHS Secretary notice through the approved channel.
            - Retain submission receipt, notice content, send date, and exception evidence.
    riskCategories:
        - GOVERNANCE
        - DATA_EXPOSURE
    frameworks:
        - name: HIPAA
          controls:
            - 164.408(a)
    input:
        sourceKinds:
            - breach_response_system.privacy_incident_record
        requiredFields:
            - incident_id
            - breach_confirmed
            - unsecured_phi
            - affected_subject_count
            - discovered_at
            - notification_deadline
            - secretary_notice_required
            - regulator_notice_state
            - regulator_notice_overdue
        freshnessSLA: 24h
    evidence:
        type: privacy_breach
        assessmentMethods:
            - examine
            - interview
            - test
        requiredForAudit: true
        acceptableSources:
            - breach_response_system
        requiredFields:
            - incident_id
            - breach_confirmed
            - unsecured_phi
            - affected_subject_count
            - discovered_at
            - notification_deadline
            - secretary_notice_required
            - regulator_notice_state
            - regulator_notice_overdue
        fingerprintFields:
            - tenant_id
            - policy_id
            - incident_id
    audit:
        evidenceType: privacy_breach
        assessmentMethods:
            - examine
            - interview
            - test
        freshnessSLA: 24h
        auditorStatement: Confirmed unsecured PHI breaches have required HHS Secretary notice submitted by the source-calculated deadline or carry approved delay evidence.
        auditorGuidance: Review the incident record, discovery date, affected subject count, Secretary notice requirement, notice deadline, submission receipt, and delay state.
        riskStatement: Overdue Secretary notice can leave required regulator reporting incomplete for a HIPAA breach.
        remediationIntent: Submit the HHS Secretary notice or attach approved delay evidence, then retain submission and closure evidence.
        acceptableEvidence:
            - source: breach_response_system
              fields:
                - incident_id
                - breach_confirmed
                - unsecured_phi
                - affected_subject_count
                - discovered_at
                - notification_deadline
                - secretary_notice_required
                - regulator_notice_state
                - regulator_notice_overdue
        exceptionPolicy:
            maxAge: 30d
            requiresApproval: true
        exceptionGuidance:
            - Delay evidence must include the legal basis, approver, start date, and expected notice date.
        falsePositives:
            - Secretary notice was not required yet for the breach track or the notice was delayed under an approved law-enforcement request.
    actions:
        owner:
            from: resource.owner_id
            fallback: privacy.owner
        remediation:
            type: breach_notice_response
            steps:
                - Submit or document the required HHS Secretary notice.
                - Attach submission receipt and approved delay evidence.
                - Rerun breach response evidence collection.
        effort: medium
        verification:
            rerunPolicy: true
    enabled: true
